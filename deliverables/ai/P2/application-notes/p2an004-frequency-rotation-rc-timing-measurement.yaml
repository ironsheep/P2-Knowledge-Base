# P2AN004 — YAML companion to the "Frequency / Rotation / RC-Timing Measurement" application note.
# Four-artifact model: first-party, trust-stampable digest an agent consumes WITHOUT opening the
# PDF. DIGEST + LINKS, never a prose clone — the "why" lives in the human document; this file
# carries the novel composition + pointers to the KB primitives the note assembles.
# Schema: the P2ANxxx companion schema piloted on P2AN001 / P2AN002 / P2AN003.

title: "Frequency / Rotation / RC-Timing Measurement"
subtitle: "Read a resistive, capacitive, light, or rotary sensor directly on a P2 pin — the smart pin does the measuring"
doc_id: P2AN004
kind: application-note

# ---- DISCOVERY TIER ----
aliases:
  - frequency measurement
  - period measurement
  - pulse measurement
  - reciprocal frequency counter
  - RC decay reader
  - rctime
  - light to frequency
  - TSL235R
  - quadrature encoder
  - quadrature knob
  - rotary encoder
  - detent normalization
  - sensor reading
  - photocell reader
  - thermistor reader
  - high-time measurement
  - pulse width measurement
categories:
  - measurement
  - sensors
  - smart-pins
  - timing
capability_domain: "Sensor measurement / frequency, period, and RC timing"
summary: |
  Read a real-world sensor directly on one P2 pin by letting a smart pin time, count, or decode the
  signal so the cog never watches an edge. One shared idea (configure the measurement mode, let the
  smart pin run, read a number) applied through three instruments chosen among by transducer:
  R1 an RC-decay reader that times a capacitor's discharge through a resistive/capacitive sensor
  (P_HIGH_TICKS, %10001); R2 a light-to-frequency reader that turns a TSL235R's output frequency
  into an irradiance with a reciprocal frequency counter (P_COUNTER_TICKS %10101 + P_COUNTER_PERIODS
  %10111 over one window, frequency = periods * clkfreq / ticks via MULDIV64); and R3 a drop-in
  quadrature-knob instrument (P_QUADRATURE %01011, continuous totalizer X=0) with detent
  normalization, preset, range clamp, and a debounced button. The encoder self-verifies with two
  jumper wires and a known-answer detent count; the analog recipes' absolute calibration defers to
  hardware and carries no invented readings.
audience: [human, agent]

# ---- CONSUMPTION TIER: the composition recipe (LINKS to existing KB primitives) ----
# Nested under cross_references so the crossref validator enforces every path resolves.
cross_references:
  composes:
    - architecture/smart-pins/smart-pin-10001-time-a-highs.yaml                # P_HIGH_TICKS %10001 (R1 RC-decay high-time)
    - architecture/smart-pins/smart-pin-10101-count-ticks-in-x-clocks.yaml     # P_COUNTER_TICKS %10101 (R2 elapsed clocks of the window)
    - architecture/smart-pins/smart-pin-10111-count-periods-in-x-clocks.yaml   # P_COUNTER_PERIODS %10111 (R2 whole periods in the window)
    - architecture/smart-pins/smart-pin-01011-quadrature-encoder.yaml          # P_QUADRATURE %01011 (R3 signed A/B decode)
    - language/spin2/methods/pinstart.yaml            # configure a smart pin (mode, X window, Y) — R2/R3
    - language/pasm2/wrpin.yaml                        # configure the timing smart pin mode — R1
    - language/pasm2/wxpin.yaml                        # set the X measurement window / period
    - language/pasm2/rdpin.yaml                        # read the latched result (Z) — high-ticks, ticks/periods, signed count
    - language/spin2/methods/pinread.yaml             # poll the smart pin's IN flag (window closed)
    - language/spin2/methods/pinhigh.yaml             # R1 charge: drive the node high (pinh)
    - language/spin2/methods/pinlow.yaml              # R1/R3 pinl: OUT=0 + DIR high (float via P_LOW_FLOAT / re-enable)
    - language/spin2/methods/pinfloat.yaml            # R1/R3 pinf: DIR low resets the accumulator
    - language/spin2/methods/pinwrite.yaml            # R3 self-test stimulus: drive the A/B gray-code pins (pinw)
    - language/spin2/methods/muldiv64.yaml            # reciprocal frequency + irradiance without 32-bit overflow

mechanism_reference:
  - "P2 I/O & Smart Pins User Guide, Chapter 13 (time measurement) (a companion P2 Knowledge Base publication) — the P_HIGH_TICKS high-duration mode R1 applies"
  - "P2 I/O & Smart Pins User Guide, Chapter 14 (counting and quadrature) (a companion P2 Knowledge Base publication) — the P_QUADRATURE mode R3 applies, incl. the velocity (X>0) path"
  - "P2 I/O & Smart Pins User Guide, Chapter 15 (frequency and period) (a companion P2 Knowledge Base publication) — the reciprocal frequency counter R2 applies, and the worked frequency-counter/tachometer/time-of-flight instruments this note points to"

runnable_code:
  examples_zip: "P2AN004-src-<YYMMDD>.zip"        # published beside the PDF at release
  recipes:
    - {id: rc-decay-reader,     file: rc-decay-reader.spin2,     note: "R1 — time a capacitor's discharge through a resistive/capacitive sensor (P_HIGH_TICKS)"}
    - {id: light-to-freq-reader, file: light-to-freq-reader.spin2, note: "R2 — reciprocal frequency counter turns a TSL235R's output frequency into an irradiance"}
    - {id: quadrature-knob,     file: quadrature-knob.spin2,     note: "R3 — drop-in encoder knob (detent normalize, preset, clamp, debounced button) with a two-jumper self-test"}
  toolchain: "pnut_ts, _clkfreq = 200_000_000; all three recipes use debug() so compile with -d"

key_parameters:
  r1_mode: "P_HIGH_TICKS (%10001) — Z = duration of the high state in clocks; IN raised on the high->low crossing only; RC_MODE = P_HIGH_TICKS | P_SCHMITT_A | P_OE | P_LOW_FLOAT"
  r1_mechanism: "pinh charges the node through a 220 ohm series resistor; pinf (DIR low) resets the accumulator; pinl (OUT=0, DIR high) floats the pin via P_LOW_FLOAT and starts timing; RDPIN reads the latched high-tick count. us = clocks / (clkfreq / 1_000_000)"
  r2_reciprocal: "frequency = MULDIV64(periods, clkfreq, ticks); P_COUNTER_TICKS on SIG_PIN (default-local A/B) + P_COUNTER_PERIODS on SIG_PIN+1 routed back one pin (P_MINUS1_A | P_MINUS1_B) over the same X window; both raise IN when the period-aligned window closes"
  r2_tsl235r: "datasheet (ams/TAOS, cross-check tier): fO = 250 kHz typ at Ee = 430 uW/cm^2, lambda_p = 635 nm, VDD = 5 V; 2.7-5.5 V operating (works at 3.3 V); dark 0.4-10 Hz. Ee[uW/cm^2] = freq * 430 / 250_000, folded as muldiv64(freq, CAL_UW*100, CAL_HZ) for two-decimal fixed point without 32-bit overflow"
  r3_quadrature: "P_QUADRATURE (%01011) | P_PLUS1_B (B from the next pin up); continuous totalizer X=0 -> Z always holds the live signed count; 4 counts per detent -> `rdpin sar 2` normalizes to one-per-detent; zero by pulsing DIR low (pinf/pinl); optional P_FILT1_AB for contact bounce"
  gate_window: "R2 window: gate = (clkfreq / 1000) * GATE_MS clocks; longer window resolves low frequency finer, shorter updates faster"
  measurement_ceiling: "keep the measured frequency well below clkfreq (many system-clock ticks per input period); every reading inherits the P2 clock's ppm accuracy; runs at a legal 200 MHz (300 MHz max)"

prerequisites:
  - "Configuring a smart pin (WRPIN/WXPIN/WYPIN, or the Spin2 pinstart that wraps them) and reading it back with RDPIN"
  - "The P2 smart-pin measurement modes at the mechanism level — this note USES them; IOSP Ch.13-15 teach them"
  - "P2 32-bit integer / fixed-point model (no floating-point hardware)"

gotchas:
  source: "Legality checked with pnut-ts v1.55.3 (compiler, legality only); pin-drive semantics from the P2 Datasheet 2022/11/01 p.24 Pin Mode Legend -- engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:1131-1147 (documentary, and the authority for the pin-drive statements here; EF-063 and EF-064 -- engineering/ingestion/external-sources/hardware-verification/P2-EMPIRICAL-FINDINGS.md:827,840 -- corroborate the mechanism only INCIDENTALLY, as rig apparatus for a streamer-fed DAC %TT finding (:813) and a streamer pin-placement finding (:834); neither is a drive-strength finding); A/B input selectors from Propeller 2 Documentation v35 -- engineering/ingestion/sources/silicon-doc/part4-smart-pins.txt:13-36"
  items:
    - flag: pitfall
      text: "P_B_A_INPUT does not exist -- it is undefined in pnut-ts and appears in no Parallax symbol table. Single-pin routing is the bare mode constant (the %AAAA and %BBBB selectors both default to 'this pin's read state') plus P_MINUS1_A|P_MINUS1_B for the reciprocal-periods cell, or P_PLUS1_B for quadrature. Never add P_B_A_INPUT."
    - flag: pitfall
      text: "An RC-discharge measurement depends on P_LOW_FLOAT. The Pin Mode Legend makes the low side's drive a selectable rung of the same eight-rung ladder as the high side, and 'Float' is one of those rungs: selecting it means that when OUT goes low the pin stops driving and the capacitor discharges through the sensor. With any other low-side rung the pin drives the node toward ground and you time the driver, not the sensor."
    - flag: pitfall
      text: "An open sensor, or too short a charge, hangs a poll loop that waits on a high-to-low crossing: if the node never falls, IN is never raised and the RDPIN is never reached. The symptom is a hang, not a maximum reading."
    - flag: pitfall
      text: "P_PLUS1_B reads the B input from 'relative +1 pin's read state', so a quadrature encoder's B line must sit on the pin immediately above A -- or pick the routing modifier that matches the wiring (the selectors cover relative -3..+3 and this pin's OUT bit)."
    - flag: tip
      text: "Detent normalization is a property of the encoder, not of the P2: a 4-counts-per-detent encoder needs the count shifted right by 2, an un-detented one needs no shift. Getting this wrong shows up as exactly 4x the expected magnitude."
    - flag: gap
      text: "Sensor-specific electrical figures (supply range, dark output, decoupling) belong to the sensor's own datasheet, which is not in this project's ingestion tree. They are deliberately not restated here."

hardware_status: |
  R3 (quadrature) is Tier-0 self-verified: a two-jumper stimulus drives a known detent count (5 fwd,
  2 back -> reads 5 then 3) on a bare Edge board with no encoder, exercising the mode config, the
  4x-per-detent normalization, the preset/offset, and the clamp. R1 and R2 show correct BEHAVIOR now
  (R1's count moves with sensor resistance; R2's frequency moves with light), but turning those into
  a calibrated lux, temperature, or absolute irradiance needs a known reference and DEFERS to a
  characterization run on real silicon (-> EF ledger when accepted). No invented sensor numbers are
  printed. Every embedded and example-library program compiles clean under pnut_ts (-d).

