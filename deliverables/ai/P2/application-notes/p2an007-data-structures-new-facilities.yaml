    - {id: single-long-packed-record, file: single-long-packed-record.spin2, note: "R5 — {Spin2_v54} member bitfields; a WHOLE command record (opcode/arg/seq) packed into one long, staged privately and published in ONE whole-struct store; reader snapshots in ONE load"}
