runnable_code:
  examples_zip: "P2AN007-src-<YYMMDD>.zip"        # published beside the PDF at release
  recipes:
    - {id: in-cog-record,           file: in-cog-record.spin2,           note: "R1 — declare/fill/whole-struct-copy an array of STRUCT records + SIZEOF (in-cog, no lock)"}
    - {id: spsc-ring-buffer,        file: spsc-ring-buffer.spin2,        note: "R2 — lock-free single-producer/single-consumer ring of records; single-owner indices, publish-index-last"}
    - {id: latest-wins-mailbox,     file: latest-wins-mailbox.spin2,     note: "R3 — STRUCT command block published with a sequence counter (seq bumped last, seq/ack), no lock"}
    - {id: locked-multiwriter-queue, file: locked-multiwriter-queue.spin2, note: "R4 — many writers -> one queue guarded by a P2 hardware lock (LOCKNEW/LOCKTRY/LOCKREL)"}
  toolchain: "pnut_ts 1.55, _clkfreq = 200_000_000; every file opens with {Spin2_v45} (STRUCT); all use debug() so compile with -d"

key_parameters:
  version_gate: "STRUCT requires {Spin2_v45} as the first source line (OFFSETOF is v53, member bitfields v54 — this note stays within v45)"
  struct_decl: "STRUCT name(members) in a CON block; members default LONG, or typed BYTE/WORD/LONG; arrays and nesting allowed; packed (no padding). reading_t(LONG,LONG,BYTE) = 9 bytes"
  struct_ops: "member access var.member; whole-struct copy a := b; SIZEOF(name) -> byte size; pass-by-value <=15 longs (larger uses BYTEMOVE)"
  atomicity_model: "a single hub LONG is read/written atomically; a multi-field record is NOT. Publish a record: write its fields FIRST, then flip ONE long (an index or a sequence counter) LAST"
  lock_rule: "single writer of the publish long -> NO lock (R2 ring: producer owns head, consumer owns tail; R3 mailbox: one writer bumps seq). Several writers of the same index -> ONE hardware lock (R4)"
  locks: "P2 has 16 hardware locks. LOCKNEW() -> 0..15 or -1 (check it); REPEAT UNTIL LOCKTRY(id) spin-acquires; LOCKREL(id) releases; LOCKRET(id) frees. Release on EVERY exit path; two locks -> acquire in the SAME (ascending) order"
  ring_indexing: "power-of-2 QSIZE -> `& QMASK` is one-instruction modulo; full test ((head+1)&MASK) == tail (or <> for not-full)"

prerequisites:
  - "Reading/writing Spin2 (methods, VAR/DAT, debug())"
  - "Launching a method in another cog with cogspin (the cross-cog recipes run a second cog)"
  - "Hub RAM as shared memory; a single long is atomic, a multi-long update is not"

gotchas:
  - flag: pitfall
    text: "A multi-field record is NOT atomic. Always write the record's fields first, then flip a single long (index or sequence counter) that publishes it — that one long is the atomic hand-off. The reader must not touch the record until it sees that long change."
  - flag: pitfall
    text: "Publish the index/sequence LAST. Every lock-free recipe's correctness depends on the order: fields first, publish long last. Reversed, readers see partial/stale data."
  - flag: pitfall
    text: "One writer per index -> no lock; several writers -> a lock. A single owner of an index long advances it safely lock-free (R2/R3). Two cogs advancing the same index is a read-modify-write race — guard it (R4)."
  - flag: pitfall
    text: "Use the REAL P2 locks LOCKNEW/LOCKTRY/LOCKREL. The P1 methods lockset()/lockclr() do NOT exist on P2 and will not compile (KB finding F-199)."
  - flag: pitfall
    text: "Release the lock on EVERY exit path from a critical section — an early RETURN/ABORT inside a locked section must LOCKREL first, or the lock leaks and other cogs hang. Free the lock with LOCKRET when done."
  - flag: pitfall
    text: "Receiving a struct POINTER from a CHILD object needs bracket notation: `[pRec] := child.method()`. Without it a record larger than 15 longs is treated as a full-struct return and fails to compile. (Only across OBJ boundaries.)"
  - flag: hardware
    text: "The P2 has 16 hardware locks; LOCKNEW returns -1 when they're exhausted — always check. Keep the locked section tiny (never hold a lock across debug()/waitms)."
  - flag: tip
    text: "A STRUCT array replaces parallel arrays kept in lockstep — one records[] copies and indexes as a unit, fewer indices to keep aligned. A deque is a ring with both ends live (no new primitive)."
  - flag: verify
    text: "R1: SIZEOF(reading_t)=9, value=i*i. R2: consumed value = seq*10, seq monotonic (a mismatch = publish order wrong). R3: 5 exec lines op 1..5, a0=op*100, a1=op*1000. R4: writer-1/writer-2 jobs interleaved, no duplicated/skipped slot (a collision = enqueue ran without the lock)."

hardware_status: |
  Every embedded block and every examples-library program compiles clean under pnut_ts -d (v1.55.0,
  _clkfreq = 200_000_000), covering the STRUCT declarations/arrays/SIZEOF/whole-struct-copy and the
  LOCKNEW/LOCKTRY/LOCKREL usage. Compilation proves LEGALITY only: true cross-cog atomicity and
  race-freedom (torn-read absence under the ring/mailbox ordering, mutual exclusion under contention
  for the locked queue) are RUNTIME multi-cog properties described here from the atomic-single-long
  model, and a two-cog confirmation on real silicon is a later step (Stephen runs hardware externally;
  -> EF ledger when accepted). No invented DEBUG captures. Implementation-only: the contract-choice
  reasoning is deferred to the P2 Architect's Guide.

