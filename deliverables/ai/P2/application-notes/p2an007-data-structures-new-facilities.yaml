  toolchain: "pnut_ts 1.55, _clkfreq = 200_000_000; R1-R4 open with {Spin2_v45} (STRUCT), R6 needs {Spin2_v53} (OFFSETOF), R5 needs {Spin2_v54} (member bitfields); all use debug() so compile with -d"

key_parameters:
  version_gate: "STRUCT requires {Spin2_v45} as the first source line. Two later additions are covered and raise the floor ONLY for the file that uses them: OFFSETOF = v53 (R6); member bitfields = v54 (R5). R1-R4 remain v45. NOTE: the v54 bitfield syntax parses UNCONDITIONALLY (there is no level54_symbols table), so {Spin2_v54} is a declaration of intent, NOT an enforced gate — a clean compile does not prove the toolchain is new enough."
  struct_bitfields: "{Spin2_v54}. Named bit ranges on a BYTE/WORD/LONG member: STRUCT s(LONG flags.ready[0].mode[3..2]) -> s.flags.ready. NAMELESS form STRUCT s(LONG.ready[0].mode[3..2]) makes the struct ITSELF the backing long -> s.ready (single member only, no [N] count). [N]=one bit, [hi..lo]=inclusive range. Bit must fit the member type (BYTE 0..7 / WORD 0..15 / LONG 0..31) — the compiler CHECKS that, but does NOT check that fields fail to overlap. Whole-member and whole-struct assignment/zero/set-all are preserved. SIZEOF(nameless)=size of the backing type (4 for LONG); OFFSETOF(nameless.field)=0"
  packed_long_atomicity: "CRITICAL and counter-intuitive: packing a record into ONE long does NOT make it atomic. Each bitfield write is a read-modify-write of the backing long, so writing the SHARED record field-by-field is several separate stores and a reader CAN observe an intermediate state. Atomicity requires staging the record in a PRIVATE local, publishing with ONE whole-struct store (shared := staged), and snapshotting with ONE whole-struct load (snap := shared) before reading any field"
  offsetof: "{Spin2_v53}. OFFSETOF(struct.member) -> byte offset of the member within the record (records pack with NO padding). Nests and indexes: OFFSETOF(s.sub.member), OFFSETOF(s.arr[2].member). Restricted to DAT/VAR/PUB/PRI blocks — using it in CON or OBJ is a compile error (same restriction as SIZEOF). Use it wherever raw addressing is unavoidable so a widened/inserted member cannot silently invalidate a hand-counted offset"
  struct_decl: "STRUCT name(members) in a CON block; members default LONG, or typed BYTE/WORD/LONG; arrays and nesting allowed; packed (no padding). reading_t(LONG,LONG,BYTE) = 9 bytes"
  struct_ops: "member access var.member; whole-struct copy a := b; SIZEOF(name) -> byte size; pass-by-value <=15 longs (larger uses BYTEMOVE)"
  atomicity_model: "a single hub LONG is read/written atomically; a multi-field record is NOT. Publish a record: write its fields FIRST, then flip ONE long (an index or a sequence counter) LAST"
  lock_rule: "single writer of the publish long -> NO lock (R2 ring: producer owns head, consumer owns tail; R3 mailbox: one writer bumps seq). Several writers of the same index -> ONE hardware lock (R4)"
  locks: "P2 has 16 hardware locks. LOCKNEW() -> 0..15 or -1 (check it); REPEAT UNTIL LOCKTRY(id) spin-acquires; LOCKREL(id) releases; LOCKRET(id) frees. Release on EVERY exit path; two locks -> acquire in the SAME (ascending) order"
  ring_indexing: "power-of-2 QSIZE -> `& QMASK` is one-instruction modulo; full test ((head+1)&MASK) == tail (or <> for not-full)"

prerequisites:
  - "Reading/writing Spin2 (methods, VAR/DAT, debug())"
  - "Launching a method in another cog with cogspin (the cross-cog recipes run a second cog)"
  - "Hub RAM as shared memory; a single long is atomic, a multi-long update is not"

gotchas:
  - flag: pitfall
    text: "A multi-field record is NOT atomic. Always write the record's fields first, then flip a single long (index or sequence counter) that publishes it — that one long is the atomic hand-off. The reader must not touch the record until it sees that long change."
  - flag: pitfall
    text: "Publish the index/sequence LAST. Every lock-free recipe's correctness depends on the order: fields first, publish long last. Reversed, readers see partial/stale data."
  - flag: pitfall
    text: "One writer per index -> no lock; several writers -> a lock. A single owner of an index long advances it safely lock-free (R2/R3). Two cogs advancing the same index is a read-modify-write race — guard it (R4)."
  - flag: pitfall
    text: "A record that FITS in one long still needs a ONE-STORE publish (R5). Each bitfield write is a read-modify-write of the backing long, so filling the shared record field-by-field is several stores a reader can land between. Stage it in a private local, publish with one whole-struct store, snapshot with one whole-struct load. Fitting in one long makes an atomic publish POSSIBLE; storing it once is what makes it HAPPEN."
  - flag: pitfall
    text: "R3's seq/ack handshake is LOAD-BEARING — do NOT drop it (KB finding F-213). The worker reads opcode/arg0/arg1 as THREE separate reads of shared memory; the ack is what stops the writer overwriting the command mid-read. For a non-blocking writer: pack the payload into one long (R5), or have the reader re-check the sequence (read seq, copy, re-read seq, retry if it moved) and discard a straddling copy."
  - flag: pitfall
    text: "Member bitfields may OVERLAP silently. The compiler rejects a bit range that overruns its member type, but performs NO disjointness check — two fields sharing bits compile clean and corrupt each other. Add the bit budget up by hand, once."
  - flag: pitfall
    text: "Brackets write the POINTER, the bare name writes the RECORD: `[ph] := @packet` aims a ^struct pointer; plain `ph := ...` means the record it points at and will not compile as an address assignment."
  - flag: pitfall
    text: "Use the REAL P2 locks LOCKNEW/LOCKTRY/LOCKREL. The P1 methods lockset()/lockclr() do NOT exist on P2 and will not compile (KB finding F-199)."
  - flag: pitfall
    text: "Release the lock on EVERY exit path from a critical section — an early RETURN/ABORT inside a locked section must LOCKREL first, or the lock leaks and other cogs hang. Free the lock with LOCKRET when done."
  - flag: pitfall
    text: "Receiving a struct POINTER from a CHILD object needs bracket notation: `[pRec] := child.method()`. Without it a record larger than 15 longs is treated as a full-struct return and fails to compile. (Only across OBJ boundaries.)"
  - flag: hardware
    text: "The P2 has 16 hardware locks; LOCKNEW returns -1 when they're exhausted — always check. Keep the locked section tiny (never hold a lock across debug()/waitms)."
  - flag: tip
    text: "A STRUCT array replaces parallel arrays kept in lockstep — one records[] copies and indexes as a unit, fewer indices to keep aligned. A deque is a ring with both ends live (no new primitive)."
  - flag: verify
    text: "R1: SIZEOF(reading_t)=9, value=i*i. R2: consumed value = seq*10, seq monotonic (a mismatch = publish order wrong). R3: 5 exec lines op 1..5, a0=op*100, a1=op*1000. R4: writer-1/writer-2 jobs interleaved, no duplicated/skipped slot (a collision = enqueue ran without the lock). R5: 5 exec lines op 1..5 with arg=op*100 (an arg belonging to a different op = the record reached the shared long field-by-field instead of staged+stored once). R6: OFFSETOF magic=0 length=4 kind=6 flags=7, SIZEOF(hdr_t)=8, payload at +8."

hardware_status: |
  Every embedded block and every examples-library program compiles clean under pnut_ts -d (v1.55.0,
  _clkfreq = 200_000_000). Beyond legality, every CROSS-COG claim in this note is CONFIRMED ON REAL P2
  SILICON with two cogs actually contending (2026-07-13; empirical ledger EF-036..EF-040; rigs +
  golden analysis under external-sources/hardware-verification/campaigns/2026-07-cross-cog-data-structures/).
  Each discipline was measured against a deliberately-broken control, and the control was REQUIRED to
  fail before the result was accepted (a rig reporting zero in both arms is INCONCLUSIVE, never a pass).
  Measured: R2 publish-index-last 0 torn / index-first 200_000 of 200_000 torn (EF-036). R5 staged
  one-store publish 0 torn / same fields written in-place into the shared packed long 116_452 of 200_000
  torn (EF-037) -- fitting in ONE long does NOT make a record atomic; each bitfield write is a
  read-modify-write of the backing long. R3 seq/ack handshake present 0 bad / handshake removed 20_000 of
  20_000 bad for a worker that dispatches between reads (EF-038, grounds F-213); a TIGHT-POLLING worker
  reports zero, which is why the missing ack looks fine under the obvious test. R4 locked 0 anomalies /
  unlocked 3_331 (EF-039). R6/R1 OFFSETOF+SIZEOF 11/11 layout checks match the numbers the note prints
  (EF-040). No invented DEBUG captures. Implementation-only: the contract-choice reasoning is deferred to
  the P2 Architect's Guide.

