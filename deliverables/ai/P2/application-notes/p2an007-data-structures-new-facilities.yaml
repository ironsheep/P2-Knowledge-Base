capability_domain: "Data structures / STRUCT records and safe cross-cog data sharing"
summary: |
  Use the Spin2 STRUCT facility for packed, named, typed records, and share those records safely
  across cogs. One shared idea (a STRUCT is a packed record; a single hub long is atomic but a
  multi-field record is not, so publish a record by writing its fields FIRST then flipping one long
  LAST) applied through four runnable recipes chosen among by how the data flows: R1 an in-cog record
  and array (declare/fill/whole-struct-copy/SIZEOF); R2 a lock-free single-producer/single-consumer
  ring buffer (single-owner head/tail indices, power-of-2 & mask, publish-index-last, no lock);
  R3 a latest-wins command mailbox (a STRUCT arg block published with a sequence counter bumped last,
  seq/ack handshake, no lock); and R4 a locked multi-writer queue (several writers, one P2 hardware
  lock guarding the head advance, release-on-all-paths, ascending-lock-order). Two further recipes
  cover the STRUCT facilities added after v45: R5 packs a WHOLE record into one long using member
  bitfields ({Spin2_v54}, nameless form) so the payload and its sequence number publish in a single
  atomic store -- but ONLY if the record is staged in a private local and stored once, because each
  bitfield write is a read-modify-write of the backing long and filling the shared record field-by-
  field is several separate stores a reader can land between; and R6 uses OFFSETOF ({Spin2_v53}) for
  compiler-computed member offsets where raw addressing is unavoidable (a packed wire header, a buffer
  handed to inline PASM), so a widened member never silently invalidates a hand-counted offset.
  Uses the REAL P2 lock methods LOCKNEW/LOCKTRY/LOCKREL -- never the P1 lockset/lockclr.
  Implementation-only by design: which structure to use and why (copy vs reference, refcount-vs-copy
  fan-out) is a contract decision the P2 Architect's Guide owns and this note CITES. Every recipe
  compiles clean under pnut_ts -d.
audience: [human, agent]

