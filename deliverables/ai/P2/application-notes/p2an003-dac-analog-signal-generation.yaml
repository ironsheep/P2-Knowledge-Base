runnable_code:
  examples_zip: "P2AN003-src-<YYMMDD>.zip"        # published beside the PDF at release
  recipes:
    - {id: sample-playback,     file: dac-sample-playback.spin2,     note: "Recipe 1 — DDS phase-accumulator playback of a stored buffer at any pitch"}
    - {id: waveform-synthesis,  file: dac-waveform-synthesis.spin2,  note: "Recipe 2 — computed sine (CORDIC QROTATE), sawtooth, triangle from the DDS phase"}
    - {id: dithering,           file: dac-dithering.spin2,           note: "Recipe 3 — PRNG-vs-PWM dither choice swept across the full 16-bit code range"}
    - {id: adc-dac-passthrough, file: dac-adc-passthrough.spin2,     note: "Recipe 4 — real-time sample pump: SINC2-filtering ADC read -> DAC write, period-matched"}
    - {id: mixing-panning,      file: dac-mixing-panning.spin2,      note: "Recipe 5 — three voices summed and panned to a stereo pair of DAC pins"}
  ceiling_reference:
    note: "32-stream software audio mixer to 1-8 output pins (volume/pan/pitch/format) + MOD player — DESCRIBED/LINKED only; complete impl is OBEX #2861 reSound (Johannes Ahlebrand, ~955 lines)"
  toolchain: "pnut_ts 1.55, _clkfreq = 200_000_000; Recipes 1-5 compile plain, the Tier-0 verify snippet uses debug() so needs -d"

key_parameters:
  dac_native_bits: 8
  dac_output_bits: "16-bit nominal, dithered and time-averaged (no ENOB/SNR/THD figure printed — defers to a hardware run)"
  dither_modes:
    - "P_DAC_DITHER_PWM (%00011): cleanest spectrum, lowest switching noise; adds a Fclock/256 line at -48 dB; X period MUST be a multiple of 256 (256 min). Best for audio."
    - "P_DAC_DITHER_RND (%00010): no periodic tone, slightly more broadband noise; X=1 updates every clock. Best for control DC."
    - "plain 8-bit DAC noise mode %00001 (Sec 18.3)"
  output_configs: "P_DAC_990R_3V / P_DAC_600R_2V / P_DAC_124R_3V / P_DAC_75R_2V (990/600/124/75 ohm; 3.3 V or 2.0 V peak) — trade drive impedance vs peak voltage"
  voltage_math: "V = (code / 65536) * Vfs; $8000 -> 1.65 V, $4000 -> 0.825 V at Vfs = 3.3 V"
  sample_clock: "period set by WXPIN; the pin raises IN once per period; 200 MHz / 256 clocks = 781_250 samples/s"
  dds_phase_increment: "inc = f * 2^32 / sample_rate, computed with Spin2 `frac` (unsigned (x<<32)/y); top bits of a 32-bit phase index a table or feed the CORDIC"
  adc_passthrough_config: "SINC2 filtering, X[5:4]=%01, period X[3:0]=8 -> 2^8=256 clocks (matched to the DAC's 256); the raw per-period differential is already ~16-bit full scale (raw width = 2*log2(N)), so it drives the DAC directly"

prerequisites:
  - "Configuring a smart pin (WRPIN/WXPIN/WYPIN, raise DIR to enable) and starting a cog with COGINIT"
  - "The P2 DAC modes at the mechanism level — this note USES the DAC; IOSP Ch.10/Sec 18.3 teach it"
  - "P2 32-bit integer / fixed-point model (no floating-point hardware)"

gotchas:
  - flag: pitfall
    text: "Write the mode (WRPIN/WXPIN) BEFORE raising DIR, and the first value (WYPIN) AFTER — the universal smart-pin init order. Reversing it leaves the first output cycle undefined."
  - flag: pitfall
    text: "PWM dither (P_DAC_DITHER_PWM) requires its X period to be a multiple of 256 clocks (256 minimum). A non-multiple produces incorrect dithering; if you need a different period, use PRNG dither instead."
  - flag: pitfall
    text: "FGES/FLES are INTEGER signed-limit instructions (Force >=/<= Signed), NOT floating-point — the R5 mix clamp to +/-$7FFF is correct integer saturation. Do not 're-fix' it into a bug."
  - flag: pitfall
    text: "Recipe 4: a 256-clock SINC2 FILTERING differential is already ~16-bit full scale, so it feeds the DAC directly — do NOT up-scale it (a left shift overflows and rails the DAC). SINC2 differences are valid only from the 2nd period, so prime/discard the first read."
  - flag: hardware
    text: "Always filter the output: the DAC's analog value only emerges after the dither is averaged. Put an RC low-pass corner above your highest signal frequency and below the dither frequency (Fclock/256 for PWM dither)."
  - flag: tip
    text: "Signed sample -> DAC offset-binary is a single `add $8000`; the sawtooth/triangle are already unipolar 0..$FFFF so they skip it. Volume and pan are the same op — a multiply by a weight."
  - flag: verify
    text: "Tier-0 known answer: a fixed code produces V=(code/65536)*Vfs; jumper the DAC pin to a P2AN001 ADC pin and it reads that voltage back — proves the whole path with no bench gear. reSound (OBEX #2861) is a described reference ceiling, not a starting point."

hardware_status: |
  The Tier-0 DAC->ADC loopback known-answer (fixed code -> computable DC, read back by a P2AN001
  ADC on a jumpered pin) proves the code and arithmetic with no bench instruments. Numeric
  audio-quality figures — SNR, THD, true effective bit depth after filtering — depend on the
  analog filter and the measurement bench and are NOT asserted here; they defer to a
  characterization run on real silicon (-> EF ledger when accepted), exactly as P2AN001 defers
  its ENOB figure. Every embedded and example-library program compiles clean under pnut_ts.

