gotchas:
  - flag: pitfall
    text: "Configure the smart pin while DIR is low: write the mode (WRPIN/WXPIN) before raising DIR. In the two 16-bit dither DAC modes, Y is captured during reset (DIR=0)."
  - flag: pitfall
    text: "PWM dither (P_DAC_DITHER_PWM) requires its X period to be a multiple of 256 clocks (X[7:0]=0). Pseudo-random dither does not require a fixed period."
  - flag: pitfall
    text: "In both 16-bit dither modes, Y[15:0] values larger than $FF00 are invalid and are clipped down to $FF00, so codes between $FF01 and $FFFF all output the $FF00 level."
  - flag: pitfall
    text: "FGES/FLES are integer signed-limit instructions (Force >=/<= Signed), not floating-point; the R5 mix clamp to +/-$7FFF is integer saturation."
  - flag: pitfall
    text: "Recipe 4: the SINC2 filtering sample is the difference between successive accumulator reads, and the filter becomes accurate starting on the third sample (Parallax's documents also give the second period); reads before that are not accurate. The documents state that the computed sample is shifted right by LOG2(clocks per period)-1 to leave the effective bits intact. Not documented: the range of a 256-clock SINC2 filtering differential against the DAC's valid Y range."
  - flag: hardware
    text: "The 16-bit DAC value is the dithered 8-bit DAC output averaged over time, and in PWM dither mode a frequency of Fclock/256 is present in the output at -48dB. Not documented: a recommended filter corner."
  - flag: tip
    text: "Signed sample -> DAC offset-binary is a single `add $8000`, which puts codes up to $FFFF into a DAC whose valid range ends at $FF00. The sawtooth and triangle are unipolar and skip it. Volume and pan are the same op — a multiply by a weight."
  - flag: verify
    text: "Tier-0 known answer: a fixed code produces V=(code/65536)*Vfs; jumper the DAC pin to a P2AN001 ADC pin and it reads that voltage back — exercises the whole path with no external instruments. reSound (OBEX #2861) is a described reference ceiling, not a starting point."

key_parameters:
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PIN MODES, %00010 and DAC_MODE = DAC 16-bit with pseudo-random dither and %00011 and DAC_MODE = DAC 16-bit with PWM dither; %11000 ADC sample/filter/capture, internally clocked; DAC pin-mode constants from Parallax Propeller 2 Spin2 Language Documentation v55, Built-In Symbols for Smart Pin Configuration"
  dac_native_bits: 8
  dac_output_bits: "16-bit nominal, produced by dithering the 8-bit DAC between adjacent levels and time-averaging. No ENOB/SNR/THD figure is stated by any source and none is asserted here."
  dither_modes:
    - mode: "%00011 with DAC_MODE -- DAC 16-bit with PWM dither (P_DAC_DITHER_PWM)"
      source_statement: "'PWM dithering will give better dynamic range than pseudo-random dithering, since a maximum of only two transitions occur for every 256 clocks. This means, though, that a frequency of Fclock/256 will be present in the output at -48dB.'"
      period_rule: "The sample period must be a multiple of 256 (X[7:0]=0)."
    - mode: "%00010 with DAC_MODE -- DAC 16-bit with pseudo-random dither (P_DAC_DITHER_RND)"
      source_statement: "'Pseudo-random dithering does not require any kind of fixed period, as it randomly dithers the 8-bit DAC between adjacent' levels."
    - mode: "%00001 with DAC_MODE -- plain 8-bit DAC"
  low_level_pin_requirement: "For every DAC smart-pin mode, M[12:10] must be set to %101 to configure the low-level pin for DAC output."
  output_configs: "P_DAC_990R_3V / P_DAC_600R_2V / P_DAC_124R_3V / P_DAC_75R_2V -- the four DAC output configurations, trading drive impedance against peak voltage. Per-constant definitions live in language/spin2/symbols/spin2-builtin-symbols-complete.yaml."
  y_limit: "In both 16-bit dither modes (%00010 and %00011), Y[15:0] values larger than $FF00 are invalid and are clipped down to $FF00."
  sample_clock: "The period is set by WXPIN; on completion of each sample period Y[15:0] is captured for the next output value and IN is raised, so an update is coordinated with IN going high."
  sinc2_differential: "The SINC2 filtering sample is the difference between the new and previous second-accumulator values; the filter becomes accurate starting on the third sample; Parallax's documents also give the second period. For SINC2 filtering the computed sample is shifted right by LOG2(clocks per period)-1 to leave the effective bits intact. Not documented: the range of a 256-clock SINC2 filtering differential against the DAC's valid Y range."
  adc_passthrough_config: "SINC2 filtering is X[5:4]=%01; the period is POWER(2, X[3:0]), so X[3:0]=8 gives 256 clocks, a multiple of 256 as the PWM-dither DAC's sample period requires. In filtering mode WYPIN after WXPIN can replace that period with any value in Y[13:0] up to 11,585 clocks."
  formulas_note: "The V = code/65536 * Vfs conversion and the DDS phase-increment inc = f * 2^32 / sample_rate are the arithmetic of a 16-bit code and a 32-bit phase accumulator, not statements taken from a Parallax source. They are kept out of this block; the streamer NCO's own source-stated scaling rule is in language/pasm2/setxfrq.yaml frequency_formula."

hardware_status: |
  The Tier-0 DAC->ADC loopback known-answer (fixed code -> computable DC, read back by a P2AN001
  ADC on a jumpered pin) exercises the code and arithmetic with no external instruments. Numeric
  audio-quality figures — SNR, THD, true effective bit depth after filtering — depend on the
  analog filter and the measurement setup; they are unknown here and NOT asserted, exactly as
  P2AN001's ENOB figure is unknown.


