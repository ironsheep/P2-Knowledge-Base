# P2AN003 — YAML companion to the "DAC & Analog Signal Generation" application note.
# Four-artifact model: first-party, trust-stampable digest an agent consumes WITHOUT opening the
# PDF. DIGEST + LINKS, never a prose clone — the "why" lives in the human document; this file
# carries the novel composition + pointers to the KB primitives the note assembles.
# Schema: the P2ANxxx companion schema piloted on P2AN001 / P2AN002.

title: "DAC & Analog Signal Generation"
subtitle: "Sample playback, waveform synthesis, dithering, and mixing from a single P2 pin's DAC"
doc_id: P2AN003
version: "1.0.0"
kind: application-note

# ---- DISCOVERY TIER ----
