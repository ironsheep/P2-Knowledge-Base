capability_domain: "Analog output / DAC / audio"
summary: |
  Turn one P2 pin into a 16-bit audio-quality analog output with no external converter: the
  smart pin's dithered DAC takes a 16-bit number once per sample period, and a continuous signal
  is just the right sequence of numbers delivered on time. One shared output stage (dither mode +
  output config + P_OE, paced by the pin's IN flag) underlies five recipes chosen among by task:
  sample playback and waveform synthesis via a DDS phase accumulator, deliberate dither-mode +
  RC-filter choice for effective resolution, a real-time ADC->DAC passthrough, and software mixing
  with stereo panning. The DDS phase increment inc = f * 2^32 / sample_rate (Spin2 `frac`)
  decouples pitch from the sample rate; CORDIC QROTATE turns the phase into a sine in one op.
audience: [human, agent]

# ---- CONSUMPTION TIER: the composition recipe (LINKS to existing KB primitives) ----
