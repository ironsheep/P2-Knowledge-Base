    - architecture/smart-pins/smart-pin-00010-dac-16bit-pseudo-random-dither.yaml # PRNG dither %00010 (X=1 updates every clock)
    - architecture/smart-pins/smart-pin-00001-long-repository-or-dac-noise.yaml    # plain 8-bit DAC noise %00001
    - architecture/smart-pins/smart-pin-11000-adc-internal-clock.yaml          # ADC SINC2 filtering (Recipe 4 passthrough source)
    - architecture/cordic.yaml                        # the solver: QROTATE phase -> sine (R2/R5)
    - language/pasm2/wrpin.yaml                        # configure the DAC/ADC smart pin mode
    - language/pasm2/wxpin.yaml                        # set the sample period
    - language/pasm2/wypin.yaml                        # write the 16-bit DAC value / ADC period override
    - language/pasm2/rdpin.yaml                        # read the SINC2 accumulator (R4)
    - language/pasm2/setse1.yaml                       # select the DAC pin's IN-rising edge (sample clock)
    - language/pasm2/waitse1.yaml                      # wait one sample period
    - language/pasm2/qrotate.yaml                      # rotate (ampl,0) by phase -> sine/cosine
    - language/pasm2/getqy.yaml                        # read Y = ampl*sin(phase)
    - language/pasm2/getqx.yaml                        # read X = ampl*cos(phase)
    - language/pasm2/zerox.yaml                        # keep the 27-bit modular ADC differential (R4)
    - language/pasm2/muls.yaml                         # signed voice*weight in the mixer (R5)
    - language/pasm2/sar.yaml                          # fixed-point >>8 pan-weight divide (R5)
    - language/pasm2/fges.yaml                         # integer signed limit-minimum clamp (R5)
    - language/pasm2/fles.yaml                         # integer signed limit-maximum clamp (R5)
    - language/spin2/methods/qsin.yaml                 # fill a wavetable: length*sin(angle) (R1)
    - language/spin2/methods/muldiv64.yaml             # (code*Vfs)/65536 known-answer DC (Tier-0)
    - language/spin2/operators/op_FRAC.yaml            # DDS phase increment (x<<32)/y

