    category: 3D Model
    description_full: '3D Model file/s


      Parallax 3D Models are typically available in both STEP and VRML formats.


      STEP

      - Rendered with simplified objects, without text layers.

      - Ideal for mechanical use.

      - File size can be reasonably small.

      - Saved with file extension .step


      VRML

      - Rendered with maximum detail, including silk text and graphics layers.

      - Good for visual applications.

      - File size can be very large.

      - Saved with file extension .wrl

      - Export unit setting is millimeters.


      Making use of the 3D Models


      The Parallax 3D Models use standard 3D file formats, and should be viewable
      with your favourite 3D CAD software!

      For a quick start, download FreeCAD here : https://www.freecadweb.org/

      If you need a 3D Model that you can’t find here, please let us know at support@parallax.com


