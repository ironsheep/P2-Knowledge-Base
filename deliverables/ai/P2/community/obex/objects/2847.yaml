  title: VGA Text routines
  author: Eric R. Smith
  functionality:
    category: Display
    tags: []
    description_short: VGA text driver (ansi.spin2) with ANSI escape codes, four resolutions
      up to 1280x800, and 8x8, 8x16 and 16x32 fonts.
    description_full: 'The ansi.spin2 file provides a VGA text driver that supports
      standard ANSI escape codes for text effects (like changing colors, flashing,
      etc.). Resolutions of 640x480, 800x600, 1024x768, and 1280x800 are supported,
      as well as fonts at a variety of sizes (8x8, 8x16, and 16x32 ones are included).


      The default configuration is 1280x800 with a 16x32 font and 8bpp color; edit
      ansi.spin2 to modify this.


      demo.spin2 is a simple demo using the VGA tile driver directly as well as using
      the ANSI text object


      basdemo.bas is a demo in BASIC


      See Notes.md for more information.'
