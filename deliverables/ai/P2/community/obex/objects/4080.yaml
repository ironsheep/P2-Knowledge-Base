    description_short: Modified version of the TJpgDec JPEG decoder for FlexC on P2,
      decoding baseline JPEG images (no progressive).
    description_full: "Optimized/modified/bugfixed version of TJpgDec for FlexC on\
      \ P2.\n- Decodes baseline JPEG images (no progressive)\n- Neither source file\
      \ or destination bitmap need to be fully buffered in RAM\n- Very optimized\n\
      - Can decode to multiple color formats\n  - RGB888 (24 bit)\n  - ABGR8888 (P2\
      \ native 32 bit)\n  - RGB565 (P2 native 16 bit)\n  - RGB332 (P2 native 8 bit)\n\
      \  - 8 bit monochrome\n- Can decode at 1/2, 1/4 and 1/8 scale\n\nTODO insert\
      \ more documentation here.\n\nAlso see forum thread: https://forums.parallax.com/discussion/175326/sorta-optimized-jpeg-decoder"
