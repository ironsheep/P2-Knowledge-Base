  title: 64/96/128-Bit Unsigned Integer Math
  author: Chip Gracey
  functionality:
    category: Math
    tags: []
    description_short: Three objects providing unsigned functions for 64, 96, and
      128-bit integers, such as add, multiply, divide and log2.
    description_full: 'These three objects provide the following unsigned functions
      for 64, 96, and 128-bit integers:


      NEGQ() - negate

      ADDQ() - add

      SUBQ() - subtract

      CMPQ() - compare

      MAGQ() - magnitude

      SHLQ() - shift left

      SHRQ() - shift right

      MULQ() - multiply

      DIVQ() - divide

      LOGQ() - log2

      EXPQ() - exp2

      LongLSB() - extract long via LSB

      LongMSB() - extract long via MSB

      LongSHL() - left-shift long to make 64/96/128-bit value'
