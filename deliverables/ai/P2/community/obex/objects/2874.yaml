    description_short: BLDC motor driver with steering and position tracking, for
      the Parallax 64010 Universal Motor Driver P2 Add-on Boards.
    description_full: 'BLDC Motor Driver with steering and position tracking


      Ready-to-use objects easily incorporated into your code that control Brushless
      DC (BLDC) motors via the Parallax 64010 Universal Motor Driver P2 Add-on Boards
      (https://www.parallax.com/product/universal-motor-driver-p2-add-on-board/)


      Version: 5.0.0 Release Info (https://github.com/ironsheep/P2-BLDC-Motor-Control/releases)


      GitHub repository: P2 BLDC Motor Control (https://github.com/ironsheep/P2-BLDC-Motor-Control)

      - See Docs, Setup Instructions at Developing a P2 Application interacting with
      the new motor objects (https://github.com/ironsheep/P2-BLDC-Motor-Control/blob/main/DEVELOP.md)

      - Buy BLDC Motors at Parallax Online Store (https://www.parallax.com/product/6-5-hub-motors-with-encoders-and-mounting-blocks-bundle/)

      - Buy BLDC Motor Control Boards at Parallax Online Store (https://www.parallax.com/product/universal-motor-driver-p2-add-on-board/)


      NOTE: Always check for more recent releases at the project P2 BLDC Motor Control
      Repository (https://github.com/ironsheep/P2-BLDC-Motor-Control) - Releases Page
      (https://github.com/ironsheep/P2-BLDC-Motor-Control/releases)


      Forum Thread: Universal Motor Driver - Dual wheel steering, motor control, and
      position tracking Objects for P2 (https://forums.parallax.com/discussion/174516/universal-motor-driver-dual-wheel-steering-motor-control-and-position-tracking-objects-for-p2)


      What to download:


      There are three files available for download. Choose one or more of the three:

      - demo-1mot-archive-set.zip all the code needed to demo single-motor control
      and integrate one motor into your project.

      - demo-2mot-archive-set.zip the code for dual motor control

      - serial-control-archive-set.zip the code for RaspberryPi or Arduino control
      of a two-motor system (includes the dual motor control code)'
