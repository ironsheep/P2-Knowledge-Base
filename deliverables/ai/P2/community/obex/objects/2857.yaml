  title: RGBX Pixel Driver
  author: Jon McPhalen
  functionality:
    category: Display
    tags: []
    description_short: Driver for single-wire smart pixels (e.g., WS2812b), 24- and
      32-bit, with switchable LED buffers and output pins.
    description_full: This driver provides control of the most popular single-wire
      smart pixels (e.g., WS2812b) -- both 24- and 32-bit variants where applicable.
      Advanced controls allow the application to switch LED buffers for advanced animations
      effects, and to switch output pins for multi-output applications.
