object_metadata:
  object_id: '4266'
  title: Simplest Serial
  author: Ray Allen
  functionality:
    category: Protocol
    tags:
    - serial debug terminal
    description_short: Serial driver whose parameterless Begin() starts it on the
      usual pins at 2 MBaud, for the Prop Tool Debug Window.
    description_full: 'This serial driver has a simple Begin() method with no parameters
      that starts the serial driver using the usual pins and 2 MBaud (For use with
      the Prop Tool Debug Window).

      It also includes a couple methods that include a Spin2 debug statement that
      will enable the Prop Tool Debug Window, for cases where the main code doesn''t
      have one.


      One key caveat for using this is that Begin() must be called after every Spin2
      debug statement. Otherwise, there are cases where the code will freeze.

      Assembly debug statements do not appear to have this problem in tests to date.

      Also, some delays are nice to add after cogspin() and coginit() to avoid jumbling
      of their serial outputs with those of the code.'
