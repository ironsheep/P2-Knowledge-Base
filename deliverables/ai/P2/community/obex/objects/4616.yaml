    description_short: Add-on files for the OBEX ISP Hub75 Matrix Driver showing morphing
      digits, patterned after a morphing clock project.
    description_full: 'This project provides add-on files for use with the OBEX ISP
      Hub75 Matrix Driver (https://obex.parallax.com/obex/isp-hub75-matrix-driver/)


      Patterned after the morphing clock project at the Hackaday website (https://hackaday.com/2018/07/10/morphing-digital-clock-will-show-you-a-good-time/)


      This project is my nod to Hari Wiguna''s HariFun #165 video (https://www.youtube.com/watch?v=_DddhMh6kJc).
      I chose to implement this using table-driven animations, with the table generated
      by a Python script using "segment adjacency" along with "segment on/off changes
      from digit to digit" and using the types of animations that Hari used. You''ll
      find all the code I created in the project repository.


      Video Demo: This project in action (https://youtu.be/-zx-_Z1aoWY)


      Version: 1.0.0 Release Notes (https://github.com/ironsheep/P2-LED-Matrix-Morphing-Digits/releases/tag/v1.0.0)


      GitHub repository: P2 LED-Matrix Morphing Digits (https://github.com/ironsheep/P2-LED-Matrix-Morphing-Digits)


      See also the OBEX pages:

      - ISP Hub75 Matrix Driver (https://obex.parallax.com/obex/isp-hub75-matrix-driver/)


      DOWNLOAD: please download the latest code from the Repo (https://github.com/ironsheep/P2-LED-Matrix-Morphing-Digits).'
