    description_short: Generates Step/Dir signals for multiple axes, to drive stepper
      motor or servo drives.
    description_full: 'Step/Dir signal generator for multiple axes, can be used to
      drive stepper motor or servo drives

      Supports:

      - filtering to avoid acceleration peaks and allow smooth and jolt-free movement

      - Anti-aliasing with fractional steps per calculation cycle reduces jitter

      - high frequencies up to several MHz

      - 50% duty cycle and Dir changes in the middle of the step low-phase avoids
      setup/hold problems'
