    description_full: 'This object configures a P2 smart pin for quadrature encoder
      (value/position) mode. The object allows for value limits and dealing with encoders
      that change four counts per "click."


      Updated 23 SEP 2024. New version is identified with version # (1.1.1) and has
      Schmitt Trigger inputs enabled on encoder pins. Second demo added as well.'
