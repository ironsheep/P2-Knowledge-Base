    description_full: 'NeoGeo AES emulator for Parallax P2 + memory expansion.


      Requires some amount of HyperRAM or PSRAM, USB for inputs and VGA/HDMI or other
      video output.


      See README.MD for full details on usage.


      This OBEX entry is updated infrequently, see github for new bleeding edge versions:
      https://github.com/IRQsome/NeoYume/


      If you want, you may rip out, among other things...

      - a Motorola 68000 emulation

      - a Z80 emulation

      - a video driver supporting many different formats (including HDMI with audio!),
      optimized for scanline rendering'
    description_short: 'NeoGeo AES emulator for the Parallax P2, needing HyperRAM or PSRAM, USB inputs and VGA/HDMI or other video output.'
