    description_short: Spin2 object for the PCF8575, which provides general-purpose
      remote I/O expansion via the I2C-bus.
    description_full: 'The PCF8575 provides general-purpose remote I/O expansion via
      the two-line bidirectional bus (I2C-bus).


      This P2 object supports full interaction with the PCF8575 via a spin2 object.


      Version (Repository Latest)


      GitHub repository: P2 PCF8575 Object - I2C I/O port Expander (https://github.com/ironsheep/P2-VL53L5CX-time-of-flight-driver/blob/main/PCF8575.md)


      This object (in my case) is used in a larger project, which is referenced in
      the following forum thread:

      Forum Thread: 180° Field of View Time-of-Flight sensor for the P2 (https://forums.parallax.com/discussion/174860/180-field-of-view-time-of-flight-sensor-for-the-p2#latest)'
