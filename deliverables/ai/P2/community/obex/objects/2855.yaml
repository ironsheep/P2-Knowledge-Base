object_metadata:
  object_id: '2855'
  title: LPD8806 “Smart” Pixel Driver
  author: Jon McPhalen
  functionality:
    category: Display
    tags: []
    description_short: Controls LPD880x pixels from the P2 with auto-updating output
      and methods for setting pixels to specific colors.
    description_full: 'This object allows the P2 to control LPD880x pixels. The output
      is auto-updating which allows the programmer to manually manipulate the color
      buffer for advanced applications. Standard interface methods for setting pixels
      to specific colors are included.


      Note: The LPD880x vendor does not publish a protocol specification for these
      pixels. This code is based on work done by others -- some of whom have reverse-engineered
      the protocol from LPD880x-compatible controllers.'
