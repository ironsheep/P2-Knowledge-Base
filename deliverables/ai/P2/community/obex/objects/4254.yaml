  title: ISP P2 eInk Driver
  author: Stephen M Moraco
  functionality:
    category: Display
    tags:
    - Click
    - eInk
    - SPI
    description_short: Spin2 driver supporting all eInk displays sold by Parallax
      or Mikroe, begun as a port of 2.13" eINK C example code.
    description_full: 'A working driver for the P2 developed in spin2. It started
      as a port of the C example code for the 2.13" eINK display, which Parallax ships.
      It has been extended to add capabilities to create more creative displays. It
      supports all eInk displays sold by Parallax.com (https://www.parallax.com/product-category/propeller-2/click-boards/)
      or by Mikroe.com.


      Version: 0.9.2 Release Notes (https://github.com/ironsheep/P2-Click-eInk/releases/tag/v0.9.2)


      GitHub repository: P2-Click-eInk (https://github.com/ironsheep/P2-Click-eInk)


      See repository for supported hardware and much more detailed documentation.


      Forum Thread: P2 .spin2 driver for eINK adapter Click board™ (https://forums.parallax.com/discussion/174644/new-p2-spin2-driver-for-eink-adapter-click-board#latest)'
