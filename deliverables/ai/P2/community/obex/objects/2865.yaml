    description_short: P2 port of an emulation of the SN76489 programmable sound generator,
      running in a single cog.
    description_full: 'An emulation of the SN76489 programmable sound generator running
      in a single cog.


      SNEcog (SN Emulator cog) v0.6 features:

      - Runs in one cog

      - Small size

      - 176.4 kHz or better sample rate for "aliasing free" sound generation

      - Can be programmed in the EXACT same way as a real SN76489


      (Have a look at the official documentation for a better understanding)


      SN76489 and variants were used in:

      - Acorn BBC

      - IBM PCjr

      - Colecovision

      - Sord M5

      - Tandy home computer

      - TI-99/4A

      - Memotech MTX-500

      - VTech Creativision

      - Sega SG-1000

      - Sega SC-3000

      - Sega Master System

      - Sega Game Gear

      - Sega Genesis / Mega Drive (it used the SN76489 for SMS compability and some
      FX in games)


