    description_full: 'P2GUI


      P2GUI  is a framework for creating UI’s based on TFT screens driven with ILI9341.
      This framework is based on the driver created by Greg LaPolla (https://obex.parallax.com/obex/ili9341_xpt2046/)
      which includes a Touchscreen driver for the XPT2046. There are two versions
      of this framework, one that uses the touchscreen and this one which uses an
      encoder with a push button to interact with the UI. Because most TFT displays
      that use the ILI9341 chipset are usually small in size, it makes sense to use
      an encoder as the interaction method to avoid inaccuracies when using touchscreen,
      specially with small widgets. The encoder is handled using jm_quadrature object
      from JonnyMac.


      This project uses one cog for the display driver. Everything else is handled
      in the user application cog with non-blocking timers (using Neotimer (https://obex.parallax.com/obex/neotimer-non-blocking-timer/)).


      Demo Video (https://youtu.be/BeWfJdWvDSI?si=IQvldnaHIP5XKTW3)


      Documentation:

      P2GUI_Encoder (https://docs.google.com/document/d/1wt4jYC5TFeXyjOAGZO4CwaMJQyyFV21zKpH-aUASRCQ/edit?usp=sharing)'
