    description_short: Object for the ADS1118 16-bit analog-to-digital converter (ADC).
    description_full: The ADS1118 is a precision, low power, 16-bit analog-to-digital
      converter (ADC) that provides all features necessary to measure the most common
      sensor signals in an ultra-small, leadless X2QFN-10 package or a VSSOP-10 package.
      The ADS1118 integrates a programmable gain amplifier (PGA), voltage reference,
      oscillator and high-accuracy temperature sensor. These features, along with
      a wide power supply range from 2 V to 5.5 V, make the ADS1118 ideally suited
      for power- and space- constrained, sensor-measurement applications.
