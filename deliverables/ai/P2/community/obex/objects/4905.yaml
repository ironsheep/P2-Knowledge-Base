    description_short: Diptrace library of Parallax Propeller 2 schematic symbols,
      patterns and 3D models.
    description_full: 'Parallax Propeller 2 Library for Diptrace includes schematic
      symbols, patterns and 3D models


      Typical installation instructions:

      1. Download and unzip the library folder

      2. Copy the Diptrace folder into your Windows "My Documents" Diptrace folder

      3. Start Diptrace and find the Parallax P2 library listed under User Components
      and User Patterns (or add the library in the Library Tools menu if required)


      Tip: If the 3D models do not appear automatically, you might need to adjust
      the 3D model URL to match your local drive structure. Use the Diptrace Pattern
      Editor, open each part and click "3D model" to set the correct URL, then click
      "Load Model" to verify.'
