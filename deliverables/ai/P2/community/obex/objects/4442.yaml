    description_full: "Further reading - https://forums.parallax.com/discussion/174441/measuring-floating-pin-voltage-adc-from-just-the-built-in-comparator/p1\n\
      \npub  sar_adc( pinnum ) : level | bit\n' This routine makes use of the comparator's\
      \ unloaded inputs\n' to measure the floating voltage of the pin.\n' Returns\
      \ an unsigned 8-bit value in \"level\", GIO to VIO volts\n'\n  pinf( pinnum\
      \ )\n  level := 0\n\n  repeat bit from 7 to 0\n    wrpin( pinnum, P_LEVEL_A\
      \ | ((level | (1<<bit)) << 8) )    ' set comparator DAC level\n    waitus(2)\
      \                         ' DAC settle time is about 1.0 us\n    level |= pinr(\
      \ pinnum ) << bit    ' pin voltage higher than comparator's DAC\n\n  wrpin(\
      \ pinnum, 0 )    ' clean up"
    description_short: 'com/discussion/174441/measuring-floating-pin-voltage-adc-from-just-the-built-in-comparator/p1
