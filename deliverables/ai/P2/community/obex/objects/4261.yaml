    description_short: Wear-leveling filesystem for the P2 Edge on-board flash chip,
      with a standard filesystem API and multi-cog access.
    description_full: 'A wear-leveling filesystem for the P2 Edge on-board flash chip.
      Supports multi-cog access without consuming a Cog.

      This is the formal release of Chips Flash Filesystem with a standard filesystem
      API.

      It compiles with FlexProp and Parallax tools.


      This fully qualified driver is supported by hundreds of regression test steps
      covering all functionality. The tests and test logs can be found in the GitHub
      repo.


      Jon McPhalens'' shell demo is included in cgsm_flash_file_demo.zip.


      Version 2.0.0 Release Info (https://github.com/ironsheep/P2-FLASH-FS/releases)


      GitHub repository: P2 Flash FS (https://github.com/ironsheep/P2-FLASH-FS)


      See the repository for detailed documentation such as How to use in your code
      (https://github.com/ironsheep/P2-FLASH-FS#adding-the-flash-fs-to-your-own-project),
      the Theory of Operation (https://github.com/ironsheep/P2-FLASH-FS/blob/main/THEOPS.md),
      Regression Testing Status (https://github.com/ironsheep/P2-FLASH-FS/blob/main/RegresssionTests),
      etc.


      Forum Thread: On-Board Flash File System (https://forums.parallax.com/discussion/175470/on-board-flash-file-system#latest)'
