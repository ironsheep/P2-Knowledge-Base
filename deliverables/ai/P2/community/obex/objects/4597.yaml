    description_short: Spin2 object that controls Breadboard Mates (BBM) TIMI displays
      over serial after their screens are programmed.
    description_full: 'Breadboard Mates (BBM) (https://breadboardmates.com/) produces
      the TIMI line of displays. These are similar to the Nextion devices we''ve seen
      in that we select the screens to be displayed and upload them to the device
      (essentially flashing the device.) Then, we connect the device containing the
      screens to our project via serial and simply send values to the screen fields
      or labels.


      This object provides full control over the TIMI displays after they are programmed.


      Version (repository latest)


      GitHub repository: P2 TIMI Spin2 Object (https://github.com/ironsheep/P2-mult-servo-exerciser/blob/main/TIMI.md)


      This object (in my case) is used in a larger project, which is referenced in
      the following repository:

      GitHub repository: P2 Multi-servo Exerciser (https://github.com/ironsheep/P2-mult-servo-exerciser/tree/main)'
