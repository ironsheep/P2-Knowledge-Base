    description_full: 'P2 VL53L5CX Object - A Port of the VL53L5CX I/F library/downloader
      to Spin2/Pasm2


      (...Excerpt from STMicroelectronics webpage (https://www.st.com/en/imaging-and-photonics-solutions/vl53l5cx.html))


      The VL53L5CX is a state-of-the-art, Time-of-Flight (ToF), multizone ranging
      sensor. Unlike conventional IR sensors, the VL53L5CX allows absolute distance
      measurement whatever the target color and reflectance. It provides accurate
      ranging up to 400 cm and can work at fast speeds (60 Hz). Multizone distance
      measurements are possible up to 8x8 zones with a wide 63° diagonal FoV, which
      can be reduced by software. The VL53L5CX is able to detect different objects
      within the FoV.


      Version (repository latest)


      GitHub repository: P2-VL53L5CX-time-of-flight-driver (https://github.com/ironsheep/P2-VL53L5CX-time-of-flight-driver/blob/main/VL53L5CX.md)


      This object (in my case) is used in a larger project which is referenced in
