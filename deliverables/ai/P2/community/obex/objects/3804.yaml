    description_short: Calculates clock mode component values with pllset() to set
      a requested clock frequency via clkset().
    description_full: 'pllset()

      Calculates appropriate clock mode component values to set a requested clock
      frequency via clkset(). Based heavily on Chip''s original Delphi code but with
      added runtime determination of board crystal mode and frequency. Relies on compile
      time clock config correctly matching the actual board.


      muldiv65()

      Performs same function as muldiv64() but with rounding to nearest.


      div33()

      Performs a 32-bit integer divide but with rounding to nearest.'
