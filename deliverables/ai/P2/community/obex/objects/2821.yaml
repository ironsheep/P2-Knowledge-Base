object_metadata:
  object_id: '2821'
  title: DHTxx Temperature/Humidity Sensors
  author: Jon McPhalen
  functionality:
    category: Sensor
    tags: []
    description_short: Interfaces the P2 with DHT11 and DHT22/CM2302 sensors, returning
      temperature and humidity in 0.1-degree and 0.1% units.
    description_full: 'This object allows the P2 to interface with DHT11 and DHT22/CM2302
      sensors for projects requiring the monitoring of temperature and relative humidity.
      With either sensor type, temperature and humidity is returned in 0.1-degree
      and 0.1% units.


      Code is compatible with Parallax PN 28059 (DHT22/CM2302).'
