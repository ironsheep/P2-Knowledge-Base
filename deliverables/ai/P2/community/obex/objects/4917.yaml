object_metadata:
  object_id: '4917'
  title: Sharing variables with SPIN2 and PASM2
  author: Michael
  functionality:
    category: Snippet
    tags: []
    description_short: Tip showing SPIN2 in Cog0 and PASM2 in Cog1 sharing the same
      global variables (PARAM), observed via DEBUG output.
    description_full: 'Instructions


      Connect a P2 Propeller Board to your computer

      Load this code into Spin Tools IDE (https://www.maccasoft.com/spin-tools-ide/),
      then press CTRL+F10 to load into RAM with DEBUG mode enabled

      Observe the debug output!


      Summary of demonstration


      The SPIN2 code runs in Cog0, and is contained within the "Main()" routine.

      The PASM2 code runs in Cog1, and is contained within the DAT block


      Both Cogs share access to the same global variables, "PARAM"

      The address in memory for the PARAM variables is passed to the PASM2 Cog when
      it is loaded


      SPIN2 accesses the PARAM values directly: PARAM[ID], PARAM[AGE], etc..

      PASM2 accesses the PARAM values with a pointer called PTRA: PTRA[ID], PTRA[AGE],
      etc..


      The PASM2 Cog1 increments the ID value twice a second, and the result is seen
      in the SPIN2 Cog

      The SPIN2 Cog0 increments the AGE value when ID is divisible by 5, and the result
      is seem in the PASM2 Cog


      This demonstrates how to share any number of global variables when working with
      SPIN2 and PASM2


      Note: You could use any name you like for the global "PARAM" variable, or the
      elements "ID", "AGE", etc... However, the PTRA keyword within the DAT block
      (PASM2 code) is fixed.'
