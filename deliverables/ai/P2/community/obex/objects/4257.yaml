object_metadata:
  object_id: '4257'
  title: ISP high-speed 8-port serial subsystem
  author: Stephen M Moraco
  functionality:
    category: Protocol
    tags:
    - Serial
    - smart-pin
    description_short: Serial subsystem in which a single COG services 1 to 8 Tx/Rx
      smart-pin pairs; pasm2 backend, spin2 interface routines.
    description_full: '8 Serial Ports using a single COG


      A single COG services from 1 to 8 Tx/Rx pairs of pins. The pins are configured
      as smart pins, meaning that the driver feeds bytes to transmit pins when needed
      and gets bytes from receiving pins when bytes are available. This backend driver
      is written in pasm2. The interface routines are written in spin2.


      Version: 1.0.2 Release Notes (https://github.com/ironsheep/P2-OctoSerial-subsystem/releases/tag/v1.0.2)


      This is a fully qualified driver. Performance Measurement (https://github.com/ironsheep/P2-OctoSerial-subsystem/blob/main/VERIFY.md)
      - see timing information from measurements taken on 8-port test system.


      GitHub Repository: P2 OctoSerial Subsystem (https://github.com/ironsheep/P2-OctoSerial-subsystem)

      See the repository for more detailed documentation, code for exercising two
      P2 edge modules with 8 serial ports wired between them, code for Raspberry Pi
      instead of the 2nd P2, and possibly later releases.'
