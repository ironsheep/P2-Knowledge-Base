    description_full: 'Driver for BH1750 Ambient Light Sensor accessed via I2C - (uses
      underlying jm_i2c object for I2C access)


      Version: (repository Latest)


      GitHub repository: P2 HUB75 Panel Light Measure (https://github.com/ironsheep/P2-Panel-Light-Measure)


      This object (in my case) is used in a larger project where I''m measuring the
      light output of our HUB75 matrix panels. I created 3D-printed fixtures to hang
      on the panels, which contain the BH1750 sensors.

      All of the code I used, the STL files for the fixtures, and the entire project
      description are found at the Repo (https://github.com/ironsheep/P2-Panel-Light-Measure).'
