    category: Protocol
    description_full: 'This group of modular objects is designed to interface with
      an ESP32 microcontroller using a 2 pin serial UART. It is designed for the default
      ESP32 "AT firmware", by Espressif, which is the default on most modules.


      Information on the AT commands can be found here: https://www.espressif.com/sites/default/files/documentation/esp32_at_instruction_set_and_examples_en.pdf.
      It is flashed by default on the majority of commercial ESP32 modules.


      This is a modular spin2 object, not all of its functionality is contained within
      one file, so that you can save program memory and only use what you need. To
      use this object, import esp32_core to set up serial and interface with the ESP32.
      For wifi functionality, import esp32_wifi. For TCP/IP networking, import esp32_tcpip.
      For TCP server functionality, import esp32_tcpip_tl2_beta.'
    description_short: 'Modular objects that interface with an ESP32 over a 2 pin serial UART, for the default Espressif "AT firmware".'
