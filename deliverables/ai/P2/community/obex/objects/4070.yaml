    description_full: 'The MFRC522’s internal transmitter is able to drive a reader/writer
      antenna designed to

      communicate with ISO/IEC 14443 A/MIFARE cards and transponders without additional

      active circuitry. The receiver module provides a robust and efficient implementation
      for

      demodulating and decoding signals from ISO/IEC 14443 A/MIFARE compatible cards
      and

      transponders. The digital module manages the complete ISO/IEC 14443 A framing
      and

      error detection (parity and CRC) functionality.'
