    description_full: 'This object updates the rctime object from the P1 library for
      the P2 processor.


      It uses a Smart pin configured with Schmitt trigger to count pin high states
      and generate an interrupt signal which launches an isr to save the clock count
      and then recharge the rc circuit.


      The code remains resident in cog RAM and runs in the background using a small
      number of registers beginning at $1B0.'
    description_short: 'P2 update of the rctime object from the P1 library, using a Smart pin with Schmitt trigger and an isr.'
