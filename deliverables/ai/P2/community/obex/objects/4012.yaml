    description_short: Example drawing 3072 16x16 sprites at 640x480 32bpp on 4 cogs
      at 252 MHz, using a p2videodrv scanline renderer.
    description_full: 'A small example that shows:

      - How to set up a scanline renderer with p2videodrv (in full-res VGA modes,
      anyways...)

      - How to draw thousands of small sprites using optimized data structures


      Draws 3072 16x16 sprites at 640x480 in 32bpp mode (using WMLONG-style transparency)
      using 4 cogs at 252 MHz.


      Also see associated forum thread: https://forums.parallax.com/discussion/175535/3072-sprites-demo/p1


      Note: If your sprites are stuck and don''t move, update your flexspin 🙂'
