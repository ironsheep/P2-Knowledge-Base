    description_short: Supports the MAVLink 1.0 and 2.0 protocols for the P2, with
      a COMMON dialect handler, sender and message parser.
    description_full: 'This object supports the MAVLink 1.0 and 2.0 protocols for
      the P2. It provides the following:

      - Protocol handler for the COMMON dialect (refer to https://mavlink.io/en/messages/#dialects
      for dialects)

      - Sender for all messages in the common dialect

      - Message parser for receiving incoming mavlink messages

      - Skeleton for a message handler for converting incoming mavlink messages into
      structs so your vehicle or ground control station can use them'
