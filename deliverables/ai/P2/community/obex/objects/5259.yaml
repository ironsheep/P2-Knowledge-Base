object_metadata:
  object_id: '5259'
  title: BNO08x IMU (9 DOF) (RVC Mode)
  author: Jon McPhalen
  functionality:
    category: Sensor
    tags:
    - BNO08x
    - IMU
    - jonnymac
    - Sensor
    - Serial
    - smart-pin
    description_short: Reads Yaw, Pitch, Roll and X/Y/Z acceleration from BNO08x RVC
      (serial) output via Smart Pin serial RX, without a cog.
    description_full: 'This object takes advantage of the BNO08x RVC (serial) output
      to provide Yaw, Pitch, Roll, X acceleration, Y acceleration, and Z acceleration
      using Smart Pin serial RX without a cog. This is possible because each packet
      is framed with a specific, two-byte header ($AAAA) which is very easy to detect.
      Sensor values are provided in 16-bit signed format and converted by the object
      to signed longs.


      The demo program uses the P2 Debug Terminal window which has been tested with
      Propeller Tool v2.93, PNut v51, and Spin Tools v0.48.1.'
