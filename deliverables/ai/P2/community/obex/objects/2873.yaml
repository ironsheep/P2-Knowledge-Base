object_metadata:
  object_id: '2873'
  title: ISP PCA9685 16ch PWM Servo Driver
  author: Stephen M Moraco
  functionality:
    category: Motor Control
    tags:
    - I2C
    - PWM
    - Servo
    description_short: Driver for 16 channels of servo control via I2C using the PCA9685
      16ch PWM chip.
    description_full: 'Driver for 16 channels of servo control via I2C using the PCA9685
      16ch PWM chip (uses underlying singleton version adapted from jm_i2c driver
      for I2C access)


      Version: (Repository Latest)


      GitHub repository: P2-PCA9685-Servo-Driver (https://github.com/ironsheep/P2-PCA9685-Servo-Driver/tree/main)


      This object (in my case) is used in a larger project in which I drive a servo-controlled
      arm to test orientation sensing chips while developing P2 objects. I also use
      the FlySky R/C controller to control arm positioning interactively. This code:
      arm demo with FlySky controller using the PCA9685-controlled servos is all found
      at the project Repo (https://github.com/ironsheep/P2-PCA9685-Servo-Driver/tree/main).


      See also the OBEX page(s):

      - ISP P2 Multi Servo Exercisor (https://obex.parallax.com/obex/isp-p2-multi-servo-exercisor/)


      Related:

      - See Docs, Example Code at P2 PCA9685 Servo Driver Github Repository (https://github.com/ironsheep/P2-PCA9685-Servo-Driver)

      - NXP Manuf Datasheet: PCA9685: 16-Channel, 12-Bit PWM Fm+ I²C-Bus LED Controller
      (https://www.nxp.com/products/power-management/lighting-driver-and-controller-ics/ic-led-controllers/16-channel-12-bit-pwm-fm-plus-ic-bus-led-controller:PCA9685)

      - Shop at Adafruit: Adafruit 16-Channel 12-bit PWM/Servo Driver - I2C interface
      - PCA9685 (https://www.adafruit.com/product/815)

      - Shop at Amazon: HiLetgo 2pcs PCA9685 16 Channel 12-Bit PWM Servo Motor Driver
      IIC Module (https://www.amazon.com/HiLetgo-PCA9685-Channel-12-Bit-Arduino/dp/B07BRS249H)'
