  - offset: 6
    signal: "Uncommitted I/O (prototyping)"
    notes: "Header I/O pin brought to the prototyping grid; function determined by user wiring."
  - offset: 7
    signal: "Uncommitted I/O (prototyping)"
    notes: "Header I/O pin brought to the prototyping grid; function determined by user wiring."

# --- Power/ground rails available at the grid ---
power_rails:
  source: "P2 Eval Add-on Boards (#64006 Series) v2.0 1/12/2021, P2 Eval Mini Prototyping Add-on Board (#64006E), p.6. Host VIO rail: Propeller 2 Eval Board Rev C (64000) v2.0 29/6/2020, Key Specifications (\"VIO power supplies: 3.3 V up to 300 mA per 8 I/O pins\"), p.2"
  ground:
    label: "GND"
    marking: "White silk blocks on the top side"
    connectivity: "Connected on both sides of the PCB"
    purpose: "Distributed ground access throughout the grid"
  vio:
    label: "VIO"
    voltage: "3.3V (host VIO)"
    marking: "Holes inside a white box are joined to the marked VIO supply"
  five_volt:
    label: "5V"
    voltage: "5V (host 5V)"
    marking: "Holes inside a white box are joined to the marked 5V supply"

# --- Prototyping grid + joined-hole / ground-strip detail ---
prototyping_grid:
  source: "P2 Eval Add-on Boards (#64006 Series) v2.0 1/12/2021, P2 Eval Mini Prototyping Add-on Board (#64006E), p.6"
  dimensions: "8x12 grid of plated thru-holes"
  total_holes: 96
  hole_spacing: "0.1 inch (2.54mm) standard"
  hole_plating: "Through-hole plated for reliable connections"
  joined_holes:
    white_box: >-
      Holes inside a white box are joined to the marked signal or power
      (5V, VIO, and I/O pins 0-7).
    dash_box: >-
      Holes marked with silk dashes/boxes are joined to each other but NOT to
      any signal. These groups are linked by bottom-side copper traces and are
      isolated for easy cutting.
    trace_cutting: "Bottom-side copper traces can be cut to isolate joined-hole groups for custom routing."
  ground_strip: >-
    One exposed ground strip on the bottom side allows bridging neighboring
    thru-holes to Ground.

specifications:
  source: "P2 Eval Add-on Boards (#64006 Series) v2.0 1/12/2021, P2 Eval Mini Prototyping Add-on Board (#64006E), p.6, and the shared connector / compatibility / mounting facts, p.1. Host VIO rail: Propeller 2 Eval Board Rev C (64000) v2.0 29/6/2020, Key Specifications (\"VIO power supplies: 3.3 V up to 300 mA per 8 I/O pins\"), p.2"
  requires_host: true
  io_pins_used: 8
  compatible_hosts:
    - "P2 Eval Board (64000)"
    - "P2 Edge Module Breadboard (64020)"
    - "P2 Edge Mini Breakout Board (64019) with P2 Edge Module"
  electrical:
    supply_voltage: "3.3V (VIO) and 5V from host"
    current_consumption: "User-defined (depends on prototyped circuits)"
  physical:
    connector: "2x6 pass-through socket"
    mounting: "No mounting hole - the ONLY #64006 add-on board without one"

