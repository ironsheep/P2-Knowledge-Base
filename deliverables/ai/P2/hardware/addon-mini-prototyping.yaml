description: >-
  An 8x12 grid of plated thru-holes for custom prototyping. The 8 header I/O
  pins (offsets 0-7) plus 5V, VIO, and GND are brought to the grid.
  There is no fixed signal assignment
  - the eight I/O pins are raw, uncommitted prototyping I/O whose function is
  determined entirely by the user's wiring.
# Source: P2 Eval Add-on Boards (#64006 Series) v2.0 1/12/2021, P2 Eval Mini Prototyping Add-on Board (#64006E), p.6

# --- Eval-header board model (uniform across all #64006 / eval-header occupants) ---
eval_header_occupant: true
pin_group:
  size: 8
  addressing: >-
    actual_P2_pin = base_pin + offset. The board brings eight I/O pins to the
    grid by OFFSET within an 8-pin eval-header group; the user chooses which
    header (base_pin) it plugs into. base_pin is the first pin of that group.
  base_pin_options: [0, 8, 16, 24, 32, 40, 48, 56]
  source: "Propeller 2 Eval Board Rev C (64000) v2.0 29/6/2020, 11. I/O Pin Breakout Edge Headers, p.9 (each edge header carries one group of eight pins); board photograph, p.1 (edge-header silkscreen P0-P7 ... P56-P63); I/O Pin Assignments (P0-P55 fully free; Alternative functions for P56-P63), p.15"
  p56_p63_caution: 'base_pin 56 is the Eval Board''s dedicated group P56-P63, which the Eval Board routes to its own circuits: P58-P61 are the boot flash and microSD SPI lines, P62/P63 the PC-USB serial link (P2 TXD/RXD), every pin P56-P63 drives an on-board buffered LED, and P57 can be routed to the common LDO enable (a user option, not connected by default). A board fitted there shares those pins with those circuits. P0-P55 are the fully free pins.'
  base_pin_caution: >-
    Group 56-63 (Header H): P58-P63 are shared with the host's Flash SPI and
    serial pins - not recommended.

signal_map:
  - offset: 0
    signal: "Uncommitted I/O (prototyping)"
    notes: "Header I/O pin brought to the prototyping grid; function determined by user wiring."
  - offset: 1
    signal: "Uncommitted I/O (prototyping)"
    notes: "Header I/O pin brought to the prototyping grid; function determined by user wiring."
