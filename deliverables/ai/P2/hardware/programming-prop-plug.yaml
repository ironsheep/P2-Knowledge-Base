component: Prop Plug Rev E
part_number: "32201"
hardware_revision: "Rev E"
series: "Parallax Programming Tools"
manufacturer: "Parallax Inc."
status: "active_production"
p2kb_key: "p2kbHwProgrammingPropPlug"
category: programming_tool
aliases:
  - "Prop Plug"
  - "PropPlug"
  - "Prop Plug Rev E"
  - "USB to serial programmer"
  - "Propeller programming adapter"
  - "FTDI FT231X programmer"
  - "P2 programmer"
  - "USB serial adapter"
  - "32201"
  - "#32201"

# NOTE: This is a USB-to-serial PROGRAMMING ADAPTER, not a P2 accessory-header
# add-on board. It connects to a target's 4-pin programming header.
eval_header_occupant: false

# 4-pin female SIP socket (board silk, top->bottom) and the target connection
# shown in the guide's Interface-to-Propeller figure.
header_pinout:
  - {pad: "RX", direction: "in (to Prop Plug)", connects_to: "Propeller TX = P30", notes: "PropPlug RX / Propeller TX."}
  - {pad: "TX", direction: "out (from Prop Plug)", connects_to: "Propeller RX = P31", notes: "PropPlug TX / Propeller RX."}
  - {pad: "RES", direction: "out (from Prop Plug)", connects_to: "Propeller RESn (reset)", notes: "DTR-controlled reset pulse by default (see reset_option)."}
  - {pad: "VSS", direction: "-", connects_to: "GND", notes: "Common ground."}
p2_note: >-
  The guide's Interface figure illustrates a Propeller 1 (DIP-40) target; P2
  programming uses the same four signals against the P2's serial programming pins.
  Corroborated as the typical P2 Edge programmer by the #64010 and #64007 guides.

drivers:
  requirement: "FTDI USB drivers required"
  source: "https://www.parallax.com/usbdrivers (Windows + Mac)"
  macos: "macOS 10.15 Catalina and later: drivers included in the OS, no install needed"
  note: "Parallax software that relies on the FTDI drivers normally installs them automatically."

required_parts:
  - {part: "805-00016", role: "USB A to micro-B cable - required, NOT included"}
related_parts:
  - {part: "32200", role: "Prop Clip - predecessor / related product"}
  - {part: "32420", role: "WX Wi-Fi Module - SIP first-4-pins (GND/RES/DI/DO) Prop-Plug-compatible for reflashing"}

use_cases:
  primary:
    - "In-system programming of P1/P2 circuits via the 4-pin header"
    - "Serial communication / debug between a PC and a Propeller target"
  secondary:
    - "Reflashing the WX Wi-Fi module (#32420) firmware via its breadboard header"

limitations:
  - "USB A->micro-B cable (#805-00016) not included"
  - "Requires the target to expose a 4-pin programming header (RX/TX/RES/VSS)"
  - "Requires FTDI drivers (auto-installed by most Parallax software; built in on macOS 10.15+)"

documentation:
  primary: "32201 Prop Plug Guide v3.0 (Parallax, Rev E, 2021-02-03)"

resources:
  product_page: "www.parallax.com (search 32201) - schematic, prior-version docs, resources"

see_also:
  - hardware/addon-wx-wifi.yaml

ecosystem_position: "programming_adapter"
hardware_family: "parallax_programming_tools"
size_class: "tool"
interface_type: "usb_serial"
