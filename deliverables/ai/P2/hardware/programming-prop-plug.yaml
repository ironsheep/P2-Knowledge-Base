# NOTE: This is a USB-to-serial PROGRAMMING ADAPTER, not a P2 accessory-header
# add-on board. It connects to a target's 4-pin programming header.
eval_header_occupant: false

description:
  source: >-
    32201 Prop Plug Guide v3.0 (Parallax Inc., Rev E, 2021-02-03), Overview and
    "What's new in Rev E" --
    engineering/ingestion/sources/propplug-rev-e/complete-propplug-rev-e-reference.md:20-37.
  text: >-
    USB-to-serial adapter for microcontroller programming and communication. It
    slips onto a 4-pin, 0.1 inch spaced male header, providing in-system
    programming of Propeller circuits in breadboard, perf-board and permanent
    projects that carry the four-pin header. Capable of asynchronous communication
    at up to 3 Mbaud with both 3.3 V and 5.0 V devices. Rev E uses the FTDI FT231X
    USB bridge IC (USB 2.0 Full Speed) and therefore requires FTDI USB drivers.
    New in Rev E: pin labelling on both sides of the board, two-sided TX/RX
    activity LEDs visible from either side, buffered inputs and outputs to improve
    isolation between the Prop Plug and the target board when either is powered
    down, and a customer-selectable reset option pad (see reset_option).

reset_option:
  source: >-
    32201 Prop Plug Guide v3.0 (Parallax Inc., Rev E, 2021-02-03),
    "Customer Reset Option (new in Rev E)" --
    engineering/ingestion/sources/propplug-rev-e/complete-propplug-rev-e-reference.md:74-84;
    pulse width also in the Specifications table, :50.
  default: "DTR-controlled reset - the component sits to the LEFT of the option pad, connecting RES and DTR. This is how every previous version behaved."
  alternative: "RTS-controlled reset - move the component to the RIGHT, connecting RES and RTS."
  disabled: "No reset pulse - remove the component."
  pulse: >-
    The reset circuitry generates a short pulse when the USB DTR signal toggles
    low to high: approximately 20 us typical, varying with the target circuit
    (15-25 us).
  marking: "a white silk area is provided for marking units configured differently from the default."

specifications:
  source: >-
    32201 Prop Plug Guide v3.0 (Parallax Inc., Rev E, 2021-02-03),
    Specifications table --
    engineering/ingestion/sources/propplug-rev-e/complete-propplug-rev-e-reference.md:39-55.
  power_requirements: "powered by the USB port (5 VDC)"
  current_requirements: "approximately 15 mA typical"
  usb_interface: "USB 2.0 Full Speed"
  uart_interface: "true 3.3 V CMOS drive output and TTL input"
  rx_input: "buffered; compatible with 3.3 V and 5 V signals; tolerant to 5.5 V"
  activity_leds: "TX and RX, visible from either side of the board"
  communication_speed: "asynchronous serial, 300 baud to 3 Mbps"
  reset_pulse_width: "approximately 20 us typical (varies with the target circuit; 15-25 us)"
  connection: "USB micro-B; 4-pin female SIP socket, 0.1 inch spacing"
  usb_bridge_ic: "FTDI FT231X"
  operating_temperature: "-40 to +85 C (-40 to +185 F)"
  pcb_dimensions: "0.93 x 0.48 in (23.5 x 12.1 mm)"
  dimensions_with_connectors: "approximately 1.3 x 0.48 in (33 x 12.1 mm)"

# 4-pin female SIP socket (board silk, top->bottom) and the target connection
# shown in the guide's Interface-to-Propeller figure.
header_pinout:
  - {pad: "RX", direction: "in (to Prop Plug)", connects_to: "Propeller TX = P30", notes: "PropPlug RX / Propeller TX."}
  - {pad: "TX", direction: "out (from Prop Plug)", connects_to: "Propeller RX = P31", notes: "PropPlug TX / Propeller RX."}
  - {pad: "RES", direction: "out (from Prop Plug)", connects_to: "Propeller RESn (reset)", notes: "DTR-controlled reset pulse by default (see reset_option)."}
  - {pad: "VSS", direction: "-", connects_to: "GND", notes: "Common ground."}
p2_note: >-
  The guide's Interface figure illustrates a Propeller 1 (DIP-40) target; P2
  programming uses the same four signals against the P2's serial programming pins.
  Corroborated as the typical P2 Edge programmer by the #64010 and #64007 guides.

drivers:
  requirement: "FTDI USB drivers required"
  source: "https://www.parallax.com/usbdrivers (Windows + Mac)"
  macos: "macOS 10.15 Catalina and later: drivers included in the OS, no install needed"
  note: "Parallax software that relies on the FTDI drivers normally installs them automatically."

required_parts:
  - {part: "805-00016", role: "USB A to micro-B cable - required, NOT included"}
related_parts:
  - {part: "32200", role: "Prop Clip - predecessor / related product"}
  - {part: "32420", role: "WX Wi-Fi Module - SIP first-4-pins (GND/RES/DI/DO) Prop-Plug-compatible for reflashing"}

use_cases:
  primary:
    - "In-system programming of P1/P2 circuits via the 4-pin header"
    - "Serial communication / debug between a PC and a Propeller target"
  secondary:
    - "Reflashing the WX Wi-Fi module (#32420) firmware via its breadboard header"

limitations:
  - "USB A->micro-B cable (#805-00016) not included"
  - "Requires the target to expose a 4-pin programming header (RX/TX/RES/VSS)"
  - "Requires FTDI drivers (auto-installed by most Parallax software; built in on macOS 10.15+)"

documentation:
  primary: "32201 Prop Plug Guide v3.0 (Parallax, Rev E, 2021-02-03)"

