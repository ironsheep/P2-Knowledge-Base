recommended_mounting_footprint:
  source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, PACKAGING (RECOMMENDED MOUNTING FOOTPRINT panel), p.49"
  outer_span: "16.83 mm"
  inner_span: "9.60 mm"
  pad_length: "1.49 mm (100X)"
  pad_width: "0.28 mm (100X)"
  pitch: "0.50 mm"

pin_numbering:
  source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, PACKAGING (TOP VIEW: corner pin callouts and the PIN ONE INDICATOR), p.49"
  corners: "pins 1, 25, 26, 50, 51, 75, 76, 100"
  pin_one: "marked by a PIN ONE INDICATOR on the top view"
  note: >-
    This record covers the PACKAGE. Which P2 signal appears on which package pin is a
    different question -- see hardware/p2-eval-board.yaml and the boot-pin records for
    signal-level pin assignments.

board_design_guidance:
  source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet, Release November 1, 2022, Minimal Propeller 2 Connections, p.7; Pin Descriptions, p.6 (TEST, XI, XO and RESn rows)"
  bypass_capacitors: "All VDD and all Vxxyy pins must have closely-located bypass caps to GND."
  ground_pad: >-
    The common GND (EP) pad under the chip is also used for thermal dissipation. The
    datasheet recommends connecting the GND pad to a solid ground plane with multiple vias.
  supplies: "All VDD pins must be connected to a single 1.8 V supply. All Vxxyy pins must be connected to 3.3 V; they can share a common 3.3 V supply or be split across multiple supplies, typically with the pins powering analog and digital functions on different supplies."
  test_pin: "The TEST pin is tied to ground, and must always be connected to GND."
  reset_pin: "The RESN (reset) pin must always have a pullup resistor to 3.3 V (typically 10 KΩ)."
  xi_xo_pins: "XI is the crystal input: it can be connected to the output of a crystal/oscillator pack (with XO left disconnected), or to one leg of a crystal (with XO connected to the other leg of the crystal or resonator), depending on CLK register settings. XO is the crystal output: it provides feedback for an external crystal, or may be left disconnected, depending on CLK register settings. No external resistors or capacitors are required on XI or XO."
  reset_behavior: "When RESn is low the Propeller is reset: all cogs are disabled and the I/O pins are floating. The Propeller restarts 3 ms after RESn transitions from low to high."

thermal_note:
  status: >-
    The package drawing gives the exposed-pad dimensions (D2/E2, 9.50 REF). The datasheet
    gives no thermal resistance figure or derating curve; its only thermal guidance is the
    ground-pad recommendation under board_design_guidance. Do not infer a thermal solution
    from the pad size alone.

