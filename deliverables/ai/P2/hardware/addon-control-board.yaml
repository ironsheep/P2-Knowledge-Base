component: P2 Eval Control Add-on Board
part_number: "64006A"
series: "P2 Eval Add-on Boards (#64006)"
manufacturer: "Parallax Inc."
status: "active_production"
p2kb_key: "p2kbHwAddonControlBoard"
category: addon
aliases:
  - "control board"
  - "LED control board"
  - "buttons and LEDs board"
  - "P2 Eval Control Add-on Board"
  - "64006A"
  - "#64006 add-on board"

description: >-
  Four push-buttons and four blue LEDs for simple user-interface control. Each
  active-high blue LED has a 470 ohm series resistor and sits next to a button;
  each active-high tactile push switch has a 470 ohm series resistor so the I/O
  pin reads high while the button is pressed.
  P2 Eval Add-on Boards (#64006 Series) v2.0 1/12/2021, P2 Eval Control Add-on Board (#64006A), p.2.

# --- Eval-header board model (uniform across all #64006 / eval-header occupants) ---
eval_header_occupant: true
pin_group:
  size: 8
  addressing: >-
    actual_P2_pin = base_pin + offset. The board defines its functions by OFFSET
    within an 8-pin eval-header group; the user chooses which header (base_pin)
    it plugs into. base_pin is the first pin of that group.
  base_pin_options: [0, 8, 16, 24, 32, 40, 48, 56]
  base_pin_caution: >-
    Group 56-63 (Header H): P58-P63 are shared with the host's Flash SPI and
    serial pins - not recommended.

signal_map:
  source: "P2 Eval Add-on Boards (#64006 Series) v2.0 1/12/2021, P2 Eval Control Add-on Board (#64006A), I/O Pin table, p.2"
  pins:
    - offset: 0
      signal: "Blue LED 0"
      direction: out
      notes: "470 ohm series resistor; assert high to light. Use PWM for brightness control."
    - offset: 1
      signal: "Blue LED 1"
      direction: out
      notes: "470 ohm series resistor; assert high to light. PWM-capable for brightness."
    - offset: 2
      signal: "Blue LED 2"
      direction: out
      notes: "470 ohm series resistor; assert high to light. PWM-capable for brightness."
    - offset: 3
      signal: "Blue LED 3"
      direction: out
      notes: "470 ohm series resistor; assert high to light. PWM-capable for brightness."
    - offset: 4
      signal: "Tactile push switch 0"
      direction: in
      notes: "470 ohm series resistor; active high (pressed = high). Hold the pin low with a weak drive (WRPIN P_LOW_15K, then PINLOW so DIR is high) so an unpressed switch reads 0; software debounce."
    - offset: 5
      signal: "Tactile push switch 1"
      direction: in
      notes: "470 ohm series resistor; active high (pressed = high). Weak low drive as on offset 4; software debounce."
    - offset: 6
      signal: "Tactile push switch 2"
      direction: in
      notes: "470 ohm series resistor; active high (pressed = high). Weak low drive as on offset 4; software debounce."
    - offset: 7
      signal: "Tactile push switch 3"
      direction: in
      notes: "470 ohm series resistor; active high (pressed = high). Weak low drive as on offset 4; software debounce."

# Physical placement differs from pin order; the offsets above are the electrical truth.
physical_layout:
  source: "P2 Eval Add-on Boards (#64006 Series) v2.0 1/12/2021, P2 Eval Control Add-on Board (#64006A), p.2 (board photo with pin numbers)"
  buttons: "Offsets 6 and 7 along the top, 4 and 5 along the bottom (left to right)"
  leds: "Offsets 3 and 2 along the top, 1 and 0 along the bottom (left to right)"

specifications:
  source: "P2 Eval Add-on Boards (#64006 Series) v2.0 1/12/2021, P2 Eval Control Add-on Board (#64006A), p.2, and the shared connector / compatibility / mounting facts, p.1. Host VIO rail: Propeller 2 Eval Board Rev C (64000) v2.0 29/6/2020, Key Specifications (\"VIO power supplies: 3.3 V up to 300 mA per 8 I/O pins\"), p.2"
  requires_host: true
  io_pins_used: 8
  compatible_hosts:
    - "P2 Eval Board (64000)"
    - "P2 Edge Module Breadboard (64020)"
    - "P2 Edge Mini Breakout Board (64019) with P2 Edge Module"
  electrical:
    supply_voltage: "3.3V from host"
  physical:
    connector: "2x6 pass-through socket"
    mounting: "Single M3 mounting hole connected to GND"
    mounting_hardware: "M3 or UNC 4-40"
    hole_diameter: "3.2mm (126 mil)"
    pad_ring: "5mm (200 mil)"
    standoff_recommendation: "9.5mm long standoff for support"

protocol_constraints:
  pwm:
    notes: "Use PWM for LED brightness (Product Guide, P2 Eval Control Add-on Board (#64006A), p.2)."

code_patterns:
  spin2:
    initialization: |
      PUB init_control_board(base_pin)
        ' LEDs: base..base+3
        PINLOW(base_pin ADDPINS 3)       ' Set LEDs low (off)
        ' Buttons: base+4..base+7 held low by a weak drive
        WRPIN(base_pin+4 ADDPINS 3, P_LOW_15K)   ' Drive low 15kOhm
        PINLOW(base_pin+4 ADDPINS 3)     ' DIR=1, OUT=0 - a drive is live only while DIR is high
    led_control: |
      PUB led_on(base_pin, led_num)
        PINHIGH(base_pin + led_num)

      PUB led_pwm(base_pin, led_num, brightness)
        ' brightness: 0-255
        PINSTART(base_pin + led_num, P_PWM_SAWTOOTH | P_OE, 255, brightness)
    button_read: |
      PUB read_button(base_pin, btn_num) : pressed
        ' Returns TRUE if button pressed (active high)
        pressed := PINREAD(base_pin + 4 + btn_num)

      PUB read_all_buttons(base_pin) : buttons
        buttons := PINREAD(base_pin+4 ADDPINS 3) & $F

