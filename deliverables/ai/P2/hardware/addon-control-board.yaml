# PHYSICAL LAYOUT REMAPPING (from OBEX driver)
layout_remapping:
  description: |
    The physical layout of buttons/LEDs differs from pin order.
    OBEX driver remaps for MSB..LSB order when viewed left-to-right, top-to-bottom.
  physical_layout: |
    [3]  [2]
    (*)CONTROL
    [1]  [0]
  led_remap:
    logical_0: "base+0"
    logical_1: "base+1"
    logical_2: "base+3"
    logical_3: "base+2"
  button_remap:
    logical_0: "base+5"
    logical_1: "base+4"
    logical_2: "base+7"
    logical_3: "base+6"

# PROTOCOL CONSTRAINTS
protocol_constraints:
  pwm:
    recommended_frequency_hz: 1000
    min_frequency_hz: 50
    max_frequency_hz: 100000
    notes: "Higher frequencies waste CPU cycles without visible benefit"
    brightness_levels: 256

  timing:
    button_debounce_ms: 20
    led_response_time_ns: 100

# CODE PATTERNS (from OBEX 2869)
code_patterns:
  spin2:
    obex_driver_usage: |
      OBJ
        ctrl : "jm_p2-es_control"

      PUB main() | btn
        ctrl.start(0)                    ' Initialize at base pin 0 (Header A)
        ctrl.wr_leds(%1010)              ' Light LEDs 1 and 3
        btn := ctrl.rd_btns()            ' Read all 4 buttons as 4-bit value

    initialization: |
      PUB init_control_board(base_pin)
        ' LEDs: base..base+3
        PINLOW(base_pin ADDPINS 3)       ' Set LEDs low (off)

        ' Buttons: base+4..base+7 with internal pull-downs
        WRPIN(base_pin+4 ADDPINS 3, P_LOW_15K)
        PINLOW(base_pin+4 ADDPINS 3)     ' Activate pull-downs

    led_control: |
      PUB led_on(base_pin, led_num)
        PINHIGH(base_pin + led_num)

      PUB led_off(base_pin, led_num)
        PINLOW(base_pin + led_num)

      PUB led_pwm(base_pin, led_num, brightness)
        ' brightness: 0-255
        PINSTART(base_pin + led_num, P_PWM_SAWTOOTH | P_OE, 255, brightness)

    button_read: |
      PUB read_button(base_pin, btn_num) : pressed
        ' Returns TRUE if button pressed (active high)
        pressed := PINREAD(base_pin + 4 + btn_num)

      PUB read_all_buttons(base_pin) : buttons
        ' Returns 4-bit value with button states
        buttons := PINREAD(base_pin+4 ADDPINS 3) & $F

