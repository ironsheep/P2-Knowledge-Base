  electronic_schematic_symbols:
    char_range: "22-31, 127, 160, 162, 166-175, 180, 182-184, 186-190"
    count: 30
    purpose: |
      Parallax-custom glyphs for drawing electronic circuit schematics in text mode.
      Includes transistors (FET, BJT), diodes, resistors, capacitors, inductors,
      connectors, and power symbols. Characters combine to form complete circuit elements.
    note: |
      All mapped to Unicode Private Use Area (U+F000-U+F0FF) since no standard
      Unicode equivalents exist. Multi-cell components require combining adjacent characters.
    characters:
      - { code: 22, unicode: "U+F016", name: "PRIVATE USE", description: "Superscript minus-one (inverse notation)" }
      - { code: 23, unicode: "U+F017", name: "PRIVATE USE", description: "Vcc / Vdd power supply symbol" }
      - { code: 24, unicode: "U+F018", name: "PRIVATE USE", description: "Signal ground" }
      - { code: 25, unicode: "U+F019", name: "PRIVATE USE", description: "N-channel FET (left half); FET body (use with 186 for P-ch, 187 for N-ch, and 27)" }
      - { code: 26, unicode: "U+F01A", name: "PRIVATE USE", description: "P-channel FET (left half)" }
      - { code: 27, unicode: "U+F01B", name: "PRIVATE USE", description: "FET (right half)" }
      - { code: 28, unicode: "U+F01C", name: "PRIVATE USE", description: "BJT (left half)" }
      - { code: 29, unicode: "U+F01D", name: "PRIVATE USE", description: "Phototransistor (left half)" }
      - { code: 30, unicode: "U+F01E", name: "PRIVATE USE", description: "NPN BJT (right half)" }
      - { code: 31, unicode: "U+F01F", name: "PRIVATE USE", description: "PNP BJT (right half)" }
      - { code: 127, unicode: "U+F07F", name: "PRIVATE USE", description: "Crystal / Inductor / Core" }
      - { code: 160, unicode: "U+F0A0", name: "PRIVATE USE", description: "Vertical line with outward arrow at top; variable terminal at bottom" }
      - { code: 162, unicode: "U+F0A2", name: "PRIVATE USE", description: "Vertical line with outward arrow at bottom; variable terminal at top" }
      - { code: 166, unicode: "U+F0A6", name: "PRIVATE USE", description: "Diode (left half)" }
      - { code: 167, unicode: "U+F0A7", name: "PRIVATE USE", description: "Diode (right half)" }
      - { code: 168, unicode: "U+F0A8", name: "PRIVATE USE", description: "Light-emitting diode / LED (right half)" }
      - { code: 169, unicode: "U+F0A9", name: "PRIVATE USE", description: "Horizontal line with inward arrow at left; horizontal socket (left)" }
      - { code: 170, unicode: "U+F0AA", name: "PRIVATE USE", description: "Horizontal line with inward arrow at right; horizontal socket (right)" }
      - { code: 171, unicode: "U+F0AB", name: "PRIVATE USE", description: "Horizontal capacitor" }
      - { code: 172, unicode: "U+F0AC", name: "PRIVATE USE", description: "Vertical capacitor (left third)" }
