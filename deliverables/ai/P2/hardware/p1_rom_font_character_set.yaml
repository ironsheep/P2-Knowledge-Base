# P1 ROM Font Character Set - Complete 256-Character Reference
# Source: Parallax P1 (P8X32A) ROM, OBEX #2028 Unicode Mapping (Alex Hajnal)
# Purpose: Reference for P2 developers reusing P1 font glyphs in VGA/TV text displays
# Note: The P1 font ROM is frequently used in P2 projects via direct inclusion

component: P1_ROM_Font
category: font_reference
description: |
  Complete 256-character font set stored in the Parallax P1 (P8X32A) ROM.
  Each character is 16 pixels wide by 32 pixels tall (interleaved pair encoding).
  This font is widely reused in P2 projects for VGA text output, TV terminals,
  and debug displays. Beyond standard ASCII and Latin-1, it includes Parallax-custom
  glyphs for electronic schematic symbols, signal waveform building blocks,
  box/line drawing characters, and 3D compositing elements.

metadata:
  query_tags:
    - p1 font
    - rom font
    - character set
    - propeller font
    - vga text
    - box drawing
    - schematic symbols
    - waveform
    - unicode mapping
    - P8X32A
  source_chip: P8X32A
  unicode_mapping_by: Alex Hajnal
  obex_object_id: 2028

rom_location:
  chip: P8X32A
  address_range: "$8000-$BFFF"
  size_bytes: 16384
  characters: 256
  glyph_dimensions:
    width_pixels: 16
    height_pixels: 32
  encoding: |
    Interleaved pair format - characters are stored in pairs.
    Each pair shares a 128-byte block (64 bytes per character within the pair).
    Even-indexed characters occupy the left column, odd-indexed the right.

character_categories:

  compositing_symbols:
    char_range: "0-1, 8-13"
    count: 8
    purpose: |
      Four-color 3D UI compositing elements. Used to build raised/sunken panel
      edges and window borders in graphical text interfaces.
    characters:
      - { code: 0, unicode: "U+F000", name: "PRIVATE USE", description: "Compositing symbol - 3D box edge element" }
      - { code: 1, unicode: "U+F001", name: "PRIVATE USE", description: "Compositing symbol - 3D box edge element" }
      - { code: 8, unicode: "U+F008", name: "PRIVATE USE", description: "Compositing symbol - 3D box edge element" }
      - { code: 9, unicode: "U+F009", name: "PRIVATE USE", description: "Compositing symbol - 3D box edge element" }
      - { code: 10, unicode: "U+F00A", name: "PRIVATE USE", description: "Compositing symbol - 3D box edge element" }
      - { code: 11, unicode: "U+F00B", name: "PRIVATE USE", description: "Compositing symbol - 3D box edge element" }
      - { code: 12, unicode: "U+F00C", name: "PRIVATE USE", description: "Compositing symbol - 3D box edge element" }
      - { code: 13, unicode: "U+F00D", name: "PRIVATE USE", description: "Compositing symbol - 3D box edge element" }

  arrows:
    char_range: "2-7"
    count: 6
    purpose: "Directional arrows and pointing triangles for UI navigation and indicators."
    characters:
      - { code: 2, unicode: "U+2190", name: "LEFTWARDS ARROW", description: "Left arrow", glyph: "\u2190" }
      - { code: 3, unicode: "U+2192", name: "RIGHTWARDS ARROW", description: "Right arrow", glyph: "\u2192" }
      - { code: 4, unicode: "U+2191", name: "UPWARDS ARROW", description: "Up arrow", glyph: "\u2191" }
      - { code: 5, unicode: "U+2193", name: "DOWNWARDS ARROW", description: "Down arrow", glyph: "\u2193" }
      - { code: 6, unicode: "U+25C0", name: "BLACK LEFT-POINTING TRIANGLE", description: "Left-pointing triangle", glyph: "\u25C0" }
      - { code: 7, unicode: "U+25B6", name: "BLACK RIGHT-POINTING TRIANGLE", description: "Right-pointing triangle", glyph: "\u25B6" }

  bullets:
    char_range: "14-15"
    count: 2
    purpose: "Bullet and triangular bullet for list formatting."
    characters:
