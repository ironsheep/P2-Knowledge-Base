      - { code: 182, unicode: "U+F0B6", name: "PRIVATE USE", description: "Vertical inductor / coil" }
      - { code: 183, unicode: "U+F0B7", name: "PRIVATE USE", description: "Horizontal inductor / coil (left half)" }
