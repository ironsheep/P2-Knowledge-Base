      - { code: 17, unicode: "U+03C0", name: "GREEK SMALL LETTER PI", description: "Pi - 3.14159...", glyph: "\u03C0" }
      - { code: 18, unicode: "U+03A3", name: "GREEK CAPITAL LETTER SIGMA", description: "Sigma - summation", glyph: "\u03A3" }
