  waveform_building_blocks:
    char_range: "128-143"
    count: 16
    purpose: |
      Signal transition glyphs for constructing timing diagrams in text mode.
      Cover all combinations of low, high, middle (tri-state), and combined states
      with transitions between them. Essential for documenting digital signal behavior.
    note: "All mapped to Unicode Private Use Area. Designed to tile horizontally."
