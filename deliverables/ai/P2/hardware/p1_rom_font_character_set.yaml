unicode_mapping_notes:
  private_use_area: |
    Characters with no standard Unicode equivalent are mapped to the Unicode
    Private Use Area (U+F000-U+F0FF). This mapping was established by Alex Hajnal
    (OBEX #2028) and is the de facto standard for Propeller font Unicode representation.
  mapping_formula: "Unicode = 0xF000 + propeller_char_code (for Parallax-custom glyphs)"
  standard_chars: |
    Characters 32-126 map directly to their ASCII/Unicode code points.
    Characters 161, 163-165, 176-179, 181, 185, 191-254 use standard Latin-1 mappings.
    Character 164 is EURO SIGN (U+20AC) rather than the standard Latin-1 CURRENCY SIGN.
  exceptions:
    - { code: 164, note: "Maps to EURO SIGN (U+20AC) instead of Latin-1 CURRENCY SIGN (U+00A4)" }
    - { code: 255, note: "Maps to INFINITY (U+221E) instead of Latin-1 LATIN SMALL LETTER Y WITH DIAERESIS (U+00FF)" }

storage_format:
  encoding: "Interleaved pair"
  description: |
    Characters are stored in pairs sharing a 128-byte block. Within each block,
    the even character occupies one column and the odd character the other.
    Each character glyph is 16 pixels wide by 32 pixels tall, stored as a bitmask.
  bytes_per_character: 64
  total_rom_size: "16,384 bytes (256 chars x 64 bytes)"
  pixel_format: "1-bit per pixel monochrome (with 4-color compositing for chars 0-1, 8-13)"

usage_patterns:
  timing_diagrams:
    description: "Build text-mode timing diagrams using waveform characters 128-143 plus horizontal line 144"
    example_sequence: "129,130,134,133,129 = low, rise, high, fall, low"
  circuit_schematics:
    description: "Draw circuit schematics in source code comments using schematic symbols 22-31, 127, 160-190"
    component_assembly:
      resistor_horizontal: "chars 189 + 190 (left + right halves)"
      resistor_vertical: "char 188"
      capacitor_horizontal: "char 171"
      capacitor_vertical: "chars 172 + 173 + 174 (left + middle + right)"
      diode: "chars 166 + 167 (left + right)"
      led: "chars 166 + 168 (diode left + LED right)"
      nfet: "chars 187 + 25 + 27 (N-gate + body + right)"
      pfet: "chars 186 + 25 + 27 (P-gate + body + right)"
      npn_bjt: "chars 28 + 30 (left + NPN right)"
      pnp_bjt: "chars 28 + 31 (left + PNP right)"
      inductor_horizontal: "chars 183 + 184 (left + right)"
      inductor_vertical: "char 182"
  vga_text_display:
    description: |
      P2 projects commonly include the P1 ROM font data for VGA text output.
      The font is extracted from P1 ROM and included as a DAT block or loaded from file.
    typical_resolution: "80x25 or 80x40 text mode at 640x480 VGA"
  box_drawing:
    description: "Build text-mode UI panels using box drawing characters 144-159"
    simple_box: |
      159,144,144,158  (top: down-right, horiz, horiz, down-left)
      145,032,032,145  (middle: vert, space, space, vert)
      157,144,144,156  (bottom: up-right, horiz, horiz, up-left)

