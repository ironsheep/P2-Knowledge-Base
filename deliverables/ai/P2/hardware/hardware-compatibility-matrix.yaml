# ============================================================================
# POWER COMPATIBILITY ANALYSIS
# ============================================================================

power_compatibility:
  source: >-
    64000 Propeller 2 Eval Board Rev C Guide (Parallax Inc.) --
    engineering/ingestion/sources/p2-eval-board/complete-p2-eval-board-reference.md:47
    (5 VDC input, absolute maximum 5.5 VDC), :55-56 (PC-USB 500 mA, AUX-USB
    2000 mA), :58 (VIO 3.3 V up to 300 mA per 8 I/O pins), :115 (AUX 5V/GND
    pads, 4.5-5.5 V).
    64029 P2 Edge Breakout Board Guide (2023-03-01) --
    engineering/ingestion/sources/edge-breakout-board/edge-breakout-board-narrative.txt:53-57;
    64019 P2 Edge Mini Breakout Board Guide v1.1 --
    engineering/ingestion/sources/edge-mini-breakout/edge-mini-breakout-narrative.txt:55-59;
    64020 P2 Edge Module Breadboard Product Guide REV B --
    engineering/ingestion/sources/edge-module-breadboard/edge-module-breadboard-narrative.txt:61-66.
    All three carriers state the same input requirement.
    P2 Eval Add-on Boards (#64006 Series) Product Guide v2.0 (2021-01-12) --
    engineering/ingestion/sources/p2-eval-add-on-boards/p2-eval-add-on-boards-text.txt:62-80
    (Control: four blue LEDs, each with a 470 ohm series resistor), :99-115
    (Serial Host: up to 500 mA continuous per socket, 5 V required),
    :195-197 (LED Matrix: ~4 mA per lit LED, 224 mA if all 56 were on at once,
    4 mA instantaneous under Charlieplexing), :328 (A/V Breakout: "Amplified
    Audio Out (80mW)").
  host_power_capabilities:
    eval_board:
      usb_power: "Two micro-USB sockets, source auto-selected: PC-USB limited to 500 mA, AUX-USB to 2000 mA"
      auxiliary_power: "Recommended for multiple add-ons -- prefer the AUX USB socket for its higher limit"
      power_connector: "micro-USB (PC and AUX). Optional AUX 5V/GND pads accept 4.5 V to 5.5 V and MUST NOT exceed 5.5 V; do not drive the pads and the AUX socket at once"

    edge_carriers:
      usb_power: "via the recommended Parallax USB A to DC-Jack cable (#805-00019) into the barrel jack"
      external_power: "5 VDC only, absolute maximum 5.5 VDC, at the 2.1 mm centre-positive barrel jack -- the same on all three carriers (#64029, #64019, #64020). No carrier accepts a wide input range."
      input_current: "recommended minimum 100 mA; #64020 additionally states 1000 mA typical; maximum according to the customer application"
      regulation: "VIO 3.3 V up to 300 mA per 8 I/O pins -- supplied by the P2 Edge Module, not by the carrier (all three guides: 'requires P2 Edge Module')"

  addon_power_requirements:
    # The #64006 guide gives a current figure for only two of the eight boards
    # (LED Matrix and Serial Host). For the rest it describes the circuit, not a
    # draw. The remaining entries state what the guide states -- no figure is
    # derived from LED counts or resistor values.
    low_power:
      - "64006A (Control) - four blue LEDs and four push-buttons, each on a 470 ohm series resistor; the guide states no current figure"
      - "64006C (LED Matrix) - ~4 mA per lit LED; Charlieplexing lights one at a time, so instantaneous draw stays ~4 mA (vs 224 mA if all 56 were on)"
      - "64006E (Mini Prototyping) - User dependent"

    moderate_power:
      - "64006D (Digital Video Out) - Signal level only"
      - "64006F (Serial Device) - USB device mode"
      - "64006G (Goertzel) - Touch sensing circuits"

    high_power:
      - "64006B (Serial Host) - up to 500 mA continuous per USB socket (current-limited load switch, subject to overall available system power) + 5 V required"
      - "64006H (A/V Breakout) - amplified audio output rated 80 mW, plus video drivers. 80 mW is the amplifier's OUTPUT rating, not the board's supply draw; the guide states no supply figure. Use the P2-EVAL 3.3 V LDO power selection when working with audio."

# ============================================================================
# PIN USAGE COMPATIBILITY
# ============================================================================

pin_usage_analysis:
  addon_pin_assignments:
    single_header_addons: >-
      Most add-on boards occupy ONE 8-pin accessory header (base_pin + 0..7), and
      may be placed at any of the 8 header positions.
    dual_header_addons: >-
      Four boards span TWO adjacent headers (16 consecutive pins, base_pin in
      [0, 16, 32, 48]): #64010 Universal Motor Driver, #64008 Click Adapter,
      #64004-ES HyperRAM+HyperFlash, and #64032 HUB75 Adapter. Each consumes two
      of the eight header positions, halving the simultaneous-capacity budget for
      every one fitted.
    conflicts: "Direct pin conflicts when multiple add-ons share a header position"
    solution: "Physical separation on different header positions"
    
  host_pin_availability:
    eval_board:
      total_pins: 64
      available_for_addons: "64 (all accessible)"
      addon_positions: "8 positions × 8 pins = 64 total possible"
      
    edge_carriers:
      standard_breakout: "64 pins available at eight 2x6 accessory headers"
      mini_breakout: "40 pins available (P0-P31, P56-P63) at four 2x6 accessory headers; P32-P55 reach no header but may be picked up with jumper wires on the bottom side of the PCB"
      breadboard_carrier: "64 pins available at pin sockets and eight 2x6 accessory headers"

