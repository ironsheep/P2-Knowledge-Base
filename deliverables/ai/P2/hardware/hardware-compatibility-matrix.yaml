# Compatibility of P2 hardware components

# ============================================================================
# CORE COMPATIBILITY MATRIX
# ============================================================================

edge_module_carrier_compatibility:
  description: "Edge modules with carrier board compatibility"
  # A pin budget is the product of TWO independently sourced facts: which pins
  # the MODULE leaves free, and which pins the CARRIER brings to a header. Both
  # are stated per row, from their own guides, and neither is a derived total.
  source: >-
    Module side -- P2 Edge Module Rev D (#P2-EC) v3.0 6/3/2022, Key Specifications ("64 accessible at the edge connector, 56 fully free"; free pins P0-P55, P56-P63 routed to peripherals), p.2.
    Module side -- P2 Edge Module with 32MB RAM (#P2-EC32MB) v2.0 5/23/2022, Key Specifications ("46 accessible at the edge connector, 40 fully free"; free pins P0-P39, P40-P57 routed to the on-module PSRAM, P58-P63 to peripherals and boot), p.2.
    Carrier side -- P2 Edge Breakout Board (#64029) v1.0 03/01/2023, Features, p.1.
    Carrier side -- P2 Edge Mini Breakout Board (#64019) v1.1 11/30/2020, Features ("Smart I/O pins P0-P31 and P56-P63 are available at pin headers. Pins P32-P55 may be accessed by adding jumper wires on the bottom side of the PCB"), p.1.
    Carrier side -- P2 Edge Module Breadboard (#64020) v1.2 01/07/2021, Features, p.2.

  combinations:
    - module: "P2-EC (Standard Edge Module)"
      carrier: "64029 (Standard Breakout)"
      module_free_pins: "P0-P55 (56 fully free; P56-P63 routed to peripherals)"
      carrier_header_pins: "all 64 at eight 2x6 accessory headers"
      use_case: "Full P2 development platform"

    - module: "P2-EC (Standard Edge Module)"
      carrier: "64019 (Mini Breakout)"
      module_free_pins: "P0-P55 (56 fully free; P56-P63 routed to peripherals)"
      carrier_header_pins: "P0-P31 and P56-P63 (40) at four 2x6 accessory headers plus one programming header; P32-P55 reach no header but may be picked up with jumper wires on the bottom side of the PCB"
      use_case: "Simple projects only"

    - module: "P2-EC (Standard Edge Module)"
      carrier: "64020 (Breadboard Carrier)"
      module_free_pins: "P0-P55 (56 fully free; P56-P63 routed to peripherals)"
      carrier_header_pins: "all 64 at 0.1 inch pin sockets and eight 2x6 accessory headers"
      use_case: "Complex prototyping and education"

    - module: "P2-EC32MB (32MB Edge Module)"
      carrier: "64029 (Standard Breakout)"
      module_free_pins: "P0-P39 (40 fully free; P40-P57 routed to the on-module PSRAM, P58-P63 to peripherals and boot)"
      carrier_header_pins: "all 64 at eight 2x6 accessory headers -- the PSRAM pins reach the headers but are dedicated"
      use_case: "Standard form factor with memory"

    - module: "P2-EC32MB (32MB Edge Module)"
      carrier: "64019 (Mini Breakout)"
      module_free_pins: "P0-P39 (40 fully free; P40-P57 routed to the on-module PSRAM, P58-P63 to peripherals and boot)"
      carrier_header_pins: "P0-P31 and P56-P63 (40) at four 2x6 accessory headers plus one programming header. P40-P55 reach no header on this carrier; P56/P57 do, but are PSRAM CLK/CE."
      use_case: "Compact memory-intensive projects"

    - module: "P2-EC32MB (32MB Edge Module)"
      carrier: "64020 (Breadboard Carrier)"
      module_free_pins: "P0-P39 (40 fully free; P40-P57 routed to the on-module PSRAM, P58-P63 to peripherals and boot)"
      carrier_header_pins: "all 64 at 0.1 inch pin sockets and eight 2x6 accessory headers -- the PSRAM pins reach the headers but are dedicated"
      use_case: "Educational memory platform"

# ============================================================================
# ADDON BOARD COMPATIBILITY
# ============================================================================

addon_board_host_compatibility:
  description: "Add-on board compatibility with development platforms"
  source: >-
    P2 Eval Add-on Boards (#64006 Series) v2.0 1/12/2021, cover (the eight #64006 part numbers), and the one-header-per-board rule, p.1.
    P2 Eval Add-on Boards (#64006 Series) v2.0 1/12/2021, P2 Eval Serial Host Add-on Board (#64006B) (the Serial Host 5 V requirement and its shunt jumper: "on a P2-ES Eval Board Rev B, the shunt jumper must connect that board's ACC HDR and 5V pins"), p.3.
    Each board added in the 2026-06 wave is described in its own per-board entry, which carries its own citation.

  eval_board_compatibility:
    host: "P2 Eval Board (64000)"
    addon_connector: "2x6 expansion headers"
    simultaneous_capacity: 8
    addons_compatible:
      - part: "64006A"
        name: "Control Board"
        pins_used: "P0-P7"
        conflicts: "none_when_properly_positioned"
        
      - part: "64006B"
        name: "Serial Host Board"
        pins_used: "P0-P7"
        power_requirement: "5V (shunt jumper required)"
        conflicts: "check_5v_power_configuration"
        
      - part: "64006C"
        name: "LED Matrix Board"
        pins_used: "P0-P7"
        conflicts: "none_low_power"
        
      - part: "64006D"
        name: "Digital Video Out Board"
        pins_used: "P0-P7"
        conflicts: "none"
        
      - part: "64006E"
        name: "Mini Prototyping Board"
        pins_used: "P0-P7"
        conflicts: "none_user_configurable"
        
      - part: "64006F"
        name: "Serial Device Board"
        pins_used: "P0-P7"
        conflicts: "none"
        
      - part: "64006G"
        name: "Goertzel Board"
        pins_used: "P0-P7"
        conflicts: "none"
        
      - part: "64006H"
        name: "A/V Breakout Board"
        pins_used: "P0-P7"
        size: "large_module"
        conflicts: "check_physical_clearance"

      # --- addon-wave-2026-06 boards ---
      - part: "64009"
        name: "microSD Add-on"
        pins_used: "8-pin group (base+0..base+7); SPI"
        note: "Boot-from-card requires the P56-P63 programming header"
        conflicts: "none_low_power"

      - part: "64013"
        name: "RTC Add-on (PCF8523)"
        pins_used: "base+0/+1 (I2C) of an 8-pin group"
        conflicts: "none_low_power"

      - part: "64014"
        name: "HD Audio Add-on Set (ADC + DAC)"
        pins_used: "8-pin group per board (two boards, side-by-side at a dual port)"
        conflicts: "none"

      - part: "64007"
        name: "WX Adapter (hosts #32420S Wi-Fi module)"
        pins_used: "8-pin group; wireless programming needs the P56-P63 RES-logo header"
        conflicts: "none"

      - part: "64010"
        name: "Universal Motor Driver"
        pins_used: "16 pins (dual accessory header; PWM 15-8, feedback 7-0)"
        size: "large_module (70x70 mm)"
        conflicts: "uses a full dual header; high-current - check power budget"

      - part: "64008"
        name: "P2 to mikroBUS Click Adapter"
        pins_used: "16 pins (dual accessory header); 12 signals used, +12..+15 spare"
        note: "SPI four (CS/SCK/MISO/MOSI) land on the upper header (+8..+11); all other signals on the lower (+0..+7)"
        conflicts: "uses a full dual header"

      - part: "64004-ES"
        name: "HyperRAM + HyperFlash Add-on"
        pins_used: "16 pins (two adjacent 8-pin edge headers)"
        conflicts: "uses a full dual header"

      - part: "64032"
        name: "HUB75 Adapter"
        pins_used: "16 pins (dual accessory header); 14 HUB75 signals, offsets 14-15 spare (brought out on through-holes, direct and 5 V-buffered)"
        note: "All 14 HUB75 signals are P2 outputs, driven through the adapter's 74HCT244 level shifters; see hardware/hub75_adapter.yaml"
        conflicts: "uses a full dual header; check panel power budget separately"

  edge_carrier_compatibility:
    # All three carrier guides state that every carrier brings its I/O pins out to
    # 2x6 way P2 accessory headers and takes the #64006-series boards. The counts
    # below come from the guides and agree with hardware/edge-standard-breakout.yaml,
    # hardware/edge-mini-breakout.yaml and hardware/p2-hardware-feature-comparison.yaml.
    source: >-
      P2 Edge Breakout Board (#64029) v1.0 03/01/2023, Features ("All 64 Smart I/O pins brought out to 0.1" 2x6 way P2 accessory headers"), p.1; the accessory boards it names, p.3.
      P2 Edge Mini Breakout Board (#64019) v1.1 11/30/2020, Features, p.1; accessory boards, p.3; accessory header details, p.5.
      P2 Edge Module Breadboard (#64020) v1.2 01/07/2021, Features, p.2.
    breadboard_carrier:
      host: "P2 Edge Module Breadboard (64020)"
      addon_support: "yes"
      headers: "all 64 Smart I/O pins at 0.1 inch pin sockets AND eight 2x6 way accessory headers"
      reason: "Breadboard prototyping is the board's focus, but the accessory headers are present and usable"

    standard_breakout:
      host: "P2 Edge Standard Breakout (64029)"
      addon_support: "yes"
      headers: "all 64 Smart I/O pins at eight 2x6 way accessory headers, each arranged to accept single or dual accessory boards"

    mini_breakout:
      host: "P2 Edge Mini Breakout (64019)"
      addon_support: "yes"
      headers: "40 Smart I/O pins (P0-P31, P56-P63) at four 2x6 way accessory headers plus one programming header; P32-P55 reach no header but may be picked up with jumper wires on the bottom side of the PCB"

