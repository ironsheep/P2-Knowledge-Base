performance_considerations:
  source: >-
    P2 Eval Add-on Boards (#64006 Series) Product Guide v2.0 (Parallax Inc.,
    2021-01-12) --
    engineering/ingestion/sources/p2-eval-add-on-boards/p2-eval-add-on-boards-text.txt:189-191:
    "When Propeller 2 code switches each LED on and off at least 50 times a
    second (50 Hz), flickering should not be noticeable... each I/O could switch
    faster than 180 MHz". Both figures are the LED Matrix board's Charlieplexing
    discussion; the 180 MHz is that guide's statement about I/O switching, not a
    silicon maximum -- for P2 clock and pin limits see architecture/ and the
    P2 Datasheet.
  timing_requirements:
    led_matrix:
      refresh_rate: "Minimum 50Hz for flicker-free operation"
      p2_capability: "Each I/O >180MHz switching (excellent)"
      
    av_breakout:
      vga_timing: "Standard VGA timing requirements"
      audio_sampling: "Standard audio sample rates"
      
    serial_interfaces:
      usb_timing: "USB 1.1/2.0 timing requirements"
      p2_smart_pins: "Hardware USB support available"
      
  cpu_load_impact:
    charlieplexing: "Requires dedicated cog or interrupt service"
    av_generation: "May require multiple cogs for complex A/V"
    serial_protocols: "Smart pins reduce CPU overhead"

# ============================================================================
# COMPATIBILITY RECOMMENDATIONS
# ============================================================================

optimal_configurations:
  beginner_setup:
    host: "P2 Eval Board (64000)"
    addons: 
      - "64006A (Control Board)"
      - "64006C (LED Matrix)"
    rationale: "Simple I/O concepts with visual feedback"
    
  intermediate_setup:
    host: "P2 Eval Board (64000)"
    addons:
      - "64006A (Control Board)" 
      - "64006C (LED Matrix)"
      - "64006E (Mini Prototyping)"
      - "64006F (Serial Device)"
    rationale: "Expanded I/O with communication and prototyping"
    
  advanced_setup:
    host: "P2 Eval Board (64000)"
    addons: "All 8 add-on boards (64006-ES complete set)"
    power: "Auxiliary power supply required"
    rationale: "Complete P2 capability exploration"
    
  compact_memory_system:
    host: "P2 Edge Mini Breakout (64019)"
    module: "P2-EC32MB (32MB Edge Module)"
    addons: "Optional -- the #64019 has four 2x6 accessory headers. Note the pin budget: the P2-EC32MB dedicates P40-P57 to the on-module PSRAM, and the #64019 exposes only P0-P31 and P56-P63, so P56/P57 (PSRAM CLK/CE) are already spoken for and P0-P31 is what remains for accessories."
    rationale: "Optimal compact memory-intensive applications"
    
  professional_development:
    host: "P2 Edge Module Breadboard (64020)"
    module: "P2-EC (Standard Edge Module)"
    expansion: "Breadboard prototyping instead of add-ons"
    rationale: "Maximum flexibility and prototyping capability"

# ============================================================================
# INCOMPATIBILITY WARNINGS
# ============================================================================

incompatibilities:
  source: >-
    P2 Eval Add-on Boards (#64006 Series) Product Guide v2.0 (Parallax Inc.,
    2021-01-12) --
    engineering/ingestion/sources/p2-eval-add-on-boards/p2-eval-add-on-boards-text.txt:99-115
    (the Serial Host 5 V supply and its ACC HDR / 5V shunt jumper) and :357-359
    ("Tip: Always use the P2-EVAL 3.3V LDO Power selection when working with
    Audio!" -- the A/V Breakout).
    This block previously listed "Edge carriers (64029, 64019) have no 2x6
    addon headers / Cannot use 64006-series add-on boards" as the first hardware
    conflict. That is the opposite of what the guides say and it has been
    removed -- see the note under `edge_carrier_compatibility`.
  hardware_conflicts:
    - description: "The #64019 Mini Breakout brings out only 40 of the 64 I/O pins (P0-P31, P56-P63) at four accessory headers"
      impact: "Fewer simultaneous accessory positions than the #64029 or #64020, and P32-P55 reach no header but may be picked up with jumper wires on the bottom side of the PCB"
      solution: "Use the #64029 Standard Breakout or #64020 Breadboard carrier when more than four accessory positions are needed"


    - description: "Serial Host (64006B) requires 5V supply"
      impact: "May not work with 3.3V-only systems"
      solution: "Ensure 5V available and shunt jumper configured"
      
    - description: "Multiple add-ons use same pins (P0-P7)"
      impact: "Pin conflicts when stacked carelessly"
      solution: "Use different header positions, plan pin usage"
      
  power_limitations:
    - description: "USB power insufficient for multiple add-ons"
      impact: "System instability or malfunction"
      solution: "Use auxiliary power supply"
      
    - description: "A/V Breakout audio requires 3.3V LDO setting"
      impact: "Poor audio quality with incorrect power setting"
      solution: "Select proper power mode on host board"

