component: HUB75 Adapter
aliases:
  - "HUB75 adapter"
  - "HUB75 LED panel adapter"
  - "RGB matrix adapter"
  - "64032"
  - "LED panel interface"
part_number: 64032
p2kb_key: "p2kbHwHub75Adapter"
category: addon
manufacturer: Iron Sheep Productions, LLC
status: "retiring_limited_stock"

# The board is designed and sold by Iron Sheep Productions, LLC, not by Parallax.
# Its sources are the designer's own: the board schematic and his dated statement.
authorship: "Board designed and sold by Iron Sheep Productions, LLC (designer Stephen M Moraco); every fact in this file comes from the designer's schematic or the designer's dated statement, not from a Parallax publication."

description:
  source: "HUB75E Adapter for P2 Eval, H/W Rev 1.4, 2020-11-25, schematic (Iron Sheep Productions, LLC): U1/U2 74HCT244 buffers on +5VA between the P2 headers J1/J2 and the HUB75 connector J7. Female pass-through headers and the address lines per panel height: Stephen M Moraco (Iron Sheep Productions, LLC), designer's statement for the P2 Eval HUB75 Adapter (#64032), 2026-10-10"
  text: >-
    Adapter board that connects HUB75 RGB LED matrix panels to a Propeller 2. It
    shifts every HUB75 signal from 3.3 V to 5 V at the HUB75 connector, so no
    P2-side level handling is needed. Dual 2x6-pin female pass-through headers on
    the P2 side, a keyed 16-pin HUB75 connector on the panel side. Supports panels
    using A-B-C (16-row panels), A-B-C-D (32-row panels) and A-B-C-D-E (64-row
    panels) address lines.

specifications:
  source: "Board size (hand-measured), current draw, maximum clock, header type, address lines per panel height and host boards: Stephen M Moraco (Iron Sheep Productions, LLC), designer's statement for the P2 Eval HUB75 Adapter (#64032), 2026-10-10. Supply, level shifters, connectors and pin budget: HUB75E Adapter for P2 Eval, H/W Rev 1.4, 2020-11-25, schematic (Iron Sheep Productions, LLC)"
  physical:
    pcb_dimensions: "1.9 x 2.8 inches (48 x 71 mm)"
    form_factor: "dual 2x6-pin female pass-through headers"
    panel_connector: "J7: keyed, shrouded 2x8 (16-pin) IDC header, HUB75E pinout (pin 8 = E; pin 4 not grounded, brought out to through-hole J6)"
    probe_header: "J3: 2x8 logic-analyser header carrying the same buffered HUB75 signals, pin for pin as J7"
    spare_pin_holes: "J4: offsets 14 and 15 direct from the P2; J5: the same two pins buffered to 5 V; J6: HUB75 pin 4. Through-holes, unpopulated"
  electrical:
    operating_voltage: "+5 VDC, taken from the 5V pin of the lower (offsets 0-7) header only; the upper header's 5V pin and both VIO 3.3 V pins are not connected"
    board_consumption: "under 50 mA (level shifters and support circuitry)"
    max_clock_rate: "70 MHz, limited by the level shifter ICs"
    panel_clock_note: >-
      The 70 MHz figure is the adapter's ceiling, not the panel's. The panels this
      adapter drives run well below it.
    level_shifting: "two 74HCT244 octal buffers at 5 V, 3.3 V in to 5 V out, on every HUB75 signal and on the spare offsets 14-15; output enables tied low, so the buffers always drive. All signals are P2 outputs; nothing is bidirectional"
    panel_power: "The HUB75 connector carries no 5 V supply; the board's 5 V feeds only the two buffers"
  address_line_support:
    - {lines: "A-B-C", panels: "16-row panels"}
    - {lines: "A-B-C-D", panels: "32-row panels"}
    - {lines: "A-B-C-D-E", panels: "64-row panels"}
  compatible_hosts:
    - "P2 Eval Board (#64000)"
    - "P2 Edge Module Breadboard (#64020) with a P2 Edge Module (#P2-EC)"
    - "P2 Edge Mini Breakout Board (#64019) with a P2 Edge Module (#P2-EC)"
  pin_budget: "uses 14 of the 16 pins in a dual-header block; offsets 14 and 15 are spare"

software_features:
  driver: >-
    Drive this board with the ISP HUB75 Matrix Driver (OBEX 2850; see
    resources). The driver is configured for the LED driver chipset of the panels
    on each adapter; its API, configuration, supported chipsets, timing and
    performance are the driver's, documented with it, and change with its
    releases -- this entry does not restate them.

notes:
  source: "Supply: HUB75E Adapter for P2 Eval, H/W Rev 1.4, 2020-11-25, schematic (Iron Sheep Productions, LLC). Maximum clock: Stephen M Moraco (Iron Sheep Productions, LLC), designer's statement for the P2 Eval HUB75 Adapter (#64032), 2026-10-10"
  items:
    - "LED panels need their own 5 V power supply. The adapter takes 5 V from the P2 board for its two level shifters only; its HUB75 connector carries no supply."
    - "Maximum clock rate is 70 MHz, set by the level shifter ICs; the panel's own chipset usually sets a lower limit (see specifications.electrical.panel_clock_note)."

# --- Eval-header board model (uniform across all eval-header occupants) ---
eval_header_occupant: true
pin_group:
  size: 16
  addressing: >-
    actual_P2_pin = base_pin + offset. The board defines its functions by OFFSET
    within a 16-pin P2 header block (dual 8-pin pass-through headers); the user
    chooses which block (base_pin) it mounts on.
  total_pins_used: 14
  base_pin_options: [0, 16, 32, 48]
  base_pin_note: "Needs 16 consecutive I/O pins (two adjacent 8-pin headers)."

# All 16 offsets are P2 outputs into the board's 74HCT244 buffers. Offsets 0-13
# reach the HUB75 connector; offsets 14-15 are spares on through-holes J4/J5
# (source: the schematic, headers J1/J2, buffers U1/U2, connector J7).
signal_map:
  - {offset: 0,  signal: "CLK (pixel clock)", direction: out, notes: "Shifts pixel data into the panel."}
  - {offset: 1,  signal: "OE# (output enable, active low)", direction: out, notes: "Blanks the display during latch/address."}
  - {offset: 2,  signal: "LAT (latch)", direction: out, notes: "Latches the shifted row data."}
  - {offset: 3,  signal: "A (row address bit 0)", direction: out}
  - {offset: 4,  signal: "B (row address bit 1)", direction: out}
  - {offset: 5,  signal: "C (row address bit 2)", direction: out}
  - {offset: 6,  signal: "D (row address bit 3)", direction: out, notes: "For 32+ row panels."}
  - {offset: 7,  signal: "E (row address bit 4)", direction: out, notes: "For 64+ row panels."}
  - {offset: 8,  signal: "R1 (red data, upper half)", direction: out}
  - {offset: 9,  signal: "G1 (green data, upper half)", direction: out}
  - {offset: 10, signal: "B1 (blue data, upper half)", direction: out}
  - {offset: 11, signal: "R2 (red data, lower half)", direction: out}
  - {offset: 12, signal: "G2 (green data, lower half)", direction: out}
  - {offset: 13, signal: "B2 (blue data, lower half)", direction: out}
  - {offset: 14, signal: "spare", notes: "No HUB75 signal. On through-holes J4 pin 2 and J5 pin 2 (see specifications.physical.spare_pin_holes)."}
  - {offset: 15, signal: "spare", notes: "No HUB75 signal. On through-holes J4 pin 3 and J5 pin 3 (see specifications.physical.spare_pin_holes)."}

