component: HUB75 Adapter
aliases:
  - "HUB75 adapter"
  - "HUB75 LED panel adapter"
  - "RGB matrix adapter"
  - "64032"
  - "LED panel interface"
part_number: 64032
p2kb_key: "p2kbHwHub75Adapter"
category: addon
manufacturer: Iron Sheep Productions, LLC
status: "retiring_limited_stock"

# --- Eval-header board model (uniform across all eval-header occupants) ---
eval_header_occupant: true
pin_group:
  size: 16
  addressing: >-
    actual_P2_pin = base_pin + offset. The board defines its functions by OFFSET
    within a 16-pin P2 header block (dual 8-pin pass-through headers); the user
    chooses which block (base_pin) it mounts on.
  total_pins_used: 14
  base_pin_options: [0, 16, 32, 48]
  base_pin_note: "Needs 16 consecutive I/O pins (two adjacent 8-pin headers). P16-P31 is the most common."

# All 14 used HUB75 signals are P2 outputs (driven to the panel via the
# 2x 74HCT244 level shifters). Offsets 14-15 are unused.
signal_map:
  - {offset: 0,  signal: "CLK (pixel clock)", direction: out, notes: "Shifts pixel data into the panel."}
  - {offset: 1,  signal: "OE# (output enable, active low)", direction: out, notes: "Blanks the display during latch/address."}
  - {offset: 2,  signal: "LAT (latch)", direction: out, notes: "Latches the shifted row data."}
  - {offset: 3,  signal: "A (row address bit 0)", direction: out}
  - {offset: 4,  signal: "B (row address bit 1)", direction: out}
  - {offset: 5,  signal: "C (row address bit 2)", direction: out}
  - {offset: 6,  signal: "D (row address bit 3)", direction: out, notes: "For 32+ row panels."}
  - {offset: 7,  signal: "E (row address bit 4)", direction: out, notes: "For 64+ row panels."}
  - {offset: 8,  signal: "R1 (red data, upper half)", direction: out}
  - {offset: 9,  signal: "G1 (green data, upper half)", direction: out}
  - {offset: 10, signal: "B1 (blue data, upper half)", direction: out}
  - {offset: 11, signal: "R2 (red data, lower half)", direction: out}
  - {offset: 12, signal: "G2 (green data, lower half)", direction: out}
  - {offset: 13, signal: "B2 (blue data, lower half)", direction: out}
  - {offset: 14, signal: "unused", notes: "Not connected to a HUB75 signal."}
  - {offset: 15, signal: "unused", notes: "Not connected to a HUB75 signal."}

supported_panels:
  scan_rates:
    - "1:8"   # 16x32, 32x16 panels
    - "1:16"  # 32x32, 64x32 panels
    - "1:32"  # 64x64, 128x64 panels
    - "1:4"   # Special high-density panels

  resolutions:
    - 16x32
    - 32x16
    - 32x32
    - 64x32
    - 64x64
    - 128x64

  pixel_pitch:
    - P1.25  # 1.25mm spacing
    - P2     # 2mm spacing
    - P3     # 3mm spacing
    - P4     # 4mm spacing
    - P5     # 5mm spacing
    - P6-P10 # 6-10mm spacing

led_driver_chips:
  # Chips requiring special initialization
  with_init:
    FM6126A:
      init_required: true
      registers: [11, 12]
      features:
        - Magic bit sequence initialization
        - Control register programming
        - Brightness control

    FM6124:
      init_required: false
      latch_style: enclosed

    MBI5124GP:
      init_required: true
      features:
        - Special reset sequence

  # Chips with timing variations
  timing_variants:
    ICN2037:
      latch_style: enclosed
      slow_clock: true

    ICN2038S:
      latch_style: enclosed
      slow_clock: true

    DP5125D:
      latch_style: standard

    GS6238S:
      latch_style: standard

  # Unknown/generic chips
  generic:
    UNK_LAT_END_ENCL:
      latch_style: enclosed

    UNK_LAT_END_ENCL_SLO_CLK:
      latch_style: enclosed
      slow_clock: true

compatibility:
  p2_boards:
    - P2 Eval Board (64000-ES)
    - P2 Edge Module + Breadboard (64020)
    - P2 Edge Mini Breakout (64019)
    - Any P2 board with 16 consecutive I/O pins

  operating_systems:
    - Standalone (no OS required)
    - FlexProp compatible
    - Propeller Tool compatible
    - PNut compatible

source: P2 HUB75 LED Matrix Driver Study

# RESOURCE REFERENCES (MANDATORY - with URLs)
resources:
  obex:
    id: 2850
    name: "P2-HUB75 LED Matrix Driver"
    author: "Stephen M Moraco (Iron Sheep Productions)"
    url: "https://obex.parallax.com/obex/p2-hub75-led-matrix-driver/"
    driver_file: "isp_hub75_matrix.spin2"
    complexity: "complex_driver"
    recommendation: "Use OBEX driver - do not attempt to implement manually"

  github:
    url: "https://github.com/ironsheep/P2-HUB75-LED-Matrix-Driver"
    documentation: "Comprehensive API and panel configuration guides"
    examples: "Multiple demo applications included"

  quick_bytes: []

documentation:
  primary: "GitHub repository documentation"
  obex: "P2 Object Exchange (OBEX)"
  related:
    - "HUB75 protocol specification"
    - "Panel-specific LED driver datasheets"
