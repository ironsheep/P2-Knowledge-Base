component: Parallax WX ESP8266 Wi-Fi Module
part_number: "32420"
series: "Parallax Wireless"
manufacturer: "Parallax Inc."
status: "active_production"
p2kb_key: "p2kbHwAddonWxWifi"
category: addon
aliases:
  - "WX WiFi module"
  - "WX Wi-Fi module"
  - "ESP8266 WiFi module"
  - "Parallax WX ESP8266 Wi-Fi Module"
  - "WX wireless module"
