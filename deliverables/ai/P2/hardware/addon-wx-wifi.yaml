component: Parallax WX ESP8266 Wi-Fi Module
part_number: "32420"
series: "Parallax Wireless"
manufacturer: "Parallax Inc."
status: "active_production"
p2kb_key: "p2kbHwAddonWxWifi"
category: addon
aliases:
  - "WX WiFi module"
  - "WX Wi-Fi module"
  - "ESP8266 WiFi module"
  - "Parallax WX ESP8266 Wi-Fi Module"
  - "WX wireless module"
  - "wireless programming module"
  - "32420"
  - "32420D"
  - "32420S"
  - "#32420 module"

description: >-
  2.4 GHz Wi-Fi module based on the ESP8266-WROOM-02. Runs as its own access
  point (AP), as a station (STA), or STA+AP; serves config + user web pages and a
  ~1 MB user file system; supports HTTP server, WebSocket server, and TCP client.
  Offers a transparent serial mode (wireless MCU programming/debug) and a command
  serial mode (host-MCU data exchange). On the P2 it is the radio behind the
  P2 WX Adapter (#64007); the SIP variant also works on a breadboard.

# NOTE: This is a peripheral Wi-Fi MODULE, not a P2 accessory-header occupant.
# It plugs into a WX 2x10x2 mm DIP socket or a 10-pin 0.1" SIP socket (e.g. the
# P2 WX Adapter #64007). See related: hardware/addon-wx-adapter.yaml.
eval_header_occupant: false

core:
  chip: "ESP8266-WROOM-02 (32-bit MCU + Wi-Fi, embedded TCP/IP, 16 Mbit SPI flash)"
  firmware: >-
    "Remora" v1.0 (2016) - Parallax build of the open-source esp-link project
    (LINK by Thorsten von Eicken). OTA-upgradeable via the module's web UI.
  certifications: "FCC, CE, KCC, TELEC, LCIE, IC"

wifi:
  protocols: "802.11 b/g/n"
  modes: ["AP (up to 4 devices join)", "STA", "STA+AP"]
  network_protocols: "IPv4, TCP/HTTP"
  security: "WPA/WPA2; WEP/TKIP/AES encryption"
  range: "30 m line-of-sight"
  connections: "HTTP (server), WebSocket (server), TCP (client)"
  web_server: "micro web server (config pages + ~1 MB user file store) in STA or AP mode"

serial_modes:
  default_mode: "Transparent - the module powers up in Transparent mode"
  transparent: "data passes through unmodified; IP traffic transported via a subset of TELNET over port 23"
  command: "run-time control: set/check module settings, open connections, special processing"
  enter_command_mode:
    - "Web Settings page -> Serial Commands = Enabled (http://192.168.4.1/settings.html via SoftAP, or http://<ip>/settings.html via Station)"
    - "Network command: POST /wx/setting?name=cmd-enable&value=1"
    - "Serial Break Condition: hold DI low >= 30 bit-times (30 / current-baud seconds)"
  baud:
    default: 115200
    valid: [1200, 4800, 9600, 19200, 38400, 57600, 74880, 115200, 230400, 460800, 921600]
    format: "asynchronous, RS-232-like, on the DO/DI pins"
    settings: "two settings - baud-rate (normal run) and loader-baud-rate (Propeller load); both default 115200"
  source_trace: >-
    Resolved from the 32420 Parallax Wi-Fi Module Firmware/API Guide v1.0
    (2016-11-16) + firmware v1.4, staged sources/parallax-wx-wifi/NO-COMMIT/
    (NOT committed). Gap G-010 resolved.

command_protocol:
  framing: "begin marker = byte 254 ($FE), end marker = byte 13 ($0D, CR) by default (markers may be configurable in future firmware)"
  forms: "text form (e.g. 'CLOSE', with ':' and ',' delimiters) OR token form (e.g. CLOSE = 232 / $E8, one byte); the module always replies in text form"
  network_commands: "HTTP / WebSocket / TCP, e.g. POST /wx/setting?name=...&value=... (case-sensitive)"
  reference: "full command + argument token list in the 32420 Firmware/API Guide"

prop_plug_compat: >-
  On the SIP/breadboard header the first four pins GND, RES, DI, DO are
  compatible with the Parallax Prop Plug (#32201) for firmware reprogramming.
  See hardware/programming-prop-plug.yaml.

p2_support: "via the P2 WX Adapter (#64007)"
p2_support_note: >-
  The module's built-in firmware loader (proploader; the 'baud-rate' /
  'loader-baud-rate' settings) targets a Propeller application image and is
  P1-era (this 2016 guide is for the Activity Board WX). P2 wireless programming
  is achieved by mounting the SIP module on the P2 WX Adapter (#64007) and
  loading the special P2 Wi-Fi firmware (P2_httpd_xxxx.ota), which hosts a
  drag/drop P2 binary loader - see hardware/addon-wx-adapter.yaml. (Gaps G-011 /
  expert Q-004: the functional P2 path is documented via #64007; whether Parallax
  markets the bare module as 'P2-supported' remains a labeling question for
  Parallax.)

configuration:
  default: "ships as an AP; join SSID 'wx-' + 6 alphanumerics (e.g. wx-dba23b)"
  ap_recovery: "rapidly ground/release /PGM 4x (or RST 4x on Activity Board WX) to re-enter AP mode"
  config_url: "http://192.168.4.1 (AP mode)"
  pages: ["Networks (mode + join)", "Files (~1 MB store)", "Settings (name + serial)", "Firmware (OTA .ota upgrade)"]
  security_caution: >-
    After joining a network, note the assigned IP, then set mode back to STA -
    leaving STA+AP can introduce a security vulnerability to the joined network.

use_cases:
  primary:
    - "Wireless programming/debug of a Propeller over Wi-Fi"
    - "Serve control/monitoring web pages; serial intermediary to HTTP/WebSocket clients"
    - "TCP client connections to internet services (IoT)"
  secondary:
    - "OTA firmware/web-page updates via the module's web UI"

limitations:
  - "Native firmware loader is P1-era (Propeller Activity Board WX); P2 programming is via the #64007 adapter + P2_httpd firmware"
  - "DIP variant (#32420D) not compatible with XBee adapter boards"

documentation:
  primary: "32420 Parallax WX Wi-Fi Module Guide v1.0 (Parallax, 2016-05-12)"

resources:
  product_page: "www.parallax.com (search 32420)"
  api_guide: "32420 Parallax Wi-Fi Module Firmware/API Guide v1.0 (2016-11-16) - full serial + network command/token reference"
  firmware: "Parallax WiFi Firmware ESP8266 v1.4 (product-page download)"
  firmware_lineage: "esp-link (Thorsten von Eicken), open source; Parallax build 'Remora'"

see_also:
  - hardware/addon-wx-adapter.yaml
  - hardware/programming-prop-plug.yaml

ecosystem_position: "wireless_connectivity"
hardware_family: "parallax_wireless"
size_class: "module"
interface_type: "serial_wifi"
