description: >-
  2.4 GHz Wi-Fi module based on the ESP8266-WROOM-02. Runs as its own access
  point (AP), as a station (STA), or STA+AP; serves config + user web pages and a
  ~1 MB user file system; supports HTTP server, WebSocket server, and TCP client.
  Offers a transparent serial mode (wireless MCU programming/debug) and a command
  serial mode (host-MCU data exchange). On the P2 it is the radio behind the
  P2 WX Adapter (#64007); the SIP variant also works on a breadboard.

# NOTE: This is a peripheral Wi-Fi MODULE, not a P2 accessory-header occupant.
# It plugs into a WX 2x10x2 mm DIP socket or a 10-pin 0.1" SIP socket (e.g. the
# P2 WX Adapter #64007). See related: hardware/addon-wx-adapter.yaml.
eval_header_occupant: false

form_factors:
  source: "ESP8266 Wi-Fi Module (#32420) v1.0 05/12/2016, Features (32420D, a 3.3 V, 2 mm DIP package designed to work with the socket on the Propeller Activity Board, both original 32910 and WX #32912), p.1, and Functional Description (2) WX compatible headers, p.4; P2 side: P2 WX Adapter Add-on Board (#64007) v1.0 11/12/2020, overview and Specifications (a 10-pin SIP socket for the Parallax WX WiFi ESP8266 SIP Module #32420S on a standard 2x6 way accessory header), p.1"
  variants:
    - part: "32420S"
      package: "SIP, 10-pin 0.1 inch"
      host: >-
        The P2 WX Adapter (#64007), which carries the 2x6 accessory-header
        footprint -- this is the variant used on P2. Also works directly on a
        breadboard.
    - part: "32420D"
      package: "DIP, 2x10, 2 mm"
      host: >-
        The Propeller Activity Board socket (original #32910 and Activity Board
        WX #32912) -- P1 boards. Not compatible with Parallax XBee adapter boards.
  p2_note: >-
    Only the SIP variant has a P2 accessory-header path. #64007 is the sole P2 WX
    adapter and it takes the SIP module; there is no DIP equivalent with the eval
    header footprint. The DIP package exists to serve the P1 Activity Board socket,
    which is why both form factors appear in the module guide.

core:
  chip: "ESP8266-WROOM-02 (32-bit MCU + Wi-Fi, embedded TCP/IP, 16 Mbit SPI flash)"
  firmware: >-
    The module's configuration home page shows the firmware as "Remora" v1.0
    (2016-11-02 18:04:30) with the credit "LINK by Thorsten von Eicken"
    (ESP8266 Wi-Fi Module (#32420) v1.0 05/12/2016, Configuration Pages, p.6).
    OTA-upgradeable via the module's web UI.
  certifications: "FCC, CE, KCC, TELEC, LCIE, IC"

wifi:
  protocols: "802.11 b/g/n"
  modes: ["AP (up to 4 devices join)", "STA", "STA+AP"]
  network_protocols: "IPv4, TCP/HTTP"
  security: "WPA/WPA2; WEP/TKIP/AES encryption"
  range: "30 m line-of-sight"
  connections: "HTTP (server), WebSocket (server), TCP (client)"
  web_server: "micro web server (config pages + ~1 MB user file store) in STA or AP mode"

serial_modes:
  transparent: "Transparent serial communication mode, for wireless microcontroller programming and debugging (Activity Board WX)"
  command: "Command serial communication mode, for exchanging information with the host microcontroller"
  data_pins: "serial data on DO (module transmit) and DI (module receive); see pin_descriptions"
  settings: "The configuration Settings page holds the module name and the serial communication settings for data exchange with the host. The default settings are recommended for the Propeller in the Propeller Activity Board, and make it possible to load programs from a computer into a Propeller in an Activity Board WX through the module."
  source: "ESP8266 Wi-Fi Module (#32420) v1.0 05/12/2016, Features, p.2; Configuration Pages (Settings page), p.8; Pin Descriptions, p.11"

prop_plug_compat: >-
  On the SIP/breadboard header the first four pins GND, RES, DI, DO are
  compatible with the Parallax Prop Plug (#32201) for firmware reprogramming.
  See hardware/programming-prop-plug.yaml.

pin_descriptions:
  source: "ESP8266 Wi-Fi Module (#32420) v1.0 05/12/2016, Pin Descriptions, p.11; Functional Description (10) SIP Breadboard header, p.5"
  columns: "module pin, direction (as seen by the module), SIP pin number, DIP pin number, ESP8266 pin, function"
  pins:
    - {pin: "VIN",  direction: "power input",  sip: 1,  dip: 1,  esp8266: "-",    function: "(SIP) 3.3 V or 5 V power input; (DIP) 3.3 V power input"}
    - {pin: "/PGM", direction: "input",        sip: 2,  dip: 20, esp8266: "IO0",  function: "If held low during power-up, the ESP8266 boots ready for a serial firmware load. Can also be pulled low rapidly, 4x in a row, to put the module into AP+STA mode."}
    - {pin: "DBG",  direction: "output",       sip: 3,  dip: 9,  esp8266: "IO2",  function: "Transmits information about exchanges with the host microcontroller."}
    - {pin: "ASC",  direction: "output",       sip: 4,  dip: 15, esp8266: "IO5",  function: "Associate - high/low patterns indicating Wi-Fi mode and connection state."}
    - {pin: "/CTS", direction: "input/output", sip: 5,  dip: 12, esp8266: "IO13", function: "User configurable pin."}
    - {pin: "/RTS", direction: "output",       sip: 6,  dip: 16, esp8266: "IO15", function: "User configurable pin."}
    - {pin: "DO",   direction: "output",       sip: 7,  dip: 2,  esp8266: "TXD",  function: "Transmits serial data to the microcontroller host."}
    - {pin: "DI",   direction: "input",        sip: 8,  dip: 3,  esp8266: "RXD",  function: "Receives serial data from the microcontroller host."}
    - {pin: "/RES", direction: "input",        sip: 9,  dip: 5,  esp8266: "EN",   function: "Active-low reset line."}
    - {pin: "GND",  direction: "power input",  sip: 10, dip: 10, esp8266: "GND",  function: "Ground."}
    - {pin: "PS",   direction: "output",       sip: "-", dip: 7, esp8266: "IO4",  function: "May be used in future to remotely switch a WX carrier board's programming source from USB to Wi-Fi."}
    - {pin: "DTR",  direction: "output",       sip: "-", dip: 18, esp8266: "IO12", function: "Toggles the microcontroller reset line in a WX carrier board."}
  uart_orientation: >-
    DO is the module's transmit and DI its receive, so a host's TX goes to DI and
    a host's RX comes from DO. /RES resets the module; /PGM selects serial-firmware
    load at power-up and, pulsed low four times rapidly, forces AP+STA mode.
  prop_plug_note: >-
    On the SIP breadboard header the first four pins - GND, /RES, DI, DO - are
    compatible with the Parallax Prop Plug (#32201) for firmware reprogramming.
  schematic_caution: >-
    The guide's Pin Map figure is illustrative only; the Pin Descriptions table
    above is the authoritative statement of the pinout.

p2_support: "via the P2 WX Adapter (#64007)"
p2_support_note: >-
  The module's built-in program loading targets a Propeller in the Activity
  Board WX and is P1-era (this 2016 guide is for the Activity Board WX). P2 wireless programming
  is achieved by mounting the SIP module on the P2 WX Adapter (#64007) and
  loading the special P2 Wi-Fi firmware (P2_httpd_xxxx.ota), which hosts a
  drag/drop P2 binary loader - see hardware/addon-wx-adapter.yaml. The functional
  P2 path is documented via #64007; whether Parallax markets the bare module as
  'P2-supported' is not stated in the module guide.

configuration:
  default: "ships as an AP; join SSID 'wx-' + 6 alphanumerics (e.g. wx-dba23b)"
  ap_recovery: "rapidly ground/release /PGM 4x (or RST 4x on Activity Board WX) to re-enter AP mode"
  config_url: "http://192.168.4.1 (AP mode)"
  pages: ["Networks (mode + join)", "Files (~1 MB store)", "Settings (name + serial)", "Firmware (OTA .ota upgrade)"]
  security_caution: >-
    After joining a network, note the assigned IP, then set mode back to STA -
    leaving STA+AP can introduce a security vulnerability to the joined network.

use_cases:
  primary:
    - "Wireless programming/debug of a Propeller over Wi-Fi"
    - "Serve control/monitoring web pages; serial intermediary to HTTP/WebSocket clients"
    - "TCP client connections to internet services (IoT)"
  secondary:
    - "OTA firmware/web-page updates via the module's web UI"

limitations:
  - "Native firmware loader is P1-era (Propeller Activity Board WX); P2 programming is via the #64007 adapter + P2_httpd firmware"
  - "DIP variant (#32420D) not compatible with XBee adapter boards"

