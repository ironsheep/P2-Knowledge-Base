component: P2 Eval A/V Breakout Add-on Board
part_number: "64006H"
series: "P2 Eval Add-on Boards (#64006)"
manufacturer: "Parallax Inc."
status: "active_production"
p2kb_key: "p2kbHwAddonAvBreakout"
category: addon
aliases:
  - "A/V breakout board"
  - "audio video breakout"
  - "VGA audio board"
  - "P2 Eval A/V Breakout Add-on Board"
  - "64006H"
  - "#64006 add-on board"

description: >-
  Combined audio + video breakout: a 15-pin VGA socket, 4x RCA sockets
  (DIP-switch selectable between component video and audio), composite video,
  amplified 80 mW audio out (3.5 mm stereo headphone jack), and a microphone
  input (3.5 mm mono jack). Some features share I/O pins; a DIP switch selects
  whether the 4 RCA sockets are in Video or Audio mode. The largest #64006
  module.

# --- Eval-header board model (uniform across all #64006 / eval-header occupants) ---
eval_header_occupant: true
pin_group:
  size: 8
  addressing: >-
    actual_P2_pin = base_pin + offset. The board defines its functions by OFFSET
    within an 8-pin eval-header group; the user chooses which header (base_pin)
    it plugs into. base_pin is the first pin of that group.
  base_pin_options: [0, 8, 16, 24, 32, 40, 48, 56]
  base_pin_caution: >-
    Group 56-63 (Header H): P58-P63 are shared with the host's Flash SPI and
    serial pins - not recommended.

# Offsets 0-3 are DIP-switch mode-dependent: a "common" VGA function is always
# present, while the shared RCA socket carries video OR audio per the DIP switch.
dip_switch:
  function: "Selects whether the 4 RCA sockets are in VIDEO or AUDIO mode."
  common_note: "The VGA connections (offsets 0-4) remain active regardless of the switch."

signal_map:
  - offset: 0
    signal: "VGA HSync (+ DIP-selected RCA socket 0)"
    direction: out
    common: "VGA HSync (15-pin VGA socket)"
    modes:
      video: "RCA socket 0 (H - HSync)"
      audio: "RCA socket 0 (audio out via 22 uF cap)"
  - offset: 1
    signal: "VGA Blue (+ DIP-selected RCA socket 1)"
    direction: out
    common: "VGA Blue"
    modes:
      video: "RCA socket 1 (B - Blue)"
      audio: "RCA socket 1 (audio out via 22 uF cap)"
  - offset: 2
    signal: "VGA Green (+ DIP-selected RCA socket 2)"
    direction: out
    common: "VGA Green"
    modes:
      video: "RCA socket 2 (G - Green)"
      audio: "RCA socket 2 (audio out via 22 uF cap)"
  - offset: 3
    signal: "VGA Red (+ DIP-selected RCA socket 3)"
    direction: out
    common: "VGA Red"
    modes:
      video: "RCA socket 3 (R - Red)"
      audio: "RCA socket 3 (audio out via 22 uF cap)"
  - offset: 4
    signal: "VGA VSync"
    direction: out
    notes: "Always active (not affected by the DIP switch)."
  - offset: 5
    signal: "Microphone input (via 1 uF cap)"
    direction: in
    notes: "3.5 mm mono microphone jack; Tip = signal, Sleeve = ground. Read via ADC."
  - offset: 6
    signal: "Audio amplifier output (Left)"
    direction: out
    notes: "80 mW amplified audio; 3.5 mm stereo headphone jack, Tip = Left."
  - offset: 7
    signal: "Audio amplifier output (Right)"
    direction: out
    notes: "3.5 mm stereo headphone jack, Ring = Right; Sleeve = ground."

specifications:
  requires_host: true
  io_pins_used: 8
  compatible_hosts:
    - "P2 Eval Board (64000)"
