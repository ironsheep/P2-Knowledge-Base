  electrical:
    supply_voltage: "3.3V from host"
    current_consumption: "Variable - depends on audio amplifier usage"
    power_recommendation: "Use the P2-EVAL 3.3V LDO power selection when working with audio."
  physical:
    size: "Large module (3.2 x 1.3 in)"
    connector: "2x6 pass-through socket"
    mounting: "Single M3 mounting hole connected to GND"
    mounting_hardware: "M3 or UNC 4-40"

audio_capabilities:
  output:
    amplifier: "80 mW amplified audio output"
    connector: "3.5 mm stereo headphone jack"
    wiring: "Tip = Left, Ring = Right, Sleeve = Ground"
    channels: 2
    offsets: [6, 7]
  input:
    microphone: "Microphone input via 1 uF capacitor"
    connector: "3.5 mm mono microphone jack"
    wiring: "Tip = Signal, Sleeve = Ground"
    offset: 5
  rca_audio:
    outputs: "4 RCA jacks (AUDIO dip position)"
    coupling: "Via 22 uF capacitors"
    offsets: [0, 1, 2, 3]

video_capabilities:
  vga_output:
    connector: "15-pin VGA socket"
    signals: "HSync, VSync, RGB"
    offsets: {hsync: 0, blue: 1, green: 2, red: 3, vsync: 4}
  rca_video:
    outputs: "4 RCA jacks (VIDEO dip position)"
    signals: "RGBS (Red, Green, Blue, Sync) - 4-band component / composite-sync"
    offsets: {hsync: 0, blue: 1, green: 2, red: 3}
  composite_video:
    connector: "RCA socket"
    signal_type: "Composite video"
  component_video:
