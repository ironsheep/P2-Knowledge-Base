# SMART PIN CONFIGURATION DETAILS
smart_pin_config:
  mode: "P_PWM_SAWTOOTH | P_OE"
  x_register:
    word_high: "clkfreq / 1_000_000"
    word_low: "20_000"
    description: "High word = unit timing (1us), Low word = period (20ms)"
  y_register: "pulse_width_us"
  update_method: "wypin(pin, new_pulse_us)"

# CODE PATTERNS (from OBEX 2876)
code_patterns:
  spin2:
    obex_driver_usage: |
      OBJ
        servo : "jm_servo"

      PUB main()
        servo.start(0, 90)               ' Start servo on P0 at 90 degrees
        servo.write(0, 45)               ' Move to 45 degrees
        servo.write(1, 1500)             ' Move using microseconds

    single_servo_init: |
      PUB init_servo(pin, angle_deg) | x, us
        ' Initialize single servo using Smart Pin
        angle_deg := 0 #> angle_deg <# 180
        us := angle_deg * 10 + 600       ' Convert degrees to microseconds

        x.word[0] := clkfreq / 1_000_000 ' Unit timing (1 microsecond)
        x.word[1] := 20_000              ' Period (20ms = 50Hz)

        pinstart(pin, P_OE | P_PWM_SAWTOOTH, x, us)

    set_position_degrees: |
      PUB set_servo_degrees(pin, angle) | us
        angle := 0 #> angle <# 180       ' Clamp to valid range
        us := angle * 10 + 600           ' Convert to microseconds
        wypin(pin, us)                   ' Update Smart Pin

    set_position_microseconds: |
      PUB set_servo_us(pin, us)
        us := 600 #> us <# 2400          ' Clamp to valid range
        wypin(pin, us)                   ' Update Smart Pin

    stop_servo: |
      PUB stop_servo(pin)
        pinclear(pin)                    ' Disable Smart Pin
        pinfloat(pin)                    ' Release output driver

    multi_servo_init: |
      ' Initialize multiple servos (from OBEX jm_servo_multi)
      CON
        SVO_BASE = 0
        N_SERVOS = 8

      VAR
        word usecs[N_SERVOS]             ' Position storage

      PUB init_all_servos(base_pin) | i, x
        x.word[0] := clkfreq / 1_000_000
        x.word[1] := 20_000

        REPEAT i FROM 0 TO N_SERVOS - 1
          usecs[i] := 1500               ' Center position
          pinstart(base_pin + i, P_OE | P_PWM_SAWTOOTH, x, 1500)

    update_all_servos: |
      PUB write_all_servos(base_pin) | i
        REPEAT i FROM 0 TO N_SERVOS - 1
          wypin(base_pin + i, usecs[i])

