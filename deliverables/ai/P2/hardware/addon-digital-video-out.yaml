component: P2 Eval Digital Video Out Add-on Board
part_number: "64006D"
series: "P2 Eval Add-on Boards (#64006)"
manufacturer: "Parallax Inc."
status: "active_production"
p2kb_key: "p2kbHwAddonDigitalVideoOut"
category: addon
aliases:
  - "digital video out board"
  - "DVI add-on"
  - "HDMI add-on board"
  - "P2 Eval Digital Video Out Add-on Board"
  - "64006D"
  - "#64006 add-on board"

description: >-
  HDMI-type connector for experimenting with digital video standards. The eight
  signal pins carry the TMDS clock plus three data lanes as differential pairs,
  driven by the P2 streamer. Unused connector signals (CEC, RSVD, SCL, SDA, 5V,
  HPD) sit on an unpopulated 0.1 inch pad row; an adjacent ACC 5V pad lets the
  5V line be bridged when a monitor needs 5V.

# --- Eval-header board model (uniform across all #64006 / eval-header occupants) ---
eval_header_occupant: true
pin_group:
  size: 8
  addressing: >-
    actual_P2_pin = base_pin + offset. The board defines its functions by OFFSET
    within an 8-pin eval-header group; the user chooses which header (base_pin)
    it plugs into. base_pin is the first pin of that group.
  base_pin_options: [0, 8, 16, 24, 32, 40, 48, 56]
  base_pin_caution: >-
    Group 56-63 (Header H): P58-P63 are shared with the host's Flash SPI and
    serial pins - not recommended.

signal_map:
  - offset: 0
    signal: "TMDS clock - (CLK-)"
    direction: out
    notes: "Differential pair with offset 1; driven by the P2 streamer."
  - offset: 1
    signal: "TMDS clock + (CLK+)"
    direction: out
    notes: "Differential pair with offset 0."
  - offset: 2
    signal: "TMDS data lane 0 - (D0-)"
    direction: out
    notes: "Differential pair with offset 3."
  - offset: 3
    signal: "TMDS data lane 0 + (D0+)"
    direction: out
    notes: "Differential pair with offset 2."
  - offset: 4
    signal: "TMDS data lane 1 - (D1-)"
    direction: out
    notes: "Differential pair with offset 5."
  - offset: 5
    signal: "TMDS data lane 1 + (D1+)"
    direction: out
    notes: "Differential pair with offset 4."
  - offset: 6
    signal: "TMDS data lane 2 - (D2-)"
    direction: out
    notes: "Differential pair with offset 7."
  - offset: 7
    signal: "TMDS data lane 2 + (D2+)"
    direction: out
    notes: "Differential pair with offset 6."

# Connector signals brought out to an unpopulated 0.1 inch pad row but NOT wired
# to any P2 pin. These are board detail, not part of the 8-pin signal_map.
unused_connector_signals:
  description: "Additional HDMI connector signals available on an unpopulated 0.1 inch pad row, not connected to P2 pins."
  pads:
    - name: "CEC"
      description: "Consumer Electronics Control"
    - name: "RSVD"
      description: "Reserved signal"
    - name: "SCL"
      description: "I2C clock for DDC"
    - name: "SDA"
      description: "I2C data for DDC"
    - name: "5V (5V-arrow)"
      description: "5V output toward the monitor"
      note: "Adjacent ACC 5V pad sits 0.1 inch away; bridge the two pads to drive 5V on this line."
    - name: "HPD"
      description: "Hot Plug Detect"
  acc_5v_bridge:
    description: "Optional 5V supply to the connected monitor."
    implementation: "Two 0.1 inch-spaced pads: the 5V-arrow pad and the ACC 5V pad."
    usage: "Solder a header and fit a shunt jumper (or bridge the pads) when a monitor requires 5V on the 5V line."
    note: "Some monitors require 5V on the 5V line for proper operation."

