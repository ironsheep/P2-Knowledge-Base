component: P2 Eval Digital Video Out Add-on Board
part_number: "64006D"
series: "P2 Eval Add-on Boards (#64006)"
manufacturer: "Parallax Inc."
p2kb_key: "p2kbHwAddonDigitalVideoOut"
category: addon
aliases:
  - "digital video out board"
  - "DVI add-on"
  - "HDMI add-on board"
  - "P2 Eval Digital Video Out Add-on Board"
  - "64006D"
  - "#64006 add-on board"

description: >-
  An HDMI-type connector which can be used for experimenting with various video
  standards. The eight signal pins connected to the P2-EVAL header are labelled
  CLK-, CLK+, D0-, D0+, D1-, D1+, D2-, D2+. The unused connector signals are in
  unused_connector_signals below. The streamer's digital video
  (DVI/HDMI) output, its pin order and its clock rule are in
  architecture/streamer/colorspace-and-dvi.yaml.
source: "P2 Eval Add-on Boards (#64006 Series) v2.0 1/12/2021, P2 Eval Digital Video Out Add-on Board (#64006D), p.5 (the description paragraph, the I/O Pin / Function table for signal_map, and the unused-pad paragraph)"

# --- Eval-header board model (uniform across all #64006 / eval-header occupants) ---
eval_header_occupant: true
pin_group:
  size: 8
  addressing: >-
    actual_P2_pin = base_pin + offset. The board defines its functions by offset
    within an 8-pin eval-header group; the user chooses which header (base_pin)
    it plugs into. base_pin is the first pin of that group.
  base_pin_options: [0, 8, 16, 24, 32, 40, 48, 56]
  source: "Propeller 2 Eval Board Rev C (64000) v2.0 29/6/2020, 11. I/O Pin Breakout Edge Headers, p.9 (each edge header carries one group of eight pins); board photograph, p.1 (edge-header silkscreen P0-P7 ... P56-P63); I/O Pin Assignments (P0-P55 fully free; Alternative functions for P56-P63), p.15"
  p56_p63_group: 'base_pin 56 is the Eval Board''s dedicated group P56-P63, which the Eval Board routes to its own circuits: P58-P61 are the boot flash and microSD SPI lines, P62/P63 the PC-USB serial link (P2 TXD/RXD), every pin P56-P63 drives an on-board buffered LED, and P57 can be routed to the common LDO enable (a user option, not connected by default). P0-P55 are the fully free pins; Parallax''s documents also give 58 fully free pins.'

signal_map:
  - offset: 0
    signal: "CLK-"
    notes: "Pair with offset 1 (CLK+)."
  - offset: 1
    signal: "CLK+"
    notes: "Pair with offset 0 (CLK-)."
  - offset: 2
    signal: "D0-"
    notes: "Pair with offset 3 (D0+)."
  - offset: 3
    signal: "D0+"
    notes: "Pair with offset 2 (D0-)."
  - offset: 4
    signal: "D1-"
    notes: "Pair with offset 5 (D1+)."
  - offset: 5
    signal: "D1+"
    notes: "Pair with offset 4 (D1-)."
  - offset: 6
    signal: "D2-"
    notes: "Pair with offset 7 (D2+)."
  - offset: 7
    signal: "D2+"
    notes: "Pair with offset 6 (D2-)."
streamer_pin_order: "architecture/streamer/colorspace-and-dvi.yaml (dvi.pin_order)"

# Unused signal pins from the video connector, next to an unpopulated 0.1 inch pad
# row; the 8-pin signal_map above lists the signals connected to the P2-EVAL header.
unused_connector_signals:
  source: "P2 Eval Add-on Boards (#64006 Series) v2.0 1/12/2021, P2 Eval Digital Video Out Add-on Board (#64006D) (unused-signal note), p.5"
  description: "Unused signal pins from the video connector, labelled on the PCB next to an unpopulated 0.1 inch pitch row of 6 pads."
  pads:
    - name: "CEC"
    - name: "RSVD"
    - name: "SCL"
    - name: "SDA"
    - name: "5V (5V-arrow)"
      description: "5V output pad"
      note: "The ACC 5V pad sits beside it, 0.1 inch away."
    - name: "HPD"
  acc_5v_bridge:
    description: "The ACC 5V pad is the 5V supply from the accessory socket. Some video monitors require a 5V signal connecting to the 5V-arrow pin."
    implementation: "Two 0.1 inch-spaced pads: the 5V-arrow pad and the ACC 5V pad."
    usage: "For example, a 0.1 inch pitch header can be soldered here, and a shunt plug used when 5V is required to the monitor."

specifications:
  source: "P2 Eval Add-on Boards (#64006 Series) v2.0 1/12/2021, P2 Eval Digital Video Out Add-on Board (#64006D), p.5, the shared connector / compatibility / mounting facts, p.1, and PCB Dimensions (\"There are three sizes for the accessory set boards\"; drawings headed A/V module, Goertzel module and Small modules), pp.11-12. Host VIO rail: Propeller 2 Eval Board Rev C (64000) v2.0 29/6/2020, Key Specifications (\"VIO power supplies: 3.3 V up to 300 mA per 8 I/O pins\"), p.2"
  requires_host: true
  io_pins_used: 8
  compatible_hosts:
    - "P2 Eval Board (64000)"
    - "P2 Edge Module Breadboard (64020)"
    - "P2 Edge Mini Breakout Board (64019) with P2 Edge Module"
  electrical:
    supply_voltage: "Not documented: the board's own supply voltage"
  physical:
    size: "Small module (of the three PCB sizes, the A/V module and the Goertzel module are drawn separately; the remaining boards are small modules)"
    connector: "2x6 pass-through socket"
    mounting: "Single M3 mounting hole connected to GND"
    mounting_hardware: "M3 or UNC 4-40"
    hole_diameter: "3.2mm (126 mil)"
    pad_ring: "5mm (200 mil)"
    standoff: "The hole can be used to fit a 9.5mm long standoff to act as a leg and provide support when connected to the P2-EVAL board."

video_interface:
  connector:
    type: "HDMI-type connector"
    purpose: "Experimenting with various video standards"
  signaling: "architecture/streamer/colorspace-and-dvi.yaml"
  source: "P2 Eval Add-on Boards (#64006 Series) v2.0 1/12/2021, P2 Eval Digital Video Out Add-on Board (#64006D), p.5: \"The Digital Video Out Accessory Board provides an HDMI-type connector which can be used for experimenting with various video standards.\""

compatibility:
