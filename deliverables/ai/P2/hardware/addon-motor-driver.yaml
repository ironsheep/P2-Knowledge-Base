    absolute_maximum_vin: "50 V"
    logic_supply: "VIO3V3, 3.3 V (absolute maximum 3.3 V)"
    onboard_12v: "switching boost regulator, up to 50 mA to the MOSFET driver circuits, powered from VIO3V3 on the UPPER accessory header"
    onboard_5v: "switching boost regulator, up to 100 mA, powering the HALL/INPUTS header for user sensors, powered from VIO3V3 on the LOWER accessory header"
  current:
    continuous_all_phases: "20 A maximum"
    surge_all_phases: "60 A maximum"
    continuous_per_phase: "20 A maximum"
    pulse_per_phase: "60 A maximum"
    continuous_power_all_phases: "240 W typical, 800 W maximum"
  logic_levels:
    io_range: "0 to 3.3 V on IO+[0...15]"
    interface: "3.3 V TTL, PWM"
  terminals:
    rating: "VIN and output-channel spring terminal blocks rated 32 A / 400 V"
    conductor_solid: "0.2 mm2 to 4 mm2"
    conductor_awg: "24 to 12 AWG"
    stripping_length: "10 mm"
    connection_method: "push-in spring connection, nominal 2.5 mm2"
  mosfets: "two high-power N-channel MOSFETs per channel in a common half-bridge arrangement, Micro Commercial MCAC85N06Y-TP, with large internal body diodes for back-EMF protection"
  mounting_holes: "two grounded plated holes, 3.2 mm (0.125 inch) diameter; 3 mm standoffs of 8 mm or 9 mm length are suggested for support"
  operating_temperature: "-40 to +85 C (-40 to +185 F)"
  pcb_dimensions: "2.75 x 2.75 in (70 x 70 mm)"
  revision_note: "Guide v2.0 / Rev B changed the PCB from 80x64 mm to 70x70 mm, upgraded the MOSFET drivers, and added the current-sense amplifier to the low-side shunt."

use_cases:
  primary:
    - "Driving a 3-phase BLDC / hub motor (sinusoidal 180 or classic 120 commutation)"
    - "4-phase stepper motor control"
    - "One or two bidirectional brushed DC motors; up to four uni-directional"
  secondary:
    - "Robotics drive bases (e.g. with Motor Mount & Wheel Kit #28962 or 6.5\" Hub Motor #27860)"

safety_notes:
  - "Do not install on a conductive surface (high-current pins on the underside)."
  - "Use an inline fuse near VIN when powered from an unprotected source (e.g. battery)."
  - "Use a power source rated for the motor's startup/full-load surge current."

limitations:
  - "Uses 16 P2 pins (a full dual accessory header)"
  - "No example/driver code in the guide (product-page download)"
  - "High-current board - power-source and cable ratings are the user's responsibility"

documentation:
