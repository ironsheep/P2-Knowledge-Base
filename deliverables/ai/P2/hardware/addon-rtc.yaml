description:
  source: >-
    P2 RTC Add-on (#64013) Guide v1.0 (Parallax Inc., 2022-11-29) --
    engineering/ingestion/sources/P2-RTC-Add-on/P2-RTC-Add-on-text.txt:15-37.
  text: >-
    "The P2 RTC Add-On Board provides a real time clock with calendar and alarm
    functionality to the Propeller 2 (P2X8C4M64P) multicore microcontroller." Built
    around the NXP PCF8523 CMOS RTC and talked to over I2C. The small board includes
    a rechargeable lithium battery that is kept charged while the RTC is powered and
    lets the RTC keep time while power is disconnected. It fits any standard single
    Parallax P2 accessory socket - the connector is a standard 2x6-way 0.1 inch pitch
    socket - and can be used with a wide range of microcontrollers employing 3.3 V
    signal levels. Data is transferred serially over an I2C bus at up to 1000 kbit/s;
    alarm and timer functions can generate a wake-up signal on an interrupt pin, an
    offset register allows fine-tuning of the clock, and a backup-battery switchover
    circuit detects power failures and automatically switches to the battery supply.

# --- Eval-header board model (uniform across accessory-header occupants) ---
eval_header_occupant: true
pin_group:
  size: 8
  addressing: >-
    actual_P2_pin = base_pin + offset. The board uses only offsets +0/+1 of an
    8-pin accessory-header group; the user chooses which header (base_pin) it
    plugs into. base_pin is the first pin of that group.
  base_pin_options: [0, 8, 16, 24, 32, 40, 48, 56]

power:
  source: "64013 P2 RTC Add-on Guide, pin table -- engineering/ingestion/sources/P2-RTC-Add-on/P2-RTC-Add-on-text.txt:56"
  VIO3V3: >-
    3.3 V supply voltage. It powers the RTC board AND trickle-charges the on-board
    backup battery. The trickle charge is why the cell holds time across a power
    failure, so a board left unpowered for long periods will eventually lose its
    backup reserve.
  backup_current: "150 nA typical"

signal_map:
  - offset: 0
    signal: "SCL / INT / CLKOUT (shared)"
    direction: bidir
    notes: >-
      One shared IO pin: I2C clock (SCL, input), OR interrupt output (INT), OR
      clock output (CLKOUT). See pin_mode_tip.
  - offset: 1
    signal: "SDA (I2C serial data)"
    direction: bidir
    notes: "I2C serial data I/O (open-drain)."
  - {offset: 2, signal: "Not Connected", direction: na, notes: "N/C."}
  - {offset: 3, signal: "Not Connected", direction: na, notes: "N/C."}
  - {offset: 4, signal: "Not Connected", direction: na, notes: "N/C."}
  - {offset: 5, signal: "Not Connected", direction: na, notes: "N/C."}
  - {offset: 6, signal: "Not Connected", direction: na, notes: "N/C."}
  - {offset: 7, signal: "Not Connected", direction: na, notes: "N/C."}

interface: i2c
pin_mode_tip:
  source: >-
    Board fact from the Parallax P2 RTC Add-on (#64013) Guide v1.0 (2022-11-29),
    "Code Tip" --
    engineering/ingestion/sources/P2-RTC-Add-on/P2-RTC-Add-on-text.txt:72-77.
    The P2-side mechanism is corrected against the Spin2 v55 built-in symbol table
    (engineering/ingestion/sources/spin2-v55/spin2-v55-text.txt:1500-1509), the
    P2 Datasheet Pin Mode legend
    (engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:1144). Those
    documentary sources are the authority. EF-063 and EF-064
    (engineering/ingestion/external-sources/hardware-verification/P2-EMPIRICAL-FINDINGS.md:827,840,
    real P2, 2026-08-20) corroborate the mechanism only INCIDENTALLY: they are rig
    apparatus for a streamer-fed DAC %TT finding (:813) and a streamer
    pin-placement finding (:834). Neither is a drive-strength finding.
  board_fact: >-
    SCL, INT and CLKOUT share the single +0 IO pin, so only one of the three can
    be in use at a time. To use INT or CLKOUT, first configure them over I2C per
    the PCF8523 datasheet API, then stop driving SCL and read +0 while holding it
    weakly high (the RTC drives INT/CLKOUT open-drain).
  p2_side_mechanism: >-
    Hold the pin weakly high with P_HIGH_150K and DIR HIGH: the pin then drives
    high through 150 kOhm, weak enough for the RTC's open-drain output to pull it
    low, while IN still reports the pin state.
  do_not_copy_the_guides_wording: >-
    The #64013 Code Tip says "set the P2 Smartpin (or equivalent) input mode to
    150 k-ohm pull-up". That cannot work on a P2 and must not be copied. (1) The
    P2 has NO pull-up resistors - P_HIGH_150K selects a 150 kOhm DRIVE STRENGTH
    ("Drive high 150k-ohm" in the Spin2 v55 symbol table). (2) Input mode is DIR
    LOW, and every drive selection is inactive while the pin is an input; the pin
    simply floats. Filed as engineering/ingestion/SOURCE-ERRATA.md E-004.
  scl_pull_up_caveat: >-
    The same Code Tip prescribes a "3.3 k-ohm pull-up" for I2C SCL. The P2 drive
    ladder has no 3.3 kOhm rung: its drive-high selections are FAST (30 mA),
    1.5 kOhm, 15 kOhm, 150 kOhm, 1 mA, 100 uA, 10 uA and float. Use the nearest
    rung the bus timing tolerates (P_HIGH_1K5 or P_HIGH_15K), again with DIR HIGH,
    or an external pull-up. GAP: the #64013 guide does not say whether the RTC
    board carries its own SDA/SCL pull-ups, and no ingested source states it - the
    board schematic would settle it.

rtc_chip:
  part: "NXP PCF8523"
  type: "CMOS real-time clock + calendar + alarm"
  bus: "I2C (open-drain), up to 1000 kbit/s"
  i2c_speeds_khz: [100, 400, 1000]
  signal_levels: "3.3 V"
  i2c_slave_address_7bit: "$68 (%1101000) - the single fixed address reserved for the PCF8523"
  i2c_address_bytes: "write = $D0 (%1101_0000), read = $D1 (%1101_0001)"
  register_format: "BCD for time/date counters (use bcd<->dec conversion)"
  software_reset: "write $58 (%01011000) to Control_1 (00h)"
  source_trace: >-
    Address + register map are NOT in the board guide (it defers to the
    datasheet); resolved from the NXP PCF8523 datasheet (Table 46 slave address;
    register-overview Table 5, addresses 00h-13h) and CORROBORATED by the
    official Parallax 64013 RTC driver (64013_RTC_Driver.spin2, M. Mulholland /
    JonnyMac) which uses $68 at 400 kHz with its "3.3K pull-up" setting. (That is
    the driver library's own term for a pull-up strength; on the P2 there is no
    pull-up resistor and no 3.3 kOhm rung - see pin_mode_tip.) (Gap G-013
    resolved.)
  register_map:
    "00h": "Control_1 (CAP_SEL, STOP, SR, 12_24, SIE, AIE, CIE)"
    "01h": "Control_2 (alarm/timer interrupt flags + enables)"
    "02h": "Control_3 (PM[2:0] battery-switchover mode, BSF/BLF battery flags)"
    "03h": "Seconds (bit7 = OS oscillator-stop flag) + SECONDS 0-59"
    "04h": "Minutes 0-59"
    "05h": "Hours (AMPM + 12h, or 0-23 24h mode)"
    "06h": "Days 1-31"
    "07h": "Weekdays 0-6"
    "08h": "Months 1-12"
    "09h": "Years 0-99"
    "0Ah-0Dh": "Minute/Hour/Day/Weekday alarm (each with its AEN enable bit)"
    "0Eh": "Offset (MODE + OFFSET[6:0] clock fine-tuning)"
    "0Fh": "Tmr_CLKOUT_ctrl (COF[2:0] CLKOUT freq, timer-A/B mode)"
    "10h-13h": "Timer A freq/reg, Timer B freq/reg"
  clkout_frequencies_hz: [32768, 16384, 8192, 4096, 1024, 32, 1, 0]

use_cases:
  primary:
    - "Battery-backed timekeeping / calendar across power loss"
    - "Alarm and periodic-interrupt generation (PCF8523 INT)"
    - "Timestamped data logging"
  secondary:
    - "Clock output (CLKOUT) source for a P2 application"

limitations:
  - "Uses a shared +0 pin for SCL/INT/CLKOUT - cannot use all three simultaneously"
  - "Time/date stored in BCD; I2C address ($68) + register map come from the PCF8523 datasheet, not the board guide"
  - "No code in the board guide itself; an official MIT Spin2 driver is on the product page"

documentation:
  primary: "64013 P2 RTC Add-on Guide v1.0 (Parallax, 2022-11-29)"

resources:
  product_page: "www.parallax.com (search 64013) - latest guide, schematic, example code"
  rtc_datasheet: "NXP PCF8523 datasheet (www.nxp.com) - authoritative for I2C address + register map"
  example_driver: "Parallax 64013 RTC Driver/Example (Spin2) - on the 64013 product page; uses jm_i2c at 400 kHz with that library's 3.3K pull-up setting (see pin_mode_tip for what the P2 actually does)"
  battery_datasheet: "Seiko MS421R (https://www.sii.co.jp/en/)"

physical_and_battery:
  source: "64013 P2 RTC Add-on reference -- engineering/ingestion/sources/P2-RTC-Add-on/complete-P2-RTC-Add-on-reference.md:54-67"
  cell: "Seiko MS421R rechargeable lithium-metal, built-in and non-removable"
  cell_capacity: "1.5 mAh nominal, 0.11 g"
  pcb_dimensions: "0.8 x 1 in (20.32 x 25.4 mm)"
  mounting_hole: "3.2 mm diameter"
  headers: "dual 2x6-pin female passthrough, 0.1 inch spacing (passthrough = stackable)"
  operating_temperature: "-20 to +60 C (-4 to +140 F)"
  transport_classification: >-
    The built-in non-removable lithium-metal cell contains <= 1 g lithium and meets
    UN Manual of Tests and Criteria Part III section 38.3, so the board is
    transportable as Class 9 Dangerous Goods. A product integrator shipping this
    board needs this and cannot derive it from the electrical specification.

