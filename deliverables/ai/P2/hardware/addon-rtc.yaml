component: P2 RTC Add-on Board
part_number: "64013"
series: "P2 Accessory Add-on Boards"
manufacturer: "Parallax Inc."
status: "active_production"
p2kb_key: "p2kbHwAddonRtc"
category: addon
aliases:
  - "RTC add-on"
  - "real-time clock board"
  - "P2 RTC Add-on Board"
