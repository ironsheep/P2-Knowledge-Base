edge_modules:
  source: >-
    P2-EC Edge Module Rev D Product Guide v3.0 (Parallax Inc., 2022-06-03) --
    engineering/ingestion/sources/edge-standard-module/edge-standard-module-narrative.txt:73-90;
    P2-EC32MB Edge Module Rev B Guide v2.0 (Parallax Inc., 2022-05-23) --
    engineering/ingestion/sources/edge-32mb-module/edge-32mb-module-narrative.txt:113-127,
    :417.
  p2_ec_standard:
    part_number: "P2-EC"
    flash_memory: "16 MB (128 Mb) SPI flash"
    psram_memory: "none"
    crystal_frequency: "20 MHz TCXO (+/-0.5 PPM)"
    voltage_regulation: "on-board VDD 1.8 V up to 3 A; eight LDO VIO regulators, 3.3 V up to 300 mA per 8 I/O pins; input 5-16 VDC"
    dimensions: "1.45 x 2.04 in (37 x 51.7 mm)"
    io_pins_accessible: 64
    io_pins_fully_free: 56
    smart_pins: 64
    form_factor: "Edge connector module, double-sided 80-way 0.05 in (1.27 mm) edge slot"
    carrier_compatibility: ["standard_breakout", "mini_breakout", "breadboard_carrier"]
    cost_tier: "budget"
    primary_applications: ["general_purpose", "education", "prototyping"]
    educational_rating: "excellent"

  p2_ec_32mb:
    part_number: "P2-EC32MB"
    flash_memory: "16 MB (128 Mb) SPI flash"
    psram_memory: "32 MB (256 Mb) PSRAM, four 8 MB chips"
    crystal_frequency: "20 MHz TCXO (+/-0.5 PPM)"
    voltage_regulation: "on-board VDD 1.8 V up to 3 A; eight LDO VIO regulators, 3.3 V up to 300 mA per 8 I/O pins; input 5-16 VDC"
    dimensions: "1.45 x 2.04 in (37 x 51.7 mm)"
    io_pins_accessible: 46
    io_pins_fully_free: 40
    smart_pins: 64
    psram_pins: "P40-P57 are dedicated to the on-module RAM and do not reach the edge connector"
    form_factor: "Edge connector module, double-sided 80-way 0.05 in (1.27 mm) edge slot"
    carrier_compatibility: ["standard_breakout", "mini_breakout", "breadboard_carrier"]
    cost_tier: "premium"
    primary_applications: ["advanced_projects", "large_programs", "data_logging"]
    educational_rating: "good"
  corrections_applied_2026_08_25: >-
    Both modules shipped dimensions "27x40mm" (the guides say 37 x 51.7 mm) and
    io_pins_total 64 for the P2-EC32MB (only 46 reach the edge connector).
    Corrected from the guides above; see P2KB-CORRECTION-FINDINGS.md.

development_boards:
  source: >-
    #64000 Propeller 2 Eval Board Rev C Guide v2.0 (Parallax Inc., 2020-06-29) --
    engineering/ingestion/sources/p2-eval-board/complete-p2-eval-board-reference.md:43-84,
    :103-127, :253-269 (the forced-OCR re-ingestion, F-250);
    64029 P2 Edge Breakout Board Guide v1.0 (2023-03-01) --
    engineering/ingestion/sources/edge-breakout-board/edge-breakout-board-narrative.txt:11-64;
    64019 P2 Edge Mini Breakout Board Guide v1.1 (2020-11-30) --
    engineering/ingestion/sources/edge-mini-breakout/edge-mini-breakout-narrative.txt:16-65;
    64020 P2 Edge Module Breadboard Product Guide v1.2 (2021-01-07) --
    engineering/ingestion/sources/edge-module-breadboard/edge-module-breadboard-narrative.txt:20-69.
  p2_eval_board:
    part_number: "64000"
    part_number_note: "the limited-edition engineering-sample board is #64000-ES; the Rev C guide documents #64000"
    p2_chip: "P2X8C4M64PES soldered on the board -- this is NOT an edge-module carrier"
    flash_memory: "16 MB (128 Mbit) SPI flash, W25Q128JVSIM, on the board itself"
    psram_memory: "none"
    crystal_frequency: "20 MHz SMT crystal"
    voltage_regulation: "1.8 V 2 A switching regulator for VDD; LDO 3.3 V VIO regulators, 300 mA per 8 I/O pins; 5 V from USB"
    dimensions: "3.55 x 3.55 in (octagonal outline; the guide prints '(90 x 90 cm)' -- a source typo for 90 mm)"
    io_pins_accessible: 64
    smart_pins: 64
    usb_connectivity: "two micro-USB sockets -- PC USB (programming + serial + power, 500 mA limit) and AUX USB (power only, 2000 mA limit). No USB-C and no barrel jack."
    programming: "built-in FTDI USB-to-serial, user selectable up to 3 Mbps"
    sd_card_support: "microSD socket, power-cycled when the reset button is pressed"
    addon_headers: "eight I/O Pin Breakout Edge Headers, each taking a 2x6 pass-through accessory board; together they cover all 64 I/O pins in 8 groups of 8"
    form_factor: "Full development board"
    expansion_options: ["addon_boards", "edge_headers", "aux_power_pads"]
    cost_tier: "mid_range"
    primary_applications: ["full_development", "education", "prototyping", "characterization"]
    educational_rating: "excellent"

  standard_breakout:
    part_number: "64029"
    name: "P2 Edge Breakout Board"
    flash_memory: "depends on the fitted edge module"
    psram_memory: "depends on the fitted edge module"
    crystal_frequency: "n/a -- the crystal is on the edge module"
    voltage_regulation: "5 VDC input (absolute maximum 5.5 VDC) via a centre-positive 2.1 mm barrel jack; VIO 3.3 V up to 300 mA per 8 I/O pins comes from the edge module"
    dimensions: "4 x 1.4 in (101.6 x 35.6 mm)"
    io_pins_accessible: 64
    smart_pins: 64
    usb_connectivity: "none -- programming requires a Prop Plug (#32201) on the dedicated header, serial up to 2 MBaud"
    pin_access: "all 64 pins at eight 2x6 way 0.1 in accessory headers"
    mounting_holes: "four 3.2 mm diameter plated holes connected to GND"
    form_factor: "Edge module carrier / breakout board"
    expansion_options: ["accessory_headers", "wire_connections"]
    cost_tier: "budget"
    primary_applications: ["custom_circuits", "embedded_systems", "production"]
    educational_rating: "good"

  mini_breakout:
    part_number: "64019"
    name: "P2 Edge Mini Breakout Board"
    flash_memory: "depends on the fitted edge module"
    psram_memory: "depends on the fitted edge module"
    crystal_frequency: "n/a -- the crystal is on the edge module"
    voltage_regulation: "5 VDC input (absolute maximum 5.5 VDC) via a centre-positive 2.1 mm barrel jack; VIO 3.3 V up to 300 mA per 8 I/O pins comes from the edge module"
    dimensions: "3.15 x 1.4 in (80 x 35.5 mm)"
    io_pins_accessible: 40
    smart_pins: 64
    usb_connectivity: "none -- programming requires a Prop Plug (#32201) on the dedicated header, serial up to 2 MBaud"
    pin_access: "40 pins (P0-P31 and P56-P63) at five 0.1 in header sockets -- four accessory headers plus one programming header. P32-P55 reach no header; the guide says they may be picked up with jumper wires on the bottom side of the PCB."
    prototyping: "two 0.1 in pitch 4x5 matrix prototyping sections, either side of the edge connector"
    form_factor: "Compact edge module carrier"
    expansion_options: ["accessory_headers", "jumper_wires"]
    cost_tier: "budget"
    primary_applications: ["space_constrained", "embedded", "production"]
    educational_rating: "fair"

  breadboard_carrier:
    part_number: "64020"
    name: "P2 Edge Module Breadboard"
    flash_memory: "depends on the fitted edge module"
    psram_memory: "depends on the fitted edge module"
    crystal_frequency: "n/a -- the crystal is on the edge module"
    voltage_regulation: "5 VDC input (absolute maximum 5.5 VDC) via a centre-positive 2.1 mm barrel jack; VIO 3.3 V up to 300 mA per 8 I/O pins comes from the edge module"
    dimensions: "3.5 x 8 in (88.9 x 203.2 mm)"
    io_pins_accessible: 64
    smart_pins: 64
    usb_connectivity: "none -- programming requires a Prop Plug (#32201) on the dedicated header, serial up to 2 MBaud"
    breadboard_mounting: "large integrated solderless breadboard; dual 30 x 5-socket rows in 2 columns, 60 rows total"
    pin_access: "all 64 pins at 0.1 in pin sockets around the breadboard and at eight 2x6 way accessory headers"
    servo_ports: "eight 5V servo/sensor ports with series resistors for compatibility with the 3.3 V P2 I/Os"
    form_factor: "Breadboard carrier"
    expansion_options: ["breadboard", "accessory_headers", "servo_ports", "jumper_wires"]
    cost_tier: "budget"
