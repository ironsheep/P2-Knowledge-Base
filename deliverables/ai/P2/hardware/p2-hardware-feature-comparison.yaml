  source: >-
    The part numbers are from the Parallax P2 Eval Add-on Boards (#64006 Series)
    Product Guide v2.0 --
    engineering/ingestion/sources/p2-eval-add-on-boards/p2-eval-add-on-boards-text.txt:9-19.
    The recommendations, cost tiers and rationales are authored in this knowledge
    base and have NO upstream source in the ingestion tree (F-352 sub-rule P):
    treat them as guidance, not as documented fact.
  by_experience_level:
    beginner:
      recommended: ["P2 Eval Board + Control Board"]
      rationale: "Complete development environment with simple I/O"
      cost: "Mid-range investment"
    intermediate:
      recommended: ["Standard Breakout + selected add-ons"]
      rationale: "More flexibility, custom circuit integration"
      cost: "Budget-conscious with expansion options"
    advanced:
      recommended: ["Mini Breakout or custom carrier"]
      rationale: "Maximum flexibility, production-ready form factors"
      cost: "Minimal base cost, custom expansion"
      
  by_application_type:
    learning_embedded_systems:
      hardware: "P2 Eval Board"
      addons: ["64006A (Control)", "64006E (Prototyping)"]
      advantages: "Complete development environment"
    space_constrained_projects:
      hardware: "P2 Edge Mini Breakout" 
      edge_module: "P2-EC standard (sufficient for most)"
      advantages: "Smallest footprint, production-ready"
    multimedia_projects:
      hardware: "P2 Eval Board"
      addons: ["64006H (A/V Breakout)", "64006D (Digital Video)"]
      advantages: "Multiple A/V output options"
    usb_development:
      hardware: "P2 Eval Board"
      addons: ["64006B (USB Host)", "64006F (USB Device)"]
      advantages: "Complete USB ecosystem testing"
    cost_sensitive_projects:
      hardware: "P2 Edge Standard Breakout"
      edge_module: "P2-EC standard"
      advantages: "Minimum cost for full P2 capability"

compatibility_matrix:
  edge_module_carriers:
    p2_ec_standard:
      standard_breakout: "perfect"
      mini_breakout: "perfect"
      breadboard_carrier: "perfect"
    p2_ec_32mb:
      standard_breakout: "perfect"
      mini_breakout: "optimal"
      breadboard_carrier: "good"
      
  source: >-
    #64000 Propeller 2 Eval Board Rev C Guide v2.0 --
    engineering/ingestion/sources/p2-eval-board/complete-p2-eval-board-reference.md:35-36,
    :109-119, :162-171; P2 Eval Add-on Boards (#64006 Series) Product Guide v2.0 --
    engineering/ingestion/sources/p2-eval-add-on-boards/p2-eval-add-on-boards-text.txt:24-46.
  eval_board_addons:
    simultaneous_connection: >-
      Eight I/O Pin Breakout Edge Headers, so all eight #64006 boards can be
      connected at the same time. Two small modules, or one large and one small,
      fit side by side on each edge of the board.
    pin_allocation: >-
      One 8-pin group per header, covering all 64 pins: P0-P7, P8-P15, P16-P23,
      P24-P31, P32-P39, P40-P47, P48-P55, P56-P63. Each header also carries two
      GND and one Vxxxx (3.3 V LDO) pin.
    five_volt_availability: >-
      The 5 V pin on each header is gated by the ACC HDR jumper, shipped in the
      OFF position. Two headers have no 5 V pin at all: on P24-P31 that position
      is unconnected, and on P56-P63 it is RES.
    power_budget: >-
      Board-level, not per-add-on: the PC-USB input is limited to 500 mA and the
      AUX-USB input to 2000 mA. The #64006 guide strongly recommends connecting
      the auxiliary supply to the P2-EVAL P2-USB socket when using accessory
      boards, as their current may exceed what PC-USB provides.
    caution: >-
      The P56-P63 group carries the USB serial link, the SPI flash and the microSD
      signals -- avoid it for accessory boards.
    correction_note: >-
      This entry previously read "Up to 2 add-on boards" with a pin allocation of
      "A-side (P32-P39) + B-side (P24-P31)". The #64000 has eight headers covering
      all 64 pins. F-350.
    
  recommended_combinations:
    education_starter:
      main: "P2 Eval Board"
      addons: ["64006A Control", "64006E Prototyping"]
      cost_tier: "mid_range"
    multimedia_developer:
      main: "P2 Eval Board"
      addons: ["64006H A/V Breakout", "64006C LED Matrix"]
      cost_tier: "premium"
    embedded_prototype:
      main: "P2 Edge Standard Breakout"
      module: "P2-EC standard"
      cost_tier: "budget"
    production_ready:
      main: "P2 Edge Mini Breakout"
      module: "P2-EC (size dependent)"
      cost_tier: "minimal"

summary_recommendations:
  first_time_users: "P2 Eval Board with Control Board add-on - provides complete development environment with simple I/O for learning"
  budget_conscious: "P2 Edge Standard Breakout with P2-EC - minimal cost for full P2 capability"
