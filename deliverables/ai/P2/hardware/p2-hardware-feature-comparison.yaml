    See P2KB-CORRECTION-FINDINGS.md.

addon_boards:
  source: >-
    P2 Eval Add-on Boards (#64006 Series) Product Guide v2.0 (Parallax Inc.,
    2021-01-12) --
    engineering/ingestion/sources/p2-eval-add-on-boards/p2-eval-add-on-boards-text.txt:9-19
    (the eight part numbers), :52-89 (Control), :94-134 (Serial Host),
    :139-197 (LED Matrix), :201-221 (Digital Video Out), :227-247 (Mini
    Prototyping), :253-284 (Serial Device), :290-316 (Goertzel), :322-375 (A/V
    Breakout). Every board occupies ONE 2x6 accessory header and uses its eight
    I/O pins (offsets 0-7).
  control_board:
    part_number: "64006A"
    component_type: "LEDs + Switches"
    led_count: 4
    switch_count: 4
    analog_inputs: 0
    digital_ios: 8
    pins_required: 8
    special_features: "470 ohm series resistor on each LED and on each push switch; LEDs and switches are both described as active-high"
    educational_concepts: ["Digital I/O", "LED control", "Switch input"]
    primary_applications: ["basic_io", "education", "status_display"]
    complexity_level: "beginner"
    
  serial_host:
    part_number: "64006B"
    component_type: "USB Host Ports"
    usb_ports: 2
    port_type: "USB-type A"
    power_supply: "5 V per port through a current-limited load switch, up to 500 mA continuous, subject to available system power"
    led_indicators: 2
    pins_required: 8
    enable_pins: "offset +1 (channel 1) and offset +5 (channel 2), active high"
    special_features: "reverse current blocking, short-circuit protection, over-temperature protection, VBUS soft start; requires 5 V to function"
    educational_concepts: ["USB host", "Device enumeration", "Power management"]
    primary_applications: ["usb_host", "device_testing", "communication"]
    complexity_level: "advanced"
    
  led_matrix:
    part_number: "64006C"
    component_type: "LED Matrix"
    matrix_size: "8 x 7"
    total_leds: 56
    led_colour: "green"
    control_method: "Charlieplexing -- one pin HIGH, one pin LOW lights one LED; set both pins to INPUT to extinguish it"
    pins_required: 8
    refresh_minimum: "switch each LED on and off at least 50 times a second (50 Hz) and flicker should not be noticeable"
    current: "approximately 4 mA per lit LED; 224 mA if all 56 were lit at once, but Charlieplexing lights only one at a time so the instantaneous draw stays at about 4 mA"
    special_features: "the guide carries a full row/column HIGH-LOW lookup table for all 56 LEDs"
    educational_concepts: ["Charlieplexing", "Matrix control", "Multiplexing"]
    primary_applications: ["displays", "graphics", "education"]
    complexity_level: "intermediate"
    
  digital_video_out:
    part_number: "64006D"
    component_type: "Digital Video Interface"
    connector_type: "HDMI-type"
    signal_type: "Differential digital -- offsets 0/1 = CLK-/CLK+, 2/3 = D0-/D0+, 4/5 = D1-/D1+, 6/7 = D2-/D2+"
    pins_required: 8
    unused_pads: "CEC, RSVD, SCL, SDA, 5V-out, HPD on an unpopulated 0.1 in row of 6 pads, plus an 'ACC 5V' pad beside the 5V-out pad for monitors that need 5 V"
    special_features: "Differential signaling driven by the P2 streamer"
    educational_concepts: ["Digital video", "Differential signals", "Protocols"]
    primary_applications: ["video_output", "display_interface", "experimentation"]
    complexity_level: "advanced"
    
  mini_prototyping:
    part_number: "64006E"
    component_type: "Prototyping Area"
    grid_size: "8 x 12 plated thru-holes"
    pins_required: 8
    connections: "the eight header I/O pins (0-7), 5V and VIO are brought to holes inside white silk boxes; holes joined by silk dashes are joined to each other but to no signal"
    special_features: "ground holes connected on both sides; bottom-side copper traces isolated for easy cutting; one exposed bottom-side ground strip. This is the only #64006 board with no mounting hole."
    educational_concepts: ["Circuit building", "Hardware design", "Connections"]
    primary_applications: ["custom_circuits", "prototyping", "modification"]
    complexity_level: "intermediate"
    
  serial_device:
    part_number: "64006F"
    component_type: "USB Device Ports"
    usb_ports: 2
    port_type: "microUSB-type"
    led_indicators: 4
    pins_required: 8
    led_detail: "one blue and one red LED per socket, each with a 1 kOhm series resistor, asserted high to light (offsets 0, 1, 6, 7)"
    data_pins: "channel 1 D-/D+ at offsets 2/3; channel 2 D-/D+ at offsets 4/5"
    special_features: "lets the P2 behave as up to two USB-type devices connecting to a USB host"
    educational_concepts: ["USB device", "HID/CDC protocols", "Emulation"]
    primary_applications: ["usb_device", "emulation", "communication"]
    complexity_level: "advanced"
    
  goertzel:
    part_number: "64006G"
    component_type: "Goertzel experimenter board (Rev B)"
    pins_required: 8
    pads: "non-contact switching / position sensing pads. Offsets 0-3 and 7 are Goertzel input pads (E, W, N, S and a centre common pad C); offsets 4, 5 and 6 are switch-style pads (Left, Right, common reference)."
    special_features: "Rev B replaced the 2020 edition's probe posts with touch switch pads"
    educational_concepts: ["Goertzel correlation", "Non-contact sensing", "Position sensing"]
    primary_applications: ["touch_sensing", "proximity", "position_sensing"]
    complexity_level: "advanced"
    correction_note: >-
      This entry previously described 64006G as a "Combined Digital I/O" board
      with 4 LEDs and 4 switches. No such board exists in the #64006 series;
      64006G is the Goertzel board. Same fabrication family as F-121.
    
  av_breakout:
    part_number: "64006H"
    component_type: "Audio/Video Interface"
    vga_output: "15-pin VGA socket"
    rca_outputs: 4
    audio_jacks: 2
    pins_required: 8
    rca_mode_switch: "a dip switch swaps the four RCA sockets between AUDIO and VIDEO mode; in AUDIO mode each RCA socket is fed through a 22 uF capacitor"
    audio_detail: "amplified audio out (80 mW) on a 3.5 mm stereo headphone jack (tip = left, ring = right, sleeve = ground); audio/microphone input on a 3.5 mm mono jack (tip = signal, sleeve = ground), fed through a 1 uF capacitor"
    special_features: "some features share the same I/O pins and sockets; the guide advises using the P2-EVAL 3.3V LDO power selection when working with audio"
    educational_concepts: ["A/V interfaces", "Signal generation", "Multiple standards"]
    primary_applications: ["audio_video", "multimedia", "interface_testing"]
    complexity_level: "advanced"

feature_matrix:
  source: >-
    P2-EC Edge Module Rev D Product Guide v3.0 --
    engineering/ingestion/sources/edge-standard-module/edge-standard-module-narrative.txt:50-90,
    :162-168; P2-EC32MB Edge Module Rev B Guide v2.0 --
    engineering/ingestion/sources/edge-32mb-module/edge-32mb-module-narrative.txt:71-127,
    :209-214; #64000 Propeller 2 Eval Board Rev C Guide v2.0 --
    engineering/ingestion/sources/p2-eval-board/complete-p2-eval-board-reference.md:43-84,
    :103-127; the three carrier guides at
    engineering/ingestion/sources/edge-breakout-board/edge-breakout-board-narrative.txt:42-64,
    engineering/ingestion/sources/edge-mini-breakout/edge-mini-breakout-narrative.txt:54-65 and
    engineering/ingestion/sources/edge-module-breadboard/edge-module-breadboard-narrative.txt:60-69.
  processing_capability:
    all_boards: "P2 8-cog multiprocessor; recommended maximum 180 MHz clock, overclocking possible beyond 300 MHz"
    smart_pins: "64 Smart Pins on all platforms"
    hub_ram: "512 KB shared hub RAM, internal to the P2"
    cordic_solver: "Available on all platforms"
    
  memory_comparison:
    p2_ec_standard: "16MB Flash, 512KB hub RAM (no PSRAM)"
    p2_ec_32mb: "16MB Flash + 32MB PSRAM, 512KB hub RAM"
    note: "Hub RAM is internal to the P2; both modules carry the same 16MB boot flash. The P2-EC32MB's distinguishing feature is its 32MB external PSRAM."
    
  connectivity_options:
    programming_interfaces:
      eval_board: "built-in FTDI USB-to-serial over micro-USB, user selectable up to 3 Mbps. No USB-C, no Prop Plug header."
      breakouts: "Prop Plug (#32201) header only, serial up to 2 MBaud; optional wireless via the P2 WX Adapter (#64007) + WX WiFi SIP module (#32420S)"
      note: "External programmer required for all three Edge carriers"
    expansion_interfaces:
      eval_board: "eight 2x6 I/O Pin Breakout Edge Headers covering all 64 pins, plus AUX 5V/GND power pads. The #64000 has no prototyping area."
      breakouts: "2x6 accessory headers; the #64020 breadboard carrier adds a solderless breadboard and eight servo ports"
      
  power_specifications:
    input_voltages:
      eval_board: "5 VDC from either micro-USB socket, absolute maximum 5.5 VDC. Optional AUX 5V/GND pads accept 4.5-5.5 V. There is NO barrel jack on the #64000."
      standard_breakout: "5 VDC, absolute maximum 5.5 VDC, centre-positive 2.1 mm barrel jack"
      mini_breakout: "5 VDC, absolute maximum 5.5 VDC, centre-positive 2.1 mm barrel jack"
      breadboard_carrier: "5 VDC, absolute maximum 5.5 VDC, centre-positive 2.1 mm barrel jack"
      edge_module_direct: "5-16 VDC at the module's own VIN pads (P2-EC and P2-EC32MB)"
    supply_current:
      eval_board: "PC-USB input limited to 500 mA; AUX-USB input limited to 2000 mA"
      edge_carriers: "recommended minimum 100 mA; maximum according to the customer application (the #64020 guide adds 'typical 1000 mA')"
      vio_budget: "3.3 V up to 300 mA per 8 I/O pins, on every board"
      
  authored_here_note: >-
    educational_progression and application_domains below are guidance authored
    in this knowledge base, not statements from any ingested document.

  educational_progression:
    beginner_path: ["breadboard_carrier", "control_board", "mini_prototyping"]
    intermediate_path: ["eval_board", "led_matrix", "digital_io_board"]
    advanced_path: ["breakouts", "serial_host", "digital_video_out", "av_breakout"]
    
  application_domains:
    education: ["eval_board", "breadboard_carrier", "control_board"]
    prototyping: ["eval_board", "standard_breakout", "mini_prototyping"]
    embedded_systems: ["mini_breakout", "standard_breakout"]
    multimedia: ["eval_board", "av_breakout", "digital_video_out"]
    communications: ["serial_host", "serial_device"]
    user_interfaces: ["control_board", "digital_io_board", "led_matrix"]

