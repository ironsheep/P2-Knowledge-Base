# GOERTZEL CIRCUIT DETAILS (from P2 silicon)
goertzel_circuit:
  description: |
    The P2 Goertzel circuit measures up to four ADC input signals for magnitude and phase
    correlation of four internal reference signals, which can also be output to form closed-
    looped systems. On each clock cycle, the correlator multiplies the ADC bit (+1 or -1)
    by the current reference sine and cosine values, accumulating products into separate
    accumulators.

  operation_per_clock:
    - "t := LUT[nco[30:22]] - Read waveform sample from LUT"
    - "nco += xfrq - Advance NCO by frequency increment"
    - "cog_dac_3 := t.byte[3] ^ $80 - Update DAC channel 3"
    - "cog_dac_2 := t.byte[2] ^ $80 - Update DAC channel 2"
    - "cog_dac_1 := t.byte[1] ^ $80 - Update DAC channel 1"
    - "cog_dac_0 := t.byte[0] ^ $80 - Update DAC channel 0"
    - "sin := t.byte[3] sign-extended - Extract sine reference"
    - "cos := t.byte[2] sign-extended - Extract cosine reference"
    - "m := ADC_bit ? 1 : -1 - Convert ADC bit to multiplier"
    - "sin_accumulator += sin * m - Accumulate sine correlation"
    - "cos_accumulator += cos * m - Accumulate cosine correlation"

  lut_format:
    byte_3: "Sine value (for Goertzel sine reference and DAC)"
    byte_2: "Cosine value (for Goertzel cosine reference)"
    byte_1: "User-defined (unused in ultrasonic demo)"
    byte_0: "Sine value (for differential DAC output)"

  accumulator_sampling:
    instruction: "GETXACC"
    behavior: |
      - Capture sin_accumulator for conveyance to GETXACC's D
      - Capture cos_accumulator for conveyance to next instruction's S
      - Clear accumulators to current sin * m and cos * m

# PROTOCOL CONSTRAINTS (MANDATORY)
protocol_constraints:
  goertzel:
    measurement_cycles: "1 to 65534 complete waveform cycles"
    precision_note: "More cycles = more precise measurement"
    typical_cycles: 400
    measurements_per_second: "frequency / cycles"

  timing:
    typical_frequency_hz: 40000
    typical_cycles: 400
    measurements_per_second: 100

  dac:
    mode: "P_DAC_124R_3V | P_CHANNEL"
    output_range: "0 to 3.3V"
    differential_drive: true

  adc:
    mode: "P_ADC_1X through P_ADC_100X"
    magnification_codes:
      0: "1x"
      1: "3.16x"
      2: "10x"
      3: "31.6x"
      4: "100x"
    bitstream_output: "+1 or -1 per clock"

  streamer:
    mode: "X_DDS_GOERTZEL_SINC1 | X_DACS_0N0_0N0"
    command: "XCONT"
    cycles_field: "word[0] of D operand"
    adc_selection: "S operand encodes pin group and specific pin"

# SMART PIN CONFIGURATION DETAILS
smart_pin_config:
  dac:
    mode: "P_DAC_124R_3V | P_CHANNEL"
    configuration: |
      cogid .x                      ' Get cog ID
      setnib .dacmode,.x,#2         ' Set cog channel in mode
      wrpin .dacmode,.dacpins       ' Configure DAC pins
      drvl .dacpins                 ' Enable output drivers

  adc:
    mode: "P_ADC_1X + (magnification << 15)"
    configuration: |
      fle .adcmag,#4                ' Limit magnification 0-4
      shl .adcmag,#15               ' Shift to mode position
      add .adcmode,.adcmag          ' Combine with base mode
      wrpin .adcmode,.adcpin        ' Configure ADC pin

# CODE PATTERNS (from Goertzel_ultrasonic.spin2)
code_patterns:
  spin2:
    lut_initialization: |
      ' Write sin/cos bytes into LUT for Goertzel use
      VAR table[512]

      PUB init_lut() | i, cos, sin, t
        repeat i from 0 to 511
          cos, sin := polxy(127, i << -9)
          t.byte[3] := sin    ' byte3 = Goertzel sine
          t.byte[2] := cos    ' byte2 = Goertzel cosine
          t.byte[1] := 0      ' byte1 = unused
          t.byte[0] := sin    ' byte0 = +/- sine output
          table[i] := t

    operating_parameters: |
      ' Set operating parameters for ultrasonic sensing
      dacpins   := 0 addpins 1    ' Differential DAC on P0-P1
      adcpin    := 8              ' ADC input on P8
      adcmag    := 4              ' 100x magnification
      frequency := 40_000         ' 40 kHz
      cycles    := 400            ' 400 cycles = 100 Hz measurement rate

    start_goertzel_cog: |
      ' Start Goertzel program in dedicated cog
      coginit(newcog, @goertzel, @table)

    read_measurement: |
      ' Read magnitude and phase from Goertzel cog
      repeat until done
      done~
      ' magnitude and phase now contain measurement results

  pasm2:
    frequency_calculation: |
      ' Compute NCO frequency from Hz
                  rdlong  .x,#@clkfreq        ' Get system frequency
                  shl     .x,#1               ' Double for NCO math
                  qfrac   .frequency,.x       ' Compute fraction
                  getqx   .y                  ' Get NCO increment

    goertzel_command: |
      ' Issue Goertzel streamer command
                  setword .dds_d,.cycles,#0   ' Set cycles in D word[0]
                  setq    .y                  ' Set frequency in Q
                  xcont   .dds_d,.dds_s       ' Start Goertzel operation

    read_accumulators: |
      ' Read Goertzel accumulators (clears them)
                  getxacc .x                  ' Get cos accumulator to .x
                  mov     .y,0-0              ' Get sin accumulator to .y

    cartesian_to_polar: |
      ' Convert (cos, sin) to (magnitude, phase)
                  qvector .x,.y               ' Start conversion
                  getqx   .magnitude          ' Get magnitude
                  getqy   .phase              ' Get phase (32-bit angle)

    streamer_modes: |
      CON
        ' Goertzel streamer mode with DAC output
        X_DDS_GOERTZEL_SINC1 = %0001_0011 << 24

        ' DAC output pattern (pins %xxxx_00 and %xxxx_01)
        X_DACS_0N0_0N0 = %00_00_00_00 << 16

