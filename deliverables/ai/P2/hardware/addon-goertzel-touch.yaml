component: P2 Eval Goertzel/Touch Sensing Add-on Board
part_number: "64006G"
series: "P2 Eval Add-on Boards (#64006)"
manufacturer: "Parallax Inc."
status: "active_production"
p2kb_key: "p2kbHwAddonGoertzelTouch"
category: addon
aliases:
  - "Goertzel touch board"
  - "touch sensing add-on"
  - "capacitive touch board"
  - "P2 Eval Goertzel/Touch Sensing Add-on Board"
  - "64006G"
  - "#64006 add-on board"

specifications:
  source: "P2 Eval Add-on Boards (#64006 Series) v2.0 1/12/2021, shared connector / compatibility / mounting facts, p.1, and P2 Eval Goertzel Add-on Board (#64006G) with its I/O pin table, p.8"
  io_pins_used: 8
  pin_addressing: "the 8 I/O pins (0-7) of one 2x6 header block, addressed as base_pin + offset"
  connector: "2x6 pass-through socket, compatible with any Propeller 2 development board carrying a 2x6 accessory header"
  compatible_hosts:
    - "P2 Eval Board (#64000)"
    - "P2 Edge Module Breadboard (#64020) with a P2 Edge Module (#P2-EC)"
    - "P2 Edge Mini Breakout Board (#64019) with a P2 Edge Module (#P2-EC)"
  mounting_hole: "3.2 mm (126 mil) hole with a 5 mm (200 mil) pad ring, connected to GND, suitable for M3 (UNC 4-40) hardware; fits a 9.5 mm standoff used as a leg"
  pcb_size: >-
    3.2 in x 1.2 in (81.3 mm x 30.5 mm), from the guide's PCB Dimensions drawing
    (p.11). The guide groups the add-on boards into three
    sizes: A/V module (3.2 in x 1.3 in), Goertzel module (3.2 in x 1.2 in), and
    small modules (1.6 in x 0.8 in, drawn for the LED Matrix board).
  power_note: >-
    The guide strongly recommends connecting the auxiliary power supply to the
    P2-EVAL board's P2-USB socket when experimenting with accessory boards, as
    power requirements may exceed what the PC-USB socket supplies.

description: >-
  Goertzel experimenter board (Rev B) with pads for non-contact switching and
  position sensing. Pads 0-3 and 7 form a Goertzel sense set (compass-style
  positions E/W/N/S around a center common pad); pads 4-6 are switch-style
  on/off inputs. Designed to exploit the P2's hardware Goertzel correlation
  capability for touch/proximity sensing.

board_revision_note: >-
  Rev B (v2.0). The 2020 #64006-ES edition used probe posts; v2.0 replaced them
  with touch switch pads. Pin map and function are otherwise consistent across
  editions.
board_revisions:
  source: "P2 Eval Add-on Boards (#64006 Series) v2.0 1/12/2021, P2 Eval Goertzel Add-on Board (#64006G), p.8; Revision History, p.12"
  rev_b:
    applies_to: "The Goertzel board as the v2.0 guide shows it: touch switch pads (pads 4, 5 and 6 as on/off inputs; 0, 1, 2, 3 and 7 as the Goertzel set)"
  earlier_revision:
    applies_to: "The Goertzel board of the earlier guide editions"
    difference: "Probe posts instead of touch switch pads. The guide states no other difference."
  ratings: "The guide states no electrical rating for this board that depends on the revision."

# --- Eval-header board model (uniform across all #64006 / eval-header occupants) ---
eval_header_occupant: true
pin_group:
  size: 8
  addressing: >-
    actual_P2_pin = base_pin + offset. The board defines its functions by OFFSET
    within an 8-pin eval-header group; the user chooses which header (base_pin)
    it plugs into. base_pin is the first pin of that group.
  base_pin_options: [0, 8, 16, 24, 32, 40, 48, 56]
  source: "Propeller 2 Eval Board Rev C (64000) v2.0 29/6/2020, 11. I/O Pin Breakout Edge Headers, p.9 (each edge header carries one group of eight pins); board photograph, p.1 (edge-header silkscreen P0-P7 ... P56-P63)"
  base_pin_caution: >-
    Group 56-63 (Header H): P58-P63 are shared with the host's Flash SPI and
    serial pins - not recommended.

signal_map:
  - offset: 0
    signal: "Goertzel sense pad E (3 o'clock)"
    notes: "Compass-position Goertzel input pad (used with the center common pad, offset 7)."
  - offset: 1
    signal: "Goertzel sense pad W (9 o'clock)"
    notes: "Compass-position Goertzel input pad."
  - offset: 2
    signal: "Goertzel sense pad N (12 o'clock)"
    notes: "Compass-position Goertzel input pad."
  - offset: 3
    signal: "Goertzel sense pad S (6 o'clock)"
    notes: "Compass-position Goertzel input pad."
  - offset: 4
    signal: "Switch pad (Left)"
    notes: "On/off (switch-style) touch input."
  - offset: 5
    signal: "Switch pad (Right)"
    notes: "On/off (switch-style) touch input."
  - offset: 6
    signal: "Switch pad common reference"
    notes: "Common reference for the switch pads."
  - offset: 7
    signal: "Goertzel sense pad C (center common)"
    notes: "Center common pad for the compass Goertzel pads (offsets 0-3)."

p2_goertzel_capability: >-
  The pads are intended for use with the P2's on-chip Goertzel correlation
  hardware (a cog feature that correlates an ADC input against internal
  reference sine/cosine signals for magnitude and phase). The detailed Goertzel
  circuit operation is a P2 silicon feature, not a property of this board -
  consult the PASM2/architecture references for it.

