    psram: "None"
    fully_free_pins: 56
    led_pins: "P56, P57"
    psram_pins: "N/A - available for GPIO"

  ec32mb_module:
    psram: "32MB (4x 8MB QSPI)"
    fully_free_pins: 40
    accessible_pins: 46
    led_pins: "P38, P39"
    psram_pins: "P40-P57 dedicated"
    source: >-
      P2-EC32MB Edge Module Rev B Guide v2.0 (Parallax Inc., 2022-05-23) --
      engineering/ingestion/sources/edge-32mb-module/edge-32mb-module-narrative.txt:120
      ("Smart I/O pins: 46 accessible, 40 fully free") and :417 ("P0-P39 are fully
      free"). The value shipped here was 38, which no source states.

  note: "Choose P2-EC for maximum GPIO, P2-EC32MB for external memory"

