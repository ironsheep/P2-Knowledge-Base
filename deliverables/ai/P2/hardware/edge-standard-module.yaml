# P2 Edge Standard Module - Hardware Specification
aliases:
  - "P2 Edge Module"
  - "P2-EC"
  - "edge module no RAM"
  - "standard edge module"
  - "P2 Edge standard module"
# Part Number: P2-EC
# Revision: Rev D
# Source Document: P2-EC Edge Module Rev D Product Guide v3.0 (June 3, 2022)
# YAML Corrected: 2025-01-08 - Fixed flash specs, dimensions, pin mappings, added full detail

# =============================================================================
# IDENTIFICATION
# =============================================================================
hardware_type: "edge_module"
part_number: "P2-EC"
p2kb_key: "p2kbHwEdgeModule"
manufacturer: "Parallax Inc."
module_revision: "Rev D"
document_version: "v3.0"
document_date: "2022-06-03"
status: "active_production"

# =============================================================================
# BASIC INFORMATION
# =============================================================================
basic_info:
  name: "P2 Edge Module"
  description: |
    Standard P2 Edge module - the foundation Propeller 2 development platform.
    Includes P2X8C4M64P microcontroller, 16MB SPI flash, crystal oscillator,
    power regulators, microSD socket, and dual status LEDs. Multi-layer PCB
    design optimized for low-noise analog and digital operation. All 64 smart
    pins accessible at the edge connector.
  category: "microcontroller_module"
  form_factor: "edge_connector_module"
  pcb_layers: 6

# =============================================================================
# PROTOCOL CONSTRAINTS - FOR DRIVER DEVELOPMENT
# =============================================================================
protocol_constraints:
  flash:
    interface: "SPI"
    max_clock_mhz: 133  # Per W25Q128JV datasheet
    addressing: "24-bit (16MB)"

  serial:
    max_baud: 2000000
    pins: "P62 (TX), P63 (RX)"
    compatible_programmer: "PropPlug #32201"

# =============================================================================
# RESOURCES AND REFERENCES
# =============================================================================
resources:
  documentation:
    primary:
      title: "P2-EC Edge Module Rev D Product Guide v3.0"
      date: "2022-06-03"
      publisher: "Parallax Inc."
    related:
      - "P2 Silicon Documentation (Propeller 2 Datasheet)"
      - "Winbond W25Q128JV Flash Datasheet"

  edge_connectors:
    - part: "450-00308"
      type: "Card Edge Socket, Through Hole, Right Angle"
    - part: "450-00309"
      type: "Card Edge Socket, Straight, SMT"
    - part: "450-00310"
      type: "Card Edge Socket, Straight, Through Hole"

# =============================================================================
# CARRIER BOARD COMPATIBILITY
# =============================================================================
compatibility:
  carriers:
    - part: "64029"
      name: "P2 Edge Standard Breakout"
      pin_access: "All 64 pins accessible"
      form_factor: "Standard development"
    - part: "64019"
      name: "P2 Edge Mini Breakout"
      pin_access: "P0-P31, P58-P63 accessible (40 pins)"
      form_factor: "Compact development"
    - part: "64020"
      name: "P2 Edge Module Breadboard"
      pin_access: "All 64 pins + prototyping area"
      form_factor: "Educational/prototype"

  alternatives:
    - part: "P2-EC32MB"
      name: "P2 Edge 32MB Module"
      key_difference: "Adds 32MB PSRAM (not flash!) for memory-intensive applications"
      tradeoff: "P40-P57 dedicated to PSRAM, only 40 GPIO fully free"
      use_case: "Video framebuffers, audio samples, large data structures"

# =============================================================================
# USE CASES AND APPLICATIONS
# =============================================================================
use_cases:
  primary:
    - "Standard P2 development platform"
    - "Production deployment with custom carrier"
    - "Educational and training platforms"
    - "Prototyping and proof-of-concept"
    - "Multi-peripheral projects requiring full 56-pin access"
  secondary:
    - "Applications not requiring external RAM"
    - "Cost-sensitive production designs"
    - "Projects using P40-P57 for user I/O"

target_applications:
  gpio_intensive:
    - "Multi-channel sensor arrays"
    - "Display interfaces (VGA, LCD)"
    - "Motor control with many channels"
    - "LED matrix drivers"
  communication:
    - "Multi-protocol bridges"
    - "Industrial automation"
    - "Robotics control"
  general:
    - "Data acquisition"
    - "Process control"
    - "Test equipment"

# =============================================================================
# ADVANTAGES AND LIMITATIONS
# =============================================================================
advantages:
  - "56 fully free smart pins (P0-P55)"
  - "All 64 pins accessible at edge connector"
  - "16MB Flash for large programs and data"
  - "High-precision TCXO (+/- 0.5 PPM)"
  - "6-layer PCB with thermal plane"
  - "Wide input voltage range (5-16 VDC)"
  - "Modular design - replaceable/upgradeable"
  - "Compatible with all Edge carrier boards"
  - "microSD card socket for additional storage"
  - "Production-ready form factor"

limitations:
  - "No external RAM (512KB Hub RAM only)"
  - "Requires carrier board for development"
  - "P56-P63 have dedicated hardware (8 pins)"
  - "P24-P31 have simultaneous switching restrictions"

# =============================================================================
# COMPARISON WITH 32MB MODULE
# =============================================================================
comparison_with_32mb:
  this_module:
    psram: "None"
    fully_free_pins: 56
    led_pins: "P56, P57"
    psram_pins: "N/A - available for GPIO"

  ec32mb_module:
    psram: "32MB (4x 8MB QSPI)"
    fully_free_pins: 38
    led_pins: "P38, P39"
    psram_pins: "P40-P57 dedicated"

  note: "Choose P2-EC for maximum GPIO, P2-EC32MB for external memory"

# =============================================================================
# DEVELOPMENT WORKFLOW
# =============================================================================
development_workflow:
  - "Select appropriate carrier board (Mini, Standard, or Breadboard)"
  - "Insert P2-EC module into carrier board"
  - "Connect power supply (5-16 VDC)"
  - "Connect PropPlug or USB-serial for programming"
  - "Set boot mode DIP switches as needed"
  - "Develop using Spin2/PASM2 or C (FlexProp)"
  - "Test with carrier peripherals"
  - "Deploy to custom carrier for production"

programming:
  interface:
    type: "Serial"
    max_baud: 2000000
    pins: "P62 (TX from P2), P63 (RX to P2)"

  tools:
    - name: "PropPlug"
      part: "32201"
      note: "USB-to-serial programmer"
    - name: "Propeller Tool"
      type: "IDE"
    - name: "PNut"
      type: "Compiler"
    - name: "FlexProp"
      type: "IDE/Compiler (supports C)"

  languages:
    - "Spin2"
    - "PASM2"
    - "C (via FlexProp)"

