  - version: "3.0"
    release: "Rev D"
    changes:
      - "Switching power supplies changed (supply issues)"
      - "Max current increased from 2A to 3A"
      - "Switching frequency changed from 2.5MHz to 750kHz"
      - "Layer count increased from 4 to 6"
