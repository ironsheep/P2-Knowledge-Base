connectivity:
  programming:
    # Corrected 2026-08-25: this board has NO on-board USB-to-serial converter.
    # 64020 P2 Edge Module Breadboard Product Guide v1.2 (Parallax, 2021-01-07):
    # "Programming: Serial up to 2 MBaud; requires Parallax Prop-Plug programming
    # adapter" -- engineering/ingestion/sources/edge-module-breadboard/
    # edge-module-breadboard-narrative.txt:67, and "3. Prop Plug Programming
    # Header" at :101-108.
    - type: "Prop Plug (#32201)"
      connector: "dedicated 4-way header, pins marked up-triangle / down-triangle / RES / VSS"
      note: "the only wired programming path; serial up to 2 MBaud"
    - type: "Wireless"
      connector: "P2 WX Adapter (#64007) + Parallax WX ESP8266 SIP module (#32420S)"
      note: "unplug the Prop Plug when using the WX Adapter"
  
  headers:
    pin_headers: "All 64 pins accessible"
    power_headers: "Multiple voltage rails"
    programming_header: "Prop Plug compatible"
    breadboard_connections: "Direct pin access to breadboard"
    
  expansion:
    breadboard: "Integrated full-size breadboard"
    servo_ports: "8 dedicated servo connections"
    addon_compatibility: "Limited - focus on breadboard"

power:
  # Restored 2026-08-26. This file previously shipped a wide-input barrel-jack
  # voltage that the #64020 guide contradicts; the wrong figure was removed with its
  # whole block and nothing replaced it, leaving the file with no power figure at
  # all. The guide is unambiguous: 5 VDC only, absolute maximum 5.5 VDC. The removed
  # wording is recorded in
  # engineering/analysis/archived/2026-08-25-yaml-release-change-ledger.md (item 7)
  # and is deliberately not repeated here. That ledger was superseded by
  # 2026-08-27-yaml-release-change-ledger.md and moved to archived/ on the way; this
  # locator was left pointing at the pre-move path until 2026-09-05.
  source: >-
    64020 P2 Edge Module Breadboard Product Guide v1.2 (Parallax Inc., 2021-01-07),
    "Key Specifications" and the numbered feature descriptions --
    engineering/ingestion/sources/edge-module-breadboard/edge-module-breadboard-narrative.txt:53
    (barrel jack), :61-66 (Key Specifications), :93-100 ("2. Power Jack"),
    :126-135 ("4. Servo Ports"), :137-158 ("5. VIO 3.3V Power and GND Access"),
    :166-172 ("8. Power Switch"), :177-182 ("10. ACC ON/OFF Header").
  input_connector: "2.1 mm center-positive DC barrel jack"
  input_voltage: "5 VDC"
  absolute_maximum: "5.5 VDC"
  input_voltage_note: >-
    The jack accepts 5 VDC only. "CAUTION! Use a well-regulated power supply and do
    not exceed 5.5 VDC!" There is no wide-input regulator on this board.
  input_current:
    recommended_minimum: "100 mA"
    typical: "1000 mA"
    maximum: "according to customer application"
  recommended_supplies:
    - "Parallax USB A to DC-Jack cable (#805-00019) - powers the board from a computer USB port or hub"
    - "Parallax 5V 18W USB Power Adapter (#750-00001) - for higher-current applications such as servos"
  vio_rails:
    voltage: "3.3 V"
    current: "up to 300 mA per group of 8 I/O pins (30 mA per pin)"
    note: >-
      Each group of 8 smart I/O pins has its own 3.3 V low-noise regulator with
      short-circuit and over-current protection. The rail is labelled Vxx, where xx
      is the first of the 8 I/O pins it supplies - V48 is the VIO rail for P48-P55.
      Requires the P2-EC Edge Module. For a larger common supply the guide directs
      the user to an alternative source on the breadboard, such as the Parallax
      Power Pal (#32133).
  servo_rail: >-
    The middle pin of each servo port connects to 5 V directly from the DC barrel
    jack; the signal pin reaches the I/O socket through an onboard 1 K series
    resistor. "CAUTION! Do not attempt to drive servos or other high-current devices
    from computer-USB power."
  accessory_5v: >-
    The ACC ON/OFF 3-position 2 mm-pitch shunt header connects or disconnects the
    5 V output at the P2 accessory headers from the DC barrel jack 5 V supply.
  power_switch: >-
    2-position switch (0 = off, 1 = on) with a white power-indicator LED. On Rev B
    the off position ties the 5 V outputs to ground through a 10 K resistor, so
    residual charge in the bulk capacitors is discharged.

