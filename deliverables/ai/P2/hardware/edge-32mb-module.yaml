# =============================================================================
# ADVANTAGES AND LIMITATIONS
# =============================================================================
advantages:
  - "32MB PSRAM - 64x Hub RAM capacity"
  - "16-bit parallel interface for high bandwidth (>300 MB/s)"
  - "Automatic timing configuration in driver"
  - "Multi-cog concurrent access via mailboxes"
  - "Same physical form factor as standard P2-EC module"
  - "Compatible with all Edge carrier boards"
  - "16MB Flash for large programs and data"
  - "High-precision TCXO (+/- 0.5 PPM)"
  - "6-layer PCB with thermal plane"
  - "Wide input voltage range (5-16 VDC)"

limitations:
  - "PSRAM requires refresh - 8us max CS low time"
  - "Dedicates 1 cog for PSRAM driver"
  - "P40-P57 dedicated to PSRAM (18 pins not available for GPIO)"
  - "Higher latency than Hub RAM access"
  - "Requires driver initialization before PSRAM use"
  - "P24-P31 have simultaneous switching restrictions"

