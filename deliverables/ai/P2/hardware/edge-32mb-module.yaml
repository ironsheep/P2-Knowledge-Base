# P2 Edge 32MB Module - Hardware Specification
aliases:
  - "P2 Edge 32MB Module"
  - "P2-EC32MB"
  - "64000-ES"
  - "edge module 32MB"
  - "PSRAM edge module"
  - "P2 Edge Module with RAM"
# Part Number: P2-EC32MB / 64000-ES
# Revision: Rev B
# Source Document: P2-EC32MB Edge Module Rev B Guide v2.0 (May 23, 2022)
# YAML Corrected: 2025-01-08 - Fixed memory specs, dimensions, pin mappings, added performance data

# =============================================================================
# IDENTIFICATION
# =============================================================================
hardware_type: "edge_module"
part_number: "P2-EC32MB"
alternate_part: "64000-ES"
p2kb_key: "p2kbHwEdge32mbModule"
manufacturer: "Parallax Inc."
module_revision: "Rev B"
document_version: "v2.0"
document_date: "2022-05-23"
status: "active_production"

# =============================================================================
# BASIC INFORMATION
# =============================================================================
basic_info:
  name: "P2 Edge Module with 32MB RAM"
  description: |
    Enhanced P2 Edge module with 32MB PSRAM for memory-intensive applications.
    Includes P2X8C4M64P microcontroller, 16MB SPI flash, 32MB PSRAM, crystal
    oscillator, power regulators, microSD socket, and dual status LEDs.
    Multi-layer PCB design optimized for low-noise analog and digital operation.
  category: "microcontroller_module"
  form_factor: "edge_connector_module"
  pcb_layers: 6

# =============================================================================
# MICROCONTROLLER SPECIFICATIONS
# =============================================================================
specifications:
  microcontroller:
    chip: "P2X8C4M64P"
    alternate_marking: "P2X8C4M64PES"  # Limited early batch, identical function
    package: "100-pin TQFP"
    architecture: "32-bit multi-cog"
    cores: 8
    hub_ram: "512 KB"
    cog_ram: "2 KB per cog"
    lut_ram: "2 KB per cog"
    smart_pins: 64

    clock:
      crystal: "20 MHz TCXO"
      crystal_precision: "+/- 0.5 PPM"
      crystal_type: "Temperature-compensated crystal oscillator"
      recommended_max_mhz: 180
      overclock_tested_mhz: 320
      note: "Operating frequency set in code via PLL multiply/divide registers"

# =============================================================================
# MEMORY SUBSYSTEMS
# =============================================================================
  memory:
    # Internal P2 memory
    hub_ram:
      size: "512 KB"
      type: "Internal SRAM"
      access: "Shared by all 8 cogs"

    cog_ram:
      size_per_cog: "2 KB"
      total: "16 KB"
      access: "Private to each cog"

    lut_ram:
      size_per_cog: "2 KB"
      total: "16 KB"
      access: "Private to each cog, dual-purpose lookup/RAM"

    # On-module Flash Memory
    flash:
      type: "SPI Flash"
      part_number: "W25Q128JVSIM"
      manufacturer: "Winbond"
      size_mb: 16
      size_bits: "128 Mbit"
      interface: "SPI"
      purpose: "Boot code storage, user data, program storage"
      pins_used: "P58-P61 (shared with microSD)"

    # On-module PSRAM - CRITICAL FOR CODE GENERATION
    psram:
      type: "PSRAM (Pseudo-Static RAM)"
      total_size_mb: 32
      total_size_bytes: 33554432

      # Chip specifications
      chip:
        part_number: "APS6404L-3SQR-ZR"
        manufacturer: "AP Memory"
        quantity: 4
        size_per_chip_mb: 8
        size_per_chip_bits: "64 Mbit"
        interface_per_chip: "QSPI (4-bit)"
        max_clock_mhz: 133
        alternate_clock_mhz: 84  # Lower power / conservative mode

      # Combined bus architecture
      bus:
        combined_width_bits: 16
        organization: "4 parallel QSPI chips with shared CLK/CE"
        burst_transfer_rate: ">300 MB/s"
        typical_burst_rate_mbs: 308

      # Access mode flexibility
      access_modes:
        - mode: "4-bit"
          chips_used: 1
          description: "Single bank, lowest throughput"
        - mode: "8-bit"
          chips_used: 2
          description: "Two banks parallel"
        - mode: "16-bit"
          chips_used: 4
          description: "All banks parallel, maximum throughput (308 MB/s)"

      # Bank organization
      banks:
        - id: 0
          pins: "P40-P43"
          signals: "SIO[3:0]"
          size_mb: 8
        - id: 1
          pins: "P44-P47"
          signals: "SIO[3:0]"
          size_mb: 8
        - id: 2
          pins: "P48-P51"
          signals: "SIO[3:0]"
          size_mb: 8
        - id: 3
          pins: "P52-P55"
          signals: "SIO[3:0]"
          size_mb: 8

      common_signals:
        clock:
          pin: "P56"
          function: "PSRAM CLK (all 4 chips)"
        chip_enable:
          pin: "P57"
          function: "PSRAM CE# (all 4 chips, active low)"

      # Timing constraints - CRITICAL
      timing:
        max_cs_low_us: 8
        cs_low_note: "Chip enable must go HIGH within 8 microseconds to allow internal DRAM refresh"
        refresh: "Automatic during CE# high periods"

      # Address space
      address_space:
        range: "0x00000000 - 0x01FFFFFF"
        size_bytes: "0x2000000 (33,554,432)"
        address_bits: 25
        wrap_behavior: "Only 25 LSBs used, address wraps at 32MB boundary"

# =============================================================================
# PHYSICAL SPECIFICATIONS
# =============================================================================
  physical:
    dimensions:
      length_inches: 2.04
      length_mm: 51.7
      width_inches: 1.45
      width_mm: 37.0
      height_inches: 0.25
      height_mm: 6.35

    mounting:
      holes: 2
      hole_connection: "Ground plane"
      orientation_hole: 1
      orientation_hole_plated: false

    edge_connector:
      type: "Double-sided card edge"
      ways: 80
      contacts_per_side: 40
      pitch_inches: 0.05
      pitch_mm: 1.27

    pcb:
      layers: 6
      features:
        - "Solid thermal plane for low temperature rise"
        - "Signal reference planes isolating each signal layer"
        - "Optimized for low-noise analog and digital operation"

# =============================================================================
# ELECTRICAL SPECIFICATIONS
# =============================================================================
  electrical:
    # Power input
    input_power:
      voltage_min_vdc: 5
      voltage_max_vdc: 16
      voltage_absolute_max_vdc: 16
      current_min_ma: 100
      current_typical_ma: "500-1000"
      current_max_ma: 3000
      reverse_polarity_protection: true

    # VDD - P2 Core supply
    vdd_regulator:
      type: "Switching buck regulator"
      voltage: "1.8V"
      max_current_a: 3
      switching_freq_khz: 750
      protection:
        - "Short-circuit (20ms shutdown, 2.5ms retry cycle)"
        - "Over-current"
        - "Brownout detection (~1.5V threshold)"

    # VIO - I/O pin supplies
    vio_regulators:
      type: "Low-noise LDO"
      voltage: "3.3V"
      quantity: 8
      current_per_regulator_ma: 300
      protection:
        - "Short-circuit"
        - "Over-current"
      note: "One LDO per 8-pin group for isolation and local regulation"

    # I/O characteristics
    io_pins:
      logic_voltage: "3.3V"
      source_current_ma: 30
      sink_current_ma: 30
      current_budget_per_group_ma: 300

    # Environmental
    temperature:
      operating_min_c: -40
      operating_max_c: 85
      operating_min_f: -40
      operating_max_f: 185

# =============================================================================
# PIN MAPPING - DEDICATED HARDWARE ASSIGNMENTS
# =============================================================================
pin_mapping:
  description: "Complete I/O pin assignments for P2-EC32MB module"

  # Summary counts
  summary:
    total_smart_pins: 64
    fully_free: 38          # P0-P37
    led_buffered: 2         # P38-P39 (usable, high-Z buffer attached)
    psram_dedicated: 18     # P40-P57
    flash_sd_shared: 4      # P58-P61
    serial_programming: 2   # P62-P63
    edge_connector_accessible: 46  # P0-P39 + P58-P63

  # Fully free pins - no dedicated hardware
  free_pins:
    P0_P7:
      pins: "P0-P7"
      count: 8
      status: "Fully free"
      vio_regulator: "V00"
      current_budget_ma: 300
    P8_P15:
      pins: "P8-P15"
      count: 8
      status: "Fully free"
      vio_regulator: "V08"
      current_budget_ma: 300
    P16_P23:
      pins: "P16-P23"
      count: 8
      status: "Fully free"
      vio_regulator: "V16"
      current_budget_ma: 300
    P24_P31:
      pins: "P24-P31"
      count: 8
      status: "Fully free with restriction"
      vio_regulator: "V24"
      current_budget_ma: 300
      warning: "Avoid high-speed simultaneous switching at system clock frequency"
    P32_P37:
      pins: "P32-P37"
      count: 6
      status: "Fully free"
      vio_regulator: "V32"
      current_budget_ma: 300  # Shared with P38-P39

  # LED buffered pins
  led_pins:
    P38:
      function: "Buffered LED (accent color)"
      status: "Usable - high-impedance buffer attached"
      vio_regulator: "V32"
      buffer: "Dual Schmitt-trigger, high-Z input"
      led_visible: "Both sides of PCB"
      control: "LED DIP switch (labeled ON/OFF) gates LED power; must be ON for the LED to light"
      note: "High-Z by default; LEDs sensitive to nearby objects. Drive high/low or enable pull-ups to control."
    P39:
      function: "Buffered LED (accent color)"
      status: "Usable - high-impedance buffer attached"
      vio_regulator: "V32"
      buffer: "Dual Schmitt-trigger, high-Z input"
      led_visible: "Both sides of PCB"
      control: "LED DIP switch (labeled ON/OFF) gates LED power; must be ON for the LED to light"
      note: "High-Z by default; LEDs sensitive to nearby objects. Drive high/low or enable pull-ups to control."

  # PSRAM dedicated pins
  psram_pins:
    P40_P43:
      function: "PSRAM Bank 0 data"
      signals: "SIO[3:0]"
      direction: "Bidirectional"
      status: "Dedicated to PSRAM"
    P44_P47:
      function: "PSRAM Bank 1 data"
      signals: "SIO[3:0]"
      direction: "Bidirectional"
      status: "Dedicated to PSRAM"
    P48_P51:
      function: "PSRAM Bank 2 data"
      signals: "SIO[3:0]"
      direction: "Bidirectional"
      status: "Dedicated to PSRAM"
    P52_P55:
      function: "PSRAM Bank 3 data"
      signals: "SIO[3:0]"
      direction: "Bidirectional"
      status: "Dedicated to PSRAM"
    P56:
      function: "PSRAM CLK"
      direction: "Output"
      status: "Dedicated to PSRAM"
      note: "Common clock for all 4 PSRAM chips"
    P57:
      function: "PSRAM CE#"
      direction: "Output"
      logic: "Active low"
      status: "Dedicated to PSRAM"
      note: "Common chip enable, must release within 8us for refresh"

  # Flash and microSD shared pins
  flash_sd_pins:
    P58:
      primary: "Flash SPI DO (MISO)"
      secondary: "microSD DAT0/MISO"
      vio_regulator: "V56"
      status: "Shared - Flash and microSD"
    P59:
      primary: "Flash SPI DI (MOSI)"
      secondary: "microSD CMD/MOSI"
      tertiary: "Boot mode select (with pull-up/pull-down resistors)"
      vio_regulator: "V56"
      status: "Shared - Flash, microSD, boot mode"
    P60:
      primary: "Flash SPI CLK"
      secondary: "microSD DAT3/CS (active low)"
      vio_regulator: "V56"
      status: "Shared - Flash and microSD"
    P61:
      primary: "Flash SPI CS"
      secondary: "microSD CLK"
      vio_regulator: "V56"
      status: "Shared - Flash and microSD"

  # Serial programming pins
  serial_pins:
    P62:
      function: "Serial TXD (P2 transmits)"
      direction: "Output from P2"
      purpose: "Prop-Plug RX connection"
      vio_regulator: "V56"
    P63:
      function: "Serial RXD (P2 receives)"
      direction: "Input to P2"
      purpose: "Prop-Plug TX connection"
      vio_regulator: "V56"

  # Reset pin
  reset:
    RESn:
      function: "Reset input"
      logic: "Active low"
      pull_up: "10K to 3.3V (internal)"
      behavior: "All cogs disabled, I/O pins floating when low"
      recovery: "Restart 3ms after low-to-high transition"
      max_voltage: "3.6V"

# =============================================================================
# BOOT MODE CONFIGURATION
# =============================================================================
boot_modes:
  description: "DIP switch settings for boot mode selection"
  switches:
    LED: "Enable/disable onboard LEDs (P38, P39). Labeled ON/OFF; set ON to power the LEDs."
    FLASH: "Flash boot enable"
    triangle_up: "P59 pull-up (boot option)"
    triangle_down: "P59 pull-down (boot option)"

  warning: "Only switch ONE of triangle_up or triangle_down ON to avoid inconsistent behavior"

  configurations:
    - flash: "OFF"
      up: "OFF"
      down: "OFF"
      mode: "Serial window 60 seconds (default when SD not inserted)"
    - flash: "OFF"
      up: "ON"
      down: "OFF"
      mode: "Serial window 60 seconds, overrides Flash and SD"
    - flash: "ON"
      up: "OFF"
      down: "OFF"
      mode: "Serial 100ms, then SPI flash. If flash fails, serial 60s"
    - flash: "ON"
      up: "OFF"
      down: "ON"
      mode: "SPI flash only (fast boot). If fails, shutdown"
    - flash: "OFF"
      up: "OFF"
      down: "ON"
      mode: "SD card with serial fallback. If fails, serial 60s"
    - flash: "OFF"
      up: "OFF"
      down: "OFF"
      mode: "SD card only (when SD inserted). If fails, shutdown"

# =============================================================================
# PROTOCOL CONSTRAINTS - FOR DRIVER DEVELOPMENT
# =============================================================================
protocol_constraints:
  psram:
    # Hardware limits from PSRAM chip
    chip_max_clock_mhz: 133
    chip_alternate_clock_mhz: 84

    # Recommended driver settings
    recommended_clock: "sysclk/2"
    supported_rates:
      - mode: "sysclk/1"
        description: "Fast mode - check stability"
      - mode: "sysclk/2"
        description: "Standard mode - reliable operation"
      - mode: "sysclk/3"
        description: "Conservative mode"
      - mode: "sysclk/4"
        description: "Low-power mode"

    # Critical timing
    max_cs_low_us: 8
    cs_low_note: "Must release CE# within 8us for internal DRAM refresh"

    # Burst calculation
    burst_size:
      calculation: "((MAX_CS_LOW_USEC * (freq/1000000)) - 132) >> 4) << 4"
      typical_at_200mhz: "approximately 1280 bytes per burst"

    # Input delay configuration (from driver)
    input_delay:
      description: "Automatically computed based on system clock frequency"
      delay_table:
        - freq_under_mhz: 92
          delay: 7
        - freq_under_mhz: 150
          delay: 8
        - freq_under_mhz: 206
          delay: 9
        - freq_under_mhz: 258
          delay: 10
        - freq_under_mhz: 310
          delay: 11
        - freq_under_mhz: 333
          delay: 12
        - freq_over_mhz: 333
          delay: 13

  flash:
    interface: "SPI"
    max_clock_mhz: 133  # Per W25Q128JV datasheet
    addressing: "24-bit (16MB)"

  serial:
    max_baud: 2000000
    pins: "P62 (TX), P63 (RX)"
    compatible_programmer: "PropPlug #32201"

# =============================================================================
# CODE PATTERNS - PSRAM DRIVER USAGE
# =============================================================================
code_patterns:
  spin2:
    obex_driver_usage: |
      OBJ
        psram : "psram"

      PUB main() | err
        err := psram.start()                  ' Initialize PSRAM driver (uses 1 cog)
        IF err >= 0
          psram.write(@src_buf, $100000, 1024)  ' Write 1KB to address 0x100000
          psram.read(@dst_buf, $100000, 1024)   ' Read it back

    initialization: |
      ' Start PSRAM driver with automatic configuration
      PUB start() : result
        return startx(0, 0, 0, -1)

      ' Extended start with custom parameters
      PUB startx(freq, burst, delay, desiredcog) : result
        ' freq: 0 = use current clkfreq
        ' burst: 0 = auto-compute for 8us CS low time
        ' delay: 0 = auto-compute from frequency table
        ' desiredcog: -1 = auto-allocate cog

    read_write: |
      PUB read(dstHubAddr, srcPsramAddr, count) : result
        ' Read from PSRAM to Hub RAM
        ' dstHubAddr: Hub RAM destination address
        ' srcPsramAddr: PSRAM source address (25-bit, 0-33554431)
        ' count: Number of bytes to read
        ' Returns: 0 on success, negative error code on failure

      PUB write(srcHubAddr, dstPsramAddr, count) : result
        ' Write from Hub RAM to PSRAM
        ' srcHubAddr: Hub RAM source address
        ' dstPsramAddr: PSRAM destination address (25-bit)
        ' count: Number of bytes to write

    fill_operations: |
      PUB fillBytes(addr, pattern, count, listPtr) : r
        return fill(addr, pattern, count, listPtr, 1)

      PUB fillWords(addr, pattern, count, listPtr) : r
        return fill(addr, pattern, count, listPtr, 2)

      PUB fillLongs(addr, pattern, count, listPtr) : r
        return fill(addr, pattern, count, listPtr, 4)

    error_codes: |
      CON
        ERR_INVALID      = -6   ' Invalid arguments
        ERR_TOO_SLOW     = -14  ' P2 frequency too low for PSRAM
        ERR_INACTIVE     = -15  ' Driver not running
        ERR_ABORTED      = -16  ' Driver was shutdown
        ERR_NO_LOCK      = -26  ' No LOCK available
        ERR_MAILBOX_BUSY = -28  ' Mailbox operation pending

