# =============================================================================
# BASIC INFORMATION
# =============================================================================
basic_info:
  name: "P2 Edge Module with 32MB RAM"
  description: |
    Enhanced P2 Edge module with 32MB PSRAM for memory-intensive applications.
    Includes P2X8C4M64P microcontroller, 16MB SPI flash, 32MB PSRAM, crystal
    oscillator, power regulators, microSD socket, and dual status LEDs.
    Multi-layer PCB design optimized for low-noise analog and digital operation.
  category: "microcontroller_module"
  form_factor: "edge_connector_module"
  pcb_layers: 6

# =============================================================================
# PROTOCOL CONSTRAINTS - FOR DRIVER DEVELOPMENT
# =============================================================================
protocol_constraints:
  psram:
    # Hardware limits from PSRAM chip
    chip_max_clock_mhz: 133
    chip_alternate_clock_mhz: 84

    # Recommended driver settings
    recommended_clock: "sysclk/2"
    supported_rates:
      - mode: "sysclk/1"
        description: "Fast mode - check stability"
      - mode: "sysclk/2"
        description: "Standard mode - reliable operation"
      - mode: "sysclk/3"
        description: "Conservative mode"
      - mode: "sysclk/4"
        description: "Low-power mode"

    # Critical timing
    max_cs_low_us: 8
    cs_low_note: "Must release CE# within 8us for internal DRAM refresh"

    # Burst calculation
    burst_size:
      calculation: "((MAX_CS_LOW_USEC * (freq/1000000)) - 132) >> 4) << 4"
      typical_at_200mhz: "approximately 1280 bytes per burst"

    # Input delay configuration (from driver)
    input_delay:
      description: "Automatically computed based on system clock frequency"
      delay_table:
        - freq_under_mhz: 92
          delay: 7
        - freq_under_mhz: 150
          delay: 8
        - freq_under_mhz: 206
          delay: 9
        - freq_under_mhz: 258
          delay: 10
        - freq_under_mhz: 310
          delay: 11
        - freq_under_mhz: 333
          delay: 12
        - freq_over_mhz: 333
          delay: 13

  flash:
    interface: "SPI"
    max_clock_mhz: 133  # Per W25Q128JV datasheet
    addressing: "24-bit (16MB)"

  serial:
    max_baud: 2000000
    pins: "P62 (TX), P63 (RX)"
    compatible_programmer: "PropPlug #32201"

# =============================================================================
# CODE PATTERNS - PSRAM DRIVER USAGE
# =============================================================================
code_patterns:
  spin2:
    obex_driver_usage: |
      OBJ
        psram : "psram"

      PUB main() | err
        err := psram.start()                  ' Initialize PSRAM driver (uses 1 cog)
        IF err >= 0
          psram.write(@src_buf, $100000, 1024)  ' Write 1KB to address 0x100000
          psram.read(@dst_buf, $100000, 1024)   ' Read it back

    initialization: |
      ' Start PSRAM driver with automatic configuration
      PUB start() : result
        return startx(0, 0, 0, -1)

      ' Extended start with custom parameters
      PUB startx(freq, burst, delay, desiredcog) : result
        ' freq: 0 = use current clkfreq
        ' burst: 0 = auto-compute for 8us CS low time
        ' delay: 0 = auto-compute from frequency table
        ' desiredcog: -1 = auto-allocate cog

    read_write: |
      PUB read(dstHubAddr, srcPsramAddr, count) : result
        ' Read from PSRAM to Hub RAM
        ' dstHubAddr: Hub RAM destination address
        ' srcPsramAddr: PSRAM source address (25-bit, 0-33554431)
        ' count: Number of bytes to read
        ' Returns: 0 on success, negative error code on failure

      PUB write(srcHubAddr, dstPsramAddr, count) : result
        ' Write from Hub RAM to PSRAM
        ' srcHubAddr: Hub RAM source address
        ' dstPsramAddr: PSRAM destination address (25-bit)
        ' count: Number of bytes to write

    fill_operations: |
      PUB fillBytes(addr, pattern, count, listPtr) : r
        return fill(addr, pattern, count, listPtr, 1)

      PUB fillWords(addr, pattern, count, listPtr) : r
        return fill(addr, pattern, count, listPtr, 2)

      PUB fillLongs(addr, pattern, count, listPtr) : r
        return fill(addr, pattern, count, listPtr, 4)

    error_codes: |
      CON
        ERR_INVALID      = -6   ' Invalid arguments
        ERR_TOO_SLOW     = -14  ' P2 frequency too low for PSRAM
        ERR_INACTIVE     = -15  ' Driver not running
        ERR_ABORTED      = -16  ' Driver was shutdown
        ERR_NO_LOCK      = -26  ' No LOCK available
        ERR_MAILBOX_BUSY = -28  ' Mailbox operation pending

