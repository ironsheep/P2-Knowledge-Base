memory_sizing_guide:
  program_size_estimates:
    simple_projects: "< 100KB - P2-EC (16MB flash) sufficient"
    moderate_projects: "100KB - 1MB - P2-EC (16MB flash) sufficient"
    complex_projects: "1MB - 16MB - P2-EC (16MB flash) adequate"
    very_large_data: "Runtime data beyond the 512KB hub RAM - P2-EC32MB (adds 32MB PSRAM)"
    data_logging: "Large in-RAM data sets - P2-EC32MB (32MB PSRAM)"
    
  memory_upgrade_decision:
    cost_difference: "$30-50 between P2-EC and P2-EC32MB"
    performance_impact: "None - same processing capability"
    when_to_upgrade: "Large programs, data logging, future-proofing"
    when_standard_sufficient: "Educational use, simple projects, cost optimization"

