    programming: "In-circuit via PropPlug or custom programmer"

compatibility_considerations:
  # CORRECTED 2026-08-30. `power_supply_requirements` previously read
  # "5V @ 1A minimum (USB-C or barrel jack)" for the eval board -- the #64000 has
  # neither a USB-C socket nor a barrel jack, and 1 A appears in no guide; and
  # "Regulated 3.3V or 5V depending on model" for the carriers, which take 5 VDC
  # only. The "50-500mA each" add-on budget was likewise unsourced: the #64006
  # guide gives a current figure for two of its eight boards and none for the rest.
  source: >-
    64000 Propeller 2 Eval Board Rev C Guide (Parallax Inc.) --
    engineering/ingestion/sources/p2-eval-board/complete-p2-eval-board-reference.md:47
    (5 VDC, absolute maximum 5.5 VDC), :55-56 (PC-USB 500 mA, AUX-USB 2000 mA),
    :58 (VIO 3.3 V up to 300 mA per 8 I/O pins), :76 (dual micro-USB inputs),
    :115 (AUX 5V/GND pads, 4.5-5.5 V, MUST NOT exceed 5.5 V).
    64029 P2 Edge Breakout Board Guide (2023-03-01) --
    engineering/ingestion/sources/edge-breakout-board/edge-breakout-board-narrative.txt:53-57;
    64019 P2 Edge Mini Breakout Board Guide v1.1 --
    engineering/ingestion/sources/edge-mini-breakout/edge-mini-breakout-narrative.txt:55-59;
    64020 P2 Edge Module Breadboard Product Guide REV B --
    engineering/ingestion/sources/edge-module-breadboard/edge-module-breadboard-narrative.txt:61-66.
    P2 Eval Add-on Boards (#64006 Series) Product Guide v2.0 (2021-01-12) --
    engineering/ingestion/sources/p2-eval-add-on-boards/p2-eval-add-on-boards-text.txt:99-115
    (Serial Host: up to 500 mA continuous per USB socket), :195-197 (LED Matrix:
    ~4 mA per lit LED).
  power_supply_requirements:
    eval_board: "5 VDC (absolute maximum 5.5 VDC) at either micro-USB socket -- PC-USB is limited to 500 mA, AUX-USB to 2000 mA, and the source is auto-selected. Optional AUX 5V/GND pads accept 4.5-5.5 V. The #64000 has no USB-C socket and no barrel jack."
    breakouts: "5 VDC only, absolute maximum 5.5 VDC, at the 2.1 mm centre-positive barrel jack -- the same on #64029, #64019 and #64020. Recommended minimum 100 mA; the #64020 additionally states 1000 mA typical. VIO 3.3 V (up to 300 mA per 8 I/O pins) is supplied by the P2 Edge Module, not by the carrier."
    addon_boards: "Budget per board from its own guide entry, not from a blanket range. The #64006 guide states a current for two of its eight boards only: Serial Host up to 500 mA continuous per USB socket, LED Matrix ~4 mA (one Charlieplexed LED lit at a time). See hardware/addon-*.yaml for the wave-2026-06 boards."


  programming_infrastructure:
    eval_board: "No additional hardware required"
    breakouts: "PropPlug or compatible programmer needed"
    production: "In-circuit programming capability recommended"
    
  mechanical_integration:
    eval_board: "Large form factor -- 3.55 x 3.55 in (90 x 90 mm), octagonal outline -- not production-ready"
    standard_breakout: "PCB-mount friendly -- 4 x 1.4 in (101.6 x 35.6 mm)"
    mini_breakout: "Compact integration -- 3.15 x 1.4 in (80 x 35.5 mm)"
    mounting: "0.1 inch header sockets on every carrier, plus four plated mounting holes; the #64020 adds a solderless breadboard"

common_mistakes_to_avoid:
  overbuying_initially:
    mistake: "Buying complete add-on set before understanding needs"
    solution: "Start with core hardware, add specific boards as needed"
    
  underestimating_programming_needs:
    mistake: "Choosing breakout without considering programming setup"
    solution: "Factor in PropPlug cost and setup complexity"
    
  ignoring_form_factor_constraints:
    mistake: "Choosing Eval Board for size-constrained applications"
    solution: "Consider final application requirements from the start"
    
  memory_miscalculation:
    mistake: "Choosing the no-PSRAM P2-EC when the application needs RAM beyond the 512KB hub"
    solution: "Estimate runtime RAM needs early; choose P2-EC32MB (32MB PSRAM) if uncertain"

