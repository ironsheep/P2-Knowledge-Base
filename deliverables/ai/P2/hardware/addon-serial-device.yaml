component: P2 Eval Serial Device Add-on Board
part_number: "64006F"
series: "P2 Eval Add-on Boards (#64006)"
manufacturer: "Parallax Inc."
status: "active_production"
p2kb_key: "p2kbHwAddonSerialDevice"
category: addon
aliases:
  - "serial device board"
  - "serial device add-on"
  - "USB device board"
  - "P2 Eval Serial Device Add-on Board"
  - "64006F"
  - "#64006 add-on board"

description: >-
  Two microUSB-type device sockets, each with two activity LEDs (red and blue),
  that let the P2 behave as up to two USB-type devices connecting to a USB host
  (PC, laptop, or other host). The P2 handles the USB device enumeration
  protocol in software. Each activity LED has a 1 kOhm series resistor and is
  asserted high to light.

# --- Eval-header board model (uniform across all #64006 / eval-header occupants) ---
eval_header_occupant: true
pin_group:
  size: 8
  addressing: >-
    actual_P2_pin = base_pin + offset. The board defines its functions by OFFSET
    within an 8-pin eval-header group; the user chooses which header (base_pin)
    it plugs into. base_pin is the first pin of that group.
  base_pin_options: [0, 8, 16, 24, 32, 40, 48, 56]
  base_pin_caution: >-
    Group 56-63 (Header H): P58-P63 are shared with the host's Flash SPI and
    serial pins - not recommended.

signal_map:
  - offset: 0
    signal: "Blue activity LED (channel 1)"
    direction: out
    notes: "1 kOhm series resistor; assert high to light."
  - offset: 1
    signal: "Red activity LED (channel 1)"
    direction: out
    notes: "1 kOhm series resistor; assert high to light."
  - offset: 2
    signal: "USB channel 1 - Data D-"
    direction: bidir
    notes: "microUSB device data line (D-)."
  - offset: 3
    signal: "USB channel 1 - Data D+"
    direction: bidir
    notes: "microUSB device data line (D+)."
  - offset: 4
    signal: "USB channel 2 - Data D-"
    direction: bidir
    notes: "microUSB device data line (D-)."
  - offset: 5
    signal: "USB channel 2 - Data D+"
    direction: bidir
    notes: "microUSB device data line (D+)."
  - offset: 6
    signal: "Blue activity LED (channel 2)"
    direction: out
    notes: "1 kOhm series resistor; assert high to light."
  - offset: 7
    signal: "Red activity LED (channel 2)"
    direction: out
    notes: "1 kOhm series resistor; assert high to light."

