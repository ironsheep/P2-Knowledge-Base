description:
  source: "P2 HD Audio Add-on Set (#64014) Guide v1.0 10/26/2022 (Parallax Inc.), Overview, p.1; P2 HD Audio DAC Features, p.4"
  text: >-
    Two-board kit. "The P2 HD Audio Add-On Set comprises a 4-channel 32 bit 192 k
    Audio ADC (Analog to Digital Converter) and a 2-channel 16-bit 18-990 ohm Audio
    DAC (Digital to Analog Converter)." The ADC board is built on the AKM AK5704EN
    codec; the DAC board has NO codec IC at all - it is built directly on P2 Smart
    Pin DAC modes, so the P2 pins ARE the DAC. Each board carries a standard
    2x6-way 0.1 inch pitch socket compatible with any standard single Parallax P2
    accessory socket, and the two are designed to fit side by side at a dual port.
    Usable with any microcontroller that uses 3.3 V signal levels.

# === ADC BOARD (AK5704EN) ===
adc_board:
  source: "P2 HD Audio Add-on Set (#64014) Guide v1.0 10/26/2022 (Parallax Inc.), P2 HD Audio ADC, Features and Key Specifications, p.2; Pin Connections, p.3"
  codec: "AKM AK5704EN, 32-bit 4ch ADC with MIC pre-amplifier (the codec's own register map, I2C address and pin behaviour are in adc_codec_chip below)"
  eval_header_occupant: true
  pin_group:
    size: 8
    addressing: "actual_P2_pin = base_pin + offset; single 8-pin accessory-header group."
  interface: "I2C control (400 kHz) + serial audio (MCKI, BCLK, LRCK, SDTO1, SDTO2)"
  signal_map:
    - {offset: 0, signal: "PDN (power-down)", direction: out, notes: "L = power-down, H = power-up."}
    - {offset: 1, signal: "MCKI (master clock in)", direction: out, notes: "Master clock input to the codec."}
    - {offset: 2, signal: "BCLK (bit clock)", direction: out, notes: "Audio serial data clock."}
    - {offset: 3, signal: "LRCK (frame sync)", direction: out, notes: "Frame/word-select clock."}
    - {offset: 4, signal: "SDTO1 (serial data out 1)", direction: in, notes: "Audio from the MIC input jack."}
    - {offset: 5, signal: "SDTO2 (serial data out 2)", direction: in, notes: "Audio from the Line input jack. The codec pin only drives SDTO2 once register 00H bit SDTO2E is set - see adc_codec_chip."}
    - {offset: 6, signal: "SCL (I2C clock)", direction: out, notes: "I2C control clock."}
    - {offset: 7, signal: "SDA (I2C data)", direction: bidir, notes: "I2C control data."}
  unpopulated:
    WINTN: "Interrupt output pin (customer option - unpopulated header, N/C on the 2x6)."
  power_signals:
    VIO3V3: "3.3V supply to the ADC board."
    GND: "Common ground."
  i2c_clock: "400 kHz (the guide's Key Specifications: Control interface I2C bus (400 kHz))"
  unknown_on_this_board: >-
    UNKNOWN today: which level the #64014 ADC board ties the codec's CAD pin to
    (so which of the two addresses in adc_codec_chip the board answers at), and
    whether the board carries I2C pull-ups. The board guide states neither and
    no other ingested document does; the board schematic is not ingested.
  inputs: "4 input channels via two stereo 3.5 mm jacks, or two unpopulated 0.1\" 3-way header pad sets."
  specs:
    max_bits: "32 bit"
    max_fs: "192 kHz (typical 48 kHz)"
    min_fs: "8 kHz"
    max_snr: "105 dB"
    mic_gain: "+30 dB to 0 dB, 3 dB step"
    features: "VAD (voice activity detection); ultrasonic recording; configurable MIC pull-up for analog mics"
    pcb_dimensions: "1.6 x 1 in (40.64 x 25.4 mm)"

# === ADC CODEC CHIP FACTS (the AK5704 itself - not the board) ===
# Facts about the chip only, each from the chip maker's own datasheet. What the
# #64014 board does with the chip (CAD level, pull-ups, wiring) is in adc_board.
adc_codec_chip:
  source: "AKM AK5704 Low-Power 4-ch 32-bit ADC with MIC-Amp, Rev.1 (019000890-E-01, 2022/01), 2. Features, p.1; 5.2 Functions, p.6; 9.16 I2C-bus Control Interface, pp.75-76; 9.17 Register Map, pp.78-79; 9.18 Register Definition (00H Flow Control), p.80; 13. Ordering Guide, p.108"
  part: "AKM AK5704 (ordering code AK5704EN), 28-pin QFN, 4-ch 32-bit ADC with MIC-Amp"
  i2c_clock: "I2C-bus control interface, fast-mode, max 400 kHz; SDA and SCL pull-up resistors must be connected to (TVDD+0.3) V or less"
  i2c_slave_address_7bit: >-
    %001000C - the top six bits are fixed at %001000 and the low bit is the level of
    the chip's CAD pin ("I2C Chip Address Pin", pin 1): $10 with CAD low, $11 with
    CAD high.
  i2c_address_bytes: "CAD low: write = $20, read = $21. CAD high: write = $22, read = $23. The R/W bit is bit 0 of the first byte."
  register_range: >-
    Registers $00-$46 (the address counter rolls over to $00 after $46; writing $47-$7F
    is prohibited): flow control, power management, MIC input and power, MIC amp gain,
    digital MIC, clock-mode and PLL, audio I/F format, phase adjustment, HPF/filter
    select, MIC sensitivity, VAD, ALC and input volume, filter coefficients.
    Bit-level detail is in the datasheet.
  sdto2_default: >-
    Chip pin 6 is TDMIN (an INPUT) by default. It becomes the SDTO2 audio serial data
    OUTPUT only when register $00 bit D6 (SDTO2E) is set to 1; SDTO2E resets to 0.
  audio_formats: "32/24/16-bit I2S or MSB-justified, 16-bit PCM short/long frame, 4-ch TDM, 8/12/16-ch cascade TDM; master or slave mode"

# === DAC BOARD (P2 Smart Pin DAC - no codec IC) ===
dac_board:
  source: "P2 HD Audio Add-on Set (#64014) Guide v1.0 10/26/2022 (Parallax Inc.), P2 HD Audio DAC, Features / Key Specifications / Pin Connections, p.4-5; the P_DAC_* constant names come from Spin2 Language Documentation v55, Built-In Symbols for Smart Pin Configuration (DAC Output Modes), which lists exactly the four drive options this guide enumerates"
  codec: "none - the board is designed to leverage the Parallax P2 Smart Pin DAC modes"
  eval_header_occupant: true
  pin_group:
    size: 8
    addressing: "actual_P2_pin = base_pin + offset; single 8-pin accessory-header group."
  outputs: "2 output channels via one stereo 3.5 mm jack socket, or unpopulated 0.1 inch 3-way header pads"
  signal_map:
    - {offset: 0, signal: "DAC_R", direction: out, notes: "Common DAC Right Channel input (wired in parallel with offsets 1, 2, 3)."}
    - {offset: 1, signal: "DAC_R", direction: out, notes: "Same R channel."}
    - {offset: 2, signal: "DAC_R", direction: out, notes: "Same R channel."}
    - {offset: 3, signal: "DAC_R", direction: out, notes: "Same R channel."}
    - {offset: 4, signal: "DAC_L", direction: out, notes: "Common DAC Left Channel input (wired in parallel with offsets 5, 6, 7)."}
    - {offset: 5, signal: "DAC_L", direction: out, notes: "Same L channel."}
    - {offset: 6, signal: "DAC_L", direction: out, notes: "Same L channel."}
    - {offset: 7, signal: "DAC_L", direction: out, notes: "Same L channel."}
  power_signals:
    VIO3V3: "N/C - Not Connected on the DAC board."
    GND: "Common Ground reference connection."
  drive_options:
    note: >-
      "Each P2 SmartPin can output with these options" -- the guide's four
      impedance/peak-voltage pairs, with the Spin2 constant that selects each.
    options:
      - {impedance: "990 ohms", vpeak: "3.3 V", spin2_constant: "P_DAC_990R_3V"}
      - {impedance: "600 ohms", vpeak: "2.0 V", spin2_constant: "P_DAC_600R_2V"}
      - {impedance: "123.75 ohms", vpeak: "3.3 V", spin2_constant: "P_DAC_124R_3V"}
      - {impedance: "75 ohms", vpeak: "2.0 V", spin2_constant: "P_DAC_75R_2V"}
  parallel_drive_rule: >-
    "Drive line level or headphone level devices by using 1, 2, 3 or 4 channels
    simultaneously to set the required output drive impedance and max Vpp."
    Because the four pins of a channel are wired in parallel, N pins driven with
    the same mode give an output impedance of (mode impedance) / N.
  worked_example: >-
    "For 31 ohms drive (which is common for many headphones), set the 123.75 ohms
    mode on 4 channels and calculate with ohm's law for the total output impedance
    as 123.75 / 4 = 30.9375 ohms. With this setting you could plug the headphones
    directly into the audio jack on the DAC board!"
  specs:
    supply_voltage: "+3.3 VDC"
    vpp_output: "2 V or 3 V configurable"
    drive_impedance: "18.75 ohms to 990 ohms, configurable in 16 steps"
    form_factor: "dual 2x6-pin female pass-through headers, 0.1 inch spacing"
    mounting_hole: "3.2 mm diameter"
    operating_temperature: "-40 to +85 C (-40 to +185 F)"
    pcb_dimensions: "1.6 x 1 in (40.64 x 25.4 mm)"

specifications:
  requires_host: true
  supply_voltage: "+3.3 VDC (both boards)"
  connector: "dual 2x6-pin female passthrough headers, 0.1\" spacing (each board)"
  mounting_hole: "3.2 mm diameter"
  operating_temp: "-40 to +85 C (-40 to +185 F)"

limitations:
  - "AK5704 register bit-level detail is in the AK5704 datasheet (the board guide is board-level)"
  - "Which I2C address the board answers at ($10 or $11) is unknown - the board guide does not state the CAD strap level"
  - "DAC is built on P2 Smart Pins (no codec) - audio quality bounded by the Smart-Pin DAC, not a dedicated DAC IC"
  - "No code in the board guide itself; it points to example code on the product page"

