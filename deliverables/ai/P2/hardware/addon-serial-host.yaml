component: P2 Eval Serial Host Add-on Board
part_number: "64006B"
series: "P2 Eval Add-on Boards (#64006)"
manufacturer: "Parallax Inc."
status: "active_production"
p2kb_key: "p2kbHwAddonSerialHost"
category: addon
aliases:
  - "serial host board"
  - "serial host add-on"
  - "USB host add-on"
  - "P2 Eval Serial Host Add-on Board"
  - "64006B"
  - "#64006 add-on board"

# --- Eval-header board model (uniform across all #64006 / eval-header occupants) ---
eval_header_occupant: true
pin_group:
  size: 8
  addressing: >-
    actual_P2_pin = base_pin + offset. The board defines its functions by OFFSET
    within an 8-pin eval-header group; the user chooses which header (base_pin)
    it plugs into. base_pin is the first pin of that group.
  base_pin_options: [0, 8, 16, 24, 32, 40, 48, 56]
  base_pin_caution: >-
    Group 56-63 (Header H): P58-P63 are shared with the host's Flash SPI and
    serial pins - not recommended.

use_cases:
  primary:
    - "USB keyboard and mouse input"
    - "USB storage device access"
    - "USB sensor and measurement device interfaces"
    - "Human interface device (HID) connectivity"
  secondary:
    - "USB-to-serial converter connections"
    - "USB camera interfaces"
    - "Educational USB protocol development"
    - "USB device testing and validation"

code_patterns:
  spin2:
    enable_both_ports: |
      ' Enable both USB host ports (enables = base+1 and base+5)
      PUB enable_ports(base_pin)
        PINHIGH(base_pin + 1)            ' Power on channel 1
        PINHIGH(base_pin + 5)            ' Power on channel 2
    activity_led_control: |
      ' Control activity LEDs (LEDs = base+0 and base+4)
      PUB leds_on(base_pin)
        PINHIGH(base_pin + 0)            ' Light channel 1 activity LED
        PINHIGH(base_pin + 4)            ' Light channel 2 activity LED
    usb_data_access: |
      ' USB data pins (requires USB host protocol implementation in software)
      ' Channel 1: base+2 (D-), base+3 (D+)
      ' Channel 2: base+6 (D-), base+7 (D+)
      ' Smart Pin modes can be used for USB signaling.

