component: P2 Eval Serial Host Add-on Board
part_number: "64006B"
series: "P2 Eval Add-on Boards (#64006)"
manufacturer: "Parallax Inc."
status: "active_production"
p2kb_key: "p2kbHwAddonSerialHost"
category: addon
aliases:
  - "serial host board"
  - "serial host add-on"
  - "USB host add-on"
  - "P2 Eval Serial Host Add-on Board"
  - "64006B"
  - "#64006 add-on board"

description: >-
  Twin USB Type-A host sockets, each with a current-limited load switch
  (up to 500 mA continuous; reverse-current, short-circuit, over-temperature,
  and VBUS soft-start protection) and a user-controllable blue activity LED.
  Lets two USB devices connect at once (e.g. keyboard and mouse). REQUIRES 5V
  to function: with the P2-ES Eval Board Rev B, a shunt jumper must connect that
  board's ACC HDR and 5V pins to supply 5V to the I/O breakout edge headers.

# --- Eval-header board model (uniform across all #64006 / eval-header occupants) ---
eval_header_occupant: true
pin_group:
  size: 8
  addressing: >-
    actual_P2_pin = base_pin + offset. The board defines its functions by OFFSET
    within an 8-pin eval-header group; the user chooses which header (base_pin)
    it plugs into. base_pin is the first pin of that group.
  base_pin_options: [0, 8, 16, 24, 32, 40, 48, 56]
  base_pin_caution: >-
    Group 56-63 (Header H): P58-P63 are shared with the host's Flash SPI and
    serial pins - not recommended.

signal_map:
  - offset: 0
    signal: "Blue activity LED (channel 1)"
    direction: out
    notes: "1 kOhm series resistor; assert high to light; PWM-capable for brightness."
  - offset: 1
    signal: "USB channel 1 - 5V enable"
    direction: out
    notes: "Active high; set high to enable 5V output on channel 1."
  - offset: 2
    signal: "USB channel 1 - Data D-"
    direction: bidir
    notes: "USB-A host data line (D-)."
  - offset: 3
    signal: "USB channel 1 - Data D+"
    direction: bidir
    notes: "USB-A host data line (D+)."
  - offset: 4
    signal: "Blue activity LED (channel 2)"
    direction: out
    notes: "1 kOhm series resistor; assert high to light; PWM-capable for brightness."
  - offset: 5
    signal: "USB channel 2 - 5V enable"
    direction: out
    notes: "Active high; set high to enable 5V output on channel 2."
  - offset: 6
    signal: "USB channel 2 - Data D-"
    direction: bidir
    notes: "USB-A host data line (D-)."
  - offset: 7
    signal: "USB channel 2 - Data D+"
    direction: bidir
    notes: "USB-A host data line (D+)."

