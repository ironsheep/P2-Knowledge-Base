feature: Preprocessor System
type: overview
category: Preprocessor Directives

minimum_version: "v47"

description: |
  The Spin2 preprocessor provides conditional compilation and symbol definition 
  capabilities. Preprocessor directives begin with # and are processed before 
  compilation, allowing code to be included or excluded based on defined symbols.
  Available in PNut/pnut_ts v47 and later compilers. No version directive required.

directives:
  symbol_definition:
    - directive: "#DEFINE"
      purpose: "Define a preprocessor symbol"
      file: "define.yaml"
    - directive: "#UNDEF"
      purpose: "Undefine a previously defined symbol"
      file: "undef.yaml"
  conditional_compilation:
    - directive: "#IFDEF"
      purpose: "Compile block if symbol is defined"
      file: "ifdef.yaml"
    - directive: "#IFNDEF"
      purpose: "Compile block if symbol is NOT defined"
      file: "ifndef.yaml"
    - directive: "#ELSEIFDEF"
      purpose: "Else-if branch when symbol is defined"
      file: "elseifdef.yaml"
    - directive: "#ELSEIFNDEF"
      purpose: "Else-if branch when symbol is NOT defined"
      file: "elseifndef.yaml"
    - directive: "#ELSE"
      purpose: "Else branch for conditionals"
      file: "else.yaml"
    - directive: "#ENDIF"
      purpose: "End conditional compilation block"
      file: "endif.yaml"
  file_inclusion:
    - directive: "#INCLUDE"
      purpose: "Insert contents of another file"
      file: "include.yaml"
  diagnostics:
    - directive: "#ERROR"
      purpose: "Generate compile-time error with message"
      file: "error.yaml"
    - directive: "#WARN"
      purpose: "Generate compile-time warning with message"
      file: "warn.yaml"
  pragma:
    - directive: "#PRAGMA EXPORTDEF"
      purpose: "Export symbol to child objects"
      file: "pragma-exportdef.yaml"

command_line_options:
  - option: "-D symbol"
    purpose: "Define symbol before compilation"
    file: "external-symbols.yaml"
  - option: "-U symbol"
    purpose: "Block a #PRAGMA EXPORTDEF of that symbol (PNut-TS only) -- it does NOT undefine anything"
    file: "external-symbols.yaml"
  - option: "-I path"
    purpose: "Add include directory to search path"
    file: "external-symbols.yaml"

syntax:
  symbol_definition: "#DEFINE symbol"
  conditional_block: |
    #IFDEF symbol
        ' code compiled if symbol defined
    #ELSE
        ' code compiled if symbol not defined
    #ENDIF

key_characteristics:
  - characteristic: "Case sensitivity"
    description: "Symbol names are case-INSENSITIVE: DEBUG_MODE and debug_mode are the same symbol (Spin2 source is case-insensitive)"
  - characteristic: "Maximum nesting"
    description: "PNut allows up to 8 levels of nested conditionals; PNut-TS imposes no such limit. Stay within 8 to remain portable across both compilers."
  - characteristic: "Symbol scope"
    description: "Symbols persist from definition until end of file or #UNDEF"
  - characteristic: "External symbols"
    description: "Symbols can be defined via -D command line option (v48+). Presence only -- there is no -D symbol=value form in either compiler"
  - characteristic: "Symbol values"
    description: "COMPILER DIVERGENCE. Under PNut a symbol is presence-only -- defined or not. Under PNut-TS a symbol also carries substitution text (#DEFINE MSG hello there world), replacing the symbol name wherever it appears, including inside a quoted string. Presence-only usage is the portable subset"
  - characteristic: "No expression evaluation"
    description: "There is no #IF/#ELSEIF directive and no expression evaluation of any kind. The only question the preprocessor can ask is defined-or-not, via #IFDEF/#IFNDEF/#ELSEIFDEF/#ELSEIFNDEF. Encode choices as flag symbols"

examples:
  - code: |
      ' Debug build configuration - no version directive needed
      #DEFINE DEBUG_MODE
      
      PUB main()
      #IFDEF DEBUG_MODE
          debug("Debug build - diagnostics enabled")
      #ENDIF
          run_application()
    description: "Basic conditional compilation for debug builds"
    
  - code: |
      ' Platform-specific code selection
      #DEFINE TARGET_P2_REV_B
      
      PUB init_hardware()
      #IFDEF TARGET_P2_REV_B
          configure_rev_b_pins()
      #ELSEIFDEF TARGET_P2_REV_A
          configure_rev_a_pins()
      #ELSE
          configure_default_pins()
      #ENDIF
    description: "Multi-platform code selection"
    
  - code: |
      ' Nested conditionals (PNut allows up to 8 levels)
      #IFDEF FEATURE_SERIAL
          #IFDEF USE_HIGH_SPEED
              serial.start(921600)
          #ELSE
              serial.start(115200)
          #ENDIF
      #ENDIF
    description: "Nested conditional compilation"

anti_patterns:
  - anti_pattern: "deeply_nested_conditionals"
    severity: "maintainability"
    description: "Excessive nesting makes code hard to read and maintain"
    wrong: |
      #IFDEF FEATURE_A
        #IFDEF OPTION_1
          #IFDEF VARIANT_X
            #IFDEF DEBUG
              VALUE = 1
            #ELSE
              VALUE = 2
            #ENDIF
          #ELSE
            VALUE = 3
          #ENDIF
        #ELSE
          VALUE = 4
        #ENDIF
      #ELSE
        VALUE = 5
      #ENDIF
    correct: |
      ' Flatten with intermediate symbols
      #IFDEF FEATURE_A
      #DEFINE HAS_FEATURE_A
      #ENDIF
      #IFDEF OPTION_1
      #DEFINE HAS_OPTION_1
      #ENDIF

      #IFDEF HAS_FEATURE_A
        #IFDEF HAS_OPTION_1
          VALUE = 1
        #ELSE
          VALUE = 4
        #ENDIF
      #ELSE
        VALUE = 5
      #ENDIF

  - anti_pattern: "unbalanced_conditionals"
    severity: "compile_error"
    description: "Missing #ENDIF causes compilation to fail"
    wrong: |
      #IFDEF DEBUG_MODE
        debug_init()

      PUB main()      ' Error: #ENDIF never found
        process()
    correct: |
      #IFDEF DEBUG_MODE
        debug_init()
      #ENDIF

      PUB main()
        process()

  - anti_pattern: "contradictory_conditions"
    severity: "logic_error"
    description: "Confusing nested conditions suggest both modes active"
    wrong: |
      #IFDEF USE_MODE_A
      #IFDEF USE_MODE_B
        ' Implies both modes simultaneously
      #ENDIF
      #ENDIF
    correct: |
      ' Test the modes in priority order - the chain itself enforces exclusivity
      #IFDEF USE_MODE_A
        ' Mode A code
      #ELSEIFDEF USE_MODE_B
        ' Mode B code
      #ELSE
      #ERROR Define exactly one of USE_MODE_A or USE_MODE_B
      #ENDIF
    note: >-
      An #ELSEIFDEF chain is already mutually exclusive; a defensive #UNDEF adds
      nothing and warns when the symbol was never defined. The #ELSE/#ERROR
      fall-through turns "neither mode selected" into a build-time error instead
      of a silently empty block.

  - anti_pattern: "no_if_expression_directive"
    severity: "compile_error"
    description: >-
      Writing #IF or #ELSEIF. Neither exists in this preprocessor -- there is no
      expression evaluation. The #IF line does not open a conditional and does not
      gate anything, so its body compiles UNCONDITIONALLY; the matching #ENDIF is
      then a stray and the build fails with 'Must be preceeded by #IFDEF or #IFNDEF'.
      The failure is reported at the #ENDIF, several lines away from the #IF that
      caused it.
    wrong: |
      #DEFINE BOARD_REV 2
      #IF BOARD_REV == 2
        ' compiled no matter what BOARD_REV is
      #ELSEIF BOARD_REV == 1
        ' also not gated
      #ENDIF          ' error: Must be preceeded by #IFDEF or #IFNDEF
    correct: |
      ' Encode each choice as its own flag symbol and test presence
      #DEFINE BOARD_REV_2
      #IFDEF BOARD_REV_2
        ' Rev 2 code
      #ELSEIFDEF BOARD_REV_1
        ' Rev 1 code
      #ELSE
      #ERROR Define exactly one BOARD_REV_n
      #ENDIF

  - anti_pattern: "overusing_preprocessor_for_logic"
    severity: "design"
    description: "Using preprocessor where runtime logic is more appropriate"
    wrong: |
      ' Duplicated method for each sensor type
      #IFDEF SENSOR_TYPE_1
      PUB read_sensor() : value
        value := sensor1_read()
      #ELSEIFDEF SENSOR_TYPE_2
      PUB read_sensor() : value
        value := sensor2_read()
      #ENDIF
    correct: |
      ' Runtime polymorphism for flexibility
      VAR
        long sensor_type

      PUB init(type)
        sensor_type := type

      PUB read_sensor() : value
        case sensor_type
          SENSOR_TYPE_1: value := sensor1_read()
          SENSOR_TYPE_2: value := sensor2_read()
    note: "Use preprocessor for compile-time config; runtime logic for flexibility"

  - anti_pattern: "missing_default_case"
    severity: "undefined_behavior"
    description: "No fallback if none of the conditions match"
    wrong: |
      #IFDEF OPTION_A
        VALUE = 1
      #ELSEIFDEF OPTION_B
        VALUE = 2
      #ENDIF
      ' VALUE undefined if neither defined!
    correct: |
      #IFDEF OPTION_A
        VALUE = 1
      #ELSEIFDEF OPTION_B
        VALUE = 2
      #ELSE
        VALUE = 0              ' Default value
        ' Or use: #ERROR "Must define OPTION_A or OPTION_B"
      #ENDIF

  - anti_pattern: "no_include_guard"
    severity: "compile_error"
    description: "Including same file multiple times causes duplicate definitions"
    wrong: |
      ' utils.spin2 (no guard):
      PUB helper_func()
        return 0

      ' main.spin2:
      #INCLUDE "utils"
      #INCLUDE "other"   ' If other also includes utils, duplicate error!
    correct: |
      ' utils.spin2 (with guard):
      #IFNDEF UTILS_INCLUDED
      #DEFINE UTILS_INCLUDED

      PUB helper_func()
        return 0

      #ENDIF

notes:
  - "Available in v47+ compilers - no version directive required"
  - "Symbol names are case-insensitive (Spin2 source is case-insensitive)"
  - "PNut's maximum nesting depth is 8 levels; PNut-TS has no such cap -- keep to 8 for portability"
  - "Symbols defined with #DEFINE persist until #UNDEF or end of file"
  - "External symbols can be defined via command line with -D option (v48+); presence only -- there is no -D symbol=value form in either compiler"
  - "-U does NOT undefine or block a symbol -- its only effect is to block a #PRAGMA EXPORTDEF of that symbol (PNut-TS only)"
  - "There is no #IF or #ELSEIF directive and no expression evaluation -- see the no_if_expression_directive anti-pattern"
  - "PNut-TS: a symbol carries substitution text; under PNut a symbol is presence-only. Presence-only usage is the portable subset"
  - "PNut-TS: #UNDEF of a predefined __*__ symbol is refused with a warning and the symbol stays defined; a -D symbol, by contrast, can be #UNDEF'd normally"
  - "PNut-TS: a function-like #DEFINE NAME(args) is an error -- there are no parameterized macros"
  - "The __DEBUG__ symbol is automatically defined when debug output is enabled"
  - "Preprocessor runs before compilation - no runtime overhead"
  - "#INCLUDE inserts file contents at directive location; the .spin2 extension is appended"
  - "#ERROR and #WARN provide compile-time diagnostics, and fire ONLY from branches that are taken"
  - "#PRAGMA EXPORTDEF propagates symbols to child objects"
  - "#UNDEF of a symbol that was never defined is a WARNING, not an error: '#undef symbol [NAME] not found'"
  - "Diagnostics go to stderr, one per line in source order, as <filespec>:<line>:error|warning:<message> -- no ANSI color codes; all preprocessor errors in a file are reported from a single build"

compiler_portability:
  summary: >-
    Two compilers implement this preprocessor -- PNut (Chip Gracey's, the reference)
    and PNut-TS. They agree on the whole directive set; the differences below are the
    only ones that affect portable source.
  divergences:
    - topic: "Conditional nesting depth"
      pnut: "Maximum 8 levels of #IFDEF/#IFNDEF nesting"
      pnut_ts: "No documented limit"
      portable: "Keep nesting to 8 levels or fewer"
    - topic: "#ERROR / #WARN / #INCLUDE / #PRAGMA"
      pnut: "Not provided"
      pnut_ts: "PNut-TS extensions, with wording of their own"
      portable: "Source that must build under PNut cannot rely on these"
    - topic: "Symbol values and text substitution"
      pnut: "A symbol has no value -- #DEFINE symbol makes it defined, nothing more"
      pnut_ts: "A symbol carries substitution text (everything after the name; 1 if omitted), replacing the symbol wherever it appears, including inside a quoted string"
      portable: "Use presence only, tested with #IFDEF/#IFNDEF; do not rely on a symbol substituting"
    - topic: "Command-line options"
      pnut: "-D only"
      pnut_ts: "-D, plus -U (blocks #PRAGMA EXPORTDEF) and -I (include search path)"
      portable: "Only -D is available in both, and only in its presence form -- there is no -D symbol=value in either"
    - topic: "Number of command-line symbols"
      pnut: "Up to 16"
      pnut_ts: "No enforced cap"
      portable: "Keep to 16 or fewer"
    - topic: "#UNDEF of a predefined __*__ symbol"
      pnut: "Not documented"
      pnut_ts: "Refused -- warning 'cannot undefine built-in symbol [NAME]', the symbol stays defined, the build continues"
      portable: "Do not #UNDEF a predefined symbol"
    - topic: "Function-like #DEFINE"
      pnut: "Not provided -- there are no parameterized macros"
      pnut_ts: "Error: '#define does not support arguments — only simple symbol definitions'"
      portable: "There are no macros with arguments in either compiler"
  shared_diagnostic_wording: >-
    Several diagnostics use identical wording in both compilers, so one search matches
    build logs from either: 'Expected a preprocessor symbol',
    'Must be preceeded by #IFDEF or #IFNDEF', 'Expected #ENDIF'. The misspelling in the
    second is PNut's own text, reproduced deliberately -- do not correct it.

