feature: Command-Line Preprocessor Options
type: preprocessor
category: Preprocessor Directives

minimum_version: "v48"

description: |
  Preprocessor symbols and include paths can be configured from the command line,
  allowing the same source code to be compiled with different configurations
  without modifying source files. Options available:
  - -D: Define a symbol (as if #DEFINE appeared at file start). Both compilers.
  - -U: Block a #PRAGMA EXPORTDEF of that symbol. PNut-TS only.
  - -I: Add directories to the #INCLUDE search path. PNut-TS only.
  Available in PNut/pnut_ts v48 and later compilers.

  A command-line symbol is DEFINED ONLY -- it carries no value. There is no
  -D symbol=value form in either compiler: the symbol is presence-only, testable
  with #IFDEF/#IFNDEF.

command_line_options:
  - option: "-D"
    purpose: "Define preprocessor symbol"
    syntax: "-D symbol"
    description: >-
      Defines symbol before any source is processed, in every file of the compilation
      (including #INCLUDEd files and OBJ children). Presence only -- no value.
  - option: "-U"
    purpose: "Block a symbol's #PRAGMA EXPORTDEF"
    syntax: "-U symbol"
    description: >-
      PNut-TS only. Prevents a #PRAGMA EXPORTDEF of the named symbol from taking
      effect, so the symbol stays private to the file that defined it. It does NOT
      undefine or prevent a symbol -- a source #DEFINE (or a -D) of that symbol
      remains fully in effect.
  - option: "-I"
    purpose: "Add include directory"
    syntax: "-I path"
    description: "PNut-TS only. Adds directory to search path for #INCLUDE files"

syntax:
  define_symbol: "-D symbol"
  block_export: "-U symbol"
  include_path: "-I path"

command_line:
  pnut: "pnut -D DEBUG_MODE -D BOARD_P2EDGE myprogram.spin2"
  pnut_ts: "pnut_ts -D DEBUG_MODE -D BOARD_P2EDGE myprogram.spin2"
  with_export_block: "pnut_ts -U USE_PSRAM source.spin2"
  with_include: "pnut_ts -I ./includes -I ./drivers source.spin2"
  combined: "pnut_ts -D RELEASE -U USE_PSRAM -I ./lib source.spin2"

parameters:
  - name: "symbol"
    type: "identifier"
    description: "Name of the symbol (case-insensitive, max 32 chars)"
  - name: "path"
    type: "directory"
    description: "Directory path for -I include search"

limits:
  max_symbols: 16          # PNut's documented cap; PNut-TS does not enforce it
  max_name_length: 32

# The predefined symbols come in two KINDS. A presence-only symbol exists to be
# tested with #IFDEF/#IFNDEF -- it is never text-substituted, and its numeric
# "value" is not observable, because this preprocessor has no #IF expression
# evaluation: the only question you can ask is defined-or-not. A substituting
# symbol carries text that replaces the symbol name wherever it appears in the
# file, including inside a quoted string -- which is the normal way to use one.
predefined_symbols:
  - symbol: "__DEBUG__"
    kind: "presence-only"
    description: "Defined only when compiling debug() statements is enabled (-d given). The one predefined symbol both compilers provide."
    compilers: "PNut and PNut-TS"
    example: |
      #IFDEF __DEBUG__
          ' Code compiled only when debug is enabled
      #ENDIF
  - symbol: "__P2__"
    kind: "presence-only"
    description: "Defined -- compiling for Propeller 2"
    compilers: "PNut-TS"
  - symbol: "__propeller__"
    kind: "presence-only"
    description: "Defined -- compiling for a Propeller"
    compilers: "PNut-TS"
  - symbol: "__propeller2__"
    kind: "presence-only"
    description: "Defined -- compiling for Propeller 2"
    compilers: "PNut-TS"
  - symbol: "__PNUT_TS__"
    kind: "presence-only"
    description: "Defined -- indicates the PNut-TS compiler is in use. Guard PNut-TS-only source with it (the #ERROR/#WARN/#INCLUDE/#PRAGMA extensions) so the same file still builds under PNut. Note the underscore: there is no __PNUTTS__."
    compilers: "PNut-TS"
    example: |
      #IFDEF __PNUT_TS__
      #WARN Building with the PNut-TS extensions
      #ENDIF
  - symbol: "__DATE__"
    kind: "substituting"
    description: "The date compilation of the file began, as YYYY-MM-DD (e.g. 2026-08-09)"
    compilers: "PNut-TS"
  - symbol: "__TIME__"
    kind: "substituting"
    description: "The time compilation of the file began, as HH:MM (e.g. 18:17)"
    compilers: "PNut-TS"
  - symbol: "__FILE__"
    kind: "substituting"
    description: "The name of the file being preprocessed (e.g. myfile.spin2). Inside an #INCLUDEd file this is the INCLUDED file's name, not the top file's."
    compilers: "PNut-TS"
  - symbol: "__VERSION__"
    kind: "substituting"
    description: >-
      The PNut-TS version, bare with no v prefix (e.g. 1.55.3), matching the version the
      CLI banner reports. The substituted text is a bare dotted string and is NOT a legal
      Spin2 expression -- CON V = __VERSION__ fails at the use site. Use it inside a quoted
      string, or test it with #IFDEF.
    compilers: "PNut-TS"
    example: |
      DAT
        byte "__VERSION__", 0     ' emits: 1.55.3
    minimum_version: "PNut-TS v1.55.3"

# Every symbol above was confirmed by compiling probes under PNut-TS v1.55.3
# (2026-08-09): an #IFDEF probe for presence, and an emitted `byte "SYM", 0`
# read back from the -i intermediate file for substitution. The presence-only
# symbols were confirmed NOT to substitute -- byte "__P2__" stays literal.
# All predefined __*__ symbols are protected from #UNDEF (see undef.yaml).
#
# History: v1.55.2 and earlier defined __VERSION__ too late for the preprocessor
# to see it, so any use failed; it was omitted from this file until v1.55.3 made
# it real. The v1.55.2 Preprocessor.md also spelled the compiler marker
# __PNUTTS__, a documentation typo -- the symbol has always been __PNUT_TS__.

examples:
  - code: |
      ' Source file: myprogram.spin2
      ' Compile with: pnut_ts -DDEBUG_MODE myprogram.spin2
      
      PUB main()
      #IFDEF DEBUG_MODE
          debug("Debug mode enabled via command line")
      #ENDIF
          run_application()
    description: "Basic external symbol usage"
    
  - code: |
      ' Build script defines target platform
      ' Compile with: pnut_ts -DTARGET_P2_EDGE myprogram.spin2
      
      #IFDEF TARGET_P2_EDGE
          CON FLASH_SIZE = $800000
      #ELSEIFDEF TARGET_P2_EVAL
          CON FLASH_SIZE = $200000
      #ELSE
          CON FLASH_SIZE = 0
      #ENDIF
    description: "Platform selection via external symbol"
    
  - code: |
      ' Multiple external symbols for build configuration
      ' Compile with: pnut_ts -D RELEASE -D OPTIMIZE app.spin2
      
      #IFDEF RELEASE
          #IFNDEF DEBUG_MODE
              ' Release build without debug
          #ENDIF
      #ENDIF
      
      #IFDEF OPTIMIZE
          ' Include optimization passes
      #ENDIF
    description: "Multiple build configuration symbols"
    
  - code: |
      ' Using __DEBUG__ predefined symbol
      ' When compiled with debug enabled, __DEBUG__ is automatically defined
      
      PUB log(msg)
      #IFDEF __DEBUG__
          debug(msg)
      #ELSE
          ' Silent in non-debug builds
      #ENDIF
    description: "Using the predefined __DEBUG__ symbol"
    
  - code: |
      ' An external symbol is an ORDINARY symbol -- it can be undefined in source
      ' Compile with: pnut_ts -D BUILD_CONFIG myprogram.spin2

      #IFDEF BUILD_CONFIG
          ' Compiled -- the command line defined it
      #ENDIF

      #UNDEF BUILD_CONFIG     ' silently removes it, no warning

      #IFDEF BUILD_CONFIG
          ' NOT compiled -- the symbol is gone for the rest of the file
      #ENDIF
    description: "A -D symbol can be #UNDEF'd (only the predefined __*__ symbols are protected)"

  - code: |
      ' Selecting a release build from the command line
      ' -U does NOT do this: it only blocks #PRAGMA EXPORTDEF, and leaves a
      ' source #DEFINE fully in effect. Drive the choice with a symbol instead.

      #IFNDEF RELEASE
      #DEFINE DEBUG_BUILD          ' debug is the default
      #ENDIF

      PUB main()
      #IFDEF DEBUG_BUILD
        debug("Debug mode")
      #ENDIF
        run_app()

      ' Debug build:   pnut_ts source.spin2
      ' Release build: pnut_ts -D RELEASE source.spin2
    description: "Release vs debug selection -- the portable pattern, since -U cannot remove a symbol"

  - code: |
      ' Using -I for include paths
      ' Directory structure:
      '   project/
      '     main.spin2
      '     common/
      '       utils.spin2
      '     drivers/
      '       serial.spin2

      ' In main.spin2:
      #INCLUDE "utils"     ' Found via -I ./common
      #INCLUDE "serial"    ' Found via -I ./drivers

      ' Compile with:
      ' pnut_ts -I ./common -I ./drivers main.spin2
    description: "Using -I for include directory search paths"

  - code: |
      ' Combined options for CI/CD builds
      ' pnut_ts -D RELEASE -U LOCAL_OVERRIDE -I ./lib source.spin2

      #IFDEF RELEASE
        ' Production code paths
      #ENDIF

      ' -U LOCAL_OVERRIDE does not undefine anything -- it keeps a
      ' #PRAGMA EXPORTDEF LOCAL_OVERRIDE from reaching the child objects

      #INCLUDE "common_utils"  ' Found in ./lib directory
    description: "Combining -D, -U, and -I for CI/CD builds"

use_cases:
  - case: "CI/CD builds"
    description: "Define RELEASE, DEBUG, or TEST symbols from build scripts"
  - case: "Platform targeting"
    description: "Define TARGET_* symbols to select hardware configuration"
  - case: "Feature flags"
    description: "Enable/disable features without source modification"
  - case: "Release builds"
    description: "Define a RELEASE symbol and let the source select against it with #IFNDEF"
  - case: "Library organization"
    description: "Use -I to locate includes in library directories"

include_search_order:
  description: "When #INCLUDE is encountered, directories are searched in order:"
  order:
    - priority: 1
      source: "-I directories"
      description: "Searched in order specified on command line"
    - priority: 2
      source: "Source file directory"
      description: "Directory containing the file with #INCLUDE"

notes:
  - "Available in v48+ compilers"
  - "-D symbols are case-insensitive, like all Spin2 symbols"
  - "There is NO -D symbol=value form in either compiler. PNut-TS accepts the text without complaint and defines NOTHING -- pnut_ts -D VERS=200 leaves VERS undefined, with no diagnostic. To carry a value, use a source #DEFINE (PNut-TS only)"
  - "PNut accepts up to 16 external symbols via -D; PNut-TS does not enforce that cap -- keep to 16 for portability"
  - "Maximum symbol name length is 32 characters"
  - "-D symbols CAN be undefined with #UNDEF in source -- they are ordinary user symbols. Only the predefined __*__ symbols are protected from #UNDEF"
  - "-D symbols are defined before any source is read, so a later source #DEFINE of the same symbol is a redefinition, not a conflict"
  - "-U does NOT undefine or prevent a symbol -- its only effect is to block a #PRAGMA EXPORTDEF of that symbol. A source #DEFINE of the symbol remains fully in effect, and -U SYM -D SYM leaves SYM defined (in either order)"
  - "-U and -I are PNut-TS options; PNut provides only -D"
  - "-I directories are searched before source file directory for #INCLUDE"
  - "Multiple -I options are searched in command-line order"
  - "The __DEBUG__ symbol is predefined when debug output is enabled"
  - "Useful for build automation and configuration management"

related:
  - language/spin2/preprocessor/define.yaml
  - language/spin2/preprocessor/undef.yaml
  - language/spin2/preprocessor/ifdef.yaml
  - language/spin2/preprocessor/ifndef.yaml
  - language/spin2/preprocessor/include.yaml
  - language/spin2/preprocessor/preprocessor-overview.yaml

see_also:
  - "Preprocessor system"
  - "Build configurations"
  - "Command-line compilation"
  - "CI/CD integration"

oneliner: "Command-line options -D, -U, -I for preprocessor configuration (v48+)"
