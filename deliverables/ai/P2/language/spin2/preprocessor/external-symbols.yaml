feature: Command-Line Preprocessor Options
type: preprocessor
category: Preprocessor Directives

minimum_version: "v48"

description: |
  Preprocessor symbols and include paths can be configured from the command line,
  allowing the same source code to be compiled with different configurations
  without modifying source files. Three options are available:
  - -D: Define a symbol (as if #DEFINE appeared at file start)
  - -U: Prevent a symbol from being defined (overrides source #DEFINE)
  - -I: Add directories to the #INCLUDE search path
  Available in PNut/pnut_ts v48 and later compilers.

command_line_options:
  - option: "-D"
    purpose: "Define preprocessor symbol"
    syntax: "-D symbol or -D symbol=value"
    description: "Defines symbol before source is processed, overrides source #DEFINE"
  - option: "-U"
    purpose: "Undefine/prevent symbol"
    syntax: "-U symbol"
    description: "Prevents symbol from being defined, even if #DEFINE appears in source"
  - option: "-I"
    purpose: "Add include directory"
    syntax: "-I path"
    description: "Adds directory to search path for #INCLUDE files"

syntax:
  define_symbol: "-D symbol"
  define_with_value: "-D symbol=value"
  undefine_symbol: "-U symbol"
  include_path: "-I path"

command_line:
  pnut: "pnut -DDEBUG_MODE -DVERSION=2 myprogram.spin2"
  pnut_ts: "pnut_ts -DDEBUG_MODE -DVERSION=2 myprogram.spin2"
  with_undefine: "pnut_ts -U DEBUG_MODE source.spin2"
  with_include: "pnut_ts -I ./includes -I ./drivers source.spin2"
  combined: "pnut_ts -D RELEASE -U DEBUG_MODE -I ./lib source.spin2"

parameters:
  - name: "symbol"
    type: "identifier"
    description: "Name of the symbol to define/undefine (case-insensitive, max 31 chars)"
  - name: "value"
    type: "string"
    description: "Optional value to associate with -D symbol"
  - name: "path"
    type: "directory"
    description: "Directory path for -I include search"

limits:
  max_symbols: 16
  max_name_length: 31

predefined_symbols:
  - symbol: "__DEBUG__"
    description: "Defined as 1 only when compiling debug() statements is enabled (-d given). The one predefined symbol both compilers provide."
    compilers: "PNut and PNut-TS"
    example: |
      #IFDEF __DEBUG__
          ' Code compiled only when debug is enabled
      #ENDIF
  - symbol: "__P2__"
    description: "Defined as 1 -- compiling for Propeller 2"
    compilers: "PNut-TS"
  - symbol: "__propeller__"
    description: "Defined as 2 -- the Propeller generation being compiled for"
    compilers: "PNut-TS"
  - symbol: "__propeller2__"
    description: "Defined as 1 -- compiling for Propeller 2"
    compilers: "PNut-TS"
  - symbol: "__PNUT_TS__"
    description: "Defined as 1 -- indicates the PNut-TS compiler is in use. Guard PNut-TS-only source with it (the #ERROR/#WARN/#INCLUDE/#PRAGMA extensions) so the same file still builds under PNut."
    compilers: "PNut-TS"
    example: |
      #IFDEF __PNUT_TS__
      #WARN Building with the PNut-TS extensions
      #ENDIF
  - symbol: "__DATE__"
    description: "String holding the date compilation began"
    compilers: "PNut-TS"
  - symbol: "__TIME__"
    description: "String holding the time compilation began"
    compilers: "PNut-TS"
  - symbol: "__FILE__"
    description: "String giving the file currently being compiled"
    compilers: "PNut-TS"

# Every symbol above was confirmed present by compiling an #IFDEF probe for each
# under PNut-TS v1.55.2 (2026-08-08). Two notes on that release's own
# Preprocessor.md table:
#   - it spells the compiler marker __PNUTTS__; the symbol the compiler actually
#     defines is __PNUT_TS__ (probed above), which is what this entry documents.
#   - it lists __VERSION__, which is NOT defined under any spelling tried, so it
#     is omitted here rather than documented as usable.

examples:
  - code: |
      ' Source file: myprogram.spin2
      ' Compile with: pnut_ts -DDEBUG_MODE myprogram.spin2
      
      PUB main()
      #IFDEF DEBUG_MODE
          debug("Debug mode enabled via command line")
      #ENDIF
          run_application()
    description: "Basic external symbol usage"
    
  - code: |
      ' Build script defines target platform
      ' Compile with: pnut_ts -DTARGET_P2_EDGE myprogram.spin2
      
      #IFDEF TARGET_P2_EDGE
          CON FLASH_SIZE = $800000
      #ELSEIFDEF TARGET_P2_EVAL
          CON FLASH_SIZE = $200000
      #ELSE
          CON FLASH_SIZE = 0
      #ENDIF
    description: "Platform selection via external symbol"
    
  - code: |
      ' Multiple external symbols for build configuration
      ' Compile with: pnut_ts -DRELEASE -DOPTIMIZE -DVERSION=100 app.spin2
      
      #IFDEF RELEASE
          #IFNDEF DEBUG_MODE
              ' Release build without debug
          #ENDIF
      #ENDIF
      
      #IFDEF OPTIMIZE
          ' Include optimization passes
      #ENDIF
    description: "Multiple build configuration symbols"
    
  - code: |
      ' Using __DEBUG__ predefined symbol
      ' When compiled with debug enabled, __DEBUG__ is automatically defined
      
      PUB log(msg)
      #IFDEF __DEBUG__
          debug(msg)
      #ELSE
          ' Silent in non-debug builds
      #ENDIF
    description: "Using the predefined __DEBUG__ symbol"
    
  - code: |
      ' External symbols cannot be undefined
      ' This is intentional - preserves build system control

      ' Compile with: pnut_ts -DBUILD_CONFIG myprogram.spin2

      #IFDEF BUILD_CONFIG
          ' This block is ALWAYS compiled when -DBUILD_CONFIG is used
          ' #UNDEF BUILD_CONFIG would have no effect on external symbols
      #ENDIF
    description: "External symbols persist (cannot be #UNDEF'd)"

  - code: |
      ' Using -U to override source file defaults
      ' Source file has DEBUG_BUILD defined:
      #DEFINE DEBUG_BUILD

      PUB main()
      #IFDEF DEBUG_BUILD
        debug("Debug mode")
      #ENDIF
        run_app()

      ' Compile for release (removes debug code):
      ' pnut_ts -U DEBUG_BUILD source.spin2
    description: "Override source #DEFINE with -U for release builds"

  - code: |
      ' Using -I for include paths
      ' Directory structure:
      '   project/
      '     main.spin2
      '     common/
      '       utils.spin2
      '     drivers/
      '       serial.spin2

      ' In main.spin2:
      #INCLUDE "utils"     ' Found via -I ./common
      #INCLUDE "serial"    ' Found via -I ./drivers

      ' Compile with:
      ' pnut_ts -I ./common -I ./drivers main.spin2
    description: "Using -I for include directory search paths"

  - code: |
      ' Combined options for CI/CD builds
      ' pnut_ts -D RELEASE -D VERSION=200 -U DEBUG_MODE -I ./lib source.spin2

      #IFDEF RELEASE
        ' Production code paths
      #ENDIF

      #IFDEF DEBUG_MODE
        ' This code will NOT be compiled due to -U DEBUG_MODE
        debug("Debug output")
      #ENDIF

      #INCLUDE "common_utils"  ' Found in ./lib directory
    description: "Combining -D, -U, and -I for CI/CD builds"

use_cases:
  - case: "CI/CD builds"
    description: "Define RELEASE, DEBUG, or TEST symbols from build scripts"
  - case: "Platform targeting"
    description: "Define TARGET_* symbols to select hardware configuration"
  - case: "Feature flags"
    description: "Enable/disable features without source modification"
  - case: "Version embedding"
    description: "Pass version numbers into compilation"
  - case: "Release builds"
    description: "Use -U to override source debug symbols without modifying code"
  - case: "Library organization"
    description: "Use -I to locate includes in library directories"

include_search_order:
  description: "When #INCLUDE is encountered, directories are searched in order:"
  order:
    - priority: 1
      source: "-I directories"
      description: "Searched in order specified on command line"
    - priority: 2
      source: "Source file directory"
      description: "Directory containing the file with #INCLUDE"

notes:
  - "Available in v48+ compilers"
  - "-D symbols are case-insensitive, like all Spin2 symbols"
  - "Maximum of 16 external symbols can be defined via -D"
  - "Maximum symbol name length is 31 characters"
  - "-D symbols CANNOT be undefined with #UNDEF in source"
  - "-D symbols have priority over source-defined symbols"
  - "-U prevents symbol definition even if #DEFINE appears in source"
  - "-U is processed before -D, so -U SYM -D SYM results in SYM being defined"
  - "-I directories are searched before source file directory for #INCLUDE"
  - "Multiple -I options are searched in command-line order"
  - "The __DEBUG__ symbol is predefined when debug output is enabled"
  - "Useful for build automation and configuration management"

related:
  - language/spin2/preprocessor/define.yaml
  - language/spin2/preprocessor/undef.yaml
  - language/spin2/preprocessor/ifdef.yaml
  - language/spin2/preprocessor/ifndef.yaml
  - language/spin2/preprocessor/include.yaml
  - language/spin2/preprocessor/preprocessor-overview.yaml

see_also:
  - "Preprocessor system"
  - "Build configurations"
  - "Command-line compilation"
  - "CI/CD integration"

oneliner: "Command-line options -D, -U, -I for preprocessor configuration (v48+)"
