directive: "#UNDEF"
type: preprocessor
category: Preprocessor Directives

minimum_version: "v47"

description: |
  Removes a previously defined preprocessor symbol. After #UNDEF, the symbol 
  will no longer be recognized by #IFDEF and will be recognized by #IFNDEF.
  Useful for conditionally redefining symbols or disabling features partway 
  through a file.
  Available in PNut/pnut_ts v47 and later compilers. No version directive required.

syntax:
  basic: "#UNDEF symbol"

parameters:
  - name: "symbol"
    type: "identifier"
    description: "Name of the symbol to undefine (case-insensitive)"

examples:
  - code: |
      ' Define then undefine a symbol - no version directive needed
      #DEFINE TEMP_FEATURE
      
      #IFDEF TEMP_FEATURE
          ' This code IS compiled
          debug("Feature enabled here")
      #ENDIF
      
      #UNDEF TEMP_FEATURE
      
      #IFDEF TEMP_FEATURE
          ' This code is NOT compiled
          debug("Feature disabled now")
      #ENDIF
    description: "Basic symbol undefinition"
    
  - code: |
      ' Conditional redefinition pattern
      #DEFINE LOG_LEVEL_VERBOSE
      
      PUB section_one()
      #IFDEF LOG_LEVEL_VERBOSE
          debug("Verbose: Entering section one")
      #ENDIF
          process_section_one()
      
      ' Disable verbose logging for performance-critical section
      #UNDEF LOG_LEVEL_VERBOSE
      
      PUB critical_section()
          ' No debug output here even if VERBOSE was defined
          fast_processing()
      
      ' Re-enable if needed
      #DEFINE LOG_LEVEL_VERBOSE
    description: "Temporarily disable feature for code sections"
    
  - code: |
      ' Guard against external definition
      #IFDEF CUSTOM_CONFIG
          ' Use external configuration
      #ELSE
          ' Define defaults
          #DEFINE USE_DEFAULT_PINS
          #DEFINE USE_DEFAULT_SPEED
      #ENDIF
      
      ' Later, clear defaults if custom was loaded
      #IFDEF CUSTOM_CONFIG
          #UNDEF USE_DEFAULT_PINS
          #UNDEF USE_DEFAULT_SPEED
      #ENDIF
    description: "Managing default vs custom configuration symbols"

notes:
  - "Available in v47+ compilers - no version directive required"
  - "Symbol names are case-insensitive (Spin2 source is case-insensitive)"
  - "Undefining a non-existent symbol is allowed: it is a WARNING, not an error -- the build continues and output artifacts are written. Diagnostic text: '#undef symbol [NAME] not found'"
  - "Do not use a defensive #UNDEF to force mutual exclusivity: it warns whenever the symbol was never defined. An #ELSEIFDEF chain is already exclusive -- see preprocessor-overview contradictory_conditions"
  - "External symbols (defined via -D) CAN be undefined with #UNDEF -- they are ordinary user symbols, and the removal is silent. Only the predefined __*__ symbols are protected"
  - "PNut-TS: #UNDEF of a predefined __*__ symbol is REFUSED -- the symbol stays defined, the build continues, and a warning is reported: 'cannot undefine built-in symbol [__P2__]'. These symbols describe the compilation environment, so removing one would misbehave far from the file that removed it"
  - "PNut-TS: removal is COMPLETE -- after #UNDEF the symbol is absent from #IFDEF and its text is no longer substituted, so a later #DEFINE installs a new value. Earlier PNut-TS releases removed only the #IFDEF presence while the old substitution silently kept expanding"
  - "After #UNDEF, the symbol can be redefined with #DEFINE"

related:
  - define
  - ifdef
  - ifndef
  - language/spin2/preprocessor/external-symbols.yaml

see_also:
  - "Preprocessor system"
  - "Conditional compilation"
  - "Symbol management"

oneliner: "Remove a previously defined preprocessor symbol (v47+)"
