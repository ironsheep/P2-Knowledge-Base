directive: "#PRAGMA EXPORTDEF"
type: preprocessor
category: Preprocessor Directives

minimum_version: "v47"

description: |
  Exports a symbol definition to child objects and subsequent compilations.
  The exported symbol acts like a -D command-line option for all child objects,
  allowing a top-level object to configure symbols that propagate to all
  dependencies without requiring command-line changes.
  A PNut-TS extension: the Spin2 v55 documentation, which specifies PNut's
  preprocessor, documents only the #DEFINE/#UNDEF/#IFDEF/#IFNDEF/#ELSEIFDEF/
  #ELSEIFNDEF/#ELSE/#ENDIF set and does not cover #PRAGMA. Source that must also
  build under PNut cannot rely on this directive.

syntax:
  basic: "#PRAGMA EXPORTDEF symbol"
  with_value: "#PRAGMA EXPORTDEF symbol value"

parameters:
  - name: "symbol"
    type: "identifier"
    description: "Name of the symbol to export (case-insensitive)"
  - name: "value"
    type: "optional"
    description: "Optional value to associate with the symbol"

behavior:
  - "Exported symbols are visible in all child objects (OBJ declarations)"
  - "Acts as if -D was specified for child object compilation"
  - "Symbol propagates to entire dependency tree"
  - "Command-line -U can prevent #PRAGMA EXPORTDEF from taking effect"
  - "Command-line -D takes precedence over #PRAGMA EXPORTDEF"

examples:
  - code: |
      ' Top-level object exports hardware revision
      #PRAGMA EXPORTDEF HARDWARE_REV 2

      OBJ
        sensor : "sensor_driver"
        display : "display_driver"

      ' Both sensor_driver and display_driver will have
      ' HARDWARE_REV defined with value 2
    description: "Export configuration to all child objects"

  - code: |
      ' Top-level configures debug mode for entire project
      #PRAGMA EXPORTDEF DEBUG_MODE

      OBJ
        serial : "serial_driver"
        storage : "sd_driver"

      ' All drivers will have DEBUG_MODE defined,
      ' enabling their debug code paths
    description: "Enable debug mode across all dependencies"

  - code: |
      ' Export multiple configuration symbols
      #PRAGMA EXPORTDEF TARGET_BOARD_V2
      #PRAGMA EXPORTDEF USE_FAST_CLOCK
      #PRAGMA EXPORTDEF BUFFER_SIZE 512

      OBJ
        core : "core_driver"
    description: "Multiple exported symbols"

  - code: |
      ' Conditional export based on local configuration
      #IFDEF BUILD_FOR_PRODUCTION
        #PRAGMA EXPORTDEF RELEASE_BUILD
      #ELSE
        #PRAGMA EXPORTDEF DEBUG_BUILD
      #ENDIF

      OBJ
        app : "application"
    description: "Conditional symbol export"

  - code: |
      ' In child object (sensor_driver.spin2):
      #IFDEF HARDWARE_REV
        ' Hardware revision was exported from parent
        #IF HARDWARE_REV == 2
          ' Rev 2 specific code
        #ELSEIF HARDWARE_REV == 1
          ' Rev 1 specific code
        #ENDIF
      #ELSE
        ' No revision specified - use defaults
      #ENDIF
    description: "Child object responding to exported symbol"

interaction_with_command_line:
  precedence:
    - priority: 1
      source: "Command-line -D"
      description: "Takes highest precedence, overrides all other definitions"
    - priority: 2
      source: "#PRAGMA EXPORTDEF"
      description: "Propagates to children unless overridden by -D"
    - priority: 3
      source: "#DEFINE in child"
      description: "Lowest precedence, can be overridden by exported symbols"
  blocking:
    description: "Command-line -U prevents #PRAGMA EXPORTDEF from taking effect"
    example: "pnut_ts -U HARDWARE_REV main.spin2  # Blocks HARDWARE_REV export"

common_patterns:
  - pattern: "project_wide_config"
    description: "Configure entire project from top-level object"
    code: |
      ' main.spin2 - top-level project file
      #PRAGMA EXPORTDEF CLOCK_SPEED 200000000
      #PRAGMA EXPORTDEF TARGET_BOARD P2EDGE

      OBJ
        driver1 : "driver1"
        driver2 : "driver2"
        lib1 : "library1"
      ' All objects share same clock and board configuration

  - pattern: "version_propagation"
    description: "Propagate version information to all components"
    code: |
      #PRAGMA EXPORTDEF SYSTEM_VERSION 100
      #PRAGMA EXPORTDEF BUILD_NUMBER 2847

      OBJ
        app : "application"

  - pattern: "feature_cascade"
    description: "Enable feature across all dependencies"
    code: |
      #IFDEF ENABLE_LOGGING
        #PRAGMA EXPORTDEF LOGGING_ENABLED
      #ENDIF

      OBJ
        module1 : "module1"    ' Has logging if ENABLE_LOGGING set
        module2 : "module2"    ' Has logging if ENABLE_LOGGING set

notes:
  - "A PNut-TS extension -- not part of the directive set PNut's own documentation (Spin2 v55) specifies"
  - "Exported symbols affect all child objects in OBJ section"
  - "Propagation is recursive - affects entire dependency tree"
  - "Command-line -D overrides #PRAGMA EXPORTDEF"
  - "Command-line -U blocks #PRAGMA EXPORTDEF"
  - "Useful for project-wide configuration from single location"
  - "Cannot export symbols that were defined with -U on command line"

related:
  - language/spin2/preprocessor/define.yaml
  - language/spin2/preprocessor/external-symbols.yaml
  - language/spin2/preprocessor/ifdef.yaml
  - language/spin2/preprocessor/preprocessor-overview.yaml
  - language/spin2/constructs/blocks.yaml

see_also:
  - "Project configuration"
  - "Object hierarchy"
  - "Build system integration"

oneliner: "Export symbol definition to child objects and dependencies (v47+)"
