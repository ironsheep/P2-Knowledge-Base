keyword: "DAT"
type: keyword
category: "Block Structure"
aliases:
  - class variables
  - DAT variables
  - shared object data
  - singleton state
  - static data

description: |
  Data section — contains initialized data declarations and inline PASM2 assembly.
  Data is stored in hub memory. Supports BYTE, WORD, LONG types, BYTEFIT/WORDFIT
  range-checked types, string literals, array repetition with [count], and
  inline type overrides for individual values.

instance_model: |
  Think of DAT variables as CLASS variables and VAR variables as INSTANCE variables.
  A DAT region exists once per compiled object image and every instance of that object
  reads and writes the same bytes; each instance gets its own VAR space. (Precisely:
  instances share DAT while their images are byte-identical — a CON override that
  changes the image bytes gives that instance its own DAT; see object-image-dedup.)
  Choose DAT for state every instance must share: a singleton hardware owner, one lock
  or one worker cog that serves all instances. Choose VAR for state that belongs to one
  instance: its configuration, and a mailbox or buffer shared only with the cog THAT
  instance started — in DAT, a second instance would silently overwrite the first's.
  A PASM image in DAT is the code each started cog loads; its hub copy is shared.

type_propagation: |
  In DAT blocks, the type specifier sets the LINE'S BASE TYPE for all
  comma-separated values. An inline type override (e.g., BYTE $56 within
  a LONG line) applies ONLY to the single value it precedes — subsequent
  values revert to the line's base type. This override does NOT stick.

syntax: |
  DAT
    label type value1, value2, ...

examples:
  - code: |
      DAT
        message BYTE "Hello World", 0
    description: "String data with null terminator"
  - code: |
      DAT
        myData    LONG    $1234, $5678, $9ABC          ' All three are LONGs
        mixed     LONG    $1234, BYTE $56, $9ABC       ' $1234=LONG, $56=BYTE, $9ABC=LONG (reverts!)
        allBytes  BYTE    1, WORD 1000, 2              ' 1=BYTE, 1000=WORD, 2=BYTE (reverts!)
    description: "Line base type with per-value inline overrides (overrides do NOT stick)"
  - code: |
      DAT
        zeros     BYTE    0[100]            ' 100 zero bytes
        pattern   WORD    $AAAA[50]         ' 50 copies of $AAAA
    description: "Array repetition using [count] syntax"

notes:
  - "Data type must be specified for each DAT line (no default)"
  - "Line base type persists across comma-separated values"
  - "Inline type overrides apply to single value only — line base type reasserts after"
  - "Supports BYTEFIT/WORDFIT for range-checked declarations"
  - "Can contain inline PASM2 assembly after ORG/ORGH directives"
  - "DAT is class state (shared by instances of one image); VAR is instance state — see instance_model"

