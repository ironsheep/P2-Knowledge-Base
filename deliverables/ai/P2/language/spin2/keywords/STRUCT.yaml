keyword: STRUCT
type: keyword
category: Data Types

requires_version: "Spin2_v45"
version_directive: "{Spin2_v45}"

description: |
  Defines composite data types containing multiple named members.
  Structures provide a way to organize related data into logical units with 
  convenient member access using dot notation.
  REQUIRES: {Spin2_v45} or later version directive at the start of the source file.

location: CON block (structure definition)

syntax:
  basic: "STRUCT structName(member1, member2, ...)"
  typed_members: "STRUCT structName(BYTE x, WORD y, LONG z)"
  array_members: "STRUCT structName(data[count])"
  nested: "STRUCT outer(inner innerMember)"
  alias: "STRUCT newName = existingStruct"
  export_import: "object.struct_t varName"

member_types:
  - type: "BYTE"
    size: "1 byte"
  - type: "WORD"
    size: "2 bytes"
  - type: "LONG (default)"
    size: "4 bytes"
  - type: "structName"
    size: "Size of that structure"
  - type: "type[n]"
    size: "n * element size"

examples:
  - code: |
      {Spin2_v45}
      CON
        STRUCT point(x, y)           ' x and y are LONGs (8 bytes total)
    description: "Basic structure with default LONG members"

  - code: |
      {Spin2_v45}
      CON
        STRUCT tinyPoint(BYTE x, BYTE y)     ' 2 bytes total
        STRUCT colorPoint(WORD x, WORD y, BYTE color)  ' 5 bytes total
    description: "Typed members with explicit BYTE, WORD, LONG"

  - code: |
      {Spin2_v45}
      CON
        STRUCT point(x, y)
        STRUCT line(point a, point b)        ' Contains two points (16 bytes)
        STRUCT triangle(point p1, point p2, point p3)
    description: "Nested structures"

  - code: |
      {Spin2_v45}
      CON
        STRUCT buffer(BYTE data[256])        ' 256-byte array member
        STRUCT matrix(WORD row[4], WORD col[4])
    description: "Array members within structures"

  - code: |
      {Spin2_v45}
      CON
        STRUCT point(x, y)
      
      VAR
        point myPoint                        ' Single instance
        point points[10]                     ' Array of structures
        ^point pPoint                        ' Pointer to structure
    description: "Declaring structure variables and pointers"

  - code: |
      {Spin2_v45}
      CON
        STRUCT point(x, y)
      
      PUB example() | point p1, point p2
        p1.x := 100                          ' Access via dot notation
        p1.y := 200
        p2 := p1                             ' Copy entire structure
        p1 := 50, 75                         ' Multi-value assignment
        p1 :=: p2                            ' Swap structures
    description: "Structure member access and operations"

  - code: |
      ' ===== Child Object: sensor.spin2 =====
      {Spin2_v45}
      CON
        STRUCT reading_t(LONG timestamp, LONG value, BYTE status)
        STRUCT config_t(WORD rate, BYTE flags, BYTE channel)
      
      VAR
        reading_t last_reading
      
      PUB get_reading() : reading_t result
        result := last_reading
    description: "V49+ structure export: Structures in CON blocks are automatically exported"

  - code: |
      ' ===== Parent Object: main.spin2 =====
      {Spin2_v45}
      OBJ
        sens : "sensor"
      
      VAR
        sens.reading_t  my_reading           ' Import structure from sensor object
        sens.config_t   my_config
      
      PUB main()
        my_reading := sens.get_reading()
        debug("Value: ", sdec(my_reading.value))
        debug("Status: ", uhex(my_reading.status))
    description: "V49+ structure import: Use object.struct_t syntax to access exported structures"

  - code: |
      {Spin2_v45}
      OBJ
        gfx : "graphics"
      
      VAR
        gfx.point_t   cursor_pos
        gfx.rect_t    window_bounds[10]      ' Array of imported structures
      
      PUB draw_at(gfx.point_t pos)           ' Imported struct as parameter type
        gfx.move_to(pos.x, pos.y)
    description: "V49+ imported structures in declarations, arrays, and method parameters"

operations:
  - operation: "Access member"
    syntax: "var.member"
    example: "p.x := 100"
  - operation: "Nested access"
    syntax: "var.nested.member"
    example: "line.a.x := 0"
  - operation: "Assignment"
    syntax: "a := b"
    description: "Copy entire structure"
  - operation: "Multi-value assign"
    syntax: "s := v1, v2, ..."
    description: "Assign multiple members at once"
  - operation: "Swap"
    syntax: "a :=: b"
    description: "Swap two structures"
  - operation: "Clear"
    syntax: "s~"
    description: "Zero all members"
  - operation: "Set all bits"
    syntax: "s~~"
    description: "Set all bits to 1"
  - operation: "Compare"
    syntax: "a == b / a <> b"
    description: "Test equality/inequality"
  - operation: "Size"
    syntax: "SIZEOF(structName)"
    description: "Get size in bytes"
  - operation: "Member offset"
    syntax: "OFFSETOF(structName.member)"
    description: "Get byte offset of member within structure (v53+)"

pointer_syntax:
  declaration: "^structName ptr"
  access: "ptr.member"
  dereference: "[ptr]"
  post_increment: "ptr[++].member"
  pre_increment: "[++]ptr.member"

export_import:
  description: |
    V49+ feature: Structures defined in CON blocks are automatically exported
    and can be imported by parent objects using object.struct_t notation.
  export_syntax: "STRUCT name_t(...)  ' In child object CON block - auto-exported"
  import_syntax: "object.struct_t varName  ' In parent object"
  valid_in:
    - "VAR block declarations"
    - "Local variable declarations (PUB/PRI)"
    - "Method parameter types"
    - "Method return types"
  minimum_version: "v49"
  notes:
    - "Child object must be compiled first"
    - "Structure definition is included in object file"
    - "Structure layout (size, alignment) is preserved exactly"
    - "No additional version directive needed beyond {Spin2_v45}"

gotchas:
  struct_pointer_obj_returns:
    description: |
      When a method in a child object returns a struct pointer (^structName)
      and the caller receives it through an OBJ reference, the compiler may
      interpret the return as the full structure rather than a single LONG
      pointer value. For structures exceeding 15 longs, this produces a
      compile error even though the return is only one LONG.
    rule: "When receiving ^structName from an object method, use bracket notation on the receiver"
    wrong: "pCfg := sensor.getConfig()          ' COMPILE ERROR for large structs"
    correct: "[pCfg] := sensor.getConfig()        ' OK: receives pointer value, not struct"
    scope: "Only across OBJ boundaries; within same object file this is not needed"
    example: |
      OBJ
          sensor : "sensor_driver"
      CON
          STRUCT sensorConfig(rate, gain, offset, calibration, filterTaps[16])
      PUB example() | ^sensorConfig pCfg
          [pCfg] := sensor.getConfig()        ' Bracket notation required
          debug("rate = ", sdec_(pCfg.rate))   ' Then access members normally

notes:
  - "REQUIRES {Spin2_v45} or later at start of source file"
  - "Members default to LONG if no type specified"
  - "Structures can be nested to any depth"
  - "Use SIZEOF() to get structure size in bytes"
  - "Structure pointers (^structName) also require {Spin2_v45}"
  - "Pass large structures by pointer for efficiency"
  - "Structures larger than 15 LONGs use BYTEMOVE internally for assignment"
  - "V49+: Structures defined in CON blocks are automatically exported to parent objects"
  - "V49+: Use object.struct_t syntax to reference structures from child objects"
  - "V49+: Imported structures can be used in VAR blocks, local variables, and method parameters"
  - "V49+: Structure layout (size, alignment) is preserved exactly when imported"
  - "Use [pVar] := obj.method() bracket notation when receiving struct pointers across OBJ boundaries"

related:
  - language/spin2/methods/sizeof.yaml
  - language/spin2/methods/offsetof.yaml
  - language/spin2/methods/byte.yaml
  - language/spin2/methods/word.yaml
  - language/spin2/methods/long.yaml
  - language/spin2/operators/typed-pointers.yaml
  - language/spin2/operators/op_swap.yaml

oneliner: "Define composite data types with named members (requires Spin2_v45)"
