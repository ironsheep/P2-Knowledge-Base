keyword: STRUCT
type: keyword
category: Data Types

requires_version: "Spin2_v45"
version_directive: "{Spin2_v45}"

description: |
  Defines composite data types containing multiple named members.
  Structures provide a way to organize related data into logical units with 
  convenient member access using dot notation.
  REQUIRES: {Spin2_v45} or later version directive at the start of the source file.

location: CON block (structure definition)

syntax:
  basic: "STRUCT structName(member1, member2, ...)"
  typed_members: "STRUCT structName(BYTE x, WORD y, LONG z)"
  array_members: "STRUCT structName(data[count])"
  nested: "STRUCT outer(inner innerMember)"
  alias: "STRUCT newName = existingStruct"
  export_import: "object.struct_t varName"
  named_bitfields: "STRUCT structName({BYTE|WORD|LONG} member{[count]}{.bitfield[bit_or_range]}...)  (v54+)"
  nameless_member: "STRUCT structName({BYTE|WORD|LONG}{.bitfield[bit_or_range]}...)  (v54+)"

member_types:
  - type: "BYTE"
    size: "1 byte"
  - type: "WORD"
    size: "2 bytes"
  - type: "LONG (default)"
    size: "4 bytes"
  - type: "structName"
    size: "Size of that structure"
  - type: "type[n]"
    size: "n * element size"

examples:
  - code: |
      {Spin2_v45}
      CON
        STRUCT point(x, y)           ' x and y are LONGs (8 bytes total)
    description: "Basic structure with default LONG members"

  - code: |
      {Spin2_v45}
      CON
        STRUCT tinyPoint(BYTE x, BYTE y)     ' 2 bytes total
        STRUCT colorPoint(WORD x, WORD y, BYTE color)  ' 5 bytes total
    description: "Typed members with explicit BYTE, WORD, LONG"

  - code: |
      {Spin2_v45}
      CON
        STRUCT point(x, y)
        STRUCT line(point a, point b)        ' Contains two points (16 bytes)
        STRUCT triangle(point p1, point p2, point p3)
    description: "Nested structures"

  - code: |
      {Spin2_v45}
      CON
        STRUCT buffer(BYTE data[256])        ' 256-byte array member
        STRUCT matrix(WORD row[4], WORD col[4])
    description: "Array members within structures"

  - code: |
      {Spin2_v45}
      CON
        STRUCT point(x, y)
      
      VAR
        point myPoint                        ' Single instance
        point points[10]                     ' Array of structures
        ^point pPoint                        ' Pointer to structure
    description: "Declaring structure variables and pointers"

  - code: |
      {Spin2_v45}
      CON
        STRUCT point(x, y)
      
      PUB example() | point p1, point p2
        p1.x := 100                          ' Access via dot notation
        p1.y := 200
        p2 := p1                             ' Copy entire structure
        p1 := 50, 75                         ' Multi-value assignment
        p1 :=: p2                            ' Swap structures
    description: "Structure member access and operations"

  - code: |
      ' ===== Child Object: sensor.spin2 =====
      {Spin2_v45}
      CON
        STRUCT reading_t(LONG timestamp, LONG value, BYTE status)
        STRUCT config_t(WORD rate, BYTE flags, BYTE channel)
      
      VAR
        reading_t last_reading
      
      PUB get_reading() : reading_t result
        result := last_reading
    description: "V49+ structure export: Structures in CON blocks are automatically exported"

  - code: |
      ' ===== Parent Object: main.spin2 =====
      {Spin2_v45}
      OBJ
        sens : "sensor"
      
      VAR
        sens.reading_t  my_reading           ' Import structure from sensor object
        sens.config_t   my_config
      
      PUB main()
        my_reading := sens.get_reading()
        debug("Value: ", sdec(my_reading.value))
        debug("Status: ", uhex(my_reading.status))
    description: "V49+ structure import: Use object.struct_t syntax to access exported structures"

  - code: |
      {Spin2_v45}
      OBJ
        gfx : "graphics"

      VAR
        gfx.point_t   cursor_pos
        gfx.rect_t    window_bounds[10]      ' Array of imported structures

      PUB draw_at(gfx.point_t pos)           ' Imported struct as parameter type
        gfx.move_to(pos.x, pos.y)
    description: "V49+ imported structures in declarations, arrays, and method parameters"

  - code: |
      {Spin2_v54}
      CON
        STRUCT pin_state_t(LONG flags.input[0].output[1].drive[3..2].value[31..24])

      VAR
        pin_state_t pin

      PUB demo()
        pin.flags.input  := 1              ' single-bit bitfield
        pin.flags.drive  := %10            ' 2-bit ranged bitfield
        pin.flags.value  := $FF            ' 8-bit ranged bitfield (bits 31..24)
        pin.flags := 0                     ' whole-member assignment still works
    description: "V54+ named bitfields on a LONG struct member (mixed single-bit and ranged)"

  - code: |
      {Spin2_v54}
      CON
        STRUCT io_t(LONG.ready[0].error[1].mode[3..2].counter[31..8])

      VAR
        io_t io

      PUB demo()
        io.ready   := 1                    ' direct bitfield access (nameless form)
        io.mode    := %10
        io.counter := 100_000
        IF io.error
          io := 0                          ' whole-struct assignment still works
    description: "V54+ nameless single LONG member — bitfields accessed directly via struct name"

operations:
  - operation: "Access member"
    syntax: "var.member"
    example: "p.x := 100"
  - operation: "Nested access"
    syntax: "var.nested.member"
    example: "line.a.x := 0"
  - operation: "Assignment"
    syntax: "a := b"
    description: "Copy entire structure"
  - operation: "Multi-value assign"
    syntax: "s := v1, v2, ..."
    description: "Assign multiple members at once"
  - operation: "Swap"
    syntax: "a :=: b"
    description: "Swap two structures"
  - operation: "Clear"
    syntax: "s~"
    description: "Zero all members"
  - operation: "Set all bits"
    syntax: "s~~"
    description: "Set all bits to 1"
  - operation: "Compare"
    syntax: "a == b / a <> b"
    description: "Test equality/inequality"
  - operation: "Size"
    syntax: "SIZEOF(structName)"
    description: "Get size in bytes"
  - operation: "Member offset"
    syntax: "OFFSETOF(structName.member)"
    description: "Get byte offset of member within structure (v53+)"
  - operation: "Bitfield access (named member)"
    syntax: "var.member.bitfield"
    description: "Read/write named bitfield on a BYTE/WORD/LONG member (v54+)"
  - operation: "Bitfield access (nameless member)"
    syntax: "var.bitfield"
    description: "Read/write named bitfield on the nameless backing member (v54+)"

pointer_syntax:
  declaration: "^structName ptr"
  access: "ptr.member"
  dereference: "[ptr]"
  post_increment: "ptr[++].member"
  pre_increment: "[++]ptr.member"

v54_enhancements:
  summary: "Named bitfields on BYTE/WORD/LONG struct members, plus nameless single-member struct form"
  enforcement: "Not enforced by PNut v54 — no level54_symbols table. {Spin2_v54} is recommended as declaration of intent."
  minimum_compiler: "v54"

  named_bitfields_on_members:
    description: |
      A STRUCT member of type BYTE, WORD, or LONG may carry one or more named
      bitfields. Each bitfield is introduced by a dot and specifies either a
      single bit or an inclusive bit range.
    syntax: "STRUCT struct_name({BYTE|WORD|LONG} member_name{[count]}{.bitfield_name[bit_or_range]}...)"
    access: "struct_var.member.bitfield"
    bitfield_forms:
      - form: "[N]"
        meaning: "Single-bit bitfield at bit N"
      - form: "[upper..lower]"
        meaning: "Multi-bit bitfield spanning upper..lower inclusive"
    member_type_boundaries:
      BYTE: "0..7"
      WORD: "0..15"
      LONG: "0..31"
    rules:
      - "Multiple bitfields may chain on one member: LONG flags.a[0].b[1].c[7..4]"
      - "A single member may mix single-bit and multi-bit bitfields"
      - "Bitfields may overlap (no disjointness check)"
      - "Bitfields can only be declared on BYTE/WORD/LONG members — not on STRUCT-typed members"
      - "Whole-member assignment (pin.flags := value) still works"
      - "Whole-struct assignment (pin := other_pin) still works"
    example: |
      {Spin2_v54}
      CON
        STRUCT pin_state_t(LONG flags.input[0].output[1].drive[3..2].value[31..24])

      VAR
        pin_state_t pin

      PUB demo() | snapshot
        pin.flags.input  := 1              ' set bit 0
        pin.flags.output := 0              ' clear bit 1
        pin.flags.drive  := %10            ' set bits 3..2
        pin.flags.value  := $FF            ' set bits 31..24

        IF pin.flags.input AND NOT pin.flags.output
          snapshot := pin.flags.value     ' read bits 31..24

        pin.flags := 0                    ' whole-member assignment still works

  nameless_single_member:
    description: |
      A STRUCT may be declared with exactly one unnamed BYTE, WORD, or LONG
      member as its sole content. The struct name itself refers to the
      backing value; bitfields are accessed directly via struct_var.bitfield.
    syntax: "STRUCT struct_name({BYTE|WORD|LONG}{.bitfield_name[bit_or_range]}...)"
    access: "struct_var.bitfield"
    constraints:
      - "Must be the first and only member"
      - "Type must be BYTE, WORD, or LONG — not STRUCT"
      - "No instance-count [N] is permitted on a nameless member"
      - "Bitfield chains are fully supported"
    sizeof_behavior: "SIZEOF(io_t) returns the size of the member type (1 for BYTE, 2 for WORD, 4 for LONG)"
    offsetof_behavior: "OFFSETOF(io_t.ready) returns 0 (nameless member occupies offset 0)"
    example: |
      {Spin2_v54}
      CON
        STRUCT io_t(LONG.ready[0].error[1].mode[3..2].counter[31..8])

      VAR
        io_t  io

      PUB demo()
        io.ready   := 1             ' direct bitfield access (no intermediate member name)
        io.mode    := %10
        io.counter := 100_000

        IF io.error
          io := 0                   ' whole-struct assignment

  contrast_named_vs_nameless:
    named: "STRUCT named_t(LONG flags.ready[0])         ' access:  named_var.flags.ready"
    nameless: "STRUCT nameless_t(LONG.ready[0])            ' access:  nameless_var.ready"

  bitfield_access_semantics: |
    Bitfield access is a setup_bfield-style access — it can be read, written,
    or used as the target of :=, ++, --, and compound-assign operators. Same
    semantics as plain variable bitfields in earlier Spin2 versions.

  interpreter_implementation:
    note: "V54 struct bitfields reuse the existing bitfield-setup code path used for plain variable bitfields — no new interpreter mechanism required."
    setup_paths_reused:
      - description: "Single-bit bitfield at bit N (0..31): same path as plain `var.[N]` bitfield access"
      - description: "Multi-bit bitfield: same path as plain `var.[upper..lower]` bitfield access"

  errors:
    - error: "Bitfields are only allowed for BYTE/WORD/LONG members"
      condition: ".bitfield[...] applied to a STRUCT-typed member"
    - error: "Bit number exceeds BYTE/WORD/LONG boundary"
      condition: "Single bit >= 8/16/32, or upper bit of range >= boundary"
    - error: "Lower bit number cannot exceed upper bit number"
      condition: "lower > upper in [upper..lower]"

  use_cases:
    - "Hardware register wrappers (memory-mapped control/status registers)"
    - "Packed status words with named bit positions"
    - "C-style bitfield types where only one backing value is needed"
    - "Protocol header fields decoded by bit-range"

export_import:
  description: |
    V49+ feature: Structures defined in CON blocks are automatically exported
    and can be imported by parent objects using object.struct_t notation.
  export_syntax: "STRUCT name_t(...)  ' In child object CON block - auto-exported"
  import_syntax: "object.struct_t varName  ' In parent object"
  valid_in:
    - "VAR block declarations"
    - "Local variable declarations (PUB/PRI)"
    - "Method parameter types"
    - "Method return types"
  minimum_version: "v49"
  notes:
    - "Child object must be compiled first"
    - "Structure definition is included in object file"
    - "Structure layout (size, alignment) is preserved exactly"
    - "No additional version directive needed beyond {Spin2_v45}"

gotchas:
  struct_pointer_obj_returns:
    description: |
      When a method in a child object returns a struct pointer (^structName)
      and the caller receives it through an OBJ reference, the compiler may
      interpret the return as the full structure rather than a single LONG
      pointer value. For structures exceeding 15 longs, this produces a
      compile error even though the return is only one LONG.
    rule: "When receiving ^structName from an object method, use bracket notation on the receiver"
    wrong: "pCfg := sensor.getConfig()          ' COMPILE ERROR for large structs"
    correct: "[pCfg] := sensor.getConfig()        ' OK: receives pointer value, not struct"
    scope: "Only across OBJ boundaries; within same object file this is not needed"
    example: |
      OBJ
          sensor : "sensor_driver"
      CON
          STRUCT sensorConfig(rate, gain, offset, calibration, filterTaps[16])
      PUB example() | ^sensorConfig pCfg
          [pCfg] := sensor.getConfig()        ' Bracket notation required
          debug("rate = ", sdec_(pCfg.rate))   ' Then access members normally

notes:
  - "REQUIRES {Spin2_v45} or later at start of source file"
  - "Members default to LONG if no type specified"
  - "Structures can be nested to any depth"
  - "Use SIZEOF() to get structure size in bytes"
  - "Structure pointers (^structName) also require {Spin2_v45}"
  - "Pass large structures by pointer for efficiency"
  - "Structures larger than 15 LONGs use BYTEMOVE internally for assignment"
  - "V49+: Structures defined in CON blocks are automatically exported to parent objects"
  - "V49+: Use object.struct_t syntax to reference structures from child objects"
  - "V49+: Imported structures can be used in VAR blocks, local variables, and method parameters"
  - "V49+: Structure layout (size, alignment) is preserved exactly when imported"
  - "Use [pVar] := obj.method() bracket notation when receiving struct pointers across OBJ boundaries"
  - "V54+: Named bitfields on BYTE/WORD/LONG members — see v54_enhancements section and concepts/struct-bitfields.yaml"
  - "V54+: Nameless single BYTE/WORD/LONG member form — struct_var.bitfield without intermediate member name"
  - "V54+: Bitfield syntax is NOT enforced by a version directive; {Spin2_v54} is recommended as declaration of intent"
  - "V54+: No new interpreter mechanism — reuses the existing variable-bitfield setup paths"

related:
  - language/spin2/methods/sizeof.yaml
  - language/spin2/methods/offsetof.yaml
  - language/spin2/methods/byte.yaml
  - language/spin2/methods/word.yaml
  - language/spin2/methods/long.yaml
  - language/spin2/operators/typed-pointers.yaml
  - language/spin2/operators/op_swap.yaml
  - language/spin2/operators/FIELD.yaml
  - language/spin2/concepts/struct-bitfields.yaml
  - language/spin2/keywords/BYTE.yaml
  - language/spin2/keywords/WORD.yaml
  - language/spin2/keywords/LONG.yaml

oneliner: "Define composite data types with named members (requires Spin2_v45)"
