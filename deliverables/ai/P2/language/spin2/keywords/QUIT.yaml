keyword: QUIT
type: keyword
category: Control Flow

description: |
  Exits a REPEAT loop immediately, continuing execution after the loop. An
  optional level parameter (1-15) exits an OUTER loop instead; level counts
  outward from the current loop (QUIT 1 = 1st-outer loop), and exiting an outer
  loop also escapes every loop nested inside it. Introduced in the v52 edition;
  the compiler does NOT enforce a version directive (verified by boundary probe
  — compiles at {Spin2_v41}/no-directive).

syntax:
  basic: "QUIT"
  with_level: "QUIT level"

parameters:
  - name: "level"
    type: "integer"
    range: "1-15"
    optional: true
    introduced_in: "v52"        # edition of introduction, NOT an enforced compiler gate
    enforced_version_gate: none  # verified: QUIT level compiles at {Spin2_v41}/no-directive (pnut-ts probe)
    description: "Which OUTER loop to exit, counting outward (1 = 1st-outer, 2 = 2nd-outer, ...); exiting it also escapes all loops nested inside. Bare QUIT exits the current loop."

examples:
  - code: |
      ' Basic QUIT - exit loop
      REPEAT
        IF error_condition
          QUIT                                 ' Exit the loop
        process_data()
      ' Execution continues here after QUIT
    description: "Exit loop with basic QUIT"
    
  - code: |
      ' Search with early exit
      REPEAT i FROM 0 TO array_size - 1
        IF array[i] == target
          found_index := i
          QUIT                                 ' Found it, stop searching
      ' found_index contains result (or unchanged if not found)
    description: "Early exit when condition met"
    
  - code: |
      ' QUIT with level parameter - no version directive needed; level counts OUTWARD
      REPEAT a FROM 1 TO 10                    ' outermost loop
        REPEAT b FROM 1 TO 10                  ' middle loop
          REPEAT c FROM 1 TO 10                ' innermost loop (current)
            IF found_it
              QUIT 2                           ' Exit the a loop (2nd-outer) -> escapes all three
            IF skip_rest_of_b
              QUIT 1                           ' Exit the b loop (1st-outer) -> escapes c and b
            IF skip_rest_of_c
              QUIT                             ' Exit c loop only (current)
    description: "Level parameter for nested loops (level counts outward; exiting an outer loop escapes its inner loops)"
    
  - code: |
      ' Exit multiple loops on error
      REPEAT outer FROM 0 TO max_outer
        REPEAT inner FROM 0 TO max_inner       ' current loop
          result := process(outer, inner)
          IF result < 0
            error_code := result
            QUIT 1                             ' Exit the outer loop (1st-outer) -> escapes both
      IF error_code < 0
        handle_error(error_code)
    description: "Exit all loops on error condition"
    
  - code: |
      ' Matrix search with multi-level exit
      REPEAT row FROM 0 TO rows - 1
        REPEAT col FROM 0 TO cols - 1           ' current loop
          IF matrix[row][col] == target
            found_row := row
            found_col := col
            QUIT 1                             ' Exit the row loop (1st-outer) -> escapes both
      ' found_row/found_col contain result
    description: "2D search with immediate exit on find"

notes:
  - "QUIT without parameter exits the current (innermost enclosing) loop"
  - "QUIT level exits the level-th OUTER loop; level counts outward (QUIT 1 = 1st-outer)"
  - "Exiting an outer loop also escapes every loop nested inside it (so QUIT 1 leaves the current loop AND the 1st-outer loop)"
  - "Bare QUIT is NOT the same as QUIT 1 (QUIT 1 targets the 1st-outer loop)"
  - "Valid range is 1-15; pnut-ts rejects level 16+ with 'NEXT/QUIT level must be from 1 to 15'"
  - "Error if level exceeds actual nesting depth ('NEXT/QUIT is not sufficiently nested')"
  - "Level feature introduced in the v52 edition; compiler does NOT enforce a version directive (compiles at {Spin2_v41})"
  - "All intermediate loop stack frames are properly cleaned up"

related:
  - NEXT
  - REPEAT

see_also:
  - "Loop control"
  - "Control flow"
  - "Early exit"

oneliner: "Exit loop immediately, optionally exiting multiple nesting levels (v52+)"
