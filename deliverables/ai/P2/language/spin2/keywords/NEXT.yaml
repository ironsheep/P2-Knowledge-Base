keyword: NEXT
type: keyword
category: Control Flow

description: |
  Continues execution at the next iteration of a REPEAT loop, skipping any
  remaining code in the current iteration. An optional level parameter (1-15)
  continues an OUTER loop instead; the level counts outward from the current
  loop (1 = 1st-outer loop). Introduced in the v52 edition; the compiler does
  NOT enforce a version directive (verified by boundary probe — compiles at
  {Spin2_v41}/no-directive).

syntax:
  basic: "NEXT"
  with_level: "NEXT level"

parameters:
  - name: "level"
    type: "integer"
    range: "1-15"
    optional: true
    introduced_in: "v52"        # edition of introduction, NOT an enforced compiler gate
    enforced_version_gate: none  # verified: NEXT level compiles at {Spin2_v41}/no-directive (pnut-ts probe)
    description: "Which OUTER loop to continue, counting outward (1 = 1st-outer loop, 2 = 2nd-outer, ...). Bare NEXT continues the current loop."

examples:
  - code: |
      ' Basic NEXT - skip to next iteration
      REPEAT i FROM 1 TO 10
        IF i == 5
          NEXT                                 ' Skip when i=5
        debug(udec(i))                         ' Prints 1,2,3,4,6,7,8,9,10
    description: "Skip iteration with basic NEXT"
    
  - code: |
      ' Skip even numbers
      REPEAT i FROM 1 TO 20
        IF (i & 1) == 0
          NEXT                                 ' Skip even numbers
        process_odd(i)
    description: "Filter using NEXT"
    
  - code: |
      ' NEXT level parameter - no version directive needed; level counts OUTWARD
      REPEAT a FROM 1 TO 10                    ' outermost loop
        REPEAT b FROM 1 TO 10                  ' middle loop
          REPEAT c FROM 1 TO 10                ' innermost loop (current)
            IF some_condition
              NEXT                             ' Continue c loop (current)
            IF other_condition
              NEXT 1                           ' Continue b loop (1st-outer)
            IF third_condition
              NEXT 2                           ' Continue a loop (2nd-outer)
    description: "Level parameter for nested loops (level counts outward from the current loop)"
    
  - code: |
      ' Skip outer loop iteration from inner loop
      REPEAT row FROM 0 TO 9                   ' Outer loop
        REPEAT col FROM 0 TO 9                 ' Inner loop (current)
          IF skip_row_condition(row, col)
            NEXT 1                             ' Skip to next row (1 = 1st-outer loop)
          process_cell(row, col)
    description: "Continue outer loop from inner loop"

notes:
  - "NEXT without parameter continues the current (innermost enclosing) loop"
  - "NEXT level continues the level-th OUTER loop; level counts outward (NEXT 1 = 1st-outer)"
  - "Bare NEXT is NOT the same as NEXT 1 (NEXT 1 targets the 1st-outer loop, not the current one)"
  - "Valid range is 1-15; pnut-ts rejects level 16+ with 'NEXT/QUIT level must be from 1 to 15'"
  - "Error if level exceeds actual nesting depth ('NEXT/QUIT is not sufficiently nested')"
  - "Level feature introduced in the v52 edition; compiler does NOT enforce a version directive (compiles at {Spin2_v41})"
  - "Stack frames for skipped loops are properly cleaned up"

related:
  - QUIT
  - REPEAT

see_also:
  - "Loop control"
  - "Control flow"
  - "Nested loops"

oneliner: "Continue to next loop iteration, optionally at specified nesting level (v52+)"
