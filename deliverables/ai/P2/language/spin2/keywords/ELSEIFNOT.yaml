keyword: "ELSEIFNOT"
type: keyword
category: "Control Flow"
description: |
  Additional conditional branch with negated condition.
  Must have the same indentation as the IF/IFNOT that begins the decision tree.
syntax: |
  ELSEIFNOT condition
    statements
examples:
  - |
    IF flag
      result := @"true case"
    ELSEIFNOT second
      result := @"false case"
