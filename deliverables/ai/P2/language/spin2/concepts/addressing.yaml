name: P2 Addressing Model
type: concept
category: Memory and Addressing

description: |
  The Propeller 2 has multiple memory spaces with different addressing requirements.
  Understanding when to use @, @@, ^@, and # is essential for correct code.
  
  KEY INSIGHT: In Spin2+PASM programs, @ returns RELATIVE addresses (offsets from
  object base). In PASM-only programs, @ returns ABSOLUTE addresses. This affects
  how you store and retrieve addresses in data tables.

memory_spaces:
  hub_ram:
    description: "512KB shared memory accessible by all cogs"
    address_range: "$00000-$7FFFF"
    size: "512KB"
    addressing: "20-bit BYTE addresses"
    address_unit: "bytes"
    access: "All cogs via RDLONG/WRLONG or Spin2 BYTE[]/WORD[]/LONG[]"
    
  cog_ram:
    description: "512 longs private to each cog"
    address_range: "$000-$1FF (0-511)"
    size: "512 longs (2KB)"
    addressing: "9-bit LONG addresses"
    address_unit: "longs (not bytes)"
    access: "Direct register access within cog, or REG[] from Spin2"
    
  lut_ram:
    description: "512 longs lookup table per cog"
    address_range: "$200-$3FF (512-1023)"
    size: "512 longs (2KB)"
    addressing: "9-bit LONG addresses"
    address_unit: "longs (not bytes)"
    access: "RDLUT/WRLUT instructions or via cog register window"

critical_distinction_byte_vs_long:
  description: |
    COG and LUT addresses are in LONGS, while HUB addresses are in BYTES.
    This is a common source of confusion.
  cog_lut:
    unit: "longs"
    example: "COG address $10 means the 16th long (register), not byte $10"
  hub:
    unit: "bytes"
    example: "HUB address $1000 means byte address $1000"

address_operators:
  at:
    symbol: "@"
    purpose: "Get hub address of variable/data/method"
    returns: "Hub memory address"
    context_behavior:
      spin2_pasm: "Returns RELATIVE address (offset from object base)"
      pasm_only: "Returns ABSOLUTE hub address"
    examples:
      - "@myvar - address of VAR variable"
      - "@mydata - address of DAT data"
      - "@mymethod - method pointer"
      
  double_at:
    symbol: "@@"
    purpose: "Convert relative offset to absolute address"
    returns: "Absolute hub address = object_base + offset"
    when_needed: "Reading @ values stored in DAT sections"
    formula: "@@x = hub_address_of_object + x"
    examples:
      - "@@string_table[i] - get absolute address from stored offset"
      
  caret_at:
    symbol: "^@"
    purpose: "Create field pointer with address AND bit info"
    returns: "Field pointer encoding address and bit range"
    use_with: "FIELD[] operator"
    examples:
      - "^@flags - field pointer to entire variable"
      - "^@status.[7..0] - field pointer to specific bits"
      
  hash:
    symbol: "#"
    purpose: "Get cog/LUT register address"
    returns: "Register address (0-511 for cog, 512-1023 for LUT)"
    context: "ORG-defined symbols and predefined registers"
    examples:
      - "#myvar - cog register address of ORG symbol"
      - "#PR0 - address $1D8"

program_types:
  spin2_pasm:
    description: |
      Programs with PUB/PRI methods and optional DAT/ORG assembly.
      Objects can be loaded at any hub location (relocatable).
    address_behavior:
      - "@ returns relative offsets in DAT sections"
      - "@@ converts stored offsets to absolute addresses"
      - "Hub-exec code must use relative addressing"
    compile_command: "Standard .spin2 file with PUB block"
    
  pasm_only:
    description: |
      Programs with only DAT block, no PUB/PRI methods.
      Assembled to specific memory locations.
    address_behavior:
      - "@ returns absolute addresses directly"
      - "@@ typically not needed"
      - "Can use absolute addressing in hub-exec code"
    compile_command: ".spin2 file with only DAT block"

common_patterns:
  string_table:
    description: "Store multiple strings with pointer table"
    code: |
      DAT
        str0    BYTE  "First", 0
        str1    BYTE  "Second", 0
        str2    BYTE  "Third", 0
        strings WORD  @str0, @str1, @str2   ' Relative offsets
        
      PUB getString(n) : addr
        addr := @@strings[n]               ' Convert to absolute
    notes:
      - "@ in DAT stores relative offset"
      - "@@ at runtime converts to usable address"
      - "WORD size assumes addresses < 64KB"
      
  launch_cog:
    description: "Start assembly code in new cog"
    code: |
      DAT
              ORG   0
      cogcode MOV   DIRA, #$FF
              ADD   OUTA, #1
              JMP   #cogcode
              
      PUB start()
        COGINIT(COGEXEC_NEW, @cogcode, 0)
    notes:
      - "@cogcode = hub address where code is stored"
      - "Code loads into cog at address 0"
      - "#cogcode in PASM = cog register address after loading"
      
  shared_data:
    description: "Pass data address to cog"
    code: |
      VAR
        LONG shared[16]
        
      PUB startCog()
        shared[0] := @shared           ' Store base address
        COGINIT(COGEXEC_NEW, @cogcode, @shared)
    notes:
      - "@ works correctly for runtime address passing"
      - "No @@ needed when @ is evaluated at runtime"
      
  register_access:
    description: "Access cog registers from Spin2"
    code: |
      DAT
              ORG   0
      myregs  RES   4                  ' Reserve 4 cog longs
      
      PUB writeReg(index, value)
        REG[#myregs + index] := value  ' Write to cog register
        
      PUB readReg(index) : value
        value := REG[#myregs + index]  ' Read from cog register
    notes:
      - "# returns cog register address"
      - "REG[] accesses cog memory from Spin2"

addressing_mode_comparison:
  hub_data_access:
    operator: "@"
    syntax: "LONG[@mydata]"
    use: "Reading/writing hub memory"
    
  cog_register_access:
    operator: "#"
    syntax: "REG[#myreg]"
    use: "Reading/writing cog registers"
    
  bitfield_access:
    operator: "^@"
    syntax: "FIELD[^@flags.[7..0]]"
    use: "Reading/writing specific bits"
    
  stored_pointer_access:
    operator: "@@"
    syntax: "@@pointer_table[i]"
    use: "Converting stored relative offsets"

address_alignment:
  description: |
    For optimal performance, data should be properly aligned in memory.
    Misaligned access works but may be slower.
  directives:
    ALIGNL:
      purpose: "Align next data to long (4-byte) boundary"
      use: "Before LONG data for optimal access"
    ALIGNW:
      purpose: "Align next data to word (2-byte) boundary"
      use: "Before WORD data for optimal access"
  example: |
    DAT
            ALIGNL                    ' Align to long boundary
    myLongs LONG    0, 0, 0, 0
    
            ALIGNW                    ' Align to word boundary
    myWords WORD    0, 0, 0, 0

org_vs_orgh_addressing:
  description: |
    The origin directive affects how addresses are interpreted in PASM2.
  ORG:
    context: "COG execution mode"
    addresses: "0-$1FF (cog register addresses)"
    behavior: "Code will be loaded into cog RAM and run from there"
    example: "JMP #label uses cog-relative address"
  ORGH:
    context: "HUB execution mode"
    addresses: "$400 and above (hub byte addresses)"
    behavior: "Code runs directly from hub RAM"
    example: "RDLONG val, ##@data uses hub addressing"
  example: |
    DAT
            ORG     0                       ' COG mode
    cogCode
            MOV     PA, #@hubData           ' Get hub address into PA
            JMP     #cogCode                ' COG-relative jump
    
            ORGH    $400                    ' HUB mode
    hubCode
            RDLONG  temp, ##@hubData        ' Hub addressing
    
    hubData LONG    $12345678

address_arithmetic:
  description: "Once you have an address, you can perform arithmetic on it."
  
  basic_operations:
    increment: "ptr += offset  ' Move pointer forward"
    decrement: "ptr -= offset  ' Move pointer backward"
    
  size_calculation:
    description: "Calculate data size using address subtraction"
    example: |
      DAT
      startData   BYTE    0[100]
      endData
      
      PUB GetSize() : size
        size := @endData - @startData   ' Returns 100
        
  type_aware_indexing:
    description: "Type specifiers automatically scale index by element size"
    example: |
      VAR
        LONG values[10]
        
      PUB Example() | ptr, val
        ptr := @values
        val := LONG[ptr][5]       ' Accesses values[5] (ptr + 5*4 = ptr + 20)
        val := LONG[ptr + 20]     ' Same result, manual calculation
    note: "BYTE index scales by 1, WORD by 2, LONG by 4"

troubleshooting:
  - problem: "Address from DAT table doesn't work"
    cause: "Using @ value directly without @@ conversion"
    solution: "Use @@table[i] instead of table[i]"
    
  - problem: "COGINIT fails to start code"
    cause: "Using # instead of @ for hub code address"
    solution: "Use @cog_code for hub address of code"
    
  - problem: "#symbol returns wrong value"
    cause: "Symbol not defined in ORG section"
    solution: "Ensure symbol is in DAT ORG block"
    
  - problem: "Cog can't find shared data"
    cause: "Address passed is relative, not absolute"
    solution: "@ in runtime code (PUB/PRI) is already absolute"
    
  - problem: "COG register access uses wrong offset"
    cause: "Treating COG addresses as byte addresses instead of long addresses"
    solution: "COG/LUT addresses are in LONGS. Address $10 is register 16, not byte 16."
    
  - problem: "Using @ with COG registers or bitfields"
    cause: "@ operator not allowed for COG registers or bitfield notation"
    solution: "Use ^@ operator instead to create field pointer"

notes:
  - "@ in code (PUB/PRI) evaluates to absolute address at runtime"
  - "@ in data (DAT) compiles to relative offset in Spin2+PASM"
  - "Always use @@ when reading stored @ values from DAT"
  - "# is for cog/LUT addresses, @ is for hub addresses"
  - "PASM-only programs have simpler addressing (all absolute)"

