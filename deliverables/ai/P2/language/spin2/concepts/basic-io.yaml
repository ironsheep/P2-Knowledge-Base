title: Spin2 Basic I/O - Digital Pin Control
id: spin2-basic-io
version: 1.0.0
category: spin2_concepts
layer: "Foundation - I/O Operations"
purpose: Essential knowledge for basic digital I/O before smart pin autonomous modes

summary: |
  Foundational digital I/O operations in Spin2. Covers single-pin and multi-pin control,
  direction management, drive strength configuration, and the critical distinction
  between pin configuration (electrical characteristics) and pin operation (read/write).

description: |
  P2 provides 64 Smart I/O pins (P0-P63) that can be controlled individually
  or in groups. Each pin can be configured for drive strength, then
  operated as simple digital I/O. This is distinct from smart pin modes, where the
  smart pin circuit performs an autonomous function on the pin.

core_concept_configuration_vs_operation:
  critical_distinction: |
    Pin electrical characteristics such as drive strength are configuration
    that persists while you perform normal I/O operations. These are not smart pin modes.
    
  configuration_layer:
    purpose: "Set electrical characteristics"
    methods:
      - "WRPIN() - Configure drive strength (see architecture/pin-drive-configuration.yaml)"
    persistence: "Settings remain active during basic I/O"
    
  operation_layer:
    purpose: "Read and write pin states"
    methods:
      - "PINHIGH/PINLOW - Set output state"
      - "PINREAD - Read pin state"
      - "PINFLOAT - High-impedance mode"
    behavior: "Normal digital I/O with configured electrical characteristics"

pin_architecture:
  source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, FEATURES (features summary), p.2; Special-purpose Registers (table), p.14; Smart I/O Pins, Direction and State (I/O Pin Registers table), p.21"
  pin_count: 64
  pin_range: "P0 to P63"
  pin_features: "64 Smart I/O pins, each with: ... Separate drive modes for high and low output: logic / 1.5 k / 15 k / 150 k / 1 mA / 100 µA / 10 µA / float"
  register_split:
    dira_outa_ina: "P0-P31"
    dirb_outb_inb: "P32-P63"
  per_pin_capabilities:
    direction: "DIR bit -- 0: input (float), 1: output (drive)"
    output_state: "OUT bit -- 0: low, 1: high; the corresponding DIR bit must be high to enable output"
    drive_modes: "Separate drive modes for high and low output: logic / 1.5 k / 15 k / 150 k / 1 mA / 100 µA / 10 µA / float. The eight rungs, their %HHH/%LLL encodings and their P_* constant names are defined once in architecture/pin-drive-configuration.yaml."
    input_modes: "Logic, Schmitt, pin-to-pin-comparator, and 8-bit-level-comparator input modes"
    power_grouping: "Externally powered in blocks of 4 for clean analog Vdd reference"
  no_milliamp_ladder: "Not documented: a drive rung beyond these eight, and a slew-rate setting. See architecture/pin-drive-configuration.yaml no_other_rungs."

control_registers:
  source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Special-purpose Registers, p.14; Smart I/O Pins, Direction and State (I/O Pin Registers), p.21; debug_overlap: the same datasheet, cog RAM register map (INA / INB also debug interrupt call and return addresses), p.13"
  addressing_note: "RAM registers $1F8 through $1FF give mapped access to eight special-purpose functions. In general, when specifying an address between $1F8 and $1FF, the PASM instruction accesses a special-purpose register."
  dira:
    address: "$1FA"
    purpose: "Output enable bits for P0..P31 (active high)"
  dirb:
    address: "$1FB"
    purpose: "Output enable bits for P32..P63 (active high)"
  outa:
    address: "$1FC"
    purpose: "Output state bits for P0..P31 (corresponding DIRA bit must be high to enable output)"
  outb:
    address: "$1FD"
    purpose: "Output state bits for P32..P63 (corresponding DIRB bit must be high to enable output)"
  ina:
    address: "$1FE"
    purpose: "Input state bits for P0..P31"
    read_only: true
  inb:
    address: "$1FF"
    purpose: "Input state bits for P32..P63"
    read_only: true
  debug_overlap: "Note that $1FE (INA) and $1FF (INB) are also the debug interrupt call address and return address, respectively."
  bit_to_pin_mapping: "Bit n of DIRA/OUTA/INA is pin Pn; bit n of DIRB/OUTB/INB is pin P(n+32)."
  spin2_access: "For Spin2 methods these registers are reachable by name (DIRA, DIRB, OUTA, OUTB, INA, INB); PINREAD/PINWRITE and the PIN* methods are the pin-indexed route to the same bits."

single_pin_operations:
  set_output_high:
    method: "PINHIGH"
    syntax: "PINHIGH(pin)"
    effect: "Sets DIR=1 and OUT=1"
    example: "PINHIGH(16)  ' Pin 16 outputs high"
    
  set_output_low:
    method: "PINLOW"
    syntax: "PINLOW(pin)"
    effect: "Sets DIR=1 and OUT=0"
    example: "PINLOW(16)  ' Pin 16 outputs low"
    
  toggle_output:
    method: "PINTOGGLE"
    syntax: "PINTOGGLE(pin)"
    effect: "Toggles OUT bit, maintains DIR=1"
    example: "PINTOGGLE(16)  ' Toggle pin 16"
    
  float_pin:
    method: "PINFLOAT"
    syntax: "PINFLOAT(pin)"
    effect: "Sets DIR=0 (high-impedance input)"
    example: "PINFLOAT(16)  ' Pin 16 floats"
    
  read_pin:
    method: "PINREAD"
    syntax: "PINREAD(pin)"
    returns: "1 if high, 0 if low (a single pin is LSB-justified and zero-extended)"
    example: |
      IF PINREAD(16)
        ' Pin is high
    
  write_pin:
    method: "PINWRITE"
    syntax: "PINWRITE(pin, state)"
    effect: "Sets DIR=1 and OUT=state"
    example: "PINWRITE(16, TRUE)  ' Drive high"

multi_pin_operations:
  concept: |
    Operate on multiple contiguous pins with a single method call using ADDPINS operator
    or direct register manipulation for non-contiguous pins.
    
  pin_field_methods:
    syntax: "METHOD(base_pin ADDPINS count)"
    example: |
      PINHIGH(8 ADDPINS 7)    ' Pins 8-15 output high
      PINLOW(0 ADDPINS 3)     ' Pins 0-3 output low
      PINFLOAT(16 ADDPINS 7)  ' Pins 16-23 float
      
  register_access:
    description: "Direct access to the DIRx, OUTx and INx registers"
    example: |
      DIRA := %11110000        ' P7-P4 outputs, P3-P0 inputs
      OUTA := %10100000        ' P7=1, P5=1, others=0
      value := INA             ' Read all P31-P0
      
  bit_manipulation:
    set_bits: "DIRA |= %11110000  ' Set P7-P4 as outputs"
    clear_bits: "DIRA &= !%11110000  ' Set P7-P4 as inputs"
    toggle_bits: "OUTA ^= %11110000  ' Toggle P7-P4"

pin_field_encoding:
  structure:
    format: "11-bit value encoding base pin and additional pins"
    bits_5_0: "Base pin number (0-63)"
    bits_10_6: "Additional pins count (0-31)"
    formula: "(additional_pins & $1F) << 6 | (base_pin & $3F)"

  addpins_operator:
    syntax: "base_pin ADDPINS count"
    example: "8 ADDPINS 7 = pins 8 through 15 (8 pins total)"
    meaning: "Start at base_pin, include count additional pins"
    encoding: "Compiler generates 11-bit pin field value"

  range_operator:
    syntax: "top_pin..bottom_pin"
    example: "15..8 = pins 8 through 15 (same pin field as 8 ADDPINS 7)"
    wrapping_note: "Wraps within the 32-pin block if top_pin < bottom_pin"

  wrapping_behavior:
    critical_rule: "Pin fields wrap within 32-pin blocks only"
    p0_p31_block: "Pins 0-31 wrap within themselves"
    p32_p63_block: "Pins 32-63 wrap within themselves"
    example_no_wrap: "8 ADDPINS 7 = pins 8-15 (no wrapping)"
    example_with_wrap: "28 ADDPINS 7 = pins 28-31, 0-3 (wraps at 31)"
    cross_block: "Cannot span from P31 to P32 - separate operations required"

internal_pull_resistors:
  source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Pin Mode Legend, p.24; FEATURES, p.2. THAT IS THE AUTHORITY HERE -- documentary, not empirical. EF-063 and EF-064 (real P2, 2026-08-20) corroborate that the mechanism behaves as described -- a 15 kOhm drive with DIR high holds a net, and anything stronger overpowers it -- but they establish it INCIDENTALLY, as the rig apparatus certifying other measurements: EF-063 is a streamer-fed DAC %TT finding and EF-064 a streamer pin-placement finding. Neither is a pull-up/drive-strength finding, and the ledger contains none. yes_you_can_pull_a_line_high_or_low (USB mode quote): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PIN MODES. the_dir_rule (Pin Mode Legend DIR quote): the same datasheet, Pin Mode Legend, p.24"
  yes_you_can_pull_a_line_high_or_low: |
    Yes -- the P2 can hold a line weakly high or weakly low, and the constants that
    do it are P_HIGH_15K and P_LOW_15K (the drive-mode list is below). In your circuit
    this behaves as a pull-up or pull-down behaves: it holds the net, and a stronger
    external driver overpowers it. The same vocabulary is used for these same
    ladder rungs -- USB mode is described as "two 15k pull-downs for 'host' or a
    1.5k pull-up and a float for 'device'".

    One thing differs from a dedicated pull-up: see the_dir_rule below. The drive
    applies only while the pin is an output, so dropping DIR removes it.
  how_the_p2_does_it: |
    The %M..M field holds C, I, O, HHH and LLL, with no pull-resistor selector
    among them. The high side and the low side each pick one rung of the same
    eight-rung ladder (logic / 1.5 k / 15 k / 150 k / 1 mA / 100 uA / 10 uA /
    float). A resistive rung driving to a rail gives the effect of a pull-up or
    pull-down, which is why the DIR rule applies.
  the_dir_rule: |
    A drive selection applies only while the pin drives: DIR is the direction
    bit, 0 for input (float) and 1 for output (drive). With DIR low, the pin is
    a plain high-impedance input and the selected drive is inactive.
  ladder_definition_home: architecture/pin-drive-configuration.yaml
  pull_a_line_high:
    intent: "hold a line high weakly, so a stronger external drive can overpower it"
    mode_word: "P_HIGH_15K"
    required_pin_state: "DIR = 1, OUT = 1"
    example: |
      pinclear(16)                 ' clear any previous smart-pin configuration
      wrpin(16, P_HIGH_15K)        ' high side drives through 15 kOhm
      pinhigh(16)                  ' DIR = 1, OUT = 1; pinfloat() here floats the pin
      waitms(1)                    ' settle: a weak drive into pin and wire capacitance
      level := pinread(16)         ' reads 1 unless something stronger holds the line low
  pull_a_line_low:
    intent: "hold a line low weakly, so a stronger external drive can overpower it"
    mode_word: "P_LOW_15K"
    required_pin_state: "DIR = 1, OUT = 0"
    example: |
      pinclear(16)
      wrpin(16, P_LOW_15K)         ' low side drives through 15 kOhm
      pinlow(16)                   ' DIR = 1, OUT = 0
      waitms(1)
      level := pinread(16)         ' reads 0 unless something stronger holds the line high

smart_pin_to_basic_io_transition:
  clearing_smart_pin:
    method: "PINCLEAR"
    syntax: "PINCLEAR(pin)"
    effect: "Sets DIR=0 and WRPIN=0, returns to basic I/O"
    example: |
      PINCLEAR(16)        ' Disable smart pin
      PINHIGH(16)         ' Now use as normal I/O
      
  safe_reconfiguration:
    using_pinclear: |
      PINCLEAR(16)                    ' Clear all config
      PINSTART(16, mode, x, y)        ' Set new mode
      
    manual_sequence: |
      PINFLOAT(16)                    ' DIR=0
      WRPIN(16, mode)                 ' Configure mode
      WXPIN(16, x)                    ' Set X parameter
      WYPIN(16, y)                    ' Set Y parameter
      PINHIGH(16)                     ' Enable (DIR=1)
    y_order_note: "In the pulse, transition and asynchronous serial transmit modes, write Y with WYPIN after raising DIR: a WYPIN issued before DIR rises does not take effect. See architecture/smart_pins.yaml reset_before_configure."
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PINS ('A smart pin should be configured while its DIR bit is low, holding it in reset'); P2 hardware verification, EF-011 (a WYPIN before DIR rises does not take effect in the pulse, transition and asynchronous serial transmit modes)"

out_and_dir_order:
  source: "Parallax Propeller 2 Spin2 Language Documentation v55, pin methods (PINHIGH, PINLOW: drive PinField pin(s) high or low); Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Smart I/O Pins, Direction and State (I/O Pin Registers table, OUTA/OUTB: corresponding DIR bit must be high to enable output), p.21"
  methods:
    fact: "PINHIGH and PINLOW drive a pin high or low: one call sets DIR and OUT. Not documented: any ordering of the DIR and OUT changes inside the method."
    example: |
      PINHIGH(16)  ' DIR = 1, OUT = 1

  registers:
    fact: "The OUT bit can be written while DIR is low; the pin drives the OUT value once DIR is high"
    example: |
      OUTA &= !(1 << 16) ' OUT = 0 while DIR is low
      DIRA |= (1 << 16)  ' DIR = 1, the pin drives low

common_patterns:
  led_blink:
    code: |
      CON
        LED_PIN = 16
        
      PUB main()
        REPEAT
          PINHIGH(LED_PIN)
          WAITMS(500)
          PINLOW(LED_PIN)
          WAITMS(500)
          
  button_read:
    code: |
      CON
        BUTTON_PIN = 0
        
      PUB main()
        ' Hold the button pin weakly high; the button shorts it to ground
        PINCLEAR(BUTTON_PIN)              ' clear any previous smart-pin configuration
        WRPIN(BUTTON_PIN, P_HIGH_15K)     ' Drive high 15kOhm
        PINHIGH(BUTTON_PIN)               ' DIR=1, OUT=1 - a drive is live only while DIR is high
        
        REPEAT
          IF NOT PINREAD(BUTTON_PIN)  ' Active low: a press pulls the pin to ground
            buttonPressed()
            
  parallel_bus_write:
    code: |
      PUB writeBus(value) | mask
        ' Write byte to 8-bit bus (pins 16-23)
        mask := $FF << 16
        DIRA |= mask              ' Set as outputs
        OUTA := (OUTA & !mask) | ((value & $FF) << 16)
        
  parallel_bus_read:
    code: |
      PUB readBus() : result | mask
        ' Read byte from 8-bit bus (pins 16-23)
        mask := $FF << 16
        DIRA &= !mask             ' Set as inputs
        result := (INA >> 16) & $FF

method_and_register_access:
  source: "Parallax Propeller 2 Spin2 Language Documentation v55, pin methods (PinField arguments) and Pinfields"
  methods: "PINHIGH, PINLOW, PINTOGGLE, PINFLOAT, PINREAD, PINWRITE, PINSTART and PINCLEAR take a pinfield: a base pin number plus additional pins."
  direct_registers: "DIRA, DIRB, OUTA, OUTB, INA and INB take arbitrary 32-bit patterns."
  timing: "Not documented: the execution time of a pin method compared with a register write."

application_examples:
  seven_segment_display:
    code: |
      CON
        SEG_BASE = 16  ' Pins 16-23 = segments
        
      PUB showDigit(digit)
        ' Look up segment pattern
        OUTA := (OUTA & $FF00FFFF) | (lookupSegments(digit) << 16)
        DIRA |= $00FF0000  ' Enable outputs
        
  matrix_keypad:
    code: |
      CON
        ROW_BASE = 0    ' Rows on P0-P3
        COL_BASE = 4    ' Columns on P4-P7
        
      PUB scanKeypad() : key | row, col
        ' Hold the columns weakly high; a pressed key ties one to the row driven low
        PINCLEAR(COL_BASE ADDPINS 3)
        WRPIN(COL_BASE ADDPINS 3, P_HIGH_15K)  ' Drive high 15kOhm
        PINHIGH(COL_BASE ADDPINS 3)            ' DIR=1, OUT=1 - a drive is live only while DIR is high
        
        REPEAT row FROM 0 TO 3
          PINLOW(ROW_BASE + row)      ' Drive row low
          col := (INA >> COL_BASE) & $0F
          PINFLOAT(ROW_BASE + row)    ' Release row
          IF col <> $0F               ' Key pressed?
            RETURN decodeKey(row, col)
            
  ws2812: "WAITUS waits a number of microseconds. The OBEX object 2857 is a driver for single-wire smart pixels (e.g., WS2812b); the WS2811/WS2812/WS2812B/WS2813/SK6812X NeoPixel object YAML file is at community/quick-bytes/ws2811-ws2812-ws2812b-ws2813-sk6812x-neopixel-object.yaml. OBEX object 2852 drives the APA102C two-wire smart pixel."
  source: "ws2812: Parallax Propeller 2 Spin2 Language Documentation v55, WAITUS(Microseconds); OBEX objects 2857 and 2852, descriptions"

multi_cog_pin_coordination:
  source: "Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, COGS (PROCESSORS) (each cog contains an I/O Output Register and an I/O Direction Register), p.14; HUB (common shared resources such as I/O pins are simultaneously accessible by every cog), p.24. Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Cog RAM and Special-purpose Registers, pp.13-14. Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PINS (each smart pin OR's all incoming 34-bit buses from the cogs 'in the same way DIR and OUT bits are OR'd before going to the pins'; the different-times rule and RQPIN) and LOCKS. P2 hardware verification, EF-114 (one board, P0 with no smart pin mode, cog 0 and one worker cog: cog 0 DIR 1 OUT 0 with the worker DIR 0 OUT 1 reads 0, and cog 0 DIR 0 OUT 1 with the worker DIR 1 OUT 0 reads 0). P2 hardware verification, EF-105 (one board, plain pin at P_LOW_15K, cog 0 DIR 1 OUT 0 and a worker cog DIR 1 OUT 1 reads 1)"
  architecture:
    per_cog_registers: "Each cog has its own DIR and OUT registers, at cog register addresses $1FA-$1FD; INA and INB are at $1FE-$1FF"
    shared_access: "Each cog has access to all 64 I/O pins"

  locks:
    fact: "Locks can be used by cogs to coordinate exclusive access of a shared resource. What a lock represents is up to the application using it, and all participant cogs must agree on a lock's number and its purpose."

  cog_outputs_on_one_pin:
    consequence: "On a pin with no smart pin mode, a cog's OUT bit reaches the pin only through that cog's own DIR bit: with one cog at DIR high, OUT low and another at DIR low, OUT high, the pin reads low, whichever cog is which. With two cogs both at DIR high and different OUT bits on a pin whose low side drives through 15 kOhm and whose high side is fast, the pin reads high. Parallax's documents also give: DIR and OUT bits from all cogs are OR'd before going to the pins. Not documented: the level when two cogs both hold DIR high with different OUT bits at any other drive setting."
    hardware_note: "Each smart pin OR's the 34-bit buses from all cogs. Cogs that execute WRPIN, WXPIN, WYPIN, RDPIN or AKPIN on the same smart pin must do so at different times; any number of cogs can read a smart pin simultaneously with RQPIN, without bus conflict"

  safe_operations:
    reading: "I/O pins are simultaneously accessible by every cog; each cog reads them through its INA and INB registers"
    smart_pins: "Any number of cogs can read a smart pin simultaneously with RQPIN, without bus conflict"

anti_patterns:
  - anti_pattern: "missing_output_enable"
    severity: "no_output"
    description: "Smart pin mode without P_OE produces no output"
    wrong: |
      ' No output - missing P_OE!
      WRPIN(PWM_PIN, P_PWM_TRIANGLE)
      PINSTART(PWM_PIN, P_PWM_TRIANGLE, period, duty)  ' Still no output!
    correct: |
      ' Include P_OE for output
      WRPIN(PWM_PIN, P_PWM_TRIANGLE | P_OE)
      PINSTART(PWM_PIN, P_PWM_TRIANGLE | P_OE, period, duty)

  - anti_pattern: "smart_pin_not_cleared"
    severity: "keeps_running"
    description: "A started smart pin continues while its DIR bit is high; PINCLEAR stops it"
    wrong: |
      PINSTART(ADC_PIN, P_ADC, 0, 0)
      value := RDPIN(ADC_PIN)
      ' the ADC keeps running while DIR is high
    correct: |
      PINSTART(ADC_PIN, P_ADC, 0, 0)
      value := RDPIN(ADC_PIN)
      PINCLEAR(ADC_PIN)            ' Stop smart pin
      PINFLOAT(ADC_PIN)            ' Return to input mode
    source: "Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, Shutdown (Smart I/O continues while its associated DIR bit is high), p.12; Parallax Propeller 2 Spin2 Language Documentation v55, PINCLEAR (DIR=0, then WRPIN=0)"

  - anti_pattern: "rdpin_without_data_ready_check"
    severity: "wrong_value"
    description: "RDPIN returns immediately with the pin's current result Z and acknowledges the pin; it never waits. With no new data it returns the previous value"
    wrong: |
      value := RDPIN(SERIAL_RX)    ' returns at once - the last byte again if nothing new arrived
    correct: |
      ' The smart pin raises its IN flag when new data is ready; PINREAD sees it
      IF PINREAD(SERIAL_RX)
        value := RDPIN(SERIAL_RX)

  - anti_pattern: "parameter_order_confusion"
    severity: "wrong_configuration"
    description: "The Spin2 methods take the pin FIRST; the PASM2 instruction takes the value first"
    wrong: |
      ' WRONG in Spin2: mode and pin swapped (PASM2 operand order)
      WRPIN(P_ASYNC_TX | P_OE, TX_PIN)
    correct: |
      ' Spin2: WRPIN(PinField, Data), PINSTART(PinField, Mode, Xval, Yval)
      WRPIN(TX_PIN, P_ASYNC_TX | P_OE)
      PINSTART(TX_PIN, P_ASYNC_TX | P_OE, x_val, 0)   ' serial: WYPIN data AFTER
      ' PASM2: wrpin mode, pin  (D = value, S = pin)

  - anti_pattern: "rqpin_without_ack"
    severity: "data_stale"
    description: "RQPIN reads without acknowledge - data may be stale"
    wrong: |
      ' Using RQPIN repeatedly without RDPIN or AKPIN
      REPEAT
        value := RQPIN(ADC_PIN)    ' May read same old value!
    correct: |
      ' Use RDPIN to read and acknowledge
      value := RDPIN(ADC_PIN)      ' Reads and acknowledges

      ' Or read quietly with RQPIN and acknowledge separately with AKPIN
      if PINREAD(ADC_PIN)          ' Data ready?
        value := RQPIN(ADC_PIN)    ' Read without acknowledging
        AKPIN(ADC_PIN)             ' Acknowledge to get fresh data next time

