title: Spin2 Basic I/O - Digital Pin Control
id: spin2-basic-io
version: 1.0.0
category: spin2_concepts
layer: "Foundation - I/O Operations"
purpose: Essential knowledge for basic digital I/O before smart pin autonomous modes

summary: |
  Foundational digital I/O operations in Spin2. Covers single-pin and multi-pin control,
  direction management, drive strength configuration, and the critical distinction
  between pin configuration (electrical characteristics) and pin operation (read/write).

description: |
  P2 provides 64 general-purpose I/O pins (P0-P63) that can be controlled individually
  or in groups. Each pin can be configured for drive strength, then
  operated as simple digital I/O. This is distinct from autonomous smart pin modes where
  the pin operates independently.

core_concept_configuration_vs_operation:
  critical_distinction: |
    Pin electrical characteristics such as drive strength are CONFIGURATION
    that persists while you perform normal I/O operations. These are not autonomous modes.
    
  configuration_layer:
    purpose: "Set electrical characteristics"
    methods:
      - "WRPIN() - Configure drive strength (see architecture/pin-drive-configuration.yaml)"
    persistence: "Settings remain active during basic I/O"
    
  operation_layer:
    purpose: "Read and write pin states"
    methods:
      - "PINHIGH/PINLOW - Set output state"
      - "PINREAD - Read pin state"
      - "PINFLOAT - High-impedance mode"
    behavior: "Normal digital I/O with configured electrical characteristics"

pin_architecture:
  source: "P2 Datasheet 2022/11/01 -- features summary p.2 :107,:117; Special-Purpose Registers table p.13 :579-586; I/O Pin Registers table p.21 :981-986 -- engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt. The register table appears identically on the reconstructed path, engineering/ingestion/sources/p2-datasheet/complete-tables-reference.md:157-164."
  pin_count: 64
  pin_range: "P0 to P63"
  datasheet_statement: "64 Smart I/O pins, each with: ... Separate drive modes for high and low output: logic / 1.5 k / 15 k / 150 k / 1 mA / 100 µA / 10 µA / float"
  register_split:
    dira_outa_ina: "P0-P31"
    dirb_outb_inb: "P32-P63"
  per_pin_capabilities:
    direction: "DIR bit -- 0: input (float), 1: output (drive)"
    output_state: "OUT bit -- 0: low, 1: high; the corresponding DIR bit must be high to enable output"
    drive_modes: "Separate drive modes for high and low output: logic / 1.5 k / 15 k / 150 k / 1 mA / 100 µA / 10 µA / float. The eight rungs, their %HHH/%LLL encodings and their P_* constant names are defined once in architecture/pin-drive-configuration.yaml."
    input_modes: "Logic, Schmitt, pin-to-pin-comparator, and 8-bit-level-comparator input modes"
    power_grouping: "Externally powered in blocks of 4 for clean analog Vdd reference"
  no_milliamp_ladder: "The datasheet's drive list is the whole list. No per-pin milliamp drive ladder and no programmable slew rate exists; see architecture/pin-drive-configuration.yaml no_other_rungs."

control_registers:
  source: "P2 Datasheet 2022/11/01 -- Special-Purpose Registers p.13 :579-586 and I/O Pin Registers p.21 :981-986 -- engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt; the same table on the reconstructed path at engineering/ingestion/sources/p2-datasheet/complete-tables-reference.md:157-164"
  addressing_note: "RAM registers $1F8 through $1FF give mapped access to eight special-purpose functions. In general, when specifying an address between $1F8 and $1FF, the PASM instruction accesses a special-purpose register."
  dira:
    address: "$1FA"
    purpose: "Output enable bits for P0..P31 (active high)"
  dirb:
    address: "$1FB"
    purpose: "Output enable bits for P32..P63 (active high)"
  outa:
    address: "$1FC"
    purpose: "Output state bits for P0..P31 (corresponding DIRA bit must be high to enable output)"
  outb:
    address: "$1FD"
    purpose: "Output state bits for P32..P63 (corresponding DIRB bit must be high to enable output)"
  ina:
    address: "$1FE"
    purpose: "Input state bits for P0..P31"
    read_only: true
  inb:
    address: "$1FF"
    purpose: "Input state bits for P32..P63"
    read_only: true
  debug_overlap: "Note that $1FE (INA) and $1FF (INB) are also the debug interrupt call address and return address, respectively. -- engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:542"
  bit_to_pin_mapping: "Bit n of DIRA/OUTA/INA is pin Pn; bit n of DIRB/OUTB/INB is pin P(n+32)."
  spin2_access: "For Spin2 methods these registers are reachable by name (DIRA, DIRB, OUTA, OUTB, INA, INB); PINREAD/PINWRITE and the PIN* methods are the pin-indexed route to the same bits."

single_pin_operations:
  set_output_high:
    method: "PINHIGH"
    syntax: "PINHIGH(pin)"
    effect: "Sets DIR=1 and OUT=1"
    example: "PINHIGH(16)  ' Pin 16 outputs high"
    
  set_output_low:
    method: "PINLOW"
    syntax: "PINLOW(pin)"
    effect: "Sets DIR=1 and OUT=0"
    example: "PINLOW(16)  ' Pin 16 outputs low"
    
  toggle_output:
    method: "PINTOGGLE"
    syntax: "PINTOGGLE(pin)"
    effect: "Toggles OUT bit, maintains DIR=1"
    example: "PINTOGGLE(16)  ' Toggle pin 16"
    
  float_pin:
    method: "PINFLOAT"
    syntax: "PINFLOAT(pin)"
    effect: "Sets DIR=0 (high-impedance input)"
    example: "PINFLOAT(16)  ' Pin 16 floats"
    
  read_pin:
    method: "PINREAD"
    syntax: "PINREAD(pin)"
    returns: "TRUE (-1) if high, FALSE (0) if low"
    example: |
      IF PINREAD(16)
        ' Pin is high
    
  write_pin:
    method: "PINWRITE"
    syntax: "PINWRITE(pin, state)"
    effect: "Sets DIR=1 and OUT=state"
    example: "PINWRITE(16, TRUE)  ' Drive high"

multi_pin_operations:
  concept: |
    Operate on multiple contiguous pins with a single method call using ADDPINS operator
    or direct register manipulation for non-contiguous pins.
    
  pin_field_methods:
    syntax: "METHOD(base_pin ADDPINS count)"
    example: |
      PINHIGH(8 ADDPINS 7)    ' Pins 8-15 output high
      PINLOW(0 ADDPINS 3)     ' Pins 0-3 output low
      PINFLOAT(16 ADDPINS 7)  ' Pins 16-23 float
      
  register_access:
    description: "Direct register manipulation for advanced control"
    example: |
      DIRA := %11110000        ' P7-P4 outputs, P3-P0 inputs
      OUTA := %10100000        ' P7=1, P5=1, others=0
      value := INA             ' Read all P31-P0
      
  bit_manipulation:
    set_bits: "DIRA |= %11110000  ' Set P7-P4 as outputs"
    clear_bits: "DIRA &= !%11110000  ' Set P7-P4 as inputs"
    toggle_bits: "OUTA ^= %11110000  ' Toggle P7-P4"

pin_field_encoding:
  structure:
    format: "11-bit value encoding base pin and additional pins"
    bits_5_0: "Base pin number (0-63)"
    bits_10_6: "Additional pins count (0-31)"
    formula: "(additional_pins & $1F) << 6 | (base_pin & $3F)"

  addpins_operator:
    syntax: "base_pin ADDPINS count"
    example: "8 ADDPINS 7 = pins 8 through 15 (8 pins total)"
    meaning: "Start at base_pin, include count additional pins"
    encoding: "Compiler generates 11-bit pin field value"

  range_operator:
    syntax: "bottom_pin..top_pin"
    example: "8..15 = pins 8 through 15"
    wrapping_note: "Wraps if top_pin < bottom_pin"
    use_case: "Primarily for constants and readability"

  wrapping_behavior:
    critical_rule: "Pin fields wrap WITHIN 32-pin blocks only"
    p0_p31_block: "Pins 0-31 wrap within themselves"
    p32_p63_block: "Pins 32-63 wrap within themselves"
    example_no_wrap: "8 ADDPINS 7 = pins 8-15 (no wrapping)"
    example_with_wrap: "28 ADDPINS 7 = pins 28-31, 0-3 (wraps at 31)"
    cross_block: "Cannot span from P31 to P32 - separate operations required"

internal_pull_resistors:
  source: "P2 Datasheet 2022/11/01 p.24 Pin Mode Legend -- engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:1131-1147, :117; hardware-verified idioms EF-063 and EF-064 -- engineering/ingestion/external-sources/hardware-verification/P2-EMPIRICAL-FINDINGS.md:827,840"
  there_is_no_bias_resistor_selector: |
    The P2 has no internal pull-up/pull-down resistor network. The Pin Mode Legend
    enumerates the whole %M..M field -- C, I, O, HHH, LLL -- and there is no
    bias-resistor selector among them. What the P2 offers instead is a per-side
    DRIVE STRENGTH: the high side and the low side each pick one rung of the same
    eight-rung ladder (logic / 1.5 k / 15 k / 150 k / 1 mA / 100 µA / 10 µA / float).
  the_dir_rule: |
    A drive selection is a property of DRIVING, so it is live only while the pin
    drives. Configuring a weak drive and then dropping DIR gives a plain
    high-impedance input with the selection INACTIVE. This was measured on real
    silicon (EF-063, EF-064, 2026-08-20); it is the reason the older form of this
    block -- weak drive followed by a float -- does not work.
  ladder_definition_home: architecture/pin-drive-configuration.yaml
  substitute_for_a_pull_up:
    intent: "hold a line high weakly, so a stronger external drive can overpower it"
    mode_word: "P_HIGH_15K"
    required_pin_state: "DIR = 1, OUT = 1"
    example: |
      pinclear(16)                 ' clear any previous smart-pin configuration
      wrpin(16, P_HIGH_15K)        ' high side drives through 15 kOhm
      pinhigh(16)                  ' DIR = 1, OUT = 1 -- REQUIRED; pinfloat() here floats the pin
      waitms(1)                    ' settle: a weak drive into pin and wire capacitance
      level := pinread(16)         ' reads 1 unless something stronger holds the line low
  substitute_for_a_pull_down:
    intent: "hold a line low weakly, so an undriven pin reads 0 for a stated reason"
    mode_word: "P_LOW_15K"
    required_pin_state: "DIR = 1, OUT = 0"
    example: |
      pinclear(16)
      wrpin(16, P_LOW_15K)         ' low side drives through 15 kOhm
      pinlow(16)                   ' DIR = 1, OUT = 0 -- REQUIRED
      waitms(1)
      level := pinread(16)         ' reads 0 unless something stronger holds the line high
  corrected_2026_08_25: |
    The pre-purge form of this block showed PINSTART(16, P_HIGH_15K, 0, 0) followed by
    PINFLOAT(16) as 'input with pull-up', and named the P_HIGH_*/P_LOW_* constants as
    pull-up / pull-down modes. Both are wrong: PINFLOAT drops DIR, which deactivates
    the drive, and the constants are drive-strength selectors, not bias resistors.
    Returned in the hardware-verified form instead.
  use_cases:
    - "Button inputs without external resistors -- weak high drive, DIR high, button pulls to ground"
    - "Holding an unused or undriven line at a known level for a stated reason"
    - "Weak side of a bidirectional line, so an external driver can overpower it"

smart_pin_to_basic_io_transition:
  clearing_smart_pin:
    method: "PINCLEAR"
    syntax: "PINCLEAR(pin)"
    effect: "Sets DIR=0 and WRPIN=0, returns to basic I/O"
    example: |
      PINCLEAR(16)        ' Disable smart pin
      PINHIGH(16)         ' Now use as normal I/O
      
  safe_reconfiguration:
    using_pinclear: |
      PINCLEAR(16)                    ' Clear all config
      PINSTART(16, mode, x, y)        ' Set new mode
      
    manual_sequence: |
      PINFLOAT(16)                    ' DIR=0 (REQUIRED)
      WRPIN(16, mode)                 ' Configure mode
      WXPIN(16, x)                    ' Set X parameter
      WYPIN(16, y)                    ' Set Y parameter
      PINHIGH(16)                     ' Enable (DIR=1)

safe_initialization_patterns:
  method_calls_are_safe:
    note: "PINHIGH/PINLOW set DIR and OUT atomically"
    example: |
      PINHIGH(16)  ' No glitch - DIR and OUT set together
      
  register_access_caution:
    wrong: |
      OUTA |= (1 << 16)  ' Glitch: OUT changes while floating
      DIRA |= (1 << 16)
    correct: |
      OUTA &= !(1 << 16) ' Set desired state first
      DIRA |= (1 << 16)  ' Then enable output
      ' OR just use:
      PINLOW(16)         ' Atomic, no glitch

common_patterns:
  led_blink:
    code: |
      CON
        LED_PIN = 16
        
      PUB main()
        REPEAT
          PINHIGH(LED_PIN)
          WAITMS(500)
          PINLOW(LED_PIN)
          WAITMS(500)
          
  button_read:
    code: |
      CON
        BUTTON_PIN = 0
        
      PUB main()
        ' Hold the button pin weakly high; the button shorts it to ground
        PINCLEAR(BUTTON_PIN)              ' clear any previous smart-pin configuration
        WRPIN(BUTTON_PIN, P_HIGH_15K)     ' Drive high 15kOhm
        PINHIGH(BUTTON_PIN)               ' DIR=1, OUT=1 - a drive is live only while DIR is high
        
        REPEAT
          IF !PINREAD(BUTTON_PIN)  ' Active low: a press pulls the pin to ground
            buttonPressed()
            
  parallel_bus_write:
    code: |
      PUB writeBus(value) | mask
        ' Write byte to 8-bit bus (pins 16-23)
        mask := $FF << 16
        DIRA |= mask              ' Set as outputs
        OUTA := (OUTA & !mask) | ((value & $FF) << 16)
        
  parallel_bus_read:
    code: |
      PUB readBus() : result | mask
        ' Read byte from 8-bit bus (pins 16-23)
        mask := $FF << 16
        DIRA &= !mask             ' Set as inputs
        result := (INA >> 16) & $FF

method_vs_register_tradeoffs:
  methods:
    advantages:
      - "Clean, readable code"
      - "Atomic operations (no glitches)"
      - "Works with pin fields (ADDPINS)"
      - "Recommended for most applications"
    performance: "Slightly slower (method call overhead)"
    
  direct_registers:
    advantages:
      - "Faster execution (no method call)"
      - "Operate on arbitrary bit patterns"
      - "Powerful bit manipulation"
    disadvantages:
      - "Must manage DIR/OUT carefully"
      - "Risk of glitches if done wrong"
      - "Less readable"
    use_when: "Performance critical or complex bit patterns needed"

application_examples:
  seven_segment_display:
    code: |
      CON
        SEG_BASE = 16  ' Pins 16-23 = segments
        
      PUB showDigit(digit)
        ' Look up segment pattern
        OUTA := (OUTA & $FF00FFFF) | (lookupSegments(digit) << 16)
        DIRA |= $00FF0000  ' Enable outputs
        
  matrix_keypad:
    code: |
      CON
        ROW_BASE = 0    ' Rows on P0-P3
        COL_BASE = 4    ' Columns on P4-P7
        
      PUB scanKeypad() : key | row, col
        ' Hold the columns weakly high; a pressed key ties one to the row driven low
        PINCLEAR(COL_BASE ADDPINS 3)
        WRPIN(COL_BASE ADDPINS 3, P_HIGH_15K)  ' Drive high 15kOhm
        PINHIGH(COL_BASE ADDPINS 3)            ' DIR=1, OUT=1 - a drive is live only while DIR is high
        
        REPEAT row FROM 0 TO 3
          PINLOW(ROW_BASE + row)      ' Drive row low
          col := (INA >> COL_BASE) & $0F
          PINFLOAT(ROW_BASE + row)    ' Release row
          IF col <> $0F               ' Key pressed?
            RETURN decodeKey(row, col)
            
  ws2812_bit_bang:
    code: |
      PUB sendBit(pin, bit)
        IF bit
          PINHIGH(pin)
          WAITUS(1)      ' T1H = 800ns
          PINLOW(pin)
          WAITUS(0)      ' T1L = 450ns
        ELSE
          PINHIGH(pin)
          WAITUS(0)      ' T0H = 400ns
          PINLOW(pin)
          WAITUS(1)      ' T0L = 850ns

multi_cog_pin_coordination:
  architecture:
    per_cog_registers: "DIR/OUT/IN registers at $1FA-$1FF exist in each COG's private register RAM"
    independence: "Each COG controls only its own pin drivers via its DIR bits"
    shared_access: "All COGs can access all 64 pins, but each COG's DIR determines if IT drives"

  coordination_strategies:
    single_cog_ownership:
      approach: "Assign each pin to one COG (simplest, recommended for most applications)"
      implementation: "Only one COG sets DIR=1 for any given pin"
      advantage: "No coordination overhead, inherently safe"

    shared_access_with_coordination:
      approach: "Multiple COGs can share pin access with careful management"
      requirements:
        - "Use locks for exclusive access during drive operations"
        - "COGs must tri-state (DIR=0) before releasing pin to another COG"
        - "Protocol-based handoff between COGs"
      use_cases: "Bidirectional protocols, time-multiplexed pin usage, COG handoff"

  critical_rule:
    avoid: "Multiple COGs simultaneously setting DIR=1 for same pin"
    consequence: "Behavior undefined if COGs drive conflicting states (not documented in P2 spec)"
    hardware_note: "No documented conflict resolution, wire-OR, or priority scheme"

  safe_operations:
    reading: "All COGs can read any pin (INA/INB) simultaneously without coordination"
    smart_pins: "Smart pin state (RQPIN) can be read by multiple COGs safely"

anti_patterns:
  - anti_pattern: "missing_output_enable"
    severity: "no_output"
    description: "Smart pin mode without P_OE produces no output"
    wrong: |
      ' No output - missing P_OE!
      WRPIN(P_PWM_TRIANGLE, PWM_PIN)
      PINSTART(PWM_PIN, P_PWM_TRIANGLE, period, duty)  ' Still no output!
    correct: |
      ' Include P_OE for output
      WRPIN(P_PWM_TRIANGLE | P_OE, PWM_PIN)
      PINSTART(PWM_PIN, P_PWM_TRIANGLE | P_OE, period, duty)

  - anti_pattern: "read_without_input_mode"
    severity: "wrong_value"
    description: "Reading pin that's still in output mode reads output latch, not actual pin"
    wrong: |
      PINHIGH(INPUT_PIN)           ' Pin is output
      value := PINREAD(INPUT_PIN)  ' Reads output latch, not external signal!
    correct: |
      PINFLOAT(INPUT_PIN)          ' Set to input mode first
      value := PINREAD(INPUT_PIN)  ' Now reads actual pin state

  - anti_pattern: "smart_pin_not_cleared"
    severity: "power_waste"
    description: "Smart pin keeps running after use, wasting power"
    wrong: |
      PINSTART(ADC_PIN, P_ADC, 0, 0)
      value := RDPIN(ADC_PIN)
      ' ADC keeps running, consuming power
    correct: |
      PINSTART(ADC_PIN, P_ADC, 0, 0)
      value := RDPIN(ADC_PIN)
      PINCLEAR(ADC_PIN)            ' Stop smart pin
      PINFLOAT(ADC_PIN)            ' Return to input mode

  - anti_pattern: "rdpin_blocking_forever"
    severity: "hang_risk"
    description: "RDPIN blocks until data ready - may hang if no data arrives"
    wrong: |
      value := RDPIN(SERIAL_RX)    ' Blocks forever if no data!
    correct: |
      ' Check data ready first or use timeout
      REPEAT UNTIL PINREAD(SERIAL_RX) OR timeout_reached()
      if PINREAD(SERIAL_RX)
        value := RDPIN(SERIAL_RX)

  - anti_pattern: "parameter_order_confusion"
    severity: "wrong_configuration"
    description: "WRPIN and PINSTART have different parameter orders"
    wrong: |
      ' WRONG: Parameter order confused
      WRPIN(TX_PIN, P_ASYNC_TX)    ' Pin and mode swapped!
    correct: |
      ' WRPIN: (mode, pin)
      WRPIN(P_ASYNC_TX | P_OE, TX_PIN)

      ' PINSTART: (pin, mode, x, y) - different order!
      PINSTART(TX_PIN, P_ASYNC_TX | P_OE, x_val, y_val)

  - anti_pattern: "rqpin_without_ack"
    severity: "data_stale"
    description: "RQPIN reads without acknowledge - data may be stale"
    wrong: |
      ' Using RQPIN repeatedly without RDPIN or AKPIN
      REPEAT
        value := RQPIN(ADC_PIN)    ' May read same old value!
    correct: |
      ' Use RDPIN to read and acknowledge
      value := RDPIN(ADC_PIN)      ' Reads and acknowledges

      ' Or use AKPIN after RQPIN if you need non-blocking
      if PINREAD(ADC_PIN)          ' Data ready?
        value := RQPIN(ADC_PIN)    ' Read without blocking
        AKPIN(ADC_PIN)             ' Acknowledge to get fresh data next time

