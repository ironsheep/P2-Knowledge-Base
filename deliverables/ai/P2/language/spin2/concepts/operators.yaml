# Spin2 Operators - Comprehensive Guide
# Source: Parallax Propeller 2 Spin2 Language Documentation v55, Operators
# Critical for: Correct expression evaluation, avoiding common bugs

concept: "Spin2 Operators"
category: "language_fundamentals"

metadata:
  query_tags: ["operator", "precedence", "arithmetic", "bitwise", "comparison", "logical"]
  complexity: "intermediate"
  use_cases: ["expression_evaluation", "bit_manipulation", "value_comparison", "range_limiting"]
  common_questions:
    - "What is operator precedence in Spin2?"
    - "What's the difference between & and AND?"
    - "How do I compare unsigned values?"
    - "How do I clamp a value to a range?"

overview: |
  Spin2 provides a comprehensive set of operators organized into categories:
  - Arithmetic: +, -, *, /, //, SCA, SCAS, FRAC
  - Comparison, all priority 11: signed == <> < > <= >= <=>; unsigned +< +> +<= +>=; floating-point ==. <>. <. >. <=. >=.
  - Logical: AND/&&, OR/||, XOR/^^, NOT/!!
  - Bitwise: &, |, ^, !
  - Shift/rotate and bit-field, priority 3: >>, <<, SAR, ROR, ROL, REV, ZEROX, SIGNX
  - Limit: #> (min), <# (max)
  - Assignment: :=, multiple assignment (a, b := b, a), compound forms (+=, -=, etc.); :=: swaps two structure variables (v45)
  - Special: ??, ~, ~~, @, @@, .., ? :, ++, --

operator_categories:
  arithmetic:
    signed:
      - operator: "+"
        description: "Addition"
      - operator: "-"
        description: "Subtraction"
      - operator: "*"
        description: "Multiplication"
      - operator: "/"
        description: "Signed division (rounds toward zero)"
      - operator: "//"
        description: "Signed remainder (modulo)"
    unsigned:
      - operator: "+/"
        description: "Unsigned division"
      - operator: "+//"
        description: "Unsigned remainder"
    scaling:
      - operator: "SCA"
        description: "Unsigned scale: (a * b) >> 32"
      - operator: "SCAS"
        description: "Signed scale: (a * b) >> 30"
      - operator: "FRAC"
        description: "Unsigned fraction: (a << 32) / b"

  comparison:
    signed:
      - operator: "<"
        description: "Less than (signed)"
      - operator: ">"
        description: "Greater than (signed)"
      - operator: "<="
        description: "Less than or equal (signed)"
      - operator: ">="
        description: "Greater than or equal (signed)"
      - operator: "<=>"
        description: "Three-way compare: returns -1, 0, or +1"
    unsigned:
      note: "Use + prefix for unsigned comparisons"
      operators:
        - operator: "+<"
          description: "Less than (unsigned)"
        - operator: "+>"
          description: "Greater than (unsigned)"
        - operator: "+<="
          description: "Less than or equal (unsigned)"
        - operator: "+>="
          description: "Greater than or equal (unsigned)"
    equality:
      - operator: "=="
        description: "Equal to"
      - operator: "<>"
        description: "Not equal to"
    floating_point:
      note: "Float comparisons add a . suffix; like every comparison they return 0 or -1 and have priority 11"
      operators:
        - operator: "<."
          description: "Less than (float)"
        - operator: ">."
          description: "Greater than (float)"
        - operator: "<=."
          description: "Less than or equal (float)"
        - operator: ">=."
          description: "Greater than or equal (float)"
        - operator: "==."
          description: "Equal (float)"
        - operator: "<>."
          description: "Not equal (float)"

  bitwise_vs_logical:
    critical_distinction: |
      BITWISE operators work on individual bits:
        a & b  - AND each bit pair
        a | b  - OR each bit pair
        a ^ b  - XOR each bit pair
        !a     - Invert all 32 bits

      LOGICAL operators work on truth values (non-zero = TRUE):
        a AND b  - TRUE if both non-zero, returns -1 or 0
        a OR b   - TRUE if either non-zero, returns -1 or 0
        a XOR b  - TRUE if exactly one non-zero, returns -1 or 0
        NOT a    - TRUE if zero, FALSE if non-zero

    symbol_equivalents:
      - symbols: ["&&", "AND"]
        type: "Logical AND"
      - symbols: ["||", "OR"]
        type: "Logical OR"
        note: "P2 Spin2 semantics; not P1 absolute value. In P1 '||' was the Absolute Value operator. For absolute value on P2 use ABS."
      - symbols: ["^^", "XOR"]
        type: "Logical XOR"
      - symbols: ["!!", "NOT"]
        type: "Logical NOT"

  limit:
    operators:
      - operator: "#>"
        description: "Limit minimum (force >= value)"
        example: "value #> 0  ' Clamp to at least 0"
      - operator: "<#"
        description: "Limit maximum (force <= value)"
        example: "value <# 255  ' Clamp to at most 255"
    chaining: "value #> 0 <# 255  ' Clamp to 0-255 range"

  unary_bit_operations:
    - operator: "ENCOD"
      description: "Find highest set bit position (0-31), returns 0 if input is 0"
      example: "ENCOD %0000_1000  ' Returns 3"
    - operator: "DECOD"
      description: "Create value with single bit set at position"
      example: "DECOD 5  ' Returns %0010_0000 (32)"
    - operator: "BMASK"
      description: "Create mask with N+1 lowest bits set"
      example: "BMASK 7  ' Returns $FF (8 bits set)"
    - operator: "ONES"
      description: "Count number of 1 bits (population count)"
      example: "ONES %1010_1010  ' Returns 4"

  shift_and_extend:
    note: "Binary operators, priority 3: x OP y"
    operators:
      - operator: "REV"
        description: "Reverse order of bits 0..y of x and zero-extend"
        example: "%1010_0011 REV 7  ' Returns %1100_0101"
      - operator: "ZEROX"
        description: "Zero-extend above bit y"
        example: "$FF ZEROX 7  ' Returns $0000_00FF"
      - operator: "SIGNX"
        description: "Sign-extend from bit y"
        example: "$FF SIGNX 7  ' Returns $FFFF_FFFF (-1)"

signed_vs_unsigned:
  when_to_use_unsigned:
    - "Memory addresses (may exceed $7FFF_FFFF)"
    - "Unsigned counters"
    - "Pixel values"
    - "Values where bit 31 is data, not sign"

  division_example:
    signed_val: -100
    signed_division: "-100 / 7 = -14 (rounds toward zero)"
    unsigned_division: "-100 +/ 7 = 613566742 (interprets -100 as large positive)"

common_patterns:
  - pattern: "safe_division"
    description: "Avoid dividing by zero (x / 0 does not trap, it returns a fixed value: -1 for x >= 0)"
    code: |
      PUB safe_divide(a, b) : result
        result := b ? a / b : 0  ' Ternary guards the zero divisor

  - pattern: "bit_set"
    description: "Set bit at position N"
    code: "flags |= DECOD N"

  - pattern: "bit_clear"
    description: "Clear bit at position N"
    code: "flags &= !DECOD N"

  - pattern: "bit_toggle"
    description: "Toggle bit at position N"
    code: "flags ^= DECOD N"

  - pattern: "bit_test"
    description: "Test if bit N is set"
    code: |
      if flags & DECOD N
        bit_is_set()

  - pattern: "extract_field"
    description: "Extract N bits starting at position P"
    code: "fld := (value >> P) & BMASK (N-1)"

  - pattern: "value_clamp"
    description: "Clamp value to min/max range"
    code: "clamped := value #> min_val <# max_val"

  - pattern: "wrap_modulo"
    description: "Keep a non-negative value in 0 to max-1 range (// is the signed remainder: a negative value gives a negative result)"
    code: "wrapped := value // max_val"

  - pattern: "is_power_of_two"
    description: "Check if value is power of 2"
    code: "result := n > 0 AND ONES n == 1"

  - pattern: "next_power_of_two"
    description: "Round up to next power of 2"
    code: "result := n > 1 ? DECOD (ENCOD (n - 1) + 1) : 1"

  - pattern: "swap_values"
    description: "Exchange two values"
    code: "a, b := b, a  ' a and b are swapped (multiple assignment)"

anti_patterns:
  - anti_pattern: "c_precedence_assumption_bitwise_compare"
    severity: "common_bug"
    description: |
      P2 differs from C: bitwise AND '&' (precedence level 4) binds TIGHTER than
      equality '==' (level 11). So 'flags & MASK == EXPECTED' already groups as
      '(flags & MASK) == EXPECTED' — no parentheses needed.
    wrong: |
      if flags & (MASK == EXPECTED)  ' Mis-port from C (where '==' binds tighter)
    correct: |
      if flags & MASK == EXPECTED    ' P2: '&' first => (flags & MASK) == EXPECTED

  - anti_pattern: "c_precedence_assumption_shift_add"
    severity: "common_bug"
    description: |
      P2 differs from C: shift '<<' (precedence level 3) binds TIGHTER than add
      '+' (level 8). So 'value << 2 + 1' groups as '(value << 2) + 1'.
    wrong: |
      result := value << (2 + 1)     ' Mis-port from C (=> value << 3)
    correct: |
      result := value << 2 + 1       ' P2: '<<' first => (value << 2) + 1

  - anti_pattern: "signed_comparison_for_addresses"
    severity: "logic_error"
    description: "Signed comparison fails when addresses cross $8000_0000"
    wrong: |
      if addr1 < addr2               ' Fails for high addresses
    correct: |
      if addr1 +< addr2              ' Use unsigned comparison

  - anti_pattern: "bitwise_for_boolean"
    severity: "logic_error"
    description: "Using bitwise AND when logical AND is needed"
    wrong: |
      if a & b                       ' True if ANY bits overlap
    correct: |
      if a AND b                     ' True if both non-zero

  - anti_pattern: "logical_for_bitwise"
    severity: "logic_error"
    description: "Using logical operators for bit manipulation"
    wrong: |
      flags := a AND b               ' Returns -1 or 0, not bit intersection
    correct: |
      flags := a & b                 ' Actual bit intersection

  - anti_pattern: "integer_division_precision"
    severity: "precision_loss"
    description: "Integer division truncates fractional part"
    wrong: |
      average := (a + b) / 2         ' Truncates
    correct: |
      average := (a + b + 1) / 2     ' Rounds a half up (non-negative values)
      ' Or use float if precision needed
      average := (FLOAT(a) +. FLOAT(b)) /. 2.0

floating_point:
  note: "P2 has no floating-point hardware instructions: the Spin2 float operators run as software routines in the interpreter; the KB publishes no per-operation timing"
  raw_bits: "The float operators treat long values as floats: they act on the raw 32 bits and do not convert an integer operand. Convert with FLOAT(), ROUND() and TRUNC()."
  con_blocks: "In a CON block, + - * / ABS #> <# (and unary -) and the signed comparisons take on floating-point functionality when applied to floating-point constants and symbols; the relational operators (< <= == <> >= >) then return 1.0 or 0.0 instead of -1 or 0, and <=> returns -1.0, 0.0 or 1.0."
  operators:
    - operator: "+."
      description: "Float addition"
    - operator: "-."
      description: "Float subtraction (binary, priority 8); unary -.x is the float negate (priority 2, toggles the MSB)"
    - operator: "*."
      description: "Float multiplication"
    - operator: "/."
      description: "Float division"
    - operator: "<."
      description: "Float less than (returns 0 or -1)"
    - operator: ">."
      description: "Float greater than (returns 0 or -1)"
    - operator: "<=."
      description: "Float less than or equal (returns 0 or -1)"
    - operator: ">=."
      description: "Float greater than or equal (returns 0 or -1)"
    - operator: "==."
      description: "Float equal (returns 0 or -1)"
    - operator: "<>."
      description: "Float not equal (returns 0 or -1)"
    - operator: "FABS"
      description: "Float absolute value (clears the MSB)"
    - operator: "FSQRT"
      description: "Float square root"
    - operator: "FLOAT()"
      description: "Convert integer x to float"
    - operator: "ROUND()"
      description: "Convert float x to rounded integer"
    - operator: "TRUNC()"
      description: "Convert float x to truncated integer"

special_operators:
  - operator: "??"
    description: "Iterate a long variable per the XORO32 instruction and return a pseudo-random value (??var; PUB/PRI only)"
    example: |
      value := ??seed              ' Iterate seed, get the pseudo-random value
      value := (??seed) +// 100    ' Random 0-99 (+// is the unsigned remainder)

  - operator: "~"
    description: "Post-clear (postfix) - return variable's value, then clear it to 0"
    example: |
      x := flag~     ' x gets flag's value, then flag becomes 0
    note: "P2 Spin2 semantics; not P1 sign-extend. For sign-extend use SIGNX."

  - operator: "~~"
    description: "Post-set (postfix) - return variable's value, then set it to -1 (all bits, TRUE)"
    example: |
      x := flag~~    ' x gets flag's value, then flag becomes -1
    note: "P2 Spin2 semantics; not P1 sign-extend. For sign-extend use SIGNX."

  - operator: "!!"
    description: "Post-logical-NOT (postfix) - return variable's value, then replace it by its logical NOT (0 becomes -1, non-0 becomes 0)"
    example: |
      x := flag!!    ' x gets flag's value, then flag is logically inverted

  - operator: "!"
    description: "Post-bitwise-NOT (postfix) - return variable's value, then invert all of its bits"
    example: |
      x := flag!     ' x gets flag's value, then every bit of flag is inverted

  - operator: "\\"
    description: "Post-assign (postfix) - return variable's value, then assign x to the variable (var\\x)"
    example: |
      x := value\5   ' x gets value's old contents, then value becomes 5

  - operator: "@"
    description: "Hub address of a VAR/PUB/PRI/DAT variable (@hubvar); pointer to a method (@method, @object.method, may be @object[i].method)"
    example: "ptr := @buffer"

  - operator: "@@"
    description: "Hub address of this object + x, where x is an object-relative value such as a DAT long holding @dat_symbol"
    example: "addr := @@strings[index]"

  - operator: "^@"
    description: "Field pointer to any hub or register variable, including a bitfield (^@anyvar)"
    example: "fieldPtr := ^@flags.[3..0]"

  - operator: "#"
    description: "Register address of a cog/LUT symbol (#reg_symbol)"
    example: "addr := #regsym"

  - operator: ".."
    description: "Range operator (in CASE and LOOKUP)"
    example: "0..9 expands to 0, 1, 2, ..., 9"

  - operator: "? :"
    description: "Ternary conditional"
    example: "result := condition ? true_val : false_val"

  - operator: "++"
    description: "Increment (pre: ++x or post: x++)"

  - operator: "--"
    description: "Decrement (pre: --x or post: x--)"

changed_from_p1:
  description: |
    Spin (P1) operators whose token is gone or means something else in Spin2. A P1 habit
    that fails to compile costs a minute; one that still compiles gives a wrong value
    with no error. Each row was compiled on pnut-ts 1.55.8 (2026-10-07); where a P1 form
    compiles, its Spin2 meaning was proven by a byte-identical binary. The P1 side is the
    Spin operator table of the Propeller Manual v1.2 (Table 2-9). ENCOD spelling checked by
    compile: ENCOD 0 = 0, (x <> 0) ? ENCOD x + 1 : 0 gives 0 / 8 / 32 / 21 for P1's four
    examples.
  source: "Parallax Propeller 2 Spin2 Language Documentation v55, Operators"
  compiles_with_a_different_meaning:
    - p1: "a ~> 2 -- shift arithmetic right"
      spin2_reads_it_as: "(a~) > 2 -- a comparison that also CLEARS a (post-clear ~)"
      spin2_spelling: "a SAR 2"
    - p1: "a <- 2 -- rotate left"
      spin2_reads_it_as: "a < -2"
      spin2_spelling: "a ROL 2"
    - p1: "a <= b / a >= b -- the ASSIGNMENT forms of < and >: a := a < b / a := a > b"
      spin2_reads_it_as: "a plain compare -- less than or equal / greater than or equal; a is not written. As a statement on its own it no longer compiles."
      spin2_spelling: "a := a < b / a := a > b"
  fails_to_compile:
    - {p1: "||a -- unary absolute value", spin2_spelling: "ABS a; || is now binary logical OR (a || b returns 0 or -1)"}
    - {p1: "?x / x? -- random: a reversible LFSR, forward (?x) and reverse (x?), assigned back to x", spin2_spelling: "??x gives the next pseudo-random value forward only, from a different generator; P1's reverse form x? has no Spin2 equivalent, and the sequences differ"}
    - {p1: "^^x -- square root", spin2_spelling: "SQRT x; ^^ is now logical XOR"}
    - {p1: "~x / ~~x -- sign-extend from bit 7 / 15, assigning the result back to x", spin2_spelling: "x SIGNX= 7 / x SIGNX= 15 (x SIGNX 7 alone does not write x); postfix x~ and x~~ keep their P1 post-clear / post-set meaning"}
    - {p1: "a ** b -- upper 32 bits of a signed multiply", spin2_spelling: "no ** operator in Spin2"}
    - {p1: "|< x -- decode", spin2_spelling: "DECOD x"}
    - {p1: ">| x -- encode: the highest set bit plus 1 (0 when no bit is set)", spin2_spelling: "(x <> 0) ? ENCOD x + 1 : 0 -- ENCOD returns the bit number itself, one less than P1's >|"}
    - {p1: "a -> 2 -- rotate right", spin2_spelling: "a ROR 2"}
    - {p1: "a >< n -- reverse the n low bits", spin2_spelling: "a REV (n-1) -- REV takes the top bit index, bits 0..y; P1's a >< 6 is a REV 5"}
    - {p1: "a =< b / a => b -- equal-or-less / equal-or-greater", spin2_spelling: "a <= b / a >= b"}

