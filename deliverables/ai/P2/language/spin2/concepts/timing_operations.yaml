concept: Timing Operations
type: concept
category: Timing

description: |
  Comprehensive timing operations for the Propeller 2. The P2's system counter is
  64 bits wide and increments every clock cycle; GETCT returns its LOW 32 bits and
  GETCT WC returns the upper 32 ("System counter extended to 64 bits.
  GETCT WC retrieves upper 32-bits."). Everything below about rollover concerns the
  32-bit value GETCT returns on its own, which is what a Spin2 program normally works
  with; the counter itself does not wrap on these timescales. Every period and cycle
  time in this file is arithmetic on that width and CLKFREQ -- 2^32 / CLKFREQ and
  1 / CLKFREQ -- not a figure any source states. The frequencies used are the P2
  Datasheet's rated clock sources. Spin2 also provides time-unit
  functions for delays and measurements.

  Timing Categories:
  - Counter access: GETCT (raw counter), POLLCT/WAITCT (events)
  - Time delays: WAITMS, WAITUS (Spin2), WAITX (PASM2)
  - Time measurement: GETMS, GETSEC (elapsed since boot)

  The 32-bit GETCT value rolls over every 2^32 clocks, about 21.5 seconds at 200 MHz.
# Source: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), Design Status; Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, AC Characteristics, p.48

sources:
  - "timing_functions: Parallax Propeller 2 Spin2 Language Documentation v55, Built-In Methods (GETCT, POLLCT returns -1 if past or 0 if not past, WAITCT, WAITUS and WAITMS use CLKFREQ and the duration must not exceed $8000_0000 clocks, GETSEC and GETMS since booting from the 64-bit system counter and CLKFREQ, rolling over every 136 years and 49.7 days); the 10.7 s figure is $8000_0000 / 200 MHz, computed"
  - "description (GETCT WC returns the upper 32; quoted 'System counter extended to 64 bits. GETCT WC retrieves upper 32-bits.'): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), Design Status"
  - "description (rated clock sources): Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, AC Characteristics, p.48"

system_counter:
  description: |
    The system counter is a 64-bit free-running counter which increments every clock
    and is cleared on reset. The counter is 64 bits wide -- GETCT reads the low 32
    bits, GETCT WC the upper 32. The low 32 bits are always current in every cog. The
    upper 32 bits, and GETMS() and GETSEC() computed from the full 64-bit count, can
    read short in a cog of a four-cog group (cogs 0-3 or 4-7) that had no running cog
    at a wrap of the low 32 bits, until that group runs through its next wrap
    (language/pasm2/getct.yaml silicon_errata). The rollover table below is
    2^32 / CLKFREQ, computed, and applies to the 32-bit GETCT value.
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), Design Status -- \"System counter extended to 64 bits. GETCT WC retrieves upper 32-bits.\" -- and the feature list (64-bit free-running counter which increments every clock, cleared on reset). Stale upper long: P2 hardware verification, EF-068 (the lower long is always current; a group's upper long advances at a wrap only while a cog of that group runs), EF-080 (the lag closes at the group's next wrap); GETMS and GETSEC use the 64-bit counter: Parallax Propeller 2 Spin2 Language Documentation v55, Built-In Methods. Rollover periods and cycle times below are arithmetic on that width and the rated clock frequencies of the Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, AC Characteristics, p.48, not figures either source states."
  resolution: "Single clock cycle"
  range: "GETCT alone returns 0 to $FFFF_FFFF (2^32 - 1); the full counter is 64-bit"

  rollover_table:
    - clock_freq: "20 MHz"
      rollover_period: "214.7 seconds"
      cycle_time: "50 ns"
    - clock_freq: "100 MHz"
      rollover_period: "42.9 seconds"
      cycle_time: "10 ns"
    - clock_freq: "200 MHz"
      rollover_period: "21.5 seconds"
      cycle_time: "5 ns"
    - clock_freq: "300 MHz"
      rollover_period: "14.3 seconds"
      cycle_time: "3.3 ns"
    - clock_freq: "320 MHz"
      rollover_period: "13.4 seconds"
      cycle_time: "3.125 ns"

  rollover_safe_subtraction: |
    32-bit subtraction naturally handles wraparound correctly.
    If stop < start (wrapped), the result is still correct.
    Example: $0000_0010 - $FFFF_FFF0 = $20 (32 clocks elapsed)
    This works as long as elapsed time < rollover period. Spin2's plain comparison
    operators (<, >=, ...) are signed, so a difference compared with them must
    also stay below 2^31 counts; the unsigned operators (+<, +>=, ...) compare it
    across the whole rollover period.

timing_functions:
  - function: "GETCT()"
    returns: "32-bit counter value"
    description: "Get current system counter"
    use_for: "Precise timing, measurements, delay targets"

  - function: "WAITCT(target)"
    parameters: "target counter value"
    description: "Block until the System Counter has passed target (MSB of (CT - target) is 0)"
    use_for: "Precise delays, periodic execution"

  - function: "POLLCT(target)"
    returns: "-1 if the System Counter has gone past target, 0 if not"
    description: "Non-blocking check whether the System Counter has passed target"
    use_for: "Timeout checks, background work while waiting"

  - function: "WAITMS(ms)"
    parameters: "milliseconds"
    description: "Block for specified milliseconds; uses CLKFREQ, and the duration must not exceed $8000_0000 clocks (about 10.7 s at 200 MHz)"
    source: "Parallax Propeller 2 Spin2 Language Documentation v55, Built-In Methods (WAITMS uses CLKFREQ; duration must not exceed $8000_0000 clocks); the 10.7 s figure is $8000_0000 / 200 MHz, computed on a clock frequency within the rated sources of Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, AC Characteristics, p.48"
    use_for: "Simple delays when cycle precision not needed"

  - function: "WAITUS(us)"
    parameters: "microseconds"
    description: "Block for specified microseconds; uses CLKFREQ, and the duration must not exceed $8000_0000 clocks (about 10.7 s at 200 MHz)"
    source: "Parallax Propeller 2 Spin2 Language Documentation v55, Built-In Methods (WAITUS uses CLKFREQ; duration must not exceed $8000_0000 clocks); the 10.7 s figure is $8000_0000 / 200 MHz, computed on a clock frequency within the rated sources of Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, AC Characteristics, p.48"
    use_for: "Short delays, microsecond precision"

  - function: "GETMS()"
    returns: "milliseconds since booting"
    description: "Get elapsed time in milliseconds; uses the 64-bit system counter and CLKFREQ, rolls over every 49.7 days"
    use_for: "Timestamps, timeouts measured as elapsed time"

  - function: "GETSEC()"
    returns: "seconds since booting"
    description: "Get elapsed time in seconds; uses the 64-bit system counter and CLKFREQ, rolls over every 136 years"
    use_for: "Uptime, coarse timestamps"

method_selection:
  computation_note: "Arithmetic on the 32-bit GETCT value and CLKFREQ. The safe-span figures are 2^31 / CLKFREQ, computed here -- no source states them."
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), Design Status, for the counter; Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, AC Characteristics, p.48, for the rated frequencies"
  description: |
    GETCT, GETMS, and GETSEC return time at three different scales. The choice
    is not just about resolution — each has a different safe-span ceiling driven
    by 32-bit overflow, and the wrong choice for a long timeout gives a timeout
    at the wrong time with no error (anti_patterns.getct_long_timeout).
  decision_table:
    - method: "GETCT()"
      resolution: "1 system clock"
      counter_wrap: "~21.5 s at 200 MHz (varies with CLKFREQ — see rollover_table)"
      safe_timeout_window: "~2^31 / CLKFREQ seconds (~10.7 s at 200 MHz, ~8.6 s at 250 MHz, ~6.7 s at 320 MHz)"
      use_when: |
        Cycle-accurate measurement, sub-millisecond precision, short timeouts
        well below the safe window. Pair with WAITCT for cycle-accurate delays.
      avoid_when: |
        Timeouts that may exceed the safe window. Both the (CLKFREQ/divisor)*value
        deadline calculation and the wrap-aware comparison fail past 2^31 cycles.
    - method: "GETMS()"
      resolution: "1 millisecond"
      counter_wrap: "49.7 days"
      safe_timeout_window: "~2^31 ms (~24.8 days)"
      use_when: |
        Protocol timeouts (SPI response, SD card busy-wait, network retries),
        human-scale timing (UI debounce, user input), any deadline where the
        timeout might exceed GETCT's safe window.
      avoid_when: |
        Sub-millisecond precision is required.
    - method: "GETSEC()"
      resolution: "1 second"
      counter_wrap: "~136 years"
      safe_timeout_window: "~2^31 s (~68 years)"
      use_when: |
        Uptime display, day/hour/minute timing, very long retry intervals where
        millisecond precision is wasted.
      avoid_when: |
        Sub-second timing is required.
  rules_of_thumb:
    - "Short, precise timing (well under 10 s at 200 MHz): GETCT"
    - "Protocol-level timeouts (100 ms to many seconds): GETMS"
    - "Coarse, long-duration intervals (≥ 1 minute): GETSEC"
    - "When in doubt, GETMS — the 49.7-day headroom is rarely a constraint"
  worked_case: |
    A 24-second timeout shows the gap. At 200 MHz the (CLKFREQ/1000)*24_000
    product overflows signed 32-bit, and the wrap-aware compare cannot span
    24 s. Timed with GETMS, the same timeout is an elapsed-millisecond compare
    well inside its range. See anti_patterns.getct_long_timeout below.

time_conversions:
  computation_note: "Arithmetic on the 32-bit GETCT value and CLKFREQ. The ~10_737 ms overflow bound at 200 MHz is 2^31 / (CLKFREQ/1000), computed here -- no source states it."
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), Design Status (the counter width)"
  formulas:
    - from: "milliseconds"
      to: "cycles"
      formula: "cycles := clkfreq / 1000 * ms"
      note: |
        Order matters for precision. Also: this product overflows signed 32-bit
        when (clkfreq/1000) * ms exceeds 2^31 — at 200 MHz, when ms exceeds
        ~10_737. For multi-second deadlines, use GETMS rather than computing a
        cycle-domain target (see method_selection above and the
        getct_long_timeout anti-pattern below).
    - from: "microseconds"
      to: "cycles"
      formula: "cycles := clkfreq / 1_000_000 * us"
      better: "cycles := MULDIV64(clkfreq, us, 1_000_000)"
      better_note: "MULDIV64 uses a 64-bit intermediate: full precision (no divide-first truncation) AND no 32-bit overflow. Plain clkfreq * us / 1_000_000 overflows once us exceeds ~10 at 200 MHz."
    - from: "cycles"
      to: "milliseconds"
      formula: "ms := cycles / (clkfreq / 1000)"
    - from: "cycles"
      to: "microseconds"
      formula: "us := cycles / (clkfreq / 1_000_000)"

  conversion_functions: |
    PUB ms_to_cycles(ms) : cycles
      ' WARNING: cycles overflows signed 32-bit when (clkfreq/1000) * ms > 2^31.
      ' At 200 MHz, the safe input range is ms <= ~10_737. For longer deadlines,
      ' compute in milliseconds with GETMS instead. See method_selection above.
      cycles := clkfreq / 1000 * ms

    PUB us_to_cycles(us) : cycles
      ' Same overflow class as ms_to_cycles; us-scale ceiling is ~10.7 million us
      ' (~10.7 s) at 200 MHz: clkfreq / 1_000_000 * us is 200 * us there, which
      ' overflows signed 32-bit above 2^31 / 200 = 10,737,418 us.
      cycles := clkfreq / 1_000_000 * us

    PUB cycles_to_ms(cycles) : ms
      ms := cycles / (clkfreq / 1000)

    PUB cycles_to_us(cycles) : us
      us := cycles / (clkfreq / 1_000_000)

minimum_resolution:
  description: |
    One clock cycle is the counter's resolution at a given frequency. The practical
    resolution of a Spin2 timing loop is coarser, because each Spin2 operation takes
    interpreter time; no Parallax document gives a figure for that overhead.
  computation_note: "one_cycle is 1 / CLKFREQ, computed. Frequencies are the P2 Datasheet's rated clock sources."
  source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, AC Characteristics (Oscillator Frequency table), p.48"
  table:
    - clock_freq: "20 MHz"
      one_cycle: "50 ns"
    - clock_freq: "100 MHz"
      one_cycle: "10 ns"
    - clock_freq: "200 MHz"
      one_cycle: "5 ns"
    - clock_freq: "300 MHz"
      one_cycle: "3.3 ns"

patterns:
  - pattern: "periodic_execution"
    computation_note: "The interval bound below is 2^31 / (CLKFREQ/1000), computed here, not a figure any source states."
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), Design Status, for the counter width"
    description: "Periodic task execution with WAITCT targets a fixed period apart, so the work's time does not add to the period"
    key_insight: "Add period to target, don't wait after work"
    constraints: |
      interval_ms must satisfy (clkfreq/1000) * interval_ms < 2^31. At 200 MHz
      that caps interval_ms at ~10_737 (~10.7 s) -- computed from the 32-bit GETCT
      width, not a figure any source states. For longer periods, drive the
      loop with GETMS-based deadlines instead — see method_selection above.
    code: |
      PUB run_periodic(interval_ms) | period, next_tick
        period := clkfreq / 1000 * interval_ms
        next_tick := getct()

        REPEAT
          next_tick += period
          do_periodic_work()
          waitct(next_tick)    ' Maintains precise spacing

  - pattern: "timeout_polling"
    description: "Wait for condition with timeout. The timeout compares elapsed time (now minus start), which stays correct when GETMS rolls over; a deadline compared with >= does not"
    code: |
      PUB wait_for_response(timeout_ms) : success | start_ms
        start_ms := getms()

        REPEAT
          IF response_ready()
            RETURN TRUE
          IF getms() - start_ms >= timeout_ms
            RETURN FALSE
          waitms(1)            ' Small delay between checks

  - pattern: "debouncing"
    description: "Button/switch debounce with delay"
    code: |
      CON
        DEBOUNCE_MS = 50

      PUB read_button(pin) : pressed | sample1, sample2
        pinfloat(pin)
        sample1 := pinread(pin)
        waitms(DEBOUNCE_MS)
        sample2 := pinread(pin)
        pressed := (sample1 == sample2) AND (sample1 == 0)

  - pattern: "pulse_measurement"
    description: "Measure pulse width with counter"
    code: |
      PUB measure_pulse_width(pin) : width_us | start, stop
        ' Wait for rising edge
        REPEAT WHILE pinread(pin) == 1
        REPEAT WHILE pinread(pin) == 0

        ' Measure high time
        start := getct()
        REPEAT WHILE pinread(pin) == 1
        stop := getct()

        width_us := (stop - start) / (clkfreq / 1_000_000)

  - pattern: "rate_limiting"
    description: "Throttle action frequency"
    code: |
      VAR
        LONG last_action_time

      PUB rate_limited_action(min_interval_ms) : allowed
        IF getms() - last_action_time >= min_interval_ms
          last_action_time := getms()
          allowed := TRUE
        ELSE
          allowed := FALSE

  - pattern: "soft_pwm"
    description: "Software PWM with precise timing"
    code: |
      PUB soft_pwm(pin, duty_percent, freq_hz) | period, on_time, next_cycle
        period := clkfreq / freq_hz
        on_time := period * duty_percent / 100
        next_cycle := getct()

        REPEAT
          pinhigh(pin)
          waitct(next_cycle + on_time)
          pinlow(pin)
          next_cycle += period
          waitct(next_cycle)

  - pattern: "multi_timer"
    description: "Multiple independent timers, each kept as a start time and a duration so that the expiry test is an elapsed-time compare"
    code: |
      VAR
        LONG timer_starts[4]
        LONG timer_lengths[4]
        LONG timer_active[4]

      PUB start_timer(index, ms)
        timer_starts[index] := getms()
        timer_lengths[index] := ms
        timer_active[index] := TRUE

      PUB check_timer(index) : expired
        IF timer_active[index]
          IF getms() - timer_starts[index] >= timer_lengths[index]
            timer_active[index] := FALSE
            expired := TRUE

      PUB process_timers() | i
        REPEAT i FROM 0 TO 3
          IF check_timer(i)
            handle_timer_expired(i)

  - pattern: "overhead_compensation"
    description: >-
      Subtract the clocks of the measurement itself from a measured duration. A loop that
      adds its period to a WAITCT target (periodic_execution) needs no such
      compensation: each target is the previous target plus the period, so the time the
      loop body takes does not add up from one period to the next. Subtracting an
      overhead from that period instead shortens every period by the overhead.
    code: |
      PUB measure_work() : cycles | start, overhead
        ' Clocks of an empty GETCT-to-GETCT measurement
        start := getct()
        overhead := getct() - start

        start := getct()
        do_work()
        cycles := getct() - start - overhead

  - pattern: "time_measurement"
    description: "Measure operation duration"
    code: |
      PUB measure_operation() | start, elapsed_us
        start := getct()
        perform_operation()
        elapsed_us := (getct() - start) / (clkfreq / 1_000_000)
        debug("Operation took ", UDEC(elapsed_us), " us")

anti_patterns:
  - anti_pattern: "busy_waiting"
    severity: "performance"
    description: "A loop that only polls GETMS until a delay passes keeps the cog executing interpreter code for the whole delay; WAITMS(ms) states the same delay in one call. A WAITMS duration must not exceed $8000_0000 clocks (about 10.7 s at 200 MHz); a longer delay is a loop of shorter WAITMS calls"
    wrong: |
      PUB bad_wait(ms) | start_ms
        start_ms := getms()
        REPEAT WHILE getms() - start_ms < ms
          ' Doing nothing but polling
    correct: |
      PUB good_wait(ms)
        waitms(ms)                   ' duration must not exceed $8000_0000 clocks

  - anti_pattern: "ignoring_rollover"
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), Design Status, for the counter width; Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, AC Characteristics, p.48, for the rated frequencies; every quantity in this block is arithmetic on the 32-bit GETCT value and CLKFREQ, and no source states these bounds"
    severity: "logic_error"
    description: "Comparing counter values instead of subtracting"
    wrong: |
      PUB bad_elapsed() : elapsed | start, stop
        start := getct()
        do_work()
        stop := getct()
        IF stop > start              ' May be false after rollover!
          RETURN stop - start
    correct: |
      PUB good_elapsed() : elapsed | start, stop
        start := getct()
        do_work()
        stop := getct()
        RETURN stop - start          ' Always correct

  - anti_pattern: "getct_long_timeout"
    severity: "logic_error"
    description: |
      Using GETCT for a timeout that may exceed 2^31 cycles. At 200 MHz
      that is ~10.7 s; at 250 MHz, ~8.6 s. The (clkfreq/divisor)*value
      deadline calculation overflows signed 32-bit, and the wrap-aware
      compare cannot span the elapsed time. A product between 2^31 and
      2^32 makes the compare false at once, so the loop times out
      immediately; a product past 2^32 wraps, and at 200 MHz a
      24-second timeout (4,800,000,000 clocks) becomes 505,032,704 clocks,
      about 2.5 s. See method_selection above for the full rule.
    wrong: |
      PUB sd_wait_write_complete() : status | timeout
        ' BROKEN at 200 MHz:
        ' (clkfreq/1000) * 24_000 = 200_000 * 24_000 = 4.8e9, overflows signed 32-bit
        timeout := getct() + (clkfreq / 1000) * 24_000   ' 24-second timeout
        REPEAT WHILE (getct() - timeout) < 0
          IF sd_busy_released()
            RETURN SD_OK
        RETURN ERR_TIMEOUT
    correct: |
      PUB sd_wait_write_complete() : status | start_ms
        ' GETMS times multi-second timeouts as elapsed milliseconds (49.7-day wrap)
        start_ms := getms()
        REPEAT WHILE getms() - start_ms < 24_000          ' 24-second timeout
          IF sd_busy_released()
            RETURN SD_OK
        RETURN ERR_TIMEOUT

  - anti_pattern: "periodic_drift"
    severity: "timing_error"
    description: "Waiting after work instead of to fixed time"
    wrong: |
      PUB drifty_periodic()
        REPEAT
          do_work()
          waitms(100)                ' 100ms AFTER work completes (drifts)
    correct: |
      PUB precise_periodic() | deadline
        deadline := getct()
        REPEAT
          deadline += clkfreq / 10   ' 100ms interval
          do_work()
          waitct(deadline)           ' Wait until the next period

  - anti_pattern: "integer_truncation"
    severity: "precision_loss"
    description: "Division order loses precision for small values"
    wrong: |
      PUB bad_us_delay(us) | cycles
        cycles := clkfreq / 1_000_000 * us  ' May truncate significantly
    correct: |
      PUB better_us_delay(us) | cycles
        cycles := MULDIV64(clkfreq, us, 1_000_000)  ' 64-bit product, divided once

      ' Or use the built-in method
      PUB best_us_delay(us)
        waitus(us)                   ' uses CLKFREQ; duration must not exceed $8000_0000 clocks

  - anti_pattern: "blocking_critical_code"
    severity: "design"
    description: "Long blocking delays in time-critical code"
    wrong: |
      PUB bad_sensor_read() : reading
        request_reading()
        waitms(100)                  ' Blocks everything for 100ms
        RETURN get_reading()
    correct: |
      VAR
        LONG sensor_state
        LONG sensor_start_ms

      CON
        IDLE = 0
        WAITING = 1
        READY = 2

      PUB start_sensor_read()
        request_reading()
        sensor_start_ms := getms()
        sensor_state := WAITING

      PUB check_sensor_read() : is_ready
        IF sensor_state == WAITING
          IF getms() - sensor_start_ms >= 100
            sensor_state := READY
        is_ready := sensor_state == READY

notes:
  - "GETCT resolution is single clock cycle"
  - "32-bit subtraction gives the elapsed count across a rollover, for an interval shorter than the rollover period; compare the difference, not two time values"
  - "WAITMS/WAITUS use CLKFREQ; a duration must not exceed $8000_0000 clocks"
  - "The low 32 bits of the system counter (GETCT) read the same in every cog; the upper 32 bits can read short in one four-cog group (system_counter)"
  - "Spin2 interpreter adds overhead to all operations"
  - "Use WAITCT for cycle-accurate timing"
  - "Use GETMS/GETSEC for timestamps and timeouts measured as elapsed time"
  - "Smart pin modes time pin events in hardware (architecture/smart_pins.yaml)"

