name: Method Pointers
type: concept
category: Programming Patterns
aliases:
  - method pointers
  - dependency injection
  - shared instance injection
  - callback pointer
  - dispatch table
  - pluggable method

description: |
  Method pointers are 32-bit values that hold the address of a method, enabling 
  indirect (dynamic) method calls. They provide powerful capabilities for callbacks,
  dispatch tables, polymorphism, and decoupling callers from specific methods.
  
  CRITICAL: A method pointer is a LONG value and must be stored in a LONG variable.

variable_requirements:
  valid_declarations:
    - "LONG callback           ' Single method pointer"
    - "LONG handlers[4]        ' Array of method pointers"
    - "PUB Process() | handler ' Local LONG variable"
    - "PUB Register(handler)   ' LONG parameter"
  invalid_declarations:
    - type: "BYTE ptr"
      error: "Method pointers are LONG values; a BYTE variable cannot hold one"
    - type: "WORD ptr"
      error: "Method pointers are LONG values; a WORD variable cannot hold one"

getting_method_addresses:
  local_method:
    syntax: "@MethodName"
    description: "Address of method in current object"
    example: "handler := @ProcessData"
    
  child_object_method:
    syntax: "@obj.MethodName"
    description: "Address of method in child object"
    example: "outputMethod := @serial.tx"
    
  indexed_object_method:
    syntax: "@obj[i].MethodName"
    description: "Address of method in indexed child object array"
    example: |
      OBJ
        sensors[4] : "sensor"

      PUB getReader(index) : readMethod
        readMethod := @sensors[index].Read

calling_through_pointers:
  basic_call:
    syntax: "ptr()"
    description: "Call method with no parameters"
    
  with_parameters:
    syntax: "ptr(a, b, c)"
    description: "Call method with parameters"
    
  single_return:
    syntax: "result := ptr():1"
    description: "Call and capture return value (the :1 gives the number of return values expected)"
    
  multiple_returns:
    syntax: "x, y, z := ptr() : 3"
    description: "Call and capture N return values"
    note: "The :N suffix specifies expected return count for pointer calls"
    example: |
      VAR
        LONG coordGetter

      PUB Example() | x, y, z
        coordGetter := @GetPosition
        x, y, z := coordGetter():3      ' Expect 3 return values

null_check:
  description: "Always verify method pointer is valid before calling"
  pattern: |
    if callback <> 0
      callback(data)

examples:
  - code: |
      VAR
        LONG handler
        
      PUB Setup()
        handler := @ProcessData
        
      PUB Run()
        handler()                   ' Indirect call
        
      PRI ProcessData()
        ' ... implementation ...
    description: "Basic method pointer usage"
    
  - code: |
      OBJ
        serial : "jm_serial"
        lcd    : "lcd_driver"
        
      VAR
        LONG printChar
        
      PUB UseSerial()
        printChar := @serial.tx
        
      PUB UseDisplay()
        printChar := @lcd.Char
        
      PUB Output(c)
        printChar(c)
    description: "Pluggable output - switch between implementations"
    
  - code: |
      CON
        STATE_IDLE    = 0
        STATE_RUNNING = 1
        STATE_ERROR   = 2
        NUM_STATES    = 3
        
      VAR
        LONG stateHandlers[NUM_STATES]
        LONG currentState
        
      PUB Init()
        stateHandlers[STATE_IDLE] := @HandleIdle
        stateHandlers[STATE_RUNNING] := @HandleRunning
        stateHandlers[STATE_ERROR] := @HandleError
        currentState := STATE_IDLE
        
      PUB Update() | nextState
        if currentState >= 0 and currentState < NUM_STATES
          nextState := stateHandlers[currentState]():1
          currentState := nextState
    description: "State machine with dispatch table"
    
  - code: |
      VAR
        LONG onComplete
        
      PUB StartOperation(completionHandler)
        onComplete := completionHandler
        ' ... start async work ...
        
      PRI OperationDone(result)
        if onComplete
          onComplete(result)
    description: "Callback pattern for async completion"

  - code: |
      ' Inject a SPECIFIC shared-bus instance into each leaf.
      ' One compiled image, N VAR instances (one per bus); a method pointer
      ' encodes the target's VAR base, so each leaf addresses its OWN bus.
      OBJ
        pca[NBUS] : "pca9685_var"          ' one VAR instance per bus
      VAR
        LONG leafWrite[NBUS]
      PUB Init() | i
        repeat i from 0 to NBUS-1
          leafWrite[i] := @pca[i].write     ' bind leaf i to bus i
      PUB Drive(busId, channel, value)
        leafWrite[busId](channel, value)    ' calls THAT bus's instance
    description: "Dependency injection for N shared buses (Family B - see p2kbArchSharedBusReplication)"
    
  - code: |
      PUB TransformArray(pArray, count, transformFunc) | i, value
        repeat i from 0 to count - 1
          value := LONG[pArray][i]
          LONG[pArray][i] := transformFunc(value):1
          
      ' Usage:
      PUB Example()
        TransformArray(@values, 10, @DoubleValue)
        
      PRI DoubleValue(x) : result
        result := x * 2
    description: "Higher-order function pattern"
    
  - code: |
      PUB SortArray(pArray, count, compareFunc) | i, j, temp, order
        repeat i from 0 to count - 2
          repeat j from i + 1 to count - 1
            order := compareFunc(LONG[pArray][i], LONG[pArray][j]):1
            if order > 0
              temp := LONG[pArray][i]
              LONG[pArray][i] := LONG[pArray][j]
              LONG[pArray][j] := temp
              
      PRI CompareAscending(a, b) : result
        result := a - b
    description: "Custom comparator for sorting"

recv_send_as_pointers:
  description: |
    RECV and SEND are special built-in method pointers. Each is inherited from the
    calling method and conveyed to all called methods, and each provides an efficient
    input/output mechanism for data. They are assigned like method pointers.
  recv:
    syntax: "RECV := @InMethod"
    usage: "data := RECV()"
    restrictions:
      - "Must point to a method that takes no parameters"
      - "Must point to a method that returns a single value"
  send:
    syntax: "SEND := @OutMethod"
    usage: "SEND(data)"
    restrictions:
      - "Must point to a method that takes one parameter"
      - "Must point to a method that returns no value"
  flexible_io_pattern: |
    OBJ
      serial : "serial_driver"

    PUB setup()
      RECV := @serial.rx
      SEND := @serial.tx

    PUB echo() | c
      c := RECV()
      SEND(c)

parameter_considerations:
  description: |
    Method pointer calls have no compile-time parameter validation.
    The caller must provide the correct number of parameters.
  wrapper_pattern: |
    ' For dispatch tables with varying signatures, use wrappers:
    PUB Dispatch(index, p1, p2, p3) : result
      result := handlers[index](p1, p2, p3):1
      
    PRI WrapNoParam(p1, p2, p3) : result
      result := ActualNoParam()
      
    PRI WrapOneParam(p1, p2, p3) : result
      result := ActualOneParam(p1)

best_practices:
  - "Initialize pointers to 0 and check before calling"
  - "Use CON constants for dispatch table indices"
  - "Document expected method signatures in comments"
  - "Bounds-check array indices before dispatch"

common_patterns:
  event_handlers: "Register callbacks for button press, timeout, etc."
  dispatch_tables: "State machines, command processors, menu systems"
  strategy_pattern: "Switch algorithms at runtime via object method pointers"
  higher_order: "Pass transform/filter/compare functions to generic algorithms"
  shared_instance_injection: "Inject @obj[i].primitive so N callers over one image each address their own VAR instance (e.g. N independent buses from one driver) - Family B of p2kbArchSharedBusReplication"

notes:
  - "Method pointers are 32-bit values encoding method index and VAR base"
  - "No compile-time type checking on parameters or returns"
  - "Use :N suffix to specify return count when calling through pointer"
  - "RECV and SEND are method pointers inherited by called methods; assign them with RECV := @InMethod and SEND := @OutMethod"

related:
  - language/spin2/special-symbols/at.yaml
  - language/spin2/constructs/method_definition.yaml
  - language/spin2/methods/recv.yaml
  - language/spin2/methods/send.yaml
  - language/spin2/patterns/implementation/spin2_mailbox_communication.yaml
  - language/spin2/concepts/object-image-dedup.yaml

see_also:
  - "Method-pointer injection as Family B for N identical shared buses: p2kbArchSharedBusReplication"
  - "Why one driver image yields one shared DAT (the constraint injection sidesteps): p2kbSpin2ObjectImageDedup"

oneliner: "Method pointers enable indirect calls, callbacks, dispatch tables, and runtime method selection"
