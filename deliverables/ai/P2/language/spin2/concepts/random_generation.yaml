concept: Random Number Generation
type: concept
category: Algorithms

description: |
  The Propeller 2 provides multiple mechanisms for random number generation:
  - GETRND: 32 bits from the chip's xoroshiro128** pseudo-random generator; the boot
    ROM seeds that generator with thermal noise from the ADC, it iterates every clock,
    and each cog receives its own 32 bits
  - ?? operator: iterates a long variable with the XORO32 instruction (the
    xoroshiro32+ algorithm) and returns the pseudo-random value (repeatable)
  - XORO32: PASM instruction for the same generator in assembly code

  Key distinction: GETRND needs no seed and is not repeatable, while ?? is repeatable:
  the same starting value gives the same sequence (games, simulations, reproducibility).
  Neither is cryptographic.

hardware_vs_prng:
  comparison:
    - aspect: "Source"
      getrnd: "The cog's 32 bits of the chip's xoroshiro128** generator, seeded at boot from ADC thermal noise"
      prng: "XORO32 instruction iterating a long variable"
    - aspect: "Speed"
      getrnd: "Interpreted via bytecode dispatch; the underlying GETRND PASM instruction is 2 clocks fixed. We do not publish a method-call clock count."
      prng: "Runs the XORO32 instruction on the cog; we do not publish a per-call clock count"
    - aspect: "Repeatability"
      getrnd: "Not repeatable: the generator iterates every clock"
      prng: "Reproducible: the same starting value gives the same sequence"
    - aspect: "Seeding"
      getrnd: "Not required (the boot ROM seeds the generator)"
      prng: "Required: start the variable at a non-zero value (a zero state is absorbing)"
    - aspect: "Security"
      getrnd: "Not cryptographic"
      prng: "NOT for cryptography"

  when_to_use_getrnd:
    - "Random values that need no seed and need not repeat"
    - "Initial PRNG seeding"

  when_to_use_prng:
    - "Game mechanics (dice rolls, card shuffling)"
    - "Simulations requiring reproducibility"
    - "Testing with reproducible sequences"

xoro32_algorithm:
  description: |
    The ?? operator iterates a long variable with the XORO32 instruction (the
    xoroshiro32+ algorithm) and returns the pseudo-random value that instruction
    produces. The variable holds the generator state and is updated in place.

  properties:
    - "One XORO32 instruction on the cog"
    - "Reproducible: the same starting value gives the same sequence"
    - "Seed it with a non-zero value: a zero state is absorbing - with x = 0, ??x returns 0 and x stays 0"
    - "NOT suitable for cryptography"

common_patterns:
  - pattern: "random_range_0_to_n"
    description: "Random integer in [0, n-1]"
    code: |
      PUB random_0_to_n(n) : value
        value := GETRND() +// n

  - pattern: "random_range_min_max"
    description: "Random integer in [min, max] inclusive"
    code: |
      PUB random_range(min_val, max_val) : value
        value := (GETRND() +// (max_val - min_val + 1)) + min_val

  - pattern: "random_percent"
    description: "Random value 0-100"
    code: |
      PUB random_percent() : percent
        percent := GETRND() +// 101

  - pattern: "probability_check"
    description: "Return TRUE with given probability"
    code: |
      PUB chance(percent) : result
        ' Returns TRUE percent% of the time
        result := (GETRND() +// 100) < percent

  - pattern: "random_boolean"
    description: "50/50 random boolean"
    code: |
      PUB coin_flip() : result
        result := GETRND() & 1

  - pattern: "random_float"
    description: "Random float in [0.0, 1.0)"
    code: |
      CON
        SCALE_FACTOR = 16777216.0   ' 2^24

      PUB random_float() : value
        value := FLOAT(GETRND() >> 8) /. SCALE_FACTOR

  - pattern: "random_element"
    description: "Select random element from array"
    code: |
      PUB random_element(array_ptr, count) : value
        value := LONG[array_ptr][GETRND() +// count]

  - pattern: "weighted_random"
    description: "Weighted random selection"
    code: |
      CON
        ' Cumulative weights (ascending)
        WEIGHT_COMMON   = 70     ' 70% chance
        WEIGHT_UNCOMMON = 90     ' 20% chance
        WEIGHT_RARE     = 100    ' 10% chance

      PUB weighted_random() : result | roll
        roll := GETRND() +// 100
        IF roll < WEIGHT_COMMON
          result := CATEGORY_COMMON
        ELSEIF roll < WEIGHT_UNCOMMON
          result := CATEGORY_UNCOMMON
        ELSE
          result := CATEGORY_RARE

  - pattern: "fisher_yates_shuffle"
    description: "Shuffle array in place"
    code: |
      PUB shuffle(array_ptr, count) | i, j, temp
        ' Fisher-Yates shuffle algorithm
        REPEAT i FROM count - 1 TO 1
          j := GETRND() +// (i + 1)   ' Random index 0..i
          ' Swap elements
          temp := LONG[array_ptr][i]
          LONG[array_ptr][i] := LONG[array_ptr][j]
          LONG[array_ptr][j] := temp

  - pattern: "noise_generation"
    description: "Generate noise samples for audio/signals"
    code: |
      VAR
        LONG noise_state

      PUB init_noise(seed)
        noise_state := seed
        IF noise_state == 0
          noise_state := 1

      PUB white_noise() : sample
        ' Generate white noise sample (-128 to 127)
        sample := (??noise_state >> 24) - 128

seeding_strategies:
  - strategy: "hardware_seed"
    description: "Seed from GETRND - a different sequence on each run"
    code: |
      VAR
        LONG prng_state

      PUB seed_prng()
        prng_state := GETRND()
        IF prng_state == 0    ' a zero state is absorbing
          prng_state := 1

  - strategy: "fixed_seed"
    description: "For testing - reproducible sequences"
    code: |
      CON
        TEST_SEED = $DEADBEEF

      PUB seed_for_testing()
        prng_state := TEST_SEED

  - strategy: "time_seed"
    description: "Seed from the system counter"
    code: |
      PUB seed_from_time()
        prng_state := GETCT()
        IF prng_state == 0
          prng_state := 1

anti_patterns:
  - anti_pattern: "zero_seed"
    severity: "critical"
    description: "A zero state is absorbing for XORO32 and ??: with state = 0, ??state returns 0 and state stays 0"
    wrong: |
      VAR
        LONG state

      PUB bad_init()
        state := 0           ' ??state returns 0 and state stays 0

      PUB get_random() : value
        value := ??state     ' Returns 0 every time
    correct: |
      PUB good_init()
        state := GETRND()
        IF state == 0
          state := 1         ' Ensure non-zero

  - anti_pattern: "modulo_bias"
    severity: "moderate"
    description: "// is the signed remainder, so a negative random long gives a negative result"
    wrong: |
      value := GETRND() // 10    ' signed remainder: -9..9
    correct: |
      value := GETRND() +// 10   ' unsigned remainder: 0..9 (2^32 mod 10 = 6, so residues 0..5 are one count more likely: 429496730 vs 429496729)

  - anti_pattern: "uninitialized_prng"
    severity: "critical"
    description: "Using PRNG without initialization"
    wrong: |
      VAR
        LONG prng          ' May be 0!

      PUB random() : value
        value := ??prng    ' May always return 0!
    correct: |
      VAR
        LONG prng
        LONG initialized

      PUB random() : value
        IF NOT initialized
          prng := GETRND()
          IF prng == 0
            prng := 1
          initialized := TRUE
        value := ??prng

  - anti_pattern: "reseeding_every_call"
    severity: "performance"
    description: "Reseeding PRNG on every call wastes GETRND"
    wrong: |
      PUB bad_random() : value
        seed := GETRND()     ' Reseeds on every call
        value := ??seed      ' PRNG adds no value
    correct: |
      PUB random() : value
        value := ??state     ' Use existing PRNG state

notes:
  - "Use the unsigned remainder (+//) for range limiting: // is the signed remainder and can return negative values"
  - "+// 256 and & $FF give identical results for a power-of-two range"
  - "?? operator modifies the variable in-place"
  - "A zero state is absorbing for ??: seed with a non-zero value"
  - "Each cog receives its own 32 bits of the generator's output"
  - "Use ?? when a reproducible sequence is acceptable or wanted"
  - "Use GETRND to seed a ?? variable"

sources:
