name: Type Propagation Rules
type: concept
category: Data Types

description: |
  In Spin2, BYTE/WORD/LONG type specifiers behave differently depending on context.
  In some contexts a type "carries forward" to subsequent comma-separated names,
  and in others each name reverts to the default type of LONG. Understanding these
  rules prevents subtle bugs where variables are unexpectedly sized as LONGs.

rules:
  var_block:
    name: "VAR Block — Type IS Sticky"
    behavior: "Type specifier applies to ALL subsequent names on the same line until a new type specifier is encountered"
    default: "LONG"
    example:
      code: |
        VAR
          BYTE a, b, c              ' a=BYTE, b=BYTE, c=BYTE (type carries forward)
          WORD x, y                 ' x=WORD, y=WORD (type carries forward)
          d, e                      ' d=LONG, e=LONG (no type = default LONG)
      explanation: "On each VAR line, the type set by the first specifier persists across all comma-separated names"

  pub_pri_parameters:
    name: "PUB/PRI Parameters — always long (or pointer); no BYTE/WORD parameters"
    behavior: "A parameter is a long. A ^BYTE, ^WORD, ^LONG or ^StructName override makes that one parameter a pointer; the override applies only to the name it precedes"
    default: "LONG"
    example:
      code: |
        PUB foo(^BYTE a, b, ^WORD c)           ' a=^BYTE pointer, b=LONG (override not sticky), c=^WORD pointer
        PUB foo2(^BYTE a, ^BYTE b, ^WORD c)    ' a, b, c all pointers (explicit each)
      explanation: "The ^BYTE before 'a' does NOT carry to 'b'. BYTE a or WORD c in a parameter list is a compile error."
    gotcha: "Opposite of VAR, where a size carries to the following names on the line"

  pub_pri_return_values:
    name: "PUB/PRI Return Values — always long (or pointer); no BYTE/WORD results"
    behavior: "A result is a long. A ^BYTE, ^WORD, ^LONG or ^StructName override makes that one result a pointer; the override applies only to the name it precedes"
    default: "LONG"
    example:
      code: |
        PUB bar() : ^BYTE status, value        ' status=^BYTE pointer, value=LONG
        PUB bar2() : ^BYTE status, ^BYTE value ' status and value both pointers (explicit each)
      explanation: "The ^BYTE before 'status' does NOT carry to 'value'. BYTE status in a result list is a compile error."

  pub_pri_locals:
    name: "PUB/PRI Local Variables — Type is NOT Sticky"
    behavior: "Each local variable name independently defaults to LONG unless it has its own explicit type specifier"
    default: "LONG"
    example:
      code: |
        PUB baz() | BYTE temp, count         ' temp=BYTE, count=LONG(!)
        PUB baz() | BYTE temp, BYTE count    ' temp=BYTE, count=BYTE (explicit each)
      explanation: "The BYTE before 'temp' does NOT carry to 'count'"

  dat_block:
    name: "DAT Block — Line Base Type with Per-Value Overrides"
    behavior: "The type specifier sets the line's base type for all comma-separated values. An inline type override applies only to the single value it precedes — subsequent values revert to the line's base type"
    default: "Required (must specify type)"
    example:
      code: |
        DAT
          myData    LONG    $1234, $5678, $9ABC          ' All three are LONGs
          mixed     LONG    $1234, BYTE $56, $9ABC       ' $1234=LONG, $56=BYTE, $9ABC=LONG (reverts!)
          allBytes  BYTE    1, WORD 1000, 2              ' 1=BYTE, 1000=WORD, 2=BYTE (reverts!)
      explanation: "The line's base type always reasserts after an inline override"

summary_table:
  - context: "VAR block (same line)"
    sticky: "YES — sticky across commas"
    inline_override: "N/A"
    default: "LONG"
  - context: "DAT block (same line)"
    sticky: "YES — line base type persists"
    inline_override: "Per-value only, does NOT stick"
    default: "Required"
  - context: "PUB/PRI parameters"
    sticky: "NO — each name is its own"
    inline_override: "^BYTE/^WORD/^LONG/^StructName only (pointer), per name"
    default: "LONG"
  - context: "PUB/PRI return values"
    sticky: "NO — each name is its own"
    inline_override: "^BYTE/^WORD/^LONG/^StructName only (pointer), per name"
    default: "LONG"
  - context: "PUB/PRI local variables"
    sticky: "NO — resets each name"
    inline_override: "N/A"
    default: "LONG"

common_mistakes:
  - mistake: "Assuming a PUB/PRI pointer override carries forward like a VAR type"
    wrong: "PUB foo(^BYTE a, b)    ' Expecting both to be ^BYTE pointers"
    correct: "PUB foo(^BYTE a, ^BYTE b)  ' Override each pointer parameter"

  - mistake: "Declaring BYTE or WORD parameters"
    wrong: "PUB foo(BYTE a, WORD b)  ' compile error: parameters are longs"
    correct: "PUB foo(a, b)  ' longs; use ^BYTE/^WORD only for a pointer"

  - mistake: "Assuming DAT inline type override persists"
    wrong: "LONG $1234, BYTE $56, $78    ' Expecting $78 to be BYTE"
    correct: "LONG $1234, BYTE $56, BYTE $78  ' Override each value explicitly"

  - mistake: "Forgetting that untyped names default to LONG"
    wrong: "PUB foo() | x, y    ' May expect BYTE or WORD"
    correct: "PUB foo() | BYTE x, BYTE y  ' Explicitly type if not LONG"

notes:
  - "These rules apply to PNut-TS Spin2 compiler"
  - "The VAR sticky behavior matches traditional Spin1 behavior"
  - "LONG is always the default when no type is specified"
  - "Type propagation is a compile-time concept — no runtime cost"

related:
