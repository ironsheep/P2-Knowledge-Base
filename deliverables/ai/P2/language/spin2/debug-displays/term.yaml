display_type: TERM
category: DEBUG Display Types
description: |
  TERM is the P2 DEBUG text/terminal window. It renders characters into a fixed
  cols x rows grid with a cursor, four selectable text/background color pairs, and
  automatic scrolling. It is the DEFAULT display when DEBUG output is not directed at
  a named display window. It is NOT a VT100/ANSI terminal: there are no escape
  sequences, no scrollback buffer, no copy/paste, and no character read-back (TERM
  holds only pixels + cursor/color state, not a readable character grid).
documentation_source: PNut v55 (DebugDisplayUnit.pas) via DEBUG-WINDOW-DIRECTIVE-MATRIX.md
documentation_level: comprehensive
source: "PNut/Spin2 v55 DebugDisplayUnit.pas (TERM display implementation: numeric control codes; size range cols/rows 1..256) + Parallax Spin2 Language Reference v51a (DEBUG displays); examples compile-verified with pnut_ts v1.55.0"

aliases:
  - terminal
  - text window
  - serial terminal
  - DEBUG TERM
  - TERM

syntax:
  create: "DEBUG(`TERM MyTerm <config directives>)"
  update: "DEBUG(`MyTerm <strings / numeric control codes / directives>)   ' reference the window by name"
  default: "DEBUG(\"text\", 13)   ' with no display window named, output goes to a default TERM"

configuration_directives:
  note: "Accepted in TERM_Configure (window creation)."
  TITLE: "TITLE 'string' -- title-bar text"
  string_quoting: "Display-command text (TITLE/SAVE/etc.) uses SINGLE quotes '...'; double quotes are silently ignored at runtime, no compile error. See statements/debug.yaml string_quoting."
  POS: "POS left top -- window screen offset"
  SIZE: "SIZE cols rows -- size in CHARACTERS (columns x rows), NOT pixels. cols 1..256 (default 40), rows 1..256 (default 20)"
  TEXTSIZE: "TEXTSIZE n -- font point size, 6..200 (default 10)"
  COLOR: "COLOR c0..c7 -- up to 8 RGB24 values = 4 text/background pairs (pair0=c0,c1 .. pair3=c6,c7). Default pairs: ORANGE/BLACK, BLACK/ORANGE, LIME/BLACK, BLACK/LIME"
  BACKCOLOR: "BACKCOLOR color -- canvas (clear/scroll) fill color at config time; distinct from the runtime BACKCOLOR which sets text background"
  UPDATE: "UPDATE -- enable buffered mode (output accumulates until a runtime UPDATE flushes it)"
  HIDEXY: "HIDEXY -- hide the on-screen coordinate readout (does NOT disable PC_MOUSE reporting)"

display_directives:
  note: "Accepted in TERM_Update (streaming to the named window)."
  named_colors: "BLACK WHITE ORANGE BLUE GREEN CYAN RED MAGENTA YELLOW GRAY {brightness} -- set text foreground; an immediately following named color sets the text background. Optional 0..15 brightness nibble."
  BACKCOLOR: "BACKCOLOR color -- runtime: sets the text BACKGROUND only (differs from config BACKCOLOR which is the canvas fill)"
  CLEAR: "CLEAR -- clear the window and home the cursor to (0,0)"
  UPDATE: "UPDATE -- flush buffered output to the canvas (BitmapToCanvas)"
  SAVE: "SAVE -- write the window bitmap to <name>.bmp"
  CLOSE: "CLOSE -- close (free) this named window. Distinct from ending the whole DEBUG session via DEBUG(DEBUG_END_SESSION); see language/spin2/constants/debug-end-session.yaml"
  PC_KEY: "PC_KEY -- transmit the latched keypress LONG back to the P2 (see pc_key.yaml)"
  PC_MOUSE: "PC_MOUSE -- transmit the mouse position+buttons LONG pair back to the P2 (see pc_mouse.yaml)"

control_codes:
  note: "Numeric values streamed to TERM act as control codes. Only 0..13 and 32..255 act; 14..31 (which includes 12) do NOTHING."
  "0": "clear screen and home cursor to (0,0)"
  "1": "home cursor (no clear)"
  "2 n": "set column; n clamped to 0..cols-1"
  "3 n": "set row; n clamped to 0..rows-1"
  "4": "select color pair 0"
  "5": "select color pair 1"
  "6": "select color pair 2"
  "7": "select color pair 3"
  "8": "backspace -- cursor moves back one column (wraps); NON-DESTRUCTIVE; no-op at (0,0)"
  "9": "tab -- advance to the next 8-column boundary (spaces)"
  "10": "line feed -- treated the same as carriage return (CR)"
  "12": "NO ACTION -- 12 is in the 14..31 fall-through range and renders nothing. Clear the screen with code 0 or the CLEAR keyword, NOT 12."
  "13": "carriage return -- move to next row (scrolls at bottom), column 0; a following 10 is absorbed"
  "32..255": "printable glyph rendered at the cursor; cursor advances one column"

scrolling: "Automatic and unconditional: a CR on the bottom row scrolls the window up one line. There is no scroll on/off toggle."

input:
  model: "Shared form-level input model (identical across all nine DEBUG display windows)."
  PC_KEY: "PC_KEY transmits one LONG = the vKeyPress byte (0 if none), then clears it. See language/spin2/debug-commands/pc_key.yaml"
  PC_MOUSE: "PC_MOUSE transmits LONG1 = char col/row + wheel + L/M/R buttons (off-text-area sentinel $03FFFFFF / $FFFFFFFF), LONG2 = RGB under the cursor. See language/spin2/debug-commands/pc_mouse.yaml"

examples:
  - code: |
      ' Default TERM: no window named, output goes to a default terminal
      DEBUG("System initialized", 13)
    description: "Simplest case -- the default DEBUG terminal"
  - code: |
      ' Create a named 40x20 terminal, then stream text by name
      DEBUG(`TERM MyTerm SIZE 40 20 TEXTSIZE 12)
      DEBUG(`MyTerm "Temperature: ", SDEC(temp), " C", 13)
    description: "Named terminal with a labeled value and newline"
  - code: |
      ' Clear + home with code 0, position the cursor, select a color pair
      DEBUG(`TERM Stat SIZE 30 10)
      DEBUG(`Stat 0)                       ' code 0 clears and homes (NOT 12)
      DEBUG(`Stat 3, 2, 4, "Row 2, pair 0", 13)
    description: "Cursor positioning (code 3 = set row) and color-pair select (code 4)"

not_supported:
  - "Code 12 does NOT clear the screen (it does nothing) -- use 0 or CLEAR. This was a serial-terminal carry-over error."
  - "No VT100/ANSI escape sequences or ANSI color codes."
  - "No scrollback buffer."
  - "No copy/paste."
  - "No color themes -- only the four fixed COLOR pairs (selected by codes 4-7)."
  - "No timestamp option, no clear button, no interactive resize (SIZE is fixed at config)."
  - "No font-FACE selection -- TEXTSIZE sets point size only."
  - "No character read-back -- TERM keeps pixels + cursor/color state, not a readable character grid."
  - "Window does not persist between program runs."

notes:
  - "TERM is the DEFAULT display when DEBUG output names no display window."
  - "SIZE is in characters (cols x rows), not pixels -- a common source of error."
  - "Color is the four COLOR pairs only; codes 4-7 select the active pair; named-color directives set fg/bg directly."

related:
