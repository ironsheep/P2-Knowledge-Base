display_type: LOGIC
category: DEBUG Display Types
description: |
  LOGIC is the P2 DEBUG digital-waveform (logic-analyzer) window. It captures and
  displays a stream of packed sample longs as multi-channel digital waveforms, with
  a mask/match EDGE trigger and holdoff. It is raw sample capture: there are NO
  protocol decoders (I2C/SPI/UART/CAN), NO automatic baud detection, and NO
  timing-measurement/analysis tools.
documentation_source: PNut v55 (DebugDisplayUnit.pas) via DEBUG-WINDOW-DIRECTIVE-MATRIX.md
documentation_level: comprehensive
source: "PNut/Spin2 v55 DebugDisplayUnit.pas (LOGIC display implementation: channel def, TRIGGER/detect, HOLDOFF, SetPack) + Parallax Spin2 Language Reference v51a (DEBUG displays); examples compile-verified with pnut_ts v1.55.0"

aliases:
  - logic analyzer
  - digital signals
  - waveform
  - LOGIC
  - DEBUG LOGIC

syntax:
  create: "DEBUG(`LOGIC MyLog <config directives> <channel-def strings>)"
  update: "DEBUG(`MyLog <sample longs / directives>)   ' reference the window by name"

configuration_directives:
  note: "Accepted in LOGIC_Configure (window creation)."
  TITLE: "TITLE 'string' -- window title. Default caption is '<name> - LOGIC', not a bare type name."
  string_quoting: "Display-command text (TITLE/SAVE/etc.) uses SINGLE quotes '...'; double quotes are silently ignored at runtime, no compile error. See statements/debug.yaml string_quoting."
  POS: "POS left top -- OPTIONAL window screen offset. Omit POS and the DEBUG display HOST places the window -- and WHERE it places it is TOOL-DEPENDENT, not a P2 behavior: some hosts auto-arrange windows so they do not overlap, others stack every window at the same origin (so all but one are hidden). Neither is guaranteed. Supply POS explicitly whenever the layout matters (i.e. any multi-window program). Hardware-verified: EF-043."
  SAMPLES: "SAMPLES n -- number of samples across the window, 4..2047 (default 32). A single integer -- LOGIC has NO {first last} form (that shape belongs to FFT/SPECTRO)."
  SPACING: "SPACING n -- HORIZONTAL pixel spacing between successive samples (the X-axis time base), 1..32 (default 8). This is NOT vertical channel spacing -- the per-channel vertical pitch is fixed at the font cell height."
  RATE: "RATE n -- draw-rate divisor (draw every Nth qualifying sample), 1..2048 (default 1). This is NOT a sample rate."
  DOTSIZE: "DOTSIZE n -- sample dot diameter, a single scalar 0..32 (default 0 = no dots). LOGIC has NO x {y} two-axis form (that shape belongs to PLOT/BITMAP/SPECTRO)."
  LINESIZE: "LINESIZE n -- waveform line thickness, 1..32 (default 3)."
  TEXTSIZE: "TEXTSIZE n -- label font point size, 6..200 (default 10)."
  COLOR: "COLOR back grid -- background then grid color (named or RGB24; defaults black $000000 / gray $404040)."
  HIDEXY: "HIDEXY -- suppress on-screen cursor readout (PC_MOUSE still reports)"
  packed: "Packing mode (12 modes) with optional ALT and/or SIGNED -- how many sub-samples are packed per transmitted long/word/byte. Modes: LONGS_1BIT (32x1), LONGS_2BIT (16x2), LONGS_4BIT (8x4), LONGS_8BIT (4x8), LONGS_16BIT (2x16); WORDS_1BIT (16x1), WORDS_2BIT (8x2), WORDS_4BIT (4x4), WORDS_8BIT (2x8); BYTES_1BIT (8x1), BYTES_2BIT (4x2), BYTES_4BIT (2x4). ALT bit-reverses each sub-unit; SIGNED sign-extends on unpack. For LOGIC the sub-sample WIDTH is the channel count: each sub-sample delivers one bit per channel per time-step, so an N-bit packing mode drives N channels. Declare exactly that many channels -- a 2-channel window needs LONGS_2BIT; with LONGS_1BIT both channels' data lands on the first channel only (hardware-confirmed)."
  channel_definition_string: "A quoted string defines a channel: 'name' {count} {RANGE} {color}. The FIRST NUMBER AFTER THE LABEL IS ALWAYS THE CHANNEL COUNT -- so a COLOR MUST BE PRECEDED BY AN EXPLICIT COUNT. Writing 'CLK' $00FF00 does NOT make a green CLK: $00FF00 is read as a count of 65,280, clamped to the 32-channel maximum, and the labels that follow are then silently DROPPED. Write 'CLK' 1 $00FF00. A count >= 2 WITHOUT RANGE = that many SINGLE-BIT channels (auto-suffixed labels 'name 0'..'name N'); a count WITH RANGE = one multi-bit bus value drawn as an analog-style waveform. 'color' sets the trace color."

display_directives:
  note: "Accepted in LOGIC_Update (streaming to the named window)."
  numeric_data: "Packed sample long(s) -- the digital sample stream displayed as waveforms."
  TRIGGER: "TRIGGER mask match {offset} -- an EDGE-armed mask/match trigger. The compare is ((sample XOR match) AND mask) == 0: bits OUTSIDE the mask are DON'T-CARES, and the match value is compared only on the masked bits. (The AND-form '(sample AND mask) == match' is only equivalent when match is a subset of mask -- do not rely on it.) The window arms on a non-matching sample, then FIRES on the next sample that matches. It is a transition INTO the match state, NOT a static level match. offset 0..SAMPLES-1 (default SAMPLES/2) positions the trigger within the capture. Re-issuing TRIGGER resets the armed state. This is a single mask/match edge compare -- NOT an I2C/SPI/UART decoder or an edge-sequence/glitch engine."
  HOLDOFF: "HOLDOFF n -- minimum samples between triggers, 2..2048 (initial value = SAMPLES, set at configure). Supplying a count sets the holdoff and resets the holdoff counter to 0; a bare HOLDOFF with no count is a no-op (it leaves both the holdoff and its counter unchanged)."
  CLEAR: "CLEAR -- clear the display and reset the sample population and rate counters"
  SAVE: "SAVE {WINDOW} 'filename' -- write a .bmp of the display area, or of the entire window if WINDOW is given, to <filename>.bmp. filename is REQUIRED; WINDOW optional. (A 'l t w h' region variant selects a sub-rectangle.)"
  CLOSE: "CLOSE -- close (free) this named window; reclaims one of the 32 display slots. It is a COMMAND ONLY (takes no arguments), accepts MORE THAN ONE window name in a message, and is UPDATE-FIRST/CLOSE-SECOND: the rest of the message executes before the close, so `Win SAVE 'shot' CLOSE saves and THEN closes. Distinct from ending the whole DEBUG session via DEBUG(DEBUG_END_SESSION); see language/spin2/constants/debug-end-session.yaml"
  PC_KEY: "`PC_KEY(@key) -- REQUIRES ITS OWN BACKTICK inside the display message; transmit the latched keypress LONG to the P2 (see pc_key.yaml)"
  PC_MOUSE: "`PC_MOUSE(@buf7) -- REQUIRES ITS OWN BACKTICK inside the display message; transmit the mouse position+buttons LONG pair to the P2 (see pc_mouse.yaml)"

input:
  model: "Shared form-level input model (identical across all nine DEBUG display windows)."
  PC_KEY: "Universal -- see language/spin2/debug-commands/pc_key.yaml"
  PC_MOUSE: "Universal -- see language/spin2/debug-commands/pc_mouse.yaml"
  cursor_coordinate: "sample index x channel row (origin bottom-right)"

examples:
  - code: |
      ' Create a 100-sample logic window, then stream samples by window name
      DEBUG(`LOGIC MyLog SAMPLES 100)
      REPEAT
        DEBUG(`MyLog `(INA))            ' stream the pin-input long as samples
    description: "Capture and display INA as digital waveforms"
  - code: |
      ' Define named channels (a single bit and a 4-bit bus) at creation
      DEBUG(`LOGIC Bus SAMPLES 200 'CS' 1 'DATA' 4)
      REPEAT
        DEBUG(`Bus `(sample_value))
    description: "Single-bit and multi-bit-bus channels"
  - code: |
      ' Trigger when the low byte equals $A5, with holdoff
      DEBUG(`LOGIC Trig SAMPLES 256)
      DEBUG(`Trig TRIGGER $FF $A5 HOLDOFF 64)
      REPEAT
        DEBUG(`Trig `(bus_value))
    description: "Mask/match edge trigger with holdoff"
  - code: |
      ' Packed full-window array feed. Two channels -> LONGS_2BIT (sub-sample
      ' width == channel count). Build one full window of packed longs, then feed
      ' the whole array in ONE message (not one packed long per DEBUG call).
      VAR long buff[16]                         ' 16 longs x 16 pairs = 256 samples
      DEBUG(`LOGIC Pair SAMPLES 256 'D0' 'D1' LONGS_2BIT)
      REPEAT
        REPEAT j FROM 0 TO 15
          packed := 0
          REPEAT i FROM 0 TO 15
            packed := (packed << 2) | (getrnd() & %11)   ' bit0 -> D0, bit1 -> D1
          buff[j] := packed
        DEBUG(`Pair `uhex_long_array_(@buff, 16))         ' whole window, one message
    description: "Packed full-window array feed (LONGS_2BIT, two channels) -- the feed shape that fills a scrolling LOGIC window"

not_supported:
  - "No protocol decoding -- no I2C/SPI/UART/CAN decoders; multi-bit buses are shown as raw bus values only."
  - "No automatic baud or clock detection."
  - "No timing-measurement or signal-analysis tools (no period/frequency/pulse-width readouts)."
  - "TRIGGER is a single mask/match edge compare plus optional offset -- not an edge-sequence, glitch, or protocol-trigger engine."

notes:
  - "LOGIC is raw sample capture displayed as waveforms; multi-bit buses are shown as bus values, but there is NO protocol decoding."
  - "TRIGGER is EDGE-armed: it requires a transition into the match state (disarm on non-match, fire on the next match), not a static level match."
  - "SPACING is the HORIZONTAL (time-axis) pixel gap between samples; the per-channel vertical pitch is fixed."
  - "Packed-data modes let you pack multiple sub-samples per transmitted long/word/byte; ALT/SIGNED adjust interleave/sign."
  - "To FILL a scrolling LOGIC window with packed data, feed the whole window as an array in one message -- `uhex_long_array_(@buff, N)`; a single packed long advances the window by one column only. On unpack: invoking LONGS_2BIT has the LOGIC display unpack the two-bit sample sets from longs, yielding 16 sets per long; LONGS_1BIT translates each value into 32 separate 1-bit values, starting from the LSB."

