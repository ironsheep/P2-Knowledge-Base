display_type: LOGIC
category: DEBUG Display Types
description: |
  LOGIC is the P2 DEBUG digital-waveform window. It captures and displays a stream
  of sample longs as multi-channel digital waveforms, with a mask/match trigger and
  holdoff. It is raw sample capture: it has NO protocol decoders (I2C/SPI/UART/CAN),
  NO automatic baud detection, and NO timing-measurement/analysis tools.
documentation_source: PNut v55 (DebugDisplayUnit.pas) via DEBUG-WINDOW-DIRECTIVE-MATRIX.md
documentation_level: comprehensive
source: "engineering/document-production/manuals/p2-debug-window-manual/REF/DEBUG-WINDOW-DIRECTIVE-MATRIX.md (sections 2, 3, 5.1) -- verified against DebugDisplayUnit.pas v55: LOGIC_Configure 926, LOGIC_Update 1034, channel def 971-1005, TRIGGER 1043-1049"

syntax:
  create: "DEBUG(`LOGIC MyLog <config directives>)"
  update: "DEBUG(`MyLog <sample longs / directives>)   ' reference the window by name"

configuration_directives:
  note: "Accepted in LOGIC_Configure (window creation)."
  TITLE: "TITLE 'string'"
  POS: "POS left top"
  SAMPLES: "SAMPLES n {first last} -- number of samples across the window (range 4..2047)"
  SPACING: "SPACING n -- vertical spacing between channels (LOGIC-only)"
  RATE: "RATE n -- sample rate"
  DOTSIZE: "DOTSIZE x {y}"
  LINESIZE: "LINESIZE n"
  TEXTSIZE: "TEXTSIZE n"
  COLOR: "COLOR back grid -- background then grid color"
  HIDEXY: "HIDEXY -- suppress on-screen cursor readout (PC_MOUSE still reports)"
  packed: "Packed-data declaration LONGS_1BIT..BYTES_4BIT (optionally ALT and/or SIGNED) -- how many sub-samples are packed per transmitted long/word/byte"
  channel_definition_string: "A string defines a channel: 'name' {count} {RANGE} {color}. 'count' groups bits into a multi-bit bus; RANGE/color set its display."

display_directives:
  note: "Accepted in LOGIC_Update."
  numeric_data: "Sample longs -- the digital sample stream displayed as waveforms."
  TRIGGER: "TRIGGER mask match {offset} -- capture triggers when (sample AND mask) == match; optional pre/post offset. This is a bit mask/match trigger only -- not a protocol/edge-sequence engine."
  HOLDOFF: "HOLDOFF n -- minimum samples between triggers"
  CLEAR: "CLEAR -- clear the display"
  SAVE: "SAVE ... -- write the window bitmap to <name>.bmp"

input:
  model: "Shared form-level input model (identical across all nine DEBUG display windows)."
  PC_KEY: "Universal -- see language/spin2/debug-commands/pc_key.yaml"
  PC_MOUSE: "Universal -- see language/spin2/debug-commands/pc_mouse.yaml"
  cursor_coordinate: "sample index x channel row (origin bottom-right)"

examples:
  - code: |
      ' Create a 100-sample logic window, then stream samples by window name
      DEBUG(`LOGIC MyLog SAMPLES 100)
      REPEAT
        DEBUG(`MyLog `(INA))            ' stream the pin-input long as samples
    description: "Capture and display INA as digital waveforms"
  - code: |
      ' Define named channels (a single bit and a 4-bit bus) at creation
      DEBUG(`LOGIC Bus SAMPLES 200 'CS' 1 'DATA' 4)
      REPEAT
        DEBUG(`Bus `(sample_value))
    description: "Single-bit and multi-bit-bus channels"
  - code: |
      ' Trigger when the low byte equals $A5, with holdoff
      DEBUG(`LOGIC Trig SAMPLES 256)
      DEBUG(`Trig TRIGGER $FF $A5 HOLDOFF 64)
      REPEAT
        DEBUG(`Trig `(bus_value))
    description: "Mask/match trigger with holdoff"

notes:
  - "LOGIC is raw sample capture displayed as waveforms; multi-bit buses are shown as bus values, but there is NO protocol decoding."
  - "TRIGGER is a single mask/match comparison plus optional offset -- not an I2C/SPI/UART decoder or an edge-sequence/glitch engine."
  - "Packed-data modes let you pack multiple sub-samples per transmitted long/word/byte."

related:
  - language/spin2/debug-displays/scope.yaml
  - language/spin2/debug-commands/pc_key.yaml
  - language/spin2/debug-commands/pc_mouse.yaml
