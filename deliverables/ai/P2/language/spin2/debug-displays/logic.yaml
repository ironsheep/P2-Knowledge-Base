display_type: LOGIC
category: DEBUG Display Types
description: |
  LOGIC is the P2 DEBUG digital-waveform (logic-analyzer) window. It displays a
  stream of packed sample longs as multi-channel digital waveforms, with a
  mask/match edge trigger and holdoff. A multi-bit group defined with RANGE is
  drawn as an analog-style waveform.
documentation_source: "Parallax Propeller 2 Spin2 Language Documentation v55, LOGIC Display"
documentation_level: comprehensive
source: "Parallax Propeller 2 Spin2 Language Documentation v55, Graphical DEBUG Displays, LOGIC Display and Packed-Data Modes; PNut DebugDisplayUnit LOGIC_Configure, LOGIC_Update, LOGIC_Draw, SetPack, NewPack and UnPack; EF-027; EF-043"

aliases:
  - logic analyzer
  - logic analyser
  - digital signals
  - waveform
  - LOGIC
  - DEBUG LOGIC
  - logic analyzer display

# The logic-analyzer question has two parts on the P2. LOGIC is the display; the
# capture of pin state into hub RAM is a streamer job, carried by pin-capture.yaml.
where_the_data_comes_from:
  capture_side: "architecture/streamer/pin-capture.yaml carries the streamer capture of digital pin state into hub RAM, including the smart-pin event flag that IN returns on a pin running a smart-pin mode and the neighbour-routing composition that captures the waveform."
  this_file_is_the_display_side: "LOGIC draws packed sample longs that DEBUG messages deliver to the named window. SAMPLES, SPACING and TRIGGER act on the data fed to the window."
  capture_example: "architecture/streamer/pin-capture.yaml serial_333mbaud_capture carries the 333 Mbaud async serial example: a smart pin transmitting, the streamer capturing through an adjacent non-smart pin, and this display unpacking the result with LONGS_2BIT."
  source: "Parallax Propeller 2 Spin2 Language Documentation v55, Graphical DEBUG Displays, LOGIC Display (the 333 Mbaud capture example)"

syntax:
  create: "DEBUG(`LOGIC MyLog <config directives> <channel-def strings>)"
  update: "DEBUG(`MyLog <sample longs / directives>)   ' reference the window by name"

configuration_directives:
  note: "Accepted at window creation."
  TITLE: "TITLE 'string' -- window title. The default caption is '<name> - LOGIC'."
  string_quoting: "Display-command text (TITLE/SAVE/etc.) uses single quotes '...'; double quotes are silently ignored at runtime, with no compile error. See language/spin2/statements/debug.yaml string_quoting."
  POS: "POS left top -- optional window screen offset. Without POS the host places the window: PNut opens every such window at its display origin, so successive windows overlap; pnut-term-ts tiles such windows so they do not overlap."
  SAMPLES: "SAMPLES n -- number of samples across the window, 4..2047 (default 32). SAMPLES takes a single integer."
  SPACING: "SPACING n -- horizontal pixel spacing between successive samples (the X-axis time base), 1..32 (default 8). The plot area width is SAMPLES * SPACING pixels. Around it the window adds a left margin of (longest channel label length + 2) character widths and a margin of one character height at the top, right and bottom. The per-channel vertical pitch is fixed at the font cell height."
  RATE: "RATE n -- draw-rate divisor (draw every Nth qualifying sample), 1..2048 (default 1)."
  DOTSIZE: "DOTSIZE n -- sample dot diameter, a single scalar 0..32 (default 0 = no dots)."
  LINESIZE: "LINESIZE n -- waveform line thickness, 1..32 (default 3)."
  TEXTSIZE: "TEXTSIZE n -- label font point size, 6..200 (default 10)."
  COLOR: "COLOR back grid -- background then grid color (named or RGB24; defaults black $000000 / gray $404040)."
  HIDEXY: "HIDEXY -- suppress on-screen cursor readout (PC_MOUSE still reports)"
  packed: "Packing mode (12 modes) with optional ALT and/or SIGNED -- how many sub-samples are packed per transmitted long/word/byte. Modes: LONGS_1BIT (32x1), LONGS_2BIT (16x2), LONGS_4BIT (8x4), LONGS_8BIT (4x8), LONGS_16BIT (2x16); WORDS_1BIT (16x1), WORDS_2BIT (8x2), WORDS_4BIT (4x4), WORDS_8BIT (2x8); BYTES_1BIT (8x1), BYTES_2BIT (4x2), BYTES_4BIT (2x4). ALT reverses the order of the bit, double-bit or nibble fields within each byte (a full bit reversal within each byte for the _1BIT modes) and has no effect in the _8BIT and _16BIT modes; SIGNED sign-extends on unpack. Without a packing mode each transmitted long is one full 32-bit sample. For LOGIC each unpacked sub-sample is stored whole as one time-step word and the channels are read from within that word, so the sub-sample width is the channel count: an N-bit packing mode drives N channels. A 2-channel window uses LONGS_2BIT; with LONGS_1BIT only bit 0 of each stored word is populated, so both channels' data lands on the first channel only."
  channel_definition_string: "A quoted string defines a channel: 'name' {count} {RANGE} {color}. The first number after the label is the channel count, 1..32, so a numeric color follows an explicit count. 'CLK' $00FF00 reads $00FF00 as the count, clamped to the 32-channel maximum, and the labels that follow are dropped; 'CLK' 1 $00FF00 gives a green CLK. A named color keyword needs no count: 'CLK' RED. A count >= 2 without RANGE gives that many single-bit channels labelled 'name 0', '1', '2' and so on, with only the first row carrying the name; a count with RANGE gives one multi-bit bus value drawn as an analog-style waveform. 'color' sets the trace color."

display_directives:
  note: "Accepted when streaming to the named window."
  numeric_data: "Packed sample long(s) -- the digital sample stream displayed as waveforms."
  TRIGGER: "TRIGGER mask match {offset} -- an edge-armed mask/match trigger. The compare is ((sample XOR match) AND mask) == 0: bits outside the mask are don't-cares, and the match value is compared only on the masked bits. The AND form '(sample AND mask) == match' gives the same result only when match has no bits outside mask. The mask and match apply to the raw 32-bit sample word, one bit per input line, before the bits are grouped into channels. A mask of 0 disables the trigger. The window arms on a non-matching sample, then fires on the next sample that matches, a transition into the match state. offset 0..SAMPLES-1 (default SAMPLES/2) positions the trigger within the window: offset 0 is the right edge (the newest sample) and larger offsets move the trigger point left. Re-issuing TRIGGER resets the armed state."
  HOLDOFF: "HOLDOFF n -- minimum samples between triggers, 2..2048 (initial value = SAMPLES, set at configure). Supplying a count sets the holdoff and resets the holdoff counter to 0; a bare HOLDOFF with no count leaves both the holdoff and its counter unchanged."
  CLEAR: "CLEAR -- clear the display and reset the sample population and rate counters"
  SAVE: "SAVE {WINDOW} 'filename' -- write a .bmp of the display area, or of the entire window if WINDOW is given, to <filename>.bmp. filename is required; WINDOW is optional. (A 'l t w h' region variant selects a sub-rectangle.)"
  CLOSE: "CLOSE -- close (free) this named window; reclaims one of the 32 display slots. CLOSE takes no arguments, is accepted only as a command to an existing window, accepts more than one window name in a message, and runs after the rest of the message: `Win SAVE 'shot' CLOSE saves and then closes. Ending the whole DEBUG session is DEBUG(DEBUG_END_SESSION); see language/spin2/constants/debug-end-session.yaml"
  PC_KEY: "`PC_KEY(@key) -- carries its own backtick inside the display message; transmit the latched keypress LONG to the P2 (see language/spin2/debug-commands/pc_key.yaml)"
  PC_MOUSE: "`PC_MOUSE(@buf7) -- carries its own backtick inside the display message; transmit the mouse position+buttons LONG pair to the P2 (see language/spin2/debug-commands/pc_mouse.yaml)"

input:
  model: "Shared form-level input model (identical across all nine DEBUG display windows)."
  PC_KEY: "Universal -- see language/spin2/debug-commands/pc_key.yaml"
  PC_MOUSE: "Universal -- see language/spin2/debug-commands/pc_mouse.yaml"
  cursor_coordinate: "sample index x channel row (origin bottom-right)"

examples:
  - code: |
      ' Create a 100-sample logic window, then stream samples by window name
      DEBUG(`LOGIC MyLog SAMPLES 100)
      REPEAT
        DEBUG(`MyLog `(INA))            ' stream the pin-input long as samples
    description: "Display INA as digital waveforms"
  - code: |
      ' Define named channels (a single channel and a group of 4 channels) at creation
      DEBUG(`LOGIC Bus SAMPLES 200 'CS' 1 'DATA' 4)
      REPEAT
        DEBUG(`Bus `(sample_value))
    description: "A single channel and a group of 4 channels"
  - code: |
      ' Trigger when the low byte equals $A5, with holdoff
      DEBUG(`LOGIC Trig SAMPLES 256)
      DEBUG(`Trig TRIGGER $FF $A5 HOLDOFF 64)
      REPEAT
        DEBUG(`Trig `(bus_value))
    description: "Mask/match edge trigger with holdoff"
  - code: |
      ' Packed full-window array feed. Two channels use LONGS_2BIT (sub-sample
      ' width equals channel count). The loop builds one full window of packed
      ' longs and sends the whole array in one message.
      VAR
        long buff[16]                           ' 16 longs of 16 two-bit samples each

      PUB main() | i, j, packed
        DEBUG(`LOGIC Pair SAMPLES 256 'D0' 'D1' LONGS_2BIT)
        REPEAT
          REPEAT j FROM 0 TO 15
            packed := 0
            REPEAT i FROM 0 TO 15
              packed := (packed << 2) | (getrnd() & %11)   ' bit0 -> D0, bit1 -> D1
            buff[j] := packed
          DEBUG(`Pair `uhex_long_array_(@buff, 16))         ' whole window, one message
    description: "Packed full-window array feed (LONGS_2BIT, two channels) -- the feed shape that fills a scrolling LOGIC window"

display_features:
  - "A multi-bit group defined with RANGE is drawn as an analog-style waveform."
  - "TRIGGER is a single mask/match edge compare plus an optional offset."
  - "The window shows 1..32 channels, single-bit or multi-bit."

notes:
  - "LOGIC displays packed sample longs as waveforms; a multi-bit group defined with RANGE is drawn as an analog-style waveform."
  - "TRIGGER is edge-armed: the window disarms on a non-match and fires on the next match, a transition into the match state."
  - "SPACING is the horizontal (time-axis) pixel gap between samples; the per-channel vertical pitch is fixed."
  - "Packed-data modes pack multiple sub-samples per transmitted long, word or byte; ALT and SIGNED adjust the field order and the sign."
  - "A packed full-window feed sends the whole sample array in one message with `uhex_long_array_(@buff, N)`. On unpack, LONGS_2BIT has the LOGIC display unpack the two-bit sample sets from longs, yielding 16 sets per long; LONGS_1BIT translates each value into 32 separate 1-bit values, starting from the LSB."

