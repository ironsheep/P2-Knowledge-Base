display_type: PLOT
category: DEBUG Display Types
description: |
  Real-time plotting display for data visualization and trending.
  Provides line graphs, scatter plots, and bar charts for numeric data
  with auto-scaling, multiple series, and statistical analysis.
documentation_source: Spin2 v51
documentation_level: comprehensive

syntax: "DEBUG(`PLOT title, series1, series2, ...`)"

capabilities:
  - "Multiple data series (up to 8)"
  - "Line, scatter, and bar chart modes"
  - "Auto-scaling or fixed scales"
  - "Rolling or accumulating display"
  - "Statistical overlays"
  - "Data point markers"
  - "Legend display"
  - "Grid and axis labels"

plot_types:
  line_plot:
    description: "Connected data points"
    usage: "Continuous data, trends"
    
  scatter_plot:
    description: "Individual data points"
    usage: "Discrete samples, correlations"
    
  bar_chart:
    description: "Vertical or horizontal bars"
    usage: "Categorical data, comparisons"
    
  area_plot:
    description: "Filled area under line"
    usage: "Cumulative values, ranges"

data_modes:
  rolling:
    description: "Fixed window, old data scrolls off"
    buffer_size: "Configurable (default 1000 points)"
    
  accumulating:
    description: "All data points retained"
    limitation: "Memory limited"
    
  triggered:
    description: "Start/stop on condition"
    usage: "Event-based capture"

examples:
  - code: |
      ' Temperature monitoring
      PUB temp_logger() | temp
        REPEAT
          temp := read_temperature()
          DEBUG(`PLOT Temperature, temp`)
          WAITMS(1000)
    description: "Plot temperature over time"
    
  - code: |
      ' Multiple sensor comparison
      PUB compare_sensors() | s1, s2, s3
        REPEAT
          s1 := read_sensor(0)
          s2 := read_sensor(1)
          s3 := read_sensor(2)
          DEBUG(`PLOT Sensors, s1, s2, s3`)
          WAITMS(100)
    description: "Compare three sensors"
    
  - code: |
      ' PID controller visualization
      PUB pid_debug() | setpoint, actual, error, output
        REPEAT
          setpoint := target_value
          actual := read_process()
          error := setpoint - actual
          output := calculate_pid(error)
          DEBUG(`PLOT PID_Control, setpoint, actual, output`)
          WAITMS(10)
    description: "Visualize PID control loop"
    
  - code: |
      ' Performance metrics
      PUB performance() | cpu_load, memory, latency
        REPEAT
          cpu_load := get_cpu_usage()
          memory := get_memory_usage()
          latency := measure_latency()
          DEBUG(`PLOT Performance, cpu_load, memory, latency`)
          WAITMS(100)
    description: "System performance monitoring"
    
  - code: |
      ' Statistical distribution
      PUB histogram() | value, count[10], i
        REPEAT 1000
          value := random_value() / 10
          count[value]++
        REPEAT i FROM 0 TO 9
          DEBUG(`PLOT Distribution, count[i]`)
          WAITMS(50)
    description: "Display value distribution"
    
  - code: |
      ' Frequency response
      PUB freq_sweep() | freq, response
        REPEAT freq FROM 10 TO 10000 STEP 10
          set_frequency(freq)
          response := measure_response()
          DEBUG(`PLOT Frequency_Response, response`)
          WAITMS(10)
    description: "Plot frequency response"

v50_layer_commands:
  minimum_version: "v50"
  description: |
    V50 added layer and crop commands for bitmap display within PLOT windows.
    Allows loading BMP files into layer buffers and copying regions to the display.
    
  plot_layer:
    syntax: "DEBUG(`PLOT LAYER layer 'filename.bmp')"
    parameters:
      - name: "layer"
        type: "integer"
        range: "1-8"
        description: "Layer buffer number for bitmap storage"
      - name: "filename"
        type: "string"
        description: "Path to BMP image file"
    description: "Loads a bitmap file into one of 8 layer buffers"
    example: |
      DEBUG(`PLOT LAYER 1 'background.bmp')
      DEBUG(`PLOT LAYER 2 'sprites.bmp')
    notes:
      - "Up to 8 layers can be loaded simultaneously"
      - "Layers persist until window is closed or layer is replaced"
      - "BMP format only"
      
  plot_crop:
    syntax:
      - "DEBUG(`PLOT CROP layer AUTO x y)"
      - "DEBUG(`PLOT CROP layer left top width height)"
      - "DEBUG(`PLOT CROP layer left top width height x y)"
    parameters:
      - name: "layer"
        type: "integer"
        range: "1-8"
        description: "Source layer buffer"
      - name: "AUTO"
        type: "keyword"
        description: "Use full layer size"
      - name: "left, top"
        type: "integer"
        description: "Source coordinates in layer"
      - name: "width, height"
        type: "integer"
        description: "Size of region to copy"
      - name: "x, y"
        type: "integer"
        description: "Destination coordinates in plot"
    description: "Copies a rectangular region from a layer to the plot display"
    examples:
      - code: |
          ' Load background and copy entire layer to position (0,0)
          DEBUG(`PLOT LAYER 1 'bg.bmp')
          DEBUG(`PLOT CROP 1 AUTO 0 0)
        description: "Copy entire layer to display"
      - code: |
          ' Copy 32x32 sprite from layer 2 to position (100,50)
          DEBUG(`PLOT CROP 2 0 0 32 32 100 50)
        description: "Copy specific region with offset"
      - code: |
          ' Animated sprite using layer crops
          DEBUG(`PLOT LAYER 1 'spritesheet.bmp')
          REPEAT frame FROM 0 TO 7
            DEBUG(`PLOT CROP 1 frame*32 0 32 32 100 100)
            WAITMS(100)
        description: "Animation using sprite sheet regions"
    notes:
      - "Useful for game graphics and animated displays"
      - "Layer must be loaded before crop can reference it"
      - "Coordinates are in pixels"

