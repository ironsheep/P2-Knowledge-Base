display_type: SCOPE
category: DEBUG Display Types
description: |
  SCOPE is the P2 DEBUG analog-waveform (oscilloscope) window. It plots up to 8
  channels of a streamed sample series against time (Y vs sample index), with a
  level-based arm/fire trigger and holdoff. It is a time-domain plotter only: there
  is NO automatic measurement (no Vpp/RMS/frequency/period/duty/rise-fall), NO
  cursors, NO XY/phase mode (that is the separate SCOPE_XY window), and NO FFT
  overlay (FFT is its own window).
documentation_source: PNut v55 (DebugDisplayUnit.pas) via DEBUG-WINDOW-DIRECTIVE-MATRIX.md
documentation_level: comprehensive
source: "PNut/Spin2 v55 DebugDisplayUnit.pas (SCOPE display implementation: channel def, TRIGGER, Draw, Range; PC_MOUSE raw-pixel) + Parallax Spin2 Language Reference v51a (DEBUG displays); examples compile-verified with pnut_ts v1.55.0"

aliases:
  - oscilloscope
  - waveform
  - analog display
  - DEBUG SCOPE
  - SCOPE

syntax:
  create: "DEBUG(`SCOPE MyScope <config directives>)   ' config keys ONLY on the create line"
  channel_setup: "DEBUG(`MyScope <channel-def strings> {TRIGGER...} {HOLDOFF...})   ' SEPARATE message after create -- a channel-def on the create line prevents the window from being created"
  update: "DEBUG(`MyScope <sample longs / directives>)   ' reference the window by name"

configuration_directives:
  note: "Accepted in SCOPE_Configure (window creation)."
  TITLE: "TITLE 'string' -- window title. Default caption is '<name> - SCOPE', not a bare type name."
  string_quoting: "Display-command text (TITLE/SAVE/etc.) uses SINGLE quotes '...'; double quotes are silently ignored at runtime, no compile error. See statements/debug.yaml string_quoting."
  POS: "POS left top -- OPTIONAL window screen offset. Omit POS and the DEBUG display HOST places the window -- and WHERE it places it is TOOL-DEPENDENT, not a P2 behavior: some hosts auto-arrange windows so they do not overlap, others stack every window at the same origin (so all but one are hidden). Neither is guaranteed. Supply POS explicitly whenever the layout matters (i.e. any multi-window program). Hardware-verified: EF-043."
  SIZE: "SIZE width height -- pixels, each 32..2048 (default 256x256)"
  SAMPLES: "SAMPLES n -- horizontal resolution, 16..2048 (default 256)"
  RATE: "RATE n -- draw-rate divisor, 1..2048 (default 1)"
  DOTSIZE: "DOTSIZE n -- sample dot diameter, 0..32 (default 0 = no dots)"
  LINESIZE: "LINESIZE n -- trace line thickness, 0..32 (default 3 = lines). If both DOTSIZE and LINESIZE are 0, DOTSIZE is forced to 1."
  TEXTSIZE: "TEXTSIZE n -- label font point size, 6..200 (default 10)"
  COLOR: "COLOR back grid -- window background and grid colors (named or RGB24; default black, $404040). NOT per-channel color (that is set per channel-def)."
  HIDEXY: "HIDEXY -- suppress the on-screen XY readout (PC_MOUSE still reports)"
  packed: "Packing mode LONGS_1BIT..BYTES_4BIT (12 modes). THERE IS NO PACKING DEFAULT -- unless a packing mode is named on the create line, the window is UNPACKED and each transmitted long is one full 32-bit sample value. Packing sets how many sub-samples are packed per transmitted long/word/byte. Unlike LOGIC, each SCOPE sub-sample is a full per-channel VALUE (not one bit per channel): with multiple channels the sub-samples are applied to the channels in turn -- e.g. two channels A/B via LONGS_8BIT pack four 8-bit values per long (low byte first), applied A,B,A,B."

channel_definition:
  note: "Up to 8 channels, each defined by a quoted string. The channel-def(s) MUST be sent as a SEPARATE message AFTER the create line (handled by SCOPE_Update, before streaming). A channel-def placed ON the create line prevents the window from being created -- create with config keys only, then send the channel-def(s)."
  grammar: "'label' (AUTO | lo hi) {tall} {base} {grid} {color}"
  fields:
    label: "channel name string"
    range: "AUTO (auto-range) OR explicit lo hi int32 (default -$80000000 / $7FFFFFFF)"
    tall: "channel height in pixels (default = window height)"
    base: "vertical baseline offset (default 0)"
    grid: "4-bit mask: baseline / top / min-label / max-label (default 0)"
    color: "trace color (default DefaultScopeColors[channel])"

display_directives:
  note: "Accepted in SCOPE_Update (streaming to the named window)."
  numeric_data: "Sample longs -- the analog sample stream plotted as waveforms."
  TRIGGER: "TRIGGER channel (AUTO | arm fire) {offset} -- level-based trigger. channel -1..7 (-1 = free-run); AUTO auto-computes levels, or arm/fire are explicit level thresholds; offset 0..SAMPLES-1 (default SAMPLES/2). The offset is read back from the NEWEST sample at the RIGHT edge (the trace runs oldest-left -> newest-right), so the edge mapping is counter-intuitive: offset 0 = trigger at the RIGHT edge, showing the lead-up TO the trigger (pre-trigger view); offset SAMPLES-1 = trigger at the LEFT edge, showing what happens AFTER the trigger (post-trigger view); offset SAMPLES/2 = trigger centered. This is a level arm/fire trigger only -- not edge/window/external modes."
  HOLDOFF: "HOLDOFF n -- minimum samples between triggers, 2..2048 (default SAMPLES)"
  CLEAR: "CLEAR -- clear the bitmap and reset sample/rate counters"
  SAVE: "SAVE {WINDOW} 'filename' -- write a .bmp of the display area, or of the entire window if WINDOW is given, to <filename>.bmp. filename is REQUIRED; WINDOW optional."
  CLOSE: "CLOSE -- close (free) this named window; reclaims one of the 32 display slots. It is a COMMAND ONLY (takes no arguments), accepts MORE THAN ONE window name in a message, and is UPDATE-FIRST/CLOSE-SECOND: the rest of the message executes before the close, so `Win SAVE 'shot' CLOSE saves and THEN closes. Distinct from ending the whole DEBUG session via DEBUG(DEBUG_END_SESSION); see language/spin2/constants/debug-end-session.yaml"
  PC_KEY: "PC_KEY -- transmit the latched keypress LONG to the P2 (see pc_key.yaml)"
  PC_MOUSE: "PC_MOUSE -- transmit the mouse position+buttons LONG pair to the P2 (see pc_mouse.yaml)"

input:
  model: "Shared form-level input model (identical across all nine DEBUG display windows)."
  PC_KEY: "Universal -- see language/spin2/debug-commands/pc_key.yaml"
  PC_MOUSE: "PC_MOUSE transmits RAW client-pixel x,y (SCOPE has no scaled branch); the on-screen readout is plot-origin/Y-inverted but the wire value is raw pixels. See language/spin2/debug-commands/pc_mouse.yaml"

examples:
  - code: |
      ' Single auto-ranged channel. Create with config only, THEN declare the channel.
      DEBUG(`SCOPE MyScope SIZE 400 200 SAMPLES 256)   ' create (config keys only)
      DEBUG(`MyScope 'Signal' AUTO)                    ' declare channel 0 (separate message)
      REPEAT
        DEBUG(`MyScope `(value))
    description: "Single auto-ranging analog channel (channel declared after create)"
  - code: |
      ' Two channels with explicit vertical ranges
      DEBUG(`SCOPE Cmp SAMPLES 256)                       ' create
      DEBUG(`Cmp 'Raw' -2000 2000 'Filtered' -2000 2000) ' declare both channels (separate message)
      REPEAT
        DEBUG(`Cmp `(raw) `(filt))
    description: "Dual channel with fixed ranges (channels declared after create)"
  - code: |
      ' Level trigger on channel 0 with holdoff
      DEBUG(`SCOPE Trg SAMPLES 256)            ' create
      DEBUG(`Trg 'Ch0' -1000 1000)            ' declare channel 0 (separate message)
      DEBUG(`Trg TRIGGER 0 AUTO HOLDOFF 128)  ' configure the trigger (separate message)
      REPEAT
        DEBUG(`Trg `(adc))
    description: "Auto level trigger with holdoff (channel + trigger declared after create)"
  - code: |
      ' Packed full-window array feed. Each sub-sample is a full per-channel VALUE;
      ' two channels A/B interleave via LONGS_8BIT (four 8-bit values per long, low
      ' byte first). Build a full window, then feed the whole array in ONE message.
      VAR long buff[128]                          ' 128 longs x 4 values = 256 A,B sample-sets
      DEBUG(`SCOPE Sig SIZE 256 128 LONGS_8BIT)   ' create (config only)
      DEBUG(`Sig 'A' 0 255 'B' 0 255)             ' declare both channels (each needs a range)
      REPEAT
        REPEAT i FROM 0 TO 127
          buff[i] := pack_next_four_samples()     ' A,B,A,B as four low-first 8-bit values
        DEBUG(`Sig `uhex_long_array_(@buff, 128)) ' whole window, one message
    description: "Packed full-window array feed (LONGS_8BIT, two channels interleaved) -- fills a scrolling SCOPE window"

not_supported:
  - "No automatic measurements -- no peak-to-peak, RMS, frequency, period, duty cycle, or rise/fall time (these do not exist in the P2 SCOPE)."
  - "No measurement cursors (time/voltage/delta)."
  - "No XY / Lissajous / phase mode -- XY plotting is the SEPARATE SCOPE_XY window (display_type SCOPE_XY)."
  - "No FFT overlay -- frequency display is the separate FFT window."
  - "No Auto/Normal/Single trigger modes -- the only trigger is the level arm/fire (plus free-run via channel -1)."
  - "No window-trigger and no external trigger input -- the trigger source is a displayed channel 0..7 only."
  - "No GUI controls (play/pause, time-base selector, export-data, cursor controls) -- control is via the directives above."

notes:
  - "SCOPE is always time-domain (Y vs sample index); there is no mode selector."
  - "Channel color is set per channel-def, not by the COLOR directive (which sets window back + grid)."
  - "Samples are packed int32 per the packing mode; there is no float sample type."
  - "To FILL a scrolling SCOPE window with packed data, feed the whole window as an array in one message -- `uhex_long_array_(@buff, N)`; a single packed long fills only the first few sample columns. The trace runs oldest-left -> newest-right, so a partial buffer occupies the RIGHT edge (the newest samples), not the left."

