display_type: BITMAP
category: DEBUG Display Types
description: |
  BITMAP is the P2 DEBUG pixel/framebuffer window. It plots a streamed series of
  numeric pixel values into a w x h bitmap using one of 19 color modes, with scan
  patterns, optional magnified/sparse pixels, random-access (SET) and SCROLL
  positioning, and interactive PC_KEY/PC_MOUSE input. Maximum pixel depth is RGB24
  (24-bit) -- there is NO 32-bit/alpha mode, NO zoom/pan, NO animation engine, and
  NO sprites (sprites belong to the PLOT window).
documentation_source: PNut v55 (DebugDisplayUnit.pas) via DEBUG-WINDOW-DIRECTIVE-MATRIX.md
documentation_level: comprehensive
source: "PNut/Spin2 v55 DebugDisplayUnit.pas (BITMAP display implementation: 19 color modes, TRACE, SET/SCROLL; PC_MOUSE Y-inverted wire value) + Parallax Spin2 Language Reference v51a (DEBUG displays); examples compile-verified with pnut_ts v1.55.0"

aliases:
  - bitmap
  - image display
  - framebuffer
  - BITMAP
  - DEBUG BITMAP

syntax:
  create: "DEBUG(`BITMAP MyWin <config directives>)"
  update: "DEBUG(`MyWin <pixel longs / directives>)   ' reference the window by name"

configuration_directives:
  note: "Accepted in BITMAP_Configure (window creation)."
  TITLE: "TITLE 'string' -- window caption. Default caption is '<name> - BITMAP', not a bare type name."
  string_quoting: "Display-command text (TITLE/SAVE/etc.) uses SINGLE quotes '...'; double quotes are silently ignored at runtime, no compile error. See statements/debug.yaml string_quoting."
  POS: "POS left top -- OPTIONAL window screen offset. Omit POS and the DEBUG display HOST places the window -- and WHERE it places it is TOOL-DEPENDENT, not a P2 behavior: some hosts auto-arrange windows so they do not overlap, others stack every window at the same origin (so all but one are hidden). Neither is guaranteed. Supply POS explicitly whenever the layout matters (i.e. any multi-window program). Hardware-verified: EF-043."
  SIZE: "SIZE w h -- pixels, each 1..2048 (default 256x256)"
  DOTSIZE: "DOTSIZE x {y} -- pixel magnification, each 1..256 (default 1x1; y copies x). Client size = w*x by h*y."
  SPARSE: "SPARSE color -- sparse mode: each magnified pixel is drawn as a ROUND DOT on a SOLID BACKGROUND FILL of <color> (named/RGB24); -1 = off. It is NOT a grid border or an outline -- <color> fills the block BEHIND the dot. GATE: sparse rendering requires DOTSIZE >= 4; at DOTSIZE 3 or less it does not engage (hardware-verified, EF-042). Sparse renders far more slowly than the 1:1 path -- keep the logical canvas small."
  color_mode: "Color mode keyword -- one of 19, in this order: LUT1 LUT2 LUT4 LUT8 LUMA8 LUMA8W LUMA8X HSV8 HSV8W HSV8X RGBI8 RGBI8W RGBI8X RGB8 HSV16 HSV16W HSV16X RGB16 RGB24 (default RGB24). Max depth is RGB24 -- no 32-bit/alpha."
  LUTCOLORS: "LUTCOLORS c0..cN -- up to 256 RGB24 palette entries (LUT modes only). The LUT is ZERO-INITIALIZED: until LUTCOLORS loads it, every entry is $000000, so a LUT mode with no LUTCOLORS renders a uniformly BLACK picture (not random garbage). Load the palette before feeding LUT-mode pixel data."
  TRACE: "TRACE n -- 0..15 bitfield: bits 0-2 = scan pattern (0..7), bit 3 = scroll (default 0)"
  RATE: "RATE n -- pixels per refresh (CREATE LINE). Here -1 is substituted with w*h (whole frame) and 0 with width (h-scan) or height (v-scan) (default 0). NOTE the substitution is a CREATE-LINE behavior only -- see the runtime RATE under display_directives."
  packed: "Packing mode LONGS_1BIT..BYTES_4BIT (12 modes), with optional ALT and/or SIGNED modifiers"
  UPDATE: "UPDATE -- manual-refresh mode (output accumulates until a runtime UPDATE)"
  HIDEXY: "HIDEXY -- suppress the on-screen cursor readout (PC_MOUSE still reports)"

display_directives:
  note: "Accepted in BITMAP_Update (streaming to the named window)."
  numeric_data: "Pixel longs -- color-translated (per color mode) and packing-aware, plotted at the current trace position."
  color_mode: "A color-mode keyword may be sent mid-stream to change translation."
  LUTCOLORS: "Runtime palette replacement (LUT modes)."
  TRACE: "TRACE n -- mid-stream scan/scroll change; resets pixel position."
  RATE: "RATE n -- runtime pixels-per-refresh change. WARNING: the create-line substitution of -1/0 does NOT happen at runtime. A runtime RATE -1 (or 0) stores the value as-is, and the refresh counter -- which fires on an EQUALITY test against an ever-increasing count -- can then never match it, so auto-refresh FREEZES: pixels keep arriving and the display silently stops updating. It is not an error and is not reported. A runtime RATE with any positive count resumes refreshing. Hardware-verified: EF-052. (v55's own Feeding table advertises RATE -1 as a legal runtime directive -- it is the trap.)"
  SET: "SET x y -- random-access pixel position; x 0..w-1, y 0..h-1; CANCELS scroll."
  SCROLL: "SCROLL x y -- shift the bitmap; x -w..w (+x = right), y -h..h (+y = down); vacated area filled with background."
  CLEAR: "CLEAR -- fill with background, reset trace position, refresh (unless in UPDATE mode)"
  UPDATE: "UPDATE -- force a canvas refresh (needed in manual-refresh mode)"
  SAVE: "SAVE 'filename' | SAVE WINDOW 'filename' | SAVE l t w h 'filename' -- write the bitmap (or a region, or the whole window) to <filename>.bmp. The FILENAME IS REQUIRED in every form and must come LAST: a bare SAVE writes NOTHING (silently), and a keyword placed after SAVE is consumed and discarded (`Win SAVE CLEAR writes no file AND loses the CLEAR). In UPDATE mode SAVE captures the FRONT buffer -- i.e. the frame currently shown, not the one you have been drawing off-screen -- so send `UPDATE before SAVE or you will file the previous frame. PREFER THE PLAIN 'SAVE filename' FORM: it renders from the window's own bitmap, so it captures exactly that window's contents -- no chrome, and nothing overlapping it. The other two forms capture the SCREEN: SAVE WINDOW grabs the window's screen rectangle (frame included, and occlusion-vulnerable), and the l/t/w/h form grabs an arbitrary SCREEN region -- its coordinates are screen coordinates, NOT the window's POS coordinate space, so do not compute a SAVE region from a window's POS."
  CLOSE: "CLOSE -- close (free) this named window; reclaims one of the 32 display slots. It is a COMMAND ONLY (takes no arguments), accepts MORE THAN ONE window name in a message, and is UPDATE-FIRST/CLOSE-SECOND: the rest of the message executes before the close, so `Win SAVE 'shot' CLOSE saves and THEN closes. Distinct from ending the whole DEBUG session via DEBUG(DEBUG_END_SESSION); see language/spin2/constants/debug-end-session.yaml"

input:
  model: "Shared form-level input model (identical across all nine DEBUG display windows)."
  PC_KEY: "PC_KEY transmits one LONG = latched key byte (0 if none). See language/spin2/debug-commands/pc_key.yaml"
  PC_MOUSE: "PC_MOUSE transmits LONG1 = x(bits 0-12)/y(13-25)/wheel(26-27)/buttons(28-30) and LONG2 = pixel color under the cursor. GOTCHA: the wire Y is inverted (bottom-origin) vs the top-origin on-screen readout; coordinates are divided by DOTSIZE. See language/spin2/debug-commands/pc_mouse.yaml"

examples:
  - code: |
      ' 320x240 grayscale framebuffer, streamed by window name
      DEBUG(`BITMAP Screen SIZE 320 240 LUMA8)
      REPEAT
        DEBUG(`Screen `(pixel))
    description: "Grayscale (LUMA8) framebuffer"
  - code: |
      ' 16x16 magnified RGB24 heatmap with a sparse grid
      DEBUG(`BITMAP Heat SIZE 16 16 DOTSIZE 16 SPARSE $202020 RGB24)
      REPEAT
        DEBUG(`Heat `(color))
    description: "Magnified pixels drawn as round dots on a solid background fill (SPARSE)"

not_supported:
  - "No 32-bit / RGBA8888 / alpha pixel mode -- maximum depth is RGB24."
  - "The 16-bit mode is RGB16 (the 'RGB565' label is not a valid keyword)."
  - "No zoom or pan -- only integer DOTSIZE magnification."
  - "No animation/playback engine -- pixels are rate-gated streaming only."
  - "No histogram, color-picker, fit-to-window, 1:1-view, or grid-toggle controls -- SPARSE is a render-time dot-on-background effect, not a grid overlay."
  - "Pixel addressing follows the TRACE scan patterns -- there is no column-major buffer formula."
  - "No sprites -- SPRITE/SPRITEDEF belong to the PLOT window, not BITMAP."

notes:
  - "Pixel stream order follows the TRACE scan pattern; SET gives random access, SCROLL shifts the image."
  - "LUT color modes use the LUTCOLORS palette; max depth is RGB24."
  - "RATE -1 / RATE 0 are CREATE-LINE shorthands (whole frame / per scan-line). At RUNTIME they are NOT substituted and FREEZE auto-refresh instead (EF-052)."

related:
  - language/spin2/statements/debug.yaml
  - language/spin2/debug-commands/debug.yaml
  - language/spin2/debug-displays/plot.yaml
  - language/spin2/debug-displays/spectro.yaml
  - language/spin2/debug-displays/term.yaml
  - language/spin2/debug-commands/pc_key.yaml
  - language/spin2/debug-commands/pc_mouse.yaml
