statement: DEBUG
type: statement
description: |
  Interactive debugging statement that displays runtime data and visualizations.
  Uses backtick syntax to display variables, expressions, and formatted output
  in multiple display types including terminal, oscilloscope, logic analyzer, and more.
category: Debugging
documentation_source: Spin2 v51
documentation_level: comprehensive

syntax:
  basic: "DEBUG(`DISPLAY_TYPE WindowName <config>)   ' create a named display window, then stream to it by name"
  inline: "DEBUG(\"text\", value)   ' plain output to the default TERM -- no backtick needed"
  
display_types:
  - name: TERM
    description: "Terminal/text display (default)"
    usage: "DEBUG(`TERM MyTerm), then stream by name: DEBUG(`MyTerm `(value))"
    
  - name: SCOPE
    description: "Oscilloscope display for analog signals"
    usage: "DEBUG(`SCOPE MyScope), then DEBUG(`MyScope 'Ch' AUTO) to declare the channel (SEPARATE message -- a channel-def on the create line prevents creation), then DEBUG(`MyScope `(value))"
    
  - name: SCOPE_XY
    description: "XY / Lissajous (phase) display -- the separate XY-mode oscilloscope window"
    usage: "DEBUG(`SCOPE_XY MyXY 'XY'), then DEBUG(`MyXY `(x, y))"
    
  - name: LOGIC
    description: "Logic analyzer display for digital signals"
    usage: "DEBUG(`LOGIC MyLogic SAMPLES 64), then DEBUG(`MyLogic `(sample))"
    
  - name: PLOT
    description: "Real-time plotting display"
    usage: "DEBUG(`PLOT MyPlot SIZE 256 256), then DEBUG(`MyPlot SET 10 10 LINE 200 200)"
    
  - name: FFT
    description: "Fast Fourier Transform display"
    usage: "DEBUG(`FFT MyFFT), then DEBUG(`MyFFT 'Spectrum') to declare the channel (SEPARATE message -- with no channel declared the window shows nothing), then DEBUG(`MyFFT `(sample))"
    
  - name: SPECTRO
    description: "Spectrogram display"
    usage: "DEBUG(`SPECTRO MySpec SAMPLES 512), then DEBUG(`MySpec `(sample))"
    
  - name: BITMAP
    description: "Bitmap/image display"
    usage: "DEBUG(`BITMAP MyBmp SIZE 64 64 LUMA8), then DEBUG(`MyBmp `(pixel))"
    
  - name: MIDI
    description: "MIDI event display"
    usage: "DEBUG(`MIDI MyMidi), then DEBUG(`MyMidi $90 `(key, velocity))"

window_runtime_directives:
  note: "Directives streamed to a NAMED window after creation: DEBUG(`WindowName ...). See each debug-displays/*.yaml for the per-window set."
  CLEAR: "Clear the window contents"
  UPDATE: "Flush buffered output (windows in UPDATE mode)"
  SAVE: "Write the window bitmap to <name>.bmp"
  CLOSE: "Close (free) the named window. Distinct from DEBUG(DEBUG_END_SESSION), which ends the whole DEBUG session; see language/spin2/constants/debug-end-session.yaml"

formatting_functions:
  note: "Authoritative list + the underscore rule: language/spin2/debug-commands/debug-formatters-overview.yaml. There is NO plain DEC/HEX/BIN/STR/DLONG/DWORD/DBYTE -- only the U/S-prefixed numeric forms exist. Append _ for value-only output (no 'name = ' label); append _BYTE/_WORD/_LONG for size, _ARRAY for multiple values."
  numeric:
    - "UDEC(value) / SDEC(value) - unsigned / signed decimal"
    - "UHEX(value {, digits}) / SHEX(value) - unsigned / signed hexadecimal"
    - "UBIN(value {, digits}) / SBIN(value) - unsigned / signed binary"
    - "FDEC(value) - floating-point decimal"
  string:
    - "ZSTR(address) - zero-terminated string"
    - "LSTR(address, length) - length-specified string"
  special:
    - "DLY(ms) - inter-update pacing delay"
    - "PC_KEY / PC_MOUSE - read host keyboard / mouse (see debug-commands/pc_key.yaml, pc_mouse.yaml)"
    
control_characters:
  - "13 - Carriage return (new line)"
  - "9 - Tab"
  - "10 - Line feed"
  - "8 - Backspace"
  - "0 - Clear screen and home cursor (NOTE: code 12 does NOTHING -- it is not a form feed; clear with code 0 or the CLEAR keyword)"

string_quoting:
  rule: |
    The two DEBUG forms use OPPOSITE string-quote rules — a common silent-failure trap.
    Always apply the contrast, not just one side.
  non_backtick: |
    Plain (data/formatter) debug, e.g. debug("temp=", udec(x)): strings use DOUBLE
    quotes "...". A single quote ' starts a Spin2 comment here — it does NOT delimit a string.
  backtick_display: |
    Backtick (display) commands, e.g. debug(`BITMAP w TITLE 'My Window' SAVE 'shot'):
    display-command text arguments (window TITLE, SAVE/layer filenames, etc.) use SINGLE
    quotes '...'.
  silent_failure: |
    In a backtick display command a DOUBLE-quoted text argument is NOT recognized: the
    display engine ignores it and the title/filename is silently lost, with NO compile
    error. This silent failure is exactly why single quotes must be used for display text.
  value_substitutions: |
    Inside `(expr) value substitutions the rules revert to normal Spin2 (double-quoted
    strings); the single-quote rule applies only to display-command text.
  no_escape: |
    Display strings have no escape mechanism: the first ' closes the string, so a literal
    apostrophe cannot be embedded in a TITLE/SAVE/etc.
  save_extension: "SAVE auto-appends .bmp — give the base name only (SAVE 'shot' produces shot.bmp)."
  verified_against: "PNut/Spin2 compiler — backtick text emitted raw (debugTickString); host display parser recognizes only the apostrophe as a string delimiter (check_dd_str)."

window_placement:
  pos_optional: |
    The POS directive (window screen offset/position) is OPTIONAL on every display
    window. Omit POS to let the DEBUG display host auto-place the window. PNut-Term-TS
    auto-arranges multiple windows so they do not overlap, so omitting POS is the
    preferred approach for multi-window layouts; supply POS only when you need a
    specific on-screen position.

examples:
  - code: |
      ' Basic terminal output (plain DEBUG, no backtick, double-quoted text)
      DEBUG("Hello World", 13)
    description: "Display string with newline"
    
  - code: |
      ' Display variables with labels
      DEBUG("X = ", udec_(x), "  Y = ", udec_(y), 13)
    description: "Show labeled variable values"
    
  - code: |
      ' Oscilloscope: create the window, declare channels, then feed samples by name
      DEBUG(`SCOPE MyScope)                          ' create the window
      DEBUG(`MyScope 'Sensor' AUTO 'Filtered' AUTO)  ' declare channels (separate message)
      DEBUG(`MyScope `(sensor_value, filtered_value))
    description: "Display two signals on oscilloscope"
    
  - code: |
      ' Logic analyzer: create with named channels, then feed packed samples by name
      DEBUG(`LOGIC Signals 'clk' 'data' 'enable' 'ready')
      DEBUG(`Signals `(sample))
    description: "Display digital signals"
    
  - code: |
      ' Hexadecimal display with formatting
      DEBUG("Register: $", uhex_(register_value, 8), 13)
    description: "Display hex value with fixed width"
    
  - code: |
      ' Binary display with separators
      DEBUG("Flags: %", ubin_(flags, 16), 13)
    description: "Display binary with 16 bits"
    
  - code: |
      ' Multiple display types in program
      PUB test() | value
        value := 1000
        DEBUG(`TERM Status)                       ' create a TERM window
        DEBUG(`Status 'Starting test...', 13)     ' feed text by name (SINGLE quotes)
        DEBUG(`SCOPE Waveform)                    ' create a SCOPE
        DEBUG(`Waveform 'V' AUTO)                 ' declare the channel (separate message)
        DEBUG(`Waveform `(value))                 ' feed a sample by name
        DEBUG("Value = ", udec_(value), 13)       ' plain default-terminal output
    description: "Using multiple DEBUG displays"
    
  - code: |
      ' Conditional debugging
      IF error_flag
        DEBUG("ERROR: ", zstr_(@error_message), 13)
    description: "Debug output based on condition"
    
  - code: |
      ' Array display
      REPEAT i FROM 0 TO 9
        DEBUG("Array[", udec_(i), "] = ", udec_(array[i]), 13)
    description: "Display array contents"
    
  - code: |
      ' Real-time plotting of a value series (SCOPE is the time-series window; PLOT is a drawing canvas)
      DEBUG(`SCOPE Sensor)              ' create the window
      DEBUG(`Sensor 'Value' AUTO)      ' declare the channel (separate message)
      REPEAT
        sensor := read_sensor()
        DEBUG(`Sensor `(sensor))
        WAITMS(10)
    description: "Continuous plotting of a sensor series on a SCOPE window"

features:
  - "Non-blocking operation - doesn't halt program execution"
  - "Multiple simultaneous display windows"
  - "Real-time data visualization"
  - "Conditional compilation - can be disabled for production"
  - "Rich formatting options"
  - "Backtick syntax prevents string interpretation issues"
  - "Automatic type detection for variables"
  - "Configurable display properties per window"

usage_notes:
  - "DEBUG statements are processed at compile time"
  - "Each display type opens in its own window"
  - "Windows persist across program runs until closed"
  - "Use meaningful titles for multiple displays"
  - "Backtick introduces a DISPLAY command, e.g. DEBUG(`SCOPE ...); plain DEBUG(\"text\", value) needs no backtick and prints to the default TERM"
  - "Can be globally disabled with DEBUG_DISABLE directive"
  - "Performance impact is minimal when disabled"
  - "Useful for both development and field diagnostics"

best_practices:
  - "Use descriptive window titles"
  - "Group related data in same display"
  - "Remove or disable DEBUG statements in production code"
  - "Use appropriate display type for data being shown"
  - "Add newlines (13) for readable terminal output"
  - "Use formatting functions for consistent display"
  - "Consider performance impact of high-frequency DEBUG calls"

