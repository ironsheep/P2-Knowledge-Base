directive: LONG
name: Insert Long Data
description: Insert long (32-bit) data into the assembly image at the current origin
  at assembly time
syntax: LONG data{[count]}{, data{[count]}...}
examples:
- LONG  $12345678        ' Single long value
- LONG  -1, 0, 1         ' Multiple long values
- LONG  value[4]          ' Duplicate value 4 times
- LONG  @label            ' Address of label, an object offset in a Spin2 object
- LONG  %%3210            ' Quaternary literal
usage: 'LONG is used in DAT sections to define long-sized (32-bit) data values. Data

  is placed at the current assembly origin — in COG RAM, LUT RAM, or Hub RAM

  depending on the active ORG/ORGH mode. Multiple values can be specified separated

  by commas. Longs in hub RAM are stored in little-endian format.

  '
alignment: 'Longs may not be aligned unless preceded by ALIGNL.

  '
see_also:
- BYTE
- WORD
- ALIGNL
- RES
- language/pasm2/fvar.yaml
