# Spin2 language map: where each part of the language is documented.

aliases:
  - "Spin2 language map"
  - "Spin2 complete map"
  - "Spin2 coverage report"

spin2_language_complete_map:
  source: "Parallax Propeller 2 Spin2 Language Documentation v55, Spin2 Language"
  scope: "Which directory under language/spin2/ documents which part of the Spin2 language, and what each directory covers."

  areas:
    keywords:
      directory: "language/spin2/keywords/"
      covers:
        - "Block Structure (CON, DAT, OBJ, PUB, PRI, VAR)"
        - "Control Flow (IF, ELSE, CASE, REPEAT, etc.)"
        - "Data Types (BYTE, WORD, LONG, BYTEFIT, WORDFIT)"
        - "Built-in Functions (LOOKDOWN, LOOKUP variants)"
        - "Special (FILE, ORG, FIT)"

    operators:
      directory: "language/spin2/operators/"
      covers:
        - "Arithmetic (basic and floating-point)"
        - "Bitwise operations"
        - "Logical operations"
        - "Comparison (integer and float)"
        - "Assignment and swap"
        - "Special (ternary, CORDIC, etc.)"
        - "Float variants (+. -. *. /. and the float comparisons)"
        - "Operators that share a PASM2 instruction's name (BMASK, DECOD, etc.)"
        - "Precedence hierarchy"

    assembly_directives:
      directory: "language/spin2/assembly-directives/"
      covers:
        - "ALIGNL, ALIGNW - Alignment directives"
        - "ORG, ORGH, ORGF - Origin directives"
        - "FIT - Size constraint directive"
        - "RES - Space reservation"
        - "DITTO - Instruction repeat"

    registers:
      directory: "language/spin2/registers/"
      covers:
        - "I/O Registers (INA, INB, OUTA, OUTB, DIRA, DIRB)"
        - "Interrupt Vectors (IJMP1-3, IRET1-3)"
        - "General Purpose (PR0-PR7)"
        - "Pointers (PTRA, PTRB, PA, PB)"
        - "Task Management (TASKHLT)"

    debug_commands:
      directory: "language/spin2/debug-commands/"
      covers:
        - "Debug Control (DEBUG, DLY)"
        - "Numeric Formatting (UDEC, SDEC, UHEX, UBIN variants)"
        - "String Formatting (ZSTR, LSTR)"
        - "Boolean Formatting (BOOL)"
        - "Input Control (PC_KEY, PC_MOUSE)"

    special_symbols:
      directory: "language/spin2/special-symbols/"
      covers:
        - "Addressing symbols ($, $$, @, @@)"
        - "Method access operators"
        - "Number formatting symbols (%, %%)"
        - "Case range operators (.., ...)"

    system_variables:
      directory: "language/spin2/system-variables/"
      covers:
        - "CLKFREQ - System clock frequency"
        - "CLKMODE - Clock configuration mode"
        - "VARBASE - Variable base address"

    methods:
      directory: "language/spin2/methods/"
      covers:
        - "COG Control (coginit, cogstop, cogspin, etc.)"
        - "Pin Control (pinread, pinwrite, pinstart, etc.)"
        - "Memory Operations (bytemove, wordmove, longmove, etc.)"
        - "Timing Functions (waitct, waitms, waitus, etc.)"
        - "Math Functions (muldiv64, rotxy, polxy, etc.)"
        - "String Operations (strcomp, strcopy, strsize)"

    statements:
      directory: "language/spin2/statements/"
      covers:
        - "DEBUG"

    constructs:
      directory: "language/spin2/constructs/"
      covers:
        - "Control-flow and method constructs (IF/ELSEIF/ELSE, CASE, REPEAT, NEXT, QUIT, ABORT, method definition)"
        - "Blocks, inline PASM, register constants and escape strings"

    constants:
      directory: "language/spin2/constants/"
      covers:
        - "DEBUG_END_SESSION, DEBUG_MASK, NEWTASK, THISTASK and the special configuration symbols"

    concepts:
      directory: "language/spin2/concepts/"
      covers:
        - "Cross-cutting language topics (addressing, floating point, operators, inline PASM2, method pointers, type propagation, and others)"

    debug_displays:
      directory: "language/spin2/debug-displays/"
      covers:
        - "The DEBUG display windows (TERM, SCOPE, SCOPE_XY, LOGIC, PLOT, FFT, SPECTRO, BITMAP, MIDI)"

    symbols:
      directory: "language/spin2/symbols/"
      covers:
        - "Built-in symbols and streamer symbols"

  other_locations:
    fundamentals:
      directory: "language/fundamentals/"
      files:
        - "language/fundamentals/case-sensitivity.yaml - Case insensitivity rules"
        - "language/fundamentals/identifier-rules.yaml - Naming rules and limits"
        - "language/fundamentals/variable-scoping-best-practices.yaml - Scope hierarchy and conflict prevention"
        - "language/fundamentals/pasm-labels.yaml - PASM labels"
    conventions:
      directory: "language/spin2/conventions/"
      covers: "Comment forms and source-file layout conventions"
