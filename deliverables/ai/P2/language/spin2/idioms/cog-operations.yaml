name: Cog Management Idioms
description: Patterns for managing P2 cogs
category: cog_management

idioms:
  - name: get_cog_id
    pattern: "cogid()"
    description: Get current cog ID
    examples:
      - "cogid()"
      - "mycog := cogid()"
      - "if cogid() == 0"
    context: Identify which cog is executing current code

  - name: stop_cog
    pattern: "cogstop({cog_id})"
    description: Stop specified cog
    examples:
      - "cogstop(cog-1)"
      - "cogstop(mycog)"
      - "cogstop(0)"
    context: Stops the named cog

  - name: init_cog
    pattern: "coginit({mode}, @{code}, @{params})"
    description: Initialize cog with code and parameters
    examples:
      - "coginit(COGEXEC_NEW, @uart_mgr, @rxp)"
      - "coginit(cogexec_new, @uart_mgr, @rxp)"
      - "coginit(16, @entry, @stack)"
    context: Start cog with specific code and data

  - name: new_cog
    pattern: "coginit(COGEXEC_NEW, @{code}, @{params})"
    description: Start PASM code in an available cog; Spin2 methods start with COGSPIN(NEWCOG, method(), stack). COGNEW is not a Spin2 keyword.
    examples:
      - "coginit(COGEXEC_NEW, @driver, @params)"
      - "coginit(COGEXEC_NEW, @pasm_code, @mailbox)"
    context: Used as an expression term it returns the cog ID, or $8000_000F with no cog free and all 8 cogs running (test the result with < 0). Parallax's documents also give -1 for no cog free.

sources:
  - "Parallax Propeller 2 Spin2 Language Documentation v55, Built-In Methods (COGID, COGSTOP, COGINIT, COGSPIN), Built-In Symbols for COGINIT() and COGSPIN() Usage, DAT Cog-exec (COGINIT(16, ...))"
  - "P2 hardware verification, EF-120 (COGINIT(COGEXEC_NEW, ...) as an expression, all 8 cogs running, every call returned $8000_000F)"
  - "COGNEW is not a keyword: CP-057 (pnut-ts 1.55.10 refuses cognew(...) in a Spin2 method)"