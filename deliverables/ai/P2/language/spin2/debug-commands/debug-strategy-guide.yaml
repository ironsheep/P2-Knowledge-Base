title: "Debug Strategy Guide: Keeping a Debug Build Within the Compiler's Limits"
type: guide
category: Debugging
documentation_source: "Parallax Propeller 2 Spin2 Language Documentation v55, DEBUG (Things to know about the DEBUG system); DEBUG() memory utilization; DEBUG and interrupts"
documentation_level: comprehensive

aliases:
  - debug_strategy_guide
  - debug_record_limit
  - "DEBUG data is too long"
  - "too many records"
  - "record exceeds"
  - "debug data too long"
  - "debug byte budget"
  - "what a debug build costs"
  - "debug resource usage"

description: |
  Strategic guide for choosing the right debug mechanism in P2 projects.
  debug() statements compile into debug records. The compiler limits how many
  records a program may have, how large one record may be, and how much DEBUG
  data all of them may total. Those figures belong to the compiler and can change
  from one release to the next, so this guide states none of them: read the
  current figures from the compiler's own listing, and use the techniques below
  to stay well inside them. It explains which mechanisms reduce what is compiled
  (compile-time) versus which only suppress output (runtime).

oneliner: "Strategic guide for keeping P2 debug records and DEBUG data within the compiler's limits"

the_compilers_limits:
  what_is_limited:
    - "The number of distinct debug records in the program"
    - "The size of one debug record (one statement's encoded data)"
    - "The total DEBUG data of all records combined"
  how_you_find_out: |
    Compile with -d and a listing (pnut-ts -d -l). The listing reports the current
    usage and the current maximum for both totals, on the lines 'DEBUG records:'
    and 'DEBUG data:'. The figures are the compiler's own and can change with each
    release; read them from your compiler, never from a document.
  how_it_fails: |
    Past a limit, the build fails at compile time with 'DEBUG data is too long' and
    the reason: 'too many records ... (m153)', 'record exceeds ... bytes (m150)', or
    'total exceeds ... bytes (m151)'. The number inside the m151 message is not the
    listing's DEBUG data maximum; read the maximum from the listing.
  stay_well_inside: |
    Treat the listing's maximums as ceilings, not targets. A program that compiles
    right at a maximum has no room left for the next statement. Keep a margin, and
    use the techniques below before you need them.
  which_you_reach_first: |
    It depends on the SHAPE of the debug output, not on project size: many short
    statements use up records first; a few long formatted lines use up DEBUG data
    first. Watch both lines of the listing.
  what_debug_data_counts: |
    The literal text inside debug() calls, the labels of the labelled output
    commands, and per-statement overhead. DAT strings are NOT counted: prose moved
    into DAT and emitted with zstr_() leaves only the command bytes behind.
  binary_size_is_not_the_measure: |
    The difference between a -d and a non-d binary is not the DEBUG data figure: it
    also includes the debugger itself, which is present even with no debug
    statements at all. Use the listing.

reducing_bytes_and_records:
  description: |
    Too many BYTES and too many RECORDS are different problems. Some remedies help
    one and not the other; a few help both. Applying one that does not help your
    case changes nothing while looking like work.
  over_on_bytes:
    fix: "Move prose into DAT and emit it with zstr_() -- the text leaves DEBUG data entirely."
    also_helps: "Coalescing adjacent strings so one zstr_() replaces several saves the per-command bytes; it does not change the record count."
    does_not_help: "DEBUG_COGS and debug(IF(...)) -- both are runtime; IF adds bytes."
  over_on_records:
    fix: |
      Make statements byte-identical so the compiler deduplicates them. The value-only
      commands (the forms ending in "_", such as zstr_() and udec_()) store no label, so
      statements that differ only in the expression they print compile to ONE record:
      debug(zstr_(@a), udec(v)), the same with @b, and with @c are one record (the
      zstr_ pointer is not stored; the label "v" is the same in all three). A line
      formatted in a hub buffer and emitted with debug(zstr_(@buf)) is one record no
      matter how many call sites emit it. The labelled forms store the
      expression's name, so debug(udec(x)) and debug(udec(y)) stay two records.
    also_helps: |
      Merging statements: debug(udec(x), udec(y)) is one record where
      debug(udec(x)) followed by debug(udec(y)) is two.
    does_not_help: "DEBUG_COGS and debug(IF(...)) -- the records are still compiled."
  helps_both: "Moving prose into DAT and emitting it with value-only zstr_() both removes the text from DEBUG data and makes the statements identical enough to share one record."


what_a_debug_build_takes_from_your_program:
  why_this_is_here: |
    A -d build is not free and its costs are not in one place. Each line below is a
    resource the debugger takes that your program may already be using; every one of
    them has cost somebody a debugging session that was chasing the wrong thing.
  hub_memory: "The top 16 KB, $7C000..$7FFFF, remapped to $FC000..$FFFFF and write-protected. A buffer placed there works in a non-debug build and its writes are SILENTLY DROPPED in a debug build. See architecture/hub.yaml."
  protected_region_use: >-
    That 16 KB holds the program's DEBUG data, the debugger and its working space,
    and at its top, $FFC00..$FFFFF, one 128-byte block per cog (cog 7 at $FFC00
    through cog 0 at $FFF80), each a 64-byte buffer for registers $000..$00F followed
    by that cog's 64-byte initial debug ISR. The per-cog blocks are fixed in silicon
    (see architecture/debug_interrupt.yaml); how the debugger arranges the rest is
    its own and can change with the tool.
  a_lock: "LOCK[15] is held, so LOCKNEW has one fewer lock available — only when debugging. See architecture/locks.yaml."
  pins_62_63: "P62 (TX) and P63 (the clock-frequency repository). A clock change that does not rewrite P63 makes the debugger emit garbage."
  p62_is_reconfigured_by_every_debug_call: |
    Not merely occupied — RECONFIGURED. A smart pin placed on P62 is destroyed by the
    next debug() call. A counter on P62 can count correctly and still read as dead,
    because the print that reports it is what destroyed it: read such a pin BEFORE the
    program's first debug(), or do not put it on P62.
  cog_start_traffic: "A debug-enabled cog emits frames on P62 as it starts, which corrupts serial output from a program sharing that pin. A demo or shell that owns the serial line should not be built with -d."
  a_debug_interrupt_per_enabled_cog: "Every enabled cog takes the highest-priority interrupt at every COGINIT, with the register save and restore that implies — see DEBUG_COGS in language/spin2/constants/special-configuration-symbols.yaml. The default is all eight cogs."
  hubset_enables_locked: "The debugger applies the per-cog enables with HUBSET, whose L bit locks them until reset."
  interrupt_retrigger_can_stop_for_good: >-
    An interrupt requested during a DEBUG command runs after the DEBUG completes, but the
    response may be skewed so far that the ISR's own RETRIGGER SETUP does not happen
    properly -- and then the interrupt cycling stops permanently, not just late. High-
    frequency cyclical smart-pin interrupts are the prone case: an ISR that does AKPIN to
    drop the INA/INB signal so the next edge can re-arm it can miss that window entirely.
    This is the DEBUG cost that does not look like a timing cost, because the symptom is a
    working ISR that simply ceases. The fail-safe is to issue DEBUG commands only from
    cogs that are not running ISRs in the background; if the ISRs tolerate skew and
    nothing depends on the interrupt continuing to cycle, DEBUG is usable with understood
    timing degradation. CT-based interrupts are not prone to it.
  source: "Parallax Propeller 2 Spin2 Language Documentation v55, DEBUG (IF() inside DEBUG() statements; value-only '_' forms; Things to know about the DEBUG system, hub RAM use); DEBUG and interrupts (interrupt_retrigger_can_stop_for_good); protected_region_use: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), DEBUG INTERRUPT (upper-hub buffer; per-cog save/restore map). The compiler limits and listing behaviour (the_compilers_limits, reducing_bytes_and_records, mechanisms_overview, mechanism_details.debug_mask.per_object) were observed with pnut-ts 1.55.8 (-d -l listing lines and compile errors m150/m151/m153), 2026-10-07; figures deliberately not stated (Stephen, 2026-10-07: tool limits are soft and change with each compiler release -- teach the techniques, not the limits)"
  clock_source: "RCFAST and RCSLOW become illegal; DEBUG needs a crystal-derived clock of at least 10 MHz."
  measuring_with_debug_on: "If you are measuring anything timing-sensitive, restrict DEBUG_COGS to the reporting cog and report from a cog that is not measuring. Leaving the default corrupted streamer accumulators by 1,000,000-7,000,000."

deduplication:
  description: |
    The compiler automatically deduplicates identical debug records. Two calls
    to the exact same debug statement share one record.
  rules:
    - "Identical debug() calls in different locations share ONE record"
    - "debug(\"val=\", UDEC(x)) and debug(\"val=\", UDEC(y)) are DIFFERENT records: the labelled UDEC stores the expression's name. The value-only UDEC_(x) and UDEC_(y) store no name, so those two statements are one record."
    - "Repeated identical calls in a loop cost only one record"
  example:
    code: |
      PUB main()
        debug("tick")                 ' Record 1
        waitms(100)
        debug("tick")                 ' Reuses record 1 (identical content)
        waitms(100)
        debug("tock")                 ' Record 2 (different content)

mechanisms_overview:
  description: |
    The P2 debug system provides tools at three levels. Only COMPILE-TIME
    tools reduce what is compiled. Runtime tools still compile the debug
    record — they only suppress output at execution time.
  table:
    - mechanism: "-d compiler flag"
      level: compile-time
      reduces_record_count: "Yes (all or nothing)"
      reduces_debug_bytes: "Yes (all or nothing)"
      granularity: Global
      eliminates_code: true
      requires_code_changes: "No (build flag)"
      version_requirement: Base
    - mechanism: DEBUG_DISABLE
      level: compile-time
      reduces_record_count: "Yes (all or nothing)"
      reduces_debug_bytes: "Yes (all or nothing)"
      granularity: "Global (per source file)"
      eliminates_code: true
      requires_code_changes: "CON constant"
      version_requirement: Base
    - mechanism: "DEBUG_MASK + debug[N]()"
      level: compile-time
      reduces_record_count: "Yes (selective per channel)"
      reduces_debug_bytes: "Yes (masked channels add none)"
      granularity: "Per channel (32 channels)"
      eliminates_code: "Yes (disabled channels)"
      requires_code_changes: "CON constant + debug[N] syntax"
      version_requirement: "{Spin2_v46}"
    - mechanism: DEBUG_COGS
      level: runtime
      reduces_record_count: false
      reduces_debug_bytes: false
      granularity: "Per cog (8 cogs)"
      eliminates_code: false
      requires_code_changes: "CON constant"
      version_requirement: Base
    - mechanism: "debug(IF(...), ...) / debug(IFNOT(...), ...)"
      level: runtime
      reduces_record_count: false
      reduces_debug_bytes: "No -- the condition adds bytes"
      granularity: Per statement
      eliminates_code: false
      requires_code_changes: "Wrap each statement"
      version_requirement: Base

mechanism_details:
  compiler_flag:
    name: "-d compiler flag"
    description: |
      The -d (or --debug) flag is the master switch. Without it, ZERO debug
      records are compiled regardless of anything else in your source.
    when_to_use:
      - "Always required to enable any debug output"
      - "Omit for final production builds to guarantee zero debug overhead"
    examples:
      - code: |
          # Development: debug enabled
          pnut-ts -d myapp.spin2

          # Production: no debug code at all
          pnut-ts myapp.spin2

  debug_disable:
    name: DEBUG_DISABLE
    description: |
      Source-level kill switch. When set to any non-zero value, ALL debug
      statements are excluded from compilation, even when building with -d.
    when_to_use:
      - "Release builds from source: toggle without changing build command"
      - "Library/object files: disable debug so child object statements don't count against the parent's records"
      - "Quick toggling: change one constant and recompile"
    limitation: "All-or-nothing. Cannot keep error messages while removing verbose tracing."
    example:
      code: |
        CON
          RELEASE = 0                   ' Change to 1 for release
          DEBUG_DISABLE = RELEASE

        PUB main()
          debug("Starting up")          ' Compiled only when RELEASE = 0
          debug("Sensor: ", UDEC(val))  ' Compiled only when RELEASE = 0

  debug_mask:
    name: "DEBUG_MASK + debug[N]()"
    description: |
      32-bit constant where each bit enables a debug channel (0-31). Debug
      statements written as debug[N](...) are only compiled if bit N is set
      in the mask. Disabled channels compile no records and no code.
    requires: "{Spin2_v46} or later version directive"
    when_to_use:
      - "Large projects approaching the compiler's record limit"
      - "Multi-subsystem projects where you only need to debug one area at a time"
      - "Verbosity control: errors always visible, trace messages optional"
      - "Team projects where different developers debug different subsystems"
    critical_note: |
      Regular debug() statements (without a channel number) are NOT controlled
      by DEBUG_MASK. They compile whenever -d is used and DEBUG_DISABLE is not set.
      Use debug[N]() for everything you want to be maskable.
    per_object: |
      DEBUG_MASK belongs to the file that defines it, and a parent can set a child's
      mask at instantiation like any other overridable constant:
        OBJ  drv : "driver" | DEBUG_MASK = %1     ' enable the driver's channel 0
      With DEBUG_MASK = 0 defined in the child, it compiles no records on its own and
      its channel-0 statements with the override. A masked-off child adds no records
      AND no DEBUG data, which is what decides whether a large library is safe to include.
    example_subsystem:
      code: |
        {Spin2_v46}
        CON
          CH_ERROR  = 0                 ' Error reporting
          CH_MOTOR  = 1                 ' Motor control
          CH_SENSOR = 2                 ' Sensor readings
          CH_COMM   = 3                 ' Communication

          ' === CHANGE THIS LINE TO CONTROL WHAT COMPILES ===
          DEBUG_MASK = (1 << CH_ERROR) | (1 << CH_SENSOR)

        PUB main() | sensorVal, motorSpeed
          debug[CH_ERROR]("System OK")                       ' COMPILED (bit 0 set)
          debug[CH_SENSOR]("Temp: ", SDEC(sensorVal))        ' COMPILED (bit 2 set)
          debug[CH_MOTOR]("Speed: ", UDEC(motorSpeed))       ' SKIPPED (bit 1 clear)
          debug[CH_COMM]("Packet TX")                        ' SKIPPED (bit 3 clear)
    example_verbosity:
      code: |
        {Spin2_v46}
        CON
          LVL_ERROR = 0
          LVL_WARN  = 1
          LVL_INFO  = 2
          LVL_TRACE = 3

          VERBOSITY = 1                 ' Show errors and warnings only
          DEBUG_MASK = (1 << (VERBOSITY + 1)) - 1   ' = %11

        PUB main()
          debug[LVL_ERROR]("Fatal: null pointer")       ' COMPILED
          debug[LVL_WARN]("Buffer 90% full")             ' COMPILED
          debug[LVL_INFO]("Processing record 42")        ' SKIPPED
          debug[LVL_TRACE]("Entering subroutine X")      ' SKIPPED

  runtime_mechanisms:
    description: |
      These are useful but do NOT help you stay within the compiler's limits,
      because they still compile the debug record. They only suppress output.
    debug_cogs:
      description: |
        8-bit mask controlling which cogs produce debug output at runtime.
        Every debug statement on every cog is still compiled.
      example: |
        CON
          DEBUG_COGS = %00000001        ' Only cog 0 outputs debug
    debug_if:
      description: |
        Evaluates a condition at runtime and suppresses debug output if false.
        The debug record is still compiled.
      example: |
        PUB main() | errorCount
          debug(IF(errorCount > 0), "Errors: ", UDEC(errorCount))

decision_guide:
  description: "Choose your debug strategy by where the -d listing says you stand"
  scenarios:
    - condition: "The listing shows you well inside both maximums"
      recommendation: "Use regular debug() everywhere."
    - condition: "Your record or DEBUG data count is climbing toward a maximum"
      recommendation: |
        Use regular debug() but watch the listing. Write new subsystems with
        debug[N]() so you can mask them later, move prose into DAT with zstr_(),
        and prefer the value-only forms so repeated statements share a record.
    - condition: "You are near or over a maximum"
      recommendation: |
        USE DEBUG_MASK + debug[N](). Assign channels to subsystems. Enable
        only the channels you're actively debugging.
    - condition: "Shipping a release build"
      recommendation: |
        Either omit -d flag, or set DEBUG_DISABLE = 1. Both produce zero
        debug overhead.
    - condition: "Writing a reusable object/library"
      recommendation: |
        Use DEBUG_DISABLE in the object so its debug statements don't count
        against the parent project's records. Or use debug[N]() with documented
        channel assignments.
    - condition: "Multi-cog project with too much debug output at runtime"
      recommendation: |
        Use DEBUG_COGS to silence cogs you're not investigating. Use
        debug(IF(...), ...) / IFNOT for conditional runtime filtering. (These don't
        reduce what is compiled, only runtime output.)

recommended_setups:
  small_project:
    size: "Well inside the listing's maximums"
    code: |
      CON
        _clkfreq = 200_000_000

      PUB main()
        debug("System starting")
        debug("Sensor: ", SDEC(readSensor()))
        ' Just use regular debug() everywhere. Simple and effective.

  medium_project:
    size: "Several subsystems, counts climbing"
    code: |
      {Spin2_v46}
      CON
        _clkfreq = 200_000_000

        ' Channel assignments
        CH_MAIN   = 0
        CH_SENSOR = 1
        CH_MOTOR  = 2
        CH_COMM   = 3

        ' Enable channels you're currently debugging
        DEBUG_MASK = (1 << CH_MAIN) | (1 << CH_SENSOR)

      PUB main()
        debug[CH_MAIN]("System starting")                  ' Compiled
        debug[CH_SENSOR]("Temp: ", SDEC(readTemp()))        ' Compiled
        debug[CH_MOTOR]("PWM: ", UDEC(dutyCycle))           ' Skipped
        debug("CRITICAL: watchdog timeout!")                 ' Always compiled (no channel)

  large_project:
    size: "Many subsystems, near a maximum"
    code: |
      {Spin2_v46}
      CON
        _clkfreq = 200_000_000

        ' --- Debug channel plan ---
        ' Channels 0-3:  Core subsystems
        CH_ERROR  = 0
        CH_INIT   = 1
        CH_STATE  = 2
        CH_PERF   = 3

        ' Channels 4-7:  Hardware subsystems
        CH_SENSOR = 4
        CH_MOTOR  = 5
        CH_SERVO  = 6
        CH_LED    = 7

        ' Channels 8-11: Communication
        CH_UART   = 8
        CH_SPI    = 9
        CH_I2C    = 10
        CH_CAN    = 11

        ' === ACTIVE DEBUG SELECTION ===
        DEBUG_MASK = (1 << CH_ERROR) | (1 << CH_SENSOR) | (1 << CH_I2C)

        DEBUG_COGS = %00000011        ' Only debug cogs 0 and 1 at runtime
        DEBUG_DELAY = 500             ' Give terminal time to connect

      PUB main()
        debug[CH_INIT]("Boot complete")                     ' Skipped
        debug[CH_ERROR]("Self-test passed")                 ' Compiled
        debug[CH_SENSOR]("Accel X: ", SDEC(ax))             ' Compiled
        debug[CH_MOTOR]("RPM: ", UDEC(rpm))                 ' Skipped
        debug[CH_I2C]("ACK from $", UHEX_BYTE(addr))       ' Compiled

common_mistakes:
  - mistake: "Using debug(IF(...), ...) to manage record count"
    explanation: |
      debug(IF(condition), ...) still compiles the record. It only suppresses
      runtime output. If you're hitting the record limit, IF() won't help.
    solution: "Use DEBUG_MASK + debug[N]() instead"
  - mistake: "Forgetting that regular debug() ignores the mask"
    explanation: |
      DEBUG_MASK = 0 disables all channels, but debug("hello") still compiles.
    solution: "Use debug[N]() syntax for statements you want to be maskable"
  - mistake: "Not defining DEBUG_MASK before using debug[N]()"
    explanation: |
      Writing debug[0]("test") without defining DEBUG_MASK causes a compile error.
    solution: "Always define the mask constant, even if set to $FFFF_FFFF"
  - mistake: "Expecting labelled statements with different variables to deduplicate"
    explanation: |
      debug("x=", UDEC(x)) and debug("x=", UDEC(y)) are different records: the
      labelled UDEC stores the expression's name. Deduplication only works when the
      entire record is byte-for-byte identical.
    solution: "Use the value-only forms (UDEC_, zstr_) where repeated statements should share a record"
  - mistake: "Treating the listing's maximum as a target"
    explanation: |
      A build that compiles right at a maximum has no room for the next statement,
      and the limits are the compiler's own -- a newer compiler may draw them
      differently.
    solution: "Keep a margin; apply the reducing_bytes_and_records techniques early"

notes:
  - "Which limit you reach first depends on the shape of the output: many short statements use up records first; a few long formatted lines use up DEBUG data first. Read both lines from the -d listing."
  - "Only COMPILE-TIME mechanisms reduce what is compiled"
  - "Runtime mechanisms (DEBUG_COGS, IF()/IFNOT() inside debug()) still compile their records"
  - "Regular debug() without channel number always compiles — use sparingly for critical messages"
  - "Plan channel assignments early in large projects"
  - "The compiler deduplicates byte-for-byte identical debug records automatically"

