command: "PC_KEY"
type: debug_command
category: "Debug Control"
documentation_source: Spin2 v51 (debug-section.txt) + PNut v55 directive matrix
documentation_level: comprehensive
source: "Parallax Spin2 Language Reference v51a (PC_KEY P2-side API + key-code table); host-side key handling per PNut/Spin2 v55 DebugDisplayUnit.pas"

syntax: "PC_KEY(pointer_to_long)"

pointer:
  spin2: "The long must be in hub RAM -- pass @key."
  pasm2: "The long must be a cog register -- pass #key."

returns:
  long: "key -- the keypress code (0 if no keypress)"

key_codes:
  0: "no keypress"
  1: "Left Arrow"
  2: "Right Arrow"
  3: "Up Arrow"
  4: "Down Arrow"
  5: "Home"
  6: "End"
  7: "Delete"
  8: "Backspace"
  9: "Tab"
  10: "Insert"
  11: "Page Up"
  12: "Page Down"
  13: "Enter"
  27: "Esc"
  "32..126": "Space to \"~\" -- all printable ASCII (symbols, digits, letters)"

examples:
  - code: |
      ' Spin2: read keypresses from a TERM window (long in hub)
      VAR
        long key
      PUB main()
        DEBUG(`TERM MyTerm)
        REPEAT
          DEBUG(`MyTerm `PC_KEY(@key))       ' note the 2nd backtick; PC_KEY must be last
          IF key
            handle_key(key)
    description: "Read host keypresses into a Spin2 hub long"

notes:
  - "PC_KEY returns one LONG; the keyboard mapping is the same in all nine windows (no per-window keyboard differences)."
  - "Non-printable keys map to the small control codes above (1..13); printable keys map to their ASCII value (32..126); Esc = 27."

related:
  - language/spin2/debug-commands/pc_mouse.yaml
  - language/spin2/debug-displays/plot.yaml
