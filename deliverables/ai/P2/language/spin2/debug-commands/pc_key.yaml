command: "PC_KEY"
type: debug_command
category: "Debug Control"
documentation_source: Spin2 v51 (debug-section.txt) + PNut v55 directive matrix
documentation_level: comprehensive
source: "Parallax Spin2 Language Reference v51a (PC_KEY P2-side API + key-code table); host-side key handling per PNut/Spin2 v55 DebugDisplayUnit.pas"

syntax: "PC_KEY(pointer_to_long)"

description: |
  PC_KEY reads the host PC's keyboard into the P2 from within a graphical DEBUG()
  display. Spin2 v55 states it as: "FOR USE IN GRAPHICAL DEBUG() DISPLAYS - Must be
  the last command in a DEBUG() statement. Returns any new host-PC keypress that
  occurred within the last 100ms into a long inside the chip. The DEBUG() Display
  must have focus for keypresses to be noticed."
  The 100 ms latch is what sets the poll rate: a loop that polls more slowly than
  that will miss keypresses, and one that polls faster simply reads 0 between them.
  Source: engineering/ingestion/sources/spin2-v55/spin2-v55-text.txt:1004

usage_rules:
  source: "Parallax Spin2 Documentation v55 -- PC_KEY entry engineering/ingestion/sources/spin2-v55/spin2-v55-text.txt:1004; backtick-escape mechanism :1084 and :1094"
  rules:
    - "FOR USE IN GRAPHICAL DEBUG() DISPLAYS."
    - "Must be the last command in a DEBUG() statement."
    - "The DEBUG() Display must have focus for keypresses to be noticed."
    - "Returns any new host-PC keypress that occurred within the last 100ms; otherwise the long reads 0."
    - "If used in Spin2 code, the long must be in the hub (use @key as the pointer). If used in PASM code, the long must be a cog register (use #key as the pointer)."
  backtick_rule:
    why: |
      Inside a backtick display message the source states that everything is text
      unless a further backtick escapes it back into a command: "This syntax is
      invoked when the first character in the DEBUG() command is the backtick. This
      causes everything in the DEBUG() command to be viewed as a string, except when
      subsequent backticks act as 'escape' characters to allow normal or shorthand
      DEBUG() commands." (:1084) — and "Regular DEBUG() commands can follow the
      backtick, as well." (:1094)
    consequence: |
      PC_KEY needs its OWN backtick inside a display message —
      DEBUG(`MyTerm `PC_KEY(@key)). Written without it, the text is sent to the
      window as literal characters, no command runs, and the long is never written.
      It compiles clean, so the failure is silent and only visible at runtime.


pointer:
  spin2: "The long must be in hub RAM -- pass @key."
  pasm2: "The long must be a cog register -- pass #key."

returns:
  long: "key -- the keypress code (0 if no keypress)"

key_codes:
  0: "no keypress"
  1: "Left Arrow"
  2: "Right Arrow"
  3: "Up Arrow"
  4: "Down Arrow"
  5: "Home"
  6: "End"
  7: "Delete"
  8: "Backspace"
  9: "Tab"
  10: "Insert"
  11: "Page Up"
  12: "Page Down"
  13: "Enter"
  27: "Esc"
  "32..126": "Space to \"~\" -- all printable ASCII (symbols, digits, letters)"

examples:
  - code: |
      ' Spin2: read keypresses from a TERM window (long in hub)
      VAR
        long key
      PUB main()
        DEBUG(`TERM MyTerm)
        REPEAT
          DEBUG(`MyTerm `PC_KEY(@key))       ' note the 2nd backtick; PC_KEY must be last
          IF key
            handle_key(key)
    description: "Read host keypresses into a Spin2 hub long"

notes:
  - "PC_KEY returns one LONG; the keyboard mapping is the same in all nine windows (no per-window keyboard differences)."
  - "Non-printable keys map to the small control codes above (1..13); printable keys map to their ASCII value (32..126); Esc = 27."

related:
  - language/spin2/debug-commands/pc_mouse.yaml
  - language/spin2/debug-displays/plot.yaml
