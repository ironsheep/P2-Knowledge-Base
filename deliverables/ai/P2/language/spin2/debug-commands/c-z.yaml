formatter: C_Z
aliases:
  - "C_Z"
  - "DEBUG C_Z"
  - "debug command C_Z"
  - "debug carry and zero flags"
type: debug_formatter
category: Debug Flag Formatters

requires_version: "Spin2_v46"
version_directive: "{Spin2_v46}"

description: |
  Debug formatter that outputs the states of the Carry (C) and Zero (Z)
  flags, in the form "C=n Z=n" where n is 0 or 1. It compiles in a Spin2
  DEBUG statement (built with DEBUG enabled, pnut-ts -d). Written inside PASM
  (a DAT block, or inline ORG..END), DEBUG(C_Z) is rejected: Expected "(".
  REQUIRES: {Spin2_v46} or later version directive at start of source file.

syntax:
  basic: "DEBUG(C_Z)"
  with_label: "DEBUG(\"Flags: \", C_Z)"

output_format: "C=n Z=n"

output_values:
  C: "0 or 1 (Carry flag state)"
  Z: "0 or 1 (Zero flag state)"

examples:
  - code: |
      {Spin2_v46}                              ' REQUIRED directive
      PUB flag_demo() | x
        x := 0
        DEBUG(C_Z)
        x := 1
        DEBUG(C_Z)
    description: "A Spin2 DEBUG statement that outputs C_Z"

  - code: |
      {Spin2_v46}                              ' REQUIRED directive
      PUB inline_asm_debug() | a, b
        a := $FFFFFFFF
        b := 1
        org
              add     a, b        wcz         ' Add with flag update
        end
        DEBUG("After ADD: ", C_Z)
    description: "C_Z in a Spin2 DEBUG statement placed after an inline-assembly block"

  - code: |
      {Spin2_v46}                              ' REQUIRED directive
      PUB test_compare() | x, y
        x := 100
        y := 200
        org
              cmp     x, y        wcz         ' Compare sets flags
        end
        DEBUG("x vs y: ", C_Z)
    description: "C_Z in a Spin2 DEBUG statement placed after an inline-assembly compare"

  - code: |
      {Spin2_v46}                              ' REQUIRED directive
      PUB shift_debug() | value
        value := %00000001
        org
              shl     value, #8   wcz         ' Shift left, check for overflow
        end
        DEBUG("After SHL: ", C_Z, " Value: ", UHEX(value))
    description: "C_Z combined with other DEBUG formatters in one statement"

  - code: |
      {Spin2_v46}                              ' REQUIRED directive
      PUB conditional_debug() | value
        value := some_operation()
        if value == 0
          DEBUG("Value is ZERO - ", C_Z)
        else
          DEBUG("Value is NON-ZERO - ", C_Z)
    description: "C_Z in the branches of a conditional DEBUG"

flag_meanings:
  carry_flag:
    description: "Set when arithmetic operation produces carry/borrow"
    set_when:
      - "ADD overflow"
      - "SUB/CMP when second operand > first"
      - "Shift out of MSB/LSB"
      - "Various PASM2 operations with WC"
    cleared_when:
      - "No carry/borrow occurred"
      - "Explicitly cleared"
      
  zero_flag:
    description: "Set when operation result equals zero"
    set_when:
      - "Result of operation is exactly 0"
      - "TEST finds no matching bits"
      - "Various PASM2 operations with WZ"
    cleared_when:
      - "Result is non-zero"
      - "Explicitly cleared"

notes:
  - "REQUIRES {Spin2_v46} or later at start of source file; without the directive (or under v45) DEBUG(C_Z) in Spin2 is rejected: Expected an expression term"
  - "Compile with DEBUG enabled (pnut-ts -d)"
  - "In Spin2 DEBUG(C_Z) compiles; in PASM (DAT block or inline ORG..END) DEBUG(C_Z) is rejected with Expected \"(\" even under {Spin2_v55}, although the same PASM DEBUG site accepts other formatters such as UHEX"
  - "The Spin2 Language Documentation describes C_Z as useful in PASM code; that use does not compile"
  - "What C_Z prints in a Spin2 statement is not established here"
  - "C_Z has no underscore variant (always shows both labels)"
  - "Combine with other formatters for complete state display"

related:
  - language/spin2/statements/debug.yaml
  - language/spin2/constants/debug-mask.yaml
  - language/spin2/assembly-directives/org.yaml
  - language/spin2/constructs/inline_pasm.yaml

see_also:
  - "Debug formatters"
  - "Inline assembly"
  - "PASM2 flag operations"
  - "Conditional execution"

source: "Parallax Propeller 2 Spin2 Language Documentation v55, DEBUG section and version history v46; CP-004"

oneliner: "Output Carry (C) and Zero (Z) flag states in a Spin2 DEBUG statement (requires Spin2_v46; not accepted in PASM)"
