title: JonnyMac Spin2 Source Conventions
id: johnny-mac-documentation-style
aliases:
  - "JonnyMac programming standard"
  - "Spin2 conventions JonnyMac"
  - "Spin2 coding conventions"
style_name: JonnyMac source conventions, as shown in two community objects
source: "OBEX 2842 (Full Duplex Serial, jm_fullduplexserial.spin2, Jon McPhalen); OBEX 2824 (NEC RX, jm_nec_rx_demo.spin2, Jon McPhalen)"
basis: "Conventions observed in OBEX 2842 and OBEX 2824, community objects by Jon McPhalen (jonnymac); not a Parallax publication. Where those two objects do not show a rule, this page does not state one."
summary: Layout, naming, indentation and comment conventions that OBEX 2842 and OBEX 2824 follow

description: |
  OBEX 2842 (Full Duplex Serial, jm_fullduplexserial.spin2) is a driver object and OBEX 2824
  (NEC RX, jm_nec_rx_demo.spin2) is a demo program that uses it. Both are written by Jon McPhalen
  in one consistent style. This page records what that style is, item by item, as the two
  source files show it. Each convention names the object(s) that show it.

  Spin2 is case-insensitive (see language/fundamentals/case-sensitivity.yaml), so every case
  rule below is a matter of style, not of compiler behavior.

file_header:
  source: "OBEX 2842 (Full Duplex Serial) and OBEX 2824 (NEC RX), file header comment"
  layout: |
    The file opens with a comment banner made of '' lines between two rule lines of "=" characters.
    Inside the banner, one labelled field per line:
      File.......  the file name
      Purpose....  one-line purpose (OBEX 2842 adds "--" continuation lines)
      Author(s)..  OBEX 2842 "Authors" and OBEX 2824 "Author"; names the author, and OBEX 2842
                   adds "-- based on work by Chip Gracey"
      E-mail.....  contact address
      Started....  left empty in both objects
      Updated....  date; OBEX 2842 adds a "--" line describing the change
    OBEX 2824 also carries a Copyright line, and both objects write "see below for terms of use".
    The marker {$P2} is the last field line, before the closing rule line.
  license_block: "Both objects end with a block labelled con { license } holding a {{ ... }} comment that starts 'Terms of Use: MIT License' and gives the MIT permission text."
  note: "File headers and license text are covered by language/spin2/conventions/p2-source-file-organization-standard.yaml."

block_layout:
  source: "OBEX 2842 (Full Duplex Serial) and OBEX 2824 (NEC RX), block structure"
  rules:
    - "Block keywords are lowercase: con, obj, var, pub, pri, dat."
    - "A con or dat block carries a short lowercase label in braces after the keyword: con { fixed io pins }, con { timing }, con { app io pins }, con { pst / formatting }, con { license }, dat { smart pin uart/buffer manager }. Some blocks are unlabelled (con, obj, var)."
    - "One blank line follows the block keyword line; entries are indented two spaces."
    - "Two blank lines separate blocks, and two blank lines separate methods."
  order_observed: "OBEX 2842: header, doc comment, con blocks, obj, var, pub and pri methods, dat (PASM2), con { license }. OBEX 2824: header, con blocks, obj, dat, var, pub methods, con { license }."

indentation_and_width:
  source: "OBEX 2842 (Full Duplex Serial) and OBEX 2824 (NEC RX), method bodies and block entries"
  indentation: "Two spaces per level, in block entries and in method bodies and nested statements. No tabs."
  line_width: "No line of OBEX 2842 or of OBEX 2824 (jm_nec_rx_demo.spin2) is longer than 100 characters; the longest lines are exactly 100 (the header rule lines, and in OBEX 2842 the rule line above the PASM2 variables)."
  statements: "Conditions are written in parentheses: if (rxtail <> rxhead), repeat while (rxtail == rxhead), elseif (c == \"\\\"). OBEX 2824 also writes if not (ir.sensor_check())."
  keywords: "Every Spin2 keyword and built-in method is lowercase in both objects: repeat, if, elseif, quit, return, case, coginit, cogstop, longmove, longfill, muldiv64, pinstart, getct, waitct, waitms, strsize, lookdown, abs."

naming:
  source: "OBEX 2842 (Full Duplex Serial) and OBEX 2824 (NEC RX), declarations"
  constants:
    style: "UPPERCASE; words separated by underscores; digits allowed"
    observed: ["BUF_SIZE", "PGM_RX", "CLK_FREQ", "MS_001", "US_001", "BR_TERM", "CRSR_XY", "CLS", "LED1", "RX1", "IR_SENSE"]
    pin_names: "Pin numbers are constants and carry a direction tag in braces after the value: IR_SENSE = 15  { I }, SF_CS = 61  { O }."
    enumerations: "OBEX 2824 declares enumerations with # lists: #true, ON, OFF and #false, NO, YES."
    clock_symbol: "OBEX 2824 sets the system clock with the lowercase special symbol _clkfreq = CLK_FREQ, where CLK_FREQ = 200_000_000 is an ordinary constant."
  variables:
    style: "lowercase; most names are single words joined together (rxhead, rxtail, txdelay, rxbuf); a one- or two-letter name is used for short locals"
    observed: ["cog", "rxp", "txp", "rxhub", "rxhead", "txdelay", "rxbuf", "pbuf", "ircog"]
    declaration: "The type (long, byte) is lowercase, followed by two spaces and then the name; in OBEX 2842 most variables have a trailing comment."
    pointers: "A parameter that holds an address is prefixed p_: p_str, p_args."
    locals: "Locals follow the | after the signature and are short lowercase names: | idx, c, asc, field."
  objects:
    style: "lowercase instance names, short: nstr, ir, term"
    files: "The referenced object files are lowercase with a jm_ prefix: \"jm_nstr\", \"jm_nec_rx\", \"jm_fullduplexserial\"."
    cog_marker: "OBEX 2824 marks objects that start a cog with a leading * in the comment and explains the mark under the block: '* uses cog when loaded'. The master Spin cog is listed in a comment line: ' main  ' * master Spin cog."
  methods:
    style: "lowercase. A single word where one will do (start, stop, tx, rx, str, available, rxcheck, txflush, padstr, substr, tstart); underscores between words when several are needed (fmt_number, get_hex, get_nargs, wait_for_terminal)"
    signature: "Parentheses are always written, even with no parameters: pub null(), pub stop(), pub setup(). A result is declared after a colon, lowercase: : b, : count, : result, : p_str1, value."
    first_methods: "OBEX 2824 begins with pub main(), which calls setup() first; OBEX 2842 begins with pub null() (doc: 'This is not a top-level object')."
  data_labels: "A DAT data label is capitalised: Banner (OBEX 2824). PASM2 labels and registers are lowercase: uart_mgr, uart_main, rx_serial, rxd, t1, p_rxbuf."

comments:
  source: "OBEX 2842 (Full Duplex Serial) and OBEX 2824 (NEC RX), comment placement"
  method_documentation: "A method's documentation is written with '' (two apostrophes) lines. The signature line is followed by ONE blank line, then the '' lines, then one blank line, then the body."
  doc_continuations: "Extra lines start with '' -- . Parameters may be listed with dots filling the name column ('' -- rxpin... receive pin), and a value table continues on '' lines aligned under the text."
  not_every_method: "Not every method has documentation: lower() in OBEX 2842 and main(), setup() and wait_for_terminal() in OBEX 2824 have none."
  trailing_comments: "A single apostrophe. Trailing comments start in column 65 in both objects (declarations, statements and PASM2; one comment in OBEX 2842 starts in column 64), lowercase, without a closing period."
  section_comments: "OBEX 2842 puts a full-width rule line (apostrophe then dashes) between the PASM2 code and its res variables."

pasm2_layout:
  source: "OBEX 2842 (Full Duplex Serial), dat { smart pin uart/buffer manager }"
  rules:
    - "The dat block opens with org, then code."
    - "Labels start in column 1 and are lowercase with underscores (uart_mgr, uart_main, rx_serial)."
    - "The instruction mnemonic starts in column 17 and the first operand in column 27."
    - "A WC or WZ effect sits in column 57; the trailing comment starts in column 65."
    - "A conditional prefix (if_nc, if_e, if_c) and the _ret_ prefix are indented four spaces, ahead of the mnemonic column."
    - "Two blank lines separate routines. Working registers are declared with res after a rule line, and the block ends with fit 496."
    - "Comments describe what a step means, not what the mnemonic does, and use := to state the effect: ' t1 := @rxbuf, ' rxbuf[rxhead] := t3. Not every instruction has a comment."

example_documented_method:
  source: "OBEX 2842 (Full Duplex Serial), pub start()"
  note: "Excerpt: signature, one blank line, documentation, one blank line, body."
  code: |
    pub start(rxpin, txpin, mode, baud) : result | baudcfg, spmode

    '' Start simple serial coms on rxpin and txpin at baud
    '' -- rxpin... receive pin (-1 if not used)
    '' -- txpin... transmit pin (-1 if not used)
    '' -- mode.... %0xx1 = invert rx
    ''             %0x1x = invert tx
    ''             %01xx = open-drain/open-source tx

      stop()

example_program:
  source: "Layout shown by OBEX 2824 (NEC RX): con blocks, var block, main() calling setup(). The program itself is illustrative, not part of either object."
  code: |
    con { timing }

      CLK_FREQ = 200_000_000                                        ' system freq as a constant
      MS_001   = CLK_FREQ / 1_000                                   ' ticks in 1ms

      _clkfreq = CLK_FREQ                                           ' set system clock


    con { app io pins }

      LED1     = 56  { O }                                          ' Eval and Edge LEDs


    var

      long  blinks                                                  ' number of blinks so far


    pub main()

      setup()

      repeat
        pinhigh(LED1)
        waitms(125)
        pinlow(LED1)
        waitms(125)
        ++blinks


    pub setup()

    '' Prepare the application
    '' -- clears the blink count

      blinks := 0

known_issues:
  - "OBEX 2842 declares a local named field in format(). FIELD is now a reserved Spin2 word, so the object as published does not compile with the current compiler until that local is renamed."

