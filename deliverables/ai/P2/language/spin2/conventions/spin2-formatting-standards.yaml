title: Spin2 Formatting Conventions
id: spin2-formatting-standards
aliases:
  - "Spin2 formatting conventions"
  - "Spin2 formatting standards"
version: 1.0.0
layer: "Layer 2 - Formatting"
source: "Parallax Propeller 2 Spin2 Language Documentation v55, Comments and Flow Control; OBEX 2842 (Full Duplex Serial, jm_fullduplexserial.spin2, Jon McPhalen); OBEX 2824 (NEC RX, jm_nec_rx_demo.spin2, Jon McPhalen)"
purpose: The source-file layout two community Spin2 objects share, and the language rules that bear on layout
applies_to: Spin2 source files

summary: |
  Spin2 itself fixes two things about layout: how comments are written and that indentation
  decides which code belongs to a flow-control construct. Everything else on this page is
  layout that OBEX 2842 and OBEX 2824 (community objects by Jon McPhalen, not Parallax
  publications) both follow. Where the two objects do not show a rule, this page does not
  state one. The naming and comment-wording conventions are in
  language/spin2/conventions/johnny-mac-documentation-style.yaml.

language_rules:
  comments:
    source: "Parallax Propeller 2 Spin2 Language Documentation v55, Comments"
    to_end_of_line: "An apostrophe starts a comment that runs to the end of the line."
    documentation_to_end_of_line: "Two apostrophes start a documentation comment that runs to the end of the line; its text goes into the documentation file."
    braces: "Text inside single braces is a comment, including across line ends; text inside double braces is the same kind of comment and its text goes into the documentation file."
  indentation:
    source: "Parallax Propeller 2 Spin2 Language Documentation v55, Flow Control"
    rule: "IF, CASE and REPEAT use relative indentation to determine which code falls under their control; the IF, ELSEIF and ELSE keywords of one decision tree must be at the same indentation level."
  constants:
    source: "Parallax Propeller 2 Spin2 Language Documentation v55, CON Blocks"
    rule: "A symbolic constant can be referenced by every block within the file, including other CON blocks."

observed_layout:
  source: "OBEX 2842 (Full Duplex Serial) and OBEX 2824 (NEC RX), whole files"
  line_length: "No line is longer than 100 characters in either object; the longest lines are exactly 100 (the header rule lines)."
  indentation: "Two spaces per level, in block entries and in method bodies."
  vertical_spacing:
    between_blocks_and_methods: "Two blank lines separate blocks and separate methods."
    after_block_keyword: "One blank line follows a block keyword line before its entries."
    method_documentation: "A method signature is followed by one blank line, then the documentation lines, then one blank line, then the body. Not every method has documentation lines."
  block_labels: "A CON or DAT block carries a short lowercase label in braces after the keyword, for example con { timing }, con { app io pins }, dat { smart pin uart/buffer manager }. Some blocks have no label."
  block_order:
    obex_2842: "header, documentation comment, con blocks, obj, var, pub and pri methods, dat (PASM2), con { license }. A con { formatted strings commands } block sits between pub methods."
    obex_2824: "header, con blocks, obj, dat, var, pub methods, con { license }."
    difference: "The two objects order their blocks differently and OBEX 2842 places a CON block between methods, so the block order is a choice made per file."
  entry_point: "OBEX 2824 begins with pub main(), which calls setup() first; the application loop follows."
  trailing_comments: "A single apostrophe starting in column 65, lowercase, without a closing period."

layout_example:
  source: "Layout shown by OBEX 2824 (NEC RX): labelled con blocks, a var block, main() calling setup(), documentation lines under the signature. The program itself is illustrative, not part of either object."
  program: |
    con { timing }

      CLK_FREQ = 200_000_000                                        ' system freq as a constant

      _clkfreq = CLK_FREQ                                           ' set system clock


    var

      long  count                                                   ' number of loops so far


    pub main()

      setup()

      repeat
        waitms(125)
        ++count


    pub setup()

    '' Prepare the application
    '' -- clears the loop count

      count := 0

