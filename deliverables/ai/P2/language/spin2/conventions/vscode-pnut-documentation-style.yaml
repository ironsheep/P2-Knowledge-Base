title: Spin2 Documentation Comments
id: vscode-pnut-documentation-style
source: "Parallax Propeller 2 Spin2 Language Documentation v55, Comments; CP-009 (the known issue)"

summary: >-
  Spin2 has two documentation-comment forms, a double apostrophe and double braces,
  and two ordinary-comment forms, a single apostrophe and single braces. Comment text in
  either documentation form goes into the documentation file; text in the ordinary forms
  does not.

description: |
  The Spin2 language documentation lists the comment forms below. It states that the text of
  the two documentation forms goes into the documentation file, and nothing more about them:
  it does not say where in a method or block a documentation comment is placed, which
  comment forms an editor shows as hover text or as an outline label, or what tags a
  documentation comment may carry. This page therefore states none of those. For the wording
  and layout two community objects use, see
  language/spin2/conventions/spin2-formatting-standards.yaml.

aliases:
  - spin2_docs_vscode
  - spin2_documentation_style
  - vscode_spin2_comments
  - "VSCode PNut documentation conventions"
  - "Spin2 documentation comments"
  - "Spin2 doc comments"

oneliner: "Spin2 comment forms: ' and { } are comments; '' and {{ }} are documentation comments"

comment_forms:
  source: "Parallax Propeller 2 Spin2 Language Documentation v55, Comments"
  forms:
    - form: "' comment here"
      kind: "comment"
      meaning: "Initiated by an apostrophe; the rest of the line is ignored."
      example: "a := 0 'comment here"
    - form: "'' comment here"
      kind: "documentation comment"
      meaning: "Initiated by two apostrophes; the rest of the line is ignored. The comment text goes into the documentation file."
      example: "b := 1 ''comment here"
    - form: "{ comment here }"
      kind: "comment"
      meaning: "Intra-line or multi-line. Everything within braces is ignored, including end-of-lines."
      example: "x := 4 {comment here} + 1"
    - form: "{{ comment here }}"
      kind: "documentation comment"
      meaning: "Intra-line or multi-line. Everything within double braces is ignored, including end-of-lines. The comment text goes into the documentation file."
      example: "x := 4 {{comment here}}"
    - form: "... comment here"
      kind: "line continuation"
      meaning: "Initiated by three periods; the rest of the line is ignored and parsing continues on the next line, as if no end-of-line was encountered."
      example: "z := 100 ... comment here * x"
  distinction: "One apostrophe is a comment; two apostrophes are a documentation comment. One brace pair is a comment; two brace pairs are a documentation comment."

examples:
  - description: "Each comment form in a file that compiles"
    code: |
      {Spin2_v45}
      '' Documentation comment to end of line, at the top of the file

      CON { Motor Limits }

        MAX_SPEED = 1000                        ' comment to end of line
        MIN_SPEED = {low limit} 100             ' comment inside a line

      PUB scaled(speed) : result
      '' Documentation comment to end of line
      {{ Documentation comment
         across several lines }}

        result := speed {inner comment} * 2 ...
          + MIN_SPEED

known_issues:
  - "pnut-ts rejects a double-brace documentation comment placed between two terms of an expression (result := result {{x}} + 1 fails with 'Expected end of line (m281)'), while the same comment after a complete statement, and a single-brace comment between the same terms, compile."

related:
  - language/spin2/conventions/spin2-formatting-standards.yaml
