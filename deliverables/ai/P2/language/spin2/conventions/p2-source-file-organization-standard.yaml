title: P2 Source File Organization
id: p2-source-file-organization-standard
aliases:
  - "P2 source file organization conventions"
  - "source file layout conventions"
style_name: Source file header and license block, as shown in two community objects
version: 1.0.0
applies_to: Spin2 source files
source: "OBEX 2842 (Full Duplex Serial, jm_fullduplexserial.spin2, Jon McPhalen); OBEX 2824 (NEC RX, jm_nec_rx_demo.spin2, Jon McPhalen)"
summary: How OBEX 2842 and OBEX 2824 open a source file with a header banner and close it with a license block

description: |
  OBEX 2842 and OBEX 2824 are community objects by Jon McPhalen, not Parallax publications.
  Both open with a header banner of documentation comment lines and both close with a license
  block. This page records that structure as the two files show it. Where the two objects do
  not show a rule, this page does not state one.

universal_file_structure: "header banner, then the code blocks, then con { license } as the last block"

header_banner:
  source: "OBEX 2842 (Full Duplex Serial) and OBEX 2824 (NEC RX), file header comment"
  prefix: "Every banner line starts with two apostrophes, so the banner is a documentation comment."
  rule_lines: "The banner opens and closes with a line of two apostrophes, a space and 97 equals signs (100 characters in all), and an empty documentation comment line follows the opening rule and precedes the closing rule."
  fields:
    - "File: the file name"
    - "Purpose: a one-line description; OBEX 2842 continues it on '-- ' lines"
    - "Author or Authors: OBEX 2824 writes Jon \"JonnyMac\" McPhalen, then a Copyright (c) 2020 line, then '-- see below for terms of use'; OBEX 2842 writes Jon McPhalen, then '-- based on work by Chip Gracey', then '-- see below for terms of use'"
    - "E-mail: a contact address"
    - "Started: left empty in both objects"
    - "Updated: a date written as DD MMM YYYY (15 DEC 2020, 04 JAN 2022); OBEX 2842 adds a '-- ' line describing the change"
    - "{$P2}: the last field line, before the closing rule"
  dot_leaders: "Each label is followed by dots so that every value starts in the same column."

license_block:
  source: "OBEX 2842 (Full Duplex Serial) and OBEX 2824 (NEC RX), final con { license } block"
  placement: "The last block of the file."
  form: "A con { license } block holding a {{ ... }} comment."
  text: "The comment starts 'Terms of Use: MIT License' and gives the MIT permission text, from 'Permission is hereby granted, free of charge' to 'OR THE USE OR OTHER DEALINGS IN THE SOFTWARE.'"

file_names:
  source: "OBEX 2842 (Full Duplex Serial) and OBEX 2824 (NEC RX), file names"
  observed: "Lowercase with underscores and a shared jm_ prefix: jm_fullduplexserial.spin2, jm_nec_rx.spin2, jm_nec_rx_demo.spin2."

block_order:
  source: "OBEX 2842 (Full Duplex Serial) and OBEX 2824 (NEC RX), block structure"
  observed: "The two objects order their code blocks differently (OBEX 2842: con, obj, var, pub and pri, dat; OBEX 2824: con, obj, dat, var, pub), and both repeat CON blocks with different labels. The block layout and the formatting conventions are in language/spin2/conventions/spin2-formatting-standards.yaml."

related:
