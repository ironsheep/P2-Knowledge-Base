title: Spin2 JonnyMac Naming Conventions
id: spin2-naming-jonnymac
layer: "Layer 4 - Naming Conventions (JonnyMac)"
source: "OBEX 2842 (Full Duplex Serial, jm_fullduplexserial.spin2, Jon McPhalen); OBEX 2824 (NEC RX, jm_nec_rx_demo.spin2, Jon McPhalen)"
basis: "Naming, case and indentation conventions observed in OBEX 2842 and OBEX 2824, community objects by Jon McPhalen (jonnymac); not a Parallax publication. Where those two objects do not show a rule, this page does not state one."
purpose: How the two JonnyMac objects name constants, variables, objects, methods and PASM2 labels, and how they indent
applies_to: Projects that choose the JonnyMac naming and indentation style

summary: |
  The naming layer of the JonnyMac conventions: UPPERCASE constants, lowercase variables,
  objects and methods, a capitalised DAT data label, lowercase Spin2 keywords, and two-space
  indentation. Spin2 is case-insensitive (see language/fundamentals/case-sensitivity.yaml), so
  these are style choices; the compiler treats RX_PIN and rx_pin as one name.
  The full set of conventions is in language/spin2/conventions/johnny-mac-documentation-style.yaml.

keywords:
  source: "OBEX 2842 (Full Duplex Serial) and OBEX 2824 (NEC RX), whole files"
  rule: "Every block keyword, statement keyword and built-in method is lowercase: con, obj, var, pub, pri, dat, org, res, fit, repeat, if, elseif, quit, return, case, coginit, cogstop, longmove, longfill, pinstart, getct, waitct, waitms, strsize, lookdown, abs."

indentation:
  source: "OBEX 2842 (Full Duplex Serial) and OBEX 2824 (NEC RX), block entries and method bodies"
  type: "spaces"
  amount: 2
  applies_to: "Entries inside con, var, obj and dat blocks, method bodies, and nested if, repeat and case statements"
  conditions: "Conditions are written in parentheses: if (rxtail <> rxhead), repeat while (rxtail == rxhead)."

naming:
  constants:
    source: "OBEX 2842 (Full Duplex Serial) and OBEX 2824 (NEC RX), con blocks"
    style: "UPPERCASE; words separated by underscores; digits allowed"
    observed: ["BUF_SIZE", "PGM_RX", "CLK_FREQ", "MS_001", "US_001", "BR_TERM", "CRSR_XY", "CLS", "LED1", "RX1", "IR_SENSE"]
    pin_names: "Pin numbers are constants with a direction tag in braces after the value: IR_SENSE = 15  { I }, SF_CS = 61  { O }."
    enumerations: "OBEX 2824 declares enumerations with # lists: #true, ON, OFF and #false, NO, YES."
    clock_symbol: "The system clock is set with the lowercase special symbol _clkfreq = CLK_FREQ (OBEX 2824)."
  variables:
    source: "OBEX 2842 (Full Duplex Serial) and OBEX 2824 (NEC RX), var blocks and method signatures"
    style: "lowercase; mostly single words joined together"
    observed: ["cog", "rxp", "txp", "rxhub", "rxhead", "rxtail", "txdelay", "rxbuf", "pbuf", "ircog"]
    declaration: "The type (long, byte) is lowercase, followed by two spaces and then the name."
    pointer_parameters: "A parameter that holds an address is prefixed p_: p_str, p_args."
    locals: "Locals follow the | after the signature and are short lowercase names: | idx, c, asc, field."
  data_labels:
    source: "OBEX 2824 (NEC RX), dat block"
    style: "Capitalised: Banner (a byte string in a dat block)"
  objects:
    source: "OBEX 2842 (Full Duplex Serial) and OBEX 2824 (NEC RX), obj blocks"
    style: "Short lowercase instance names: nstr, ir, term. The referenced object files are lowercase with a jm_ prefix: \"jm_nstr\", \"jm_nec_rx\", \"jm_fullduplexserial\"."
    layout: "The colons of the instances in a block are aligned."
  methods:
    source: "OBEX 2842 (Full Duplex Serial) and OBEX 2824 (NEC RX), pub and pri methods"
    style: "lowercase. A single word where one will do (start, stop, tx, rx, str, available, rxcheck, txflush, padstr, substr, tstart); underscores between words when several are needed (fmt_number, get_hex, get_nargs, wait_for_terminal)"
    parentheses: "Always written, even with no parameters: pub null(), pub stop(), pub setup()."
    results: "Declared after a colon, lowercase: : b, : count, : result, : p_str1, value."
    private: "pri get_hex() and pri get_nargs() (OBEX 2842) are the private helpers of the object."
  pasm2_labels:
    source: "OBEX 2842 (Full Duplex Serial), dat { smart pin uart/buffer manager }"
    style: "lowercase, with underscores between words (uart_mgr, uart_main, rx_serial); registers are short lowercase names (rxd, txd, t1, t2, t3, p_rxbuf)"

example_declarations:
  source: "OBEX 2824 (NEC RX), con and obj blocks"
  code: |
    con { fixed io pins }

      RX1      = 63  { I }                                          ' programming / debug
      TX1      = 62  { O }


    con

      #true,  ON, OFF
      #false, NO, YES


    obj

    ' main                                                          ' * master Spin cog
      ir   : "jm_nec_rx"                                            ' * NEC decoding
      term : "jm_fullduplexserial"                                  ' * serial IO for terminal

    ' * uses cog when loaded

