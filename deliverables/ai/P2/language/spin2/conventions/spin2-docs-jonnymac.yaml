title: Spin2 JonnyMac Documentation Style
id: spin2-docs-jonnymac
aliases:
  - "JonnyMac documentation style"
  - "Spin2 documentation conventions JonnyMac"
layer: "Layer 3 - Documentation Style (JonnyMac)"
source: "OBEX 2842 (Full Duplex Serial, jm_fullduplexserial.spin2, Jon McPhalen); OBEX 2824 (NEC RX, jm_nec_rx_demo.spin2, Jon McPhalen)"
basis: "Documentation conventions observed in OBEX 2842 and OBEX 2824, community objects by Jon McPhalen (jonnymac); not a Parallax publication. Where those two objects do not show a rule, this page does not state one."
purpose: How the two JonnyMac objects document methods, code and PASM2
applies_to: Projects that choose the JonnyMac comment style

summary: |
  The documentation layer of the JonnyMac conventions: a method is documented with '' lines
  placed after its signature, written in plain English with no tags; code is commented with a
  single apostrophe in a fixed column. The full set of conventions is in
  language/spin2/conventions/johnny-mac-documentation-style.yaml.

comment_types:
  source: "OBEX 2842 (Full Duplex Serial) and OBEX 2824 (NEC RX), comment usage"
  method_documentation:
    prefix: "''"
    placement: "After the method signature (see method_documentation_layout)"
    language: "Plain English sentences; no @param or @returns tags appear in either object"
  code_comments:
    prefix: "'"
    placement: "Trailing, starting in column 65 (one comment in OBEX 2842 starts in column 64); lowercase, no closing period"
  pasm2_comments:
    prefix: "'"
    placement: "Trailing, starting in column 65, after the optional WC/WZ column (see pasm2_layout in language/spin2/conventions/johnny-mac-documentation-style.yaml)"
    style: "Describe the meaning of a step, using := to state the effect: ' t1 := @rxbuf. Not every instruction has a comment."

method_documentation_layout:
  source: "OBEX 2842 (Full Duplex Serial), pub methods (null, tstart, start, stop, rx, rxcheck, rxtime, padstr, format)"
  structure:
    - "Signature line."
    - "ONE blank line."
    - "Documentation: '' lines. The first line says what the method does."
    - "Further lines start with '' -- and add a constraint, a parameter or a return value."
    - "ONE blank line."
    - "Body, indented two spaces."
  coverage: "Not every method is documented: lower() in OBEX 2842 and main(), setup() and wait_for_terminal() in OBEX 2824 have no documentation lines."
  parameter_lists: "Parameters are listed with dots filling the name column ('' -- rxpin... receive pin (-1 if not used)); a value table continues on '' lines aligned under the text."
  content_observed:
    - "First line is a verb phrase stating the action: 'Pulls byte from receive buffer if available', 'Emit z-string at p_str', 'Wait for transmit buffer to empty'."
    - "A '' -- line states a blocking behavior or a special return value: '-- will wait if buffer is empty', '-- returns -1 if buffer is empty'."

example_documented_method:
  source: "OBEX 2842 (Full Duplex Serial), pub start()"
  code: |
    pub start(rxpin, txpin, mode, baud) : result | baudcfg, spmode

    '' Start simple serial coms on rxpin and txpin at baud
    '' -- rxpin... receive pin (-1 if not used)
    '' -- txpin... transmit pin (-1 if not used)
    '' -- mode.... %0xx1 = invert rx
    ''             %0x1x = invert tx
    ''             %01xx = open-drain/open-source tx

      stop()

example_null_method:
  source: "OBEX 2842 (Full Duplex Serial), pub null()"
  code: |
    pub null()

    '' This is not a top-level object

declaration_comments:
  source: "OBEX 2842 (Full Duplex Serial) and OBEX 2824 (NEC RX), con and var blocks"
  rules:
    - "Constants and variables carry a short trailing comment in column 65. The var entries of OBEX 2842 read ' cog flag/id', ' rx smart pin', ' hub address of rxbuf'. A few entries have none, for example txbuf."
    - "A pin constant carries its direction in braces after the value: IR_SENSE = 15  { I }."
    - "A block label in braces after con or dat names the group: con { fixed io pins }."

example_declarations:
  source: "OBEX 2824 (NEC RX), con blocks"
  code: |
    con { timing }

      CLK_FREQ = 200_000_000                                        ' system freq as a constant
      MS_001   = CLK_FREQ / 1_000                                   ' ticks in 1ms
      US_001   = CLK_FREQ / 1_000_000                               ' ticks in 1us

      _clkfreq = CLK_FREQ                                           ' set system clock


    con { app io pins }

      IR_SENSE = 15  { I }                                          ' ir sensor (38kHz)

