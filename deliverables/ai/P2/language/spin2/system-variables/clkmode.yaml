variable: CLKMODE
type: system_variable
data_type: long
category: Clock Configuration

description: |
  Current clock mode register value. Maintained at fixed HUB address $00040.
  
  This 32-bit value configures the P2's clock source, PLL settings, and crystal
  parameters. It is automatically initialized by the compiler based on _clkfreq,
  _xtlfreq, _xinfreq, and related CON block constants.
  
  Reading CLKMODE shows the current clock configuration. Writing requires
  understanding the bit fields - use CLKSET for safe clock changes.

hub_address: "$00040"
access: read_write

bit_fields:
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), HUB, Configuring the Clock Generator (HUBSET ##%0000_000E_DDDD_DDMM_MMMM_MMMM_PPPP_CCSS 'set clock mode'; the %PPPP table and the %CC field table). The RCFAST ~20 MHz and RCSLOW ~20 kHz figures and the 15 pF / 30 pF crystal loading capacitances are the P2 Datasheet's: Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, AC Characteristics, p.48."
  d24:
    name: "PLL Enable"
    description: "1 = PLL powered on, 0 = PLL off"
  
  d23_18:
    name: "Input Divider (DIVD)"
    description: "PLL input divider - 1 (actual divider = value + 1)"
    range: "0-63 (divider 1-64)"
  
  d17_8:
    name: "Multiplier (MULT)"
    description: "PLL VCO multiplier - 1 (actual multiplier = value + 1)"
    range: "0-1023 (multiplier 1-1024)"
  
  d7_4:
    name: "Post Divider (PPPP)"
    description: "PLL output divider (4 bits): %0000 = VCO / 2, %0001 = VCO / 4, ... %1110 = VCO / 30 (VCO / ((PPPP+1)*2)), and %1111 = VCO / 1"
    values:
      0: "VCO / 2"
      1: "VCO / 4"
      2: "VCO / 6"
      3: "VCO / 8"
      4: "VCO / 10"
      5: "VCO / 12"
      6: "VCO / 14"
      7: "VCO / 16"
      8: "VCO / 18"
      9: "VCO / 20"
      10: "VCO / 22"
      11: "VCO / 24"
      12: "VCO / 26"
      13: "VCO / 28"
      14: "VCO / 30"
      15: "VCO / 1"

  d3_2:
    name: "Crystal Configuration (CC)"
    description: "XI / XO status, impedance and internal loading capacitors"
    values:
      0b00: "XI ignored, XO floats; Hi-Z; loading caps OFF"
      0b01: "XI input, XO 600-ohm drive; 1M-ohm feedback; loading caps OFF"
      0b10: "XI input, XO 600-ohm drive; 1M-ohm feedback; 15pF per pin (crystals >= 16 MHz)"
      0b11: "XI input, XO 600-ohm drive; 1M-ohm feedback; 30pF per pin (crystals < 16 MHz)"
  
  d1_0:
    name: "Clock Source (SS)"
    description: "Active clock source selection"
    values:
      0b00: "RCFAST (~20 MHz internal RC)"
      0b01: "RCSLOW (~20 kHz internal RC)"
      0b10: "XI pin (crystal or external input)"
      0b11: "PLL output"

clock_source_modes:
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), HUB, Configuring the Clock Generator (the %SS clock-source table); Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, AC Characteristics, p.48"
  rcfast:
    bits: "0b00"
    frequency: "~20 MHz"
    description: "Internal RC oscillator, fast mode"
    use_case: "Default boot, no external crystal needed"
  
  rcslow:
    bits: "0b01"
    frequency: "~20 kHz"
    description: "Internal RC oscillator, slow mode"
    use_case: "Ultra-low power, sleep modes"
  
  crystal_direct:
    bits: "0b10"
    frequency: "Crystal frequency"
    description: "External crystal or clock input"
    use_case: "Precise timing without PLL"
  
  pll:
    bits: "0b11"
    frequency: "Calculated from PLL settings"
    description: "PLL output (requires PLL enable)"
    use_case: "High-speed operation. The P2 Datasheet rates the PLL at 320 MHz maximum, 180 MHz typical; the Parallax Propeller 2 Documentation notes it can be pushed to 350 MHz in 'VCO / 1' mode. The 500 MHz figure sometimes quoted is the pnut-ts compiler's acceptance limit, not a silicon rating -- see language/spin2/constants/special-configuration-symbols.yaml."
    source: "use_case: Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, AC Characteristics (PLL 320 MHz maximum, 180 MHz typical), p.48; Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), HUB, Configuring the Clock Generator (350 MHz in 'VCO / 1' mode)"

examples:
  - description: "Read current clock mode"
    code: "debug(\"Clock mode: \", uhex(clkmode))"
  
  - description: "Check if using PLL"
    code: |
      if (clkmode & %11) == %11
        debug("Running from PLL")
  
  - description: "Check clock source"
    code: |
      case clkmode & %11
        %00: debug("RCFAST")
        %01: debug("RCSLOW")
        %10: debug("Crystal/External")
        %11: debug("PLL")

notes:
  - "Hub address $00040 is fixed - can be accessed from PASM via RDLONG"
  - "Compiler calculates optimal PLL settings automatically"
  - "Use CLKSET for safe clock transitions (handles PLL lock timing)"
  - "Raw HUBSET to change mode requires proper sequencing"
  - "PLL must lock before switching to PLL source (~10 ms). Silicon Doc (Parallax Propeller 2 Documentation) v35 -- \"XI input must be enabled by %CC. Allow 10ms for crystal+PLL to stabilize before switching over to PLL clock source.\""

sources:
  - "notes (PLL lock, 10 ms crystal+PLL stabilization): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), HUB, Configuring the Clock Generator (the PLL Setting table, %E row)"

related:
  - language/spin2/system-variables/clkfreq.yaml
  - language/spin2/methods/clkset.yaml
  - language/spin2/methods/hubset.yaml
  - language/spin2/constants/special-configuration-symbols.yaml
  - architecture/clock_system.yaml
