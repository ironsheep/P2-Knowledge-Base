# Usage example
usage_example: |
  ' Compose streamer command using symbols:
  mode := X_RFWORD_RGB16 | X_PINS_ON | X_DACS_3_2_1_0 + base<<17 + 640
  
  ' This creates:
  ' - Mode: RGB 5:6:5 from Hub
  ' - Pin output enabled
  ' - All 4 DAC channels
  ' - Pin base in position
  ' - 640 pixel count

