# Control symbols - Pin enable
pin_control:
  - symbol: X_PINS_OFF
    value: "$0000_0000"
    encoding: "%0 << 23"
    description: "Disable pin output"
    
  - symbol: X_PINS_ON
    value: "$0080_0000"
    encoding: "%1 << 23"
    description: "Enable pin output"

# Control symbols - Write enable
write_control:
  - symbol: X_WRITE_OFF
    value: "$0000_0000"
    encoding: "%0 << 23"
    description: "Disable WRFAST"
    
  - symbol: X_WRITE_ON
    value: "$0080_0000"
    encoding: "%1 << 23"
    description: "Enable WRFAST"

# Control symbols - Bit order
bit_order:
  - symbol: X_ALT_OFF
    value: "$0000_0000"
    encoding: "%0 << 16"
    description: "LSB first (default)"
    
  - symbol: X_ALT_ON
    value: "$0001_0000"
    encoding: "%1 << 16"
    description: "MSB first"

# DAC routing symbols
dac_routing:
