  - symbol: X_DACS_X_X_0_0
    value: "$0200_0000"
    encoding: "%0010 << 24"
    description: "X0 on channels 0,1"
    
  - symbol: X_DACS_0_0_X_X
    value: "$0300_0000"
    encoding: "%0011 << 24"
    description: "X0 on channels 2,3"
    
  - symbol: X_DACS_X_X_X_0
    value: "$0400_0000"
    encoding: "%0100 << 24"
    description: "X0 on channel 0"
    
  - symbol: X_DACS_X_X_0_X
    value: "$0500_0000"
    encoding: "%0101 << 24"
    description: "X0 on channel 1"
    
  - symbol: X_DACS_X_0_X_X
    value: "$0600_0000"
    encoding: "%0110 << 24"
    description: "X0 on channel 2"
    
  - symbol: X_DACS_0_X_X_X
    value: "$0700_0000"
    encoding: "%0111 << 24"
    description: "X0 on channel 3"
    
  - symbol: X_DACS_0N0_0N0
    value: "$0800_0000"
    encoding: "%1000 << 24"
    description: "Differential X0/!X0 all"
    
  - symbol: X_DACS_X_X_0N0
    value: "$0900_0000"
    encoding: "%1001 << 24"
    description: "Differential on 0,1"
    
  - symbol: X_DACS_0N0_X_X
    value: "$0A00_0000"
    encoding: "%1010 << 24"
    description: "Differential on 2,3"
    
  - symbol: X_DACS_1_0_1_0
    value: "$0B00_0000"
    encoding: "%1011 << 24"
    description: "Stereo X1,X0 pairs"
    
  - symbol: X_DACS_X_X_1_0
    value: "$0C00_0000"
    encoding: "%1100 << 24"
    description: "Stereo on 0,1"
    
  - symbol: X_DACS_1_0_X_X
    value: "$0D00_0000"
