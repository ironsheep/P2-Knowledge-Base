# Streamer Symbols Reference
# All X_* symbols for streamer configuration

category: streamer
description: Complete streamer symbol definitions with values
total_symbols: 82

# Mode symbols - Immediate → LUT
immediate_lut_modes:
  - symbol: X_IMM_32X1_LUT
    value: "$0000_0000"
    encoding: "%0000 << 28"
    description: "32×1-bit immediate → LUT → pins"
    
  - symbol: X_IMM_16X2_LUT
    value: "$1000_0000"
    encoding: "%0001 << 28"
    description: "16×2-bit immediate → LUT → pins"
    
  - symbol: X_IMM_8X4_LUT
    value: "$2000_0000"
    encoding: "%0010 << 28"
    description: "8×4-bit immediate → LUT → pins"
    
  - symbol: X_IMM_4X8_LUT
    value: "$3000_0000"
    encoding: "%0011 << 28"
    description: "4×8-bit immediate → LUT → pins"

