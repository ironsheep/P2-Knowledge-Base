      value: "$0000_0000"
      bit_pattern: "%0000_0000_000_0000000000000_00_00000_0"
      description: "Select local pin for A input"
      usage_context:
        - "SmartPin A input source selection"
        - "Default setting - pin monitors itself"
      related_symbols: ["P_PLUS1_A", "P_MINUS1_A", "P_OUTBIT_A"]
      hardware_relationship: "SmartPin A input source multiplexer"
    
    - symbol_id: "p_plus1_a"
      symbol_name: "P_PLUS1_A"
      category: "smartpin"
      subcategory: "a_input_selection"
      value: "$1000_0000"
      bit_pattern: "%0001_0000_000_0000000000000_00_00000_0"
      description: "Select pin+1 for A input"
      usage_context:
        - "SmartPin A input from adjacent pin"
        - "Pin pairing for differential signals"
      related_symbols: ["P_LOCAL_A", "P_PLUS2_A", "P_PLUS3_A"]
      hardware_relationship: "SmartPin A input source multiplexer"
    
    - symbol_id: "p_outbit_a"
      symbol_name: "P_OUTBIT_A"
