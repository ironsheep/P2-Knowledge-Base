# Spin2 Built-In Symbols - Complete Reference
# Source: complete-builtin-symbols.md
# Layer 1: Direct extraction from the Spin2 documentation. The 116 smart-pin
# configuration symbols (P_*) carry the wording of the CURRENT edition, Spin2 v55
# (engineering/ingestion/sources/spin2-v55/spin2-v55-text.txt:1419-1562), which
# supersedes v51; the remaining records are from the original v51 extraction.

# Findability index. `generate-p2kb-index.py` harvests TOP-LEVEL `aliases:` only,
# so without this block not one of the smart-pin constants defined below is
# reachable by name through the published index. Every name here is DEFINED in
# this file's `symbols:` list -- an alias is a lookup key, never a definition.
