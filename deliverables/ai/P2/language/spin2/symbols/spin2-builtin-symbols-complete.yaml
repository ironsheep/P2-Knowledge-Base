spin2_builtin_symbols:
  schema_version: "1.0.0"
  extraction_date: "2025-09-06"
  source_document: "complete-builtin-symbols.md"
  # Count of the records actually present in this file's `symbols:` list below,
  # derived by walking that list -- not the size of the upstream symbol universe.
  # This field read 1224 until 2026-08-26; 1224 is the sum of
  # the top-level `category_summary.*.total_symbols` (the source document's own
  # tally of every symbol it names). The `clock` category alone accounts for 1044
  # of that, of which 1024 are the XMUL1..XMUL1024 PLL multipliers; ZERO XMUL records
  # are carried here (the last one was removed 2026-09-14 -- XMUL/XDIV/XSEL appear
  # nowhere in Spin2 v55), so the old tally contradicted the records sitting directly
  # underneath it.
  total_symbols: 136
  # 6 categories are described in `category_summary`; 5 of them have records here
  # (`math` is described but has no symbol records yet).
  categories: 6
  
  # Complete symbol definitions organized by category
  symbols:
    
    # SmartPin Configuration Symbols
    - symbol_id: "p_true_a"
      symbol_name: "P_TRUE_A"
