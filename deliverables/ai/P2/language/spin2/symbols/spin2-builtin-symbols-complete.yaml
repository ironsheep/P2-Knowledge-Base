      subcategory: "a_input_config"
      value: "$0000_0000"
      bit_pattern: "%0000_0000_000_0000000000000_00_00000_0"
      description: "True A input"
      usage_context: 
        - "SmartPin A input configuration"
        - "Used with WRPIN for SmartPin mode setup"
      related_symbols: ["P_INVERT_A", "P_LOCAL_A"]
      hardware_relationship: "SmartPin A input polarity control"
    
    - symbol_id: "p_invert_a"
      symbol_name: "P_INVERT_A"
      category: "smartpin"
      subcategory: "a_input_config"
      value: "$8000_0000"
      bit_pattern: "%1000_0000_000_0000000000000_00_00000_0"
      description: "Invert A input"
      usage_context:
        - "SmartPin A input configuration"
        - "When A input logic needs to be inverted"
      related_symbols: ["P_TRUE_A", "P_LOCAL_A"]
      hardware_relationship: "SmartPin A input polarity control"
    
    - symbol_id: "p_local_a"
