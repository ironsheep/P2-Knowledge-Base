register_group: PR0-PR7
type: special_register_group
category: Spin2-PASM2 Communication
count: 8

description: |
  Communication registers PR0-PR7, shared between Spin2 and PASM2 code.

  For PASM2 code that is either inline (within a Spin2 method) or called
  by a Spin2 method, registers $1D8-$1DF are readable and writable by both
  languages using the symbols PR0-PR7. This provides a communication
  mechanism between Spin2 and PASM2 code running in the same COG.

  IMPORTANT: PASM2 code launched into another COG does NOT share this
  register space with Spin2. Each COG has its own independent PR0-PR7.

registers:
  PR0:
    address: 472
    hex_address: "$1D8"
    access: read_write
    spin2_syntax: "PR0 := value"

  PR1:
    address: 473
    hex_address: "$1D9"
    access: read_write
    spin2_syntax: "PR1 := value"

  PR2:
    address: 474
    hex_address: "$1DA"
    access: read_write
    spin2_syntax: "PR2 := value"

  PR3:
    address: 475
    hex_address: "$1DB"
    access: read_write
    spin2_syntax: "PR3 := value"

  PR4:
    address: 476
    hex_address: "$1DC"
    access: read_write
    spin2_syntax: "PR4 := value"

  PR5:
    address: 477
    hex_address: "$1DD"
    access: read_write
    spin2_syntax: "PR5 := value"

  PR6:
    address: 478
    hex_address: "$1DE"
    access: read_write
    spin2_syntax: "PR6 := value"

  PR7:
    address: 479
    hex_address: "$1DF"
    access: read_write
    spin2_syntax: "PR7 := value"

spin2_usage:
  reading: "value := PR0"
  writing: "PR0 := expression"

examples:
  - name: "Spin2 and inline PASM2 sharing registers"
    code: |
      ' Spin2 can read/write PR registers
      PR0 := 100
      value := PR1

      ' Inline PASM2 can access same registers
      org
        mov   PR2, PR0           ' Copy PR0 to PR2
        add   PR0, #1            ' Increment PR0
      end
    description: "Both Spin2 and inline PASM2 access the same PR registers"

notes:
  - "All 8 registers are functionally identical, differing only in address"
  - "NOT shared across COGs - each COG has independent copies"
  - "Located in COG RAM at addresses $1D8-$1DF"
  - "Available in both PASM2 and Spin2 syntax"

cross_references:
  - pasm2_pr_registers: "language/pasm2/registers/pr-registers"

documentation_source: "PASM2 Manual 2022/11/01 Page 118"
last_updated: "2025-12-04"
