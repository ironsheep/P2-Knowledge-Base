# Spin2 Language Construct: NEXT
construct: "NEXT"
category: "control_flow"
type: "loop_control"

description: "Skip to next iteration of current loop (like 'continue')"

syntax:
  - "NEXT"         # Skip to next iteration of the current (innermost enclosing) loop
  - "NEXT level"   # Skip to next iteration of an OUTER loop; level counts outward, 1-15
                   #   (bare NEXT = current loop; NEXT 1 = 1st-outer loop; NEXT 2 = 2nd-outer; ...)

example: |
  REPEAT i FROM 0 TO 99
    IF array[i] == 0
      NEXT          ' Skip zeros
    process(array[i])  ' Only non-zero values
  
  ' Skip in nested loops (level counts outward from the current loop):
  REPEAT x FROM 0 TO 9
    REPEAT y FROM 0 TO 9
      IF grid[x][y] < 0
        NEXT 1      ' Skip to next x iteration (1 = 1st-outer loop)

critical_behavior:
  - "Counter updates before next iteration"
  - "Loop condition rechecked immediately"
  - "Bare NEXT targets the current loop; NEXT level targets the level-th outer loop (1-15)"
  - "Continues with loop (not exit)"

common_patterns: |
  ' Filter invalid data
  REPEAT i FROM 0 TO count-1
    IF data[i] < MIN OR data[i] > MAX
      NEXT          ' Skip out-of-range
    sum += data[i]
    valid_count++
  
  ' Skip inactive items
  REPEAT sensor FROM 0 TO NUM_SENSORS-1
    IF NOT sensor_active(sensor)
      NEXT
    process_sensor(sensor)

critical_pitfalls:
  - "Cleanup before NEXT to avoid leaks"
  - "Increment loop vars in WHILE/UNTIL before NEXT"

comparison:
  next: "Continues with next iteration"
  quit: "Exits loop entirely"
  abort: "Exits entire method"

related:
  - language/spin2/constructs/repeat.yaml
  - language/spin2/constructs/quit.yaml
  - language/spin2/keywords/NEXT.yaml