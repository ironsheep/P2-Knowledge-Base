# Spin2 Language Construct: ABORT
construct: "ABORT"
category: "control_flow"
type: "exception_handling"

description: "Immediate return from nested method calls with optional error values"

syntax:
  - "ABORT"          # Returns 0
  - "ABORT value"    # Returns value  
  - "ABORT v1, v2"   # Multiple returns

trap_syntax: "result := \\method()"  # Backslash catches abort

example: |
  PUB validate(x) : result
    IF x < 0
      ABORT -1      ' Return error code
    result := x * 2
  
  PUB main() | status
    status := \validate(-5)  ' Catches abort, gets -1
    IF status < 0
      handle_error(status)

critical_behavior:
  - "Unwinds call stack immediately"
  - "Trap (\\) stops propagation"
  - "Cleanup code after trap executes on abort"
  - "ABORT returns to caller/trap, not call origin"

common_pattern: |
  PUB method() | resource
    resource := \acquire()
    IF resource < 0
      cleanup()
      ABORT resource  ' Propagate after cleanup
    use_resource(resource)

critical_pitfall: "ABORT exits method, not just loop (use QUIT for loops)"

comparison:
  abort: "Exits method/call chain with values"
  quit: "Exits current loop only"
  next: "Skips to next iteration"

related: ["p2kbSpin2Quit", "p2kbSpin2Next", "p2kbSpin2Repeat", "p2kbSpin2MethodDefinition"]