# Spin2 Language Construct: ABORT and Trap Operator
# Critical for: Exception-like error handling mechanism

construct: "ABORT"
category: "control_flow"
type: "exception_handling"

aliases:
  - abort
  - trap operator
  - backslash operator
  - error trap
  - exception handling
  - try catch
  - error propagation
  - unwind the call stack
  - catch an abort
  - abort value

metadata:
  query_tags: ["abort", "error", "exception", "trap", "backslash", "error_handling"]
  complexity: "intermediate"
  use_cases: ["error_signaling", "exception_handling", "resource_cleanup", "validation"]
  common_questions:
    - "How do I signal an error in Spin2?"
    - "How do I catch exceptions?"
    - "What is the trap operator?"

description: |
  Spin2 provides an exception-like error handling mechanism using ABORT and
  the backslash trap operator (\). Methods can signal errors using ABORT,
  and callers can catch and handle them using the trap operator.

  Key concepts:
  - ABORT unwinds the call stack, optionally returning an error value
  - \ (backslash trap) catches ABORT and allows execution to continue
  - A trapped call yields ONLY the abort value or 0 - never the method's results,
    so data leaves an abortable method by pointer or VAR
  - Use non-zero abort codes: a trap cannot tell ABORT 0 from success
  - An untrapped ABORT stops the task, or the cog if no other task runs in it;
    other cogs keep running

abort_syntax:
  without_value:
    syntax: "ABORT"
    description: "Aborts execution and returns 0 to the trapping caller"
    example: |
      PUB validate(data)
        if data == 0
          abort                  ' Return 0 to trapping caller

  with_value:
    syntax: "ABORT expression"
    description: "Aborts execution and returns expression value to trapping caller"
    example: |
      CON
        ERR_TIMEOUT  = -1
        ERR_OVERFLOW = -2
        ERR_INVALID  = -3

      PUB process_command(cmd) : result
        case cmd
          CMD_READ: result := do_read()
          CMD_WRITE: result := do_write()
          OTHER: abort ERR_INVALID   ' Return error code

trap_operator:
  description: |
    The backslash operator (\) creates a "trap point" that catches ABORT statements.
    It can be used in two contexts.

  instruction_context:
    syntax: "\\method_call()"
    description: |
      Calls method and catches any ABORT. The abort value is discarded and execution
      continues on the next line, so the caller cannot tell an abort from success -
      use this only where the failure genuinely does not matter.
    example: |
      PUB cleanup()
        \close_file()            ' Don't care if it fails
        \release_resource()
        \stop_motor()

  expression_context:
    syntax: "result := \\method_call()"
    description: |
      Calls the method with a trap and produces exactly ONE value:
        - 0                   if the method completes normally
        - the ABORT value     if the method executes ABORT expression
        - 0                   if the method executes a bare ABORT
      The method's own results NEVER come back through a trap, whatever its
      result count. For that reason a method with no results may be trapped as
      a value, and a trapped call cannot feed a multiple assignment.
      Use non-zero abort codes: a trap cannot tell ABORT 0 from success.
    example: |
      PUB main() | level, err
        err := \read_channel(3, @level)   ' data comes back through the pointer
        if err
          debug("read failed: ", sdec(err))
        else
          debug("pin 3 reads ", sdec(level))

      PRI read_channel(channel, pLevel)
        if channel < 0 or channel > 7
          abort -1
        long[pLevel] := pinread(channel)

  trapping_object_methods:
    syntax: "result := \\object.method()"
    example: "result := \\child_objects[i].method()"

  trapping_method_pointers:
    syntax: "result := \\method_ptr()"
    example: |
      VAR long method_ptr
      PUB call_with_trap() : result
        method_ptr := @some_method
        result := \method_ptr()

propagation_behavior:
  description: |
    When ABORT executes:
    1. The current method stops; nothing after the ABORT runs.
    2. Each untrapped caller is abandoned in turn; nothing after the call runs
       in any of them, including the rest of an expression the call was in.
    3. At the first call made with \, execution resumes in that caller with its
       locals and partly evaluated expression intact.
    4. If no call on the way up was trapped, the task stops - or the cog, if it
       was the only task in it. Other cogs keep running. The abort value is lost.
    A top-level cog or task method cannot trap its own ABORT; wrap the work in a
    method and trap that call.

  example: |
    PUB main() | result
      result := \level_1()       ' Trap point here
      debug("Result: ", sdec(result))

    PRI level_1() : val
      val := level_2()           ' No trap - abandoned if level_3 aborts
      val += 10                  ' Never runs on the abort path

    PRI level_2() : val
      val := level_3()           ' No trap - abandoned likewise
      val += 5

    PRI level_3() : val
      abort -99                  ' ABORT unwinds to main()'s trap
      val := 1                   ' Never executed
    ' main() receives -99. On the NON-abort path it receives 0, not level_1()'s
    ' val - a trap never passes the method's results.

  nested_traps:
    description: |
      Each trap only catches ABORTs from its own call. Note what the values are:
      every \ below yields an abort value or 0, never the called method's results.
    example: |
      PUB outer() : result
        result := \inner()       ' Catches ABORT from inner() chain

      PRI inner() : val
        val := \helper()         ' Catches ABORT from helper() only
        if val < 0
          abort val * 2          ' This ABORT goes to outer()
        val := other_work()

      PRI helper() : val
        abort -1                 ' Caught by inner()'s trap

return_vs_abort:
  comparison:
    RETURN:
      purpose: "Normal completion"
      stack_behavior: "Returns to immediate caller"
      without_trap: "Returns normally"
      return_value: "Method results"
    ABORT:
      purpose: "Error signaling"
      stack_behavior: "Unwinds to the nearest trapped call"
      without_trap: "Stops the task, or the cog if no other task runs in it"
      return_value: "The abort value (or 0) - the method's results never pass a trap"

patterns:
  error_code_out_data_through_pointer:
    description: "The trap carries the error code; results travel by pointer or VAR"
    code: |
      PUB main() | level, err
        err := \read_channel(3, @level)
        if err
          debug("read failed: ", sdec(err))

      PRI read_channel(channel, pLevel)
        if channel < 0 or channel > 7
          abort -1
        long[pLevel] := pinread(channel)

  detect_any_abort_with_flag:
    description: "Detects bare ABORT / ABORT 0, which read as 0 like success"
    code: |
      VAR long done
      PUB main() | err
        done := false
        err := \calibrate()
        if not done
          debug("calibration aborted, code ", sdec(err))

      PRI calibrate()
        if pinread(12) == 0
          abort
        done := true

  cleanup_then_rethrow:
    description: "Release a resource on every path, then pass the error on"
    code: |
      PRI transmit() | err
        pinhigh(20)
        err := \send_frame()
        pinlow(20)
        if err
          abort err

  retry:
    description: "Retry; success is err == 0, data returned by pointer"
    code: |
      PRI read_with_retry(pValue) | attempt, err
        repeat attempt from 1 to 3
          err := \read_device(pValue)
          if err == 0
            return
          waitms(100)
        abort err

  validation_chain:
    description: |
      Run several validations, fail on any. Each trap must be TESTED - a trap in
      instruction context (\validate_range(data) on its own line) swallows the abort
      and execution continues to the next line, so a chain of bare traps always
      reports success.
    code: |
      PUB validate_all(data) : ok | err
        err := \validate_range(data)
        if err
          return false
        err := \validate_checksum(data)
        if err
          return false
        ok := true

  supervise_a_cog:
    description: "A cog's top method cannot trap its own ABORT - trap one level down"
    code: |
      VAR long workerError, workerStack[64]
      PUB main()
        cogspin(NEWCOG, worker(), @workerStack)
      PRI worker()
        workerError := \worker_body()
        repeat
      PRI worker_body()
        repeat
          if pinread(0)
            abort -5

anti_patterns:
  uncaught_abort:
    description: "An untrapped ABORT silently stops the task or cog it runs in"
    wrong: |
      PUB main()
        process()                    ' If this aborts, this cog stops here

      PRI process()
        if error
          abort -1                   ' Untrapped - the cog stops, silently
    correct: |
      PUB main() | err
        err := \process()
        if err
          handle_error(err)

  reading_result_through_trap:
    description: "A value trap gives 0 whenever the method completes normally"
    wrong: |
      PUB main() | level
        level := \read_level()       ' always 0 on success
    correct: |
      PUB main() | level, err
        err := \read_level(@level)

  ignoring_error_values:
    description: "Discarding error information without checking"
    wrong: |
      PUB bad_error_handling()
        \operation()                 ' Error code lost!
        continue_anyway()            ' May be in bad state
    correct: |
      PUB good_error_handling() | err
        err := \operation()
        if err
          handle_error(err)
          return
        continue_safely()

  abort_for_normal_flow:
    description: "Using ABORT for non-error conditions"
    wrong: |
      PUB find_item(target) : index | i
        repeat i from 0 to size-1
          if items[i] == target
            abort i                  ' Misusing ABORT for "found"!
        index := -1
    correct: |
      PUB find_item(target) : index | i
        repeat i from 0 to size-1
          if items[i] == target
            return i
        index := -1

  resource_leak:
    description: "Resource not released if ABORT occurs"
    wrong: |
      PUB leaky_operation() | handle
        handle := acquire_resource()
        risky_work()                 ' If this aborts, handle leaks!
        release_resource(handle)
    correct: |
      PUB safe_operation() | handle, err
        handle := acquire_resource()
        err := \risky_work()
        release_resource(handle)     ' Always release
        if err
          abort err

  mixing_error_codes_and_data:
    description: |
      Trying to carry data and an error in the one trapped value. A trap produces
      only the abort value or 0, so there is no data to overlap with - the data has
      to leave by another route, and a second result does not help because a trap
      discards results too.
    wrong: |
      PUB main() | value
        value := \read_value()       ' 0 on success AND on bare abort
    correct: |
      PUB main() | value, err
        err := \read_value(@value)   ' err is the code; data goes by pointer
        if err
          handle_error(err)

      PRI read_value(pValue)
        if sensor_offline()
          abort ERR_SENSOR           ' non-zero, so it cannot read as success
        long[pValue] := sensor_read()

error_handling_strategy:
  must_not_fail: "Trap and provide default value"
  can_retry: "Trap in loop with attempts counter"
  needs_cleanup: "Trap, cleanup, re-abort if needed"
  top_level: "Trap one level below the cog/task top method, record the code, decide whether to continue"
  library_code: "Document ABORT conditions for callers"
  returning_data: "Data leaves an abortable method by pointer or VAR - never as a result read through a trap"

related:
  - language/spin2/constructs/quit.yaml
  - language/spin2/constructs/next.yaml
  - language/spin2/constructs/repeat.yaml
  - language/spin2/constructs/if_elseif_else.yaml
  - language/spin2/keywords/ABORT.yaml
