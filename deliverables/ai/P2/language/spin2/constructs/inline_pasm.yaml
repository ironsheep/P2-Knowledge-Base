# Spin2 Language Construct: Inline PASM2
# Source: Spin2 v51 documentation, production code analysis
# Critical for: Performance optimization and hardware control
# Canonical entry. Concept-side stub: language/spin2/concepts/inline_pasm2.yaml

construct: "Inline PASM2"
category: "program_structure"
type: "assembly_integration"

metadata:
  query_tags: ["org", "end", "pasm", "assembly", "inline", "performance", "optimization", "cogexec"]
  complexity: "advanced"
  use_cases: ["performance_critical", "hardware_control", "timing_precise", "driver_code"]
  common_questions:
    - "How do I embed assembly in Spin2?"
    - "When should I use inline PASM?"
    - "How do I share data between Spin2 and PASM?"
    - "Does inline PASM run in hub-exec or cog-exec?"
    - "What's the size limit on an inline PASM block?"

fundamental_purpose: |
  Inline PASM2 exists because the P2 philosophy embraces mixed-level programming:
  - Spin2 for logic and control flow (easy to write/maintain)
  - PASM2 for performance and precise timing (deterministic execution)
  - Seamless integration between both levels
  - Access to hardware features not exposed in Spin2

execution_model:
  # CRITICAL: this is cog-exec, NOT hub-exec.
  summary: |
    Inline PASM2 in a Spin2 method (ORG...END inside PUB/PRI) is loaded into
    cog RAM at runtime by the Spin2 interpreter. Per Spin2 v51 documentation
    verbatim, the interpreter performs TWO separate copies before jumping:
    
    1. "Copy the method's first 16 long variables, including any parameters,
       return values, and local variables, from hub RAM to cog registers
       $1E0..$1EF."
    2. "Copy the in-line PASM-code longs from hub RAM into cog registers,
       starting at the register address specified after the ORG (default
       is $000)."
    
    The block then runs as cog-exec at the deterministic per-instruction
    PASM timings.
  
  it_does_NOT_run_in_hubexec: true
  
  variable_limit:
    total_longs: 16
    breakdown: "First 16 long variables (params + result + locals) are copied to cog registers $1E0..$1EF. This 16-long limit applies to VARIABLES ONLY — not to the PASM code itself."
    source: "Spin2 v51 documentation verbatim"
  
  code_buffering:
    description: "PASM code is copied separately into cog registers starting at the ORG address (default $000), so code length is NOT constrained by the 16-long variable limit."
    code_size_limit: "Inline code area is $000..$11F (288 longs) when no multitasking is in use, plus LUT $000..$00F (16 longs). When the cog uses multitasking, $100..$11F is the multitasking taskptr table (building DOWNWARD from $11F), reducing the available inline code area; programs using fewer than 32 software tasks leave the LOWER portion of $100..$11F free for user code as well. Avoid writing to $120..$1D7 (Spin2 interpreter) and LUT $010..$1FF (interpreter)."
    source: "Spin2 v51 documentation + Chip Gracey clarification 2026-05-02 verbatim"
  
  multitasking_taskptr_table:
    location: "$100..$11F (cog registers)"
    fill_direction: "Downward from $11F (taskptr for task 31 occupies $11F, task 30 at $11E, etc.)"
    free_when_fewer_tasks: "Programs using fewer than 32 software tasks leave the LOWER portion of $100..$11F free for user code"
    overlaps_inline_code_area: "This range is the upper portion of the inline-PASM code area ($000..$11F), so multitasking and large inline-PASM blocks compete for the same space"
    source: "Chip Gracey clarification 2026-05-02 verbatim"
  
  why_it_matters_for_timing:
    - "Inline PASM gets cog-exec timing — deterministic 2 clocks/instruction for typical ALU ops"
    - "REP and ALTI work (cog-exec)"
    - "Branches inside the block are 4 clocks (cog branch), NOT 13+ (which would be the hub-exec branch refill cost)"
    - "FIFO/streamer instructions (RDFAST/WRFAST/FBLOCK/RFx/WFx/XINIT/XZERO/XCONT) are usable here because this is cog-exec (they would be forbidden in hub-exec)"
    - "Returning to Spin2 after END incurs interpreter dispatch overhead (we do not publish a clock count for this path because we do not have a verifiable measurement)"

syntax_forms:
  - form: "basic_inline"
    syntax: |
      ORG
        ' PASM2 code here
      END
    description: "Inline PASM2 inside a Spin2 method"
    execution: "Loaded into cog RAM at runtime by the Spin2 interpreter as TWO separate copies: (1) first 16 long variables (params + result + locals) → cog $1E0..$1EF; (2) PASM code longs → cog registers starting at ORG address (default $000). Runs as cog-exec, NOT hub-exec. The 16-long limit applies to VARIABLES ONLY; code is buffered separately and is not bound by that figure."
    
  - form: "cog_code"
    syntax: |
      DAT
        ORG   0          ' Start at COG address 0
      cog_entry
        ' PASM2 code for COG
        JMP   #cog_entry
      END
    description: "PASM2 code in DAT to be loaded into a COG"
    execution: "Loaded via COGINIT, runs as cog-exec in target cog"
    
  - form: "hub_exec"
    syntax: |
      DAT
        ORGH             ' Place in hub address space
      hub_code
        ' PASM2 code for hub execution
      END
    description: "PASM2 code in DAT that runs as hub-exec (separate from inline PASM)"
    execution: "Executes directly from hub memory through the (cogs+11)=19-stage prefetch FIFO. Sequential code: 2 clocks/instruction (same as cog-exec). Branches: minimum 13 clocks (+1 if not long-aligned) per Silicon Doc HUB EXECUTION. FIFO/streamer instructions (RDFAST/WRFAST/FBLOCK/RFx/WFx/XINIT/XZERO/XCONT) are FORBIDDEN in this mode. NOT the same as inline PASM in a method."

  - form: "mixed_method"
    syntax: |
      PUB fast_method(x, y) : result | temp
        temp := x + y    ' Spin2 code
        
        ORG
          SHL   temp, #2  ' PASM2 code (cog-exec, loaded by interpreter)
          MOV   result, temp
        END
        
        result += 100    ' Back to Spin2
    description: "Mix Spin2 and PASM2 in same method (PASM portion runs as cog-exec)"

  - form: "orgh_inline"
    syntax: |
      PUB method_name(params) : result | locals
        ORGH
          ' PASM2 code here — executes from hub RAM, no cog-RAM copy
        END
    description: "V50+ inline PASM2 that runs as hub-exec directly from hub RAM (NOT loaded into cog RAM)"
    introduced: "Spin2 v50"
    execution: "Per Chip Gracey clarification 2026-05-02: ORGH..END inline does NOT load code into cog RAM; PASM runs in hub-exec mode directly from hub. The first 16 long variables (params + result + locals) are still buffered into cog $1E0..$1EF at entry and restored at exit, identical to ORG..END inline. Sequential PASM: 2 clocks/instruction (FIFO streaming, same as cogexec). Branches: minimum 13 clocks (FIFO refill, +1 if not long-aligned). Maximum block size: $FFFF longs including auto-added RET. Bytecode: $D6 (bc_orgh)."
    contrast_with_org_inline: |
      ORG..END  : code copied into cog RAM at $000..; runs as cog-exec; size limited by cog code area ($000..$11F minus multitasking taskptr table)
      ORGH..END : code stays in hub RAM; runs as hub-exec; up to $FFFF longs; sequential 2 clocks/instruction but branches 13+ clocks
    related: "language/spin2/assembly-directives/orgh.yaml"

why_inline_pasm_matters:
  performance: |
    Inline PASM2 runs at the deterministic PASM2 timings cited in the per-
    instruction YAMLs:
    - Typical ALU ops: 2 clocks each (ADD/MOV/AND/OR/XOR/shifts/etc.)
    - Cog branches (JMP/CALL/RET): 4 clocks
    - Cog hub I/O (RDLONG/WRLONG): 9-16 / 3-10 clocks (egg-beater dependent)
    - CORDIC ops (QMUL/QDIV/QSQRT/QROTATE): 55-clock latency, 8-clock issue interval
    
    Spin2 method invocations execute via the bytecode interpreter; we do not
    publish per-method clock counts because we do not have a verifiable
    measurement. The performance benefit of inline PASM is that you replace
    interpreter-dispatched bytecode with directly-executed cog instructions
    at their deterministic timings.
  
  determinism: |
    PASM2 provides cycle-accurate timing:
    - Exact delays for protocol timing
    - Predictable interrupt response
    - Jitter-free signal generation
  
  hardware_access: |
    Direct access to P2 features:
    - CORDIC operations
    - Streamer control
    - Smart pin configuration
    - Special registers

register_access:
  method_interface: |
    Method parameters, result, and locals map to PASM2 registers:
    - First parameter  → PR0 (also addressable as '0')
    - Second parameter → PR1
    - Return value     → PR0 (overlaps first parameter)
    - Local variables  → next available registers after parameters
    - Variable budget  → first 16 long variables go to $1E0..$1EF (params + result + locals only).
                       Code is NOT counted against this 16-long figure — for ORG..END inline, PASM
                       code is copied separately into cog registers starting at the ORG address
                       (default $000), with the inline code area being $000..$11F (288 longs)
                       when no multitasking is in use. For ORGH..END inline (V50+), code stays
                       in hub RAM and runs as hub-exec; the 16-long variable buffer at $1E0..$1EF
                       behaves identically.
                       Source: Spin2 v51 documentation + Chip Gracey clarification 2026-05-02.
  
  local_label_rule:
    requirement: "Inline PASM labels must start with '.' (e.g. .loop) or ':' (e.g. :next)"
    reason: "Inline PASM has no global label context; all labels are method-local"
    reference: "language/pasm2/concepts/labels.yaml"
  
  example: |
    PUB multiply(x, y) : product
      ORG
        MUL   x, y        ' x is PR0, y is PR1
        GETQX product     ' product is PR0 (return)
      END

data_sharing_patterns:
  - pattern: "register_passing"
    description: "Use method parameters as registers"
    code: |
      PUB fast_add(a, b) : sum
        ORG
          ADD   a, b      ' a + b
          MOV   sum, a    ' Result in sum
        END
    
  - pattern: "hub_variables"
    description: "Access VAR/DAT from PASM"
    code: |
      VAR
        LONG shared_data
      
      PUB process()
        ORG
          MOV   PTRA, @shared_data
          RDLONG PA, PTRA
          ADD   PA, #1
          WRLONG PA, PTRA
        END
    
  - pattern: "inline_optimization"
    description: "Optimize hot spots"
    code: |
      PUB checksum(buffer, size) : crc | ptr
        ptr := buffer
        crc := $FFFF_FFFF
        
        REPEAT size
          ORG
            RDBYTE PA, ptr
            SETCRC crc, #$04C11DB7
            CRC    PA, crc
            ADD    ptr, #1
          END
        
        crc ^= $FFFF_FFFF

common_use_cases:
  - use_case: "bit_manipulation"
    description: "Fast bit operations"
    code: |
      PUB reverse_bits(value) : result
        ORG
          REV   value       ' Reverse all 32 bits
          MOV   result, value
        END
  
  - use_case: "cordic_operations"
    description: "Hardware math acceleration"
    code: |
      PUB fast_multiply(x, y) : product
        ORG
          QMUL  x, y
          GETQX product
        END
  
  - use_case: "precise_timing"
    description: "Cycle-accurate delays"
    code: |
      PUB pulse(pin, width)
        ORG
          DRVH  pin
          WAITX width
          DRVL  pin
        END
  
  - use_case: "atomic_operations"
    description: "Uninterruptible sequences"
    code: |
      PUB atomic_increment(address) : new_value
        ORG
          RDLONG new_value, address
          ADD    new_value, #1
          WRLONG new_value, address
        END

cog_loading:
  basic_pattern: |
    DAT
      ORG   0
    cog_code
      ' PASM2 code here
      
    PUB start_cog()
      COGINIT(COGEXEC_NEW, @cog_code, @parameters)
  
  with_communication: |
    DAT
      ' Mailbox in hub
      command   LONG  0
      param     LONG  0
      result    LONG  0
      
      ' COG code
      ORG   0
    cog_loop
      RDLONG temp, ##@command WZ
      IF_Z  JMP #cog_loop        ' Wait for command
      
      ' Process command
      WRLONG #0, ##@command      ' Clear command
      JMP    #cog_loop

debugging_considerations:
  - consideration: "register_preservation"
    description: "Inline PASM can modify registers"
    solution: "Save/restore if needed"
    
  - consideration: "flag_states"
    description: "C and Z flags affected by PASM"
    solution: "Don't assume flag states after PASM"
    
  - consideration: "stack_usage"
    description: "PASM doesn't use Spin2 stack"
    solution: "Manual stack operations if needed"

performance_guidelines:
  when_to_use_inline:
    - "Inner loops with simple operations"
    - "Bit manipulation and testing"
    - "Hardware interface timing"
    - "CORDIC operations"
    - "Interrupt handlers"
  
  when_not_to_use:
    - "Complex logic (use Spin2)"
    - "String manipulation (use Spin2)"
    - "User interface code (use Spin2)"
    - "Non-critical paths (use Spin2)"

pitfalls:
  - pitfall: "forgetting_org"
    description: "PASM code without ORG directive"
    consequence: "Code doesn't execute as PASM"
    
  - pitfall: "register_confusion"
    description: "Not understanding parameter mapping"
    solution: "Parameters are PR0, PR1, etc."
    
  - pitfall: "address_modes"
    description: "Mixing COG and hub addresses"
    solution: "Use @ for hub addresses, # for immediates"

