# Spin2 Language Construct: Method Definitions (PUB/PRI)
# Source: Parallax Propeller 2 Spin2 Language Documentation v55, PUB and PRI Blocks
# Critical for: Program structure and code organization

construct: "Method Definitions"
category: "program_structure"
type: "method_declaration"

metadata:
  query_tags: ["pub", "pri", "method", "function", "procedure", "subroutine", "parameters", "return"]
  complexity: "beginner"
  common_questions:
    - "How do I define a method in Spin2?"
    - "What's the difference between PUB and PRI?"
    - "How do I return values from methods?"
    - "How do I pass parameters?"

fundamental_concepts: |
  Methods are the primary code organization unit in Spin2:
  - PUB (public) methods are available to the parent object and to the object they are defined in
  - PRI (private) methods are available only to the object they are defined in
  - The first PUB method in an object is what executes when that object is run as the top-level object
  - Methods can have parameters, return values, and local variables

syntax:
  basic_structure: |
    PUB method_name()
      ' Method body
    
    PRI helper_method()
      ' Private helper

  with_parameters: |
    PUB method_name(param1, param2, param3)
      ' Use parameters directly
    
  with_return_values: |
    PUB calculate(x, y) : result
      result := x + y
    
  with_multiple_returns: |
    PUB divide(dividend, divisor) : quotient, remainder
      quotient := dividend / divisor
      remainder := dividend // divisor
    
  with_local_variables: |
    PUB process(input) : output | temp1, temp2, temp3
      temp1 := input * 2
      temp2 := temp1 + 10
      output := temp2 / 3
    
  complete_form: |
    PUB method_name(param1, param2) : return1, return2 | local1, local2
      ' Parameters: param1, param2
      ' Return values: return1, return2 
      ' Local variables: local1, local2

special_behaviors:
  - behavior: "entry_point"
    description: "First PUB method in top file is program entry"
    example: |
      PUB main()    ' This executes when program starts
        setup()
        REPEAT
          loop()
    
  - behavior: "object_needs_a_public_method"
    description: "An object is a file that contains at least one public method"

  - behavior: "default_return"
    description: "A method with no declared results returns nothing and cannot be used in an expression"

  - behavior: "return_initialization"
    description: "Return variables initialize to 0"

  - behavior: "parameter_passing"
    description: "Every parameter is a long (or a structure of up to 15 longs, or a pointer when declared ^BYTE/^WORD/^LONG/^StructName), passed by value"
    note: "An array or an object cannot be passed as such: pass its address (@array) and read it with BYTE[]/WORD[]/LONG[] or a typed pointer"

method_visibility:
  pub_methods:
    visibility: "Available to the parent object and to the object it is defined in"
    example: |
      PUB start(pin, baud)    ' Public initialization
        initialize(pin, baud)
  
  pri_methods:
    visibility: "Available only to the object it is defined in"
    example: |
      PRI initialize(pin, baud)    ' Private helper
        configure_pin(pin)
        set_baud_rate(baud)

parameter_handling:
  passing_mechanism: "By value (a long copy per parameter)"

  array_parameters: |
    PUB clear_array(array, size)    ' array = address of the first long (caller passes @buf); size = number of longs
      REPEAT size
        LONG[array][0] := 0
        array += 4
  
  default_values: |
    ' A call must supply every parameter. A second method with its own name
    ' can pass fixed values for the ones its callers leave out:
    PUB configure(pin, mode, pull)
      ' Full configuration

    PUB configure_simple(pin)
      configure(pin, OUTPUT, NO_PULL)    ' Fixed mode and pull

return_values:
  single_return: |
    PUB calculate(x) : result
      result := x * x + 2 * x + 1
  
  multiple_returns: |
    PUB get_coordinates() : x, y, z
      x := read_x_sensor()
      y := read_y_sensor()
      z := read_z_sensor()
  
  early_return: |
    PUB validate(value) : valid
      IF value < 0
        RETURN FALSE        ' Early return
      IF value > MAX_VALUE
        RETURN FALSE
      RETURN TRUE          ' Explicit return
  
  implicit_return: |
    PUB square(x) : result
      result := x * x      ' Returns result implicitly

local_variables:
  declaration: "After return values, separated by |"
  scope: "Exist only during method execution"
  initialization: "Always initialized to 0"
  
  example: |
    PUB calculate_average(a, b, c) : avg | sum, count
      sum := a + b + c
      count := 3
      avg := sum / count

method_limits:
  symbol_names:
    maximum: 30
    description: "Maximum 30 characters for method and parameter names"
    source: "CP-001 (the compiler refuses a symbol of 31 characters); Parallax Propeller 2 Spin2 Language Documentation v55, Spin2 Overview (states symbolic names up to 32 characters)"

  parameters:
    maximum: 127
    description: "Maximum 127 parameters per method"
    source: "Parallax Propeller 2 Spin2 Language Documentation v55, PUB and PRI Blocks (0 to 127 input parameter longs)"
    default_type: "LONG (32-bit)"
    type_overrides:
      pointers: "^BYTE, ^WORD, ^LONG, ^StructName"
      description: "Parameters can be pointers to different-sized types"
      example: "PUB process(^BYTE strPtr, ^LONG dataPtr)"

  return_values:
    maximum: 15
    description: "Maximum 15 return values per method"
    source: "Parallax Propeller 2 Spin2 Language Documentation v55, PUB and PRI Blocks (0 to 15 output result longs)"
    default_type: "LONG (32-bit)"
    type_overrides:
      pointers: "^BYTE, ^WORD, ^LONG, ^StructName"
      description: "Returns can be pointers to different-sized types"
      example: "PUB getBuffer() : ^BYTE result"

  local_variables:
    maximum: "64KB"
    description: "Up to 64KB of local variables per method"
    source: "Parallax Propeller 2 Spin2 Language Documentation v55, PUB and PRI Blocks (up to 64KB of local variables; BYTE, WORD, LONG, and StructName overrides)"
    default_type: "LONG (32-bit)"
    type_overrides:
      basic_types: "BYTE, WORD, LONG, StructName"
      pointers: "^BYTE, ^WORD, ^LONG, ^StructName"
      arrays: "Supported with [size] syntax"
      alignment: "ALIGNW, ALIGNL for word/long alignment"
      description: "Locals can be sized types, arrays, pointers, and aligned"
      example: "PUB process() : result | BYTE buffer[64], WORD index, ALIGNL LONG data[16]"
    complete_syntax_example: "PRI STRCHECK(STRPTRA, STRPTRB) : PASS | I, BYTE STR[64]"
    
  register_mapping:
    count: 16
    description: "In inline PASM, the method's first 16 long variables are copied into cog registers at the start of the block and written back at END"
    registers: "$1E0-$1EF"
    includes: "Parameters, return values, and locals (in that order)"

stack_usage: |
  Each method call uses stack space for:
  - Return address
  - Parameters
  - Local variables
  - Return values

  Parameters, then results, then local variables are packed into stack memory in the
  order they are declared.

common_patterns:
  - pattern: "initialization"
    description: "Standard start/stop pattern"
    code: |
      VAR
        LONG cog
      
      PUB start() : success | id
        stop()
        id := COGINIT(COGEXEC_NEW, @pasm_code, @params)
        IF id >= 0
          cog := id + 1
        success := cog

      PUB stop()
        IF cog
          COGSTOP(cog - 1)
          cog := 0
  
  - pattern: "getter_setter"
    description: "Property access pattern"
    code: |
      VAR
        LONG _value
      
      PUB set_value(v)
        _value := v
      
      PUB get_value() : v
        v := _value
  
  - pattern: "setter_calls"
    description: "Each setter is called as its own statement"
    code: |
      VAR
        LONG x, y

      PUB set_x(value)
        x := value

      PUB set_y(value)
        y := value

      ' Usage, from a parent object:
      '   obj.set_x(10)
      '   obj.set_y(20)
      '   obj.draw()

pitfalls:
  - pitfall: "forgetting_return_declaration"
    description: "Using RETURN with value but no return declaration"
    wrong: |
      PUB calculate(x)
        RETURN x * 2    ' Error - no return variable declared
    correct: |
      PUB calculate(x) : result
        RETURN x * 2    ' Or: result := x * 2
  
  - pitfall: "duplicate_names"
    description: "Spin2 has no shadowing: a parameter, result or local with the name of a VAR, DAT or CON symbol of the same object is a compile error (names are unique per object and not case-sensitive)"
    wrong: |
      VAR
        LONG count

      PUB method() | count    ' error: 'count' already names the VAR
        count := 10
    correct: |
      VAR
        LONG count

      PUB method() | cnt2
        cnt2 := 10
        count := cnt2

performance:
  stack_operations: "Parameters, return values and local variables are in hub RAM"

pasm_integration: |
  PUB methods can contain inline PASM2:
  
  PUB fast_multiply(x, y) : result
    ORG
      QMUL x, y
      GETQX result
    END

related_constructs:
  - "p2kbSpin2Blocks"
  - "p2kbSpin2KwVAR"
  - "p2kbSpin2KwDAT"
  - "p2kbSpin2KwCON"
  - "p2kbSpin2KwOBJ"
  - "p2kbSpin2InlinePasm"
  - "language/spin2/concepts/method-pointers.yaml"
  
related_concepts:
  - "Object-oriented design"
  - "Encapsulation"
  - "Method signatures"
  - "Stack frame management"

sources:
  - "Parallax Propeller 2 Spin2 Language Documentation v55, PUB and PRI Blocks (availability, the first PUB, limits, overrides, packing order, results and locals initialized to zero, syntax); Spin2 Overview (objects contain at least one public method); PUB/PRI variables (hub); In-line PASM (the first 16 long variables copied to $1E0..$1EF and restored at the end); Built-In Methods (COGINIT, COGSTOP)"
  - "Parallax Spin2 Interpreter v55 (2026.05.07), drophot, callhot, returnh, callgo (the stack frame, the return address, locals cleared)"
  - "P2 hardware verification, EF-120 (the start pattern: COGINIT(COGEXEC_NEW, ...) returned $8000_000F with all 8 cogs running)"
  - "CP-057 (pnut-ts 1.55.10 refuses: an expression using a method with no results; RETURN with a value and no declared result; a call missing a parameter; a local, parameter or result named as a VAR, DAT or CON symbol)"