# Spin2 Language Construct: IF/IFNOT/ELSEIF/ELSEIFNOT/ELSE
# Source: Spin2 v51 documentation, pnut-ts Control-Flow-Usage-Guide.md
# Critical for: Conditional execution and branching

construct: "IF/IFNOT/ELSEIF/ELSEIFNOT/ELSE"
category: "control_flow"
type: "conditional"

metadata:
  query_tags: ["if", "ifnot", "conditional", "branch", "elseif", "elseifnot", "else", "decision", "test"]
  complexity: "beginner"
  use_cases: ["conditional_execution", "decision_trees", "value_testing", "state_checks"]
  common_questions:
    - "How do I make conditional decisions?"
    - "How do I test multiple conditions?"
    - "How do I chain IF statements?"

syntax_forms:
  - form: "simple_if"
    syntax: "IF condition"
    description: "Execute the indented block if condition is true (non-zero); the statement goes on the following indented line - Spin2 has no one-line IF"
    example: |
      IF x > 10
        handle_overflow()
    
  - form: "if_else"
    syntax: |
      IF condition
        true_block
      ELSE
        false_block
    description: "Execute one of two blocks based on condition"
    example: |
      IF sensor < threshold
        PINHIGH(56)
      ELSE
        PINLOW(56)
    
  - form: "if_elseif_chain"
    syntax: |
      IF condition1
        block1
      ELSEIF condition2
        block2
      ELSEIF condition3
        block3
      ELSE
        default_block
    description: "Test multiple conditions in sequence"
    example: |
      IF temperature > 100
        state := TOO_HOT
      ELSEIF temperature < 0
        state := TOO_COLD
      ELSEIF temperature > 80
        state := WARM
      ELSE
        state := NORMAL
    
  - form: "ifnot"
    syntax: "IFNOT condition"
    description: "Execute block when condition is FALSE (zero)"
    example: |
      ' Execute if sensor_value is zero
      IFNOT sensor_value
        handle_no_signal()

      ' Equivalent to:
      IF sensor_value == 0
        handle_no_signal()
    note: "IFNOT inverts the condition test"

  - form: "elseifnot"
    syntax: "ELSEIFNOT condition"
    description: "Additional branch that executes when condition is FALSE"
    example: |
      IF a > 0
        handle_positive_a()
      ELSEIFNOT b              ' Execute if b is zero
        handle_zero_b()
      ELSE
        handle_other()

condition_evaluation:
  TRUE: "Any non-zero value"
  FALSE: "Zero only"
  note: "IFNOT and ELSEIFNOT invert the condition test"

block_syntax:
  indentation_rules:
    - "Blocks defined by indentation level"
    - "All statements at same indent are part of block"
    - "Block ends when indentation decreases"
  
  example: |
    IF mode == ACTIVE
      start_timer()        ' Part of IF block
      enable_outputs()     ' Part of IF block
      status := RUNNING    ' Part of IF block
    update_display()       ' NOT part of IF block

condition_expressions:
  boolean_operators:
    - operator: "AND"
      description: "Logical AND"
      example: "IF x > 0 AND x < 100"
    
    - operator: "OR"
      description: "Logical OR"
      example: "IF status == ERROR OR status == FAULT"
    
    - operator: "NOT"
      description: "Logical NOT"
      example: "IF NOT ready"
    
    - operator: "XOR"
      description: "Logical XOR"
      example: "IF switch1 XOR switch2"

  comparison_operators:
    - operator: "=="
      description: "Equal to"
    - operator: "<>"
      description: "Not equal to"
    - operator: "<"
      description: "Less than"
    - operator: ">"
      description: "Greater than"
    - operator: "<="
      description: "Less than or equal"
    - operator: ">="
      description: "Greater than or equal"

  special_comparisons:
    - operator: "<=>"
      description: "Signed comparison (<,=,> returns -1,0,1)"
      example: "IF (x <=> y) == 1  ' x > y"

common_patterns:
  - pattern: "range_check"
    description: "Test if value is within range"
    code: |
      IF value >= MIN_LIMIT AND value <= MAX_LIMIT
        process_valid_value(value)
    
  - pattern: "state_machine"
    description: "State-based execution"
    code: |
      IF state == IDLE
        check_for_start()
      ELSEIF state == RUNNING
        process_data()
      ELSEIF state == ERROR
        handle_error()
      ELSE
        reset_system()
    
  - pattern: "null_check"
    description: "Check for valid pointer/value"
    code: |
      IF ptr
        use_pointer(ptr)
      ELSE
        handle_null()
    
  - pattern: "bit_test"
    description: "Test specific bit"
    code: |
      IF flags & ENABLE_BIT
        feature_enabled()
    
  - pattern: "nested_conditions"
    description: "Complex nested logic"
    code: |
      IF mode == AUTO
        IF sensor > threshold
          IF NOT alarm_active
            trigger_alarm()

special_features:
  - feature: "guard_a_dereference"
    description: "AND / OR (&&, ||) evaluate BOTH operands, so they cannot guard a dereference; nest the IFs"
    example: |
      {Spin2_v45}
      CON
        STRUCT node(value)

      VAR
        ^node ptr             ' typed pointer: ptr.value is the pointed-to member

      PUB check() : positive
        IF ptr
          IF ptr.value > 0    ' reached only when ptr <> 0
            positive := TRUE
    
  - feature: "assignment_in_condition"
    description: "Can assign and test in same expression"
    example: |
      IF (value := read_sensor()) > limit
        process_high_value(value)
    
  - feature: "method_call_conditions"
    description: "Methods can return boolean results"
    example: |
      IF is_ready() AND has_data()
        process()

pitfalls:
  - pitfall: "assignment_vs_comparison"
    description: "Using = instead of == (Spin2 uses := for assignment)"
    wrong: |
      IF x = 10    ' This is comparison, not assignment!
    correct: |
      IF x == 10   ' Comparison
      x := 10      ' Assignment

  - pitfall: "missing_else"
    description: "Forgetting ELSE in ELSEIF chains"
    consideration: "Always consider if final ELSE is needed"

  - pitfall: "indentation_errors"
    description: "A statement indented less than the body ends the IF block; a statement indented more than the first body line stays in the block"
    wrong: |
      IF condition
        statement1
      statement2         ' Outdented - runs always, not part of the IF block
    correct: |
      IF condition
        statement1
        statement2       ' Same indent - both in IF block

  - pitfall: "deeply_nested_conditionals"
    description: "Deeply nested conditionals are hard to read and maintain"
    wrong: |
      IF a > 0
        IF b > 0
          IF c > 0
            do_something()
          ELSE
            do_other()
        ELSE
          IF c > 0
            do_third()
          ELSE
            do_fourth()
      ELSE
        ' ... more nesting
    correct: |
      ' Use early returns or CASE to flatten
      IF a <= 0
        handle_non_positive_a()
        RETURN

      IF b <= 0
        handle_non_positive_b()
        RETURN

      IF c > 0
        do_something()
      ELSE
        do_other()

performance:
  evaluation_order: "Conditions are tested top to bottom; the first IF/ELSEIF whose condition is non-zero (IFNOT/ELSEIFNOT: zero) runs. AND/OR evaluate both operands, left first."
  overhead: "The KB publishes no per-statement clock count; Spin2 statements run as interpreter bytecodes"
  optimization_tips:
    - "Put most likely condition first in ELSEIF chains"
    - "Use CASE for multiple equality tests on same variable"
    - "Consider lookup tables for complex mappings"

related:
  - language/spin2/constructs/case.yaml
  - language/spin2/constructs/repeat.yaml
  - language/spin2/keywords/IF.yaml
  - language/spin2/keywords/IFNOT.yaml
  - language/spin2/keywords/ELSEIF.yaml
  - language/spin2/keywords/ELSEIFNOT.yaml
  - language/spin2/keywords/ELSE.yaml