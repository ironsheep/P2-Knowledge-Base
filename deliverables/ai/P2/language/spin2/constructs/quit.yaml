# Spin2 Language Construct: QUIT
construct: "QUIT"
category: "control_flow"
type: "loop_control"

description: "Exit current REPEAT loop immediately (like 'break')"

syntax:
  - "QUIT"         # Exit the current (innermost enclosing) loop
  - "QUIT level"   # Exit an OUTER loop; level counts outward, 1-15
                   #   (bare QUIT = current loop; QUIT 1 = 1st-outer loop, which also escapes
                   #    every loop nested inside it; QUIT 2 = 2nd-outer; ...)

example: |
  REPEAT i FROM 0 TO 99
    IF array[i] == target
      QUIT          ' Exit loop when found
    process(array[i])
  ' Execution continues here after QUIT
  
  ' Exit nested loops (level counts outward from the current loop):
  REPEAT x FROM 0 TO 9      ' outer loop
    REPEAT y FROM 0 TO 9    ' inner loop (current at the QUIT)
      IF grid[x][y] == value
        QUIT 1              ' Exit the x loop (1 = 1st-outer), escaping both

critical_behavior:
  - "Exits loop completely (not just iteration)"
  - "Bare QUIT exits the current loop; QUIT level exits the level-th OUTER loop (1-15)"
  - "Exiting an outer loop also escapes every loop nested inside it"
  - "Loop counter/state abandoned"

common_patterns: |
  ' Infinite loop with exit
  REPEAT
    data := read_sensor()
    IF data == STOP_VALUE
      QUIT
    process(data)
  
  ' Search with early exit
  found := FALSE
  REPEAT i FROM 0 TO MAX-1
    IF items[i] == search_value
      found := TRUE
      QUIT

critical_pitfall: "QUIT only works in REPEAT loops, not in methods (use ABORT/RETURN)"

comparison:
  quit: "Exits loop entirely"
  next: "Skips to next iteration"
  abort: "Exits entire method"

related:
  - language/spin2/constructs/repeat.yaml
  - language/spin2/constructs/next.yaml
  - language/spin2/keywords/QUIT.yaml