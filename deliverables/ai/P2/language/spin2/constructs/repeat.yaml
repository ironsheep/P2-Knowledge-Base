# Spin2 Language Construct: REPEAT
# Source: Spin2 v51 documentation, pnut_ts Control-Flow-Usage-Guide.md
# Critical for: Loop control and iteration

construct: "REPEAT"
category: "control_flow"
type: "loop"

metadata:
  query_tags: ["loop", "iteration", "repeat", "while", "until", "for_loop", "infinite_loop"]
  complexity: "beginner"
  use_cases: ["counting", "infinite_loops", "range_iteration", "conditional_loops", "timing_loops"]
  common_questions:
    - "How do I create a loop in Spin2?"
    - "How do I repeat N times?"
    - "How do I loop through a range?"
    - "How do I create an infinite loop?"

variants:
  - variant: "infinite"
    syntax: "REPEAT"
    description: "Infinite loop - continues forever until QUIT or ABORT"
    example: |
      REPEAT
        PINTOGGLE(56)
        WAITMS(500)
    
  - variant: "count"
    syntax: "REPEAT count"
    description: "Repeat exactly 'count' times"
    example: |
      REPEAT 10
        flash_led()
        
  - variant: "pre_test_while"
    syntax: "REPEAT WHILE condition"
    description: "Continue while condition is true; the condition is tested BEFORE each pass, so the body may never run"
    example: |
      REPEAT WHILE x < 100
        x += increment

  - variant: "pre_test_until"
    syntax: "REPEAT UNTIL condition"
    description: "Continue until condition becomes true; the condition is tested BEFORE each pass, so the body may never run"
    example: |
      REPEAT UNTIL button_pressed()
        scan_sensors()

  - variant: "bounded_wait"
    syntax: |
      REPEAT count
        IF done_condition
          QUIT
    description: "At most count passes, leaving early when the condition is met (Spin2 has no REPEAT count WHILE / UNTIL form)"
    example: |
      REPEAT timeout
        IF data_ready()
          QUIT
        WAITMS(1)

  - variant: "from_to"
    syntax: "REPEAT variable FROM start TO end"
    description: "Iterate variable from start to end (inclusive)"
    example: |
      REPEAT i FROM 0 TO 9
        array[i] := 0
        
  - variant: "from_to_step"
    syntax: "REPEAT variable FROM start TO end STEP increment"
    description: "Iterate with a custom step size (direction comes from FROM and TO; the sign of STEP is ignored)"
    example: |
      REPEAT j FROM 100 TO 0 STEP -10
        pwm_value := j

  - variant: "count_with_var"
    syntax: "REPEAT count WITH variable"
    description: "Shorthand for counting from 0 to count-1"
    example: |
      REPEAT 10 WITH i           ' i = 0, 1, 2, ..., 9
        indices[i] := i

      ' Equivalent to:
      REPEAT i FROM 0 TO 9
        indices[i] := i
    use_cases:
      - "Array initialization with index"
      - "When you need both count and index variable"

  - variant: "post_while"
    syntax: |
      REPEAT
        statements
      WHILE condition
    description: "Test condition AFTER each iteration - block always executes at least once"
    example: |
      REPEAT
        value := read_input()
      WHILE value < 0 OR value > 100  ' Re-prompt if invalid

  - variant: "post_until"
    syntax: |
      REPEAT
        statements
      UNTIL condition
    description: "Test condition AFTER each iteration - block always executes at least once"
    example: |
      REPEAT
        byte_val := receive()
        store(byte_val)
      UNTIL byte_val == END_MARKER

pre_vs_post_condition:
  pre_condition:
    forms: ["REPEAT WHILE condition", "REPEAT UNTIL condition"]
    behavior: "Test BEFORE each iteration"
    note: "Block may never execute if initial condition fails"
  post_condition:
    forms: ["REPEAT ... WHILE condition", "REPEAT ... UNTIL condition"]
    behavior: "Test AFTER each iteration"
    note: "Block always executes at least once"

control_keywords:
  - keyword: "NEXT"
    description: "Skip to next iteration (like continue)"
    example: |
      REPEAT i FROM 0 TO 99
        IF array[i] == 0
          NEXT              ' Skip zeros
        process(array[i])
    
  - keyword: "QUIT"
    description: "Exit current REPEAT loop (like break)"
    example: |
      REPEAT
        value := read_sensor()
        IF value > limit
          QUIT              ' Exit loop
        accumulate(value)
    
  - keyword: "QUIT level / NEXT level"
    syntax: "QUIT level   |   NEXT level"
    description: "Exit (QUIT) or continue (NEXT) an OUTER loop; level counts outward, 1-15 (1 = 1st-outer loop, which also escapes loops nested inside it). Bare QUIT/NEXT acts on the current loop. Introduced in v52; not an enforced compiler gate."
    example: |
      REPEAT x FROM 0 TO 9          ' outer loop
        REPEAT y FROM 0 TO 9        ' inner loop (current)
          IF grid[x*10+y] == target
            QUIT 1       ' Exit the x loop (1st-outer), escaping both

special_behaviors:
  - behavior: "zero_count"
    description: "REPEAT 0 skips the loop entirely"
    
  - behavior: "variable_scope"
    description: "The loop variable must already be declared (VAR, parameter, result or local); REPEAT does not create it, and after the loop it holds <last> +/- <step> (REPEAT <variable> FROM ... TO ...)"

  - behavior: "step_direction"
    description: "FROM and TO set the direction (up when TO is above FROM, down when below); STEP only sets the size of the step - its sign is ignored"

common_patterns:
  - pattern: "delay_loop"
    description: "Create precise timing delays"
    code: |
      REPEAT 1000
        WAITMS(1)          ' 1000 x 1 ms = 1 second
    
  - pattern: "array_init"
    description: "Initialize array elements"
    code: |
      REPEAT i FROM 0 TO ARRAY_SIZE-1
        array[i] := initial_value
    
  - pattern: "polling_loop"
    description: "Poll until condition met with timeout"
    code: |
      REPEAT 1000
        IF PINREAD(pin)
          QUIT
        WAITUS(100)
    
  - pattern: "infinite_main"
    description: "Main program loop"
    code: |
      REPEAT
        handle_inputs()
        update_state()
        generate_outputs()

pitfalls:
  - pitfall: "missing_quit"
    description: "Forgetting QUIT in infinite loop with condition"
    wrong: |
      REPEAT
        IF done
          ' Forgot QUIT here!
    correct: |
      REPEAT
        IF done
          QUIT

  - pitfall: "step_sign_is_ignored"
    description: "The sign of STEP does not choose the direction; FROM versus TO does"
    example: |
      REPEAT i FROM 10 TO 0 STEP 1     ' counts DOWN 10..0: the sign of STEP is ignored
        process(i)
      REPEAT i FROM 10 TO 0 STEP -1    ' the identical loop
        process(i)
    note: "After the loop i = last +/- |step|"

  - pitfall: "modifying_loop_variable"
    description: "Modifying the loop variable inside a FROM..TO loop changes the loop's progress; usually a bug"
    wrong: |
      REPEAT i FROM 0 TO 10
        i += 2                   ' Don't do this!
        process(i)
    correct: |
      ' Use WHILE for complex iteration control
      i := 0
      REPEAT WHILE i <= 10
        process(i)
        i += 3

  - pitfall: "post_condition_processes_invalid"
    description: "Post-condition loop processes data before checking validity"
    wrong: |
      REPEAT
        value := read_input()
        process(value)           ' Processes even if invalid!
      UNTIL value == VALID
    correct: |
      ' Check before processing
      REPEAT
        value := read_input()
        IF value == VALID
          process(value)
      UNTIL value == VALID

performance:
  overhead: "The KB publishes no per-statement clock count; Spin2 statements run as interpreter bytecodes"
  optimization_tips:
    - "Use REPEAT count for known iterations"
    - "Place most likely QUIT condition first in nested IFs"
    - "Consider unrolling small fixed loops"

related:
  - language/spin2/constructs/if_elseif_else.yaml
  - language/spin2/constructs/case.yaml
  - language/spin2/constructs/next.yaml
  - language/spin2/constructs/quit.yaml
  - language/spin2/methods/waitms.yaml
  - language/spin2/methods/waitus.yaml
  - language/spin2/methods/waitct.yaml