pattern_id: "cog_management"
category: "multi_cog_programming"
description: "Patterns for managing COG lifecycle and inter-COG coordination"

coginit_modes:
  description: "COGINIT CogNum symbols for PASM code"
  modes:
    - mode: "COGEXEC"
      value: "%000000"
      description: "COGEXEC + cog number starts that cog in cogexec mode (the default)"
    - mode: "HUBEXEC"
      value: "%100000"
      description: "HUBEXEC + cog number starts that cog in hubexec mode"
    - mode: "COGEXEC_NEW"
      value: "%010000"
      description: "Starts an available cog in cogexec mode"
    - mode: "HUBEXEC_NEW"
      value: "%110000"
      description: "Starts an available cog in hubexec mode"
    - mode: "COGEXEC_NEW_PAIR"
      value: "%010001"
      description: "Starts an available even/odd pair of cogs in cogexec mode"
    - mode: "HUBEXEC_NEW_PAIR"
      value: "%110001"
      description: "Starts an available even/odd pair of cogs in hubexec mode"

patterns:
  - pattern: "basic_cog_lifecycle"
    description: "Cog start and stop with the ID kept as ID + 1, so a VAR that starts at zero means no cog"
    code: |
      VAR
        long cog_id_plus_1      ' 0 = no cog started
        long stack[64]

      PUB start() : success | id
        stop()  ' Stop if already running
        id := COGSPIN(NEWCOG, worker(), @stack)
        if id >= 0
          cog_id_plus_1 := id + 1
        return id >= 0

      PUB stop()
        if cog_id_plus_1
          COGSTOP(cog_id_plus_1 - 1)
          cog_id_plus_1 := 0

      PRI worker()
        REPEAT
          ' Do work in parallel

  - pattern: "driver_object"
    description: "Driver object with start, stop and ring buffers"
    code: |
      ' serial_driver.spin2
      VAR
        long cog_id_plus_1      ' 0 = no cog started
        long rx_head, rx_tail
        long tx_head, tx_tail
        byte rx_buffer[256]
        byte tx_buffer[256]
        long stack[100]

      PUB start(rx_pin, tx_pin, baud) : ok | id
        stop()  ' Stop if already running

        ' Initialize state
        rx_head := rx_tail := 0
        tx_head := tx_tail := 0

        ' Start driver COG
        id := COGSPIN(NEWCOG, driver_loop(rx_pin, tx_pin, baud), @stack)
        if id >= 0
          cog_id_plus_1 := id + 1
        ok := id >= 0

      PUB stop()
        if cog_id_plus_1
          COGSTOP(cog_id_plus_1 - 1)
          cog_id_plus_1 := 0

      PUB tx(char)
        ' Add to TX buffer with flow control
        REPEAT WHILE ((tx_tail + 1) & $FF) == tx_head
        tx_buffer[tx_tail] := char
        tx_tail := (tx_tail + 1) & $FF

      PUB rx() : char
        REPEAT WHILE rx_head == rx_tail
        char := rx_buffer[rx_head]
        rx_head := (rx_head + 1) & $FF

      PRI driver_loop(rxp, txp, baud)
        ' Configure pins and run TX/RX loop
        REPEAT
          ' ... handle TX/RX

  - pattern: "command_status_block"
    description: "Ongoing inter-COG communication with command/status protocol"
    code: |
      CON
        ' Command block offsets
        CMD_COMMAND  = 0
        CMD_PARAM1   = 1
        CMD_PARAM2   = 2
        CMD_STATUS   = 3
        CMD_RESULT   = 4

        ' Commands
        CMD_IDLE     = 0
        CMD_START    = 1
        CMD_STOP     = 2
        CMD_READ     = 3

        ' Status values
        STAT_IDLE    = 0
        STAT_BUSY    = 1
        STAT_DONE    = 2
        STAT_ERROR   = 3

      VAR
        long cmd_block[5]
        long worker_stack[200]
        long worker_cog

      PUB start() : ok
        cmd_block[CMD_COMMAND] := CMD_IDLE
        cmd_block[CMD_STATUS] := STAT_IDLE
        worker_cog := COGSPIN(NEWCOG, worker_main(@cmd_block), @worker_stack)
        ok := worker_cog >= 0

      PUB send_command(cmd, p1, p2) : result
        ' Wait for worker to be idle
        REPEAT WHILE cmd_block[CMD_STATUS] == STAT_BUSY

        ' Set up command
        cmd_block[CMD_PARAM1] := p1
        cmd_block[CMD_PARAM2] := p2
        cmd_block[CMD_STATUS] := STAT_BUSY
        cmd_block[CMD_COMMAND] := cmd

        ' Signal worker
        COGATN(1 << worker_cog)

        ' Wait for completion
        REPEAT WHILE cmd_block[CMD_STATUS] == STAT_BUSY

        result := cmd_block[CMD_RESULT]

      PRI worker_main(block_ptr) | cmd
        REPEAT
          WAITATN()  ' Wait for signal

          cmd := long[block_ptr][CMD_COMMAND]
          CASE cmd
            CMD_START:
              do_start(long[block_ptr][CMD_PARAM1])
              long[block_ptr][CMD_STATUS] := STAT_DONE

            CMD_READ:
              long[block_ptr][CMD_RESULT] := do_read()
              long[block_ptr][CMD_STATUS] := STAT_DONE

            CMD_STOP:
              long[block_ptr][CMD_STATUS] := STAT_IDLE
              RETURN

  - pattern: "producer_consumer"
    description: "Producer and consumer cogs sharing a circular buffer through head and tail indexes, with no lock"
    code: |
      CON
        BUFFER_SIZE = 256
        BUFFER_MASK = BUFFER_SIZE - 1

      VAR
        long head, tail
        long buffer[BUFFER_SIZE]
        long producer_cog, consumer_cog
        long prod_stack[100], cons_stack[100]

      PUB start() : ok
        head := tail := 0
        producer_cog := COGSPIN(NEWCOG, producer(), @prod_stack)
        consumer_cog := COGSPIN(NEWCOG, consumer(), @cons_stack)
        ok := producer_cog >= 0 and consumer_cog >= 0

      PRI producer() | item
        REPEAT
          item := generate_item()

          ' Wait for space in buffer
          REPEAT WHILE ((head + 1) & BUFFER_MASK) == tail

          buffer[head] := item
          head := (head + 1) & BUFFER_MASK

      PRI consumer() | item
        REPEAT
          ' Wait for item in buffer
          REPEAT WHILE head == tail

          item := buffer[tail]
          tail := (tail + 1) & BUFFER_MASK

          process_item(item)

  - pattern: "lock_protected_data"
    description: "Shared data with lock synchronization"
    code: |
      VAR
        long data_lock
        long shared_data[100]

      PUB init() : ok
        data_lock := LOCKNEW()
        ok := data_lock >= 0      ' a negative value: no lock was available

      PUB read_data(index) : value
        REPEAT UNTIL LOCKTRY(data_lock)
        value := shared_data[index]
        LOCKREL(data_lock)

      PUB write_data(index, value)
        REPEAT UNTIL LOCKTRY(data_lock)
        shared_data[index] := value
        LOCKREL(data_lock)

      PUB atomic_increment(index) : old_value
        REPEAT UNTIL LOCKTRY(data_lock)
        old_value := shared_data[index]
        shared_data[index] := old_value + 1
        LOCKREL(data_lock)

anti_patterns:
  - anti_pattern: "insufficient_stack"
    severity: "overflow_check_not_documented"
    description: "A COGSPIN stack is a hub buffer you provide and size; no stack overflow check is documented (language/spin2/methods/cogspin.yaml)"
    wrong: |
      VAR
        long tiny_stack[10]   ' size not derived from the method

      PUB start()
        COGSPIN(NEWCOG, complex_method(), @tiny_stack)
    correct: |
      VAR
        long sized_stack[200]   ' size chosen for this method

      PUB start()
        COGSPIN(NEWCOG, complex_method(), @sized_stack)
    sizing_guidance: "No Parallax document states a stack size. application-notes/p2an006-sizing-cog-task-stacks.yaml describes a high-water-mark measurement"

  - anti_pattern: "lost_cog_id"
    severity: "resource_leak"
    description: "Discarding COG ID prevents stopping the COG later"
    wrong: |
      PUB start()
        COGSPIN(NEWCOG, worker(), @stack)  ' COG ID discarded!

      PUB stop()
        ' Can't stop - don't know which COG!
    correct: |
      VAR
        long worker_cog_plus_1      ' 0 = no cog started

      PUB start() | id
        id := COGSPIN(NEWCOG, worker(), @stack)
        if id >= 0
          worker_cog_plus_1 := id + 1

      PUB stop()
        if worker_cog_plus_1
          COGSTOP(worker_cog_plus_1 - 1)
          worker_cog_plus_1 := 0

  - anti_pattern: "shared_variable_without_a_lock"
    severity: "no_exclusive_access"
    description: "Locks can be used by cogs to coordinate exclusive access of a shared resource; two cogs updating one hub variable with no lock have no such coordination"
    wrong: |
      VAR
        long counter

      PRI worker1()
        REPEAT
          counter++   ' No lock around the update

      PRI worker2()
        REPEAT
          counter++   ' No lock around the update
    correct: |
      VAR
        long counter
        long counter_lock

      PUB init() : ok
        counter_lock := LOCKNEW()
        ok := counter_lock >= 0   ' a negative value: no lock was available

      PRI worker1()
        REPEAT
          REPEAT UNTIL LOCKTRY(counter_lock)
          counter++
          LOCKREL(counter_lock)

  - anti_pattern: "lock_leak"
    severity: "resource_exhaustion"
    description: "Not returning locks exhausts the 16 available locks. The correct form keeps the lock as its number + 1: VAR variables start at zero and 0 is a valid lock number, so a stop() that tested a raw number with >= 0 would run LOCKRET(0) when called before any start()"
    wrong: |
      PUB start()
        my_lock := LOCKNEW()

      PUB stop()
        ' Forgot to return lock - now unavailable!
    correct: |
      VAR
        long lock_plus_1        ' lock number + 1; 0 = no lock

      PUB start() : ok | id
        id := LOCKNEW()
        if id >= 0
          lock_plus_1 := id + 1
        ok := id >= 0

      PUB stop()
        if lock_plus_1
          LOCKRET(lock_plus_1 - 1)
          lock_plus_1 := 0

  - anti_pattern: "polling_vs_waiting"
    severity: "busy_loop"
    description: "POLLATN checks for an ATN strobe and returns; WAITATN waits for one. Not documented: the difference in power."
    wrong: |
      PRI worker()
        REPEAT
          if POLLATN()
            process_command()
          ' The loop keeps running while no strobe has arrived
    correct: |
      PRI worker()
        REPEAT
          WAITATN()           ' Waits for this cog to receive an ATN strobe
          process_command()

resources:
  cogs: "1+ (max 8 total)"
  stack: "one hub buffer per COGSPIN cog; no Parallax document states its size (application-notes/p2an006-sizing-cog-task-stacks.yaml describes a high-water-mark measurement)"
  locks: "16 hardware locks, numbered 0 to 15, shared across all cogs"

sources:
  - "Parallax Propeller 2 Spin2 Language Documentation v55, Built-In Methods (COGSPIN, COGSTOP, COGATN, POLLATN, WAITATN, LOCKNEW, LOCKRET, LOCKTRY, LOCKREL); Built-In Symbols for COGINIT() Usage (the six symbols and their values), for COGSPIN() Usage (NEWCOG); variables are initialized to zero at run time"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), LOCKS (a pool of 16 semaphore bits; exclusive access of a shared resource; all locks already allocated)"
  - "Parallax Propeller 2 Spin2 Language Documentation v55, Built-In Methods (LOCKNEW() : LockNum, 0..15 if successful or < 0 if no LOCK available); VAR (variables are initialized to zero at run time), the ground for keeping a lock as its number + 1"
  - "P2 hardware verification, EF-120 (COGSPIN(NEWCOG, ...) as an expression returned $8000_000F with all 8 cogs running, so the start patterns test the result with >= 0)"

combines_with:
  - language/spin2/methods/cogspin.yaml
  - language/spin2/methods/coginit.yaml
  - language/spin2/methods/cogstop.yaml
  - language/spin2/methods/locknew.yaml
  - language/spin2/methods/cogatn.yaml
  - architecture/locks.yaml
  - architecture/cog_attention.yaml