pattern_id: "pin_control"
when_use:
  - "Direct GPIO manipulation"
  - "Smart pin configuration"
implementation: |
  PUB setup_smartpin(pin, mode)
    wrpin(pin, mode)
    wxpin(pin, $1000)
    wypin(pin, 0)
    pinl(pin)
    
  PUB toggle(pin)
    pintoggle(pin)
resources:
  pins: "varies"
  smart_pins: "0-64"
combines_with:
  - "timing_control"
  - "state_machine"