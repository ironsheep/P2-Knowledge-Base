pattern_id: "several_objects"
description: |
  A multi-subsystem composition — shown as a SHAPE example. The object COUNT
  does not drive the design; composition depth and resource ownership do (see
  note). This is also the literal "flat device list" failure mode if taken at
  face value. See object_archetypes.yaml for archetype templates.

when_use:
  - "4-7 components in system"
  - "Complex subsystem interactions"
  - "Multiple communication interfaces"

implementation: |
  OBJ
    uart[2] : "p2_serial"
    i2c     : "p2_i2c_driver"
    spi     : "p2_spi_driver"
    rtc     : "p2_rtc_driver"

  PUB init()
    uart[0].start(RX0, TX0, BAUD)
    uart[1].start(RX1, TX1, BAUD)
    i2c.init(SDA, SCL)
    spi.start(MISO, MOSI, SCK, CS)
    rtc.configure(i2c.get_bus())

resources:
  dependencies: "4-7"
  cogs: "2-5 typical"

combines_with:
  - "event_dispatcher"
  - "resource_pool"

related:
  - language/spin2/concepts/object_archetypes.yaml

status: "retagged"
note: >
  Object COUNT is not a design driver. A flat list of 4-7 device objects with
  no ownership structure is a warning sign, not a target shape. What matters
  is composition DEPTH and which object OWNS which resource. Derive the cut
  with the decomposition method and Force 1 (resource ownership); treat this
  entry as a shape example, not a selection-by-count rule.

see_also:
  - "The generative decomposition method (don't select by object count): p2kbArchDecompositionMethod"
  - "Force 1 — resource ownership (which object owns which resource): p2kbArchResourceOwnership"