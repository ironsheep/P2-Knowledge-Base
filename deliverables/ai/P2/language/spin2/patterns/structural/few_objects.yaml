pattern_id: "few_objects"
description: |
  Multiple coordinated objects pattern.
  See object_archetypes.yaml for detailed archetype templates.

when_use:
  - "2-3 coordinated components"
  - "Minimal inter-object communication"
  - "Display + sensor combinations"

implementation: |
  OBJ
    display : "p2_oled_driver"
    sensor  : "p2_temp_sensor"

  PUB main()
    display.init()
    sensor.start()
    repeat
      display.show_value(sensor.read_temp())

resources:
  dependencies: "2-3"
  cogs: "1-3 typical"

combines_with:
  - "state_machine"
  - "buffer_management"

related:
  - language/spin2/concepts/object_archetypes.yaml