pattern_id: "few_objects"
description: |
  A small composition of coordinated objects — shown as a SHAPE example.
  The object COUNT does not drive the design; composition depth and resource
  ownership do (see note). See object_archetypes.yaml for archetype templates.

when_use:
  - "2-3 coordinated components"
  - "Minimal inter-object communication"
  - "Display + sensor combinations"

implementation: |
  OBJ
    display : "p2_oled_driver"
    sensor  : "p2_temp_sensor"

  PUB main()
    display.init()
    sensor.start()
    repeat
      display.show_value(sensor.read_temp())

resources:
  dependencies: "2-3"
  cogs: "1-3 typical"

combines_with:
  - "state_machine"
  - "buffer_management"

related:
  - language/spin2/concepts/object_archetypes.yaml

status: "retagged"
note: >
  Object COUNT is not a design driver — two objects with a deep ownership
  hierarchy can be harder to reason about than several flat peers. What
  matters is composition DEPTH and which object OWNS which resource. Derive
  the cut with the decomposition method and Force 1 (resource ownership);
  treat this entry as a shape example, not a selection-by-count rule.

see_also:
  - "The generative decomposition method (don't select by object count): p2kbArchDecompositionMethod"
  - "Force 1 — resource ownership (which object owns which resource): p2kbArchResourceOwnership"