manifest_type: "pattern_index"
description: "P2 Spin2 code patterns for AI code generation"
pattern_categories:
  structural:
    description: "Object structure and composition patterns"
    patterns:
      - language/spin2/patterns/structural/no_objects.yaml
      - language/spin2/patterns/structural/single_object.yaml
      - language/spin2/patterns/structural/few_objects.yaml
      - language/spin2/patterns/structural/several_objects.yaml
      - language/spin2/patterns/structural/framework_pattern.yaml
      
  implementation:
    description: "Spin2 implementation patterns"
    patterns:
      - language/spin2/patterns/implementation/spin2_buffer_management.yaml
      - language/spin2/patterns/implementation/spin2_timing_control.yaml
      - language/spin2/patterns/implementation/spin2_protocol_implementation.yaml
      - language/spin2/patterns/implementation/spin2_pin_control.yaml
      - language/spin2/patterns/implementation/spin2_state_machine.yaml
      - language/spin2/patterns/implementation/spin2_error_handling.yaml
      - language/spin2/patterns/implementation/spin2_memory_allocation.yaml
      - language/spin2/patterns/implementation/spin2_cog_management.yaml
      - language/spin2/patterns/implementation/spin2_diagnostic_output.yaml
      - language/spin2/patterns/implementation/spin2_event_dispatcher.yaml
      - language/spin2/patterns/implementation/spin2_layered_architecture.yaml
      - language/spin2/patterns/implementation/spin2_mailbox_communication.yaml
      - language/spin2/patterns/implementation/spin2_plugin_system.yaml
      - language/spin2/patterns/implementation/spin2_resource_pool.yaml
      - language/spin2/patterns/implementation/spin2_shared_memory.yaml
      - language/spin2/patterns/implementation/spin2_latest_wins_mailbox.yaml
      - language/spin2/patterns/implementation/spin2_rate_domain_decoupler.yaml
      - language/spin2/patterns/implementation/spin2_slew_easing_engine.yaml
      - language/spin2/patterns/implementation/spin2_cooperative_tasking.yaml

  applications:
    description: "Application-level patterns"
    patterns:
      - language/spin2/patterns/applications/display_driver.yaml
      - language/spin2/patterns/applications/sensor_reader.yaml
      - language/spin2/patterns/applications/motor_controller.yaml
      - language/spin2/patterns/applications/communication_handler.yaml
      - language/spin2/patterns/applications/data_logger.yaml
      - language/spin2/patterns/applications/audio_processor.yaml
      - language/spin2/patterns/applications/test_harness.yaml
      - language/spin2/patterns/applications/configuration_manager.yaml
      - language/spin2/patterns/applications/utility_library.yaml
      
  archetypes:
    description: "Canonical object archetype reference"
    patterns:
      - "language/spin2/concepts/object_archetypes.yaml"

selection_guide: |
  1. First, identify your object archetype from language/spin2/concepts/object_archetypes.yaml:
     - Top-Level Application: Entry point with _clkfreq and main()
     - Driver Object: Hardware abstraction with start/stop lifecycle
     - Library Object: Stateless utility functions
     - Singleton Object: DAT-based shared state
     - Configurable Object: Constants overridable by parent
     - Buffered I/O Object: Circular buffer producer-consumer
     - State Machine Object: Explicit states and events
     - Dual-COG Object: Spin2 API + PASM background
     - PASM-Only Object: Maximum performance DAT code

  2. Then select structural patterns for object composition
  3. Add implementation patterns for specific functionality
  4. Finally choose application patterns for domain-specific needs