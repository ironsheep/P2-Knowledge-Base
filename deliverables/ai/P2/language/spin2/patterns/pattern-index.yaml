manifest_type: "pattern_index"
description: "P2 Spin2 code patterns for AI code generation"
pattern_categories:
  structural:
    description: "Object structure and composition patterns"
    patterns:
      - no_objects.yaml
      - single_object.yaml
      - few_objects.yaml
      - several_objects.yaml
      - framework_pattern.yaml
      
  implementation:
    description: "Spin2 implementation patterns"
    patterns:
      - spin2_buffer_management.yaml
      - spin2_timing_control.yaml
      - spin2_protocol_implementation.yaml
      - spin2_pin_control.yaml
      - spin2_state_machine.yaml
      - spin2_error_handling.yaml
      - spin2_memory_allocation.yaml
      - spin2_cog_management.yaml
      - spin2_diagnostic_output.yaml
      - spin2_event_dispatcher.yaml
      - spin2_layered_architecture.yaml
      - spin2_mailbox_communication.yaml
      - spin2_plugin_system.yaml
      - spin2_resource_pool.yaml
      - spin2_shared_memory.yaml
      - spin2_latest_wins_mailbox.yaml
      - spin2_rate_domain_decoupler.yaml
      - spin2_slew_easing_engine.yaml
      - spin2_cooperative_tasking.yaml

  applications:
    description: "Application-level patterns"
    patterns:
      - display_driver.yaml
      - sensor_reader.yaml
      - motor_controller.yaml
      - communication_handler.yaml
      - data_logger.yaml
      - audio_processor.yaml
      - test_harness.yaml
      - configuration_manager.yaml
      - utility_library.yaml
      
  archetypes:
    description: "Canonical object archetype reference"
    patterns:
      - "../concepts/object_archetypes.yaml"

selection_guide: |
  1. First, identify your object archetype from concepts/object_archetypes.yaml:
     - Top-Level Application: Entry point with _clkfreq and main()
     - Driver Object: Hardware abstraction with start/stop lifecycle
     - Library Object: Stateless utility functions
     - Singleton Object: DAT-based shared state
     - Configurable Object: Constants overridable by parent
     - Buffered I/O Object: Circular buffer producer-consumer
     - State Machine Object: Explicit states and events
     - Dual-COG Object: Spin2 API + PASM background
     - PASM-Only Object: Maximum performance DAT code

  2. Then select structural patterns for object composition
  3. Add implementation patterns for specific functionality
  4. Finally choose application patterns for domain-specific needs