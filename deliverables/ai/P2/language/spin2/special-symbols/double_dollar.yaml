symbol: "$$"
type: special_symbol
category: Special Symbols

description: |
  $$ is the DITTO iteration index (v50): inside a DITTO ... DITTO END block it
  iterates from 0 to count - 1. Outside a DITTO block it is an error. It is NOT
  the current address - the current origin is the single $ symbol.

contexts:
  ditto_index:
    description: "Current iteration index in DITTO block"
    location: "Inside DITTO ... DITTO END blocks"
    value: "0 to count-1 for each iteration"
    minimum_version: "v50"
    requires_version: "Spin2_v50"
    version_directive: "{Spin2_v50}"

examples:
  - code: |
      DAT
              org

      routine mov     pa, #1
              jmp     #$                         ' Jump to self (infinite loop)
    description: "PASM2: the single $ is the current origin (not $$) - self-jump"

  - code: |
      DAT
              org

      table   jmp     #table_end                 ' Skip over table
      entry0  long    0
      entry1  long    100
      entry2  long    200
      table_end
              mov     pa, #$ - entry0            ' register distance from entry0
    description: "PASM2: using $ for a relative address calculation"

  - code: |
      DAT
              org

      start   mov     pa, #$ + 3                 ' pa = register address of this instruction + 3
              ' ...
    description: "PASM2: $ plus offset for forward reference"

  - code: |
      {Spin2_v50}
      DAT
              org

              DITTO 8
              long    $$                         ' Generates: 0, 1, 2, 3, 4, 5, 6, 7
              DITTO END
    description: "V50+ DITTO: $$ as iteration index for simple sequence"

  - code: |
      {Spin2_v50}
      DAT
              org

              DITTO 8
              long    $$ * 100                   ' Generates: 0, 100, 200, ..., 700
              DITTO END
    description: "V50+ DITTO: $$ multiplied for scaled sequence"

  - code: |
      {Spin2_v50}
      DAT
              org

              DITTO 4
              mov     regs + $$, #0              ' Clear regs+0, regs+1, regs+2, regs+3
              DITTO END
      regs    res     4
    description: "V50+ DITTO: $$ for indexed register operations"

  - code: |
      {Spin2_v50}
      DAT
              org
              DITTO 16
              long    $$ * $$                    ' Generates: 0, 1, 4, 9, ... 225
              DITTO END
    description: "V50+ DITTO: $$ in constant expressions for lookup tables"

notes:
  - "$$ exists only inside a DITTO block (v50+) and iterates from 0 to count - 1"
  - "V50+: DITTO usage requires {Spin2_v50} version directive"
  - "$ is the current origin: the cog register address in cog-exec (ORG) code, stepping by 1 per instruction, or the hub address in hub-exec (ORGH) code, stepping by 4"
  - "To branch within a DITTO block use $ (origin), e.g. TJZ reg,#$+5; no symbols are allowed within the block"
  - "Constant expressions have FLOAT(), ROUND() and TRUNC() and the float operators but no trigonometric functions; build a sine table at run time with QSIN()"

error_messages:
  - "'$$' (DITTO index) is only allowed within a DITTO block, inside a DAT block"

source: "Parallax Propeller 2 Spin2 Language Documentation v55, DAT Blocks (DAT Cog-exec; DITTO, v50)"

related:
  - language/spin2/special-symbols/dollar.yaml
  - language/spin2/assembly-directives/ditto.yaml
  - language/spin2/assembly-directives/org.yaml
  - language/pasm2/jmp.yaml

see_also:
  - "Assembly address symbols"
  - "DITTO directive"

oneliner: "DITTO iteration index (v50+); not the current address ($)"
