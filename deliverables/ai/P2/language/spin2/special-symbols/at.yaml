symbol: "@"
name: Address-Of Operator
type: special_symbol
category: Address Operators
priority: 1

description: |
  The @ operator returns the hub memory address of a variable, data label, or method.
  
  CRITICAL DISTINCTION:
  - In PUB/PRI code @ gives the hub address, ready for COGINIT, BYTE[]/LONG[], BYTEMOVE and the like.
  - The object-relative form applies to @ values STORED IN DAT DATA (WORD @Str0, LONG @Table):
    in a Spin2+PASM program they are stored as offsets from the start of the object, so convert
    them with @@ when reading them back. In a PASM-only program, stored values are absolute.

  This distinction is essential when storing addresses in DAT sections for later use.
  When you need to convert a stored offset to an absolute address at runtime, use the @@ operator.

syntax:
  variable_address:
    form: "@hubvar"
    returns: "Hub address of VAR/PUB/PRI/DAT variable"
    block_usage: "PUB/PRI only (as a term); an @symbol written in DAT data is stored there as data"
    
  array_element:
    form: "@array[index]"
    returns: "Address of specific array element"
    calculation: "base_address + (index * element_size)"
    notes: "Element size is 1 for BYTE, 2 for WORD, 4 for LONG"
    
  structure_address:
    form: "@structVar"
    returns: "Address of entire structure"
    
  structure_member:
    form: "@structVar.member"
    returns: "Address of specific member within structure"
    extended_form: "@structVar.nested.member for deeply nested access"
    
  inline_string:
    form: '@"string literal"'
    returns: "Address of inline string constant in hub memory"
    
  method_pointer:
    description: "Three forms for obtaining method addresses"
    forms:
      local_method:
        syntax: "@MethodName"
        description: "Address of method in current object"
      child_object_method:
        syntax: "@obj.MethodName"
        description: "Address of method in child object"
      indexed_object_method:
        syntax: "@obj[i].MethodName"
        description: "Address of method in indexed child object array"
    block_usage: "PUB/PRI only"
    storage: "Must be stored in a LONG variable (a method pointer is a LONG value)"
    notes: "See language/spin2/concepts/method-pointers.yaml for calling patterns"

restrictions:
  cog_registers:
    not_allowed: "@DIRA, @INA, @OUTA, @DIRB, @INB, @OUTB, etc."
    error_message: "@ is not allowed, use ^@ to get field pointer"
    solution: "Use ^@ operator instead for COG register access"
    
  bitfields:
    not_allowed: "@myVar.[3..0], @myVar.[highBit..lowBit]"
    error_message: "@ is not allowed for bitfields, use ^@ to get field pointer"
    solution: "Use ^@ operator to create field pointer for bitfield access"

address_types:
  relative_address:
    context: "@ values stored in DAT data in Spin2+PASM programs"
    description: |
      Stored as offsets from the start of the object so the object can be loaded
      at any hub location; convert with @@ in PUB/PRI code. An @symbol written in
      PUB/PRI code is not stored - it is the hub address.
    use_cases:
      - "Storing data pointers in DAT sections"
      - "Creating tables of addresses"

  absolute_address:
    context: "PASM-only programs (stored @ values)"
    description: |
      Stored @ values are absolute hub addresses. The code is assembled to run
      at specific memory locations.
    use_cases:
      - "Direct hardware addresses"
      - "Fixed memory locations"

examples:
  - code: |
      VAR
        BYTE buffer[256]
        LONG ptr
        
      PUB example()
        ptr := @buffer           ' Get address of buffer array
        BYTE[ptr] := $FF         ' Write to first byte via pointer
    description: "Getting address of a VAR variable"
    
  - code: |
      DAT
        mydata  LONG  $12345678, $AABBCCDD
        
      PUB example() | addr
        addr := @mydata          ' Get address of DAT data
        debug(uhex_long(LONG[addr]))  ' Read: $12345678
    description: "Getting address of DAT section data"
    
  - code: |
      DAT
                ORG   0
      asm_code  MOV   DIRA, #$FF
                ADD   OUTA, #1
                JMP   #asm_code
                
      PUB start()
        COGINIT(COGEXEC_NEW, @asm_code, 0)  ' Launch PASM in new cog
    description: "Using @ with COGINIT to launch assembly code"
    
  - code: |
      DAT
        STR0    BYTE  "Hello", 0
        STR1    BYTE  "World", 0
        strings WORD  @STR0, @STR1    ' Stored as object-relative offsets
        
      PUB example() | i, str_addr
        repeat i from 0 to 1
          str_addr := @@strings[i]   ' Convert to absolute address
          debug(zstr(str_addr))
    description: "Storing addresses in data tables (requires @@ to convert)"
    
  - code: |
      PUB caller() | method_ptr
        method_ptr := @worker        ' Get method pointer
        method_ptr()                 ' Call through pointer
        
      PRI worker()
        debug("Worker called")
    description: "Creating and using a method pointer"
    
  - code: |
      OBJ
        child : "child_object"
        
      PUB example() | method_ptr
        method_ptr := @child.process  ' Get method in child object
        method_ptr()                   ' Call child's method
    description: "Getting method pointer from child object"
    
  - code: |
      PUB example() | pStr
        pStr := @"Hello, World!"     ' Address of inline string constant
        debug(zstr(pStr))
    description: "Getting address of inline string literal"
    
  - code: |
      CON
        STRUCT point(x, y)
        STRUCT line(point a, point b)
        
      VAR
        point myPoint
        line myLine
        
      PUB example() | ptr
        ptr := @myPoint              ' Address of entire structure
        LONG[ptr][0] := 100          ' Access x member
        LONG[ptr][1] := 200          ' Access y member
        
        ptr := @myLine.a             ' Address of nested point 'a'
        ptr := @myLine.a.x           ' Address of x within point a
    description: "Structure and nested member addressing"
    
  - code: |
      CON
        STRUCT point(x, y)
        NUM_POINTS = 10
        
      VAR
        point points[NUM_POINTS]
        ^point ptr                   ' Typed pointer: ptr.x is the pointed-to member

      PUB clearAll()
        [ptr] := @points             ' Point the pointer at the first structure
        repeat NUM_POINTS
          ptr.x := 0
          ptr.y := 0
          [ptr] += 8                 ' Advance the pointer by structure size (2 LONGs)
    description: "Structure array traversal with pointer arithmetic"

common_patterns:
  pointer_to_buffer: |
    VAR
      BYTE buffer[1024]
    PUB getData() : ^BYTE pData
      return @buffer
      
  pass_data_to_cog: |
    VAR
      LONG shared_data[16]
    PUB startCog()
      COGINIT(COGEXEC_NEW, @cog_code, @shared_data)
      
  string_table_access: |
    DAT
      str0  BYTE "Option A", 0
      str1  BYTE "Option B", 0
      strs  WORD @str0, @str1
    PUB getStr(n) : addr
      addr := @@strs[n]    ' Must use @@ to convert!

notes:
  - "@ returns hub addresses only - use # for cog/LUT register addresses"
  - "@ in PUB/PRI code is the hub address; an @ value stored in DAT data is object-relative in Spin2+PASM (use @@)"
  - "Use @@ to convert stored @ values to absolute addresses at runtime"
  - "Symbol without @ returns the DATA at that address, not the address itself"
  - "@method creates a 32-bit method pointer with index and VAR base encoded"
  - "First long of object's VAR space stores object base for method pointers"
  - "The PASM-side counterpart: inside a Spin2 object, `##hubsymbol` in a DAT block does NOT give the symbol's runtime hub address (it resolves against $400) - pass the address in from Spin2 with @, or use PTRA. See language/spin2/integration/spin2-pasm2-integration.yaml (integration_rules.hub_address_resolution)."

related:
  - language/spin2/special-symbols/double_at.yaml
  - language/spin2/special-symbols/caret_at.yaml
  - language/spin2/concepts/method-pointers.yaml
  - language/spin2/methods/coginit.yaml
  - language/spin2/methods/cogspin.yaml
  - language/spin2/operators/typed-pointers.yaml
  - language/spin2/operators/FIELD.yaml
  - language/spin2/methods/bytemove.yaml
  - language/spin2/methods/wordmove.yaml
  - language/spin2/methods/longmove.yaml
  - language/spin2/methods/setregs.yaml
  - language/spin2/methods/getregs.yaml

source: "Parallax Propeller 2 Spin2 Language Documentation v55, Operators, Address Operators table; DAT Blocks, DAT Data Pointers"

oneliner: "Address-of operator - hub address of a VAR/DAT variable or method (an @ stored in DAT data is object-relative in Spin2+PASM; convert with @@)"
