operator: "/"
type: operator
description: |
  Signed divide, return quotient: x / y (Parallax Spin2 Documentation v55, operator
  table; assignment form var /= y). The interpreter divides the magnitudes with the
  CORDIC (QDIV) and negates the quotient when the operand signs differ, so it rounds
  toward zero: -1000 / 3 = -333, 1000 / -3 = -333, -1000 / -3 = 333.
category: Divide
divide_by_zero: "x / 0 does not trap: it returns $FFFF_FFFF (-1) for x >= 0 and 1 for x < 0, every time; x /= 0 the same. The CORDIC quotient for a zero divisor is $FFFF_FFFF, negated when x is negative. Guard the divisor if a zero is possible."
related:
  - language/spin2/operators/op_divdiv.yaml
  - language/spin2/operators/op_adddiv.yaml
  - language/pasm2/qdiv.yaml
