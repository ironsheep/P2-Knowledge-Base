operator: "DECOD"
type: operator
description: |
  Decode: `DECOD x` is 1 << (x & $1F), a value with a single bit set at position x.
  Priority 2. The PASM2 instruction DECOD does the same job on a register.
category: Unary
priority: 2
term_form: "DECOD x"
assign_form: "DECOD= var   (PUB/PRI only, priority 1)"
block_usage: "Term in all blocks; assignment form in PUB/PRI only"
source: "Parallax Propeller 2 Spin2 Language Documentation v55, Operators"
aliases:
  - "DECOD"
  - "decode"
  - "single bit mask"
  - "1 << n"
syntax: "mask := DECOD bit_position"
returns: "32-bit value with only bit at position set to 1"

examples:
  - description: "Create single-bit masks"
    code: |
      mask := DECOD 0              ' Returns $0000_0001 (bit 0)
      mask := DECOD 5              ' Returns $0000_0020 (bit 5)
      mask := DECOD 7              ' Returns $0000_0080 (bit 7)
      mask := DECOD 31             ' Returns $8000_0000 (bit 31)

  - description: "Pin manipulation"
    code: |
      ' Create mask for specific pin
      pin_mask := DECOD pin_number

common_patterns:
  - pattern: "set_bit"
    description: "Set bit N in flags"
    code: "flags |= DECOD N"

  - pattern: "clear_bit"
    description: "Clear bit N in flags"
    code: "flags &= !DECOD N"

  - pattern: "toggle_bit"
    description: "Toggle bit N in flags"
    code: "flags ^= DECOD N"

  - pattern: "test_bit"
    description: "Test if bit N is set"
    code: |
      if flags & DECOD N
        bit_is_set()

notes:
  - "DECOD n = 1 << (n & $1F), so n counts modulo 32"
  - "ENCOD reverses it: ENCOD (DECOD n) = n for n in 0..31"
  - "DECOD 5 = 32 = %0010_0000"

related:
  - language/spin2/operators/op_ENCOD.yaml
  - language/spin2/operators/op_BMASK.yaml
  - language/spin2/operators/op_ONES.yaml
  - language/spin2/concepts/operators.yaml