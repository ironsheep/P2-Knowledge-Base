name: "<>> is not a Spin2 operator"
type: operator_redirect
category: Comparison
not_an_operator: "<>>"
description: |
  `<>>` is not a Spin2 operator; the compiler rejects it. Not-equal is `<>` (returns
  0 or -1); shift right is `>>` (shift x right by y bits, inserting 0's); the
  arithmetic shift right that inserts copies of the MSB is `SAR`.

