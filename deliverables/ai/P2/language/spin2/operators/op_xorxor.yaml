  - language/spin2/operators/op_bitxor.yaml
  - language/spin2/operators/op_andand.yaml
  - language/spin2/operators/op_oror.yaml
  - language/spin2/operators/op_not.yaml
  - language/spin2/operators/precedence.yaml
