operator: ">=."
type: operator
description: |
  Floating-point greater than or equal: `x >=. y` returns -1 (true) or 0 (false).
  Priority 11, a term in all blocks, no assignment form. The signed integer form is `>=`.
category: Float Compare
priority: 11
term_form: "x >=. y"
block_usage: "Term in all blocks; no assignment form"
examples:
  - "IF temp >=. threshold\n  activate()"
