operator: "++"
type: operator
category: Var-modify
description: |
  Increment, in two forms, both priority 1 and both PUB/PRI only:
  - pre-increment `++var` increments var, then returns var;
  - post-increment `var++` returns var, then increments var.
  As a statement on its own, either form just increments var.
priority: 1
term_form: "++var   or   var++"
assign_form: "++var   or   var++   (PUB/PRI only)"
block_usage: "PUB/PRI only"
examples:
  - "value := count++   ' value gets count, then count is incremented"
source: "Parallax Propeller 2 Spin2 Language Documentation v55, Operators"
aliases:
  - "++"
  - "increment"
  - "pre-increment"
  - "post-increment"
related:
  - language/spin2/operators/op_dec.yaml
  - language/spin2/operators/op_add.yaml
  - language/spin2/operators/precedence.yaml
