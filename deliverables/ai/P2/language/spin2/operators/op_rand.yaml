operator: "??"
type: operator
description: |
  Pseudo-random operator: `??var` iterates the long variable var per the XORO32
  instruction (the xoroshiro32+ algorithm) and returns the pseudo-random value. The
  variable holds the generator state and is updated in place. Priority 1, PUB/PRI only;
  the operand must be a variable (`value := ??` alone is rejected).
category: Var-modify
priority: 1
term_form: "??var"
assign_form: "??var   (PUB/PRI only)"
block_usage: "PUB/PRI only"
syntax: "value := ??variable"
returns: "32-bit pseudo-random number"

properties:
  - "One XORO32 instruction per call"
  - "Reproducible: the same starting value gives the same sequence"
  - "Seed it with a non-zero value"
  - "NOT suitable for cryptography"

seeding:
  rule: "Seed the variable with a non-zero value before the first use"
  solution: |
    seed := GETRND()
    IF seed == 0
      seed := 1

examples:
  - description: "Basic PRNG usage"
    code: |
      VAR
        LONG seed

      PUB init()
        seed := GETRND()
        IF seed == 0
          seed := 1

      PUB get_random() : value
        value := ??seed

  - description: "Random in range [0, n-1]"
    code: |
      PUB random_n(n) : value
        value := ??seed +// n

  - description: "Reproducible test sequence"
    code: |
      CON
        TEST_SEED = $DEADBEEF

      PUB test_sequence() | i, value
        seed := TEST_SEED
        REPEAT i FROM 0 TO 9
          value := ??seed
          DEBUG("Random[", UDEC(i), "] = ", UHEX(value))

  - description: "Noise generation"
    code: |
      PUB white_noise_byte() : sample
        sample := ??noise_state >> 24   ' High 8 bits

common_patterns:
  - pattern: "seeded_prng"
    description: "Properly initialized PRNG"
    code: |
      PUB init_prng()
        prng_state := GETRND()
        IF prng_state == 0
          prng_state := 1

  - pattern: "deterministic_sequence"
    description: "Same sequence every run (for testing)"
    code: |
      prng_state := $12345678    ' Fixed seed
      ' Sequence will be identical each run

anti_patterns:
  - anti_pattern: "zero_seed"
    severity: "critical"
    description: "Seed the variable with a non-zero value"
    wrong: |
      seed := 0
      value := ??seed    ' seed is zero: use a non-zero seed
    correct: |
      seed := GETRND()
      IF seed == 0
        seed := 1
      value := ??seed

  - anti_pattern: "uninitialized_variable"
    severity: "critical"
    description: "VAR variables start at zero"
    wrong: |
      VAR
        LONG prng       ' Starts at 0
      PUB random() : value
        value := ??prng ' Iterates from a zero state
    correct: |
      VAR
        LONG prng
        LONG init_done
      PUB random() : value
        IF NOT init_done
          prng := GETRND()
          IF prng == 0
            prng := 1
          init_done := TRUE
        value := ??prng

  - anti_pattern: "operand_missing"
    severity: "critical"
    description: "?? needs a variable to iterate"
    wrong: |
      value := ??        ' rejected: ?? needs a variable
    correct: |
      value := ??seed

vs_getrnd:
  prng_advantages:
    - "Reproducible sequences with same seed"
    - "Good for games, simulations, testing"
  getrnd_advantages:
    - "No seed variable to initialize or keep"
    - "Use to seed the PRNG"

notes:
  - "?? modifies variable in-place AND returns new value"
  - "Seed with a non-zero value before first use"
  - "Use GETRND() to seed for best initial randomness"
  - "NOT suitable for cryptographic applications"
  - "Executes the XORO32 instruction on the cog"

source: "Parallax Propeller 2 Spin2 Language Documentation v55, Operators"

aliases:
  - "??"
  - "random"
  - "pseudo-random"
  - "XORO32"
  - "PRNG"

related:
  - language/spin2/methods/getrnd.yaml
  - language/spin2/concepts/random_generation.yaml
  - language/pasm2/xoro32.yaml
  - language/spin2/concepts/operators.yaml
  - language/spin2/operators/op_question.yaml

see_also:
  - "Pseudo-random number generation"
  - "XORO32 algorithm"
  - "Game randomness"
  - "Reproducible testing"

oneliner: "XORO32 pseudo-random number generator operator (seed with a non-zero value)"
