operator: "??"
type: operator
description: |
  Var-Prefix operator: `??var` iterates the long variable var per the XORO32
  instruction (the xoroshiro32+ algorithm) and returns the pseudo-random value. The
  variable holds the generator state and is updated in place. Priority 1, PUB/PRI only;
  the operand is a variable (??var).
category: Var-modify
priority: 1
term_form: "??var"
assign_form: "??var   (PUB/PRI only)"
block_usage: "PUB/PRI only"
syntax: "value := ??variable"
returns: "The pseudo-random value. Results recorded on silicon for the starting states $0000_0001, $DEAD_BEEF and $0001_0000 included values with bits set in bits 31..24 (for example $D719_4AE8). Not documented: the width of the ?? result."

properties:
  - "Reproducible: the same starting value gives the same sequence"
  - "Seed it with a non-zero value"

seeding:
  rule: "Seed the variable with a non-zero value before the first use"
  solution: |
    seed := GETRND()
    IF seed == 0
      seed := 1

examples:
  - description: "Basic PRNG usage"
    code: |
      VAR
        LONG seed

      PUB init()
        seed := GETRND()
        IF seed == 0
          seed := 1

      PUB get_random() : value
        value := ??seed

  - description: "Random in range [0, n-1]"
    code: |
      PUB random_n(n) : value
        value := ??seed +// n

  - description: "Reproducible test sequence"
    code: |
      CON
        TEST_SEED = $DEADBEEF

      PUB test_sequence() | i, value
        seed := TEST_SEED
        REPEAT i FROM 0 TO 9
          value := ??seed
          DEBUG("Random[", UDEC(i), "] = ", UHEX(value))

  - description: "Top byte of the ?? result"
    code: |
      PUB top_byte() : sample | state
        state := $DEAD_BEEF
        sample := ??state >> 24   ' bits 31..24 of the result

common_patterns:
  - pattern: "seeded_prng"
    description: "Properly initialized PRNG"
    code: |
      PUB init_prng()
        prng_state := GETRND()
        IF prng_state == 0
          prng_state := 1

  - pattern: "deterministic_sequence"
    description: "Same sequence every run (for testing)"
    code: |
      prng_state := $12345678    ' Fixed seed
      ' Sequence will be identical each run

anti_patterns:
  - anti_pattern: "zero_seed"
    severity: "critical"
    description: "Seed the variable with a non-zero value"
    wrong: |
      seed := 0
      value := ??seed    ' seed is zero: use a non-zero seed
    correct: |
      seed := GETRND()
      IF seed == 0
        seed := 1
      value := ??seed

  - anti_pattern: "uninitialized_variable"
    severity: "critical"
    description: "VAR variables start at zero"
    wrong: |
      VAR
        LONG prng       ' Starts at 0
      PUB random() : value
        value := ??prng ' Iterates from a zero state
    correct: |
      VAR
        LONG prng
        LONG init_done
      PUB random() : value
        IF NOT init_done
          prng := GETRND()
          IF prng == 0
            prng := 1
          init_done := TRUE
        value := ??prng

  - anti_pattern: "operand_missing"
    severity: "critical"
    description: "?? needs a variable to iterate; the compiler refuses it with no operand"
    wrong: |
      value := ??        ' refused: ?? needs a variable
    correct: |
      value := ??seed

vs_getrnd:
  prng_advantages:
    - "Reproducible sequences with same seed"
  getrnd_advantages:
    - "No seed variable to initialize or keep"
    - "Can supply the seed for the PRNG"

notes:
  - "?? returns the XORO32 result and stores the new generator state in the variable"
  - "Seed with a non-zero value before first use"
  - "GETRND() can supply the initial seed"
  - "Not documented: the XORO32 algorithm's constants, and how the result and the new state are computed from the old state"

source: "Parallax Propeller 2 Spin2 Language Documentation v55, Operators (??var: iterate long var per XORO32, return pseudo-random value); CP-035 (?? with no variable operand is refused); EF-101 (a zero state is absorbing; the recorded results for three nonzero starting states, in its test log)"

aliases:
  - "??"
  - "random"
  - "pseudo-random"
  - "XORO32"
  - "PRNG"

related:
  - language/spin2/methods/getrnd.yaml
  - language/spin2/concepts/random_generation.yaml
  - language/pasm2/xoro32.yaml
  - language/spin2/concepts/operators.yaml
  - language/spin2/operators/op_question.yaml

see_also:
  - "Pseudo-random number generation"
  - "Reproducible sequences"

oneliner: "XORO32 pseudo-random number generator operator (seed with a non-zero value)"
