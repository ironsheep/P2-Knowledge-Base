operator: "FSQRT"
type: operator
category: Float
description: |
  Floating-point square root: `FSQRT x`. Priority 2, a term in all blocks. It has no
  assignment form. For an unsigned integer square root use `SQRT`.
priority: 2
term_form: "FSQRT x"
block_usage: "Term in all blocks"
examples:
  - "side := FSQRT(float_area)"
