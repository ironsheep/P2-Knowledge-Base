name: Typed Pointers
type: operator
category: Pointer Types
aliases:
  - typed pointers
  - struct pointer
  - caret pointer
  - externalized context
  - re-entrant driver state
  - pointer to struct

requires_version: "Spin2_v45"
version_directive: "{Spin2_v45}"

description: |
  Typed pointer declarations using ^BYTE, ^WORD, ^LONG, and ^structName syntax.
  Pointers are 32-bit values holding memory addresses with type information
  that enables proper pointer arithmetic and type-safe dereferencing.
  REQUIRES: {Spin2_v45} or later version directive at the start of the source file.
  
  Note: Basic pointer operations using @ (address-of) and BYTE[]/WORD[]/LONG[] 
  memory access are part of base Spin2 and do NOT require a version directive.

pointer_types:
  - type: "^BYTE"
    points_to: "8-bit data"
    increment_size: "1 byte"
  - type: "^WORD"
    points_to: "16-bit data"
    increment_size: "2 bytes"
  - type: "^LONG"
    points_to: "32-bit data"
    increment_size: "4 bytes"
  - type: "^structName"
    points_to: "Structure data"
    increment_size: "Structure size in bytes"

syntax:
  var_declaration: "^TYPE varName"
  local_declaration: "PUB method() | ^TYPE ptr"
  parameter: "PUB method(^TYPE ptr)"
  return_value: "PUB method() : ^TYPE result"

examples:
  - code: |
      {Spin2_v45}
      VAR
        ^BYTE  pByteData          ' Pointer to byte data
        ^WORD  pWordData          ' Pointer to word data
        ^LONG  pLongData          ' Pointer to long data
    description: "VAR block pointer declarations"

  - code: |
      {Spin2_v45}
      VAR
        BYTE  buffer[256]
        
      PUB example() | ^BYTE ptr
        ptr := @buffer            ' Get address of buffer
        BYTE[ptr] := $FF          ' Write through pointer
        ptr++                     ' Advance by 1 byte
    description: "Local pointer variable with address-of and increment"

  - code: |
      {Spin2_v45}
      PUB processBuffer(^BYTE pBuffer, LONG length)
        repeat length
          BYTE[pBuffer++] := 0    ' Clear and advance
    description: "Pointer as method parameter"

  - code: |
      {Spin2_v45}
      VAR
        LONG values[100]
        
      PUB getValues() : ^LONG result
        result := @values
    description: "Returning a pointer from a method"

  - code: |
      {Spin2_v45}
      CON
        STRUCT point(x, y)
        
      VAR
        point points[10]
        ^point ptr
        
      PUB example()
        ptr := @points[0]
        ptr.x := 100              ' Access member through pointer
        ptr++                     ' Advance by 8 bytes (size of point)
    description: "Structure pointer with member access"

operations:
  address_of:
    syntax: "ptr := @variable"
    description: "Get address of variable, array element, or structure member"
    
  read_through_pointer:
    syntax: "value := BYTE[ptr] / WORD[ptr] / LONG[ptr]"
    description: "Read value at pointer address"
    
  write_through_pointer:
    syntax: "BYTE[ptr] := value"
    description: "Write value at pointer address"
    
  indexed_access:
    syntax: "value := BYTE[ptr][index]"
    description: "Access element at offset from pointer"
    
  increment:
    syntax: "ptr++"
    description: "Advance pointer by element size"
    
  decrement:
    syntax: "ptr--"
    description: "Move pointer back by element size"
    
  pre_increment:
    syntax: "++ptr"
    description: "Increment first, then use"
    
  post_increment:
    syntax: "ptr++"
    description: "Use current value, then increment"
    
  bracket_post_increment:
    syntax: "ptr[++]"
    description: "Return current address, then advance"
    
  bracket_pre_increment:
    syntax: "[++]ptr"
    description: "Advance first, then return new address"
    
  struct_member_access:
    syntax: "ptr.member"
    description: "Access structure member through pointer"
    
  struct_dereference:
    syntax: "[ptr]"
    description: "Read or write entire structure through pointer (temp := [ptr] or [ptr] := temp)"

  modify_assign_through_pointer:
    syntax: "LONG[ptr] += value / BYTE[ptr] |= mask / etc."
    description: "Arithmetic and bitwise modify-and-assign at pointer address"
    operators:
      - "LONG[ptr] += v    ' Add"
      - "BYTE[ptr] -= v    ' Subtract"
      - "WORD[ptr] *= v    ' Multiply"
      - "BYTE[ptr] |= mask ' Bitwise OR (set bits)"
      - "BYTE[ptr] &= mask ' Bitwise AND (clear bits)"
      - "LONG[ptr] ^= mask ' Bitwise XOR (toggle bits)"

  bracket_value_modification:
    syntax: "[ptr]++ / [ptr]-- / [ptr]~ / [ptr]~~"
    description: "Modify the value at the pointer address (not the pointer itself)"
    operations:
      - "[ptr]++   ' Increment value at ptr"
      - "[ptr]--   ' Decrement value at ptr"
      - "[ptr]~    ' Clear value at ptr (set to 0)"
      - "[ptr]~~   ' Set all bits at ptr (set to -1)"

pointer_arithmetic:
  - type: "^BYTE"
    "ptr++": "Advances by 1 byte"
  - type: "^WORD"
    "ptr++": "Advances by 2 bytes"
  - type: "^LONG"
    "ptr++": "Advances by 4 bytes"
  - type: "^structName"
    "ptr++": "Advances by structure size"

common_patterns:
  array_traversal: |
    PUB clearBuffer() | ^BYTE ptr
      ptr := @buffer
      repeat 256
        BYTE[ptr++] := 0
        
  string_length: |
    PUB strlen(^BYTE pStr) : length
      length := 0
      repeat while BYTE[pStr++] <> 0
        length++

  string_copy: |
    PUB strcpy(^BYTE pDest, ^BYTE pSrc)
      repeat while BYTE[pSrc] <> 0
        BYTE[pDest++] := BYTE[pSrc++]
      BYTE[pDest] := 0          ' Null terminator
        
  structure_array: |
    PUB scalePoints(scale) | ^point ptr
      ptr := @points
      repeat 100
        ptr.x *= scale
        ptr.y *= scale
        ptr++

  linked_list: |
    CON
      STRUCT node(^node next, data)
    VAR
      ^node head
    PUB traverseList() | ^node current
      current := head
      repeat while current <> 0
        processNode(current)
        current := current.next

  pointer_table_workaround: |
    ' Pointers cannot be arrays, but LONG arrays can store raw addresses:
    VAR
      LONG ptrTable[10]
    PUB example() | ^BYTE ptr
      ptrTable[0] := @buffer0
      ptrTable[1] := @buffer1
      ptr := ptrTable[0]        ' Assign to typed pointer for use

gotchas:
  struct_pointer_obj_returns:
    description: |
      When a method in a child object returns a struct pointer (^structName)
      and the caller receives it through an OBJ reference, the compiler may
      interpret the return as the full structure rather than a single LONG
      pointer value. If the structure exceeds 15 longs, this produces a
      compile error even though the return is only a pointer (one LONG).
    rule: "When receiving ^structName from an object method, use bracket notation on the receiver"
    wrong: "pCfg := sensor.getConfig()          ' COMPILE ERROR for large structs"
    correct: "[pCfg] := sensor.getConfig()        ' OK: receives pointer value, not struct"
    scope: "Only across OBJ boundaries; within the same object file this is not needed"
    example: |
      OBJ
          sensor : "sensor_driver"
      CON
          STRUCT sensorConfig(rate, gain, offset, calibration, filterTaps[16])
      PUB example() | ^sensorConfig pCfg
          [pCfg] := sensor.getConfig()        ' Bracket notation required
          debug("rate = ", sdec_(pCfg.rate))   ' Then access members normally

  pointer_arrays_not_supported:
    description: "Pointer variables cannot be declared as arrays"
    wrong: "^BYTE pArray[10]         ' ERROR: pointers cannot be arrays"
    workaround: "Use a LONG array to store raw addresses, then assign to typed pointer for use"
    example: |
      VAR
        LONG ptrTable[10]         ' Array of raw addresses
      PUB example() | ^BYTE ptr
        ptrTable[0] := @buffer0
        ptr := ptrTable[0]        ' Assign to typed pointer

notes:
  - "REQUIRES {Spin2_v45} or later at start of source file"
  - "Basic @ and BYTE[]/WORD[]/LONG[] are base Spin2 (no version needed)"
  - "Typed pointers enable type-safe pointer arithmetic"
  - "Pointers themselves cannot be arrays: ^BYTE ptr[10] is invalid"
  - "Initialize pointers before use to avoid accessing invalid memory"
  - "P2 handles misaligned access but aligned is more efficient"
  - "Null pointer value is 0 - check before dereferencing"
  - "[ptr]++ increments the VALUE at ptr; ptr++ advances the POINTER itself"
  - "LONG[ptr] += v modifies value in-place without separate read/write"
  - "Use [pVar] := obj.method() bracket notation when receiving struct pointers across OBJ boundaries"

related:
  - language/spin2/methods/byte.yaml
  - language/spin2/methods/word.yaml
  - language/spin2/methods/long.yaml
  - language/spin2/methods/sizeof.yaml
  - language/spin2/special-symbols/at.yaml
  - language/spin2/keywords/STRUCT.yaml
  - language/spin2/concepts/addressing.yaml
  - language/spin2/concepts/method-pointers.yaml
  - language/spin2/idioms/memory-access.yaml

see_also:
  - "^struct context as Family C for N identical shared buses (caller owns N state blocks): p2kbArchSharedBusReplication"

oneliner: "Typed pointer declarations ^BYTE/^WORD/^LONG/^struct (requires Spin2_v45)"
