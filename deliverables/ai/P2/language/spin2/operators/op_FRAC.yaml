operator: "FRAC"
type: operator
description: |
  Unsigned fraction: x FRAC y = (x << 32) / y. 1 FRAC 3 = $5555_5555,
  2 FRAC 7 = $4924_9249.
category: Math
priority: 7
term_form: "x FRAC y"
assign_form: "var FRAC= y   (PUB/PRI only, priority 17)"
block_usage: "Term in all blocks; assignment form in PUB/PRI only"
examples:
  - "frac_part := dividend FRAC divisor"
divide_by_zero: "x FRAC 0 returns NOT x with a run-time divisor (1 -> $FFFF_FFFE, $8000_0000 -> $7FFF_FFFF, $FFFF_FFFF -> 0), every time."
source: "Parallax Propeller 2 Spin2 Language Documentation v55, Operators; divide by zero: hardware-verified EF-089"
aliases:
  - "FRAC"
  - "unsigned fraction"
related:
  - language/pasm2/qfrac.yaml
  - language/spin2/operators/op_adddiv.yaml
  - language/spin2/operators/op_SCA.yaml
