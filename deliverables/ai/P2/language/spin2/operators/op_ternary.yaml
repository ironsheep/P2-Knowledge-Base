operator: "? :"
type: operator
category: Ternary
description: |
  Ternary conditional: `x ? y : z` returns y if x <> 0, otherwise z. Priority 16.
  It is a term in all blocks, including CON; it has no assignment form.
priority: 16
term_form: "x ? y : z"
block_usage: "Term (all blocks)"
examples:
  - "result := condition ? true_value : false_value"
source: "Parallax Propeller 2 Spin2 Language Documentation v55, Operators"
