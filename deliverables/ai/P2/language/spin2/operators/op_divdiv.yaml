operator: "//"
type: operator
description: |
  Signed divide, return remainder: x // y. The remainder takes the sign of x
  (-1000 // 3 = -1, 1000 // -3 = 1).
category: Divide
priority: 7
term_form: "x // y"
assign_form: "var //= y   (PUB/PRI only, priority 17)"
block_usage: "Term in all blocks; assignment form in PUB/PRI only"
source: "Parallax Propeller 2 Spin2 Language Documentation v55, Operators"
aliases:
  - "//"
  - "modulo"
  - "signed remainder"
  - "signed modulo"
divide_by_zero: "x // 0 does not trap: it returns x unchanged, every time; x //= 0 the same."
related:
