operator: "+<="
type: operator
description: |
  UNSIGNED less than or equal. Returns -1 (true) or 0 (false).
  The leading `+` selects the unsigned form: both operands are compared as unsigned
  32-bit values. The signed form is `<=`; the floating-point form is `<=.`.
category: Comparison
priority: 11
term_form: "x +<= y"
block_usage: "Term in all blocks; no assignment form"
source: "Parallax Propeller 2 Spin2 Language Documentation v55, Operators"
aliases:
  - "+<="
  - "unsigned less than or equal"
