topic: "Operator Precedence"
type: "reference"
description: "Spin2 operator evaluation order (1=highest priority)"
category: "Language Rules"

precedence_table:
  # Level numbers follow the language's "Term Priority" column (1 = highest).
  # Seventeen levels: 1-16 are term priorities, 17 is the assignment priority.
  - level: 1
    operators: ["++", "--", "??", "\\", "~", "~~", "@", "@@", "^@", "#"]
    type: "Var-modify / Address"
    note: "Pre/post inc-dec, random, post-clear/set, address-of; the postfix forms var!, var!! are also priority 1. All PUB/PRI only. The assignment forms of the unary operators (-= != !!= ABS= ENCOD= DECOD= BMASK= ONES= SQRT= QLOG= QEXP=) are priority 1 as well"
  - level: 2
    operators: ["!", "-", "-.", "ABS", "FABS", "ENCOD", "DECOD", "BMASK", "ONES", "SQRT", "FSQRT", "QLOG", "QEXP"]
    type: "Unary"
    note: "Single operand operations"
  - level: 3
    operators: [">>", "<<", "SAR", "ROR", "ROL", "REV", "ZEROX", "SIGNX"]
    type: "Shift/Rotate"
    note: "Bit manipulation"
  - level: 4
    operators: ["&"]
    type: "Bitwise AND"
  - level: 5
    operators: ["^"]
    type: "Bitwise XOR"
  - level: 6
    operators: ["|"]
    type: "Bitwise OR"
  - level: 7
    operators: ["*", "*.", "/", "/.", "+/", "//", "+//", "SCA", "SCAS", "FRAC"]
    type: "Multiply/Divide/Scale"
    note: "Signed/float/unsigned multiply, divide, remainder, scale — one priority"
  - level: 8
    operators: ["+", "+.", "-", "-."]
    type: "Add/Subtract"
    note: "Integer and floating-point add/subtract — one priority"
  - level: 9
    operators: ["#>", "<#"]
    type: "Limit"
    note: "Max/min"
  - level: 10
    operators: ["ADDBITS", "ADDPINS"]
    type: "Bitfield/Pinfield"
    note: "Make bitfield (x & $1F) | (y & $1F) << 5 / pinfield (x & $3F) | (y & $1F) << 6"
  - level: 11
    operators: ["<", "+<", "<.", "<=", "+<=", "<=.", "==", "==.", "<>", "<>.", ">=", "+>=", ">=.", ">", "+>", ">.", "<=>"]
    type: "Compare/Equality"
    note: "Signed, unsigned (+) and floating-point (.) comparison, (in)equality and the signed three-way <=> — all one priority"
    source: "Parallax Propeller 2 Spin2 Language Documentation v55, Operators"
  - level: 12
    operators: ["!!", "NOT"]
    type: "Logical NOT"
    note: "Unary only. Binds looser than the comparisons: NOT a == b means NOT (a == b)"
  - level: 13
    operators: ["&&", "AND"]
    type: "Logical AND"
  - level: 14
    operators: ["^^", "XOR"]
    type: "Logical XOR"
  - level: 15
    operators: ["||", "OR"]
    type: "Logical OR"
  - level: 16
    operators: ["?", ":"]
    type: "Ternary"
    note: "A term in all blocks, including CON"
  - level: 17
    operators: [":=", "=", "+=", "-=", "*=", "/=", "//=", "+/=", "+//=", "#>=", "<#=", "&=", "|=", "^=", ">>=", "<<=", "SAR=", "ROR=", "ROL=", "REV=", "ZEROX=", "SIGNX=", "SCA=", "SCAS=", "FRAC=", "ADDBITS=", "ADDPINS=", "&&=", "^^=", "||="]
    type: "Assignment"
    note: "Lowest priority. := and the compound forms are PUB/PRI only; = is the CON equate. The compiler also accepts AND=, OR= and XOR=, which are not in the Spin2 operator table"

examples:
  - code: "x := a + b * c"
    evaluation: "x := a + (b * c)"
    reason: "Multiply (7) before Add (8)"
  - code: "x := a & b | c"
    evaluation: "x := (a & b) | c"
    reason: "AND (4) before OR (6)"
  - code: "x := !a && b || c"
    evaluation: "x := ((!a) && b) || c"
    reason: "Unary (2), Logical AND (13), Logical OR (15)"

notes:
  - "Lower numbers = higher priority (execute first); numbering follows the Spin2 operator table"
  - "Spin2 groups *, / at one priority (7); +, - at one (8); all comparisons/equality at one (11)"
  - "Level 12 is the unary !! / NOT; the binary logical operators start at level 13"
  - "Assignment operators have lowest priority"
  - "Assignment is PUB/PRI only (the CON equate = is CON only); the ternary is a term in all blocks"
  - "A var\\x written alone as a statement is rejected by the compiler; it compiles where its value is used (w := v\\3)"
  - "Use parentheses to override default precedence"

source: "Parallax Propeller 2 Spin2 Language Documentation v55, Operators"

related:
