topic: "Operator Precedence"
type: "reference"
description: "Spin2 operator evaluation order (1=highest priority)"
category: "Language Rules"

precedence_table:
  - level: 1
    operators: ["++", "--", "??"]
    type: "Var-modify"
    note: "Pre/post inc/dec/random"
  - level: 2
    operators: ["!", "NOT", "-", "ABS", "||", "^^", "ENCOD", "DECOD", "ONES", "SQRT", "QLOG", "QEXP"]
    type: "Unary"
    note: "Single operand operations"
  - level: 3
    operators: [">>", "<<", "SAR", "ROR", "ROL", "REV", "ZEROX", "SIGNX"]
    type: "Shift/Rotate"
    note: "Bit manipulation"
  - level: 4
    operators: ["&"]
    type: "Binary AND"
  - level: 5
    operators: ["^"]
    type: "Binary XOR"
  - level: 6
    operators: ["|"]
    type: "Binary OR"
  - level: 7
    operators: ["*", "*."]
    type: "Multiply"
  - level: 8
    operators: ["/", "/.", "//", "+/"]
    type: "Divide"
    note: "Div/float/mod/unsigned"
  - level: 9
    operators: ["+", "+."]
    type: "Add"
  - level: 10
    operators: ["-", "-."]
    type: "Subtract"
  - level: 11
    operators: ["#>", "<#"]
    type: "Limit"
    note: "Max/min"
  - level: 12
    operators: ["<", "+<", ">", "+>", "<=", "+<=", ">=", "+>=", "<=>", "+<=>"]
    type: "Compare"
    note: "Signed/unsigned"
  - level: 13
    operators: ["==", "<>", "===", "<>>"]
    type: "Equality"
    note: "Logical/bitwise"
  - level: 14
    operators: ["&&", "AND", "!&&"]
    type: "Logical AND"
  - level: 15
    operators: ["||", "OR", "XOR", "!||"]
    type: "Logical OR"
  - level: 16
    operators: ["?", ":"]
    type: "Ternary"
    note: "PUB/PRI only"
  - level: 17
    operators: [":=", "+=", "-=", "*=", "/=", "//=", "+/=", "#>=", "<#=", "&=", "|=", "^=", ">>=", "<<=", "SAR=", "ROR=", "ROL=", "REV=", "ZEROX=", "SIGNX=", "AND=", "OR=", "XOR="]
    type: "Assignment"
    note: "PUB/PRI only (lowest priority)"

examples:
  - code: "x := a + b * c"
    evaluation: "x := a + (b * c)"
    reason: "Multiply (7) before Add (9)"
  - code: "x := a & b | c"
    evaluation: "x := (a & b) | c"
    reason: "AND (4) before OR (6)"
  - code: "x := !a && b || c"
    evaluation: "x := ((!a) && b) || c"
    reason: "Unary (2), Logical AND (14), Logical OR (15)"

notes:
  - "Lower numbers = higher priority (execute first)"
  - "Assignment operators have lowest priority"
  - "Ternary and assignment only in PUB/PRI blocks"
  - "Use parentheses to override default precedence"