name: "=== is not a Spin2 operator"
type: operator_redirect
category: Comparison
not_an_operator: "==="
description: |
  `===` is not a Spin2 operator; the compiler rejects it. Equality is `==` (returns
  0 or -1), inequality is `<>`, and the floating-point forms are `==.` and `<>.`.

