operator: "BMASK"
type: operator
description: |
  Create a bit mask with N+1 lowest bits set.
  BMASK(7) creates an 8-bit mask ($FF).
  Also available as PASM2 instruction.
category: Unary
syntax: "mask := BMASK count"
returns: "32-bit value with (count+1) lowest bits set to 1"

examples:
  - description: "Create masks of various sizes"
    code: |
      mask := BMASK 0              ' Returns $0000_0001 (1 bit)
      mask := BMASK 3              ' Returns $0000_000F (4 bits)
      mask := BMASK 7              ' Returns $0000_00FF (8 bits)
      mask := BMASK 15             ' Returns $0000_FFFF (16 bits)
      mask := BMASK 31             ' Returns $FFFF_FFFF (32 bits)

  - description: "Extract bit field"
    code: |
      ' Extract 4 bits starting at bit 4
      field := (data >> 4) & BMASK 3   ' BMASK 3 = $0F (4 bits)

  - description: "Create variable-width mask"
    code: |
      PUB extract_bits(value, start, width) : field
        field := (value >> start) & BMASK (width - 1)

common_patterns:
  - pattern: "mask_low_bits"
    description: "Isolate lower N bits"
    code: |
      low_byte := value & BMASK 7     ' Mask to 8 bits

notes:
  - "BMASK n creates mask for n+1 bits (0-based count)"
  - "BMASK 7 = $FF (8 bits), not BMASK 8"
  - "Use for extracting bit fields after right-shifting"
  - "Complement (!BMASK n) gives upper bits mask"

related:
  - language/spin2/operators/op_DECOD.yaml
  - language/spin2/operators/op_ENCOD.yaml
  - language/spin2/operators/op_ONES.yaml
  - language/spin2/concepts/operators.yaml