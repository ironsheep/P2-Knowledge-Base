operator: "+>="
type: operator
description: |
  UNSIGNED greater than or equal. Returns -1 (true) or 0 (false).
  The leading `+` selects the unsigned form: both operands are compared as unsigned
  32-bit values. The signed form is `>=`; the floating-point form is `>=.`.
category: Comparison
source: >-
  Parallax Spin2 Documentation v55, operator table --
  engineering/ingestion/sources/spin2-v55/spin2-v55-text.txt:483 ("Unsigned greater
  than or equal (returns 0 or -1)"); signed `>=` at :482, floating-point `>=.` at :484.
