operator: "*."
type: operator
category: Float
description: |
  Floating-point multiply: `x *. y`. Priority 7, a term in all blocks. It has no
  assignment form. The floating-point operators treat long values as floats: they do not
  convert an integer operand, so convert with `FLOAT()` first.
priority: 7
term_form: "x *. y"
block_usage: "Term in all blocks"
