# `+//` -- REDIRECT
#
# The definition home for `+//` is language/spin2/operators/op_addmodulo.yaml.
# `+//` performs no addition -- the leading `+` selects the UNSIGNED form of `//`.
#
# The file is kept rather than deleted because its index key
# (p2kbSpin2OpModuloAdd) is published, and removing a published key breaks any
# consumer that cached it. It resolves and it is findable.

redirect_for_operator: "+//"
name: Unsigned Remainder (see language/spin2/operators/op_addmodulo.yaml)
type: operator_redirect
category: Arithmetic
description: |
  Unsigned remainder (modulo). Defined in full at
  language/spin2/operators/op_addmodulo.yaml -- including the circular-buffer and
  ring-index patterns that used to live here.

definition_home: language/spin2/operators/op_addmodulo.yaml

aliases:
  - "unsigned modulo add"

related:
  - language/spin2/operators/op_addmodulo.yaml
  - language/spin2/operators/op_adddiv.yaml
  - language/spin2/operators/precedence.yaml
