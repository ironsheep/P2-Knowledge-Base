# `+//` -- REDIRECT
#
# The definition home for `+//` is language/spin2/operators/op_addmodulo.yaml
# (F-402, 2026-09-05). This file previously carried a second, conflicting
# definition: it called `+//` an "Unsigned Modulo Add" that "performs addition
# with unsigned modulo". It performs no addition -- the leading `+` selects the
# UNSIGNED form of `//`. Its worked ring-buffer material was correct and has been
# folded into the home file unchanged.
#
# The file is kept rather than deleted because its index key
# (p2kbSpin2OpModuloAdd) is present in the published v1.17.0 set, and removing a
# published key breaks any consumer that cached it. It resolves, it is findable,
# and it now says one true thing instead of a conflicting definition.

operator: "+//"
name: Unsigned Remainder (see language/spin2/operators/op_addmodulo.yaml)
type: operator_redirect
category: Arithmetic
description: |
  Unsigned remainder (modulo). Defined in full at
  language/spin2/operators/op_addmodulo.yaml -- including the circular-buffer and
  ring-index patterns that used to live here.

definition_home: language/spin2/operators/op_addmodulo.yaml

aliases:
  - "unsigned modulo add"

related:
  - language/spin2/operators/op_addmodulo.yaml
  - language/spin2/operators/op_adddiv.yaml
  - language/spin2/operators/precedence.yaml
