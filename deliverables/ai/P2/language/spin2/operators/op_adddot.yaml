operator: "+."
type: operator
category: Float
description: |
  Floating-point add: `x +. y`. Priority 8, a term in all blocks. It has no assignment
  form. The floating-point operators treat long values as floats: they do not convert an
  integer operand, so convert with `FLOAT()` first.
priority: 8
