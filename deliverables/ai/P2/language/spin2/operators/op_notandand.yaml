name: "!&& is not a Spin2 operator"
type: operator_redirect
category: Logical
not_an_operator: "!&&"
description: |
  `!&&` is not a Spin2 operator; the compiler rejects it. The Spin2 operator table
  has no NAND form. Logical AND is `&&` (or `AND`); logical NOT is `!!` (or `NOT`).
  To get NAND, apply NOT to the AND: `!!(x && y)`.

