operator: "<=>"
type: operator
description: |
  SIGNED three-way comparison. Returns -1 if x < y, 0 if x == y, 1 if x > y.
  There is no unsigned form: `+<=>` is not a Spin2 operator.
  In a CON block applied to floating-point constants or symbols, it returns -1.0,
  0.0 or 1.0 rather than the integer -1, 0 or 1.
category: Comparison
source: >-
  Parallax Spin2 Documentation v55, operator table --
  engineering/ingestion/sources/spin2-v55/spin2-v55-text.txt:488 ("Signed comparison
  (<,=,> returns -1,0,1)"), CON floating-point footnote at :505. No `+<=>` row exists
  in the table (:471-488).
aliases:
  - "<=>"
  - "three-way comparison"
  - "signed comparison"
