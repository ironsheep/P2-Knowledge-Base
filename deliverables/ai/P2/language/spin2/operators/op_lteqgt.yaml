operator: "<=>"
type: operator
description: |
  SIGNED three-way comparison. Returns -1 if x < y, 0 if x == y, 1 if x > y.
  There is no unsigned form: `+<=>` is not a Spin2 operator.
  In a CON block applied to floating-point constants or symbols, it returns -1.0,
  0.0 or 1.0 rather than the integer -1, 0 or 1.
  It shares priority 11 with `==` and the other comparisons, so parenthesise it when it
  is compared: `(x <=> y) == 1`.
category: Comparison
priority: 11
term_form: "x <=> y"
block_usage: "Term in all blocks; no assignment form"
source: "Parallax Propeller 2 Spin2 Language Documentation v55, Operators"
aliases:
