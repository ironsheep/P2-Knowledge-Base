name: "? is the first half of the ternary operator"
type: operator_redirect
category: Ternary
not_an_operator: "?"
description: |
  `?` is not an operator on its own. It follows the condition in the ternary operator
  `x ? y : z` (if x <> 0 then y, else z). The ternary operator is defined in full on the
  `? :` operator page. The pseudo-random operator is `??`, a different token with its
  own page.

