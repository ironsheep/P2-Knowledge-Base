  - language/spin2/operators/op_bitor.yaml
  - language/spin2/operators/op_bitnot.yaml
  - language/spin2/operators/op_xorxor.yaml
  - language/spin2/operators/op_xor.yaml
  - language/spin2/special-symbols/caret_at.yaml
  - language/pasm2/xor.yaml
  - language/spin2/operators/precedence.yaml
