# Spin2 `+//` -- unsigned remainder
#
# DEFINITION HOME for this operator (2026-09-05). Two files defined `+//`
# and they disagreed: language/spin2/operators/modulo_add.yaml called it an
# "Unsigned Modulo Add" that "performs addition with unsigned modulo". It performs
# no addition -- a leading `+` on a division-family operator selects the UNSIGNED
# form of that operator (`/` signed divide vs `+/` unsigned; `//` signed remainder
# vs `+//` unsigned). The worked material from that file is folded in below; the
# file itself is now a redirect, kept because its index key is in the published
# set and removing a published key breaks any consumer that cached it.

operator: "+//"
name: Unsigned Remainder
type: operator
category: Arithmetic
description: |
  Unsigned divide, return remainder: `x +// y`. The `+` prefix selects the unsigned form
  of `//`; it does not add. Priority 7, the same as `*`, `/`, `+/`, `//`, SCA, SCAS and
  FRAC.
priority: 7
term_form: "x +// y"
assign_form: "var +//= y   (PUB/PRI only, priority 17)"
block_usage: "Term in all blocks; assignment form in PUB/PRI only"

source: "Parallax Propeller 2 Spin2 Language Documentation v55, Operators"

aliases:
  - "+//"
  - "unsigned remainder"
  - "unsigned modulo"
  - "circular arithmetic"
  - "ring buffer wrap"
  - "wrap-around index"

overview: |
  The `+//` operator returns the remainder of an unsigned division. Its usual role
  is the wrap step of circular arithmetic -- add first, then take the remainder --
  which makes it the natural tool for ring-buffer indices and wrap-around counters.
  The addition in those idioms is written explicitly; `+//` supplies only the wrap.

syntax:
  format: "result := value +// modulus"
  parameters:
    value: The value to operate on
    modulus: The wrap-around point (result will be 0 to modulus-1)
  returns: Value modulo modulus

operation:
  description: |
    The unsigned remainder of value divided by modulus (both operands treated as
    unsigned 32-bit values). Result ranges from 0 to (modulus - 1).
    Gives the same result as value // modulus only while both operands are below
    $8000_0000 (// is the SIGNED remainder).

  formula: "result = value MOD modulus (unsigned)"

examples:
  circular_buffer_increment:
    description: Increment buffer index with wrap-around
    code: |
      VAR
        LONG head, tail
        BYTE buffer[32]
      
      PUB addByte(data) : ok | nextTail
        ' Calculate next tail position
        nextTail := (tail + 1) +// 32

        ' Check if buffer full
        if nextTail == head
          return FALSE  ' Buffer full

        ' Add data and update tail
        buffer[tail] := data
        tail := nextTail
        return TRUE

  modulo_arithmetic:
    description: Various modulo operations
    code: |
      ' Simple wrap-around
      index := (index + 1) +// BUFFER_SIZE
      
      ' Increment by N with wrap
      position := (position + step_size) +// MAX_POSITION

      ' Calculate distance in circular buffer (add BUFFER_SIZE first: head - tail can be negative)
      distance := (head - tail + BUFFER_SIZE) +// BUFFER_SIZE

  queue_management:
    description: Circular queue push operation
    code: |
      PRI rxCheckInternal(portHandle) : nChar
        nChar := NO_CHAR
        if rxTailIdx[portHandle] <> rxHeadIdx[portHandle]
          ' Increment with modulo
          rxHeadIdx[portHandle] := (rxHeadIdx[portHandle] + 1) +// BUF_SIZE
          ' Read from new head position
          nChar := BYTE[pRxBuf[portHandle]][rxHeadIdx[portHandle]]

common_patterns:
  buffer_sizes:
    - "Power of 2 not required (unlike & mask method) for the wrap step (index + 1) +// size"
    - "That wrap step works for any size: +// 30, +// 100, etc."
    - "A subtraction that can go below 0 needs size added first: (head - tail) +// 30 gives 13 when head - tail is -3, not 27"
    - "Typically used with constants for clarity"
    
  typical_usage:
    - Circular buffer index management
    - Ring buffer wrap-around
    - Cyclic counter implementation
    - Round-robin scheduling indexes

comparison_with_alternatives:
  and_mask_method:
    description: "Alternative using AND mask (power of 2 only)"
    code: |
      ' Only works with power-of-2 sizes
      index := (index + 1) & (BUFFER_SIZE - 1)  ' BUFFER_SIZE must be 2^n
      
      ' +// works with any size for the wrap step
      index := (index + 1) +// BUFFER_SIZE      ' Any size works
  
  manual_method:
    description: "Manual wrap-around check"
    code: |
      ' Manual method
      index++
      if index >= BUFFER_SIZE
        index := 0
        
      ' Using +// operator
      index := (index + 1) +// BUFFER_SIZE    ' One line, same result

best_practices:
  - Use parentheses for clarity with complex expressions
  - Define buffer sizes as constants
  - Remember result range is 0 to (modulus-1)
  - Consider using for all circular arithmetic
related_operators:
  - "//": Signed remainder (modulo) -- the signed counterpart of this operator
  - "+/": Unsigned divide quotient
  - "&": AND mask (alternative for power-of-2)

notes:
  - Works with any modulus value, not only powers of two
  - Result range is 0 to (modulus - 1)
  - "Modulus 0: x +// 0 does not trap -- it returns x unchanged, every time (x +//= 0 the same)."
  - The worked patterns above come from production driver code; they are usage
    examples, not a Parallax statement about the operator
  - "Unsigned means a negative left operand is read as a large positive number: -3 +// 30 is 13, while -3 // 30 is -3"

related:
  - language/spin2/operators/modulo_add.yaml
  - language/spin2/operators/op_adddiv.yaml
  - language/spin2/operators/precedence.yaml
