operator: "<<"
type: operator
category: Shift/Rotate
description: |
  Shift left: `x << y` shifts x left by y bits, inserting 0's. Priority 3, so it binds
  tighter than `+` and `-` (priority 8): `value << 2 + 1` means `(value << 2) + 1`.
priority: 3
term_form: "x << y"
assign_form: "var <<= y   (PUB/PRI only, priority 17)"
block_usage: "Term in all blocks; assignment form in PUB/PRI only"
examples:
  - "shifted := $03 << 4   ' $30"
source: "Parallax Propeller 2 Spin2 Language Documentation v55, Operators"
aliases:
  - "<<"
  - "shift left"
related:
  - language/spin2/operators/op_shr.yaml
  - language/spin2/operators/op_SAR.yaml
  - language/spin2/operators/op_ROL.yaml
  - language/spin2/operators/precedence.yaml
