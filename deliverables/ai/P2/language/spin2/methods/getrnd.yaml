method: GETRND
type: method
description: |
  Get a random 32-bit long from the Xoroshiro128** PRNG (a pseudo-random number
  generator). The boot ROM seeds the PRNG at start-up with thermal noise from
  the ADC; after that it iterates on every clock. Each cog receives its own
  unique set of 32 bits from the PRNG.
category: Miscellaneous
documentation_source: "Parallax Propeller 2 Spin2 Language Documentation v55, GETRND ('Get random long (from xoroshiro128** PRNG, seeded on boot with thermal noise from ADC)'; the +// operator); Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), HUBSET (Seeding the Xoroshiro128** PRNG: the boot ROM seeds the PRNG fifty times with thermal noise; the PRNG iterates on every clock and each cog receives a unique set of 32 bits). The zero-state comment in the seeding example: EF-101"
syntax: random := GETRND()
parameters: []
returns:
  type: long
  description: 32-bit pseudo-random long from the Xoroshiro128** PRNG

examples:
  - description: "Get 32-bit random value"
    code: |
      value := GETRND()

  - description: "Random number in range [0, n-1]"
    code: |
      dice := GETRND() +// 6     ' 0-5 (die roll minus 1)
      percent := GETRND() +// 101  ' 0-100

  - description: "Random in range [min, max] inclusive"
    code: |
      PUB random_range(min_val, max_val) : value
        value := (GETRND() +// (max_val - min_val + 1)) + min_val

  - description: "Random delay"
    code: |
      WAITMS(GETRND() +// 1000)  ' 0-999ms random delay

  - description: "Seed a PRNG from GETRND"
    code: |
      seed := GETRND()
      IF seed == 0
        seed := 1       ' a zero state stays zero in ??x

  - description: "Fill a 16-byte buffer with random longs"
    code: |
      PUB fill_buffer(buffer_ptr) | i
        REPEAT i FROM 0 TO 3
          LONG[buffer_ptr][i] := GETRND()

  - description: "Probability check"
    code: |
      PUB chance(percent) : result
        ' Returns TRUE percent% of the time
        result := (GETRND() +// 100) < percent

common_patterns:
  - pattern: "random_boolean"
    description: "50/50 coin flip"
    code: "result := GETRND() & 1"

  - pattern: "random_element"
    description: "Select random element from array"
    code: |
      value := LONG[array_ptr][GETRND() +// count]

  - pattern: "weighted_random"
    description: "Weighted selection by cumulative probability"
    code: |
      roll := GETRND() +// 100
      IF roll < 70
        result := COMMON       ' 70% chance
      ELSEIF roll < 90
        result := UNCOMMON     ' 20% chance
      ELSE
        result := RARE         ' 10% chance

  - pattern: "fisher_yates_shuffle"
    description: "Shuffle array in place"
    code: |
      REPEAT i FROM count - 1 TO 1
        j := GETRND() +// (i + 1)
        temp := LONG[array_ptr][i]
        LONG[array_ptr][i] := LONG[array_ptr][j]
        LONG[array_ptr][j] := temp

anti_patterns:
  - anti_pattern: "signed_modulo"
    severity: "moderate"
    description: "// is a signed divide that returns the remainder; use +// (unsigned divide, return remainder) to get 0..n-1"
    wrong: |
      value := GETRND() // 10    ' Signed divide, return remainder
    correct: |
      value := GETRND() +// 10   ' Unsigned divide, return remainder: 0..9

when_to_use:
  getrnd:
    - "Random values"
    - "When reproducibility is NOT wanted"
  prng_instead:
    - "Reproducible test sequences (a generator you seed yourself, such as XORO32 or the ?? operator)"

notes:
  - "Returns a value from the Xoroshiro128** PRNG, which iterates on every clock"
  - "The boot ROM seeds the PRNG at start-up with thermal noise from the ADC"
  - "Full 32-bit range"
  - "No seeding required"
  - "Each COG receives a unique set of 32 bits from the PRNG"
  - "Use +// operator for scaled ranges (unsigned divide, return remainder)"

timing:
  execution_model: |
    Spin2 methods execute via the bytecode interpreter. Method-call clock count: not documented.
  underlying_pasm: "GETRND"
  underlying_pasm_timing: "2 clocks (fixed)"


related:
  - language/spin2/operators/op_rand.yaml
  - language/spin2/concepts/random_generation.yaml
  - language/pasm2/getrnd.yaml
  - language/pasm2/xoro32.yaml
  - language/spin2/methods/getct.yaml

see_also:
  - "Random number generation"
  - "Xoroshiro128** PRNG"
  - "XORO32 and the ?? operator (generators you seed yourself)"

oneliner: "Get a random 32-bit long from the Xoroshiro128** PRNG"
