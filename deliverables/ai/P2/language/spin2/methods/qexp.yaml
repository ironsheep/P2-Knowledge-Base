method: QEXP
type: method
description: |
  Convert a 5:27 fixed-point base-2 logarithm into a 32-bit unsigned integer:
  2 raised to the power of the exponent, using the hardware CORDIC engine.
category: Math/CORDIC Operations
syntax: "result := QEXP(Exponent)"
parameters:
  - name: "Exponent"
    type: "long"
    description: "Exponent value in 5:27 fixed-point format (5 whole bits, 27 fractional bits)"
returns:
  type: "long"
  description: "2 to the power of Exponent (unsigned 32-bit integer)"
examples:
  - code: |
      ' Calculate 2^1
      result := QEXP($0800_0000)  ' $0800_0000 is 1.0 in 5:27 format, so the result is 2
    description: "Basic exponential calculation"
  - code: |
      ' Calculate power of 10 (x in 5:27 format): 10^x = 2^(x * 3.3219)
      power10 := QEXP(MULDIV64(x, 33219, 10_000))
    description: "Calculate powers of 10"
  - code: |
      ' Exponential growth: factor = 2^(time / doubling_time), with time / doubling_time below 32
      growth := QEXP(MULDIV64(time, 1 << 27, doubling_time))
      value := initial * growth
    description: "Model exponential growth"
notes:
  - "Uses P2's hardware CORDIC engine"
  - "Input is a base-2 logarithm in 5:27 fixed-point format, the form QLOG returns"
  - "Result is 2 raised to the exponent"
  - "Operator precedence: shifts (priority 3) bind tighter than * (priority 7); use MULDIV64 to scale an exponent, not a * and >> chain"
timing:
  description: "Uses the CORDIC solver. The underlying CORDIC latency is a hardware property of the engine; the total Spin2-method time also includes interpreter overhead and is not separately specified here."
  see: "language/spin2/concepts/cordic_solver.yaml for the underlying CORDIC engine."
related:
  - QLOG
  - MULDIV64
see_also:
  - "CORDIC operations"
  - "Exponential functions"
  - "Fixed-point math"
