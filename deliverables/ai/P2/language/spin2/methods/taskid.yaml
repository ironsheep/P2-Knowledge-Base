method: TASKID
type: method
category: Task Operations

requires_version: "Spin2_v47"
version_directive: "{Spin2_v47}"

description: |
  Get the ID of the currently executing task. Returns an integer from 0-31
  representing this task's slot in the cog's task table. In each cog the
  top-level (initial) code runs as that cog's task 0; TASKSPIN(NEWTASK) then
  allocates upward (1, 2, ...). Task IDs are cog-local (each cog has its own
  0-31 task space). Hardware-verified (EF-023).
  REQUIRES: {Spin2_v47} or later version directive at start of source file.
syntax: "id := TASKID()"
parameters: []
returns:
  type: "integer"
  description: "Current task ID (0-31)"
examples:
  - code: |
      {Spin2_v47}                              ' REQUIRED directive
      PRI worker_task()
        debug("Running as task ", udec(TASKID()))
        repeat
          do_work()
          TASKNEXT()
    description: "Display current task ID"
  - code: |
      {Spin2_v47}                              ' REQUIRED directive
      PRI generic_worker()
        case TASKID()
          0: main_task_work()
          1: worker1_work()
          2: worker2_work()
    description: "Task-specific execution"
  - code: |
      {Spin2_v47}                              ' REQUIRED directive
      VAR
        LONG task_start_times[32]
      
      PRI worker_task()
        task_start_times[TASKID()] := GETCT()
        repeat
          do_work()
          TASKNEXT()
    description: "Track task timing"
notes:
  - "REQUIRES {Spin2_v47} or later at start of source file"
  - "Returns ID of currently executing task (0-31)"
  - "In each cog the top-level code runs as that cog's task 0; TASKSPIN(NEWTASK) fills upward from 1 (hardware-verified, EF-023)"
  - "Task IDs are cog-local — every cog has its own 0-31 task space"
  - "Useful for task-specific storage/behavior"
  - "Each task has unique ID 0-31"
  - "ID remains constant for task lifetime"
timing:
  execution_model: |
    Spin2 methods execute via the bytecode interpreter. The interpreter is
    engineered to run at minimum cost. We do not publish a clock count for
    this method because we do not have a verifiable measurement (no clean
    single-PASM-instruction backing to cite).

related:
