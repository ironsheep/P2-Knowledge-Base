method: TASKID
type: method
category: Task Operations

requires_version: "Spin2_v47"
version_directive: "{Spin2_v47}"

description: |
  Get the ID of the currently executing task. Returns an integer from 0-31 
  representing this task's slot in the cog's task table. The main task is 
  typically ID 0.
  REQUIRES: {Spin2_v47} or later version directive at start of source file.
syntax: "id := TASKID()"
parameters: []
returns:
  type: "integer"
  description: "Current task ID (0-31)"
examples:
  - code: |
      {Spin2_v47}                              ' REQUIRED directive
      PRI worker_task()
        debug("Running as task ", udec(TASKID()))
        repeat
          do_work()
          TASKNEXT()
    description: "Display current task ID"
  - code: |
      {Spin2_v47}                              ' REQUIRED directive
      PRI generic_worker()
        case TASKID()
          0: main_task_work()
          1: worker1_work()
          2: worker2_work()
    description: "Task-specific execution"
  - code: |
      {Spin2_v47}                              ' REQUIRED directive
      VAR
        LONG task_start_times[32]
      
      PRI worker_task()
        task_start_times[TASKID()] := GETCT()
        repeat
          do_work()
          TASKNEXT()
    description: "Track task timing"
notes:
  - "REQUIRES {Spin2_v47} or later at start of source file"
  - "Returns ID of currently executing task (0-31)"
  - "Main task is typically ID 0"
  - "Useful for task-specific storage/behavior"
  - "Each task has unique ID 0-31"
  - "ID remains constant for task lifetime"
timing:
  description: "Immediate"
  cycles: "2-9 clock cycles"
related:
  - TASKCHK
  - TASKSPIN
  - COGID
see_also:
  - "Task identification"
  - "Task management"
  - "Task-local storage"