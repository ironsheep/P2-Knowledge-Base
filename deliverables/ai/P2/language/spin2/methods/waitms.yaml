# Spin2 Method: WAITMS
# Source: Parallax Spin2 Documentation v55, Timing Methods table
# Purpose: Delay execution for specified milliseconds

method: "WAITMS"
category: "timing"
type: "method"
description: |
  Delay execution for a specified number of milliseconds.
  Provides a simple timing delay that automatically accounts for the system clock frequency.
  More convenient than WAITCT for simple delays as it handles the math internally.

syntax: "WAITMS(Milliseconds)"

parameters:
  - name: "Milliseconds"
    type: "long"
    description: |
      Number of milliseconds to delay. The bound the source states is in CLOCKS,
      not milliseconds: "Wait Milliseconds, uses CLKFREQ, duration must not
      exceed $8000_0000 clocks." The millisecond ceiling therefore scales with
      CLKFREQ -- see the `limitations` block below.
      Can be a constant, variable, or expression.
      Value is treated as unsigned.

returns: "none"

timing:
  execution_model: |
    Spin2 methods execute via the bytecode interpreter. The interpreter is
    engineered to run at minimum cost. We do not publish a clock count for
    this method because we do not have a verifiable measurement (no clean
    single-PASM-instruction backing to cite).


examples:
  - code: "WAITMS(1000)"
    description: "Delay for 1 second"
    
  - code: |
      REPEAT
        PINHIGH(56)
        WAITMS(500)
        PINLOW(56)
        WAITMS(500)
    description: "Blink LED at 1Hz"
    
  - code: |
      VAR
        LONG delay_time
      PUB variable_delay()
        delay_time := 100
        REPEAT 10
          PINTOGGLE(56)
          WAITMS(delay_time)
          delay_time += 50
    description: "Variable delay that increases each iteration"
    
  - code: |
      ' Debounce a button
      IF PINREAD(0)
        WAITMS(50)  ' Debounce delay
        IF PINREAD(0)
          ' Button really pressed
    description: "Button debouncing"

underlying_implementation:
  description: |
    Internally calculates: WAITX((CLKFREQ/1000) * milliseconds - 1)
    Automatically adjusts for system clock frequency.
  related_pasm: "WAITX instruction"

common_uses:
  - "LED blinking and indicators"
  - "Button debouncing"
  - "Timing between operations"
  - "Simple animation delays"
  - "Sensor reading intervals"
  - "Communication protocol delays"

related_methods:
  - "WAITUS"
  - "WAITCT"
  - "GETCT"
  - "POLLCT"

notes:
  source: "Parallax Spin2 Documentation v55, Timing Methods -- engineering/ingestion/sources/spin2-v55/spin2-v55-text.txt:551"
  v55_definition: "WAITMS(Milliseconds) -- Wait Milliseconds, uses CLKFREQ, duration must not exceed $8000_0000 clocks."
  clkfreq_dependent: "Because the wait is computed from CLKFREQ, the same Milliseconds argument is a different number of clocks at every clock frequency, and the ceiling moves with it."
  choosing_between_waits:
    - "For sub-millisecond delays use WAITUS -- WAITUS(Microseconds), same $8000_0000-clock bound. -- :550"
    - "For cycle-accurate delays use WAITCT(Tick) -- Wait for system counter to get past 'Tick'. -- :549"
  blocking: "The cog is stopped in the wait for its duration."

limitations:
  source: "Parallax Spin2 Documentation v55, Timing Methods -- engineering/ingestion/sources/spin2-v55/spin2-v55-text.txt:551"
  hard_bound: "duration must not exceed $8000_0000 clocks"
  ceiling_formula: "max Milliseconds = $8000_0000 / (CLKFREQ / 1000)"
  resolution: "1 ms -- the argument's unit"
  correction_2026_08_25: "The pre-purge form of this block claimed a maximum delay of ~4,294 seconds (71 minutes). That is 2^32 milliseconds; the source states the bound in CLOCKS ($8000_0000), which is three orders of magnitude smaller at any realistic clock frequency. Not restored."

anti_patterns:
  - anti_pattern: "periodic_drift"
    description: "Using WAITMS in loops causes timing drift"
    wrong: |
      ' Drifts because delay is AFTER work, not TO fixed time
      REPEAT
        do_work()
        waitms(100)    ' 100ms AFTER work completes
    correct: |
      ' Use WAITCT for jitter-free periodic execution
      next := getct()
      REPEAT
        next += clkfreq / 10
        do_work()
        waitct(next)   ' Wait UNTIL next period

see_also:
  - "language/spin2/methods/waitus.yaml"
  - "language/spin2/methods/waitct.yaml"
  - "language/spin2/methods/getct.yaml"
  - "language/pasm2/waitx.yaml"
  - "language/spin2/concepts/timing_operations.yaml"