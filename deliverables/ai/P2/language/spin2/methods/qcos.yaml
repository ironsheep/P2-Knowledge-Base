method: QCOS
type: method
description: |
  Return the X (cosine) component of rotating the vector (length, 0) by a caller-defined
  angle, using the P2 hardware CORDIC engine.
category: Math/CORDIC Operations
syntax: "x := QCOS(length, step, stepsInCircle)"
parameters:
  - name: "length"
    type: "long"
    description: "Vector length / amplitude. The result is scaled by this (acts as the radius)."
  - name: "step"
    type: "long"
    description: "Angle expressed as a step count. The actual angle is (step / stepsInCircle) * 2Pi."
  - name: "stepsInCircle"
    type: "long (unsigned)"
    description: "Number of steps in a full circle -- i.e. the caller-chosen angle unit (360 for degrees, 65536 for 16-bit brads, etc.). Use 0 to mean a full circle of $1_0000_0000 (2^32) steps. stepsInCircle is unsigned."
returns:
  type: "long"
  description: "x = length * cos( (step / stepsInCircle) * 2Pi )"
examples:
  - code: |
      ' Cosine at 0 degrees using a 360-step circle
      x := QCOS(1000, 0, 360)         ' cos(0 deg) -> ~1000
    description: "Cosine in degrees (stepsInCircle = 360)"
  - code: |
      ' Cosine at 60 degrees
      x := QCOS(1000, 60, 360)        ' cos(60 deg) -> ~500
    description: "Cosine of 60 degrees"
  - code: |
      ' Horizontal position for circular motion (X = cos)
      x_pos := center_x + QCOS(radius, ang, 360)
    description: "Calculate X position on a circle"
notes:
  - "Uses the P2 hardware CORDIC engine (QROTATE)."
  - "Angle is caller-defined: actual angle = (step / stepsInCircle) * 2Pi. The unit is whatever you pass as stepsInCircle -- 360 for degrees, 65536 for 16-bit brads, etc."
  - "stepsInCircle = 0 selects a full circle of $1_0000_0000 (2^32) steps; stepsInCircle is unsigned."
  - "Result = length * cos(angle)."
  - "Returns the X (cosine) component; QSIN returns the Y (sine) component of the same rotation."
source: "Parallax Spin2 Language Reference v51a (QCOS(length, step, stepsInCircle) : x); examples compile-verified with pnut_ts"
timing:
  description: "Uses the CORDIC solver (QROTATE). The underlying CORDIC latency is a hardware property of the engine; the total Spin2-method time also includes interpreter overhead and is not separately specified here."
  see: "language/spin2/concepts/cordic_solver.yaml for the underlying CORDIC engine."
related:
  - QSIN
  - ROTXY
  - POLXY
related_concepts:
  - language/spin2/concepts/cordic_solver.yaml
see_also:
  - "CORDIC operations"
  - "Trigonometric functions"
  - "Waveform generation"
