method: RECV
type: method
description: |
  RECV is a special method pointer, inherited from the calling method and
  conveyed to all called methods. Its purpose is to provide an efficient input
  mechanism for data: RECV() calls the method that RECV points to and returns
  the single value that method returns.
category: Miscellaneous
syntax: "value := RECV()"
parameters: []
returns:
  type: "long"
  description: "The single value returned by the method RECV points to"
examples:
  - code: |
      ' Receive single value
      char := RECV()
    description: "Receive one value"
  - code: |
      ' Build string from input
      repeat i from 0 to 79
        buffer[i] := RECV()
        if buffer[i] == 13  ' Enter key
          buffer[i] := 0
          quit
    description: "Receive string until Enter"
  - code: |
      ' Echo received data
      repeat
        byte_in := RECV()
        SEND(byte_in)
    description: "Echo loop"
  - code: |
      ' Wait for specific character
      repeat until RECV() == "!"
      ' Got start character
    description: "Wait for start marker"
as_method_pointer:
  description: |
    RECV is a special method pointer. Assign it like a method pointer;
    it must point to a method that takes no parameters and returns a single value.
  syntax: "RECV := @InMethod"
  usage: "data := RECV()"
  restrictions:
    - "Must point to a method that takes no parameters"
    - "Must point to a method that returns a single value"
  example: |
    OBJ
      serial : "serial_driver"

    PUB setup()
      RECV := @serial.rx
      SEND := @serial.tx

    PUB echo() | c
      c := RECV()
      SEND(c)

notes:
  - "Assign RECV (RECV := @InMethod) before calling RECV(); if RECV has not been assigned, RECV() returns 0"
  - "A called method inherits the current RECV pointer and may change it for its own purposes; on return the RECV pointer is back to what it was before the call (it propagates in method calls, not in method returns)"
  - "Works with user-defined input methods"
  - "Whether RECV() blocks, and what range of values it returns, is set by the method RECV points to"
timing:
  description: "Depends on the method RECV points to"
  cycles: "Variable - set by the input method"
related:
  - SEND
  - DEBUG
  - language/spin2/concepts/method-pointers.yaml
see_also:
  - "Serial communication"
  - "User input"
  - "Data reception"
