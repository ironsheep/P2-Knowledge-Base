method: RECV
type: method
description: |
  Receive data byte using configured input method
category: Miscellaneous
syntax: "byte := RECV()"
parameters: []
returns:
  type: "byte"
  description: "Received byte value (0-255)"
examples:
  - code: |
      ' Receive single byte
      char := RECV()
    description: "Receive one byte"
  - code: |
      ' Build string from input
      repeat i from 0 to 79
        buffer[i] := RECV()
        if buffer[i] == 13  ' Enter key
          buffer[i] := 0
          quit
    description: "Receive string until Enter"
  - code: |
      ' Echo received data
      repeat
        byte_in := RECV()
        SEND(byte_in)
    description: "Echo loop"
  - code: |
      ' Wait for specific character
      repeat until RECV() == "!"
      ' Got start character
    description: "Wait for start marker"
as_method_pointer:
  description: |
    RECV can be assigned to a LONG variable as a method pointer,
    enabling flexible I/O abstraction.
  syntax: "inputMethod := RECV"
  usage: "data := inputMethod()"
  restrictions:
    - "Takes no parameters"
    - "Always returns exactly one value"
    - "Cannot use abort syntax with RECV"
  example: |
    VAR
      LONG inputMethod
      
    PUB SetupMailbox()
      inputMethod := RECV         ' Use inter-cog mailbox
      
    PUB SetupSerial()
      inputMethod := @serial.rx   ' Use serial port
      
    PUB GetInput() : data
      data := inputMethod()       ' Works with either source

notes:
  - "Input method must be configured first"
  - "Typically used with serial drivers"
  - "Blocking operation - waits for byte"
  - "Returns single byte (0-255)"
  - "Works with user-defined input methods"
  - "Common for user input and data reception"
  - "Can be assigned to LONG variable as method pointer for flexible I/O"
timing:
  description: "Depends on input method"
  cycles: "Variable - blocks until data available"
related:
  - SEND
  - DEBUG
  - language/spin2/concepts/method-pointers.yaml
see_also:
  - "Serial communication"
  - "User input"
  - "Data reception"
