method: XYPOL
type: method
description: |
  Convert Cartesian coordinates to polar using CORDIC
category: Math/CORDIC Operations
syntax: "Rho, Theta := XYPOL(X, Y)"
parameters:
  - name: "X"
    type: "long"
    description: "X coordinate (32-bit signed)"
  - name: "Y"
    type: "long"
    description: "Y coordinate (32-bit signed)"
returns:
  type: "multiple"
  description: "Returns Rho (radius) and Theta (angle)"
examples:
  - code: |
      ' Convert Cartesian to polar
      rho, theta := XYPOL(100, 100)  
      ' Result: rho ≈ 141, theta ≈ $2000_0000 (45°)
    description: "Basic Cartesian to polar conversion"
  - code: |
      ' Calculate distance and angle to target
      dx := target_x - current_x
      dy := target_y - current_y
      distance, angle := XYPOL(dx, dy)
    description: "Find distance and direction to target"
  - code: |
      ' Convert joystick X,Y to magnitude and direction
      magnitude, direction := XYPOL(joy_x - 128, joy_y - 128)
      if magnitude > threshold
        move_player(direction, magnitude)
    description: "Process joystick input"
notes:
  - "Uses P2's hardware CORDIC engine"
  - "Angle units: $0000_0000 = 0°, $4000_0000 = 90°, $8000_0000 = 180°, $C000_0000 = 270°"
  - "Rho (radius) is always positive"
  - "Theta covers full 360° range based on quadrant"
  - "Handles all four quadrants correctly"
  - "Results are NOT scaled by the CORDIC gain: the P2 32-bit CORDIC solver applies scale-factor correction (Silicon Doc line 425: '32-bit, pipelined CORDIC solver with scale-factor correction'). The ~1.646 CORDIC gain applies only to the streamer's separate 5-stage modulator CORDIC, not to QROTATE-based solver operations like this one."
timing:
  description: "Uses the CORDIC solver. The underlying CORDIC latency is a hardware property of the engine; the total Spin2-method time also includes interpreter overhead and is not separately specified here."
  see: "language/spin2/concepts/cordic_solver.yaml for the underlying CORDIC engine."
related:
  - POLXY
  - ROTXY
  - QSIN
  - QCOS
see_also:
  - "CORDIC operations"
  - "Polar coordinates"
  - "Coordinate conversion"
  - "Distance calculation"
