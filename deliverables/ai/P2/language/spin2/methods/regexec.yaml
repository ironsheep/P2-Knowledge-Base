method: REGEXEC
type: method
description: |
  Load a self-defined chunk of PASM2 code from hub RAM into cog registers,
  then CALL the chunk's start register. The chunk is preceded by two words:
  the starting register and the number of registers (longs) to load, minus 1.
syntax: "REGEXEC(HubAddress)"
parameters:
  - name: "HubAddress"
    type: "address"
    description: "Hub address of the chunk: two header words (start register, register count minus 1), then the code and/or data"
returns:
  type: "void"
  description: "No return value; pass data through PR0..PR7"
examples:
  - code: |
      PUB demo()
        REGEXEC(@chunk)

      DAT
      chunk
        WORD start, finish-start-1   ' chunk header: start register, size-1
        ORG $118                     ' org can be $000..$120-size
      start
        mov   pr0, #123
        ret
      finish
    description: "Execute a hub-based PASM chunk"
  - code: |
      ' Dynamic code execution
      build_pasm_code(@buffer)  ' Generate a chunk: two header words, then the code
      REGEXEC(@buffer)          ' Load it into registers and execute it
    description: "Execute dynamically generated code"
notes:
  - "Loads a chunk from hub into cog registers, then CALLs its start register"
  - "The chunk must fit cog registers $000..$11F; the Spin2 interpreter occupies $120..$1D7 and LUT $010..$1FF"
  - "Preserves Spin2 interpreter"
  - "PASM must end with RET (or _RET_) to return to Spin2"
  - "Data passes through PR0..PR7"
timing:
  description: "Load time + execution time"
  cycles: "Variable based on code size"
related:
  - CALL
  - REGLOAD
  - SETREGS
see_also:
  - "Dynamic code execution"
  - "PASM2 programming"
  - "Hub execution"
