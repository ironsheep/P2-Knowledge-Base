# Spin2 Method: WXPIN
# Source: Spin2 documentation
# Purpose: Write X parameter to smart pin

method: "WXPIN"
category: "smart_pin_operations"
type: "method"
description: |
  Write the X parameter register of one or more smart pins.
  X is a mode-specific parameter (32 bits, write-only): a base period, a measurement
  period, a bit period and word size, or a long to store, depending on the mode.
  Meaning depends on the smart pin mode set by WRPIN.

syntax: "WXPIN(PinField, XValue)"

parameters:
  - name: "PinField"
    type: "pin_field"
    description: |
      Specifies which pin(s) to configure. Can be:
      - Single pin number (0-63)
      - Pin range using '..' operator, written Top..Bottom (e.g. 15..8 is pins 8 through 15; wraps within the 32-pin block if Top < Bottom)
      - Multiple pins using ADDPINS operator
      - Variable or expression that evaluates to a pin field
      
  - name: "XValue"
    type: "long"
    description: |
      32-bit value for X register.
      Interpretation depends on smart pin mode:
      - Bit timing and word size for async serial modes; word size and update/sample mode for sync serial modes
      - Base period (X[15:0]) plus frame count (X[31:16]) for the PWM modes
      - Base period and initial phase for the NCO modes (the frequency goes in Y, via WYPIN)
      - Measurement period for the counting and quadrature modes

returns: "none"

x_register_usage_by_mode:
  async_serial_modes: |
    Async serial (P_ASYNC_TX %11110 / P_ASYNC_RX %11111):
      X[31:16] = number of clocks in a bit period
      X[15:10] = number of fractional clocks in a bit period, when X[31:26] is zero
      X[4:0]   = word size minus 1 (write 7 for 8 data bits)
    Formula:  X = ((CLKFREQ / baud_rate) << 16) | (data_bits - 1)

  sync_serial_modes: |
    Sync serial (P_SYNC_TX %11100 / P_SYNC_RX %11101); words shift LSB first,
    clocked by the B input:
      X[4:0] = word size minus 1 (1 to 32 bits)
      X[5]   = TX: 0 = continuous mode, 1 = start-stop mode
               RX: 0 = sample A just before the B edge, 1 = sample coincident with the B edge

  pwm_modes: |
    PWM (triangle, sawtooth, SMPS):
      X[15:0]  = base period in clocks
      X[31:16] = frame period in base periods
    The output value (0 up to the frame period) is written to Y with WYPIN.

  nco_modes: |
    NCO frequency (P_NCO_FREQ):
      X[15:0]  = base period in clocks
      X[31:16] = initial phase (written to Z[31:16])
    The frequency goes in Y: Y[31:0] is added into Z[31:0] at each base period.

  measurement: |
    Measurement window:
    X = measurement_period_clocks

examples:
  - code: |
      ' Configure async UART at 115200 baud, 8 data bits
      baud := 115200
      x_val := ((CLKFREQ / baud) << 16) | 7    ' bits[31:16]=clocks/bit, bits[4:0]=N-1
      WXPIN(30, x_val)
    description: "Configure async UART baud rate and word size"
    
  - code: |
      ' Set a PWM frame of 1000 base periods, base period 1 clock
      WXPIN(56, (1000 << 16) | 1)
    description: "Set PWM base period and frame count"

  - code: |
      ' NCO frequency: base period 1 clock, increment added into Z in Y
      freq := 1_000_000
      WXPIN(pin, 1)
      WYPIN(pin, freq FRAC CLKFREQ)   ' FRAC divides {freq, 32'b0} by CLKFREQ
    description: "Set NCO base period and increment"
    
  - code: |
      ' Set measurement window to 1 second
      WXPIN(pin, CLKFREQ)
    description: "Configure measurement period"
    
  - code: |
      ' Configure 16-bit SPI transfer
      WXPIN(spi_pin, %1_01111)  ' 16-bit words, start-stop
    description: "SPI configuration"

mode_specific_x_values:
  P_ASYNC_TX: "Clocks per bit in X[31:16] (fractional clocks in X[15:10] only when X[31:26] is zero), word size minus 1 in X[4:0]"
  P_ASYNC_RX: "Clocks per bit in X[31:16] (fractional clocks in X[15:10] only when X[31:26] is zero), word size minus 1 in X[4:0]"
  P_PULSE: "Base period in X[15:0]; X[31:16] is compared with the base period counter (output high while the counter is above it)"
  P_TRANSITION: "Base period in X[15:0]"
  P_NCO_FREQ: "Base period in X[15:0], initial phase in X[31:16]; the frequency goes in Y"
  P_NCO_DUTY: "Base period in X[15:0], initial phase in X[31:16]; the duty goes in Y"
  P_PWM_TRIANGLE: "Base period in X[15:0], frame period (in base periods) in X[31:16]"
  P_PWM_SAWTOOTH: "Base period in X[15:0], frame period (in base periods) in X[31:16]"
  P_REPOSITORY: "The long to store, written once DIR is high (ignored during reset); RDPIN or RQPIN reads it back"
  P_QUADRATURE: "Measurement period in clocks (0 = continuous count, like a totalizer)"
  P_COUNT_RISES: "Measurement period"
  P_COUNT_HIGHS: "Measurement period"

calculation_examples:
  uart_baud: |
    ' Configure async UART for any baud rate, 8 data bits
    PUB set_baud(pin, baud) | x
      x := ((CLKFREQ / baud) << 16) | 7    ' bits[31:16]=clocks/bit, bits[4:0]=N-1
      WXPIN(pin, x)

  pwm_frequency: |
    ' Set sawtooth PWM (P_PWM_SAWTOOTH) by frequency: base period 1 clock, frame of CLKFREQ / freq base periods
    ' (the frame count is X[31:16], so CLKFREQ / freq must fit in 16 bits).
    ' A triangle PWM (P_PWM_TRIANGLE) period is two frame periods, so its frame would be CLKFREQ / (2 * freq).
    PUB set_pwm_freq(pin, freq) | x
      x := ((CLKFREQ / freq) << 16) | 1
      WXPIN(pin, x)
      
  measurement_time: |
    ' Set measurement in milliseconds.
    ' WARNING: x overflows signed 32-bit when (CLKFREQ/1000) * ms > 2^31.
    ' At 200 MHz the safe range is ms <= ~10_737 (~10.7 s). For longer
    ' measurement windows, reconsider the approach — see
    ' language/spin2/concepts/timing_operations.yaml (method_selection).
    PUB set_measure_ms(pin, ms) | x
      x := CLKFREQ / 1000 * ms
      WXPIN(pin, x)

related_methods:
  - "WRPIN"
  - "WYPIN"
  - "RDPIN"
  - "RQPIN"
  - "PINSTART"

timing_considerations:
  - "In NCO frequency mode (P_NCO_FREQ, %00110), WXPIN writes X[31:16] into Z[31:16] (the phase), even during reset"
  - "In NCO duty mode (P_NCO_DUTY, %00111), WXPIN writes X[31:16] into Z[31:16]; Z is set to zero during reset. Not documented: whether a phase written during reset is kept"
  - "In long repository mode (P_REPOSITORY), WXPIN is ignored during reset (DIR low); raise DIR first, then write the long"
  - "Depending on the mode, new data can be fed with WXPIN/WYPIN after DIR is raised"
  - "Cogs that execute WRPIN, WXPIN, WYPIN, RDPIN or AKPIN on the same smart pin must do so at different times; their buses to the pin are OR'd and simultaneous writes clobber each other. Any number of cogs can read a smart pin at the same time with RQPIN"

notes:
  - "The meaning of X depends on the smart pin mode"

warnings:
  - "Must set correct mode first with WRPIN"

see_also:
  - "language/spin2/methods/wrpin.yaml"
  - "language/spin2/methods/wypin.yaml"
  - "language/spin2/methods/rdpin.yaml"
  - "architecture/smart_pins.yaml"

sources:
  - "description, sync_serial_modes (X[5:0], LSB first, clocked by the B input): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PINS (mode, X, Y write-only, Z read-only) and SMART PIN MODES (%11100 and %11101: X.[5] update mode or sample position, X.[4..0] bits minus 1, words of 1 to 32 bits shifted LSB first)"
  - "async_serial_modes, mode_specific_x_values (P_ASYNC_TX, P_ASYNC_RX): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PIN MODES (%11110 and %11111: X[31:16] clocks in a bit period, X[15:10] fractional clocks in case X[31:26] is zero)"
  - "pwm_frequency (triangle period is two frame periods; sawtooth counts one up to the frame period): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PIN MODES (%01000, %01001)"
  - "mode_specific_x_values (P_PULSE, P_TRANSITION, P_PWM_TRIANGLE, P_PWM_SAWTOOTH, P_QUADRATURE, P_COUNT_RISES, P_COUNT_HIGHS) and x_register_usage_by_mode.pwm_modes: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PIN MODES (%00100 pulse/cycle X[15:0] and X[31:16]; %00101 transition X[15:0]; %01000 and %01001 PWM X[15:0] base period and X[31:16] frame period; %01011 quadrature X period, zero = continuous; %01100 to %01111 X measurement period)"
  - "timing_considerations (new data after DIR is raised): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PINS (After configuration, depending on the mode, new data can be fed via WXPIN/WYPIN)"
  - "timing_considerations, mode_specific_x_values (P_REPOSITORY, NCO modes): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PIN MODES (%00001..%00011 long repository, %00110 NCO frequency, %00111 NCO duty)"
  - "timing_considerations (multi-cog access): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PINS (cog-to-smart-pin buses)"