method: HUBSET
type: method
description: |
  Execute HUBSET instruction for low-level hub configuration
category: Miscellaneous
syntax: "HUBSET(Value)"
parameters:
  - name: "Value"
    type: "long"
    description: "32-bit configuration value for hub"
returns:
  type: "void"
  description: "No return value"
examples:
  - code: |
      ' Direct clock configuration: apply the compiled clock mode
      HUBSET(clkmode_)
    description: "Set clock mode directly"

  - code: |
      ' Safe PLL switching pattern (the sequence the compiler uses for the compiled clock mode)
      PUB switch_to_pll()
        ' Step 1: start the crystal/PLL but stay on RCFAST
        hubset(clkmode_ & !%11)

        ' Step 2: allow about 10 ms for the crystal/PLL to settle; RCFAST runs at
        ' 20 MHz or a little more, so count 20_000_000 / 100 clocks (WAITMS scales by the clkfreq variable,
        ' which need not equal the 20 MHz that RCFAST is running at)
        waitct(getct() + 20_000_000 / 100)

        ' Step 3: switch to the crystal/PLL
        hubset(clkmode_)
    description: "Safe clock switching to PLL with proper lock time; HUBSET does not update the clkmode / clkfreq variables (use CLKSET for that)"

  - code: |
      ' Reboot the chip
      HUBSET($1000_0000)               ' generates an internal reset pulse to reboot
    description: "Reset and reboot the entire chip"

  - code: |
      ' Seed the PRNG
      HUBSET($8000_0000 | seed_value)  ' MSB set: seeds 32 bits of the PRNG state
    description: "Seed 32 bits of the xoroshiro128** PRNG that GETRND reads"

  - code: |
      ' Set smart pin digital filter 0 to length code 1 (3 flipflops), timing tap 4
      HUBSET($4000_0000 + (1 << 5) + 4)
    description: "Configure a smart pin input filter"
notes:
  - "Low-level hub configuration"
  - "Directly executes HUBSET instruction"
  - "Affects global chip configuration"
  - "Use CLKSET for safe clock changes"
  - "Requires understanding of hub config bits"
  - "Can affect all cogs"
  - "Use with caution"
timing:
  execution_model: |
    Spin2 methods execute via the bytecode interpreter. Method-call clock count: not documented.
  underlying_pasm: "HUBSET"
  underlying_pasm_timing: "2 clocks (fixed)"

related:
  - language/spin2/methods/clkset.yaml
  - language/spin2/system-variables/clkfreq.yaml
  - language/spin2/system-variables/clkmode.yaml
  - language/pasm2/hubset.yaml
  - language/spin2/constants/special-configuration-symbols.yaml
  - architecture/clock_system.yaml
