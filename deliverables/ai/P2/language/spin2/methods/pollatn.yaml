method: POLLATN
type: method
description: |
  Check for attention signal without blocking
category: COG Management
syntax: "result := POLLATN()"
parameters: []
returns:
  type: "integer"
  description: "TRUE (-1) if ATN signal received, FALSE (0) if not"
examples:
  - code: |
      ' Non-blocking check for signal
      if POLLATN()
        ' ATN signal received
        process_signal()
    description: "Check for signal without blocking"
  - code: |
      ' Main loop with signal handling
      repeat
        do_main_work()
        if POLLATN()
          handle_interrupt()
    description: "Interruptible main loop"
  - code: |
      ' Timeout waiting for ATN
      timeout := GETCT() + clkfreq
      repeat
        if POLLATN()
          ' Got signal
          quit
        if POLLCT(timeout)
          ' Timeout - no signal
          return FALSE
    description: "ATN wait with timeout"
notes:
  - "Non-blocking alternative to WAITATN"
  - "Returns immediately with TRUE/FALSE"
  - "Clears ATN flag if it was set"
  - "Another cog uses COGATN to send the signal"
  - "Useful for cooperative multitasking"
  - "Can be used in main loop for interrupt-like behavior"
timing:
  execution_model: |
    Spin2 methods execute via the bytecode interpreter. The interpreter is
    engineered to run at minimum cost. We do not publish a clock count for
    the method-call path because we do not have a verifiable measurement.
  underlying_pasm: "POLLATN"
  underlying_pasm_timing: "2 clocks (fixed)"

related:
  - WAITATN
  - COGATN
  - POLLCT
see_also:
  - "Cog communication"
  - "Non-blocking operations"
  - "Inter-cog signaling"
