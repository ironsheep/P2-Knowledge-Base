method: TASKCHK
type: method
category: Task Operations

requires_version: "Spin2_v47"
version_directive: "{Spin2_v47}"

description: |
  Check the status of a task. Returns a value indicating whether the task is 
  unused (0), running (1), or halted (2). This allows monitoring task states 
  without affecting them.
  REQUIRES: {Spin2_v47} or later version directive at start of source file.
syntax: "result := TASKCHK(TaskID)"
parameters:
  - name: "TaskID"
    type: "integer"
    description: "Task ID to check (0-31)"
returns:
  type: "integer"
  description: "0 = unused/stopped, 1 = running, 2 = halted"
examples:
  - code: |
      {Spin2_v47}                              ' REQUIRED directive
      PUB check_task(task_id) | status
        status := TASKCHK(task_id)
        case status
          0: debug("Task unused/stopped")
          1: debug("Task running")
          2: debug("Task halted")
    description: "Check detailed task status"
  - code: |
      {Spin2_v47}                              ' REQUIRED directive
      PUB count_active_tasks() : count | task_id
        count := 0
        repeat task_id from 0 to 31
          if TASKCHK(task_id)
            count++
    description: "Count running or halted tasks"
  - code: |
      {Spin2_v47}                              ' REQUIRED directive
      PRI wait_for_task(task_id)
        repeat while TASKCHK(task_id)
          TASKNEXT()                           ' Yield while waiting
    description: "Wait for task completion"
notes:
  - "REQUIRES {Spin2_v47} or later at start of source file"
  - "Non-destructive status check"
  - "Returns 0 for unused/stopped tasks"
  - "Returns 1 for running tasks"
  - "Returns 2 for halted tasks"
  - "Useful for task monitoring"
  - "Can check any task ID 0-31"
timing:
  description: "Immediate"
  cycles: "2-9 clock cycles"
related:
  - TASKID
  - TASKSPIN
  - TASKSTOP
see_also:
  - "Task monitoring"
  - "Task status"
  - "Task management"