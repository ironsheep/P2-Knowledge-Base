method: BYTECOMP
type: method
category: Memory Operations

requires_version: Spin2_v45
version_directive: '{Spin2_v45}'

description: |
  Compare Count bytes of data starting at Address1 and Address2; return -1
  (TRUE) if they match, 0 (FALSE) if they differ.
  REQUIRES: {Spin2_v45} or later version directive at start of source file.
syntax: result := BYTECOMP(Address1, Address2, Count)
parameters:
- name: Address1
  type: address
  description: First hub RAM address for comparison
- name: Address2
  type: address
  description: Second hub RAM address for comparison
- name: Count
  type: integer
  description: Number of bytes to compare
returns:
  type: integer
  description: TRUE (-1) if all bytes match, FALSE (0) if any bytes differ
examples:
- code: "' Compare two strings\nif BYTECOMP(@string1, @string2, 10)\n  ' First 10\
    \ bytes match\n"
  description: Compare fixed-length byte sequences
- code: "' Verify buffer contents\nif BYTECOMP(@buffer, @expected, 256)\n  ' Buffer\
    \ matches expected data\n"
  description: Verify buffer against expected values
- code: "' Check for pattern\nif BYTECOMP(@data[offset], @pattern, 4)\n  ' Found 4-byte\
    \ pattern at offset\n"
  description: Search for byte pattern in data
notes:
- Returns TRUE (-1) if all bytes match
- Returns FALSE (0) if any byte differs
- Count of 0 returns 0 (FALSE), not TRUE
sources:
  - "requires_version: CP-011 ({Spin2_v44} is refused by the compiler; {Spin2_v45} is the earliest gate that enables the method)"
timing:
  execution_model: |
    Spin2 methods execute via the bytecode interpreter. Clock count: not documented.

related:
- WORDCOMP
- LONGCOMP
- STRCOMP
- BYTEMOVE
see_also:
- Memory comparison
- String operations
- Pattern matching
