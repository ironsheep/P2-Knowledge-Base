method: SQRT
type: method
description: Returns integer square root of a number
category: Math Operations
source: "Parallax Propeller 2 Spin2 Language Documentation v55, Operators (SQRT); the truncated (floor) result: EF-104"
syntax: "result := SQRT(value)"
parameters:
  - name: "value"
    type: "long"
    description: "Unsigned integer value (0 to 2³²-1)"
returns:
  type: "long"
  description: "Integer square root"
examples:
  - code: |
      x := SQRT(100)     ' Result: 10
      y := SQRT(65536)   ' Result: 256
    description: "Basic square root operations"
  - code: |
      ' Distance calculation (Pythagorean)
      distance := SQRT((x2-x1)*(x2-x1) + (y2-y1)*(y2-y1))
    description: "Calculate 2D distance"
  - code: |
      ' RMS calculation
      rms := SQRT(sum_of_squares / count)
    description: "Root mean square calculation"
notes:
  - "Returns the truncated (floor) integer root, never rounded to nearest: SQRT(8) = 2, SQRT(99) = 9"
  - "Input treated as unsigned 32-bit"
  - "No floating-point variant; use FSQRT() for floats"
  - "Priority 2 operator (unary)"
related:
  - "language/spin2/methods/abs.yaml"
  - "language/spin2/methods/rotxy.yaml"