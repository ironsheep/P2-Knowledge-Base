method: PINSTART
type: method
description: |
  Configure and start smart pin with mode and parameters.
  Supports pin groups via ADDPINS operator for parallel operations.

  TRIGGER AND ASYNC SERIAL MODES: PINSTART's Yval is LOST. PINSTART writes Y before it
  raises DIR, and a WYPIN issued while DIR is low (the pin held in reset) never starts a
  pulse/cycle (%00100), transition (%00101) or asynchronous serial transmit (%11110)
  output. Pass Yval = 0 and issue the triggering WYPIN AFTER PINSTART (reset -> WRPIN/WXPIN
  -> DIR high -> WYPIN). Value modes keep the Y that PINSTART writes (an NCO started by
  PINSTART runs at its Yval). SYNCHRONOUS serial transmit (%11100) is the opposite: a word
  written while DIR is low primes its shifter and is sent once clocking starts, so
  PINSTART's Yval is the first word transmitted.
sources:
  - "description (%11100 keeps the reset-time word): P2 Documentation, silicon-doc-text.txt %11100 section; bench-verified in continuous mode, P2-EMPIRICAL-FINDINGS.md EF-090"
category: Smart Pin Operations
documentation_source: enhanced
documentation_level: comprehensive
syntax: "PINSTART(PinField, Mode, Xval, Yval)"
parameters:
  - name: "PinField"
    type: "pin_field"
    description: |
      Pin number (0-63) or pin field expression.
      Use ADDPINS to specify multiple consecutive pins:
      - Single pin: 16
      - Pin range: 16 ADDPINS 3 (pins 16-19)
      - Pin group: BASE_PIN ADDPINS (COUNT-1)

      WARNING - a NEGATIVE value is a legal pin field, not a "no pin" marker.
      -1 is all ones: base pin 63 with 31 additional pins, which wraps within the
      upper port and therefore means P32..P63. PINSTART(-1) acts on half the chip.
      The -1-as-no-pin idiom is near-universal in driver code, so a pin held in a
      variable is tested before use: `if pin >= 0`. Note the guard itself must be a
      SIGNED compare - see language/spin2/operators/op_gteq.yaml.
  - name: "Mode"
    type: "long"
    description: "Smart pin mode configuration (P_* constants)"
  - name: "Xval"
    type: "long"
    description: "X parameter for smart pin mode"
  - name: "Yval"
    type: "long"
    description: "Y parameter for smart pin mode"
returns:
  type: "void"
  description: "No return value"
examples:
  - code: |
      ' Start ADC on pin 16: SINC2 sampling, 1,024-clock sample period
      PINSTART(16, P_ADC | P_ADC_1X, %00_1010, 0)
    description: >-
      Configure pin as ADC input. X.[5..4] selects the mode (%00 = SINC2 sampling) and
      the sample period is 2^X.[3..0] clocks (%1010 = 1,024 clocks, 11-bit resolution).
      X = 0 would select a 1-clock period, which the P2 Documentation marks impractical.
    source: "P2 Documentation, silicon-doc-text.txt:4257-4268 and table 34 (%11000 ADC modes, X.[5..4] and X.[3..0] rows); P_ADC/P_ADC_1X per spin2-v55-text.txt:1469, :1554"
  - code: |
      ' Start PWM on pin 8: base period 1 clock, frame 1000 base periods, duty 500
      PINSTART(8, P_PWM_TRIANGLE | P_OE, 1000 << 16 | 1, 500)
    description: >-
      Configure triangle PWM. X.[15..0] is the base period in clocks and X.[31..16] the
      frame period in base periods; Y.[15..0] is the output value, from zero to the frame
      period.
    source: "P2 Documentation, silicon-doc-text.txt:4034-4044 (%01000 PWM triangle)"
  - code: |
      ' Start async serial TX on pin 62 at 115200 baud, 8 data bits
      ' X = (clocks/bit << 16) | (data_bits - 1)
      PINSTART(62, P_ASYNC_TX | P_OE, ((clkfreq/115200) << 16) | 7, 0)
    description: "Configure asynchronous serial transmit"
    source: "P2 Documentation, silicon-doc-text.txt:4684-4694 (%11110: X.[31..16] clocks per bit period, X.[4..0] bits minus 1)"
  - code: |
      ' Quadrature encoder: A on pin 32, B on pin 33 (B input = pin+1)
      PINSTART(32, P_QUADRATURE | P_PLUS1_B, 0, 0)   ' X = 0: continuous count
      ' RDPIN(32) returns the 32-bit step count
    description: >-
      Configure a quadrature encoder on ONE smart pin whose A input is its own pin and
      whose B input is selected relative to it. Starting both pins with ADDPINS does not
      pair them: each pin's B input defaults to its own pin.
    source: "P2 Documentation, silicon-doc-text.txt:4093-4097 (%01011 quadrature, X = 0 continuous), :3746-3756 (B input selector, x000 = this pin by default); P_PLUS1_B per spin2-v55-text.txt:1438"
  - code: |
      ' Smart-pin SPI (mode 0) on the P2 boot flash pins
      CON
        SF_SCK = 60                   ' clock out
        SF_SDO = 59                   ' data out (to flash DI)
        SF_SDI = 58                   ' data in (from flash DO)

      PUB setup_spi(khz) | x
        ' data out: sync TX, B input = SCK (pin+1); X = start-stop, 8 bits
        PINSTART(SF_SDO, P_OE | P_SYNC_TX | P_PLUS1_B, %1_00111, 0)
        PINF(SF_SDO)                  ' hold in reset until a transfer
        ' data in: sync RX, B input = SCK (pin+2); X = sample before edge, 8 bits
        PINSTART(SF_SDI, P_SYNC_RX | P_PLUS2_B, %0_00111, 0)
        PINF(SF_SDI)
        ' clock: pulse output; X.word[0] = ticks per period, X.word[1] = ticks low
        x.word[0] := 2 #> (clkfreq / (khz * 1000)) <# $FFFF
        x.word[1] := x.word[0] >> 1
        PINSTART(SF_SCK, P_OE | P_PULSE, x, 0)
    description: >-
      Configure smart-pin SPI: the data pins clock from SCK through the mode word's
      B-input selector (a relative pin offset), not through X; X carries only the
      sync-serial mode bit and the word size minus 1.
    source: >-
      Pattern of jm_ez_spi.spin2 start() (OBEX 2841, Jon McPhalen); X and B-input
      encodings per P2 Documentation, silicon-doc-text.txt %11100/%11101 and %00100
      sections; P_PLUS1_B/P_PLUS2_B per spin2-v55-text.txt:1438-1439.
pin_field_operators:
  ADDPINS:
    syntax: "base_pin ADDPINS count"
    description: |
      Creates a pin field representing consecutive pins.
      The count is 0-based (use n-1 for n pins).
    examples:
      - "16 ADDPINS 0  ' Single pin (16)"
      - "16 ADDPINS 3  ' 4 pins (16-19)"
      - "16 ADDPINS 7  ' 8 pins (16-23)"
    use_cases:
      - "Parallel data buses"
      - "LED arrays"
      - "Sensor arrays"
      - "Multi-bit I/O"
critical_requirement:
  reset_before_configure: true
  description: |
    PINSTART automatically takes the smart pin's DIR low, configures it, then raises
    DIR. A smart pin should be configured while its DIR bit is low, holding it in
    reset; a WRPIN while DIR is high gives unpredictable behavior.
  internal_sequence:
    - "DIR[pin] := 0     ' AUTOMATIC: hold smart pin in reset while configuring"
    - "WRPIN(pin, Mode)  ' Configure smart pin mode"
    - "WXPIN(pin, Xval)  ' Set X parameter"
    - "WYPIN(pin, Yval)  ' Set Y parameter"
    - "DIR[pin] := 1     ' Enable smart pin"
notes:
  - "Automatically performs the DIR=0 reset while configuring, then raises DIR"
  - "Complete initialization for value modes; in trigger and async-serial-TX modes the Yval is lost (written before DIR rises) -- pass 0 and WYPIN after PINSTART; sync serial TX (%11100) sends it (it primes the shifter)"
  - "Mode constants defined in Spin2 (P_ADC, P_PWM_TRIANGLE, etc.)"
  - "X and Y parameters are mode-specific"
  - "Pin starts operating immediately after DIR=1"
  - "Use PINCLEAR to stop and reset smart pin before reconfiguration"
  - "ADDPINS allows configuring multiple pins with same mode"
  - "Configure a smart pin while its DIR bit is low (hold it in reset); WRPIN while DIR is high gives unpredictable behavior"
operations:
  - "DIR[pin] := 0 (reset)"
  - "WRPIN(pin, Mode) (set mode)"
  - "WXPIN(pin, Xval) (set X parameter)"
  - "WYPIN(pin, Yval) (set Y parameter)"
  - "DIR[pin] := 1 (enable)"
timing:
  execution_model: |
    Spin2 methods execute via the bytecode interpreter. The interpreter is
    engineered to run at minimum cost. We do not publish a clock count for
    this method because we do not have a verifiable measurement (no clean
    single-PASM-instruction backing to cite).

related:
  - PINCLEAR
  - WRPIN
  - WXPIN
  - WYPIN
  - PINWRITE
  - PINREAD
  - language/spin2/methods/wrpin.yaml
output_enable_note: |
  PINSTART writes the whole 32-bit mode word (DIRL, WRPIN, WXPIN, WYPIN, DIRH),
  so every call must carry P_OE if the mode drives the pin — a later PINSTART on
  a pin replaces any P_OE set by an earlier group call. Output modes (NCO, PWM,
  pulse, transition, serial TX, DAC, USB) produce no pin activity without it and
  still compile clean. Receive/measuring modes (ADC, RX, counters) omit it.
  Authority: language/spin2/methods/wrpin.yaml tt_field.p_oe_required_for
see_also:
  - "Smart pin modes"
  - "Smart pin configuration"
  - "P2 smart pin constants"
  - "language/spin2/constructs/inline_pasm.yaml"