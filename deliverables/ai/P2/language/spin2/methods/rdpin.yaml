method: RDPIN
type: method
description: |
  Read smart pin result and acknowledge the smart pin
category: Smart Pin Operations
syntax: "result := RDPIN(Pin)"
parameters:
  - name: "Pin"
    type: "long"
    description: "Pin number (0-63)"
returns:
  type: "long"
  description: "32-bit result with bit 31 containing the pin's C flag state"
examples:
  - code: |
      ' Read pin 16's smart pin result with bit 31 (the C flag) masked off
      adc_value := RDPIN(16) & $7FFF_FFFF
    description: "Read the result bits of pin 16"
  - code: |
      ' Read pin 8's result and mask off bit 31
      width := RDPIN(8) & $7FFF_FFFF
    description: "Read the result bits of pin 8"
  - code: |
      ' Check C flag while reading
      value := RDPIN(pin)
      if value < 0  ' bit 31 is set: the C flag was set
        value &= $7FFF_FFFF
    description: "Read value and check C flag state"
notes:
  - "Acknowledges the smart pin, which lowers its IN signal"
  - "Bit 31 of result contains the pin's C flag state"
  - "The other bits contain the smart pin's result"
  - "RQPIN reads without acknowledging"
  - "Not documented: the value RDPIN returns from a smart pin in an ADC mode or in asynchronous receive mode before that pin has completed its first sample period or received its first word"
source: "Parallax Propeller 2 Spin2 Language Documentation v55, Pin Methods (RDPIN (Pin) : Zval, read Pin smart pin and acknowledge, Zval[31] = C flag from RDPIN, other bits are RDPIN data); Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PINS (RDPIN or AKPIN causes the smart pin to lower its IN signal)"
timing:
  execution_model: |
    Spin2 methods execute via the bytecode interpreter. Method-call clock count: not documented.
  underlying_pasm: "RDPIN"
  underlying_pasm_timing: "2 clocks (fixed)"

related:
  - RQPIN
  - AKPIN
  - WRPIN
  - WXPIN
  - WYPIN
see_also:
  - "Smart pin modes"
  - "Smart pin configuration"
  - "Pin I/O operations"
