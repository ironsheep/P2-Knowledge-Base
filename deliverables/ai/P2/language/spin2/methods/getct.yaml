# Spin2 Method: GETCT
# Source: Spin2 v51 documentation
# Purpose: Get current system counter value

method: "GETCT"
category: "timing"
type: "method"
description: |
  Get the lower 32 bits of the 64-bit system counter.
  The underlying counter is a free-running 64-bit value that increments once per clock cycle
  continuously from boot (Rev B/C silicon). GETCT() returns only the lower 32 bits, which
  wraps around from $FFFF_FFFF to $0000_0000 approximately every 21 seconds at 200MHz.
  For the upper 32 bits use the PASM2 GETCT D WC form. Essential for precise timing
  measurements and delays.

syntax: "GETCT() : Count"

parameters: "none"

returns:
  name: "Count"
  type: "long"
  description: |
    Current 32-bit system counter value.
    Increments at system clock frequency.
    Wraps from $FFFF_FFFF to $0000_0000.

timing:
  execution_model: |
    Spin2 methods execute via the bytecode interpreter. The interpreter is
    engineered to run at minimum cost. We do not publish a clock count for
    the method-call path because we do not have a verifiable measurement.
  underlying_pasm: "GETCT"
  underlying_pasm_timing: "2 clocks (fixed)"


examples:
  - code: |
      start := GETCT()
      ' ... do something ...
      elapsed := GETCT() - start
      ' elapsed now contains clock cycles
    description: "Measure execution time"
    
  - code: |
      ' Convert cycles to microseconds
      start := GETCT()
      process_data()
      elapsed_us := (GETCT() - start) / (CLKFREQ / 1_000_000)
    description: "Time measurement in microseconds"
    
  - code: |
      ' Wait for exact 1 second
      target := GETCT() + CLKFREQ
      WAITCT(target)
    description: "Precise 1-second delay"
    
  - code: |
      ' Create 10Hz precise loop
      next_time := GETCT()
      REPEAT
        next_time += CLKFREQ / 10
        WAITCT(next_time)
        do_10hz_task()
    description: "Precise periodic execution"
    
  - code: |
      ' Short timeout pattern (100 ms is well within GETCT's ~10 s safe window at 200 MHz)
      timeout := GETCT() + (CLKFREQ / 1000) * 100  ' 100ms timeout
      REPEAT WHILE (GETCT() - timeout) < 0
        IF PINREAD(0)
          ' Got response
          QUIT
      ' Timed out
      ' For multi-second timeouts, use GETMS — see pitfalls section below.
    description: "Implement short timeout (see pitfalls for the upper bound)"

underlying_pasm:
  instruction: "GETCT"
  description: "Direct access to CNT register"

common_uses:
  - "Execution time measurement"
  - "Creating precise delays with WAITCT"
  - "Timeout implementation"
  - "Performance profiling"
  - "Timestamp generation"
  - "Periodic task scheduling"
  - "Bit-rate timing generation"

related_methods:
  - "WAITCT"
  - "POLLCT"
  - "WAITMS"
  - "WAITUS"
  - "GETMS"
  - "GETSEC"

notes:
  - "Counter runs continuously from boot"
  - "Underlying hardware counter is 64-bit (Rev B/C silicon); GETCT() returns the lower 32 bits"
  - "The upper 32 bits are accessible via the PASM2 GETCT D WC instruction"
  - "Wraps around every 2^32 clocks (lower 32 bits)"
  - "Subtraction handles wrap correctly"
  - "All cogs see same counter value"
  - "Not affected by cog start/stop"
  - "Resolution equals clock period"

wraparound_handling: |
  The 32-bit subtraction naturally handles wraparound:
  If end_time < start_time (wrapped), the result is still correct
  Example: $0000_0010 - $FFFF_FFF0 = $20 (32 clocks elapsed)

precision_considerations:
  - "Single clock accuracy when reading"
  - "Hub access may add 0-7 clock variance"
  - "Use WAITCT for cycle-accurate delays"
  - "GETCT itself takes 2 clocks to execute"

pitfalls:
  - title: "Overflow in (CLKFREQ / divisor) * value timeout calculations"
    severity: "logic_error"
    description: |
      The common timeout idiom `target := GETCT() + (CLKFREQ / 1000) * timeout_ms`
      silently overflows when (CLKFREQ / 1000) * timeout_ms exceeds 2^31. The
      wrap-aware compare `(GETCT() - target) < 0` is bounded by the same 2^31
      signed-cycle window, so even a correctly stored deadline cannot be checked
      across more than 2^31 cycles of elapsed time.
    rule_of_thumb: |
      At system clock f, GETCT-based timeouts are bounded to roughly 2^31 / f
      seconds: ~10.7 s at 200 MHz, ~8.6 s at 250 MHz, ~6.7 s at 320 MHz.
      For protocol timeouts that may exceed those limits (SPI/SD read response,
      busy-wait, multi-second retries), use GETMS instead. GETMS gives a 49.7-day
      window before its own wraparound is even relevant.
    see_also:
      - "language/spin2/methods/getms.yaml"
      - "language/spin2/concepts/timing_operations.yaml"

see_also:
  - "language/spin2/methods/waitct.yaml"
  - "language/spin2/methods/pollct.yaml"
  - "language/spin2/methods/getms.yaml"
  - "language/pasm2/getct.yaml"
  - "language/spin2/concepts/timing_operations.yaml"