method: GETSEC
type: method
description: |
  Get seconds elapsed since system boot
category: Timing Operations
syntax: "seconds := GETSEC()"
parameters: []
returns:
  type: "long"
  description: "Seconds since boot (32-bit value)"
examples:
  - code: |
      ' Display uptime in seconds
      debug("System uptime: ", udec(GETSEC()), " seconds")
    description: "Show system uptime"
  - code: |
      ' Long-running timer
      start_sec := GETSEC()
      ' ... much later ...
      elapsed_sec := GETSEC() - start_sec
      debug("Process ran for ", udec(elapsed_sec), " seconds")
    description: "Measure long durations"
  - code: |
      ' Periodic task every 10 seconds
      next_run := GETSEC() + 10
      repeat
        if GETSEC() >= next_run
          do_periodic_task()
          next_run += 10
    description: "Schedule periodic tasks"
notes:
  - "Based on system counter divided by clkfreq"
  - "32-bit value wraps after ~136 years"
  - "1-second resolution"
  - "Good for long-duration timing -- in a cog whose four-cog group was kept running (see silicon_errata)"
  - "More convenient than GETMS for human-readable times"
  - "Handles clock frequency changes automatically"
silicon_errata:
  stale_upper_long_after_missed_wrap: "GETSEC() is computed from the calling cog's 64-bit counter (GETCT WC + GETCT, divided by clkfreq), so it reads short in a cog whose group of four (cogs 0-3 or 4-7) had no running cog at a wrap of the lower long, until that group runs through its next wrap: 2^32 clocks = 21.47 s at 200 MHz per missed wrap. Workaround: keep a cog of the group running at every wrap (a keeper cog started first), or take no time in that group until it has run through one wrap. Hardware-verified on Rev C (EF-080, EF-082). Full account: language/pasm2/getct.yaml silicon_errata."
timing:
  execution_model: |
    Spin2 methods execute via the bytecode interpreter. The interpreter is
    engineered to run at minimum cost. We do not publish a clock count for
    this method because we do not have a verifiable measurement (no clean
    single-PASM-instruction backing to cite).

related:
  - language/spin2/methods/getms.yaml
  - language/spin2/methods/getct.yaml
  - language/spin2/methods/waitms.yaml
  - language/pasm2/getct.yaml
see_also:
