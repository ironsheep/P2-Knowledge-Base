method: STRCOPY
type: method
description: |
  Copy null-terminated string with length limit
category: String Operations
syntax: "STRCOPY(DestAddress, SourceAddress, MaxCount)"
parameters:
  - name: "DestAddress"
    type: "address"
    description: "Destination buffer address"
  - name: "SourceAddress"
    type: "address"
    description: "Source string address (null-terminated)"
  - name: "MaxCount"
    type: "integer"
    description: "Maximum number of characters to copy; the copied string occupies up to MaxCount+1 bytes, including the zero terminator"
returns:
  type: "void"
  description: "No return value"
examples:
  - code: |
      ' Copy string with buffer limit
      STRCOPY(@buffer, @source, 80)  ' Up to 80 chars + zero (81-byte buffer)
    description: "Safe string copy with limit"
  - code: |
      ' Copy user input
      STRCOPY(@name, @input, 32)  ' Up to 32 chars + zero (33-byte buffer)
    description: "Copy with length protection"
  - code: |
      ' Build compound string
      STRCOPY(@message, STRING("Error: "), 100)  ' message needs 101 bytes
      ' Then append more...
    description: "Start building message"
notes:
  - "Always null-terminates destination"
  - "Stops after the source's terminator or after MaxCount characters, then writes the zero"
  - "MaxCount does NOT include the zero terminator: the destination needs MaxCount+1 bytes"
  - "If MaxCount is 0, only the zero byte is written"
  - "Destination buffer must be at least MaxCount+1 bytes"
timing:
  execution_model: |
    Spin2 methods execute via the bytecode interpreter. The interpreter is
    engineered to run at minimum cost. We do not publish a clock count for
    this method because we do not have a verifiable measurement (no clean
    single-PASM-instruction backing to cite).

related:
  - STRCOMP
  - STRSIZE
  - BYTEMOVE
  - STRING
see_also:
  - "String operations"
  - "Buffer management"
  - "Safe string handling"
