method: SIZEOF
type: method
category: Miscellaneous

requires_version: "Spin2_v45"
version_directive: "{Spin2_v45}"

description: |
  Returns the size in bytes of a structure definition. Evaluated at compile time 
  and can be used for buffer allocation and memory management.
  REQUIRES: {Spin2_v45} or later version directive at start of source file.
  
  NOTE (v51a): SIZEOF() is restricted to DAT, VAR, PUB, and PRI blocks. Using 
  SIZEOF() in CON or OBJ blocks will cause a compile error.
syntax: "size := SIZEOF(Structure)"
parameters:
  - name: "Structure"
    type: "structure_name"
    description: "Name of structure defined in CON section"
returns:
  type: "integer"
  description: "Size in bytes of the structure"
examples:
  - code: |
      {Spin2_v45}                              ' REQUIRED directive
      CON
        STRUCT point(x, y)                     ' 8 bytes (2 longs)
      
      PUB main() | size
        size := SIZEOF(point)                  ' Returns 8
    description: "Get structure size in PUB method"
  - code: |
      {Spin2_v45}                              ' REQUIRED directive
      CON
        STRUCT header(LONG id, WORD flags, BYTE data[16])
      
      VAR
        BYTE buffer[SIZEOF(header)]            ' SIZEOF in VAR block OK
    description: "Allocate buffer using SIZEOF in VAR block"
  - code: |
      {Spin2_v45}                              ' REQUIRED directive
      CON
        STRUCT vector3(x, y, z)
        STRUCT matrix3(vector3 row[3])
      
      DAT
        matrix_size   LONG  SIZEOF(matrix3)   ' SIZEOF in DAT block OK
    description: "SIZEOF in DAT block"
notes:
  - "REQUIRES {Spin2_v45} or later at start of source file"
  - "V51a RESTRICTION: SIZEOF() only allowed in DAT, VAR, PUB, PRI blocks"
  - "V51a RESTRICTION: Using SIZEOF() in CON or OBJ blocks causes compile error"
  - "Returns total byte count of structure"
  - "Accounts for member sizes (BYTE=1, WORD=2, LONG=4)"
  - "Compile-time evaluation - no runtime cost"
  - "Works with arrays and nested structures"
  - "Useful for buffer allocation and memory management"
  - "Companion function OFFSETOF() returns byte offset of a member within a structure (v53+)"
  - "V54+: For a nameless single-member STRUCT (e.g., STRUCT io_t(LONG.ready[0])), SIZEOF returns the size of the backing member type — 1 for BYTE, 2 for WORD, 4 for LONG"
timing:
  description: "Compile-time constant"
  cycles: "N/A - resolved at compile time"
related:
  - language/spin2/methods/offsetof.yaml
  - language/spin2/keywords/STRUCT.yaml
  - language/spin2/keywords/BYTE.yaml
  - language/spin2/keywords/WORD.yaml
  - language/spin2/keywords/LONG.yaml
  - language/spin2/concepts/struct-bitfields.yaml
see_also:
  - "Structure definitions"
  - "CON section"
  - "Memory allocation"
