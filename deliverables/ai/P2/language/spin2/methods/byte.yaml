method: BYTE
type: method
description: |
  Declare byte data or access byte-sized memory
category: Data Creation
syntax: |
  Declaration: BYTE Name[Count]
  Access: BYTE[BaseAddress][Index]
  Inline: BYTE(Value1, Value2, ...)
contexts:
  - name: "DAT section declaration"
    syntax: "Label BYTE Value1 {, Value2, ...}"
    description: "Declare byte data in DAT section"
  - name: "VAR section declaration"
    syntax: "BYTE Name[Count]"
    description: "Declare byte variable(s) in VAR section"
  - name: "Memory access"
    syntax: "BYTE[Address][Index]"
    description: "Access byte at hub memory address"
  - name: "Inline data"
    syntax: "BYTE(Value1, Value2, ...)"
    description: "Create inline byte sequence"
examples:
  - code: |
      DAT
        my_bytes  BYTE  $FF, $00, $55, $AA
    description: "Declare byte data in DAT section"
  - code: |
      VAR
        BYTE buffer[256]  ' 256-byte array
    description: "Declare byte array in VAR section"
  - code: |
      ' Write byte to hub memory
      BYTE[$1000] := $42
      
      ' Read byte from hub memory  
      value := BYTE[$1000]
    description: "Direct hub memory byte access"
  - code: |
      ' Pass a zero-terminated byte sequence to a method (print_str takes a string address)
      print_str(BYTE($48, $65, $6C, $6C, $6F, 0))  ' "Hello"
    description: "Inline byte data creation; BYTE(...) returns the address of the composed bytes"
notes:
  - "BYTE is 8 bits (0-255); use SIGNX to sign-extend a byte read"
  - "Hub memory is byte-addressable"
  - "Arrays are zero-indexed"
  - "Can use @ operator to get address of byte variable"
  - "VAR variables are packed in declaration order starting at a long-aligned address; ALIGNW / ALIGNL advance the variable pointer to a word / long boundary"
related:
  - WORD
  - LONG
  - BYTEFILL
  - BYTEMOVE
see_also:
  - "Data types"
  - "Memory organization"
  - "DAT section"
  - "VAR section"
