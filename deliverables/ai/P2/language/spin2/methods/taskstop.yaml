method: TASKSTOP
type: method
category: Task Operations

requires_version: "Spin2_v47"
version_directive: "{Spin2_v47}"

description: |
  Permanently stop and terminate a running task. The task is immediately 
  terminated and its task ID becomes available for reuse. Use THISTASK (-1) 
  to stop the currently executing task.
  REQUIRES: {Spin2_v47} or later version directive at start of source file.
syntax: "TASKSTOP(TaskID)"
parameters:
  - name: "TaskID"
    type: "integer"
    description: "Task ID to stop (0-31) or THISTASK (-1) for current"
returns:
  type: "void"
  description: "No return value"
examples:
  - code: |
      {Spin2_v47}                              ' REQUIRED directive
      PUB main()
        TASKSTOP(2)                            ' Stop task ID 2
    description: "Stop task by ID"
  - code: |
      {Spin2_v47}                              ' REQUIRED directive
      PRI background_task()
        repeat
          if shutdown_flag
            TASKSTOP(THISTASK)                 ' Stop self
          do_work()
          TASKNEXT()
    description: "Task self-termination"
  - code: |
      {Spin2_v47}                              ' REQUIRED directive
      PUB shutdown_all_tasks() | task_id
        repeat task_id from 1 to 31
          if TASKCHK(task_id)
            TASKSTOP(task_id)
    description: "Stop all secondary tasks"
notes:
  - "REQUIRES {Spin2_v47} or later at start of source file"
  - "Immediately terminates the task"
  - "Task's stack space can be reused"
  - "THISTASK (-1) stops current task"
  - "Main task (ID 0) typically shouldn't stop"
  - "No cleanup - task stops immediately"
  - "Task ID becomes available for reuse"
timing:
  execution_model: |
    Spin2 methods execute via the bytecode interpreter. The interpreter is
    engineered to run at minimum cost. We do not publish a clock count for
    this method because we do not have a verifiable measurement (no clean
    single-PASM-instruction backing to cite).

related:
  - TASKSPIN
  - TASKHALT
  - TASKRESUME
  - TASKCHK
see_also:
  - "Task termination"
  - "Task management"
  - "Resource cleanup"