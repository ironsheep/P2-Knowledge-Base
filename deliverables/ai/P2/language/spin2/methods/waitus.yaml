# Spin2 Method: WAITUS
# Source: Parallax Spin2 Documentation v55, Timing Methods table
# Purpose: Delay execution for specified microseconds

method: "WAITUS"
category: "timing"
type: "method"
description: |
  Delay execution for a specified number of microseconds.
  The delay is converted to clocks through CLKFREQ.
  WAITUS is a Spin2 method; the compiler refuses it as a PASM instruction.

syntax: "WAITUS(Microseconds)"

parameters:
  - name: "Microseconds"
    type: "long"
    description: |
      Number of microseconds to delay. The bound the source states is in CLOCKS,
      not microseconds: "Wait Microseconds, uses CLKFREQ, duration must not
      exceed $8000_0000 clocks." The microsecond ceiling therefore scales with
      CLKFREQ -- see the `limitations` block below.
      Can be a constant, variable, or expression.
      Value is treated as unsigned.

returns: "none"

timing:
  execution_model: |
    Spin2 methods execute via the bytecode interpreter. Clock count: not documented.


examples:
  - code: "WAITUS(10)"
    description: "Delay for 10 microseconds"
    
  - code: |
      ' Pin 0 high 10 microseconds, low 10 microseconds, repeated
      REPEAT
        PINHIGH(0)
        WAITUS(10)
        PINLOW(0)
        WAITUS(10)
    description: "Repeatedly drive pin 0 high, wait 10 microseconds, drive it low, wait 10 microseconds"
    
  - code: |
      ' Pin high for width_us microseconds, then low
      PUB pulse(pin, width_us)
        PINHIGH(pin)
        WAITUS(width_us)
        PINLOW(pin)
    description: "Pulse of width_us microseconds"
    
  - code: |
      ' Write a value to a pin, then wait 104 microseconds
      PUB send_bit(value)
        PINWRITE(TX_PIN, value)
        WAITUS(104)
    description: "Write a pin, then wait 104 microseconds"

  - code: |
      ' Drive SCL high, wait, read SDA, wait, drive SCL low
      PINHIGH(SCL)
      WAITUS(5)
      data := PINREAD(SDA)
      WAITUS(5)
      PINLOW(SCL)
    description: "Two 5 microsecond waits around a pin read"

underlying_implementation:
  description: |
    The interpreter reads the system counter, multiplies CLKFREQ by Microseconds,
    divides the product by 1_000_000, adds that result to the counter value it read
    to make an absolute target, and then waits the way WAITCT does: the cog polls the
    counter in a loop while the MSB of (CT - target) is set. WAITUS does not use WAITX.
    The $8000_0000-clock bound: see limitations.past_the_bound.
    The conversion uses CLKFREQ.
  pasm_refusal:
    fact: "WAITUS appears in a Spin2 method and the compiler accepts it; written as a DAT (PASM) instruction it is refused with 'Expected a unique name, BYTE, WORD, LONG, or assembly instruction'. PASM WAITX is accepted."
    source: "CP-050 (pnut-ts, WAITUS in a Spin2 method accepted; WAITUS as a PASM instruction refused)"
  related_pasm: "language/pasm2/waitx.yaml"

related_methods:
  - "WAITMS"
  - "WAITCT"
  - "GETCT"
  - "POLLCT"

notes:
  source: "Parallax Spin2 Documentation v55, Timing Methods (the WAITUS row); choosing_between_waits: the WAITMS and WAITCT rows of the same table"
  v55_definition: "WAITUS(Microseconds) -- Wait Microseconds, uses CLKFREQ, duration must not exceed $8000_0000 clocks."
  related_waits:
    - "WAITMS(Milliseconds) has the same $8000_0000-clock bound."
    - "WAITCT(Tick): Wait for system counter to get past 'Tick'."
  blocking: "The cog polls the system counter in a loop for the duration of the wait."

limitations:
  source: "Parallax Spin2 Language Documentation v55, Timing Methods; Parallax Spin2 Interpreter v55 (2026.05.07), waitus_ (getct, rdlong clkfreq, qmul, qdiv by 1_000_000, add counter) and pwct (the polling loop shared with WAITCT)"
  hard_bound: "duration must not exceed $8000_0000 clocks"
  clock_conversion: "The interpreter multiplies CLKFREQ by Microseconds, then divides by 1_000_000, giving the duration in clocks. The bound applies to that result."
  past_the_bound: |
    The bound is $8000_0000 clocks. The call computes an absolute counter target from
    the duration and waits for it as WAITCT does; what a call past the bound does is
    not documented.
  resolution: "1 µs -- the argument's unit"

clock_frequency_impact:
  source: "Parallax Spin2 Documentation v55, Timing Methods (the WAITUS row: \"uses CLKFREQ\")"
  what_scales: "WAITUS converts its argument through CLKFREQ, so the ceiling in microseconds moves with the clock."
  waitx_in_clocks: "WAITX takes its delay directly in clocks, with no CLKFREQ conversion."

see_also:
  - "language/spin2/methods/waitms.yaml"
  - "language/spin2/methods/waitct.yaml"
  - "language/spin2/methods/getct.yaml"
  - "language/pasm2/waitx.yaml"