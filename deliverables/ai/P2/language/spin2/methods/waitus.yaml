# Spin2 Method: WAITUS
# Source: Parallax Spin2 Documentation v55, Timing Methods table
# Purpose: Delay execution for specified microseconds

method: "WAITUS"
category: "timing"
type: "method"
description: |
  Delay execution for a specified number of microseconds.
  Provides microsecond-resolution timing delay that automatically accounts for system clock frequency.
  More precise than WAITMS for short delays.

syntax: "WAITUS(Microseconds)"

parameters:
  - name: "Microseconds"
    type: "long"
    description: |
      Number of microseconds to delay. The bound the source states is in CLOCKS,
      not microseconds: "Wait Microseconds, uses CLKFREQ, duration must not
      exceed $8000_0000 clocks." The microsecond ceiling therefore scales with
      CLKFREQ -- see the `limitations` block below.
      Can be a constant, variable, or expression.
      Value is treated as unsigned.

returns: "none"

timing:
  execution_model: |
    Spin2 methods execute via the bytecode interpreter. Clock count: not documented.


examples:
  - code: "WAITUS(10)"
    description: "Delay for 10 microseconds"
    
  - code: |
      ' Generate 50% duty cycle square wave
      REPEAT
        PINHIGH(0)
        WAITUS(10)
        PINLOW(0)
        WAITUS(10)
    description: "50kHz square wave (20µs period)"
    
  - code: |
      ' Pulse width generation
      PUB pulse(pin, width_us)
        PINHIGH(pin)
        WAITUS(width_us)
        PINLOW(pin)
    description: "Generate precise pulse width"
    
  - code: |
      ' Bit-banged serial timing
      PUB send_bit(value)
        PINWRITE(TX_PIN, value)
        WAITUS(104)  ' 9600 baud bit time
    description: "Serial bit timing at 9600 baud"
    
  - code: |
      ' I2C clock stretching
      PINHIGH(SCL)
      WAITUS(5)  ' Setup time
      data := PINREAD(SDA)
      WAITUS(5)  ' Hold time
      PINLOW(SCL)
    description: "I2C timing compliance"

underlying_implementation:
  description: |
    NOT a WAITX. The interpreter reads the system counter, computes
    (CLKFREQ/1_000_000) * microseconds, ADDS the current counter to make an ABSOLUTE
    TARGET, and then waits the way WAITCT does - looping while the MSB of
    (CT - target) is set.
    The $8000_0000-clock bound: see limitations.past_the_bound.
    Automatically adjusts for system clock frequency.
    At lower frequencies, resolution degrades.
  related_pasm: "language/pasm2/waitx.yaml"

common_uses:
  - "Pulse width generation"
  - "Bit-banged communication protocols"
  - "Sensor timing requirements"
  - "Setup and hold times"
  - "Servo control pulses"
  - "Ultrasonic sensor timing"
  - "Fine-grained delays"

related_methods:
  - "WAITMS"
  - "WAITCT"
  - "GETCT"
  - "POLLCT"

notes:
  source: "Parallax Spin2 Documentation v55, Timing Methods (the WAITUS row); choosing_between_waits: the WAITMS and WAITCT rows of the same table"
  v55_definition: "WAITUS(Microseconds) -- Wait Microseconds, uses CLKFREQ, duration must not exceed $8000_0000 clocks."
  choosing_between_waits:
    - "For millisecond-scale delays use WAITMS(Milliseconds) -- same $8000_0000-clock bound."
    - "For cycle-accurate delays use WAITCT(Tick) -- Wait for system counter to get past 'Tick'."
  blocking: "The cog is stopped in the wait for its duration."

limitations:
  source: "Parallax Spin2 Language Documentation v55, Timing Methods; Parallax Spin2 interpreter v55 (WAITMS/WAITUS compute an absolute target and wait in the WAITCT loop)"
  hard_bound: "duration must not exceed $8000_0000 clocks"
  ceiling_formula: "max Microseconds = $8000_0000 / (CLKFREQ / 1_000_000)"
  past_the_bound: |
    The bound is $8000_0000 clocks. The call computes an absolute counter target from
    the duration and waits for it as WAITCT does; what a call past the bound does is
    not documented. Keep every call within the bound.
  resolution: "1 µs -- the argument's unit"

clock_frequency_impact:
  source: "Parallax Spin2 Documentation v55, Timing Methods (the WAITUS row: \"uses CLKFREQ\")"
  what_scales: "WAITUS converts its argument through CLKFREQ, so both the granularity and the ceiling move with the clock."
  clocks_per_microsecond: "CLKFREQ / 1_000_000"
  granularity_floor: "At a clock below 1 MHz, one microsecond is less than one clock and WAITUS cannot resolve its own unit."
  when_to_use_waitx_instead: "For a delay expressed directly in clocks -- the form the Parallax sources themselves emit during boot, e.g. WAITX ##20_000_000/100 -- use WAITX and skip the CLKFREQ conversion."

see_also:
  - "language/spin2/methods/waitms.yaml"
  - "language/spin2/methods/waitct.yaml"
  - "language/spin2/methods/getct.yaml"
  - "language/pasm2/waitx.yaml"