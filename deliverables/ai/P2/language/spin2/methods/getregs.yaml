method: GETREGS
type: method
description: |
  Copy cog registers to hub RAM
category: Miscellaneous
syntax: "GETREGS(HubAddress, CogAddress, Count)"
parameters:
  - name: "HubAddress"
    type: "address"
    description: "Hub RAM destination address"
  - name: "CogAddress"
    type: "integer"
    description: "Starting cog register address (0-511)"
  - name: "Count"
    type: "integer"
    description: "Number of longs to copy"
returns:
  type: "void"
  description: "No return value"
examples:
  - code: |
      ' Save the general-purpose registers PR0..PR7 ($1D8..$1DF)
      VAR
        LONG saved_regs[8]

      PUB save_regs()
        GETREGS(@saved_regs, $1D8, 8)
    description: "Save cog register state"
  - code: |
      ' Debug cog registers
      VAR
        LONG cog_dump[512]

      PUB dump_cog()
        GETREGS(@cog_dump, 0, 512)  ' Dump entire cog
    description: "Complete cog memory dump"
  - code: |
      ' Read PASM variables
      VAR
        LONG pasm_vars[10]

      PUB read_pasm_vars()
        GETREGS(@pasm_vars, $100, 10)  ' Get PASM data
    description: "Read PASM variables from cog"
notes:
  - "Copies from cog RAM to hub RAM"
  - "Cog addresses are 0-511 (2KB)"
  - "Each register is 32 bits (1 long)"
  - "Useful for debugging PASM code"
  - "Can read interpreter registers (reading is harmless; do not write them back with SETREGS: $1F0..$1FF includes PTRA, the Spin2 stack pointer)"
  - "Count must not exceed remaining registers"
timing:
  execution_model: |
    Spin2 methods execute via the bytecode interpreter. Clock count: not documented.

related:
  - SETREGS
  - REGLOAD
  - REGEXEC
see_also:
  - "Cog memory access"
  - "Register debugging"
  - "PASM interaction"
