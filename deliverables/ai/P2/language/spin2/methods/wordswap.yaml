method: WORDSWAP
type: method
category: Memory Operations

requires_version: "Spin2_v45"
version_directive: "{Spin2_v45}"

description: |
  Swap Count words of data between the ranges starting at AddrA and AddrB.
  REQUIRES: {Spin2_v45} or later version directive at start of source file.
syntax: "WORDSWAP(AddrA, AddrB, Count)"
parameters:
  - name: "AddrA"
    type: "address"
    description: "Hub RAM address of the first word range"
  - name: "AddrB"
    type: "address"
    description: "Hub RAM address of the second word range"
  - name: "Count"
    type: "integer"
    description: "Number of words to swap (in elements: one element is one word)"
returns:
  type: "void"
  description: "No return value"
examples:
  - code: |
      ' Swap two word values
      WORDSWAP(@value1, @value2, 1)
    description: "Exchange word values between variables"
  - code: |
      ' Reverse word order in array
      repeat i from 0 to size/2-1
        WORDSWAP(@array[i], @array[size-1-i], 1)
    description: "Reverse array using word swapping"
  - code: |
      ' Swap two words
      WORDSWAP(@data[0], @data[1], 1)
    description: "Swap two adjacent words (for the bytes within a word, see ENDIANW)"
notes:
  - "No temporary variable needed for swap"
  - "Each word is 2 bytes"
timing:
  execution_model: |
    Spin2 methods execute via the bytecode interpreter. The interpreter is
    engineered to run at minimum cost. We do not publish a clock count for
    this method because we do not have a verifiable measurement (no clean
    single-PASM-instruction backing to cite).

related:
  - BYTESWAP
  - LONGSWAP
  - WORDMOVE
see_also:
  - "Memory operations"
  - "Data manipulation"
  - "Endian conversion"
