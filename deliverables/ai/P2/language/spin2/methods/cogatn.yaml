# Spin2 Method: COGATN
# Source: Spin2 documentation
# Purpose: Signal attention to other cogs

method: "COGATN"
category: "cog_management"
type: "method"
description: |
  Strobe the attention signal to one or more cogs.
  Sets attention flags that can be polled or waited on by target cogs.
  Provides fast inter-cog signaling without using hub RAM.
  Essential for event notification and synchronization.

syntax: "COGATN(CogMask)"

parameters:
  - name: "CogMask"
    type: "long"
    description: |
      16-bit value in which bits 0..15 represent cogs 0..15:
      - Each set bit strobes the corresponding cog
      - Can signal multiple cogs simultaneously
      - Use (1 << cog_num) to signal specific cog
      - The issuing cog may set its own bit (see self_attention)

returns: "none"

timing:
  execution_model: |
    Spin2 methods execute via the bytecode interpreter. The interpreter is
    engineered to run at minimum cost. We do not publish a clock count for
    the method-call path because we do not have a verifiable measurement.
  underlying_pasm: "COGATN"
  underlying_pasm_timing: "2 clocks (fixed)"


examples:
  - code: |
      ' Signal cog 3
      COGATN(1 << 3)
    description: "Signal single cog"
    
  - code: |
      ' Signal cogs 0, 2, and 4
      COGATN(%00010101)
    description: "Signal multiple cogs"
    
  - code: |
      ' Broadcast to all other cogs
      COGATN($FF ^ (1 << COGID()))
    description: "Signal all cogs except self"
    
  - code: |
      VAR
        LONG worker_cogs
        
      PUB signal_workers()
        ' Signal all registered workers
        COGATN(worker_cogs)
        
      PUB register_worker()
        worker_cogs |= (1 << COGID())
    description: "Dynamic cog group signaling"
    
  - code: |
      ' Producer-consumer pattern
      PUB producer()
        REPEAT
          produce_data()
          COGATN(1 << consumer_cog)  ' Data ready
          
      PUB consumer()
        REPEAT
          WAITATN()  ' Wait for signal
          process_data()
    description: "Producer-consumer synchronization"

signal_mechanism:
  hardware: "Dedicated attention network between cogs: the 16 attention strobe outputs from all cogs are OR'd together into a composite set of 16 strobes, from which each cog receives its own"
  persistence: "Signal is a strobe that causes an attention event, tracked until polled or waited for"
  clearing: "The event flag is cleared when polled (POLLATN)"

self_attention:
  behavior: "COGATN(1 << COGID()) delivers the strobe to the issuing cog: its own attention event is raised, exactly as when another cog strobes it"
  verified_against: "EF-099"

common_uses:
  - "Event notification"
  - "Work ready signals"
  - "Synchronization barriers"
  - "Interrupt simulation"
  - "Wake sleeping cogs"
  - "Broadcast communications"

receiving_methods:
  polling: |
    IF POLLATN()
      ' Attention was signaled
      
  waiting: |
    WAITATN()  ' Block until signaled
    
  pasm: |
    POLLATN WC  ' Check and clear
    WAITATN     ' Wait for signal

related_methods:
  - "POLLATN"
  - "WAITATN"
  - "COGID"
  - "COGCHK"

synchronization_patterns:
  - pattern: "Barrier synchronization"
    code: |
      VAR
        BYTE ready_count
        
      PUB barrier()
        ready_count++
        IF ready_count == 8
          COGATN($FF)  ' Release all
          ready_count := 0
        ELSE
          WAITATN()    ' Wait for release
  
  - pattern: "Request-response"
    code: |
      PUB request_service(cog)
        COGATN(1 << cog)
        WAITATN()  ' Wait for completion signal
  
  - pattern: "Round-robin scheduling"
    code: |
      PUB scheduler() | cog
        REPEAT cog FROM 0 TO 7
          COGATN(1 << cog)  ' Give time slice
          WAITMS(10)

notes:
  - "A cog can signal itself: its own bit in the mask raises its own attention event (see self_attention)"
  - "No payload - just a signal"
  - "Target cog must be running to receive"
  - "More efficient than hub RAM polling"

best_practices:
  - "Use for time-critical signaling"
  - "Combine with hub RAM for data passing"
  - "Clear attention before waiting again"
  - "Document signal meanings clearly"
  - "Use masks for group operations"

limitations:
  - "No data payload"
  - "Single bit per cog - no message types"
  - "No built-in acknowledgment"

see_also:
  - "language/spin2/methods/pollatn.yaml"
  - "language/spin2/methods/waitatn.yaml"
  - "language/pasm2/cogatn.yaml"
  - "architecture/cog_attention.yaml"