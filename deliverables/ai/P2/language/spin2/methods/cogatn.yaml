# Spin2 Method: COGATN
# Purpose: Signal attention to other cogs

method: "COGATN"
category: "cog_management"
type: "method"
description: |
  Strobe the attention signal to one or more cogs.
  Each strobed cog sees an attention event for POLLATN/WAITATN and interrupt use.
source: "Parallax Propeller 2 Spin2 Language Documentation v55, Cog Methods (COGATN(CogMask): strobe ATN input(s) of cog(s) according to 16-bit CogMask); Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), COG ATTENTION (the D operand's bits 0..15 represent cogs 0..15); Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, Cog Attention, p.22 (the D operand's lower 8 bits)"

syntax: "COGATN(CogMask)"

parameters:
  - name: "CogMask"
    type: "long"
    description: |
      16-bit value in which bits 0..15 represent cogs 0..15:
      - Each set bit strobes the corresponding cog
      - More than one bit can be set
      - The issuing cog may set its own bit (see self_attention)
      Parallax's documents also give the lower 8 bits of the value as the cog bits.

returns: "none"

timing:
  execution_model: |
    Spin2 methods execute via the bytecode interpreter. Method-call clock count: not documented.
  underlying_pasm: "COGATN"
  underlying_pasm_timing: "2 clocks (fixed)"


examples:
  - code: |
      ' Signal cog 3
      COGATN(1 << 3)
    description: "Signal single cog"

  - code: |
      ' Signal cogs 0, 2, and 4
      COGATN(%00010101)
    description: "Signal multiple cogs"

  - code: |
      ' Signal cogs 0..7 except the issuing cog
      COGATN($FF ^ (1 << COGID()))
    description: "Signal all cogs except self"

  - code: |
      VAR
        LONG worker_cogs

      PUB signal_workers()
        ' Signal every cog whose bit is set in worker_cogs
        COGATN(worker_cogs)

      PUB register_worker()
        worker_cogs |= (1 << COGID())
    description: "Signal the cogs recorded in a mask"

  - code: |
      ' One cog strobes another, which waits for the strobe
      PUB producer()
        REPEAT
          produce_data()
          COGATN(1 << consumer_cog)

      PUB consumer()
        REPEAT
          WAITATN()
          process_data()
    description: "A strobe from one cog and a wait in another"

signal_mechanism:
  hardware: "The 16 attention strobe outputs from all cogs are OR'd together to form a composite set of 16 strobes, from which each cog receives its particular strobe"
  clearing: "POLLATN and WAITATN clear the attention event flag"
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), COG ATTENTION (the OR'd strobes; the event flag is also cleared on POLLATN/WAITATN/JATN/JNATN, Events); P2 Instructions v35 Rev B/C Silicon, POLLATN row (get ATN event flag into C/Z, then clear it)"

self_attention:
  behavior: "COGATN(1 << COGID()) delivers the strobe to the issuing cog: its own attention event is raised, exactly as when another cog strobes it"
  source: "EF-099 (event flag only, one board, cog execution; the attention interrupt path was not tested)"

receiving_methods:
  polling: |
    IF POLLATN()
      ' Attention was signaled

  waiting: |
    WAITATN()  ' Block until signaled

  pasm: |
    POLLATN WC  ' Check and clear
    WAITATN     ' Wait for signal

related_methods:
  - "POLLATN"
  - "WAITATN"
  - "COGID"
  - "COGCHK"

notes:
  - "A cog can signal itself: its own bit in the mask raises its own attention event (see self_attention)"

see_also:
  - "language/spin2/methods/pollatn.yaml"
  - "language/spin2/methods/waitatn.yaml"
  - "language/pasm2/cogatn.yaml"
  - "architecture/cog_attention.yaml"
