# Spin2 Method: WRPIN
# Source: Spin2 v51 documentation
# Purpose: Configure smart pin mode

method: "WRPIN"
category: "smart_pin_operations"
type: "method"
description: |
  Write the mode configuration register of one or more smart pins.
  Sets up the smart pin operating mode, input sources, and output options.
  This is the primary method for configuring smart pin functionality.

syntax: "WRPIN(PinField, Mode)"

parameters:
  - name: "PinField"
    type: "pin_field"
    description: |
      Specifies which pin(s) to configure. Can be:
      - Single pin number (0-63)
      - Pin range using '..' operator (Bottom..Top)
      - Multiple pins using ADDPINS operator
      - Variable or expression that evaluates to a pin field
      
  - name: "Mode"
    type: "long"
    description: |
      32-bit mode configuration value: %AAAA_BBBB_FFF_MMMMMMMMMMMMM_TT_SSSSS_0
      - Bits 31:28 (AAAA): A input selector (4 bits)
      - Bits 27:24 (BBBB): B input selector (4 bits)
      - Bits 23:21 (FFF): Input logic/filtering (3 bits)
      - Bits 20:8 (M): Low-level pin control - drive strength, DAC, ADC (13 bits)
      - Bits 7:6 (TT): Pin DIR/OUT control (2 bits) - see tt_field below
      - Bits 5:1 (SSSSS): Smart pin mode selector (5 bits, 32 modes)
      - Bit 0: Always 0

returns: "none"

tt_field:
  bits: "7:6"
  purpose: "Pin DIR/OUT control"
  constants_reference: "architecture/smart_pins.yaml
    (configuration_format.fields.tt.constants) -- P_TT_00, P_TT_01, P_TT_10 and P_TT_11
    with their values, binaries and the P_OE / P_CHANNEL / P_BITDAC aliases. The
    per-constant definitions are in
    language/spin2/symbols/spin2-builtin-symbols-complete.yaml. Defined once, in those
    two places, and pointed at from here."
  context_dependent: |
    %TT DOES NOT HAVE ONE MEANING. The Silicon Doc specifies four meaning-sets, selected by
    whether the smart pin is on (%SSSSS) and whether DAC_MODE (M[12:10] = %101) is active.
    The per-constant effects at the pointer above are the SMART-PIN-ON, non-DAC_MODE meanings only.
    The four contexts:
      1. smart pin OFF, non-DAC_MODE  - DIR enables output; %0x = OUT drives, %1x = OTHER drives
      2. smart pin OFF, DAC_MODE      - %00 OUT enables ADC + M[7:0] sets the DAC level;
                                        %01 OUT enables ADC + M[3:0] selects a COG DAC CHANNEL;
                                        %10 OUT drives BIT_DAC; %11 OTHER drives BIT_DAC
      3. smart pin ON, non-DAC modes  - x0/x1 = output disabled/enabled regardless of DIR;
                                        0x/1x = SMART/OUT or SMART/OTHER drives
      4. smart pin ON, DAC modes (%00001..%00011) - enable bit as above;
                                        0x = OUT enables ADC, 1x = OTHER enables ADC
    Full table: architecture/smart_pins.yaml (configuration_format.fields.tt.behavior_by_context).
    Source: Silicon Doc silicon-doc-text.txt:3790, part4-locks.txt:118-139.
  when_smart_pin_on: "x0=output disabled, x1=output enabled (regardless of DIR)"
  source_selection: "0x=SMART/OUT drives, 1x=SMART/OTHER drives"
  p_oe_required_for: "SMART-PIN output modes only (NCO, PWM, Pulse, Transition, Serial TX, the smart-pin DAC modes %00001-%00011, USB). NOT the non-smart-pin (cog) DAC: with the smart pin off in DAC_MODE, the same bit is named P_CHANNEL and it SWITCHES THE DAC'S SOURCE from the pin's own level field to a cog DAC channel. Adding P_OE/P_CHANNEL to a level-driven DAC kills its output."
  one_bit_three_names: "P_TT_01, P_OE and P_CHANNEL are the SAME bit-field value ($40, %01) under three context names - not three features, and not additive. Compose mode constants with `|`, never `+`; see architecture/smart_pins.yaml (configuration_format.composition_rule)."
  see_also: "architecture/smart_pins.yaml for full TT behavioral specification"

examples:
  - code: |
      ' Configure pin for UART TX (async serial)
      mode := %0000_0000_000_0000000000000_01_00111
      WRPIN(30, mode)
    description: "Setup UART transmit mode"
    
  - code: |
      ' Configure for PWM output
      mode := %0000_0000_000_0000000000000_01_01001
      WRPIN(56, mode)
    description: "Setup PWM mode"
    
  - code: |
      ' Configure quadrature encoder
      mode := %0000_0001_000_0000000000000_00_01011
      WRPIN(0, mode)
    description: "Setup quadrature decoder"
    
  - code: |
      ' Configure ADC mode
      mode := %0000_0000_000_0000000000000_11_10011
      WRPIN(pin, mode)
    description: "Setup ADC conversion mode"
    
  - code: |
      ' Reset to normal I/O
      WRPIN(pin, 0)
    description: "Disable smart pin mode"

common_smart_modes:
  # Removed 2026-08-25. This block defined thirteen P_* constants a second time, in
  # wording that had drifted from the source (F-321/F-323 class). Every smart-pin mode
  # constant is now defined exactly once, with the Spin2 v55 wording, its 32-bit value
  # and its bit pattern.
  reference: "language/spin2/symbols/spin2-builtin-symbols-complete.yaml -- all 32
    %SSSSS mode constants (subcategory operating_modes), each with its value, bit
    pattern and the source's own wording"
  mode_selector_field: "architecture/smart_pins.yaml
    (configuration_format.fields.sssss) -- the 5-bit field itself"

smart_pin_workflow:
  1_configure: "WRPIN(pin, mode) - Set mode"
  2_set_x: "WXPIN(pin, x_value) - Set timing/config"
  3_set_y: "WYPIN(pin, y_value) - Set data/count"
  4_enable: "DIRH(pin) - Enable smart pin"
  5_operate: "Use RDPIN/RQPIN to read results"

common_uses:
  - "UART serial communication"
  - "PWM generation"
  - "Frequency synthesis"
  - "Quadrature encoder reading"
  - "ADC/DAC operations"
  - "Pulse measurement"
  - "Protocol generation"

related_methods:
