method: ROTXY
type: method
description: |
  Rotate X,Y coordinates by specified angle using CORDIC
category: Math/CORDIC Operations
syntax: "X2, Y2 := ROTXY(X, Y, Angle)"
parameters:
  - name: "X"
    type: "long"
    description: "X coordinate to rotate (32-bit signed)"
  - name: "Y"
    type: "long"
    description: "Y coordinate to rotate (32-bit signed)"
  - name: "Angle"
    type: "long"
    description: "Rotation angle in P2 angle units (0..$FFFFFFFF = 0..360°)"
returns:
  type: "multiple"
  description: "Returns rotated X2 and Y2 coordinates"
examples:
  - code: |
      ' Rotate point 45 degrees
      x2, y2 := ROTXY(100, 0, $2000_0000)  ' 45° = $20000000
      ' Result: x2 ≈ 71, y2 ≈ 71
    description: "Rotate point by 45 degrees"
  - code: |
      ' Animate rotating point
      angle := 0
      repeat
        x2, y2 := ROTXY(radius, 0, angle)
        plot(center_x + x2, center_y + y2)
        angle += $0100_0000  ' Increment angle
    description: "Animate point rotating around origin"
  - code: |
      ' Rotate sprite vertices
      repeat i from 0 to num_vertices-1
        vx[i], vy[i] := ROTXY(vx[i], vy[i], rotation)
    description: "Rotate all vertices of a shape"
notes:
  - "Uses P2's hardware CORDIC engine"
  - "Angle units: $0000_0000 = 0°, $4000_0000 = 90°, $8000_0000 = 180°, $C000_0000 = 270°"
  - "Full 32-bit precision maintained"
  - "Handles all quadrants correctly"
  - "Results are NOT scaled by the CORDIC gain: the P2 32-bit CORDIC solver applies scale-factor correction (Silicon Doc line 425: '32-bit, pipelined CORDIC solver with scale-factor correction'). The ~1.646 CORDIC gain applies only to the streamer's separate 5-stage modulator CORDIC, not to QROTATE-based solver operations like this one."
timing:
  description: "Uses the CORDIC solver. The underlying CORDIC latency is a hardware property of the engine; the total Spin2-method time also includes interpreter overhead and is not separately specified here."
  see: "language/spin2/concepts/cordic_solver.yaml for the underlying CORDIC engine."
related:
  - POLXY
  - XYPOL
  - QSIN
  - QCOS
related_concepts:
  - language/spin2/concepts/cordic_solver.yaml
see_also:
  - "CORDIC operations"
  - "Coordinate rotation"
  - "2D graphics"
