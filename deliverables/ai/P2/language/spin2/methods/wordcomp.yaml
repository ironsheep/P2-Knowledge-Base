method: WORDCOMP
type: method
category: Memory Operations

requires_version: Spin2_v45
version_directive: '{Spin2_v45}'

description: |
  Compare Count words of data starting at Address1 and Address2; return -1
  (TRUE) if they match, 0 (FALSE) if they differ.
  REQUIRES: {Spin2_v45} or later version directive at start of source file.
syntax: result := WORDCOMP(Address1, Address2, Count)
parameters:
- name: Address1
  type: address
  description: First hub RAM address for comparison (word-aligned)
- name: Address2
  type: address
  description: Second hub RAM address for comparison (word-aligned)
- name: Count
  type: integer
  description: Number of words to compare
returns:
  type: integer
  description: TRUE (-1) if all words match, FALSE (0) if any words differ
examples:
- code: "' Compare two word arrays\nif WORDCOMP(@array1, @array2, 100)\n  ' Arrays\
    \ match (100 words)\n"
  description: Compare word arrays
- code: "' Verify sensor data\nif WORDCOMP(@readings, @expected, 64)\n  ' All 64 sensor\
    \ readings match expected\n"
  description: Verify 16-bit sensor data
- code: "' Check for word pattern\nif WORDCOMP(@data[i], @signature, 4)\n  ' Found\
    \ 4-word signature at position i\n"
  description: Search for word pattern in data
notes:
- Returns TRUE (-1) if all words match
- Returns FALSE (0) if any word differs
- Count of 0 returns 0 (FALSE), not TRUE
- Each word is 16 bits (2 bytes)
timing:
  execution_model: |
    Spin2 methods execute via the bytecode interpreter. The interpreter is
    engineered to run at minimum cost. We do not publish a clock count for
    this method because we do not have a verifiable measurement (no clean
    single-PASM-instruction backing to cite).

related:
- BYTECOMP
- LONGCOMP
- WORDMOVE
see_also:
- Memory comparison
- Array operations
- Pattern matching
