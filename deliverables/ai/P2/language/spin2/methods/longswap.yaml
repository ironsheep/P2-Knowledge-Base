method: LONGSWAP
type: method
category: Memory Operations

requires_version: "Spin2_v45"
version_directive: "{Spin2_v45}"

description: |
  Swap Count longs of data between the ranges starting at AddrA and AddrB.
  REQUIRES: {Spin2_v45} or later version directive at start of source file.
syntax: "LONGSWAP(AddrA, AddrB, Count)"
parameters:
  - name: "AddrA"
    type: "address"
    description: "Hub RAM address of the first long range"
  - name: "AddrB"
    type: "address"
    description: "Hub RAM address of the second long range"
  - name: "Count"
    type: "integer"
    description: "Number of longs to swap (in elements: one element is one long)"
returns:
  type: "void"
  description: "No return value"
examples:
  - code: |
      ' Swap two long values
      LONGSWAP(@value1, @value2, 1)
    description: "Exchange long values between variables"
  - code: |
      ' Reverse long order in array
      repeat i from 0 to size/2-1
        LONGSWAP(@array[i], @array[size-1-i], 1)
    description: "Reverse array using long swapping"
  - code: |
      ' Swap two variables
      LONGSWAP(@reg_a, @reg_b, 1)
    description: "Exchange two 32-bit values"
notes:
  - "No temporary variable needed for swap"
  - "Each long is 4 bytes"
sources:
  - "requires_version: CP-011 ({Spin2_v44} is refused by the compiler; {Spin2_v45} is the earliest gate that enables the method)"
timing:
  execution_model: |
    Spin2 methods execute via the bytecode interpreter. Clock count: not documented.

related:
  - BYTESWAP
  - WORDSWAP
  - LONGMOVE
see_also:
  - "Memory operations"
  - "Data manipulation"
  - "Register operations"
