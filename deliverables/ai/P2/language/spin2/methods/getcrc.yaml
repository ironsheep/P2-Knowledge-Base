method: GETCRC
type: method
description: |
  Compute a CRC of Count bytes starting at DataAddress using a custom
  polynomial of up to 32 bits.
category: Miscellaneous
syntax: "crc := GETCRC(DataAddress, Polynomial, Count)"
parameters:
  - name: "DataAddress"
    type: "address"
    description: "Address of data to calculate CRC for"
  - name: "Polynomial"
    type: "long"
    description: "CRC polynomial to use (up to 32 bits)"
  - name: "Count"
    type: "integer"
    description: "Number of bytes to process"
returns:
  type: "long"
  description: "Calculated CRC value"
examples:
  - code: |
      ' Calculate a 32-bit CRC
      crc32 := GETCRC(@data, $EDB88320, size)
    description: "Calculate a CRC with the 32-bit polynomial $EDB88320"
  - code: |
      ' Verify data integrity
      calculated := GETCRC(@packet, polynomial, packet_size)
      if calculated == expected_crc
        ' Data is valid
    description: "Verify data with CRC"
notes:
  - "Processes byte by byte, two CRCNIB steps per byte"
  - "The CRC starts from all ones across the polynomial's width (the highest set bit of the polynomial and every bit below it)"
  - "A Count of 0 returns that starting value"
timing:
  execution_model: |
    Spin2 methods execute via the bytecode interpreter. The interpreter is
    engineered to run at minimum cost. We do not publish a clock count for
    this method because we do not have a verifiable measurement (no clean
    single-PASM-instruction backing to cite).

related:
  - BYTEMOVE
  - STRCOMP
see_also:
  - "CRC calculation"
  - "Data integrity"
  - "Error detection"
