method: TASKSPIN
type: method
category: Task Operations

requires_version: "Spin2_v47"
version_directive: "{Spin2_v47}"

description: |
  Start a new Spin2 task within the current cog. Tasks enable cooperative 
  multitasking where multiple execution contexts share the same cog but have 
  independent stacks and program counters.
  REQUIRES: {Spin2_v47} or later version directive at start of source file.
syntax: "TASKSPIN(TaskID, Method({Parameters}), StackAddress)"
parameters:
  - name: "TaskID"
    type: "integer"
    description: "Task ID (0-31) or NEWTASK (-1) for next available"
  - name: "Method"
    type: "method"
    description: "Spin2 method to run as task with optional parameters"
  - name: "StackAddress"
    type: "address"
    description: "Address of stack space for the task"
returns:
  type: "void"
  description: "No return value"
examples:
  - code: |
      {Spin2_v47}                              ' REQUIRED directive
      VAR
        LONG task_stack[64]
      
      PUB main()
        TASKSPIN(NEWTASK, background_process(), @task_stack)
        repeat
          main_work()
          TASKNEXT()
    description: "Start background task"
  - code: |
      {Spin2_v47}                              ' REQUIRED directive
      VAR
        LONG sensor_stack[64]
      
      PUB main()
        TASKSPIN(2, sensor_monitor(16, 1000), @sensor_stack)
    description: "Start task with specific ID"
  - code: |
      {Spin2_v47}                              ' REQUIRED directive
      VAR
        LONG stack1[64], stack2[64], stack3[64]
      
      PUB main()
        TASKSPIN(NEWTASK, task1(), @stack1)
        TASKSPIN(NEWTASK, task2(), @stack2)
        TASKSPIN(NEWTASK, task3(), @stack3)
    description: "Start multiple tasks"
notes:
  - "REQUIRES {Spin2_v47} or later at start of source file"
  - "Up to 32 tasks per cog (IDs 0-31)"
  - "Tasks share cog but have separate stacks"
  - "Cooperative multitasking within cog"
  - "NEWTASK (-1) auto-assigns next available ID"
  - "Stack size depends on task complexity"
  - "Tasks run in round-robin fashion"
timing:
  execution_model: |
    Spin2 methods execute via the bytecode interpreter. The interpreter is
    engineered to run at minimum cost. We do not publish a clock count for
    this method because we do not have a verifiable measurement (no clean
    single-PASM-instruction backing to cite).

related:
  - TASKSTOP
  - TASKHALT
  - TASKRESUME
  - TASKCHK
see_also:
  - "Cooperative multitasking"
  - "Task management"
  - "Stack allocation"