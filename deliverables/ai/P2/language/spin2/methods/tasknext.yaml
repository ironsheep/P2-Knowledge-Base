method: TASKNEXT
type: method
category: Task Operations

requires_version: "Spin2_v47"
version_directive: "{Spin2_v47}"

description: |
  Yield control to the next task in round-robin schedule. This is the primary 
  mechanism for cooperative multitasking - tasks must call TASKNEXT() to allow 
  other tasks to run.
  REQUIRES: {Spin2_v47} or later version directive at start of source file.
syntax: "TASKNEXT()"
parameters: []
returns:
  type: "void"
  description: "No return value"
examples:
  - code: |
      {Spin2_v47}                              ' REQUIRED directive
      PRI worker_task()
        repeat
          do_work_chunk()
          TASKNEXT()                           ' Let other tasks run
    description: "Yield after work chunk"
  - code: |
      {Spin2_v47}                              ' REQUIRED directive
      PRI poller_task()
        repeat
          if data_ready
            process_data()
          TASKNEXT()                           ' Don't hog CPU
    description: "Polling with cooperation"
  - code: |
      {Spin2_v47}                              ' REQUIRED directive
      PRI compute_task() | i
        repeat i from 0 to 1000
          calculate_step(i)
          if i // 10 == 0
            TASKNEXT()                         ' Yield every 10 iterations
    description: "Periodic yielding in long loop"
notes:
  - "REQUIRES {Spin2_v47} or later at start of source file"
  - "Voluntary context switch"
  - "Essential for cooperative multitasking"
  - "Current task pauses, next task runs"
  - "Returns when task gets control again"
  - "Essential for task cooperation"
  - "Prevents task starvation"
timing:
  description: "Context switch time"
  cycles: "~20-40 clock cycles"
related:
  - TASKWAIT
  - TASKSPIN
  - TASKHALT
see_also:
  - "Cooperative multitasking"
  - "Task scheduling"
  - "Context switching"