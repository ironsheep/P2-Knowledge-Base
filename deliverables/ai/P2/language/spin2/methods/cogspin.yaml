# Spin2 Method: COGSPIN
# Source: Parallax Propeller 2 Spin2 Language Documentation v55, Built-In Symbol for COGSPIN() Usage
# Purpose: Start Spin2 method in a cog

method: "COGSPIN"
category: "cog_management"
type: "method"
description: |
  Start a Spin2 method in a specified or available cog.
  Loads the Spin2 interpreter into the cog and begins executing the specified method.
  Returns the cog number that was started; see returns for the value with no cog free.

syntax: "COGSPIN(CogNum, Method({Parameters}), StackAddress) : CogID"

parameters:
  - name: "CogNum"
    type: "long"
    description: |
      Cog number to start:
      - 0-7: Start specific cog (restarts it if running)
      - NEWCOG (%01_0000): Start any available cog; the only symbol the
        COGSPIN table defines

      CogNum = -1: see cognum_minus_one below.
    source: "Parallax Propeller 2 Spin2 Language Documentation v55, Built-In Symbol for COGSPIN() Usage (NEWCOG = %01_0000 is the only symbol listed; -1 is NEWTASK, TASKSPIN's symbol); Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), STARTING AND STOPPING COGS (COGINIT D operand); Parallax Spin2 Interpreter v55 (2026.05.07), cogspin_ (ORs in %10_0000, then the COGINIT bytecode routine: setq w, then coginit x,y wc with the popped CogNum in x)"
    cognum_minus_one: >-
      The interpreter ORs %10_0000 into CogNum and passes it as the D operand of the
      COGINIT instruction with no masking, so -1 is D = $FFFF_FFFF and D[5:0] = %111111.
      D[5] = 1 means no load, with execution beginning at the address given. D[4] = 1
      with D[0] = 1 starts a free even/odd pair of cogs and writes the even/lower cog's
      ID.


  - name: "Method({Parameters})"
    type: "method_call"
    description: |
      Spin2 method to execute with optional parameters.
      Method name followed by parameters in parentheses.
      Can be in current object or another object.
    source: "CP-057 (pnut-ts 1.55.10 compiles COGSPIN(NEWCOG, child.method(), @stack) with a child-object method; the compile only, no run)"

  - name: "StackAddress"
    type: "address"
    description: |
      Hub address of stack space for the new cog.
      @stack_array gives the address of a stack array.
      Stack size: see stack_requirements below.

returns:
  name: "CogID"
  type: "long"
  description: |
    - 0-7: Successfully started cog number
    - $8000_000F: no cog free, with NEWCOG used as an expression and all 8 cogs running. Bit 31 is set, so the long is negative: a test of the result with < 0 tells failure from a cog number, and a test with == -1 is false. Parallax's documents also give -1 for no cog free. Not established: whether a failed COGSPIN leaves its stack buffer unwritten.
  source: >-
    P2 hardware verification, EF-120 (COGSPIN(NEWCOG, ...) as an expression, all 8 cogs running; every call returned $8000_000F, with a control and a recovery start reading the cog ID).
    Parallax Spin2 Interpreter v55 (2026.05.07), COGINIT bytecode routine (setq w, coginit x,y wc, then bitc x,#31).
    Parallax Propeller 2 Spin2 Language Documentation v55, COGSPIN row (-1 = no cog free).

stack_requirements:
  size: >-
    Not documented: a stack size for COGSPIN.
  how_to_settle_it: >-
    application-notes/p2an006-sizing-cog-task-stacks.yaml describes a measurement of a
    stack's high-water mark with a fill pattern, and a checking object.
  factors:
    - "Method call depth"
    - "Local variable count"
    - "Parameter count"
    - "Expression complexity"
  source: "Not documented: a stack size, searched in Parallax Propeller 2 Spin2 Language Documentation v55 and Parallax Propeller 2 Documentation v35 (Rev B/C Silicon). The factors: Parallax Spin2 Interpreter v55 (2026.05.07), drophot (6 longs per nested call), returnh (7 longs popped on return), callgo (locals), pushv (expression pushes with PUSHA)"

top_level_stack:
  summary: >-
    Every Spin2 cog has a stack, including cog 0 running the top-level program, but only
    COGSPIN and TASKSPIN take a StackAddress. The top-level program's stack is placed by the
    compiler, grows upward, and has no documented size or limit.
  placement: >-
    The compiler supplies the stack's starting hub address (the initial dbase) in the
    program's start-up header. The interpreter's start-up block clears the VAR space,
    so the stack begins at the first long after VAR space. It then writes the initial pbase and vbase at that address and restarts
    cog 0 with COGINIT, passing that address as the new cog's PTRA.
  first_frame: >-
    The interpreter's launch routine reads pbase and vbase from the first two longs of the
    stack and writes a 6-long header there: pbase (with the trap flag), vbase, dbase,
    mrecv, msend, and the return pointer (the bytecodes that stop the task or cog when the
    top-level method returns). dbase is set 6 longs above the stack base; the method's
    parameters, results and locals start there. COGSPIN builds the same layout at its
    StackAddress: pbase and vbase at the address, parameters from 6 longs above it.
  growth: >-
    The stack grows upward, toward higher hub addresses: pushes are wrlong with ptra++
    and pops are rdlong with --ptra. Every nested call pushes 6 longs at its drop anchor
    (the caller's stack top, pbase with flags, vbase, dbase, mrecv, msend), plus one long
    for the return address (a return pops 7 longs), then the called method's parameters,
    results and local longs. The parameters hold the passed values; the results and the
    locals are cleared to zero.
  size_and_limit: >-
    Not documented: a size for the top-level stack or an upper bound for it. No
    stack-limit comparison is documented. How far the stack can grow before it reaches other hub data is
    set by what the compiler places above it, which is not documented either. A COGSPIN
    or TASKSPIN stack is a hub buffer you provide and size; see stack_requirements above
    and how to measure it in application-notes/p2an006-sizing-cog-task-stacks.yaml.
  source: "Parallax Spin2 Interpreter v55 (2026.05.07), start-up block (dbase_init, var_longs), launch_spin / launch_method, Drop anchor (drophot), callhot, returnh, build_stack (parameters copied from the caller), calloffh (results cleared) and callgo (locals cleared)"

stack_observability:
  description: >-
    A COGSPIN or TASKSPIN stack is an ordinary hub buffer, so any cog can read it. The
    stack pointer is PTRA, a register in the running cog's own RAM, so another cog cannot
    read it directly: a supervising cog sees how far a stack has been used (for example
    the high-water mark left in a fill pattern, as p2an006 measures) but not its current
    depth. A cog in its own debug ISR can trigger an asynchronous breakpoint in another
    cog with COGBRK, if that cog has its asynchronous breakpoint interrupt enabled; the
    target's debug ISR can then inspect its own registers.
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), OVERVIEW and COGS (each cog has its own RAM); DEBUG INTERRUPT (COGBRK)"

examples:
  - code: |
      VAR
        LONG stack[64]
        LONG cog_id

      PUB main()
        cog_id := COGSPIN(NEWCOG, worker(), @stack)
        IF cog_id < 0
          ' Failed to start
          
      PRI worker()
        REPEAT
          ' Do work in parallel
          PINTOGGLE(56)
          WAITMS(500)
    description: "Start worker method in new cog"
    
  - code: |
      VAR
        LONG stack1[64], stack2[64]
        LONG sensor_data
        
      PUB start_sensors()
        COGSPIN(NEWCOG, read_sensor(0, @sensor_data), @stack1)
        COGSPIN(NEWCOG, read_sensor(1, @sensor_data), @stack2)
        
      PRI read_sensor(pin, ptr)
        REPEAT
          LONG[ptr][pin] := read_adc(pin)
          WAITMS(10)
    description: "Multiple sensor readers with parameters"
    
  - code: |
      OBJ
        serial : "serial_driver"
        
      VAR
        LONG serial_stack[128]
        
      PUB init()
        ' Start serial driver in separate cog
        COGSPIN(NEWCOG, serial.rx_handler(), @serial_stack)
    description: "Start object method in new cog"
    
  - code: |
      VAR
        LONG cog_stacks[4 * 64]

      PUB parallel_process() | i
        REPEAT i FROM 0 TO 3
          COGSPIN(NEWCOG, process_chunk(i), @cog_stacks[i * 64])
    description: "Launch multiple parallel processors"

method_execution:
  interpreter: "Each started cog loads its own copy of the Spin2 interpreter code"
  variables:
    - "VAR variables are in hub RAM, which every cog can access"
    - "DAT section is in hub RAM, which every cog can access"

stack_array_example:
  indexed_stack_allocation:
    description: "One stack buffer in DAT, indexed per cog"
    code: |
      DAT
        stacks LONG 0[NUM_COGS * STACK_SIZE]
        
      PUB start_cogs() | i
        REPEAT i FROM 0 TO NUM_COGS-1
          COGSPIN(NEWCOG, worker(i), @stacks[i * STACK_SIZE])

related_methods:
  - "COGINIT"
  - "COGSTOP"
  - "COGID"
  - "COGCHK"
  - "LOCKNEW"
  - "LOCKTRY"
  - "LOCKREL"

notes:
  - "Method runs until it returns or cog is stopped. When the top-level method returns, the effect is TASKSTOP(-1): the task ends, and with no other task remaining the cog is stopped and freed."
  - "Each cog has its own method call stack, a hub buffer at its StackAddress"
  - "The return value when no cog is free is given under returns: $8000_000F with NEWCOG used as an expression, so test `< 0`, not `== -1`"
  - "Not documented: any stack overflow check"

related:
  - language/spin2/methods/taskspin.yaml
  - application-notes/p2an006-sizing-cog-task-stacks.yaml
  - architecture/debug_interrupt.yaml

see_also:
  - "language/spin2/methods/coginit.yaml"
  - "language/spin2/methods/cogstop.yaml"
  - "language/spin2/methods/locknew.yaml"
  - "language/spin2/constructs/method_definition.yaml"
