# Spin2 Method: COGSPIN
# Source: Spin2 v51 documentation, P2-FLASH-FS analysis
# Purpose: Start Spin2 method in a cog

method: "COGSPIN"
category: "cog_management"
type: "method"
description: |
  Start a Spin2 method in a specified or available cog.
  Loads the Spin2 interpreter into the cog and begins executing the specified method.
  Returns the cog number that was started, or -1 if no cog was available.
  Essential for parallel Spin2 execution.
documentation_source: enhanced
documentation_level: comprehensive

syntax: "COGSPIN(CogNum, Method({Parameters}), StackAddress) : CogID"

parameters:
  - name: "CogNum"
    type: "long"
    description: |
      Cog number to start:
      - 0-7: Start specific cog (will stop if running)
      - NEWCOG (%01_0000): Start any available cog -- the ONLY symbol the
        COGSPIN table defines

      DO NOT pass -1. It is not a synonym for NEWCOG -- see not_an_input below.
    # CORRECTED 2026-08-30 (F-390). This read "NEWCOG or -1: Start any available
    # cog". The two are not interchangeable and the difference costs a cog.
    source: >-
      Spin2 v55 Language Documentation, "Built-In Symbol for COGSPIN() Usage" --
      engineering/ingestion/sources/spin2-v55/spin2-v55-text.txt:1667-1669
      (NEWCOG = %01_0000 is the ONLY symbol listed); :1673 (-1 is NEWTASK,
      TASKSPIN's symbol). Spin2 v51 lists the same single value --
      engineering/ingestion/sources/spin2-v51/spin2-text.txt:12516-12520.
      P2 Documentation v35 Rev B/C, COGINIT D operand --
      engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:381-390.
    not_an_input: >-
      -1 does NOT mean "any available cog". The interpreter's cogspin_ ORs in
      hubexec (#%10_0000) and passes the operand to COGINIT without masking, so
      -1 arrives as $FFFF_FFFF and the silicon decodes D[5:0] = %111111: D[4]=1
      selects the free-cog search and D[0]=1 selects the PAIR form. cogspin(-1,
      worker(), @stk) therefore starts TWO cogs running worker(), both handed
      the SAME @stk -- two interpreters pushing call frames into one buffer with
      no arbitration -- and returns the even/lower cog's ID, so a later
      cogstop(id) stops only one of them. Confirmed with pnut_ts v1.55.4
      (2026-08-30): the -1 form emits $A0 (bc_con_n1_14), the NEWCOG form emits
      $42 $10 (push byte 16) -- different constants, different binaries.
      -1 IS the failure RETURN value; see returns.


  - name: "Method({Parameters})"
    type: "method_call"
    description: |
      Spin2 method to execute with optional parameters.
      Method name followed by parameters in parentheses.
      Can be in current object or another object.
      
  - name: "StackAddress"
    type: "address"
    description: |
      Hub address of stack space for the new cog.
      Use @stack_array to get address.
      Minimum 32 longs recommended, more for complex code.

returns:
  name: "CogID"
  type: "long"
  description: |
    - 0-7: Successfully started cog number
    - -1: Failed (no cog available when using NEWCOG)

stack_requirements:
  # ⚠ THESE TWO FIGURES ARE HEURISTICS, NOT MEASUREMENTS, AND NOT A SPECIFICATION.
  # No Parallax source states a stack size for COGSPIN: the Spin2 v55 documentation
  # contains no _STACK, no _FREE and no stack-sizing guidance of any kind. They are
  # working rules of thumb carried by this knowledge base.
  # Do not cite them as authority. `application-notes/p2an006-sizing-cog-task-stacks.yaml`
  # currently cites this file for them, which makes the authority circular -- the only
  # way to settle a stack size is to measure the high-water mark of YOUR code.
  provenance: "heuristic, unsourced -- no Parallax document states these"
  minimum: "32 longs (128 bytes) -- heuristic floor, not a specified minimum"
  typical: "64-128 longs (256-512 bytes) -- heuristic for moderate Spin2 code"
  how_to_settle_it: >-
    Fill the stack with a known pattern before COGSPIN, run the worst-case path, then
    look for the deepest disturbed long. That measurement beats any figure on this page.
  p1_symbols_do_not_apply: >-
    P1's _STACK and _FREE declarations do not exist in Spin2 and have no effect if
    written. Sizing is the programmer's responsibility, not the compiler's.
  factors:
    - "Method call depth"
    - "Local variable count"
    - "Parameter count"
    - "Expression complexity"

examples:
  - code: |
      VAR
        LONG stack[64]
        LONG cog_id
        
      PUB main()
        cog_id := COGSPIN(NEWCOG, worker(), @stack)
        IF cog_id == -1
          ' Failed to start
          
      PRI worker()
        REPEAT
          ' Do work in parallel
          PINTOGGLE(56)
          WAITMS(500)
    description: "Start worker method in new cog"
    
  - code: |
      VAR
        LONG stack1[64], stack2[64]
        LONG sensor_data
        
      PUB start_sensors()
        COGSPIN(NEWCOG, read_sensor(0, @sensor_data), @stack1)
        COGSPIN(NEWCOG, read_sensor(1, @sensor_data), @stack2)
        
      PRI read_sensor(pin, ptr)
        REPEAT
          LONG[ptr][pin] := read_adc(pin)
          WAITMS(10)
    description: "Multiple sensor readers with parameters"
    
  - code: |
      OBJ
        serial : "serial_driver"
        
      VAR
        LONG serial_stack[128]
        
      PUB init()
        ' Start serial driver in separate cog
        COGSPIN(NEWCOG, serial.rx_handler(), @serial_stack)
    description: "Start object method in new cog"
    
  - code: |
      VAR
        LONG cog_stacks[4][64]
        
      PUB parallel_process()
        REPEAT i FROM 0 TO 3
          COGSPIN(NEWCOG, process_chunk(i), @cog_stacks[i])
    description: "Launch multiple parallel processors"
    
  - code: |
      ' Multi-COG Flash FS stress test pattern
      CON
        NUM_TESTER_COGS = 7
        STACK_SIZE_LONGS = 64
        
      DAT
        ' Per-COG stacks in DAT for persistence
        stacks  LONG  0[NUM_TESTER_COGS * STACK_SIZE_LONGS]
        results BYTE  0[8]  ' One per COG
        lock    LONG  -1    ' Shared resource lock
        
      PUB stress_test() | idx
        ' Initialize lock for file system access
        lock := LOCKNEW()
        
        ' Launch test COGs with indexed stacks
        REPEAT idx FROM 0 TO NUM_TESTER_COGS-1
          COGSPIN(NEWCOG, fs_tester(idx), @stacks[idx * STACK_SIZE_LONGS])
        
        ' Monitor results
        REPEAT
          show_results()
          WAITMS(1000)
          
      PRI fs_tester(cog_index) | handle
        ' Each COG performs random file operations
        REPEAT
          ' Random delay to create contention
          WAITMS(GETRND() & $FF)
          
          ' Acquire lock for file system access
          REPEAT WHILE NOT LOCKTRY(lock)
          
          ' Perform file operation
          handle := open("test.dat", "r")
          IF handle >= 0
            ' Read/write operations
            results[cog_index]++
            close(handle)
          
          ' Release lock
          LOCKREL(lock)
    description: "Multi-COG flash filesystem stress test"
    source: P2-FLASH-FS

method_execution:
  interpreter: "Each cog gets its own Spin2 interpreter"
  isolation: "Methods run independently"
  variables:
    - "VAR variables are shared between cogs"
    - "Local variables are private to each cog"
    - "DAT section is shared"
  
common_uses:
  - "Parallel task execution"
  - "Background monitoring"
  - "Concurrent I/O handling"
  - "Multi-threaded applications"
  - "Separate UI and processing"
  - "Real-time event handlers"
  - "Multi-COG stress testing"
  - "Parallel file system access"

production_patterns:
  multi_cog_with_locks:
    description: "Pattern for safe multi-COG resource access"
    pattern: |
      1. Allocate shared lock in DAT
      2. Create per-COG stacks in DAT
      3. Launch COGs with indexed stack addresses
      4. Use LOCKTRY/LOCKREL for resource protection
      5. Track per-COG results/status
    source: P2-FLASH-FS
    
  indexed_stack_allocation:
    description: "Efficient stack allocation for multiple COGs"
    code: |
      DAT
        stacks LONG 0[NUM_COGS * STACK_SIZE]
        
      PUB start_cogs() | i
        REPEAT i FROM 0 TO NUM_COGS-1
          COGSPIN(NEWCOG, worker(i), @stacks[i * STACK_SIZE])
    benefits:
      - "Predictable memory layout"
      - "Easy to adjust stack sizes"
      - "Persistent across method calls"

