# Spin2 Method: COGSPIN
# Source: Parallax Propeller 2 Spin2 Language Documentation v55, Built-In Symbol for COGSPIN() Usage
# Purpose: Start Spin2 method in a cog

method: "COGSPIN"
category: "cog_management"
type: "method"
description: |
  Start a Spin2 method in a specified or available cog.
  Loads the Spin2 interpreter into the cog and begins executing the specified method.
  Returns the cog number that was started, or -1 if no cog was available.
  Essential for parallel Spin2 execution.
documentation_level: comprehensive

syntax: "COGSPIN(CogNum, Method({Parameters}), StackAddress) : CogID"

parameters:
  - name: "CogNum"
    type: "long"
    description: |
      Cog number to start:
      - 0-7: Start specific cog (will stop if running)
      - NEWCOG (%01_0000): Start any available cog -- the ONLY symbol the
        COGSPIN table defines

      DO NOT pass -1. It is not a synonym for NEWCOG -- see not_an_input below.
    source: "Parallax Propeller 2 Spin2 Language Documentation v55, Built-In Symbol for COGSPIN() Usage (NEWCOG = %01_0000 is the ONLY symbol listed; -1 is NEWTASK, TASKSPIN's symbol); Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), STARTING AND STOPPING COGS (COGINIT D operand)"
    not_an_input: >-
      -1 does NOT mean "any available cog". The interpreter's cogspin_ ORs in
      hubexec (#%10_0000) and passes the operand to COGINIT without masking, so
      -1 arrives as $FFFF_FFFF and the silicon decodes D[5:0] = %111111: D[4]=1
      selects the free-cog search and D[0]=1 selects the PAIR form. cogspin(-1,
      worker(), @stk) therefore starts TWO cogs running worker(), both handed
      the SAME @stk -- two interpreters pushing call frames into one buffer with
      no arbitration -- and returns the even/lower cog's ID, so a later
      cogstop(id) stops only one of them. Confirmed with pnut-ts v1.55.4
      (2026-08-30): the -1 form emits $A0 (bc_con_n1_14), the NEWCOG form emits
      $42 $10 (push byte 16) -- different constants, different binaries.
      -1 IS the failure RETURN value; see returns.


  - name: "Method({Parameters})"
    type: "method_call"
    description: |
      Spin2 method to execute with optional parameters.
      Method name followed by parameters in parentheses.
      Can be in current object or another object.
      
  - name: "StackAddress"
    type: "address"
    description: |
      Hub address of stack space for the new cog.
      Use @stack_array to get address.
      Size it for the method's worst case; see stack_requirements below.

returns:
  name: "CogID"
  type: "long"
  description: |
    - 0-7: Successfully started cog number
    - -1: Failed (no cog available when using NEWCOG)

stack_requirements:
  size: >-
    No Parallax document states a stack size for COGSPIN. Size the buffer by
    measuring the high-water mark of the method you launch: see how_to_settle_it.
  how_to_settle_it: >-
    Fill the stack with a known pattern before COGSPIN, run the worst-case path, then
    look for the deepest disturbed long. application-notes/p2an006-sizing-cog-task-stacks.yaml
    gives the full procedure and a ready-made checking object.
  p1_symbols_do_not_apply: >-
    P1's _STACK and _FREE declarations do not exist in Spin2 and have no effect if
    written. Sizing is the programmer's responsibility, not the compiler's.
  factors:
    - "Method call depth"
    - "Local variable count"
    - "Parameter count"
    - "Expression complexity"

top_level_stack:
  summary: >-
    Every Spin2 cog has a stack, including cog 0 running the top-level program, but only
    COGSPIN and TASKSPIN take a StackAddress. The top-level program's stack is placed by the
    compiler, grows upward, and has no documented size or limit.
  placement: >-
    The compiler supplies the stack's starting hub address (the initial dbase) in the
    program's start-up header. The interpreter's start-up block clears
    (dbase - vbase) / 4 longs of VAR space, so the stack begins at the first long after
    VAR space. It then writes the initial pbase and vbase at that address and restarts
    cog 0 with COGINIT, passing that address as the new cog's PTRA.
  first_frame: >-
    The interpreter's launch routine reads pbase and vbase from the first two longs of the
    stack and writes a 6-long header there: pbase (with the trap flag), vbase, dbase,
    mrecv, msend, and the return pointer (the bytecodes that stop the task or cog when the
    top-level method returns). dbase is set 6 longs above the stack base; the method's
    parameters, results and locals start there. COGSPIN builds the same layout at its
    StackAddress: pbase and vbase at the address, parameters from 6 longs above it.
  growth: >-
    The stack grows upward, toward higher hub addresses: pushes are wrlong with ptra++
    and pops are rdlong with --ptra. Every nested call pushes 6 longs at its drop anchor
    (the caller's stack top, pbase with flags, vbase, dbase, mrecv, msend), plus one long
    for the return address (a return pops 7 longs), then the called method's parameters,
    results and local longs, which the call clears to zero.
  size_and_limit: >-
    Not documented. Neither the Spin2 v55 documentation nor the v55 interpreter listing
    states a size for the top-level stack or an upper bound for it, and the interpreter
    listing contains no comparison of the stack pointer against a limit, so no overflow
    check is documented. How far the stack can grow before it reaches other hub data is
    set by what the compiler places above it, which is not documented either. A COGSPIN
    or TASKSPIN stack is a hub buffer you provide and size; see stack_requirements above
    and how to measure it in application-notes/p2an006-sizing-cog-task-stacks.yaml.
  source: "Parallax Spin2 Interpreter v55 (2026.05.07), start-up block (dbase_init, var_longs), launch_spin / launch_method, Drop anchor (drophot), callhot, returnh, build_stack"

stack_observability:
  description: >-
    A COGSPIN or TASKSPIN stack is an ordinary hub buffer, so any cog can read it. The
    stack pointer is PTRA, a register in the running cog's own RAM, so another cog cannot
    read it directly: a supervising cog sees how far a stack has been used (for example
    the high-water mark left in a fill pattern, as p2an006 measures) but not its current
    depth. A cog in its own debug ISR can trigger an asynchronous breakpoint in another
    cog with COGBRK, if that cog has its asynchronous breakpoint interrupt enabled; the
    target's debug ISR can then inspect its own registers.
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), OVERVIEW and COGS (each cog has its own RAM); DEBUG INTERRUPT (COGBRK)"

examples:
  - code: |
      VAR
        LONG stack[64]
        LONG cog_id

      PUB main()
        cog_id := COGSPIN(NEWCOG, worker(), @stack)
        IF cog_id == -1
          ' Failed to start
          
      PRI worker()
        REPEAT
          ' Do work in parallel
          PINTOGGLE(56)
          WAITMS(500)
    description: "Start worker method in new cog"
    
  - code: |
      VAR
        LONG stack1[64], stack2[64]
        LONG sensor_data
        
      PUB start_sensors()
        COGSPIN(NEWCOG, read_sensor(0, @sensor_data), @stack1)
        COGSPIN(NEWCOG, read_sensor(1, @sensor_data), @stack2)
        
      PRI read_sensor(pin, ptr)
        REPEAT
          LONG[ptr][pin] := read_adc(pin)
          WAITMS(10)
    description: "Multiple sensor readers with parameters"
    
  - code: |
      OBJ
        serial : "serial_driver"
        
      VAR
        LONG serial_stack[128]
        
      PUB init()
        ' Start serial driver in separate cog
        COGSPIN(NEWCOG, serial.rx_handler(), @serial_stack)
    description: "Start object method in new cog"
    
  - code: |
      VAR
        LONG cog_stacks[4 * 64]

      PUB parallel_process() | i
        REPEAT i FROM 0 TO 3
          COGSPIN(NEWCOG, process_chunk(i), @cog_stacks[i * 64])
    description: "Launch multiple parallel processors"

method_execution:
  interpreter: "Each cog gets its own Spin2 interpreter"
  isolation: "Methods run independently"
  variables:
    - "VAR variables are shared between cogs"
    - "Local variables are private to each cog"
    - "DAT section is shared"
  
common_uses:
  - "Parallel task execution"
  - "Background monitoring"
  - "Concurrent I/O handling"
  - "Multi-threaded applications"
  - "Separate UI and processing"
  - "Real-time event handlers"
  - "Parallel file system access"

production_patterns:
  indexed_stack_allocation:
    description: "Efficient stack allocation for multiple COGs"
    code: |
      DAT
        stacks LONG 0[NUM_COGS * STACK_SIZE]
        
      PUB start_cogs() | i
        REPEAT i FROM 0 TO NUM_COGS-1
          COGSPIN(NEWCOG, worker(i), @stacks[i * STACK_SIZE])
    benefits:
      - "Predictable memory layout"
      - "Easy to adjust stack sizes"
      - "Persistent across method calls"

