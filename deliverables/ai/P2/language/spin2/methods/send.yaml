method: SEND
type: method
description: |
  SEND is a special method pointer, inherited from the calling method and
  conveyed to all called methods. Its purpose is to provide an efficient output
  mechanism for data: SEND(...) passes each parameter, as a long, to the method
  that SEND points to.
category: Miscellaneous
syntax: "SEND(DataItems...)"
parameters:
  - name: "DataItems"
    type: "variable"
    description: "One or more data items to send; each is passed as a long to the method SEND points to (values, expressions, quoted characters, method return values)"
returns:
  type: "void"
  description: "No return value"
examples:
  - code: |
      ' Send single byte
      SEND($41)  ' Send 'A'
    description: "Send single byte"
  - code: |
      ' Send string
      SEND("Hello, World!")
    description: "Send the characters of a quoted string"
  - code: |
      ' Send multiple items
      SEND($0D, $0A, "Ready", $0D, $0A)
    description: "Send mixed data types"
  - code: |
      ' Send array data
      repeat i from 0 to 9
        SEND(BYTE[@buffer][i])  ' Send 10 bytes from buffer
    description: "Send array contents"
as_method_pointer:
  description: |
    SEND is a special method pointer. Assign it like a method pointer;
    it must point to a method that takes one parameter and has no return values.
  syntax: "SEND := @OutMethod"
  usage: "SEND(data)"
  restrictions:
    - "Must point to a method that takes one parameter"
    - "Must point to a method that has no return values"
  example: |
    OBJ
      serial : "serial_driver"

    PUB setup()
      RECV := @serial.rx
      SEND := @serial.tx

    PUB echo() | c
      c := RECV()
      SEND(c)

notes:
  - "Assign SEND (SEND := @OutMethod) before using it; if SEND has not been assigned, SEND(...) does nothing"
  - "Any methods called within the SEND parameters inherit the SEND pointer, so they can do SEND(...) too"
  - "A called method inherits the current SEND pointer and may change it for its own purposes; on return the SEND pointer is back to what it was before the call (it propagates in method calls, not in method returns)"
  - "Works with user-defined output methods"
  - "SEND passes parameters, including values returned by called methods, in order"
timing:
  description: "Depends on the method SEND points to"
  cycles: "Variable - set by the output method"
related:
  - RECV
  - DEBUG
  - language/spin2/concepts/method-pointers.yaml
see_also:
  - "Serial communication"
  - "Debug output"
  - "Data transmission"
