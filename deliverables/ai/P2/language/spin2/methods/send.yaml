method: SEND
type: method
description: |
  Send data bytes using configured output method
category: Miscellaneous
syntax: "SEND(DataItems...)"
parameters:
  - name: "DataItems"
    type: "variable"
    description: "One or more data items to send (bytes, strings, arrays)"
returns:
  type: "void"
  description: "No return value"
examples:
  - code: |
      ' Send single byte
      SEND($41)  ' Send 'A'
    description: "Send single byte"
  - code: |
      ' Send string
      SEND(STRING("Hello, World!"))
    description: "Send string constant"
  - code: |
      ' Send multiple items
      SEND($0D, $0A, STRING("Ready"), $0D, $0A)
    description: "Send mixed data types"
  - code: |
      ' Send array data
      SEND(BYTE[@buffer, 10])  ' Send 10 bytes from buffer
    description: "Send array contents"
as_method_pointer:
  description: |
    SEND can be assigned to a LONG variable as a method pointer,
    enabling flexible I/O abstraction.
  syntax: "outputMethod := SEND"
  usage: "outputMethod(data)"
  restrictions:
    - "Returns no value (cannot be used as a term)"
    - "Cannot use abort syntax with SEND"
  example: |
    VAR
      LONG outputMethod
      
    PUB SetupMailbox()
      outputMethod := SEND        ' Use inter-cog mailbox
      
    PUB SetupSerial()
      outputMethod := @serial.tx  ' Use serial port
      
    PUB SendData(data)
      outputMethod(data)          ' Works with either destination

notes:
  - "Output method must be configured first"
  - "Typically used with serial drivers"
  - "Can send bytes, words, longs, strings, arrays"
  - "Blocking operation - waits for each byte"
  - "Works with user-defined output methods"
  - "Common for debug output"
  - "Can be assigned to LONG variable as method pointer for flexible I/O"
timing:
  description: "Depends on output method"
  cycles: "Variable based on driver"
related:
  - RECV
  - DEBUG
  - language/spin2/concepts/method-pointers.yaml
see_also:
  - "Serial communication"
  - "Debug output"
  - "Data transmission"
