method: MULDIV64
type: method
description: |
  Multiply then divide with a 64-bit intermediate product. Parallax Spin2
  Documentation v55: "Divide the 64-bit product of 'mult1' and 'mult2' by
  'divisor', return quotient (unsigned operation)." All operands and the quotient
  are UNSIGNED 32-bit values -- an operand with bit 31 set is a large positive
  number, not a negative one; handle signs yourself for signed math.
category: Math/CORDIC Operations
syntax: "result := MULDIV64(Multiplier, Multiplicand, Divisor)"
parameters:
  - name: "Multiplier"
    type: "long"
    description: "First value to multiply (32-bit unsigned)"
  - name: "Multiplicand"
    type: "long"
    description: "Second value to multiply (32-bit unsigned)"
  - name: "Divisor"
    type: "long"
    description: "Value to divide the 64-bit product by (32-bit unsigned)"
returns:
  type: "long"
  description: "Unsigned quotient of (Multiplier × Multiplicand) ÷ Divisor"
examples:
  - code: |
      ' Scale value without overflow
      scaled := MULDIV64(value, 1000, 1024)  ' value*1000/1024
    description: "Scale value precisely"
  - code: |
      ' Calculate percentage
      percent := MULDIV64(part, 100, total)
    description: "Calculate percentage without overflow"
  - code: |
      ' Frequency calculation
      freq := MULDIV64(clkfreq, numerator, denominator)
    description: "Calculate precise frequency"
  - code: |
      ' Fixed-point math
      result := MULDIV64(a, b, $1_0000)  ' Multiply with 16.16 fixed point
    description: "Fixed-point multiplication"
notes:
  - "Prevents overflow in intermediate calculation"
  - "Uses 64-bit intermediate result"
  - "Unsigned operation: all parameters and the result are 32-bit unsigned (Parallax Spin2 Documentation v55, MULDIV64)"
  - "Useful for scaling and ratio calculations"
  - "More precise than (a*b)/c for large values"
  - "Divisor 0 does not trap: MULDIV64(a, b, 0) returns NOT (the upper 32 bits of a*b), every time -- so $FFFF_FFFF whenever a*b < 2^32 (e.g. MULDIV64(1000, 1000, 0)); MULDIV64($FFFF_FFFF, $FFFF_FFFF, 0) = 1. Guard the divisor if a zero is possible. The interpreter runs QMUL then QDIV."
timing:
  execution_model: |
    Spin2 methods execute via the bytecode interpreter. The interpreter is
    engineered to run at minimum cost. We do not publish a clock count for
    this method because we do not have a verifiable measurement (no clean
    single-PASM-instruction backing to cite).

related:
  - language/spin2/methods/qlog.yaml
  - language/spin2/methods/qexp.yaml
see_also:
  - "Extended precision math"
  - "Scaling operations"
  - "Fixed-point arithmetic"
