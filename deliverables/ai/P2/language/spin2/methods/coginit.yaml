# Spin2 Method: COGINIT
# Source: Parallax Propeller 2 Spin2 Language Documentation v55, Built-In Symbols for COGINIT() Usage
# Purpose: Start PASM code in a cog

method: "COGINIT"
category: "cog_management"
type: "method"
description: |
  Start PASM2 code in a specified or available cog.
  In COGEXEC mode, loads PASM2 code from hub RAM into cog RAM and begins execution there;
  in HUBEXEC mode, nothing is loaded and execution begins at the given address.
  Returns the cog number that was started; see returns for the value with no cog free.

syntax: "COGINIT(CogNum, PASMaddr, PTRAvalue) : CogID"

parameters:
  - name: "CogNum"
    type: "long"
    description: |
      Cog number to start, or one of the built-in symbols below.
      - 0-7: Start specific cog, restarting it if running
      - COGEXEC_NEW (%01_0000): Start any available cog, cogexec mode
      - HUBEXEC_NEW (%11_0000): Start any available cog, hubexec mode
      - COGEXEC_NEW_PAIR (%01_0001): Start an available even/odd pair of cogs, cogexec mode (useful for LUT sharing)
      - HUBEXEC_NEW_PAIR (%11_0001): Start an available even/odd pair of cogs, hubexec mode (useful for LUT sharing)
      - COGEXEC (%00_0000, default) / HUBEXEC (%10_0000): add a cog number, e.g. "HUBEXEC + 3"

      CogNum = -1: see cognum_minus_one below.
    source: "Parallax Propeller 2 Spin2 Language Documentation v55, Built-In Symbols for COGINIT() Usage (the six symbols and their values; -1 is NEWTASK, TASKSPIN's symbol); Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), STARTING AND STOPPING COGS (COGINIT D operand); Parallax Spin2 Interpreter v55 (2026.05.07), COGINIT bytecode routine (setq w, then coginit x,y wc with the popped CogNum in x)"
    cognum_minus_one: >-
      CogNum is passed as the D operand of the COGINIT instruction, so -1 is D = $FFFF_FFFF
      and D[5:0] = %111111. D[5] = 1 means no load, with execution beginning at the address
      given. D[4] = 1 with D[0] = 1 starts a free even/odd pair of cogs and writes the
      even/lower cog's ID.


  - name: "PASMaddr"
    type: "address"
    description: |
      Hub address of the PASM2 code to load and execute.
      To Spin2 code, @label is the hub address of the labelled instruction.

  - name: "PTRAvalue"
    type: "long"
    description: |
      Value written to the PTRA register of the started cog: a means of pointing
      its program to a runtime data structure or passing it a 32-bit parameter.

returns:
  name: "CogID"
  type: "long"
  description: |
    - 0-7: Successfully started cog number
    - $8000_000F: no cog free, with COGEXEC_NEW used as an expression and all 8 cogs running. Bit 31 is set, so the long is negative: a test of the result with < 0 tells failure from a cog number, and a test with == -1 is false. Parallax's documents also give -1 for no cog free. Not established: the value returned by the HUBEXEC_NEW and pair forms with no cog free.
  source: >-
    P2 hardware verification, EF-120 (COGINIT(COGEXEC_NEW, ...) as an expression, all 8 cogs running; every call returned $8000_000F, with a control and a recovery start reading the cog ID).
    Parallax Spin2 Interpreter v55 (2026.05.07), COGINIT bytecode routine (setq w, coginit x,y wc, then bitc x,#31).
    Parallax Propeller 2 Spin2 Language Documentation v55, COGINIT row (-1 = no cog free).

execution_modes:
  cogexec: |
    Default mode - code copied to cog RAM and executed there
    The load fills registers $000..$1F7
    With the pipeline full, each instruction takes as little as 2 clocks

  hubexec: |
    HUBEXEC (%10_0000) - code executes directly from hub RAM
    A larger effective code space, beyond the limit of about 1,000 instructions inside cog RAM
    ALU instructions such as ADD, MOV and NOP take 2 clocks in hub execution, the same as in cog execution
    Not documented: the clocks per sequential instruction in hub execution as a general rule
    Branching to a hub address takes a minimum of 13 clocks, and one more if the instruction branched to is not long-aligned

examples:
  - code: |
      DAT
        ORG 0
      blink_code
        DIRH  #56
      .loop
        OUTNOT #56
        WAITX ##25_000_000
        JMP   #.loop
        
      PUB start_blinker() | cog
        cog :=COGINIT(COGEXEC_NEW, @blink_code, 0)
        IF cog < 0
          ' Failed to start
    description: "Start PASM blinker in any available cog"
    
  - code: |
      VAR
        LONG params[4]
        
      PUB start_driver()
        params[0] := @buffer
        params[1] := buffer_size
        params[2] := pin_number
        params[3] := 0  ' command
        
        COGINIT(COGEXEC_NEW, @driver_code, @params)
    description: "Start driver with parameter block"
    
  - code: |
      ' Start cog 1 with new code, restarting it if it is running
      COGINIT(1, @new_code, @config)
    description: "Restart a specific cog (starts it if stopped)"
    
  - code: |
      ' Start a free even/odd pair of cogs, executing from hub RAM
      COGINIT(COGEXEC_NEW_PAIR | HUBEXEC, @hub_code, @data)
    description: "Start an available even/odd pair of cogs, with code executing from hub RAM and no load"

related_methods:
  - "COGSPIN"
  - "COGSTOP"
  - "COGID"
  - "COGCHK"

memory_layout: |
  Cog RAM after a loading COGINIT (COGEXEC, COGEXEC_NEW or COGEXEC_NEW_PAIR; D[5] = 0):
  $000-$1F7: Your PASM code/data
  $1F8-$1FF: Special-purpose registers (PTRA, PTRB, DIRA, DIRB, OUTA, OUTB, INA, INB); not loaded

notes:
  - "With COGEXEC, COGEXEC_NEW or COGEXEC_NEW_PAIR (D[5] = 0), the target cog loads its registers $000..$1F7 from the hub starting at address S, then begins execution at register address $000"
  - "With HUBEXEC, HUBEXEC_NEW or HUBEXEC_NEW_PAIR (D[5] = 1), the target cog begins execution at register/LUT/hub address S"
  - "S goes to the target cog's PTRB (Parallax's documents differ on whether all 32 bits or S[19:0] are written). The SETQ value, if COGINIT is preceded by SETQ, is written into its PTRA, otherwise PTRA is cleared to zero"
  - "A lock held by the target cog is implicitly released when that cog is restarted (COGINIT) or stopped (COGSTOP)"
  - "On COGINIT, IJMP0 is initialized to $1F8, the address of the debug-ISR-entry routine"
  - "What COGINIT does to cog state, piece by piece, is in architecture/cog_state.yaml"
  - "Not documented: a clock count for the time from COGINIT to the target cog's first instruction"
  - "COGINIT starts PASM2 code in a cog; COGSPIN starts a Spin2 method in a cog"

source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), LOCKS (implicit release), DEBUG INTERRUPT (IJMP0 initialized to $1F8), STARTING AND STOPPING COGS (S, all 32 bits, is written into PTRB; the SETQ value into PTRA), COGS (as little as two clock cycles with the pipeline full), HUB EXECUTION (a branch to a hub address); Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, COGINIT, Execution Modes, p.65; Parallax Propeller 2 Spin2 Language Documentation v55, DAT Cog-exec (@ is the hub address), COGINIT and COGSPIN rows; P2 Instructions v35 - Rev B/C Silicon, Sheet1 (ADD, MOV and NOP rows, hub execution mode: same as cog execution); Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Locks, p.20; Hub Control instructions, p.41 (S[19:0] sets the hub startup address and PTRB of the cog)"

limitations:
  - "With D[5] = 0, COGINIT loads $000-$1F7; with D[5] = 1 nothing is loaded. The $1F8-$1FF special-purpose registers are not loaded."
  - "Only 8 cogs available total"

see_also:
  - "language/pasm2/org.yaml"
  - "language/spin2/methods/cogspin.yaml"
  - "language/spin2/methods/cogstop.yaml"
  - "architecture/cog.yaml"
  - "architecture/cog_state.yaml"