method: LOOKUPZ
type: method
description: Look up value in table using 0-based indexing (index → value)
category: Lookup Operations

syntax: 'result := LOOKUPZ(Index : Value0, Value1, ..., ValueN)'

parameters:
  - name: Index
    type: integer
    description: 0-based index into value list (0 = first item)
  - name: Values
    type: list
    description: Comma-separated list of values or ranges (supports .. operator)

returns:
  type: long
  description: Value at index position, or 0 if index out of range

index_mapping:
  description: "0-based indexing diagram"
  example: |
    Items:         A    B    C    D    E
    LOOKUPZ index: 0    1    2    3    4
    Out of range: -1 and 5+ return 0

examples:
  - description: "Basic zero-indexed lookup"
    code: |
      ' Get value by index
      value := LOOKUPZ(2 : 10, 20, 30, 40, 50)
      ' Returns 30 (index 2 = 3rd item)

  - description: "Hex digit conversion (value 0-15 to character)"
    code: |
      PUB value_to_hex(value) : char
        ' Convert value (0-15) to hex character
        char := LOOKUPZ(value & $F : "0".."9", "A".."F")
        ' "0".."9" is indices 0-9, "A".."F" is indices 10-15

  - description: "Array-style pin mapping"
    code: |
      PUB get_channel_pin(channel) : pin
        ' Map channel 0-7 to actual pin numbers
        pin := LOOKUPZ(channel : 16, 17, 18, 19, 24, 25, 26, 27)

  - description: "Baud rate selection"
    code: |
      PUB get_baud(setting) : rate
        ' Settings 0-4 map to standard baud rates
        rate := LOOKUPZ(setting : 9600, 19200, 38400, 57600, 115200)
        if rate == 0
          rate := 9600  ' Default if out of range

common_patterns:
  - pattern: "hex_conversion"
    description: "Convert nibble value (0-15) to hex character"
    code: |
      char := LOOKUPZ(value & $F : "0".."9", "A".."F")
      ' Ranges expand: "0".."9" = 10 items, "A".."F" = 6 items
      ' Total 16 items for indices 0-15

  - pattern: "array_simulation"
    description: "Inline constant array without DAT section"
    code: |
      ' Equivalent to: motor_speeds := long[4]{1000, 2000, 3000, 4000}[index]
      speed := LOOKUPZ(index : 1000, 2000, 3000, 4000)

anti_patterns:
  - anti_pattern: "missing_range_check"
    description: "Assuming LOOKUPZ always returns valid value"
    wrong: |
      pin := LOOKUPZ(channel : 16, 17, 18, 19)
      DRVH(pin)  ' If channel >= 4, pin is 0, drives wrong pin!
    correct: |
      if channel < 4
        pin := LOOKUPZ(channel : 16, 17, 18, 19)
        DRVH(pin)

  - anti_pattern: "confusion_with_lookup"
    description: "Using LOOKUPZ when expecting 1-based indexing"
    wrong: |
      ' User selects option 1, 2, or 3
      name := LOOKUPZ(user_choice : @"First", @"Second", @"Third")
      ' User choice 1 returns @"Second" (index 1), not @"First"!
    correct: |
      ' For 1-based user input, use LOOKUP or subtract 1
      name := LOOKUP(user_choice : @"First", @"Second", @"Third")
      ' Or: name := LOOKUPZ(user_choice - 1 : @"First", @"Second", @"Third")

when_to_use:
  lookupz_is_best:
    - "Array-style 0-based access"
    - "Mapping computed indices (0, 1, 2, ...)"
    - "When index comes from LOOKDOWNZ"
    - "Working with C-style enums starting at 0"
  use_lookup_instead:
    - "User-facing indices (menus: 1, 2, 3)"
    - "Day-of-week (1=Sunday through 7=Saturday)"
    - "1-based enumeration"

notes:
  - "Index is 0-based (0 = first item)"
  - "Returns 0 if index < 0 or >= count"
  - "Supports ranges with .. operator"
  - "More common than LOOKUP for array-like access"
  - "Values evaluated at compile time if possible"
  - "Efficient for small lookup tables (~20 items max)"
  - "Inverse operation: LOOKDOWNZ (find index of value)"

related:
  - language/spin2/methods/lookup.yaml
  - language/spin2/methods/lookdown.yaml
  - language/spin2/methods/lookdownz.yaml
  - language/spin2/concepts/table_lookup.yaml
  - language/spin2/constructs/case.yaml
