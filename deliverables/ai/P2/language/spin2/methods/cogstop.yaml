# Spin2 Method: COGSTOP
# Source: Spin2 v51 documentation
# Purpose: Stop a running cog

method: "COGSTOP"
category: "cog_management"
type: "method"
description: |
  Stop a specified cog immediately.
  The cog stops executing and becomes available for reuse.
  All pins controlled by the cog are released to float state.
  No effect if the cog is already stopped.

syntax: "COGSTOP(CogNum)"

parameters:
  - name: "CogNum"
    type: "long"
    description: |
      Cog number to stop:
      - 0-7: Stop specific cog
      - Can use COGID() to stop current cog
      - Invalid numbers have no effect

returns: "none"

timing:
  execution_model: |
    Spin2 methods execute via the bytecode interpreter. The interpreter is
    engineered to run at minimum cost. We do not publish a clock count for
    this method because we do not have a verifiable measurement (no clean
    single-PASM-instruction backing to cite).


examples:
  - code: |
      VAR
        LONG driver_cog
        LONG driver_lock

      PUB stop_driver()
        IF driver_cog >= 0
          COGSTOP(driver_cog)       ' a lock it HELD is free now
          LOCKRET(driver_lock)      ' ...but only this returns the NUMBER
          driver_cog := -1
    description: "Stop a driver cog and mark as stopped"
    
  - code: |
      ' Emergency stop all other cogs
      REPEAT cog FROM 0 TO 7
        IF cog <> COGID()
          COGSTOP(cog)
    description: "Stop all cogs except current"
    
  - code: |
      ' Self-termination
      COGSTOP(COGID())
      ' Code never reaches here
    description: "Stop current cog (suicide)"
    
  - code: |
      PUB restart_cog(n, code_addr, param)
        COGSTOP(n)  ' Ensure stopped first
        RETURN COGINIT(n, code_addr, param)
    description: "Restart a specific cog with new code"

effects:
  immediate:
    - "Cog execution halts"
    - "Cog RAM contents preserved but inaccessible"
    - "Cog becomes available for COGINIT"
    
  pin_control:
    - "All DIR bits cleared (pins become inputs)"
    - "Smart pin modes disabled"
    - "Pin states float"
    
  resources:
    - "A lock the cog HELD goes free. Ownership stops holding the moment the cog becomes inactive - for any cause, not only COGSTOP - so nothing has to release it"
    - "The lock's ALLOCATION does not go free. The number stays issued and LOCKNEW will not hand it out again. Only LOCKRET returns a lock number to the pool"
    - "So stopping a cog that holds locks LEAKS lock numbers: sixteen leaks and LOCKNEW returns nothing, ever, and the failure surfaces at some later LOCKNEW in unrelated code"
    - "Hub RAM is NOT affected"
    - "Other cogs continue running"

common_uses:
  - "Clean shutdown of drivers"
  - "Resource management"
  - "Error recovery"
  - "Dynamic cog allocation"
  - "Power saving (stopped cogs use less power)"

related_methods:
  - "COGINIT"
  - "COGSPIN"
  - "COGID"
  - "COGCHK"

notes:
  - "Safe to call on already-stopped cog"
  - "Cannot stop cog -1 (no effect)"
  - "Stopping current cog ends execution immediately"
  - "No cleanup code runs in stopped cog"
  - "LOCKRET every lock the cog owns before stopping it. Not to free the lock - stopping frees the held state by itself - but because LOCKRET is the only thing that returns the NUMBER to the pool"

best_practices:
  - "Track cog numbers in variables"
  - "Set cog variable to -1 after stopping"
  - "LOCKRET before stopping a cog, on every path including error and shutdown paths - every LOCKNEW needs a matching LOCKRET or the number is gone until reset"
  - "Stop dependent cogs in correct order"
  - "Ensure pins are in safe state first"

warnings:
  - "Stopping a cog does not clean up its resources, and the one it appears to clean up it does not: a held lock reads free afterwards while its number stays permanently allocated"
  - "Pins float - may need external pull-up/down resistors"
  - "Cannot recover cog state after stopping"
  - "No notification to other cogs"

see_also:
  - "language/spin2/methods/coginit.yaml"
  - "language/spin2/methods/cogid.yaml"
  - "language/spin2/methods/cogchk.yaml"

related:
  - architecture/locks.yaml
  - language/spin2/methods/lockret.yaml