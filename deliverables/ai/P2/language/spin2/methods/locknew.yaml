method: LOCKNEW
type: method
description: |
  Allocate a new hardware lock for inter-COG synchronization.
  The P2 has 16 hardware locks (0-15) shared across all 8 COGs.
category: Lock Operations
syntax: "lock_id := LOCKNEW()"
parameters: []
returns:
  type: "integer"
  description: "Lock ID (0..15) if successful; a negative value (< 0) if no lock is available"
source: "Spin2 v55 documentation (LOCKNEW: < 0 if no LOCK available; LOCK[15] is allocated by the debugger); Parallax Spin2 interpreter v55 (LOCKNEW)"

examples:
  - description: "Allocate lock with error checking"
    code: |
      VAR
        long my_lock

      PUB init() : ok
        my_lock := LOCKNEW()
        if my_lock < 0
          ' No locks available - all 16 in use
          ABORT
        ok := TRUE

  - description: "Complete lock lifecycle"
    code: |
      CON
        NO_LOCK = -1

      VAR
        long counter_lock
        long shared_counter

      PUB init()
        counter_lock := LOCKNEW()
        shared_counter := 0

      PUB cleanup()
        if counter_lock >= 0
          LOCKRET(counter_lock)
          counter_lock := NO_LOCK

  - description: "Multiple locks for different resources"
    code: |
      VAR
        long spi_lock
        long uart_lock
        long i2c_lock

      PUB init_all_locks() : ok
        spi_lock := LOCKNEW()
        uart_lock := LOCKNEW()
        i2c_lock := LOCKNEW()
        ok := (spi_lock >= 0 AND uart_lock >= 0 AND i2c_lock >= 0)

anti_patterns:
  - anti_pattern: "lock_leak"
    severity: "resource_exhaustion"
    description: "Not returning locks when done exhausts the 16 available locks"
    wrong: |
      PUB start()
        my_lock := LOCKNEW()
        ' ... use lock ...

      PUB stop()
        ' Forgot to return lock - it's now permanently unavailable!
    correct: |
      PUB start()
        my_lock := LOCKNEW()

      PUB stop()
        if my_lock >= 0
          LOCKRET(my_lock)
          my_lock := -1

  - anti_pattern: "unchecked_allocation"
    severity: "runtime_error"
    description: "Not checking if lock allocation succeeded"
    wrong: |
      lock := LOCKNEW()
      ' Assume lock is valid - may be negative!
      REPEAT UNTIL LOCKTRY(lock)  ' Undefined behavior with a negative lock
    correct: |
      lock := LOCKNEW()
      if lock < 0
        ABORT  ' Or handle error appropriately

best_practices:
  - "Check the return value with < 0 (a negative value means no lock is available)"
  - "Store lock ID in VAR or DAT for later LOCKRET"
  - "Return locks in cleanup/stop methods"
  - "Document which lock protects which resource"
  - "Document which lock number protects which resource; use the number LOCKNEW returned"

notes:
  - "P2 has 16 hardware locks (0-15)"
  - "Returns next available lock ID"
  - "Returns a negative value (< 0) if no lock is available"
  - "A -d build allocates lock 15 for the debugger before the program runs, so LOCKNEW has one fewer lock available there"
  - "Lock is allocated but NOT captured (call LOCKTRY to acquire)"
  - "Must call LOCKRET when done to free lock for reuse"
  - "Locks are shared across all 8 COGs"
  - "Hardware ensures atomic operations - no race conditions"

timing:
  execution_model: |
    Spin2 methods execute via the bytecode interpreter. Method-call clock count: not documented.
  underlying_pasm: "LOCKNEW"
  underlying_pasm_timing: "4 clocks (range 4...11 hub-window dependent; per language/spin2/methods/locknew.yaml encoding)"


