method: CLKSET
type: method
description: |
  Safely set new clock mode and frequency
category: Miscellaneous
syntax: "CLKSET(Mode, Frequency)"
parameters:
  - name: "Mode"
    type: "long"
    description: "Clock mode configuration bits"
  - name: "Frequency"
    type: "long"
    description: "New clock frequency in Hz"
returns:
  type: "void"
  description: "No return value"
examples:
  - code: |
      ' Re-apply the compiled clock mode and frequency
      CLKSET(clkmode_, clkfreq_)
    description: "Set the compiled PLL/crystal mode (clkmode_ and clkfreq_ come from the CON clock symbols, e.g. _xtlfreq and _clkfreq)"
  - code: |
      ' Drop to RCFAST for low power
      CLKSET(0, 20_000_000)  ' mode %00_00 = RCFAST
    description: "Switch to internal RC oscillator"
  - code: |
      ' Dynamic frequency scaling between RCFAST and the compiled mode
      if battery_low
        CLKSET(0, 20_000_000)  ' Drop to RCFAST
      else
        CLKSET(clkmode_, clkfreq_)  ' Back to the compiled clock mode
    description: "Adjust clock for power management"
notes:
  - "Performs safe clock transition"
  - "Updates clkfreq variable automatically"
  - "Temporarily switches to RCFAST during transition"
  - "Mode bits configure PLL, crystal, dividers"
  - "Affects all timing-dependent operations"
  - "Maximum frequency depends on chip specs"
  - "The compiler defines clkmode_ and clkfreq_ from the CON clock symbols; there are no other predefined clkmode_ constants"
in_a_debug_build:
  note: "CLKSET also keeps the debugger's stored clock frequency (P63, held in long-repository mode) current, so DEBUG output stays at the right baud rate after the change. DEBUG needs a clock of at least 10 MHz derived from a crystal or an external input, so the RCFAST and RCSLOW examples here cannot be used in a DEBUG build"
  source: "Parallax Propeller 2 Spin2 Language Documentation v55, DEBUG (to use the debugger, at least a 10 MHz clock derived from a crystal or external input; DEBUG dynamic clock frequency adaptation) and version history v36 (CLKSET supports the P63 clock-frequency repository)"
timing:
  description: "Clock stabilization delay"
  cycles: "~10 ms (20_000_000/100 clocks at RCFAST), only when the new clkmode selects the crystal or PLL (bit 1 of the mode set); otherwise no wait"
  source: "Parallax Propeller 2 Spin2 Language Documentation v55, Clock Setup"
related:
  - language/spin2/methods/hubset.yaml
  - language/spin2/system-variables/clkfreq.yaml
  - language/spin2/system-variables/clkmode.yaml
  - language/spin2/constants/special-configuration-symbols.yaml
  - language/pasm2/hubset.yaml
  - architecture/clock_system.yaml
