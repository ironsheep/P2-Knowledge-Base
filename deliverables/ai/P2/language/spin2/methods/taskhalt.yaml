method: TASKHALT
type: method
category: Task Operations

requires_version: "Spin2_v47"
version_directive: "{Spin2_v47}"

description: |
  Temporarily halt/pause a running task. The task's state and stack are 
  preserved, and execution can be resumed later with TASKRESUME (or TASKCONT). 
  Use THISTASK (-1) to halt the currently executing task.
  REQUIRES: {Spin2_v47} or later version directive at start of source file.
syntax: "TASKHALT(TaskID)"
parameters:
  - name: "TaskID"
    type: "integer"
    description: "Task ID to halt (0-31)"
returns:
  type: "void"
  description: "No return value"
examples:
  - code: |
      {Spin2_v47}                              ' REQUIRED directive
      PUB critical_section()
        TASKHALT(3)                            ' Pause task 3
        do_critical_work()
        TASKRESUME(3)                          ' Resume task 3
    description: "Pause and resume task"
  - code: |
      {Spin2_v47}                              ' REQUIRED directive
      PUB freeze_all_tasks() | task_id
        repeat task_id from 1 to 31
          if TASKCHK(task_id)
            TASKHALT(task_id)
    description: "Pause all secondary tasks"
  - code: |
      {Spin2_v47}                              ' REQUIRED directive
      PUB flow_control()
        if buffer_full
          TASKHALT(producer_task)
    description: "Pause producer when buffer full"
notes:
  - "REQUIRES {Spin2_v47} or later at start of source file"
  - "Task is paused, not terminated"
  - "State and stack preserved"
  - "Use TASKRESUME to continue"
  - "Task won't execute until resumed"
  - "Useful for synchronization"
  - "Different from TASKSTOP (which terminates)"
timing:
  description: "Immediate"
  cycles: "2-9 clock cycles"
related:
  - TASKRESUME
  - TASKSTOP
  - TASKSPIN
  - TASKCHK
see_also:
  - "Task synchronization"
  - "Task pausing"
  - "Critical sections"