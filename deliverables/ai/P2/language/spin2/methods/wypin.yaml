# Spin2 Method: WYPIN
# Source: Spin2 documentation
# Purpose: Write Y parameter to smart pin

method: "WYPIN"
category: "smart_pin_operations"
type: "method"
description: |
  Write the Y parameter register of one or more smart pins.
  The Y register typically holds data to transmit, duty cycle values, or count values.
  Meaning depends on the smart pin mode set by WRPIN.

syntax: "WYPIN(PinField, YValue)"

parameters:
  - name: "PinField"
    type: "pin_field"
    description: |
      Specifies which pin(s) to write. Can be:
      - Single pin number (0-63)
      - Pin range using '..' operator, written Top..Bottom (e.g. 15..8 is pins 8 through 15; wraps within the 32-pin block if Top < Bottom)
      - Multiple pins using ADDPINS operator
      - Variable or expression that evaluates to a pin field
      
  - name: "YValue"
    type: "long"
    description: |
      32-bit value for Y register.
      Interpretation depends on smart pin mode:
      - Data byte/word/long for serial modes
      - Duty cycle for PWM modes
      - Count value for pulse modes

returns: "none"

y_register_usage_by_mode:
  serial_modes: |
    Data to transmit:
    Y = word to send (async serial; word size set by X[4:0], 1 to 32 bits)
    Y = word to send (sync serial; word size set by X[4:0], 1 to 32 bits)
    
  pwm_modes: |
    Duty cycle value:
    Y[15:0] = output value, from 0 up to the frame period (X[31:16])
    
  pulse_modes: |
    Number of pulses/cycles:
    Y = pulse count
    
  dac_modes: |
    Output level (the 16-bit dither modes P_DAC_DITHER_RND and P_DAC_DITHER_PWM):
    Y[15:0] = 16-bit DAC value; values larger than $FF00 are invalid and are clipped down to $FF00

examples:
  - code: |
      ' Send byte via UART
      WYPIN(30, "A")  ' Send character 'A'
    description: "UART transmit character"
    
  - code: |
      ' Set 50% PWM duty cycle: frame of 1000 base periods, base period 1 clock
      period := 1000
      WXPIN(56, (period << 16) | 1)
      WYPIN(56, period / 2)  ' 50% duty
    description: "Set PWM duty cycle"
    
  - code: |
      ' Output 10 pulses
      WYPIN(pin, 10)
    description: "Generate pulse burst"
    
  - code: |
      ' Set DAC to mid-level
      WYPIN(dac_pin, $8000)  ' 16-bit mid-scale
    description: "Set DAC output level"
    
  - code: |
      ' Send 32-bit SPI data
      WYPIN(spi_pin, data_long)
    description: "SPI data transmission"

mode_specific_y_values:
  P_ASYNC_TX: "Word to transmit, 1 to 32 bits (word size set by X[4:0])"
  P_ASYNC_RX: "Not documented: a WYPIN parameter for this mode"
  P_PULSE: "Number of pulses"
  P_TRANSITION: "Number of transitions"
  P_NCO_FREQ: "Frequency increment, added into the NCO accumulator at each base period"
  P_NCO_DUTY: "Duty increment, added into the NCO accumulator at each base period"
  P_PWM_TRIANGLE: "Output value, 0 to the frame period X[31:16]"
  P_PWM_SAWTOOTH: "Output value, 0 to the frame period X[31:16]"
  P_DAC_DITHER_RND: "16-bit DAC value (Y[15:0]; values above $FF00 are invalid and clip to $FF00)"
  P_DAC_DITHER_PWM: "16-bit DAC value (Y[15:0]; values above $FF00 are invalid and clip to $FF00)"
  P_REPOSITORY: "Not a Y mode: the repository long is written with WXPIN"

data_transmission:
  uart_send: |
    PUB send_byte(pin, data)
      WYPIN(pin, data)
      REPEAT WHILE RDPIN(pin) & $8000_0000  ' Wait for completion: the busy flag comes back in bit 31

  pwm_update: |
    CON
      X_VALUE = 1000                ' frame period previously set with WXPIN

    PUB set_duty_percent(pin, percent) | duty
      duty := X_VALUE * percent / 100
      WYPIN(pin, duty)
      
  burst_output: |
    PUB send_burst(pin, count)
      WYPIN(pin, count)
      ' Pin outputs 'count' pulses

smart_pin_data_flow:
  write: "WYPIN writes to Y register"
  process: "Smart pin uses Y based on mode"
  status: "Check completion with RDPIN"
  next: "Write new value to Y for next operation"

related_methods:
  - "WRPIN"
  - "WXPIN"
  - "RDPIN"
  - "RQPIN"
  - "AKPIN"

notes:
  - "Y register is mode-dependent"

timing_notes:
  - "Write takes effect based on mode"
  - "Async serial transmit: the word goes into a one-stage buffer and is sent once it advances into the shifter; sync serial transmit: the word is shifted out by clocks on the B input"
  - "PWM modes: Y is captured at the start of each PWM frame"
  - "Pulse and transition modes: a non-zero Y starts the output at the next base period"

multi_cog_access:
  - "Cogs that execute WRPIN, WXPIN, WYPIN, RDPIN or AKPIN on the same smart pin must do so at different times; their buses to the pin are OR'd and simultaneous writes clobber each other"
  - "Any number of cogs can read a smart pin at the same time with RQPIN, which does not use the cog-to-smart-pin bus"

warnings:
  - "Must set correct mode first with WRPIN"

see_also:
  - "language/spin2/methods/wrpin.yaml"
  - "language/spin2/methods/wxpin.yaml"
  - "language/spin2/methods/rdpin.yaml"
  - "architecture/smart_pins.yaml"

sources:
  - "multi_cog_access, mode_specific_y_values (P_REPOSITORY): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PINS (cog-to-smart-pin buses) and SMART PIN MODES (%00001..%00011 long repository)"
  - "y_register_usage_by_mode.dac_modes and mode_specific_y_values (P_DAC_DITHER_RND, P_DAC_DITHER_PWM limit): Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, DAC 16-Bit With Noise Dither (%00010 and DAC_MODE) and DAC 16-Bit With PWM dither (%00011 and DAC_MODE), p.46"
  - "timing_notes (pulse and transition start at the next base period; PWM Y captured at frame start): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PIN MODES (%00100, %00101, %01000)"
  - "y_register_usage_by_mode.serial_modes, mode_specific_y_values (P_ASYNC_TX) and timing_notes (serial transmit): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PIN MODES (%11100 synchronous serial transmit, %11110 asynchronous serial transmit: words of 1 to 32 bits, X.[4..0] = bits minus 1, WYPIN loads a single-stage buffer)"