constant: DEBUG_END_SESSION
type: constant
category: Debug Constants

aliases:
  - DEBUG_END_SESSION

requires_version: "Spin2_v52"
version_directive: "{Spin2_v52}"

description: |
  Predefined constant (value 27) that, when sent via DEBUG(), cleanly ends the
  debug session. When it executes, any open DEBUG.LOG file and DEBUG window(s)
  are closed; if PNut was launched with `-rd`, PNut closes too. The P2 itself
  continues executing. Added to facilitate AI-assisted code development: an
  assistant deletes DEBUG.LOG, recompiles with `-rd`, then waits for DEBUG.LOG
  to be closed as the signal that the run's debug output is complete.
  REQUIRES: {Spin2_v52} or later version directive at start of source file.

value: 27

syntax: "DEBUG(DEBUG_END_SESSION)"

examples:
  - code: |
      {Spin2_v52}                              ' REQUIRED directive
      PUB main()
        debug("Starting program...")
        
        ' ... program execution ...
        
        debug("Program complete, closing debug")
        DEBUG(DEBUG_END_SESSION)               ' Closes debug window
    description: "Close debug session at program end"
    
  - code: |
      {Spin2_v52}                              ' REQUIRED directive
      PUB shutdown()
        debug("Shutting down...")
        waitms(100)                            ' Allow output to display
        DEBUG(DEBUG_END_SESSION)
        ' After this, debug window closes
    description: "Clean shutdown with debug closure"
    
  - code: |
      {Spin2_v52}                              ' REQUIRED directive
      PUB conditional_debug_end(close_debug)
        if close_debug
          debug("Closing debug session")
          DEBUG(DEBUG_END_SESSION)
    description: "Conditional debug session termination"
    
  - code: |
      {Spin2_v52}                              ' REQUIRED directive
      CON
        END_DEBUG = DEBUG_END_SESSION          ' Can use in CON assignments
      
      PUB cleanup()
        DEBUG(END_DEBUG)                       ' Same effect
    description: "Using constant in CON block"

debug_behavior:
  - step: "DEBUG(DEBUG_END_SESSION) executes on the P2"
  - step: "Any open DEBUG.LOG file is closed"
  - step: "Any open DEBUG window(s) are closed"
  - step: "If PNut was launched with `-rd`, PNut closes as well"
  - step: "The P2 continues executing (DEBUG_END_SESSION does not halt the chip)"

notes:
  - "REQUIRES {Spin2_v52} or later at start of source file (compiler-enforced gate)"
  - "Value is 27"
  - "Closes any open DEBUG.LOG file and DEBUG window(s); the P2 keeps executing"
  - "If PNut was launched with `-rd`, PNut closes too"
  - "Added for AI-assisted code development; the DEBUG.LOG close is the completion signal an assistant waits on"
  - "Can be used in CON block assignments"

related:
  - language/spin2/constants/debug-mask.yaml
  - language/spin2/constants/special-configuration-symbols.yaml

see_also:
  - "DEBUG commands"
  - "Debug session management"
  - "Program termination"

oneliner: "Constant (27) to programmatically end debug session (requires Spin2_v52)"
