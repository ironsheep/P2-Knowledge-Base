constant: NEWTASK
type: constant
category: Task Constants

requires_version: "Spin2_v47"
version_directive: "{Spin2_v47}"

description: |
  Constant for auto-assigning next available task ID. Used with TASKSPIN to 
  automatically select the next available task slot (0-31) instead of specifying 
  a fixed task number.
  REQUIRES: {Spin2_v47} or later version directive at start of source file.
value: -1
syntax: "TASKSPIN(NEWTASK, method(), @stack)"
examples:
  - code: |
      {Spin2_v47}                              ' REQUIRED directive
      VAR
        LONG worker_stack[64]
      
      PUB main()
        TASKSPIN(NEWTASK, worker(), @worker_stack)
    description: "Auto-assign task ID"
  - code: |
      {Spin2_v47}                              ' REQUIRED directive
      VAR
        LONG stacks[5 * 64]
      
      PUB main() | i
        repeat i from 0 to 4
          TASKSPIN(NEWTASK, handler(i), @stacks[i * 64])
    description: "Start multiple tasks with auto IDs"
notes:
  - "REQUIRES {Spin2_v47} or later at start of source file"
  - "Value is -1"
  - "Used with TASKSPIN for automatic task ID assignment"
  - "System finds next available task ID (0-31)"
  - "Returns error if no task slots available"
  - "Convenient when specific ID not needed"
related:
  - THISTASK
  - TASKSPIN
see_also:
  - "Task creation"
  - "Task constants"