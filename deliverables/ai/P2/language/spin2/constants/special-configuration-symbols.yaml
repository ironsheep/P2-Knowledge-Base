name: Special Configuration Symbols
description: |
  Special CON block symbols that configure system behavior, debug features, and clock settings.
  These are compile-time constants that affect how your program behaves.
category: Configuration Constants
documentation_level: complete

# Aliases for cross-reference resolution
# These allow references like "_clkfreq" or "DEBUG_DISABLE" to resolve to this document
aliases:
  # Clock configuration
  - _CLKFREQ
  - _clkfreq
  - _XTLFREQ
  - _xtlfreq
  - _XINFREQ
  - _xinfreq
  - _ERRFREQ
  - _errfreq
  - _RCSLOW
  - _rcslow
  - _RCFAST
  - _rcfast
  - _AUTOCLK
  - _CLKMODE
  - _clkmode
  # System configuration
  - DOWNLOAD_BAUD
  # Debug serial configuration
  - DEBUG_BAUD
  - DEBUG_PIN
  - DEBUG_PIN_TX
  - DEBUG_PIN_RX
  # Debug output control
  - DEBUG_DISABLE
  - DEBUG_TIMESTAMP
  - DEBUG_DELAY
  - DEBUG_LOG_SIZE
  # Debug cog/breakpoint control
  - DEBUG_COGS
  - DEBUG_MAIN
  - DEBUG_COGINIT
  # Debug window configuration
  - DEBUG_LEFT
  - DEBUG_TOP
  - DEBUG_WIDTH
  - DEBUG_HEIGHT
  - DEBUG_DISPLAY_LEFT
  - DEBUG_DISPLAY_TOP
  - DEBUG_WINDOWS_OFF

# Clock Configuration Constants
# Source: pnut_ts Clock-Configuration-Usage-Guide.md (compiler-verified)
clock_configuration:
  _CLKFREQ:
    description: |
      Desired system clock frequency in Hz. The compiler calculates PLL settings
      to achieve this frequency. If used alone, assumes 20 MHz crystal input.
    range: "3,333,333 Hz to 500,000,000 Hz"
    example: "CON _clkfreq = 200_000_000  ' 200 MHz using PLL"
    notes:
      - "Used by timing functions (WAITMS, WAITUS, WAITX)"
      - "If only _clkfreq specified, compiler assumes 20 MHz crystal"
      - "Combine with _xtlfreq or _xinfreq for non-20MHz input sources"
    behavior:
      alone: "PLL from assumed 20 MHz crystal"
      with_xtlfreq: "PLL from specified crystal frequency"
      with_xinfreq: "PLL from specified external clock"

  _XTLFREQ:
    description: |
      External crystal oscillator frequency in Hz. Use when your crystal is not
      the default 20 MHz. Can be used alone (direct crystal, no PLL) or with
      _clkfreq (crystal + PLL multiplication).
    range: "1 MHz to 60 MHz typical"
    example: "CON _xtlfreq = 25_000_000  ' 25 MHz crystal"
    notes:
      - "Crystals >= 16 MHz use 15pF internal loading capacitors"
      - "Crystals < 16 MHz use 30pF internal loading capacitors"
      - "Alone: runs at crystal frequency (no PLL)"
      - "With _clkfreq: enables PLL multiplication"

  _XINFREQ:
    description: |
      External clock input frequency in Hz. Use when driving XI pin from an
      external oscillator or clock source instead of a crystal.
    range: "250 kHz to 500 MHz"
    example: "CON _xinfreq = 10_000_000  ' 10 MHz external clock"
    notes:
      - "For external oscillator modules or shared clock sources"
      - "Alone: runs at input frequency (no PLL)"
      - "With _clkfreq: enables PLL multiplication"
    use_cases:
      - "Multiple P2 chips sharing a clock source"
      - "Precise frequency from external oscillator module"
      - "Synchronization with external system"

  _ERRFREQ:
    description: |
      Allowable PLL frequency error in Hz. The compiler iterates through PLL
      configurations to find the closest match within this error budget.
    default: "1,000,000 Hz (1 MHz)"
    example: "CON _errfreq = 500_000  ' Allow only 0.5 MHz error"
    notes:
      - "Tighter tolerance may fail if no valid PLL configuration exists"
      - "Relax tolerance for unusual target frequencies"

  _RCFAST:
    description: |
      Use internal RCFAST oscillator (~20 MHz). No external crystal required.
      Frequency varies with temperature (plus/minus 10 percent).
    value: "TRUE"
    example: "CON _rcfast = TRUE"
    notes:
      - "Overrides other clock settings"
      - "Minimal external components"
      - "Not suitable for precise timing requirements"
    use_cases:
      - "Crystal accuracy not required"
      - "Minimal BOM cost"
      - "Power-sensitive applications"

  _RCSLOW:
    description: |
      Use internal RCSLOW oscillator (~20 kHz). Extremely low power operation.
      Frequency varies significantly with temperature (plus/minus 50 percent).
    value: "TRUE"
    example: "CON _rcslow = TRUE"
    notes:
      - "Overrides other clock settings"
      - "Ultra-low power consumption"
      - "Timing accuracy not critical"
    use_cases:
      - "Sleep modes"
      - "RTC applications"
      - "Ultra-low power standby"

  _CLKMODE:
    description: |
      Clock mode configuration value (32-bit). Usually calculated automatically
      by the compiler based on _clkfreq and related settings.
    notes:
      - "Rarely specified directly - let compiler calculate"
      - "Contains PLL dividers, multipliers, and source selection"

clock_configuration_rules:
  rule_1:
    description: "Only ONE clock configuration per program"
    note: "Define clock constants in top-level object's CON block only"

  rule_2:
    description: "_clkfreq alone assumes 20 MHz crystal input"
    example: "_clkfreq = 200_000_000  ' Assumes 20 MHz crystal"

  rule_3:
    description: "_xtlfreq or _xinfreq alone runs at that frequency (no PLL)"
    example: "_xtlfreq = 20_000_000  ' Runs at exactly 20 MHz"

  rule_4:
    description: "Combining _clkfreq with _xtlfreq or _xinfreq enables PLL"
    example: |
      _xtlfreq = 25_000_000
      _clkfreq = 250_000_000  ' PLL: 25 MHz -> 250 MHz

  rule_5:
    description: "_rcfast and _rcslow override all other clock settings"
    note: "Internal oscillators ignore crystal/PLL configuration"

clock_configuration_examples:
  common_200mhz:
    description: "Most common: 200 MHz with default 20 MHz crystal"
    code: |
      CON
        _clkfreq = 200_000_000

  custom_crystal:
    description: "Using a 25 MHz crystal for 250 MHz operation"
    code: |
      CON
        _xtlfreq = 25_000_000
        _clkfreq = 250_000_000

  crystal_direct:
    description: "Run at crystal frequency without PLL"
    code: |
      CON
        _xtlfreq = 20_000_000  ' No _clkfreq = no PLL

  low_power:
    description: "Battery-powered without external crystal"
    code: |
      CON
        _rcfast = TRUE  ' ~20 MHz internal

  ultra_low_power:
    description: "Ultra-low power sleep mode"
    code: |
      CON
        _rcslow = TRUE  ' ~20 kHz internal

clock_anti_patterns:
  conflicting_sources:
    wrong: |
      CON
        _rcfast = TRUE
        _clkfreq = 200_000_000  ' ERROR: conflicting settings
    reason: "Cannot combine internal oscillator with PLL configuration"

  assumed_crystal:
    wrong: |
      CON
        _clkfreq = 200_000_000  ' Assumes 20 MHz crystal!
    note: "Only wrong if your actual crystal is not 20 MHz"
    correct: |
      CON
        _xtlfreq = 25_000_000   ' Specify actual crystal
        _clkfreq = 200_000_000

  unrealistic_error:
    wrong: |
      CON
        _xtlfreq = 12_000_000
        _clkfreq = 333_333_333
        _errfreq = 1  ' Unrealistic 1 Hz tolerance
    correct: |
      CON
        _xtlfreq = 12_000_000
        _clkfreq = 336_000_000  ' Achievable frequency
        _errfreq = 1_000_000    ' Reasonable tolerance

# System Configuration Symbols (non-clock)
system_configuration:
  DOWNLOAD_BAUD:
    description: Sets the download baud rate for programming the P2
    default: "2_000_000"
    example: "CON DOWNLOAD_BAUD = 115200"

# ============================================================================
# DEBUG Configuration Symbols
# ============================================================================
# The P2 debug system operates at three distinct levels. Understanding this
# distinction is critical for effective debugging.

debug_architecture:
  overview: |
    The P2 debug system operates at three distinct levels:
    1. Code Instrumentation (Compile-Time) - controls whether debug() generates code
    2. Debug Output Infrastructure (Runtime) - configures how debug output is transmitted
    3. Automatic Breakpoint Configuration - for single-step debugging

  level_1_code_instrumentation:
    name: "Code Instrumentation (Compile-Time)"
    description: |
      These constants control whether debug() statements are compiled into your program.
      They are evaluated during compilation. When debug is disabled, statements produce
      ZERO code - no runtime overhead whatsoever.
    symbols:
      - "DEBUG_DISABLE - Globally disable ALL debug statements"
      - "DEBUG_MASK - 32-bit mask for selective debug[N]() channels (requires {Spin2_v46})"

  level_2_output_infrastructure:
    name: "Debug Output Infrastructure (Runtime)"
    description: |
      These constants configure the debug output system that handles ALL debug() output.
      They affect how debug messages are transmitted and formatted at runtime.
    symbols:
      - "DEBUG_COGS - Which cogs can produce debug output"
      - "DEBUG_DELAY - Startup delay before debug begins"
      - "DEBUG_TIMESTAMP - Enable timestamps in output"
      - "DEBUG_PIN_TX/RX - Serial communication pins"
      - "DEBUG_BAUD - Serial baud rate"

  level_3_breakpoint_config:
    name: "Automatic Breakpoint Configuration"
    description: |
      These constants configure automatic breakpoints for single-step debugging.
      They tell the debugger to break execution at specific points.
    symbols:
      - "DEBUG_MAIN - Break at program start"
      - "DEBUG_COGINIT - Break when any cog is initialized"

debug_serial:
  DEBUG_BAUD:
    description: Sets the DEBUG serial baud rate
    default: "DOWNLOAD_BAUD (typically 2_000_000)"
    example: "CON DEBUG_BAUD = 115200"
    notes: "May need DEBUG_DELAY if slower than DOWNLOAD_BAUD"
    
  DEBUG_PIN_TX:
    description: Sets the DEBUG serial output pin
    default: "62"
    notes: "Must be 62 for DEBUG windows to open"
    
  DEBUG_PIN_RX:
    description: Sets the DEBUG serial input pin for PC interaction
    default: "63"
    
  DEBUG_PIN:
    description: Legacy/shorthand for DEBUG_PIN_TX when RX not needed
    default: "62"

debug_output_control:
  DEBUG_TIMESTAMP:
    description: Adds 64-bit CT timestamp to each DEBUG message
    default: "undefined"
    usage: "CON DEBUG_TIMESTAMP = 1"
    
  DEBUG_MASK:
    description: |
      32-bit mask for selective DEBUG compilation.
      Use DEBUG[bit](params) to gate specific debug statements.
      Each bit corresponds to a debug channel (0-31).
      REQUIRES: {Spin2_v46} or later version directive.
    requires_version: "Spin2_v46"
    version_directive: "{Spin2_v46}"
    default: "undefined"
    example: |
      {Spin2_v46}
      CON
        DEBUG_MASK = %00001111  ' Enable channels 0-3
      
      PUB main()
        DEBUG[0]("Channel 0 message")   ' Compiled - bit 0 set
        DEBUG[1]("Channel 1 message")   ' Compiled - bit 1 set
        DEBUG[4]("Channel 4 message")   ' NOT compiled - bit 4 not set
    notes:
      - "Requires {Spin2_v46} or later at start of source file"
      - "Standard debug() without channel number is always available"
      - "Each bit enables corresponding debug[N]() channel"
      - "Mask of 0 disables all numbered channels"
      - "Mask of $FFFF_FFFF enables all 32 channels"
    
  DEBUG_DELAY:
    description: Startup delay in milliseconds before DEBUG messages begin
    default: "0"
    example: "CON DEBUG_DELAY = 500  ' Wait 500ms"
    
  DEBUG_LOG_SIZE:
    description: Maximum size in bytes for DEBUG.log file (0 = no log)
    default: "0"
    example: "CON DEBUG_LOG_SIZE = 10000  ' 10KB log file"
    
  DEBUG_DISABLE:
    description: |
      Globally disables ALL debug statements at compile time. When defined as
      any non-zero value, debug code is not compiled at all, resulting in smaller
      binary size and zero runtime overhead.
    default: "undefined (debug enabled)"
    behavior:
      undefined: "Debug statements compile normally (when -d flag used)"
      zero: "Debug statements compile normally"
      non_zero: "ALL debug statements skipped during compilation"
    usage: "CON DEBUG_DISABLE = 1  ' Turn off all DEBUG"
    example: |
      CON
        RELEASE_BUILD = 1
        DEBUG_DISABLE = RELEASE_BUILD   ' Disable debug for release builds
    notes:
      - "Must be defined as an integer constant (not float or string)"
      - "Check is performed at compile time - disabled debug adds zero overhead"
      - "Works in both Spin2 and PASM2 code"

debug_debugger_control:
  DEBUG_COGINIT:
    description: Auto-enter PASM debugger when COGINIT occurs
    default: "undefined"
    usage: "CON DEBUG_COGINIT = 1"
    
  DEBUG_MAIN:
    description: |
      Enter PASM debugger at main, ready to single-step.
      DEBUG() statements ignored until "DEBUG" sensitivity selected.
    default: "undefined"
    usage: "CON DEBUG_MAIN = 1"
    
  DEBUG_COGS:
    description: |
      8-bit mask specifying which cogs have debug capability enabled at runtime.
      Each bit corresponds to a cog (bit 0 = cog 0, bit 7 = cog 7). If a cog's
      bit is clear, debug() statements running on that cog will NOT produce output,
      even if the code was compiled.
    default: "%11111111 (all cogs)"
    bit_mapping:
      bit_0: "Cog 0"
      bit_1: "Cog 1"
      bit_2: "Cog 2"
      bit_3: "Cog 3"
      bit_4: "Cog 4"
      bit_5: "Cog 5"
      bit_6: "Cog 6"
      bit_7: "Cog 7"
    example: "CON DEBUG_COGS = %00001111  ' Only cogs 0-3"
    interaction_with_debug_mask: |
      DEBUG_COGS and DEBUG_MASK operate at different levels and are independent:
      - DEBUG_MASK (compile-time): Controls whether debug[N]() generates code
      - DEBUG_COGS (runtime): Controls whether a cog can produce debug output

      For a debug[N]() statement to produce output, BOTH must allow it:
      1. Bit N must be set in DEBUG_MASK (code is compiled)
      2. The cog's bit must be set in DEBUG_COGS (cog can trigger output)
    notes:
      - "Useful for reducing debug overhead in multi-cog applications"
      - "By default, all cogs are debugged if DEBUG_COGS is not defined"
      - "Must be defined as an integer constant"
    
  DEBUG:
    description: |
      Command (no parentheses) that enters single-step PASM debugger.
      Not a CON symbol but a statement used in code.
    usage: "DEBUG  ' Enter debugger (no parentheses)"
    notes: "Different from DEBUG(...) which outputs data"

debug_display_windows:
  DEBUG_LEFT:
    description: Left screen coordinate for DEBUG message window
    default: "(dynamic)"
    
  DEBUG_TOP:
    description: Top screen coordinate for DEBUG message window
    default: "(dynamic)"
    
  DEBUG_WIDTH:
    description: Width of DEBUG message window
    default: "(dynamic)"
    
  DEBUG_HEIGHT:
    description: Height of DEBUG message window
    default: "(dynamic)"
    
  DEBUG_DISPLAY_LEFT:
    description: Overall left screen offset for DEBUG displays (adds to POS x)
    default: "0"
    
  DEBUG_DISPLAY_TOP:
    description: Overall top screen offset for DEBUG displays (adds to POS y)
    default: "0"
    
  DEBUG_WINDOWS_OFF:
    description: Disables DEBUG windows from opening (set to non-zero)
    default: "0"
    example: "CON DEBUG_WINDOWS_OFF = 1  ' No windows"

usage_examples:
  basic_debug_config: |
    CON
      ' Serial configuration
      DOWNLOAD_BAUD = 115200
      DEBUG_BAUD = 115200
      DEBUG_DELAY = 100        ' Wait 100ms before debug output
      
      ' Clock configuration
      _CLKFREQ = 200_000_000   ' 200 MHz
      
  selective_debug: |
    {Spin2_v46}                          ' Required for DEBUG_MASK/debug[N]()
    CON
      DEBUG_MASK = %00000011             ' Enable debug channels 0 and 1
      
    PUB main()
      DEBUG[0]("Development message")   ' Compiled - bit 0 set
      DEBUG[1]("Testing message")       ' Compiled - bit 1 set
      DEBUG[2]("This won't compile")    ' NOT compiled - bit 2 not set
      DEBUG("Always available")         ' Standard debug() always works
      
  debugger_control: |
    CON
      DEBUG_COGINIT = 1        ' Auto-debug new cogs
      DEBUG_COGS = %00000011   ' Only cogs 0 and 1
      
    PUB main()
      DEBUG                    ' Enter single-step debugger
      
  window_positioning: |
    CON
      DEBUG_LEFT = 100
      DEBUG_TOP = 50
      DEBUG_WIDTH = 800
      DEBUG_HEIGHT = 600

# Compiler error messages for debug configuration
debug_error_messages:
  - error: "DEBUG_DISABLE can only be defined as an integer constant"
    cause: "Non-integer value used for DEBUG_DISABLE"
  - error: "DEBUG_MASK can only be defined as an integer constant"
    cause: "Non-integer value used for DEBUG_MASK"
  - error: "DEBUG_COGS can only be defined as an integer constant"
    cause: "Non-integer value used for DEBUG_COGS"
  - error: "DEBUG_DELAY can only be defined as an integer constant"
    cause: "Non-integer value used for DEBUG_DELAY"
  - error: "DEBUG_PIN can only be defined as an integer constant"
    cause: "Non-integer value used for DEBUG_PIN"
  - error: "DEBUG_PIN_TX can only be defined as an integer constant"
    cause: "Non-integer value used for DEBUG_PIN_TX"
  - error: "DEBUG_PIN_RX can only be defined as an integer constant"
    cause: "Non-integer value used for DEBUG_PIN_RX"
  - error: "DEBUG_BAUD can only be defined as an integer constant"
    cause: "Non-integer value used for DEBUG_BAUD"
  - error: "DEBUG mask bit-number must be 0..31"
    cause: "Channel number outside valid range in debug[N]()"
  - error: "DEBUG_MASK symbol must be defined for DEBUG[0..31] usage"
    cause: "Using debug[N]() without defining DEBUG_MASK constant"

notes:
  - "These symbols must be defined in the CON block"
  - "They affect compile-time and runtime behavior"
  - "Undefined symbols use their defaults"
  - "DEBUG() with parentheses outputs data"
  - "DEBUG without parentheses enters debugger"
  - "DEBUG_MASK requires {Spin2_v46} version directive for debug[N]() syntax"

