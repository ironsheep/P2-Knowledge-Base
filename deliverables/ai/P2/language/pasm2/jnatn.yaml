instruction: JNATN
syntax: JNATN   {#}S
syntax_variants:
- JNATN {#}S
category: Event
description: >-
  JNATN checks the cog's attention signal and jumps to the address described by Src
  if the ATN event flag is clear. The cog's attention signal, when set, indicates
  that one or more cogs are requesting this cog's attention via COGATN; a COGATN
  that names this cog's own bit also sets it. The ATN event flag is cleared by JNATN
  whether or not the branch is taken, unless the event sets it again.

  The address (Src) can be absolute or relative. To specify an absolute address,
  Src must be a register containing a 20-bit address value. To specify a relative
  address, use #Label for a 9-bit signed offset (a range of -256 to +255
  instructions). Offsets are relative to the
  instruction following the JNATN. The signed offset value is in units of whole
  instructions-- it is added to PC as-is when in Cog/LUT execution mode and is
  multiplied by 4 then added to PC when in Hub execution mode (long-aligned Hub
  code not required).
  ##Label (or a prior AUGS instruction) assembles as an AUGS word plus the
  instruction, with an 18-bit offset field; the rule above is for #Label, and a
  backward ##Label in Cog execution is covered under anti_patterns.
flags_affected:
  C: No effect
  Z: No effect
parameters:
- 'Src is a register, 9-bit literal, or ## augmented literal whose value is the
  absolute or relative address to set PC to. Use # for relative addressing; omit #
  for absolute addressing.'
timing:
  cycles: '2 or 4 (cog/LUT) / 2 or 13...20 (hub-exec)'
  type: variable
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1011110 01I 000011110 SSSSSSSSS
  write: PC
  c: —
  z: —
  clocks: 2 or 4 / 2 or 13...20
encoding_notes:
- PC is written only when the ATN event flag is clear.
anti_patterns:
- pattern: "Backward JNATN ##Label"
  reason: >-
    Not documented: whether a backward JNATN ##Label lands on its label. JNATN shares
    DJNZ's encoding (AUGS plus the instruction, an 18-bit field as assembled), and
    only backward DJNZ has been run: a target 303 longs back (field -303) landed on its
    label in Hub execution and missed it in Cog execution, going to hub at PC plus
    the field taken as a positive offset. A near #Label (within -256 to +255
    instructions) avoids the ##Label form. A register holding the target
    address as Src assembles with no AUGS word (assembled for DJNZ, TJS and JINT
    only; not run on the board). Parallax's documents also give the ##Label form a 20-bit signed
    offset (-524288 to +524287).
  source: "P2 hardware verification, EF-107 (backward DJNZ only; this instruction not run); CP-031 (the ## S-branch assembles an AUGS word plus the instruction, an 18-bit offset field; shown for DJNZ and TJZ of the family); CP-056 (a backward ##label assembles for all 47 S-branch instructions as AUGS plus the instruction with an 18-bit field that counts longs, -303 for this distance; a register Src assembles with no AUGS for DJNZ, TJS and JINT, assembled only, not run on the board); Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, JATN / JNATN, p.90 (##Label given as a 20-bit signed offset, -524288 to +524287)"
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, JATN / JNATN, p.90"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 211 (JNATN {#}S: jump to S if ATN event flag is clear; 2 or 4 cog/LUT, 2 or 13...20 hub; footnote: if #S and cogex PC += signed(S), if #S and hubex PC += signed(S*4), if S PC = register S) and the Datasheet instruction table, p.42"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, JATN / JNATN, p.90 (encoding table 2 or 4 / 2 or 13-20, write PC, footnote 1 'PC is written only when the ATN event flag is set (or is clear in syntax 2)'; attention signal explanation; absolute address in a register of 20 bits, #Label 9-bit signed offset -256 to +255 instructions, offsets in whole instructions in cog/LUT mode and times 4 in hub mode; the manual's text gives the ## offset as 20-bit)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), EVENTS, POLLATN/WAITATN event flag ('Also cleared on POLLATN/WAITATN/JATN/JNATN'); instruction encoding listing (EEEE 1011110 01I 000011110 SSSSSSSSS JNATN S/#rel9)"
  - "CP-031, shown for DJNZ and TJZ of the same S-branch family (the 9-bit S field is in instructions in cog and times four in hub; the ## S-branch assembles an AUGS word plus the instruction, an 18-bit offset field)"
  - "EF-099 (COGATN with the issuing cog's own bit raises that cog's attention event; detectors POLLATN WC, JATN, SETQ plus WAITATN WC, Spin2 POLLATN(); JNATN not run, it reads the same flag)"
