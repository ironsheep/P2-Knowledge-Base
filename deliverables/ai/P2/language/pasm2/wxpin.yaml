instruction: WXPIN
syntax: WXPIN   {#}D,{#}S
encoding:
- bits: EEEE 1100000 1LI DDDDDDDDD SSSSSSSSS
  write: —
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
  in_flag_reset_latency: |
    After WXPIN executes (which acknowledges the Smart Pin), the Smart Pin requires
    2 system-clock cycles to reset the IN flag to logic-0 before a program can poll
    the flag again. Insert NOP instructions before testing the IN flag.
description: Set "X" of smart pins S[10:6]+S[5:0]..S[5:0] to D, acknowledge smart
  pins. Wraps within A/B pins. Prior SETQ overrides S[10:6].
flags_affected:
  C: No effect
  Z: No effect
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release (2022/11/01), Propeller 2 Assembly Language (PASM2) in Brief, p.153; P2 Instructions v35 - Rev B/C Silicon, Sheet1"
documentation_level: enhanced
