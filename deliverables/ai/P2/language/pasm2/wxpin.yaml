instruction: WXPIN
syntax: WXPIN   {#}D,{#}S
encoding:
- bits: EEEE 1100000 1LI DDDDDDDDD SSSSSSSSS
  write: —
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
  in_flag_reset_latency: |
    After WXPIN executes (which acknowledges the Smart Pin), the Smart Pin requires
    2 system-clock cycles to reset the IN flag to logic-0 before a program can poll
    the flag again. A NOP between the WXPIN and the poll elapses those clocks.
description: 'Set "X" of smart pins S[10:6]+S[5:0]..S[5:0] to D, acknowledge smart
  pins. Wraps within A/B pins. A prior SETQ overrides S[10:6] with the low five bits
  of the SETQ value; an ALTx between the SETQ and WXPIN keeps the override, and a
  SETQ separated from WXPIN by other instructions is not documented.


  Cogs that execute WRPIN, WXPIN, WYPIN, RDPIN or AKPIN on the same smart pin must do
  so at different times: the pin OR''s the write-data and acknowledgement buses of all
  cogs, and simultaneous use clobbers the bus data.


  In long repository mode (%00001..%00011 without DAC_MODE), WXPIN writes the long
  while DIR is high and is ignored during reset (DIR low).'
sources:
  - "description (set X of smart pins S[10:6]+S[5:0]..S[5:0] to D, acknowledge; wraps within A/B pins; prior SETQ overrides S[10:6]; 2 clocks): P2 Instructions v35 - Rev B/C Silicon, row 218; Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), list of changes (WRPIN/WXPIN/WYPIN/AKPIN can now work on a span of pins, +S[10:6] pins; prior SETQ overrides S[10:6])"
  - "description (an ALTx between the SETQ and WXPIN keeps the override): Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ALTB, pp.38-39 (SETQ / SETQ2 does not affect ALTx instructions; the Q value passes through to the next instruction); a SETQ separated by other instructions is in no source"
  - "timing (WXPIN acknowledges the smart pin; two clocks for IN to drop before it can be polled again): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PINS"
  - "description (multi-cog bus rule; long repository): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PINS and SMART PIN MODES (%00001..%00011 long repository)"
