instruction: AUGS
syntax: 'AUGS #Src'
brief_description: Augment source
category: Miscellaneous
description: >-
  AUGS is an assistant instruction to aid with literal values that exceed 9 bits.
  Most PASM2 instructions have 9 bits available for literal Src values; enough
  for many uses, but not all. AUGS augments the next occurrence of a literal Src
  value to be a full 32-bits. When the instruction with the soon-to-be-augmented
  literal is later executed, the cog uses the lower 9 bits encoded in the
  instruction's Src field and prepends AUGS's 23 bits to it.
result: >-
  The 23-bit value formed from Src is queued to prefix the next literal Src
  occurrence (#Src) to form a 32-bit literal for that instruction; interrupts
  are also temporarily disabled.
parameters:
- Src is a 32-bit literal whose upper 23 bits are prepended to the next literal
  Src occurrence.
usage_notes: >-
  All instructions following AUGS are shielded from interrupt until after the
  instruction with the newly-augmented literal Src value is executed.

  Src value augmentation occurs in the instruction pipeline only; code is not
  altered, value does not persist.

  SETQ / SETQ2 does not affect AUGS-- the Q value passes through to the next
  instruction.

  Tip: Though AUGS may be manually entered wherever needed, the Parallax P2
  compiler supports a convenient way to use this feature. In the target
  instruction's Src field, use "##" followed by the desired 32-bit literal
  (instead of "#" followed by a 9-bit literal); the compiler will automatically
  invoke AUGS immediately before. When counting clock cycles, make sure to
  account for 2 extra clock cycles for instructions containing ## augmented
  literals.

  The augment applies to the next instruction that has an immediate Src; AUGS does not
  have to immediately precede it. With a NOP, an ROR or two NOPs between them, the
  augmented immediate is still applied (tested with those intervening paths).

  Under SKIP and SKIPF the AUGS that a ## operand emits takes its own skip-pattern bit.
  When the augmented instruction is skipped but its AUGS is not, the AUGS stays pending and
  augments the next instruction with an immediate (tested after SKIP and SKIPF, in cog RAM,
  with skip patterns 0, %0010, %0100 and %1000).

  Not documented: what happens when a second AUGS executes before the first
  AUGS has been used by an instruction with an immediate Src.
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 11110nn nnn nnnnnnnnn nnnnnnnnn
  write: Hidden S Queue
  c: —
  z: —
  clocks: '2'
flags_affected:
  C: No effect
  Z: No effect
silicon_errata:
  setq_ptrx_block_size_delta_cancelled:
    description: |
      AUGS placed between SETQ/SETQ2 and RDLONG/WRLONG/WMLONG-PTRx cancels the
      special-case block-size PTRx delta. The expected number of longs transfers
      correctly, but PTRx is modified only according to the normal PTRx expression
      behavior instead of the block-size delta.
    workaround: "Do not place AUGS (or ALTx/AUGD) between SETQ/SETQ2 and the RDLONG/WRLONG/WMLONG-PTRx instruction; keep SETQ adjacent to the block transfer."
    status: "Listed among the known silicon bugs."
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), KNOWN SILICON BUGS ('Intervening ALTx/AUGS/AUGD instructions between SETQ/SETQ2 and RDLONG/WRLONG/WMLONG-PTRx instructions will cancel the special-case block-size PTRx deltas'); hardware-verification ledger EF-067 (the PTRx step after SETQ, ALTD and a block RDLONG/WRLONG is the plain PTRx expression's own step: +4 for ptra++, +12 for ptra++[3]; AUGS and AUGD not tested)"
  intervening_altx_immediate_s_consumes_augs:
    description: |
      An ALTx instruction with an immediate #S operand, placed between AUGS and the AUGS'
      intended target instruction (which also has an immediate #S operand), will use the
      AUGS value without cancelling it. The intended target still uses and cancels the AUGS
      value as expected -- but the intervening ALTx has also been augmented.
      Where the damage lands: an ALTx takes its base register
      from S[8:0] and its D-register auto-increment from S[17:9]. The augment leaves S[8:0]
      alone, so the substituted register is the intended one; the auto-increment is taken
      from the AUGS value instead, moving the ALTx's D register.
    example: |
      AUGS  #$FFFFF123        ' This AUGS is intended for the ADD instruction
      ALTD  index,#base       ' Look out! AUGS augments this #base too. Use a register instead.
      ADD   0-0,#$123         ' #$123 is augmented by the AUGS and cancels the AUGS
    workaround: "Use a register (not an immediate #S) for the S operand of any ALTx placed between AUGS and its target."
    status: "Listed among the known silicon bugs."
    scope_note: "Applies to a pending AUGS. A pending AUGD is not consumed by an intervening ALTS. This is separate from the block-size PTRx-delta entry above, which an intervening ALTx, AUGS or AUGD each trigger."
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), KNOWN SILICON BUGS (the AUGS / immediate-#S ALTx entry and its example); hardware-verification ledger EF-066 (AUGS #$3C5C0A55, S[17:9] = 5: ALTD idx,#0 and ALTR idx,#3 each stepped idx by 5; a register S on the ALTx leaves idx unstepped; AUGD / ALTS idxs,#0 / WRLONG #$13C wrote $1357_9B3C with idxs unchanged; one ALTx variant, ALTS, tested for the AUGD half)"
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, AUGS, p.51"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 408 (AUGS #n: EEEE 11110nn nnn nnnnnnnnn nnnnnnnnn; queue #n as the upper 23 bits for the next #S occurrence; next instruction shielded from interrupt; 2 clocks)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 11110NN NNN NNNNNNNNN NNNNNNNNN AUGS #N)"
  - "EF-033 (AUGS survives intervening instructions: a NOP, an ROR or two NOPs between the AUGS and its target, one real-P2 test; a fourth path with an intervening ADD #S gave the same value and is not restated because the record does not say whether that ADD was the target); EF-091 (the ## AUGS takes its own skip-pattern bit under SKIP and SKIPF; a skipped target leaves the AUGS pending for the next immediate; patterns 0, %0010, %0100, %1000, cog RAM)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, AUGS, p.51 (the encoding table writes the 23 bits as SS SSS SSSSSSSSS SSSSSSSSS; description, notes, tip, both examples)"
documentation_level: comprehensive
last_updated: '2025-11-26'
manual_extraction_date: '2025-01-19'
oneliner: Augment next literal Src to 32-bits
aliases:
- "An Immediate ALTx Takes a Pending AUGS"
- "ALTx immediate S consumes AUGS"
