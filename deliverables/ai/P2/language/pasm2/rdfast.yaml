instruction: RDFAST
syntax: RDFAST  {#}D,{#}S
encoding:
- bits: EEEE 1100011 1LI DDDDDDDDD SSSSSSSSS
  write: —
  c: —
  z: —
  clocks: '2 or WRFAST finish + 10...17'
timing:
  cycles: 2
  type: fixed
description: 'Begin new fast hub read via FIFO. D[31] = no wait, D[13:0] = block size
  in 64-byte units (0 = max), S[19:0] = block start address. The FIFO then reads hub
  sequentially and refills in the background; the cog takes the data with
  RFBYTE/RFWORD/RFLONG, or the streamer consumes it.'
flags_affected:
  C: No effect
  Z: No effect
documentation_source: enhanced
documentation_level: comprehensive
examples:
- name: Fast Checksum Calculation
  description: Verify application checksum by summing FIFO-read longs
  code: "' Verify application checksum\n        rdfast  #0, #0                  ' Sum\
    \ all application longs\n        rep     #2, app_longs2\n        rflong  x\n\
    \        add     app_sum, x        wz    ' z=1 if verified\n"
  source: "flash_loader.spin2 -- engineering/ingestion/sources/flash-loader/flash_loader.spin2:270-273"
- name: Block Copy with FIFO
  description: Fast block copy using FIFO for reading
  code: "' Copy block using FIFO read and sequential write\n        rdfast  #0, source_addr\
    \          ' Start FIFO read\n        mov     ptrb, dest_addr          ' Destination\
    \ pointer\n        mov     count, block_size\n        \n.copy   rflong  temp \
    \                    ' Read via FIFO\n        wrlong  temp, ptrb++           \
    \  ' Write and increment\n        djnz    count, #.copy\n"
  source: memory_operations
- name: CRC Calculation
  description: Calculate CRC over memory region
  code: "' CRC-16 calculation over data\n        rdfast  #0, data_addr           \
    \ ' Start FIFO\n        mov     crc, ##$FFFF             ' Initial CRC value\n\
    \        mov     count, data_length\n        \n.crc_loop\n        rfbyte  data\
    \                     ' Get next byte\n        xor     crc, data             \
    \   ' XOR with CRC low byte\n        mov     bit_count, #8            ' Process\
    \ 8 bits\n        \n.bit_loop\n        shr     crc, #1             wc   ' Shift\
    \ right, get bit\nif_c    xor     crc, ##$A001             ' Apply polynomial\
    \ if bit set\n        djnz    bit_count, #.bit_loop\n        djnz    count, #.crc_loop\n\
    \        \n        xor     crc, ##$FFFF             ' Final XOR\n        ret\n"
  source: data_integrity
related_instructions:
- RFBYTE: Read byte via FIFO
- RFWORD: Read word via FIFO
- RFLONG: Read long via FIFO
- WRFAST: Begin fast hub write via FIFO
- FBLOCK: Set the next start address and 64-byte block count, taken when the current blocks are fully read (2 clocks, never waits)
notes:
- "D[31]=0 (waiting form): waits for any previous WRFAST to finish, then until the FIFO has begun receiving hub data, so the next instruction can read it (P2 Silicon Doc, FAST SEQUENTIAL FIFO INTERFACE); measured 10-17 clocks."
- "D[31]=1 (no-wait form): takes 2 clocks; the Silicon Doc requires 'a sufficient number of clocks' before reading FIFO data. Measured: the first correct RFxxxx read comes 8-15 clocks after the RDFAST starts, by hub alignment; an earlier read returns $0000_0000 with no error. Allow at least 15 clocks (e.g. WAITX #11 directly after it)."
- "After a no-wait RDFAST, start no hub instruction (RDxxxx, WRxxxx, SETQ block, another RDFAST) for 16 clocks -- see silicon_errata.no_wait_rdfast_releases_next_hub_op. A no-wait WRFAST has no such effect."
- Block size is in 64-byte units; 0 means maximum (16384 blocks = 262,144 longs)
- FIFO automatically wraps at block boundary
- Critical for high-throughput data processing

silicon_errata:
  no_wait_rdfast_releases_next_hub_op:
    condition: "A hub instruction started fewer than 16 clocks after the start of a no-wait RDFAST (D[31]=1), while it still waits for its hub slot. Cog execution (hub execution cannot use RDFAST)."
    effect: "It can complete before its own hub access (43 of 64 hub alignments at the next instruction; none from 16 clocks): RDBYTE/RDWORD/RDLONG return the PREVIOUS hub read's data (byte/word at their own offset) with that value's C/Z, and PTRA++ still steps; WRBYTE/WRWORD/WRLONG is lost if a hub read follows at once; a SETQ block RDLONG writes one wrong long, leaves the rest unwritten and can overwrite cog registers outside its destination, or the cog does not finish; a blocking RDFAST issued 8-15 clocks after it takes 2 clocks without waiting and the next RFLONG returns $0000_0000. Nothing flags any of these."
    workaround: "Rule at each use: use the waiting form (D[31]=0), or start the next hub instruction at least 16 clocks after the no-wait RDFAST starts -- e.g. WAITX #12 directly after it (2 + 14 = 16 clocks), or 7 two-clock non-hub instructions (a SETQ counts as one). The waiting form and the 16-clock spacing are proven on silicon for every read and write width, SETQ block reads and a following RDFAST (spacing tested with WAITX and NOPs only)."
    not_affected: "A no-wait WRFAST releases nothing. A blocking first RDFAST removes the RDFAST-after-RDFAST case."
    untested: "RETA and other hub-stack instructions, WMLONG, SETQ2 block reads, SETQ block writes, an interrupt inside the window, the streamer."
    source: "Hardware-verified on Rev C silicon, 200 MHz: EF-074, EF-077, EF-084, EF-086, EF-087, EF-088. Not listed in the Silicon Doc's KNOWN BUGS. P2 Errata E7."

streamer_pairing:
  rule: |
    Use RDFAST before any streamer command that moves data from hub
    memory OUT to pins (e.g., X_RFBYTE_*, X_RFLONG_* modes). The FIFO
    pre-fetches hub data for the streamer to consume.
  direction_from_cogs_perspective: "RDFAST = 'I, the cog, am about to read from hub' — and yes, the streamer/FIFO is the agent doing that reading"
  paired_with: language/pasm2/wrfast.yaml
  verb_clarification: |
    The verb names can mislead. From the COG's perspective, RDFAST means
    "set up the FIFO so reads-from-hub will be fast" — which serves any
    streaming OUTPUT operation (hub → FIFO → streamer → pin). WRFAST
    similarly sets up writes-to-hub, which serves streaming INPUT
    (pin → streamer → FIFO → hub). The streamer's direction is the
    INVERSE of the verb's apparent direction.
  example_source: "Parallax P2 flash_loader.spin2 line 109 (RDFAST → output stream to spi_di)"
