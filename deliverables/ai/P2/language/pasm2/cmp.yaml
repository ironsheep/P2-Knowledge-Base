instruction: CMP
syntax: CMP Dest, {#}Src {WC|WZ|WCZ}
brief_description: Compare
category: Math and Logic
description: CMP compares the unsigned values of Dest and Src (by subtracting Src from Dest) and optionally setting the C and Z flags accordingly. If the WC or WCZ effect is specified, the C flag is set (1) if Dest is less than Src. If the WZ or WCZ effect is specified, the Z flag is set (1) if Dest equals Src. To compare unsigned, multi-long values, use CMP followed by CMPX.
result: Greater/lesser and equality status is optionally written to the C and Z flags.
parameters:
- Dest is the register containing the value to compare with that of Src.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value is compared to Dest.
flags_affected:
  C: Set if unsigned D < S (borrow from subtraction)
  Z: Set if D == S
syntax_variants:
- CMP Dest, {#}Src {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 0010000 CZI DDDDDDDDD SSSSSSSSS
  write: —
  c: Unsigned (D < S)
  z: D==S
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, CMP, p.59"
documentation_level: comprehensive
last_updated: '2025-09-19'
manual_extraction_date: '2025-01-19'
oneliner: Compare two unsigned values
related:
- CMPR
- CMPX
- CMPS
- CMPSX
