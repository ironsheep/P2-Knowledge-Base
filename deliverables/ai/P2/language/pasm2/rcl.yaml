instruction: RCL
syntax: RCL Dest, {#}Src {WC|WZ|WCZ}
brief_description: Rotate carry left
category: Math and Logic
description: >-
  The bits of Dest are shifted left by Src bits, inserting C as new LSBs.

  RCL shifts Dest's binary value left by Src places (0-31 bits) and sets the new
  LSBs to C.

  If the WC or WCZ effect is specified, the C flag is updated to the value of the
  last bit shifted out if Src is 1-31, or to Dest[31] if Src is 0.

  If the WZ or WCZ effect is specified, the Z flag is set (1) if the Dest result equals
  zero, or is cleared (0) if it is non-zero.
result: The bits of Dest are shifted left by Src bits, inserting C as new LSBs.
parameters:
- Dest is the register containing the value to rotate carry left by Src bits.
- Src is a register or 5-bit literal whose value indicates the number of bit positions
  to rotate.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set to last bit shifted out if S[4:0] > 0, else D[31]
  Z: Set if result equals zero
syntax_variants:
- RCL Dest, {#}Src {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 0000101 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: last bit shifted out if S[4:0] > 0, else D[31]
  z: Result == 0
  clocks: '2'
encoding_notes:
- C = last bit shifted out if Src[4:0] > 0, else C = Dest[31].
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, RCL, pp.116-117"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 7 (RCL D,{#}S {WC/WZ/WCZ}: rotate carry left, D = [63:32] of ({D[31:0], {32{C}}} << S[4:0]), C = last bit shifted out if S[4:0] > 0, else D[31]; footnote * Z = (result == 0); 2 clocks; write D)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Math and Logic Instructions, p.37 (RCL D,{#}S {WC/WZ/WCZ}, 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, RCL, pp.116-117 (Result line, Dest and Src parameters, encoding row 0000101 CZI, write D, C last bit out, Z Result = 0, 2 clocks, footnote C = last bit shifted out if Src[4:0] > 0 else C = Dest[31] on p.116; the explanation of the shift, the WC rule (last bit shifted out if Src is 1-31, Dest[31] if Src is 0) and the WZ rule on p.117)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 0000101 CZI DDDDDDDDD SSSSSSSSS RCL D,S/# {WC/WZ/WCZ})"
documentation_level: comprehensive
last_updated: '2025-09-19'
