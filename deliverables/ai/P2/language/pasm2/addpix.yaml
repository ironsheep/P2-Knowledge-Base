instruction: ADDPIX
syntax: ADDPIX Dest, {#}Src
brief_description: Add pixels
category: Pixel Mixer
description: ADDPIX sums all four byte fields of Src into those of Dest and stores the result in the Dest register. For 8:8:8:8 pixel data the four bytes are the red, green, blue, and alpha channels. Each byte is saturated independently to prevent wraparound.
result: All four byte fields of Src are added into the corresponding byte fields of Dest with full saturation (8:8:8:8 pixel data).
parameters:
- Dest is a register containing the 8:8:8:8 pixel value to add Src to, and is where the
  result is written.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose four byte fields
  are added into Dest.
flags_affected:
  C: No effect
  Z: No effect
syntax_variants:
- ADDPIX Dest, {#}Src
timing:
  cycles: 7
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 1010010 00I DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '7'
