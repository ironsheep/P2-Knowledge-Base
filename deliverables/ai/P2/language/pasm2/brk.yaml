brief_description: Break
category: Interrupt
result: If debug interrupts are enabled, a debug interrupt is triggered in the current cog and Dest's value becomes the debug code or the next debug condition.
syntax_variants:
- BRK {#}Dest
parameters:
- Dest is the register, 9-bit literal, or 32-bit augmented literal whose value becomes
  the debug code or condition depending on the state of execution (outside or inside
  of a Debug ISR).
