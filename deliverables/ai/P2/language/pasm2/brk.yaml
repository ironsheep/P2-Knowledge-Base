instruction: BRK
syntax: BRK {#}Dest
encoding:
- bits: EEEE 1101011 00L DDDDDDDDD 000110110
  write: —
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: 'BRK triggers a breakpoint in the current cog and either defines a breakpoint code or the next breakpoint condition(s). The cog must have debug interrupts enabled, and if BRK is to be executed within the normal program (outside the Debug ISR), the "BRK instruction" interrupt must first be enabled from within a prior Debug ISR. During normal program execution, the BRK instruction is used to generate a debug interrupt with an 8-bit code (from D[7:0]) which can be read within the Debug ISR using a GETBRK instruction. During a Debug ISR, the BRK instruction is used instead to establish the next debug interrupt condition(s) and to select INA/INB, instead of the IJMP0/IRET0 registers exposed during the ISR, so that the pins'' inputs states may be read. The format of Dest for Debug ISR use is %aaaaaaaaaaaaaaaaeeee_LKJIHGFEDCBA where %aaaaaaaaaaaaaaaaeeee is the 20-bit breakpoint address or the 4-bit event code (%eeee). L: 1 = map INA/INB normally, 0 = map IJMP0/IRET0 at INA/INB (the default during the ISR; if the Debug ISR sets it to 1, it must be reset to 0 before exiting the Debug ISR so that RETI0 can see IJMP0 and IRET0). K: 1 = enable interrupt on breakpoint address match. J: 1 = enable interrupt on event %eeee. I: 1 = enable interrupt on asynchronous breakpoint (via COGBRK on another cog). H: 1 = enable interrupt on INT3 ISR entry. G: 1 = enable interrupt on INT2 ISR entry. F: 1 = enable interrupt on INT1 ISR entry. E: 1 = enable interrupt on BRK instruction. D: 1 = enable interrupt on INT3 ISR code (single step). C: 1 = enable interrupt on INT2 ISR code (single step). B: 1 = enable interrupt on INT1 ISR code (single step). A: 1 = enable interrupt on non-ISR code (single step). On Debug ISR entry, bits L to A are cleared to 0; if a subsequent debug interrupt is desired, a BRK instruction must be executed before exiting the Debug ISR to establish the next breakpoint condition(s).'
flags_affected:
  C: No effect
  Z: No effect
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, BRK, p.55; Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), DEBUG INTERRUPT (BRK); Parallax Spin2 Documentation v55 (the BRK #0 / BRK #1..255 DEBUG() mapping)"
documentation_level: comprehensive
examples:
- name: Conditional Breakpoint
  description: "Break only when a condition holds. A condition on BRK itself does NOT do this (see condition_behavior): put the opposite condition on a SKIP #1 before an unconditional BRK, as the Spin2 compiler does for a conditional DEBUG."
  code: "' Break only when value >= limit\n        cmp     value, limit    wc       ' C = 1 if value is below limit\nif_c    skip    #1                       ' opposite condition: skip the BRK\n        brk     #LIMIT_EXCEEDED          ' breaks only when C = 0\n"
  source: "Parallax Spin2 Documentation v55 (conditional DEBUG: 'an opposite-condition SKIP instruction is placed before it'); behaviour hardware-verified (EF-085)"
- name: Debug Communication
  description: Pass data to debug monitor
  code: "' Send value to debugger for logging\n        mov     debug_val, result \
    \       ' Value to report\n        brk     debug_val                ' Pass to\
    \ debugger\n        \n        ' Debugger logs value and continues\n"
- name: Multi-Level Debug
  description: Different debug levels with codes
  code: |
    CON
      DEBUG_TRACE     = 1
      DEBUG_INFO      = 2
      DEBUG_WARNING   = 3
      DEBUG_ERROR     = 4

    DAT
            org     0
    ' Break with appropriate level
            brk     #DEBUG_WARNING           ' Warning-level break

    ' Debugger filters based on level
condition_behavior: "Regardless of its execution condition, BRK triggers the debug interrupt (if enabled); the condition only gates the writing of the 8-bit code. So 'if_c brk #code' with C = 0 still enters the debug ISR, and GETBRK there shows the code of the last BRK whose condition was true, not this one. To make a break conditional: an opposite-condition SKIP #1 before it, or a JMP around an unconditional BRK -- both cancel the break and the code. A conditional DEBUG() is compiled to the SKIP form. Documented behaviour, not a silicon erratum."
related_instructions:
- GETBRK: Get breakpoint status/code
- COGBRK: Trigger breakpoint in another COG
- NIXINT1/2/3: Cancel a triggered interrupt that is waiting to branch
notes:
- Requires debug interrupts enabled to function
- Breakpoint code passed to debug ISR
- "A condition on BRK does not make the break conditional -- see condition_behavior"
- "Under the Spin2 debugger, BRK #0 is what a plain DEBUG compiles to: it launches the debugger or forces an update of one already open; DEBUG() commands compile to BRK #1..255, each code indexing its record in the DEBUG() database"
- Essential for interactive debugging
last_updated: '2025-09-19'
brief_description: Break
category: Interrupt
result: If debug interrupts are enabled, a debug interrupt is triggered in the current cog and Dest's value becomes the debug code or the next debug condition.
syntax_variants:
- BRK {#}Dest
parameters:
- Dest is the register, 9-bit literal, or 32-bit augmented literal whose value becomes
  the debug code or condition depending on the state of execution (outside or inside
  of a Debug ISR).
