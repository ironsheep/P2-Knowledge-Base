instruction: BRK
syntax: BRK {#}Dest
encoding:
- bits: EEEE 1101011 00L DDDDDDDDD 000110110
  write: —
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: 'BRK triggers a breakpoint in the current cog and either defines a breakpoint code or the next breakpoint condition(s). The cog must have debug interrupts enabled, and if BRK is to be executed within the normal program (outside the Debug ISR), the "BRK instruction" interrupt must first be enabled from within a prior Debug ISR. During normal program execution, the BRK instruction is used to generate a debug interrupt with an 8-bit code (from D[7:0]) which can be read within the Debug ISR using a GETBRK instruction. During a Debug ISR, the BRK instruction is used instead to establish the next debug interrupt condition(s) and to select INA/INB, instead of the IJMP0/IRET0 registers exposed during the ISR, so that the pins'' inputs states may be read. The format of Dest for Debug ISR use is %AAAAAAAAAAAAAAAAAAAA_BCDEFGHIJKLM where A is the 20-bit breakpoint address or 4-bit event code, and bits B-M control various interrupt enable conditions.'
flags_affected:
  C: No effect
  Z: No effect
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
examples:
- name: Conditional Breakpoint
  description: Break only when condition met
  code: "' Check condition and break if true\n        cmp     value, limit    wc \
    \      ' Check if over limit\nif_c    brk     #LIMIT_EXCEEDED          ' Break\
    \ with error code\n        \n        ' Continue normal execution\n"
  source: error_checking
- name: Debug Communication
  description: Pass data to debug monitor
  code: "' Send value to debugger for logging\n        mov     debug_val, result \
    \       ' Value to report\n        brk     debug_val                ' Pass to\
    \ debugger\n        \n        ' Debugger logs value and continues\n"
  source: debug_logging
- name: Multi-Level Debug
  description: Different debug levels with codes
  code: "' Debug level codes\nDEBUG_TRACE     = 1\nDEBUG_INFO      = 2  \nDEBUG_WARNING\
    \   = 3\nDEBUG_ERROR     = 4\n\n' Break with appropriate level\n        brk  \
    \   #DEBUG_WARNING           ' Warning-level break\n        \n' Debugger filters\
    \ based on level\n"
  source: debug_infrastructure
related_instructions:
- GETBRK: Get breakpoint status/code
- COGBRK: Trigger breakpoint in another COG
- NIXINT1/2/3: Disable interrupt sources
notes:
- Requires debug interrupts enabled to function
- Breakpoint code passed to debug ISR
- Zero code means unconditional break
- Essential for interactive debugging
