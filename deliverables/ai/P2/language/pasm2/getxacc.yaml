instruction: GETXACC
syntax: GETXACC D
encoding:
- bits: EEEE 1101011 000 DDDDDDDDD 000011110
  write: D
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: Read the streamer's Goertzel accumulators -- the cosine (X) accumulation into D,
  the sine (Y) accumulation into the next instruction's S value. The Silicon Doc says GETXACC
  captures both into holding registers and clears them, and that repeat reads return the
  same values until a new streamer command executes. ON REV C SILICON THE CLEAR ACTS ONLY
  WHILE A DDS/GOERTZEL COMMAND IS RUNNING; with the streamer idle (or in another mode)
  GETXACC returns the running total and clears nothing, and each Goertzel burst's last term
  lands in the NEXT burst (see silicon_errata). Used with DDS/Goertzel modes for tone
  detection (DTMF) or signal analysis; X,Y are the real/imaginary components of the
  Goertzel output. Follow with QVECTOR to compute magnitude and phase.
flags_affected:
  C: No effect
  Z: No effect
silicon_errata:
  clear_only_during_goertzel_burst:
    effect: "With the streamer idle, or running any non-Goertzel mode, GETXACC returns the live accumulator and clears nothing: repeated reads -- including right after XINIT of a non-Goertzel command -- return the same value, and the accumulators keep growing from one burst to the next. During a Goertzel burst the clear does act, and partitions the burst exactly (a read inside it plus the next read = one unread burst)."
    evidence: "Hardware-verified on Rev C (EF-069): 50 of 50 idle/non-Goertzel reads equal the prior value; 8 of 8 mid-burst partitions exact. Contradicts the Silicon Doc's capture-and-clear statement. P2 Errata E4."
  last_term_lands_in_next_burst:
    effect: "A reading after a Goertzel burst of N clocks holds N-1 terms; the last term waits in an internal register no instruction reads and is added on the first active clock of the NEXT Goertzel burst. Waiting does not deliver it."
    evidence: "Hardware-verified on Rev C (EF-070): 16 of 16 sequences, N = 64 and 65, both signs. P2 Errata E5. (SINC2's iteration-count corruption is a separate, documented behaviour -- see goertzel_usage.sinc2_constraint.)"
  workaround: "Helper routine (SINC1), proven on silicon (EF-076): take each burst's sums as the difference of two idle reads, and deliver the held term before each: (1) a zero-term burst -- XINIT with the caller's D at count 4 and the caller's S with S[15:12] = 0 (every summed input off) -- then WAITXFI; (2) GETXACC idle = baseline; (3) the caller's burst, WAITXFI; (4) another zero-term burst, WAITXFI; (5) GETXACC idle; (6) subtract. Returned exactly N terms in 60 of 60 calls, N = 1..1001, back to back. Not for SINC2 (its first stage is a running integral the zero burst does not flush)."
documentation_source: "Silicon Doc silicon-doc-text.txt:1604 (the documented capture/clear/repeat-read statement); silicon behaviour: hardware-verified EF-069, EF-070, EF-076"
