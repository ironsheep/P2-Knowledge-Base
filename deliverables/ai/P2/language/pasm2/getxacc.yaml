category: Streamer
oneliner: Get streamer's Goertzel X/Y accumulators into D and next S
aliases:
- GETXACC does not clear
- Goertzel sum missing last term
- GETXACC Clears Only During a Goertzel Burst
- The Goertzel Accumulators Trail by One Clock
- SINC2 corrupted samples
examples:
  - context: Tone detection with length and angle calculation
    code: |
      ' Measure one frequency's energy after the sampling period
      ' (one idle read: it holds the burst's sums for the FIRST burst only;
      '  later bursts need the difference of two idle reads, one before the
      '  burst and one after it -- see reading_protocol)
      getxacc x_val             ' X (cosine) into x_val; Y (sine) is injected into
                                '   the NEXT instruction's S field, so one must follow
      mov     y_val, 0-0        ' 0-0 is the S field GETXACC writes Y into
      qvector x_val, y_val      ' QVECTOR D,S -- D is X, S is Y. Not the other way round.
      getqx   magnitude         ' Get length
      getqy   phase             ' Get angle
    notes: QVECTOR converts the (X=D, Y=S) pair into (length, angle) polar coordinates
goertzel_usage:
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), STREAMER (NOTE ABOUT GOERTZEL SINC2 MODE, 2024.12.16); EF-072 and EF-056 (measured; the XZERO start is clean at 10.24 us, 100 us and 25 ms windows, EF-072)"
  setup: "Configure streamer in DDS/Goertzel mode (X_DDS_GOERTZEL_SINC1 / X_DDS_GOERTZEL_SINC2)"
  target_frequency: "Set via SETXFRQ to match tone being detected"
  sample_count: "SINC2 needs a constant number of clocks (iterations) per Goertzel cycle (see sinc2_constraint); in SINC1 each sample is the constant input term times the number of clocks in its window, so a window one clock longer or shorter than usual changes that sample by exactly one term and the adjacent samples are unaffected"
  output: "X is the cosine accumulation, Y the sine accumulation"
  sinc2_constraint: "SINC2 (double integration) needs a constant iteration count per Goertzel cycle. A non-power-of-two SETXFRQ D makes the cycle span a varying number of clocks, and 'being off by a single clock cycle will corrupt the current and next samples'. Mechanism: SINC2's first stage is a running integral GETXACC does not clear, so a window one clock longer or shorter than its neighbours moves one first-stage value between two adjacent samples, then self-corrects; one clock of read jitter corrupts most samples. Workarounds: a clock that makes the iteration count a power of two (a 256 MHz clock, not 250, gives 256 clocks per Goertzel cycle for a 1 MHz target), or start each measurement with XZERO instead of XCONT. With one clock of read jitter SINC1 is off by at most one term. A corrupted pair occurs at every change of window length and never otherwise."
related_instructions:
  - QVECTOR: Convert the X,Y pair to length and angle
  - GETQX: Get length result after QVECTOR
  - GETQY: Get angle result after QVECTOR
  - SETXFRQ: Set target detection frequency
  - XINIT: Start Goertzel sampling
reading_protocol: |
  Read before and after, and take the difference. With the streamer idle, GETXACC returns the
  running total and clears nothing, so a second idle GETXACC returns the same numbers
  and an absolute read after a discrete XINIT / WAITXFI / GETXACC sequence holds every
  earlier burst too -- it fails invisibly, the value large, stable and plausible-looking.
  Read idle before the burst and after it and subtract; deliver each burst's held last
  term first with a zero-term burst (silicon_errata.workaround). Inside a running
  Goertzel burst a read does clear, so the XCONT-loop form reads once per command and
  subtracts a baseline established on the first pass.

notes:
  - "GETXACC clears the accumulators only while a Goertzel burst runs; an idle read returns and keeps the running total"
  - "A burst's last term lands in the next Goertzel burst unless a zero-term burst delivers it first"
  - "GETXACC also sets Q to the Goertzel sine accumulator value, replacing any value an earlier SETQ left there (see language/pasm2/concepts/special_registers.yaml q_register)"
  - Y value is injected into the next instruction's S operand
  - Must have appropriate instruction following GETXACC
  - "Typical pattern: GETXACC + QVECTOR to get length and angle"

