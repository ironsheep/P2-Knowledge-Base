examples:
  - context: DTMF tone detection with magnitude calculation
    code: |
      ' Detect DTMF tone after sampling period
      getxacc x_val             ' X (cosine) into x_val; Y (sine) is injected into
                                '   the NEXT instruction's S field, so one must follow
      mov     y_val, 0-0        ' 0-0 is the S field GETXACC writes Y into
      qvector x_val, y_val      ' QVECTOR D,S -- D is X, S is Y. Not the other way round.
      getqx   magnitude         ' Get magnitude (tone strength)
      getqy   phase             ' Get phase angle
    notes: QVECTOR computes sqrt(X^2 + Y^2) magnitude
  - context: Simple presence detection (no QVECTOR)
    code: |
      ' Quick check for tone presence
      getxacc x_val             ' Get X accumulator
      abs     x_val             ' Absolute value
      cmp     x_val, threshold  wc  ' Compare to threshold
    notes: For simple detection, magnitude approximation may suffice
goertzel_usage:
  setup: "Configure streamer in DDS/Goertzel mode (X_DDS_GOERTZEL_SINC1 / X_DDS_GOERTZEL_SINC2)"
  target_frequency: "Set via SETXFRQ to match tone being detected"
  sample_count: "Run for power-of-2 samples (64, 128, 256 typical)"
  output: "X,Y are complex Goertzel output (real/imaginary)"
  sinc2_constraint: "SINC2 (double integration) needs a CONSTANT iteration count per Goertzel cycle. A non-power-of-two SETXFRQ D makes the cycle span a varying number of clocks, and 'being off by a single clock cycle will corrupt the current and next samples' (Silicon Doc, NOTE ABOUT GOERTZEL SINC2 MODE, 2024.12.16). Mechanism, measured value for value: SINC2's first stage is a running integral GETXACC does not clear, so a window one clock longer or shorter than its neighbours moves one first-stage value between two adjacent samples, then self-corrects; one clock of read jitter corrupts most samples. Workarounds, both proven: a clock that makes the iteration count a power of two (the Silicon Doc's example runs 256 MHz, not 250, for a 1 MHz target), or start each measurement with XZERO instead of XCONT (clean at 10.24 us, 100 us and 25 ms windows). SINC1 is off by at most one term. Documented behaviour, not a silicon erratum. Hardware-verified on Rev C (EF-072)."
related_instructions:
  - QVECTOR: Compute magnitude/phase from X,Y pair
  - GETQX: Get magnitude result after QVECTOR
  - GETQY: Get phase result after QVECTOR
  - SETXFRQ: Set target detection frequency
  - XINIT: Start Goertzel sampling
reading_protocol: |
  READ BEFORE AND AFTER, TAKE THE DIFFERENCE. With the streamer idle, GETXACC returns the
  running total and clears nothing, so a second idle GETXACC returns the same numbers
  and an absolute read after a discrete XINIT / WAITXFI / GETXACC sequence holds every
  earlier burst too -- it fails invisibly, the value large, stable and plausible-looking.
  Read idle before the burst and after it and subtract; deliver each burst's held last
  term first with a zero-term burst (silicon_errata.workaround). Inside a running
  Goertzel burst a read does clear, so the XCONT-loop form reads once per command and
  subtracts a baseline established on the first pass. The Silicon Doc's worked demo
  comments its read "get prior Goertzel acc's".

notes:
  - "GETXACC clears the accumulators only while a Goertzel burst runs; an idle read returns and keeps the running total (EF-069)"
  - "A burst's last term lands in the next Goertzel burst unless a zero-term burst delivers it first (EF-070)"
  - Y value is injected into NEXT instruction's S operand
  - Must have appropriate instruction following GETXACC
  - Typical pattern: GETXACC + QVECTOR for magnitude extraction

