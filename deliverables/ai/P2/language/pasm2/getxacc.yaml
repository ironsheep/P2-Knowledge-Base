instruction: GETXACC
syntax: GETXACC D
encoding:
- bits: EEEE 1101011 000 DDDDDDDDD 000011110
  write: D
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: Capture the streamer's Goertzel accumulators into holding registers and clear
  them; write the captured cosine (X) accumulation into D and place the captured sine (Y)
  accumulation into the next instruction's S value. SUBSEQUENT GETXACC INSTRUCTIONS RETURN
  THE SAME CAPTURED VALUES UNTIL A NEW STREAMER COMMAND EXECUTES — GETXACC reads a holding
  register, not a live accumulator. Used with DDS/Goertzel modes for tone detection (DTMF)
  or signal analysis. The X,Y values represent the real/imaginary components of the Goertzel
  filter output. Follow with QVECTOR to compute magnitude and phase from the X,Y pair.
flags_affected:
  C: No effect
  Z: No effect
documentation_source: "Silicon Doc p2-documentation.txt:4096-4099 (capture-into-holding-registers, clear, and the repeat-read rule)"
documentation_level: enhanced
compiler_operand_format:
  name: operand_d
  pattern: D
  description: Destination register only
  valueType: 24
compiler_encoding:
  operandFormat: 24
enhancement_source: PNUT_TS_v2.0_complete_operand_integration_2025-09-13
last_updated: '2025-09-19T16:04:17.478637'
category: Streamer
oneliner: Get streamer's Goertzel X/Y accumulators into D and next S
examples:
  - context: DTMF tone detection with magnitude calculation
    code: |
      ' Detect DTMF tone after sampling period
      getxacc x_val             ' X (cosine) into x_val; Y (sine) is injected into
                                '   the NEXT instruction's S field, so one must follow
      mov     y_val, 0-0        ' 0-0 is the S field GETXACC writes Y into
      qvector x_val, y_val      ' QVECTOR D,S -- D is X, S is Y. Not the other way round.
      getqx   magnitude         ' Get magnitude (tone strength)
      getqy   phase             ' Get phase angle
    notes: QVECTOR computes sqrt(X^2 + Y^2) magnitude
  - context: Simple presence detection (no QVECTOR)
    code: |
      ' Quick check for tone presence
      getxacc x_val             ' Get X accumulator
      abs     x_val             ' Absolute value
      cmp     x_val, threshold  wc  ' Compare to threshold
    notes: For simple detection, magnitude approximation may suffice
goertzel_usage:
  setup: "Configure streamer in DDS/Goertzel mode (X_DDS_GOERTZEL_SINC1 / X_DDS_GOERTZEL_SINC2)"
  target_frequency: "Set via SETXFRQ to match tone being detected"
  sample_count: "Run for power-of-2 samples (64, 128, 256 typical)"
  output: "X,Y are complex Goertzel output (real/imaginary)"
  sinc2_constraint: "SINC2 (double-integration) requires a CONSTANT iteration count per Goertzel cycle. A non-power-of-two SETXFRQ D makes the NCO cycle span a varying number of system clocks, so GETXACC captures an off-by-one integration that corrupts the current sample AND the next before self-correcting (periodic noise ~every 30-60 ms). Avoid it by running at a clock that makes the iteration count a power of two (e.g. 256 MHz, not 250, for a 1 MHz target), or use SINC1 (single integration is immune), or start each measurement with XZERO (not XCONT) and keep the window under ~20 ms. Reported by Chip Gracey (P2 designer), 2024-12-16; not yet in the released Silicon Doc."
related_instructions:
  - QVECTOR: Compute magnitude/phase from X,Y pair
  - GETQX: Get magnitude result after QVECTOR
  - GETQY: Get phase result after QVECTOR
  - SETXFRQ: Set target detection frequency
  - XINIT: Start Goertzel sampling
reading_protocol: |
  ONE GETXACC PER STREAMER COMMAND. The accumulators are captured and cleared at the
  GETXACC, and the holding registers keep those captured values until a new streamer
  command executes — so a second GETXACC returns identical numbers, and a read taken
  BEFORE a command belongs to the PREVIOUS command (the Silicon Doc's worked demo
  comments its read "get prior Goertzel acc's").
  With a discrete XINIT / WAITXFI / GETXACC sequence, read before the command and after
  it and take the DIFFERENCE; an absolute read in that pattern is not a per-command
  measurement, and it fails invisibly — the value returned is large, stable and
  plausible-looking. The XCONT-loop form reads once per command and subtracts a
  baseline established on the first pass.

notes:
  - Accumulators are captured into holding registers and cleared by GETXACC
  - A repeat GETXACC returns the same captured values until a new streamer command runs
  - Y value is injected into NEXT instruction's S operand
  - Must have appropriate instruction following GETXACC
  - Typical pattern: GETXACC + QVECTOR for magnitude extraction

