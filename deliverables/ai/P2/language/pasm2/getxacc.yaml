instruction: GETXACC
syntax: GETXACC D
encoding:
- bits: EEEE 1101011 000 DDDDDDDDD 000011110
  write: D
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: Read the streamer's Goertzel accumulators -- the cosine (X) accumulation into D,
  the sine (Y) accumulation into the next instruction's S value. Parallax's documents
  give that GETXACC captures both into holding registers and clears them, with repeat reads
  returning the same values until a new streamer command executes. However, the clear acts only
  while a DDS/Goertzel command is running; with the streamer idle (or in another mode)
  GETXACC returns the running total and clears nothing, and each Goertzel burst's last term
  lands in the next burst (see silicon_errata). Used with DDS/Goertzel modes to measure
  the energy of a single frequency amid noise; X is the cosine accumulation and Y the sine
  accumulation. Follow with QVECTOR to convert the pair into polar coordinates (length and angle).
flags_affected:
  C: No effect
  Z: No effect
silicon_errata:
  clear_only_during_goertzel_burst:
    effect: "With the streamer idle, or running any non-Goertzel mode, GETXACC returns the live accumulator and clears nothing: repeated reads -- including right after XINIT of a non-Goertzel command -- return the same value, and the accumulators keep growing from one burst to the next. During a Goertzel burst the clear does act, and partitions the burst exactly (a read inside it plus the next read = one unread burst)."
    source: "Hardware-verified on Rev C (EF-069): 50 of 50 idle/non-Goertzel reads equal the prior value; 8 of 8 mid-burst partitions exact. Contradicts the capture-and-clear statement in Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), STREAMER."
  last_term_lands_in_next_burst:
    effect: "A reading after a Goertzel burst of N clocks holds N-1 terms; the last term waits in an internal register no instruction reads and is added on the first active clock of the NEXT Goertzel burst. Waiting does not deliver it. A short zero-term burst (same mode, input enables S[15:12] clear) after the burst delivers it: the reading then holds all N terms and nothing spills into the next burst."
    note: "SINC2's iteration-count corruption is a separate behaviour -- see goertzel_usage.sinc2_constraint."
    source: "Hardware-verified on Rev C silicon: EF-070 (the one-clock lag and the zero-term-burst delivery; 16 of 16 sequences, N = 64 and 65, both signs); helper routine below: EF-076 (returned exactly N terms in 60 of 60 calls, N = 1..1001, back to back; SINC1 only)"
  workaround: "Helper routine (SINC1), for both behaviours above together: take each burst's sums as the difference of two idle reads, and deliver the held term before each: (1) a zero-term burst -- XINIT with the caller's D at count 4 and the caller's S with S[15:12] = 0 (every summed input off) -- then WAITXFI; (2) GETXACC idle = baseline; (3) the caller's burst, WAITXFI; (4) another zero-term burst, WAITXFI; (5) GETXACC idle; (6) subtract. The result is exactly N terms. The helper is for SINC1; for SINC2 see goertzel_usage.sinc2_constraint."
documentation_source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), STREAMER (the documented capture/clear/repeat-read statement; the Goertzel worked demo with its 'get prior Goertzel acc's' comment; NOTE ABOUT GOERTZEL SINC2 MODE, 2024.12.16); silicon behaviour: hardware-verified EF-069, EF-070, EF-076"
documentation_level: enhanced
