instruction: SUMNC
syntax: SUMNC D,{#}S {WC|WZ|WCZ}
brief_description: Sum not C
category: Math and Logic
description: >-
  SUMNC adjusts the signed Dest value by Src or -Src (depending on !C) and stores
  the result into the Dest register. If !C is true (C=0), Dest = Dest - Src. If !C
  is false (C=1), Dest = Dest + Src. If the WC or WCZ effect is specified, the C flag
  is updated to the correct sign of (D +/- S), the sign of the full-precision result:
  set if the result is negative and cleared if it is positive. When the sum overflows,
  C differs from bit 31 of the stored Dest; that difference is what TJV tests
  (D[31] != C). If the WZ or WCZ effect is specified, the Z flag is set (1) if the
  result equals zero, or is cleared (0) if non-zero.
result: >-
  The sum of signed Dest and either Src or -Src (according to !C) is stored in Dest
  and optionally the C and Z flags are updated to the sign and zero status.
parameters:
- Dest is a register containing the signed value to adjust by Src or -Src, and is
  where the result is written.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value is
  subtracted from Dest if C=0 (!C=1) and added into Dest if C=1 (!C=0).
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: With WC or WCZ, the correct sign of (D +/- S) - set if negative, cleared if positive; differs from D[31] when the sum overflows
  Z: With WZ or WCZ, set if the result equals zero, cleared if non-zero
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 0011101 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: correct sign of (D +/- S)
  z: Result == 0
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, SUMC / SUMNC, pp.132-133"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 31 (SUMNC D,{#}S: sum +/-S into D by !C, if C = 0 then D = D - S, else D = D + S, C = correct sign of (D +/- S), Z = (result == 0); 2 clocks; write D)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Math and Logic Instructions, p.38 (SUMNC D,{#}S {WC/WZ/WCZ}, if C = 0 then D = D - S, else D = D + S, C = correct sign of (D +/- S), 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, SUMC / SUMNC, pp.132-133 (Result line, Dest, Src and effect parameters, encoding row 0011101 CZI, write D, C sign of (D +/- S), Z Result = 0, 2 clocks, Related list, Src negated if !C is 1, C set if the result is negative and cleared if positive, Z rule); the manual's Src parameter line is written for the SUMC / SUMNC pair and is not served"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 0011101 CZI DDDDDDDDD SSSSSSSSS SUMNC D,S/# {WC/WZ/WCZ}); no measurement covers SUMNC"
  - "C on overflow: P2 Instructions v35 - Rev B/C Silicon, row 180 (TJV: jump if D overflowed, D[31] != C, C = 'correct sign' from the last addition/subtraction); Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, TJV, p.138 (TJV requires that C be updated to the correct sign by a previous SUMx instruction, and tests Dest[31] != C)"
documentation_level: comprehensive
