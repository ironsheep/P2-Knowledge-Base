instruction: SUMNC
syntax: SUMNC D,{#}S {WC|WZ|WCZ}
brief_description: Sum with negated carry condition
category: Math and Logic
description: >-
  SUMNC adjusts the signed Dest value by Src or -Src (depending on !C) and stores
  the result into the Dest register. If !C is true (C=0), Dest = Dest - Src. If !C
  is false (C=1), Dest = Dest + Src. If the WC or WCZ effect is specified, the C flag
  is updated to the true sign of the result. If the WZ or WCZ effect is specified,
  the Z flag is set (1) if the result equals zero, or is cleared (0) if non-zero.
result: >-
  The sum of signed Dest and either Src or -Src (according to !C) is stored in Dest
  and optionally the C and Z flags are updated to the sign and zero status.
parameters:
- Dest is a register containing the signed value to adjust by Src or -Src, and is
  where the result is written.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value (if C=0
  or !C=0) or negated value (if C=1 or !C=1) is added into Dest.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set to true sign of result (D +/- S)
  Z: Set if result equals zero
timing:
  cycles: 2
  type: fixed
encoding:
- bits: EEEE 0011101 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: 0 then D = D - S, else D = D + S. C = true sign of (D +/- S)
  z: Result = 0
  clocks: '2'
documentation_source: PASM2 Manual 2022/11/01
documentation_level: comprehensive
compiler_operand_format:
  name: operand_ds
  pattern: D,S/#
  description: Destination register, Source register or immediate value
  valueType: 0
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 0
