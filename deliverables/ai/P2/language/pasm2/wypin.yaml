instruction: WYPIN
syntax: WYPIN   {#}D,{#}S
encoding:
- bits: EEEE 1100001 0LI DDDDDDDDD SSSSSSSSS
  write: —
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
  in_flag_reset_latency: |
    After WYPIN executes (which acknowledges the Smart Pin), the Smart Pin requires
    2 system-clock cycles to reset the IN flag to logic-0 before a program can poll
    the flag again. Insert NOP instructions before testing the IN flag.
description: 'Set "Y" register of smart pins S[10:6]+S[5:0]..S[5:0] to D, acknowledge
  smart pins.

  Wraps within A/B pins. Prior SETQ overrides S[10:6].


  The Y register serves multiple purposes:

  - For pulse/cycle (%00100) and transition (%00101) output: Y[31:0] is the pulse/transition count

  - For PWM modes: Y[15:0] is the output value captured at each frame start (the base
  period and frame count are set by WXPIN, not WYPIN)

  - For DAC modes: Y[15:0] is the DAC output value captured at each sample period

  - For sync/async serial and USB: Y loads the output word/byte to transmit

  - For counter modes (%01110/%01111): Y[0] selects count-only (0) or increment/decrement
  (1), not a count value; the measurement period is X

  - For ADC modes other than SINC2 sampling: WYPIN may replace the period set by WXPIN
  with Y[13:0] - it does not initiate conversions

  - Writing Y also acknowledges the pin

  - Source: silicon-doc-text.txt:3938, :3974, :3993, :4042, :4089, :4133, :4387, :4656

  '
