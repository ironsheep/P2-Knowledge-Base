init_order:
  description: 'Reset (DIRL), then setup (WRPIN and WXPIN), then enable (DIRH), then operate (WYPIN). For the pulse/cycle (%00100) and transition (%00101) output modes and asynchronous serial transmit (%11110), a WYPIN issued before the pin is enabled does not take effect. In synchronous serial transmit (%11100) continuous mode the first word is written with WYPIN during reset; enabling first and then writing loses that first word.'
  source: "Smart pin init order: EF-011 (pulse, transition and asynchronous transmit; WYPIN before enable never triggered, WYPIN after enable did) and EF-090 (synchronous transmit %11100 continuous); Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PIN MODES (a first word written with WYPIN during reset primes the shifter)"
notes:
- Writing the Y register acknowledges the pin
- Y register meaning depends on smart pin mode
- Y is used by the output, NCO, PWM, DAC, serial, USB, counter, timing and ADC-period modes listed in the description
