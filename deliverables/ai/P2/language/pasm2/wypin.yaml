instruction: WYPIN
syntax: WYPIN   {#}D,{#}S
encoding:
- bits: EEEE 1100001 0LI DDDDDDDDD SSSSSSSSS
  write: —
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
  in_flag_reset_latency: |
    After WYPIN executes (which acknowledges the Smart Pin), the Smart Pin requires
    2 system-clock cycles to reset the IN flag to logic-0 before a program can poll
    the flag again. A NOP between the WYPIN and the poll elapses those clocks.
description: 'Set "Y" register of smart pins S[10:6]+S[5:0]..S[5:0] to D, acknowledge
  smart pins.

  Wraps within A/B pins. A prior SETQ overrides S[10:6] with the low five bits of
  the SETQ value; an ALTx between the SETQ and WYPIN keeps the override, and a SETQ
  separated from WYPIN by other instructions is not documented.


  The Y register serves multiple purposes:

  - For pulse/cycle (%00100) and transition (%00101) output: Y[31:0] is the pulse/transition count

  - For PWM modes: Y[15:0] is the output value captured at each frame start (the base
  period and frame count are set by WXPIN, not WYPIN)

  - For the DAC dither modes (%00010, %00011): Y[15:0] is the DAC output value captured at each sample period

  - For the NCO modes (%00110, %00111): Y[31:0] is added into Z[31:0] at each base period

  - For %10010: Y[1:0] selects A-input high (%00), rise (%01) or edge (%1x) sensitivity, and Y[2] selects timing of X events (0) or timeout on X clocks (1)

  - For %10011 to %10111: Y[1:0] selects the A-input and B-input rise/edge sensitivity (%00 A rise to B rise, %01 A rise to B edge, %10 A edge to B rise, %11 A edge to B edge)

  - For sync/async serial and USB: Y loads the output word/byte to transmit

  - For counter modes (%01110/%01111): Y[0] selects count-only (0) or increment/decrement
  (1), not a count value; the measurement period is X

  - For ADC modes other than SINC2 sampling: WYPIN may replace the period set by WXPIN
  with Y[13:0]

  - Writing Y also acknowledges the pin


  Cogs that execute WRPIN, WXPIN, WYPIN, RDPIN or AKPIN on the same smart pin must do
  so at different times: the pin OR''s the write-data and acknowledgement buses of all
  cogs, and simultaneous use clobbers the bus data.

  '
sources:
  - "description (set Y of smart pins S[10:6]+S[5:0]..S[5:0] to D, acknowledge; wraps within A/B pins; prior SETQ overrides S[10:6]; 2 clocks): P2 Instructions v35 - Rev B/C Silicon, row 219; Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), list of changes (WRPIN/WXPIN/WYPIN/AKPIN can now work on a span of pins, +S[10:6] pins; prior SETQ overrides S[10:6])"
  - "description (an ALTx between the SETQ and WYPIN keeps the override): Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ALTB, pp.38-39 (SETQ / SETQ2 does not affect ALTx instructions; the Q value passes through to the next instruction); a SETQ separated by other instructions is in no source"
  - "timing (two clocks for IN to drop before it can be polled again): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PINS"
  - "description (Y register by smart pin mode): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PIN MODES"
  - "description (multi-cog bus rule); related_instructions (the instruction summaries): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PINS"
