instruction: FLTC
syntax: FLTC    {#}D           {WCZ}
encoding:
- bits: EEEE 1101011 CZL DDDDDDDDD 001010010
  write: DIRx* + OUTx
  c: Orig OUTx base bit
  z: Orig OUTx base bit
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: >-
  FLTC sets the I/O pin(s) designated by Dest to the input direction
  and to a low/high output level according to the C flag. All other pins are left
  unchanged.

  Dest[5:0] indicates the pin number (0-63). For a range of pins, Dest[5:0] indicates
  the base pin number (0-63) and Dest[10:6] indicates how many contiguous pins beyond
  the base should be affected (1-31).

  A 9-bit literal Dest is enough to express the base pin (Dest[5:0]) and a range of
  up to 8 contiguous pins (Dest[8:6]). If needed, use the augmented literal feature
  (##Dest) to augment Dest to an 11-bit literal value-- this inserts an AUGD
  instruction prior.

  When Dest is a register, the register's value bits [10:0] are used as-is to form
  the 11-bit ID range, unless a prior SETQ overrides value bits[10:6] with the low
  five bits of the SETQ value. An ALTx between the SETQ and FLTC keeps the
  override, and a SETQ separated from FLTC by other instructions is not documented.

  The range calculation (from Dest[5:0] up to Dest[5:0]+Dest[10:6]) will wrap within
  the same 32-pin group (DIRA or DIRB and OUTA or OUTB); it will not cross the port
  boundary.

  FLTC achieves the same effect as two instructions-- DIRL followed by OUTC.

  If the WCZ effect is specified, the C and Z flags are set to the original
  (pre-instruction) state of the base pin's OUT bit (OUTA / OUTB), identified by Dest.
result: >-
  The I/O pins described by Dest are set to the input direction and to an output
  level of low/high according to C; the rest are left as-is.
flags_affected:
  C: Set to the original (pre-instruction) state of the base pin's OUT bit
  Z: Set to the original (pre-instruction) state of the base pin's OUT bit
encoding_notes:
- New DIRx state is not data-forwarded; the next pipelined instruction sees the old state.
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, FLTC / FLTNC, p.83"
sources:
  - "description (prior SETQ overrides D[10:6]): P2 Instructions v35 - Rev B/C Silicon, row 367 (FLTC: OUT bits of pins D[10:6]+D[5:0]..D[5:0] = C; DIR bits = 0; wraps within OUTA/OUTB; prior SETQ overrides D[10:6]; C,Z = OUT bit; write DIRx* + OUTx; 2 clocks); Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), list of changes (DIRx/OUTx/FLTx/DRVx span of pins, +D[10:6]; prior SETQ overrides D[10:6])"
  - "description (an ALTx between the SETQ and the instruction keeps the override): Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ALTB, p.38 and ALTD, p.39 (SETQ / SETQ2 does not affect ALTx instructions; the Q value passes through to the next instruction); a SETQ separated from FLTC by other instructions is in no source"
  - "description (Dest forms, the wrap within DIRA or DIRB and OUTA or OUTB, DIRL followed by OUTC, WCZ rule, parameters) and encoding_notes (not data-forwarded): Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, FLTC / FLTNC, p.83 (encoding row 001010010, write DIRx and OUTx, C and Z Orig OUTx base bit, 2 clocks)"
documentation_level: comprehensive
syntax_variants:
- FLTC {#}D
