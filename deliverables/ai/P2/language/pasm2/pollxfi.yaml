instruction: POLLXFI
syntax: POLLXFI {WC|WZ|WCZ}
brief_description: Poll streamer finished
category: Event
description: >-
  Streamer-finished event flag is optionally copied into C and/or Z, then it is cleared.
  POLLXFI copies the state of the streamer-finished event flag into C and/or Z and
  then clears the flag (unless it's being set again by the event sensor). If the WC, WZ,
  or WCZ effect is specified, the C flag and/or Z flag is updated to the state of the
  streamer-finished event flag prior to clearing it. The streamer-finished event flag
  is set whenever the streamer runs out of commands to process. The streamer-finished
  event flag is cleared upon execution of XINIT, XZERO, XCONT, POLLXFI, WAITXFI, JXFI,
  or JNXFI instructions.
result: Streamer-finished event flag is optionally copied into C and/or Z, then it
  is cleared.
flags_affected:
  C: Set to XFI event flag state
  Z: Set to XFI event flag state
parameters:
- WC, WZ, or WCZ are optional effects to update flags.
syntax_variants:
- POLLXFI {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1101011 CZ0 000001011 000100100
  write: —
  c: XFI Event
  z: XFI Event
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, POLLXFI, pp.114-115"
sources:
