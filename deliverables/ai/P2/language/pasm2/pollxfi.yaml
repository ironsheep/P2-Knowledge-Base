  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Event instructions, p.43 (POLLXFI {WC/WZ/WCZ}, 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, POLLXFI, pp.114-115 (Result line, WC / WZ / WCZ parameter, encoding row 000001011 / 000100100, write none, C and Z XFI Event, 2 clocks, Related list on p.114; the copy-then-clear explanation, the set condition (the streamer runs out of commands to process) and the clearing list XINIT, XZERO, XCONT, POLLXFI, WAITXFI, JXFI, JNXFI on p.115)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), EVENTS (the POLLxxx instructions simultaneously return their event-occurred flag into C and/or Z and clear it unless it is set again by the event sensor; POLLXFI event flag: cleared on XINIT / XZERO / XCONT, set whenever the streamer runs out of commands, also cleared on POLLXFI / WAITXFI / JXFI / JNXFI), instruction encoding listing (EEEE 1101011 CZ0 000001011 000100100 POLLXFI {WC/WZ/WCZ})"
