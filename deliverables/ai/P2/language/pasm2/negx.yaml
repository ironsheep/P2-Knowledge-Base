constant: NEGX
name: NEGX
value: -2147483648
hex_value: $80000000
description: 'Maximum negative integer constant

  Most negative value in 32-bit signed integer representation

  '
category: Constants
documentation_level: complete
usage: 'Use for range checking and underflow detection

  Represents the lower bound of signed integer values

  '
examples:
- code: |
    cmps    value, ##NEGX   wz      ' is value the most negative number?
    if_z    jmp     #at_minimum     ' NEG and ABS of NEGX give NEGX again (two's complement)
  description: Detecting the one value that cannot be negated
- code: |
    mov     highest, ##NEGX         ' start a running maximum at the most negative value
    fges    highest, sample         ' highest = the larger of highest and sample (signed)
  description: Using NEGX as the starting value of a running signed maximum
notes:
- -2^31 in decimal notation
- Bit 31 set, bits 30-0 clear
- Used for saturation arithmetic and bounds checking
- 'Special case: abs(NEGX) = NEGX due to two''s complement representation'
related:
- POSX
- FLES
- FGES
- ABS
oneliner: Maximum negative integer constant
