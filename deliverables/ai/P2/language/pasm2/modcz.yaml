instruction: MODCZ
syntax: MODCZ   c,z      {WC/WZ/WCZ}
category: Math and Logic
description: >-
  MODCZ sets or clears both the C and Z flags based on the modes described by the
  given Modifiers. Each flag is set or cleared according to its given Modifier and
  the current state of both the C and Z flags.
result: >-
  C = cccc[{C,Z}] and Z = zzzz[{C,Z}], where the 4-bit modifier values select which
  combinations of current C and Z states produce 1 results for each flag.
modifier_rule: >-
  cccc is the conditional test used to update C and zzzz the conditional test used to
  update Z. A value of %0000 clears the flag, %1111 sets it, and every other value
  is read as the EEEE condition with the same code (the table of EEEE conditions is in
  language/pasm2/concepts/conditional_execution.yaml). The Modifier symbols below
  are the values the assembler places in the cccc and zzzz fields. They are operand
  names for MODCZ, MODC and MODZ; the IF_ names in the table of language/pasm2/concepts/conditional_execution.yaml
  are instruction prefixes, a separate set of names for the same codes, and code %0000
  is the _RET_ prefix there and _CLR here while code %1111 is IF_ALWAYS there and _SET
  here. The WC, WZ and WCZ
  effects are required for the designated flag to be affected: a flag whose effect is
  not given is unaltered.
parameters:
- CModifer is a Modifier symbol for the designated mode to apply to the C flag.
- ZModifer is a Modifier symbol for the designated mode to apply to the Z flag.
- WC, WZ, or WCZ are effects that are optional to assemble; a flag changes only when its effect is given.
modifier_symbols:
  _CLR: '%0000'
  _NC_AND_NZ: '%0001'
  _NZ_AND_NC: '%0001'
  _GT: '%0001'
  _NC_AND_Z: '%0010'
  _Z_AND_NC: '%0010'
  _NC: '%0011'
  _GE: '%0011'
  _C_AND_NZ: '%0100'
  _NZ_AND_C: '%0100'
  _NZ: '%0101'
  _NE: '%0101'
  _C_NE_Z: '%0110'
  _Z_NE_C: '%0110'
  _NC_OR_NZ: '%0111'
  _NZ_OR_NC: '%0111'
  _C_AND_Z: '%1000'
  _Z_AND_C: '%1000'
  _C_EQ_Z: '%1001'
  _Z_EQ_C: '%1001'
  _Z: '%1010'
  _E: '%1010'
  _NC_OR_Z: '%1011'
  _Z_OR_NC: '%1011'
  _C: '%1100'
  _LT: '%1100'
  _C_OR_NZ: '%1101'
  _NZ_OR_C: '%1101'
  _C_OR_Z: '%1110'
  _Z_OR_C: '%1110'
  _LE: '%1110'
  _SET: '%1111'
modifier_meaning: >-
  Each symbol names the combination of the current C and Z flags that produces a 1:
  for example _NC_AND_Z gives 1 when C is clear and Z is set, _C gives the C value,
  _NZ gives the inverse of Z, _C_EQ_Z gives 1 when C equals Z, and _SET gives 1
  always. The same symbols are used for the C and the Z operand.
effect_cases:
- "_CLR for C and _Z_OR_C for Z, with WCZ: C = 0 and Z = Z OR C"
- "_NZ for C and 0 for Z, with WC: C = !Z and Z is unaltered"
- "0 for C and _SET for Z, with WZ: C is unaltered and Z = 1"
- "MODC with _NZ_AND_C and WC: C = !Z AND C"
- "MODZ with _Z_NE_C and WZ: Z = Z XOR C"
flags_affected:
  C: Set per cccc modifier and current C/Z state
  Z: Set per zzzz modifier and current C/Z state
timing:
  cycles: 2
  type: fixed
encoding:
- bits: EEEE 1101011 CZ1 0cccczzzz 001101111
  write: —
  c: cccc[{C,Z}]
  z: zzzz[{C,Z}]
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, MODC / MODZ / MODCZ and Modifier Symbols, pp.97-98; Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), COGS (encoding key: cccc and zzzz), MODCZ constants"
