instruction: MODCZ
syntax: MODCZ   c,z      {WC/WZ/WCZ}
category: Math and Logic
description: >-
  MODCZ sets or clears both the C and Z flags based on the modes described by the
  given Modifiers. Each flag is set or cleared according to its given Modifier and
  the current state of both the C and Z flags.
result: >-
  C = cccc[{C,Z}] and Z = zzzz[{C,Z}], where the 4-bit modifier values select which
  combinations of current C and Z states produce 1 results for each flag.
parameters:
- CModifer is a Modifier symbol for the designated mode to apply to the C flag.
- ZModifer is a Modifier symbol for the designated mode to apply to the Z flag.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set per cccc modifier and current C/Z state
  Z: Set per zzzz modifier and current C/Z state
timing:
  cycles: 2
  type: fixed
encoding:
- bits: EEEE 1101011 CZ1 0cccczzzz 001101111
  write: —
  c: cccc[{C,Z}]
  z: zzzz[{C,Z}]
  clocks: '2'
documentation_source: PASM2 Manual 2022/11/01
documentation_level: comprehensive
compiler_operand_format:
  name: operand_cz
  pattern: '#C{,#Z}'
  description: 'Modify condition flags: C flag value (4-bit), optional Z flag value
    (4-bit)'
  valueType: 27
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 27
