directive: WORDFIT
name: WORDFIT
category: Data Declaration Directives
description: |
  Data declaration directive for DAT blocks that stores 16-bit values with compile-time range validation.
  Works identically to WORD for storage but adds validation that values fit within the word range.
  Catches potential overflow errors during compilation rather than silently truncating.

documentation_level: complete

syntax: "WORDFIT value [, value2, ...]"
alternate_syntax: "WORDFIT value[count]"

valid_range:
  minimum: "-$8000 (-32768)"
  maximum: "$FFFF (65535)"
  combined_range: "Allows both signed word values (-32768 to 32767) and unsigned word values (0 to 65535)"

storage_size: "16 bits (2 bytes) per value"

examples:
  - code: |
      DAT
        wordData    WORDFIT   -$8000            ' Minimum signed value
                    WORDFIT   $FFFF             ' Maximum unsigned value
                    WORDFIT   1000, 30000       ' Multiple values on one line
    description: "Valid WORDFIT declarations within allowed range"

  - code: |
      DAT
        ' Compile-time errors - values out of range:
        ' bad1      WORDFIT   65536             ' 65536 > 65535
        ' bad2      WORDFIT   -32769            ' -32769 < -32768
        ' bad3      WORDFIT   $10000            ' $10000 > $FFFF
    description: "Out-of-range values cause compile errors"

  - code: |
      DAT
        pattern     WORDFIT   $ABCD[50]         ' Fill 50 words with $ABCD
        calibration WORDFIT   -1024, -512, 0, 512, 1024
    description: "Using count multipliers and signed calibration values"

  - code: |
      CON
        BASE_ADDR = $1000
        OFFSET = $500
      
      DAT
        addresses   WORDFIT   BASE_ADDR + OFFSET * 0
                    WORDFIT   BASE_ADDR + OFFSET * 1
                    WORDFIT   BASE_ADDR + OFFSET * 2
    description: "Expressions evaluated and validated at compile time"

comparison:
  - feature: "Storage size"
    WORD: "16 bits"
    WORDFIT: "16 bits"
  - feature: "Range checking"
    WORD: "No - silently truncates"
    WORDFIT: "Yes - compile error if out of range"
  - feature: "Truncation behavior"
    WORD: "Stores low 16 bits only"
    WORDFIT: "Prevents truncation via error"

error_message: "WORDFIT values must range from -$8000 to $FFFF"

use_cases:
  - "ADC calibration and offset tables"
  - "16-bit address tables"
  - "Sensor reference values"
  - "Audio sample data with validation"
  - "Any word data where overflow would indicate a bug"

notes:
  - "Part of base Spin2/PASM2 language - no version directive required"
  - "No parentheses in syntax - WORDFIT value, not WORDFIT(value)"
  - "Compile-time validation only - zero runtime overhead"
  - "Can only be used in DAT blocks"
  - "Prefer WORDFIT over WORD when values come from calculations or constants"

related:
  - BYTEFIT
  - BYTE
  - WORD
  - LONG

oneliner: "Word data declaration with compile-time range validation (-$8000 to $FFFF)"
