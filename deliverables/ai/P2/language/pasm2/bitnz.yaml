instruction: BITNZ
syntax: BITNZ   D,{#}S         {WCZ}
category: Math and Logic
description: BITNZ alters the Dest bit(s) designated by Src to equal the inverse state of the Z flag (!Z). Dest bit(s) described by Src are set to !Z; the rest are left as-is. If WCZ is specified, the Z flag is updated to the original state of the target bit.
parameters:
- Dest is the register whose value will have one or more bits set to !Z.
- Src is a register, 9-bit literal, or 10-bit augmented literal whose value identifies the bit(s) to modify.
flags_affected:
  C: Set to original D[S[4:0]] (original state of target bit)
  Z: Set to original D[S[4:0]] (original state of target bit)
timing:
  cycles: 2
  type: fixed
encoding:
- bits: EEEE 0100101 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: original D[S[4:0]]
  z: original D[S[4:0]]
  clocks: '2'
documentation_source: PASM2 Manual 2022/11/01
documentation_level: comprehensive
compiler_operand_format:
  name: operand_bitx
  pattern: D,S/#
  description: 'Bit manipulation with optional effect flags: Destination register,
    bit position'
  valueType: 1
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 1
