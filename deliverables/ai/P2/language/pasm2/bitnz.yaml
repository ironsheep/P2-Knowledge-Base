instruction: BITNZ
syntax: BITNZ   D,{#}S         {WCZ}
category: Math and Logic
description: "BITNZ alters the Dest bit(s) designated by Src to equal the inverse state of the Z flag (!Z). All other bits are left unchanged. Src[4:0] indicates the bit number (0-31). For a range of bits, Src[4:0] indicates the base bit number (0-31) and Src[9:5] indicates how many contiguous bits beyond the base should be affected (1-31). A 9-bit literal Src is enough to express the base bit (Src[4:0]) and a range of up to 16 contiguous bits (Src[8:5]). If needed, use the augmented literal feature (##Src) to augment Src to a 10-bit literal value. When Src is a register, the register's value bits [9:0] are used as-is to form the 10-bit ID range, unless a prior SETQ overrides value bits[9:5] with the low five bits of the SETQ value. An ALTx between the SETQ and BITNZ keeps the override (SETQ #0, ALTB, BITNZ forces a single bit), and a SETQ separated from BITNZ by other instructions is not documented. If the WCZ effect is specified, the C and Z flags are updated to the original state of Dest's base bit, identified by Src. BITNZ takes no effect or WCZ."
result: Dest bit(s) described by Src are set to !Z; the rest are left as-is.
parameters:
- Dest is the register whose value will have one or more bits set to !Z.
- Src is a register, 9-bit literal, or 10-bit augmented literal whose value identifies the bit(s) to modify.
- WCZ is an optional effect to update flags.
flags_affected:
  C: With WCZ, set to original D[S[4:0]] (original state of target bit)
  Z: With WCZ, set to original D[S[4:0]] (original state of target bit)
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 0100101 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: original D[S[4:0]]
  z: original D[S[4:0]]
  clocks: '2'
encoding_notes:
- BITNZ and TESTBN with ORC or ORZ share the INSTR field 0100101; the effect bits tell them apart (BITNZ no effect = C Z 00, WCZ = 11; TESTBN ORC = 10, ORZ = 01). BITNZ takes either no effect or WCZ.
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, BITZ / BITNZ, pp.54-55"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 47 (BITNZ: bits D[S[9:5]+S[4:0]:S[4:0]] = !Z; other bits unaffected; prior SETQ overrides S[9:5]; C,Z = original D[S[4:0]]; 2 clocks; write D)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 0100101 CZI ... BITNZ D,S/# {WCZ}; the same INSTR field as TESTBN D,S/# ORC/ORZ)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, BITZ / BITNZ, pp.54-55 (Src[4:0] and Src[9:5], the 9-bit literal range of Src[8:5], ##Src, the SETQ substitution, C and Z set to the original base bit, 2 clocks)"
  - "CP-033 (BITNZ assembles as EEEE 0100101 with C Z = 00 with no effect and 11 with WCZ; TESTBN ORC/ORZ share 0100101 with C Z = 10/01)"
  - "description (prior SETQ overrides S[9:5]): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), list of changes (BITL/BITH/BITC/BITNC/BITZ/BITNZ/BITRND/BITNOT span of bits, prior SETQ overrides S[9:5])"
  - "description (SETQ #0 then ALTB then BITxxx forces Src[9:5] to 0): Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ALTB, pp.38-39; the manual's BITZ / BITNZ text says a SETQ immediately preceding substitutes its Dest[4:0]; a SETQ separated by other instructions is in no source"
