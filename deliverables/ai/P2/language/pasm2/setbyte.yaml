instruction: SETBYTE
syntax: 'SETBYTE Dest, {#}Src, #Num'
brief_description: Set byte
category: Math and Logic
description: >-
  SETBYTE stores Src[7:0] into the byte identified by Num within Dest, or the byte and
  register described by a prior ALTSB instruction. No other bits are modified. Num (0-3)
  identifies a value's individual bytes, by position, in least-significant byte order.
  Syntax 2 is intended for use after an ALTSB instruction, i.e. in a loop to iteratively
  affect a series of byte values within contiguous long registers.
result: >-
  Src[7:0] is written to byte Num (0-3) of Dest, or to another register byte described
  by prior ALTSB instruction.
parameters:
- Dest is the register in which to modify a byte.
- Src is a register or 8-bit literal whose bits [7:0] will be stored in the designated
  location.
- Num is a 2-bit literal identifying the byte ID (0-3) of Dest to modify.
flags_affected:
  C: No effect
  Z: No effect
syntax_variants:
- 'SETBYTE D,{#}S,#N'
- SETBYTE {#}S
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 1000110 NNI DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2'
- bits: EEEE 1000110 00I 000000000 SSSSSSSSS
  write: D1
  c: —
  z: —
  clocks: '2'
encoding_notes:
- Dest, and the target byte ID, is speciﬁed by a prior ALTSB instruction.
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_ds2set
  pattern: S/#{,D,#0..3}
  description: 'Set byte: source/immediate, optional destination and byte index 0-3'
  valueType: 8
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 8
