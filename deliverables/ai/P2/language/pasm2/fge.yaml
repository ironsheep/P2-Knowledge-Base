instruction: FGE
syntax: FGE Dest, {#}Src {WC|WZ|WCZ}
brief_description: Force greater or equal
category: Math and Logic
description: >-
  FGE sets unsigned Dest to unsigned Src if Dest is less than Src. This is also
  known as a limit minimum function; preventing Dest from sinking below Src.

  If the WC or WCZ effect is specified, the C flag is set (1) if Dest was limited
  (Dest was less than Src and now Dest is equal to Src), or is cleared (0) if not
  limited.

  If the WZ or WCZ effect is specified, the Z flag is set (1) if the result is zero,
  or is cleared (0) if it is non-zero.
result: >-
  Unsigned Dest is set to unsigned Src if Dest was less than Src. Optionally the
  C and Z flags indicate if the replacement happened and the zero status of the result.
parameters:
- Dest is a register containing the unsigned value to limit to a minimum of unsigned
  Src, and is where the result is written.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose unsigned value
  is the lower limit to force upon Dest.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set if limit was enforced
  Z: Set if result is zero
syntax_variants:
- FGE Dest, {#}Src {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 0011000 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: limit enforced
  z: Result == 0
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, FGE, p.81"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 26 (FGE D,{#}S: force D >= S; if D < S then D = S and C = 1, else D same and C = 0; 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, FGE, p.81 (encoding row, C limit enforced, Z Result = 0, description)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Math and logic instructions, p.36 (FGE D,{#}S {WC/WZ/WCZ}, 2 clocks)"
documentation_level: comprehensive
last_updated: '2025-09-19'
manual_extraction_date: '2025-01-19'
oneliner: Force unsigned value to be greater than or equal to another
related:
- FLE
- FGES
- FLES
