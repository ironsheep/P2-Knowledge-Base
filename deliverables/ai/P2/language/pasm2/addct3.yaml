instruction: ADDCT3
syntax: ADDCT3 Dest, {#}Src
brief_description: Add and set CT3 event trigger
category: Event
description: "ADDCT3 sets the hidden CT3 event trigger register to the value of Dest + Src. The result is also written to Dest. ADDCT3 clears the CT3 event flag. The flag is set whenever the System Counter (CT) passes the CT3 target, that is whenever the MSB of (CT - CT3) is 0. Parallax's documents also describe the event as triggering when CT = Dest + Src. Use the POLLCT3, WAITCT3, JCT3, and JNCT3 instructions to process CT3 time-based events."
flags_affected:
  C: No effect
  Z: No effect
result: The Src value is added into Dest and the result is also stored in the hidden CT3 event trigger register.
parameters:
- Dest is a register containing the value to add Src to, and is where the result is
  written.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value is added
  into Dest.
syntax_variants:
- ADDCT3 Dest, {#}Src
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1010011 10I DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ADDCT1/2/3, p.32"
sources:
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), POLLCT3/WAITCT3 event flag (cleared on ADDCT3; set whenever CT passes the result of the ADDCT3, MSB of CT minus CT3 is 0)"
  - "P2 Instructions v35 - Rev B/C Silicon, row 147 (ADDCT3: set CT3 event to trigger on CT = D + S; adds S into D)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ADDCT1/2/3, p.32 (the event triggers when CT = original Dest + Src)"
documentation_level: comprehensive
last_updated: '2025-09-19'
manual_extraction_date: '2025-01-19'
oneliner: Set CT3 counter event trigger time
long_description: "The Src value is added into Dest and the result is also stored in the hidden CT3 event trigger register. ADDCT3 clears the CT3 event flag. The flag is set whenever the System Counter (CT) passes the CT3 target, that is whenever the MSB of (CT - CT3) is 0. Parallax's documents also describe the event as triggering when CT = Dest + Src."
related:
- POLLCTx
- WAITCTx
- JCTx
- JNCTx
