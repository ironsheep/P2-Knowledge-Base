instruction: POLLATN
syntax: POLLATN {WC|WZ|WCZ}
brief_description: Poll attention
category: Event
description: >-
  POLLATN copies the state of the attention event flag into C and/or Z and then clears
  the flag (unless it's being set again by the event sensor).
  If the WC, WZ, or WCZ effect is specified, the C flag and/or Z flag is updated to
  the state of the attention event flag prior to clearing it.
  The attention event flag is set whenever a cog issues an attention request for
  this cog; a COGATN that names this cog's own bit also sets it. The attention event
  flag is cleared upon cog start, or execution of POLLATN, WAITATN, JATN, or JNATN
  instructions.
result: Attention event flag is optionally copied into C and/or Z, then it is cleared.
flags_affected:
  C: Set to ATN event flag state
  Z: Set to ATN event flag state
parameters:
- WC, WZ, or WCZ are optional effects to update flags.
syntax_variants:
- POLLATN {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1101011 CZ0 000001110 000100100
  write: —
  c: ATN Event
  z: ATN Event
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, POLLATN, p.111"
sources:
