  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, POLLATN, p.111 (Result line, WC / WZ / WCZ parameter, encoding row 000001110 / 000100100, write none, C and Z ATN Event, 2 clocks, Related list; the flag is copied into C and/or Z and then cleared unless set again by the event sensor; cleared upon cog start, POLLATN, WAITATN, JATN or JNATN)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), COG ATTENTION (COGATN strobes cause an attention event for POLLATN / WAITATN and interrupt use), EVENTS (the POLLxxx instructions simultaneously return their event-occurred flag into C and/or Z and clear it unless it is set again by the event sensor; POLLATN event flag: cleared on cog start, set whenever any cogs request attention, also cleared on POLLATN / WAITATN / JATN / JNATN), instruction encoding listing (EEEE 1101011 CZ0 000001110 000100100 POLLATN {WC/WZ/WCZ})"
  - "EF-099 (COGATN with the issuing cog's own bit raises that cog's attention event; detectors POLLATN WC, JATN, SETQ plus WAITATN WC, Spin2 POLLATN())"
