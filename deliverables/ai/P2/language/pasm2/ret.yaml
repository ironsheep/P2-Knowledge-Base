- "_RET_ prefix"
- "return from subroutine"
- "call and return"
ret_prefix_form: >-
  The _RET_ prefix (condition EEEE=%0000) executes the instruction and then
  returns if the instruction did not branch, with no C/Z context restore. On a
  branching instruction the branch stands and no return occurs, so '_RET_ CALL
  #target' is a plain CALL.
