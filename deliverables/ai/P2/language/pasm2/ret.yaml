instruction: RET
syntax: RET              {WC/WZ/WCZ}
encoding:
- bits: EEEE 1101011 CZ1 000000000 000101101
  write: —
  c: K[31]
  z: K[30]
  clocks: '4'
timing:
  cycles: 4
  type: variable
  range: 4 / 13...20
description: 'Return by popping stack (K). C = K[31], Z = K[30], PC = K[19:0].'
flags_affected:
  C: Set to K[31] (bit 31 of popped stack value)
  Z: Set to K[30] (bit 30 of popped stack value)
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.153; ret_prefix_form: Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, Conditions ( IF_x ), p.68, and P2 Instructions v35 - Rev B/C Silicon, Sheet1, RET row; ret_prefix_form (_RET_ CALL is a plain CALL): EF-058"
