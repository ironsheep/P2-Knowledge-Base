instruction: RETI1
syntax: RETI1
encoding:
- bits: EEEE 1011001 110 111111111 111110101
  write: PC
  c: IRET1[31]
  z: IRET1[30]
  clocks: '4 / 13...20'
  notes: D is INB ($1FF), which is read-only outside a debug ISR, so nothing is written to D (Parallax's documents also give D in the write column). During a debug ISR INB is the writable register IRET0; the effect of RETI1 executed there is not documented
timing:
  cycles: 4
  type: variable
  range: 4 / 13...20
description: >-
  Return from INT1. (CALLD $1FF,$1F5 WCZ). RETI1 is CALLD INB,IRET1 WCZ: it
  jumps to the return address held in IRET1 ($1F5) and sets C and Z from
  IRET1[31] and IRET1[30], restoring the flags the INT1 interrupt stored there.
  A CALLD with S = IRET1 and WCZ signals the cog that the interrupt is complete:
  the cog clears its interrupt-busy flag for INT1, so that another INT1
  interrupt can occur. D is INB, which is read-only outside a debug ISR, so the
  CALLD acts as a jump back to the interrupted code.
flags_affected:
  C: Set to IRET1[31], where the INT1 interrupt stored C
  Z: Set to IRET1[30], where the INT1 interrupt stored Z
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.153"
sources:
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.153 (RETI1: Return from INT1. (CALLD $1FF,$1F5 WCZ), 4 / 13...20; CALLD D,{#}S: write {C, Z, 10'b0, PC[19:0]} to D, C = S[31], Z = S[30])"
  - "P2 Instructions v35 - Rev B/C Silicon, row 164 (RETI1, EEEE 1011001 110 111111111 111110101, alias, 4 / 13...20) and row 157 (CALLD D,{#}S: C = S[31], Z = S[30])"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), INTERRUPTS (the interrupt stores the C/Z flags and return address in IRETx; RETI1 = CALLD INB,IRET1 WCZ; a CALLD with D = any register, S = IRETx and WCZ clears the cog's interrupt-busy flag for that interrupt, so another interrupt can occur; INB, read-only, makes the CALLD a JMP back to the interrupted code; the interrupt branch is an inserted CALLD IRETx,IJMPx WCZ); DEBUG INTERRUPT (during a debug ISR, INA and INB become readable/writable RAM registers named IJMP0 and IRET0)"
