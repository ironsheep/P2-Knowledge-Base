instruction: QLOG
syntax: QLOG    {#}D
encoding:
- bits: EEEE 1101011 00L DDDDDDDDD 000001110
  write: —
  c: —
  z: —
  clocks: '2...9'
timing:
  cycles: "2...9"
  type: variable
description: Compute the base-2 logarithm of D, an unsigned 32-bit integer, as a 5:27-bit
  value {5'whole_exponent, 27'fractional_exponent}. The top 5 bits hold the whole
  part of the power-of-2 exponent and the bottom 27 bits hold the fractional part.
  GETQX retrieves the result 55 clocks later.
flags_affected:
  C: No effect
  Z: No effect
long_description: 'QLOG converts an unsigned 32-bit integer into a 5:27-bit logarithm
  using the hub''s 54-stage pipelined CORDIC solver. The result has the whole part
  of the power-of-2 exponent in bits [31:27] and the fractional part in bits [26:0].
  Fifty-five clocks after the cog hands the command to the CORDIC solver, the result
  is available through GETQX, which waits if the result has not yet arrived.

  '
examples:
- code: |
    ' Calculate logarithm of 1000
    QLOG    ##1000         ' Begin log conversion
    ' Wait 55 clocks...
    GETQX   log_result     ' Get 5:27 logarithm
  description: Basic logarithm calculation
- code: |
    ' Calculate logarithm of variable
    QLOG    input_value
    ' ... other work for 55 clocks ...
    GETQX   logarithm
  description: Variable logarithm conversion
- code: |
    ' Isolate the whole part of the exponent
    QLOG    number
    ' ... wait 55 clocks ...
    GETQX   log_result
    SHR     log_result, #27        ' Bits [31:27], the whole part, move to bits [4:0]
  description: Extracting the whole part of the exponent
related_instructions:
- GETQX
- QEXP
operand_details:
  D: 32-bit unsigned integer input
result_details:
  GETQX: 5:27-bit logarithm (5-bit whole exponent in [31:27], 27-bit fractional in
    [26:0])
timing_notes: A cog waits for its hub slot, zero to (cogs-1) clocks away, to hand the
  command to the CORDIC solver. Fifty-five clocks later the result is available via
  GETQX.
format_notes: 'Result format: {5''whole_exponent, 27''fractional_exponent}.'
documentation_source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet Release November 1, 2022 (2022/11/01), CORDIC Solver, p.21, and CORDIC Solver Instructions, p.44; P2 Instructions v35 - Rev B/C Silicon, Sheet1; Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), CORDIC SOLVER (LOGARITHM)"
documentation_level: comprehensive
