instruction: CMPSX
syntax: CMPSX Dest, {#}Src {WC|WZ|WCZ}
brief_description: Compare signed, extended
category: Math and Logic
description: CMPSX compares the signed values of Dest and Src plus C (by subtracting Src + C from Dest) and optionally setting the C and Z flags accordingly. The CMPSX instruction is used to perform signed multi-long comparisons, such as 64-bit comparisons. If the WC or WCZ effect is specified, the C flag is set (1) if Dest is less than Src + C (as multi-long values). Use WC or WCZ on preceding CMP and CMPX instructions for proper final C flag. If the WZ or WCZ effect is specified, the Z flag is set (1) if Z was previously set and the result of Dest - (Src + C) is zero, or it is cleared (0) if non-zero.
result: Greater/lesser and equality status is optionally written to the C and Z flags.
parameters:
- Dest is the register containing the value to compare with that of Src.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value is compared to Dest.
flags_affected:
  C: Set if signed D < (S + C), correct sign of difference
  Z: Set if Z was set AND D == (S + C)
syntax_variants:
- CMPSX Dest, {#}Src {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:
- bits: EEEE 0010011 CZI DDDDDDDDD SSSSSSSSS
  write: —
  c: correct sign of (D - (S + C))
  z: Z AND (D == S + C)
  clocks: '2'
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_ds
  pattern: D,S/#
  description: Destination register, Source register or immediate value
  valueType: 0
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 0
