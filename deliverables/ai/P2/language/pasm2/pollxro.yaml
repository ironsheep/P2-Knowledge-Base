instruction: POLLXRO
syntax: POLLXRO {WC|WZ|WCZ}
brief_description: Poll streamer rollover NCO
category: Event
description: >-
  POLLXRO copies the state of the streamer NCO rollover event flag into C and/or Z and
  then clears the flag (unless it's being set again by the event sensor). If the WC,
  WZ, or WCZ effect is specified, the C flag and/or Z flag is updated to the state of
  the streamer-NCO-rollover event flag prior to clearing it. The streamer-NCO-rollover
  event flag is set whenever the streamer's numerically-controlled oscillator (NCO)
  rolls over. The streamer-NCO-rollover event flag is cleared upon execution of XINIT,
  XZERO, XCONT, POLLXRO, WAITXRO, JXRO, or JNXRO instructions.
result: Streamer-NCO-rollover event flag is optionally copied into C and/or Z, then
  it is cleared.
flags_affected:
  C: Set to XRO event flag state
  Z: Set to XRO event flag state
parameters:
- WC, WZ, or WCZ are optional effects to update flags.
syntax_variants:
- POLLXRO {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1101011 CZ0 000001100 000100100
  write: —
  c: XRO Event
  z: XRO Event
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, POLLXRO, p.116"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 283 (POLLXRO {WC/WZ/WCZ}: get XRO event flag into C/Z, then clear it; 2 clocks)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Event instructions, p.43 (POLLXRO {WC/WZ/WCZ}, 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, POLLXRO, p.116 (Result line, WC / WZ / WCZ parameter, encoding row 000001100 / 000100100, write none, C and Z XRO Event, 2 clocks, Related list; the flag is set whenever the streamer's numerically-controlled oscillator (NCO) rolls over; cleared upon XINIT, XZERO, XCONT, POLLXRO, WAITXRO, JXRO or JNXRO)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), EVENTS (the POLLxxx instructions simultaneously return their event-occurred flag into C and/or Z and clear it unless it is set again by the event sensor; POLLXRO event flag: cleared on XINIT / XZERO / XCONT, set whenever the streamer NCO rolls over, also cleared on POLLXRO / WAITXRO / JXRO / JNXRO), instruction encoding listing (EEEE 1101011 CZ0 000001100 000100100 POLLXRO {WC/WZ/WCZ})"
