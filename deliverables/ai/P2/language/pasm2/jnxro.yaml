instruction: JNXRO
syntax: JNXRO   {#}S
category: Event
description: Jump to S if XRO (streamer NCO rollover) event flag is clear.
flags_affected:
  C: No effect
  Z: No effect
parameters:
- 'Src is a register, 9-bit literal, or 20-bit augmented literal whose value is the
  absolute or relative address to set PC to. Use # for relative addressing; omit #
  for absolute addressing.'
timing:
  cycles: 2
  type: variable
encoding:
- bits: EEEE 1011110 01I 000011100 SSSSSSSSS
  write: —
  c: —
  z: —
  clocks: 2 or 4
encoding_notes:
- PC is written only when the streamer NCO rollover event ﬂag is set (or is clear
  in syntax 2).
documentation_source: PASM2 Manual 2022-11-01
documentation_level: enhanced
compiler_operand_format:
  name: operand_jpoll
  pattern: S/#
  description: 'Poll jump: target address/immediate'
  valueType: 21
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 21
