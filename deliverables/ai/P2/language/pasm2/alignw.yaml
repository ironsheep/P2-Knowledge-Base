directive: ALIGNW
name: ALIGNW
description: 'Align to word boundary (2-byte alignment)

  Inserts zero bytes as needed to align the next data or instruction to a word boundary

  '
category: Assembly Directives
documentation_level: complete
syntax: ALIGNW
usage: 'Use before data declarations that should start on a word boundary

  (a read or write of a word that crosses a hub long boundary takes one more clock)

  '
examples:
- code: 'ALIGNW            '' Align to next word boundary

    myword   word  0  '' This will start on a word-aligned address

    '
  description: Ensure data starts on word boundary
notes:
- Inserts 0-1 bytes of padding as needed
- Hub RAM has no special alignment rules for words and longs; a word that crosses a hub long boundary takes one additional clock to read or write
related:
- ALIGNL
- ORG
- WORD
oneliner: Align to word boundary (2-byte alignment)
