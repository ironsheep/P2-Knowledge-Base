instruction: ROL
syntax: ROL Dest, {#}Src {WC|WZ|WCZ}
brief_description: Rotate left
category: Math and Logic
description: >-
  ROL rotates Dest's binary value left by Src places (0-31 bits). All MSBs rotated out
  are moved into the new LSBs. If the WC or WCZ effect is specified, the C flag is
  updated to the value of the last bit rotated out (effectively C = result bit "0") if
  Src is 1-31, or to Dest[31] if Src is 0. If the WZ or WCZ effect is specified, the Z
  flag is set (1) if the Dest result equals zero, or is cleared (0) if it is non-zero.
  Since no bits are lost by this operation, the result will only be zero if Dest started
  at zero.
result: The bits of Dest are rotated left by Src bits; any departing MSBs are moved
  into LSBs.
parameters:
- Dest is the register containing the value to rotate left by Src bits.
- Src is a register or 5-bit literal whose value indicates the number of bit positions
  to rotate.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set to last bit rotated out if S[4:0] > 0, else D[31]
  Z: Set if result equals zero
syntax_variants:
- ROL D,{#}S {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 0000001 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: last bit shifted out if S[4:0] > 0, else D[31]
  z: Result == 0
  clocks: '2'
encoding_notes:
- C = last bit rotated out if Src[4:0] > 0, else C = Dest[31].
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ROL, p.119"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 3 (ROL D,{#}S {WC/WZ/WCZ}: rotate left, D = [63:32] of ({D[31:0], D[31:0]} << S[4:0]), C = last bit shifted out if S[4:0] > 0, else D[31]; footnote * Z = (result == 0); 2 clocks; write D)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Math and Logic Instructions, p.37 (ROL D,{#}S {WC/WZ/WCZ}, 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ROL, p.119 (Result line, Dest and Src parameters, encoding row 0000001 CZI, write D, C last bit out, Z Result = 0, 2 clocks, footnote C = last bit rotated out if Src[4:0] > 0 else Dest[31], the rotate explanation, the WC rule (last bit rotated out, effectively result bit 0, if Src is 1-31, Dest[31] if Src is 0), the WZ rule and the sentence that the result is zero only if Dest started at zero)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 0000001 CZI DDDDDDDDD SSSSSSSSS ROL D,S/# {WC/WZ/WCZ})"
