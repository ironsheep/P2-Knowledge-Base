instruction: ONES
syntax: ONES Dest, {#}Src {WC|WZ|WCZ}
brief_description: Ones
category: Math and Logic
description: >-
  ONES tallies the number of high bits (1s) of Src, or Dest, and stores the count
  into Dest. This is a population count (popcount) operation.
  If the WC or WCZ effect is specified, the C flag is set (1) if the count is odd,
  or is cleared (0) if it is even.
  If the WZ or WCZ effect is specified, the Z flag is set (1) if the result equals
  zero, or is cleared (0) if not zero.
result: >-
  The number of high bits (1s) in Src, or Dest, is stored in Dest. C reflects the
  parity (odd/even count) and Z indicates if count is zero.
parameters:
- Dest is the register in which to store the number of high bits found and optionally
  it begins by containing the value to check (syntax 2).
- Src is an optional register, 9-bit literal, or 32-bit augmented literal whose value
  is to be checked for ones.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set if result is odd (parity)
  Z: Set if result equals zero
syntax_variants:
- ONES Dest, {#}Src {WC|WZ|WCZ}
- ONES Dest {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 0111101 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: Result is odd
  z: Result == 0
  clocks: '2'
- bits: EEEE 0111101 CZ0 DDDDDDDDD DDDDDDDDD
  write: D
  c: Result is odd
  z: Result == 0
  clocks: '2'
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_du
  pattern: D{,S/#}
  description: Destination register, optional Source register or immediate (unary/binary)
  valueType: 3
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 3
