instruction: LOC
syntax: LOC     PA/PB/PTRA/PTRB,#{\}A
encoding:
- bits: EEEE 11101WW RAA AAAAAAAAA AAAAAAAAA
  write: Per W
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: >-
  Load address into PA, PB, PTRA, or PTRB. If the R bit is 1 (default for relative
  addressing), address = PC + A. If R = 0 (forced with \ prefix), address = A.
flags_affected:
  C: No effect
  Z: No effect
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release (2022/11/01), Propeller 2 Assembly Language (PASM2) in Brief, p.149; P2 Instructions v35 - Rev B/C Silicon, Sheet1"
documentation_level: minimal
compiler_operand_format:
  name: operand_loc
  pattern: D,#S{\}
  description: 'Load address: destination register, immediate address (optional \
    for absolute)'
  valueType: 22
compiler_encoding:
