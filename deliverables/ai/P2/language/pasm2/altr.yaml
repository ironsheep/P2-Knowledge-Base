instruction: ALTR
syntax: ALTR Dest, {#}Src
brief_description: Alter result
category: Register Indirection
description: 'ALTR modifies the next instruction''s Result address to be (Src + Dest) & $1FF (for syntax 1), or to Dest[8:0] (for syntax 2). The Result address is the Dest address by default-- it identifies where the result value from the instruction''s execution is written at the end of execution. During execution, the pipeline holds an instruction''s Dest address and the Result address as two separate entities, normally set to the same location. ALTR causes the next instruction''s Result to redirect to a different address; changing an instruction from a destructive (operand overwriting) operation to a non-destructive (operand preserving) operation. In syntax 1, Src consists of two 9-bit fields; a base value (Src[8:0]) and a signed auto-indexer (Src[17:9]). The base represents a starting point. ALTR adds the offset (Dest[8:0]) to the base (Src[8:0]) to determine the next instruction''s Result address. At the end of ALTR execution, the optional auto-indexer value (usually 0, 1, or -1) is added to the offset (Dest) for a future ALTR+instruction iteration. In syntax 2, Dest serves as the full value-- it is used as-is for the next instruction''s substitute Result address.'
result: The next instruction's pipelined Result address (Dest address by default) is altered to be (Src + Dest) & $1FF, or just Dest[8:0] in syntax 2.
parameters:
- Dest is the register whose 9-bit value is the offset, or the full value, for the next instruction to operate on.
- Src is an optional register, 9-bit literal, or 18-bit augmented literal whose value contains a base (Src[8:0]; added to offset (Dest) for the next instruction) and also an optional auto-indexer value (Src[17:9]; added to Dest at the end of execution).
flags_affected:
  C: No effect
  Z: No effect
syntax_variants:
- ALTR Dest, {#}Src
- ALTR Dest
usage_notes: 'The instruction following ALTR is shielded from interrupt

  ALTR alters the next instruction regardless of its kind

  Field value modification occurs in the instruction pipeline only; code is not altered,
  values do not persist

  SETQ / SETQ2 does not affect ALTx instructions-- the Q value passes through to the
  next instruction'
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1001100 00I DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2'
- bits: EEEE 1001100 001 DDDDDDDDD 000000000
  write: D
  c: —
  z: —
  clocks: '2'
encoding_notes:
- Dest is post-adjusted by the auto-indexer value; the sign-extended Src[17:9]. In
  syntax 2, the auto-indexer value is 0.
- Src[17:9] is sign-extended before it is added into Dest.
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ALTR, p.45"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, rows 114-115 (ALTR: result register address of the next instruction = (D + S) & $1FF, or D[8:0]; D += sign-extended S[17:9]; next instruction shielded from interrupt; 2 clocks)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), REGISTER INDIRECTION (S[17:9] is always sign-extended and added to D for index updating; ALTR sets the next write address)"
documentation_level: comprehensive
last_updated: '2025-09-19'
manual_extraction_date: '2025-01-19'
oneliner: Alter Result register address of next instruction
