instruction: DJF
syntax: DJF     D,{#}S
encoding:
- bits: EEEE 1011011 10I DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2 or 4'
timing:
  cycles: 2
  type: variable
  range: 13...20
description: >-
  DJF decrements the value in Dest, writes the result, and jumps to the address
  described by Src if the result is full ($FFFF_FFFF, or -1 signed).

  This instruction is useful for implementing loops that count down until a register
  wraps from 0 to -1. Use # prefix on Src for relative addressing; omit # for
  absolute addressing.
result: >-
  Dest is decremented. If the result equals $FFFF_FFFF (full), PC is set to a new
  relative (#Src) or absolute (Src) address; otherwise execution continues with
  the next instruction.
documentation_source: PASM2 Manual 2022/11/01
documentation_level: comprehensive
compiler_operand_format:
  name: operand_dsj
  pattern: D,S/@
  description: 'Jump with destination and relative address: register, relative address'
  valueType: 12
compiler_encoding:
  operandFormat: 12
enhancement_source: PNUT_TS_v2.0_complete_operand_integration_2025-09-13
syntax_variants:
- DJF D,{#}S
last_updated: '2025-09-19T16:04:17.087687'
parameters:
- Dest is a register whose value is decremented and tested for full or not full.
- 'Src is a register, 9-bit literal, or 20-bit augmented literal whose value is the
  absolute or relative address to set PC to. Use # for relative addressing; omit #
  for absolute addressing.'
flags_affected:
  C: No effect
  Z: No effect
category: Branch
oneliner: Decrement value and jump if full (-1; $FFFF_FFFF) or not full (<> -1; <>
  $FFFF_FFFF)
