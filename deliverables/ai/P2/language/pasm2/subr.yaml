instruction: SUBR
syntax: SUBR Dest, {#}Src {WC|WZ|WCZ}
brief_description: Subtract reverse
category: Math and Logic
description: >-
  SUBR subtracts the unsigned Dest from the unsigned Src and stores the result into
  the Dest register. This is the reverse of the subtraction order of SUB. If the WC
  or WCZ effect is specified, the C flag is set (1) if the subtraction results in a
  32-bit underflow (unsigned borrow), or is cleared (0) if no borrow. If the WZ or
  WCZ effect is specified, the Z flag is set (1) if the result of Src - Dest is zero,
  or is cleared (0) if it is non-zero.
result: >-
  Difference of unsigned Src and unsigned Dest is stored in Dest and optionally the
  C and Z flags are updated to the borrow and zero status.
parameters:
- Dest is a register containing the value to subtract from Src, and is where the result
  is written.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value is subtracted
  by Dest.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set if unsigned borrow (underflow) occurs
  Z: Set if result equals zero
syntax_variants:
- SUBR D,{#}S {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 0010110 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: borrow of (S - D)
  z: Result == 0
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, SUBR, pp.130-131"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 24 (SUBR D,{#}S {WC/WZ/WCZ}: subtract D from S (reverse), D = S - D, C = borrow of (S - D); footnote * Z = (result == 0); 2 clocks; write D)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Math and Logic Instructions, p.38 (SUBR D,{#}S {WC/WZ/WCZ}: subtract D from S (reverse), D = S - D, C = borrow of (S - D), 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, SUBR, pp.130-131 (Result line, Dest, Src and effect parameters, encoding row 0010110 CZI, write D, C borrow of (S - D), Z Result = 0, 2 clocks, Related SUB, the reverse-of-SUB explanation on p.130; the WC rule (32-bit underflow, unsigned borrow) and the WZ rule on p.131)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 0010110 CZI DDDDDDDDD SSSSSSSSS SUBR D,S/# {WC/WZ/WCZ})"
documentation_level: comprehensive
last_updated: '2025-09-19'
manual_extraction_date: '2025-01-19'
oneliner: Subtract one unsigned value from another (in reverse order to SUB)
related:
- SUB
