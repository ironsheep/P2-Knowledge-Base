  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, GETNIB, p.88 (both encoding rows, Num 0-7 in least-significant nibble order, syntax 2 after ALTGN)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Math and logic instructions, p.36 (GETNIB D and GETNIB D,{#}S,#N, 2 clocks)"
