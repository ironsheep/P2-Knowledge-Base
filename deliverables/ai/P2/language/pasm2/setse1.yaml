instruction: SETSE1
syntax: SETSE1  {#}D
encoding:
- bits: EEEE 1101011 00L DDDDDDDDD 000100000
  write: —
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: |
  Set SE1 event configuration to D[8:0]. Configures selectable event 1 to trigger
  on the specified pin, LUT, or lock condition. Also clears the SE1 event flag.

  IMPORTANT: SETSE can ONLY configure pin, LUT, or lock events.
  Timer (CT), ATN, pattern match, streamer, and CORDIC events cannot be configured
  with SETSE - they have dedicated WAIT/POLL instructions.
d_encoding:
  title: "D[8:0] Configuration Values (Silicon Doc v35)"
  lut_events:
    - encoding: "%000_00_00AA"
      description: "This cog reads LUT address %1111111AA"
    - encoding: "%000_00_01AA"
      description: "This cog writes LUT address %1111111AA"
    - encoding: "%000_00_10AA"
      description: "Odd/even companion cog reads LUT address %1111111AA"
    - encoding: "%000_00_11AA"
      description: "Odd/even companion cog writes LUT address %1111111AA"
  lock_events:
    - encoding: "%000_01_LLLL"
      description: "Hub lock %LLLL rises (acquired)"
    - encoding: "%000_10_LLLL"
      description: "Hub lock %LLLL falls (released)"
    - encoding: "%000_11_LLLL"
      description: "Hub lock %LLLL changes"
  pin_edge_events:
    - encoding: "%001_PPPPPP"
      description: "INA/INB bit of pin %PPPPPP rises (positive edge)"
    - encoding: "%010_PPPPPP"
      description: "INA/INB bit of pin %PPPPPP falls (negative edge)"
    - encoding: "%011_PPPPPP"
      description: "INA/INB bit of pin %PPPPPP changes (any edge)"
  pin_level_events:
    - encoding: "%10x_PPPPPP"
      description: "INA/INB bit of pin %PPPPPP is low (level detection)"
    - encoding: "%11x_PPPPPP"
      description: "INA/INB bit of pin %PPPPPP is high (level detection)"
  notes: |
    - PPPPPP = pin number 0-63
    - LLLL = lock number 0-15
    - AA = LUT address bits (addresses $1FC-$1FF)
    - x = don't care bit
flags_affected:
  C: No effect
  Z: No effect
examples:
  - code: "SETSE1  #%001_000010"
    description: "Configure SE1 for pin 2 rising edge (positive edge)"
  - code: "SETSE1  #%010_000101"
    description: "Configure SE1 for pin 5 falling edge (negative edge)"
  - code: "SETSE1  #%011_111111"
    description: "Configure SE1 for pin 63 any edge"
  - code: "SETSE1  #%110_000000"
    description: "Configure SE1 for pin 0 high level"
  - code: "SETSE1  #%000_01_0101"
    description: "Configure SE1 for lock 5 rises"
  - code: "SETSE1  #%000_11_1111"
    description: "Configure SE1 for lock 15 changes"
related:
  - language/pasm2/setse2.yaml
  - language/pasm2/setse3.yaml
  - language/pasm2/setse4.yaml
  - language/pasm2/waitse1.yaml
  - language/pasm2/pollse1.yaml
  - architecture/event_system.yaml
documentation_source: Silicon Doc v35, PASM2 Manual 2022-11-01
documentation_level: comprehensive
