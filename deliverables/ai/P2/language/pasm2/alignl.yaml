directive: ALIGNL
name: ALIGNL
description: 'Align to long boundary (4-byte alignment)

  Inserts zero bytes as needed to align the next data or instruction to a long boundary

  '
category: Assembly Directives
documentation_level: complete
syntax: ALIGNL
usage: 'Use before data declarations or code sections that should start on a long

  boundary (for example, the target of a hub branch, which costs one more clock when

  not long-aligned)

  '
examples:
- code: 'ALIGNL            '' Align to next long boundary

    mydata   long  0  '' This will start on a long-aligned address

    '
  description: Ensure data starts on long boundary
notes:
- Inserts 0-3 bytes of padding as needed
- Hub RAM has no special alignment rules for words and longs; a read or write of a long that crosses a hub long boundary takes one additional clock, and a branch to a hub address that is not long-aligned takes one additional clock
related:
- ALIGNW
- ORG
- LONG
oneliner: Align to long boundary (4-byte alignment)
