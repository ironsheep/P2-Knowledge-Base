aliases:
- WRLUT immediate address limit
- LUT literal address 0-255
- WRLUT 256 compile error
immediate_address_limit:
  rule: >-
    A plain immediate S is #0 to #255: WRLUT D,#256 is refused with "Constant
    must be from 0 to 255". WRLUT D,##256 assembles.
  full_range_access: >-
    The 32-bit words are addressible from $000 to $1FF. S gives the LUT address, so
    an address held in a register used as S (WRLUT D,S) reaches $100-$1FF, which a
    plain immediate cannot. Not documented: which bits of the register form the
    address.
  ptrx_expression: >-
    WRLUT accepts a PTRx expression for S. PTRA updates count LUT longs: with PTRA = 8,
    WRLUT D,PTRA++ writes LUT[8] and adds 1 to PTRA. Not documented: the PTRB,
    pre-increment and -- forms, and WRLUT with an index on PTRx.
  augmented_form_warning: >-
    Not documented: what WRLUT does with an augmented S value (WRLUT D,##...).
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), LOOKUP RAM (the 32-bit words are addressible from $000 to $1FF); Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (WRLUT D/#,S/#/PTRx), list of changes (RDLUT/WRLUT can now handle PTRx expressions); CP-042 (WRLUT D,#256 refused; #255 and ##256 accepted); ptrx_expression: P2 hardware verification, EF-118 (one board, cog execution; PTRA = 8, WRLUT PTRA++ wrote index 8 with PTRA delta 1); full_range_access (register S): P2 Instructions v35 - Rev B/C Silicon, row 220 (Write D to LUT address {#}S/PTRx)"
