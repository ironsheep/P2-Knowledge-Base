instruction: WAITINT
syntax: WAITINT {WC|WZ|WCZ}
brief_description: Wait interrupt
category: Event
description: >-
  WAITINT waits for an interrupt-occurred event to occur (unless the event flag is
  already set), then clears the event flag (unless it's being set again by the event
  sensor) and resumes execution at the next instruction. Optionally, WAITINT can
  time-out if the interrupt-occurred event doesn't occur soon enough; setting C and/or
  Z flags and then resuming execution at the next instruction. To set the optional
  timeout, insert a SETQ (with a future System Counter target value) right before
  WAITINT. The WC, WZ, or WCZ effect is recommended only if the optional timeout is
  specified, in which case the C flag and/or Z flag is set (1) if a timeout occurred
  before the event, or is cleared (0) if the event occurred before the timeout. During
  a wait, the pipeline is stalled; no instructions execute and no interrupts are
  processed in the cog until the wait condition ends. The interrupt-occurred event
  flag is set whenever interrupt 1, 2, or 3 occurs -- debug interrupts are ignored.
  The interrupt-occurred event flag is cleared upon cog start, or execution of POLLINT,
  WAITINT, JINT, or JNINT instructions.
result: >-
  Wait for interrupt-occurred event, then clear the flag; optionally aborting on
  timeout and setting C and/or Z on abort.
parameters:
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set if timeout occurred before event
  Z: Set if timeout occurred before event
syntax_variants:
- WAITINT {WC|WZ|WCZ}
timing:
  cycles: 2
  type: variable
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 1101011 CZ0 000010000 000100100
  write: —
  c: Timeout Abort
  z: Timeout Abort
  clocks: 2+
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
