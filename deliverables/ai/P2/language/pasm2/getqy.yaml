instruction: GETQY
syntax: GETQY   D        {WC/WZ/WCZ}
encoding:
- bits: EEEE 1101011 CZ0 DDDDDDDDD 000011001
  write: D
  c: Y[31]
  z: Result == 0
  clocks: '2...58'
timing:
  cycles: 2
  type: variable
  range: 2...58
description: >-
  Retrieve CORDIC result Y into D. Waits in case result is not ready. If the WC
  effect is specified, C is set to Y[31] (the sign bit). If the WZ effect is
  specified, Z is set if the result equals zero.
flags_affected:
  C: Set to Y[31] (sign bit)
  Z: Set if result is zero
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.158"
documentation_level: enhanced
compiler_operand_format:
  name: operand_d
  pattern: D
  description: Destination register only
  valueType: 24
compiler_encoding:
  operandFormat: 24
syntax_variants:
- GETQY D
