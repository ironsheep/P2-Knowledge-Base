instruction: TESTB
syntax: TESTB   D,{#}S         WC|WZ|ANDC|ANDZ|ORC|ORZ|XORC|XORZ
encoding:
- bits: EEEE 0100000 CZI DDDDDDDDD SSSSSSSSS
  write: —
  c: D[S[4:0]]
  z: D[S[4:0]]
  clocks: '2'
- bits: EEEE 0100010 CZI DDDDDDDDD SSSSSSSSS
  write: —
  c: C/Z AND  D[S[4:0]]
  z: C/Z AND  D[S[4:0]]
  clocks: '2'
- bits: EEEE 0100100 CZI DDDDDDDDD SSSSSSSSS
  write: —
  c: C/Z OR   D[S[4:0]]
  z: C/Z OR   D[S[4:0]]
  clocks: '2'
- bits: EEEE 0100110 CZI DDDDDDDDD SSSSSSSSS
  write: —
  c: C/Z XOR  D[S[4:0]]
  z: C/Z XOR  D[S[4:0]]
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: >-
  TESTB reads the state (0/1) of bit Src[4:0] of Dest and either stores it as-is
  into C or Z (WC, WZ), or bitwise ANDs (ANDC, ANDZ), ORs (ORC, ORZ) or XORs (XORC,
  XORZ) it into C or Z. Dest is not written. One of the eight effects is required;
  WCZ is not accepted.
result: >-
  The state of Dest's bit Src[4:0] is read and either stored as-is, or bitwise
  ANDed, ORed, or XORed into C or Z.
parameters:
- Dest is the register whose value will have a single bit tested.
- Src is a register or 5-bit literal whose value identifies the bit (0-31) of Dest
  to test.
- WC, WZ, ANDC, ANDZ, ORC, ORZ, XORC and XORZ are a required effect to update or
  bitwise combine into the C or Z flag.
flags_affected:
  C: Written only by a C effect - WC sets C to D[S[4:0]]; ANDC, ORC and XORC combine D[S[4:0]] into C with AND, OR and XOR; a Z effect leaves C unchanged
  Z: Written only by a Z effect - WZ sets Z to D[S[4:0]]; ANDZ, ORZ and XORZ combine D[S[4:0]] into Z with AND, OR and XOR; a C effect leaves Z unchanged
encoding_notes:
- TESTB shares its INSTR field with BITL, BITC, BITZ and BITRND, and the effect bits tell them apart. 0100000 is TESTB WC or WZ (C Z = 10 or 01) and BITL with no effect or WCZ (C Z = 00 or 11); 0100010 is TESTB ANDC or ANDZ (C Z = 10 or 01) and BITC; 0100100 is TESTB ORC or ORZ and BITZ; 0100110 is TESTB XORC or XORZ and BITRND. TESTB takes one of the eight effects, and a WCZ on TESTB is refused.
sources:
  - "encoding rows and effects: P2 Instructions v35 - Rev B/C Silicon, rows 34, 36, 38, 40 (TESTB with WC/WZ, ANDC/ANDZ, ORC/ORZ, XORC/XORZ); Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 0100000, 0100010, 0100100, 0100110 for TESTB; the same fields for BITL, BITC, BITZ, BITRND); Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, TESTB / TESTBN, pp.134-135"
  - "encoding_notes: CP-033 (the assembled words: testb wc/wz, andc/andz, orc/orz and xorc/xorz carry the same opcode field as bitl, bitc, bitz and bitrnd; the effect bits C Z are 10 or 01 for TESTB and 00 or 11 for BITx; testb x,#1 wcz is refused with 'Expected WC, WZ, ANDC, ANDZ, ORC, ORZ, XORC, or XORZ')"
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, TESTB / TESTBN, pp.134-135"
documentation_level: enhanced
syntax_variants:
- TESTB D,{#}S WC|WZ
- TESTB D,{#}S ANDC|ANDZ
- TESTB D,{#}S ORC|ORZ
- TESTB D,{#}S XORC|XORZ
