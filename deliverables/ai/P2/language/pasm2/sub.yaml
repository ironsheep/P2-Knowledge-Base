instruction: SUB
syntax: SUB Dest, {#}Src {WC|WZ|WCZ}
brief_description: Subtract
category: Math and Logic
description: >-
  SUB subtracts the unsigned Src from the unsigned Dest and stores the result into the
  Dest register. If the WC or WCZ effect is specified, the C flag is set (1) if the
  subtraction results in a 32-bit underflow (unsigned borrow), or is cleared (0) if no
  borrow. If the WZ or WCZ effect is specified, the Z flag is set (1) if the result of
  Dest - Src is zero, or is cleared (0) if it is non-zero. To subtract unsigned,
  multi-long values, use SUB followed by SUBX as described in Subtracting Two Multi-Long
  Values. SUB and SUBX are also used in subtracting signed, multi-long values with SUBSX
  ending the sequence.
result: >-
  Difference of unsigned Dest and unsigned Src is stored in Dest and optionally the C
  and Z flags are updated to the borrow and zero status.
parameters:
- Dest is a register containing the value to subtract Src from, and is where the result
  is written.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value is subtracted
  from Dest.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set if unsigned borrow (underflow) occurs
  Z: Set if result equals zero
syntax_variants:
- SUB D,{#}S {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 0001100 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: borrow of (D - S)
  z: Result == 0
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, SUB, p.130"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 14 (SUB D,{#}S: subtract S from D, D = D - S, C = borrow of (D - S), Z = (result == 0); 2 clocks; write D)"
