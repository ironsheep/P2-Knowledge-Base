instruction: FBLOCK
syntax: FBLOCK  {#}D,{#}S
encoding:
- bits: EEEE 1100100 1LI DDDDDDDDD SSSSSSSSS
  write: —
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: Set next block for when block wraps. D[13:0] = block count in 64-byte
  units (0 = no wrapping until the entire 1MB hub map has been sequenced through),
  S[19:0] = block start address (long-aligned when wrapping).
notes:
- "FBLOCK sets the start address and 64-byte block count taken when the current blocks are fully read or written, in place of wrapping back to the prior start address and reloading the prior block count."
- "FBLOCK can be executed after RDFAST, after WRFAST, or after a FIFO block wrap event."
- "D and S layout: D[13:0] = %00_0000_0000_0000 for limited reading or writing (no wrap) or %BB_BBBB_BBBB_BBBB for a wrapping block count; S[19:0] = start address, with S[1:0] = %00 when wrapping."
- "FBLOCK never waits and always takes 2 clocks."
flags_affected:
  C: No effect
  Z: No effect
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release (2022/11/01), Propeller 2 Assembly Language (PASM2) in Brief, p.154; P2 Instructions v35 - Rev B/C Silicon, Sheet1; Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), FAST SEQUENTIAL FIFO INTERFACE (FBLOCK paragraph and operand layouts)"
