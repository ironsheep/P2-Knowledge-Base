instruction: RGBSQZ
syntax: RGBSQZ  D
encoding:
- bits: EEEE 1101011 000 DDDDDDDDD 001100110
  write: D
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: >-
  Squeeze 8:8:8 RGB value in D[31:8] into 5:6:5 value in D[15:0].
  D = {15'b0, D[31:27], D[23:18], D[15:11]}. The 5:6:5 value occupies D[15:0] and
  the 15'b0 field above it makes D[30:16] zero. Not documented: the value written
  to D[31], because the listed fields total 31 bits.
flags_affected:
  C: No effect
  Z: No effect
