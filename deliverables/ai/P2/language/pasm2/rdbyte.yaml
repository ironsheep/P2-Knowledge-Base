instruction: RDBYTE
syntax: RDBYTE  D,{#}S/P {WC/WZ/WCZ}
encoding:
- bits: EEEE 1010110 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: MSB of byte
  z: Result == 0
  clocks: '9...16'
timing:
  cycles: 9
  type: variable
  range: 9...16 / 9...26
description: '{WC/WZ/WCZ}     Read zero-extended byte from hub address {#}S/PTRx into
  D. C = MSB of byte. *'
flags_affected:
  C: Set to MSB of byte
  Z: Set if result equals zero
silicon_errata:
  after_no_wait_rdfast: "Started fewer than 16 clocks after a no-wait RDFAST (D[31]=1), RDBYTE can complete before its own read: D gets the byte at its own offset within the PREVIOUS hub read's long, and C/Z are set from that wrong value. Rule: use the waiting RDFAST (D[31]=0), or start this RDBYTE at least 16 clocks after the no-wait RDFAST (e.g. WAITX #12 directly after it). Full account: language/pasm2/rdfast.yaml silicon_errata."
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.154"
documentation_level: enhanced
compiler_operand_format:
  name: operand_dsp
  pattern: D,S/#/PTRA/PTRB
  description: Destination, source/immediate/pointer register
  valueType: 15
compiler_encoding:
  operandFormat: 15
syntax_variants:
- RDBYTE D,{#}S/P
last_updated: '2025-09-19T16:04:16.899014'
category: Hub RAM
oneliner: Read zero-extended byte from hub RAM
immediate_address_note:
  note: >-
    A plain immediate source/address operand is limited to 0-255 (the 9-bit S
    field's bit 8 is the pointer/expression selector, so a literal spans only bits
    7:0). For 20-bit hub addresses this rarely matters - use a register, a
    PTRA/PTRB pointer, or the ## augmented form for the full range. This cap is
    shared across the hub-memory operand family (RDLONG WRLONG RDBYTE WRBYTE RDWORD
    WRWORD WMLONG) and is felt most with RDLUT/WRLUT, where small LUT addresses are
    written as bare literals.
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), HUB, RANDOM ACCESS INTERFACE (the S/#/PTRx operand: #%0AAAAAAAA 8-bit immediate address versus #%1SUPNNNNN PTR expression)"

