instruction: RDBYTE
syntax: RDBYTE  D,{#}S/P {WC/WZ/WCZ}
encoding:
- bits: EEEE 1010110 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: MSB of byte
  z: Result == 0
  clocks: '9...16'
timing:
  cycles: "9...16 (cog or LUT exec) / 9...26 (hub exec)"
  type: variable
description: Read zero-extended byte from hub address {#}S/PTRx into D. C = MSB of byte.
flags_affected:
  C: Set to MSB of byte
  Z: Set if result equals zero
silicon_errata:
  after_no_wait_rdfast: "In cog execution, started fewer than 16 clocks after a no-wait RDFAST (D[31]=1), RDBYTE can complete before its own read: D gets the byte at its own offset within the previous hub read's long, and C/Z are set from that wrong value. Workaround: use the waiting RDFAST (D[31]=0), or start this RDBYTE at least 16 clocks after the no-wait RDFAST starts (e.g. WAITX #12 directly after it)."
  source: "Hardware-verified on Rev C silicon, 200 MHz: EF-084, EF-086, EF-088"
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.154"
documentation_level: enhanced
syntax_variants:
- RDBYTE D,{#}S/P
last_updated: '2025-09-19T16:04:16.899014'
category: Hub RAM
oneliner: Read zero-extended byte from hub RAM
immediate_address_note:
  note: >-
    A plain immediate source/address operand (#) is an 8-bit immediate hub
    address, #$00..$FF. With ## (AUGS) it is a 20-bit immediate hub address,
    ##$00000..$FFFFF. Bit 8 of the 9-bit S field selects a PTRx expression
    (#%1SUPNNNNN) instead of an immediate address (#%0AAAAAAAA).
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), HUB, RANDOM ACCESS INTERFACE (the S/#/PTRx operand: #%0AAAAAAAA 8-bit immediate address versus #%1SUPNNNNN PTR expression)"

