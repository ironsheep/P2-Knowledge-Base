directive: ORG
name: ORG
description: 'Set the assembly origin to a specific COG or LUT RAM address.

  All subsequent instructions are assembled starting from this address. ORG also
  sets the cog limit, the register address the code must not pass. For hub
  RAM, use ORGH instead.

  '
category: Assembly Directives
documentation_level: complete
syntax: 'ORG [address[, limit]]'
parameters:
- name: address
  type: immediate
  range: 0-$3FF
  description: 'COG/LUT RAM address (COG $000-$1FF, LUT $200-$3FF). Optional; bare ORG defaults to address 0 with limit $1F8.'
- name: limit
  type: immediate
  description: 'Optional explicit cog limit. Not documented: how the default limit is chosen for start addresses other than $000, $100 and $200.'
examples:
- code: 'ORG  0           '' Start at cog RAM address 0

    entry   jmp  #main      '' First instruction at address 0

    '
  description: Set code origin at start of cog
- code: 'ORG  $100        '' Start at cog address $100

    table   long  1, 2, 3   '' Data table at specific address

    '
  description: Place data at specific cog address
- code: 'ORG  $200        '' Start in LUT RAM

    mov  pa, #0      '' LUT address $200

    '
  description: Place code in LUT RAM (addresses $200-$3FF)
notes:
- 'Default limit: bare ORG sets cog address $000 and cog limit $1F8. Parallax''s documents also give a default limit of $200 for a bare ORG.'
- 'Default limit: ORG $100 with no limit has cog limit $200; 256 longs assemble from $100 and the 257th is refused. Parallax''s documents also give $1F8 as the default limit for ORG $100.'
- 'Default limit: ORG $200 with no limit has limit $400 (LUT)'
- 'Explicit limit: ORG address, limit uses the provided limit value, for example ORG $100,$120 or ORG $300,$380'
- ORG addresses COG RAM ($000-$1FF) and LUT RAM ($200-$3FF), setting COG-exec mode; ORG generates no data; for hub RAM use ORGH
- ORGF fills with zeros up to a cog address; it is valid only in cog mode
- 'ORG begins a cog-exec program in a DAT block, with no symbol before it. Not documented: which mode a DAT block is in before its first ORG or ORGH.'
- 'Pitfall: the default limit depends on the form: bare ORG has limit $1F8, ORG $100 with no limit has limit $200'
related:
- language/pasm2/orgh.yaml
- language/pasm2/orgf.yaml
- language/pasm2/fit.yaml
oneliner: Set the assembly origin to a specific COG or LUT RAM address
source: "Parallax Propeller 2 Spin2 Language Documentation v55, DAT Blocks, Cog-exec (bare ORG with cog address $000 and cog limit $1F8; its ORG $100 line, which gives a default limit of $1F8, is contradicted by CP-045; ORG $200 with limit $400; explicit limits ORG $100,$120 and ORG $300,$380; ORGF fill to a cog address; no symbol before ORG); Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), assembler directives (ORG cog mode, cog address and limit, $200..$3FF selects the LUT range, generates no data; its 'Defaults to $000,$200' disagrees with Spin2 v55's bare-ORG limit of $1F8; ORGF fills to a cog address with $00 and is valid only in cog mode); the default limit of $200 for ORG $100 with no limit, and the refusal of the 257th long, CP-045"
