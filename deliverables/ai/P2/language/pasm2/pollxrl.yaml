instruction: POLLXRL
syntax: POLLXRL {WC|WZ|WCZ}
brief_description: Poll streamer rollover LUT
category: Event
description: >-
  Streamer-LUT-RAM-rollover event flag is optionally copied into C and/or Z, then it
  is cleared. POLLXRL copies the state of the streamer-LUT-RAM-rollover event flag into
  C and/or Z and then clears the flag (unless it's being set again by the event sensor).
  If the WC, WZ, or WCZ effect is specified, the C flag and/or Z flag is updated to
  the state of the streamer-LUT-RAM-rollover event flag prior to clearing it. The
  streamer-LUT-RAM-rollover event flag is set whenever location $1FF of the Lookup RAM
  is read by the streamer. The streamer-LUT-RAM-rollover event flag is cleared upon
  cog start or upon execution of POLLXRL, WAITXRL, JXRL, or JNXRL instructions.
result: Streamer-LUT-RAM-rollover event flag is optionally copied into C and/or Z,
  then it is cleared.
flags_affected:
  C: Set to XRL event flag state
  Z: Set to XRL event flag state
parameters:
- WC, WZ, or WCZ are optional effects to update flags.
syntax_variants:
- POLLXRL {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1101011 CZ0 000001101 000100100
  write: —
  c: XRL Event
  z: XRL Event
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, POLLXRL, pp.115-116"
sources:
