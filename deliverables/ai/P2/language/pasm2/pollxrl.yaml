  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), EVENTS (the POLLxxx instructions simultaneously return their event-occurred flag into C and/or Z and clear it unless it is set again by the event sensor; POLLXRL event flag: cleared on cog start, set whenever location $1FF of the lookup RAM is read by the streamer, also cleared on POLLXRL / WAITXRL / JXRL / JNXRL), instruction encoding listing (EEEE 1101011 CZ0 000001101 000100100 POLLXRL {WC/WZ/WCZ})"
