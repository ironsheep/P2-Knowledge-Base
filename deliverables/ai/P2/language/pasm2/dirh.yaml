instruction: DIRH
syntax: DIRH    {#}D           {WCZ}
encoding:
- bits: EEEE 1101011 CZL DDDDDDDDD 001000001
  write: DIRx
  c: Orig DIRx base bit
  z: Orig DIRx base bit
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: >-
  DIRH sets the direction register's bit(s) designated by Dest to high (1), making
  the pin(s) outputs. All other direction bits are left unchanged. With WCZ, C and Z
  are set to the original (pre-instruction) state of the base pin's DIR bit.
flags_affected:
  C: Set to the original (pre-instruction) state of the base pin's DIR bit
  Z: Set to the original (pre-instruction) state of the base pin's DIR bit
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, DIRH / DIRL, p.71"
documentation_level: comprehensive
compiler_operand_format:
  name: operand_pinop
  pattern: D/#0..511 {WC/WZ}
  description: 'Pin operation: destination/immediate pin number 0-511, optional effect
    flags'
  valueType: 30
compiler_encoding:
  operandFormat: 30
syntax_variants:
- DIRH {#}D
last_updated: '2025-09-19T16:04:17.117106'
parameters:
- Dest is the register, 9-bit literal, or 11-bit augmented literal whose value identifies
  the I/O pin(s) to set to output or input.
- WCZ is an optional effect to update flags.
category: Pin
oneliner: Set pin(s) direction to output (high; 1) or input (low; 0)
