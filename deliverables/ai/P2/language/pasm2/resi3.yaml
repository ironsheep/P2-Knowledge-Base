instruction: RESI3
syntax: RESI3
encoding:
- bits: EEEE 1011001 110 111110000 111110001
  write: D (IJMP3) and PC
  c: IRET3[31]
  z: IRET3[30]
  clocks: '4 / 13...20'
timing:
  cycles: 4
  type: variable
  range: 4 / 13...20
description: >-
  Resume from INT3. (CALLD $1F0,$1F1 WCZ). RESI3 is CALLD IJMP3,IRET3 WCZ: it
  jumps to the return address held in IRET3 ($1F1), sets C and Z from IRET3[31]
  and IRET3[30], and writes {C, Z, 10'b0, PC[19:0]} (the flags and the address of
  its next instruction) into IJMP3
  ($1F0), so that the ISR resumes at that instruction when the next INT3
  interrupt occurs. A CALLD with S = IRET3 and WCZ signals the cog that the
  interrupt is complete: the cog clears its interrupt-busy flag for INT3, so
  that another INT3 interrupt can occur.
flags_affected:
  C: Set to IRET3[31], where the INT3 interrupt stored C
  Z: Set to IRET3[30], where the INT3 interrupt stored Z
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.153"
sources:
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.153 (RESI3: Resume from INT3. (CALLD $1F0,$1F1 WCZ), 4 / 13...20; CALLD D,{#}S: write {C, Z, 10'b0, PC[19:0]} to D, C = S[31], Z = S[30])"
  - "P2 Instructions v35 - Rev B/C Silicon, row 158 (RESI3, EEEE 1011001 110 111110000 111110001, alias, 4 / 13...20, register write D) and row 157 (CALLD D,{#}S: C = S[31], Z = S[30])"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), INTERRUPTS (the interrupt stores the C/Z flags and return address in IRETx; RESI3 = CALLD IJMP3,IRET3 WCZ, so the ISR resumes at the next instruction when the next interrupt occurs; a CALLD with D = any register, S = IRETx and WCZ clears the cog's interrupt-busy flag for that interrupt, so another interrupt can occur)"
