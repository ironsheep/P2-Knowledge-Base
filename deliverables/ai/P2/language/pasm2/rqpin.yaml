instruction: RQPIN
syntax: RQPIN   D,{#}S          {WC}
encoding:
- bits: EEEE 1010100 C0I DDDDDDDDD SSSSSSSSS
  write: D
  c: modal result
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: 'Read smart pin S[5:0] result "Z" into D without acknowledging the smart pin. C = modal result: the smart pin''s outgoing bus carries Z and a special flag, and C is either a mode-related flag or the MSB of Z.


  RQPIN does not use the cog-to-smart-pin bus for acknowledgement, so any number of cogs can read a smart pin at the same time with RQPIN. Cogs that execute WRPIN, WXPIN, WYPIN, RDPIN or AKPIN on the same smart pin must do so at different times.'
sources:
  - "description (C is a mode-related flag or the MSB of Z; RQPIN and the multi-cog bus): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PINS"
flags_affected:
  C: Set to a mode-related flag, or to the MSB of Z (the smart pin's outgoing bus carries Z and a special flag)
  Z: No effect
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.152"
documentation_level: enhanced
syntax_variants:
- RQPIN D,{#}S
