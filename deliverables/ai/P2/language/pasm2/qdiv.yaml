instruction: QDIV
syntax: QDIV    {#}D,{#}S
encoding:
- bits: EEEE 1101000 1LI DDDDDDDDD SSSSSSSSS
  write: —
  c: —
  z: —
  clocks: '2...9'
timing:
  cycles: "2...9"
  type: variable
description: Perform 64÷32 unsigned division with 32-bit quotient and remainder. Numerator
  formed from {SETQ value or 32'b0, D}, divided by S. Results retrieved via GETQX
  (quotient) and GETQY (remainder) instructions 55 clocks later.
flags_affected:
  C: No effect
  Z: No effect
long_description: 'The QDIV instruction performs unsigned division
  using the P2''s 54-stage pipelined CORDIC solver. It divides a 64-bit numerator
  by a 32-bit denominator, producing both a 32-bit quotient and 32-bit remainder.


  The 64-bit numerator is formed by concatenating the SETQ value (or 32''b0 if SETQ
  not used) as the upper 32 bits with the D operand as the lower 32 bits. The denominator
  is specified in the S operand. After 55 clocks, the quotient can be retrieved using
  GETQX and the remainder using GETQY.


  A preceding SETQ supplies the upper 32 bits of the 64-bit numerator; without SETQ
  the numerator is {0, D}, a 32-bit division.

  '
examples:
- code: ''' Simple 32-bit division: 1000000 / 3 = 333333 remainder 1

    MOV     x, ##1_000_000 '' an immediate D or S holds only 0..511 without ##

    QDIV    x, #3          '' No SETQ, so {0, 1000000} / 3

    GETQX   quotient       '' 333333 (GETQX waits for the result)

    GETQY   remainder      '' 1

    '
  description: Basic 32-bit division
- code: ''' 64-bit numerator: {2, 0} / 3 = 2*2^32 / 3

    SETQ    #2             '' upper 32 bits of the numerator

    QDIV    #0, #3         '' {SETQ, D} / S

    GETQX   quotient       '' $AAAA_AAAA (2863311530)

    GETQY   remainder      '' 2

    '
  description: "64-bit numerator division; the quotient is 32 bits."
- code: ''' Variable division with remainder checking

    SETQ    dividend_high

    QDIV    dividend_low, divisor

    '' ... wait 55 clocks ...

    GETQX   result_quotient

    GETQY   result_remainder

    CMP     result_remainder, #0 WZ  '' Check for exact division

    IF_Z    JMP     #exact_division

    '
  description: Division with remainder analysis
- code: ''' Scaling: multiply a 32-bit value by 3, then divide the 64-bit product by 4

    QMUL    fixed_point_low, #3   '' First multiply by 3

    '' ... wait 55 clocks ...

    GETQX   scaled_low

    GETQY   scaled_high

    SETQ    scaled_high           '' Use high part in division

    QDIV    scaled_low, #4        '' Then divide by 4

    '' ... wait 55 clocks ...

    GETQX   final_result

    '
  description: Multiply by 3, then divide the 64-bit product by 4
related_instructions:
- GETQX
- GETQY
- SETQ
- QFRAC
- QMUL
related:
- language/pasm2/concepts/special_registers.yaml
- language/pasm2/setq.yaml
operand_details:
  SETQ: Upper 32 bits of 64-bit numerator (optional, defaults to 0)
  D: Lower 32 bits of 64-bit numerator
  S: 32-bit denominator (divisor)
result_details:
  GETQX: 32-bit quotient
  GETQY: 32-bit remainder
timing_notes: The cog first waits for its hub slot to hand the command to the CORDIC solver; the result is available 55 clocks after that, and GETQX/GETQY wait for it if it has not arrived. Each cog can issue
  one CORDIC instruction per hub window (every 8 clocks).
usage_notes: A SETQ before QDIV specifies the upper 32 bits of the numerator. Without SETQ,
  the upper 32 bits are 0, and QDIV sets Q to zero (see language/pasm2/concepts/special_registers.yaml
  q_register).
divide_by_zero: "With S = 0 in cog execution, GETQX returns NOT (the upper 32 bits of the numerator) and GETQY the lower 32 bits (D), every time, in the same time as a non-zero divide, and the next CORDIC operation is unaffected. QDIV D,#0 with no SETQ gives $FFFF_FFFF remainder D; with SETQ #1 it gives $FFFF_FFFE; with SETQ $FFFF_FFFF it gives 0. Immediate #0 and a zero register give the same results."
quotient_over_32_bits: "With a true quotient over 32 bits, in cog execution: SETQ #3 then QDIV of 7 by 2 (true quotient $1_8000_0003, remainder 1) gives GETQX $FFFF_FFFE and GETQY $0000_000B; SETQ #5 then QDIV of 11 by 4 (true quotient $1_4000_0002, remainder 3) gives GETQX $FFFF_FFFE and GETQY $0000_0013. Neither quotient is the low 32 bits of the true quotient, and neither is $FFFF_FFFF. Not documented: the result for any other dividend whose quotient exceeds 32 bits."
documentation_source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet Release November 1, 2022 (2022/11/01), CORDIC Solver, p.20, and CORDIC Solver Instructions, p.44; P2 Instructions v35 - Rev B/C Silicon, Sheet1; Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), CORDIC Solver (DIVIDE) and SETQ CONSIDERATIONS (COGINIT/QDIV/QFRAC/QROTATE without a preceding SETQ set Q to zero); divide by zero: hardware-verified EF-089; quotient over 32 bits: P2 hardware verification, EF-116 (one board, cog execution, the two cases stated)"
documentation_level: comprehensive
