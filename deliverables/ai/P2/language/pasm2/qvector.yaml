instruction: QVECTOR
syntax: QVECTOR {#}D,{#}S
encoding:
- bits: EEEE 1101010 1LI DDDDDDDDD SSSSSSSSS
  write: —
  c: —
  z: —
  clocks: '2...9'
timing:
  cycles: "2...9"
  type: variable
description: Convert cartesian coordinates (X, Y) to polar coordinates (length, angle).
  X is D and Y is S, 32-bit signed values. GETQX retrieves the length and GETQY the
  angle 55 clocks later.
flags_affected:
  C: No effect
  Z: No effect
long_description: 'QVECTOR converts a 32-bit signed (X, Y) cartesian coordinate pair
  into a 32-bit (length, angle) polar coordinate pair using the hub''s 54-stage pipelined
  CORDIC solver. X is the D operand and Y is the S operand. Fifty-five clocks after
  the cog hands the command to the CORDIC solver, the length is available through
  GETQX and the angle through GETQY; both wait if the result has not yet arrived.

  '
examples:
- code: ''' Convert point (100, 200) to polar coordinates

    QVECTOR #100, #200     '' Begin conversion

    '' Wait 55 clocks...

    GETQX   length         '' Get polar length

    GETQY   angle          '' Get polar angle

    '
  description: Basic cartesian to polar conversion
- code: ''' Convert variable coordinates

    QVECTOR x_coord, y_coord

    '' ... other work for 55 clocks ...

    GETQX   magnitude

    GETQY   phase_angle

    '
  description: Converting variable coordinates to polar form
related_instructions:
- GETQX
- GETQY
- QROTATE
- SETQ
operand_details:
  D: X coordinate (32-bit signed)
  S: Y coordinate (32-bit signed)
result_details:
  GETQX: Length (32-bit)
  GETQY: "Angle (32-bit). Not documented: the angle unit of the QVECTOR result."
timing_notes: A cog waits for its hub slot, zero to (cogs-1) clocks away, to hand the
  command to the CORDIC solver. Fifty-five clocks later the results are available
  via GETQX and GETQY. With interrupts enabled while CORDIC commands overlap, an
  interrupt service routine can steal enough clocks that one or more results are
  overwritten before they are read; language/pasm2/concepts/cordic_solver.yaml
  (interrupt_protection) shows how to shield such a sequence from interrupts.
documentation_source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet Release November 1, 2022 (2022/11/01), CORDIC Solver, p.20, and CORDIC Solver Instructions, p.45; Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), CORDIC SOLVER ((X,Y) VECTORING) and OVERLAPPING CORDIC COMMANDS (interrupts during overlapped commands); P2 Instructions v35 - Rev B/C Silicon, Sheet1; the angle unit of the QVECTOR result is not stated in the Silicon Doc, the Datasheet, the Hardware Manual, the PASM2 Manual or the instruction CSV (the Silicon Doc gives an angle unit only for the QROTATE input)"
documentation_level: comprehensive
