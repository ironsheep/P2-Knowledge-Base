instruction: ALTGW
syntax: ALTGW Dest, {#}Src
brief_description: Alter get word
category: Register Indirection
description: 'ALTGW should be followed by GETWORD or ROLWORD-- it modifies the GETWORD / ROLWORD instruction''s Src and Num values, enabling code to iterate through multiple words of data across a range of Reg RAM. GETWORD / ROLWORD''s Src value is changed to (Src + Dest[9:1]) & $1FF (for syntax 1), or to Dest[9:1] (for syntax 2), and its Num value is changed to Dest[0]. Dest[9:1] corresponds to the target long register''s 9-bit address and Dest[0] is the word ID within it; values of 0-1 identify individual words, by position, in least-significant word order. Iteratively executing ALTGW followed by GETWORD or ROLWORD, and each time incrementing ALTGW''s 10-bit Dest value by one, effectively reads a stream of word values from Reg RAM as if it were all made of word-sized registers. In syntax 1, Src consists of two 9-bit fields; a base address (Src[8:0]) and a signed auto-indexer (Src[17:9]). The base is the Reg RAM address where the series of words begins. ALTGW adds the long index (Dest[9:1]) to the base (Src[8:0]) to locate the register holding the target word. The word ID (Dest[0]) identifies the word''s position within that long register. At the end of ALTGW execution, the optional auto-indexer value (usually 0, 1, or -1) is added to the 10-bit index (Dest) for a future ALTGW+GETWORD or ROLWORD iteration. In syntax 2, Dest serves as the full word address-- it''s the same format as in syntax 1, but represents the target long''s absolute address and its word index instead of the long''s relative index (to add to a base) and word index.'
result: The next instruction's pipelined Src and Num fields are altered to be (Src + Dest[9:1]) & $1FF, or just Dest[9:1] for syntax 2, and Dest[0], respectively.
parameters:
- Dest is the register whose 10-bit value is the index, or the full word address for the GETWORD / ROLWORD instruction to read.
- Src is an optional register, 9-bit literal, or 18-bit augmented literal whose value contains a base long address (Src[8:0]; added to index (Dest[9:1]) for GETWORD / ROLWORD) and also an optional auto-indexer value (Src[17:9]; added to Dest at end of execution).
flags_affected:
  C: No effect
  Z: No effect
syntax_variants:
- ALTGW Dest, {#}Src
- ALTGW Dest
usage_notes: 'The instruction following ALTGW is shielded from interrupt

  ALTGW alters the next instruction regardless of its kind-- the intention is for
  it to be a GETWORD / ROLWORD

  Field value modification occurs in the instruction pipeline only; code is not altered,
  values do not persist

  SETQ / SETQ2 does not affect ALTx instructions-- the Q value passes through to the
  next instruction'
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1001011 11I DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2'
- bits: EEEE 1001011 111 DDDDDDDDD 000000000
  write: D
  c: —
  z: —
  clocks: '2'
encoding_notes:
- Dest is post-adjusted by the auto-indexer value; the sign-extended Src[17:9]. In
  syntax 2, the auto-indexer value is 0.
- Src[17:9] is sign-extended before it is added into Dest.
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ALTGW, p.42"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, rows 112-113 (ALTGW: next S field = (D[9:1] + S) & $1FF, or D[9:1], and N field = D[0]; D += sign-extended S[17:9]; next instruction shielded from interrupt; 2 clocks)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), REGISTER INDIRECTION (S[17:9] is always sign-extended and added to D for index updating; ALTGW sets the next S field to base+index[9:1] and the next N to index[0])"
documentation_level: comprehensive
