instruction: RFLONG
syntax: RFLONG  D        {WC/WZ/WCZ}
encoding:
- bits: EEEE 1101011 CZ0 DDDDDDDDD 000010010
  write: D
  c: MSB of long
  z: Result == 0
  clocks: '2'
timing:
  cycles: 2
  type: mode_dependent
description: Used after RDFAST. Read long from FIFO into D. C = MSB of long. Not usable
  in hub execution, where the FIFO is in use.
flags_affected:
  C: Set to MSB of long
  Z: Set if result equals zero
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.154"
documentation_level: enhanced
syntax_variants:
- RFLONG D
