examples:
- code: "ALTI         ptrs,#%111_111                          'set next D and S fields,\
    \ increment ptrs[17:9] and ptrs[8:0]\n     ADD          0,0                  \
    \                   'add registers"
- code: "ALTI         inst                                    'execute inst; same\
    \ as ALTI inst, #%101_100_100\n     NOP                                      \
    \            'NOP becomes inst"
