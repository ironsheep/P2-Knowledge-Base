instruction: SETXFRQ
syntax: SETXFRQ {#}D
encoding:
- bits: EEEE 1101011 00L DDDDDDDDD 000011101
  write: —
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: Set streamer NCO frequency to D. D expresses a fractional 0-to-1
  multiplier for the system clock, which value must be multiplied by $8000_0000.
flags_affected:
  C: No effect
  Z: No effect
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.158"
documentation_level: enhanced
last_updated: '2025-09-19T16:04:17.540091'
category: Streamer
oneliner: Set streamer NCO frequency to D
examples:
  - context: NCO rollover at 1/3 of the system clock
    code: |
      ' $8000_0000 / 3 leaves a remainder, so the value is incremented
      setxfrq ##$2AAA_AAAA+1      ' NCO rolls over at 1/3 of the system clock
    notes: 'With "##" before a 32-bit literal in the Dest field, the compiler invokes AUGD immediately before the instruction.'
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), STREAMER (the multiplier table: 1/3 is $2AAA_AAAA+1); Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, AUGD (the ## tip), p.50"
frequency_formula:
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), STREAMER (the NCO phase line, the SETXFRQ multiplier sentence, the multiplier table and its increment footnote); Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.158"
  formula: "D/# expresses a fractional 0-to-1 multiplier for the system clock, which value must be multiplied by $8000_0000. \"For fractions with remainders, the computed D/# value should be incremented, in order to produce proper initial rollover behavior.\" The table shows it applied: 1/3 is $2AAA_AAAA+1 and 1/5 is $1999_9999+1, while 1/2, 1/4 and 1/8 carry no increment."
  note: "The NCO is phase = (phase & $7FFF_FFFF) + frequency."
  values: "The multiplier table for 1 to 1/8 of the system clock is in architecture/streamer/nco-timing.yaml (common_values)."
  cog_start_default: "$8000_0000, the 1:1 multiplier, is the default value on cog start."

