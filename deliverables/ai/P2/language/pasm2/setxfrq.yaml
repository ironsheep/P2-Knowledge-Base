instruction: SETXFRQ
syntax: SETXFRQ {#}D
encoding:
- bits: EEEE 1101011 00L DDDDDDDDD 000011101
  write: —
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: Set streamer NCO frequency to D. The NCO phase accumulator masks its
  MSB before each add (modulus $8000_0000), so D is the system-clock multiplier
  scaled by $8000_0000 = 2^31. Output frequency = (D × clkfreq) / $8000_0000,
  i.e. D = target_freq × $8000_0000 / clkfreq.
flags_affected:
  C: No effect
  Z: No effect
documentation_source: PASM2 Manual 2022-11-01
documentation_level: enhanced
compiler_operand_format:
  name: operand_l
  pattern: D/#0..511
  description: Destination or immediate value 0-511
  valueType: 26
compiler_encoding:
  operandFormat: 26
enhancement_source: PNUT_TS_v2.0_complete_operand_integration_2025-09-13
last_updated: '2025-09-19T16:04:17.540091'
category: Streamer
oneliner: Set streamer NCO frequency to D
examples:
  - context: VGA pixel clock at 25.175 MHz (sysclk=250MHz)
    code: |
      ' Calculate: 25_175_000 * $8000_0000 / 250_000_000 = $0CE3_BCD3
      setxfrq ##$0CE3_BCD3      ' ~25.175 MHz pixel rate
    notes: Use ## for 32-bit immediate values
  - context: Audio sample rate 48 kHz
    code: |
      ' Calculate: 48_000 * $8000_0000 / 250_000_000 = $0006_4A9D
      setxfrq ##$0006_4A9D      ' 48 kHz sample rate
  - context: Alternate frequency set via SETQ before XINIT
    code: |
      ' SETQ before XINIT sets the NCO frequency during the first clock of the command
      setq    ##$0CE3_BCD3    ' Set NCO frequency (25.175 MHz @ 250MHz sysclk)
      xinit   ##streamer_mode,#0
    notes: SETQ before XINIT/XZERO/XCONT sets NCO frequency atomically with the streamer command; SETQ is NOT a modifier for SETXFRQ
frequency_formula:
  formula: "D = (target_frequency × $8000_0000) / clkfreq"
  inverse: "output_frequency = (D × clkfreq) / $8000_0000"
  precision: "Resolution = clkfreq / 2^31 Hz per LSB"
  note: "The NCO masks its MSB before each add, so the multiplier is $8000_0000 (2^31), not 2^32 (Silicon Doc v35 SETXFRQ). nco-timing.yaml uses the same convention."
common_values:
  - target: "25.175 MHz (VGA)"
    sysclk: "250 MHz"
    value: "$0CE3_BCD3"
  - target: "25.000 MHz"
    sysclk: "250 MHz"
    value: "$0CCC_CCCD"
  - target: "48 kHz (audio)"
    sysclk: "250 MHz"
    value: "$0006_4A9D"
  - target: "44.1 kHz (CD audio)"
    sysclk: "250 MHz"
    value: "$0005_C7C0"
related_instructions:
  - XINIT: Start streamer with configured frequency; SETQ before XINIT can set NCO frequency atomically
  - GETXACC: Read phase accumulator (Goertzel mode)
