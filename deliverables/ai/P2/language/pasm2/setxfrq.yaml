instruction: SETXFRQ
syntax: SETXFRQ {#}D
encoding:
- bits: EEEE 1101011 00L DDDDDDDDD 000011101
  write: —
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: Set streamer NCO frequency to D. The NCO phase accumulator masks its
  MSB before each add (modulus $8000_0000), so D is the system-clock multiplier
  scaled by $8000_0000 = 2^31. Output frequency = (D × clkfreq) / $8000_0000,
  i.e. D = target_freq × $8000_0000 / clkfreq — truncated, then incremented by 1
  when that division leaves a remainder. See frequency_formula below.
flags_affected:
  C: No effect
  Z: No effect
documentation_source: PASM2 Manual 2022-11-01
documentation_level: enhanced
compiler_operand_format:
  name: operand_l
  pattern: D/#0..511
  description: Destination or immediate value 0-511
  valueType: 26
compiler_encoding:
  operandFormat: 26
enhancement_source: PNUT_TS_v2.0_complete_operand_integration_2025-09-13
last_updated: '2025-09-19T16:04:17.540091'
category: Streamer
oneliner: Set streamer NCO frequency to D
examples:
  - context: VGA pixel clock at 25.175 MHz (sysclk=250MHz)
    code: |
      ' Calculate: 25_175_000 * $8000_0000 / 250_000_000 = $0CE3_BCD3, remainder
      '   The division does not come out even, so increment: $0CE3_BCD4
      setxfrq ##$0CE3_BCD4      ' ~25.175 MHz pixel rate
    notes: Use ## for 32-bit immediate values
  - context: Audio sample rate 48 kHz
    code: |
      ' Calculate: 48_000 * $8000_0000 / 250_000_000 = $0006_4A9C, remainder
      '   The division does not come out even, so increment: $0006_4A9D
      setxfrq ##$0006_4A9D      ' 48 kHz sample rate
  - context: Alternate frequency set via SETQ before XINIT
    code: |
      ' SETQ before XINIT sets the NCO frequency during the first clock of the command
      setq    ##$0CE3_BCD4    ' Set NCO frequency (25.175 MHz @ 250MHz sysclk)
      xinit   ##streamer_mode,#0
    notes: SETQ before XINIT/XZERO/XCONT sets NCO frequency atomically with the streamer command; SETQ is NOT a modifier for SETXFRQ
frequency_formula:
  formula: "D = (target_frequency × $8000_0000) / clkfreq, truncated, then incremented by 1 if that division left a remainder. The increment is required by the source, not an optional refinement -- see common_values.source below."
  inverse: "output_frequency = (D × clkfreq) / $8000_0000"
  precision: "Resolution = clkfreq / 2^31 Hz per LSB"
  note: "The NCO masks its MSB before each add, so the multiplier is $8000_0000 (2^31), not 2^32 (Silicon Doc v35 SETXFRQ). architecture/streamer/nco-timing.yaml uses the same convention."
common_values:
  source: "Derived from the source-stated rule, not read from a table. Propeller 2 Documentation v35, Streamer NCO -- engineering/ingestion/sources/silicon-doc/part2-pixel-ops.txt:104-117: \"The frequency of the streamer's NCO rollover is set by the 'SETXFRQ D/#' instruction, where D/# expresses a fractional 0-to-1 multiplier for the system clock, which value must be multiplied by $8000_0000\", with the footnote at :117 and :121 (the sentence is split by a page break): \"For fractions with remainders, the computed D/# value should be incremented, in order to produce proper initial rollover behavior.\""
  computation: "D = target_frequency * $8000_0000 / clkfreq, TRUNCATED, then incremented if that division left a remainder. This is the source's own rule, and the source's table shows it applied: 1/3 is given as $2AAA_AAAA+1, 1/5 as $1999_9999+1, while the exact divisions 1/2, 1/4 and 1/8 carry no increment. It is NOT round-to-nearest -- a fraction whose remainder is below half still increments."
  cross_checked_against: "architecture/streamer/nco-timing.yaml video_rates carries the same 25.175 MHz VGA value. That is not independent confirmation -- both files derive it from the rule quoted above, so the source, not the agreement, is the authority."
  values:
    - target: "25.175 MHz (VGA 640x480 pixel clock)"
      sysclk: "250 MHz"
      value: "$0CE3_BCD4"
      arithmetic: "25_175_000 * $8000_0000 / 250_000_000 truncates to $0CE3_BCD3 with a remainder, incremented to $0CE3_BCD4 per the source footnote"
    - target: "25.000 MHz"
      sysclk: "250 MHz"
      value: "$0CCC_CCCD"
      arithmetic: "25_000_000 * $8000_0000 / 250_000_000 truncates to $0CCC_CCCC with a remainder, incremented to $0CCC_CCCD per the source footnote"
    - target: "48 kHz (audio sample rate)"
      sysclk: "250 MHz"
      value: "$0006_4A9D"
      arithmetic: "48_000 * $8000_0000 / 250_000_000 truncates to $0006_4A9C with a remainder, incremented to $0006_4A9D per the source footnote"
    - target: "44.1 kHz (CD audio sample rate)"
      sysclk: "250 MHz"
      value: "$0005_C7C1"
      arithmetic: "44_100 * $8000_0000 / 250_000_000 truncates to $0005_C7C0 with a remainder, incremented to $0005_C7C1 per the source footnote"
  cog_start_default: "$8000_0000 -- the 1:1 multiplier, stated by the source as the default value on cog start."

related_instructions:
  - XINIT: Start streamer with configured frequency; SETQ before XINIT can set NCO frequency atomically
  - GETXACC: Read phase accumulator (Goertzel mode)
