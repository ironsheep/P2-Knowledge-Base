instruction: SETXFRQ
syntax: SETXFRQ {#}D
encoding:
- bits: EEEE 1101011 00L DDDDDDDDD 000011101
  write: —
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: Set streamer NCO frequency to D. The NCO uses a 32-bit phase accumulator
  where D is added each clock cycle. Output frequency = (D × clkfreq) / 2^32.
  For SETQ+SETXFRQ pattern, SETQ provides low 32 bits, D provides high 32 bits
  for 64-bit precision frequency control.
flags_affected:
  C: No effect
  Z: No effect
documentation_source: PASM2 Manual 2022-11-01
documentation_level: enhanced
compiler_operand_format:
  name: operand_l
  pattern: D/#0..511
  description: Destination or immediate value 0-511
  valueType: 26
compiler_encoding:
  operandFormat: 26
enhancement_source: PNUT_TS_v2.0_complete_operand_integration_2025-09-13
last_updated: '2025-09-19T16:04:17.540091'
category: Streamer
oneliner: Set streamer NCO frequency to D
examples:
  - context: VGA pixel clock at 25.175 MHz (sysclk=250MHz)
    code: |
      ' Calculate: (25_175_000 * 2^32) / 250_000_000 = $19999999
      setxfrq ##$19999999       ' ~25.175 MHz pixel rate
    notes: Use ## for 32-bit immediate values
  - context: Audio sample rate 48 kHz
    code: |
      ' Calculate: (48_000 * 2^32) / 250_000_000 = $C49BA
      setxfrq ##$C49BA          ' 48 kHz sample rate
  - context: High-precision frequency with SETQ
    code: |
      ' 64-bit precision: SETQ provides low 32 bits
      setq    freq_low          ' Low 32 bits of frequency
      setxfrq freq_high         ' High 32 bits, combined with SETQ
    notes: SETQ+SETXFRQ enables sub-Hz frequency resolution
frequency_formula:
  formula: "D = (target_frequency × 2^32) / clkfreq"
  inverse: "output_frequency = (D × clkfreq) / 2^32"
  precision: "Resolution = clkfreq / 2^32 Hz per LSB"
common_values:
  - target: "25.175 MHz (VGA)"
    sysclk: "250 MHz"
    value: "$19999999"
  - target: "25.000 MHz"
    sysclk: "250 MHz"
    value: "$1999999A"
  - target: "48 kHz (audio)"
    sysclk: "250 MHz"
    value: "$C49BA"
  - target: "44.1 kHz (CD audio)"
    sysclk: "250 MHz"
    value: "$B4FDF"
related_instructions:
  - SETQ: Prefix for 64-bit precision frequency
  - GETXACC: Read phase accumulator (Goertzel mode)
  - XINIT: Start streamer with configured frequency
