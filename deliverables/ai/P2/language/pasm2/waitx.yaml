instruction: WAITX
syntax: WAITX   {#}D     {WC/WZ/WCZ}
encoding:
- bits: EEEE 1101011 CZL DDDDDDDDD 000011111
  write: —
  c: 0
  z: 0
  clocks: '2 + D'
timing:
  cycles: 2 + D
  type: variable
description: >-
  Wait 2+D clock cycles if no WC/WZ/WCZ is specified. If WC/WZ/WCZ is specified,
  wait 2+(D AND RND) clock cycles, a range-limited random number of clocks; the
  flag(s) the effect names are cleared to 0 after completion (WC: C, WZ: Z, WCZ:
  both -- a flag column applies only when its effect is given). While the cog is
  stalled in a WAITx instruction, a pending interrupt does not branch.
flags_affected:
  C: Set to 0 only when WC or WCZ is specified
  Z: Set to 0 only when WZ or WCZ is specified
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release (2022/11/01), Propeller 2 Assembly Language (PASM2) in Brief, p.159; Parallax PASM2 Manual p.30 (description: flag column applies only when its effect is given); P2 Instructions v35 - Rev B/C Silicon, Sheet1; Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), INTERRUPTS (the cog must not be stalled in any WAITx instruction for a pending interrupt to branch)"
documentation_level: comprehensive
examples:
- name: Inline PASM2 Timing
  description: Drive a pin high, wait with WAITX, and drive it low in inline PASM2
  code: |
    PUB pulse_pin(pin, width)
      ORG
        drvh    pin              ' Drive pin high
        waitx   width            ' Wait 2 + width clocks
        drvl    pin              ' Drive pin low
      END
- name: SPI Bit-Bang Timing
  description: Shift a byte out MSB first on a data pin, with a WAITX after each pin change
  code: |
    ' Shift one byte out MSB first, with a WAITX after each pin change
    spi_write_byte
            mov     bit_count, #8
    .loop   rol     data, #1    wc   ' C = bit 31 of data, data rotated left by 1
            muxc    outa, mosi_mask  ' Copy C into the OUTA bits selected by mosi_mask
            waitx   #4               ' Wait 2 + 4 clocks
            drvh    sck_pin          ' Drive sck_pin high
            waitx   #4               ' Wait 2 + 4 clocks
            drvl    sck_pin          ' Drive sck_pin low
            waitx   #4               ' Wait 2 + 4 clocks
            djnz    bit_count, #.loop
            ret
- name: PWM Generation
  description: Alternate a pin high and low, holding each level with WAITX
  code: |
    ' Drive the pin high and low in turn
    pwm_loop
            drvh    pwm_pin          ' Drive pin high
            waitx   high_time        ' Wait 2 + high_time clocks
            drvl    pwm_pin          ' Drive pin low
            waitx   low_time         ' Wait 2 + low_time clocks
            jmp     #pwm_loop        ' Repeat
- name: Debounce Delay
  description: Sample a pin, wait with WAITX, and sample it again; return if the pin reads low at either sample
  code: |
    ' Sample button_pin, wait, sample it again
    check_button
            testp   button_pin  wc   ' C = state of button_pin
            if_nc   ret              ' Return if the pin is low
            waitx   ##20_000         ' Wait 2 + 20_000 clocks
            testp   button_pin  wc   ' C = state of button_pin
            if_nc   ret              ' Return if the pin is low
            ret                      ' The pin was high at both samples
