instruction: ROLNIB
syntax: 'ROLNIB Dest, {#}Src, #Num'
brief_description: Rotate left nibble
category: Math and Logic
description: >-
  ROLNIB reads the nibble identified by Num (0-7) from Src, or a nibble from the source
  described by a prior ALTGN instruction, and rotates it left into Dest. ROLNIB achieves
  the same effect as two instructions: a 4-bit SHL followed by SETNIB into nibble 0.
  Num (0-7) identifies a value's individual nibbles, by position, in least-significant
  nibble order. Syntax 2 is intended for use after an ALTGN instruction, i.e. in a loop
  to iteratively read a series of nibble values within contiguous long registers. ROLNIB
  Dest is the same as ROLNIB Dest,0,#0, with the S field and the N field filled in
  by the prior ALTGN.
result: >-
  Nibble Num (0-7) of Src, or a nibble from a source described by prior ALTGN instruction,
  is rotated left into Dest.
parameters:
- Dest is the register in which to rotate the nibble into.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value contains
  the target nibble to read.
- Num is a 3-bit literal identifying the nibble ID (0-7) of Src to read.
flags_affected:
  C: No effect
  Z: No effect
syntax_variants:
- 'ROLNIB Dest, {#}Src, #Num'
- ROLNIB Dest
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 100010N NNI DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2'
- bits: EEEE 1000100 000 DDDDDDDDD 000000000
  write: D
  c: —
  z: —
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ROLNIB, pp.120-121"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, rows 88-89 (ROLNIB D,{#}S,#N: rotate-left nibble N of S into D, D = {D[27:0], S.NIBBLE[N]}; ROLNIB D: rotate-left nibble established by prior ALTGN instruction into D; 2 clocks; write D) and rows 104-105 (ALTGN: next S field and N field = D[2:0] for the subsequent GETNIB/ROLNIB)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Math and Logic Instructions, p.37 (ROLNIB D and ROLNIB D,{#}S,#N, 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ROLNIB, pp.120-121 (Result line, Dest, Src and Num parameters, both encoding rows 100010N NNI / 1000100 000, write D, C and Z none, 2 clocks, Related list, the SHL-then-SETNIB equivalence, Num 0-7 in least-significant nibble order on p.120; syntax 2 after ALTGN on p.121)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), REGISTER INDIRECTION (ALTGN sets the next S field to base+index[11:3] and the next N to index[2:0]; 'ROLNIB D' = 'ROLNIB D,0,#0'; two of the three fields of the associated instruction are filled in by the ALTxx instruction), and instruction encoding listing (EEEE 100010N NNI DDDDDDDDD SSSSSSSSS ROLNIB D,S/#,#N)"
