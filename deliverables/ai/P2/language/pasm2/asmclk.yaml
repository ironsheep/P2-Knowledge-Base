instruction: ASMCLK
syntax: ASMCLK
encoding: pseudo-instruction
timing:
  cycles: variable
  type: macro
  note: Assembles to one or six PASM instructions; one for RCFAST and RCSLOW, six for the external clock modes
description: >
  Pseudo-instruction that sets the clock mode specified by the clock setup symbols (_clkfreq,
  _xtlfreq, _xinfreq, _rcslow, _rcfast) in PASM-only programs. ASMCLK has no operands, but may be used
  with a conditional prefix. It assembles to one or six PASM instructions, depending upon the clock
  mode. A 16-long clock-setter program is automatically prepended to PASM-only programs which use any
  non-RCFAST clock mode, so ASMCLK is not needed at the start of such programs. Declaring the constant _AUTOCLK = 0 stops the clock-setter program from being prepended, and the
  program then begins executing in RCFAST mode; ASMCLK can then be used to set the clock mode.
examples:
- code: |
    CON
      _clkfreq = 200_000_000
      _xtlfreq = 20_000_000

    DAT
      ORG 0
      ASMCLK              ' Sets the clock mode from _clkfreq and _xtlfreq
      ' ... rest of program
  description: Crystal-plus-PLL clock mode - ASMCLK assembles to the HUBSET/WAITX/HUBSET sequence
- code: |
    CON
      _AUTOCLK = 0        ' Disable automatic clock-setter
      _clkfreq = 200_000_000
      _xtlfreq = 20_000_000

    DAT
      ORG 0
      ASMCLK              ' Manually set clock since auto-clock disabled
  description: ASMCLK sets the clock mode with the automatic clock-setter disabled by _AUTOCLK = 0
- code: |
    CON
      _rcfast             ' Use internal fast RC oscillator (default)

    DAT
      ORG 0
      ASMCLK              ' Expands to single HUBSET #0 instruction
  description: "RCFAST mode - ASMCLK assembles to a single HUBSET #0"
operand_details:
  none: No operands. Clock configuration comes from CON symbols (_clkfreq, _xtlfreq, _xinfreq, _rcslow, _rcfast).
  conditional: Can be used with conditional prefix (IF_C, IF_NC, etc.)
expansion_details:
  external_clock:
    description: For the external clock modes (XI/XO crystal or XI input), with or without the PLL
    source: "Parallax Propeller 2 Spin2 Language Documentation v55, Clock Setup, p.58 (the ASMCLK table: the same three-instruction sequence for _clkfreq, _xtlfreq + _clkfreq, _xinfreq + _clkfreq, _xtlfreq alone and _xinfreq alone)"
    expands_to:
      - "HUBSET ##clkmode_ & !%11    ' Start external clock, stay in RCFAST"
      - "WAITX ##20_000_000/100      ' Allow 10ms for external clock to stabilize"
      - "HUBSET ##clkmode_           ' Switch to external clock mode"
  rcslow:
    description: For internal slow RC oscillator
    expands_to:
      - "HUBSET #1                   ' Switch to RCSLOW mode"
  rcfast:
    description: For internal fast RC oscillator (default)
    expands_to:
      - "HUBSET #0                   ' Stay in RCFAST mode"
related_symbols:
  - "_CLKFREQ"
  - "_XTLFREQ"
  - "_XINFREQ"
  - "_RCSLOW"
  - "_RCFAST"
  - "_AUTOCLK"
related_instructions:
  - HUBSET
  - CLKSET
  - WAITX
documentation_source: "Parallax Propeller 2 Spin2 Language Documentation v55, Clock Setup (ASMCLK), pp.57-58"
documentation_level: complete
last_updated: '2025-12-04'
category: System Control
oneliner: Pseudo-instruction that sets clock mode from CON symbols in PASM-only programs
