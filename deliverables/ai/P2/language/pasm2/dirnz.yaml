  - "description (an ALTx between the SETQ and DIRNZ keeps the override): Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ALTB, pp.38-39 (SETQ / SETQ2 does not affect ALTx instructions; the Q value passes through to the next instruction); a SETQ separated by other instructions is in no source"
  - "P2 Instructions v35 - Rev B/C Silicon, row 354 (DIRNZ {#}D {WCZ}: DIR bits of pins D[10:6]+D[5:0]..D[5:0] = !Z; wraps within DIRA/DIRB; prior SETQ overrides D[10:6]; C,Z = DIR bit; write DIRx; 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, DIRZ / DIRNZ, p.73 (set pin to the output (1) or input (0) direction; Dest[5:0], Dest[10:6], the 9-bit literal range of Dest[8:6], ##Dest, the SETQ substitution, C and Z set to the original base bit, 2 clocks; the manual's DIRZ / DIRNZ page does not repeat the wrap sentence, which the instruction CSV row and the DIRC / DIRNC page state)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Pin instructions, p.39 (DIRNZ {#}D {WCZ}, 2 clocks)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 1101011 CZL DDDDDDDDD 001000101 DIRNZ D/# {WCZ}); the PASM2 Manual p.73 DIRZ / DIRNZ encoding rows write the FX field as CZI, the instruction CSV row 354 and the listing as CZL; the listing gives EEEE 1101011 CZL DDDDDDDDD 001000101 for both TESTPN D/# ORC/ORZ and DIRNZ D/# {WCZ}"
