notes:
- Q register must be set before MUXQ
- "MUXQ reads Q as its mask. The Q value written by SETQ persists until XORO32, RDLUT, GETXACC or CRCNIB changes it, or COGINIT, QDIV, QFRAC or QROTATE executes without a preceding SETQ and sets it to zero; MUXQ is not among them. SETQ also shields the next instruction from interruption, so a MUXQ placed directly after its SETQ cannot be interrupted between the two. Full account: language/pasm2/concepts/special_registers.yaml q_register."
- "MUXQ with an all-ones source into a zeroed register reads Q back (see the Read the Q register back example); GETQX/GETQY return CORDIC results, not Q."
