instruction: MUXQ
syntax: MUXQ Dest, {#}Src
brief_description: Mux Q
category: Math and Logic
description: >-
  MUXQ copies all bits from Src corresponding to high (1) bits of Q into the
  corresponding bits of Dest. All other Dest bits are left as-is.

  MUXQ must be preceded by SETQ to function properly since the Q value's high
  bits identify the bits to target in Src and Dest.
result: >-
  Bits from Src corresponding to high bits in Q are copied to the same bit
  positions in Dest; other Dest bits are unchanged.
parameters:
- Dest is a register whose bits will be updated according to Q and Src.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose select
  bits will replace the corresponding bits in Dest.
flags_affected:
  C: No effect
  Z: No effect
syntax_variants:
- MUXQ Dest, {#}Src
timing:
  cycles: 2
  type: fixed
encoding:
- bits: EEEE 1001111 10I DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, MUXQ, pp.101-102; P2 Instructions v35 - Rev B/C Silicon, Sheet1 (MUXQ row); Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SETQ CONSIDERATIONS (what changes Q, the readback sequence, the shield)"
documentation_level: comprehensive
last_updated: '2025-11-26'
manual_extraction_date: '2025-01-19'
oneliner: Set discrete bits of a value to that of another
examples:
- name: Parallel Pin Output (HUB75 driver)
  description: Write several output pins at once through a mask, leaving the other pins untouched
  code: |
    ' write the pins selected by Q
            SETQ    maskRgb12        ' load Q bit w/ RGB[12] mask
            MUXQ    OUTA, reg_value  ' copy the reg_value bits selected by the 1 bits of Q into OUTA
  source: "OBEX 2850 (ISP HUB75 Matrix Driver), isp_hub75_rgb3bit.spin2 (example code, not a Parallax document); the MUXQ behaviour in the comment: P2 Instructions v35 - Rev B/C Silicon, MUXQ row"
- name: Masked Bit Update
  description: Update specific bits without affecting others
  code: |
    ' Update only certain bits based on mask
            setq    update_mask      ' Load mask to Q
            muxq    status, new_bits ' Update masked bits

    ' Example: Update bits 4-7 only
            setq    #$F0             ' Mask for bits 4-7
            muxq    config, #$50     ' Set bits 4-7 to $5
- name: Read the Q register back
  description: Copy the current value of Q into a register. Start from zero, then MUXQ with an all-ones source; each 1 bit in Q sets the same bit in qval
  code: |
    ' qval = the current value of Q
            mov     qval, #0               ' reset qval
            muxq    qval, ##$FFFFFFFF      ' for each 1 bit in Q, set the same bit in qval
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SETQ CONSIDERATIONS (retrieving the current Q value)"
- name: Masked merge
  description: SETQ + MUXQ for masked merge
  code: |
    ' Masked merge operation
            setq    mask             ' Load mask
            muxq    dest, source     ' dest = (dest & !mask) | (source & mask)

    ' The same result as:
    '         mov  temp, source
    '         and  temp, mask
    '         andn dest, mask
    '         or   dest, temp
- name: Multi-Pin State Update
  description: Update multiple pin states simultaneously
  code: |
    ' Update LED states on multiple pins
            setq    led_mask         ' Which LEDs to update
            muxq    outa, led_states ' Update LED pins

    led_mask   long   %00001111_00000000_00000000_00000000  ' LEDs on pins 24-27
    led_states long   %00001010_00000000_00000000_00000000  ' Pattern to display
related:
