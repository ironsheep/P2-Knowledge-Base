  - "description (an ALTx between the SETQ and DRVNOT keeps the override): Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ALTB, pp.38-39 (SETQ / SETQ2 does not affect ALTx instructions; the Q value passes through to the next instruction); a SETQ separated by other instructions is in no source"
  - "P2 Instructions v35 - Rev B/C Silicon, row 380 (DRVNOT {#}D {WCZ}: toggle OUT bits of pins D[10:6]+D[5:0]..D[5:0], DIR bits = 1; wraps within OUTA/OUTB; prior SETQ overrides D[10:6]; C,Z = OUT bit; write DIRx* + OUTx; 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, DRVNOT, p.77 (encoding table and footnote 1; Dest[5:0], Dest[10:6], the 9-bit literal range of Dest[8:6], ##Dest, the SETQ substitution, the wrap within DIRA or DIRB and OUTA or OUTB, C and Z set to the original OUTx base bit, OUTNOT followed by DIRH, 2 clocks)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Pin instructions, p.39 (DRVNOT {#}D {WCZ}, 2 clocks)"
