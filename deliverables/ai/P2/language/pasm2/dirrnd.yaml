instruction: DIRRND
syntax: DIRRND {#}Dest {WCZ}
brief_description: Direction random
category: Pin
description: >-
  DIRRND alters the direction register's bit(s) designated by Dest to be random
  low and high (input and output), based on bit(s) from the Xoroshiro128** PRNG.
  All other bits are left unchanged.

  Dest[5:0] indicates the pin number (0-63). For a range of pins, Dest[5:0]
  indicates the base pin number (0-63) and Dest[10:6] indicates how many
  contiguous pins beyond the base should be affected (1-31).

  A 9-bit literal Dest is enough to express the base pin (Dest[5:0]) and a range
  of up to 8 contiguous pins (Dest[8:6]). If needed, use the augmented literal
  feature (##Dest) to augment Dest to an 11-bit literal value-- this inserts an
  AUGD instruction prior.

  When Dest is a register, the register's value bits [10:0] are used as-is to
  form the 11-bit ID range. A prior SETQ overrides Dest[10:6] with the low five
  bits of the SETQ value; an ALTx between the SETQ and DIRRND keeps the override,
  and a SETQ separated from DIRRND by other instructions is not documented.

  The range calculation (from Dest[5:0] up to Dest[5:0]+Dest[10:6]) will wrap
  within the same 32-pin group (DIRA or DIRB); it will not cross the port
  boundary.

  If the WCZ effect is specified, the C and Z flags are set to the
  original (pre-instruction) state of the base pin's DIR bit (DIRA / DIRB), identified
  by Dest.
result: >-
  The I/O pin direction bit(s), described by Dest, are each set randomly; the
  rest are left as-is.
parameters:
- Dest is the register, 9-bit literal, or 11-bit augmented literal whose value
  identifies the I/O pin(s) whose DIR bit is set randomly.
- WCZ is an optional effect to update flags.
flags_affected:
  C: Set to the original (pre-instruction) state of the base pin's DIR bit
  Z: Set to the original (pre-instruction) state of the base pin's DIR bit
syntax_variants:
- DIRRND {#}Dest {WCZ}
timing:
  cycles: 2
  type: fixed
encoding:
- bits: EEEE 1101011 CZL DDDDDDDDD 001000110
  write: DIRx
  c: Orig DIRx base bit
  z: Orig DIRx base bit
  clocks: '2'
encoding_notes:
- "DIRRND uses the S-field code 001000110, the same code as TESTP with XORC or XORZ."
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, DIRRND, p.72; encoding_notes: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 1101011 CZL DDDDDDDDD 001000110 for both TESTP D/# XORC/XORZ and DIRRND D/# {WCZ})"
sources:
  - "description (DIR bits of pins D[10:6]+D[5:0]..D[5:0] = RNDs; wraps within DIRA/DIRB; prior SETQ overrides D[10:6]; C,Z = DIR bit; write DIRx; 2 clocks): P2 Instructions v35 - Rev B/C Silicon, row 355; Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), list of changes (DIRx/OUTx/FLTx/DRVx can now work on a span of pins, +D[10:6] pins; prior SETQ overrides D[10:6])"
  - "description (random low and high, input and output, from bits of the Xoroshiro128** PRNG, Dest[5:0], Dest[10:6], the 9-bit literal range of Dest[8:6], ##Dest and AUGD, the register value bits [10:0], the wrap within DIRA or DIRB): Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, DIRRND, p.72"
  - "description (an ALTx between the SETQ and DIRRND keeps the override): Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ALTB, pp.38-39 (SETQ / SETQ2 does not affect ALTx instructions; the Q value passes through to the next instruction); a SETQ separated by other instructions is in no source"
documentation_level: comprehensive
last_updated: '2025-11-26'
manual_extraction_date: '2025-01-19'
oneliner: Set pin(s) DIR bit randomly
