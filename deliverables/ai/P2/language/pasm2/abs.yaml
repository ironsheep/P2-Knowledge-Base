instruction: ABS
syntax: ABS Dest, {#}Src {WC|WZ|WCZ}
brief_description: Absolute
category: Math and Logic
description: ABS determines the absolute value of Src or Dest and writes the result into Dest. If the WC or WCZ effect is specified, the C flag is set (1) if the original Src or Dest value was negative, or is cleared (0) if it was positive. If the WZ or WCZ effect is specified, the Z flag is set (1) if the result is zero, or is cleared (0) if it is non-zero. Literal Src values are zero-extended, so ABS is really best used with register Src (or augmented Src) values.
result: Absolute Src (or Dest) value is stored in Dest.
parameters:
- Dest is the register in which to write the absolute value of Dest or Src.
- Src is an optional register, 9-bit literal, or 32-bit augmented literal whose absolute
  value is written to Dest.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set to original sign bit (S[31] or D[31])
  Z: Set if result equals zero
syntax_variants:
- ABS Dest, {#}Src {WC|WZ|WCZ}
- ABS Dest {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 0110010 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: S[31]
  z: Result == 0
  clocks: '2'
- bits: EEEE 0110010 CZ0 DDDDDDDDD DDDDDDDDD
  write: D
  c: D[31]
  z: Result == 0
  clocks: '2'
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_du
  pattern: D{,S/#}
  description: Destination register, optional Source register or immediate (unary/binary)
  valueType: 3
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 3
