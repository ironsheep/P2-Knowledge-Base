instruction: AUGD
syntax: 'AUGD #Dest'
brief_description: Augment destination
category: Miscellaneous
description: AUGD is an assistant instruction to aid with literal values that exceed 9 bits. Most PASM2 instructions have 9 bits available for literal Dest values; enough for many uses, but not all. AUGD augments the next occurrence of a literal Dest value to be a full 32-bits. When the instruction with the soon-to-be-augmented literal is later executed, the cog uses the lower 9 bits encoded in the instruction's Dest field and prepends AUGD's 23 bits to it.
result: The 23-bit value formed from Dest is queued to prefix the next literal Dest occurrence (#Dest) to form a 32-bit literal for that instruction; interrupts are also temporarily disabled.
parameters:
- Dest is a 32-bit literal whose upper 23 bits are prepended to the next literal Dest occurrence.
flags_affected:
  C: No effect
  Z: No effect
syntax_variants:
- 'AUGD #Dest'
usage_notes: 'All instructions following AUGD are shielded from interrupt until after
  the instruction with the

  newly-augmented literal Dest value is executed

  Dest value augmentation occurs in the instruction pipeline only; code is not altered,
  value does not persist

  SETQ / SETQ2 does not affect AUGD-- the Q value passes through to the next instruction

  Tip: Though AUGD may be manually entered wherever needed, the Parallax P2 compiler
  supports a convenient way

  to use this feature. In the target instruction''s Dest field, use "##" followed
  by the desired 32-bit literal (instead of

  "#" followed by a 9-bit literal); the compiler will automatically invoke AUGD immediately
  before. When counting

  clock cycles, make sure to account for 2 extra clock cycles for instructions containing
  ## augmented literals.'
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 11111DD DDD DDDDDDDDD DDDDDDDDD
  write: Hidden D Queue
  c: —
  z: —
  clocks: '2'
silicon_errata:
  setq_ptrx_block_size_delta_cancelled:
    severity: critical
    description: |
      AUGD placed between SETQ/SETQ2 and RDLONG/WRLONG/WMLONG-PTRx cancels the
      special-case block-size PTRx delta. The expected number of longs transfers
      correctly, but PTRx advances by only a single-long (normal PTRx-expression)
      delta instead of the block-size delta.
    example: |
      SETQ   #16-1         ' ready to load 16 longs
      AUGD   start_reg     ' AUGD here cancels the block-size PTRx delta!
      RDLONG 0,ptra++      ' ptra incremented by 4 (1 long), not 16*4
    workaround: "Do not place AUGD (or ALTx/AUGS) between SETQ/SETQ2 and the RDLONG/WRLONG/WMLONG-PTRx instruction; keep SETQ adjacent to the block transfer."
    status: "Active in Rev C silicon (current production)."
    source: "engineering/ingestion/sources/silicon-doc/p2-documentation.txt:196-199 (KNOWN BUGS -- 'Intervening ALTx/AUGS/AUGD instructions between SETQ/SETQ2 and RDLONG/WRLONG/WMLONG-PTRx instructions will cancel the special-case block-size PTRx deltas')"
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_aug
  pattern: '#S'
  description: 'Augment: immediate 23-bit value for AUGS/AUGD'
  valueType: 23
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 23
enhancement_source: PNUT_TS_v2.0_complete_operand_integration_2025-09-13
last_updated: '2025-09-19'
manual_extraction_date: '2025-01-19'
oneliner: Augment next literal Dest to 32-bits
related:
- AUGS
examples:
- description: Using ## syntax (compiler auto-generates AUGD)
  code: |
    PUSHA       ##$ABCDEF                            '2+3..10 cycles (in Cog RAM)
    QMUL        ##8192, #4                           '2+2..9 cycles
- description: Explicit AUGD usage (equivalent to above)
  code: |
    AUGD        #$ABCDEF                              '2 cycles
    PUSHA       #$ABCDEF & $1FF                       '3..10 cycles (in Cog RAM)
    AUGD        #8192                                 '2 cycles
    QMUL        #8192 & $1FF, #4                      '2..9 cycles
