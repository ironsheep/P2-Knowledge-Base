constant: POSX
name: POSX
value: 2147483647
hex_value: $7FFFFFFF
description: 'Maximum positive integer constant

  Largest positive value in 32-bit signed integer representation

  '
category: Constants
documentation_level: complete
usage: 'Use for range checking and overflow detection

  Represents the upper bound of signed integer values

  '
examples:
- code: |
    cmp     value, ##POSX   wcz     ' unsigned compare against POSX
    if_a    jmp     #overflow       ' value > POSX: bit 31 is set (negative as a signed long)
  description: Detecting a value above POSX (unsigned compare)
- code: |
    mov     lowest, ##POSX          ' start a running minimum at the largest signed value
    fles    lowest, sample          ' lowest = the smaller of lowest and sample (signed)
  description: Using POSX as the starting value of a running signed minimum
notes:
- 2^31 - 1 in decimal notation
- Bit 31 clear, bits 30-0 set
- Used for saturation arithmetic and bounds checking
related:
- NEGX
- FLES
- FGES
oneliner: Maximum positive integer constant
