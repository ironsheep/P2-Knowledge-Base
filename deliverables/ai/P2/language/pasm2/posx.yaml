constant: POSX
name: POSX
value: 2147483647
hex_value: $7FFFFFFF
description: 'Maximum positive integer constant

  Largest positive value in 32-bit signed integer representation

  '
category: Constants
documentation_level: complete
usage: 'Use for range checking and overflow detection

  Represents the upper bound of signed integer values

  '
examples:
- code: 'cmp     value, POSX     wc  '' Check if value exceeds max positive

    if_nc jmp   #overflow       '' Jump if overflow (carry not set means greater/equal)

    '
  description: Checking for positive overflow
- code: 'mov     limit, POSX         '' Set limit to maximum positive value

    fles    value, limit        '' Clamp value to not exceed POSX

    '
  description: Using POSX as upper limit
notes:
- 2^31 - 1 in decimal notation
- Bit 31 clear, bits 30-0 set
- Used for saturation arithmetic and bounds checking
related:
- NEGX
- FLES
- FGES
oneliner: Maximum positive integer constant
