instruction: SUBSX
syntax: SUBSX Dest, {#}Src {WC|WZ|WCZ}
brief_description: Subtract signed, extended
category: Math and Logic
description: >-
  SUBSX subtracts the signed value of Src plus C from the signed Dest and stores the
  result into the Dest register. The SUBSX instruction is used to perform signed
  multi-long (extended) subtraction, such as 64-bit subtraction. If the WC or WCZ
  effect is specified, the C flag is set (1) if the result is negative (Result[31] = 1),
  or is cleared (0) if positive. Use WC or WCZ on preceding SUB and SUBX instructions
  for proper final C flag. If the WZ or WCZ effect is specified, the Z flag is set (1)
  if Z was previously set and the result of Dest - (Src + C) is zero, or it is cleared
  (0) if non-zero. Use WZ or WCZ on preceding SUB and SUBX instructions for proper
  final Z flag. To subtract signed multi-long values, use SUB (not SUBS) followed
  possibly by SUBX, and finally SUBSX as described in Subtracting Two Multi-Long Values.
result: >-
  Difference of signed Dest and signed Src (plus C) is stored in Dest and optionally
  the C and Z flags are updated to the extended sign and zero status.
parameters:
- Dest is a register containing the value to subtract Src plus C from, and is where
  the result is written.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value plus C
  is subtracted from Dest.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set to sign of D-(S+C) (1 if negative)
  Z: Set if Z was previously set AND result equals zero
syntax_variants:
- SUBSX D,{#}S {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 0001111 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: sign of D-(S+C)
  z: Z AND (Result == 0)
  clocks: '2'
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_ds
  pattern: D,S/#
  description: Destination register, Source register or immediate value
  valueType: 0
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 0
