instruction: SUBSX
syntax: SUBSX Dest, {#}Src {WC|WZ|WCZ}
brief_description: Subtract signed, extended
category: Math and Logic
description: >-
  SUBSX subtracts the signed value of Src plus C from the signed Dest and stores the
  result into the Dest register. The SUBSX instruction is used to perform signed
  multi-long (extended) subtraction, such as 64-bit subtraction. If the WC or WCZ
  effect is specified, the C flag is set to the true sign of the result -- the sign of
  D - (S + C) at full precision (overflow-corrected) (C=1 if negative, C=0 if
  non-negative). Parallax's documents also describe C as set (1) if the result is
  negative (Result[31] = 1), or cleared (0) if positive.
  Use WC or WCZ on preceding SUB and SUBX instructions
  for proper final C flag. If the WZ or WCZ effect is specified, the Z flag is set (1)
  if Z was previously set and the result of Dest - (Src + C) is zero, or it is cleared
  (0) if non-zero. Use WZ or WCZ on preceding SUB and SUBX instructions for proper
  final Z flag. To subtract signed multi-long values, use SUB (not SUBS) followed
  possibly by SUBX, and finally SUBSX as described in Subtracting Two Multi-Long Values.
result: >-
  Difference of signed Dest and signed Src (plus C) is stored in Dest and optionally
  the C and Z flags are updated to the extended sign and zero status.
parameters:
- Dest is a register containing the value to subtract Src plus C from, and is where
  the result is written.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value plus C
  is subtracted from Dest.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set to the true sign of D - (S + C) (1 if negative)
  Z: Set if Z was previously set AND result equals zero
syntax_variants:
- SUBSX D,{#}S {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 0001111 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: true sign of D - (S + C)
  z: Z AND (Result == 0)
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, SUBSX, pp.131-132"
sources:
  - "C flag sign: P2 Instructions v35 - Rev B/C Silicon, row 17 (SUBSX D,{#}S: subtract (S + C) from D, signed and extended, D = D - (S + C), C = correct sign of (D - (S + C)), Z = Z AND (result == 0); 2 clocks; write D) and row 180 (TJV: C = correct sign from the last addition/subtraction)"
  - "C flag sign: Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, SUBSX encoding table (sign of D-(S+C)), p.131; PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.150"
  - "C flag sign: Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, TJV description (C holds the correct sign), p.138"
  - "C flag sign, source disagreement: Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, SUBSX, p.132 (its prose says Result[31]; its own encoding table, p.131, says sign of D-(S+C))"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Math and Logic Instructions, p.38 (SUBSX D,{#}S {WC/WZ/WCZ}, C = correct sign of (D - (S + C)), Z = Z AND (result == 0), 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, SUBSX, pp.131-132 (Result line, Dest, Src and effect parameters, encoding row 0001111 CZI, write D, Z Z AND (Result = 0), 2 clocks, Related list, multi-long note, final-C and final-Z notes)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 0001111 CZI DDDDDDDDD SSSSSSSSS SUBSX D,S/# {WC/WZ/WCZ}); no measurement covers SUBSX (EF-018 covers ADDS, SUBS and CMPS)"
documentation_level: comprehensive
last_updated: '2025-09-19'
manual_extraction_date: '2025-01-19'
oneliner: Subtract one signed extended value from another
