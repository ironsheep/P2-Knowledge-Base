instruction: RDWORD
syntax: RDWORD  D,{#}S/P {WC/WZ/WCZ}
encoding:
- bits: EEEE 1010111 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: MSB of word
  z: Result == 0
  clocks: '9...16 *'
timing:
  cycles: "9...16 (cog) / 9...26 (hub-exec)"
  type: variable
  range_source: "encoding.clocks per PASM2 Manual 2022/11/01"
  notes: "Hub-window dependent; minimum 9 clocks when window is hit. +1 clock if the word crosses a hub long boundary (PASM2 Manual instruction table, footnote '+1 if crosses hub long')."
description: '{WC/WZ/WCZ}     Read zero-extended word from hub address {#}S/PTRx into
  D. C = MSB of word. *                                          9...16 1 / 9...26'
flags_affected:
  C: Set to MSB of word
  Z: Set if result equals zero
silicon_errata:
  after_no_wait_rdfast: "Started fewer than 16 clocks after a no-wait RDFAST (D[31]=1), RDWORD can complete before its own read: D gets the word at its own offset within the PREVIOUS hub read's long, and C/Z are set from that wrong value. Rule: use the waiting RDFAST (D[31]=0), or start this RDWORD at least 16 clocks after the no-wait RDFAST (e.g. WAITX #12 directly after it). Full account: language/pasm2/rdfast.yaml silicon_errata."
documentation_source: PASM2 Manual 2022-11-01
documentation_level: enhanced
compiler_operand_format:
  name: operand_dsp
  pattern: D,S/#/PTRA/PTRB
  description: Destination, source/immediate/pointer register
  valueType: 15
compiler_encoding:
  operandFormat: 15
enhancement_source: PNUT_TS_v2.0_complete_operand_integration_2025-09-13
syntax_variants:
- RDWORD D,{#}S/P
last_updated: '2025-09-19T16:04:17.009591'
category: Hub RAM
oneliner: Read zero-extended word from hub RAM
immediate_address_note: >-
  A plain immediate source/address operand is limited to 0-255 (the 9-bit S
  field's bit 8 is the pointer/expression selector, so a literal spans only bits
  7:0). For 20-bit hub addresses this rarely matters - use a register, a
  PTRA/PTRB pointer, or the ## augmented form for the full range. This cap is
  shared across the hub-memory operand family (RDLONG WRLONG RDBYTE WRBYTE RDWORD
  WRWORD WMLONG) and is felt most with RDLUT/WRLUT, where small LUT addresses are
  written as bare literals. Authority: PNut-TS v1.55 (Spin2 v55); Silicon Doc
  hub-operand bit-table.

