instruction: SETSE4
syntax: SETSE4  {#}D
encoding:
- bits: EEEE 1101011 00L DDDDDDDDD 000100011
  write: —
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: |
  Set SE4 event configuration to D[8:0]. Configures selectable event 4 to trigger
  on the specified pin, LUT, or lock condition. Also clears the SE4 event flag.

  IMPORTANT: SETSE can ONLY configure pin, LUT, or lock events.
  See setse1.yaml for complete D[8:0] encoding table.
d_encoding_summary: |
  D[8:0] encoding (see setse1.yaml for full details):
  %000_xx_xxxx = LUT access events
  %000_01_LLLL = Lock rises, %000_10_LLLL = Lock falls, %000_11_LLLL = Lock changes
  %001_PPPPPP = Pin rises, %010_PPPPPP = Pin falls, %011_PPPPPP = Pin changes
  %10x_PPPPPP = Pin low, %11x_PPPPPP = Pin high
flags_affected:
  C: No effect
  Z: No effect
examples:
  - code: "SETSE4  #%110_000111"
    description: "Configure SE4 for pin 7 high level"
  - code: "SETSE4  #%000_00_01_11"
    description: "Configure SE4 for this cog writes LUT address $1FF"
related:
  - language/pasm2/setse1.yaml
  - language/pasm2/waitse4.yaml
  - language/pasm2/pollse4.yaml
documentation_source: Silicon Doc v35, PASM2 Manual 2022-11-01
documentation_level: comprehensive
compiler_operand_format:
  name: operand_l
  pattern: D/#0..511
  description: Destination or immediate value 0-511
  valueType: 26
compiler_encoding:
  operandFormat: 26
enhancement_source: PNUT_TS_v2.0_complete_operand_integration_2025-09-13
syntax_variants:
- SETSE4 {#}D
last_updated: '2026-01-17'
category: Event
oneliner: Configure selectable event 4 for pin/LUT/lock triggers
