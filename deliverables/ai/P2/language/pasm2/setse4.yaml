instruction: SETSE4
syntax: SETSE4  {#}D
encoding:
- bits: EEEE 1101011 00L DDDDDDDDD 000100011
  write: —
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: |
  Set SE4 event configuration to D[8:0]. Configures selectable event 4 to trigger
  on the specified pin, LUT, or lock condition. Also clears the SE4 event flag.
  SE4 is set whenever the configured event occurs. The matched polling, waiting
  and branching instructions clear it, as does SETSE4.
d_encoding_summary: |
  D[8:0] configuration values (AA = the low two bits of the LUT address %1111111AA):
  %000_00_00AA = this cog reads the LUT address, %000_00_01AA = this cog writes it
  %000_00_10AA = odd/even companion cog reads it, %000_00_11AA = companion cog writes it
  %000_01_LLLL = hub lock LLLL rises, %000_10_LLLL = falls, %000_11_LLLL = changes
  %001_PPPPPP = pin PPPPPP rises, %010_PPPPPP = falls, %011_PPPPPP = changes
  %10x_PPPPPP = pin PPPPPP is low, %11x_PPPPPP = pin PPPPPP is high
flags_affected:
  C: No effect
  Z: No effect
examples:
  - code: "SETSE4  #%110_000111"
    description: "Configure SE4 for pin 7 high"
  - code: "SETSE4  #%000_00_01_11"
    description: "Configure SE4 for this cog writes LUT address %1111111_11"
related:
  - language/pasm2/setse1.yaml
  - language/pasm2/waitse4.yaml
  - language/pasm2/pollse4.yaml
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.156; Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), EVENTS (Selectable Events), p.48"
documentation_level: comprehensive
syntax_variants:
- SETSE4 {#}D
last_updated: '2026-01-17'
category: Event
oneliner: Configure selectable event 4 for pin/LUT/lock triggers
