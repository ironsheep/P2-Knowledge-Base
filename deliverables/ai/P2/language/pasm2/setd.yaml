instruction: SETD
syntax: SETD Dest, {#}Src
brief_description: Set destination
category: Math and Logic
description: >-
  SETD copies Src[8:0] to the D field of the template, Dest, to be used with an ALTI
  instruction. Bits outside the D field remain unaffected. The D field (or Dest field)
  holds the address of a register (or sometimes a literal value) for the instruction to
  use as its destination value, and usually as its result destination, during its
  execution. SETD can also be used in self-modifying Reg RAM code. Unlike with ALTx
  instructions, when used this way, field value modification occurs in the program code
  itself (not the instruction pipeline); code is altered, values persist. Due to the
  instruction pipeline nature, after modifying a code register, it is necessary to elapse
  at least two instructions before executing the modified register.
result: The D field [17:9] of template Dest is set to Src[8:0].
parameters:
- Dest is the register whose 32-bit value is a template for use with an ALTI instruction.
- Src is a register or 9-bit literal whose value (Src[8:0]) is copied to the D field
  of Dest.
flags_affected:
  C: No effect
  Z: No effect
syntax_variants:
- SETD D,{#}S
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1001101 10I DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, SETD, pp.124-125"
sources:
