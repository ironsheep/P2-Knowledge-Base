instruction: OUTRND
syntax: OUTRND {#}Dest {WCZ}
brief_description: Output random
category: Pin
description: >-
  OUTRND alters the output level register's bit(s) designated by Dest to be
  random, based on bit(s) from the Xoroshiro128** PRNG. All other
  bits are left unchanged.

  Dest[5:0] indicates the pin number (0-63). For a range of pins, Dest[5:0]
  indicates the base pin number (0-63) and Dest[10:6] indicates how many
  contiguous pins beyond the base should be affected (1-31). The range calculation
  (from Dest[5:0] up to Dest[5:0]+Dest[10:6]) wraps within the same 32-pin group
  (OUTA or OUTB); it does not cross the port boundary.

  A 9-bit literal Dest is enough to express the base pin (Dest[5:0]) and a range
  of up to 8 contiguous pins (Dest[8:6]). If needed, use the augmented literal
  feature (##Dest) to augment Dest to an 11-bit literal value-- this inserts an
  AUGD instruction prior.

  When Dest is a register, the register's value bits [10:0] are used as-is to
  form the 11-bit ID range, unless a prior SETQ overrides value bits[10:6] with
  the low five bits of the SETQ value. An ALTx between the SETQ and OUTRND keeps
  the override, and a SETQ separated from OUTRND by other instructions is not
  documented.

  If the WCZ effect is specified, the C and Z flags are updated to the original
  state of OUTA / OUTB's base bit, identified by Dest.
result: >-
  The I/O pin output level bit(s), described by Dest, are each set randomly;
  the rest are left as-is.
parameters:
- Dest is the register, 9-bit literal, or 11-bit augmented literal whose value
  identifies the I/O pin(s) whose output levels are set randomly.
- WCZ is an optional effect to update flags.
flags_affected:
  C: Set to original OUT bit state
  Z: Set to original OUT bit state
syntax_variants:
- OUTRND {#}Dest {WCZ}
timing:
  cycles: 2
  type: fixed
encoding:
- bits: EEEE 1101011 CZL DDDDDDDDD 001001110
  write: OUTx
  c: Original OUTx base bit
  z: Original OUTx base bit
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, OUTRND, p.109; the wrap within OUTA or OUTB: P2 Instructions v35 - Rev B/C Silicon, row 363 (OUTRND: wraps within OUTA/OUTB) and the same wrap sentence in the Manual's OUTH / OUTL, p.108"
sources:
  - "description (prior SETQ overrides D[10:6]): P2 Instructions v35 - Rev B/C Silicon, row 363 (OUTRND: OUT bits of pins D[10:6]+D[5:0]..D[5:0] = RNDs; wraps within OUTA/OUTB; prior SETQ overrides D[10:6]; C,Z = OUT bit; write OUTx; 2 clocks); Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), list of changes (DIRx/OUTx/FLTx/DRVx span of pins, +D[10:6]; prior SETQ overrides D[10:6])"
  - "description (an ALTx between the SETQ and the instruction keeps the override): Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ALTB, p.38 and ALTD, p.39 (SETQ / SETQ2 does not affect ALTx instructions; the Q value passes through to the next instruction); a SETQ separated from OUTRND by other instructions is in no source"
  - "description (Dest forms, WCZ rule, Xoroshiro128** bits, parameters): Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, OUTRND, p.109 (encoding row 001001110, write OUTx, C and Z Orig OUTx base bit, 2 clocks)"
