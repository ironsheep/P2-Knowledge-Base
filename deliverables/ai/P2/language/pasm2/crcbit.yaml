instruction: CRCBIT
syntax: CRCBIT  D,{#}S
encoding:
- bits: EEEE 1001110 10I DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: >-
  Iterate CRC value in D using C and polynomial in S. If (C XOR D[0]) then
  D = (D >> 1) XOR S, else D = (D >> 1). C is read as an input; the flags are
  not written.
flags_affected:
  C: No effect
  Z: No effect
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release (2022/11/01), Propeller 2 Assembly Language (PASM2) in Brief, p.148; P2 Instructions v35 - Rev B/C Silicon, row 131 (CRCBIT: If (C XOR D[0]) then D = (D >> 1) XOR S, else D = (D >> 1)); Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, instruction set listing, CRCBIT, p.36"
