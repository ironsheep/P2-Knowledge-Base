# PASM2 Conditional Execution System
# Source: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon); Parallax Propeller 2 Spin2 Language Documentation v51; Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, Conditions table

concept: "Conditional Execution"
category: "pasm2_core"
importance: "fundamental"

metadata:
  query_tags: ["conditional", "if", "flags", "predicate", "branchless", "wcz", "_RET_", "ret prefix", "ret call", "tail call"]
  complexity: "intermediate"
  common_questions:
    - "How do I make instructions conditional?"
    - "What are all the IF_ conditions?"
    - "How do C and Z flags work?"
    - "Can any instruction be conditional? Yes, every instruction except NOP"
    - "Does _RET_ work on a CALL?"
    - "Why did my _RET_ CALL not return?"

fundamental_concept: |
  Every PASM2 instruction except NOP can optionally:
  1. Be executed conditionally based on C and Z flags (IF_xxx prefix)
  2. Conditionally update C and Z flags (WC, WZ, WCZ suffixes), on the instructions that list a flag effect (DJNZ, RETI and NOP take none)
  These are independent features - you can use either, both, or neither.

  P2 can conditionally execute almost any instruction in place
  (NOP, the all-zero word, cannot carry a condition or _RET_).
  When an instruction's condition evaluates to false, the instruction still takes
  2 clock cycles but affects no flags or registers.

flag_system:
  c_flag:
    name: "Carry Flag"
    meaning:
      comparison: "C = 1 when the comparison or subtraction was below (IF_B, IF_C)"

  z_flag:
    name: "Zero Flag"
    meaning:
      comparison: "Z = 1 when the comparison or subtraction was equal (IF_E, IF_Z)"

condition_codes:
  # All 16 condition codes (4-bit EEEE field) with binary values and aliases.
  # These are the names for the instruction prefix. The operand symbols of
  # MODCZ, MODC and MODZ are a separate set (see modcz_operand_symbols).

  - value: "%0000"
    primary: "_RET_"
    aliases: []
    condition: "Always; then return if the instruction did not branch"
    note: "IF_RET, IF_RETURN and IF_NEVER are not condition keywords; at the start of a DAT line each defines a label, and the instruction runs unconditionally. The instruction always executes, and a return is then performed if that instruction did not branch. No C/Z context restore. When the instruction is a branch (CALL, JMP, ...) the branch stands and no return occurs -- see ret_prefix_rule."
    source: "IF_RET, IF_RETURN and IF_NEVER defining labels: CP-044; Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, Conditions table, p.68 (no such condition symbols)"

  - value: "%0001"
    primary: "IF_NC_AND_NZ"
    aliases: ["IF_NZ_AND_NC", "IF_A", "IF_GT", "IF_00"]
    condition: "C=0 AND Z=0"
    
  - value: "%0010"
    primary: "IF_NC_AND_Z"
    aliases: ["IF_Z_AND_NC", "IF_01"]
    condition: "C=0 AND Z=1"
    
  - value: "%0011"
    primary: "IF_NC"
    aliases: ["IF_AE", "IF_GE", "IF_0X"]
    condition: "C=0"
    
  - value: "%0100"
    primary: "IF_C_AND_NZ"
    aliases: ["IF_NZ_AND_C", "IF_10"]
    condition: "C=1 AND Z=0"
    
  - value: "%0101"
    primary: "IF_NZ"
    aliases: ["IF_NE", "IF_X0"]
    condition: "Z=0"
    
  - value: "%0110"
    primary: "IF_C_NE_Z"
    aliases: ["IF_DIFF", "IF_Z_NE_C"]
    condition: "C≠Z"
    
  - value: "%0111"
    primary: "IF_NC_OR_NZ"
    aliases: ["IF_NZ_OR_NC", "IF_NOT_11"]
    condition: "C=0 OR Z=0"
    
  - value: "%1000"
    primary: "IF_C_AND_Z"
    aliases: ["IF_Z_AND_C", "IF_11"]
    condition: "C=1 AND Z=1"
    
  - value: "%1001"
    primary: "IF_C_EQ_Z"
    aliases: ["IF_SAME", "IF_Z_EQ_C"]
    condition: "C=Z"
    
  - value: "%1010"
    primary: "IF_Z"
    aliases: ["IF_E", "IF_X1"]
    condition: "Z=1"
    
  - value: "%1011"
    primary: "IF_NC_OR_Z"
    aliases: ["IF_Z_OR_NC", "IF_NOT_10"]
    condition: "C=0 OR Z=1"

  - value: "%1100"
    primary: "IF_C"
    aliases: ["IF_B", "IF_LT", "IF_1X"]
    condition: "C=1"
    
  - value: "%1101"
    primary: "IF_C_OR_NZ"
    aliases: ["IF_NZ_OR_C", "IF_NOT_01"]
    condition: "C=1 OR Z=0"
    
  - value: "%1110"
    primary: "IF_C_OR_Z"
    aliases: ["IF_Z_OR_C", "IF_BE", "IF_LE", "IF_NOT_00"]
    condition: "C=1 OR Z=1"
    
  - value: "%1111"
    primary: "IF_ALWAYS"
    aliases: ["(no prefix)"]
    condition: "Always"

modcz_operand_symbols:
  note: "MODCZ, MODC and MODZ take a different set of names for the same 4-bit codes: _CLR, _NC_AND_NZ, _GT, _NC, _GE, _NZ, _NE, _Z, _E, _C, _LT, _LE, _SET and the others listed in language/pasm2/modcz.yaml. Those names are operands, not instruction prefixes, and the IF_ names above are prefixes, not operands. The two sets differ at the ends: code %0000 is the _RET_ prefix above and the _CLR operand symbol, and code %1111 is the IF_ALWAYS prefix above and the _SET operand symbol."
  full_table: language/pasm2/modcz.yaml

syntax_rules:
  condition_prefix:
    position: "Before instruction mnemonic"
    format: "condition_code instruction operands [WC] [WZ] [WCZ]"
    examples:
      - "IF_Z    MOV  x, y       ' Execute if Z=1"
      - "IF_NC   ADD  x, #1 WC   ' Add if C=0, update C"
      - "        MOV  x, y       ' Always execute (no prefix)"
  
  flag_suffixes:
    wc: "Write result to Carry flag"
    wz: "Write result to Zero flag"
    wcz: "Write result to both flags"
    none: "Don't update flags"
    examples:
      - "ADD  x, y WC      ' Update C with carry out"
      - "SUB  x, y WZ      ' Update Z if result is zero"
      - "CMP  x, y WCZ     ' Update both flags"

usage_patterns:
  any_instruction_conditional:
    description: "Any instruction except NOP can be conditional"
    code: |
      ' Arithmetic
      IF_Z    ADD  x, #1
      IF_NC   SUB  y, #10 WC
      
      ' Logic
      IF_NZ   AND  mask, pattern WZ
      IF_C    OR   flags, #$100
      
      ' Memory
      IF_E    RDLONG value, ptr
      IF_NE   WRLONG #0, address
      
      ' Jumps
      IF_C    JMP  #error_handler
      IF_Z    CALL #process_zero

  branchless_min_max:
    description: "Find the unsigned minimum without branches"
    code: |
      CMP     a, b WC           ' Compare a to b
      IF_C    MOV min_val, a    ' If a < b, min = a
      IF_NC   MOV min_val, b    ' If a >= b, min = b
  
  conditional_accumulation:
    description: "Conditionally add to sum"
    code: |
      TEST    value, ##$8000_0000 WZ    ' Z = 1 when bit 31 (the sign bit) is clear
      IF_Z    ADD sum, value            ' Add if non-negative
  
  multi_way_decision:
    description: "Compare state to 0, 1 and 2 and jump to the matching routine"
    code: |
      CMP     state, #0 WZ
      IF_Z    JMP #state0       ' State 0
      CMP     state, #1 WZ
      IF_Z    JMP #state1       ' State 1
      CMP     state, #2 WZ
      IF_Z    JMP #state2       ' State 2
              JMP #default      ' Default case

ret_prefix_rule:
  rule: "_RET_ returns if the instruction did not branch."
  full_semantics: |
    _RET_ is the EEEE=%0000 condition prefix. The prefixed instruction always
    executes. A return is then performed if that instruction did not branch:
    the return pops stack[19:0] into PC, with no C/Z context restore.
    If the instruction did branch, the branch stands and no return happens.
  on_branching_instructions: |
    '_RET_ CALL #target' assembles, with EEEE=%0000 in the instruction word, and
    the CALL pushes the address of the next instruction and jumps, as a plain
    'CALL #target' does. In a test of a bytecode handler ending in '_RET_ CALL',
    the callee returned to the instruction after the '_RET_ CALL', and the code
    placed there executed. Which instruction that is depends on where the
    assembler placed it. The same applies to JMP and the other branching
    instructions.
  call_then_return_forms: |
    ' _RET_ CALL: the helper returns to the next instruction
            _RET_   CALL    #helper
    ' CALL, then RET: the routine returns after the helper returns
            CALL    #helper
            RET
  non_branching_instructions: "'_RET_ OR x,#0', '_RET_ CMP x,#0 WZ' and '_RET_ SETQ #mode' (the XBYTE arming form) execute and then return."
  source:
    - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, Conditions ( IF_x ), p.68: _RET_ %0000 always; execute instruction then return if no branch; no context restore"
    - "P2 Instructions v35 - Rev B/C Silicon, row 410 (encoding 0000 ------- --- --------- ---------, stack effect Pop): Execute <inst> always and return if no branch. If <inst> is not branching then return by popping stack[19:0] into PC."
    - "Corroborated on real P2 silicon 2026-08-14 (EF-058): a handler ending in _RET_ CALL fell through into the following handler, which executed in full."

special_patterns:
  return_conditions:
    description: "Returns using the _RET_ prefix and a conditional RET (see ret_prefix_rule for _RET_ on branching instructions)"
    code: |
      _RET_   CMP x, #0 WZ     ' Compare and return
                                ' The return happens after the instruction
                                ' (CMP does not branch, so the return occurs)

      ' Conditional return
      CMP     x, limit WC
      IF_C    RET              ' Return if below limit
  
  conditional_flag_updates:
    description: "Update flags only when needed"
    code: |
      ADD     x, y         ' No flag update
      ADD     x, y WC      ' Update C only
      ADD     x, y WZ      ' Update Z only  
      ADD     x, y WCZ     ' Update both
      
      ' Conditional execution WITH conditional flag update
      IF_NZ   ADD x, y WCZ  ' If Z=0, add and update both flags
  
  test_and_branch_alternative:
    description: "Test a flag bit, then branch to a wait routine or jump in place"
    branch_form: |
      ' Test a flag bit, then branch to a separate wait routine
      TESTB   flags, #READY_BIT WC    ' READY_BIT is a bit number
      IF_NC   JMP #wait_loop
      ' continue...

    conditional_form: |
      ' Conditional JMP in place
      TESTB   flags, #READY_BIT WC    ' READY_BIT is a bit number
      IF_NC   JMP #$-1        ' Loop back to the TESTB above
      ' continue when ready

timing_rule: "An instruction whose condition is false still takes 2 clock cycles and affects no flags or registers."

common_mistakes:
  - mistake: "Expecting '_RET_ CALL' to call and return in one instruction"
    wrong: |
      _RET_   CALL    #helper   ' Assembles; the helper returns to the next instruction
    right: |
      CALL    #helper
      RET
    explanation: "_RET_ returns if the instruction did not branch. CALL branches, so no return is performed and '_RET_ CALL' acts as a plain CALL: the callee returns to the instruction after the call, and the code that follows it in cog RAM executes. See ret_prefix_rule."

  - mistake: "Assuming IF_LT/IF_LE perform signed comparisons"
    wrong: |
      CMP  x, y WCZ      ' UNSIGNED compare
      IF_LT ...          ' IF_LT is valid (alias of IF_C) but this tests UNSIGNED below
    right: |
      CMPS x, y WCZ      ' SIGNED compare
      IF_C ...           ' Now correct for signed less-than
    explanation: "IF_LT is a valid alias of IF_C (%1100, unsigned below) and IF_LE aliases IF_C_OR_Z (%1110, unsigned below-or-equal). They are NOT invalid names -- but they test the unsigned condition. For signed comparisons, generate the flags with CMPS/CMPSX first."
  
  - mistake: "Forgetting WC/WZ on compare"
    wrong: "CMP x, y          ' Doesn't update flags!"
    right: "CMP x, y WCZ      ' Updates both flags"
    explanation: "Compare without WC/WZ doesn't update flags"
  
  - mistake: "Wrong condition after CMP"
    wrong: |
      CMP  x, y WC     ' Unsigned compare
      IF_C  ' x < y    ' OK for unsigned
    right: |
      CMPS x, y WC     ' Signed compare needed
      IF_C  ' x < y    ' Now correct for signed
  
  - mistake: "Overwriting flags accidentally"
    wrong: |
      CMP x, y WZ
      ADD temp, #1 WZ  ' Overwrites Z!
      IF_Z  ...        ' Wrong Z flag!
    right: |
      CMP x, y WZ
      ADD temp, #1     ' Don't update flags
      IF_Z  ...        ' Correct Z flag

