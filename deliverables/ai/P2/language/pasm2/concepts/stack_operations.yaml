concept: stack_operations
title: P2 Stack Operations
category: memory_operations
description: Hardware and software stack implementations using PTRA/PTRB and internal call stack

overview: |
  P2 provides multiple stack mechanisms: hardware-assisted stacks using PTRA/PTRB with auto-increment/decrement,
  an internal 8-level hardware call stack, and software-managed stacks in hub memory. Understanding these
  different stack types and their interactions is crucial for subroutine management and data structures.

hardware_stacks:
  ptra_stack:
    pointer: "PTRA (Pointer A)"
    purpose: "Primary data/address stack"
    width: "20-bit pointer"
    range: "Full hub memory access"
    operations:
      PUSHA:
        syntax: "PUSHA value"
        operation: "WRLONG value, PTRA++ (hub[PTRA] = value, then PTRA += 4)"
        timing: "3 clocks (range 3...10 cog / 3...20 hub-exec; per language/pasm2/pusha.yaml encoding)"
        description: "Write then post-increment push (ascending stack)"
        source: "operation: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), Assembly Language (instruction aliases: PUSHA register/# = WRLONG register/#,PTRA++)"

      POPA:
        syntax: "POPA dest"
        operation: "RDLONG dest, --PTRA (PTRA -= 4, then dest = hub[PTRA])"
        timing: "9 clocks (range 9...16 cog / 9...26 hub-exec; per language/pasm2/popa.yaml encoding)"
        description: "Pre-decrement then read pop (ascending stack)"
        source: "operation: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), Assembly Language (instruction aliases: POPA register = RDLONG register,--PTRA)"

      manual:
        push: |
          WRLONG value, PTRA++
        pop: |
          RDLONG dest, --PTRA
    
  ptrb_stack:
    pointer: "PTRB (Pointer B)"
    purpose: "Secondary data/address stack"
    width: "20-bit pointer"
    operations:
      PUSHB:
        syntax: "PUSHB value"
        operation: "WRLONG value, PTRB++ (hub[PTRB] = value, then PTRB += 4)"
        timing: "3 clocks (range 3...10 cog / 3...20 hub-exec; per language/pasm2/pushb.yaml encoding)"
        source: "operation: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), Assembly Language (instruction aliases: PUSHB register/# = WRLONG register/#,PTRB++)"
      
      POPB:
        syntax: "POPB dest"
        operation: "RDLONG dest, --PTRB (PTRB -= 4, then dest = hub[PTRB])"
        timing: "9 clocks (range 9...16 cog / 9...26 hub-exec; per language/pasm2/popb.yaml encoding)"
        source: "operation: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), Assembly Language (instruction aliases: POPB register = RDLONG register,--PTRB)"

  call_stack:
    type: "Internal hardware stack"
    depth: "8 levels"
    width: "32 bits per entry (CALL pushes {C, Z, 10'b0, PC[19:0]}; PUSH pushes a full 32-bit value)"
    overflow: "A 9th push silently discards the oldest entry: the newest eight entries are kept and the outermost return is lost"
    underflow: "Popping more than was pushed returns the bottom entry again"
    source: "EF-094; Parallax Propeller 2 (P2X8C4M64P) Datasheet, Release November 1, 2022, Branch Instructions, p.40"
    operations:
      CALL:
        operation: "Push {C, Z, PC} (the address of the next instruction) onto the hardware stack"
        syntax: "CALL #address"
        flags_saved: "C and Z"

      RET:
        operation: "Pop PC and restore flags"
        syntax: "RET {WC/WZ/WCZ}"
        flag_restore: "Optional via WC/WZ/WCZ"

      PUSH:
        operation: "Push D onto the hardware stack (a full 32-bit value)"
        syntax: "PUSH {#}D"

      POP:
        operation: "Pop the hardware stack into D"
        syntax: "POP D {WC/WZ/WCZ}"

      CALLA:
        operation: "Push {C, Z, PC} to the hub long at PTRA++, not onto the hardware stack"
        syntax: "CALLA #address"
        return: "Via RETA"

      CALLB:
        operation: "Push {C, Z, PC} to the hub long at PTRB++, not onto the hardware stack"
        syntax: "CALLB #address"
        return: "Via RETB"
      
      CALLD:
        operation: "Save return in register"
        syntax: "CALLD return_reg, #address"
        return: "Via JMP return_reg"

stack_configurations:
  ascending_stack:
    growth: "Toward higher addresses"
    push: "Write then increment"
    pop: "Decrement then read"
    example: |
      ' Initialize ascending stack
      MOV PTRA, ##stack_base
      ' Push (PUSHA does this)
      WRLONG value, PTRA++
      ' Pop (POPA does this)
      RDLONG dest, --PTRA

  descending_stack:
    growth: "Toward lower addresses"
    push: "Decrement then write"
    pop: "Read then increment"
    note: "Not what PUSHA/POPA do; written out by hand with the pointer expressions."
    example: |
      ' Initialize descending stack
      MOV PTRA, ##stack_top
      ' Push
      WRLONG value, --PTRA
      ' Pop
      RDLONG dest, PTRA++

  circular_stack:
    description: "Stack with wrap-around"
    implementation: |
      ' After each operation
      AND PTRA, ##STACK_MASK  ' Wrap pointer

auto_increment_modes:
  post_increment:
    syntax: "PTR++"
    operation: "Use PTR, then PTR += scale"
    scale: "1/2/4 based on operation size"
    example: "RDLONG r0, PTRA++"

  pre_decrement:
    syntax: "--PTR"
    operation: "PTR -= scale, then use PTR"
    scale: "1/2/4 based on operation size"
    example: "WRLONG r0, --PTRB"

  indexed_post_modify:
    syntax: "PTR++[index]"
    operation: "Use PTR, then PTR += (index × scale)"
    example: "RDLONG r0, PTRA++[2]  ' PTRA += 8"

common_patterns:
  function_prologue:
    code: |
      function
        PUSHA old_ptra      ' Save registers
        PUSHA work_reg1
        PUSHA work_reg2
        ' Function body
    description: "Save context on entry"

  function_epilogue:
    code: |
        POPA work_reg2      ' Restore registers
        POPA work_reg1
        POPA old_ptra
        RET
    description: "Restore context and return"

  parameter_passing:
    code: |
      ' Caller
      PUSHA param3
      PUSHA param2
      PUSHA param1
      CALL #function
      SUB PTRA, #12       ' Clean up 3 parameters (PUSHA ascends)

      ' Callee (CALL does not touch PTRA; last push is at PTRA[-1])
      function
        RDLONG param1, PTRA[-1]  ' Access parameters
        RDLONG param2, PTRA[-2]
        RDLONG param3, PTRA[-3]
    description: "Stack-based parameters"

  local_variables:
    code: |
      function
        ADD PTRA, #16       ' Allocate 4 locals (ascending stack)
        ' Use PTRA[-4..-1] for locals
        ' Function body
        SUB PTRA, #16       ' Deallocate locals
        RET
    description: "Stack frame for locals"

  mixed_stacks:
    code: |
      ' PTRA for data stack
      ' PTRB for return stack
      ' Internal stack for leaf functions
      
      PUSHA data_value    ' Data on PTRA
      CALLB #subroutine   ' Return on PTRB
      CALL #leaf_function ' Return on internal
    description: "Multiple stack usage"

stack_operations_advanced:
  block_push:
    code: |
      SETQ #15
      WRLONG first_reg, PTRA++   ' Writes 16 longs, PTRA += 64
    description: "Push multiple registers"

  block_pop:
    code: |
      SUB PTRA, #64       ' Back up over the 16 longs
      SETQ #15
      RDLONG first_reg, PTRA
    description: "Pop multiple registers"

  stack_check:
    code: |
      CMP PTRA, ##stack_limit WC   ' ascending stack: limit is the top
      IF_NC JMP #stack_overflow    ' PTRA >= limit
    description: "Overflow detection"

  stack_trace:
    code: |
      ' Ascending stack on PTRA: walk base up to PTRA with PTRB
      ' (only PTRA/PTRB take ++; a plain register cannot)
      MOV PTRB, ##stack_base
      .trace
        RDLONG value, PTRB++
        ' Process stack entry
        CMP PTRB, PTRA WC
        IF_B JMP #.trace
    description: "Walk stack contents"

interrupt_considerations:
  context_save:
    - "Interrupts do not use the internal call stack: the return address, C and Z go to IRET1/IRET2/IRET3 (RETIx is CALLD with IRETx)"
    - "Must save/restore PTRA/PTRB if used"
    - "Consider stack depth limits"
    
  atomic_operations:
    - "PUSHA/POPA are atomic"
    - "Manual sequences may be interrupted"
    - "Use STALLI/ALLOWI for critical sections"

performance:
  operation_cycles:
    PUSHA: "3 clocks (range 3...10 cog / 3...20 hub-exec)"
    POPA: "9 clocks (range 9...16 cog / 9...26 hub-exec)"
    PUSHB: "3 clocks (range 3...10 cog / 3...20 hub-exec)"
    POPB: "9 clocks (range 9...16 cog / 9...26 hub-exec)"
    WRLONG_PTR: "3 clocks (range 3...10 cog / 3...20 hub-exec)"
    RDLONG_PTR: "9 clocks (range 9...16 cog / 9...26 hub-exec)"
    CALL: "4 clocks cog / 13-20 clocks hub-exec"
    RET: "4 clocks cog / 13-20 clocks hub-exec"
  source: "Per per-instruction YAMLs (pusha/popa/pushb/popb/wrlong/rdlong/call/ret)"

  optimization_tips:
    - "Use CALLA/CALLB when call depth exceeds the 8-level hardware stack (CALL itself costs 4 clocks, CALLA 5...12)"
    - "Batch pushes with SETQ"
    - "Keep stacks aligned"
    - "Monitor stack depth"

debugging:
  stack_problems:
    overflow: "Stack grows beyond allocated space"
    underflow: "Pop from empty stack (the hardware stack returns its bottom entry again)"
    corruption: "Incorrect push/pop balance"
    alignment: "Misaligned stack operations"

  diagnostic_tools:
    - "Add stack canaries"
    - "Track stack depth"
    - "Verify push/pop pairs"
    - "Check pointer bounds"

best_practices:
  - "Initialize stack pointers explicitly"
  - "Use consistent push/pop conventions"
  - "Document stack usage in functions"
  - "Reserve adequate stack space"
  - "Consider interrupt stack requirements"
  - "Use hardware stacks when possible"
  - "Implement overflow checking for critical systems"

