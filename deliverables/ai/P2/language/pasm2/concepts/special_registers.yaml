concept: special_registers
title: PASM2 Special Purpose Registers
category: core_architecture
description: Hardware registers with dedicated functions; some are ordinary register operands, others are reached through specific instructions

overview: |
  Special registers in PASM2 provide access to hardware state and control. Unlike general-purpose
  registers (cog RAM $000-$1EF), special registers have fixed hardware functions; some are reached only
  through specific instructions, and the cog-register ones ($1F0-$1F7 when their function is in use, and
  $1F8-$1FF) are also ordinary register operands. The full register map is in
  architecture/system-registers/complete-system-registers-index.yaml.

registers:
  program_counter:
    - name: PC
    - description: Program counter (20-bit)
    - access: Changed by jumps, calls and returns; a call saves the return address (CALL, CALLPA and CALLPB on the hardware stack, CALLD in its D register, CALLA in the hub long at PTRA++, CALLB in the hub long at PTRB++)
    - range: "$00000-$FFFFF: cog register RAM $00000-$001FF, lookup RAM $00200-$003FF, hub RAM $00400-$FFFFF (Parallax's documents also give $7FFFF as the top of the range)"
    - notes: Cogs use 20-bit addresses for program counters, an execution space of up to 1MB
    
  stack_pointers:
    - name: PTRA/PTRB
    - description: Hub pointer registers with auto-increment/decrement
    - access: "Direct as registers ($1F8/$1F9: MOV x, PTRA / MOV PTRA, ##addr) and as pointer expressions (PTRA++, PTRA[index])"
    - range: 32-bit register holding a hub RAM address (hub address space is 20 bits)
    - features:
      - Auto-increment/decrement modes (++, --)
      - Indexed addressing PTRx[index] (the index is scaled by the access size)
      - Stack operations (PUSHA/PUSHB, POPA/POPB)
    
  interrupt_vectors:
    - name: IJMP1/IJMP2/IJMP3 and IRET1/IRET2/IRET3
    - description: Interrupt call and return addresses for INT1, INT2 and INT3
    - access: Cog registers, RAM unless the interrupt function is in use (IJMP3 $1F0, IRET3 $1F1, IJMP2 $1F2, IRET2 $1F3, IJMP1 $1F4, IRET1 $1F5), written like any register, for example MOV IJMP1,#isr1; the interrupt event is then selected with SETINT1/SETINT2/SETINT3
    - usage: IJMPx holds the interrupt call address and IRETx the interrupt return address
    - debug: "During a debug ISR, INA ($1FE) and INB ($1FF) become the RAM registers IJMP0 and IRET0, the debug interrupt call and return addresses (BRK's L bit selects whether INA/INB map normally or as IJMP0/IRET0)"
    
  event_configuration:
    - name: Internal event state
    - description: Event detection and configuration
    - access: Via SETSE1..SETSE4 (select the selectable events), POLLxxx, WAITxxx, Jxxx/JNxxx
    - types: 16 unique event trackers that can be polled and waited upon

  q_register:
    - name: Q
    - description: "Q register (32-bit): an extra operand that SETQ and SETQ2 write for the instruction that follows them. Q is not where CORDIC results are held; GETQX and GETQY return the CORDIC solver's X and Y results, not Q."
    - written_by: "SETQ and SETQ2 write Q and are meant to precede a companion instruction. XORO32, RDLUT, GETXACC and CRCNIB also change Q, and COGINIT, QDIV, QFRAC and QROTATE set it to zero when no SETQ precedes them (see persistence)."
    - supplied_to:
      - "RDLONG/WRLONG/WMLONG: the number of longs to transfer, minus 1 (SETQ transfers to or from cog register RAM, SETQ2 to or from lookup RAM)"
      - "COGINIT: the value written to the started cog's PTRA"
      - "QDIV: the upper 32 bits of the numerator; QFRAC: the lower 32 bits of the numerator; QROTATE: the Y coordinate"
      - "MUXQ: the bit mask"
      - "WAITxxx: a CT target that ends the wait early"
      - "XINIT/XZERO/XCONT: a new NCO frequency"
      - "CRCNIB: Q[31:28] are the four bits it iterates over"
    - span_override: "A prior SETQ replaces the span field of the span instructions. BITL, BITH, BITC, BITNC, BITZ, BITNZ, BITRND and BITNOT work on a span of bits, S[9:5] more than the first bit, and SETQ overrides S[9:5]. DIRx, OUTx, FLTx and DRVx work on a span of pins, D[10:6] more than the first pin, and SETQ overrides D[10:6]. WRPIN, WXPIN, WYPIN and AKPIN work on a span of pins, S[10:6] more than the first pin, and SETQ overrides S[10:6]."
    - persistence:
      - "The value written by SETQ/SETQ2 persists until one of these events occurs:"
      - "XORO32 executes: Q is set to the XORO32 result"
      - "RDLUT executes: Q is set to the data read from lookup RAM"
      - "GETXACC executes: Q is set to the Goertzel sine accumulator value"
      - "CRCNIB executes: Q is shifted left by four bits"
      - "COGINIT, QDIV, QFRAC or QROTATE executes without a preceding SETQ: Q is set to zero"
    - across_bytecodes: "A _RET_ SETQ2 at the end of an XBYTE routine leaves Q for the next bytecode's routine: a MUXQ as that routine's first instruction reads the SETQ2 value, in cog execution."
    - interruption: "SETQ and SETQ2 shield the next instruction from interruption, so an interrupt service routine cannot alter Q before the intended instruction uses it. CRCNIB both takes Q as input and outputs Q, so a SETQ followed by CRCNIB instructions must not be disrupted: protect the sequence from interrupts with STALLI/ALLOWI or put it in a REP block, which is shielded from interrupts, including non-stallable debug interrupts."
    - read_back: "Q can be read with a MUXQ into a zeroed register: MOV qval,#0 then MUXQ qval,##$FFFFFFFF. Each 1 bit in Q sets the same bit in qval."

  random_generator:
    - name: RANDOM
    - description: Pseudo-random number generator
    - access: Via GETRND instruction
    - features: xoroshiro128** pseudo-random generator, true-random seeded at start-up, updated every clock

  ct_registers:
    - name: CT (Current Time)
    - description: System counter access
    - access: Via GETCT, ADDCT1/2/3, WAITCT1/2/3
    - resolution: System clock cycles
    - width: 64-bit free-running; GETCT returns lower 32 bits by default, upper 32 bits with WC

  flags:
    - name: C and Z
    - description: Carry and Zero flags
    - access: Set by instructions with WC/WZ/WCZ, tested by conditionals
    - persistence: "An instruction writes C and Z only when its effect writes them (WC, WZ or WCZ); when the effect is omitted the flags remain as-is. Two writes come from outside an instruction's effect: XBYTE, when the %F bit of its SETQ/SETQ2 configuration is set, writes C and Z with bits 1 and 0 of the bytecode's index field; and a COGINIT that loads a cog from hub starts it with C and Z at 0, whatever they held before"

access_patterns:
  explicit_access:
    - method: Dedicated instructions
    - examples:
      - "GETCT r0       ' Read system counter"
      - "GETRND r0      ' Get a pseudo-random number"
      - "GETQX  r0      ' Get CORDIC X result"
      - "GETPTR r0      ' Read the current FIFO hub pointer"
      - "MOV r0, PTRA   ' Read PTRA"

  implicit_access:
    - method: Automatic hardware use
    - examples:
      - PC increments after each instruction
      - PTRA/PTRB auto-modify in indexed operations
      - Flags update when WC/WZ specified
      - "SETQ writes Q for the companion instruction that follows (block transfer, CORDIC command, MUXQ mask, COGINIT PTRA value); CORDIC results come from GETQX/GETQY, not from Q (QDIV: quotient in X, remainder in Y)"

  block_operations:
    - method: SETQ/SETQ2 + instruction
    - examples:
      - "SETQ #15       ' Setup for 16 long transfer"
      - "RDLONG 0, PTRA ' Read 16 longs from hub"

critical_behaviors:
  - The PC is 20 bits (an execution space of up to 1MB)
  - "A PTRx expression is evaluated against the current value of PTRx: PTRx[index] uses PTRx + index*SCALE"
  - An event-occurred flag is cleared by its own POLLxxx, WAITxxx and Jxxx/JNxxx instructions, unless the event sensor sets it again; most flags are also cleared by another event (cog start, ADDCT1-3, SETPAT, RDFAST/WRFAST/FBLOCK, XINIT/XZERO/XCONT, SETSE1-4), listed per event in architecture/event_system.yaml
  - Q keeps the value SETQ/SETQ2 wrote until XORO32, RDLUT, GETXACC or CRCNIB changes it, or COGINIT, QDIV, QFRAC or QROTATE executes without a preceding SETQ and sets it to zero
  - Q can be read back (MOV qval,#0 then MUXQ qval,##$FFFFFFFF); GETQX/GETQY return CORDIC results, not Q
  - CORDIC commands can be overlapped; read each result with GETQX/GETQY
  - The Xoroshiro128** PRNG iterates on every clock

common_patterns:
  stack_operation:
    - pattern: "PUSHA value / POPA value"
    - description: A hub-RAM stack addressed by PTRA (PUSHA writes a long at PTRA++, POPA reads a long at --PTRA); distinct from the 8-level hardware stack used by CALL/RET
    
  cordic_operation:
    - pattern: "QROTATE / GETQX result / GETQY result"  
    - description: CORDIC calculation and result retrieval
    
  timed_wait:
    - pattern: "GETCT target / ADDCT1 target, ##delay / WAITCT1"
    - description: Wait for a future CT value (the CT1 target set with ADDCT1)

