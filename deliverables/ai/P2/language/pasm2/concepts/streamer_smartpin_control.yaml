concept: streamer_smartpin_control
title: Streamer and Smart Pin Control
category: peripheral_control
description: Hardware streaming engine and autonomous Smart Pin configuration for high-speed I/O
documentation_level: comprehensive

overview: |
  The P2 includes a hardware streamer for high-bandwidth data movement and 64 Smart Pins capable of
  autonomous operation. The streamer handles DMA-like transfers between hub memory and pins, while
  Smart Pins implement various protocols and timing functions independently of the cog.

streamer_system:
  streamer_engine:
    purpose: "High-speed data transfer hub↔pins"
    bandwidth: "System clock rate"
    modes:
      - "Hub to pins (output)"
      - "Pins to hub (input)"
      - "LUT to pins (the streamer indexes lookup RAM)"
      - "NCO frequency generation"
    
  streamer_commands:
    XINIT:
      syntax: "XINIT mode, count"
      operation: "Initialize and start streamer"
      parameters:
        mode: "32-bit mode configuration"
        count: "Transfer count"
      critical_timing: |
        ' The flash loader enables the clock smart pin during setup,
        ' then later starts the streamer
        drvl    #spi_ck           ' enable smart pin (clock) first
        xinit   rmode, pa         ' then start streamer outputting bits
      source: "Parallax SPI Flash Programmer and Boot Loader v51, Programmer, Get ready to program flash (drvl #spi_ck) and Program flash (.page: xinit rmode,pa)"
    
    XSTOP:
      syntax: "XSTOP"
      operation: "Stop streamer immediately"
      use: "Abort streaming operation"
    
    XCONT:
      syntax: "XCONT mode, count"
      operation: "Continue streaming with new parameters"
      use: "Chain streaming operations"
    
    XZERO:
      syntax: "XZERO {#}D,{#}S"
      operation: "Buffer a new streamer command to be issued on the final NCO rollover of the current command, zeroing the NCO phase accumulator."
      use: "Video line timing reset, phase alignment (e.g. start of a new line/audio block)"
      note: "Does NOT stream zeros. Unlike XCONT (which continues phase), XZERO resets the NCO phase. See language/pasm2/xzero.yaml."

  streamer_modes:
    immediate_modes:
      1_bit_output: "%0000_0000"
      2_bit_output: "%0000_0001"
      4_bit_output: "%0000_0010"
      8_bit_output: "%0000_0011"
      16_bit_output: "%0000_0100"
      32_bit_output: "%0000_0101"
      
    lut_modes:
      1_bit_lut: "%0001_0000"
      2_bit_lut: "%0001_0001"
      4_bit_lut: "%0001_0010"
      8_bit_lut: "%0001_0011"
      
    rfbyte_modes:
      rfbyte_fetch: "%0010_xxxx"
      description: "Stream from FIFO"

smart_pin_system:
  configuration:
    WRPIN:
      syntax: "WRPIN config, #pin"
      operation: "Configure Smart Pin mode and parameters"
      config_bits:
        format: "%AAAA_BBBB_FFF_MMMMMMMMMMMMM_TT_SSSSS_0"
        31_28_AAAA: "A input selector (4 bits)"
        27_24_BBBB: "B input selector (4 bits)"
        23_21_FFF: "Input logic/filtering (3 bits)"
        20_8_M: "Low-level pin control - drive strength, DAC, ADC (13 bits)"
        7_6_TT: "Pin DIR/OUT control (P_TT_00=$00, P_OE=$40, P_TT_10=$80, P_TT_11=$C0)"
        5_1_SSSSS: "Smart pin mode selector (5 bits, 32 modes)"
        0: "Always 0"
      example: |
        WRPIN ##P_ASYNC_TX | P_OE, #tx_pin  ' Async serial, output enabled
    
    WXPIN:
      syntax: "WXPIN value, #pin"
      operation: "Write X parameter to Smart Pin"
      use: "Set baud rate, period, clock source, etc."
      spi_clock_example: |
        ' For SPI clock generation
        wxpin   #1, #spi_ck       ' set timebase to 1 clock per transition
      source: "Parallax SPI Flash Programmer and Boot Loader v51, Programmer, Get ready to program flash"
    
    WYPIN:
      syntax: "WYPIN value, #pin"
      operation: "Write Y parameter to Smart Pin"
      use: "Send data, set count, trigger operations"
      multiple_uses: |
        ' Y register serves different purposes:
        wypin   #0, drive_pins           ' PWM: force outputs off
        wypin   drive_u_, pin_pwm_u_l    ' PWM: set duty on a driven pin
        wypin   #0, adc_pins             ' ADC: start/acknowledge sampling
      source: "OBEX 2874 (ISP BLDC Motor Control), isp_bldc_motor.spin2 (example code, not a Parallax document)"
    
    DIRH:
      syntax: "DIRH #pin"
      operation: "Enable Smart Pin (set DIR high)"
      effect: "Smart Pin starts operating"
    
    DIRL:
      syntax: "DIRL #pin"
      operation: "Disable Smart Pin (set DIR low)"
      effect: "Smart Pin stops, resets"

  status_operations:
    RDPIN:
      syntax: "RDPIN result, #pin {WC}"
      operation: "Read Smart Pin result"
      flags: "WC sets C if new data available"
      example: |
        RDPIN data, #rx_pin WC
        IF_C CALL #process_received_byte
    
    RQPIN:
      syntax: "RQPIN result, #pin {WC}"
      operation: "Read Smart Pin result without clearing"
      use: "Peek at data without acknowledging"
    
    AKPIN:
      syntax: "AKPIN #pin"
      operation: "Acknowledge Smart Pin"
      effect: "Clear IN flag, ready for next"
    
    TESTP:
      syntax: "TESTP #pin {WC/WZ}"
      operation: "Test pin state"
      flags: "C = pin state, Z = !pin state"
      hall_sensor_example: |
        ' Build Hall sensor state for motor control
        testp   pin_hall_w      wc  ' read hall effect sensor
        rcl     hall_, #1
        testp   pin_hall_v      wc
        rcl     hall_, #1
        testp   pin_hall_u      wc
        rcl     hall_, #1
        ' hall_ = 3-bit Hall pattern
      source: "OBEX 2874 (ISP BLDC Motor Control), isp_bldc_motor.spin2 (example code, not a Parallax document)"

smart_pin_modes:
  serial_modes:
    async_tx:
      mode: "P_ASYNC_TX"
      x_param: "Baud rate timing"
      y_param: "Character to send"
      example: |
        WRPIN ##P_ASYNC_TX | P_OE, #pin
        WXPIN baud_timing, #pin
        DIRH #pin
        WYPIN char, #pin
    
    async_rx:
      mode: "P_ASYNC_RX"
      x_param: "Baud rate timing"
      result: "Received character"
      example: |
        WRPIN ##P_ASYNC_RX, #pin
        WXPIN baud_timing, #pin
        DIRH #pin
        .wait
          TESTP #pin WC
          IF_NC JMP #.wait
        RDPIN char, #pin
    
    spi_modes:
      transition_clock:
        mode: "P_TRANSITION"
        description: "Generate continuous SPI clock"
        code: |
          wrpin   #%01_00101_0, #spi_ck   ' transition output, starts out low
          wxpin   #1, #spi_ck             ' timebase = 1 clock per transition
          drvl    #spi_ck                 ' enable smart pin
        source: "Parallax SPI Flash Programmer and Boot Loader v51, Programmer, Get ready to program flash"
      
      sync_tx:
        mode: "P_SYNC_TX"
        description: "SPI MOSI transmission"
        x_param: "Clock pin<<24 | bit_count"
        y_param: "Data to transmit"
        
      sync_rx:
        mode: "P_SYNC_RX"
        description: "SPI MISO reception"
        x_param: "Clock pin<<24 | bit_count"
        result: "Received data"

  pulse_modes:
    pulse_output:
      mode: "P_PULSE"
      x_param: "Base period"
      y_param: "Pulse count"
      
    pwm_output:
      mode: "P_PWM_TRIANGLE"
      x_param: "Frame period"
      y_param: "Duty cycle"
      
    pwm_sawtooth:
      mode: "P_PWM_SAWTOOTH"
      description: "PWM for motor control (one output pin per Smart Pin)"
      complementary_note: >-
        A complementary half-bridge pair (high + low side) is NOT one Smart Pin:
        the P2 has no single-pin dead-band mode (none of the smart pin modes is
        a dead-band mode).
        Use TWO Smart Pins -- one per side, low side inverted (P_INVERT_OUTPUT),
        enabled together -- and insert dead-time in software. Full pattern in
        architecture/smart_pin_patterns.yaml (motor_pwm_with_deadtime).
      dead_time_critical: |
        ' Dead-time (shoot-through prevention) is a TWO-PIN, software technique:
        ' offset the high- and low-side duty so their active intervals never overlap.
        add     drive_u_, dead_gap_             ' low side turns off (inverted) earlier
        if_nc   wypin   drive_u_, pin_pwm_u_l
        sub     drive_u_, dead_gap_             ' high side turns on later
        if_nc   wypin   drive_u_, pin_pwm_u_h
      source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PIN MODES (the list of smart pin modes); OBEX 2874 (ISP BLDC Motor Control), isp_bldc_motor.spin2 (example code, not a Parallax document)"
      
    nco_frequency:
      mode: "P_NCO_FREQ"
      x_param: "Frequency value"
      y_param: "Enable/disable"

  measurement_modes:
    count_edges:
      mode: "P_COUNT_RISES"
      x_param: "Measurement period"
      result: "Edge count"
      
    measure_period:
      mode: "P_PERIODS_TICKS"
      x_param: "Number of periods"
      result: "Total ticks"
      
    time_states:
      mode: "P_HIGH_TICKS"
      x_param: "Measurement window"
      result: "High time in ticks"
    
    quadrature_decoder:
      mode: "P_QUADRATURE"
      description: "Hardware quadrature decoder"
      code: |
        wrpin   ##P_QUADRATURE, encoder_pin_a
        wxpin   #0, encoder_pin_a
        dirh    encoder_pin_a
        rdpin   position, encoder_pin_a  ' Get count
        wypin   #0, encoder_pin_a        ' Reset count
  
  adc_modes:
    calibrated_adc:
      mode: "P_ADC_1X"
      calibration_sequence: |
        ' CRITICAL: Calibrate ADC for accuracy
        wrpin   adc_modes+0, adc_pins   ' switch ADC to GIO calibration
        wxpin   adc_fram, adc_pins      ' set count period to match PWM frame width
        wypin   #0, adc_pins
        dirh    adc_pins                ' enable ADC pins to use adc
        ' ... wait for sample ready ...
        rdpin   gio_levels+0, pin_adc_u_i

        dirl    adc_pins                ' disable ADC pins for configuration
        wrpin   adc_modes+1, adc_pins   ' switch ADC to VIO calibration
        dirh    adc_pins
        ' ... wait for sample ready ...
        rdpin   vio_levels+0, pin_adc_u_i

        ' Calculate scale factor
        sub     vio_levels+0, gio_levels+0
      source: "OBEX 2874 (ISP BLDC Motor Control), isp_bldc_motor.spin2 (example code, not a Parallax document)"
  
  repository_mode:
    data_mailbox:
      mode: "P_REPOSITORY"
      description: "Inter-COG data sharing"
      code: |
        ' COG A writes
        wrpin   ##P_REPOSITORY, repo_pin
        dirh    repo_pin
        wypin   data_value, repo_pin
        
        ' COG B reads
        rdpin   received, repo_pin

common_patterns:
  spi_flash_access:
    description: "SPI flash read with streamer (single clock smart pin; data moves through the streamer, not per-line smart pins)"
    code: |
      ' Set up the clock smart pin
      wrpin   #%01_00101_0, #spi_ck    ' transition output, starts out low
      wxpin   #1, #spi_ck              ' timebase = 1 clock per transition
      drvl    #spi_ck                  ' enable smart pin

      ' Then start the clock and the streamer to move the actual data
      wypin   x, #spi_ck               ' start spi_ck transitions
      waitx   #3                       ' align spi_ck transitions with sampling
      xinit   wmode, #0                ' start inputting bits to hub via streamer
    source: "Parallax SPI Flash Programmer and Boot Loader v51, Loader, Read in remaining application longs (the smart-pin setup and the .block loop)"

  motor_control_pwm:
    description: "3-phase motor control PWM with dead-time (Smart Pin per side, high side true / low side inverted)"
    code: |
      ' Setup PWM pins with dead-time (per phase; shown for phase U)
      wrpin   pwmn, pin_pwm_u_l         ' low side is inverted
      wrpin   pwmt, pin_pwm_u_h         ' high side is not inverted
      wxpin   fram, drive_pins          ' set PWM frame width

      ' Update with commutation pattern (dead-gap offsets applied)
      add     drive_u_, dead_gap_       ' low side turns off earlier
      wypin   drive_u_, pin_pwm_u_l
      sub     drive_u_, dead_gap_       ' high side turns on later
      wypin   drive_u_, pin_pwm_u_h
    source: "OBEX 2874 (ISP BLDC Motor Control), isp_bldc_motor.spin2 (example code, not a Parallax document)"

coordination:
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), STREAMER (SETXFRQ: the NCO frequency is a multiplier of $8000_0000; XINIT/XZERO/XCONT commands); SMART PIN MODES (%00101 transition output, WXPIN timebase); setup_order: Parallax SPI Flash Programmer and Boot Loader v51, Programmer, Get ready to program flash, and Loader, Read in remaining application longs"
  streamer_smartpin:
    setup_order: "The flash loader configures and enables its spi_ck smart pin (WRPIN, WXPIN, DRVL) during setup, before any XINIT starts the streamer"
    pin_output_hierarchy: |
      Streamer P[31:0] feeds through OUTA/OUTB (the OUT bit path).
      Smart pin with TT=%x1 (P_OE) overrides OUT entirely via SMART output.
      Result: streamer and smart pin CANNOT share output on the same pin.
      Use them on different pins - e.g., smart pins for SPI protocol pins,
      streamer for hub FIFO data transfer on separate pin groups.
    see_also: "architecture/smart_pins.yaml pin_output_hierarchy section"

  bit_edge_lockstep:
    rule: |
      When pairing a P_TRANSITION smart pin (clock) with a streamer
      (data) for SPI-style synchronous I/O, the bit rate and edge rate
      must satisfy:
        sysclks_per_streamer_bit = $8000_0000 / SETXFRQ_value
        sysclks_per_SCK_edge     = WXPIN_value
      For lockstep at sysclk/2 SPI:
        SETXFRQ = $4000_0000 (= 1 bit per 2 sysclks)
        WXPIN   = 1          (= 1 sysclk between SCK edges)
        → 1 streamer bit = 2 sysclks = 1 full SCK cycle (2 edges). Lockstep.
      The flash loader uses this one setting (clk/2 NCO value and a
      timebase of 1 clock per transition); no source gives the pairing for
      any other SCK rate.
    worked_examples: |
      ' sysclk/2 SPI (the flash loader's setting)
      setxfrq ##$4000_0000     ' streamer: 1 bit per 2 sysclks
      wxpin   #1, #SCK_PIN     ' smart pin: 1 sysclk between SCK edges
    source: "Parallax SPI Flash Programmer and Boot Loader v51, Programmer, Get ready to program flash (WXPIN #1 'set timebase to 1 clock per transition'; SETXFRQ 'set streamer rate to clk/2'), Loader, Read in remaining application longs, and Loader Data (clk2 = $4000_0000 'clk/2 nco value for streamer'); NCO and timebase definitions: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), STREAMER and SMART PIN MODES"

  alignment_pad:
    rule: |
      When the streamer SAMPLES an input pin (e.g., MISO/spi_do) that is
      driven by a remote device clocked by our P_TRANSITION smart pin,
      the flash loader puts a 3-clock WAITX between starting the SCK
      transitions (WYPIN) and starting the streamer (XINIT), to "align
      spi_ck transitions with spi_do sampling".
    code: |
      wypin   bit_count_doubled, #SCK_PIN  ' start SCK transitions
      waitx   #3                           ' pipeline alignment pad
      xinit   input_streamer_mode, #0      ' streamer begins sampling
      waitxfi
    rate_dependence: |
      The flash loader uses the 3-clock pad at one rate only, the SCK
      timebase and streamer NCO in bit_edge_lockstep above: a WXPIN of 1
      with an NCO value of $4000_0000. No source gives the pad for any
      other timebase or NCO setting.
    write_side: |
      The WRITE direction (streamer driving a P_SYNC_TX MOSI against a
      P_TRANSITION SCK) has its own pad, and its failure is silent. SCK starts on
      the next base-period boundary after WYPIN while the streamer start moves
      continuously, so only hp distinct phases exist (hp = SCK half-period in
      sysclks) and EXACTLY ONE of them loses: at that pad, whole sectors are
      written corrupt with no error or status bit. A pad safe at one hp can be
      the losing one at another (a pad safe at hp = 7 lost at hp = 5, which a
      201-250 MHz sysclk reaches at an ordinary 25 MHz SPI clock). Verify the
      write pad at every SCK rate you use; it is not portable across rates.
    source: "Parallax SPI Flash Programmer and Boot Loader v51, Loader, Read in remaining application longs (.block: waitx #3 'align spi_ck transitions with spi_do sampling'); write_side: hardware-verified on P2 silicon (XF-001)"

