concept: streamer_smartpin_control
title: Streamer and Smart Pin Control
category: peripheral_control
description: Hardware streaming engine and autonomous Smart Pin configuration for high-speed I/O
documentation_source: enhanced
documentation_level: comprehensive

overview: |
  The P2 includes a hardware streamer for high-bandwidth data movement and 64 Smart Pins capable of
  autonomous operation. The streamer handles DMA-like transfers between hub memory and pins, while
  Smart Pins implement various protocols and timing functions independently of the cog.
  
  CRITICAL: Proper initialization order is essential for reliable operation.

streamer_system:
  streamer_engine:
    purpose: "High-speed data transfer hub↔pins"
    bandwidth: "System clock rate"
    modes:
      - "Hub to pins (output)"
      - "Pins to hub (input)"
      - "LUT to pins (via colorspace)"
      - "NCO frequency generation"
    
  streamer_commands:
    XINIT:
      syntax: "XINIT mode, count"
      operation: "Initialize and start streamer"
      parameters:
        mode: "32-bit mode configuration"
        count: "Transfer count"
      critical_timing: |
        ' CRITICAL: Start Smart Pins BEFORE XINIT!
        dirh    #SPI_CLK_PIN      ' Start clock first
        dirh    #SPI_MOSI_PIN     ' Then MOSI
        dirh    #SPI_MISO_PIN     ' Then MISO
        xinit   xfer_config, #0   ' Finally start streamer
        ' This order prevents data corruption
      source: flash_loader.spin2
    
    XSTOP:
      syntax: "XSTOP"
      operation: "Stop streamer immediately"
      use: "Abort streaming operation"
    
    XCONT:
      syntax: "XCONT mode, count"
      operation: "Continue streaming with new parameters"
      use: "Chain streaming operations"
    
    XZERO:
      syntax: "XZERO {#}D,{#}S"
      operation: "Buffer a new streamer command to be issued on the final NCO rollover of the current command, zeroing the NCO phase accumulator."
      use: "Video line timing reset, phase alignment (e.g. start of a new line/audio block)"
      note: "Does NOT stream zeros. Unlike XCONT (which continues phase), XZERO resets the NCO phase. See language/pasm2/xzero.yaml."

  streamer_modes:
    immediate_modes:
      1_bit_output: "%0000_0000"
      2_bit_output: "%0000_0001"
      4_bit_output: "%0000_0010"
      8_bit_output: "%0000_0011"
      16_bit_output: "%0000_0100"
      32_bit_output: "%0000_0101"
      
    lut_modes:
      1_bit_lut: "%0001_0000"
      2_bit_lut: "%0001_0001"
      4_bit_lut: "%0001_0010"
      8_bit_lut: "%0001_0011"
      
    rfbyte_modes:
      rfbyte_fetch: "%0010_xxxx"
      description: "Stream from FIFO"

smart_pin_system:
  configuration:
    WRPIN:
      syntax: "WRPIN config, #pin"
      operation: "Configure Smart Pin mode and parameters"
      config_bits:
        format: "%AAAA_BBBB_FFF_MMMMMMMMMMMMM_TT_SSSSS_0"
        31_28_AAAA: "A input selector (4 bits)"
        27_24_BBBB: "B input selector (4 bits)"
        23_21_FFF: "Input logic/filtering (3 bits)"
        20_8_M: "Low-level pin control - drive strength, DAC, ADC (13 bits)"
        7_6_TT: "Pin DIR/OUT control (P_TT_00=$00, P_OE=$40, P_TT_10=$80, P_TT_11=$C0)"
        5_1_SSSSS: "Smart pin mode selector (5 bits, 32 modes)"
        0: "Always 0"
      example: |
        WRPIN ##P_ASYNC_TX | P_OE, #tx_pin  ' Async serial, output enabled
    
    WXPIN:
      syntax: "WXPIN value, #pin"
      operation: "Write X parameter to Smart Pin"
      use: "Set baud rate, period, clock source, etc."
      spi_clock_example: |
        ' For SPI clock generation
        wxpin   #1, #SPI_CLK_PIN  ' Timebase = sysclk/2
      source: flash_loader.spin2
    
    WYPIN:
      syntax: "WYPIN value, #pin"
      operation: "Write Y parameter to Smart Pin"
      use: "Send data, set count, trigger operations"
      multiple_uses: |
        ' Y register serves different purposes:
        wypin   pwm_period, pwm_pin      ' PWM: Set base period
        wypin   data_byte, spi_pin       ' SPI: Transmit data
        wypin   #1, adc_pin              ' ADC: Trigger conversion
        wypin   #0, any_pin              ' Universal: Acknowledge
      source: isp_bldc_motor.spin2
    
    DIRH:
      syntax: "DIRH #pin"
      operation: "Enable Smart Pin (set DIR high)"
      effect: "Smart Pin starts operating"
    
    DIRL:
      syntax: "DIRL #pin"
      operation: "Disable Smart Pin (set DIR low)"
      effect: "Smart Pin stops, resets"

  status_operations:
    RDPIN:
      syntax: "RDPIN result, #pin {WC}"
      operation: "Read Smart Pin result"
      flags: "WC sets C if new data available"
      example: |
        RDPIN data, #rx_pin WC
        IF_C process_received_byte
    
    RQPIN:
      syntax: "RQPIN result, #pin {WC}"
      operation: "Read Smart Pin result without clearing"
      use: "Peek at data without acknowledging"
    
    AKPIN:
      syntax: "AKPIN #pin"
      operation: "Acknowledge Smart Pin"
      effect: "Clear IN flag, ready for next"
    
    TESTP:
      syntax: "TESTP #pin {WC/WZ}"
      operation: "Test pin state"
      flags: "C = pin state, Z = !pin state"
      hall_sensor_example: |
        ' Build Hall sensor state for motor control
        mov     hall_state, #0
        testp   #HALL_A_PIN    wc
        rcl     hall_state, #1
        testp   #HALL_B_PIN    wc
        rcl     hall_state, #1
        testp   #HALL_C_PIN    wc
        rcl     hall_state, #1
        ' hall_state = 3-bit Hall pattern
      source: isp_bldc_motor.spin2

smart_pin_modes:
  serial_modes:
    async_tx:
      mode: "P_ASYNC_TX"
      x_param: "Baud rate timing"
      y_param: "Character to send"
      example: |
        WRPIN ##P_ASYNC_TX | P_OE, #pin
        WXPIN baud_timing, #pin
        DIRH #pin
        WYPIN char, #pin
    
    async_rx:
      mode: "P_ASYNC_RX"
      x_param: "Baud rate timing"
      result: "Received character"
      example: |
        WRPIN ##P_ASYNC_RX, #pin
        WXPIN baud_timing, #pin
        DIRH #pin
        .wait
          TESTP #pin WC
          IF_NC JMP #.wait
        RDPIN char, #pin
    
    spi_modes:
      transition_clock:
        mode: "P_TRANSITION"
        description: "Generate continuous SPI clock"
        code: |
          wrpin   ##P_TRANSITION | P_OE, #SPI_CLK_PIN
          wxpin   #1, #SPI_CLK_PIN        ' sysclk/2
          wypin   #0, #SPI_CLK_PIN        ' Start transitions
          dirh    #SPI_CLK_PIN
        source: flash_loader.spin2
      
      sync_tx:
        mode: "P_SYNC_TX"
        description: "SPI MOSI transmission"
        x_param: "Clock pin<<24 | bit_count"
        y_param: "Data to transmit"
        
      sync_rx:
        mode: "P_SYNC_RX"
        description: "SPI MISO reception"
        x_param: "Clock pin<<24 | bit_count"
        result: "Received data"

  pulse_modes:
    pulse_output:
      mode: "P_PULSE"
      x_param: "Base period"
      y_param: "Pulse count"
      
    pwm_output:
      mode: "P_PWM_TRIANGLE"
      x_param: "Frame period"
      y_param: "Duty cycle"
      
    pwm_sawtooth:
      mode: "P_PWM_SAWTOOTH"
      description: "PWM for motor control (one output pin per Smart Pin)"
      complementary_note: >-
        A complementary half-bridge pair (high + low side) is NOT one Smart Pin:
        the P2 has no single-pin dead-band mode (confirmed by Chip Gracey, 2026-07-16).
        Use TWO Smart Pins -- one per side, low side inverted (P_INVERT_OUTPUT),
        enabled together -- and insert dead-time in software. Full pattern in
        architecture/smart_pin_patterns.yaml (motor_pwm_with_deadtime).
      dead_time_critical: |
        ' Dead-time (shoot-through prevention) is a TWO-PIN, software technique:
        ' offset the high- and low-side duty so their active intervals never overlap.
        sub     high_duty, dead_time    ' high side switches on later
        add     low_duty,  dead_time    ' low side switches off earlier
      source: isp_bldc_motor.spin2
      
    nco_frequency:
      mode: "P_NCO_FREQ"
      x_param: "Frequency value"
      y_param: "Enable/disable"

  measurement_modes:
    count_edges:
      mode: "P_COUNT_RISES"
      x_param: "Measurement period"
      result: "Edge count"
      
    measure_period:
      mode: "P_PERIODS_TICKS"
      x_param: "Number of periods"
      result: "Total ticks"
      
    time_states:
      mode: "P_HIGH_TICKS"
      x_param: "Measurement window"
      result: "High time in ticks"
    
    quadrature_decoder:
      mode: "P_QUADRATURE"
      description: "Hardware quadrature decoder"
      code: |
        wrpin   ##P_QUADRATURE, encoder_pin_a
        wxpin   #0, encoder_pin_a
        dirh    encoder_pin_a
        rdpin   position, encoder_pin_a  ' Get count
        wypin   #0, encoder_pin_a        ' Reset count
      source: motor_encoder
  
  adc_modes:
    calibrated_adc:
      mode: "P_ADC_1X"
      calibration_sequence: |
        ' CRITICAL: Calibrate ADC for accuracy
        wrpin   ##P_ADC_GIO, adc_pin    ' Ground cal
        wxpin   #%10_0111, adc_pin      ' 128 samples
        dirh    adc_pin
        waitx   ##2000
        rdpin   gnd_level, adc_pin
        
        wrpin   ##P_ADC_VIO, adc_pin    ' VIO cal
        wypin   #0, adc_pin
        waitx   ##2000
        rdpin   vio_level, adc_pin
        
        ' Calculate scale factor
        sub     vio_level, gnd_level
      source: isp_bldc_motor.spin2
  
  repository_mode:
    data_mailbox:
      mode: "P_REPOSITORY"
      description: "Inter-COG data sharing"
      code: |
        ' COG A writes
        wrpin   ##P_REPOSITORY, repo_pin
        dirh    repo_pin
        wypin   data_value, repo_pin
        
        ' COG B reads
        rdpin   received, repo_pin
      source: multi_cog_pattern

common_patterns:
  spi_flash_access:
    description: "Complete SPI flash read with streamer"
    code: |
      ' Setup pins (ORDER CRITICAL!)
      wrpin   spi_ck_mode, #SPI_CK
      wxpin   #1, #SPI_CK
      wypin   #0, #SPI_CK
      wrpin   spi_tx_mode, #SPI_TX
      wxpin   x_config, #SPI_TX
      wrpin   spi_rx_mode, #SPI_RX
      wxpin   x_config, #SPI_RX
      
      ' Start pins BEFORE streamer!
      dirh    #SPI_CK
      dirh    #SPI_TX
      dirh    #SPI_RX
      
      ' Now start streamer
      xinit   xfer_config, #0
    source: flash_loader.spin2
  
  motor_control_pwm:
    description: "3-phase motor control with dead-time"
    code: |
      ' Setup PWM pins with dead-time
      mov     pa, pwm_config
      or      pa, #P_OE
      wrpin   pa, #PWM_A_HIGH
      wrpin   pa, #PWM_A_LOW
      wrpin   pa, #PWM_B_HIGH
      wrpin   pa, #PWM_B_LOW
      wrpin   pa, #PWM_C_HIGH
      wrpin   pa, #PWM_C_LOW
      
      ' Set base period
      wxpin   pwm_period, #PWM_A_HIGH
      ' ... repeat for all pins ...
      
      ' Update with commutation pattern
      wxpin   phase_a_duty, #PWM_A_HIGH
      wypin   #1, #PWM_A_HIGH  ' Trigger update
    source: isp_bldc_motor.spin2

coordination:
  streamer_smartpin:
    critical_order: "Smart Pins MUST start (DIRH) before XINIT"
    reason: "Prevents data corruption and timing issues"
    verified_in: "flash_loader.spin2"
    pin_output_hierarchy: |
      Streamer P[31:0] feeds through OUTA/OUTB (the OUT bit path).
      Smart pin with TT=%x1 (P_OE) overrides OUT entirely via SMART output.
      Result: streamer and smart pin CANNOT share output on the same pin.
      Use them on different pins - e.g., smart pins for SPI protocol pins,
      streamer for hub FIFO data transfer on separate pin groups.
    see_also: "architecture/smart_pins.yaml pin_output_hierarchy section"

  bit_edge_lockstep:
    rule: |
      When pairing a P_TRANSITION smart pin (clock) with a streamer
      (data) for SPI-style synchronous I/O, the bit rate and edge rate
      must satisfy:
        bits_per_streamer_clk = 2^32 / SETXFRQ_value
        sysclks_per_SCK_edge  = WXPIN_value
      For lockstep at sysclk/2 SPI:
        SETXFRQ = $4000_0000 (= sysclk/2 bit rate)
        WXPIN   = 1          (= 1 sysclk between SCK edges)
        → 1 streamer bit = 2 sysclks = 1 full SCK cycle (2 edges). Lockstep.
      Halving the SCK rate (WXPIN = 2) MUST be matched by halving the
      streamer NCO (SETXFRQ = $2000_0000), or bits will be silently
      dropped or duplicated.
    worked_examples: |
      ' sysclk/2 SPI (max-rate single-bit SPI)
      setxfrq ##$4000_0000     ' streamer: 1 bit per 2 sysclks
      wxpin   #1, #SCK_PIN     ' smart pin: 1 sysclk between SCK edges

      ' sysclk/4 SPI (half-rate)
      setxfrq ##$2000_0000     ' streamer: 1 bit per 4 sysclks
      wxpin   #2, #SCK_PIN     ' smart pin: 2 sysclks between SCK edges
    authority: "GOLDEN — these specific values are what the production flash loader uses on every shipping P2; lockstep is silicon-validated"
    source: "Parallax P2 flash_loader.spin2 lines 100-107, 246"

  alignment_pad:
    rule: |
      When the streamer SAMPLES an input pin (e.g., MISO/spi_do) that is
      driven by a remote device clocked by our P_TRANSITION smart pin,
      a 3-clock WAITX between starting the SCK clock and starting the
      streamer aligns the streamer's first sample with the middle of
      the first valid bit on the input.
    code: |
      wypin   bit_count_doubled, #SCK_PIN  ' start SCK transitions
      waitx   #3                           ' pipeline alignment pad
      xinit   input_streamer_mode, #0      ' streamer begins sampling
      waitxfi
    timing_theory: |
      WYPIN takes 2 sysclks to take effect on the smart pin; XINIT also
      takes 2 sysclks to engage the streamer. A WAITX of 3 sysclks
      empirically pads the pipeline so the streamer's first read happens
      AFTER the flash has presented a fresh bit on the SCK edge.
    authority: |
      The PATTERN (waitx between wypin and xinit) is GOLDEN — production-
      validated by the flash loader on every shipping P2.
      The specific value of 3 is GOLDEN at the SCK/streamer rates in
      bit_edge_lockstep above; this value would change at different rates.
      The TIMING THEORY (why exactly 3) is INTERPRETIVE — our cycle-accounting
      explanation is plausible given that XINIT and WYPIN are both
      documented as 2-cycle instructions, but the empirical correctness of
      "3" is the load-bearing fact.
    rate_dependence: |
      The 3-clock pad is correct for the SCK rate and NCO setup in
      bit_edge_lockstep above. Different SCK rates may need different
      pad values — verify with a logic analyzer if you change either
      WXPIN or SETXFRQ.
    source: "Parallax P2 flash_loader.spin2 line 259"

