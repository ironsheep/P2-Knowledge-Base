concept: streamer_smartpin_control
title: Streamer and Smart Pin Control
aliases:
  - "SPI write corrupts sectors silently at some clock rates"
category: peripheral_control
description: Hardware streaming engine and autonomous Smart Pin configuration for high-speed I/O
documentation_level: comprehensive

overview: |
  Each cog has a streamer which can automatically output timed state sequences to pins and DACs,
  and capture pin and ADC readings to hub RAM. Each of the 64 I/O pins has a smart pin circuit
  which, when enabled, performs some autonomous function on the pin.

streamer_system:
  streamer_engine:
    purpose: "Output timed state sequences to pins and DACs; capture pin and ADC readings to hub RAM"
    timing: "An NCO times the streamer; SETXFRQ sets its rollover rate as a 0-to-1 multiplier of the system clock (architecture/streamer/nco-timing.yaml)"
    modes:
      - "Hub to pins (output)"
      - "Pins to hub (input)"
      - "LUT to pins (the streamer indexes lookup RAM)"
      - "DDS/Goertzel"
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), STREAMER (introduction, the NCO paragraph, the mode table group headings)"

  streamer_commands:
    XINIT:
      syntax: "XINIT {#}D,{#}S"
      operation: "Issue streamer command immediately, zeroing phase"
      parameters:
        D: "D[31:16] the streamer command (mode); D[15:0] the number of NCO rollovers the command is active for"
        S: "Data, a sub-mode, or ignored, depending on the mode in D"
      setup_order: |
        ' The flash loader enables the clock smart pin during setup,
        ' then later starts the streamer
        drvl    #spi_ck           ' enable smart pin (clock) first
        xinit   rmode, pa         ' then start streamer outputting bits
      source: "Parallax SPI Flash Programmer and Boot Loader v51, Programmer, Get ready to program flash (drvl #spi_ck) and Program flash (.page: xinit rmode,pa)"
    
    XSTOP:
      syntax: "XSTOP"
      operation: "Stop streamer immediately (alias for XINIT #0,#0)"

    XCONT:
      syntax: "XCONT {#}D,{#}S"
      operation: "Buffer new streamer command to be issued on final NCO rollover of current command, continuing phase"
      parameters: "D and S as for XINIT"
      use: "Seamless streamer I/O from command to command"

    XZERO:
      syntax: "XZERO {#}D,{#}S"
      operation: "Buffer a new streamer command to be issued on the final NCO rollover of the current command, zeroing the NCO phase accumulator."
      parameters: "D and S as for XINIT"
      use: "Initiating the horizontal sync pulse when pixels are output at an imperfect fraction of the clock, such as ~1/3 (language/pasm2/xzero.yaml)"
      note: "XCONT continues the NCO phase; XZERO resets it. See language/pasm2/xzero.yaml."
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), STREAMER (the five streamer instructions, the D/S operand sentences, the XINIT #0,#0 / XSTOP sentence, the XZERO/XCONT paragraphs)"

  streamer_modes:
    summary: >-
      The mode is D[31:16] of the XINIT/XZERO/XCONT command. D[31:28] groups the modes:
      %0000-%0011 Immediate → LUT → Pins/DACs; %0100-%0111 Immediate → Pins/DACs;
      %0111-%1011 the RDFAST modes (→ LUT, → Pins/DACs, → RGB); %1100-%1111
      Pins/ADCs → DACs/WRFAST, with DDS/Goertzel at %1111. Several groups share a
      nibble and are told apart by D[19:16].
    mode_table: architecture/streamer/modes-reference.yaml

smart_pin_system:
  configuration:
    WRPIN:
      syntax: "WRPIN config, #pin"
      operation: "Configure Smart Pin mode and parameters"
      config_bits:
        format: "%AAAA_BBBB_FFF_MMMMMMMMMMMMM_TT_SSSSS_0"
        31_28_AAAA: "A input selector (4 bits)"
        27_24_BBBB: "B input selector (4 bits)"
        23_21_FFF: "Input logic/filtering (3 bits)"
        20_8_M: "Low-level pin control - drive strength, DAC, ADC (13 bits)"
        7_6_TT: "Pin DIR/OUT control (P_TT_00=$00, P_OE=$40, P_TT_10=$80, P_TT_11=$C0)"
        5_1_SSSSS: "Smart pin mode selector (5 bits, 32 modes)"
        0: "Always 0"
      example: |
        WRPIN ##P_ASYNC_TX | P_OE, #tx_pin  ' Async serial, output enabled
      source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PINS (WRPIN D/# = %AAAA_BBBB_FFF_MMMMMMMMMMMMM_TT_SSSSS_0) and SMART PIN MODES (%SSSSS in D[5:1]); symbol values: Parallax Propeller 2 Spin2 Language Documentation v55, smart pin symbols (P_OE, P_TT_10, P_TT_11, P_ASYNC_TX)"

    WXPIN:
      syntax: "WXPIN value, #pin"
      operation: "Set smart pin parameter X, ack pin"
      use: "X is a mode-specific parameter (for example a base period or a measurement period)"
      spi_clock_example: |
        ' For SPI clock generation
        wxpin   #1, #spi_ck       ' set timebase to 1 clock per transition
      source: "Parallax SPI Flash Programmer and Boot Loader v51, Programmer, Get ready to program flash; operation: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PINS (the smart pin instruction list)"

    WYPIN:
      syntax: "WYPIN value, #pin"
      operation: "Set smart pin parameter Y, ack pin"
      use: "Y is a mode-specific parameter (for example the data to send, a pulse or transition count, or a PWM output value)"
      source: "The PWM Y statement and the operation: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PINS (instruction list) and SMART PIN MODES (%01000 PWM triangle, %01001 PWM sawtooth)"

    DIRH:
      syntax: "DIRH #pin"
      operation: "Release the smart pin from reset (DIR is its active-low reset)"
      effect: "The smart pin starts operating in the mode its last WRPIN configured"

    DIRL:
      syntax: "DIRL #pin"
      operation: "Hold the smart pin in reset (DIR low)"
      effect: "The smart pin keeps its WRPIN configuration; some mode-related state bits are reset while DIR is low"
    source: "DIRH, DIRL: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PINS (DIR as an active-low reset; the configuration kept and state bits reset while DIR is low)"

  status_operations:
    RDPIN:
      syntax: "RDPIN result, #pin {WC}"
      operation: "Get smart pin result Z into D, flag into C, ack pin"
      flags: "C is either a mode-related flag or the MSB of the Z result"
      example: |
        RDPIN data, #rx_pin WC      ' Z into data, the mode's flag or Z[31] into C

    RQPIN:
      syntax: "RQPIN result, #pin {WC}"
      operation: "Get smart pin result Z into D, flag into C, don't ack pin"
      use: "Any number of cogs can read a smart pin simultaneously, without bus conflict, by using RQPIN"

    AKPIN:
      syntax: "AKPIN #pin"
      operation: "Acknowledge smart pin"

    TESTP:
      syntax: "TESTP #pin {WC/WZ}"
      operation: "Read the pin's bit in INx and affect C or Z"
      flags: "WC: C = IN bit; WZ: Z = IN bit"
      source: "TESTP, RDPIN, RQPIN, AKPIN: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), I/O PIN TIMING (TESTP reads pin D bit in INx and affects C or Z) and SMART PINS (the smart pin instruction list, the RDPIN/RQPIN flag sentence, RQPIN 'read quiet')"

smart_pin_modes:
  serial_modes:
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PIN MODES (%11110 and %11111 asynchronous serial: X[31:16] clocks per bit period, X[15:10] fractional clocks when X[31:26] is zero, X[4:0] bits minus 1; the received word is read with RDPIN/RQPIN when IN is raised)"
    async_tx:
      mode: "P_ASYNC_TX"
      x_param: "X[31:16] clocks in a bit period (X[15:10] fractional clocks when X[31:26] is zero); X[4:0] number of bits minus 1"
      y_param: "Output word"
      example: |
        WRPIN ##P_ASYNC_TX | P_OE, #pin
        WXPIN baud_timing, #pin
        DIRH #pin
        WYPIN char, #pin
    
    async_rx:
      mode: "P_ASYNC_RX"
      x_param: "X[31:16] clocks in a bit period (X[15:10] fractional clocks when X[31:26] is zero); X[4:0] number of bits minus 1"
      result: "Received word, to be shifted right by 32 minus the word size"
      example: |
        WRPIN ##P_ASYNC_RX, #pin
        WXPIN baud_timing, #pin
        DIRH #pin
        .wait
          TESTP #pin WC
          IF_NC JMP #.wait
        RDPIN char, #pin
    
    spi_modes:
      transition_clock:
        mode: "P_TRANSITION"
        description: "The pin toggles for Y transitions, one per base period (here an SPI clock pin)"
        code: |
          wrpin   #%01_00101_0, #spi_ck   ' transition output, starts out low
          wxpin   #1, #spi_ck             ' timebase = 1 clock per transition
          drvl    #spi_ck                 ' enable smart pin
        source: "Parallax SPI Flash Programmer and Boot Loader v51, Programmer, Get ready to program flash"
      
      sync_tx:
        mode: "P_SYNC_TX"
        description: "Words of 1 to 32 bits shifted out on the pin, LSB first, each new bit output two internal clock cycles after a positive edge on the B input (the clock, selected by WRPIN's %BBBB)"
        x_param: "X[5] update mode (0 continuous, 1 start-stop); X[4:0] number of bits minus 1"
        y_param: "Output word (WYPIN loads a single-stage buffer)"

      sync_rx:
        mode: "P_SYNC_RX"
        description: "Words of 1 to 32 bits shifted in by sampling the A input around the positive edge of the B input (the clock)"
        x_param: "X[5] A-input sample position relative to the B edge; X[4:0] number of bits minus 1"
        result: "Received word, MSB-justified, read by RDPIN/RQPIN when IN is raised"

  pulse_modes:
    pulse_output:
      mode: "P_PULSE"
      x_param: "X[15:0] base period in clock cycles; X[31:16] the value the base period counter is compared to"
      y_param: "Number of pulses or cycles; writing a non-zero value starts them"

    pwm_output:
      mode: "P_PWM_TRIANGLE"
      x_param: "X[15:0] base period in clock cycles; X[31:16] PWM frame period in base periods"
      y_param: "Y[15:0] PWM output value, captured at each frame start, ranging from zero to the frame period"

    pwm_sawtooth:
      mode: "P_PWM_SAWTOOTH"
      description: "This mode overrides OUT to control the pin output state"
      x_param: "X[15:0] base period in clock cycles; X[31:16] PWM frame period in base periods"
      y_param: "Y[15:0] PWM output value, captured at each frame start, ranging from zero to the frame period"
      complementary_pair: "No smart pin mode is a complementary-output or dead-band PWM mode: the PWM output modes are %01000 triangle, %01001 sawtooth and %01010 switch-mode power supply. A complementary half-bridge pair is two smart pins, one per side, with the dead-time made in software (architecture/smart_pin_patterns.yaml motor_pwm_with_deadtime)"
      source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PIN MODES (the list of smart pin modes; %01000 PWM triangle, %01001 PWM sawtooth and %01010 PWM switch-mode power supply are the PWM modes, none a complementary-output or dead-band mode; %01000 PWM triangle and %01001 PWM sawtooth X and Y)"

    nco_frequency:
      mode: "P_NCO_FREQ"
      x_param: "X[15:0] base period in clock cycles; on WXPIN, X[31:16] is written to Z[31:16] to set the phase"
      y_param: "Added into Z at each base period; the pin output reflects Z[31]"
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PIN MODES (%00100 pulse/cycle output, %00110 NCO frequency, %01000 PWM triangle, %11100 and %11101 synchronous serial)"

  measurement_modes:
    count_edges:
      mode: "P_COUNT_RISES"
      x_param: "Measurement period in clock cycles (0: continuous, like a totalizer)"
      result: "Edge count"

    measure_period:
      mode: "P_PERIODS_TICKS"
      x_param: "X[31:0] establishes how many A-input rise/edge to B-input rise/edge periods are to be measured"
      result: "Total ticks"

    time_states:
      mode: "P_HIGH_TICKS"
      x_param: "Not documented: use of X in this mode"
      result: "Upon each high-to-low transition, the previous high duration in clock cycles (limited to $80000000)"

    quadrature_decoder:
      mode: "P_QUADRATURE"
      description: "A/B-input quadrature encoder"
      code: |
        wrpin   ##P_QUADRATURE, encoder_pin_a
        wxpin   #0, encoder_pin_a        ' period 0: continuous count
        dirh    encoder_pin_a
        rdpin   position, encoder_pin_a  ' Get count
        dirl    encoder_pin_a            ' pulse DIR low to zero the count
        dirh    encoder_pin_a
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PIN MODES (%01011 quadrature encoder: X period, zero for continuous, zeroed by pulsing DIR low; %01110 count A-input positive edges; %10001 time A-input high states; %10011 for X periods, count time); symbols: Parallax Propeller 2 Spin2 Language Documentation v55"

  adc_modes:
    adc_sample:
      mode: "P_ADC (%11000, ADC sample/filter/capture, internally clocked)"
      calibration: "The pin ADC is a delta-sigma ADC with 5 ranges, 2 sources, and VIO/GIO calibration."
      details: architecture/smart-pins/smart-pin-11000-adc-internal-clock.yaml
      source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), OVERVIEW (the I/O pin feature list) and SMART PIN MODES (%11000)"

  repository_mode:
    data_mailbox:
      mode: "P_REPOSITORY"
      description: "Long repository: WXPIN writes the long and RDPIN/RQPIN can read it. When active (DIR=1), WXPIN updates the long and raises IN; during reset WXPIN is ignored."
      code: |
        ' COG A writes
        wrpin   ##P_REPOSITORY, repo_pin
        dirh    repo_pin
        wxpin   data_value, repo_pin

        ' COG B reads
        rdpin   received, repo_pin
      source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PIN MODES (%00001..%00011 and not DAC_MODE = long repository)"

common_patterns:
  spi_flash_access:
    description: "SPI flash read with streamer (single clock smart pin; data moves through the streamer, not per-line smart pins)"
    code: |
      ' Set up the clock smart pin
      wrpin   #%01_00101_0, #spi_ck    ' transition output, starts out low
      wxpin   #1, #spi_ck              ' timebase = 1 clock per transition
      drvl    #spi_ck                  ' enable smart pin

      ' Then start the clock and the streamer to move the actual data
      wypin   x, #spi_ck               ' start spi_ck transitions
      waitx   #3                       ' align spi_ck transitions with sampling
      xinit   wmode, #0                ' start inputting bits to hub via streamer
    source: "Parallax SPI Flash Programmer and Boot Loader v51, Loader, Read in remaining application longs (the smart-pin setup and the .block loop)"

coordination:
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), STREAMER (SETXFRQ: the NCO frequency is a multiplier of $8000_0000; XINIT/XZERO/XCONT commands); SMART PIN MODES (%00101 transition output, WXPIN timebase); multi_pin_sync: SMART PINS (the DIR-low configuration paragraph and the 34-bit cog-to-smart-pin bus paragraph); setup_order: Parallax SPI Flash Programmer and Boot Loader v51, Programmer, Get ready to program flash, and Loader, Read in remaining application longs"
  streamer_smartpin:
    setup_order: "The flash loader configures and enables its spi_ck smart pin (WRPIN, WXPIN, DRVL) during setup, before any XINIT starts the streamer"
    pin_output_hierarchy: |
      Streamer pin output is OR'd with {OUTB, OUTA} to produce the cog's pin output
      states. In some smart pin modes the smart pin takes over driving the output
      state, in which case the OUT bit gets ignored ('SMART' output overrides
      OUT/OTHER). The flash loader puts its streamer data and its smart-pin clock on
      different pins.
    see_also: "architecture/smart_pins.yaml pin_output_hierarchy section"
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), STREAMER (the OR with {OUTB, OUTA}), SMART PINS (in some modes the smart pin takes over driving the output state, and the OUT bit gets ignored), PIN CONFIGURATION MODES ('SMART' = smart pin output which overrides OUT/OTHER); Parallax SPI Flash Programmer and Boot Loader v51 (spi_ck and spi_di/spi_do on separate pins)"

  bit_edge_lockstep:
    rule: |
      The flash loader pairs a P_TRANSITION smart pin (clock) with the streamer
      (data) for SPI-style synchronous I/O using SETXFRQ $4000_0000 (clk/2 NCO
      value for the streamer) and WXPIN 1 (timebase of 1 clock per transition).
      Not documented: the streamer/SCK pairing for any other SCK rate.
    worked_examples: |
      ' the flash loader's setting
      setxfrq ##$4000_0000     ' streamer rate clk/2
      wxpin   #1, #SCK_PIN     ' timebase 1 clock per transition
    source: "Parallax SPI Flash Programmer and Boot Loader v51, Programmer, Get ready to program flash (WXPIN #1 'set timebase to 1 clock per transition'; SETXFRQ 'set streamer rate to clk/2'), Loader, Read in remaining application longs, and Loader Data (clk2 = $4000_0000 'clk/2 nco value for streamer'); NCO and timebase definitions: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), STREAMER and SMART PIN MODES"

  alignment_pad:
    rule: |
      When the streamer samples an input pin (e.g., MISO/spi_do) that is
      driven by a remote device clocked by our P_TRANSITION smart pin,
      the flash loader puts a 3-clock WAITX between starting the SCK
      transitions (WYPIN) and starting the streamer (XINIT), to "align
      spi_ck transitions with spi_do sampling".
    code: |
      wypin   bit_count_doubled, #SCK_PIN  ' start SCK transitions
      waitx   #3                           ' align spi_ck transitions with spi_do sampling
      xinit   input_streamer_mode, #0      ' streamer begins sampling
      waitxfi
    rate_dependence: |
      The flash loader uses the 3-clock pad at one rate only, the SCK
      timebase and streamer NCO in bit_edge_lockstep above: a WXPIN of 1
      with an NCO value of $4000_0000. Not documented: the pad for any
      other timebase or NCO setting.
    write_side: |
      In the external implementation tested (one board, one host), with the
      streamer driving a P_SYNC_TX MOSI against a P_TRANSITION SCK (hp = SCK
      half-period in sysclks), a write pad of 4 is safe at hp = 7 and loses at
      hp = 5. At a losing pad, whole sectors are written corrupt with no error or
      status bit.
    source: "Parallax SPI Flash Programmer and Boot Loader v51, Loader, Read in remaining application longs (.block: waitx #3 'align spi_ck transitions with spi_do sampling'); write_side: XF-001 (one board, one host implementation; the pad 4 at hp = 7 and hp = 5 values and the silent corruption only)"

  multi_pin_sync:
    - "Smart pin modes should be selected and configured only while DIR is low; once DIR is raised the pin starts in the configured mode"
    - "Each smart pin ORs the write buses of all cogs, so cogs that execute WRPIN / WXPIN / WYPIN / RDPIN / AKPIN on the same smart pin must do so at different times; any number of cogs can read a smart pin at once with RQPIN"

debugging:
  monitoring:
    - "On a pin in a smart-pin mode the IN bit that TESTP returns serves as a flag (language/pasm2/testp.yaml)"
    - "LOCK[15] is allocated by the debugger and used among all cogs during their debug interrupts (architecture/locks.yaml)"

sources:
