# PASM2 Labels and Symbol Scoping

concept: labels
title: PASM2 Labels and Symbol Scoping
category: pasm2_syntax
importance: fundamental

metadata:
  query_tags: ["label", "local_label", "global_label", "scope", "symbol", ".label", "@label"]
  complexity: beginner
  use_cases: ["code_organization", "subroutine_structure", "loop_targets", "branch_destinations"]
  common_questions:
    - "What is the difference between global and local labels?"
    - "How do I use local labels in PASM2?"
    - "Why can I reuse .loop in different routines?"
    - "What does the @ symbol mean before a label?"
    - "How do I reference a label in a jump or call?"

overview: |
  PASM2 supports two scoping levels for labels within DAT blocks: global labels and local labels.
  This scoping mechanism enables reuse of common label names (loop, done, exit) without naming
  collisions across different routines. Understanding label scoping is essential for writing
  maintainable assembly code.

label_types:
  global_labels:
    syntax: "labelname"
    definition: "Identifier at start of line without prefix character"
    characteristics:
      - "Visible throughout the entire DAT block"
      - "Can be referenced from Spin2 code using @labelname"
      - "Defining a new global label resets the local label scope"
      - "Maximum length: 30 characters (a DAT label of 30 characters compiles and one of 31 is rejected). Parallax's documents also give 32 characters."
      - "Not documented: the characters a label name may begin with and contain."
    example: |
      DAT             org

      init_routine    mov     x, #0           ' Global label
                      add     x, #1
                      ret

      data_table      long    $DEAD_BEEF      ' Global label for data
                      long    $CAFE_BABE

      math_helper     abs     x               ' Another global label
                      ret

  local_labels:
    syntax: ".labelname"
    definition: "Identifier prefixed with a dot (.)"
    characteristics:
      - "Visible only within scope of preceding global label"
      - "Scope ends when next global label is defined"
      - "Same local name can be reused under different global labels"
      - "Not documented: the characters allowed after the dot, and how the compiler distinguishes equal local names internally"
    example: |
      DAT             org

      first_routine   mov     x, #3           ' Global: first_routine
      .loop           sub     x, #1           ' Local: .loop (scope: first_routine)
                      tjnz    x, #.loop
                      call    #.finish        ' Forward reference to .finish in the same scope
                      ret
      .finish         add     x, #1           ' Local: .finish (scope: first_routine)
                      ret

      second_routine  mov     x, #5           ' Global: second_routine (NEW scope)
                      jmp     #.finish        ' This .finish is DIFFERENT
      .loop           sub     x, #1           ' Local: .loop (scope: second_routine)
                      tjnz    x, #.loop
      .finish         ret                     ' Local: .finish (scope: second_routine)

    key_insight: |
      The same local label names (.loop, .finish) can exist in both first_routine and
      second_routine without collision. Each global label creates a new local scope.

reference_operators:
  description: "Operators for referencing labels in different contexts"
  operators:
    immediate_cog:
      syntax: "#label"
      meaning: "Immediate branch target. When the label is in the same domain as the code (cog code to a cog label, hub code to a hub label) it assembles as a relative branch (the R bit, bit 20, is 1); a branch that crosses between cog and hub assembles absolute (R = 0) even without the backslash"
      context: "PASM instructions - jumps, calls, branches"
      example: "JMP #main_loop"

    immediate_local:
      syntax: "#.local"
      meaning: "Immediate reference to local label"
      context: "PASM instructions within same scope"
      example: "DJNZ counter, #.loop"

    absolute_cog:
      syntax: "#\\label"
      meaning: "Absolute branch: the backslash assembles the branch with the R bit, bit 20, at 0 instead of the relative form"
      context: "When absolute address required"
      example: "CALL #\\helper"

    hub_address:
      syntax: "@label"
      meaning: "Hub address of label in a Spin2 method and in a PASM-only file; in a Spin2 object's DAT block, the offset from the start of the object"
      context: "Spin2 methods, and PASM-only files. In a Spin2 object, take @label in Spin2 and pass it in PTRA (language/spin2/integration/spin2-pasm2-integration.yaml hub_address_resolution)"
      example: "MOV ptr, ##@hub_data"

    object_relative:
      syntax: "@@label"
      meaning: "Spin2 operator: hub address of this object + x, for an object-relative offset stored in DAT"
      context: "Spin2 methods; accepted in PUB code and rejected in DAT"
      example: "DAT: ptrs LONG @start, @fin  (stores object-relative offsets);  Spin2: addr := @@ptrs[i]"

    current_origin:
      syntax: "$"
      meaning: "Current origin: the cog register address in ORG (cog-exec) code, stepping by 1 per instruction; the hub address in ORGH (hub-exec) code, stepping by 4"
      context: "PASM instructions and data expressions"
      example: "JMP #$-1           ' Jump back one instruction"

scope_boundaries:
  description: "Events that create new local label scopes"
  boundaries:
    - event: "Global label definition"
      effect: "Starts a new local scope"
      example: "my_routine    mov x, #0    ' New scope begins"

    - event: "Label on a storage directive"
      effect: "A label on a storage directive ends the scope: a local name defined before it cannot be referenced after it"
      example: "data_block    long 0, 0    ' New scope begins"

    - event: "End of DAT block"
      effect: "Not documented: the scope at the end of a DAT block"

  example: |
    DAT             org

    func_a          mov     x, #1           ' Scope #1 begins
    .loop           djnz    x, #.loop       ' .loop in scope #1

    func_b          mov     x, #2           ' Scope #2 begins
    .loop           djnz    x, #.loop       ' .loop in scope #2 (DIFFERENT)
    .done           ret                     ' .done in scope #2

rep_instruction_usage:
  description: "REP instruction can use @.label to calculate instruction count"
  syntax: "REP @.label, count"
  block_size: "REP @label counts the instructions up to the label, including an AUGS word"
  example: |
    process_data    rep     @.end, count    ' Count instructions to .end
                    rdlong  x, ptr
                    add     ptr, #4
                    add     sum, x
    .end                                    ' Label marks end of REP block
  scope_rule: "Not documented: whether the REP @.label target must be in the same local scope as the REP"

best_practices:
  limits:
    symbol_length: "30 characters maximum for a DAT label (30 compiles; 31 is rejected); Parallax's documents also give 32 characters. Not documented: the maximum length of a local name"
    dat_symbols: "Not documented: a limit on the number of DAT symbols per file"

common_patterns:
  loop_with_local:
    description: "Standard loop using local label"
    code: |
      process         mov     count, #100
      .loop           ' Loop body here
                      djnz    count, #.loop
                      ret

  multiple_exits:
    description: "Routine with multiple local labels"
    code: |
      search          mov     count, #256
      .loop           rdlong  value, PTRA++
                      cmp     value, target   wz
              if_z    jmp     #.found
                      djnz    count, #.loop
      .notfound       mov     result, #0
                      ret
      .found          mov     result, #1
                      ret

  rep_with_label:
    description: "REP using label for block size"
    code: |
      fill_buffer     rep     @.end, #256
                      wrbyte  pattern, PTRA++
      .end
                      ret

sources:
  - "reference_operators: CP-036 (R bit 1 for a relative and 0 for an absolute #\\ branch), CP-052 (from hub code, JMP #fastLoop to a cog label assembles to $FD800000, R = 0, the same word as JMP #\\fastLoop), Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), BRANCH ADDRESSING (relative addressing is the default when cog code references cog labels or hub code references hub labels; absolute addressing is forced by the assembler when crossing between cog and hub domains; the JMP cases cog to cog, cog to hub, hub to cog, hub to hub), CP-030 (##@hubsym and LONG @hubsym in a Spin2 object and in a PASM-only file; @@ accepted in PUB code and rejected in DAT), Parallax Propeller 2 Spin2 Language Documentation v55, operator table (@@x: hub address of this object + x) and the current-origin note (JMP #$: steps by 1 per cog-exec instruction, by 4 per hub-exec instruction)"
  - "rep_instruction_usage: CP-038 (REP @label counts an AUGS word)"
  - "local label scope (label_types, scope_boundaries): CP-043 (a local name may repeat under different global labels and may be referenced forward; it cannot be referenced from under another global label or repeat under one; a label on a storage directive ends the scope; DAT blocks only, the end of a DAT block not shown)"
  - "hub_address: Parallax Propeller 2 Spin2 Language Documentation v55, DAT Symbols and Data (hub addresses relative to the start of the object in Spin2+PASM programs, absolute in PASM-only programs; @SymbolName returns the address of the data) and the address operator table (@hubvar: hub address of a VAR/PUB/PRI/DAT variable)"
  - "Symbol length: CP-001 (a DAT label of 30 characters compiles, 31 is rejected); Parallax Propeller 2 Spin2 Language Documentation v55, Spin2 overview (symbolic names up to 32 characters)"
