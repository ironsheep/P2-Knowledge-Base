title: PASM2 Basic I/O - Digital Pin Control
id: pasm2-basic-io
version: 1.0.0
category: pasm2_concepts
layer: "Foundation - I/O Operations"
purpose: Essential knowledge for basic digital I/O before smart pin autonomous modes

summary: |
  Foundational digital I/O operations in PASM2. Covers single-pin and multi-pin control,
  direction management, drive strength configuration, and the critical distinction
  between pin configuration (electrical characteristics) and pin operation (read/write).

description: |
  P2 provides 64 Smart I/O pins (P0-P63) that can be controlled individually
  or in groups. Each pin can be configured for drive strength, then
  operated as simple digital I/O. This is distinct from smart pin modes, where the
  smart pin circuit performs an autonomous function on the pin.

core_concept_configuration_vs_operation:
  critical_distinction: |
    Pin electrical characteristics such as drive strength are configuration
    that persists while you perform normal I/O operations. These are not smart pin modes.
    
  configuration_layer:
    purpose: "Set electrical characteristics"
    methods:
      - "WRPIN - Configure drive strength (see architecture/pin-drive-configuration.yaml)"
    persistence: "Settings remain active during basic I/O"
    
  operation_layer:
    purpose: "Read and write pin states"
    methods:
      - "DRVH/DRVL - Set output high/low"
      - "TESTP/TESTPN - Read pin state"
      - "FLTL - Float to high-impedance"
    behavior: "Normal digital I/O with configured electrical characteristics"

pin_architecture:
  source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, FEATURES (features summary), p.2; Special-purpose Registers (table), p.14; Smart I/O Pins, Direction and State (I/O Pin Registers table), p.21"
  pin_count: 64
  pin_range: "P0 to P63"
  pin_features: "64 Smart I/O pins, each with: ... Separate drive modes for high and low output: logic / 1.5 k / 15 k / 150 k / 1 mA / 100 µA / 10 µA / float"
  register_split:
    dira_outa_ina: "P0-P31"
    dirb_outb_inb: "P32-P63"
  per_pin_capabilities:
    direction: "DIR bit -- 0: input (float), 1: output (drive)"
    output_state: "OUT bit -- 0: low, 1: high; the corresponding DIR bit must be high to enable output"
    drive_modes: "Separate drive modes for high and low output: logic / 1.5 k / 15 k / 150 k / 1 mA / 100 µA / 10 µA / float. The eight rungs, their %HHH/%LLL encodings and their P_* constant names are defined once in architecture/pin-drive-configuration.yaml."
    input_modes: "Logic, Schmitt, pin-to-pin-comparator, and 8-bit-level-comparator input modes"
    power_grouping: "Externally powered in blocks of 4 for clean analog Vdd reference"
  no_milliamp_ladder: "Not documented: a drive rung beyond these eight, and a slew-rate setting. See architecture/pin-drive-configuration.yaml no_other_rungs."

control_registers:
  source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Special-purpose Registers, p.14; Smart I/O Pins, Direction and State (I/O Pin Registers), p.21; debug_overlap: the same datasheet, cog RAM register map (INA / INB also debug interrupt call and return addresses), p.13"
  addressing_note: "RAM registers $1F8 through $1FF give mapped access to eight special-purpose functions. In general, when specifying an address between $1F8 and $1FF, the PASM instruction accesses a special-purpose register."
  dira:
    address: "$1FA"
    purpose: "Output enable bits for P0..P31 (active high)"
  dirb:
    address: "$1FB"
    purpose: "Output enable bits for P32..P63 (active high)"
  outa:
    address: "$1FC"
    purpose: "Output state bits for P0..P31 (corresponding DIRA bit must be high to enable output)"
  outb:
    address: "$1FD"
    purpose: "Output state bits for P32..P63 (corresponding DIRB bit must be high to enable output)"
  ina:
    address: "$1FE"
    purpose: "Input state bits for P0..P31"
    read_only: true
  inb:
    address: "$1FF"
    purpose: "Input state bits for P32..P63"
    read_only: true
  debug_overlap: "Note that $1FE (INA) and $1FF (INB) are also the debug interrupt call address and return address, respectively."
  bit_to_pin_mapping: "Bit n of DIRA/OUTA/INA is pin Pn; bit n of DIRB/OUTB/INB is pin P(n+32)."

single_pin_operations:
  set_output_high:
    instruction: "DRVH"
    syntax: "DRVH pin_number"
    effect: "Sets DIR=1 and OUT=1 in one operation"
    example: "DRVH #16  ' Pin 16 outputs high"
    
  set_output_low:
    instruction: "DRVL"
    syntax: "DRVL pin_number"
    effect: "Sets DIR=1 and OUT=0 in one operation"
    example: "DRVL #16  ' Pin 16 outputs low"
    
  toggle_output:
    instruction: "DRVNOT"
    syntax: "DRVNOT pin_number"
    effect: "Toggles OUT bit, maintains DIR=1"
    example: "DRVNOT #16  ' Toggle pin 16"
    
  float_pin:
    instruction: "FLTL"
    syntax: "FLTL pin_number"
    effect: "Sets DIR=0 (high-impedance input)"
    example: "FLTL #16  ' Pin 16 floats"
    
  read_pin:
    instruction: "TESTP"
    syntax: "TESTP pin_number WC/WZ"
    effect: "Test pin state, set C or Z flag"
    example: "TESTP #16 WC  ' C=1 if pin high"
    
  read_pin_inverted:
    instruction: "TESTPN"
    syntax: "TESTPN pin_number WC/WZ"
    effect: "Test pin inverted, set flag"
    example: "TESTPN #16 WC  ' C=1 if pin low"

multi_pin_operations:
  concept: |
    Operate on multiple contiguous pins with a single instruction using pin fields.
    Pin field format: base_pin ADDPINS count, or encoded value with bits [10:6]=count, [5:0]=base.
    
  set_direction:
    instruction: "DIRH/DIRL"
    syntax: "DIRH #base_pin ADDPINS count"
    example: |
      DIRH #8 ADDPINS 7  ' Pins 8-15 as outputs
      DIRL #0 ADDPINS 3  ' Pins 0-3 as inputs

  set_output:
    instruction: "OUTH/OUTL"
    syntax: "OUTH #base_pin ADDPINS count"
    example: |
      OUTH #8 ADDPINS 7  ' Pins 8-15 output high
      OUTL #0 ADDPINS 3  ' Pins 0-3 output low

  drive_pins:
    instruction: "DRVH/DRVL"
    syntax: "DRVH #base_pin ADDPINS count"
    effect: "Sets DIR=1 and OUT simultaneously for pin range"
    example: "DRVH #16 ADDPINS 7  ' Pins 16-23 drive high"
    
  register_masking:
    description: "Use bit masks for non-contiguous pins"
    example: |
      MOV     mask, ##%11110000  ' Pins 7,6,5,4
      OR      DIRA, mask         ' Set as outputs
      ANDN    OUTA, mask         ' Drive low

pin_field_encoding:
  structure:
    format: "11-bit value encoding base pin and additional pins"
    bits_5_0: "Base pin number (0-63)"
    bits_10_6: "Additional pins count (0-31)"

  addpins_operator:
    syntax: "base_pin ADDPINS count"
    example: "#8 ADDPINS 7 = pins 8 through 15"
    encoding: "Bits [10:6]=count, bits [5:0]=base_pin"

  manual_encoding:
    formula: "(count << 6) | base_pin"
    example: "(7 << 6) | 8 = $1C8 = pins 8-15"
    direct_constant: "MOV pin_field, ##%00111_001000  ' 7 additional + base 8"

  wrapping_behavior:
    critical_rule: "Pin fields wrap within 32-pin blocks only"
    p0_p31_block: "Pins 0-31 wrap within themselves"
    p32_p63_block: "Pins 32-63 wrap within themselves"
    example_no_wrap: "#8 ADDPINS 7 = pins 8-15 (no wrapping)"
    example_with_wrap: "#28 ADDPINS 7 = pins 28-31, 0-3 (wraps at 31)"
    cross_block: "Cannot span from P31 to P32 - separate operations required"

direction_output_instructions:
  dir_only:
    DIRH: "Set direction to output (DIR=1)"
    DIRL: "Set direction to input (DIR=0)"
    DIRNOT: "Toggle direction bit"
    DIRC: "Set DIR=C flag"
    DIRNC: "Set DIR=!C flag"
    DIRZ: "Set DIR=Z flag"
    DIRNZ: "Set DIR=!Z flag"
    
  out_only:
    OUTH: "Set OUT=1"
    OUTL: "Set OUT=0"
    OUTNOT: "Toggle OUT"
    OUTC: "Set OUT=C flag"
    OUTNC: "Set OUT=!C flag"
    OUTZ: "Set OUT=Z flag"
    OUTNZ: "Set OUT=!Z flag"
    
  combined_drv:
    description: "Set both DIR=1 and OUT in single operation"
    DRVH: "DIR=1, OUT=1"
    DRVL: "DIR=1, OUT=0"
    DRVNOT: "DIR=1, OUT=!OUT"
    DRVC: "DIR=1, OUT=C"
    DRVNC: "DIR=1, OUT=!C"
    DRVZ: "DIR=1, OUT=Z"
    DRVNZ: "DIR=1, OUT=!Z"
    
  float_flt:
    description: "Set DIR=0 (high-impedance)"
    FLTL: "OUT=0, DIR=0"
    FLTH: "OUT=1, DIR=0"
    FLTNOT: "OUT=!OUT, DIR=0"
    note: "All FLT* variants set DIR=0; the suffix selects the OUT value"

pin_span_setq_override:
  concept: "A prior SETQ overrides the pin span field of the DIRx, OUTx, FLTx and DRVx instructions (D[10:6]) and of WRPIN, WXPIN, WYPIN and AKPIN (S[10:6])"
  source: "P2 Instructions v35 - Rev B/C Silicon, DIRx, OUTx, FLTx and DRVx rows ('Prior SETQ overrides D[10:6]') and WRPIN, WXPIN, WYPIN and AKPIN rows ('Prior SETQ overrides S[10:6]'); Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), Design Status 2019_04_11: 'DIRx/OUTx/FLTx/DRVx can now work on a span of pins (+D[10:6] pins). Prior SETQ overrides D[10:6].' and 'WRPIN/WXPIN/WYPIN/AKPIN can now work on a span of pins (+S[10:6] pins). Prior SETQ overrides S[10:6].'"

  dir_out_instructions:
    affected: "DIRH/DIRL/OUTH/OUTL/DRVH/DRVL/etc."
    field_override: "D[10:6] pin span overridden by SETQ"
    example: |
      SETQ  #15           ' Override to 16 pins
      DRVH  #8            ' Drive pins 8-23 high (not just pin 8)

  smart_pin_instructions:
    affected: "WRPIN/WXPIN/WYPIN/AKPIN"
    field_override: "S[10:6] pin span overridden by SETQ"
    example: |
      SETQ  #7            ' Override to 8 pins
      WRPIN mode, #16     ' Configure pins 16-23 (not just pin 16)

  priority:
    setq_first: "SETQ value takes precedence over instruction's embedded field"
    no_setq: "Use instruction's embedded ADDPINS or constant field normally"

internal_pull_resistors:
  source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Pin Mode Legend, p.24; FEATURES, p.2. THAT IS THE AUTHORITY HERE -- documentary, not empirical. EF-063 and EF-064 (real P2, 2026-08-20) corroborate that the mechanism behaves as described -- a 15 kOhm drive with DIR high holds a net, and anything stronger overpowers it -- but they establish it INCIDENTALLY, as the rig apparatus certifying other measurements: EF-063 is a streamer-fed DAC %TT finding and EF-064 a streamer pin-placement finding. Neither is a pull-up/drive-strength finding, and the ledger contains none. USB mode quote ('two 15k pull-downs' ...): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PIN MODES. Datasheet Pin Mode Legend DIR quote: the same datasheet, Pin Mode Legend, p.24."
  yes_you_can_pull_a_line_high_or_low: |
    Yes -- the P2 can hold a line weakly high or weakly low, and the constants that
    do it are P_HIGH_15K and P_LOW_15K (the drive-mode list is below). In your circuit
    this behaves as a pull-up or pull-down behaves: it holds the net, and a stronger
    external driver overpowers it. The same vocabulary describes these same
    ladder rungs in USB mode: "two 15k pull-downs for 'host' or a 1.5k pull-up
    and a float for 'device'".

    One thing differs from a dedicated pull-up: see the_dir_rule below. The drive
    applies only while the pin is an output, so dropping DIR removes it.
  how_the_p2_does_it: |
    The %M..M field holds C, I, O, HHH and LLL, with no pull-resistor selector
    among them. The high side and the low side each pick one rung of the same
    eight-rung ladder (logic / 1.5 k / 15 k / 150 k / 1 mA / 100 uA / 10 uA /
    float). A resistive rung driving to a rail gives the effect of a pull-up or
    pull-down, which is why the DIR rule applies.
  the_dir_rule: |
    A drive selection applies only while the pin drives: DIR is the direction
    bit, 0 for input (float) and 1 for output (drive). With DIR low, the pin is
    a plain high-impedance input and the selected drive is inactive.
  ladder_definition_home: architecture/pin-drive-configuration.yaml
  pull_a_line_high:
    intent: "hold a line high weakly, so a stronger external drive can overpower it"
    mode_word: "P_HIGH_15K"
    required_pin_state: "DIR = 1, OUT = 1"
    example: |
      WRPIN   ##P_HIGH_15K, #16    ' high side drives through 15 kOhm
      DRVH    #16                  ' DIR = 1, OUT = 1; DIRL here floats the pin
      TESTP   #16 WC               ' C = 1 unless something stronger holds the line low
  pull_a_line_low:
    intent: "hold a line low weakly, so a stronger external drive can overpower it"
    mode_word: "P_LOW_15K"
    required_pin_state: "DIR = 1, OUT = 0"
    example: |
      WRPIN   ##P_LOW_15K, #16     ' low side drives through 15 kOhm
      DRVL    #16                  ' DIR = 1, OUT = 0
      TESTP   #16 WC               ' C = 0 unless something stronger holds the line high

smart_pin_to_basic_io_transition:
  clearing_smart_pin:
    instruction: "WRPIN #0, pin"
    effect: "Returns the pin to normal mode"
    prerequisite: "WRPIN #0 returns a pin to normal mode and resets a running smart pin with DIR high, without a DIR cycle; the example lowers DIR first"
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PINS ('To return a pin to normal mode, do a WRPIN #0,pin'); P2 hardware verification, EF-012 (WRPIN #0 resets a running smart pin with no DIR cycle)"
    example: |
      DIRL  #16           ' DIR=0 while configuring
      WRPIN #0, #16       ' Clear smart pin config
      DRVH  #16           ' Now use as normal I/O
      
  safe_reconfiguration:
    rule: "Configure a smart pin while its DIR bit is low, holding it in reset; WRPIN #0 is the exception"
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PINS ('A smart pin should be configured while its DIR bit is low, holding it in reset'); P2 hardware verification, EF-011 (a WYPIN before DIR rises does not take effect in the pulse, transition and asynchronous serial transmit modes)"
    sequence: |
      DIRL  pin           ' 1. DIR=0 (hold in reset)
      WRPIN mode, pin     ' 2. Configure mode
      WXPIN x, pin        ' 3. Set X parameter (if needed)
      WYPIN y, pin        ' 4. Set Y parameter (if needed)
      DIRH  pin           ' 5. Enable (DIR=1)
    y_order_note: "In the pulse, transition and asynchronous serial transmit modes, write Y with WYPIN after raising DIR: a WYPIN issued before DIRH does not take effect. See architecture/smart_pins.yaml reset_before_configure."

out_and_dir_order:
  source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Smart I/O Pins, Direction and State (I/O Pin Registers table, OUTA/OUTB: corresponding DIR bit must be high to enable output), p.21, and I/O Pin Timing (DRVH: 'P0 OE' and 'P0 HIGH' begin their transition on the rising edge of clock 5), p.22; P2 Instructions v35 - Rev B/C Silicon, row 374 (DRVH), OUT and DIR bits written by one instruction"
  out_before_dir:
    fact: "The OUT bit can be written while DIR is low; the pin drives the OUT value once DIR is high"
    example: |
      OUTL #16  ' OUT = 0 while DIR is low
      DIRH #16  ' DIR = 1, the pin drives low

  drv_instructions:
    fact: "DRVH/DRVL write DIR and OUT with one instruction. With DRVH, the pin's output enable and its output state begin their transition on the same clock edge."
    example: "DRVH #16  ' DIR = 1, OUT = 1"

common_patterns:
  led_blink:
    code: |
      CON
        led_pin = 16

      DAT
            ORG
      blink
            DRVH  #led_pin      ' LED on
            WAITX ##20_000_000  ' Delay
            DRVL  #led_pin      ' LED off
            WAITX ##20_000_000
            JMP   #blink        ' Repeat
      
  button_read:
    code: |
      CON
        button_pin = 0

      DAT
            ORG
            DIRL  #button_pin                ' DIR=0 before reconfiguring
            WRPIN ##P_HIGH_15K, #button_pin  ' Drive high 15kOhm
            DRVH  #button_pin                ' DIR=1, OUT=1 - a drive is live only while DIR is high
      poll
            TESTP #button_pin WC             ' C = pin state
      IF_NC CALL  #button_action             ' a press shorts the pin to ground
            JMP   #poll
      button_action
            RET
      
  parallel_bus_write:
    code: |
      ' Write byte to 8-bit bus (pins 16-23)
      DIRH  #16 ADDPINS 7       ' All outputs
      MOV   temp, data
      AND   temp, ##$FF         ' Mask to 8 bits
      SHL   temp, #16           ' Position for pins 16-23
      ANDN  OUTA, ##$00FF_0000  ' Clear bus bits
      OR    OUTA, temp          ' Set new value
      
  parallel_bus_read:
    code: |
      ' Read byte from 8-bit bus (pins 16-23)
      DIRL  #16 ADDPINS 7       ' All inputs
      MOV   data, INA           ' Read all pins
      SHR   data, #16           ' Position to bits 0-7
      AND   data, ##$FF         ' Mask to byte

multi_cog_pin_coordination:
  source: "Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, COGS (PROCESSORS) (each cog contains an I/O Output Register and an I/O Direction Register), p.14; HUB (common shared resources such as I/O pins are simultaneously accessible by every cog), p.24. Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Cog RAM and Special-purpose Registers, pp.13-14. Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PINS (each smart pin OR's all incoming 34-bit buses from the cogs 'in the same way DIR and OUT bits are OR'd before going to the pins'; the different-times rule and RQPIN) and LOCKS. P2 hardware verification, EF-114 (one board, P0 with no smart pin mode, cog 0 and one worker cog: cog 0 DIR 1 OUT 0 with the worker DIR 0 OUT 1 reads 0, and cog 0 DIR 0 OUT 1 with the worker DIR 1 OUT 0 reads 0). P2 hardware verification, EF-105 (one board, plain pin at P_LOW_15K, cog 0 DIR 1 OUT 0 and a worker cog DIR 1 OUT 1 reads 1)"
  architecture:
    per_cog_registers: "Each cog has its own DIR and OUT registers, at cog register addresses $1FA-$1FD; INA and INB are at $1FE-$1FF"
    shared_access: "Each cog has access to all 64 I/O pins"

  locks:
    fact: "Locks can be used by cogs to coordinate exclusive access of a shared resource. What a lock represents is up to the application using it, and all participant cogs must agree on a lock's number and its purpose."

  cog_outputs_on_one_pin:
    consequence: "On a pin with no smart pin mode, a cog's OUT bit reaches the pin only through that cog's own DIR bit: with one cog at DIR high, OUT low and another at DIR low, OUT high, the pin reads low, whichever cog is which. With two cogs both at DIR high and different OUT bits on a pin whose low side drives through 15 kOhm and whose high side is fast, the pin reads high. Parallax's documents also give: DIR and OUT bits from all cogs are OR'd before going to the pins. Not documented: the level when two cogs both hold DIR high with different OUT bits at any other drive setting."
    hardware_note: "Each smart pin OR's the 34-bit buses from all cogs. Cogs that execute WRPIN, WXPIN, WYPIN, RDPIN or AKPIN on the same smart pin must do so at different times; any number of cogs can read a smart pin simultaneously with RQPIN, without bus conflict"

  safe_operations:
    reading: "I/O pins are simultaneously accessible by every cog; each cog reads them through its INA and INB registers"
    smart_pins: "Any number of cogs can read a smart pin simultaneously with RQPIN, without bus conflict"

  lock_coordination_example:
    code: |
      ' COG 0 and COG 1 share pin 16
      .try    LOCKTRY lock_id WC        ' Try to acquire lock
      IF_NC   JMP     #.try             ' C=0: lock not taken (held by another cog or not allocated) - try again
              DRVH    #16               ' We have the lock, drive pin
              ' ... do work ...
              DIRL    #16               ' Release pin (tri-state)
              LOCKREL lock_id           ' Release lock

