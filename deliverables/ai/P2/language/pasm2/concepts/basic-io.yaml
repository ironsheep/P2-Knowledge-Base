title: PASM2 Basic I/O - Digital Pin Control
id: pasm2-basic-io
version: 1.0.0
category: pasm2_concepts
layer: "Foundation - I/O Operations"
purpose: Essential knowledge for basic digital I/O before smart pin autonomous modes

summary: |
  Foundational digital I/O operations in PASM2. Covers single-pin and multi-pin control,
  direction management, drive strength configuration, and the critical distinction
  between pin configuration (electrical characteristics) and pin operation (read/write).

description: |
  P2 provides 64 general-purpose I/O pins (P0-P63) that can be controlled individually
  or in groups. Each pin can be configured for drive strength, then
  operated as simple digital I/O. This is distinct from autonomous smart pin modes where
  the pin operates independently.

core_concept_configuration_vs_operation:
  critical_distinction: |
    Pin electrical characteristics such as drive strength are CONFIGURATION
    that persists while you perform normal I/O operations. These are not autonomous modes.
    
  configuration_layer:
    purpose: "Set electrical characteristics"
    methods:
      - "WRPIN - Configure drive strength (see /deliverables/ai/P2/architecture/pin-drive-configuration.yaml)"
    persistence: "Settings remain active during basic I/O"
    
  operation_layer:
    purpose: "Read and write pin states"
    methods:
      - "DRVH/DRVL - Set output high/low"
      - "TESTP/TESTPN - Read pin state"
      - "FLTL - Float to high-impedance"
    behavior: "Normal digital I/O with configured electrical characteristics"

pin_architecture:
  source: "P2 Datasheet 2022/11/01 -- features summary p.2 :107,:117; Special-Purpose Registers table p.13 :579-586; I/O Pin Registers table p.21 :981-986 -- engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt. The register table appears identically on the reconstructed path, engineering/ingestion/sources/p2-datasheet/complete-tables-reference.md:157-164."
  pin_count: 64
  pin_range: "P0 to P63"
  datasheet_statement: "64 Smart I/O pins, each with: ... Separate drive modes for high and low output: logic / 1.5 k / 15 k / 150 k / 1 mA / 100 µA / 10 µA / float"
  register_split:
    dira_outa_ina: "P0-P31"
    dirb_outb_inb: "P32-P63"
  per_pin_capabilities:
    direction: "DIR bit -- 0: input (float), 1: output (drive)"
    output_state: "OUT bit -- 0: low, 1: high; the corresponding DIR bit must be high to enable output"
    drive_modes: "Separate drive modes for high and low output: logic / 1.5 k / 15 k / 150 k / 1 mA / 100 µA / 10 µA / float. The eight rungs, their %HHH/%LLL encodings and their P_* constant names are defined once in /deliverables/ai/P2/architecture/pin-drive-configuration.yaml."
    input_modes: "Logic, Schmitt, pin-to-pin-comparator, and 8-bit-level-comparator input modes"
    power_grouping: "Externally powered in blocks of 4 for clean analog Vdd reference"
  no_milliamp_ladder: "The datasheet's drive list is the whole list. No per-pin milliamp drive ladder and no programmable slew rate exists; see /deliverables/ai/P2/architecture/pin-drive-configuration.yaml no_other_rungs."

control_registers:
  source: "P2 Datasheet 2022/11/01 -- Special-Purpose Registers p.13 :579-586 and I/O Pin Registers p.21 :981-986 -- engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt; the same table on the reconstructed path at engineering/ingestion/sources/p2-datasheet/complete-tables-reference.md:157-164"
  addressing_note: "RAM registers $1F8 through $1FF give mapped access to eight special-purpose functions. In general, when specifying an address between $1F8 and $1FF, the PASM instruction accesses a special-purpose register."
  dira:
    address: "$1FA"
    purpose: "Output enable bits for P0..P31 (active high)"
  dirb:
    address: "$1FB"
    purpose: "Output enable bits for P32..P63 (active high)"
  outa:
    address: "$1FC"
    purpose: "Output state bits for P0..P31 (corresponding DIRA bit must be high to enable output)"
  outb:
    address: "$1FD"
    purpose: "Output state bits for P32..P63 (corresponding DIRB bit must be high to enable output)"
  ina:
    address: "$1FE"
    purpose: "Input state bits for P0..P31"
    read_only: true
  inb:
    address: "$1FF"
    purpose: "Input state bits for P32..P63"
    read_only: true
  debug_overlap: "Note that $1FE (INA) and $1FF (INB) are also the debug interrupt call address and return address, respectively. -- engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:542"
  bit_to_pin_mapping: "Bit n of DIRA/OUTA/INA is pin Pn; bit n of DIRB/OUTB/INB is pin P(n+32)."

single_pin_operations:
  set_output_high:
    instruction: "DRVH"
    syntax: "DRVH pin_number"
    effect: "Sets DIR=1 and OUT=1 in one operation"
    example: "DRVH #16  ' Pin 16 outputs high"
    
  set_output_low:
    instruction: "DRVL"
    syntax: "DRVL pin_number"
    effect: "Sets DIR=1 and OUT=0 in one operation"
    example: "DRVL #16  ' Pin 16 outputs low"
    
  toggle_output:
    instruction: "DRVNOT"
    syntax: "DRVNOT pin_number"
    effect: "Toggles OUT bit, maintains DIR=1"
    example: "DRVNOT #16  ' Toggle pin 16"
    
  float_pin:
    instruction: "FLTL"
    syntax: "FLTL pin_number"
    effect: "Sets DIR=0 (high-impedance input)"
    example: "FLTL #16  ' Pin 16 floats"
    
  read_pin:
    instruction: "TESTP"
    syntax: "TESTP pin_number WC/WZ"
    effect: "Test pin state, set C or Z flag"
    example: "TESTP #16 WC  ' C=1 if pin high"
    
  read_pin_inverted:
    instruction: "TESTPN"
    syntax: "TESTPN pin_number WC/WZ"
    effect: "Test pin inverted, set flag"
    example: "TESTPN #16 WC  ' C=1 if pin low"

multi_pin_operations:
  concept: |
    Operate on multiple contiguous pins with a single instruction using pin fields.
    Pin field format: base_pin ADDPINS count, or encoded value with bits [10:6]=count, [5:0]=base.
    
  set_direction:
    instruction: "DIRH/DIRL"
    syntax: "DIRH #base_pin ADDPINS #count"
    example: |
      DIRH #8 ADDPINS #7  ' Pins 8-15 as outputs
      DIRL #0 ADDPINS #3  ' Pins 0-3 as inputs
      
  set_output:
    instruction: "OUTH/OUTL"
    syntax: "OUTH #base_pin ADDPINS #count"
    example: |
      OUTH #8 ADDPINS #7  ' Pins 8-15 output high
      OUTL #0 ADDPINS #3  ' Pins 0-3 output low
      
  drive_pins:
    instruction: "DRVH/DRVL"
    syntax: "DRVH #base_pin ADDPINS #count"
    effect: "Sets DIR=1 and OUT simultaneously for pin range"
    example: "DRVH #16 ADDPINS #7  ' Pins 16-23 drive high"
    
  register_masking:
    description: "Use bit masks for non-contiguous pins"
    example: |
      MOV     mask, ##%11110000  ' Pins 7,6,5,4
      OR      DIRA, mask         ' Set as outputs
      ANDN    OUTA, mask         ' Drive low

pin_field_encoding:
  structure:
    format: "11-bit value encoding base pin and additional pins"
    bits_5_0: "Base pin number (0-63)"
    bits_10_6: "Additional pins count (0-31)"

  addpins_operator:
    syntax: "base_pin ADDPINS count"
    example: "#8 ADDPINS #7 = pins 8 through 15"
    encoding: "Bits [10:6]=count, bits [5:0]=base_pin"

  manual_encoding:
    formula: "(count << 6) | base_pin"
    example: "(7 << 6) | 8 = $1C8 = pins 8-15"
    direct_constant: "MOV pin_field, ##%00111_001000  ' 7 additional + base 8"

  wrapping_behavior:
    critical_rule: "Pin fields wrap WITHIN 32-pin blocks only"
    p0_p31_block: "Pins 0-31 wrap within themselves"
    p32_p63_block: "Pins 32-63 wrap within themselves"
    example_no_wrap: "#8 ADDPINS #7 = pins 8-15 (no wrapping)"
    example_with_wrap: "#28 ADDPINS #7 = pins 28-31, 0-3 (wraps at 31)"
    cross_block: "Cannot span from P31 to P32 - separate operations required"

direction_output_instructions:
  dir_only:
    DIRH: "Set direction to output (DIR=1)"
    DIRL: "Set direction to input (DIR=0)"
    DIRNOT: "Toggle direction bit"
    DIRC: "Set DIR=C flag"
    DIRNC: "Set DIR=!C flag"
    DIRZ: "Set DIR=Z flag"
    DIRNZ: "Set DIR=!Z flag"
    
  out_only:
    OUTH: "Set output high (if DIR=1)"
    OUTL: "Set output low (if DIR=1)"
    OUTNOT: "Toggle output"
    OUTC: "Set OUT=C flag"
    OUTNC: "Set OUT=!C flag"
    OUTZ: "Set OUT=Z flag"
    OUTNZ: "Set OUT=!Z flag"
    
  combined_drv:
    description: "Set both DIR=1 and OUT in single operation"
    DRVH: "DIR=1, OUT=1"
    DRVL: "DIR=1, OUT=0"
    DRVNOT: "DIR=1, OUT=!OUT"
    DRVC: "DIR=1, OUT=C"
    DRVNC: "DIR=1, OUT=!C"
    DRVZ: "DIR=1, OUT=Z"
    DRVNZ: "DIR=1, OUT=!Z"
    
  float_flt:
    description: "Set DIR=0 (high-impedance)"
    FLTL: "DIR=0 (common usage)"
    FLTH: "DIR=0"
    FLTNOT: "DIR=0"
    note: "All FLT* variants set DIR=0; suffix affects OUT bit for future use"

pin_span_setq_override:
  concept: "Rev B silicon enhancement - SETQ overrides embedded pin span fields"

  dir_out_instructions:
    affected: "DIRH/DIRL/OUTH/OUTL/DRVH/DRVL/etc."
    field_override: "D[10:6] pin span overridden by SETQ"
    example: |
      SETQ  #15           ' Override to 16 pins
      DRVH  #8            ' Drive pins 8-23 high (not just pin 8)
    use_case: "Dynamic pin field sizing at runtime"

  smart_pin_instructions:
    affected: "WRPIN/WXPIN/WYPIN/AKPIN"
    field_override: "S[10:6] pin span overridden by SETQ"
    example: |
      SETQ  #7            ' Override to 8 pins
      WRPIN mode, #16     ' Configure pins 16-23 (not just pin 16)
    use_case: "Batch smart pin configuration"

  priority:
    setq_first: "SETQ value takes precedence over instruction's embedded field"
    no_setq: "Use instruction's embedded ADDPINS or constant field normally"

internal_pull_resistors:
  source: "P2 Datasheet 2022/11/01 p.24 Pin Mode Legend -- engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:1131-1147, :117. THAT IS THE AUTHORITY HERE -- documentary, not empirical. EF-063 and EF-064 (engineering/ingestion/external-sources/hardware-verification/P2-EMPIRICAL-FINDINGS.md:827,840, real P2, 2026-08-20) corroborate that the mechanism behaves as described -- a 15 kOhm drive with DIR high holds a net, and anything stronger overpowers it -- but they establish it INCIDENTALLY, as the rig apparatus certifying other measurements: EF-063 is a streamer-fed DAC %TT finding (:813) and EF-064 a streamer pin-placement finding (:834). Neither is a pull-up/drive-strength finding, and the ledger contains none."
  there_is_no_bias_resistor_selector: |
    The P2 has no internal pull-up/pull-down resistor network. The Pin Mode Legend
    enumerates the whole %M..M field -- C, I, O, HHH, LLL -- and there is no
    bias-resistor selector among them. What the P2 offers instead is a per-side
    DRIVE STRENGTH: the high side and the low side each pick one rung of the same
    eight-rung ladder (logic / 1.5 k / 15 k / 150 k / 1 mA / 100 µA / 10 µA / float).
  the_dir_rule: |
    A drive selection is a property of DRIVING, so it is live only while the pin
    drives. Configuring a weak drive and then dropping DIR gives a plain
    high-impedance input with the selection INACTIVE. The authority for that is
    the Datasheet Pin Mode Legend -- "DIR = direction bit; 0: input (float),
    1: output (drive)", engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:1144
    -- and NOT a bench measurement. EF-063 and EF-064 use a weak drive with DIR
    HIGH as rig apparatus for other measurements, and neither reports a result
    taken with DIR dropped, so they corroborate the drive mechanism incidentally
    and settle nothing about this rule. It is the reason the older form of this
    block -- weak drive followed by a float -- does not work.
  ladder_definition_home: /deliverables/ai/P2/architecture/pin-drive-configuration.yaml
  substitute_for_a_pull_up:
    intent: "hold a line high weakly, so a stronger external drive can overpower it"
    mode_word: "P_HIGH_15K"
    required_pin_state: "DIR = 1, OUT = 1"
    example: |
      WRPIN   ##P_HIGH_15K, #16    ' high side drives through 15 kOhm
      DRVH    #16                  ' DIR = 1, OUT = 1 -- REQUIRED; DIRL here floats the pin
      TESTP   #16 WC               ' C = 1 unless something stronger holds the line low
  substitute_for_a_pull_down:
    intent: "hold a line low weakly, so an undriven pin reads 0 for a stated reason"
    mode_word: "P_LOW_15K"
    required_pin_state: "DIR = 1, OUT = 0"
    example: |
      WRPIN   ##P_LOW_15K, #16     ' low side drives through 15 kOhm
      DRVL    #16                  ' DIR = 1, OUT = 0 -- REQUIRED
      TESTP   #16 WC               ' C = 0 unless something stronger holds the line high
  corrected_2026_08_25: |
    The pre-purge form of this block showed 'DIRL #16  -- Use as input with pull-up'
    and named the P_HIGH_*/P_LOW_* constants as pull-up / pull-down modes. Both are
    wrong: DIR = 0 deactivates the drive, and the constants are drive-strength
    selectors, not bias resistors. Returned in the hardware-verified form instead.
  use_cases:
    - "Button inputs without external resistors -- weak high drive, DIR high, button pulls to ground"
    - "Holding an unused or undriven line at a known level for a stated reason"
    - "Weak side of a bidirectional line, so an external driver can overpower it"

smart_pin_to_basic_io_transition:
  clearing_smart_pin:
    instruction: "WRPIN #0, pin"
    effect: "Disables all smart pin configuration"
    prerequisite: "DIRL pin (DIR=0) before clearing"
    example: |
      DIRL  #16           ' DIR=0 required
      WRPIN #0, #16       ' Clear smart pin config
      DRVH  #16           ' Now use as normal I/O
      
  safe_reconfiguration:
    rule: "ALWAYS set DIR=0 before WRPIN configuration"
    sequence: |
      DIRL  pin           ' 1. DIR=0 (REQUIRED)
      WRPIN mode, pin     ' 2. Configure mode
      WXPIN x, pin        ' 3. Set X parameter (if needed)
      WYPIN y, pin        ' 4. Set Y parameter (if needed)
      DIRH  pin           ' 5. Enable (DIR=1)

safe_initialization_patterns:
  avoid_glitches:
    rule: "Set OUT to the desired state while the pin is still floating, then raise DIR"
    wrong: |
      OUTH #16  ' Wrong state latched: raising DIR now drives the pin high
      DIRH #16
    correct: |
      OUTL #16  ' Set desired state first
      DIRH #16  ' Then enable output
      
  use_combined_instructions:
    preferred: "DRVH/DRVL set DIR and OUT atomically"
    example: "DRVH #16  ' No glitch possible"

common_patterns:
  led_blink:
    code: |
      CON
        led_pin = 16

      DAT
            ORG
      blink
            DRVH  #led_pin      ' LED on
            WAITX ##20_000_000  ' Delay
            DRVL  #led_pin      ' LED off
            WAITX ##20_000_000
            JMP   #blink        ' Repeat
      
  button_read:
    code: |
      CON
        button_pin = 0

      DAT
            ORG
            DIRL  #button_pin                ' DIR=0 before reconfiguring
            WRPIN ##P_HIGH_15K, #button_pin  ' Drive high 15kOhm
            DRVH  #button_pin                ' DIR=1, OUT=1 - a drive is live only while DIR is high
      poll
            TESTP #button_pin WC             ' C = pin state
      IF_NC CALL  #button_action             ' a press shorts the pin to ground
            JMP   #poll
      button_action
            RET
      
  parallel_bus_write:
    code: |
      ' Write byte to 8-bit bus (pins 16-23)
      DIRH  #16 ADDPINS #7      ' All outputs
      MOV   temp, data
      AND   temp, ##$FF         ' Mask to 8 bits
      SHL   temp, #16           ' Position for pins 16-23
      ANDN  OUTA, ##$00FF_0000  ' Clear bus bits
      OR    OUTA, temp          ' Set new value
      
  parallel_bus_read:
    code: |
      ' Read byte from 8-bit bus (pins 16-23)
      DIRL  #16 ADDPINS #7      ' All inputs
      MOV   data, INA           ' Read all pins
      SHR   data, #16           ' Position to bits 0-7
      AND   data, ##$FF         ' Mask to byte

multi_cog_pin_coordination:
  architecture:
    per_cog_registers: "DIR/OUT/IN registers at $1FA-$1FF exist in each COG's private register RAM"
    independence: "Each COG controls only its own pin drivers via its DIR bits"
    shared_access: "All COGs can access all 64 pins, but each COG's DIR determines if IT drives"

  coordination_strategies:
    single_cog_ownership:
      approach: "Assign each pin to one COG (simplest, recommended for most applications)"
      implementation: "Only one COG sets DIR=1 for any given pin"
      advantage: "No coordination overhead, inherently safe"

    shared_access_with_coordination:
      approach: "Multiple COGs can share pin access with careful management"
      requirements:
        - "Use locks (LOCKTRY/LOCKREL) for exclusive access during drive operations"
        - "COGs must tri-state (DIRL/FLTL) before releasing pin to another COG"
        - "Protocol-based handoff between COGs"
      use_cases: "Bidirectional protocols, time-multiplexed pin usage, COG handoff"

  critical_rule:
    avoid: "Multiple COGs simultaneously setting DIR=1 for same pin"
    consequence: "Behavior undefined if COGs drive conflicting states (not documented in P2 spec)"
    hardware_note: "No documented conflict resolution, wire-OR, or priority scheme"

  safe_operations:
    reading: "All COGs can read any pin (INA/INB) simultaneously without coordination"
    smart_pins: "Smart pin state (RQPIN) can be read by multiple COGs safely"

  lock_coordination_example:
    code: |
      ' COG 0 and COG 1 share pin 16
      LOCKTRY lock_id WC        ' Try to acquire lock
      IF_C  JMP #try_again      ' C=1 means locked by other COG
      DRVH  #16                 ' We have lock, drive pin
      ' ... do work ...
      DIRL  #16                 ' Release pin (tri-state)
      LOCKREL lock_id           ' Release lock

