concept: instruction_skipping
title: Instruction Skipping - SKIP and SKIPF
aliases:
  - "skip pattern"
  - "SKIPF pattern"
  - "skip pattern bits"
  - "AUGS in a skip pattern"
  - "## inside a SKIP sequence"
category: control_flow
description: Hardware-based instruction skipping for efficient conditional execution without branches

overview: |
  P2's SKIP, SKIPF and EXECF instructions selectively skip up to the next 32 instructions based on a
  bit pattern, with no branch needed. SKIP cancels each skipped instruction as it comes through the
  pipeline (it becomes a 2-clock NOP). SKIPF, in cog/LUT memory, leaps over skipped instructions
  instead, with no clock penalty, except where an instruction is already in the pipeline and must be
  cancelled (see skip_behavior). Skipping only works in main code, not within interrupt service routines.
# Sources: overview: Silicon Doc, silicon-doc-text.txt:780, :876-881.

skip_instructions:
  SKIP:
    description: "Skip instructions based on immediate bit pattern"
    syntax: "SKIP #{#}pattern"
    pattern_size: "Up to 32 bits"
    operation: "Each 1 bit skips corresponding instruction"
    examples:
      - |
        SKIP #%101      ' Skip 1st and 3rd instructions
        ADD x, #1       ' Skipped
        SUB y, #1       ' Executed  
        MOV z, #0       ' Skipped
    timing: "Each skipped instruction is cancelled in the pipeline and becomes a 2-clock NOP"
    sources:
      - "timing: Silicon Doc, silicon-doc-text.txt:780"

  SKIPF:
    description: "Like SKIP, but faster: cog/LUT only, PC steps over skipped instructions"
    syntax: "SKIPF {#}pattern"
    pattern_source: "32-bit pattern from a register or an immediate (# / ##)"
    operation: "In cog/LUT memory the PC steps 1..8 to leap over skipped instructions (no clock penalty); in hub exec it reverts to SKIP behavior. An instruction is cancelled (2-clock NOP) instead of stepped over when it is the first instruction after SKIPF/EXECF with pattern LSB = 1, or the 8th in a row being skipped (only 7 can be stepped over at once)."
    sources:
      - "operation: Silicon Doc, silicon-doc-text.txt:848-881"
    examples:
      - |
        MOV pattern, #%11001100
        SKIPF pattern
        ' Next 8 instructions follow pattern
    use_case: "Runtime-determined conditionals"

  EXECF:
    description: "Jump to a cog/LUT address, then skip instructions there by a pattern"
    syntax: "EXECF {#}D"
    encoding: "D[31:10] = SKIPF pattern, D[9:0] = jump target (cog/LUT address)"
    operation: "Jumps to D[9:0] in cog/LUT first, then initiates SKIPF using D[31:10]; the pattern applies to the instructions starting at the jump target"
    sources:
      - "operation: Silicon Doc, silicon-doc-text.txt:786"
    examples:
      - |
        EXECF ##(%101 << 10) | target
        ' ...execution continues at target, where the pattern applies:
        target  ADD x, #1       ' Skipped
                SUB y, #1       ' Executed
                MOV z, #0       ' Skipped
    use_case: "Enter a block of instructions with a skip pattern chosen at the jump"

pattern_encoding:
  bit_mapping:
    - "Bit 0 → First instruction after SKIP"
    - "Bit 1 → Second instruction"
    - "Bit 31 → 32nd instruction"
    - "1 = skip, 0 = execute"

  pattern_size:
    immediate: "1-32 bits via # or ##"
    register: "Full 32 bits"
    examples:
      - "SKIP #%1"            # Skip next instruction
      - "SKIP #%1111"         # Skip next 4 instructions
      - "SKIP ##%1010101010101010_1010101010101010"  # 32-bit pattern

  pattern_consumption:
    - "Each instruction consumes one pattern bit"
    - "Pattern shifts after each instruction"
    - "Exhausted pattern = normal execution resumes"
    - "A CALL/CALLPA/CALLPB that is not skipped runs its whole subroutine normally; the skip sequence resumes after the returning RET/_RET_"
    - "The AUGS that a ## S operand emits is an instruction of its own and consumes its own pattern bit (under SKIP and SKIPF), so every bit after a ## line moves up by one"
    - "Skipping the instruction but not its AUGS leaves the AUGS pending: it augments the next instruction that has an immediate S"
  sources:
    - "pattern_consumption (CALL/CALLPA/CALLPB subroutine): Silicon Doc, silicon-doc-text.txt:791"
    - "pattern_consumption (AUGS takes a bit; a pending AUGS augments the next immediate): bench-measured under SKIP and SKIPF, P2-EMPIRICAL-FINDINGS.md EF-091 (AUGD not run)"

skip_behavior:
  instruction_handling:
    skipped:
      - "SKIP: instruction is cancelled in the pipeline (a 2-clock NOP); not executed"
      - "SKIPF/EXECF in cog/LUT: PC steps over it, no clocks consumed, except the cancel cases above"
      - "No side effects (flags, writes, etc.)"
      - "PC advances normally"
    
    executed:
      - "Normal instruction execution"
      - "Full side effects"
      - "Normal timing"

  special_cases:
    REP_interaction:
      - "SKIP is fully compatible with REP: it only cancels instructions, so REP keeps accurate instruction counts"
      - "SKIPF works with REP only if every SKIPF pattern results in the same instruction count, which REP must be initiated with"
      - "The pattern advances one bit per instruction encountered, not per REP iteration"

    branches_in_skipf_sequences:
      - "If the instruction after a CALL/CALLPA/CALLPB might be skipped, its immediate branch address must be absolute (CALL #\\address; registers are absolute; not possible for CALLPA/CALLPB)"
      - "Immediate-relative branches work through SKIPF; after an absolute-address branch (#\\label, register, RET) the first instruction after the branch must not be skipped"

    interrupts:
      - "Skipping only works outside of interrupt service routines (in main code)"
      - "An interrupt service routine executes normally during a skipping sequence; the skipping sequence resumes upon its completion"
    sources:
      - "REP_interaction (SKIP compatible with REP): Silicon Doc, silicon-doc-text.txt:883"
      - "REP_interaction (SKIPF with REP, same instruction count): Silicon Doc, silicon-doc-text.txt:885"
      - "branches_in_skipf_sequences (CALL/CALLPA/CALLPB absolute branch address): Silicon Doc, silicon-doc-text.txt:889"
      - "branches_in_skipf_sequences (after an absolute-address branch): Silicon Doc, silicon-doc-text.txt:891"
      - "interrupts (ISR during a skipping sequence): Silicon Doc, silicon-doc-text.txt:780, :791"

common_patterns:
  conditional_block:
    code: |
      CMP value, threshold WC
      IF_C SKIP #%1111        ' Skip next 4 if C set
        ADD accumulator, value
        SHL value, #1
        OR flags, #PROCESSED
        CALL #process
    description: "Multi-instruction conditional (SKIP runs only if C is set)"

  sparse_execution:
    code: |
      SKIPF sparse_pattern
      ' Up to 32 instructions with selective execution
      ' Based on runtime pattern
    description: "Runtime conditional pattern"

  conditional_sequence:
    code: |
      TEST flags, #MODE_MASK WZ
      IF_Z SKIP #%111000      ' LSB first: run 3, then skip 3
        MOV x, #1       ' Always runs
        MOV y, #2       ' Always runs
        MOV z, #3       ' Always runs
        MOV x, #10      ' Skipped if Z
        MOV y, #20      ' Skipped if Z
        MOV z, #30      ' Skipped if Z
    description: "Mode-based initialization: Z leaves 1,2,3; NZ (no SKIP) leaves 10,20,30"

  early_termination:
    code: |
      EXECF ##(%11_1111_1111_1111_1111_1100 << 10) | body
      ' ...at body, the first 2 instructions execute (pattern bits 0-1
      ' are 0) and the next 20 are skipped (bits 2-21 are 1)
    description: "Jump and skip in one instruction (EXECF pattern is 22 bits)"

execf_branching:
  concept: "Only EXECF carries a jump target; SKIP and SKIPF have none"
  encoding: "D[31:10] = skip pattern, D[9:0] = jump target"
  behavior: "The jump happens first; the pattern then applies from the target. SKIPF does not branch."
  examples:
    - |
      ' Jump to next_section and skip its 2nd and 4th instructions
      EXECF ##(%1010 << 10) | next_section

benefits:
  - "One static instruction sequence serves many variants: the silicon doc's 9-instruction 'addr' sequence realizes 36 address calculations, one pattern each"
  - "SKIPF/EXECF in cog/LUT step over skipped instructions with no clock penalty, except the two cancel cases"
# Sources: benefits: Silicon Doc, silicon-doc-text.txt:802-836 ('addr' sequence); silicon-doc-text.txt:776, :876-881 (cancel cases)

limitations:
  - "SKIP/SKIPF patterns cover the next 32 instructions; EXECF's pattern is 22 bits"
  - "SKIPF and EXECF skip only in cog/LUT memory; SKIPF in hub exec reverts to SKIP behavior"
  - "Skipping works only outside interrupt service routines"
  - "SKIPF with REP only when every pattern gives the same instruction count"
# Sources: limitations: Silicon Doc, silicon-doc-text.txt:776, :864 (pattern sizes); silicon-doc-text.txt:793, :856 (cog/LUT only, hub exec reverts to SKIP); silicon-doc-text.txt:780 (outside ISRs); silicon-doc-text.txt:885 (SKIPF with REP)

debugging:
  inspecting_skip_state:
    - "GETBRK D WZ returns the 32-bit SKIP/SKIPF/EXECF/XBYTE pattern in D; Z = 1 if no pattern is queued"
    - "GETBRK D WC returns C = pattern LSB, D[31:28] = CALL depth since the skip started (skipping suspended if not %0000), D[27] = 1 for SKIP mode or 0 for SKIPF/EXECF/XBYTE mode"
  sources:
    - "GETBRK D WZ pattern: Silicon Doc, silicon-doc-text.txt:2587-2593"
    - "GETBRK D WC fields: Silicon Doc, silicon-doc-text.txt:2557-2564"

references:
  - silicon_doc: Instruction Skipping section
  - silicon_doc: Special SKIPF Branching Rules
  - optimization_guide: Branch-free programming