concept: execution_modes
title: P2 Execution Modes - Register, Lookup, and Hub
category: core_architecture
description: Three distinct memory spaces where code can execute with different performance characteristics

overview: |
  The P2 supports three execution modes based on where instructions are fetched from: Register (cog RAM),
  Lookup (LUT RAM), and Hub (shared memory). Each mode has unique performance characteristics, capacity
  limits, and use cases. Code can seamlessly transition between modes using branches and calls.

execution_modes:
  register_execution:
    name: "Register Execution (cogexec)"
    memory: "Cog RAM"
    address_range: "$000-$1FF (0-511)"
    capacity: "512 longs (2KB)"
    performance:
      - typical_instruction: "2 clocks (deterministic) for ALU ops (ADD, MOV, etc.)"
      - branch_instruction: "4 clocks (JMP, CALL, RET)"
      - deterministic: "Always 2 clocks per typical instruction; no hub-window dependency"
      - pipeline: "Full speed, no stalls"
    characteristics:
      - "Fastest deterministic execution mode"
      - "Completely deterministic timing"
      - "Limited to 512 instructions"
      - "Private to each cog"
      - "Can read/write itself as data"
    typical_uses:
      - "Time-critical drivers"
      - "Interrupt handlers"
      - "Inner loops"
      - "Real-time control"
    entry: "JMP/CALL to $000-$1FF"

  lookup_execution:
    name: "Lookup Execution (lutexec)"
    memory: "LUT RAM"
    address_range: "$200-$3FF (512-1023)"
    capacity: "512 longs (2KB)"
    performance:
      - typical_instruction: "2 clocks (deterministic) for ALU ops"
      - branch_instruction: "4 clocks (JMP, CALL, RET)"
      - deterministic: "Always 2 clocks per typical instruction; no hub-window dependency"
      - pipeline: "Full speed, no stalls"
    characteristics:
      - "Same speed as register execution"
      - "Completely deterministic timing"
      - "Additional 512 instructions"
      - "Private to each cog"
      - "Can be used as data lookup table"
      - "Shared with streamer/colorspace operations"
    typical_uses:
      - "Extension of cog code space"
      - "Lookup tables (when not executing)"
      - "Fast subroutines"
      - "Code that needs cog+LUT space"
    entry: "JMP/CALL to $200-$3FF"

  hub_execution:
    name: "Hub Execution (hubexec)"
    memory: "Hub RAM"
    address_range: "$00400-$FFFFF (1024-1048575) — cannot host hubexec at $00000-$003FF"
    capacity: "512KB total hub memory"
    performance:
      - sequential_instruction: "2 clocks per instruction (FIFO streaming — SAME as cogexec)"
      - branch_instruction: "Minimum 13 clocks (+1 if target not long-aligned) per Silicon Doc HUB EXECUTION"
      - egg_beater: "8-cycle hub rotation per slot, 8 cogs"
      - fifo_depth: "(cogs+11) = 19 stages on 8-cog P2 (Silicon Doc verbatim)"
      - fifo_refill_threshold: "Loads continuously when fewer than (cogs+7) = 15 stages filled"
      - typical_for_streaming_code: "2 clocks per instruction — IDENTICAL to cogexec"
      - typical_for_branch_heavy_code: "Body cost + 13+ clocks per branch"
    characteristics:
      - "Large code space"
      - "Shared between all cogs"
      - "Sequential timing matches cogexec; branch timing non-deterministic (FIFO refill window)"
      - "19-stage prefetch FIFO ensures sequential code runs at full pipeline speed"
      - "Can execute very large programs"
    forbidden_instructions:
      rationale: "FIFO is dedicated to instruction prefetch in hubexec"
      list: ["RDFAST", "WRFAST", "FBLOCK", "RFBYTE", "RFWORD", "RFLONG", "RFVAR", "RFVARS", "WFBYTE", "WFWORD", "WFLONG", "XINIT", "XZERO", "XCONT (when streamer engages FIFO)", "REP", "ALTI as instruction-stream modifier"]
      source: "Silicon Doc v35 HUB EXECUTION section"
    typical_uses:
      - "Application logic"
      - "High-level code"
      - "Large programs"
      - "Non-timing-critical code"
    entry: "JMP/CALL to $400+"

mode_transitions:
  cog_to_hub:
    trigger: "JMP/CALL to address >= $400"
    example: |
      ' In cog execution
      JMP #\$1000       ' Jump to hub execution
      CALL #@hub_func   ' Call hub function
    return: "RET with hub return address"

  hub_to_cog:
    trigger: "JMP/CALL to address < $400"
    example: |
      ' In hub execution
      JMP #\$100        ' Jump to cog execution
      CALL #@cog_func   ' Call cog function
    return: "RET with cog return address"

  lut_transitions:
    to_lut: "JMP/CALL to $200-$3FF"
    from_lut: "Same as cog transitions"
    example: |
      JMP #$200         ' Enter LUT execution
      CALL #$300        ' Call LUT routine

performance_comparison:
  # All numbers cross-checked against Silicon Doc v35 and per-instruction YAMLs.
  instruction_timing:
    register_exec: "2 clocks per typical ALU instruction (deterministic)"
    lookup_exec: "2 clocks per typical ALU instruction (deterministic)"
    hub_exec_sequential: "2 clocks per instruction (FIFO streaming — SAME as cog/LUT)"
    hub_exec_branch: "Minimum 13 clocks (+1 if target not long-aligned)"

  branch_penalties:
    within_cog: "4 clocks total for the branch instruction (per jmp/call/ret YAMLs)"
    within_lut: "4 clocks total for the branch instruction"
    within_hub: "Minimum 13 clocks (+1 if target not long-aligned). Range 13-20 in YAML; minimum 13 per Silicon Doc verbatim."
    cog_to_hub: "Minimum 13 clocks (entering hub-exec triggers FIFO load)"
    hub_to_cog: "4 clocks (cog branch timing, no FIFO concern)"

  determinism:
    cog_lut: "100% deterministic for ALU ops; branches always 4 clocks"
    hub: "Sequential code is deterministic at 2 clocks/instruction; branch refill cost depends on hub-window alignment (13 minimum, +1 if not long-aligned, +up to ~6 hub-window slip)"

memory_organization:
  address_space:
    $000_$1FF: "Cog RAM (register execution)"
    $200_$3FF: "LUT RAM (lookup execution)"
    $400_$7FFFF: "Hub RAM (hub execution)"
    $80000_$FFFFF: "Usually ROM/Boot (hub execution)"

  overlapping_uses:
    cog_ram:
      - "Instructions (when executing)"
      - "Data storage"
      - "Self-modifying code"
    lut_ram:
      - "Instructions (when executing)"
      - "Lookup tables"
      - "Streamer data"
      - "HDMI color tables"

fifo_operation:
  hub_execution_fifo:
    purpose: "Prefetch hub instructions for hubexec"
    depth: "(cogs+11) = 19 stages on 8-cog P2 (Silicon Doc v35 verbatim)"
    refill_threshold: "Loads continuously when fewer than (cogs+7) = 15 stages filled"
    overflow_margin: "After threshold reached, up to 5 more longs may stream in, potentially filling all (cogs+11) stages"
    operation:
      - "Automatically prefetches during hub execution at 2-clock instruction throughput"
      - "Reloads on branches at minimum 13-clock cost (+1 if target not long-aligned)"
      - "In hubexec, FIFO is dedicated to instruction prefetch — cannot also be used for streamer transfers"
    control_in_cogexec_only:
      - "RDFAST to configure for streamer reads"
      - "WRFAST to configure for streamer writes"
      - "FBLOCK for block operations"
      - "These FIFO control instructions are FORBIDDEN in hubexec"
    source: "Silicon Doc v35 HUB EXECUTION + FAST SEQUENTIAL FIFO INTERFACE sections"

code_organization:
  mixed_mode:
    strategy: "Combine modes for optimal performance"
    example: |
      ' Hub execution for main logic
      main_loop:
        CALL #\critical_driver  ' Call cog routine
        ' Non-critical processing
        JMP #@main_loop
      
      ' Cog execution for timing-critical
      ORG 0
      critical_driver:
        ' Deterministic code here
        RET

  loading_code:
    to_cog: |
      SETQ2 #511              ' Load 512 longs
      RDLONG 0, hub_addr      ' Load cog RAM from hub
    to_lut: |
      SETQ2 #511              ' Load 512 longs  
      RDLONG $200, hub_addr   ' Load LUT RAM from hub

best_practices:
  mode_selection:
    - "Use cog/LUT for timing-critical code"
    - "Use hub for large programs"
    - "Keep interrupt handlers in cog"
    - "Use LUT for fast lookup tables"

  optimization:
    - "Align hub code to long boundaries"
    - "Group related hub code for FIFO efficiency"
    - "Minimize mode transitions in hot paths"
    - "Use REP loops in cog/LUT for speed"

  memory_usage:
    - "Reserve cog space for drivers"
    - "Use LUT for extended cog code"
    - "Keep frequently-called functions in cog/LUT"
    - "Use hub for application logic"

debugging:
  mode_awareness:
    - "PC indicates current mode"
    - "$000-$3FF = cog/LUT execution"
    - "$400+ = hub execution"
    - "Return addresses encode mode"

  timing_analysis:
    - "Cog/LUT timing is predictable"
    - "Hub timing varies with access patterns"
    - "Use CT registers for measurements"

references:
  - silicon_doc: Instruction Modes section
  - architecture_guide: Memory organization
  - optimization_guide: Execution mode selection