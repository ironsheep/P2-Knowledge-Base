concept: skipf_branching
title: Special SKIPF Branching Rules
category: control_flow
description: How SKIP, SKIPF and EXECF combine skipping with a branch (EXECF) or a RET prefix (_RET_ SKIP/SKIPF), and their rules

overview: |
  SKIP and SKIPF carry only a skip pattern in D; they carry no branch target. EXECF is the
  instruction that branches and skips at once: it jumps to D[9:0] in cog/LUT and starts a
  SKIPF using the 22-bit pattern D[31:10]. To branch before skipping with SKIP or SKIPF,
  precede it with _RET_ (see automatic_branch_before_skipping).

pattern_use:
  - "Pattern is used LSB-first: bit=1 skips (cancels) the next instruction, bit=0 executes it"
  - "The pattern is captured, then shifted right one bit for each instruction encountered"
  - "Skipping selects among up to the next 32 instructions (SKIP/SKIPF); EXECF's pattern is 22 bits"
  - "SKIPF and EXECF skip only in cog/LUT memory; SKIP skips in hub and cog/LUT memory"

execf_encoding:
  format:
    bits_31_10: "SKIPF pattern (22 bits)"
    bits_9_0: "Jump address in cog/LUT (0-1023)"
  syntax: "EXECF ##(pattern << 10) | target"
  example: |
    EXECF ##(%1100110011 << 10) | next_phase
  note: "Performs a JMP and a SKIPF at the same time (10-bit branch address from D[9:0], 22-bit skip pattern from D[31:10])"

automatic_branch_before_skipping:
  description: "Both SKIP and SKIPF can be preceded by _RET_ for an automatic branch before skipping commences"
  example: |
    PUSH #addr              ' point to the addr routine
    _RET_ SKIPF pat         ' jump to addr and begin skipping fast using pat

branch_timing:
  pattern_execution:
    - "Each instruction encountered uses one pattern bit"
    - "SKIPF leaps over skipped instructions in cog/LUT memory with no clock penalty"
    - "SKIPF used in hub exec reverts to SKIP behavior: skipped instructions are canceled in the pipeline instead of stepped over"
    - "Canceled instructions become 2-clock NOPs"
    - "SKIPF/EXECF must cancel (2-clock NOP) instead of stepping over when the first instruction after the SKIPF/EXECF is skipped (pattern LSB = 1), or when the 8th instruction in a row is skipped (only 7 can be stepped over at once)"
    - "Executed instructions: normal per-instruction timing"

  total_clocks:
    cog_lut_leap_case:
      formula: "sum of executed instructions' clocks + 0 per leaped-over instruction"
      example: |
        ' Pattern %10101010 (4 executed, 4 skipped) in cog/LUT, 2-clock instructions
        ' Total: 4 x 2 + 0 x 4 = 8 clocks (no cancel case in this pattern)
    cancel_case_or_hub_exec:
      formula: "sum of executed instructions' clocks + 2 per canceled instruction"
      example: |
        ' Pattern %10101010 (4 executed, 4 skipped) in hub-exec, 2-clock instructions
        ' Total: 4 x 2 + 4 x 2 = 16 clocks

advanced_patterns:
  bytecode_dispatch:
    code: |
      REP   #1, #8            ' pre-stuff 8-level hardware stack with 'loop' address
      PUSH  #loop             ' all RETs without CALLs will branch to 'loop'

      loop  RFBYTE i          ' get a bytecode
            RDLUT  e, i       ' lookup long in LUT
            EXECF  e          ' jump to e[9:0] and SKIPF e[31:10], RETs branch to 'loop'
    description: "Each LUT long holds a routine address in its 10 LSBs and a 22-bit SKIPF pattern in its 22 MSBs; one table entry selects both the routine and which of its instructions run"

  shared_sequence_selection:
    code: |
      SKIPF pat               ' pat = %001_110_110 executes 4 of 9 instructions
      addr  RFBYTE m          ' offset - one of RFBYTE/RFWORD/RFLONG
            RFWORD m
            RFLONG m
            ADD    m, pbase   ' base - one of three
            ADD    m, vbase
            ADD    m, dbase
            SHL    i, #1      ' index - zero to two of these three
            SHL    i, #2
            ADD    m, i
    description: "One static instruction sequence realizes many variants; the pattern picks the instructions to execute"

interaction_rules:
  with_interrupts:
    - "Skipping only works outside of interrupt service routines (in main code)"
    - "An interrupt service routine executes normally during a skipping sequence; the skipping sequence resumes upon its completion"

  with_call:
    - "A CALL/CALLPA/CALLPB that is not skipped executes all its nested subroutines normally; skipping is suspended until after the RET/_RET_"
    - "In SKIPF sequences, CALL/CALLPA/CALLPB immediate (#) branch addresses must be absolute when the instruction after the call might be skipped (CALL can use '#\\address'; CALLPA/CALLPB cannot, but can use registers)"
    - "For non-CALL branches, SKIPF works through all immediate-relative branches (the cog/LUT default)"
    - "With an absolute-address branch (#\\label, register, or RET), the first instruction after the branch must not be skipped"

  with_rep:
    - "SKIP is fully compatible with REP, since SKIP only cancels instructions and REP keeps accurate instruction counts"
    - "SKIPF works with REP only if every SKIPF pattern results in the same instruction count, which REP must then be initiated with (not just the length of code)"

code_layout:
  - "SKIPF and EXECF skip only in cog/LUT memory; place their code and EXECF targets there"
  - "The bytecode translation table for EXECF consists of longs (10 LSBs = cog/LUT jump address, 22 MSBs = SKIPF pattern)"

inspecting_skip_state:
  - "GETBRK D WZ returns the 32-bit SKIP/SKIPF/EXECF/XBYTE pattern in D (Z = 1 if no pattern is queued)"
  - "GETBRK D WC returns C = LSB of the pattern; D[31:28] = CALL depth since the skip started (skipping suspended if not %0000); D[27] = 1 for SKIP mode, 0 for SKIPF/EXECF/XBYTE mode"

pipeline_and_branch_facts:
  - "Branch instructions flush the pipeline, so the first instruction following a branch takes at least four clock cycles"
  - "Branching to a hub address takes a minimum of 13 clock cycles (one more if the target is not long-aligned)"

common_errors:
  wrong_pattern_layout:
    - "EXECF pattern is D[31:10] (22 bits), not 10 bits"
    - "EXECF jump address is D[9:0]; SKIP and SKIPF have no address field"
    - "Build EXECF values as (pattern << 10) | target"

  skipf_in_hub_exec:
    - "SKIPF in hub exec reverts to SKIP behavior (cancels instead of stepping over)"

references:
  - silicon_doc: INSTRUCTION SKIPPING and Special SKIPF Branching Rules sections
  - silicon_doc: GETBRK
  - language/pasm2/skipf.yaml
  - language/pasm2/execf.yaml