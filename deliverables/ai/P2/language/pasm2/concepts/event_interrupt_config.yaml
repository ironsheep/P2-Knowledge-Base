concept: event_interrupt_configuration
title: Event and Interrupt Configuration
category: event_handling
description: Hardware event detection and interrupt handling with three program-visible interrupts, a hidden debug interrupt, and 16 event sources
documentation_source: enhanced
documentation_level: comprehensive

overview: |
  P2 provides sophisticated event and interrupt handling with 16 selectable event sources per cog,
  three program-visible interrupts with dedicated vectors, and both polling and interrupt-driven
  responses. A fourth, hidden debug interrupt sits above all three and is inaccessible to normal
  cog programs.
  Events can trigger interrupts, wake from WAIT, or be polled. Each cog has independent event configuration.
  
  Debug infrastructure uses interrupts extensively for breakpoints and single-stepping.

interrupt_system:
  interrupt_levels:
    INT0:
      priority: "Highest - above all three program-visible interrupts"
      vector: "IJMP0"
      return: "RETI0 or RESI0"
      reserved_use: "The hidden debug interrupt"
      critical_note: >-
        INT0 is NOT a program-visible interrupt level. It is the debug interrupt, inaccessible to
        normal cog programs and enabled per cog via HUBSET. During a debug ISR the read-only INA
        and INB registers become readable/writable and are named IJMP0 and IRET0; IJMP0 is
        initialized to $1F8 on COGINIT, the debug-ISR-entry routine in the cog-register ROM.
        Used by the Spin2 debugger infrastructure.

    INT1:
      priority: "Highest of the three program-visible interrupts - can interrupt INT2 and INT3"
      vector: "IJMP1"
      return: "RETI1 or RESI1"
      typical_use: "Timer interrupts"

    INT2:
      priority: "Middle - can interrupt INT3"
      vector: "IJMP2"
      return: "RETI2 or RESI2"
      typical_use: "Pin events, Smart Pin ready"

    INT3:
      priority: "Lowest - can interrupt only non-interrupt code"
      vector: "IJMP3"
      return: "RETI3 or RESI3"

  interrupt_operations:
    SETINT1:
      syntax: "SETINT1 #event"
      operation: "Configure INT1 event source"
      example: "SETINT1 #1  ' INT1 triggered by event 1"
      
    SETINT2:
      syntax: "SETINT2 #event"
      operation: "Configure INT2 event source"
      
    SETINT3:
      syntax: "SETINT3 #event"
      operation: "Configure INT3 event source"

    STALLI:
      syntax: "STALLI"
      operation: "Stall interrupts (disable)"
      use: "Critical sections"
      
    ALLOWI:
      syntax: "ALLOWI"
      operation: "Allow interrupts (enable)"
      use: "Exit critical section"
    
    NIXINT1_3:
      syntax: "NIXINT1/2/3"
      operation: "Cancel pending interrupt"
      debug_use: "Clear pending debug interrupts"

  return_instructions:
    RETI0_3:
      syntax: "RETI0/1/2/3 {WC/WZ/WCZ}"
      operation: "Return from interrupt, restore C/Z if specified"
      behavior: "Pop address from internal stack, restore flags"
      example: "RETI1 WCZ  ' Return and restore both flags"
      
    RESI0_3:
      syntax: "RESI0/1/2/3"
      operation: "Resume from interrupt (continue interrupted code)"
      behavior: "Like RETI but continues interrupted instruction"
      use: "For interrupts that don't fully handle event"

event_sources:
  selectable_events:
    0: "Never (disabled)"
    1: "CT-passed-CT1 (CT >= CT1)"
    2: "CT-passed-CT2 (CT >= CT2)"
    3: "CT-passed-CT3 (CT >= CT3)"
    4: "SE1 event occurred"
    5: "SE2 event occurred"
    6: "SE3 event occurred"
    7: "SE4 event occurred"
    8: "Pin pattern match or mismatch occurred, established by SETPAT"
    9: "Hub RAM FIFO interface wrapped and reloaded, established by RDFAST/WRFAST/FBLOCK"
    10: "Streamer is ready for another command, established by XINIT/XZERO/XCONT"
    11: "Streamer ran out of commands, established by XINIT/XZERO/XCONT"
    12: "Streamer NCO rolled over, established by XINIT/XZERO/XCONT"
    13: "Streamer read location $1FF of lookup RAM"
    14: "Attention requested by other cog(s)"
    15: "GETQX/GETQY executed without any CORDIC results available or in progress"

  event_configuration:
    SETSE1:
      syntax: "SETSE1 #mode"
      operation: "Configure selectable event 1"
      modes: "Pin edge, state, Smart Pin ready, etc."
      
    SETSE2:
      syntax: "SETSE2 #mode"
      operation: "Configure selectable event 2"
      
    SETSE3:
      syntax: "SETSE3 #mode"
      operation: "Configure selectable event 3"
      
    SETSE4:
      syntax: "SETSE4 #mode"
      operation: "Configure selectable event 4"

  pattern_detection:
    SETPAT:
      syntax: "SETPAT mask, match"
      operation: "Configure pin pattern detection"
      use: "Trigger on specific pin combinations"
      
    ADDCT1_3:
      syntax: "ADDCT1/2/3 value, #delta"
      operation: "Set timer compare value"
      use: "Schedule future events"

event_operations:
  polling:
    POLLATN:
      syntax: "POLLATN {WC}"
      operation: "Poll for attention, clear if set"
      
    POLLCT1_3:
      syntax: "POLLCTx {WC}"
      operation: "Poll for CT >= CTx"
      
    POLLPAT:
      syntax: "POLLPAT {WC}"
      operation: "Poll for pin pattern"
      
    POLLSE1_4:
      syntax: "POLLSEx {WC}"
      operation: "Poll selectable event"

  waiting:
    WAITINT:
      syntax: "WAITINT"
      operation: "Wait for any interrupt"
      
    WAITCT1:
      syntax: "WAITCT1"
      operation: "Wait for CT >= CT1"
      
    WAITCT2:
      syntax: "WAITCT2"
      operation: "Wait for CT >= CT2"
      
    WAITCT3:
      syntax: "WAITCT3"
      operation: "Wait for CT >= CT3"
      
    WAITPAT:
      syntax: "WAITPAT"
      operation: "Wait for pin pattern"
      
    WAITSE1_4:
      syntax: "WAITSEx"
      operation: "Wait for selectable event x"
      
    WAITATN:
      syntax: "WAITATN"
      operation: "Wait for attention signal"

interrupt_context:
  saved_on_interrupt:
    - "PC (program counter)"
    - "C flag"
    - "Z flag"
    - "Execution mode (cog/LUT/hub)"
    
  not_saved:
    - "General registers"
    - "PTRA/PTRB"
    - "Q register"
    - "Must be saved by ISR if needed"

  context_preservation:
    code: |
      isr1
        ' Save registers if needed
        PUSHA work_reg
        ' ISR body
        POPA work_reg
        RETI1 WCZ        ' Restore flags

common_patterns:
  timer_interrupt:
    code: |
      ' Setup timer interrupt
      GETCT base_time
      ADDCT1 base_time, ##period
      MOV IJMP1, ##timer_isr
      SETINT1 #1       ' CT >= CT1
      
      timer_isr
        ' Handle timer
        ADDCT1 base_time, ##period  ' Next interval
        ' Timer processing
        RETI1
    description: "Periodic timer interrupt"

  pin_event:
    code: |
      ' Setup pin edge detection
      SETSE1 #%01_000000 | pin  ' Rising edge on pin
      MOV IJMP2, ##pin_handler
      SETINT2 #4       ' SE1 event
      
      pin_handler
        ' Handle pin event
        AKPIN pin        ' Acknowledge Smart Pin
        RETI2
    description: "Pin change interrupt"

  attention_handler:
    code: |
      ' Setup attention interrupt
      MOV IJMP3, ##atn_handler
      SETINT3 #12      ' ATN event
      
      atn_handler
        ' Check which cog sent ATN
        POLLATN WC
        ' Process message
        RETI3
    description: "Inter-cog communication"

  critical_section:
    code: |
      STALLI           ' Disable interrupts
      ' Critical code that must not be interrupted
      ' Access shared resources
      ALLOWI           ' Re-enable interrupts
    description: "Interrupt-safe code section"

priority_and_nesting:
  priority_rules:
    - "INT1 has the highest program-visible priority and can interrupt INT2 and INT3"
    - "INT2 has the middle priority and can interrupt INT3"
    - "INT3 has the lowest priority and can interrupt only non-interrupt code"
    - "Same level cannot interrupt itself"
    - "The hidden debug interrupt (INT0) has priority over all three"
    
  nesting_depth:
    - "Maximum 4 levels deep - the three program-visible interrupts plus the debug interrupt"
    - "Each level has own return address"
    - "Flags saved per level"
    - "Debug ISR must handle full nesting"

  dispatch:
    mechanism: |
      Silicon Doc v35 verbatim: "Interrupt branches are realized, internally,
      by inserting a 'CALLD IRETx,IJMPx WCZ' into the instruction pipeline
      while holding the program counter at its current value, so that the
      interrupt later returns to the address saved in IRETx."
    entry_overhead_cogexec: "4 clocks (per language/pasm2/calld.yaml encoding)"
    entry_overhead_hubexec: "13-20 clocks (FIFO refill on the branch)"
    exit_overhead: "Same as entry (RETIx/RESIx are CALLD instructions)"
    deferral_conditions: "See architecture/interrupts.yaml deferral_conditions; the branch is held off during ALTxx/SETQ/SETQ2/REP/STALLI/WAITx/AUGS/AUGD/XBYTE/etc."
    factors:
      - "Current instruction completion (deferral conditions)"
      - "Higher priority interrupts in flight"
      - "Execution mode (cog vs hub)"

best_practices:
  interrupt_design:
    - "Keep ISRs short and fast"
    - "Save/restore only needed registers"
    - "Use CALLA/CALLB in ISR for leaf functions"
    - "Clear event sources in ISR"
    - "Test with all interrupt combinations"
    - "Leave the debug interrupt to the debugger: it is the hidden INT0, not INT3, and is enabled per cog via HUBSET"
    
  event_selection:
    - "Use polling for non-critical events"
    - "Use interrupts for time-critical events"
    - "Configure before enabling interrupts"
    - "Document event assignments clearly"
    - "Use lock[15] with debug interrupts"
    
  debugging:
    - "Add markers at ISR entry/exit"
    - "Track interrupt nesting depth"
    - "Verify flag preservation"
    - "Test maximum interrupt rate"
    - "Use GETBRK to identify debug context"

limitations:
  - "Only 4 interrupt levels"
  - "16 event sources per cog"
  - "No interrupt priority modification"
  - "Cannot interrupt AUGS/AUGD pairs"
  - "REP blocks delay interrupts"
  - "SETQ blocks are atomic"
  - "Debug ISR size limited by COG RAM"

references:
  - silicon_doc: Events and Interrupts section
  - instruction_set: Event/Interrupt instructions
  - application_notes: Interrupt handling patterns