concept: event_interrupt_configuration
title: Event and Interrupt Configuration
category: event_handling
description: Hardware event detection and interrupt handling with three program-visible interrupts, a hidden debug interrupt, and 16 event sources
documentation_source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), Events; Parallax Propeller 2 Documentation v35 (Rev B/C silicon), Interrupts"
documentation_level: comprehensive

overview: |
  Each cog tracks 16 events, numbered 0..15 (four of them selectable, SE1..SE4), and has
  three program-visible interrupts with dedicated vectors; an event can be polled, waited for,
  branched on, or used as an interrupt source. A fourth, hidden debug interrupt sits above all
  three and is inaccessible to normal cog programs.
  Each cog has independent event configuration.

  The debug interrupt provides breakpoints and single-stepping.

interrupt_system:
  interrupt_levels:
    INT0:
      priority: "Highest - above all three program-visible interrupts"
      vector: "IJMP0"
      return: "RETI0 or RESI0"
      reserved_use: "The hidden debug interrupt"
      critical_note: >-
        INT0 is NOT a program-visible interrupt level. It is the debug interrupt, inaccessible to
        normal cog programs and enabled per cog via HUBSET. During a debug ISR the read-only INA
        and INB registers become readable/writable and are named IJMP0 and IRET0; IJMP0 is
        initialized to $1F8 on COGINIT, the debug-ISR-entry routine in the cog-register ROM.

    INT1:
      priority: "Highest of the three program-visible interrupts - can interrupt INT2 and INT3"
      vector: "IJMP1"
      return: "RETI1 or RESI1"

    INT2:
      priority: "Middle - can interrupt INT3"
      vector: "IJMP2"
      return: "RETI2 or RESI2"

    INT3:
      priority: "Lowest - can interrupt only non-interrupt code"
      vector: "IJMP3"
      return: "RETI3 or RESI3"

  interrupt_operations:
    SETINT1:
      syntax: "SETINT1 #event"
      operation: "Configure INT1 event source"
      example: "SETINT1 #1  ' INT1 triggered by event 1"
      
    SETINT2:
      syntax: "SETINT2 #event"
      operation: "Configure INT2 event source"
      
    SETINT3:
      syntax: "SETINT3 #event"
      operation: "Configure INT3 event source"

    STALLI:
      syntax: "STALLI"
      operation: "Stall interrupt branches indefinitely until ALLOWI executes"
      use: "Critical sections"
      
    ALLOWI:
      syntax: "ALLOWI"
      operation: "Allow any stalled and future interrupt branches to occur"
      use: "Exit critical section"
    
    NIXINT1_3:
      syntax: "NIXINT1/2/3"
      operation: "Cancel a triggered interrupt that is waiting to branch"
      use: "Only useful in main code after STALLI executes, or in an ISR which needs to stop a lower-level interrupt from executing after the current ISR exits"

  return_instructions:
    RETI0_3:
      syntax: "RETI0/1/2/3"
      operation: "Return from an interrupt service routine; the interrupted address, C and Z are restored"
      behavior: "RETIx is the alias CALLD INB,IRETx WCZ (RETI0: CALLD INB,INB WCZ): it jumps to the address saved in IRETx, restores C and Z from it, and clears the cog's interrupt-busy flag so another interrupt of that level can occur. It takes no WC/WZ/WCZ of its own"
      example: "RETI1  ' Return from the INT1 service routine"

    RESI0_3:
      syntax: "RESI0/1/2/3"
      operation: "Return from the interrupt, but resume this ISR at its next instruction when the next interrupt occurs"
      behavior: "RESIx is the alias CALLD IJMPx,IRETx WCZ (RESI0: CALLD INA,INB WCZ): it returns to the interrupted code, restores C and Z from IRETx, and writes the ISR's next address into IJMPx, so the next interrupt continues after the RESI instead of at the start of the ISR (RETIx leaves IJMPx unchanged)"

event_sources:
  interrupt_sources:
    0: "<off>, the default on cog start"
    1: "CT-passed-CT1"
    2: "CT-passed-CT2"
    3: "CT-passed-CT3"
    4: "SE1 event occurred"
    5: "SE2 event occurred"
    6: "SE3 event occurred"
    7: "SE4 event occurred"
    8: "Pin pattern match or mismatch occurred, established by SETPAT"
    9: "Hub RAM FIFO interface wrapped and reloaded, established by RDFAST/WRFAST/FBLOCK"
    10: "Streamer is ready for another command, established by XINIT/XZERO/XCONT"
    11: "Streamer ran out of commands, established by XINIT/XZERO/XCONT"
    12: "Streamer NCO rolled over, established by XINIT/XZERO/XCONT"
    13: "Streamer read location $1FF of lookup RAM"
    14: "Attention requested by other cog(s). A COGATN that names this cog's own bit also sets its attention event flag. Not documented: whether that self strobe also triggers this interrupt"
    15: "GETQX/GETQY executed without any CORDIC results available or in progress"

  event_configuration:
    SETSE1:
      syntax: "SETSE1 #mode"
      operation: "Configure selectable event 1"
      modes: "LUT read/write, hub lock rise/fall/change, INA/INB bit of a pin rises/falls/changes/is low/is high"
      
    SETSE2:
      syntax: "SETSE2 #mode"
      operation: "Configure selectable event 2"
      
    SETSE3:
      syntax: "SETSE3 #mode"
      operation: "Configure selectable event 3"
      
    SETSE4:
      syntax: "SETSE4 #mode"
      operation: "Configure selectable event 4"

  pattern_detection:
    SETPAT:
      syntax: "SETPAT mask, match"
      operation: "Configure pin pattern detection"
      use: "SETPAT clears the PAT event flag and sets the pattern; the flag is then set whenever (INA & D) != S (C=0, Z=0), (INA & D) == S (C=0, Z=1), (INB & D) != S (C=1, Z=0) or (INB & D) == S (C=1, Z=1)"

    ADDCT1_3:
      syntax: "ADDCT1/2/3 value, #delta"
      operation: "Add S into D and copy the result into the dedicated CTx target register; clear the CT-passed-CTx event flag"
      use: "The CT-passed-CTx event flag is set when CT passes the target"

event_operations:
  polling:
    POLLATN:
      syntax: "POLLATN {WC|WZ|WCZ}"
      operation: "Poll for attention, clear if set"
      
    POLLCT1_3:
      syntax: "POLLCTx {WC|WZ|WCZ}"
      operation: "Poll for CT passing CTx"
      
    POLLPAT:
      syntax: "POLLPAT {WC|WZ|WCZ}"
      operation: "Poll for pin pattern"
      
    POLLSE1_4:
      syntax: "POLLSEx {WC|WZ|WCZ}"
      operation: "Poll selectable event"

  waiting:
    WAITINT:
      syntax: "WAITINT"
      operation: "Wait for an interrupt (INT1, INT2 or INT3) to occur; stalls the cog to save power"
      
    WAITCT1:
      syntax: "WAITCT1"
      operation: "Wait for CT to pass CT1"
      
    WAITCT2:
      syntax: "WAITCT2"
      operation: "Wait for CT to pass CT2"
      
    WAITCT3:
      syntax: "WAITCT3"
      operation: "Wait for CT to pass CT3"
      
    WAITPAT:
      syntax: "WAITPAT"
      operation: "Wait for pin pattern"
      
    WAITSE1_4:
      syntax: "WAITSEx"
      operation: "Wait for selectable event x"
      
    WAITATN:
      syntax: "WAITATN"
      operation: "Wait for attention signal"

interrupt_context:
  saved_on_interrupt:
    - "PC (program counter)"
    - "C flag"
    - "Z flag"
    
  other_registers:
    - "Not documented: any automatic save of general registers or PTRA/PTRB"

  context_preservation:
    code: |
      isr1
        ' Save registers if needed
        PUSHA work_reg
        ' ISR body
        POPA work_reg
        RETI1            ' Restore flags and return (RETIx restores C and Z itself)

common_patterns:
  timer_interrupt:
    code: |
      ' Setup timer interrupt
      GETCT base_time
      ADDCT1 base_time, ##period
      MOV IJMP1, ##timer_isr
      SETINT1 #1       ' CT passed CT1
      
      timer_isr
        ' Handle timer
        ADDCT1 base_time, ##period  ' Next interval
        ' Timer processing
        RETI1
    description: "Periodic timer interrupt"

  pin_event:
    code: |
      ' Setup pin edge detection
      SETSE1 #%001_000000 | pin  ' INA/INB bit of pin rises
      MOV IJMP2, ##pin_handler
      SETINT2 #4       ' SE1 event

      pin_handler
        ' Handle pin event
        RETI2
    description: "Pin rising-edge interrupt"

  attention_handler:
    code: |
      ' Setup attention interrupt
      MOV IJMP3, ##atn_handler
      SETINT3 #14      ' ATN event
      
      atn_handler
        ' Clear the ATN event flag (C = 1 if it was set). Not documented: which cog requested attention
        POLLATN WC
        ' Process the request
        RETI3
    description: "Attention-requested interrupt. The ATN flag is set whenever any cog requests attention. Not documented: which cog requested attention."

  critical_section:
    code: |
      STALLI           ' Stall interrupt branches
      ' Code protected from INT1, INT2 and INT3 branches
      ' Access shared resources
      ALLOWI           ' Allow interrupt branches
    description: "Section protected from INT1, INT2 and INT3 branches; debug interrupts are non-stallable"

priority_and_nesting:
  priority_rules:
    - "INT1 has the highest program-visible priority and can interrupt INT2 and INT3"
    - "INT2 has the middle priority and can interrupt INT3"
    - "INT3 has the lowest priority and can interrupt only non-interrupt code"
    - "Same level cannot interrupt itself: while an interrupt is waiting to branch and while its ISR executes, intervening interrupt events at the same priority level are ignored; a new event is waited for once the ISR returns (architecture/interrupts.yaml priority_preemption.interrupt_states)"
    - "The hidden debug interrupt (INT0) has priority over all three"

  nesting_depth:
    - "The interrupt levels are the debug interrupt, INT1, INT2 and INT3; higher interrupts can interrupt lower ISRs"
    - "Not documented: a stated maximum nesting depth"
    - "Each level has own return address"
    - "Flags saved per level"

  dispatch:
    mechanism: |
      Interrupt branches are realized, internally, by inserting a
      'CALLD IRETx,IJMPx WCZ' into the instruction pipeline while holding the
      program counter at its current value, so that the interrupt later
      returns to the address saved in IRETx.
    entry_overhead_cogexec: "Not documented: a clock count for the interrupt branch (a CALLD instruction takes 4 clocks in cog/LUT execution)"
    entry_overhead_hubexec: "Not documented: a clock count for the interrupt branch (a CALLD instruction takes 13...20 clocks in hub execution)"
    exit_overhead: "RETIx/RESIx are CALLD instructions: 4 clocks cog/LUT, 13...20 hub"
    deferral_conditions: "See architecture/interrupts.yaml deferral_conditions; the branch is held off during ALTxx/SETQ/SETQ2/REP/STALLI/WAITx/AUGS/AUGD/XBYTE/etc."
    factors:
      - "Deferral conditions: ALTxx / CRCNIB / SCA / SCAS / GETCT+WC / GETXACC / SETQ / SETQ2 / XORO32 / XBYTE must not be executing; AUGS and AUGD must not be executing or waiting for their operand instruction; REP and STALLI must not be executing or active; the cog must not be stalled in any WAITx instruction"
      - "Priority once the conditions are met: INT1, then INT2, then INT3"

best_practices:
  interrupt_design:
    - "Same-level events that arrive while an ISR waits to branch or runs are ignored"
    - "The CALLD that realises the interrupt branch writes the return address and C/Z into IRETx. Not documented: any other automatic save"
    - "The debug interrupt is the hidden INT0, not INT3, and is enabled per cog via HUBSET; it was designed to operate without any cooperation from the program being debugged"

  event_selection:
    - "To set up an interrupt, its IJMP register is pointed to the ISR first; once the IJMPx register is configured, the interrupt is enabled with SETINTx"
    - "LOCK[15] is allocated by the debugger and used among all cogs during their debug interrupts (architecture/locks.yaml)"

  debugging:
    - "Inside a debug ISR, GETBRK D WCZ returns C = 1 if the debug interrupt came from a COGINIT"

limitations:
  - "Only 4 interrupt levels"
  - "16 event sources per cog"
  - "INT1 has the highest priority, then INT2, then INT3. Not documented: a way to change these priorities"
  - "An interrupt branch cannot occur while AUGS waits for its S/# instruction or AUGD for its D/# instruction"
  - "REP must not be executing or active before an interrupt branch can happen"
  - "SETQ/SETQ2 shields the next instruction from interruption"
  - "Debug ISR code runs strictly in cog register space"

sources:
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), EVENTS (16 events numbered 0..15; ADDCT1 copies D + S into a dedicated CT1 target register and clears the CT-passed-CT1 event flag; PAT and ATN set and clear rules: the ATN flag is set whenever any cogs request attention; WAITINT stalls the cog to save power)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), INTERRUPTS (priorities; IJMPx first, then SETINTx; RETIx and RESIx definitions; NIXINTx only useful in main code after STALLI or in an ISR stopping a lower-level interrupt; branch-deferral conditions; the three interrupt states with same-level events ignored during states 2 and 3)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), DEBUG INTERRUPT (RESI0 = CALLD INA,INB WCZ; GETBRK D WCZ in a debug ISR: C = 1 if from COGINIT; the debug ISR executes strictly in cog register space; the scheme operates without cooperation from the program being debugged)"
  - "P2 Instructions v35 - Rev B/C Silicon, POLLxxx rows ({WC/WZ/WCZ}), CALLD and RETIx/RESIx rows (4 cog/LUT, 13...20 hub), SETQ and SETQ2 rows (next instruction shielded from interrupt)"
  - "EF-099 (COGATN with the issuing cog's own bit raises that cog's attention event flag; event flag only, the attention interrupt path not tested)"
  - "Parallax Propeller 2 Spin2 Language Documentation v55, DEBUG (LOCK[15] is allocated by the debugger and used among all cogs during their debug interrupts)"