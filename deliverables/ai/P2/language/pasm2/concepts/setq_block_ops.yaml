concept: setq_block_operations
title: SETQ/SETQ2 Block Operations
category: memory_operations
description: Hardware-accelerated block memory transfers and operations using SETQ/SETQ2 prefixes
documentation_level: comprehensive
aliases:
  - "erratum E1"
  - "P2 erratum E1"
  - "E1 erratum"
  - "SETQ Block Transfers Lose Their Pointer Step"
  - "SETQ block PTRx step lost"

overview: |
  SETQ and SETQ2 are prefix instructions that modify the next instruction to perform block operations.
  They enable fast, hardware-accelerated transfers between hub and cog/LUT memory, block arithmetic,
  and multi-long operations. These are essential for efficient data movement and initialization.
  
  Critical for waveform tables, debug state preservation, and high-speed data processing.

silicon_errata:
  intervening_altx_augs_augd_cancels_ptrx_block_delta:
    severity: critical
    applies_to: "A SETQ/SETQ2 block RDLONG/WRLONG/WMLONG that uses a PTRx update expression (e.g. ptra++), with an ALTx, AUGS or AUGD between the SETQ/SETQ2 and the transfer"
    description: |
      An ALTx, AUGS, or AUGD instruction placed BETWEEN SETQ/SETQ2 and the block
      RDLONG/WRLONG/WMLONG cancels the special-case block-size PTRx delta. The expected
      number of longs still transfers, but PTRx is then modified only by the normal PTRx
      expression's own step (+4 for ptra++, +12 for ptra++[3]), NOT by N*4.
    example: |
      SETQ   #16-1            ' ready to load 16 longs
      ALTD   start_reg        ' alter start register -- this intervening ALTD CANCELS the block-size PTRx delta
      RDLONG 0, ptra++        ' ptra is incremented by 4 (1 long), NOT 16*4 as anticipated
    workaround: "Keep SETQ/SETQ2 immediately adjacent to the block transfer -- place no ALTx/AUGS/AUGD between them."
    status: "Active in Rev C silicon (current production)."
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), KNOWN SILICON BUGS. Hardware-verified on Rev C (EF-067): the whole block moves to the ALTD destination; ptra++ steps +4 and ptra++[3] +12, across PTRA/PTRB, RDLONG/WRLONG, SETQ2 and an 8-long block (only ALTD tested as the intervening instruction)."

setq_instructions:
  SETQ:
    function: "Set block count for cog RAM operations"
    syntax: "SETQ #count-1"
    range: "0-511 (transfer 1-512 longs)"
    target: "Cog RAM ($000-$1FF)"
    encoding: "9-bit immediate or register"
    example: |
      SETQ #15           ' Setup for 16 longs
      RDLONG 0, PTRA     ' Read 16 longs from hub to cog[0..15]

  SETQ2:
    function: "Set block count for LUT RAM operations"
    syntax: "SETQ2 #count-1"
    range: "0-511 (transfer 1-512 longs)"
    target: "LUT RAM ($200-$3FF in logical space)"
    encoding: "9-bit immediate or register"
    critical_note: "SETQ2 targets LUT, SETQ targets COG - don't confuse!"
    example: |
      SETQ2 #255         ' Setup for 256 longs
      RDLONG 0, PTRB     ' Read 256 longs from hub to LUT[0..255]
      ' Note: Use 0 for LUT start, not $200!

block_operations:
  hub_to_cog_transfer:
    instruction: "SETQ + RDLONG"
    operation: "Read multiple longs from hub to cog"
    syntax: |
      SETQ #count-1
      RDLONG first_cog_reg, hub_address
    timing: "One long per clock, unless the hub FIFO is accessing the same hub RAM slice on the same cycle"
    example: |
      SETQ #31           ' 32 longs
      RDLONG buffer, ##source_data
      ' Reads hub[source_data..source_data+127] to cog[buffer..buffer+31]
    debug_use: |
      ' Load the debugger into registers $004..$1F7
      setq    #$1F7-$004
      rdlong  $004, ##dbg_addr
    source: "Parallax Spin2/PASM Debugger v51 (2025.04.02), Debug ISR (debug_isr); timing: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), FAST BLOCK MOVES"

  cog_to_hub_transfer:
    instruction: "SETQ + WRLONG"
    operation: "Write multiple longs from cog to hub"
    syntax: |
      SETQ #count-1
      WRLONG first_cog_reg, hub_address
    timing: "One long per clock, unless the hub FIFO is accessing the same hub RAM slice on the same cycle"
    example: |
      SETQ #63           ' 64 longs
      WRLONG results, PTRA
      ' Writes cog[results..results+63] to hub[PTRA..PTRA+255]
    source: "timing: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), FAST BLOCK MOVES"

  hub_to_lut_transfer:
    instruction: "SETQ2 + RDLONG"
    operation: "Read multiple longs from hub to LUT"
    syntax: |
      SETQ2 #count-1
      RDLONG 0, hub_address  ' Use 0 for LUT start!
    critical_pattern: |
      ' Load complete waveform table to LUT
      load_sine_table
              mov     ptra, ##sine_table_hub
              setq2   #512-1          ' Full LUT
              rdlong  0, ptra         ' Load to LUT[0..511]
              ret
      
      ' Later access via RDLUT
              rdlut   value, phase    ' 3-clock lookup
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), FAST BLOCK MOVES (SETQ2 + RDLONG reads hub longs into lookup RAM)"

  lut_to_hub_transfer:
    instruction: "SETQ2 + WRLONG"
    operation: "Write multiple longs from LUT to hub"
    syntax: |
      SETQ2 #count-1
      WRLONG 0, hub_address  ' Use 0 for LUT start!
    debug_pattern: |
      ' Spin2 debugger: move hub longs in blocks of up to $100 through this cog's LUT
      .block  decod   pb,#8           'determine number of longs in block ($100 max)
              fle     pb,pa
              sub     pa,pb           'adjust remaining-longs count
              sub     pb,#1           'get long count - 1
              setq2   pb              'read block of longs
              rdlong  0,ptra++
              setq2   pb              'write block of longs
              wrlong  0,ptrb++
              _ret_   tjnz    pa,#.block      'another block?
    source: "Parallax Spin2/PASM Debugger v51 (2025.04.02), Debugger Setup, move routine ('Move pa bytes from @ptra to @ptrb')"

production_patterns:
  waveform_buffer_management:
    description: "Use LUT as waveform buffer"
    code: |
      ' Process audio/waveform data via LUT
      process_waveform
              ' Load samples to LUT for processing
              setq2   #128-1
              rdlong  0, sample_ptr
              
              ' Process in LUT (faster than HUB)
              mov     index, #0
      .loop   rdlut   sample, index
              ' Apply DSP operations
              sar     sample, #1      ' Volume control
              add     sample, dc_offset
              wrlut   sample, index
              incmod  index, #127
              tjnz    index, #.loop
              
              ' Write processed data back
              setq2   #128-1
              wrlong  0, output_ptr
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), FAST BLOCK MOVES (SETQ2 block transfer into and out of lookup RAM)"
    
special_operations:
  block_math:
    description: "SETQ modifies certain math operations"
    operations:
      MUXQ:
        syntax: "SETQ mask + MUXQ dest, source"
        operation: "dest = (dest & !mask) | (source & mask)"
        use: "Masked merge operation"
      
      COGINIT:
        syntax: "SETQ #ptra_ptrb + COGINIT #cog, #address"
        operation: "Initialize cog with PTRA/PTRB values"
        encoding: "PTRA[19:0] in bits 19:0, PTRB[19:0] in bits 39:20"

  full_width_q_value:
    description: |
      SETQ sets Q = D. With a register operand (or a ## immediate, which the
      assembler implements via AUGS), Q can hold a full 32-bit value. This matters
      for Q uses that need all 32 bits -- e.g. a MUXQ mask, or the packed PTRA/PTRB
      for SETQ+COGINIT.
    block_count_limit: |
      It does NOT extend a block-move COUNT beyond 512. SETQ/SETQ2 block transfers
      target cog register RAM or cog lookup RAM, each of which is 512 longs, so the
      maximum block transfer is 512 longs (count field = number of longs minus 1).
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), COG RAM, LOOKUP RAM (cog and LUT are each 512 x 32-bit longs); FAST BLOCK MOVES ('x = number of longs, minus 1')"

block_fill:
  cog_fill:
    instruction: "none"
    operation: "No SETQ block form fills cog registers with a value"
    note: "WRLONG/WMLONG write HUB memory, so SETQ + WRLONG cannot fill cog registers; SETQ + RDLONG copies hub longs INTO the cog."
    source: "note: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), FAST BLOCK MOVES"

  hub_fill:
    instruction: "SETQ + WRLONG/WMLONG with an immediate D"
    operation: "Fill hub memory with an immediate value"
    syntax: |
      SETQ #count-1
      WRLONG #value, hub_address
    example: |
      SETQ #15
      WRLONG #0, ##buffer_hub  ' Clear 16 hub longs
    note: "Only an immediate D fills; a register D writes that many cog-register longs to hub instead."
    source: "note: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), FAST BLOCK MOVES"

performance:
  transfer_rate: "One long per clock, unless the hub FIFO is accessing the same hub RAM slice on the same cycle (the FIFO gets priority and the block move waits for the slice to come around again)"
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), FAST BLOCK MOVES"
  lut_advantage: "After load, RDLUT reads a LUT long in 3 clocks and WRLUT writes one in 2"

  limitations:
    - "Maximum 512 longs per operation"
    - "Must be contiguous memory"
    - "Cannot cross cog/LUT boundary"
    - "Interrupts delayed during transfer"
    - "LUT addressing starts at 0, not $200 for SETQ2"

common_patterns:
  array_copy:
    code: |
      SETQ #array_size-1
      RDLONG dest_array, source_ptr
    description: "Copy entire array"

  buffer_clear:
    code: |
      SETQ #buffer_size-1
      WRLONG #0, #buffer_start
    description: "Clear buffer to zero"

  context_save:
    code: |
      SETQ #31              ' Save 32 registers
      WRLONG 0, context_ptr ' Save cog[0..31]
    description: "Save register context"

  context_restore:
    code: |
      SETQ #31              ' Restore 32 registers
      RDLONG 0, context_ptr ' Restore cog[0..31]
    description: "Restore register context"

  lut_table_load:
    code: |
      SETQ2 #255            ' Half of LUT
      RDLONG 0, ##sine_table ' Note: 0, not $200!
    description: "Load lookup table"

  fast_memcpy:
    code: |
      .copy_loop
        SETQ #127           ' 128 longs = 512 bytes
        RDLONG temp_buffer, src_ptr
        ADD src_ptr, ##512
        SETQ #127
        WRLONG temp_buffer, dst_ptr
        ADD dst_ptr, ##512
        DJNZ count, #.copy_loop
    description: "Fast memory copy routine"

advanced_usage:
  partial_transfers:
    description: "Transfer subset of registers"
    example: |
      MOV count, actual_size
      SUB count, #1
      SETQ count          ' Dynamic count
      RDLONG buffer, PTRA

  strided_access:
    description: "Cannot do strided - must be contiguous"
    workaround: "Use multiple SETQ operations"
    example: |
      ' Copy every 4th long
      MOV index, #0
      .loop
        RDLONG temp, source_ptr
        ADD source_ptr, #16    ' Skip 3 longs
        ALTD index, #buffer
        MOV 0-0, temp
        ADD index, #1
        DJNZ count, #.loop

  interrupt_blocking:
    description: "Block transfers are atomic"
    behavior: "Interrupts delayed until complete"
    consideration: "Keep transfers small for responsiveness"
    debug_impact: "Debug ISR must wait for completion"

debugging:
  verification:
    - "Check SETQ count is N-1, not N"
    - "Verify address alignment"
    - "Confirm no boundary crossing"
    - "Test with small counts first"
    - "Remember: LUT uses 0, not $200 with SETQ2"

  common_errors:
    off_by_one: "Using count instead of count-1"
    boundary_cross: "Transfer across cog/LUT boundary"
    wrong_prefix: "Swapping prefixes — SETQ2 is for LUT, SETQ for cog/hub"
    lut_addressing: "Using $200 instead of 0 with SETQ2"

best_practices:
  - "Always use count-1 in SETQ/SETQ2"
  - "Align transfers to long boundaries"
  - "Use for initialization and bulk copies"
  - "Consider interrupt latency impact"
  - "Document transfer sizes clearly"
  - "Test boundary conditions"
  - "Use LUT for frequently accessed tables"
  - "Preserve debug state with SETQ blocks"

references:
  - silicon_doc: SETQ/SETQ2 block operations
  - instruction_set: SETQ/SETQ2 encoding
  - "Parallax SPI Flash Programmer and Boot Loader v51, Loader (SETQ moves code from cog to hub) and Move application down to $00000+ (SETQ2 block copy)"
  - "Parallax Spin2/PASM Debugger v51, debug entry and debug_exit (SETQ saves and restores registers $010..$1F7 to the save buffer)"
  - optimization_guide: Fast memory transfers

