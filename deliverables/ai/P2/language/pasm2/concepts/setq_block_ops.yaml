concept: setq_block_operations
title: SETQ/SETQ2 Block Operations
category: memory_operations
description: Block memory transfers and operations using SETQ/SETQ2 prefixes
documentation_level: comprehensive
aliases:
  - "SETQ Block Transfers Lose Their Pointer Step"
  - "SETQ block PTRx step lost"

overview: |
  SETQ and SETQ2 set Q. Before RDLONG, WRLONG or WMLONG, SETQ invokes a block transfer between hub RAM and
  cog register RAM, and SETQ2 a block transfer between hub RAM and cog lookup RAM.

  Block moves yield to the hub FIFO interface, so they can be used during hub execution.
  A block RDLONG with WC/WZ/WCZ sets the flags according to the last long read in the
  sequence. Cog registers $1F8..$1FF are special-purpose registers which cannot be
  transferred to hub RAM via SETQ+WRLONG/WMLONG.

silicon_errata:
  intervening_altx_augs_augd_cancels_ptrx_block_delta:
    applies_to: "A SETQ/SETQ2 block RDLONG/WRLONG/WMLONG that uses a PTRx update expression (e.g. ptra++), with an ALTx, AUGS or AUGD between the SETQ/SETQ2 and the transfer"
    description: |
      An ALTx, AUGS, or AUGD instruction placed between SETQ/SETQ2 and the block
      RDLONG/WRLONG/WMLONG cancels the special-case block-size PTRx delta. The expected
      number of longs still transfers, but PTRx is then modified only by the normal PTRx
      expression's own step (+4 for ptra++, +12 for ptra++[3]), not by N*4.
    example: |
      SETQ   #16-1            ' ready to load 16 longs
      ALTD   start_reg        ' alter start register: the intervening ALTD cancels the block-size PTRx delta
      RDLONG 0, ptra++        ' ptra is incremented by 4 (1 long), not by 16*4
    workaround: "Keep SETQ/SETQ2 immediately adjacent to the block transfer -- place no ALTx/AUGS/AUGD between them."
    status: "Present in the Rev C silicon tested."
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), KNOWN SILICON BUGS. Hardware-verified on Rev C (EF-067): the whole block moves to the ALTD destination; ptra++ steps +4 and ptra++[3] +12, across PTRA/PTRB, RDLONG/WRLONG, SETQ2 and an 8-long block (only ALTD tested as the intervening instruction)."

setq_instructions:
  SETQ:
    function: "Set block count for cog RAM operations"
    syntax: "SETQ #count-1"
    range: "Number of longs minus 1. Not documented: the maximum count"
    target: "Cog RAM ($000-$1FF)"
    encoding: "9-bit immediate or register"
    example: |
      SETQ #15           ' Setup for 16 longs
      RDLONG 0, PTRA     ' Read 16 longs from hub to cog[0..15]

  SETQ2:
    function: "Set block count for LUT RAM operations"
    syntax: "SETQ2 #count-1"
    range: "Number of longs minus 1. Not documented: the maximum count"
    target: "Lookup RAM ($000-$1FF)"
    encoding: "9-bit immediate or register"
    critical_note: "SETQ2 targets LUT; SETQ targets cog"
    example: |
      SETQ2 #255         ' Setup for 256 longs
      RDLONG 0, PTRB     ' Read 256 longs from hub to LUT[0..255]
      ' 0 is the first lookup RAM long

block_operations:
  hub_to_cog_transfer:
    instruction: "SETQ + RDLONG"
    operation: "Read multiple longs from hub to cog"
    syntax: |
      SETQ #count-1
      RDLONG first_cog_reg, hub_address
    timing: "One long per clock, unless the hub FIFO is accessing the same hub RAM slice on the same cycle"
    flags: "RDLONG with WC/WZ/WCZ sets the flags according to the last long read in the sequence"
    hub_execution: "Block moves yield to the hub FIFO interface, so they can be used during hub execution"
    example: |
      SETQ #31           ' 32 longs
      RDLONG buffer, ##source_data
      ' Reads hub[source_data..source_data+127] to cog[buffer..buffer+31]
    debug_use: |
      ' Load the debugger into registers $004..$1F7
      setq    #$1F7-$004
      rdlong  $004, ##dbg_addr
    source: "Parallax Spin2/PASM Debugger v51 (2025.04.02), Debug ISR (debug_isr); timing: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), FAST BLOCK MOVES"

  cog_to_hub_transfer:
    instruction: "SETQ + WRLONG"
    operation: "Write multiple longs from cog to hub"
    syntax: |
      SETQ #count-1
      WRLONG first_cog_reg, hub_address
    timing: "One long per clock. Not documented: whether a FIFO access to the same hub RAM slice delays a block write"
    example: |
      SETQ #63           ' 64 longs
      WRLONG results, PTRA
      ' Writes cog[results..results+63] to hub[PTRA..PTRA+255]
    source: "timing: Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, Hub RAM, Sequential Access, pp.24-25 (fast block moves read or write a sequential series of longs at one per clock cycle); Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), FAST BLOCK MOVES (the FIFO-priority statement is made for RDLONG only)"

  hub_to_lut_transfer:
    instruction: "SETQ2 + RDLONG"
    operation: "Read multiple longs from hub to LUT"
    syntax: |
      SETQ2 #count-1
      RDLONG 0, hub_address  ' 0 is the first lookup RAM long
    critical_pattern: |
      ' Load complete waveform table to LUT
      load_sine_table
              mov     ptra, ##sine_table_hub
              setq2   #512-1          ' Full LUT
              rdlong  0, ptra         ' Load to LUT[0..511]
              ret
      
      ' Later access via RDLUT
              rdlut   value, phase    ' 3-clock lookup
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), FAST BLOCK MOVES (SETQ2 + RDLONG reads hub longs into lookup RAM)"

  lut_to_hub_transfer:
    instruction: "SETQ2 + WRLONG"
    operation: "Write multiple longs from LUT to hub"
    syntax: |
      SETQ2 #count-1
      WRLONG 0, hub_address  ' 0 is the first lookup RAM long
    debug_pattern: |
      ' Spin2 debugger: move hub longs in blocks of up to $100 through this cog's LUT
      .block  decod   pb,#8           'determine number of longs in block ($100 max)
              fle     pb,pa
              sub     pa,pb           'adjust remaining-longs count
              sub     pb,#1           'get long count - 1
              setq2   pb              'read block of longs
              rdlong  0,ptra++
              setq2   pb              'write block of longs
              wrlong  0,ptrb++
              _ret_   tjnz    pa,#.block      'another block?
    source: "Parallax Spin2/PASM Debugger v51 (2025.04.02), Debugger Setup, move routine ('Move pa bytes from @ptra to @ptrb')"

ptrx_with_block_transfers:
  rule: "With a prior SETQ/SETQ2, the PTRx expression's index is overridden by the number of longs, with bit 4 of the encoded index serving as the ++/-- indicator. In plain PTRA/PTRB the index is overridden with zero. The updating forms move the pointer by the whole block."
  forms:
    - "RDLONG first_reg,PTRA: reads x+1 longs from PTRA"
    - "RDLONG first_reg,PTRA++: reads x+1 longs from PTRA, PTRA += (x+1)*4"
    - "RDLONG first_reg,PTRA--: reads x+1 longs from PTRA, PTRA -= (x+1)*4"
    - "RDLONG first_reg,++PTRA: reads x+1 longs from PTRA+(x+1)*4, PTRA += (x+1)*4"
    - "RDLONG first_reg,--PTRA: reads x+1 longs from PTRA-(x+1)*4, PTRA -= (x+1)*4"
  count: "x is the SETQ/SETQ2 value: the number of longs, minus 1"
  worked_case: "SETQ #3 (4 longs) then RDLONG first_reg,ptra++ moves PTRA by 16"
  cancelled_by: "An ALTx, AUGS or AUGD between SETQ/SETQ2 and the transfer cancels the block-size step: the block still moves, and PTRx takes only the ordinary expression's step. Preceded by ALTD, SETQ #3 with ptra++ steps PTRA by 4 instead of 16, and ptra++[3] steps it by 12."
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), FAST BLOCK MOVES (index overridden with the number of longs; bit 4 of the encoded index as the ++/-- indicator; plain PTRA/PTRB overridden with zero), KNOWN SILICON BUGS; the ALTD case: EF-067 (real P2 silicon; only ALTD tested as the intervening instruction)"

production_patterns:
  waveform_buffer_management:
    description: "A SETQ2 block transfer into lookup RAM, processing there, and a SETQ2 block transfer back to hub RAM"
    code: |
      ' Process audio/waveform data via LUT
      process_waveform
              ' Load samples to LUT for processing
              setq2   #128-1
              rdlong  0, sample_ptr
              
              ' Process the samples in LUT
              mov     index, #0
      .loop   rdlut   sample, index
              ' Halve each sample, then add an offset
              sar     sample, #1      ' arithmetic shift right by 1
              add     sample, dc_offset
              wrlut   sample, index
              incmod  index, #127
              tjnz    index, #.loop
              
              ' Write processed data back
              setq2   #128-1
              wrlong  0, output_ptr
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), FAST BLOCK MOVES (SETQ2 block transfer into and out of lookup RAM)"
    
special_operations:
  block_math:
    description: "SETQ supplies Q to the instruction that follows"
    operations:
      MUXQ:
        syntax: "SETQ mask + MUXQ dest, source"
        operation: "dest = (dest & !mask) | (source & mask)"
      
      COGINIT:
        syntax: "SETQ value + COGINIT D, S"
        operation: "The SETQ value is written into the started cog's PTRA register (a 32-bit value, e.g. a pointer to a runtime data structure or a parameter); without a SETQ, PTRA is cleared to zero. S is written into the started cog's PTRB."
        source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), STARTING AND STOPPING COGS (COGINIT)"

  full_width_q_value:
    description: |
      SETQ sets Q = D. With a register operand (or a ## immediate, which the
      assembler implements via AUGS), Q can hold a full 32-bit value, as used by
      a MUXQ mask and the 32-bit PTRA value of SETQ+COGINIT.
    block_count_limit: "The block-move count is the number of longs minus 1. Cog register RAM and cog lookup RAM are each 512 longs. Not documented: the maximum block-move count."
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), COG RAM, LOOKUP RAM (cog and LUT are each 512 x 32-bit longs); FAST BLOCK MOVES ('x = number of longs, minus 1')"

block_fill:
  hub_fill:
    instruction: "SETQ + WRLONG/WMLONG with an immediate D"
    operation: "Fill hub memory with an immediate value"
    syntax: |
      SETQ #count-1
      WRLONG #value, hub_address
    example: |
      SETQ #15
      WRLONG #0, ##buffer_hub  ' Clear 16 hub longs
    note: "With an immediate D the instruction writes that immediate value to hub RAM; with a register D it writes that many cog-register longs to hub."
    cog_and_lookup_ram: "The fill writes hub RAM only. No SETQ/SETQ2 block form fills cog register RAM or lookup RAM with a value: the block forms are RDLONG, which copies hub longs into cog register RAM or lookup RAM, and WRLONG/WMLONG, which write register longs, lookup RAM longs or an immediate value into hub RAM."
    source: "note and cog_and_lookup_ram: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), FAST BLOCK MOVES (the SETQ/SETQ2 + RDLONG and SETQ/SETQ2 + WRLONG/WMLONG forms; an immediate D writes that value to RAM as a memory filler)"

performance:
  transfer_rate: "One long per clock. For a block RDLONG, unless the hub FIFO is accessing the same hub RAM slice on the same cycle (the FIFO gets priority and the block move waits for the slice to come around again). Not documented: whether a FIFO access to the same slice delays a block write"
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), FAST BLOCK MOVES (rate and FIFO priority stated for RDLONG); Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, Hub RAM, Sequential Access, pp.24-25 (reads and writes at one per clock cycle)"
  lookup_ram_access_clocks: "RDLUT reads a lookup RAM long in 3 clocks and WRLUT writes one in 2"

  limitations:
    - "Not documented: the maximum number of longs per operation"
    - "The instruction table lists one RDLONG range (9...16 clocks in cog or LUT execution) and one WRLONG range (3...10), each noting that a prior SETQ/SETQ2 invokes a block transfer. Not documented: how those ranges apply to a block transfer, and the clocks a block transfer spends before its first long moves"
    - "SETQ/SETQ2 shields the next instruction from interruption"
    - "RDLUT and WRLUT address lookup RAM longs $000 to $1FF. Not documented: whether the first_lut address of a SETQ2 block transfer takes any value outside $000 to $1FF"

common_patterns:
  array_copy:
    code: |
      SETQ #array_size-1
      RDLONG dest_array, source_ptr
    description: "Copy entire array"

  buffer_clear:
    code: |
      SETQ #buffer_size-1
      WRLONG #0, ##buffer_start
    description: "Clear buffer to zero"

  context_save:
    code: |
      SETQ #31              ' Save 32 registers
      WRLONG 0, context_ptr ' Save cog[0..31]
    description: "Save register context. Registers $1F8..$1FF cannot be transferred to hub RAM via SETQ+WRLONG/WMLONG, so a save of the full register range does not include them."
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), FAST BLOCK MOVES ($1F8..$1FF cannot be block-written to hub)"

  context_restore:
    code: |
      SETQ #31              ' Restore 32 registers
      RDLONG 0, context_ptr ' Restore cog[0..31]
    description: "Restore register context"

  lut_table_load:
    code: |
      SETQ2 #255            ' Half of LUT
      RDLONG 0, ##sine_table ' 0 is the first lookup RAM long
    description: "Load lookup table"

  fast_memcpy:
    code: |
      .copy_loop
        SETQ #127           ' 128 longs = 512 bytes
        RDLONG temp_buffer, src_ptr
        ADD src_ptr, ##512
        SETQ #127
        WRLONG temp_buffer, dst_ptr
        ADD dst_ptr, ##512
        DJNZ count, #.copy_loop
    description: "Memory copy routine"

advanced_usage:
  partial_transfers:
    description: "Transfer subset of registers"
    example: |
      MOV count, actual_size
      SUB count, #1
      SETQ count          ' Dynamic count
      RDLONG buffer, PTRA

  strided_access:
    description: "A block transfer moves x+1 consecutive longs; this loop copies every 4th long without one"
    example: |
      ' Copy every 4th long
      MOV index, #0
      .loop
        RDLONG temp, source_ptr
        ADD source_ptr, #16    ' Skip 3 longs
        ALTD index, #buffer
        MOV 0-0, temp
        ADD index, #1
        DJNZ count, #.loop

  interrupt_blocking:
    description: "SETQ/SETQ2 shields the next instruction from interruption"
    behavior: "SETQ/SETQ2 must not be executing before an interrupt branch can happen"

debugging:
  verification:
    - "The SETQ/SETQ2 value is the number of longs minus 1"

  common_errors:
    off_by_one: "Using count instead of count-1"
    wrong_prefix: "Swapping prefixes: SETQ2 is for lookup RAM, SETQ for cog register RAM"

sources:
  - "Parallax SPI Flash Programmer and Boot Loader v51, Loader (SETQ moves code from cog to hub) and Move application down to $00000+ (SETQ2 block copy)"
  - "Parallax Spin2/PASM Debugger v51, debug entry and debug_exit (SETQ saves and restores registers $010..$1F7 to the save buffer)"

hub_symbols: "Fragments here that use a hub symbol as an immediate assume a PASM-only file, where hub addresses are absolute. In a Spin2 object, DAT hub addresses are relative to the object: see language/spin2/integration/spin2-pasm2-integration.yaml hub_address_resolution."
