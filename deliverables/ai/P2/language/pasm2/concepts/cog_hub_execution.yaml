    - "Move critical loops to COG"
    - "Use REP loops in COG"
    - "Align hub code for better fetch"
    - "Minimize mode switches"
    - "Implement overlay system for complex COG code"

common_mistakes:
  - mistake: "Assuming REP gives zero-overhead loops in hubexec"
    wrong: |
      ORGH
      REP #4, #100    ' REP DOES work in hubexec, but each iteration's
                      ' hidden jump back to the top pays the 13+ clock
                      ' hub-branch (FIFO-refill) cost -- not zero-overhead
    right: |
      ORG
      REP #4, #100    ' Zero-overhead REP loop (cogexec) -- use cogexec
                      ' for tight inner loops that need free looping
    explanation: "REP works in hubexec (Silicon Doc v35: 'REP works in hub memory, as well, but executes a hidden jump to get back to the top of the repeated instructions'). It is not forbidden -- but the hidden jump costs 13+ clocks per iteration, so move tight loops to cogexec when you need REP's zero loop overhead."
  
  - mistake: "Not loading COG code before jumping"
    wrong: |
      JMP #$000       ' COG RAM might be empty!
    right: |
      CALL #load_cog_code
      JMP  #$000      ' Now safe to jump
  
  - mistake: "Assuming deterministic timing in hubexec"
    wrong: "Hubexec bit-banged protocol (branches inside the bit loop break determinism)"
    right: "Move protocol to cogexec for timing"
  
  - mistake: "Assuming hubexec is always slower per-instruction than cogexec"
    wrong: "Padding cogexec timing budgets by 5x or more when porting code to hubexec"
    right: "Sequential hubexec is 2 clocks/instruction (SAME as cogexec); only branches pay the 13+-clock FIFO refill cost. Budget per-branch, not per-instruction."
  
  - mistake: "Calling RDFAST/WRFAST/RFBYTE/etc. from hubexec code"
    wrong: "Assuming FIFO/streamer instructions just run slowly in hubexec"
    right: "They are FORBIDDEN in hubexec (Silicon Doc HUB EXECUTION section). Either move the code that uses them to cogexec, or stage the work via a separate cog"
  
  - mistake: "Overlay overwrites active code"
    wrong: |
      call    #overlay_base
      ' Load new overlay over running code!
    right: |
      call    #overlay_base
      ret                 ' Return before loading

why_this_matters:
  performance: |
    Understanding execution modes is critical for P2 performance, but the
    common 'hubexec is much slower than cogexec' shorthand is misleading:
    sequential hubexec code runs at the SAME 2 clocks/instruction as cogexec
    via the 19-stage prefetch FIFO. The real cost difference shows up at
    branches: minimum 13 clocks for a hubexec branch (FIFO refill) vs 4 clocks
    for a cogexec branch. Branch-heavy inner loops can run several× slower
    in hubexec; straight-line code does not.
    
    A separate concern is functionality: FIFO/streamer instructions cannot
    be used at all in hubexec — these need cogexec.
  
  architecture: |
    The dual execution model gives P2 unique flexibility:
    - Small, fast code in COG
    - Large, complex code in HUB
    - Best of both worlds with hybrid approach
    - Overlays extend COG capabilities dramatically
  
  debug_infrastructure: |
    The overlay system enables sophisticated debug monitors
    in limited COG RAM, supporting complex debugging operations
    without consuming precious COG space permanently.

