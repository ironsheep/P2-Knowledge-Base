# COG vs HUB Execution Models
# Source: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), INSTRUCTION MODES, HUB EXECUTION

concept: "COG vs HUB Execution"
category: "pasm2_core"
importance: "fundamental"
documentation_level: comprehensive
source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), HUB EXECUTION (13-clock minimum branch with +1 when not long-aligned, forbidden-instruction list); THE COG -to- HUB RAM INTERFACE (FIFO of (cogs+11) stages); INSTRUCTION REPEATING (REP hidden jump in hub memory)"

metadata:
  query_tags: ["cogexec", "hubexec", "execution", "performance", "memory", "overlay"]
  complexity: "intermediate"
  common_questions:
    - "How many clocks does hub execution take compared to cog execution?"
    - "How do I switch between execution modes?"
    - "What are the limitations of each mode?"
    - "How do I implement code overlays?"

fundamental_concept: |
  P2 supports two execution modes:
  1. COGEXEC: Code runs from COG RAM
     - ADD: 2 clocks
     - Branch instructions (JMP, CALL, RET): 4 clocks
  2. HUBEXEC: Code runs from HUB RAM
     - The FIFO spools up instructions so that a stream of instructions is
       available for continuous execution. The FIFO contains (cogs+11) stages.
     - When the execution pipeline is full, each instruction effectively takes
       as little as 2 clocks. ALU instructions such as ADD, MOV and NOP take 2
       clocks in hub execution, the same as in cog execution.
     - Not documented: the clocks per sequential instruction in hub execution
       as a general rule; RDLONG, WRLONG and branches have their own hub
       execution figures
     - Branches: minimum 13 clocks (+1 if not long-aligned)
     - REP works in hubexec, but executes a hidden jump to get back to the
       top of the repeated instructions (REP repeats without branching
       delays in cog/LUT memory).
     - All ALTx instructions (ALTI/ALTS/ALTD/ALTR/ALTB/ALTSN/ALTSB/ALTSW/ALTGN/ALTGB/ALTGW)
       are not excluded from hubexec (none are in the forbidden list for
       hub execution).
     - The FIFO instructions in the forbidden list are not usable in hubexec;
       XINIT/XZERO/XCONT are in that list only when the streamer mode engages the FIFO
       (see `hubexec_forbidden_instructions:` below)
  
  COGEXEC runs from the 512 longs of cog register RAM. HUBEXEC runs from
  hub addresses $00400..$FFFFF (Parallax's documents also give $7FFFF as the top
  of the range). A branch to a hub address takes a minimum of
  13 clocks, against 4 clocks for a JMP in cog execution.

  See `fifo_behavior:` below for the FIFO facts.

cog_execution:
  location: "COG RAM (addresses $000-$1FF)"
  size: "512 longs"
  speed: "When the execution pipeline is full, each instruction effectively takes as little as 2 clock cycles"
  
  memory_map:
    $000_$1EF: "496 general-purpose registers (code/data)"
    $1F0_$1F7: "8 dual-purpose registers (general-purpose, or interrupt vectors IJMP3/IRET3/IJMP2/IRET2/IJMP1/IRET1/PA/PB when those features are enabled)"
    $1F8_$1FF: "8 special-purpose registers (PTRA, PTRB, DIRA, DIRB, OUTA, OUTB, INA, INB) -- not loaded by COGINIT"
  coginit_load_range: "COGINIT with D[5]=0 loads the target cog's registers $000..$1F7 from the hub; the special-purpose registers $1F8..$1FF are not loaded"

  after_branch: "Branch instructions cause the pipeline to be flushed, so the first instruction following the branch takes at least four clock cycles. Parallax's documents also give at least five clock cycles."

  limitations:
    - "Limited to 512 longs total"
    - "Hub data is reached with RDBYTE/RDWORD/RDLONG/WRBYTE/WRWORD/WRLONG, which take the hub-window timing of those instructions"

hub_execution:
  location: "HUB RAM, with the PC in $00400..$FFFFF (Parallax's documents also give $7FFFF as the top of the range); a PC of $00000..$003FF selects cog or lookup RAM, so hub RAM at those addresses is not fetched as hub-execution code, and rolling the PC from $3FF to $400 does not initiate hub execution"
  size: "512KB of hub RAM on the P2X8C4M64P"
  speed:
    sequential: "When the execution pipeline is full, each instruction effectively takes as little as 2 clocks. ALU instructions such as ADD, MOV and NOP take 2 clocks in hub execution, the same as in cog execution. Not documented: the clocks per sequential instruction in hub execution as a general rule."
    branches: "A branch to a hub address takes a minimum of 13 clocks, one more if the target is not long-aligned; JMP, CALL and RET list 13...20 clocks, CALLA and CALLB 14...32, RETA and RETB 20...40"
  
  timing_factors:
    instruction_fetch: "The cog employs the FIFO hardware to spool up instructions so that a stream of instructions is available for continuous execution; the FIFO contains (cogs+11) stages"
    data_access: "RD/WR instructions follow normal hub-access timing (egg-beater dependent): reads 9...16 clocks in cog execution and 9...26 in hub execution; writes 3...10 clocks in cog execution and 3...20 in hub execution (+1 clock for a word or long that crosses a hub long boundary)"
    branches: "Branching to a hub address takes a minimum of 13 clock cycles; if the instruction being branched to is not long-aligned, one additional clock cycle is required"
  
  limitations:
    - "A branch to a hub address takes a minimum of 13 clocks (JMP, CALL and RET: 13...20); JMP in cog execution takes 4 clocks"
    - "REP works in hubexec, but executes a hidden jump to get back to the top of the repeated instructions — not forbidden"
    - "FIFO instructions (RDFAST/WRFAST/FBLOCK/RFx/WFx) are in the hub-execution forbidden list, and so are XINIT/XZERO/XCONT when the streamer mode engages the FIFO — see hubexec_forbidden_instructions"

hubexec_forbidden_instructions:
  # "While in hub execution mode, the FIFO cannot be used for anything else.
  # So, during hub execution these instructions cannot be used:"
  rationale: "While in hub execution mode, the FIFO cannot be used for anything else, so these instructions cannot be used."
  cannot_be_used:
    - "RDFAST"
    - "WRFAST"
    - "FBLOCK"
    - "RFBYTE"
    - "RFWORD"
    - "RFLONG"
    - "RFVAR"
    - "RFVARS"
    - "WFBYTE"
    - "WFWORD"
    - "WFLONG"
    - "XINIT / XZERO / XCONT (when the streamer mode engages the FIFO)"
  also_works_in_hubexec_but_with_caveat:
    REP: "Works in hubexec, but executes a hidden jump to get back to the top of the repeated instructions."
    ALTx_family: "None of the ALTx instructions (ALTI/ALTS/ALTD/ALTR/ALTB/ALTSN/ALTSB/ALTSW/ALTGN/ALTGB/ALTGW) is in the list of instructions that cannot be used in hub execution."
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), HUB EXECUTION"

dynamic_overlay_system:
  concept: "Code segments are loaded into cog RAM on demand"

  debug_overlay_implementation:
    description: "Spin2 debugger loads its breakpoint-handler overlay into the shared overlay area on demand"
    architecture: |
      ' Load breakpoint handler overlay and run it
      .breakpoint  loc     pb, #\dbg_addr+(@bp_handler-@debugger)  ' load breakpoint handler overlay
                   setq    #overlay_end-overlay_begin              ' read in overlay code and execute it
                   rdlong  overlay_begin, pb

                   jmp     #bp_handler
    source: "Parallax Spin2/PASM Debugger v51 (2025.04.02), DEBUG interrupt entry or STALL return (debug_entry, .breakpoint)"
    

execution_control:
  switching_modes:
    cog_to_hub:
      instruction: "JMP #hub_address"
      example: |
        ORG   0                  ' In COG
        ' ... cog code ...
        JMP   #hub_routine       ' Jump to hub
        
    hub_to_cog:
      instruction: "JMP #cog_address"
      requirement: "Code must already be in COG RAM"
      example: |
        ORGH  $400               ' In HUB
        ' ... hub code ...
        CALL  #load_cog_code     ' Load COG code first
        JMP   #$000              ' Jump to COG
  
  program_counter:
    cog_range: "$000-$1FF (9 bits)"
    lut_range: "$200-$3FF"
    hub_range: "$00400-$FFFFF (20-bit PC). Parallax's documents also give $7FFFF as the top of the range."
    detection: "A PC in $00400..$FFFFF selects hub execution (Parallax's documents also give $7FFFF as the top of the range)"

instruction_availability:
  cogexec_only:
    - "The FIFO ops RDFAST/WRFAST/FBLOCK/RFx/WFx, and XINIT/XZERO/XCONT when the streamer mode engages the FIFO — in the hub-execution forbidden list"
  works_in_both_modes_with_caveats:
    - "REP — works in hubexec, but executes a hidden jump to get back to the top of the repeated instructions"
    - "All ALTx instructions (ALTI/ALTS/ALTD/ALTR/ALTB/ALTSN/ALTSB/ALTSW/ALTGN/ALTGB/ALTGW) — not in the list of instructions that cannot be used in hub execution"
  
  performance_differences:
    - "ADD, SUB, AND, XOR, ROL, MOV: 2 clocks in cog execution and 2 clocks in hub execution"
    - "JMP: 4 clocks (cog) vs minimum 13 clocks (hub, +1 if target not long-aligned)"
    - "CALL: 4 clocks (cog) vs minimum 13 clocks (hub, +1 if target not long-aligned)"
    - "RET: 4 clocks (cog) vs minimum 13 clocks (hub, +1 if target not long-aligned)"
    - "DJNZ not taken: 2 clocks (cog) vs 2 clocks (hub)"
    - "DJNZ taken: 4 clocks (cog) vs minimum 13 clocks (hub, +1 if target not long-aligned)"
    - "RDLONG: 9...16 clocks (cog) vs 9...26 clocks (hub); WRLONG: 3...10 clocks (cog) vs 3...20 clocks (hub) (hub-access window dependent)"
  
  hubexec_clocks_note: |
    ALU instructions such as ADD, MOV and NOP take 2 clocks in hub execution,
    the same as in cog execution. A branch to a
    hub address takes a minimum of 13 clocks (4 for a JMP in cog execution).

    The FIFO instructions (RDFAST/WRFAST/FBLOCK/RFx/WFx) are in the
    hub-execution forbidden list: while in hub execution mode, the FIFO cannot
    be used for anything else. XINIT/XZERO/XCONT are in the same list when the
    streamer mode engages the FIFO.

performance_comparison:
  timing_critical:
    cogexec: |
      REP   #4, #100
      ADD   a, b              ' 2 clocks
      SUB   a, b              ' 2 clocks
      XOR   c, d              ' 2 clocks
      ROL   e, #1             ' 2 clocks
      ' The block repeats without branching delays in cog/LUT memory
    
    hubexec: |
      ' REP also works in hubexec, but executes a hidden jump back to the top of the block;
      ' here the loop is shown with DJNZ
      MOV   count, #100
      .loop
      ADD   a, b              ' 2 clocks
      SUB   a, b              ' 2 clocks
      XOR   c, d              ' 2 clocks
      ROL   e, #1             ' 2 clocks
      DJNZ  count, #.loop     ' taken: 13...20 clocks
      ' The taken DJNZ is a branch to a hub address: 13...20 clocks.
      ' ADD, SUB, XOR and ROL each take 2 clocks in cog execution and 2 clocks in hub execution.
  
  memory_intensive:
    cogexec: |
      ' Hub access with the hub instructions
      RDLONG  value, ptr      ' 9...16 clocks (hub access, egg-beater dependent)
      ADD     value, #1       ' 2 clocks
      WRLONG  value, ptr      ' 3...10 clocks (hub access, egg-beater dependent)

    hubexec: |
      ' The same hub-access ops, with the longer hub-execution ranges
      RDLONG  value, ptr      ' 9...26 clocks (hub access, egg-beater dependent)
      ADD     value, #1       ' 2 clocks
      WRLONG  value, ptr      ' 3...20 clocks (hub access, egg-beater dependent)
      ' Note: in hubexec, the FIFO instructions (RDFAST/WRFAST/FBLOCK/RFx/WFx)
      ' cannot be used, nor XINIT/XZERO/XCONT when the streamer mode engages
      ' the FIFO. RDLONG/WRLONG do work.

code_organization:
  hybrid_approach:
    description: "A hub-executed main program that calls a routine in cog RAM"
    example: |
      DAT
      ' HUB-based main program
              ORGH
      main    
              CALL  #load_critical_code
              ' Main program logic in hub
              ' ...
              CALL  #$000    ' Call COG routine
              ' ...
              
      ' COG-based critical routine
              ORG   0
      critical_loop
              REP   #4, ##1000
              RDLONG data, ptra++
              ADD    sum, data
              FGE    peak, data          ' peak = the larger of peak and data (unsigned)
              FLE    valley, data        ' valley = the smaller of valley and data (unsigned)
              RET

loading_strategies:
  initial_load:
    description: "Load COG code at startup"
    code: |
      SETQ    ##@parameters            ' PTRA of the new cog
      COGINIT #16, ##@cog_code         ' #16 = %0_1_0000: load and start a free cog; S goes to its PTRB
  
  dynamic_load:
    description: "Load different COG code as needed"
    code: |
      SETQ  #(cog_end-cog_start-1)
      RDLONG $000, ##@cog_start
      JMP    #$000
  
  overlay_system:
    description: "Swap COG code sections dynamically"
    code: |
      ' Load overlay 1
      SETQ  #127
      RDLONG $100, ##@overlay1
      CALL   #$100
      
      ' Load overlay 2  
      SETQ  #127
      RDLONG $100, ##@overlay2
      CALL   #$100
  
  demand_paging:
    description: "Load code on-demand based on usage"
    code: |
      ' Check if function loaded
      cmp     loaded_func, requested_func wz
      if_nz   call    #load_function
              call    #function_base

fifo_behavior:
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), HUB EXECUTION"
  summary: |
    When executing from hub RAM, the cog employs the FIFO hardware to spool up
    instructions so that a stream of instructions is available for continuous
    execution. The FIFO contains (cogs+11) stages. Branching to a hub address
    takes a minimum of 13 clock cycles. If the instruction being branched to
    is not long-aligned, one additional clock cycle is required. The FIFO
    instructions in the forbidden list are not usable in hubexec (XINIT/XZERO/
    XCONT only when the streamer mode engages the FIFO). Not documented: the
    clocks per sequential instruction in hub execution as a general figure.

  fifo_depth:
    stages: "(cogs+11) stages"
    refill_threshold: "FIFO loads continuously whenever fewer than (cogs+7) stages are filled"
    overflow_margin: "After threshold reached, up to 5 more longs may stream in, potentially filling all (cogs+11) stages"
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), HUB, HUB RAM (The FIFO contains (cogs+11) stages ...)"

  streaming_mode:
    description: "Straight-line hubexec code, fetched through the FIFO"
    cost_per_instruction: "When the execution pipeline is full, each instruction effectively takes as little as 2 clocks. ALU instructions such as ADD, MOV and NOP take 2 clocks in hub execution, the same as in cog execution. Not documented: the clocks per sequential instruction in hub execution as a general rule."
    mechanism: "The FIFO hardware spools up instructions so that a stream of instructions is available for continuous execution"
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), HUB EXECUTION (the FIFO spools up instructions for continuous execution); Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF (Clocks, Reg, LUT, & Hub: one value covers all three), p.148-159"
  
  branch_refill:
    minimum_cost: "13 clocks"
    misalignment_cost: "+1 clock if target instruction is not long-aligned"
    range: "13...20 clocks for JMP, CALL, CALLD, CALLPA/PB, RET, RETI and RESI"
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), HUB EXECUTION: 'Branching to a hub address takes a minimum of 13 clock cycles. If the instruction being branched to is not long-aligned, one additional clock cycle is required.' P2 Instructions v35 Rev B/C Silicon, JMP, CALL, CALLD, CALLPA/PB, RET, RETI0-3 and RESI0-3 rows (13...20); DJZ/DJNZ/TJZ/TJNZ/TJF/TJV rows (2 or 13...20); CALLA/CALLB rows (14...32); RETA/RETB rows (20...40)."
    clocks_from_hub_execution:
      - "JMP, CALL, CALLD, CALLPA, CALLPB, RET, RETI0/1/2/3, RESI0/1/2/3: 13...20 clocks"
      - "CALLA and CALLB: 14...32 clocks; RETA and RETB: 20...40 clocks"
      - "Conditional jumps (DJZ/DJNZ/DJF/DJNF, IJZ/IJNZ, TJZ/TJNZ/TJF/TJNF/TJV/TJS/TJNS): 2 clocks when not taken and 13...20 when taken"
  forbidden_in_hubexec:
    # These instructions cannot be used while in hubexec.
    instructions: ["RDFAST", "WRFAST", "FBLOCK", "RFBYTE", "RFWORD", "RFLONG", "RFVAR", "RFVARS", "WFBYTE", "WFWORD", "WFLONG", "XINIT / XZERO / XCONT (when the streamer mode engages the FIFO)"]
    rationale: "While in hub execution mode, the FIFO cannot be used for anything else"
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), HUB EXECUTION"

  hub_io_in_hubexec:
    instructions: ["RDBYTE", "RDWORD", "RDLONG", "WRBYTE", "WRWORD", "WRLONG"]
    timing: "Reads 9...16 clocks in cogexec and 9...26 in hubexec; writes 3...10 clocks in cogexec and 3...20 in hubexec (egg-beater hub-window dependent)"
    note: "Fast block moves (SETQ/SETQ2 with RDLONG/WRLONG/WMLONG) yield to the hub FIFO interface, and so can be used during hub execution"

  see_also:
    - "architecture/fifo.yaml — FIFO hardware (streamer-transfer role)"
    - "language/pasm2/concepts/execution_modes.yaml — three-mode overview"
    - "architecture/p2-architecture-mental-model.yaml — prefetch FIFO"

interrupt_considerations:
  cogexec:
    - "Interrupt branches are realized by inserting a CALLD IRETx,IJMPx WCZ into the instruction pipeline while holding the program counter at its current value"
    - "CALLD takes 4 clocks when executed from cog/LUT"

  hubexec:
    - "The same inserted CALLD takes 13...20 clocks when executed from hub"

alignment:
  - "A branch to a hub address that is not long-aligned takes one additional clock"

common_mistakes:
  - mistake: "Assuming REP repeats without branching delays in hubexec"
    wrong: |
      ORGH
      REP #4, #100    ' REP works in hubexec, but executes a hidden jump
                      ' to get back to the top of the repeated instructions
    right: |
      ORG
      REP #4, #100    ' Repeated without branching delays in cog/LUT memory
    explanation: "REP repeats instructions without branching delays in cog/LUT memory. REP also works in hub memory, but executes a hidden jump to get back to the top of the repeated instructions. It is not forbidden."
  
  - mistake: "Not loading COG code before jumping"
    wrong: |
      JMP #$000       ' COG RAM might be empty!
    right: |
      CALL #load_cog_code
      JMP  #$000      ' Now safe to jump
  
  - mistake: "Assuming the cogexec branch clocks apply in hubexec"
    wrong: "Budgeting 4 clocks for a JMP, CALL or RET in hubexec"
    right: "A branch to a hub address takes a minimum of 13 clocks (one more if the target is not long-aligned); JMP, CALL and RET list 13...20."

  - mistake: "Calling RDFAST/WRFAST/RFBYTE/etc. from hubexec code"
    wrong: "Assuming the FIFO instructions just run slowly in hubexec"
    right: "They are in the hub-execution forbidden list (the FIFO cannot be used for anything else there). Code that uses them runs from cog RAM"

hub_symbols: "Fragments here that use a hub symbol as an immediate assume a PASM-only file, where hub addresses are absolute. In a Spin2 object, DAT hub addresses are relative to the object: see language/spin2/integration/spin2-pasm2-integration.yaml hub_address_resolution."
