sources:
  - propeller_2_documentation_v35: "HUB EXECUTION section. Branching to a hub address takes a minimum of 13 clock cycles. If the instruction being branched to is not long-aligned, one additional clock cycle is required. FIFO depth (THE COG -to- HUB RAM INTERFACE section): (cogs+11) stages. REP hidden jump (INSTRUCTION REPEATING section): REP works in hub memory, but executes a hidden jump to get back to the top of the repeated instructions. Forbidden list (HUB EXECUTION section): while in hub execution mode, the FIFO cannot be used for anything else, so during hub execution these instructions cannot be used: RDFAST / WRFAST / FBLOCK / RFBYTE / RFWORD / RFLONG / RFVAR / RFVARS / WFBYTE / WFWORD / WFLONG / XINIT / XZERO / XCONT - when the streamer mode engages the FIFO."
  - sequential_hubexec_clocks: "P2 Instructions v35 Rev B/C Silicon, ADD, SUB, AND, XOR, ROL, MOV and NOP rows (hub execution clocks: same as cog execution); Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.148-159, headed Clocks Reg, LUT, & Hub, gives one value for ADD, SUB, AND, XOR, ROL and MOV (2); Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), COGS (as little as two clock cycles when the pipeline is full; the first instruction following a branch takes at least four clock cycles) and HUB EXECUTION (the FIFO spools up instructions for continuous execution). Parallax's documents also give at least five clock cycles for the first instruction following a branch."
  - "Parallax Spin2/PASM Debugger v51, Breakpoint Handler Overlay (SETQ + RDLONG loads the overlay code into cog registers)"