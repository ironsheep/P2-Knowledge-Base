# COG vs HUB Execution Models
# Source: Silicon Doc v35, P2 Architecture, Production Code Analysis
# Critical for: Understanding P2 execution modes, performance, and overlay systems

concept: "COG vs HUB Execution"
category: "pasm2_core"
importance: "fundamental"
documentation_source: enhanced
documentation_level: comprehensive

metadata:
  query_tags: ["cogexec", "hubexec", "execution", "performance", "memory", "overlay"]
  complexity: "intermediate"
  use_cases: ["performance_optimization", "memory_management", "code_organization", "debug_systems"]
  common_questions:
    - "When should I use COG vs HUB execution?"
    - "How fast is HUB execution compared to COG?"
    - "How do I switch between execution modes?"
    - "What are the limitations of each mode?"
    - "How do I implement code overlays?"

fundamental_concept: |
  P2 supports two execution modes:
  1. COGEXEC: Code runs from COG RAM
     - Typical ALU instructions (ADD, MOV, etc.): 2 clocks (deterministic)
     - Branch instructions (JMP, CALL, RET): 4 clocks
  2. HUBEXEC: Code runs from HUB RAM
     - Sequential straight-line code: 2 clocks/instruction (SAME as COGEXEC)
       because the FIFO prefetches and streams instructions through the
       19-stage ((cogs+11)) instruction prefetch buffer
     - Branches: minimum 13 clocks (+1 if not long-aligned)
     - REP works in hubexec (Silicon Doc v35 verbatim: "REP works in hub
       memory, as well, but executes a hidden jump to get back to the top
       of the repeated instructions"). The hidden jump on each iteration
       pays the 13+ clock hub-branch cost, so REP loops in hubexec are
       slower than in cogexec but still functional.
     - All ALTx instructions (ALTI/ALTS/ALTD/ALTR/ALTB/ALTSN/ALTSB/ALTSW/
       ALTGN/ALTGB/ALTGW) work in hubexec (none are in the Silicon Doc HUB
       EXECUTION forbidden list). Confirmed by Chip Gracey clarification
       2026-05-02: "REP is allowed in hubexec and so is ALTI or any other
       ALTx instruction."
     - FIFO/streamer instructions ARE forbidden in hubexec
       (see `hubexec_forbidden_instructions:` below)
  
  COGEXEC is deterministic and limited to 512 longs. HUBEXEC can access all
  512KB and MATCHES COGEXEC throughput on sequential straight-line code; the
  cost shows up at branches (FIFO refill, minimum 13 clocks).
  
  Advanced systems use dynamic overlays to maximize COG RAM utilization.

  See `fifo_behavior:` below for the canonical mental model.

cog_execution:
  location: "COG RAM (addresses $000-$1FF)"
  size: "512 longs (2KB)"
  speed: "2 clock cycles per instruction (deterministic)"
  
  memory_map:
    $000_$1EF: "496 general-purpose registers (code/data)"
    $1F0_$1F7: "8 dual-purpose registers (general-purpose, or interrupt vectors IJMP3/IRET3/IJMP2/IRET2/IJMP1/IRET1/PA/PB when those features are enabled)"
    $1F8_$1FF: "8 special-purpose registers (PTRA, PTRB, DIRA, DIRB, OUTA, OUTB, INA, INB) -- not loaded by COGINIT"
  coginit_load_range: "COGINIT loads $000-$1F7 = 504 longs (general-purpose + dual-purpose); $1F8-$1FF special-purpose registers are NOT loaded"
  
  advantages:
    - "Deterministic 2-clock execution"
    - "Perfect for time-critical code"
    - "No hub timing variations"
    - "Fastest possible execution"
    - "All instructions available"
  
  limitations:
    - "Limited to 512 longs total"
    - "Must share space with data"
    - "Code must be loaded from hub first"
    - "No direct hub data access during execution"

hub_execution:
  location: "HUB RAM (addresses $00400-$FFFFF for hubexec; $00000-$003FF cannot host hubexec code)"
  size: "512KB main hub RAM (plus higher addresses where present)"
  speed:
    sequential: "2 clocks per instruction (FIFO streaming — SAME as COGEXEC)"
    branches: "Minimum 13 clocks (+1 if not long-aligned), up to ~20 with hub-window misalignment"
  
  timing_factors:
    instruction_fetch: "Per-cog 19-stage ((cogs+11)) prefetch FIFO streams instructions at 2 clocks each — no per-instruction hub window penalty when streaming"
    data_access: "RD/WR instructions follow normal hub-access timing (9-24 clocks typical, egg-beater dependent)"
    branches: "Force FIFO refill from new hub address — minimum 13 clocks (Silicon Doc); +1 clock if target is not long-aligned"
  
  advantages:
    - "Access to full 512KB+ hub address space"
    - "No need to load code into cog RAM first"
    - "Can mix code and data freely"
    - "Direct hub memory access"
    - "Good for large programs"
    - "Sequential throughput EQUALS COGEXEC (2 clocks/instruction)"
  
  limitations:
    - "Branch timing non-deterministic (minimum 13 clocks for FIFO refill)"
    - "Branches cost much more than in COGEXEC (13+ vs 4 clocks)"
    - "REP works but pays the hub-branch cost on each iteration's hidden jump back to the top of the block (Silicon Doc verbatim) — slower than cogexec REP, not forbidden"
    - "FIFO/streamer instructions FORBIDDEN — see hubexec_forbidden_instructions"
    - "Sequential code is full speed — branch-heavy code is where the cost shows up"

hubexec_forbidden_instructions:
  # Silicon Doc verbatim: "While in hub execution mode, the FIFO cannot be used for anything else.
  # So, during hub execution these instructions cannot be used:"
  rationale: "In hubexec the FIFO is dedicated to instruction prefetch. These instructions repurpose or consume the FIFO and so are not allowed."
  cannot_be_used:
    - "RDFAST"
    - "WRFAST"
    - "FBLOCK"
    - "RFBYTE"
    - "RFWORD"
    - "RFLONG"
    - "RFVAR"
    - "RFVARS"
    - "WFBYTE"
    - "WFWORD"
    - "WFLONG"
    - "XINIT"
    - "XZERO"
    - "XCONT (when streamer mode engages the FIFO)"
  also_works_in_hubexec_but_with_caveat:
    REP: "Works in hubexec per Silicon Doc v35 verbatim: 'REP works in hub memory, as well, but executes a hidden jump to get back to the top of the repeated instructions.' Each iteration's hidden jump pays the 13+-clock hub-branch cost, so REP loops are slower in hubexec than in cogexec."
    ALTx_family: "All ALTx instructions (ALTI/ALTS/ALTD/ALTR/ALTB/ALTSN/ALTSB/ALTSW/ALTGN/ALTGB/ALTGW) work in hubexec. None are in the Silicon Doc HUB EXECUTION forbidden list. ALTx mechanisms (modifying the next pipelined instruction's fields or substituting a full opcode) operate on the instruction in the pipeline regardless of whether it came from cog/LUT memory or the hub-prefetch FIFO. Source: Chip Gracey clarification 2026-05-02 verbatim: 'REP is allowed in hubexec and so is ALTI or any other ALTx instruction.'"
  source: "Silicon Doc v35, HUB EXECUTION section"

dynamic_overlay_system:
  concept: "Load code segments on-demand to maximize COG RAM usage"
  use_case: "Debug monitors, complex algorithms, multi-function systems"
  
  debug_overlay_implementation:
    description: "Spin2 debugger uses overlays for debug commands"
    architecture: |
      ' Debug ISR with overlay loading
      debug_isr
              ' Determine which debug command needed
              getbrk  cmd_code    wz
              
              ' Calculate overlay to load
              shr     cmd_code, #4        ' Get overlay index
              shl     cmd_code, #2        ' Convert to long offset
              loc     ptra, #\overlay_table
              add     ptra, cmd_code
              rdlong  overlay_addr, ptra  ' Get overlay HUB address
              
              ' Load overlay to COG RAM
              mov     ptra, overlay_addr
              setq    #OVERLAY_SIZE-1     ' Load N longs
              rdlong  overlay_base, ptra  ' Load to COG
              
              ' Execute overlay
              call    #overlay_base
              
              ' Return from debug ISR
              reti3   wcz
    source: Spin2_debugger.spin2
    
  overlay_table_structure:
    description: "HUB-based table of overlay addresses"
    code: |
      overlay_table
              long    @trace_overlay      ' Overlay 0: Trace commands
              long    @watch_overlay      ' Overlay 1: Watch commands
              long    @break_overlay      ' Overlay 2: Breakpoint commands
              long    @dump_overlay       ' Overlay 3: Memory dump
              long    @step_overlay       ' Overlay 4: Single-step
              ' ... more overlays ...
      
      ' Each overlay is self-contained code
      trace_overlay
              org     overlay_base        ' Same COG address
              ' Trace implementation
              ret
              
      watch_overlay
              org     overlay_base        ' Reuse same space
              ' Watch implementation
              ret
    
  overlay_management:
    allocation: |
      ' Reserve COG space for overlays
      overlay_base    res     32          ' 32 longs for overlay
      overlay_stack   res     8           ' Local stack
      overlay_data    res     16          ' Working data
    
    loading_pattern: |
      load_overlay
              ' PA = overlay number
              shl     pa, #7              ' 128 longs per overlay
              add     pa, overlay_hub_base
              setq    #32-1               ' Load 32 longs
              rdlong  overlay_base, pa
              ret
    
    caching_strategy: |
      ' Track loaded overlay to avoid reload
      current_overlay long    -1
      
      smart_load
              cmp     pa, current_overlay wz
      if_z    ret                     ' Already loaded
              mov     current_overlay, pa
              jmp     #load_overlay

execution_control:
  switching_modes:
    cog_to_hub:
      instruction: "JMP #hub_address"
      example: |
        ORG   0                  ' In COG
        ' ... cog code ...
        JMP   #hub_routine       ' Jump to hub
        
    hub_to_cog:
      instruction: "JMP #cog_address"
      requirement: "Code must already be in COG RAM"
      example: |
        ORGH  $400               ' In HUB
        ' ... hub code ...
        CALL  #load_cog_code     ' Load COG code first
        JMP   #$000              ' Jump to COG
  
  program_counter:
    cog_range: "$000-$1FF (9 bits)"
    hub_range: "$00000-$7FFFF (20 bits)"
    detection: "PC bit 9+ non-zero = hubexec"

instruction_availability:
  cogexec_only:
    - "All FIFO/streamer ops (RDFAST/WRFAST/FBLOCK/RFx/WFx/XINIT/XZERO/XCONT) — Silicon Doc HUB EXECUTION forbidden list"
    - "Some self-modifying code patterns (e.g., patching the just-prefetched-into-FIFO instructions has no effect, since the FIFO already holds them)"
  works_in_both_modes_with_caveats:
    - "REP — works in hubexec but each iteration's hidden jump back to top costs 13+ clocks (hub-branch FIFO refill)"
    - "All ALTx instructions (ALTI/ALTS/ALTD/ALTR/ALTB/ALTSN/ALTSB/ALTSW/ALTGN/ALTGB/ALTGW) — work in both modes; modify the next pipelined instruction regardless of source (cog/LUT or FIFO). Source: Chip Gracey clarification 2026-05-02."
  
  hubexec_only:
    - "None — hubexec is a strict subset (with the forbidden list above)"
  
  performance_differences:
    # All numbers cross-checked against per-instruction YAMLs and Silicon Doc HUB EXECUTION section.
    - "Sequential ALU ops (ADD, SUB, AND, MOV, etc.): 2 clocks in BOTH modes — no penalty in hubexec"
    - "JMP: 4 clocks (cog) vs minimum 13 clocks (hub, +1 if target not long-aligned)"
    - "CALL: 4 clocks (cog) vs minimum 13 clocks (hub, +1 if target not long-aligned)"
    - "RET: 4 clocks (cog) vs minimum 13 clocks (hub, +1 if target not long-aligned)"
    - "DJNZ not taken: 2 clocks (cog) vs 2 clocks (hub) — sequential, no FIFO refill"
    - "DJNZ taken: 4 clocks (cog) vs minimum 13 clocks (hub, +1 if target not long-aligned)"
    - "RDLONG / WRLONG: 9-24 / 3-12 clocks in BOTH modes (hub-access window dependent)"
  
  common_misconception: |
    It is NOT true that 'all hubexec instructions take more clocks than cogexec.'
    Sequential straight-line hubexec instructions stream through the 19-stage
    FIFO at 2 clocks each — IDENTICAL throughput to cogexec. The cost differs
    only at branches, which force a FIFO refill costing minimum 13 clocks
    (vs 4 clocks for a cog branch).
    
    Separately, FIFO/streamer instructions (RDFAST/WRFAST/FBLOCK/RFx/WFx/XINIT
    /XZERO/XCONT) are FORBIDDEN in hubexec because the FIFO is dedicated to
    instruction prefetch — they don't run slowly, they don't run at all.

practical_examples:
  multi_stage_loader:
    description: "Flash loader uses staged loading"
    code: |
      ' Stage 1: Minimal loader in COG
      stage1  org     0
              setq    #16-1           ' Load stage 2
              rdlong  $100, ##stage2_hub
              jmp     #$100
              
      ' Stage 2: Extended loader
              org     $100
              ' More complex loading logic
              setq    #128-1          ' Load main app
              rdlong  0, ##main_app
              jmp     #0
    source: flash_loader.spin2
  
  spi_driver_optimization:
    description: "Critical SPI code in COG, management in HUB"
    code: |
      ' HUB: High-level SPI management
      hub_spi_read
              mov     cmd, #SPI_READ
              mov     addr, pa
              mov     count, pb
              call    #load_spi_driver
              call    #0              ' Call COG driver
              ret
              
      ' COG: Time-critical SPI bit-banging
      cog_spi_driver
              org     0
              rep     #4, count       ' Fast loop
              rol     data, #1    wc
              muxc    outa, spi_mosi_mask
              xor     outa, spi_clk_mask
              testp   spi_miso    wc
              ret
    source: flash_loader.spin2

performance_comparison:
  timing_critical:
    cogexec: |
      REP   #4, #100
      ADD   a, b              ' 2 clocks
      SUB   a, b              ' 2 clocks
      XOR   c, d              ' 2 clocks
      ROL   e, #1             ' 2 clocks
      ' Total: 800 clocks for 100 iterations (REP has zero loop overhead)
    
    hubexec: |
      ' REP not available; use DJNZ
      MOV   count, #100
      .loop
      ADD   a, b              ' 2 clocks (sequential, FIFO streaming)
      SUB   a, b              ' 2 clocks
      XOR   c, d              ' 2 clocks
      ROL   e, #1             ' 2 clocks
      DJNZ  count, #.loop     ' 13-14 clocks taken (FIFO refill, +1 if misaligned)
      ' Per iteration: 8 (body) + ~13 (DJNZ taken) = ~21 clocks
      ' Total: ~2100 clocks for 100 iterations
      ' Cost difference vs cogexec (~13x in this loop) comes ENTIRELY from
      ' the DJNZ branch refill + lack of REP — NOT from per-instruction throughput.
      ' The four ALU ops in the body run at the SAME 2 clocks each.
  
  memory_intensive:
    cogexec: |
      ' Must use hub instructions
      RDLONG  value, ptr      ' 9-24 clocks (hub access, egg-beater dependent)
      ADD     value, #1       ' 2 clocks
      WRLONG  value, ptr      ' 3-12 clocks (hub access, egg-beater dependent)
    
    hubexec: |
      ' Same hub-access ops, same timing as cogexec for these
      RDLONG  value, ptr      ' 9-24 clocks (hub access, egg-beater dependent)
      ADD     value, #1       ' 2 clocks (sequential, FIFO streaming)
      WRLONG  value, ptr      ' 3-12 clocks (hub access, egg-beater dependent)
      ' Note: in hubexec, FIFO/streamer instructions (RDFAST/WRFAST/FBLOCK/
      ' RFx/WFx/XINIT/XZERO/XCONT) cannot be used. RDLONG/WRLONG do work.

code_organization:
  hybrid_approach:
    description: "Mix cogexec and hubexec for optimal performance"
    strategy: |
      1. Time-critical loops in COG
      2. Large program logic in HUB
      3. Interrupt handlers in COG
      4. Data processing in appropriate mode
      5. Overlays for complex COG operations
    
    example: |
      DAT
      ' HUB-based main program
              ORGH
      main    
              CALL  #load_critical_code
              ' Main program logic in hub
              ' ...
              CALL  #$000    ' Call COG routine
              ' ...
              
      ' COG-based critical routine
              ORG   0
      critical_loop
              REP   #4, #1000
              RDLONG data, ptra++
              ADD    sum, data
              MAX    peak, data
              MIN    valley, data
              RET

loading_strategies:
  initial_load:
    description: "Load COG code at startup"
    code: |
      COGINIT #16, #@cog_code, #@parameters
  
  dynamic_load:
    description: "Load different COG code as needed"
    code: |
      SETQ  #(cog_end-cog_start-1)
      RDLONG $000, ##@cog_start
      JMP    #$000
  
  overlay_system:
    description: "Swap COG code sections dynamically"
    code: |
      ' Load overlay 1
      SETQ  #127
      RDLONG $100, ##@overlay1
      CALL   #$100
      
      ' Load overlay 2  
      SETQ  #127
      RDLONG $100, ##@overlay2
      CALL   #$100
  
  demand_paging:
    description: "Load code on-demand based on usage"
    code: |
      ' Check if function loaded
      cmp     loaded_func, requested_func wz
      if_nz   call    #load_function
              call    #function_base
    source: complex_systems

fifo_behavior:
  # CANONICAL MENTAL MODEL — read this first when reasoning about hubexec timing.
  # All numbers verified against Silicon Doc v35 HUB EXECUTION section
  # (P2 Silicon Doc v35) and
  # per-instruction YAMLs in deliverables/ai/P2/language/pasm2/.
  summary: |
    Hubexec instruction timing is governed by the per-cog instruction-prefetch
    FIFO. Per Silicon Doc verbatim, 'The FIFO contains (cogs+11) stages' —
    19 stages on a P2 with 8 cogs. While streaming, sequential instructions
    execute at 2 clocks each, IDENTICAL to cogexec. A branch forces FIFO refill
    from a new hub address, which Silicon Doc states 'takes a minimum of 13
    clock cycles. If the instruction being branched to is not long-aligned,
    one additional clock cycle is required.' FIFO/streamer instructions are
    not usable in hubexec at all.
  
  fifo_depth:
    stages: "(cogs+11) = 19 stages on an 8-cog P2"
    refill_threshold: "FIFO loads continuously whenever fewer than (cogs+7) = 15 stages are filled"
    overflow_margin: "After threshold reached, up to 5 more longs may stream in, potentially filling all (cogs+11) stages"
    source: "Silicon Doc v35 verbatim"
  
  streaming_mode:
    description: "Default mode while executing straight-line hubexec code"
    cost_per_instruction: "2 clocks (SAME as COGEXEC — the FIFO ensures no per-instruction hub-window penalty)"
    mechanism: "FIFO continuously prefetches instructions; instruction pipeline drains at 2 clocks each as long as FIFO is fed"
    source: "Silicon Doc v35 + Chip Gracey clarification (Silicon Doc describes the streaming mechanism qualitatively; Chip's clarification supplies the explicit '2 clocks' figure for sequential hubexec)"
  
  branch_refill:
    minimum_cost: "13 clocks"
    misalignment_cost: "+1 clock if target instruction is not long-aligned"
    typical_range: "13-14 clocks (most cases); up to ~20 with hub-window misalignment"
    source: "Silicon Doc v35 verbatim: 'Branching to a hub address takes a minimum of 13 clock cycles. If the instruction being branched to is not long-aligned, one additional clock cycle is required.' Per-instruction YAMLs (jmp/call/ret) cite range 13...20."
    branches_that_trigger_refill:
      - "JMP, CALL, CALLA, CALLB, CALLD, CALLPA, CALLPB — unconditional branches to a new address"
      - "RET, RETA, RETB, RETI0/1/2/3, RESI0/1/2/3 — returns to a different address"
      - "Conditional jumps when taken: DJZ/DJNZ/DJF/DJNF/DJZ/IJZ/IJNZ, TJZ/TJNZ/TJF/TJNF/TJV/TJS/TJNS"
      - "REP-like patterns implemented with DJNZ pay the 13+ clock branch cost on each iteration"
  
  forbidden_in_hubexec:
    # NOT a timing penalty — these simply cannot be used while in hubexec.
    instructions: ["RDFAST", "WRFAST", "FBLOCK", "RFBYTE", "RFWORD", "RFLONG", "RFVAR", "RFVARS", "WFBYTE", "WFWORD", "WFLONG", "XINIT", "XZERO", "XCONT (when streamer engages FIFO)"]
    rationale: "FIFO is dedicated to instruction prefetch; these instructions repurpose or consume the FIFO"
    source: "Silicon Doc v35 HUB EXECUTION section verbatim"
  
  hub_io_in_hubexec:
    # RDLONG/WRLONG and friends DO work in hubexec, with normal hub-access timing.
    instructions: ["RDBYTE", "RDWORD", "RDLONG", "WRBYTE", "WRWORD", "WRLONG"]
    timing: "9-24 clocks for reads, 3-12 clocks for writes (egg-beater hub-window dependent) — same in both cogexec and hubexec"
    note: "These do not disrupt the instruction-prefetch FIFO"
  
  practical_implications:
    - "Tight loops in hubexec: each iteration's branch costs minimum 13 clocks on top of the body"
    - "Long straight-line sequences run at full 2-clock-per-instruction throughput in hubexec, identical to cogexec"
    - "Mixing hub I/O with hubexec code is fine — RDLONG/WRLONG work the same as in cogexec"
    - "Streamer-driven I/O is incompatible with hubexec; use cogexec when the streamer is needed"
    - "Move tight inner loops to cogexec (REP), keep large straight-line code in hubexec"
  
  see_also:
    - "deliverables/ai/P2/architecture/fifo.yaml — FIFO hardware (streamer-transfer role)"
    - "deliverables/ai/P2/language/pasm2/concepts/execution_modes.yaml — three-mode overview"
    - "deliverables/ai/P2/architecture/p2-architecture-mental-model.yaml — 19-stage prefetch FIFO"

interrupt_considerations:
  cogexec:
    - "Interrupts immediate (2 clock response)"
    - "ISR can be in COG RAM"
    - "Deterministic interrupt timing"
  
  hubexec:
    - "Interrupt response varies with hub timing"
    - "ISR should be in COG for consistency"
    - "May need to load ISR code first"
  
  debug_isr_requirement:
    - "Must be in COG for reliability"
    - "Uses overlays for complex operations"
