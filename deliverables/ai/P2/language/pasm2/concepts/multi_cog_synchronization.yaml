concept: multi_cog_synchronization
title: Multi-COG Synchronization and Coordination
category: parallel_processing
description: Hardware and software mechanisms for coordinating multiple COGs in P2
documentation_source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), LOCKS; COG ATTENTION; SMART PINS (long repository mode); Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, HUB, p.24 (atomic operations in a hub access window); EF-037 (one-long record publication: staged + one-store publish 0 torn in 200,000; field-by-field into the shared long 116,452 torn in 200,000; 1 µs between field writes)"
documentation_level: comprehensive
created: 2025-09-09

overview: |
  P2 provides 8 independent COGs that can run in parallel. The synchronization
  primitives are hardware locks, attention signals, shared hub memory, and Smart Pin
  repositories.

hardware_primitives:
  locks:
    count: 16
    numbers: "0-15"
    atomic_operations: "Test-and-set via LOCKTRY"
    traditional_usage:
      lock_15: "Allocated by the debugger in a DEBUG build"
    
    lock_operations:
      LOCKTRY:
        syntax: "LOCKTRY {#}lock_num {WC}"
        operation: "Try to acquire lock (non-blocking)"
        returns: "C=1 if acquired, C=0 if busy"
        example: |
          acquire_resource
                  locktry #RESOURCE_LOCK  wc
          if_nc   ret                     ' Failed
                  ' Critical section
                  ' ...
                  lockrel #RESOURCE_LOCK
                  ret
      
      LOCKREL:
        syntax: "LOCKREL {#}lock_num {WC}"
        operation: "Release lock"
        with_wc: "C = lock currently taken; a register D receives the current/last owner cog ID"
        
      LOCKNEW:
        syntax: "LOCKNEW lock_reg {WC}"
        operation: "Allocate unused lock"
        returns: "Lock number in D, C=1 if none available"
        
      LOCKRET:
        syntax: "LOCKRET {#}lock_num"
        operation: "Return lock to pool"
    
  attention_signals:
    mechanism: "COG-to-COG interrupt/event signaling"
    operations:
      COGATN:
        syntax: "COGATN {#}cog_mask"
        operation: "Signal attention to COG(s)"
        example: |
          ' Signal COG 3
          cogatn  #%0000_1000
          
          ' Signal multiple COGs
          cogatn  #%0000_1111     ' COGs 0-3
      
      POLLATN:
        syntax: "POLLATN {WC|WZ|WCZ}"
        operation: "Get the ATN event flag into C/Z, then clear it"
        returns: "C (with WC) or Z (with WZ) = 1 if attention was set"
        
      WAITATN:
        syntax: "WAITATN {WC|WZ|WCZ}"
        operation: "Wait for the ATN event flag, then clear it"
        use: "Block until signaled. A prior SETQ sets an optional CT timeout; with WC, WZ or WCZ, C/Z = 1 on timeout"
    
  shared_memory:
    hub_ram: "512KB shared by all COGs"
    source: "P2 hardware verification, EF-037 (the 200,000-read counts and the 1 µs window between field writes); Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, HUB, p.24 (single atomic operation in a hub access window)"
    atomic_ops: "In any given hub access window a cog can perform a single atomic operation on a single entity, such as writing a value to one hub RAM location. In Spin2, a record kept as a struct with member bitfields packed into one long, staged in a private local, published with one whole-struct store and read with one whole-struct load, read no torn snapshot in 200,000 reads; the same fields written one at a time straight into the shared long (each bitfield write is a read-modify-write of the backing long), 1 µs apart, read torn in 116,452 of 200,000. Measured with that 1 µs window between field writes only."
    last_16kb: "The last 16KB of hub RAM ($7C000..$7FFFF, also at $FC000..$FFFFF) holds the 16KB of internal ROM cached into it on startup, supplies the cog-register save buffers of the debug interrupt (from $FFC00), and can be write-protected with HUBSET."
    coordination_pattern: |
      ' Mailbox pattern
      CON
        mailbox_base    = $72000     ' below the last 16KB ($7C000..$7FFFF)

      DAT
              org 0
      ' COG A writes request
      wrlong  request, ##mailbox_base
      wrlong  #1, ##mailbox_base+4     ' Flag
      
      ' COG B polls for request
      .wait   rdlong  flag, ##mailbox_base+4
              tjz     flag, #.wait
              rdlong  request, ##mailbox_base
              ' Process request
              wrlong  #0, ##mailbox_base+4     ' Clear flag

resource_protection_patterns:
  simple_mutex:
    description: "Basic mutual exclusion"
    code: |
      ' Define lock number
      CON
        SPI_LOCK = 5

      DAT
              org 0
      spi_transaction
              locktry #SPI_LOCK       wc
      if_nc   jmp     #spi_transaction     ' Spin wait
              
              ' Exclusive SPI access
              call    #spi_select
              call    #spi_transfer
              call    #spi_deselect
              
              lockrel #SPI_LOCK
              ret
    
  timeout_mutex:
    description: "Mutex with timeout"
    code: |
      acquire_with_timeout
              mov     timeout, ##1_000_000
      .retry  locktry #RESOURCE_LOCK  wc
      if_c    ret                          ' Got it
              djnz    timeout, #.retry
              ' Timeout - handle error
              neg     result, #1               ' Return error
              ret
    
  multi_resource:
    description: "Acquire multiple locks in a fixed order, releasing those held when a later one is busy"
    code: |
      ' Acquire A, then B, then C; on a failure release what is held and retry
      acquire_all
              locktry #LOCK_A        wc
      if_nc   jmp     #acquire_all         ' Wait for A
              
              locktry #LOCK_B        wc
      if_nc   lockrel #LOCK_A              ' Release A
      if_nc   jmp     #acquire_all         ' Retry
              
              locktry #LOCK_C        wc
      if_nc   lockrel #LOCK_B              ' Release B
      if_nc   lockrel #LOCK_A              ' Release A
      if_nc   jmp     #acquire_all         ' Retry
              
              ' Have all three locks
              ret
    
  scoped_lock:
    description: "Release a held lock on every exit, tracked by a flag bit"
    code: |
      protected_operation
              locktry lock_num       wc
      if_nc   ret                          ' Can't proceed
              
              bith    flags, #HAVE_LOCK    ' Mark ownership
              
              ' Do work (may have multiple exits)
              call    #complex_work
              
      .cleanup
              testb   flags, #HAVE_LOCK   wc
      if_c    lockrel lock_num
              bitl    flags, #HAVE_LOCK
              ret

producer_consumer_patterns:
  ring_buffer:
    description: "Ring buffer with a producer head index and a consumer tail index in hub RAM"
    code: |
      ' Hub memory layout
      CON
        ring_base       = $70000
        ring_size       = 1024        ' Longs
        ring_mask       = ring_size-1
        head_ptr        = ring_base + (ring_size*4)
        tail_ptr        = head_ptr + 4

      DAT
              org 0
      ' Producer (any COG)
      produce_data
              rdlong  head, ##head_ptr
              mov     next_head, head
              incmod  next_head, ##ring_mask
              
              ' Check if full
              rdlong  tail, ##tail_ptr
              cmp     next_head, tail    wz
      if_z    ret                        ' Buffer full
              
              ' Write data
              shl     head, #2
              add     head, ##ring_base
              wrlong  data, head
              
              ' Update head
              wrlong  next_head, ##head_ptr
              ret
      
      ' Consumer (any COG)
      consume_data
              rdlong  tail, ##tail_ptr
              rdlong  head, ##head_ptr
              cmp     tail, head         wz
      if_z    ret                        ' Buffer empty
              
              ' Read data
              mov     addr, tail
              shl     addr, #2
              add     addr, ##ring_base
              rdlong  data, addr
              
              ' Update tail
              incmod  tail, ##ring_mask
              wrlong  tail, ##tail_ptr
              ret
    
  mailbox_system:
    description: "Multi-COG mailbox communication"
    code: |
      ' Each COG has mailbox
      CON
        mailbox_size    = 16         ' Bytes per mailbox
        mailbox_base    = $72000     ' below the last 16KB ($7C000..$7FFFF)

      DAT
              org 0
      ' Send message to COG
      send_to_cog
              ' PA = target COG, PB = message
              mov     mask, #1
              shl     mask, pa        ' mask bit = target COG
              shl     pa, #4          ' *16 for mailbox offset
              add     pa, ##mailbox_base
              wrlong  pb, pa          ' Write message
              add     pa, #4
              wrlong  #1, pa          ' Set flag
              
              ' Signal target COG
              cogatn  mask
              ret
      
      ' Check own mailbox
      check_mailbox
              cogid   pa
              shl     pa, #4
              add     pa, ##mailbox_base+4
              rdlong  flag, pa
              tjz     flag, #.no_message
              
              ' Get message
              sub     pa, #4
              rdlong  message, pa
              add     pa, #4
              wrlong  #0, pa          ' Clear flag
              
              ' Process message
              call    #handle_message
      .no_message
              ret

smart_pin_repository:
  description: "Use Smart Pins for inter-COG data exchange"
  benefits: "A smart pin in a long repository mode holds a long that is written with WXPIN and read with RDPIN or RQPIN"
  pattern: |
    ' Configure repository pin
    setup_repository
            wrpin   ##P_REPOSITORY, #REPO_PIN
            dirh    #REPO_PIN
            ret
    
    ' COG A writes
    write_shared_data
            wxpin   data_value, #REPO_PIN         ' WXPIN writes the long (smart pin active: DIR = 1)
            ret
    
    ' COG B reads
    read_shared_data
            rdpin   data_value, #REPO_PIN
            ret

parallel_processing_patterns:
  work_distribution:
    description: "Distribute work among COGs"
    code: |
      ' Master COG
      distribute_work
              mov     work_index, #0
              mov     cog_num, #1     ' Start with COG 1
              
      .loop   ' Assign work to each COG
              mov     param, work_index       ' Scratch copy of the work index
              shl     param, #16              ' Work index in the upper half
              or      param, cog_num          ' Cog number in the lower half
              setq    param                   ' PTRA of the new cog
              coginit cog_num, ##@worker_code ' Two operands: cog selector, hub start address
              add     cog_num, #1
              add     work_index, #WORK_CHUNK
              cmp     cog_num, #8     wz
      if_nz   jmp     #.loop
              
              ' Wait for completion
              mov     mask, #$FE      ' COGs 1-7
      .wait   cogatn  mask            ' Signal all
              waitatn                 ' Wait for response
              ' Check completion status...
    
  barrier_synchronization:
    description: "All COGs wait at a one-shot barrier (the arrival counter is guarded by a lock)"
    code: |
      ' Shared barrier counter, guarded by a lock
      CON
        barrier_count   = $73000     ' below the last 16KB ($7C000..$7FFFF)
        barrier_target  = 8
        barrier_lock    = 3

      DAT
              org 0
      barrier_wait
      .lock   locktry #barrier_lock   wc
      if_nc   jmp     #.lock                  ' Wait for the lock
              rdlong  count, ##barrier_count
              add     count, #1
              wrlong  count, ##barrier_count  ' Count this cog's arrival
              lockrel #barrier_lock

              ' Check if all arrived
              cmp     count, #barrier_target wz
      if_z    jmp     #.release

              ' Wait for release
      .wait   rdlong  count, ##barrier_count
              cmp     count, #0       wz
      if_nz   jmp     #.wait
              ret

      .release
              ' Last COG releases all
              wrlong  #0, ##barrier_count     ' Reset counter
              cogatn  #$FF                    ' Signal all COGs
              ret

synchronization_hazards:
  race_conditions:
    problem: "Multiple COGs accessing shared resource"
    mechanism: "Locks give one cog at a time the exclusive status of owner; all participant cogs must agree on a lock's number and its purpose"

  deadlock:
    problem: "Circular lock dependencies"
    mechanism: "Cog A takes LOCK_1 and then tries LOCK_2 while cog B takes LOCK_2 and then tries LOCK_1; each retries the lock the other holds"
    example: |
      ' Can deadlock: each cog holds one lock and spins for the other
      cog_a   locktry #LOCK_1 wc
      if_nc   jmp     #cog_a
      .a2     locktry #LOCK_2 wc
      if_nc   jmp     #.a2

      cog_b   locktry #LOCK_2 wc     ' Different order
      if_nc   jmp     #cog_b
      .b2     locktry #LOCK_1 wc
      if_nc   jmp     #.b2

      ' Consistent order: both cogs take LOCK_1 first, then LOCK_2
      both    locktry #LOCK_1 wc
      if_nc   jmp     #both
      .both2  locktry #LOCK_2 wc
      if_nc   jmp     #.both2
    
lock_15:
  - "LOCK[15] is allocated by the debugger and used among all cogs during their debug interrupts (architecture/locks.yaml)"

sources:
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), LOCKS"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), COG ATTENTION"
  - "Parallax Spin2/PASM Debugger v51, debug entry and debug_exit (LOCKTRY #15 / LOCKREL #15 give one cog at a time ownership of the save buffer and tx/rx pins)"
  - "Parallax Propeller 2 Spin2 Language Documentation v55, DEBUG (LOCK[15] is allocated by the debugger and used among all cogs during their debug interrupts)"

hub_symbols: "Fragments here that use a hub symbol as an immediate assume a PASM-only file, where hub addresses are absolute. In a Spin2 object, DAT hub addresses are relative to the object: see language/spin2/integration/spin2-pasm2-integration.yaml hub_address_resolution."