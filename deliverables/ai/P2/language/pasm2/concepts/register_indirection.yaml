concept: register_indirection
title: Register Indirection - ALTx Instructions
category: advanced_addressing
description: Dynamic runtime modification of instruction operands using ALTx prefix instructions

overview: |
  Register indirection in P2 allows instructions to use computed addresses for their source (S) and 
  destination (D) operands. The ALTx instructions modify the next instruction's operand fields at 
  runtime, so a register can supply a computed source, destination or result address without self-modifying code.

altx_instructions:
  ALTS:
    function: "Substitute S field of next instruction"
    syntax: "ALTS index_reg, #base"
    operation: "Next_S = base + index_reg[8:0]; then index_reg += sign-extended S[17:9]"
    range: "9-bit result (0-511)"
    examples:
      - |
        MOV index, #5
        ALTS index, #table_base
        MOV result, 0-0         ' Actually reads from table_base+5

  ALTD:
    function: "Substitute D field of next instruction"
    syntax: "ALTD index_reg, #base"
    operation: "Next_D = base + index_reg[8:0]; then index_reg += sign-extended S[17:9]"
    range: "9-bit result (0-511)"
    examples:
      - |
        MOV index, #10
        ALTD index, #array_start
        MOV 0-0, value          ' Actually writes to array_start+10

  ALTR:
    function: "Substitute result destination"
    syntax: "ALTR index_reg, #base"
    operation: "Result_D = (index_reg + base) & $1FF, like ALTS/ALTD; the base is the S operand; then index_reg += sign-extended S[17:9]"
    range: "9-bit result (0-511)"
    examples:
      - |
        MOV offset, #3
        ALTR offset, #base_reg
        ADD base_reg, value     ' Result goes to base_reg+3

  ALTI:
    function: "Substitute fields of the next instruction (Result, D and S, with increment or decrement of the template), or substitute the whole instruction"
    syntax: "ALTI template, {#}Src (syntax 1) or ALTI template (syntax 2)"
    operation: "Syntax 1: Src is six 3-bit fields, %rrr_ddd_sss_RRR_DDD_SSS. The template register holds a value laid out like an opcode: Result in [27:19], D in [17:9], S in [8:0]. The %RRR, %DDD and %SSS codes choose which of those fields are substituted into the next instruction and whether the template field increments or decrements; the %rrr, %ddd and %sss codes set how many LSBs of each template field take part in the increment or decrement (000 = 9 bits, down to 111 = 2 LSBs). Syntax 2: ALTI template is ALTI template,#%101_100_100, which executes the template register in place of the next instruction without altering it."
    behavior: "The substitution happens in the instruction pipeline only; the code is not altered. The table of codes is in language/pasm2/alti.yaml."
    examples:
      - |
        MOV exec_reg, ##$F100_0000 | (dst<<9) | src   ' an ADD dst, src instruction word
        ALTI exec_reg
        NOP                     ' This becomes ADD dst, src

  ALTB:
    function: "Substitute the D (register) field of the next BITxxx/TESTB instruction"
    syntax: "ALTB bit_reg, #base"
    operation: "Next instruction's D = (bit_reg[13:5] + base) & $1FF; its S operand supplies the bit number, so name the same register there (bit_reg[4:0])"
    range: "14-bit bit index: register offset in [13:5], bit number in [4:0]"
    note: "BITxxx also reads S[9:5] as a span of extra bits, so a bit number held in a register can be misread; a SETQ with value 0 right before the ALTB + BITxxx pair forces the single-bit form"
    examples:
      - |
        MOV bit_num, #7
        ALTB bit_num, #flags
        BITH 0-0, bit_num       ' Actually sets bit 7 of flags

advanced_features:
  increment_modes:
    description: "ALTx adds the sign-extended S[17:9] to D after the substitution (index update)"
    options:
      - "S[17:9] = 0: D unchanged (a plain 9-bit #S)"
      - "S[17:9] = 1: D incremented by 1"
      - "S[17:9] = -1: D decremented by 1"
    syntax_variants:
      - "ALTS index, #base                (no update)"
      - "ALTS index, ##$200 + base        (post-increment)"
      - "ALTS index, ##$3FE00 + base      (post-decrement)"
    examples:
      - |
        MOV index, #0
        REP #4, #10                  ' repeat the next 4 instructions (AUGS, ALTS, MOV, ADD) 10 times
          ALTS index, ##$200 + table   ' Index increments after use
          MOV sum, 0-0
          ADD total, sum

  combined_operations:
    description: "ALTx alters only the instruction that follows it; to substitute both S and D of one instruction use ALTI"
    examples:
      - |
        ' Copy with computed source and destination: ptrs[8:0] = source register, ptrs[17:9] = destination register
        MOV  ptrs, ##(dst_reg<<9) | src_reg
        REP  #2, count
        ALTI ptrs, #%111_111      ' next D = ptrs[17:9], next S = ptrs[8:0]; both then step up by 1
        MOV  0-0, 0-0

  conditional_execution:
    description: "ALTx instructions carry the EEEE condition field in their encoding"
    source: "P2 Instructions v35 - Rev B/C Silicon, Sheet1 (ALTS, ALTD, ALTR, ALTB, ALTI rows: Encoding column begins EEEE)"

operational_details:
  timing:
    - ALTx takes 2 clocks
    - The next instruction is shielded from interrupts
    - ALTx alters the next instruction regardless of its kind

  scope:
    - Affects ONLY the next instruction

  preservation:
    - The field substitution happens in the instruction pipeline only; the code is not altered and the values do not persist
    - No self-modifying code needed

common_patterns:
  table_lookup:
    code: |
      ALTS index, #lookup_table
      MOV result, 0-0
    description: "Index into lookup table"

  array_copy:
    code: |
      REP #6, count             ' repeat the next 6 instructions (2 AUGS, 2 ALTx, 2 MOV) count times
      ALTS src_ptr, ##$200      ' next S = src_ptr, then src_ptr += 1
      MOV  tmp, 0-0             ' tmp = cog[src_ptr]
      ALTD dst_ptr, ##$200      ' next D = dst_ptr, then dst_ptr += 1
      MOV  0-0, tmp             ' cog[dst_ptr] = tmp
    description: "Memory-to-memory copy"

  bit_scan:
    code: |
      MOV bit_pos, #0
      .loop
        ALTB bit_pos, #flags
        TESTB 0-0, bit_pos WC    ' C = bit bit_pos of flags
        IF_C JMP #found
        ADD bit_pos, #1
        CMP bit_pos, #32 WZ
        IF_NZ JMP #.loop
    description: "Find first set bit"

limitations:
  - Limited to 9-bit address range (0-511)
  - Each ALTx affects only the next instruction
  - "An ALTx with an immediate #S operand placed between an AUGS and the instruction the AUGS was written for also takes the AUGS value (see architecture/silicon_errata.yaml)"

sources:
  - "REP block counts in the examples: CP-038 (REP @label over a body with a ## operand assembles a count that includes the inserted AUGS word)"
  - "Propeller 2 Assembly Language (PASM2) Manual, ALTB, pp.38-39 (a SETQ #0 followed by the ALTB then BITxxx instructions forces BITxxx's Src[9:5] bits to 0, the single-bit form)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), REGISTER INDIRECTION (ALTS/ALTD/ALTR/ALTB, ALTI syntax 1 and 2, the %rrr_ddd_sss_RRR_DDD_SSS Src layout, the substitution happening in the pipeline only) and KNOWN SILICON BUGS (an intervening ALTx with an immediate #S between AUGS and its target)"
  - "Propeller 2 Assembly Language (PASM2) Manual, ALTS Notes, p.46 ('The instruction following ALTS is shielded from interrupt'; 'ALTS alters the next instruction regardless of its kind')"
  - "P2 Instructions v35 - Rev B/C Silicon, Sheet1 (ALTS, ALTD, ALTR, ALTB, ALTI: 2 clocks; the next instruction shielded from interrupts)"