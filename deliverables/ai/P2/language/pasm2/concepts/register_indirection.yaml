concept: register_indirection
title: Register Indirection - ALTx Instructions
category: advanced_addressing
description: Dynamic runtime modification of instruction operands using ALTx prefix instructions

overview: |
  Register indirection in P2 allows instructions to use computed addresses for their source (S) and 
  destination (D) operands. The ALTx instructions modify the next instruction's operand fields at 
  runtime, enabling table lookups, computed jumps, and dynamic data access without self-modifying code.

altx_instructions:
  ALTS:
    function: "Substitute S field of next instruction"
    syntax: "ALTS index_reg, #base"
    operation: "Next_S = base + index_reg[8:0]; then index_reg += sign-extended S[17:9]"
    range: "9-bit result (0-511)"
    examples:
      - |
        MOV index, #5
        ALTS index, #table_base
        MOV result, 0-0         ' Actually reads from table_base+5
    use_cases:
      - Table lookups
      - Array indexing
      - Switch/case implementation

  ALTD:
    function: "Substitute D field of next instruction"
    syntax: "ALTD index_reg, #base"
    operation: "Next_D = base + index_reg[8:0]; then index_reg += sign-extended S[17:9]"
    range: "9-bit result (0-511)"
    examples:
      - |
        MOV index, #10
        ALTD index, #array_start
        MOV 0-0, value          ' Actually writes to array_start+10
    use_cases:
      - Dynamic destination selection
      - Array element assignment
      - Scatter operations

  ALTR:
    function: "Substitute result destination"
    syntax: "ALTR index_reg, #base"
    operation: "Result_D = (index_reg + base) & $1FF, like ALTS/ALTD; the base is the S operand; then index_reg += sign-extended S[17:9]"
    range: "9-bit result (0-511)"
    examples:
      - |
        MOV offset, #3
        ALTR offset, #base_reg
        ADD base_reg, value     ' Result goes to base_reg+3
    use_cases:
      - Indexed result storage
      - Relative addressing
      - Structure field updates

  ALTI:
    function: "Substitute next instruction entirely"
    syntax: "ALTI exec_reg"
    operation: "Execute instruction from exec_reg"
    behavior: "Next instruction slot executes exec_reg contents"
    examples:
      - |
        MOV exec_reg, ##$F100_0000 | (dst<<9) | src   ' an ADD dst, src instruction word
        ALTI exec_reg
        NOP                     ' This becomes ADD dst, src
    use_cases:
      - Computed operations
      - Instruction synthesis
      - Interpreters

  ALTB:
    function: "Substitute the D (register) field of the next BITxxx/TESTB instruction"
    syntax: "ALTB bit_reg, #base"
    operation: "Next instruction's D = (bit_reg[13:5] + base) & $1FF; its S operand supplies the bit number, so name the same register there (bit_reg[4:0])"
    range: "14-bit bit index: register offset in [13:5], bit number in [4:0]"
    note: "BITxxx also reads S[9:5] as a span of extra bits, so a bit number held in a register can be misread; a SETQ with value 0 right before the ALTB + BITxxx pair forces the single-bit form"
    examples:
      - |
        MOV bit_num, #7
        ALTB bit_num, #flags
        BITH 0-0, bit_num       ' Actually sets bit 7 of flags
    use_cases:
      - Dynamic bit manipulation
      - Bit array operations
      - Flag management

advanced_features:
  increment_modes:
    description: "ALTx adds the sign-extended S[17:9] to D after the substitution (index update)"
    options:
      - "S[17:9] = 0: D unchanged (a plain 9-bit #S)"
      - "S[17:9] = 1: D incremented by 1"
      - "S[17:9] = -1: D decremented by 1"
    syntax_variants:
      - "ALTS index, #base                (no update)"
      - "ALTS index, ##$200 + base        (post-increment)"
      - "ALTS index, ##$3FE00 + base      (post-decrement)"
    examples:
      - |
        MOV index, #0
        REP #3, #10
          ALTS index, ##$200 + table   ' Index increments after use
          MOV sum, 0-0
          ADD total, sum

  combined_operations:
    description: "ALTx alters only the instruction that follows it; to substitute both S and D of one instruction use ALTI"
    examples:
      - |
        ' Copy with computed source and destination: ptrs[8:0] = source register, ptrs[17:9] = destination register
        MOV  ptrs, ##(dst_reg<<9) | src_reg
        REP  #2, count
        ALTI ptrs, #%111_111      ' next D = ptrs[17:9], next S = ptrs[8:0]; both then step up by 1
        MOV  0-0, 0-0

  conditional_execution:
    description: "ALTx instructions can be conditional"
    examples:
      - |
        CMP mode, #INDEXED WZ
        IF_Z ALTS index, #table
        MOV result, default_source  ' Uses indexed or default

operational_details:
  timing:
    - ALTx takes 2 cycles
    - Modified instruction executes normally
    - No pipeline stall
    - ALTx alters only the next instruction, even when that instruction is itself an ALTx

  scope:
    - Affects ONLY the next instruction
    - Cannot affect instructions after branches
    - Works across conditional execution
    - Works in hub execution mode

  preservation:
    - Original instruction unchanged
    - Only execution affected
    - No self-modifying code needed
    - Thread-safe in multi-cog systems

common_patterns:
  table_lookup:
    code: |
      ALTS index, #lookup_table
      MOV result, 0-0
    description: "Index into lookup table"

  array_copy:
    code: |
      REP #4, count
      ALTS src_ptr, ##$200      ' next S = src_ptr, then src_ptr += 1
      MOV  tmp, 0-0             ' tmp = cog[src_ptr]
      ALTD dst_ptr, ##$200      ' next D = dst_ptr, then dst_ptr += 1
      MOV  0-0, tmp             ' cog[dst_ptr] = tmp
    description: "Memory-to-memory copy"

  bit_scan:
    code: |
      MOV bit_pos, #0
      .loop
        ALTB bit_pos, #flags
        TESTB 0-0, bit_pos WC    ' C = bit bit_pos of flags
        IF_C JMP #found
        ADD bit_pos, #1
        CMP bit_pos, #32 WZ
        IF_NZ JMP #.loop
    description: "Find first set bit"

limitations:
  - Cannot modify immediate values
  - Limited to 9-bit address range (0-511)
  - Cannot chain (each affects only next instruction)
  - No effect on AUGS/AUGD augmentation

best_practices:
  - Use for table-driven code
  - Prefer over self-modifying code
  - Document computed addresses clearly
  - Validate index bounds before use
  - Consider REP for repeated operations

debugging:
  challenges:
    - Actual addresses computed at runtime
    - Disassembly shows placeholder values
    - Single-stepping through ALTx complex

  techniques:
    - Add guards to check computed addresses
    - Use fixed values during development
    - Log computed addresses for verification

references:
  - silicon_doc: Register Indirection section
  - instruction_set: ALTx instruction encodings
  - optimization_guide: Table-driven techniques