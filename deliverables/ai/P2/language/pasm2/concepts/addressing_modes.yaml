concept: addressing_modes
title: PASM2 Addressing Modes
category: instruction_encoding
description: Methods for specifying operands in PASM2 instructions

overview: |
  PASM2 provides multiple addressing modes for flexible operand specification. Understanding these modes
  is critical for efficient code generation. Each mode has specific use cases and encoding requirements.
  The operand syntax selects the mode: no prefix, #, ##, or a PTRx expression.

modes:
  immediate:
    syntax: "#value"
    encoding: S field contains literal value
    range:
      - 9-bit: "#0 to #511 (literal fits the instruction's 9-bit S or D field)"
      - 32-bit: '##$0 to ##$FFFFFFFF (full 32-bit literal via an augment prefix)'
    examples:
      - "MOV r0, #42           ' 9-bit immediate"
      - "MOV r0, ##1000        ' 32-bit Src immediate (AUGS prefix added)"
      - "MOV r0, ##$12345678   ' 32-bit Src immediate (AUGS prefix added)"
    notes: "## forms a full 32-bit literal. The split between AUGS and AUGD is by FIELD, not width: AUGS augments a literal in the Src field, AUGD a literal in the Dest field — both yield a full 32-bit literal (23 augment bits + 9 field bits)."

  register_direct:
    syntax: "register"
    encoding: S or D field contains register address
    range: $000-$1FF (cog RAM)
    examples:
      - MOV dest, source      ' Register to register
      - ADD accumulator, value
    notes: Most common mode for cog operations

  register_indirect:
    syntax: "PTRx"
    encoding: "PTR expression with no index and no update (see ptr_expression_encoding)"
    registers: PTRA, PTRB only
    examples:
      - RDLONG value, PTRA    ' Read from hub[PTRA]
      - WRLONG value, PTRB    ' Write to hub[PTRB]
    notes: "Hub memory access only. A plain register S is also a hub address for these instructions: its 20 LSBs are used as the address."

  indexed:
    syntax: "PTRx[index]"
    encoding: PTR with offset encoding
    base: PTRA or PTRB
    index_range: -32 to +31 (6-bit signed)
    examples:
      - "RDLONG r0, PTRA[4]    ' Read from hub[PTRA + 16] (index scaled by 4)"
      - "WRWORD r0, PTRB[-2]   ' Write to hub[PTRB - 4] (index scaled by 2)"
    scaling:
      - RDBYTE/WRBYTE: index × 1
      - RDWORD/WRWORD: index × 2
      - RDLONG/WRLONG/WMLONG: index × 4
    notes: The index is scaled by the operation size

  auto_increment:
    syntax: "PTRx++"
    encoding: Special PTR encoding bits
    behavior: Use current value, then increment
    examples:
      - "RDLONG r0, PTRA++     ' Read from hub[PTRA], then PTRA += 4"
      - "WRWORD r0, PTRB++     ' Write to hub[PTRB], then PTRB += 2"
      - "PUSHB value           ' Implicit PTRB++ operation (WRLONG value,PTRB++)"
    increment_amount: Based on operation size (1/2/4 bytes)

  auto_decrement:
    syntax: "--PTRx"
    encoding: Special PTR encoding bits
    behavior: Decrement first, then use new value
    examples:
      - "RDLONG r0, --PTRA     ' PTRA -= 4, then read from hub[PTRA]"
      - "POPB value            ' Implicit --PTRB operation (RDLONG value,--PTRB)"
    decrement_amount: Based on operation size (1/2/4 bytes)

  post_modify:
    syntax: "PTRx++[index]"
    encoding: Combined PTR mode encoding
    behavior: Use current value, then add scaled index
    index_range: "1 to 16 (magnitude; ++ forms add INDEX*SCALE, -- forms subtract INDEX*SCALE)"
    examples:
      - "RDLONG r0, PTRA++[8]  ' Read from hub[PTRA], then PTRA += 32"
      - "WRLONG r0, PTRB--[1]  ' Write to hub[PTRB], then PTRB -= 4"
    notes: Index is scaled by operation size

  absolute:
    syntax: "##hub_address"
    encoding: 20-bit immediate for hub operations
    range: '##$00000 to ##$FFFFF'
    examples:
      - "RDLONG r0, ##$10000   ' Read from hub[$10000]"
      - "WRLONG r0, ##buffer   ' Write to hub[buffer]"
    notes: Uses AUGS for 20-bit address

  bit_addressing:
    syntax: "BITx register, #bit_number"
    encoding: Bit number in immediate field
    range: Bit 0-31
    examples:
      - "BITH flags, #7        ' Set bit 7 of flags"
      - "BITL flags, #READY_BIT ' Clear READY_BIT"
      - "TESTB flags, #4 WC    ' Test bit 4, update C"
    notes: Bit operations only

ptr_expression_encoding:
  applies_to: "The S/#/PTRx operand of RDBYTE, RDWORD, RDLONG, WRBYTE, WRWORD, WRLONG and WMLONG"
  hub_address_operands:
    - "$000..$1FF: a register whose 20 LSBs are used as the hub address"
    - "#$00..$FF: an 8-bit immediate hub address"
    - "##$00000..$FFFFF: a 20-bit immediate hub address (invokes AUGS)"
    - "PTRx {[index5]}: a PTR expression with a 5-bit scaled index"
    - "PTRx {[##index20]}: a PTR expression with a 20-bit unscaled index (invokes AUGS)"
  layout: "%1SUPNNNNN in the 9-bit S field (no AUGS); a leading 0 (#%0AAAAAAAA) is an 8-bit immediate address instead"
  fields:
    S: "0 for PTRA, 1 for PTRB"
    U: "0 keeps PTRx the same, 1 updates PTRx (PTRx += INDEX*SCALE)"
    P: "0 uses PTRx + INDEX*SCALE, 1 uses PTRx (post-modify)"
    N: "the index, in the five bits NNNNN (or nnnnn). The non-updating forms (U = 0) read the P bit and NNNNN together as the six-bit index IIIIII."
  index:
    INDEX6: "-32..+31 for non-updating offsets; IIIIII uses %100000..%111111 for -32..-1 and %000000..%011111 for 0..31"
    INDEX: "1..16 for the ++ and -- forms; NNNNN uses %00001..%01111 for 1..15 and %00000 for 16"
    nnnnn: "-INDEX: %10000..%11111 for -16..-1"
    SCALE: "1 for RDBYTE/WRBYTE, 2 for RDWORD/WRWORD, 4 for RDLONG/WRLONG/WMLONG"
  forms:
    - {bits: "100000000", form: "PTRA", meaning: "use PTRA"}
    - {bits: "110000000", form: "PTRB", meaning: "use PTRB"}
    - {bits: "100IIIIII", form: "PTRA[INDEX6]", meaning: "use PTRA + INDEX6*SCALE"}
    - {bits: "110IIIIII", form: "PTRB[INDEX6]", meaning: "use PTRB + INDEX6*SCALE"}
    - {bits: "101100001", form: "PTRA++", meaning: "use PTRA, PTRA += SCALE"}
    - {bits: "111100001", form: "PTRB++", meaning: "use PTRB, PTRB += SCALE"}
    - {bits: "101111111", form: "PTRA--", meaning: "use PTRA, PTRA -= SCALE"}
    - {bits: "111111111", form: "PTRB--", meaning: "use PTRB, PTRB -= SCALE"}
    - {bits: "101000001", form: "++PTRA", meaning: "use PTRA + SCALE, PTRA += SCALE"}
    - {bits: "111000001", form: "++PTRB", meaning: "use PTRB + SCALE, PTRB += SCALE"}
    - {bits: "101011111", form: "--PTRA", meaning: "use PTRA - SCALE, PTRA -= SCALE"}
    - {bits: "111011111", form: "--PTRB", meaning: "use PTRB - SCALE, PTRB -= SCALE"}
    - {bits: "1011NNNNN", form: "PTRA++[INDEX]", meaning: "use PTRA, PTRA += INDEX*SCALE"}
    - {bits: "1111NNNNN", form: "PTRB++[INDEX]", meaning: "use PTRB, PTRB += INDEX*SCALE"}
    - {bits: "1011nnnnn", form: "PTRA--[INDEX]", meaning: "use PTRA, PTRA -= INDEX*SCALE"}
    - {bits: "1111nnnnn", form: "PTRB--[INDEX]", meaning: "use PTRB, PTRB -= INDEX*SCALE"}
    - {bits: "1010NNNNN", form: "++PTRA[INDEX]", meaning: "use PTRA + INDEX*SCALE, PTRA += INDEX*SCALE"}
    - {bits: "1110NNNNN", form: "++PTRB[INDEX]", meaning: "use PTRB + INDEX*SCALE, PTRB += INDEX*SCALE"}
    - {bits: "1010nnnnn", form: "--PTRA[INDEX]", meaning: "use PTRA - INDEX*SCALE, PTRA -= INDEX*SCALE"}
    - {bits: "1110nnnnn", form: "--PTRB[INDEX]", meaning: "use PTRB - INDEX*SCALE, PTRB -= INDEX*SCALE"}
  encoded_examples:
    - "ptra++ assembles S = %101100001 ($161); ++ptra $141; ptra-- $17F; --ptra $15F"
    - "ptra[3] assembles S = $103; ptra[-20] $12C; ptrb[31] $19F"
    - "ptra++[16] assembles S = $160 (the index field 00000 stands for 16); ptra--[16] $170"
  augmented_form:
    syntax: "PTRx[##index20] (the assembler inserts an AUGS)"
    layout: "##%000000001SUPNNNNNNNNNNN_NNNNNNNNN: after AUGS, bit 23 marks a PTR expression, S, U and P follow, and the 20-bit index N is unscaled"
    rewrite: "RDBYTE D,++PTRB[##$12345] becomes AUGS #$00E12345 followed by RDBYTE D,#$00E12345 & $1FF"
    encoded_examples:
      - "ptra[##1000] assembles the 20-bit index word $8003E8"
      - "ptra++[##1000] assembles the 20-bit index word $B003E8"
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), RANDOM ACCESS INTERFACE (the five ways to express a hub address; PTRx expressions without AUGS; PTRx expressions with AUGS); the S values and the two index words above are what the assembler emits (CP-032, pnut-ts v1.55.10)"

special_cases:
  altx_modified:
    description: ALTX instructions modify subsequent instruction's addressing
    examples:
      - "ALTS index            ' Next instruction's S field = index[8:0]"
      - "ALTD index            ' Next instruction's D field = index[8:0]"
      - "ALTR index            ' Next instruction's result register = index[8:0]"
    notes: Enables computed addressing

  setq_block:
    description: SETQ/SETQ2 modify next hub operation for block transfer
    examples:
      - "SETQ #15              ' Next RDLONG reads 16 longs"
      - "RDLONG base, hub_ptr  ' Block read 16 longs"
    notes: Count is SETQ value + 1

  rep_block:
    description: REP repeats instructions without branching delays in cog/LUT memory
    examples:
      - "REP #4, #10           ' Repeat next 4 instructions 10 times"
      - "REP @end_label, count ' Repeat until end_label, count times"
    notes: Not addressing per se, but affects instruction flow

encoding_selection:
  by_prefix:
    - '## invokes the augmented encoding'
    - '# is the immediate encoding'
    - No prefix is the register encoding

  size_based:
    - 'Values 0-511: Direct immediate (#)'
    - 'Values larger than 9 bits: augmented immediate (##) - AUGS for a Src literal, AUGD for a Dest literal'

hub_symbols: "Fragments here that use a hub symbol as an immediate assume a PASM-only file, where hub addresses are absolute. In a Spin2 object, DAT hub addresses are relative to the object: see language/spin2/integration/spin2-pasm2-integration.yaml hub_address_resolution."

