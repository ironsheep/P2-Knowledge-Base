concept: cordic_solver
title: CORDIC Solver - Hardware Math Acceleration
category: hardware_subsystems
description: 54-stage pipelined math solver for multiplication, division, trigonometry, and transcendental functions

overview: |
  The CORDIC (Coordinate Rotation Digital Computer) solver provides hardware-accelerated
  mathematical operations. While the P2's instruction set includes basic arithmetic, the CORDIC
  handles operations that would otherwise require hundreds of instructions: 32x32-bit multiplication
  producing 64-bit results, division with quotient and remainder, square root extraction,
  trigonometric computations, and logarithmic functions.

architecture:
  pipeline_depth: 54
  result_latency: 55 clocks
  access_interval: 8 clocks (hub rotation window)
  operations_in_flight: several per COG (the documentation gives no count)
  shared_resource: true

operations:
  multiply:
    instruction: QMUL
    inputs: "D (32-bit), S (32-bit)"
    outputs: "GETQX (low 32 bits), GETQY (high 32 bits)"
    description: "32x32 unsigned multiply producing 64-bit result"

  divide:
    instruction: QDIV
    inputs: "SETQ (upper 32 bits), D (lower 32 bits), S (divisor)"
    outputs: "GETQX (quotient), GETQY (remainder)"
    description: "64-bit / 32-bit unsigned division"

  fractional_divide:
    instruction: QFRAC
    inputs: "D (upper 32 bits), SETQ (lower 32 bits), S (divisor)"
    outputs: "GETQX (quotient), GETQY (remainder)"
    description: "Fractional division with reversed operand arrangement"

  square_root:
    instruction: QSQRT
    inputs: "D (lower 32 bits), S (upper 32 bits)"
    outputs: "GETQX (32-bit root)"
    description: "64-bit unsigned square root"

  rotate:
    instruction: QROTATE
    inputs: "SETQ (Y coord), D (X coord), S (angle)"
    outputs: "GETQX (rotated X), GETQY (rotated Y)"
    description: "Coordinate rotation"

  vector:
    instruction: QVECTOR
    inputs: "D (X coord), S (Y coord)"
    outputs: "GETQX (length), GETQY (angle)"
    description: "Cartesian to polar conversion"

  logarithm:
    instruction: QLOG
    inputs: "D (32-bit unsigned)"
    outputs: "GETQX (5:27 log format)"
    description: "Integer to logarithm conversion"

  exponential:
    instruction: QEXP
    inputs: "D (5:27 log format)"
    outputs: "GETQX (32-bit unsigned)"
    description: "Logarithm to integer (antilog)"

usage_patterns:
  basic_pattern:
    description: Queue, wait, retrieve
    code: |
      QMUL    multiplicand, multiplier   ' Queue operation
      ' ... 55 clocks of other work ...
      GETQX   product_lo                 ' Retrieve lower 32 bits
      GETQY   product_hi                 ' Retrieve upper 32 bits

  pipelined_pattern:
    description: Maximum throughput via overlapped operations
    phases:
      - fill: "Give several commands to the CORDIC solver first"
      - steady_state: "Read a result, then give another command, indefinitely"
      - drain: "At the end, read the trailing results"
    code: |
      ' Fill phase
      QMUL a0, b0
      QMUL a1, b1
      QMUL a2, b2
      ' ... queue more ...

      ' Steady state
      .loop
        GETQX result_lo
        GETQY result_hi
        QMUL  a_next, b_next
        DJNZ  count, #.loop

      ' Drain phase: a REP count of 0 repeats forever, so skip the REP when nothing is outstanding
        TJZ   queued_count, #.done     ' queued_count = number of commands still outstanding
        REP   @.drain, queued_count
          GETQX result_lo
          GETQY result_hi
      .drain
      .done
        RET

      queued_count long 0

  no_result_ready_poll:
    description: There is no non-blocking "result ready" test for the CORDIC
    code: |
      QMUL    a, b
      ' ... other work ...
      GETQX   result_lo       ' waits for the result if it is not ready yet
      GETQY   result_hi
    note: "POLLQMT is not a result-ready poll: its flag is set only when a GETQX/GETQY executed with nothing queued or in progress, which is a programming error (event 15). GETQX/GETQY wait, in case the result has not arrived (2...58 clocks)."

interrupt_protection:
  applicability: |
    This section applies to PASM2 code with interrupts enabled.
  description: |
    The 55-clock delay between queuing and retrieval creates a timing window vulnerable to
    interrupts. For timing-critical PASM2 applications with interrupts enabled, place the
    sequence within a REP block, which is automatically shielded from interrupts, including
    non-stallable debug interrupts. A pending interrupt is allowed to branch once REP is no
    longer active and the other branch conditions are met.

  basic_protection:
    description: Protect a single CORDIC operation
    code: |
      REP     @.protect, #1         ' Block is shielded from interrupts
      QMUL    multiplicand, multiplier
      GETQX   result_lo
      GETQY   result_hi
      .protect

  extended_protection:
    description: Protect longer sequences until a branch, such as _ret_, cancels REP
    code: |
      REP     #99, #1               ' Large block, 1 iteration
      QSQRT   value, #0
      GETQX   value                 ' read each result before the next command
      QLOG    value
      GETQX   value
      QEXP    value
      GETQX   value
      _ret_ MOV output, value       ' REP exits at _ret_

  when_needed:
    - "Interrupts must not be enabled while overlapping CORDIC commands: the interrupt service routine can steal enough clocks that one or more results are overwritten before they are read"

result_retrieval:
  blocking_behavior: |
    GETQX and GETQY wait, in case the result has not arrived (2...58 clocks).

  event_generation: |
    Event 15 is generated when GETQX/GETQY executes with no results available.
    This detects programming errors where retrieval occurs before any operations were queued.

timing_considerations:
  - "A cog waits for its hub slot (zero to #cogs-1 clocks) to hand the command to the CORDIC solver; 55 clocks later the results are available via GETQX and GETQY"
  - Each COG gets CORDIC access every 8 clocks (hub rotation)
  - GETQX/GETQY will stall if called too early
  - Multiple COGs share the CORDIC; each cog's active CORDIC instructions and forthcoming results are completely isolated from each other, as well as from other cogs, and each result must be retrieved on time or else it is overwritten by the following result, if any

