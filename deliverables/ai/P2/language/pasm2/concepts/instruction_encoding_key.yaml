  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), COGS (Table 6, the key to the Encoding column: EEEE, C, Z, I, L, WW, DDDDDDDDD, SSSSSSSSS, AAAAAAA, nnnnnn, N/NN/NNN, cccc, zzzz). The R row of that table says 0 = relative and 1 = absolute, the reverse of the instruction spreadsheet, the PASM2 manual and the compiled words; R here follows those three."
  - "P2 Instructions v35 - Rev B/C Silicon, rows 402-407 (JMP, CALL, CALLA, CALLB, CALLD, LOC with an A field: 'If R = 1 then PC += A, else PC = A. \\ forces R = 0'; CALLD and LOC 'per W'), row 157 (CALLD D,S), rows 408-409 (AUGS and AUGD, n field), rows 398-399 (MODC and MODZ, cccc and zzzz), rows 410-459 (instruction prefixes and their EEEE codes), rows 460-491 (MODCZ operand codes cccc or zzzz), rows 10 (ADD), 86, 92 and 98 (GETNIB, GETBYTE, GETWORD with #N), 104, 108 and 112 (ALTGN, ALTGB, ALTGW: N field D[2:0], D[1:0], D[0]), 242 (COGID, the L bit)"
  - "unnamed_encodings: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 1011110 1LI DDDDDDDDD SSSSSSSSS and EEEE 1011111 0LI DDDDDDDDD SSSSSSSSS, listed as <empty> D/#,S/#); P2 Instructions v35 - Rev B/C Silicon, rows 213 and 214 (<empty> {#}D,{#}S with those two encodings and no description); searched both documents and the PASM2 Manual for a description of these words: none"
  - "CP-036 (the assembled words: R = 1 relative and R = 0 absolute for CALL/CALLB/LOC; WW = 00, 01, 10, 11 for PA, PB, PTRA, PTRB in CALLD and LOC; the AUGS/AUGD low 23 bits; MODCZ cccc/zzzz; the GETNIB NNN field; the C, Z and I bits; the EEEE field)"
  - "R across domains: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), BRANCH ADDRESSING (absolute addressing is forced by the assembler when crossing between cog and hub domains; the JMP cases); CP-052 (from hub code, JMP #fastLoop to a cog label assembles to $FD800000, R = 0)"
