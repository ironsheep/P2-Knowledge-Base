instruction: STALLI
syntax: STALLI
brief_description: Stall interrupt branches
category: Interrupt
description: >-
  STALLI stalls INT1, INT2 and INT3 interrupt branches indefinitely until ALLOWI executes.
  STALLI is the complement of the ALLOWI instruction; critical blocks of code can be
  protected from interruption by beginning with STALLI and ending with ALLOWI. ALLOWI
  is the default mode on cog start. An interrupt branch cannot happen while STALLI is
  executing or active. In cog execution, a TRGINT1 executed while STALLI is active is
  held: the INT1 branch did not occur in the 16 instructions measured after the trigger,
  and occurred once ALLOWI executed. Parallax's documents also
  give TRGINT1, TRGINT2 and TRGINT3 as triggering regardless of STALLI mode; TRGINT2 and
  TRGINT3 under STALLI have not been measured. The debug interrupt, a hidden interrupt with priority over
  INT1, INT2 and INT3, is described as non-stallable. During normal program execution, GETBRK with WCZ returns
  C = 1 and D[1] = 1 if the cog is in STALLI mode, or 0 if in ALLOWI mode.
result: Interrupt branches are stalled until ALLOWI executes.
flags_affected:
  C: No effect
  Z: No effect
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1101011 000 000100001 000100100
  write: —
  c: —
  z: —
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, STALLI, p.129"
sources:
