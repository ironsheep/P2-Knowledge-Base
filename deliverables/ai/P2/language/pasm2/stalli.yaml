instruction: STALLI
syntax: STALLI
brief_description: Stall interrupt branches
category: Interrupt
description: >-
  STALLI stalls INT1, INT2 and INT3 interrupt branches indefinitely until ALLOWI executes.
  STALLI is the complement of the ALLOWI instruction; critical blocks of code can be
  protected from interruption by beginning with STALLI and ending with ALLOWI.
result: Interrupt branches are stalled until ALLOWI executes.
flags_affected:
  C: No effect
  Z: No effect
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 1101011 000 000100001 000100100
  write: —
  c: —
  z: —
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, STALLI, p.129"
documentation_level: comprehensive
