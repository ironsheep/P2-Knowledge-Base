  - "P2 Instructions v35 - Rev B/C Silicon, rows 304-306 (TRGINT1, TRGINT2, TRGINT3: regardless of STALLI mode)"
  - "P2 Instructions v35 - Rev B/C Silicon, row 303 (STALLI: stall interrupts; 2 clocks; no write)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Interrupt Instructions, p.44 (STALLI: stall interrupts, 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, STALLI, p.129 (Result line, encoding row 1101011 000 / 000100001 / 000100100, write none, C and Z none, 2 clocks, Related ALLOWI, the explanation that STALLI disables interrupt branching and is the complement of ALLOWI)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), INTERRUPTS (STALLI holds off INT1, INT2 and INT3 interrupt branches indefinitely until ALLOWI executes; critical blocks are protected by beginning with STALLI and ending with ALLOWI; ALLOWI is the default mode on cog start; an interrupt branch needs STALLI not to be executing or active), SETQ CONSIDERATIONS (a REP block is shielded from interrupts, including non-stallable debug interrupts), DEBUG INTERRUPT (the hidden debug interrupt has priority over all the others; GETBRK D WCZ returns C and D[1] = 1 if STALLI mode or 0 if ALLOWI mode), and instruction encoding listing (EEEE 1101011 000 000100001 000100100 STALLI)"
