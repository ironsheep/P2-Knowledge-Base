instruction: NEGZ
syntax: NEGZ Dest, {#}Src        {WC|WZ|WCZ}
brief_description: Negate Z
category: Math and Logic
description: >-
  NEGZ negates Src (syntax 1) or Dest (syntax 2) if Z = 1 and stores the result in
  the Dest register. If Z = 0, the Src or Dest value is left as-is (not negated) and
  is stored into Dest. If the negation is performed, it flips the value's sign;
  ex: 526 becomes -526, or -41 becomes 41.
  If the WC or WCZ effect is specified, the C flag is set (1) if the result is negative,
  or is cleared (0) if positive.
  If the WZ or WCZ effect is specified, the Z flag is set (1) if the result is zero,
  or is cleared (0) if it is non-zero.
result: >-
  The Src or Dest value, possibly negated according to Z, is stored into Dest and
  optionally the C and Z flags are updated to the resulting sign and zero status.
parameters:
- Dest is a register to receive the Src or -Src value (syntax 1), or contains the
  value to negate (syntax 2) according to Z.
- Src is an optional register, 9-bit literal, or 32-bit augmented literal whose value
  (if Z=0) or negated value (if Z=1) is stored into Dest.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set if result is negative (sign bit)
  Z: Set if result equals zero
syntax_variants:
- NEGZ Dest, {#}Src {WC|WZ|WCZ}
- NEGZ Dest {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 0110110 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: Sign of result
  z: Result == 0
  clocks: '2'
- bits: EEEE 0110110 CZ0 DDDDDDDDD DDDDDDDDD
  write: D
  c: Sign of result
  z: Result == 0
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, NEGZ, p.105"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, rows 69 and 70 (NEGZ D,{#}S: negate S by Z into D, if Z = 1 then D = -S else D = S, C = MSB of result; NEGZ D: alias, negate D by Z, encoding EEEE 0110110 CZ0 DDDDDDDDD DDDDDDDDD; footnote * Z = (result == 0); 2 clocks; write D)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Math and Logic Instructions, p.37 (NEGZ D and NEGZ D,{#}S, 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, NEGZ, p.105 (Result line, Dest and Src parameters; both encoding rows 0110110 CZI and CZ0, write D, C flag sign of result, Z flag Result = 0, 2 clocks; Related NEGNZ, NEGC, NEGNC; negation when Z = 1, value left as-is when Z = 0, example 526 becomes -526 and -41 becomes 41; C set if the result is negative; Z set if the result is zero)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 0110110 CZI DDDDDDDDD SSSSSSSSS NEGZ D,S/# {WC/WZ/WCZ}) and instruction aliases (NEGZ register = NEGZ register,register)"
