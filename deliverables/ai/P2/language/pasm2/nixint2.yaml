instruction: NIXINT2
syntax: NIXINT2
encoding:
- bits: EEEE 1101011 000 000100110 000100100
  write: —
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: >-
  Cancel INT2. An INT2 interrupt that has been triggered and is waiting to
  branch is nixed, so its branch does not occur. NIXINT2 is only useful in main
  code after STALLI executes, or in the ISR of a higher-level interrupt (INT1 or
  the debug interrupt) that must stop INT2 from executing after that ISR exits.
flags_affected:
  C: No effect
  Z: No effect
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.157"
sources:
