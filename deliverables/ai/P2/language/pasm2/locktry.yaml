instruction: LOCKTRY
syntax: LOCKTRY {#}D            {WC}
encoding:
- bits: EEEE 1101011 C0L DDDDDDDDD 000000110
  write: —
  c: 1 if got LOCK
  z: —
  clocks: '2...9, +2 if result'
timing:
  cycles: '2...9, +2 if result'
  type: variable
description: 'Try to acquire lock D[3:0]. With WC, C = 1 if got LOCK. C is written
  only when WC is given.


  P2 provides 16 hardware locks (0-15) for inter-COG synchronization:

  - Non-blocking (returns immediately)

  - Locks are semaphore bits with atomic read-modify-write operations

  - Lock arbitration is performed by the hub in a round-robin fashion, so any cog
  waiting in a loop to capture a lock gets its fair turn

  '
flags_affected:
  C: Set if LOCK acquired
  Z: No effect
documentation_level: comprehensive
documentation_source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), OVERVIEW (semaphore bits with atomic read-modify-write operations); LOCKS, Using Locks (WC result, round-robin arbitration, the ways a held lock is released); P2 Instructions v35 - Rev B/C Silicon, LOCKTRY row"
examples:
- name: Resource Protection
  description: Protect shared resource access
  code: "' Try to acquire resource lock\nacquire_resource\n        locktry #RESOURCE_LOCK\
    \     wc   ' Try to get lock\nif_nc   ret                          ' Failed -\
    \ return\n        \n        ' Got lock - access resource safely\n        rdlong\
    \  value, shared_addr\n        add     value, #1\n        wrlong  value, shared_addr\n\
    \        \n        ' Release lock when done\n        lockrel #RESOURCE_LOCK\n\
    \        ret\n"
- name: Debug Monitor Lock
  description: Spin-wait for lock[15] to own the debugger's save buffer and tx/rx pins
  code: "' Wait for lock[15] so that we own the save buffer and tx/rx pins\n.wait\
    \   locktry #15                  wc\nif_nc   jmp     #.wait\n"
  source: "Parallax Spin2/PASM Debugger v51 (2025.04.02), Debug ISR (debug_isr)"
- name: Spin Lock Implementation
  description: Wait until lock acquired
  code: "' Spin until lock acquired\nspin_lock\n        locktry lock_num         \
    \  wc   ' Try to get lock\nif_nc   jmp     #spin_lock           ' Keep trying\n\
    \        ret                          ' Got lock\n        \n' Alternative with\
    \ timeout\nspin_lock_timeout\n        mov     timeout, ##1000000\n.loop   locktry\
    \ lock_num           wc\nif_c    ret                          ' Got lock\n   \
    \     djnz    timeout, #.loop\n        ' Timeout - handle error\n"
- name: Multi-Resource Manager
  description: Manage multiple locks for complex operations; the outcome is returned in a register
  code: |
    ' Acquire multiple locks in order (prevent deadlock); result = 1 on success, 0 on failure
    acquire_multi
            locktry #LOCK_A            wc
    if_nc   jmp     #.fail
            locktry #LOCK_B            wc
    if_nc   jmp     #.release_a
            locktry #LOCK_C            wc
    if_nc   jmp     #.release_b

            ' Got all locks - proceed
            mov     result, #1           ' Success
            ret

    .release_b
            lockrel #LOCK_B
    .release_a
            lockrel #LOCK_A
    .fail   mov     result, #0           ' Failed
            ret
related_instructions:
- LOCKREL: Release lock
- LOCKNEW: Allocate new lock
- LOCKRET: Return lock to pool
- COGID: Get current COG ID
notes:
- 16 locks available (0-15)
- LOCK[15] is allocated by the debugger and used among all cogs during their debug interrupts (architecture/locks.yaml)
- Non-blocking - with WC, C reports whether the lock was taken (1 = taken); C = 0 means another cog is holding the lock or the lock is not allocated
- A held lock is released by the holding cog's LOCKREL, and also when the holding cog is stopped by COGSTOP or restarted by COGINIT, or when LOCKRET is executed for the lock
