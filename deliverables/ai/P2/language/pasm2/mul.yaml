instruction: MUL
syntax: MUL Dest, {#}Src {WZ}
brief_description: Multiply
category: Math and Logic
description: >-
  MUL multiplies the lower 16-bits of each of Dest and Src together and stores the
  32-bit product result into the Dest register. This is a fast (2-clock) 16 x 16 bit
  multiplication operation-- to multiply larger factors, use the CORDIC Solver QMUL
  instruction. D = unsigned (D[15:0] * S[15:0]).
  If the WZ effect is specified, the Z flag is set (1) if either the Dest or Src values
  are zero, or is cleared (0) if both are non-zero.
result: >-
  The 32-bit unsigned product of the 16-bit Dest and Src multiplication is stored
  into Dest and optionally the Z flag is updated to the Dest or Src zero status.
parameters:
- Dest is a register containing the 16-bit value to multiply with Src, and is where
  the result is written.
- Src is a register, 9-bit literal, or 16-bit augmented literal whose value is multiplied
  into Dest.
- WZ is an optional effect to update the Z flag.
flags_affected:
  C: No effect
  Z: Set if D or S equals zero
syntax_variants:
- MUL Dest, {#}Src {WZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1010000 0ZI DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: (D == 0) | (S == 0)
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, MUL, pp.99-100"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 137 (MUL D,{#}S {WZ}: D = unsigned (D[15:0] * S[15:0]), Z = (S == 0) | (D == 0); 2 clocks; write D)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Math and Logic Instructions, p.37 (MUL D,{#}S {WZ}, 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, MUL, pp.99-100 (Result line: 32-bit unsigned product of the 16-bit Dest and Src, Z updated to the Dest or Src zero status; Dest and Src parameters with the 16-bit augmented literal; encoding row 1010000 0ZI, write D, C flag none, Z flag (D = 0) | (S = 0), 2 clocks; Related MULS, SCA, QMUL; the fast (2-clock) 16 x 16 bit multiplication, QMUL for larger factors; Z set if either value is zero with WZ)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 1010000 0ZI DDDDDDDDD SSSSSSSSS MUL D,S/# {WZ})"
