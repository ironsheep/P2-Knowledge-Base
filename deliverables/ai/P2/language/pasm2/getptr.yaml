instruction: GETPTR
syntax: GETPTR  D
encoding:
- bits: EEEE 1101011 000 DDDDDDDDD 000110100
  write: D
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: mode_dependent
description: >-
  Get current FIFO hub pointer into D.

loader_size_idiom: |
  A loader reads the pointer with GETPTR, commented "get size of download in bytes",
  and later shifts it right by 2, commented "get size of download in longs".

  Not documented: how the FIFO pointer comes to hold the download size at that point.
pointer_note: "GETPTR returns the hub address of the next unread byte of the FIFO read stream; each RFVAR or RFVARS read advances it by the bytes the value occupied."
sources:
  - "XF-019 (GETPTR advance after RFVAR and RFVARS reads at every length boundary)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet, Release November 1, 2022, p.41 (GETPTR D: get current FIFO hub pointer into D)"
