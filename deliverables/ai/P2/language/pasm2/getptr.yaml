instruction: GETPTR
syntax: GETPTR  D
encoding:
- bits: EEEE 1101011 000 DDDDDDDDD 000110100
  write: D
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: mode_dependent
description: >-
  Get current FIFO hub pointer into D. Returns the current position of the hub FIFO
  pointer, which advances as data is read from or written to the hub FIFO.

loader_size_idiom: |
  NARROW APPLICATION — applies ONLY at the entry point of a serial-downloaded
  program, BEFORE any RDFAST or WRFAST has been issued in that cog: GETPTR
  returns the byte count of the just-downloaded image, because the FIFO write
  pointer was left at the post-download position by the PNut serial downloader.

  Example:
    getptr  size_in_bytes        ' bytes downloaded by the serial loader
    shr     size_in_bytes, #2    ' convert to longs

  This idiom does NOT apply in general code — once any RDFAST/WRFAST runs,
  the FIFO pointer reflects that operation, not the download. The pattern is
  loader-specific (the flash loader's programmer opens with GETPTR to get
  the size of the download in bytes).
flags_affected:
  C: No effect
  Z: No effect
