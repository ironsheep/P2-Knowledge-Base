instruction: DIRNOT
syntax: DIRNOT {#}Dest {WCZ}
brief_description: Direction not
category: Pin
description: >-
  DIRNOT alters the direction register's bit(s) designated by Dest to their inverse
  state. All other bits are left unchanged.

  Dest[5:0] indicates the pin number (0-63). For a range of pins, Dest[5:0] indicates
  the base pin number (0-63) and Dest[10:6] indicates how many contiguous pins beyond
  the base should be affected (1-31).

  A 9-bit literal Dest is enough to express the base pin (Dest[5:0]) and a range of
  up to 8 contiguous pins (Dest[8:6]). If needed, use the augmented literal feature
  (##Dest) to augment Dest to an 11-bit literal value-- this inserts an AUGD
  instruction prior.

  When Dest is a register, the register's value bits [10:0] are used as-is to form
  the 11-bit ID range. A prior SETQ overrides Dest[10:6] with the low five bits of
  the SETQ value; an ALTx between the SETQ and DIRNOT keeps the override, and a SETQ
  separated from DIRNOT by other instructions is not documented.

  The range calculation (from Dest[5:0] up to Dest[5:0]+Dest[10:6]) will wrap within
  the same 32-pin group (DIRA or DIRB); it will not cross the port boundary.

  If the WCZ effect is specified, the C and Z flags are set to the original
  (pre-instruction) state of the base pin's DIR bit (DIRA / DIRB), identified by Dest.
result: The I/O pin direction bit(s), described by Dest, are toggled to their opposite
  state(s); the rest are left as-is.
parameters:
- Dest is the register, 9-bit literal, or 11-bit augmented literal whose value identifies
  the I/O pin(s) to toggle to the opposite direction.
- WCZ is an optional effect to update flags.
flags_affected:
  C: Set to the original (pre-instruction) state of the base pin's DIR bit
  Z: Set to the original (pre-instruction) state of the base pin's DIR bit
syntax_variants:
- DIRNOT {#}Dest {WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1101011 CZL DDDDDDDDD 001000111
  write: DIRx
  c: Orig DIRx base bit
  z: Orig DIRx base bit
  clocks: '2'
encoding_notes:
- "DIRNOT uses the S-field code 001000111, the same code as TESTPN with XORC or XORZ."
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, DIRNOT, p.72"
sources:
  - "description (a prior SETQ overrides D[10:6]): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), list of changes (DIRx/OUTx/FLTx/DRVx can now work on a span of pins, +D[10:6] pins; prior SETQ overrides D[10:6])"
  - "description (an ALTx between the SETQ and DIRNOT keeps the override): Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ALTB, pp.38-39 (SETQ / SETQ2 does not affect ALTx instructions; the Q value passes through to the next instruction); a SETQ separated by other instructions is in no source"
  - "encoding_notes: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 1101011 CZL DDDDDDDDD 001000111 for both TESTPN D/# XORC/XORZ and DIRNOT D/# {WCZ})"
  - "P2 Instructions v35 - Rev B/C Silicon, row 356 (DIRNOT {#}D {WCZ}: toggle DIR bits of pins D[10:6]+D[5:0]..D[5:0]; wraps within DIRA/DIRB; prior SETQ overrides D[10:6]; C,Z = DIR bit; write DIRx; 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, DIRNOT, p.72 (encoding table; Dest[5:0], Dest[10:6], the 9-bit literal range of Dest[8:6], ##Dest, the SETQ substitution, the wrap within DIRA or DIRB, C and Z set to the original base bit, 2 clocks; related list)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Pin instructions, p.39 (DIRNOT {#}D {WCZ}, 2 clocks)"
documentation_level: comprehensive
