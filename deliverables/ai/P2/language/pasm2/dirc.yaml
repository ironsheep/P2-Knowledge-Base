instruction: DIRC
syntax: DIRC    {#}D           {WCZ}
encoding:
- bits: EEEE 1101011 CZL DDDDDDDDD 001000010
  write: DIRx
  c: Orig DIRx base bit
  z: Orig DIRx base bit
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: >-
  DIRC sets the direction register's bit(s) designated by Dest to equal the state of
  the C flag. High (1) bits set the pin(s) to output, low (0) to input. All other
  direction bits are left unchanged. With WCZ, C and Z are set to the original
  (pre-instruction) state of the base pin's DIR bit.

  Dest[5:0] indicates the pin number (0-63). For a range of pins, Dest[5:0] indicates
  the base pin number (0-63) and Dest[10:6] indicates how many contiguous pins beyond
  the base should be affected (1-31).

  A 9-bit literal Dest is enough to express the base pin (Dest[5:0]) and a range of
  up to 8 contiguous pins (Dest[8:6]). If needed, use the augmented literal feature
  (##Dest) to augment Dest to an 11-bit literal value-- this inserts an AUGD
  instruction prior.

  When Dest is a register, the register's value bits [10:0] are used as-is to form
  the 11-bit ID range. A prior SETQ overrides Dest[10:6] with the low five bits of
  the SETQ value; an ALTx between the SETQ and DIRC keeps the override, and a SETQ
  separated from DIRC by other instructions is not documented.

  The range calculation (from Dest[5:0] up to Dest[5:0]+Dest[10:6]) wraps within
  the same 32-pin group (DIRA or DIRB); it does not cross the port boundary.
flags_affected:
  C: Set to the original (pre-instruction) state of the base pin's DIR bit
  Z: Set to the original (pre-instruction) state of the base pin's DIR bit
encoding_notes:
- "DIRC uses the S-field code 001000010, the same code as TESTP with ANDC or ANDZ."
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, DIRC / DIRNC, p.70 (the wrap within DIRA or DIRB); P2 Instructions v35 - Rev B/C Silicon, row 351 (DIRC: wraps within DIRA/DIRB); encoding_notes: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 1101011 CZL DDDDDDDDD 001000010 for both TESTP D/# ANDC/ANDZ and DIRC D/# {WCZ})"
sources:
  - "description (DIR bits of pins D[10:6]+D[5:0]..D[5:0] = C; wraps within DIRA/DIRB; prior SETQ overrides D[10:6]; C,Z = DIR bit; write DIRx; 2 clocks): P2 Instructions v35 - Rev B/C Silicon, row 351; Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), list of changes (DIRx/OUTx/FLTx/DRVx can now work on a span of pins, +D[10:6] pins; prior SETQ overrides D[10:6])"
  - "description (a DIR bit of 1 sets the pin to output and 0 to input, the manual's 'set pin to the output (1) or input (0) direction'; Dest[5:0], Dest[10:6], the 9-bit literal range of Dest[8:6], ##Dest and AUGD, the register value bits [10:0], the wrap within DIRA or DIRB): Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, DIRC / DIRNC, p.70"
  - "description (an ALTx between the SETQ and DIRC keeps the override): Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ALTB, pp.38-39 (SETQ / SETQ2 does not affect ALTx instructions; the Q value passes through to the next instruction); a SETQ separated by other instructions is in no source"
documentation_level: comprehensive
syntax_variants:
- DIRC {#}D
last_updated: '2025-09-19T16:04:16.992884'
parameters:
- Dest is the register, 9-bit literal, or 11-bit augmented literal whose value identifies
  the I/O pin(s) whose DIR bit is set to C.
- WCZ is an optional effect to update flags.
category: Pin
oneliner: Set pin(s) DIR bit to C
