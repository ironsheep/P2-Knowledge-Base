directive: RES
name: RES
description: 'Reserve space in cog RAM without initializing

  Allocates memory space but doesn''t generate any data

  '
category: Assembly Directives
documentation_level: complete
syntax: '[label] RES count'
examples:
- code: 'buffer  res  16    '' Reserve 16 longs

    temp    res  1     '' Reserve 1 long for temporary storage

    '
  description: Reserve uninitialized cog RAM
notes:
- RES only reserves space in cog RAM
- No hub memory is allocated
- RES generates no data
- RES must be in cog mode, not hub mode
related:
- language/pasm2/long.yaml
- language/pasm2/org.yaml
- language/pasm2/fit.yaml
oneliner: Reserve space in cog RAM without initializing
source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), assembler directives (RES cog_registers: reserve cog registers; doesn't generate any data; must be in cog mode)"
