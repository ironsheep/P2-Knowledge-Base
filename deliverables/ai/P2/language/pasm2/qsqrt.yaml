instruction: QSQRT
syntax: QSQRT   {#}D,{#}S
encoding:
- bits: EEEE 1101001 1LI DDDDDDDDD SSSSSSSSS
  write: —
  c: —
  z: —
  clocks: '2...9'
timing:
  cycles: "2...9"
  type: variable
description: Compute the square root of the 64-bit integer {S:D}, with the upper 32
  bits from S and the lower 32 bits from D. GETQX retrieves the root 55 clocks later.
flags_affected:
  C: No effect
  Z: No effect
long_description: 'QSQRT computes the square root of a 64-bit integer using the hub''s
  54-stage pipelined CORDIC solver. The input is {S:D}: the S operand supplies the
  upper 32 bits and the D operand the lower 32 bits. Fifty-five clocks after the
  cog hands the command to the CORDIC solver, the 32-bit root is available through
  GETQX, which waits if the result has not yet arrived.


  The result is the truncated (floor) square root: the largest integer whose square
  does not exceed the input. A perfect square gives its exact root; any other input
  gives the next lower integer (the root of 8 is 2, of 99 is 9, of $FFFF_FFFF is
  65535, and of 2^64-1 is $FFFF_FFFF).

  '
examples:
- code: ''' Calculate square root of 1000000 (simple 32-bit value)

    QSQRT   ##1000000, #0  '' D = low long, S = high long: square root of {0, 1000000} is 1000

    '' Wait 55 clocks...

    GETQX   sqrt_result    '' Get 1000

    '
  description: Basic square root of 32-bit number
- code: ''' Calculate square root of large 64-bit number

    '' Example: square root of {$12345678, $9ABCDEF0} (high, low)

    QSQRT   ##$9ABCDEF0, ##$12345678   '' D = low long, S = high long

    '' ... other work for 55 clocks ...

    GETQX   big_sqrt                   '' Get the truncated root

    '
  description: Square root of 64-bit number
- code: ''' Square root of x² + y², with x and y treated as unsigned values

    '' The 64-bit sum is taken without carry out of the high long, so it must be

    '' less than 2^64.

    QMUL    coord_x, coord_x    '' x²

    '' ... wait 55 clocks ...

    GETQX   x_squared_low

    GETQY   x_squared_high

    QMUL    coord_y, coord_y    '' y²

    '' ... wait 55 clocks ...

    GETQX   y_squared_low

    GETQY   y_squared_high

    MOV     sum_low, x_squared_low

    ADD     sum_low, y_squared_low WC    '' x² + y² (low)

    MOV     sum_high, x_squared_high

    ADDX    sum_high, y_squared_high     '' x² + y² (high)

    QSQRT   sum_low, sum_high   '' Square root of x² + y²: D = low, S = high

    '' ... wait 55 clocks ...

    GETQX   distance

    '
  description: Square root of a sum of two 64-bit squares
- code: ''' Variable square root calculation

    QSQRT   input_low, input_high   '' D = low, S = high

    '' ... wait 55 clocks ...

    GETQX   result

    CMP     result, #0 WZ       '' Check for zero result

    IF_Z    JMP     #zero_case

    '
  description: Variable square root with result checking
related_instructions:
- GETQX
- QMUL
- ADD
- ADDX
operand_details:
  S: Upper 32 bits of 64-bit input value
  D: Lower 32 bits of 64-bit input value
result_details:
  GETQX: 32-bit square root result, truncated (floor)
timing_notes: A cog waits for its hub slot, zero to (cogs-1) clocks away, to hand the
  command to the CORDIC solver. Fifty-five clocks later the result is available via
  GETQX.
documentation_source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet Release November 1, 2022 (2022/11/01), CORDIC Solver, p.20, and CORDIC Solver Instructions, p.45; Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), CORDIC SOLVER (SQUARE ROOT); P2 Instructions v35 - Rev B/C Silicon, Sheet1; the truncated (floor) result: EF-104"
