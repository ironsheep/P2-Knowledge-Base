instruction: ADDCT1
syntax: ADDCT1 Dest, {#}Src
encoding:
- bits: EEEE 1010011 00I DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: Set CT1 event to trigger on CT = D + S. ADDCT1 sets the hidden CT1 event trigger register to the value of Dest + Src. The result is also written to Dest. Use the POLLCT1, WAITCT1, JCT1, and JNCT1 instructions to process CT1 time-based events.
flags_affected:
  C: No effect
  Z: No effect
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_ds
  pattern: D,S/#
  description: Destination register, Source register or immediate value
  valueType: 0
compiler_encoding:
  operandFormat: 0
enhancement_source: PNUT_TS_v2.0_complete_operand_integration_2025-09-13
syntax_variants:
- ADDCT1 Dest, {#}Src
last_updated: '2025-09-19'
brief_description: Add and set CT1 event trigger
category: Event
result: The Src value is added into Dest and the result is also stored in the hidden CT1 event trigger register.
parameters:
- Dest is a register containing the value to add Src to, and is where the result is
  written.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value is added
  into Dest.
related:
- POLLCTx
- WAITCTx
- JCTx
- JNCTx
