instruction: ADDCT1
syntax: ADDCT1 Dest, {#}Src
encoding:
- bits: EEEE 1010011 00I DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: ADDCT1 sets the hidden CT1 event trigger register to the value of Dest + Src. The result is also written to Dest. The CT-passed-CT1 event flag is set whenever the MSB of (CT - CT1) is 0, and ADDCT1 clears it. Parallax's documents also give the event as triggering when System Counter (CT) = original Dest + Src. Use the POLLCT1, WAITCT1, JCT1, and JNCT1 instructions to process CT1 time-based events.
flags_affected:
  C: No effect
  Z: No effect
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ADDCT1/2/3, p.32; Parallax Propeller 2 Documentation v35 Rev B/C Silicon, EVENTS (POLLCT1/WAITCT1 event flag, p.46; Example ADDCT1/WAITCT1, p.48)"
documentation_level: comprehensive
syntax_variants:
- ADDCT1 Dest, {#}Src
last_updated: '2025-09-19'
brief_description: Add and set CT1 event trigger
category: Event
result: The Src value is added into Dest and the result is also stored in the hidden CT1 event trigger register.
parameters:
- Dest is a register containing the value to add Src to, and is where the result is
  written.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value is added
  into Dest.
related:
- POLLCTx
- WAITCTx
- JCTx
- JNCTx
manual_extraction_date: '2025-01-19'
oneliner: Set CT1 counter event trigger time
