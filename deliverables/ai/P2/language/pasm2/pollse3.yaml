instruction: POLLSE3
syntax: POLLSE3 {WC|WZ|WCZ}
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1101011 CZ0 000000110 000100100
  write: —
  c: SE3 Event
  z: SE3 Event
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: >-
  POLLSE3 copies the state of the selectable event 3 flag into C and/or Z and then
  clears the flag (unless it's being set again by the event sensor).
  If the WC, WZ, or WCZ effect is specified, the C flag and/or Z flag is updated to
  the state of the selectable event 3 flag prior to clearing it.
  The selectable event 3 flag is set whenever the event configured by SETSE3 occurs.
  The flag is cleared upon execution of SETSE3, POLLSE3, WAITSE3, JSE3, or JNSE3
  instructions.
flags_affected:
  C: Set to SE3 event flag state
  Z: Set to SE3 event flag state
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, POLLSE1/2/3/4, p.114"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 277 (POLLSE3 {WC/WZ/WCZ}: get SE3 event flag into C/Z, then clear it; 2 clocks)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Event instructions, p.43 (POLLSE3 {WC/WZ/WCZ}, 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, POLLSE1/2/3/4, p.114 (Result line, WC / WZ / WCZ parameter, encoding row 000000110 / 000100100, write none, C and Z SE3 Event, 2 clocks, Related list; the flag is set whenever the corresponding configured event occurs; cleared upon SETSEx, POLLSEx, WAITSEx, JSEx or JNSEx)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), EVENTS (the POLLxxx instructions simultaneously return their event-occurred flag into C and/or Z and clear it unless it is set again by the event sensor), Selectable Events (SEn is set whenever the configured event occurs; cleared on matched POLLSEn / WAITSEn / JSEn / JNSEn and when the matched SETSEn is called), instruction encoding listing (EEEE 1101011 CZ0 000000110 000100100 POLLSE3 {WC/WZ/WCZ})"
documentation_level: comprehensive
syntax_variants:
- POLLSE3 {WC|WZ|WCZ}
