instruction: POLLSE3
syntax: POLLSE3 {WC|WZ|WCZ}
encoding:
- bits: EEEE 1101011 CZ0 000000110 000100100
  write: —
  c: SE3 Event
  z: SE3 Event
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: >-
  POLLSE3 copies the state of the selectable event 3 flag into C and/or Z and then
  clears the flag (unless it's being set again by the event sensor).
  If the WC, WZ, or WCZ effect is specified, the C flag and/or Z flag is updated to
  the state of the selectable event 3 flag prior to clearing it.
  The selectable event 3 flag is set whenever the corresponding configured event
  occurs. The flag is cleared upon execution of SETSE3, POLLSE3, WAITSE3, JSE3, or
  JNSE3 instructions.
flags_affected:
  C: Set to SE3 event flag state
  Z: Set to SE3 event flag state
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_pollwait
  pattern: ''
  description: No operands - poll/wait instruction (moves S to D, sets S to $024)
  valueType: 28
compiler_encoding:
  operandFormat: 28
enhancement_source: PNUT_TS_v2.0_complete_operand_integration_2025-09-13
