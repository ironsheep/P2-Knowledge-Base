instruction: ROLBYTE
syntax: 'ROLBYTE Dest, {#}Src, #Num'
brief_description: Rotate left byte
category: Math and Logic
description: >-
  ROLBYTE reads the byte identified by Num (0-3) from Src, or a byte from the source
  described by a prior ALTGB instruction, and rotates it left into Dest. ROLBYTE
  achieves the same effect as two instructions: an 8-bit SHL followed by SETBYTE into
  byte 0. Num (0-3) identifies a value's individual bytes, by position, in least-significant
  byte order. Syntax 2 is intended for use after an ALTGB instruction, i.e. in a loop to
  iteratively read a series of byte values within contiguous long registers. ROLBYTE
  Dest is the same as ROLBYTE Dest,0,#0, with the S field and the N field filled in
  by the prior ALTGB.
result: >-
  Byte Num (0-3) of Src, or a byte from a source described by prior ALTGB instruction,
  is rotated left into Dest.
parameters:
- Dest is the register in which to rotate the byte into.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value contains
  the target byte to read.
- Num is a 2-bit literal identifying the byte ID (0-3) of Src to read.
flags_affected:
  C: No effect
  Z: No effect
syntax_variants:
- 'ROLBYTE Dest, {#}Src, #Num'
- ROLBYTE Dest
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1001000 NNI DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2'
- bits: EEEE 1001000 000 DDDDDDDDD 000000000
  write: D
  c: —
  z: —
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ROLBYTE, pp.119-120"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, rows 94-95 (ROLBYTE D,{#}S,#N: rotate-left byte N of S into D, D = {D[23:0], S.BYTE[N]}; ROLBYTE D: rotate-left byte established by prior ALTGB instruction into D; 2 clocks; write D) and row 108-109 (ALTGB: next S field and N field = D[1:0] for the subsequent GETBYTE/ROLBYTE)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Math and Logic Instructions, p.37 (ROLBYTE D and ROLBYTE D,{#}S,#N, 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ROLBYTE, pp.119-120 (Result line, Dest, Src and Num parameters, both encoding rows 1001000 NNI / 1001000 000, write D, C and Z none, 2 clocks, Related list, the SHL-then-SETBYTE equivalence, Num 0-3 in least-significant byte order, syntax 2 after ALTGB)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), REGISTER INDIRECTION (ALTGB sets the next S field to base+index[10:2] and the next N to index[1:0]; 'ROLBYTE D' = 'ROLBYTE D,0,#0'; two of the three fields of the associated instruction are filled in by the ALTxx instruction), and instruction encoding listing (EEEE 1001000 NNI DDDDDDDDD SSSSSSSSS ROLBYTE D,S/#,#N)"
