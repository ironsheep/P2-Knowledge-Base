instruction: SUBS
syntax: SUBS Dest, {#}Src {WC|WZ|WCZ}
brief_description: Subtract signed
category: Math and Logic
description: >-
  SUBS subtracts the signed Src from the signed Dest and stores the result into the
  Dest register. If Src is a 9-bit literal, its value is interpreted as positive
  (0-511; it is not sign-extended) -- use ##Value (or insert a prior AUGS instruction)
  for a 32-bit signed value; negative or positive. If the WC or WCZ effect is
  specified, the C flag is set to the true sign of the result -- the sign of
  (D - S) at full precision (overflow-corrected) (C=1 if negative, C=0 if non-negative); it is
  NOT a signed-underflow or borrow indicator. If the WZ or WCZ effect is
  specified, the Z flag is set (1) if the result of Dest - Src is zero, or is cleared
  (0) if it is non-zero. To subtract signed, multi-long values, use SUB (not SUBS)
  followed possibly by SUBX, and finally SUBSX as described in Subtracting Two
  Multi-Long Values.
result: >-
  Difference of signed Dest and signed Src is stored in Dest and optionally the C
  and Z flags are updated to the sign and zero status.
parameters:
- Dest is a register containing the value to subtract Src from, and is where the result
  is written.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value is subtracted
  from Dest.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set to true sign of result (1 if negative)
  Z: Set if result equals zero
syntax_variants:
- SUBS D,{#}S {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 0001110 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: true sign of (D - S)
  z: Result == 0
  clocks: '2'
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_ds
  pattern: D,S/#
  description: Destination register, Source register or immediate value
  valueType: 0
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 0
