instruction: XOR
syntax: XOR Dest, {#}Src {WC|WZ|WCZ}
brief_description: Exclusive or
category: Math and Logic
description: >-
  XOR performs a bitwise XOR of the value in Src into that of Dest. If the WC or WCZ
  effect is specified, the C flag is set (1) if the result contains an odd number of
  high (1) bits, or is cleared (0) if it contains an even number of high bits. If the
  WZ or WCZ effect is specified, the Z flag is set (1) if the Dest XOR Src result
  equals zero, or is cleared (0) if it is non-zero.
result: >-
  Dest XOR Src is stored in Dest and flags are optionally updated with parity and
  zero status.
parameters:
- Dest is the register containing the value to bitwise XOR with Src and is the destination
  in which to write the result.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value will be
  bitwise XORed into Dest.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set if odd number of high (1) bits in result (parity)
  Z: Set if result equals zero
syntax_variants:
- XOR D,{#}S {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 0101011 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: Parity of Result
  z: Result == 0
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, XOR, p.146"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 53 (XOR D,{#}S: XOR S into D, D = D ^ S, C = parity of result, Z = (result == 0); 2 clocks; write D)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Math and Logic Instructions, p.38 (XOR D,{#}S {WC/WZ/WCZ}, 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, XOR, p.146 (Result line, Dest, Src and effect parameters, encoding row 0101011 CZI, write D, C Parity of Result, Z Result = 0, 2 clocks, odd-number-of-high-bits parity explanation, zero explanation)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 0101011 CZI DDDDDDDDD SSSSSSSSS XOR D,S/# {WC/WZ/WCZ})"
