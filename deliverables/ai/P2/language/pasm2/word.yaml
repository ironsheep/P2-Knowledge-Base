directive: WORD
name: WORD
description: 'Declare word data in memory

  Stores 16-bit values at the current address

  '
category: Assembly Directives
documentation_level: complete
syntax: '[label] WORD data{[count]}{, data{[count]}...}'
examples:
- code: 'fill    word  $AAAA[50]        '' 50 words of $AAAA

    '
  description: Optional repeat count after a value
- code: 'counts  word  1000, 2000, 3000  '' Decimal values

    '
  description: Word data declarations
notes:
- Each value occupies 2 bytes
- An optional repeat count in square brackets after a value generates that value count times
- DAT data is packed in the order declared, so a WORD that follows BYTE data may not be word-aligned unless ALIGNW precedes it
- WORD @label in a Spin2 object assembles to the label's offset from the start of the object; in a PASM-only program it assembles to the absolute address. A word holds only offsets or addresses under 64KB.
- FVAR or FVARS on a WORD line emits that one value in variable length (1 to 4 bytes)
related:
- BYTE
- LONG
- ALIGNW
- language/pasm2/fvar.yaml
oneliner: Declare word data in memory
source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), assembler directives (WORD data{[count]}{,data{[count]}...}: generate word data with optional repeat count); Parallax Propeller 2 Spin2 Language Documentation v55, DAT Blocks (data is packed in memory in the order declared; ALIGNW word-aligns to hub memory by emitting a zero byte, if necessary); DAT Data Pointers (StrList WORD @Str0: offsets relative to the start of the object in Spin2, absolute addresses in PASM-only programs; use of WORD supposes offsets/addresses are under 64KB)"
