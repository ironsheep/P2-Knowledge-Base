directive: WORD
name: WORD
description: 'Declare word data in memory

  Stores 16-bit values at the current address

  '
category: Assembly Directives
documentation_level: complete
syntax: '[label] WORD value[, value...]'
examples:
- code: 'counts  word  1000, 2000, 3000  '' Decimal values

    addr    word  @buffer            '' Address: an object offset in a Spin2 object

    '
  description: Word data declarations
notes:
- Each value occupies 2 bytes
- DAT data is packed in the order declared, so a WORD that follows BYTE data is not word-aligned unless ALIGNW precedes it
- 'Range: 0 to 65535 (unsigned)'
- FVAR or FVARS on a WORD line emits that one value in variable length (1 to 4 bytes)
related:
- BYTE
- LONG
- ALIGNW
- language/pasm2/fvar.yaml
oneliner: Declare word data in memory
source: "Parallax Propeller 2 Spin2 Language Documentation v55, DAT Blocks (data is packed in memory in the order declared; ALIGNW word-aligns to hub memory by emitting a zero byte, if necessary)"
