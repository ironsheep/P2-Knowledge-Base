instruction: ROR
syntax: ROR Dest, {#}Src {WC|WZ|WCZ}
brief_description: Rotate right
category: Math and Logic
description: >-
  ROR rotates Dest's binary value right by Src places (0-31 bits). All LSBs rotated out
  are moved into the new MSBs. If the WC or WCZ effect is specified, the C flag is
  updated to the value of the last bit rotated out (effectively C = result bit "31") if
  Src is 1-31, or to Dest[0] if Src is 0. If the WZ or WCZ effect is specified, the Z
  flag is set (1) if the Dest result equals zero, or is cleared (0) if it is non-zero.
  Since no bits are lost by this operation, the result will only be zero if Dest started
  at zero.
result: The bits of Dest are rotated right by Src bits; any departing LSBs are moved
  into MSBs.
parameters:
- Dest is the register containing the value to rotate right by Src bits.
- Src is a register or 5-bit literal whose value indicates the number of bit positions
  to rotate.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set to last bit rotated out if S[4:0] > 0, else D[0]
  Z: Set if result equals zero
syntax_variants:
- ROR D,{#}S {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 0000000 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: last bit shifted out if S[4:0] > 0, else D[0]
  z: Result == 0
  clocks: '2'
encoding_notes:
- C = last bit rotated out if Src[4:0] > 0, else C = Dest[0].
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ROR, pp.121-122"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 2 (ROR D,{#}S {WC/WZ/WCZ}: rotate right, D = [31:0] of ({D[31:0], D[31:0]} >> S[4:0]), C = last bit shifted out if S[4:0] > 0, else D[0]; footnote * Z = (result == 0); 2 clocks; write D)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Math and Logic Instructions, p.37 (ROR D,{#}S {WC/WZ/WCZ}, 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ROR, pp.121-122 (Result line, Dest and Src parameters, encoding row 0000000 CZI, write D, C last bit out, Z Result = 0, 2 clocks, footnote C = last bit rotated out if Src[4:0] > 0 else Dest[0] and the rotate explanation on p.121; the WC rule (last bit rotated out, effectively result bit 31, if Src is 1-31, Dest[0] if Src is 0), the WZ rule and the sentence that the result is zero only if Dest started at zero on p.122)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 0000000 CZI DDDDDDDDD SSSSSSSSS ROR D,S/# {WC/WZ/WCZ})"
