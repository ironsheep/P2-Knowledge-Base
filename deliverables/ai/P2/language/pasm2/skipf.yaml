instruction: SKIPF
syntax: SKIPF   {#}D
encoding:
- bits: EEEE 1101011 00L DDDDDDDDD 000110010
  write: —
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: Skip cog/LUT instructions fast per D. Like SKIP, but instead of cancelling
  instructions, the PC leaps over them.
flags_affected:
  C: No effect
  Z: No effect
notes:
- "In hub execution SKIPF reverts to SKIP behaviour, cancelling instructions in the pipeline instead of stepping over them. In the one pattern measured it followed the pattern like SKIP: with the pattern %1011_1110 over nine ADDs, the block timed between two GETCTs takes 22 clocks for SKIP in hub execution and 22 for SKIPF in hub execution; in cog execution the same block takes 22 clocks for SKIP and 10 for SKIPF. These are intervals of that block, not per-instruction costs."
- "Parallax's documents also give ILLEGAL for SKIPF in hub execution."
- "Not documented: SKIPF in hub execution under other patterns."
source: "P2 hardware verification, EF-122 (one board; body of one SKIP or SKIPF site and nine ADDs of weights 1 to 256, in cog RAM and in hub RAM; pattern %1011_1110 sums 321 in all five runs of each case, zero pattern 511; hub-address execution confirmed by the captured PC and the read-back site word); Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), INSTRUCTION SKIPPING, p.21 (SKIPF and EXECF skip only in cog/LUT memory) and p.22 (SKIPF in hub exec reverts to SKIP); Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.153 (hub-exec column: ILLEGAL)"
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release (2022/11/01), Propeller 2 Assembly Language (PASM2) in Brief, p.153; P2 Instructions v35 - Rev B/C Silicon, Sheet1"
