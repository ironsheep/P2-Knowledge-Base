instruction: CMPS
syntax: CMPS Dest, {#}Src {WC|WZ|WCZ}
brief_description: Compare signed
category: Math and Logic
description: CMPS compares the signed values of Dest and Src (by subtracting Src from Dest) and optionally setting the C and Z flags to indicate the comparison and operation results. If the WC or WCZ effect is specified, the C flag is set (1) if signed Dest is less than signed Src. If the WZ or WCZ effect is specified, the Z flag is set (1) if Dest equals Src. To compare signed, multi-long values, use CMP (not CMPS) followed possibly by CMPX, and finally CMPSX.
result: Greater/lesser and equality status is optionally written to the C and Z flags.
parameters:
- Dest is the register containing the value to compare with that of Src.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value is compared to Dest.
flags_affected:
  C: Set if signed D < S (true sign of difference)
  Z: Set if D == S
syntax_variants:
- CMPS Dest, {#}Src {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 0010010 CZI DDDDDDDDD SSSSSSSSS
  write: —
  c: Signed (D < S)
  z: D==S
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, CMPS, p.61"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 20 (CMPS: C = correct sign of (D - S); Z = (D == S); 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, CMPS, p.61 (encoding table: C Signed (D < S), Z D = S, 2 clocks; description; multi-long note)"
  - "hardware-verification ledger EF-018 (the signed C flag of ADDS, SUBS and CMPS is the true sign of the full-precision result, not bit 31 of the stored result)"
documentation_level: comprehensive
last_updated: '2025-09-19'
manual_extraction_date: '2025-01-19'
oneliner: Compare two signed values
related:
- CMP
- CMPX
- CMPSX
