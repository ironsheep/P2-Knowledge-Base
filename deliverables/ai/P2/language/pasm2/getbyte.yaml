instruction: GETBYTE
syntax: 'GETBYTE Dest, {#}Src, #Num'
brief_description: Get byte
category: Math and Logic
description: >-
  GETBYTE reads the byte identified by Num (0-3) from Src, or a byte from the source
  described by a prior ALTGB instruction.

  Num (0-3) identifies a value's individual bytes, by position, in least-significant
  byte order: Num 0 is bits [7:0], Num 1 is bits [15:8], Num 2 is bits [23:16],
  Num 3 is bits [31:24].

  Syntax 2 (GETBYTE Dest) is intended for use after an ALTGB instruction; i.e. in
  a loop to iteratively read a series of byte values within contiguous long registers.
result: Byte Num (0-3) of Src, or a byte from a source described by prior ALTGB instruction,
  is written to Dest (Dest = {24'b0, byte}).
parameters:
- Dest is the register in which to store the byte.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value contains
  the target byte to read.
- Num is a 2-bit literal identifying the byte ID (0-3) of Src to read.
flags_affected:
  C: No effect
  Z: No effect
syntax_variants:
- 'GETBYTE Dest, {#}Src, #Num'
- GETBYTE Dest
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1000111 NNI DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2'
- bits: EEEE 1000111 000 DDDDDDDDD 000000000
  write: D
  c: —
  z: —
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, GETBYTE, p.87"
sources:
