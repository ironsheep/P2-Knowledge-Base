instruction: MUXC
syntax: MUXC    D,{#}S   {WC/WZ/WCZ}
encoding:
- bits: EEEE 0101100 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: parity of result
  z: Result == 0
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: >-
  Mux C into each D bit that is '1' in S. D = (!S & D) | (S & {32{C}}).
  Each bit position in D where S has a '1' is replaced with the C flag value; all
  other D bits are left unchanged.
flags_affected:
  C: With WC or WCZ, set if the number of high bits in the result is odd, cleared if even
  Z: With WZ or WCZ, set if the result is zero, cleared if not
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, MUXC / MUXNC, p.100"
documentation_level: enhanced
syntax_variants:
- MUXC D,{#}S
