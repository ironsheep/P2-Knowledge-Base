instruction: MUXC
syntax: MUXC    D,{#}S   {WC/WZ/WCZ}
encoding:
- bits: EEEE 0101100 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: parity of result
  z: Result == 0
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: >-
  Mux C into each D bit that is '1' in S. D = (!S & D) | (S & {32{C}}).
  Each bit position in D where S has a '1' is replaced with the C flag value.
flags_affected:
  C: Set to parity of result
  Z: Set if result equals zero
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, MUXC / MUXNC, p.100"
documentation_level: enhanced
compiler_operand_format:
  name: operand_ds
  pattern: D,S/#
  description: Destination register, Source register or immediate value
  valueType: 0
compiler_encoding:
  operandFormat: 0
syntax_variants:
- MUXC D,{#}S
