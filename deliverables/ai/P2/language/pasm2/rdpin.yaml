instruction: RDPIN
syntax: RDPIN   D,{#}S          {WC}
encoding:
- bits: EEEE 1010100 C1I DDDDDDDDD SSSSSSSSS
  write: D
  c: modal result
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
  in_flag_reset_latency: |
    After RDPIN executes (which acknowledges the Smart Pin), the Smart Pin requires
    2 system-clock cycles to reset the IN flag to logic-0 before a program can poll
    the flag again. Insert NOP instructions before testing the IN flag:
      RDPIN   result, #pin
      NOP                   ' Clock 1 for IN flag reset
      NOP                   ' Clock 2 for IN flag reset
      TESTP   #pin WC       ' NOW safe to poll IN flag
    Note: RQPIN (read quiet) does NOT reset the IN flag.
description: '{WC}   Read smart pin S[5:0] result "Z" into D, acknowledge smart pin.
  C = modal result.'
flags_affected:
  C: Set to modal result
  Z: No effect
documentation_source: PASM2 Manual 2022-11-01
documentation_level: enhanced
