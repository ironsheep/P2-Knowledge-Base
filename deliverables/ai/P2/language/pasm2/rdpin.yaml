instruction: RDPIN
syntax: RDPIN   D,{#}S          {WC}
encoding:
- bits: EEEE 1010100 C1I DDDDDDDDD SSSSSSSSS
  write: D
  c: modal result
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
  in_flag_reset_latency: |
    After RDPIN executes (which acknowledges the Smart Pin), the Smart Pin requires
    2 system-clock cycles to reset the IN flag to logic-0 before a program can poll
    the flag again. A single NOP is 2 clocks, so one NOP covers the full reset delay;
    insert one NOP before testing the IN flag:
      RDPIN   result, #pin
      NOP                   ' 2 clocks: covers the IN-flag reset delay
      TESTP   #pin WC       ' IN can now be polled again
    Note: RQPIN (read quiet) does not acknowledge the smart pin, so it does not reset the IN flag.
description: 'Read smart pin S[5:0] result "Z" into D, acknowledge smart pin. C = modal
  result: the smart pin''s outgoing bus carries Z and a special flag, and C is either
  a mode-related flag or the MSB of Z.


  Cogs that execute WRPIN, WXPIN, WYPIN, RDPIN or AKPIN on the same smart pin must do
  so at different times: each cog has its own bus to the pin for write data and
  acknowledgement, and the pin OR''s the cogs'' buses, so simultaneous use clobbers
  the bus data. RQPIN does not use that bus for acknowledgement, so any number of cogs
  can read a smart pin at the same time with RQPIN.'
sources:
  - "description (C is a mode-related flag or the MSB of Z; multi-cog bus rule): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PINS"
notes:
  - "Not documented: the value RDPIN returns from a smart pin in an ADC mode or in asynchronous receive mode before that pin has completed its first sample period or received its first word"
flags_affected:
  C: Set to a mode-related flag, or to the MSB of Z (the smart pin's outgoing bus carries Z and a special flag)
  Z: No effect
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.152"
documentation_level: enhanced
syntax_variants:
- RDPIN D,{#}S
