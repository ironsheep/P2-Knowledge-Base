instruction: LOCKRET
syntax: LOCKRET {#}D
encoding:
- bits: EEEE 1101011 00L DDDDDDDDD 000000101
  write: —
  c: —
  z: —
  clocks: '2...9'
timing:
  cycles: '2...9'
  type: variable
description: >-
  Return LOCK D[3:0] for reallocation. LOCKRET returns an allocated lock to the
  unallocated lock pool. Any cog can return an allocated lock, even if it was not
  the cog that allocated it with LOCKNEW.
flags_affected:
  C: No effect
  Z: No effect
