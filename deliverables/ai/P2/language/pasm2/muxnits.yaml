instruction: MUXNITS
syntax: MUXNITS Dest, {#}Src
brief_description: Mux nits
category: Math and Logic
description: >-
  MUXNITS copies any non-zero bit pairs from Src into the corresponding bit pairs
  of Dest and leaves the rest of Dest's bit pairs as-is.
result: >-
  Dest bit pairs corresponding to non-zero Src bit pairs are set to those bit pair
  values; the rest are left as-is.
parameters:
- Dest is a register whose value will be updated according to Src.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose non-zero bit
  pairs will replace the corresponding bit pairs in Dest.
flags_affected:
  C: No effect
  Z: No effect
syntax_variants:
- MUXNITS Dest, {#}Src
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 1001111 00I DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2'
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
