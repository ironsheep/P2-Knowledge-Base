instruction: MUXNITS
syntax: MUXNITS Dest, {#}Src
brief_description: Mux nits
category: Math and Logic
description: >-
  MUXNITS copies any non-zero bit pairs from Src into the corresponding bit pairs
  of Dest and leaves the rest of Dest's bit pairs as-is.
result: >-
  Dest bit pairs corresponding to non-zero Src bit pairs are set to those bit pair
  values; the rest are left as-is.
parameters:
- Dest is a register whose value will be updated according to Src.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose non-zero bit
  pairs will replace the corresponding bit pairs in Dest.
flags_affected:
  C: No effect
  Z: No effect
syntax_variants:
- MUXNITS Dest, {#}Src
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1001111 00I DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, MUXNITS, p.101"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 133 (MUXNITS D,{#}S: for each non-zero bit pair in S, copy that bit pair into the corresponding D bits, else leave that D bit pair the same; 2 clocks; write D)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Math and Logic Instructions, p.37 (MUXNITS D,{#}S, 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, MUXNITS, p.101 (Result line, Dest and Src parameters; encoding row 1001111 00I, write D, C flag and Z flag none, 2 clocks; copies any non-zero bit pairs from Src into the corresponding bit pairs of Dest and leaves the rest as-is)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 1001111 00I DDDDDDDDD SSSSSSSSS MUXNITS D,S/#)"
documentation_level: comprehensive
last_updated: '2025-09-19'
manual_extraction_date: '2025-01-19'
oneliner: Set discrete bit pairs of a value to non-zero bit pair states of another
