instruction: RDLONG
syntax: RDLONG  D,{#}S/P {WC/WZ/WCZ}
compiler_syntax: RDLONG D,S/#/PTRA/PTRB
encoding:
- bits: EEEE 1011000 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: MSB of long
  z: Result == 0
  clocks: '9...16 *'
compiler_encoding:
  bits: 32
  opcode: 352
  effects: 3
  operandFormat: 15
  rawValue: 32608
timing:
  cycles: "9...16 (cog) / 9...26 (hub-exec)"
  type: variable
  range_source: "encoding.clocks per PASM2 Manual 2022/11/01"
  notes: "Hub-window dependent (egg-beater); minimum 9 clocks when window is hit. +1 clock if the long crosses a hub long boundary (PASM2 Manual instruction table, footnote '+1 if crosses hub long')."
description: '{WC/WZ/WCZ}                                                                                                                            9...16
  1 / 9...26'
compiler_category: Memory and I/O
flags_affected:
  C: Set to MSB of long
  Z: Set if result equals zero
silicon_errata:
  setq_block_ptrx_delta: "When used as a SETQ/SETQ2 block transfer with a PTRx expression, do NOT place an ALTx/AUGS/AUGD between the SETQ and this RDLONG -- the intervening instruction cancels the block-size PTRx delta: PTRx takes the plain expression's own step (+4 for ptra++, +12 for ptra++[3]), NOT N*4; every long still transfers. Full detail: language/pasm2/concepts/setq_block_ops.yaml. Source: P2 Silicon Doc v35 (KNOWN BUGS, Rev C); step measured, hardware-verified (EF-067, ALTD tested)."
  after_no_wait_rdfast: "Started fewer than 16 clocks after a no-wait RDFAST (D[31]=1), RDLONG can complete before its own read: D gets the PREVIOUS hub read's long, C/Z are set from that wrong value, and PTRA++ still steps. As a SETQ block read it writes one wrong long, leaves the rest unwritten and can overwrite cog registers outside its destination, or the cog does not finish. Rule: use the waiting RDFAST (D[31]=0), or start this RDLONG at least 16 clocks after the no-wait RDFAST (e.g. WAITX #12 directly after it). Hardware-verified (EF-084, EF-086, EF-087, EF-088). Full account: language/pasm2/rdfast.yaml silicon_errata."
