instruction: RDLONG
syntax: RDLONG  D,{#}S/P {WC/WZ/WCZ}
encoding:
- bits: EEEE 1011000 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: MSB of long
  z: Result == 0
  clocks: '9...16 *'
timing:
  cycles: "9...16 (cog or LUT exec) / 9...26 (hub exec)"
  type: variable
  source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF (clocks column and its footnote '+1 if crosses hub long'), p.154"
  notes: "+1 clock if the long crosses a hub long."
description: Read long from hub address {#}S/PTRx into D. C = MSB of long. Prior SETQ/SETQ2
  invokes cog/LUT block transfer.
flags_affected:
  C: Set to MSB of long
  Z: Set if result equals zero
  block_transfer: With a prior SETQ/SETQ2 block transfer and WC/WZ/WCZ, the flags are set according to the last long read in the sequence
silicon_errata:
  setq_block_ptrx_delta:
    description: "When used as a SETQ/SETQ2 block transfer with a PTRx expression, do not place an ALTx/AUGS/AUGD between the SETQ and this RDLONG -- the intervening instruction cancels the block-size PTRx delta: PTRx takes the plain expression's own step (+4 for ptra++, +12 for ptra++[3]), not N*4; every long still transfers. Full detail: language/pasm2/concepts/setq_block_ops.yaml."
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), KNOWN SILICON BUGS; EF-067"
  after_no_wait_rdfast:
    description: "In cog execution, started fewer than 16 clocks after a no-wait RDFAST (D[31]=1), RDLONG can complete before its own read: D gets the previous hub read's long, C/Z are set from that wrong value, and PTRA++ still steps. As a SETQ block read it writes one wrong long, leaves the rest unwritten and can overwrite cog registers outside its destination, or the cog does not finish. Workaround: use the waiting RDFAST (D[31]=0), or start this RDLONG at least 16 clocks after the no-wait RDFAST starts (e.g. WAITX #12 directly after it). Full account: language/pasm2/rdfast.yaml silicon_errata."
    source: "Hardware-verified on Rev C silicon, 200 MHz, cog execution: EF-084 (single read and the 16-clock spacing), EF-086 (flags and PTRA++), EF-087 (SETQ block read and its workaround), EF-088 (WAITX #12 spacing)"
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.154; Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), FAST BLOCK MOVES (flags from the last long read)"
documentation_level: enhanced
syntax_variants:
- RDLONG D,{#}S/P
last_updated: '2025-09-19T16:04:17.050451'
category: Hub RAM
oneliner: Read long from hub RAM
immediate_address_note:
  note: >-
    The S/#/PTRx operand gives the hub address in one of five forms: a register
    (address $000..$1FF) whose 20 LSBs are used as the hub address; an 8-bit immediate hub
    address (#$00..$FF); a 20-bit immediate hub address (##$00000..$FFFFF, which
    invokes AUGS); a PTR expression with a 5-bit scaled index (PTRx {[index5]});
    or a PTR expression with a 20-bit unscaled index (PTRx {[##index20]}, which
    invokes AUGS). Without AUGS, bit 8 of the 9-bit S field selects a PTR expression
    (#%1SUPNNNNN) instead of an 8-bit immediate address (#%0AAAAAAAA).
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), HUB, RANDOM ACCESS INTERFACE (the five ways to express a hub address in the S/#/PTRx operand; #%0AAAAAAAA 8-bit immediate address versus #%1SUPNNNNN PTR expression)"

