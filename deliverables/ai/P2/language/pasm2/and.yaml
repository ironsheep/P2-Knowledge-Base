instruction: AND
syntax: AND     D,{#}S   {WC/WZ/WCZ}
encoding:
- bits: EEEE 0101000 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: parity of result
  z: Result == 0
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: AND performs a bitwise AND of the value in Src into that of Dest, storing the result in Dest. If the WC or WCZ effect is specified, the C flag is set (1) if the result contains an odd number of high (1) bits, or is cleared (0) if it contains an even number of high bits. If the WZ or WCZ effect is specified, the Z flag is set (1) if the result equals zero, or is cleared (0) if it is non-zero.
flags_affected:
  C: Set to parity of result (odd number of 1s = set)
  Z: Set if result equals zero
parameters:
- Dest is the register containing the value to bitwise AND with Src and is the destination in which to write the result.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value will be bitwise ANDed with Dest.
documentation_source: PASM2 Manual 2022/11/01 Page 49
documentation_level: comprehensive
compiler_operand_format:
  name: operand_ds
  pattern: D,S/#
  description: Destination register, Source register or immediate value
  valueType: 0
compiler_encoding:
  operandFormat: 0
