name: Halt and Fault Response Idioms
description: PASM2 patterns for halting the chip or responding to detected fault conditions
category: fault_response
frequency: medium

idioms:
  - name: hubset_stop_clock
    pattern: "hubset #%0010"
    description: |
      Stop the system clock until the next reset. The clock-mode value %0010
      selects XI as the clock source (%SS = %10) while %CC = %00 leaves XI
      ignored; the XI source requires %CC other than %00, so no clock reaches
      the chip and no further instruction executes until a reset. Used as a
      fail-safe response to an integrity-check failure.
    examples:
      - "hubset #%0010    ' stop clock until next reset"
    context: |
      The flash loader does this when the application checksum fails, so
      errant code cannot execute. It floats its SPI pins first (see
      pin_float_on_fault and float_then_halt_sequence below).
    caveats:
      - "Recovery is a reset; the loader's own comment is 'stop clock until next reset'"
    source: "Parallax SPI Flash Programmer and Boot Loader v51, Loader, Verify application checksum (stop: 'if checksum failed ... stop clock until next reset'); Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), HUB, Configuring the Clock Generator (%CC = %00: XI ignored; %SS = %10 XI needs CC != %00)"
    related_instruction: language/pasm2/hubset.yaml

  - name: pin_float_on_fault
    pattern: "fltl #{base_pin} addpins {count}"
    description: |
      Float a range of output pins as part of a fault response, releasing
      drive on a multi-pin interface (e.g., SPI bus) in a single instruction.
      ADDPINS N affects N+1 contiguous pins; FLTL transitions DIR low for
      the whole range, leaving the pins in high-impedance.
    examples:
      - "fltl #spi_di addpins 2    ' float spi_di, spi_ck, spi_cs together (3 pins)"
    context: |
      Used as the first step in fault response — release drive on
      external interfaces before halting the chip. The flash loader floats
      spi_di, spi_ck and spi_cs (P59..P61) this way when the application
      checksum fails.
    related_instruction: language/spin2/operators/op_ADDPINS.yaml
    related_idiom: language/pasm2/idioms/pin-control.yaml
    source: "Parallax SPI Flash Programmer and Boot Loader v51, Loader, Verify application checksum (stop: 'if checksum failed, float spi_cs/spi_ck/spi_di pins'); span of pins: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), development history table, 2019_04_11 Rev B respin ('DIRx/OUTx/FLTx/DRVx can now work on a span of pins (+D[10:6] pins)')"

  - name: float_then_halt_sequence
    pattern: |
      fltl #{interface_base} addpins {pin_count}
      hubset #%0010
    description: |
      Two-instruction fault response: release drive on an external
      interface, then stop the clock. The flash loader issues the FLTL
      first and the HUBSET second.
    examples:
      - |
        ' On checksum failure in flash loader:
        fltl   #spi_di addpins 2    ' float all 3 SPI output pins
        hubset #%0010               ' halt
    context: |
      The fail-safe halt as the flash loader implements it. Use this
      pattern when a detected integrity failure means no further code
      should execute and no external interface should remain driven.
    source: "Parallax SPI Flash Programmer and Boot Loader v51, Loader, Verify application checksum (stop)"

related:
  - language/pasm2/hubset.yaml
  - language/spin2/operators/op_ADDPINS.yaml
  - language/pasm2/idioms/pin-control.yaml
  - language/pasm2/fltl.yaml
  - code-examples/flash-loader-case-study.yaml
