name: Hub Memory Access Idioms
description: Common patterns for accessing hub memory from PASM2
category: hub_memory
frequency: high

idioms:
  - name: hub_read_long
    pattern: "rdlong {dest}, {ptr}"
    description: Read 32-bit value from hub
    usage_count: 215
    examples:
      - "rdlong basepin_val, ptra"
      - "rdlong buffer_base, ptra"
      - "rdlong text_cols, ptra"
    context: Fetch parameters or data from hub

  - name: hub_write_long
    pattern: "wrlong {src}, {ptr}"
    description: Write 32-bit value to hub
    usage_count: 140
    examples:
      - "wrlong pb, ptra"
      - "wrlong timeCnt, adrTime"
      - "wrlong nVel, ptrb"
    context: Store results or status to hub

  - name: hub_read_byte
    pattern: "rdbyte {dest}, {ptr}"
    description: Read 8-bit value from hub
    usage_count: 1
    examples:
      - "rdbyte PR0, PR3"
    context: Read character or small data

  - name: hub_write_byte
    pattern: "wrbyte {src}, {ptr}"
    description: Write 8-bit value to hub
    usage_count: 1
    examples:
      - "wrbyte PR0, PR3"
    context: Store character or small data

  - name: hub_read_word
    pattern: "rdword {dest}, {ptr}"
    description: Read 16-bit value from hub
    examples:
      - "rdword value, ptra"
    context: Read 16-bit data

  - name: hub_write_word
    pattern: "wrword {src}, {ptr}"
    description: Write 16-bit value to hub
    examples:
      - "wrword value, ptra"
    context: Store 16-bit data

  - name: setq_block_read
    pattern: |
      setq #{count - 1}
      rdlong {first_cog_reg}, {hub_ptr}
    description: |
      Block-transfer a run of longs from hub into contiguous cog registers
      with one RDLONG, using SETQ to set the count (number of longs minus 1).
      SETQ2 targets LUT RAM instead, addressed from 0.
    examples:
      - |
        setq    #16-1               ' transfer 16 longs
        rdlong  buf, ptra           ' buf..buf+15 filled from hub
      - |
        setq2   #128-1              ' transfer 128 longs to LUT
        rdlong  0, hub_ptr          ' LUT[0..127] filled (LUT is $000-based here)
    context: |
      The block moves one long per clock, unless the hub FIFO is accessing the
      same hub RAM slice on the same cycle, in which case the FIFO gets priority
      and the block move waits for the slice to come around again.
    constraints:
      - "SETQ count = N-1 (zero-based) — count of 0 transfers 1 long"
      - "Destination cog registers must be contiguous"
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), FAST BLOCK MOVES"
    related_instructions:
      - language/pasm2/setq.yaml
      - language/pasm2/setq2.yaml
      - language/pasm2/rdlong.yaml
      - language/pasm2/wrlong.yaml

  - name: setq_block_write
    pattern: |
      setq #{count - 1}
      wrlong {first_cog_reg}, {hub_ptr}
    description: |
      Block-transfer a run of contiguous cog registers to hub with one WRLONG.
      SETQ2 transfers from LUT RAM instead. Registers $1F8..$1FF cannot be
      transferred to hub this way.
    source: "description: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), FAST BLOCK MOVES"
    examples:
      - |
        setq    #16-1
        wrlong  buf, ptra           ' buf..buf+15 written to hub
    context: |
      Mirror of setq_block_read; used to flush cog state or computed
      results to hub in one operation.

  - name: setq_block_chained_for_large_transfers
    pattern: |
      ' Loop: per iteration, transfer 512 longs hub→LUT then LUT→hub
      setq2   #512-1
      rdlong  0, src_ptr           ' fill LUT 0..511 from hub
      setq2   #512-1
      wrlong  0, dst_ptr           ' write LUT 0..511 to hub
      ' update pointers, decrement count, repeat
    description: |
      Combine SETQ2 block read + SETQ2 block write to perform a
      hub-to-hub memcpy via the LUT, 512 longs per outer iteration.
      Used when both source and destination are in hub but a fast
      block copy is needed.
    context: |
      The flash loader's programmer uses this pattern to move the application
      down to hub $00000 (SETQ2 #$200-1 with RDLONG 0,PTRA++ then WRLONG 0,PTRB++,
      looped by DJNF). See code-examples/flash-loader-case-study.yaml for
      the full sequence.
    source: "Parallax SPI Flash Programmer and Boot Loader v51, Programmer, Move application down to $00000+ (.move loop)"
    related: code-examples/flash-loader-case-study.yaml

related:
  - language/pasm2/setq.yaml
  - language/pasm2/setq2.yaml
  - language/pasm2/concepts/setq_block_ops.yaml
  - code-examples/flash-loader-case-study.yaml