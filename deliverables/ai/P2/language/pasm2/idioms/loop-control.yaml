name: Loop Control Idioms
description: Common PASM2 loop patterns
category: loops

idioms:
  - name: rep_loop
    pattern: "rep #{instructions}, #{iterations}"
    description: Hardware repeat loop
    examples:
      - "rep #5, #80"
      - "rep #2, #8"
      - "rep #2, #2"
    context: Repeats instructions without branching delays in cog/LUT memory; in hub memory REP works but executes a hidden jump to get back to the top of the repeated instructions

  - name: djnz_loop
    pattern: "djnz {counter}, #{label}"
    description: Decrement and jump if not zero
    examples:
      - "djnz y, #line"
      - "_ret_ djnz y, #blank"
      - "djnz a, #pinloop"
    context: Counted loops with automatic decrement

  - name: jmp_loop
    pattern: "jmp #{label}"
    description: Unconditional jump for loops
    examples:
      - "jmp #main_loop"
      - "jmp #start"
    context: Create infinite or conditional loops

  - name: djnf_loop
    pattern: "djnf {counter}, #{label}"
    description: |
      Decrement D and jump if the result is not $FFFF_FFFF.
    examples:
      - "djnf t, #.move"
      - "djnf count, #process_loop"
    context: |
      Both DJNZ and DJNF decrement D and then test the result. DJNZ jumps
      if the result is not zero; DJNF jumps if the result is not $FFFF_FFFF.
      With the DJNZ or DJNF at the end of the loop body and a starting
      count N, DJNZ runs the body N times for N >= 1; for N = 0 the first
      decrement gives $FFFF_FFFF, so the body runs 4,294,967,296 times.
      DJNF runs the body N + 1 times; N = 0 runs it once.
    source: "Instruction CSV rows DJNZ (Decrement D and jump to S if result is not zero) and DJNF (Decrement D and jump to S if result is not $FFFF_FFFF); Parallax SPI Flash Programmer and Boot Loader v51, Programmer, Move application down to $00000+ (djnf t,#.move)"
    related_instructions:
      - language/pasm2/djnf.yaml
      - language/pasm2/djnz.yaml

  - name: tight_inner_loop_with_rep
    pattern: |
      rep #{body_instruction_count}, {iteration_count}
      ' body_instruction_count instructions go here
    description: |
      Inner loop using REP. The N instructions following REP form the loop
      body, executed iteration_count times. In cog/LUT memory the body is
      repeated without branching delays; in hub memory REP executes a hidden
      jump to get back to the top of the body on each repeat. Not documented:
      the cost of that jump. The examples are 2-instruction checksum and copy
      bodies.
    examples:
      - |
        ' Checksum loop — 2-instruction body, runs 'count' times:
        rep     #2, count
        rdlong  x, ptra++
        add     sum, x
      - |
        ' Copy loop — also 2 instructions, runs 'count' times:
        rep     #2, count
        rdlong  x, ptra++
        wrlong  x, ptrb++
    context: |
      With an iteration count of 0 the body repeats indefinitely, so a count
      that can be 0 is tested before the REP; a body count of 0 repeats nothing.
      A branch within the body cancels the REP activity, and interrupts are
      ignored during REP looping — see language/pasm2/rep.yaml. Not documented:
      the timing of REP against DJNZ.
    source: "Adapted from Parallax SPI Flash Programmer and Boot Loader v51, Programmer, 'Get number of bytes, add $400 zero bytes after download, verify checksum', which reads through the FIFO (rdfast, then rep #2,s with rflong v / add); context: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), INSTRUCTION REPEATING (D[8:0] = 0 repeats nothing; D[8:0] > 0 with S[31:0] = 0 repeats indefinitely; REP in hub memory executes a hidden jump; a branch within the block cancels REP activity; interrupts are ignored during REP looping)"
    related_instruction: language/pasm2/rep.yaml

related:
  - language/pasm2/rep.yaml
  - language/pasm2/djnz.yaml
  - language/pasm2/djnf.yaml
  - code-examples/flash-loader-case-study.yaml