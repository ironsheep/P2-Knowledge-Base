instruction: NIXINT1
syntax: NIXINT1
encoding:
- bits: EEEE 1101011 000 000100101 000100100
  write: —
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: >-
  Cancel INT1. An INT1 interrupt that has been triggered and is waiting to
  branch is nixed, so its branch does not occur. NIXINT1 is only useful in main
  code after STALLI executes, or in the ISR of a higher-level interrupt that must
  stop INT1 from executing after that ISR exits; the debug interrupt is the only
  interrupt above INT1.
flags_affected:
  C: No effect
  Z: No effect
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.157"
sources:
