  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), INTERRUPTS (interrupts that have been triggered and are waiting to branch may be nixed by NIXINTx; these instructions are only useful in main code after STALLI executes or in an ISR which needs to stop a lower-level interrupt from executing after the current ISR exits; INT1 has the highest priority of INT1..INT3) and DEBUG INTERRUPT (the debug interrupt has priority over all the others)"
