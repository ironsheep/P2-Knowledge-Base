instruction: JMP
syntax: JMP     D        {WC/WZ/WCZ}
encoding:
- bits: EEEE 1101011 CZ0 DDDDDDDDD 000101100
  write: —
  c: D[31]
  z: D[30]
  clocks: '4'
- bits: EEEE 1101100 RAA AAAAAAAAA AAAAAAAAA
  write: —
  c: —
  z: —
  clocks: '4'
timing:
  cycles: 4
  type: variable
  range: 4 / 13...20
description: 'JMP #{\}A jumps to A: if R = 1 then PC += A, else PC = A, and "\" forces R = 0. JMP D jumps to D: C = D[31], Z = D[30], PC = D[19:0].'
flags_affected:
  C: Set to D[31] if WC effect used
  Z: Set to D[30] if WZ effect used
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.153"
documentation_level: enhanced
syntax_variants:
- 'JMP #{\}A'
- 'JMP D {WC/WZ/WCZ}'
