instruction: ENCOD
syntax: ENCOD Dest, {#}Src {WC|WZ|WCZ}
brief_description: Encode
category: Math and Logic
description: >-
  ENCOD stores the bit position value (0-31) of the top-most high bit (1) of Src,
  or Dest, into Dest. If the value to encode may be 0, the resulting Dest will
  be 0-- use the WC or WCZ effect and check the resulting C flag to distinguish
  between the cases of input = 1 versus input = 0.

  If the WC or WCZ effect is specified, the C flag is set (1) if Src (or original
  Dest in syntax 2) was not zero, or is cleared (0) if it was zero.

  If the WZ or WCZ effect is specified, the Z flag is set (1) if the result equals
  zero, or is cleared (0) if not zero.

  Examples:
  - %00000000_00000000_00000000_00000001 encodes to 0
  - %00000000_00000000_00000000_00100000 encodes to 5
  - %00000000_00000000_10000001_01000000 encodes to 15
  - %00000000_00000000_00000000_00000000 encodes to 0 with optional C cleared to 0

  ENCOD is the complement of DECOD.
result: The bit position value of the top-most high bit (1) in Src, or Dest, is stored
  in Dest.
parameters:
- Dest is the register in which to store the encoded bit position value and optionally
  begins by containing the 32-bit value it is encoding (syntax 2).
- Src is an optional register, 9-bit literal, or 32-bit augmented literal whose value
  is to be encoded into a bit position.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set if source was not zero
  Z: Set if result is zero
syntax_variants:
- ENCOD Dest, {#}Src {WC|WZ|WCZ}
- ENCOD Dest {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 0111100 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: S != 0
  z: Result == 0
  clocks: '2'
- bits: EEEE 0111100 CZ0 DDDDDDDDD DDDDDDDDD
  write: D
  c: Original D != 0
  z: Result == 0
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ENCOD, p.79"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, rows 77-78 (ENCOD D,{#}S and ENCOD D: D = position of top '1' in S (0..31), C = (S != 0); 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ENCOD, p.79 (both encoding rows, zero input gives Dest 0 with C cleared, the four examples)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Math and logic instructions, p.36 (ENCOD D and ENCOD D,{#}S, 2 clocks)"
documentation_level: comprehensive
last_updated: '2025-09-19'
manual_extraction_date: '2025-01-19'
oneliner: Get bit position of top-most 1 of Src or Dest into Dest
related:
- DECOD
