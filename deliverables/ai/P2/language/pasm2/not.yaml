instruction: NOT
syntax: NOT Dest, {#}Src {WC|WZ|WCZ}
brief_description: Not
category: Math and Logic
description: >-
  NOT performs a bitwise NOT (inverting all bits) of the value in Src (or in Dest)
  and stores the result into Dest.
  If the WC or WCZ effect is specified, the C flag value is replaced by the inverse
  of either S[31] (syntax 1) or D[31] (syntax 2).
  If the WZ or WCZ effect is specified, the Z flag is set (1) if the result of !Src
  (syntax 1) or !Dest (syntax 2) equals zero, or is cleared (0) if it is non-zero.
result: '!Src (or !Dest) is stored in Dest and flags are optionally updated with the
  NOTed high bit and zero status.'
parameters:
- Dest is the register containing the value to bitwise NOT (syntax 2) or to be replaced
  by the bitwise NOT of Src (syntax 1).
- Src is an optional register, 9-bit literal, or 32-bit augmented literal whose value
  will be bitwise NOTed and stored into Dest.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set to inverse of S[31] or D[31]
  Z: Set if result equals zero
syntax_variants:
- NOT Dest, {#}Src {WC|WZ|WCZ}
- NOT Dest {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 0110001 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: '!S[31]'
  z: Result == 0
  clocks: '2'
- bits: EEEE 0110001 CZ0 DDDDDDDDD DDDDDDDDD
  write: D
  c: '!D[31]'
  z: Result == 0
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, NOT, pp.105-106"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, rows 59-60 (NOT D,{#}S {WC/WZ/WCZ}: get !S into D, D = !S, C = !S[31]; the alias NOT D: get !D into D, D = !D, C = !D[31]; footnote * Z = (result == 0); 2 clocks; write D)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Math and Logic Instructions, p.37 (NOT D,{#}S and NOT D {WC/WZ/WCZ}, 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, NOT, pp.105-106 (Result line, Dest and Src parameters, both encoding rows 0110001 CZI / CZ0, write D, C !S[31] / !D[31], Z Result = 0, 2 clocks; explanation of the WC inversion and the WZ zero rule)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 0110001 CZI DDDDDDDDD SSSSSSSSS NOT D,S/# {WC/WZ/WCZ})"
documentation_level: comprehensive
last_updated: '2025-09-19'
manual_extraction_date: '2025-01-19'
oneliner: Bitwise NOT a value
long_description: '!Src (or !Dest) is stored in Dest and flags are optionally updated
  with the NOTed high bit and zero status.'
