instruction: DIRL
syntax: DIRL    {#}D           {WCZ}
category: Pin
description: DIRL alters the direction register's bit(s) designated by Dest to be low (0), setting the I/O pin(s) to input mode. The rest of the direction bits are left as-is. Dest[5:0] indicates the pin number (0-63). For a range of pins, Dest[5:0] indicates the base pin number and Dest[10:6] indicates how many contiguous pins beyond the base should be affected (1-31); the range wraps within the same 32-pin group (DIRA or DIRB) and does not cross the port boundary. A 9-bit literal Dest expresses the base pin (Dest[5:0]) and a range of up to 8 contiguous pins (Dest[8:6]); use the augmented literal feature (##Dest) for an 11-bit literal. When Dest is a register, its value bits [10:0] are used as-is. A prior SETQ overrides Dest[10:6] with the low five bits of the SETQ value; an ALTx between the SETQ and DIRL keeps the override, and a SETQ separated from DIRL by other instructions is not documented. If WCZ is specified, the C and Z flags are set to the original (pre-instruction) state of the base pin's DIR bit.
parameters:
- Dest is the register, 9-bit literal, or 11-bit augmented literal whose value identifies
  the I/O pin(s) to set to input.
- WCZ is an optional effect to update flags.
flags_affected:
  C: Set to the original (pre-instruction) state of the base pin's DIR bit (if WCZ specified)
  Z: Set to the original (pre-instruction) state of the base pin's DIR bit (if WCZ specified)
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1101011 CZL DDDDDDDDD 001000000
  write: DIRx
  c: Orig DIRx base bit
  z: Orig DIRx base bit
  clocks: '2'
encoding_notes:
- "DIRL uses the S-field code 001000000, the same code as TESTP with WC or WZ."
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, DIRH / DIRL, p.71"
sources:
  - "encoding_notes: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 1101011 CZL DDDDDDDDD 001000000 for both TESTP D/# WC/WZ and DIRL D/# {WCZ})"
  - "description (a prior SETQ overrides D[10:6]): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), list of changes (DIRx/OUTx/FLTx/DRVx can now work on a span of pins, +D[10:6] pins; prior SETQ overrides D[10:6])"
  - "description (an ALTx between the SETQ and DIRL keeps the override): Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ALTB, pp.38-39 (SETQ / SETQ2 does not affect ALTx instructions; the Q value passes through to the next instruction); a SETQ separated by other instructions is in no source"
  - "P2 Instructions v35 - Rev B/C Silicon, row 349 (DIRL {#}D {WCZ}: DIR bits of pins D[10:6]+D[5:0]..D[5:0] = 0; wraps within DIRA/DIRB; prior SETQ overrides D[10:6]; C,Z = DIR bit; write DIRx; 2 clocks)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 1101011 CZL DDDDDDDDD 001000000 DIRL D/# {WCZ}), I/O PIN TIMING (DIRL affects pin D bit in DIRx)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, DIRH / DIRL, p.71 (encoding table; Dest[5:0], Dest[10:6], the 9-bit literal range of Dest[8:6], ##Dest, the SETQ substitution, the wrap within DIRA or DIRB, C and Z set to the original base bit, 2 clocks)"
