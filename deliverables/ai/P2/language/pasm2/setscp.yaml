instruction: SETSCP
syntax: SETSCP  {#}D
encoding:
- bits: EEEE 1101011 00L DDDDDDDDD 001110000
  write: —
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: Set four-channel oscilloscope enable to D[6] and set input pin base to
  D[5:2]. D[6] enables the SCOPE data pipe and D[5:2] selects the 4-pin block whose
  lower bytes of RDPIN values the pipe continuously carries.
