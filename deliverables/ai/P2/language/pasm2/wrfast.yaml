instruction: WRFAST
syntax: WRFAST  {#}D,{#}S
encoding:
- bits: EEEE 1100100 0LI DDDDDDDDD SSSSSSSSS
  write: —
  c: —
  z: —
  clocks: '2 or WRFAST finish + 3'
timing:
  cycles: 2
  type: conditional
description: Begin new fast hub write via FIFO. D[31] = no wait, D[13:0] = count of
  64-byte blocks (0 = no wrapping until the entire 1MB hub map has been sequenced
  through), S[19:0] = block start address (long-aligned when wrapping).
flags_affected:
  C: No effect
  Z: No effect
documentation_level: enhanced
documentation_source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), FAST SEQUENTIAL FIFO INTERFACE (operands, no-wait form, WAITX #20 before COGSTOP)"
notes:
- "D[13:0] is a count of 64-byte blocks, not an address mask: after that many blocks are written the FIFO wraps to the original start address and reloads the original block count. A block count of 0 means no wrapping until the entire 1MB hub map has been sequenced through."
- "D and S layout: D[31] = no-wait flag; D[13:0] = %00_0000_0000_0000 for limited writing (no wrap) or %BB_BBBB_BBBB_BBBB for a wrapping block count; S[19:0] = start address, with S[1:0] = %00 when wrapping."
- "D[31]=0 waits for any previous WRFAST to finish, then reconfigures the FIFO for writing. D[31]=1 does not wait for the FIFO reconfiguration and takes 2 clocks; the code must allow enough clocks before any attempt to write FIFO data."
- "WRFAST is executed from cog RAM or lookup RAM."
- "A cog that has been writing to the hub via WRFAST and wants to COGSTOP itself executes WAITX #20 first, to allow time for any lingering FIFO data to be written to the hub."
last_updated: '2025-09-19T16:04:17.110590'
category: Hub FIFO
oneliner: Begin new fast hub write via FIFO

streamer_pairing:
  rule: |
    Use WRFAST before any streamer command that CAPTURES pin data INTO
    hub memory (e.g., X_*_WFBYTE, X_*_WFLONG modes). The FIFO sinks
    streamer output into hub.
  direction_from_cogs_perspective: "WRFAST = 'I, the cog, am about to write to hub' — and yes, the streamer/FIFO is the agent doing that writing"
  paired_with: language/pasm2/rdfast.yaml
  verb_confusion_warning: |
    The verb "WRFAST" sounds like it should be paired with hub-WRITE
    operations issued by the cog, and "RDFAST" with hub-READ operations.
    From the STREAMER's perspective that mapping is the opposite of
    what intuition suggests:
      - RDFAST configures the FIFO so the streamer can READ from hub
        (and WRITE to pins) → use for OUTPUT streaming
      - WRFAST configures the FIFO so the streamer can WRITE to hub
        (after READING from pins) → use for INPUT streaming
    Remember: the verb describes what HUB I/O direction the FIFO is
    configured for, not what the streamer's payload direction is.
  source: "Parallax SPI Flash Programmer and Boot Loader v51, Loader, Read in remaining application longs (WRFAST, then the streamer writes spi_do bits to hub)"

