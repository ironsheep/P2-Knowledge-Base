instruction: GETCT
syntax: GETCT   D               {WC}
encoding:
- bits: EEEE 1101011 C00 DDDDDDDDD 000011010
  write: D
  c: "— (C = same; WC selects CT[63:32] instead of CT[31:0])"
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: |
  Read the system counter into D. The underlying counter is a free-running 64-bit counter
  that increments every clock, cleared on reset.
  Without WC: D receives the lower 32 bits of the 64-bit counter.
  With WC:    D receives the upper 32 bits of the 64-bit counter.
  GETCT WC followed by GETCT reads the full 64-bit value, except in a cog whose group of
  four has missed a wrap of the lower long. The WC bit selects the upper or lower half;
  C = same.
flags_affected:
  C: Same (WC selects upper/lower 32 bits of the counter)
  Z: No effect
measuring_elapsed: "Two GETCTs bracketing a sequence add a fixed 2 clocks to the difference: elapsed = (end - start) - 2. A back-to-back pair reads 2; around 10 NOPs (20 clocks) it reads 22. In cog execution the timing is exact."
silicon_errata:
  stale_upper_long_after_missed_wrap:
    condition: "In a cog of a four-cog group (cogs 0-3 or 4-7) that has had no running cog at one or more wraps of the counter's lower long (every 2^32 clocks, 21.47 s at 200 MHz), until that group runs through its next wrap. From reset only cog 0 runs, so the first cog a program starts in 4-7 after the first wrap meets it."
    effect: "GETCT WC returns an upper long behind by one per missed wrap; the 64-bit time is short by that many x 2^32 clocks. The window closes at the group's next wrap, in one step, whatever the lag (1, 2 and 8 missed wraps all close in one step); an interval timed across that wrap is too long by the same amount."
    workaround: "One-time startup workaround: keep a cog of each group in use running at every wrap -- e.g. coginit(KEEPER_COG, @keeper, 0) as the first line of main(), KEEPER_COG a cog of 4-7 nothing else starts or stops, its code 'keeper jmp #keeper'. Or take no 64-bit time in that group until it has run through one wrap."
    not_affected: "GETCT without WC."
    source: "Hardware-verified on Rev C silicon, 200 MHz: EF-068 (both runs; the lower long is always current, so GETCT without WC is not affected), EF-075 (keeper cog), EF-079 (cogs 0-3 the same), EF-080 (closes in one step at the group's next wrap, from a lag of 8 wraps). Not listed in Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), KNOWN BUGS, p.4."
