instruction: OR
syntax: OR Dest, {#}Src {WC|WZ|WCZ}
brief_description: Or
category: Math and Logic
description: >-
  OR performs a bitwise OR of the value in Src into that of Dest.
  If the WC or WCZ effect is specified, the C flag is set (1) if the result contains
  an odd number of high (1) bits, or is cleared (0) if it contains an even number
  of high bits.
  If the WZ or WCZ effect is specified, the Z flag is set (1) if the Dest OR Src result
  equals zero, or is cleared (0) if it is non-zero.
result: Dest OR Src is stored in Dest and flags are optionally updated with parity
  and zero status.
parameters:
- Dest is the register containing the value to bitwise OR with Src and is the destination
  in which to write the result.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value will be
  bitwise ORed into Dest.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set to parity of result
  Z: Set if result equals zero
syntax_variants:
- OR Dest, {#}Src {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 0101010 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: Parity of Result
  z: Result == 0
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, OR, p.106"
sources:
