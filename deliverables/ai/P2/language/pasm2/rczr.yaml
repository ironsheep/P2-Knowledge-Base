instruction: RCZR
syntax: RCZR Dest {WC|WZ|WCZ}
brief_description: Rotate carry and zero right
category: Math and Logic
description: >-
  RCZR shifts Dest's binary value right by two places and sets Dest[31] to C and
  Dest[30] to Z. If the WC or WCZ effect is specified, the C flag is updated to the
  original Dest[1] state. If the WZ or WCZ effect is specified, the Z flag is updated
  to the original Dest[0] state.
result: The bits of Dest are shifted right by two places and C and Z are inserted
  as new MSBs.
parameters:
- Dest is the register containing the value to rotate the carry and zero flags right
  into.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set to original D[1] state
  Z: Set to original D[0] state
syntax_variants:
- RCZR D {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1101011 CZ0 DDDDDDDDD 001101010
  write: D
  c: D[1]
  z: D[0]
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, RCZR, p.118"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 391 (RCZR D {WC/WZ/WCZ}: rotate C,Z right through D, D = {C, Z, D[31:2]}, C = D[1], Z = D[0]; 2 clocks; write D)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Math and Logic Instructions, p.37 (RCZR D {WC/WZ/WCZ}, 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, RCZR, p.118 (Result line, Dest parameter, encoding row 1101011 CZ0 / 001101010, write D, C D[1], Z D[0], 2 clocks, the shift-by-two explanation with Dest[31] = C and Dest[30] = Z, the WC rule (original Dest[1]) and the WZ rule (original Dest[0]))"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 1101011 CZ0 DDDDDDDDD 001101010 RCZR D {WC/WZ/WCZ})"
documentation_level: comprehensive
last_updated: '2025-09-19'
manual_extraction_date: '2025-01-19'
oneliner: Rotate carry and zero flags right into value (2-bit rotate right)
