instruction: MUXNIBS
syntax: MUXNIBS Dest, {#}Src
brief_description: Mux nibbles
category: Math and Logic
description: >-
  MUXNIBS copies any non-zero nibbles from Src into the corresponding nibbles of Dest
  and leaves the rest of Dest's nibbles as-is.
result: >-
  Dest nibbles corresponding to non-zero Src nibbles are set to those nibble values;
  the rest are left as-is.
parameters:
- Dest is a register whose value will be updated according to Src.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose non-zero nibbles
  will replace the corresponding nibbles in Dest.
flags_affected:
  C: No effect
  Z: No effect
syntax_variants:
- MUXNIBS Dest, {#}Src
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1001111 01I DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, MUXNIBS, p.101"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 134 (MUXNIBS D,{#}S: for each non-zero nibble in S, copy that nibble into the corresponding D nibble, else leave that D nibble the same; 2 clocks; write D)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Math and Logic Instructions, p.37 (MUXNIBS D,{#}S, 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, MUXNIBS, p.101 (Result line, Dest and Src parameters; encoding row 1001111 01I, write D, C flag and Z flag none, 2 clocks; copies any non-zero nibbles from Src into the corresponding nibbles of Dest and leaves the rest as-is)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 1001111 01I DDDDDDDDD SSSSSSSSS MUXNIBS D,S/#)"
documentation_level: comprehensive
last_updated: '2025-09-19'
manual_extraction_date: '2025-01-19'
oneliner: Set discrete nibbles of a value to non-zero nibble states of another
