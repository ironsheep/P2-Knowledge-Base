instruction: BITL
syntax: BITL    D,{#}S         {WCZ}
encoding:
- bits: EEEE 0100000 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: original D[S[4:0]]
  z: original D[S[4:0]]
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: >-
  BITL sets the Dest bit(s) designated by Src to low (0). All other bits are left
  unchanged. Src[4:0] is the bit number (0-31) and Src[9:5] is how many further
  contiguous bits are affected, so a non-zero Src[9:5] changes a span of bits rather
  than one. A prior SETQ overrides Src[9:5] with the low five bits of the SETQ value;
  an ALTx between the SETQ and BITL keeps the override (SETQ #0, ALTB, BITL forces a
  single bit), and a SETQ separated from BITL by other instructions is not documented.
  If WCZ is specified, C and Z are set to the original state of the base bit
  D[Src[4:0]] before modification. BITL takes no effect or WCZ.
flags_affected:
  C: With WCZ, set to original D[S[4:0]]
  Z: With WCZ, set to original D[S[4:0]]
parameters:
- Dest is the register whose value will have one or more bits set low.
- Src is a register, 9-bit literal, or 10-bit augmented literal whose value identifies
  the bit(s) to modify.
- WCZ is an optional effect to update flags.
encoding_notes:
- BITL and TESTB with WC or WZ share the INSTR field 0100000; the effect bits tell them apart (BITL no effect = C Z 00, WCZ = 11; TESTB WC = 10, WZ = 01). BITL takes no effect or WCZ and the assembler refuses WC on it.
sources:
  - "encoding row and flags: P2 Instructions v35 - Rev B/C Silicon, row 42 (BITL: bits D[S[9:5]+S[4:0]:S[4:0]] = 0; other bits unaffected; prior SETQ overrides S[9:5]; C,Z = original D[S[4:0]]; 2 clocks; write D); Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 0100000 CZI ... BITL D,S/# {WCZ}; the same INSTR field as TESTB D,S/# WC/WZ) and its list of changes (the span of bits, +S[9:5]; prior SETQ overrides S[9:5])"
  - "description (Src[4:0] and Src[9:5], the WCZ rule, the literal forms): Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, BITH / BITL, pp.52-53"
  - "description (SETQ #0 then ALTB then BITxxx forces Src[9:5] to 0): Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ALTB, pp.38-39; the manual's BITH / BITL text says a SETQ immediately preceding substitutes its Dest[4:0]; a SETQ separated by other instructions is in no source"
  - "encoding_notes: CP-033 (BITL assembles as EEEE 0100000 with C Z = 00 with no effect and 11 with WCZ; TESTB WC/WZ share 0100000 with C Z = 10/01; bitl x,#1 wc is refused with 'This effect is not allowed for this instruction')"
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, BITH / BITL, pp.52-53"
documentation_level: comprehensive
