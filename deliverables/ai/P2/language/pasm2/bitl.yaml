instruction: BITL
syntax: BITL    D,{#}S         {WCZ}
encoding:
- bits: EEEE 0100000 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: original D[S[4:0]]
  z: original D[S[4:0]]
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: >-
  BITL sets the Dest bit(s) designated by Src to low (0). All other bits are left
  unchanged. Src[4:0] is the bit number (0-31) and Src[9:5] is how many further
  contiguous bits are affected, so a non-zero Src[9:5] changes a span of bits rather
  than one; a SETQ immediately before the instruction overrides Src[9:5] (a SETQ of
  zero forces a single bit). Z is set to the original state of the target bit before
  modification.
flags_affected:
  C: Set to original D[S[4:0]]
  Z: Set to original D[S[4:0]]
parameters:
- Dest is the register whose value will have one or more bits set high or low.
- Src is a register, 9-bit literal, or 10-bit augmented literal whose value identifies
  the bit(s) to modify.
documentation_source: PASM2 Manual 2022/11/01
documentation_level: comprehensive
compiler_operand_format:
  name: operand_bitx
  pattern: D,S/#
  description: 'Bit manipulation with optional effect flags: Destination register,
    bit position'
  valueType: 1
compiler_encoding:
  operandFormat: 1
