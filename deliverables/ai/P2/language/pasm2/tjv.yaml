instruction: TJV
syntax: TJV Dest, {#}Src
brief_description: Test, jump if overflow
category: Branch
description: >-
  TJV tests the value in Dest against C and jumps to the address described by Src
  if Dest has overflowed (Dest[31] != C). This instruction requires that C be updated
  (to the correct sign) by the previous ADDS / ADDSX / SUBS / SUBSX / CMPS / CMPSX /
  SUMx instruction. The address (Src) can be absolute or relative. To specify an
  absolute address, Src must be a register containing a 20-bit address value. To
  specify a relative address, use #Label for a 9-bit signed offset (a range of -256 to
  +255 instructions) or use ##Label (or insert a prior AUGS instruction) for a 20-bit
  signed offset. Offsets are relative to the instruction following the TJV. The signed
  offset value is in units of whole instructions -- it is added to PC as-is when in
  Cog/LUT execution mode and is multiplied by 4 then added to PC when in Hub execution
  mode (long-aligned Hub code not required).
result: >-
  Dest is tested against C and if it has overflowed (Dest[31] != C), PC is set to a
  new relative (#Src) or absolute (Src) address.
parameters:
- Dest is a register whose value is tested for overflow (Dest[31] != C).
- 'Src is a register, 9-bit literal, or 20-bit augmented literal whose value is the
  absolute or relative address to set PC to. Use # for relative addressing; omit #
  for absolute addressing.'
flags_affected:
  C: No effect
  Z: No effect
syntax_variants:
- TJV D,{#}S
timing:
  cycles: 1
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 1011110 00I DDDDDDDDD SSSSSSSSS
  write: PC   1
  c: —
  z: —
  clocks: 2 or 4 / 2 or 13–20
encoding_notes:
- PC is written only when Dest has overﬂowed.
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_dsj
  pattern: D,S/@
  description: 'Jump with destination and relative address: register, relative address'
  valueType: 12
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 12
