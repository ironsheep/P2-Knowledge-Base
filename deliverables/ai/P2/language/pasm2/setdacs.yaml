description: 'DAC3 = D[31:24], DAC2 = D[23:16], DAC1 = D[15:8], DAC0 = D[7:0].'
background_state: >-
  SETDACS establishes the background state of the cog's four 8-bit DAC channels.
  The values it sets are output constantly, except at times when the streamer
  and/or the colorspace converter override them. A pin outputs a DAC channel only
  when it is configured for DAC-channel output; which pins each channel can drive
  is in architecture/streamer/dac-routing.yaml (pin_mapping).
streamer_override: architecture/streamer/dac-routing.yaml
