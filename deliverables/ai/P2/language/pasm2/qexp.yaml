instruction: QEXP
syntax: QEXP    {#}D
encoding:
- bits: EEEE 1101011 00L DDDDDDDDD 000001111
  write: —
  c: —
  z: —
  clocks: '2...9'
timing:
  cycles: "2...9"
  type: variable
description: Compute 2 to the power of D, a 5:27-bit logarithm (top 5 bits the whole
  part of the power-of-2 exponent, bottom 27 bits the fractional part), as a 32-bit
  unsigned integer. GETQX retrieves the result 55 clocks later.
flags_affected:
  C: No effect
  Z: No effect
long_description: 'QEXP converts a 5:27-bit logarithm into a 32-bit unsigned integer
  using the hub''s 54-stage pipelined CORDIC solver. The logarithm is in the D operand:
  bits [31:27] hold the whole part of the power-of-2 exponent and bits [26:0] hold
  the fractional part. Fifty-five clocks after the cog hands the command to the CORDIC
  solver, the integer result is available through GETQX, which waits if the result
  has not yet arrived.

  '
examples:
- code: ''' Convert 5:27 logarithm back to integer

    QEXP    log_value      '' Begin exponential conversion

    '' Wait 55 clocks...

    GETQX   integer_result '' Get 32-bit integer

    '
  description: Basic logarithm to integer conversion
- code: ''' Process variable logarithm

    QEXP    logarithm

    '' ... other work for 55 clocks ...

    GETQX   exponential

    '
  description: Variable exponential calculation
related_instructions:
- GETQX
- QLOG
- QMUL
operand_details:
  D: 5:27-bit logarithm (5-bit exponent in [31:27], 27-bit fractional in [26:0])
result_details:
  GETQX: 32-bit unsigned integer
timing_notes: A cog waits for its hub slot, zero to (cogs-1) clocks away, to hand the
  command to the CORDIC solver. Fifty-five clocks later the result is available via
  GETQX.
documentation_source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet Release November 1, 2022 (2022/11/01), CORDIC Solver, p.21, and CORDIC Solver Instructions, p.44; P2 Instructions v35 - Rev B/C Silicon, Sheet1; Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), CORDIC SOLVER (EXPONENT)"
documentation_level: comprehensive
