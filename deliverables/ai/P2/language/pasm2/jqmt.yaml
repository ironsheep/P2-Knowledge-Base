instruction: JQMT
syntax: JQMT    {#}S
encoding:
- bits: EEEE 1011110 01I 000001111 SSSSSSSSS
  write: —
  c: —
  z: —
  clocks: '2 or 4'
timing:
  cycles: 2
  type: variable
  range: 13...20
description: >-
  JQMT checks the cog's CORDIC-read-but-empty event flag and jumps to the address
  described by Src if the flag is set. PC is set to a new relative (#Src) or absolute
  (Src) address. The flag is cleared after the check.
documentation_source: PASM2 Manual 2022/11/01
documentation_level: comprehensive
compiler_operand_format:
  name: operand_jpoll
  pattern: S/#
  description: 'Poll jump: target address/immediate'
  valueType: 21
compiler_encoding:
  operandFormat: 21
enhancement_source: PNUT_TS_v2.0_complete_operand_integration_2025-09-13
syntax_variants:
- JQMT {#}S
last_updated: '2025-09-19T16:04:17.119474'
parameters:
- 'Src is a register, 9-bit literal, or 20-bit augmented literal whose value is the
  absolute or relative address to set PC to. Use # for relative addressing; omit #
  for absolute addressing.'
flags_affected:
  C: No effect
  Z: No effect
category: Event
oneliner: Jump if CORDIC-read-but-empty event flag set or clear
