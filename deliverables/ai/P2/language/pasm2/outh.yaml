instruction: OUTH
syntax: OUTH    {#}D           {WCZ}
encoding:
- bits: EEEE 1101011 CZL DDDDDDDDD 001001001
  write: OUTx
  c: Orig OUTx base bit
  z: Orig OUTx base bit
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: >-
  OUTH alters the output level register's bit(s) designated by Dest to be high (1).
  All other bits are left as-is.

  Dest[5:0] indicates the pin number (0-63). For a range of pins, Dest[5:0] indicates
  the base pin number (0-63) and Dest[10:6] indicates how many contiguous pins beyond
  the base should be affected (1-31).

  A 9-bit literal Dest is enough to express the base pin (Dest[5:0]) and a range of
  up to 8 contiguous pins (Dest[8:6]). If needed, use the augmented literal feature
  (##Dest) to augment Dest to an 11-bit literal value-- this inserts an AUGD
  instruction prior.

  When Dest is a register, the register's value bits [10:0] are used as-is to form
  the 11-bit ID range, unless a prior SETQ overrides value bits[10:6] with the low
  five bits of the SETQ value. An ALTx between the SETQ and OUTH keeps the
  override, and a SETQ separated from OUTH by other instructions is not documented.

  The range calculation (from Dest[5:0] up to Dest[5:0]+Dest[10:6]) wraps within
  the same 32-pin group (OUTA or OUTB); it does not cross the port boundary.
result: >-
  The I/O pin output level bit(s), described by Dest, are set high (1); the rest
  are left as-is. With WCZ, C and Z = original (pre-instruction) state of the base pin's OUT bit.
flags_affected:
  C: Set to the original (pre-instruction) state of the base pin's OUT bit
  Z: Set to the original (pre-instruction) state of the base pin's OUT bit
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, OUTH / OUTL, p.108 (the wrap within OUTA or OUTB); P2 Instructions v35 - Rev B/C Silicon, row 358 (OUTH: wraps within OUTA/OUTB)"
sources:
  - "description (prior SETQ overrides D[10:6]): P2 Instructions v35 - Rev B/C Silicon, row 358 (OUTH: OUT bits of pins D[10:6]+D[5:0]..D[5:0] = 1; wraps within OUTA/OUTB; prior SETQ overrides D[10:6]; C,Z = OUT bit; write OUTx; 2 clocks); Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), list of changes (DIRx/OUTx/FLTx/DRVx span of pins, +D[10:6]; prior SETQ overrides D[10:6])"
  - "description (an ALTx between the SETQ and the instruction keeps the override): Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ALTB, p.38 and ALTD, p.39 (SETQ / SETQ2 does not affect ALTx instructions; the Q value passes through to the next instruction); a SETQ separated from OUTH by other instructions is in no source"
  - "description (Dest[5:0], Dest[10:6], the 9-bit literal range of Dest[8:6], ##Dest, the SETQ substitution, the wrap, C and Z set to the original base bit): Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, OUTH / OUTL, p.108 (encoding row 001001001, write OUTx, C and Z Orig OUTx base bit, 2 clocks)"
documentation_level: comprehensive
