constant: false
name: false
value: 0
hex_value: $00000000
description: 'Logical false constant

  All bits cleared to represent boolean false condition

  '
category: Constants
documentation_level: complete
usage: 'Use in conditional logic and boolean operations

  Commonly used for initialization and flag clearing

  '
examples:
- code: |
    mov     flag, ##FALSE           ' Initialize flag to FALSE
    ' ... some operations ...
    cmp     x, y        wz          ' Compare x and y
    if_e    mov flag, ##TRUE        ' Set flag to TRUE if equal
  description: Using FALSE for initialization
notes:
- 'FALSE fits a 9-bit immediate: mov flag, #0. TRUE (-1) does not: write ##TRUE (the compiler adds an AUGS) or neg flag, #1.'
- All bits cleared (0 value)
- Standard boolean false value in PASM2
- Used for clearing flags and initialization
related:
- true
- conditional_execution
oneliner: Logical false constant
