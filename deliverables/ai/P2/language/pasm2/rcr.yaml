instruction: RCR
syntax: RCR Dest, {#}Src {WC|WZ|WCZ}
brief_description: Rotate carry right
category: Math and Logic
description: >-
  RCR shifts Dest's binary value right by Src places (0-31 bits) and sets the new MSBs
  to C. If the WC or WCZ effect is specified, the C flag is updated to the value of the
  last bit shifted out if Src is 1-31, or to Dest[0] if Src is 0. If the WZ or WCZ
  effect is specified, the Z flag is set (1) if the Dest result equals zero, or is
  cleared (0) if it is non-zero.
result: The bits of Dest are shifted right by Src bits, inserting C as new MSBs.
parameters:
- Dest is the register containing the value to rotate carry right by Src bits.
- Src is a register or 5-bit literal whose value indicates the number of bit positions
  to rotate.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set to last bit shifted out if S[4:0] > 0, else D[0]
  Z: Set if result equals zero
syntax_variants:
- RCR D,{#}S {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 0000100 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: Last bit out1
  z: Result == 0
  clocks: '2'
encoding_notes:
- C = last bit shifted out if Src[4:0] > 0, else C = Dest[0].
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_ds
  pattern: D,S/#
  description: Destination register, Source register or immediate value
  valueType: 0
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 0
