instruction: MODC
syntax: MODC    c               {WC}
encoding:
- bits: EEEE 1101011 C01 0cccc0000 001101111
  write: —
  c: cccc[{C,Z}]
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: >-
  MODC sets or clears the C flag based on the mode described by the given Modifier.
  The C flag is set or cleared according to the given Modifier and the current state
  of the C and/or Z flags.
result: >-
  C = cccc[{C,Z}], where cccc is the 4-bit modifier value that selects which
  combination of current C and Z states produces a 1 result.
modifier_rule: >-
  cccc is the conditional test used to update C: %0000 clears C, %1111 sets C, and every
  other value is read as the EEEE condition with the same code. The Modifier symbols
  (_CLR, _SET, _NC_AND_Z and the rest) and their values are listed in
  language/pasm2/modcz.yaml; the EEEE conditions are in
  language/pasm2/concepts/conditional_execution.yaml. The WC effect is required for C to
  be affected.
flags_affected:
  C: Set per cccc modifier and current C/Z state
  Z: No effect
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, MODC / MODZ / MODCZ and Modifier Symbols, pp.97-98; Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), COGS (encoding key: cccc)"
related:
- language/pasm2/modcz.yaml
- language/pasm2/modz.yaml
- language/pasm2/concepts/conditional_execution.yaml
effect_cases:
- "_NZ_AND_C with WC: C = !Z AND C"
documentation_level: comprehensive
syntax_variants:
- MODC c
last_updated: '2025-09-19T16:04:17.484069'
parameters:
- CModifer is a Modifier symbol for the designated mode to apply to the C flag.
- WC is the effect that updates the C flag.
category: Math and Logic
oneliner: Modify C and/or Z flag(s) according to modifier mode and current state(s)
