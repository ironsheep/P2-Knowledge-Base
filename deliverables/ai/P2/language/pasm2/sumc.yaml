instruction: SUMC
syntax: SUMC    D,{#}S   {WC/WZ/WCZ}
encoding:
- bits: EEEE 0011100 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: true sign of (D +/- S)
  z: Result == 0
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: '{WC/WZ/WCZ}   Sum +/-S into D by C. If C = 1 then D = D - S, else D
  = D + S. C = true sign of (D +/- S). *'
flags_affected:
  C: Set to true sign of result (D +/- S)
  Z: Set if result equals zero
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, SUMC / SUMNC, p.132"
documentation_level: enhanced
compiler_operand_format:
  name: operand_ds
  pattern: D,S/#
  description: Destination register, Source register or immediate value
  valueType: 0
compiler_encoding:
  operandFormat: 0
syntax_variants:
- SUMC D,{#}S
