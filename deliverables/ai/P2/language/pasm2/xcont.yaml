instruction: XCONT
syntax: XCONT   {#}D,{#}S
encoding:
- bits: EEEE 1100110 0LI DDDDDDDDD SSSSSSSSS
  write: —
  c: —
  z: —
  clocks: '2+'
timing:
  cycles: 2
  type: variable
description: Buffer new streamer command to be issued on final NCO rollover of current command, continuing phase.
flags_affected:
  C: No effect
  Z: No effect
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.158"
documentation_level: enhanced
syntax_variants:
- XCONT {#}D,{#}S
last_updated: '2025-09-19T16:04:17.289286'
category: Streamer
oneliner: Buffer new streamer command, continuing phase

examples:
- context: Visible lines of a 640x480 digital video driver
  code: |
    line            call    #hsync                  'do horizontal sync
                    xcont   m_rf,#0                 'do visible line
                    djnz    x,#line                 'another line?
  notes: Each line's commands are queued with XCONT behind the sync commands, so the NCO phase runs on from command to command. The whole driver is in architecture/streamer/colorspace-and-dvi.yaml (dvi.example).
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), STREAMER, Digital Video Output (DVI/HDMI), Table 22 (the visible-line loop)"

notes:
- XCONT continues the NCO phase accumulator. XCONT is useful in cases where NCO phase and frequency should be strictly maintained and streamer activity should ride along with it.
- XCONT is used to maintain seamless streamer I/O from command to command.
- Waits for the prior command's last clock cycle; if the streamer count has already run down to 0 it proceeds at once. If the prior command used count $FFFF (perpetual), it waits only for the next NCO rollover, at which point the streamer begins executing the new command.
- XCONT places its command in the streamer's single-level command buffer; the buffer is described in architecture/streamer/overview.yaml (resources_per_cog.command_buffer).
sources:
  - "notes (phase accumulator, seamless I/O, waits for the prior command's last clock cycle): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), STREAMER (the XZERO/XCONT waiting paragraph and the XCONT paragraph)"
  - "related_instructions (WAITXFI, WAITXMT): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), EVENTS (the streamer-finished and streamer-empty event flags)"

related_instructions:
- XINIT: Issue streamer command immediately, zeroing phase
- XZERO: Buffer new streamer command to be issued on final NCO rollover of current command, zeroing phase
- WAITXFI: Wait for the streamer-finished event (set whenever the streamer runs out of commands)
- WAITXMT: Wait for the streamer-empty event (set whenever the streamer is ready for a new command)

see_also:
