instruction: BITNOT
syntax: BITNOT Dest, {#}Src {WCZ}
brief_description: Bit not
category: Math and Logic
description: 'BITNOT alters the Dest bit(s) designated by Src to their inverse state. All other bits are left unchanged. Src[4:0] indicates the bit number (0-31). For a range of bits, Src[4:0] indicates the base bit number and Src[9:5] indicates how many contiguous bits beyond the base should be affected (1-31). A 9-bit literal Src is enough to express the base bit (Src[4:0]) and a range of up to 16 contiguous bits (Src[8:5]). If needed, use the augmented literal feature (##Src) to augment Src to a 10-bit literal value. When Src is a register, the register''s value bits [9:0] are used as-is, unless a prior SETQ overrides value bits[9:5] with the low five bits of the SETQ value. An ALTx between the SETQ and BITNOT keeps the override (SETQ #0, ALTB, BITNOT forces a single bit), and a SETQ separated from BITNOT by other instructions is not documented. If the WCZ effect is specified, the C and Z flags are updated to the original state of Dest''s base bit. BITNOT takes no effect or WCZ.'
result: Dest bit(s) described by Src are toggled to their opposite state(s); the rest
  are left as-is.
parameters:
- Dest is the register whose value will have one or more bits toggled.
- Src is a register, 9-bit literal, or 10-bit augmented literal whose value identifies the bit(s) to modify.
- WCZ is an optional effect to update flags.
flags_affected:
  C: With WCZ, set to original D[S[4:0]]
  Z: With WCZ, set to original D[S[4:0]]
syntax_variants:
- BITNOT Dest, {#}Src {WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 0100111 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: original D[S[4:0]]
  z: original D[S[4:0]]
  clocks: '2'
encoding_notes:
- BITNOT and TESTBN with XORC or XORZ share the INSTR field 0100111; the effect bits tell them apart (BITNOT no effect = C Z 00, WCZ = 11; TESTBN XORC = 10, XORZ = 01). BITNOT takes either no effect or WCZ.
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, BITNOT, p.53"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 49 (BITNOT: toggle bits D[S[9:5]+S[4:0]:S[4:0]]; other bits unaffected; prior SETQ overrides S[9:5]; C,Z = original D[S[4:0]]; 2 clocks; write D)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 0100111 CZI ... BITNOT D,S/# {WCZ}; the same INSTR field as TESTBN D,S/# XORC/XORZ)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, BITNOT, p.53 (Src[4:0] and Src[9:5], the 9-bit literal range of Src[8:5], ##Src, the SETQ substitution, C and Z set to the original base bit, 2 clocks)"
  - "CP-033 (BITNOT assembles as EEEE 0100111 with C Z = 00 with no effect and 11 with WCZ; TESTBN XORC/XORZ share 0100111 with C Z = 10/01)"
  - "description (prior SETQ overrides S[9:5]): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), list of changes (BITL/BITH/BITC/BITNC/BITZ/BITNZ/BITRND/BITNOT span of bits, prior SETQ overrides S[9:5])"
  - "description (SETQ #0 then ALTB then BITxxx forces Src[9:5] to 0): Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ALTB, pp.38-39; the manual's BITNOT text says a SETQ immediately preceding substitutes its Dest[4:0]; a SETQ separated by other instructions is in no source"
