description: 'Get four-channel oscilloscope samples into D. D = {ch3[7:0],ch2[7:0],ch1[7:0],ch0[7:0]}. The bytes are the lower bytes of the RDPIN values of the four pins of the block the SCOPE data pipe carries; the pipe is generic in function and may carry data other than scope samples.'
