instruction: GETBRK
syntax: GETBRK  D          WC/WZ/WCZ
encoding:
- bits: EEEE 1101011 CZ0 DDDDDDDDD 000110101
  write: D
  c: —
  z: —
  clocks: '2'
encoding_notes:
- "GETBRK uses the S-field code 000110101, the same code as COGBRK. They are separate instructions that differ in the C Z L bits of the encoding: GETBRK is written CZ0 and takes WC, WZ or WCZ, and COGBRK is written 00L and takes no effect. A GETBRK with no effect (C = 0, Z = 0) would be bit-identical to COGBRK D with a register D (L = 0), so GETBRK has no form without an effect."
timing:
  cycles: 2
  type: fixed
description: 'Get cog status / debug-break information into D according to the flag
  effect. GETBRK takes WC, WZ or WCZ; it has no form without an effect.


  The flag effect selects which information is retrieved:


  - WCZ (normal execution): C = 1 if STALLI mode / 0 if ALLOWI mode; Z = 1 if cog
  started in hubexec / 0 if cogexec. D holds cog internal status: D[31:23] = 0,
  D[22] = 1 if the colorspace converter is active, D[21] = 1 if the streamer is
  active, D[20] = 1 if WRFAST mode / 0 if RDFAST mode, D[19:16] INT3 selector
  (set by SETINT3), D[15:12] INT2 selector (set by SETINT2), D[11:08] INT1
  selector (set by SETINT1), D[07:06] INT3 state, D[05:04] INT2 state, D[03:02]
  INT1 state (each state: %0x = idle, %10 = interrupt pending, %11 = ISR
  executing), D[01] = 1 if STALLI mode / 0 if ALLOWI mode, D[00] = 1 if the cog
  started in hubexec / 0 if cogexec.

  - WCZ (during a debug ISR): additionally D[31:24] = 8-bit break code from the last
  ''BRK #/D'' executed during normal execution, and C (also reflected in D[23]) =
  1 if the debug interrupt was from a COGINIT, indicating the cog was (re)started.

  - WC: C = LSB of the SKIP/SKIPF/EXECF/XBYTE pattern. D[31:28] = 4-bit CALL depth
  since the pattern (skipping suspended if not %0000), D[27] = 1 if SKIP mode / 0 if
  SKIPF/EXECF/XBYTE mode, D[26] = 1 if LUT sharing is enabled (set by SETLUTS),
  D[25] = 1 if the top of the stack = $001FF, so XBYTE will execute on the next
  _RET_ or RET, D[24:16] = 9-bit XBYTE mode (set by ''_RET_ SETQ/SETQ2'' when the
  top of the stack = $001FF), D[15:00] = 16 event-trap flags: D[15] GETQX/GETQY
  executed without a prior CORDIC command, D[14] attention requested by cog(s),
  D[13] streamer read location $1FF of lookup RAM, D[12] streamer NCO rolled over,
  D[11] streamer finished and now idle, D[10] streamer ready to accept a new
  command, D[09] hub RAM FIFO interface loaded block count and start address,
  D[08] pin pattern match occurred, D[07] SE4 event occurred, D[06] SE3 event
  occurred, D[05] SE2 event occurred, D[04] SE1 event occurred, D[03] CT passed
  CT1, D[02] CT passed CT2, D[01] CT passed CT3, D[00] INT1, INT2 or INT3 occurred.

  - WZ: Z = 1 if no SKIP/SKIPF/EXECF/XBYTE pattern is queued (D = 0), or 0 if a pattern
  IS queued (D <> 0). D = the full 32-bit SKIP/SKIPF/EXECF/XBYTE pattern, used LSB-first
  to skip instructions in main code.

  '
flags_affected:
  note: >-
    GETBRK takes WC, WZ or WCZ; it has no form without an effect. Each effect selects
    a different result. The rows below describe the flag when its effect is specified.
  C: >-
    With WC: C = LSB of the SKIP/SKIPF/EXECF/XBYTE pattern. With WCZ: C = 1 if STALLI
    mode / 0 if ALLOWI mode; during a debug ISR, C = 1 if the debug interrupt was from
    a COGINIT. C is set only when WC or WCZ is written.
  Z: >-
    With WZ: Z = 1 when NO SKIP/SKIPF/EXECF/XBYTE pattern is queued (D = 0), and
    Z = 0 when a pattern IS queued (D <> 0). With WCZ: Z = 1 if the cog started in
    hubexec, 0 if it started in cogexec.
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 1101011 CZ0 DDDDDDDDD 000110101 GETBRK D WC/WZ/WCZ and EEEE 1101011 00L DDDDDDDDD 000110101 COGBRK D/#, used by encoding_notes); GETBRK D WCZ (C, Z), GETBRK D WC (C), GETBRK D WZ: Z = 1 if no SKIP/SKIPF/EXECF/XBYTE pattern queued (D = 0) or 0 if pattern queued (D <> 0). No form without an effect: P2 Instructions v35 - Rev B/C Silicon, rows 329 (GETBRK D WC/WZ/WCZ, EEEE 1101011 CZ0 DDDDDDDDD 000110101) and 330 (COGBRK {#}D, EEEE 1101011 00L DDDDDDDDD 000110101): with C = Z = 0 and L = 0 the two encodings are the same word; CP-041 (pnut-ts refuses getbrk x with no effect, Expected WC, WZ, or WCZ; the WC, WZ and WCZ forms are accepted)"
documentation_level: comprehensive
examples:
- name: Read Cog Internal Status
  description: Retrieve cog status with WCZ during normal execution
  code: "' During normal execution, read cog internal status\n        getbrk  status\
    \          wcz      ' C=STALLI mode, Z=hubexec start, D=cog status\n        \n\
    \        ' Test whether the streamer is currently active (D[21])\n        test \
    \   status, ##(1<<21)   wz\nif_nz   jmp     #streamer_busy\n"
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), GETBRK D WCZ"
- name: Get Debug Break Code
  description: In a debug ISR, recover the 8-bit break code from D[31:24] (WCZ)
  code: "' In a debug ISR, WCZ returns the last BRK code in D[31:24]\n        getbrk\
    \  brkinfo         wcz      ' D[31:24]=break code, C/D[23]=COGINIT (re)start\n \
    \       shr     brkinfo, #24             ' isolate the 8-bit break code\n      \
    \  \n        ' Dispatch based on the break code\n        cmp     brkinfo, #1   \
    \  wz\nif_z    jmp     #handle_trace\n        cmp     brkinfo, #2     wz\nif_z \
    \   jmp     #handle_watch\n"
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), GETBRK D WCZ (debug ISR)"
- name: Detect a Queued Skip Pattern
  description: WZ reports whether a SKIP/SKIPF/EXECF/XBYTE pattern is queued, and returns it
  code: "' WZ: Z=1 if no pattern queued (D=0), D=32-bit pattern if queued\n       \
    \ getbrk  pattern         wz       ' Z set when no pattern is pending\nif_z    jmp\
    \     #no_pattern              ' nothing queued, skip applying it\n        \n  \
    \      ' A pattern is queued; apply it LSB-first\n        skipf   pattern\n"
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), GETBRK D WZ"
- name: Read Skip/XBYTE State Flags
  description: WC returns the pattern LSB plus CALL depth, XBYTE mode, and event traps
  code: "' WC: C=pattern LSB, D[15:00]=event-trap flags, D[31:16]=skip/XBYTE state\n\
    \        getbrk  skipstate       wc       ' C=LSB of active pattern\n        \n\
    \        ' Extract 4-bit CALL depth since the pattern (D[31:28])\n        mov  \
    \   depth, skipstate\n        shr     depth, #28\n"
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), GETBRK D WC"
related_instructions:
- BRK: Trigger breakpoint with code (also configures breakpoint conditions when in Debug ISR)
- COGBRK: Trigger breakpoint in another COG
- NIXINT1/2/3: Cancel a triggered interrupt that is waiting to branch
notes:
- Different flag combinations return different data
- Within a debug ISR, WCZ returns the break code of the last BRK executed during normal execution
