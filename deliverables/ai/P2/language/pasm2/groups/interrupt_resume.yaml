group_id: interrupt_resume
title: Interrupt Resume Instructions
members:
  RESI0: Resume from interrupt 0
  RESI1: Resume from interrupt 1
  RESI2: Resume from interrupt 2
  RESI3: Resume from interrupt 3
shared_documentation:
  explanation: >-
    RESIx is a CALLD that ends the ISR like RETIx but saves the ISR's resume point,
    so that the next interrupt resumes the ISR at its next instruction. RESI3 = CALLD
    IJMP3,IRET3 WCZ; RESI2 = CALLD IJMP2,IRET2 WCZ; RESI1 = CALLD IJMP1,IRET1 WCZ;
    RESI0 = CALLD INA,INB WCZ. The CALLD with WCZ signals the cog that the interrupt
    is complete.
  source: "explanation: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), INTERRUPTS (RETIx and RESIx as CALLD); Assembly Language (instruction aliases: RESI3 = CALLD $1F0,$1F1 WCZ ... RESI0 = CALLD INA,INB WCZ)"
  timing_details: See individual instructions for specific timing.
  addressing: null
