instruction: CALLB
syntax: CALLB #{\}Addr | CALLB Dest {WC|WZ|WCZ}
brief_description: Call subroutine via PTRB
category: Branch
description: Write current C and Z flags and address of the next instruction into
  the 4-byte Hub RAM location at PTRB, increment PTRB by 4, set PC to new relative
  or absolute address, and optionally update C and/or Z to new state. R = 1 then PC
  += A, else PC = A.
parameters:
- Addr is a symbolic reference to the target subroutine; the location to set PC to.
  Relative addressing is the default; use '\' to force absolute addressing.
- Dest is a register containing the 20-bit absolute address to set PC to and optional
  new C and Z states.
- WC, WZ, or WCZ are optional effects to update the flags from Dest's upper bit states.
flags_affected:
  C: Set to D[31] if WC/WCZ specified
  Z: Set to D[30] if WZ/WCZ specified
timing:
  cycles: '5-12 (cog/LUT) / 14-32 (hub-exec)'
  type: variable
  notes: 5-12 clocks for cog/LUT execution; 14-32 clocks for hub-exec (P2 Instructions CSV v35 -- 14...32 *)
encoding:
- bits: EEEE 1101011 CZ0 DDDDDDDDD 000101111
  write: —
  c: D[31]
  z: D[30]
  clocks: '5...12 * (cog/LUT) / 14...32 * (hub-exec)'
- bits: EEEE 1101111 RAA AAAAAAAAA AAAAAAAAA
  write: —
  c: —
  z: —
  clocks: '5...12 * (cog/LUT) / 14...32 * (hub-exec)'
encoding_notes:
- Stores return context at PTRB address then increments PTRB by 4
documentation_source: PASM2 Manual 2022/11/01
documentation_level: comprehensive
compiler_operand_format:
  name: operand_call
  pattern: '#S | D'
  description: 'Call: immediate address or register'
  valueType: 19
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 19
