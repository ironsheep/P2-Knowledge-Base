instruction: SUBX
syntax: SUBX Dest, {#}Src {WC|WZ|WCZ}
brief_description: Subtract extended
category: Math and Logic
description: 'SUBX subtracts the unsigned value of Src plus C from the unsigned Dest
  and stores the result into the Dest register. The SUBX instruction is used to perform
  unsigned multi-long (extended) subtraction, such as 64-bit subtraction.

  If the WC or WCZ effect is specified, the C flag is set (1) if the subtraction results
  in an unsigned borrow, or is cleared (0) if no borrow. Use WC or WCZ on preceding
  SUB and SUBX instructions for proper final C flag. If C is set after the last SUBX
  in a multi-long subtraction, it indicates unsigned underflow.

  If the WZ or WCZ effect is specified, the Z flag is set (1) if Z was previously
  set and the result of Dest - (Src + C) is zero, or it is cleared (0) if non-zero.
  Use WZ or WCZ on preceding SUB and SUBX instructions for proper final Z flag.

  To subtract unsigned multi-long values, use SUB followed by one or more SUBX instructions.'
result: Difference of unsigned Dest and unsigned Src (plus C) is stored in Dest and
  optionally the C and Z flags are updated to the extended borrow and zero status.
parameters:
- Dest is a register containing the value to subtract Src plus C from, and is where
  the result is written.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value plus C
  is subtracted from Dest.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set if unsigned borrow occurs in D-(S+C)
  Z: Set if Z was previously set AND result equals zero
syntax_variants:
- SUBX Dest, {#}Src {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 0001101 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: borrow of (D - (S + C))
  z: Z AND (result == 0)
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, SUBX, p.132"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 15 (SUBX D,{#}S: subtract (S + C) from D, extended, D = D - (S + C), C = borrow of (D - (S + C)), Z = Z AND (result == 0); 2 clocks; write D)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Math and Logic Instructions, p.38 (SUBX D,{#}S {WC/WZ/WCZ}, 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, SUBX, p.132 (Result line, Dest, Src and effect parameters, encoding row 0001101 CZI, write D, C borrow of D-(S+C), Z Z AND (Result = 0), 2 clocks, Related list, unsigned-borrow and zero explanation, final-C and final-Z notes, multi-long note)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 0001101 CZI DDDDDDDDD SSSSSSSSS SUBX D,S/# {WC/WZ/WCZ})"
documentation_level: comprehensive
last_updated: '2025-09-19'
manual_extraction_date: '2025-01-19'
oneliner: Subtract one unsigned extended value from another
