instruction: ALLOWI
syntax: ALLOWI
brief_description: Allow interrupt branches
category: Interrupt
description: ALLOWI allows any stalled and future interrupt branches to occur; this is the default mode on cog start. ALLOWI is the complement of the STALLI instruction; critical blocks of code can be protected from interruption by beginning with STALLI and ending with ALLOWI.
result: Any stalled and future interrupt branches are allowed.
flags_affected:
  C: No effect
  Z: No effect
timing:
  cycles: 2
  type: fixed
