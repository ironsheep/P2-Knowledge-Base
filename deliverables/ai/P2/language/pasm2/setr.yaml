instruction: SETR
syntax: SETR Dest, {#}Src
brief_description: Set result
category: Math and Logic
description: >-
  SETR copies Src[8:0] to the Result field of the template, Dest, to be used with an ALTI
  instruction. Bits outside the Result field remain unaffected. The Result field does not
  exist in instruction opcodes, but takes its value from the Dest field, holding the
  address of a register for the instruction to use as its result destination upon
  execution. SETR can also be used in self-modifying Reg RAM code, though, because
  the Result field does not exist in instruction opcodes, it will instead affect
  the Instr field and the upper two bits of the FX field (bits 27:19). Unlike with ALTx instructions,
  when used this way, field value modification occurs in the program code itself (not the
  instruction pipeline); code is altered, values persist. Due to the instruction pipeline
  nature, after modifying a code register, it is necessary to elapse at least two
  instructions before executing the modified register.
result: The Result field [27:19] of template Dest is set to Src[8:0].
parameters:
- Dest is the register whose 32-bit value is a template for use with an ALTI instruction.
- Src is a register or 9-bit literal whose value (Src[8:0]) is copied to the Result
  field of Dest.
flags_affected:
  C: No effect
  Z: No effect
syntax_variants:
- SETR D,{#}S
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1001101 01I DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, SETR, p.126"
sources:
