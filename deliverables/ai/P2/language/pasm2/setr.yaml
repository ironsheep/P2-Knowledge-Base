  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Math and Logic Instructions, p.38 (SETR D,{#}S, 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, SETR, p.126 (Result line with the Result field [27:19], Dest and Src parameters, encoding row 1001101 01I, write D, C and Z none, 2 clocks, Related list, the explanation of the Result field, the ALTI template layout, the self-modifying Reg RAM use and the two spacer instructions; the Src parameter line there says the D field, where the Result line and the explanation say the Result field)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), REGISTER INDIRECTION (SETR D,S/# sets D[27:19] to S/#[8:0]; 'SETR inst,op' sets register[27:19] to op[8:0] and MOV can become AND/OR/XOR/etc.), and instruction encoding listing (EEEE 1001101 01I DDDDDDDDD SSSSSSSSS SETR D,S/#)"
