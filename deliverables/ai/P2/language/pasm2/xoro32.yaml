instruction: XORO32
syntax: XORO32  D
encoding:
- bits: EEEE 1101011 000 DDDDDDDDD 001101000
  write: D
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: |
  Iterate D with xoroshiro32+ PRNG algorithm and put PRNG result into next
  instruction's S. Fast pseudo-random number generation for PASM2 code.

algorithm:
  name: "XORO32 (xoroshiro32+)"
  operation: |
    Iterates the 32-bit state in D with the xoroshiro32+ algorithm. D receives the new state;
    the pseudo-random result replaces the S operand of the next instruction (it is also left in Q).
  properties:
    - "2-clock execution"
    - "Reproducible: the same starting state gives the same sequence"
    - "A zero state is absorbing: the result is 0 and the state stays 0 (hardware-verified)"
    - "NOT suitable for cryptography"
  source: "EF-101; Parallax Propeller 2 (P2X8C4M64P) Datasheet, Release November 1, 2022, p.38"

critical_warning:
  issue: "Seed with a non-zero value"
  description: |
    Always give XORO32 a non-zero starting state. A zero state is absorbing: with D = 0 every call
    returns 0 and D stays 0 (confirmed on real P2 silicon, for XORO32 and for the Spin2 ?? operator).
  solution: |
    ' Ensure non-zero seed
    GETRND  seed           ' Get a pseudo-random seed
    CMP     seed, #0   WZ  ' Check if zero
    IF_Z    MOV     seed, #1  ' Force non-zero (conditional)
  source: "EF-101"

examples:
  - description: "Generate random number"
    code: |
            MOV     seed, rnd_init    ' Initialize seed
            XORO32  seed              ' Generate random
            MOV     result, seed      ' result = the XORO32 result (this S operand is replaced); seed = new state

  - description: "Random number in range"
    code: |
            XORO32  seed              ' Generate 32-bit random
            MOV     temp, seed        ' temp = the XORO32 result (this S operand is replaced by it)
            SETQ    #0                ' upper half of the dividend = 0 (XORO32 leaves its result in Q)
            QDIV    temp, #100
            GETQY   temp              ' temp = remainder, 0..99

  - description: "Properly initialized PRNG"
    code: |
      GETRND  seed              ' Seed from GETRND
      CMP     seed, #0    WZ
      IF_Z    MOV     seed, #1  ' Ensure non-zero (conditional)
      ' Now safe to use XORO32
      .loop   XORO32  seed
      ' Process seed...
      JMP     #.loop

flags_affected:
  C: No effect
  Z: No effect

vs_getrnd:
  xoro32_advantages:
    - "Reproducible sequences"
    - "The state is a register you own, so the sequence does not depend on other cogs or on GETRND"
  getrnd_advantages:
    - "No state to keep and no seeding required"
    - "Draws on the cog's xoroshiro128** PRNG, seeded at boot and iterating every clock (not a true-random source)"

documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.151"
documentation_level: enhanced
compiler_operand_format:
  name: operand_d
  pattern: D
  description: Destination register only
  valueType: 24
compiler_encoding:
  operandFormat: 24
syntax_variants:
- XORO32 D
