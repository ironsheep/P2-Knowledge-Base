instruction: XORO32
syntax: XORO32  D
encoding:
- bits: EEEE 1101011 000 DDDDDDDDD 001101000
  write: D
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: |
  Iterate D with xoroshiro32+ PRNG algorithm and put PRNG result into next
  instruction's S.

algorithm:
  name: "XORO32 (xoroshiro32+)"
  operation: |
    Iterates the 32-bit state in D with the xoroshiro32+ algorithm. D receives the new state;
    the pseudo-random result replaces the S operand of the next instruction (it is also left in Q).
  properties:
    - "2-clock execution"
    - "For each of three nonzero starting states tested ($0000_0001, $DEADBEEF, $0001_0000) the same sequence of results and states is produced on every repetition"
    - "A zero state is absorbing: the result is 0 and the state stays 0"
    - "Not documented: the algorithm's constants, and how the result and the new state are computed from the old state"
  source: "EF-101 (zero-state absorption hardware-verified on real P2 silicon, for XORO32 and the Spin2 ?? operator); Parallax Propeller 2 (P2X8C4M64P) Datasheet, Release November 1, 2022, p.38"

critical_warning:
  issue: "A zero state is absorbing"
  description: |
    With D = 0 every call returns 0 and D stays 0 (for XORO32 and for the Spin2 ?? operator).
  solution: |
    ' seed from GETRND, replaced by 1 when it is 0
    GETRND  seed           ' seed = a GETRND value
    CMP     seed, #0   WZ  ' Z = 1 when seed is 0
    IF_Z    MOV     seed, #1  ' when Z is set, seed = 1
  source: "EF-101"

examples:
  - description: "Generate random number"
    code: |
            MOV     seed, rnd_init    ' seed = rnd_init
            XORO32  seed              ' iterate seed; the result goes to the next instruction's S
            MOV     result, seed      ' result = the XORO32 result (this S operand is replaced); seed = new state

  - description: "Random number in range"
    code: |
            XORO32  seed              ' iterate seed; the result goes to the next instruction's S
            MOV     temp, seed        ' temp = the XORO32 result (this S operand is replaced by it)
            SETQ    #0                ' SETQ #0 supplies the upper half of the dividend explicitly (0)
            QDIV    temp, #100
            GETQY   temp              ' temp = remainder, 0..99

  - description: "PRNG seeded from GETRND with a non-zero state"
    code: |
      GETRND  seed              ' seed = a GETRND value
      CMP     seed, #0    WZ    ' Z = 1 when seed is 0
      IF_Z    MOV     seed, #1  ' when Z is set, seed = 1
      ' seed is 1 or a non-zero GETRND value here
      .loop   XORO32  seed
      MOV     temp, seed        ' temp = the XORO32 result (this S operand is replaced); seed = new state
      ' Process temp...
      JMP     #.loop

      temp    long    0         ' (data, outside the executed path)

flags_affected:
  C: No effect
  Z: No effect

documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.151"
documentation_level: enhanced
syntax_variants:
