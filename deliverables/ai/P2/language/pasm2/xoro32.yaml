category: Math and Logic

notes:
  - "D holds the new state; the PRNG result replaces the S operand of the next instruction"
  - "CRITICAL: seed D with a non-zero value - a zero state is absorbing (the result is 0 and D stays 0)"
  - "Equivalent to the Spin2 ?? operator, which executes XORO32"
  - "GETRND is a convenient seed source"
  - "NOT suitable for cryptographic applications"

