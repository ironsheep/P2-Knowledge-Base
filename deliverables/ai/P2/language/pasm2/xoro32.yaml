notes:
  - "D holds the new state; the PRNG result replaces the S operand of the next instruction"
  - "A zero state is absorbing (the result is 0 and D stays 0)"
  - "XORO32 sets Q to the PRNG result, replacing any value an earlier SETQ left there (see language/pasm2/concepts/special_registers.yaml q_register)"
  - "Equivalent to the Spin2 ?? operator, which executes XORO32"

