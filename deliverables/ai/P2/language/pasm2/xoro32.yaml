  - "CRITICAL: D must be non-zero before first use"
  - "Period is 2^32 - 1 (never cycles through zero)"
  - "Equivalent to Spin2 ?? operator"
  - "Use GETRND to seed for best initial randomness"
  - "NOT suitable for cryptographic applications"

