instruction: WAITXMT
syntax: WAITXMT {WC|WZ|WCZ}
no_setq_behavior: "Not documented: what the WC, WZ or WCZ effect writes to C and Z when no SETQ precedes this instruction."
source: "Parallax's documents state the effect's result only for the SETQ timeout case. EF-020 measured the no-SETQ flag clear on WAITSE1 and names a 14-instruction wait family that does not include WAITXMT, so it does not cover this instruction."
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1101011 CZ0 000011010 000100100
  write: —
  c: Timeout Abort
  z: Timeout Abort
  clocks: '2+'
timing:
  cycles: 2+
  type: variable
description: >-
  WAITXMT waits for a streamer-empty event to occur (unless the event flag is already
  set), then clears the event flag (unless it's being set again by the event sensor)
  and resumes execution at the next instruction. Optionally, WAITXMT can time-out if
  the streamer-empty event doesn't occur soon enough; setting C and/or Z flags and
  then resuming execution at the next instruction. To set the optional timeout, insert
  a SETQ (with a future System Counter target value) right before WAITXMT. The WC,
  WZ, or WCZ effect reports the outcome when a SETQ timeout is specified: the C flag
  and/or Z flag is set (1) if a timeout occurred before the event, or
  is cleared (0) if the event occurred before the timeout. Without a SETQ, what the
  effect writes is not documented. During a wait, the pipeline
  is stalled; no instructions execute and no interrupts are processed in the cog until
  the wait condition ends. The streamer-empty event flag is set whenever the streamer
  is ready for a new command. The streamer-empty event flag is cleared upon execution
  of XINIT, XZERO, XCONT, POLLXMT, WAITXMT, JXMT, or JNXMT instructions.
flags_affected:
  C: "With a prior SETQ and the WC or WCZ effect, 1 if the timeout came first, otherwise 0; with no SETQ: not documented"
  Z: "With a prior SETQ and the WZ or WCZ effect, 1 if the timeout came first, otherwise 0; with no SETQ: not documented"
related:
- XINIT
- XZERO
- XCONT
- POLLXMT
- JXMT
- JNXMT
- architecture/event_system.yaml
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, WAITXMT, pp.143-144"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 297 (WAITXMT {WC/WZ/WCZ}: wait for XMT event flag, then clear it; prior SETQ sets optional CT timeout value; C/Z = timeout; 2+ clocks)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Event Instructions, p.43 (WAITXMT {WC/WZ/WCZ}, 2+ clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, WAITXMT, pp.143-144 (Result line, WC / WZ / WCZ parameter, encoding row 000011010 / 000100100, write none, C and Z Timeout Abort, 2+ clocks, Related list, wait-then-clear explanation, SETQ timeout, C and Z set if a timeout occurred before the event and cleared if the event occurred before the timeout, pipeline stalled during a wait, set condition and clearing list)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), EVENTS (WAITxxx waits for the event flag and then clears it unless it is set again by the event sensor; a SETQ right before supplies a future CT target that ends the wait prematurely, and with WAITxxx WC, C is set if the timeout occurred before the event and otherwise cleared; POLLXMT / WAITXMT event flag: cleared on XINIT / XZERO / XCONT, set whenever the streamer is ready for a new command, also cleared on POLLXMT / WAITXMT / JXMT / JNXMT), and instruction encoding listing (EEEE 1101011 CZ0 000011010 000100100 WAITXMT {WC/WZ/WCZ})"
