instruction: FLES
syntax: FLES Dest, {#}Src {WC|WZ|WCZ}
brief_description: Force lesser or equal, signed
category: Math and Logic
description: >-
  FLES sets signed Dest to signed Src if Dest is greater than Src. This is also
  known as a limit maximum function; preventing Dest from rising above Src.

  If the WC or WCZ effect is specified, the C flag is set (1) if Dest was
  limited (Dest was greater than Src and now Dest is equal to Src), or is
  cleared (0) if not limited.

  If the WZ or WCZ effect is specified, the Z flag is set (1) if the result is
  zero, or is cleared (0) if it is non-zero.
result: >-
  Signed Dest is set to signed Src if Dest was greater than Src. Optionally the
  C and Z flags indicate if the replacement happened and the zero status of the
  result.
parameters:
- Dest is a register containing the signed value to limit to a maximum of signed
  Src, and is where the result is written.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose signed
  value is the upper limit to force upon Dest.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set if limit was enforced
  Z: Set if result is zero
syntax_variants:
- FLES Dest, {#}Src {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:
- bits: EEEE 0011011 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: limit enforced
  z: Result == 0
  clocks: '2'
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_ds
  pattern: D,S/#
  description: Destination register, Source register or immediate value
  valueType: 0
compiler_encoding:
  operandFormat: 0
