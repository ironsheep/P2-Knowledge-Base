instruction: XINIT
syntax: XINIT   {#}D,{#}S
encoding:
- bits: EEEE 1100101 0LI DDDDDDDDD SSSSSSSSS
  write: —
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: Issue streamer command immediately, zeroing phase.
flags_affected:
  C: No effect
  Z: No effect
documentation_source: enhanced_from_code_study
documentation_level: comprehensive
examples:
- context: SPI Flash Programming with Smart Pin Coordination
  code: ''' Streamer + Smart Pin parallel operation for max throughput

    xinit   rmode, pa        '' Start streamer outputting 256*8 bits

    wypin   tranp, #spi_ck   '' Start 256*8*2 clock transitions

    waitxfi                  '' Wait for streamer completion


    '' Where:

    '' rmode = $8081_0800 + spi_di<<17  '' 1-pin output, bytes-msb-first, 256 bytes
    from hub

    '' tranp = 256 * 8 * 2              '' Number of clock transitions

    '
  source: "flash_loader.spin2 -- engineering/ingestion/sources/flash-loader/flash_loader.spin2:126-128"
- context: SPI Command Transmission
  code: ''' Single byte command

    xinit   bmode, pa        '' Start outputting 8 bits to spi_di

    wypin   #16, #spi_ck     '' Start 16 spi_ck transitions

    waitxfi                  '' Wait for streamer to finish


    '' Where:

    '' bmode = $4081_0008 + spi_di<<17  '' 1-pin output, bytes-msb-first, 1 byte from
    S

    '
  source: "flash_loader.spin2 -- engineering/ingestion/sources/flash-loader/flash_loader.spin2:166-168"
- context: High-Speed Data Reception
  code: ''' Receive data from SPI flash to hub

    wypin   x, #spi_ck       '' Start spi_ck transitions

    waitx   #3               '' Align spi_ck with spi_do sampling

    xinit   wmode, #0        '' Start inputting spi_do bits to hub

    waitxfi                  '' Wait for streamer to finish


    '' Where:

    '' wmode = $C081_0000 + spi_do<<17  '' 1-pin input, bytes-msb-first, to hub

    '
  source: "flash_loader.spin2 -- engineering/ingestion/sources/flash-loader/flash_loader.spin2:258-261"
patterns:
- name: Streamer-SmartPin Synchronization
  description: 'Combines streamer for data transfer with smart pin for clock generation,

    enabling parallel operation without CPU intervention.

    '
  implementation: ''' Pattern: Start both streamer and smart pin simultaneously

    xinit   mode, data       '' Start data transfer

    wypin   count, #clk_pin  '' Start clock generation

    waitxfi                  '' Wait for completion


    '' This achieves maximum throughput by offloading both

    '' data movement and clock generation to hardware.

    '
related_instructions:
- XSTOP: Stop streamer immediately
- XCONT: Continue streamer from current phase
- WAITXFI: Wait for streamer to finish
- WYPIN: Set smart pin Y parameter (clock count)
- SETXFRQ: Set streamer frequency
notes:
- XINIT zeros the phase accumulator, starting fresh
- Streamer and smart pins can work in parallel for maximum efficiency
- Mode word in D configures transfer direction, pin count, and data format
- Source in S typically contains data or hub address
- "A count of `$FFFF` selects PERPETUAL streaming: the command runs without decrementing its counter until a new command is issued or XSTOP stops it. So `$FFFF` is not the largest finite transfer — it is not a transfer at all, and a chunk chain sized to it collapses into one endless command. The largest TERMINATING count is `$FFFE`."
- "WHAT THE COUNT COUNTS, which resolves the per-mode question: D[15:0] is an initial counter value decremented on each NCO ROLLOVER, with each rollover moving new streamer data. That is the same 16-bit field and the same $FFFE terminating maximum in EVERY mode — granularity does not change the count limit. What granularity changes is how much DATA one rollover moves, so a command's capacity is (count x data-per-rollover) and the bit-granularity figure above (2047 longs) is that arithmetic for a 32-bits-per-rollover mode. For the data-per-rollover of a specific mode see architecture/streamer/modes-reference.yaml."
- "Maximum block per XINIT for bit-counted streamer modes: 2047 longs (65504 bits). The streamer's bit-count field is 16 bits, and `$FFFF` is reserved for perpetual streaming, so a terminating transfer in a bit-granularity mode must satisfy `longs * 32 <= 65534`. For larger payloads, chunk by looping with successive XINIT calls — the hub FIFO is configured once via RDFAST/WRFAST and does not need to be reissued per chunk. See pattern `large_transfer_chunking` below."

large_transfer_chunking:
  name: Large-transfer chunking
  description: |
    For streamer transfers larger than 2047 longs in bit-counted modes,
    divide and conquer by reissuing XINIT in a loop. The hub FIFO is
    already configured from a single RDFAST/WRFAST; only the streamer
    count needs to be reissued each iteration.
  implementation: |
    ' Drain `count` longs from FIFO to a streamer-paced output pin
    .block      bmask   x, #10              ' x = $7FF = 2047 longs cap
                fle     x, count            ' clamp x to min(x, remaining)
                sub     count, x
                shl     x, #5               ' convert longs to bit count
                setword mode, x, #0         ' patch into streamer mode word
                shl     x, #1               ' edges = 2 * bits for SCK pin
                wypin   x, #clk_pin         ' kick the SCK smart pin
                waitx   #3                  ' alignment pad — see language/pasm2/concepts/streamer_smartpin_control.yaml
                xinit   mode, #0            ' start streamer with patched count
                waitxfi                     ' wait for chunk to complete
                tjnz    count, #.block      ' loop until all chunks done
  source: "Parallax P2 flash_loader.spin2 lines 250-261"
