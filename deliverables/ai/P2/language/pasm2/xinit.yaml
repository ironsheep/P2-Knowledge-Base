instruction: XINIT
aliases:
- "XINIT count larger than 16 bits"
syntax: XINIT   {#}D,{#}S
encoding:
- bits: EEEE 1100101 0LI DDDDDDDDD SSSSSSSSS
  write: —
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: Issue streamer command immediately, zeroing phase.
flags_affected:
  C: No effect
  Z: No effect
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.159"
documentation_level: comprehensive
examples:
- context: SPI Flash Programming with Smart Pin Coordination
  code: ''' Program a flash page: streamer data out, smart pin clock

    xinit   rmode, pa        '' Start streamer outputting 256*8 bits

    wypin   tranp, #spi_ck   '' Start 256*8*2 clock transitions

    waitxfi                  '' Wait for streamer completion


    '' Where:

    '' rmode = $8081_0800 + spi_di<<17  '' 1-pin output, bytes-msb-first, 256 bytes
    from hub

    '' tranp = 256 * 8 * 2              '' Number of clock transitions

    '
  source: "Parallax SPI Flash Programmer and Boot Loader v51, Programmer, Program flash (.page) and Data (rmode, tranp)"
- context: SPI Command Transmission
  code: ''' Single byte command

    xinit   bmode, pa        '' Start outputting 8 bits to spi_di

    wypin   #16, #spi_ck     '' Start 16 spi_ck transitions

    waitxfi                  '' Wait for streamer to finish


    '' Where:

    '' bmode = $4081_0008 + spi_di<<17  '' 1-pin output, bytes-msb-first, 1 byte from S

    '
  source: "Parallax SPI Flash Programmer and Boot Loader v51, Programmer, SPI command, 1 byte (spi_cmd1) and Data (bmode)"
- context: Reading SPI flash data into hub RAM
  code: |
    ' Receive data from SPI flash to hub
    shl     x, #5                    ' number of bits to receive (x = number of longs)
    setword wmode, x, #0             ' insert the count into the streamer command
    shl     x, #1                    ' two spi_ck transitions per bit
    wypin   x, #spi_ck               ' Start spi_ck transitions
    waitx   #3                       ' Align spi_ck with spi_do sampling
    xinit   wmode, #0                ' Start inputting spi_do bits to hub
    waitxfi                          ' Wait for streamer to finish

    ' Where:
    ' wmode = $C081_0000 + spi_do<<17  ' 1-pin input, bytes-msb-first, to hub; D[15:0] (the bit count) is set by the SETWORD above
  source: "Parallax SPI Flash Programmer and Boot Loader v51, Loader, Read in remaining application longs (.block) and Data (wmode)"
related_instructions:
- XSTOP: "Stop streamer immediately (alias for XINIT #0,#0)"
- XCONT: Buffer new streamer command to be issued on final NCO rollover of current command, continuing phase
- XZERO: Buffer new streamer command to be issued on final NCO rollover of current command, zeroing phase
- WAITXFI: Wait for the streamer-finished event (set whenever the streamer runs out of commands)
- WYPIN: Write the smart pin Y parameter
- SETXFRQ: Set streamer NCO frequency
notes:
- "XINIT (re)starts the streamer, no matter what state it is in, and zeros the phase accumulator. 'XINIT #0,#0' always stops the streamer immediately; XSTOP (no operands) is an alias for it."
- D/#[31:16] conveys the streamer command (the mode) and D/#[15:0] the number of NCO rollovers the command is active for; the mode templates are in architecture/streamer/modes-reference.yaml
- S supplies various data, selects sub-modes, or is ignored, depending on the mode in D. Hub data moves through the hub RAM FIFO, which RDFAST or WRFAST sets up beforehand.
- "By setting the D[15:0] count to its maximal value of `$FFFF`, a streamer command runs perpetually, without decrementing its counter."
- "D[15:0] is an initial counter value decremented on each NCO rollover, with each rollover causing new streamer data to be output or input. It is the same 16-bit field in every mode. What the mode changes is how much data one rollover moves; for the data per rollover of a specific mode see architecture/streamer/modes-reference.yaml."
- "A flash-loader loop that reissues XINIT per block is in code-examples/flash-loader-case-study.yaml (large_transfer_chunking)."
- "A count above $FFFF spills into D[31:16]. With X_IMM_32X1_1DAC1 + X_PINS_ON, a count of 131,072 assembles to the word for the next pin with count 0."
- "A count of 0 stops the streamer; architecture/streamer/overview.yaml (count_field.zero) gives what stops with it."
sources:
  - "notes (XINIT restarts the streamer, XINIT #0,#0, XSTOP; D[31:16] and D[15:0]; S supplies data, selects sub-modes, or is ignored; RDFAST/WRFAST beforehand; $FFFF; the count decremented on each rollover; a count of 0): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), STREAMER"
  - "notes (a count above $FFFF spills into D[31:16]): CP-023 (assembled words)"
  - "related_instructions (WAITXFI): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), EVENTS (the streamer-finished event flag)"

