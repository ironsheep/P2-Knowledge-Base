instruction: WRPIN
syntax: WRPIN   {#}D,{#}S
encoding:
- bits: EEEE 1100000 0LI DDDDDDDDD SSSSSSSSS
  write: —
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
  in_flag_reset_latency: |
    After WRPIN executes, it takes two clocks for the smart pin's IN signal to
    drop before it can be polled again. A NOP between the WRPIN and the poll
    elapses those clocks:
      WRPIN   mode, #pin
      NOP                   ' elapses the 2 clocks for IN to drop
      TESTP   #pin WC       ' IN can now be polled again
description: "Set mode of smart pins S[10:6]+S[5:0]..S[5:0] to D, acknowledge smart\
  \ pins. \nWraps within A/B pins. A prior SETQ overrides S[10:6] with the low five\
  \ bits of the SETQ value; an ALTx between the SETQ and WRPIN keeps the override,\
  \ and a SETQ separated from WRPIN by other instructions is not documented.\n\n**Configure while DIR is low**:\
  \ a smart pin should be configured with WRPIN while its DIR bit is low (held in\
  \ reset); a WRPIN while DIR is high changes the use of the pin's state bits and\
  \ gives unpredictable behavior. To return a pin to normal mode, do WRPIN #0, pin;\
  \ on a running smart pin it resets the pin without a DIR cycle.\n\n**Multiple\
  \ cogs**: cogs that execute WRPIN, WXPIN, WYPIN, RDPIN or AKPIN on the same smart\
  \ pin must do so at different times, because the pin OR's the write-data and\
  \ acknowledgement buses of all cogs and simultaneous use clobbers the bus data.\n"
sources:
  - "description (set mode of smart pins S[10:6]+S[5:0]..S[5:0] to D, acknowledge; wraps within A/B pins; prior SETQ overrides S[10:6]; 2 clocks): P2 Instructions v35 - Rev B/C Silicon, row 217; Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), list of changes (WRPIN/WXPIN/WYPIN/AKPIN can now work on a span of pins, +S[10:6] pins; prior SETQ overrides S[10:6])"
  - "description (an ALTx between the SETQ and WRPIN keeps the override): Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ALTB, pp.38-39 (SETQ / SETQ2 does not affect ALTx instructions; the Q value passes through to the next instruction); a SETQ separated by other instructions is in no source"
  - "timing (two clocks for IN to drop; one NOP elapses them): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PINS (after WRPIN/WXPIN/WYPIN/RDPIN/AKPIN it takes two clocks for IN to drop before it can be polled again)"
  - "description (configure while DIR is low; WRPIN #0 returns a pin to normal mode; multi-cog bus rule): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PINS"
  - "description (WRPIN #0 resets a running smart pin without a DIR cycle): EF-012"
  - "usage_notes (a smart pin mode is selected while DIR is low; once configured, raising DIR starts operation): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PINS"
flags_affected:
  C: No effect
  Z: No effect
d_operand_format:
# Source: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PINS, PIN CONFIGURATION MODES
  layout: "%AAAA_BBBB_FFF_MMMMMMMMMMMMM_TT_SSSSS_0"
  fields:
    # One home per fact. All six fields, with their bit ranges and purposes, live in
    # architecture/smart_pins.yaml; the 13-bit %M..M field's internals live in
    # architecture/pin-drive-configuration.yaml.
    reference: "architecture/smart_pins.yaml (configuration_format.fields) -- all six
      fields, with bit ranges and purposes."
    sources:
      - "reference: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), PIN CONFIGURATION MODES; Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Smart I/O Pins (the WRPIN D operand format), p.23"
    m_sub_fields: "architecture/pin-drive-configuration.yaml -- the 13-bit %M..M field:
      its sub-fields with bit ranges, the drive ladder stated by encoding, and the
      DIR/OUT rule that decides when a drive setting is active."
    input_selectors: "see input_selectors below -- the AAAA/BBBB encoding, in full"
input_selectors:
# Source: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PINS (the %AAAA and %BBBB selectors); the P_PLUS1_B and P_MINUS1_B labels: Parallax Propeller 2 Spin2 Language Documentation v55, Built-In Symbols for Smart Pin Configuration. AAAA and BBBB share this encoding.
  description: |
    A smart pin's A and B inputs can each be this pin's read state, the read
    state of a pin at relative +1, +2, +3, -1, -2 or -3, or this pin's OUT bit
    from cogs, true or inverted. Predefined labels such as P_PLUS1_B and
    P_MINUS1_B select the relative pins for the B input.
  bit3_invert: "leading bit — 0xxx = true input (default), 1xxx = inverted"
  source_select:   # low 3 bits
    x000: "this pin's read state (default)"
    x001: "relative +1 pin's read state"
    x010: "relative +2 pin's read state"
    x011: "relative +3 pin's read state"
    x100: "this pin's OUT bit from cogs"
    x101: "relative -3 pin's read state"
    x110: "relative -2 pin's read state"
    x111: "relative -1 pin's read state"
critical_requirement:
  reset_before_configure: true
  description: 'A smart pin should be configured by WRPIN while DIR is low; WRPIN #0 on a running pin resets it with no DIR cycle'
  sequence:
  - 'DIRL pin       '' Reset smart pin (DIR=0) before configuring'
  - WRPIN mode, pin ' Configure smart pin mode
  consequence_of_skipping: Selecting a new mode while DIR is high gives unpredictable, useless behavior
  source: "description and consequence_of_skipping: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PINS; WRPIN #0 on a running pin: EF-012"
usage_notes:
- A smart pin mode is selected and configured with WRPIN while DIR is low
- 'WRPIN #0, pin returns the pin to normal mode (the mode is written as zero), and resets a running smart pin even with DIR high'
- Once configured, the smart pin begins operating when DIR is raised high
examples:
- description: Configure PWM output
  code: 'DIRL  #16                '' Reset smart pin (configure while DIR low)

    WRPIN ##P_PWM_TRIANGLE | P_OE, #16 '' PWM triangle, output enabled

    WXPIN ##$100_0100, #16   '' Set period and frame

    DIRH  #16                '' Enable smart pin

    WYPIN #50, #16           '' Set the output value (after enable)

    '
- description: Return a smart pin to normal mode
  code: 'DIRL  #16                '' Reset smart pin

    WRPIN #0, #16            '' Return the pin to normal mode

    '
- description: Configure multiple pins with SETQ
  code: 'SETQ  #3                 '' Span of 4 pins (16-19) for the DIRL that follows

    DIRL  #16                '' Reset all 4 pins

    SETQ  #3

    WRPIN mode, #16          '' Configure all 4 pins

    '
