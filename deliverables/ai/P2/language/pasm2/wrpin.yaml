instruction: WRPIN
syntax: WRPIN   {#}D,{#}S
encoding:
- bits: EEEE 1100000 0LI DDDDDDDDD SSSSSSSSS
  write: —
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
  in_flag_reset_latency: |
    After WRPIN executes, the Smart Pin requires 2 system-clock cycles to reset
    the IN flag to logic-0 before a program can poll the flag again.
    Insert a NOP (2 clocks, "or more") before testing the IN flag:
      WRPIN   mode, #pin
      NOP                   ' elapses the 2 clocks for IN to drop
      TESTP   #pin WC       ' NOW safe to poll IN flag
description: "Set mode of smart pins S[10:6]+S[5:0]..S[5:0] to D, acknowledge smart\
  \ pins. \nWraps within A/B pins. Prior SETQ overrides S[10:6].\n\n**Configure while DIR is low**:\
  \ a smart pin should be configured with WRPIN while its DIR bit is low (held in\
  \ reset); a WRPIN while DIR is high changes the use of the pin's state bits and\
  \ gives unpredictable behavior. Exception:\
  \ WRPIN #0 resets a running smart pin without a DIR cycle.\n"
sources:
  - "description (configure while DIR is low): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PINS"
flags_affected:
  C: No effect
  Z: No effect
d_operand_format:
# Source: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PINS, PIN CONFIGURATION MODES
  layout: "%AAAA_BBBB_FFF_MMMMMMMMMMMMM_TT_SSSSS_0"
  fields:
    # One home per fact. All six fields, with their bit ranges and purposes, live in
    # architecture/smart_pins.yaml; the 13-bit %M..M field's internals live in
    # architecture/pin-drive-configuration.yaml. Restating them here is what let three
    # of the six drift wrong.
    reference: "architecture/smart_pins.yaml (configuration_format.fields) -- all six
      fields, with bit ranges and purposes."
    sources:
      - "reference: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), PIN CONFIGURATION MODES; Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Smart I/O Pins (the WRPIN D operand format), p.23"
    m_sub_fields: "architecture/pin-drive-configuration.yaml -- the 13-bit %M..M field:
      its sub-fields with bit ranges, the drive ladder stated by encoding, and the
      DIR/OUT rule that decides when a drive setting is active."
    input_selectors: "see input_selectors below -- the AAAA/BBBB encoding, in full"
input_selectors:
# Source: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), PIN CONFIGURATION MODES. AAAA and BBBB share this encoding.
  description: |
    A smart pin's A and B inputs can be routed from a NEIGHBORING pin's read
    state, which is how SPI-style "clock from the adjacent pin" wiring works
    (the predefined P_PLUS1_B / P_MINUS1_B / ... routing labels).
  bit3_invert: "leading bit — 0xxx = true input (default), 1xxx = inverted"
  source_select:   # low 3 bits
    x000: "this pin's read state (default)"
    x001: "relative +1 pin's read state"
    x010: "relative +2 pin's read state"
    x011: "relative +3 pin's read state"
    x100: "this pin's OUT bit (driven by cogs)"
    x101: "relative -3 pin's read state"
    x110: "relative -2 pin's read state"
    x111: "relative -1 pin's read state"
critical_requirement:
  reset_before_configure: true
  description: 'A smart pin should be configured by WRPIN while DIR is low; WRPIN #0 on a running pin resets it with no DIR cycle'
  sequence:
  - 'DIRL pin       '' Reset smart pin (DIR=0) before configuring'
  - WRPIN mode, pin ' Configure smart pin mode
  - WXPIN x, pin    ' Set X parameter
  - DIRH pin       ' Enable smart pin (DIR=1)
  - WYPIN y, pin    ' Set Y parameter (AFTER enable)
  note: 'General init order is Reset -> Setup (WRPIN/WXPIN) -> Enable (DIRH) -> Operate
    (WYPIN): WYPIN comes AFTER DIRH. Required for the trigger modes %00100/%00101 and
    asynchronous serial transmit %11110 (a WYPIN issued before enable does not take
    effect). Exception: synchronous serial transmit %11100 in continuous mode needs its
    first word written with WYPIN during reset -- enabling first loses that word.'
  consequence_of_skipping: Selecting a new mode while DIR is high gives unpredictable, useless behavior
  source: "description and consequence_of_skipping: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PINS; note: EF-011 (pulse, transition, async TX) and EF-090 (sync TX %11100 continuous), Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PIN MODES (prime during reset)"
usage_notes:
- Configure with WRPIN while DIR is low (DIRL first) when selecting or changing a mode
- 'WRPIN #0, pin clears all smart pin configuration, and resets a running smart pin even with DIR high'
- Smart pin begins operation when DIR is set high after configuration
- Use AKPIN to acknowledge smart pin IN flag without reading
examples:
- description: Configure PWM output
  code: 'DIRL  #16                '' Reset smart pin (configure while DIR low)

    WRPIN ##P_PWM_TRIANGLE | P_OE, #16 '' PWM triangle, output enabled

    WXPIN ##$100_0100, #16   '' Set period and frame

    DIRH  #16                '' Enable smart pin

    WYPIN #50, #16           '' Set duty cycle (after enable)

    '
- description: Clear smart pin configuration
  code: 'DIRL  #16                '' Reset smart pin

    WRPIN #0, #16            '' Clear all configuration

    '
- description: Configure multiple pins with SETQ
  code: 'SETQ  #3                 '' Configure 4 pins (16-19)

    DIRL  #16                '' Reset all 4 pins

    SETQ  #3

    WRPIN mode, #16          '' Configure all 4 pins

    '
documentation_level: comprehensive
compiler_operand_format:
  name: operand_ls
  pattern: D/#,S/#
  description: 'Two operands: destination/immediate, source/immediate'
  valueType: 13
compiler_encoding:
  operandFormat: 13
