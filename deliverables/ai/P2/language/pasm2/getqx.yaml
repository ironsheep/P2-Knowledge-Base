instruction: GETQX
syntax: GETQX   D        {WC/WZ/WCZ}
encoding:
- bits: EEEE 1101011 CZ0 DDDDDDDDD 000011000
  write: D
  c: X[31]
  z: Result = 0
  clocks: '2...58'
timing:
  cycles: 2
  type: variable
  range: 2...58
description: >-
  Retrieve CORDIC result X into D. Waits in case result is not ready. If the WC
  effect is specified, C is set to X[31] (the sign bit). If the WZ effect is
  specified, Z is set if the result equals zero.
flags_affected:
  C: Set to X[31] (sign bit)
  Z: Set if result is zero
documentation_source: PASM2 Manual 2022-11-01
documentation_level: enhanced
compiler_operand_format:
  name: operand_d
  pattern: D
  description: Destination register only
  valueType: 24
compiler_encoding:
  operandFormat: 24
enhancement_source: PNUT_TS_v2.0_complete_operand_integration_2025-09-13
syntax_variants:
- GETQX D
last_updated: '2025-09-19T16:04:17.330972'
category: CORDIC Solver
oneliner: '{WC/WZ/WCZ} Retrieve CORDIC result X into D'
timing_notes: |
  Waits automatically if result not ready. For interrupt-sensitive code, protect
  the entire CORDIC sequence (queue through retrieval) using REP @.end, #1.
