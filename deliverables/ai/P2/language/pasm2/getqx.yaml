instruction: GETQX
syntax: GETQX   D        {WC/WZ/WCZ}
encoding:
- bits: EEEE 1101011 CZ0 DDDDDDDDD 000011000
  write: D
  c: X[31]
  z: Result == 0
  clocks: '2...58'
timing:
  cycles: 2
  type: variable
  range: 2...58
description: >-
  Retrieve CORDIC result X into D. Waits in case result is not ready. If the WC
  effect is specified, C is set to X[31]. If the WZ effect is
  specified, Z is set if the result equals zero.
flags_affected:
  C: Set to X[31]
  Z: Set if result is zero
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.158; Parallax Propeller 2 Documentation v35 Rev B/C Silicon, CORDIC Solver (Overlapping CORDIC Commands) and POLLQMT/WAITQMT event flag"
documentation_level: enhanced
syntax_variants:
- GETQX D
last_updated: '2025-09-19T16:04:17.330972'
category: CORDIC Solver
oneliner: '{WC/WZ/WCZ} Retrieve CORDIC result X into D'
timing_notes: |
  The result may not have arrived yet, in which case the instruction waits for it.
  When no CORDIC result is available or in progress, the instruction takes two
  clocks and the QMT (CORDIC empty) event flag is set. Directly after a GETQX that
  read a QMUL result, an empty GETQX returns that same X result again. Not
  documented: the value of an empty read before any result, or after a different
  CORDIC command.
read_order: "With two QMUL results queued, GETQX then GETQX returns the first result's X then the second's X, and GETQX then GETQY returns the first result's X then its Y. The other read orders are in architecture/cordic.yaml result_retrieval."
sources:
  - "P2 hardware verification, EF-115 (one board, cog execution; two QMUL results queued, GETQX then GETQX and GETQX then GETQY)"
  - "P2 hardware verification, EF-117 (one board, cog execution; GETQX with no result pending, directly after the GETQX that read a QMUL result: the last X read, 2 clocks, QMT flag set)"
related_concepts:
- language/pasm2/concepts/cordic_solver.yaml
