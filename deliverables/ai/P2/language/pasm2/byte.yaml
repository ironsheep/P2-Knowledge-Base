directive: BYTE
name: BYTE
description: 'Declare byte data in memory

  Stores 8-bit values at the current address

  '
category: Assembly Directives
documentation_level: complete
syntax: '[label] BYTE data{[count]}{, data{[count]}...}'
examples:
- code: 'zeros   byte  0[100]          '' 100 zero bytes

            byte  $FF[4], 0        '' four $FF bytes, then a zero

    '
  description: Optional repeat count after a value
- code: 'text    byte  "Hello P2", 0    '' String with terminator

            byte  $FF, $00, $55    '' Hex values

            byte  1, 2, 3, 4, 5    '' Decimal values

    '
  description: Various byte data declarations
notes:
- Each value occupies exactly 1 byte
- An optional repeat count in square brackets after a value generates that value count times
- Strings are stored as individual bytes
- No automatic alignment
- FVAR or FVARS on a BYTE line emits that one value in variable length (1 to 4 bytes)
related:
- WORD
- LONG
- RES
- language/pasm2/fvar.yaml
oneliner: Declare byte data in memory
source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), assembler directives (BYTE data{[count]}{,data{[count]}...}: generate byte data with optional repeat count); Parallax Propeller 2 Spin2 Language Documentation v55, DAT Blocks (data is packed in memory in the order declared)"
