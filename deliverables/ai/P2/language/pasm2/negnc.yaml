instruction: NEGNC
syntax: NEGNC Dest, {#}Src {WC|WZ|WCZ}
brief_description: Negate not C
category: Math and Logic
description: >-
  NEGNC negates Src (syntax 1) or Dest (syntax 2) if !C = 1 (C = 0) and stores the
  result in the Dest register. If !C = 0 (C = 1), the Src or Dest value is left as-is
  (not negated) and is stored into Dest. If the negation is performed, it flips the
  value's sign; ex: 21 becomes -21, or -1,374 becomes 1,374.
  If the WC or WCZ effect is specified, the C flag is set (1) if the result is negative,
  or is cleared (0) if positive.
  If the WZ or WCZ effect is specified, the Z flag is set (1) if the result is zero,
  or is cleared (0) if it is non-zero.
result: >-
  The Src or Dest value, possibly negated according to !C, is stored into Dest and
  optionally the C and Z flags are updated to the resulting sign and zero status.
parameters:
- Dest is a register to receive the Src or -Src value (syntax 1), or contains the
  value to negate (syntax 2) according to !C.
- Src is an optional register, 9-bit literal, or 32-bit augmented literal whose value
  (if !C=0) or negated value (if !C=1) is stored into Dest.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set if result is negative (sign bit)
  Z: Set if result equals zero
syntax_variants:
- NEGNC Dest, {#}Src {WC|WZ|WCZ}
- NEGNC Dest {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 0110101 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: Sign of result
  z: Result == 0
  clocks: '2'
- bits: EEEE 0110101 CZ0 DDDDDDDDD DDDDDDDDD
  write: D
  c: Sign of result
  z: Result == 0
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, NEGNC, pp.103-104"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, rows 67 and 68 (NEGNC D,{#}S: negate S by !C into D, if C = 0 then D = -S else D = S, C = MSB of result; NEGNC D: alias, negate D by !C, encoding EEEE 0110101 CZ0 DDDDDDDDD DDDDDDDDD; footnote * Z = (result == 0); 2 clocks; write D)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Math and Logic Instructions, p.37 (NEGNC D and NEGNC D,{#}S, 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, NEGNC, pp.103-104 (Result line, Dest and Src parameters; both encoding rows 0110101 CZI and CZ0, write D, C flag sign of result, Z flag Result = 0, 2 clocks; Related NEGC, NEGZ, NEGNZ; negation when !C = 1, value left as-is when !C = 0, example 21 becomes -21 and -1,374 becomes 1,374; C set if the result is negative; Z set if the result is zero)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 0110101 CZI DDDDDDDDD SSSSSSSSS NEGNC D,S/# {WC/WZ/WCZ}) and instruction aliases (NEGNC register = NEGNC register,register)"
documentation_level: comprehensive
