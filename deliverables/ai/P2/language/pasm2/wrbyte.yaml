instruction: WRBYTE
syntax: WRBYTE  {#}D,{#}S/P
encoding:
- bits: EEEE 1100010 0LI DDDDDDDDD SSSSSSSSS
  write: —
  c: —
  z: —
  clocks: '3...10 / 3...20'
timing:
  cycles: '3...10 (cog or LUT exec) / 3...20 (hub exec)'
  type: variable
description: 'Write byte in D[7:0] to hub address {#}S/PTRx.'
flags_affected:
  C: No effect
  Z: No effect
silicon_errata:
  after_no_wait_rdfast: "In cog execution, started fewer than 16 clocks after a no-wait RDFAST (D[31]=1), WRBYTE can complete before its write lands; if a hub read follows at once, the write is lost or that read returns the previous hub read's long instead. Workaround: use the waiting RDFAST (D[31]=0), or start this WRBYTE at least 16 clocks after the no-wait RDFAST (e.g. WAITX #12 directly after it). Full account: language/pasm2/rdfast.yaml silicon_errata."
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.155; Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), RANDOM ACCESS INTERFACE (the S/#/PTRx operand forms); EF-086 and EF-088 (no-wait RDFAST then WRBYTE at byte offsets 0 to 3, cog execution, 200 MHz, tested conditions)"
documentation_level: enhanced
syntax_variants:
- WRBYTE {#}D,{#}S/P
last_updated: '2025-09-19T16:04:17.207033'
category: Hub RAM
oneliner: Write byte to hub RAM
immediate_address_note:
  note: >-
    The S/#/PTRx operand gives the hub address in one of five forms: a register
    (address $000..$1FF) whose 20 LSBs are used as the hub address; an 8-bit immediate hub
    address (#$00..$FF); a 20-bit immediate hub address (##$00000..$FFFFF, which
    invokes AUGS); a PTR expression with a 5-bit scaled index (PTRx {[index5]});
    or a PTR expression with a 20-bit unscaled index (PTRx {[##index20]}, which
    invokes AUGS).
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), HUB, RANDOM ACCESS INTERFACE (the five ways to express a hub address in the S/#/PTRx operand)"

