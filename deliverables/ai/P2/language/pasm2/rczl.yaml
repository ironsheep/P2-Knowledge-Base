instruction: RCZL
syntax: RCZL Dest {WC|WZ|WCZ}
brief_description: Rotate carry and zero left
category: Math and Logic
description: >-
  RCZL shifts Dest's binary value left by two places and sets Dest[1] to C and Dest[0]
  to Z. If the WC or WCZ effect is specified, the C flag is updated to the original
  Dest[31] state. If the WZ or WCZ effect is specified, the Z flag is updated to the
  original Dest[30] state.
result: The bits of Dest are shifted left by two places and C and Z are inserted as
  new LSBs.
parameters:
- Dest is the register containing the value to rotate the carry and zero flags left
  into.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set to original D[31] state
  Z: Set to original D[30] state
syntax_variants:
- RCZL D {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 1101011 CZ0 DDDDDDDDD 001101011
  write: D
  c: D[31]
  z: D[30]
  clocks: '2'
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_d
  pattern: D
  description: Destination register only
  valueType: 24
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 24
