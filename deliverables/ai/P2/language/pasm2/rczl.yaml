instruction: RCZL
syntax: RCZL Dest {WC|WZ|WCZ}
brief_description: Rotate carry and zero left
category: Math and Logic
description: >-
  RCZL shifts Dest's binary value left by two places and sets Dest[1] to C and Dest[0]
  to Z. If the WC or WCZ effect is specified, the C flag is updated to the original
  Dest[31] state. If the WZ or WCZ effect is specified, the Z flag is updated to the
  original Dest[30] state.
result: The bits of Dest are shifted left by two places and C and Z are inserted as
  new LSBs.
parameters:
- Dest is the register containing the value to rotate the carry and zero flags left
  into.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set to original D[31] state
  Z: Set to original D[30] state
syntax_variants:
- RCZL D {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1101011 CZ0 DDDDDDDDD 001101011
  write: D
  c: D[31]
  z: D[30]
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, RCZL, p.117"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 392 (RCZL D {WC/WZ/WCZ}: rotate C,Z left through D, D = {D[29:0], C, Z}, C = D[31], Z = D[30]; 2 clocks; write D)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Math and Logic Instructions, p.37 (RCZL D {WC/WZ/WCZ}, 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, RCZL, p.117 (Result line, Dest parameter, encoding row 1101011 CZ0 / 001101011, write D, C D[31], Z D[30], 2 clocks; Dest shifted left by two places with Dest[1] set to C and Dest[0] set to Z; the WC rule (original Dest[31]) and the WZ rule (original Dest[30]))"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 1101011 CZ0 DDDDDDDDD 001101011 RCZL D {WC/WZ/WCZ})"
documentation_level: comprehensive
