instruction: WMLONG
syntax: WMLONG  D,{#}S/P
encoding:
- bits: EEEE 1010011 11I DDDDDDDDD SSSSSSSSS
  write: —
  c: —
  z: —
  clocks: '3...10 *'
timing:
  cycles: '3...10 (cog) / 3...20 (hub-exec)'
  type: variable
  source: "P2 Instructions v35 - Rev B/C Silicon, WMLONG row (clocks 3...10 * / 3...20 *)"
  notes: "Hub-window dependent. +1 clock if the long crosses a hub long boundary (PASM2 Manual instruction table, footnote '+1 if crosses hub long')."
description: Write only non-$00 bytes in D[31:0] to hub address {#}S/PTRx. Prior SETQ/SETQ2
  invokes cog/LUT block transfer.
flags_affected:
  C: No effect
  Z: No effect
silicon_errata:
  setq_block_ptrx_delta:
    erratum: "E1"
    description: "When used as a SETQ/SETQ2 block transfer with a PTRx expression, do NOT place an ALTx/AUGS/AUGD between the SETQ and this WMLONG -- the intervening instruction cancels the block-size PTRx delta: PTRx takes the plain expression's own step (+4 for ptra++, +12 for ptra++[3]), NOT N*4. Full detail: language/pasm2/concepts/setq_block_ops.yaml."
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), KNOWN SILICON BUGS; EF-067 (measured for RDLONG/WRLONG)"
documentation_level: enhanced
related_instructions:
- WRLONG
- WRBYTE
- WRWORD
compiler_note: pnut-ts internally uses WMLONG_ (with underscore) but this is a compiler
  naming quirk, not a separate instruction. The enum_name ac_wmlong confirms the
  canonical name is WMLONG.
last_updated: '2025-11-26'
category: Hub RAM
oneliner: Write masked long to hub RAM (non-zero bytes only)
immediate_address_note:
  note: >-
    A plain immediate source/address operand is limited to 0-255 (the 9-bit S
    field's bit 8 is the pointer/expression selector, so a literal spans only bits
    7:0). For 20-bit hub addresses this rarely matters - use a register, a
    PTRA/PTRB pointer, or the ## augmented form for the full range. This cap is
    shared across the hub-memory operand family (RDLONG WRLONG RDBYTE WRBYTE RDWORD
    WRWORD WMLONG) and is felt most with RDLUT/WRLUT, where small LUT addresses are
    written as bare literals.
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), HUB, RANDOM ACCESS INTERFACE (the S/#/PTRx operand: #%0AAAAAAAA 8-bit immediate address versus #%1SUPNNNNN PTR expression)"
related:
