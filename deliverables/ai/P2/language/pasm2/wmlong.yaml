instruction: WMLONG
syntax: WMLONG  D,{#}S/P
encoding:
- bits: EEEE 1010011 11I DDDDDDDDD SSSSSSSSS
  write: —
  c: —
  z: —
  clocks: '3...10 *'
timing:
  cycles: '3...10 (cog) / 3...20 (hub-exec)'
  type: variable
  range_source: 'encoding.clocks per P2 Instructions v35 CSV (3...10 * / 3...20 *)'
description: Write only non-$00 bytes in D[31:0] to hub address {#}S/PTRx. Prior SETQ/SETQ2
  invokes cog/LUT block transfer.
flags_affected:
  C: No effect
  Z: No effect
silicon_errata:
  setq_block_ptrx_delta: "When used as a SETQ/SETQ2 block transfer with a PTRx expression, do NOT place an ALTx/AUGS/AUGD between the SETQ and this WMLONG -- the intervening instruction cancels the block-size PTRx delta (PTRx advances by +4, NOT N*4). Full detail: language/pasm2/concepts/setq_block_ops.yaml. Source: P2 Silicon Doc v35 (KNOWN BUGS, Rev C)."
documentation_source: original
documentation_level: enhanced
related_instructions:
- WRLONG
- WRBYTE
- WRWORD
compiler_note: pnut-ts internally uses WMLONG_ (with underscore) but this is a compiler
  naming quirk, not a separate instruction. The enum_name ac_wmlong confirms the
  canonical name is WMLONG.
enhancement_source: PNUT_TS_v2.0_operand_fixes_2025-09-13
last_updated: '2025-11-26'
category: Hub RAM
oneliner: Write masked long to hub RAM (non-zero bytes only)
