instruction: WRLONG
syntax: WRLONG  {#}D,{#}S/P
encoding:
- bits: EEEE 1100011 0LI DDDDDDDDD SSSSSSSSS
  write: —
  c: —
  z: —
  clocks: '3...10*'
timing:
  cycles: "3...10 (cog or LUT exec) / 3...20 (hub exec)"
  type: variable
  source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF (clocks column and its footnote '+1 if crosses hub long'), p.155"
  notes: "+1 clock if the long crosses a hub long."
description: Write long in D[31:0] to hub address {#}S/PTRx. Prior SETQ/SETQ2 invokes
  cog/LUT block transfer.
flags_affected:
  C: No effect
  Z: No effect
notes:
- "Cog registers $1F8..$1FF are special-purpose registers which cannot be transferred to hub RAM via SETQ+WRLONG."
silicon_errata:
  setq_block_ptrx_delta:
    description: "When used as a SETQ/SETQ2 block transfer with a PTRx expression, do not place an ALTx/AUGS/AUGD between the SETQ and this WRLONG -- the intervening instruction cancels the block-size PTRx delta: PTRx takes the plain expression's own step (+4 for ptra++, +12 for ptra++[3]), not N*4; every long still transfers. Full detail: language/pasm2/concepts/setq_block_ops.yaml."
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), KNOWN SILICON BUGS; EF-067"
  after_no_wait_rdfast:
    description: "In cog execution, started fewer than 16 clocks after a no-wait RDFAST (D[31]=1), WRLONG can complete before its write lands; if a hub read follows at once, the write is lost (the hub keeps its old long) or that read returns the previous hub read's long instead. Nothing flags it. Workaround: use the waiting RDFAST (D[31]=0), or start this WRLONG at least 16 clocks after the no-wait RDFAST starts (e.g. WAITX #12 directly after it). Full account: language/pasm2/rdfast.yaml silicon_errata."
    source: "Hardware-verified on Rev C silicon, 200 MHz, cog execution: EF-084 (the lost write and the released read-back), EF-088 (the waiting form and WAITX #12 spacing protect a write and its read-back)"
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.155; Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), FAST BLOCK MOVES ($1F8..$1FF cannot be block-written to hub)"
documentation_level: enhanced
syntax_variants:
- WRLONG {#}D,{#}S/P
last_updated: '2025-09-19T16:04:17.074263'
category: Hub RAM
oneliner: Write long to hub RAM
immediate_address_note:
  note: >-
    The S/#/PTRx operand gives the hub address in one of five forms: a register
    (address $000..$1FF) whose 20 LSBs are used as the hub address; an 8-bit immediate hub
    address (#$00..$FF); a 20-bit immediate hub address (##$00000..$FFFFF, which
    invokes AUGS); a PTR expression with a 5-bit scaled index (PTRx {[index5]});
    or a PTR expression with a 20-bit unscaled index (PTRx {[##index20]}, which
    invokes AUGS). Without AUGS, bit 8 of the 9-bit S field selects a PTR expression
    (#%1SUPNNNNN) instead of an 8-bit immediate address (#%0AAAAAAAA).
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), HUB, RANDOM ACCESS INTERFACE (the five ways to express a hub address in the S/#/PTRx operand; #%0AAAAAAAA 8-bit immediate address versus #%1SUPNNNNN PTR expression)"

