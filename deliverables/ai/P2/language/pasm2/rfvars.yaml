instruction: RFVARS
syntax: RFVARS  D        {WC/WZ/WCZ}
encoding:
- bits: EEEE 1101011 CZ0 DDDDDDDDD 000010100
  write: D
  c: MSB of value
  z: Result == 0
  clocks: '2'
timing:
  cycles: 2
  type: mode_dependent
description: Used after RDFAST. Read one variable-length signed value (1 to 4 bytes)
  from the FIFO into D, sign-extended. The bytes are laid out exactly as for RFVAR; only
  the extension differs. FVARS emits this format in DAT data.
aliases:
- signed variable-length integer
- signed variable-length value from FIFO
- read FVARS data
flags_affected:
  C: Set to MSB of value, so C = 1 if the value is negative
  Z: Set if result equals zero
value_format:
  layout: Same bytes as RFVAR (see its value_format).
  sign_extension: The sign bit is the top value bit of the last byte read (bit 6, 13, 20 or 28 for a 1-, 2-, 3- or 4-byte value). It is copied into every higher bit of D.
  ranges:
  - "1 byte: -64 .. 63"
  - "2 bytes: -8_192 .. 8_191"
  - "3 bytes: -1_048_576 .. 1_048_575"
  - "4 bytes: -268_435_456 .. 268_435_455 (-$1000_0000 .. $0FFF_FFFF)"
  same_bytes_differ: "Nothing marks a stream signed or unsigned. A value whose top value bit is 1 reads differently under RFVAR and RFVARS, with no error: $40 is 64 to RFVAR and -64 to RFVARS. Pair FVAR with RFVAR and FVARS with RFVARS."
  source: "XF-019; Parallax Spin2 Interpreter v55 (2026.05.07), branch (branch displacement read with RFVARS)"
preconditions:
- Point the FIFO with RDFAST first; see rdfast for the waiting and no-wait forms.
- Not usable in hub execution, where the FIFO is busy fetching instructions. Inline ORG..END code runs in the cog and may use it; inline ORGH..END code runs in hub-exec and may not.
- Reads are sequential. To jump, issue a new RDFAST. GETPTR returns the address of the next unread byte.
interpreter_use: "The Spin2 interpreter reads branch displacements and reg[] indices with RFVARS."
sources:
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), HUB EXECUTION"
  - "XF-019"
  - "Parallax Spin2 Interpreter v55 (2026.05.07), branch, reg_ap"
examples:
- code: |
    CON
      _clkfreq = 200_000_000

    PUB main()
      coginit(COGEXEC_NEW, @sum_deltas, @deltas)

    DAT
    deltas          byte    FVARS 1000, FVARS -3, FVARS 250, FVARS -70_000, FVARS 0

    DAT             org
    sum_deltas      rdfast  #0, ptra                ' FIFO -> table (PTRA = @deltas from COGINIT)
                    mov     acc, #0
                    mov     n, #5
    .loop           rfvars  d                       ' next signed delta, 1..4 bytes
                    add     acc, d
                    djnz    n, #.loop
                    cogid   n
                    cogstop n

    acc             res     1
    n               res     1
    d               res     1
  description: "A cog sums a delta-encoded table"
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.154"
documentation_level: enhanced
compiler_operand_format:
  name: operand_d
  pattern: D
  description: Destination register only
  valueType: 24
compiler_encoding:
  operandFormat: 24
syntax_variants:
- RFVARS D
