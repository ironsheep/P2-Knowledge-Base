instruction: DRVC
syntax: DRVC    {#}D           {WCZ}
encoding:
- bits: EEEE 1101011 CZL DDDDDDDDD 001011010
  write: DIRx* + OUTx
  c: Orig OUTx base bit
  z: Orig OUTx base bit
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: >-
  DRVC sets the I/O pin(s) designated by Dest to the output direction and to a
  low/high output level according to the C flag. All other pins are left unchanged.

  Dest[5:0] indicates the pin number (0-63). For a range of pins, Dest[5:0] indicates
  the base pin number (0-63) and Dest[10:6] indicates how many contiguous pins beyond
  the base should be affected (1-31).

  A 9-bit literal Dest is enough to express the base pin (Dest[5:0]) and a range of
  up to 8 contiguous pins (Dest[8:6]). If needed, use the augmented literal feature
  (##Dest) to augment Dest to an 11-bit literal value-- this inserts an AUGD
  instruction prior.

  When Dest is a register, the register's value bits [10:0] are used as-is to form
  the 11-bit ID range. A prior SETQ overrides Dest[10:6] with the low five bits of
  the SETQ value; an ALTx between the SETQ and DRVC keeps the override, and a SETQ
  separated from DRVC by other instructions is not documented.

  The range calculation (from Dest[5:0] up to Dest[5:0]+Dest[10:6]) will wrap within
  the same 32-pin group (DIRA or DIRB and OUTA or OUTB); it will not cross the port
  boundary.

  DRVC achieves the same effect as two instructions-- OUTC followed by DIRH.

  If the WCZ effect is specified, the C and Z flags are set to the original
  (pre-instruction) state of the base pin's OUT bit (OUTA / OUTB), identified by Dest.
result: >-
  The I/O pins described by Dest are set to the output direction and to an output
  level of low/high according to C; the rest are left as-is.
flags_affected:
  C: Set to the original (pre-instruction) state of the base pin's OUT bit
  Z: Set to the original (pre-instruction) state of the base pin's OUT bit
encoding_notes:
- New DIRx state is not data-forwarded; the next pipelined instruction sees the old
  state.
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, DRVC / DRVNC, p.75"
sources:
  - "description (OUT bits of pins D[10:6]+D[5:0]..D[5:0] = C, DIR bits = 1; wraps within OUTA/OUTB; prior SETQ overrides D[10:6]; C,Z = OUT bit; write DIRx* + OUTx; 2 clocks): P2 Instructions v35 - Rev B/C Silicon, row 375; Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), list of changes (DIRx/OUTx/FLTx/DRVx can now work on a span of pins, +D[10:6] pins; prior SETQ overrides D[10:6])"
  - "description (Dest[5:0], Dest[10:6], the 9-bit literal range of Dest[8:6], ##Dest and AUGD, the register value bits [10:0], the wrap within DIRA or DIRB and OUTA or OUTB, OUTC followed by DIRH) and encoding_notes (footnote 1): Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, DRVC / DRVNC, p.75"
  - "description (an ALTx between the SETQ and DRVC keeps the override): Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ALTB, pp.38-39 (SETQ / SETQ2 does not affect ALTx instructions; the Q value passes through to the next instruction); a SETQ separated by other instructions is in no source"
documentation_level: comprehensive
syntax_variants:
- DRVC {#}D
last_updated: '2025-09-19T16:04:17.436314'
parameters:
- Dest is the register, 9-bit literal, or 11-bit augmented literal whose value identifies
  the I/O pin(s) to set to output direction and output levels of C.
- WCZ is an optional effect to update flags.
category: Pin
oneliner: Set pin(s) direction to output and output level to C
