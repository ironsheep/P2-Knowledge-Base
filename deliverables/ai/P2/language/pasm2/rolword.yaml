instruction: ROLWORD
syntax: 'ROLWORD Dest, {#}Src, #Num'
brief_description: Rotate left word
category: Math and Logic
description: >-
  ROLWORD reads the word identified by Num (0-1) from Src, or a word from the source
  described by a prior ALTGW instruction, and rotates it left into Dest. ROLWORD achieves
  the same effect as two instructions: a 16-bit SHL followed by SETWORD into word 0.
  Num (0-1) identifies a value's individual words, by position, in least-significant
  word order. Syntax 2 is intended for use after an ALTGW instruction, i.e. in a loop to
  iteratively read a series of word values within contiguous long registers. ROLWORD
  Dest is the same as ROLWORD Dest,0,#0, with the S field and the N field filled in
  by the prior ALTGW.
result: >-
  Word Num (0-1) of Src, or a word from a source described by prior ALTGW instruction,
  is rotated left into Dest.
parameters:
- Dest is the register in which to rotate the word into.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value contains
  the target word to read.
- Num is a 1-bit literal identifying the word ID (0-1) of Src to read.
flags_affected:
  C: No effect
  Z: No effect
syntax_variants:
- 'ROLWORD Dest, {#}Src, #Num'
- ROLWORD Dest
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1001010 0NI DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2'
- bits: EEEE 1001010 000 DDDDDDDDD 000000000
  write: D
  c: —
  z: —
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ROLWORD, p.121"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, rows 100-101 (ROLWORD D,{#}S,#N: rotate-left word N of S into D, D = {D[15:0], S.WORD[N]}; ROLWORD D: rotate-left word established by prior ALTGW instruction into D; 2 clocks; write D) and rows 112-113 (ALTGW: next S field and N field = D[0] for the subsequent GETWORD/ROLWORD)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Math and Logic Instructions, p.37 (ROLWORD D and ROLWORD D,{#}S,#N, 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ROLWORD, p.121 (Result line, Dest, Src and Num parameters, both encoding rows 1001010 0NI / 1001010 000, write D, C and Z none, 2 clocks, Related list, the SHL-then-SETWORD equivalence, Num 0-1 in least-significant word order, syntax 2 after ALTGW)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), REGISTER INDIRECTION (ALTGW sets the next S field to base+index[9:1] and the next N to index[0]; 'ROLWORD D' = 'ROLWORD D,0,#0'; two of the three fields of the associated instruction are filled in by the ALTxx instruction), and instruction encoding listing (EEEE 1001010 0NI DDDDDDDDD SSSSSSSSS ROLWORD D,S/#,#N)"
