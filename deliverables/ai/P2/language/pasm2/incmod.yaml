instruction: INCMOD
syntax: INCMOD Dest, {#}Src {WC|WZ|WCZ}
brief_description: Increment with modulus
category: Math and Logic
description: 'Increment with modulus. If Dest equals Src, Dest is set to 0 and C is set;
  otherwise Dest is incremented by 1 and C is cleared.

  INCMOD compares Dest with Src - if not equal, it increments Dest; otherwise it sets
  Dest equal to 0. If Dest begins in the range 0 to Src, iterations of INCMOD will
  increment Dest repetitively from 0 to Src.

  If the WC or WCZ effect is specified, the C flag is set (1) if Dest was equal to
  Src and subsequently reset to 0; or is cleared (0) if not reset.

  If the WZ or WCZ effect is specified, the Z flag is set (1) if the result is zero,
  or is cleared (0) if it is non-zero.

  INCMOD does not limit Dest within the specified range - if Dest begins as greater
  than Src, iterations of INCMOD will continue to increment it through the 32-bit
  rollover point (back to 0) before it will effectively cycle from 0 to Src.'
result: If Dest was not equal to Src, it is incremented by 1; otherwise Dest is reset to 0.
parameters:
- Dest is a register containing the value to increment up to Src with modulus, and
  is where the result is written.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value is the
  modulus limit to apply to Dest's increment operation.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Modulus triggered (Dest was equal to Src and reset to 0)
  Z: Result = 0
syntax_variants:
- INCMOD Dest, {#}Src {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:
- bits: EEEE 0111000 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: 1, else D = D + 1 and C = 0
  z: Result == 0
  clocks: '2'
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
examples:
- name: Round-Robin Counter
  description: Circular counter for resource scheduling
  code: "' Round-robin through 8 ports (0-7)\nmain_loop\n        ' Service current\
    \ port\n        ' ... port service code ...\n        \n        ' Move to next\
    \ port\n        incmod  portctr, portnum    wc\nif_nc   jmp     #main_loop   \
    \       ' Continue if not wrapped\n        \n        ' We've serviced all ports,\
    \ restart\n        jmp     #main_loop\n        \nportctr res     1           \
    \        ' Current port (0-7)\nportnum long    7                   ' Maximum port\
    \ number\n"
  source: P2-OctoSerial
- name: Circular Buffer Index
  description: Increment buffer index with wrap-around
  code: "' Increment tail index with modulo for circular buffer\n'' Note: buffer size\
    \ must be (modulus + 1)\nincmod  tail_idx, #BUF_SIZE-1\n\n'' Check if buffer is\
    \ full (tail caught up to head)\ncmp     tail_idx, head_idx      wz\nif_z    jmp\
    \     #buffer_full\n\n'' Safe to add data at tail\nadd     buffer_ptr, tail_idx\n\
    wrbyte  new_data, buffer_ptr\n"
  source: P2-OctoSerial
- name: Multi-Resource Iterator
  description: Iterate through active resources only
  code: "' Service only active ports\n.next_port\n        alts    portctr, #port_active\n\
    \        mov     is_active, 0-0      ' Get active flag\n        \n        tjz\
    \     is_active, #.skip   ' Skip if inactive\n        call    #service_port  \
    \     ' Service this port\n        \n.skip   incmod  portctr, #7         wc\n\
    if_nc   jmp     #.next_port         ' Continue loop\n        \n        ' All ports\
    \ checked\n        ret\n"
  source: P2-OctoSerial
notes:
- C flag indicates wrap-around (modulus reached)
- Perfect for round-robin scheduling
- Essential for circular buffer management
- More efficient than manual compare and reset
related:
- DECMOD
