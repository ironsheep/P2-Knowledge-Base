instruction: DRVL
syntax: DRVL    {#}D           {WCZ}
category: Pin
timing:
  cycles: 2
  type: fixed
  pin_output_latency: |
    After the instruction, it takes three additional clocks before the pin starts transitioning to the new state.
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), I/O PIN TIMING: \"When a DIRx/OUTx bit is changed by any instruction, it takes THREE additional clocks after the instruction before the pin starts transitioning to the new state.\" Corroborated by Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, I/O Pin Timing, p.42"
description: >-
  DRVL sets the I/O pin(s) designated by Dest to the output direction and to a
  low output level. All other pins are left unchanged.

  Dest[5:0] indicates the pin number (0-63). For a range of pins, Dest[5:0] indicates
  the base pin number (0-63) and Dest[10:6] indicates how many contiguous pins beyond
  the base should be affected (1-31).

  A 9-bit literal Dest is enough to express the base pin (Dest[5:0]) and a range of
  up to 8 contiguous pins (Dest[8:6]). If needed, use the augmented literal feature
  (##Dest) to augment Dest to an 11-bit literal value-- this inserts an AUGD
  instruction prior.

  When Dest is a register, the register's value bits [10:0] are used as-is to form
  the 11-bit ID range. A prior SETQ overrides Dest[10:6] with the low five bits of
  the SETQ value; an ALTx between the SETQ and DRVL keeps the override, and a SETQ
  separated from DRVL by other instructions is not documented.

  The range calculation (from Dest[5:0] up to Dest[5:0]+Dest[10:6]) will wrap within
  the same 32-pin group (DIRA or DIRB and OUTA or OUTB); it will not cross the port
  boundary.

  DRVL achieves the same effect as two instructions-- OUTL followed by DIRH.

  If the WCZ effect is specified, the C and Z flags are set to the original
  (pre-instruction) state of the base pin's OUT bit (OUTA / OUTB), identified by Dest.
result: >-
  The I/O pins described by Dest are set to the output direction and to an output
  level of low; the rest are left as-is.
parameters:
- Dest is the register, 9-bit literal, or 11-bit augmented literal whose value identifies
  the I/O pin(s) to set to output direction and an output level of low.
- WCZ is an optional effect to update flags.
flags_affected:
  C: Set to the original (pre-instruction) state of the base pin's OUT bit
  Z: Set to the original (pre-instruction) state of the base pin's OUT bit
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1101011 CZL DDDDDDDDD 001011000
  write: DIRx* + OUTx
  c: Orig OUTx base bit
  z: Orig OUTx base bit
  clocks: '2'
encoding_notes:
- New DIRx state is not data-forwarded; the next pipelined instruction sees the old
  state.
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, DRVH / DRVL, p.76"
sources:
  - "description (a prior SETQ overrides D[10:6]): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), list of changes (DIRx/OUTx/FLTx/DRVx can now work on a span of pins, +D[10:6] pins; prior SETQ overrides D[10:6])"
  - "description (an ALTx between the SETQ and DRVL keeps the override): Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ALTB, pp.38-39 (SETQ / SETQ2 does not affect ALTx instructions; the Q value passes through to the next instruction); a SETQ separated by other instructions is in no source"
  - "P2 Instructions v35 - Rev B/C Silicon, row 373 (DRVL {#}D {WCZ}: OUT bits of pins D[10:6]+D[5:0]..D[5:0] = 0, DIR bits = 1; wraps within OUTA/OUTB; prior SETQ overrides D[10:6]; C,Z = OUT bit; write DIRx* + OUTx; 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, DRVH / DRVL, p.76 (encoding table and footnote 1; Dest[5:0], Dest[10:6], the 9-bit literal range of Dest[8:6], ##Dest, the SETQ substitution, the wrap within DIRA or DIRB and OUTA or OUTB, C and Z set to the original OUTx base bit, OUTL followed by DIRH, 2 clocks)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Pin instructions, p.39 (DRVL {#}D {WCZ}, 2 clocks)"
