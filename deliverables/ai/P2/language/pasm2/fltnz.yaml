instruction: FLTNZ
syntax: FLTNZ   {#}D           {WCZ}
category: Pin
description: >-
  FLTNZ sets the I/O pin(s) designated by Dest to the input direction (floating)
  and to a low/high output level according to the inverse of the Z flag (!Z). All
  other pins are left unchanged. This pre-sets the output register so that when the
  pin is later driven as output, it will immediately be at the desired level.

  Dest[5:0] indicates the pin number (0-63). For a range of pins, Dest[5:0] indicates
  the base pin number (0-63) and Dest[10:6] indicates how many contiguous pins beyond
  the base should be affected (1-31).

  A 9-bit literal Dest is enough to express the base pin (Dest[5:0]) and a range of
  up to 8 contiguous pins (Dest[8:6]). If needed, use the augmented literal feature
  (##Dest) to augment Dest to an 11-bit literal value-- this inserts an AUGD
  instruction prior.

  The range calculation (from Dest[5:0] up to Dest[5:0]+Dest[10:6]) will wrap within
  the same 32-pin group; it will not cross the port boundary.
result: >-
  The I/O pins described by Dest are set to the input direction and to an output
  level of low/high according to !Z; the rest are left as-is.
parameters:
- Dest is the register, 9-bit literal, or 11-bit augmented literal whose value identifies
  the I/O pin(s) to set to input direction and output levels of low or high.
- WCZ is an optional effect to update flags.
flags_affected:
  C: Set to OUT bit state
  Z: Set to OUT bit state
timing:
  cycles: 2
  type: fixed
encoding:
- bits: EEEE 1101011 CZL DDDDDDDDD 001010101
  write: DIRx* + OUTx
  c: OUT bit
  z: OUT bit
  clocks: '2'
encoding_notes:
- New DIRx state is not data-forwarded; the next pipelined instruction sees the old state.
documentation_source: PASM2 Manual 2022/11/01
documentation_level: comprehensive
compiler_operand_format:
  name: operand_pinop
  pattern: D/#0..511 {WC/WZ}
  description: 'Pin operation: destination/immediate pin number 0-511, optional effect
    flags'
  valueType: 30
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 30
