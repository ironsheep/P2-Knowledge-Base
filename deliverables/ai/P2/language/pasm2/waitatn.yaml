instruction: WAITATN
syntax: WAITATN {WC|WZ|WCZ}
no_setq_behavior: "With no preceding SETQ, no timeout is armed, so the event always satisfies the wait first: the effect then clears the flag it names (WC: C, WZ: Z, WCZ: both C and Z; each carries the same timeout result). Using this instruction with WCZ and no SETQ therefore clears C and Z in one instruction; the instruction still waits for its event (and clears the event flag), so C and Z are cleared once the event has occurred."
source: "EF-020 (the no-SETQ flag clear, run on WAITSEx; same mechanism here, not run on this instruction)"
brief_description: Wait attention
category: Event
description: >-
  WAITATN waits for an attention event to occur (unless the event flag is already set),
  then clears the event flag (unless it's being set again by the event sensor) and
  resumes execution at the next instruction. Optionally, WAITATN can time-out if the
  attention event doesn't occur soon enough; setting C and/or Z flags and then resuming
  execution at the next instruction. To set the optional timeout, insert a SETQ (with
  a future System Counter target value) right before WAITATN. The WC, WZ, or WCZ effect
  reports the outcome when a SETQ timeout is specified: the C flag
  and/or Z flag is set (1) if a timeout occurred before the event, or is cleared (0)
  if the event occurred before the timeout. Without a SETQ no timeout is armed and
  the effect clears the named flags. During a wait, the pipeline is stalled;
  no instructions execute and no interrupts are processed in the cog until the wait
  condition ends. The attention event flag is set whenever a cog issues an
  attention request for this cog; a COGATN that names this cog's own bit also sets it.
  The attention event flag is cleared upon cog start,
  or execution of POLLATN, WAITATN, JATN, or JNATN instructions.
result: Waits for the attention event, clears the flag, and resumes. With a prior SETQ and the WC, WZ or WCZ effect, C and/or Z are set if the timeout occurred before the event.
parameters:
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: "With a prior SETQ and the WC or WCZ effect, 1 if the timeout came first, otherwise 0; with no SETQ the effect clears the flag"
  Z: "With a prior SETQ and the WZ or WCZ effect, 1 if the timeout came first, otherwise 0; with no SETQ the effect clears the flag"
syntax_variants:
- WAITATN {WC|WZ|WCZ}
timing:
  cycles: 2+
  type: variable
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1101011 CZ0 000011110 000100100
  write: —
  c: Timeout Abort
  z: Timeout Abort
  clocks: 2+
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, WAITATN, p.139"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 301 (WAITATN {WC/WZ/WCZ}: wait for ATN event flag, then clear it; prior SETQ sets optional CT timeout value; C/Z = timeout; 2+ clocks)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Event Instructions, p.43 (WAITATN {WC/WZ/WCZ}, 2+ clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, WAITATN, p.139 (Result line, WC / WZ / WCZ parameter, encoding row 000011110 / 000100100, write none, C and Z Timeout Abort, 2+ clocks, Related list, wait-then-clear explanation, SETQ timeout, C and Z set if a timeout occurred before the event and cleared if the event occurred before the timeout, pipeline stalled during a wait, clearing list)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), COG ATTENTION (COGATN strobes cause an attention event for POLLATN / WAITATN and interrupt use), EVENTS (WAITxxx waits for the event flag and then clears it unless it is set again by the event sensor; a SETQ right before supplies a future CT target that ends the wait prematurely, and with WAITxxx WC, C is set if the timeout occurred before the event and otherwise cleared; POLLATN / WAITATN event flag: cleared on cog start, set whenever any cogs request attention, also cleared on POLLATN / WAITATN / JATN / JNATN), and instruction encoding listing (EEEE 1101011 CZ0 000011110 000100100 WAITATN {WC/WZ/WCZ})"
  - "EF-099 (COGATN with the issuing cog's own bit raises that cog's attention event; detectors POLLATN WC, JATN, SETQ plus WAITATN WC, Spin2 POLLATN())"
  - "EF-020 (SETQ plus WAITSEx releases on whichever of event and timeout comes first and reports it in C, and with no SETQ a WCZ wait clears C and Z; the ledger states the mechanism is shared by the wait family)"
