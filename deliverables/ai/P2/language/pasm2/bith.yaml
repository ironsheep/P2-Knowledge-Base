instruction: BITH
syntax: BITH    D,{#}S         {WCZ}
encoding:
- bits: EEEE 0100001 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: original D[S[4:0]]
  z: original D[S[4:0]]
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: >-
  BITH sets the Dest bit(s) designated by Src to high (1). All other bits are left
  unchanged. Z is set to the original state of the target bit before modification.
flags_affected:
  C: Set to original D[S[4:0]]
  Z: Set to original D[S[4:0]]
documentation_source: PASM2 Manual 2022/11/01
documentation_level: comprehensive
compiler_operand_format:
  name: operand_bitx
  pattern: D,S/#
  description: 'Bit manipulation with optional effect flags: Destination register,
    bit position'
  valueType: 1
compiler_encoding:
  operandFormat: 1
enhancement_source: PNUT_TS_v2.0_complete_operand_integration_2025-09-13
parameters:
- Dest is the register whose value will have one or more bits set high or low.
- Src is a register, 9-bit literal, or 10-bit augmented literal whose value identifies
  the bit(s) to modify.
