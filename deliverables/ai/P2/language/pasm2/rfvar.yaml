instruction: RFVAR
syntax: RFVAR   D        {WC/WZ/WCZ}
encoding:
- bits: EEEE 1101011 CZ0 DDDDDDDDD 000010011
  write: D
  c: 0
  z: Result == 0
  clocks: '2'
timing:
  cycles: 2
  type: mode_dependent
description: Used after RDFAST. Read one variable-length unsigned value (1 to 4 bytes,
  up to 29 bits) from the FIFO into D, zero-extended. The FIFO pointer advances by
  the bytes the value occupied, so mixed-length values can be read back-to-back. FVAR
  emits this format in DAT data.
aliases:
- variable-length integer
- variable-length value from FIFO
- continuation bit encoding
- read FVAR data
flags_affected:
  C: Always cleared to 0
  Z: Set if result equals zero
value_format:
  rule: Bytes run least-significant group first. In bytes 1 to 3, bit 7 = 1 means another
    byte follows and 0 ends the value; bits 6..0 carry 7 value bits. A 4th byte is always
    the last and carries all 8 bits.
  lengths:
  - "1 byte: 0vvvvvvv (bits 6..0); 7 value bits"
  - "2 bytes: 1vvvvvvv (6..0), 0vvvvvvv (13..7); 14 value bits"
  - "3 bytes: 1vvvvvvv (6..0), 1vvvvvvv (13..7), 0vvvvvvv (20..14); 21 value bits"
  - "4 bytes: 1vvvvvvv (6..0), 1vvvvvvv (13..7), 1vvvvvvv (20..14), vvvvvvvv (28..21); 29 value bits; the result ranges 0 .. $1FFF_FFFF"
  source: "XF-019; Parallax Spin2 Interpreter v55 (2026.05.07), hub_ap (hub-variable offsets read with RFVAR)"
preconditions:
- Used after RDFAST, which points the FIFO.
- Not usable in hub execution, where the FIFO is busy fetching instructions. Inline ORG..END code runs in the cog and may use it; inline ORGH..END code runs in hub-exec and may not.
- Reads are sequential. A new RDFAST moves the read position. GETPTR returns the hub address of the next unread byte.
- RFVAR reads from the same FIFO byte stream as the fixed-width FIFO reads, so a record can mix them.
interpreter_use: "Spin2 bytecode operands read with RFVAR: hub-variable offsets, object and method indices, local-long counts, ++/-- step sizes, bitfield specs, stack pops and struct offsets."
sources:
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), HUB EXECUTION, p.12, and the RFVAR and RFVARS byte table, p.64"
  - "XF-019"
  - "GETPTR: P2 Instructions v35 - Rev B/C Silicon, row 328 (GETPTR D: get current FIFO hub pointer into D); Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), LUT EXECF, the bytecode-loop example ('rfbyte pa' then 'getptr pb', commented 'get next bytecode address into pb')"
  - "Parallax Propeller 2 Spin2 Language Documentation v55, DAT Blocks (FVAR / FVARS overrides can be read via RFVAR / RFVARS); Parallax Propeller 2 Spin2 Language Documentation v55, Inline Assembly Code (ORGH inline code executes from hub RAM; hub-exec limitations apply, no RDFAST, XINIT, etc.); CP-030 (##@hubsym assembles to the object offset)"
  - "Parallax Spin2 Interpreter v55 (2026.05.07), resume (RDFAST restarts the bytecode stream after inline code returns); hub_ap, callobj, callsub, callgo, set_incr, bit_rfvar, popx, hub_sv"
  - "Parallax Propeller 2 Spin2 Language Documentation v55, DAT Blocks (hub addresses are relative to the start of the object)"
examples:
- code: |
    PUB read_lengths() : first, second | p
      p := @lengths                         ' Spin2 @ gives the absolute hub address
      org
                    rdfast  #0, p           ' point FIFO at the table (waiting form)
                    rfvar   first           ' 300
                    rfvar   second          ' 70_000
      end

    DAT
    lengths         byte    FVAR 300, FVAR 70_000
  description: "Inline PASM. The table's absolute hub address is taken in Spin2 and passed in a local; in a Spin2 object ##@lengths assembles to the label's offset within the object, not its hub address."
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.154"
documentation_level: enhanced
syntax_variants:
- RFVAR D
