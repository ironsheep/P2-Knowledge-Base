instruction: POLLINT
syntax: POLLINT {WC|WZ|WCZ}
brief_description: Poll interrupt
category: Event
description: >-
  POLLINT copies the state of the interrupt-occurred event flag into C and/or Z and
  then clears the flag (unless it's being set again by the event sensor).
  If the WC, WZ, or WCZ effect is specified, the C flag and/or Z flag is updated to
  the state of the interrupt-occurred event flag prior to clearing it.
  The interrupt-occurred event flag is set whenever interrupt 1, 2, or 3 occurs--
  debug interrupts are ignored. The flag is cleared upon cog start, or execution of
  POLLINT, WAITINT, JINT, or JNINT instructions.
result: Interrupt-occurred event flag is optionally copied into C and/or Z, then it
  is cleared.
flags_affected:
  C: Set to INT event flag state
  Z: Set to INT event flag state
parameters:
- WC, WZ, or WCZ are optional effects to update flags.
syntax_variants:
- POLLINT {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1101011 CZ0 000000000 000100100
  write: —
  c: INT Event
  z: INT Event
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, POLLINT, pp.112-113"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 271 (POLLINT {WC/WZ/WCZ}: get INT event flag into C/Z, then clear it; 2 clocks)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Event instructions, p.43 (POLLINT {WC/WZ/WCZ}, 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, POLLINT, pp.112-113 (Result line, WC / WZ / WCZ parameter, encoding row 000000000 / 000100100, write none, C and Z INT Event, 2 clocks, Related list, the copy-then-clear explanation on p.112; the set condition (interrupt 1, 2 or 3, debug interrupts ignored) and the clearing list on p.113)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), EVENTS (the POLLxxx instructions simultaneously return their event-occurred flag into C and/or Z and clear it unless it is set again by the event sensor; POLLINT event flag: cleared on cog start, set whenever interrupt 1, 2, or 3 occurs (debug interrupts are ignored), also cleared on POLLINT / WAITINT / JINT / JNINT), instruction encoding listing (EEEE 1101011 CZ0 000000000 000100100 POLLINT {WC/WZ/WCZ})"
