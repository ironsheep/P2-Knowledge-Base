instruction: TJNZ
syntax: TJNZ    D,{#}S
category: Branch
description: Dest is tested and if it's NOT zero, PC is set
  to a new relative (#Src) or absolute (Src) address.
flags_affected:
  C: No effect
  Z: No effect
parameters:
- Dest is a register whose value is tested for zero or not zero.
- 'Src is a register, 9-bit literal, or 20-bit augmented literal whose value is the
  absolute or relative address to set PC to. Use # for relative addressing; omit #
  for absolute addressing.'
timing:
  cycles: 2
  type: variable
  range: 13...20
encoding:
- bits: EEEE 1011100 11I DDDDDDDDD SSSSSSSSS
  write: —
  c: —
  z: —
  clocks: '2 or 4 / 2 or 13-20'
encoding_notes:
- PC is written only when Dest is NOT zero.
documentation_source: PASM2 Manual 2022/11/01
documentation_level: comprehensive
compiler_operand_format:
  name: operand_dsj
  pattern: D,S/@
  description: 'Jump with destination and relative address: register, relative address'
  valueType: 12
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 12
enhancement_source: PNUT_TS_v2.0_complete_operand_integration_2025-09-13
last_updated: '2025-09-19T16:04:16.894690'
oneliner: Test value and jump if zero or not zero
