instruction: MOV
syntax: MOV Dest, {#}Src {WC|WZ|WCZ}
brief_description: Move
category: Math and Logic
description: >-
  MOV stores the Src value into Dest.
  If the WC or WCZ effect is specified, the C flag is updated to be Src[31].
  If the WZ or WCZ effect is specified, the Z flag is set (1) if the Dest result equals
  zero, or is cleared (0) if it is non-zero.
result: >-
  The Src value is stored in Dest and optionally flags are updated with the sign bit
  and zero status.
parameters:
- Dest is the register to receive the Src value.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value will be
  stored into Dest.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set to S[31] (sign bit of source)
  Z: Set if result equals zero
syntax_variants:
- MOV Dest, {#}Src {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 0110000 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: S[31]
  z: Result == 0
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, MOV, p.99"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 58 (MOV D,{#}S {WC/WZ/WCZ}: move S into D, D = S, C = S[31]; footnote * Z = (result == 0); 2 clocks; write D)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Math and Logic Instructions, p.37 (MOV D,{#}S {WC/WZ/WCZ}, 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, MOV, p.99 (Result line, Dest and Src parameters with the 32-bit augmented literal, encoding row 0110000 CZI, write D, C flag S[31], Z flag Result = 0, 2 clocks; C updated to Src[31] with WC or WCZ; Z set if the Dest result equals zero with WZ or WCZ)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 0110000 CZI DDDDDDDDD SSSSSSSSS MOV D,S/# {WC/WZ/WCZ})"
documentation_level: comprehensive
last_updated: '2025-09-19'
manual_extraction_date: '2025-01-19'
oneliner: Set a value into a register
