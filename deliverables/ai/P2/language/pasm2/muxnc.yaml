instruction: MUXNC
syntax: MUXNC   D,{#}S   {WC/WZ/WCZ}
category: Math and Logic
description: >-
  Mux !C into each D bit that is '1' in S. D = (!S & D) | (S & {32{!C}}).
  Each bit position in D where S has a '1' is replaced with the inverted C flag value;
  all other Dest bits are left unchanged.
  If the WC or WCZ effect is specified, the C flag is set (1) if the number of high
  (1) bits in the result is odd, or is cleared (0) if it is even.
  If the WZ or WCZ effect is specified, the Z flag is set (1) if the result is zero,
  or is cleared (0) if it is not zero.
parameters:
- Dest is the register whose value will have one or more bits set to !C.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value identifies
  the bit(s) to modify.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set to parity of result
  Z: Set if result equals zero
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 0101101 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: parity of result
  z: Result == 0
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, MUXC / MUXNC, pp.100-101"
