instruction: POLLFBW
syntax: POLLFBW {WC|WZ|WCZ}
brief_description: Poll FIFO block wrap
category: Event
description: >-
  POLLFBW copies the state of the FIFO-interface-block-wrap event flag into C and/or
  Z and then clears the flag (unless it's being set again by the event sensor).
  If the WC, WZ, or WCZ effect is specified, the C flag and/or Z flag is updated to
  the state of the FIFO-interface-block-wrap event flag prior to clearing it.
  The FIFO-interface-block-wrap event flag is set whenever the Hub RAM FIFO interface
  exhausts its block count and reloads its block count and start address. The flag
  is cleared upon execution of RDFAST, WRFAST, FBLOCK, POLLFBW, WAITFBW, JFBW, or
  JNFBW instructions.
result: FIFO-interface-block-wrap event flag is optionally copied into C and/or Z,
  then it is cleared.
flags_affected:
  C: Set to FBW event flag state
  Z: Set to FBW event flag state
parameters:
- WC, WZ, or WCZ are optional effects to update flags.
syntax_variants:
- POLLFBW {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1101011 CZ0 000001001 000100100
  write: —
  c: FBW Event
  z: FBW Event
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, POLLFBW, p.112"
