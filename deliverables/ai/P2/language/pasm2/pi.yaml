constant: PI
name: PI
value: 3.141593
hex_value: $40490FDB
description: 'Floating-point representation of PI constant

  IEEE 754 single-precision floating-point encoding of pi

  '
category: Constants
documentation_level: complete
usage: 'Use with CORDIC operations and floating-point calculations

  Provides precise PI value for trigonometric computations

  '
examples:
- code: |
    ' Load the IEEE-754 PI constant for floating-point math.
    mov     fnum, ##PI          ' fnum = 3.141593 ($40490FDB, IEEE-754 single)
  description: Loading the floating-point PI constant
- code: |
    ' CORDIC rotation uses 32-bit BINARY angles, NOT this IEEE-754 float.
    ' PI radians (180 deg) = $8000_0000; PI/2 (90 deg) = $4000_0000.
    SETQ    y_coord             ' Y coordinate from SETQ
    QROTATE x_coord, ##$4000_0000  ' X from D operand, angle (PI/2) from S operand
    GETQX   new_x               ' rotated X
    GETQY   new_y               ' rotated Y
  description: For CORDIC, PI is a binary angle ($8000_0000), not the float constant above
notes:
- Approximately 3.141592653589793
- IEEE 754 single-precision format
- Used primarily with CORDIC and floating-point operations
- For CORDIC angles, a full circle (2*PI) = $1_0000_0000 (2^32, wraps to 0); PI (180 deg) = $8000_0000; PI/2 (90 deg) = $4000_0000
related:
- qrotate
- qvector
- cordic_operations
oneliner: Floating-point representation of PI constant
