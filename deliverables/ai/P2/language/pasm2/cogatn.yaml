instruction: COGATN
syntax: COGATN {#}Dest
brief_description: Cog attention
category: Event
description: >-
  COGATN strobes the attention signal for one or more cogs. Dest supplies a 16-bit
  value in which bits 0..15 represent cogs 0..15 (the 8-cog part has cogs 0..7); high
  (1) bits indicate the cog(s) to signal. The receiving
  cog(s) then latch the signal, setting an internal flag, and can use any of the
  attention monitor instructions (JATN, JNATN, POLLATN, WAITATN) or interrupts to
  respond and clear the flag. In the intended use case, the cog receiving an attention
  request knows which other cog is strobing it and how to respond. In cases where
  multiple cogs may request the attention of a single cog, some messaging structure
  may need to be implemented in Hub RAM to differentiate requests.
result: The attention signal of one or more cogs is strobed.
flags_affected:
  C: No effect
  Z: No effect
parameters:
- Dest is the register or 9-bit literal whose value (16-bit pattern, bit n = cog n) indicates
  which cogs to signal.
syntax_variants:
- COGATN {#}D
self_attention:
  behavior: "COGATN with the issuing cog's own bit set delivers the strobe to the issuing cog: its own attention event flag is raised, exactly as when another cog strobes it (POLLATN, JATN and WAITATN with a timeout all saw it; the attention interrupt path was not tested)"
  verified_against: "EF-099"
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 1101011 00L DDDDDDDDD 000111111
  write: —
  c: —
  z: —
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, COGATN, p.63"
documentation_level: comprehensive
compiler_operand_format:
