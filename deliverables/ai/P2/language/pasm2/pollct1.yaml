instruction: POLLCT1
syntax: POLLCT1 {WC|WZ|WCZ}
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1101011 CZ0 000000001 000100100
  write: —
  c: CT1 Event
  z: CT1 Event
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: >-
  POLLCT1 copies the state of the counter 1 event flag into C and/or Z and then clears
  the flag (unless it's being set again by the event sensor).
  If the WC, WZ, or WCZ effect is specified, the C flag and/or Z flag is updated to
  the state of the counter 1 event flag prior to clearing it.
  The counter 1 event flag is set whenever the System Counter (CT) passes the value
  in the CT1 event trigger register; i.e. MSB of (CT - CT1) is 0. The counter 1 event
  flag is cleared upon execution of ADDCT1, POLLCT1, WAITCT1, JCT1, or JNCT1.
flags_affected:
  C: Set to CT1 event flag state
  Z: Set to CT1 event flag state
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, POLLCT1/2/3, pp.111-112"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 272 (POLLCT1 {WC/WZ/WCZ}: get CT1 event flag into C/Z, then clear it; 2 clocks)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Event instructions, p.43 (POLLCT1 {WC/WZ/WCZ}, 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, POLLCT1/2/3, pp.111-112 (Result line, WC / WZ / WCZ parameter, encoding row 000000001 / 000100100, write none, C and Z CT1 Event, 2 clocks, Related list, the copy-then-clear and update-C-and/or-Z explanation on p.111; the System Counter pass rule and the clearing list ADDCTx, POLLCTx, WAITCTx, JCTx, JNCTx on p.112)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), EVENTS (the POLLxxx instructions simultaneously return their event-occurred flag into C and/or Z and clear it unless it is set again by the event sensor; POLLCT1 event flag: cleared on ADDCT1, set whenever CT passes the result of the ADDCT1 (MSB of CT minus CT1 is 0), also cleared on POLLCT1 / WAITCT1 / JCT1 / JNCT1), instruction encoding listing (EEEE 1101011 CZ0 000000001 000100100 POLLCT1 {WC/WZ/WCZ})"
