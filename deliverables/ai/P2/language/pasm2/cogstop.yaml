instruction: COGSTOP
syntax: COGSTOP {#}Dest
brief_description: Cog stop
category: Hub Control
description: 'COGSTOP terminates the cog identified by Dest[2:0]. In this dormant
  state, the cog ceases to execute code and

  power consumption is greatly reduced.

  '
result: Cog indicated by Dest is terminated (stopped).
flags_affected:
  C: No effect
  Z: No effect
parameters:
- Dest is the register or 9-bit literal indicating (in lowest 3 bits) which cog to
  stop.
syntax_variants:
- COGSTOP {#}Dest
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 1101011 00L DDDDDDDDD 000000011
  write: —
  c: —
  z: —
  clocks: 2–9
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_l
  pattern: D/#0..511
  description: Destination or immediate value 0-511
  valueType: 26
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 26
