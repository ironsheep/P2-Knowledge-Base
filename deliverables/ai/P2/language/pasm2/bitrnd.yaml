instruction: BITRND
syntax: BITRND Dest, {#}Src {WCZ}
brief_description: Bit random
category: Math and Logic
description: >-
  BITRND alters the Dest bit(s) designated by Src to each be an independent
  random low or high value, based on bit(s) from the Xoroshiro128** PRNG. All
  other bits are left unchanged.

  Src[4:0] indicates the bit number (0-31). For a range of bits, Src[4:0]
  indicates the base bit number (0-31) and Src[9:5] indicates how many
  contiguous bits beyond the base should be affected (1-31).

  A 9-bit literal Src is enough to express the base bit (Src[4:0]) and a range
  of up to 16 contiguous bits (Src[8:5]). If needed, use the augmented literal
  feature (##Src) to augment Src to a 10-bit literal value-- this inserts an
  AUGS instruction prior.

  When Src is a register, the register's value bits [9:0] are used as-is to
  form the 10-bit ID range, unless a prior SETQ overrides value bits[9:5] with
  the low five bits of the SETQ value. An ALTx between the SETQ and BITRND keeps
  the override (SETQ #0, ALTB, BITRND forces a single bit), and a SETQ separated
  from BITRND by other instructions is not documented.

  If the WCZ effect is specified, the C and Z flags are updated to the original
  state of Dest's base bit, identified by Src. BITRND takes no effect or WCZ.
result: >-
  Dest bit(s) described by Src are each set randomly low or high; the rest are
  left as-is.
parameters:
- Dest is the register whose value will have one or more bits set randomly low
  or high.
- Src is a register, 9-bit literal, or 10-bit augmented literal whose value
  identifies the bit(s) to modify.
- WCZ is an optional effect to update flags.
flags_affected:
  C: With WCZ, set to original D[S[4:0]] (original state of base bit before modification)
  Z: With WCZ, set to original D[S[4:0]] (original state of base bit before modification)
syntax_variants:
- BITRND Dest, {#}Src {WCZ}
timing:
  cycles: 2
  type: fixed
encoding:
- bits: EEEE 0100110 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: Original D base bit
  z: Original D base bit
  clocks: '2'
encoding_notes:
- BITRND and TESTB with XORC or XORZ share the INSTR field 0100110; the effect bits tell them apart (BITRND no effect = C Z 00, WCZ = 11; TESTB XORC = 10, XORZ = 01). BITRND takes either no effect or WCZ.
sources:
  - "encoding row and flags: P2 Instructions v35 - Rev B/C Silicon, row 48 (BITRND: bits D[S[9:5]+S[4:0]:S[4:0]] = RNDs; other bits unaffected; prior SETQ overrides S[9:5]; C,Z = original D[S[4:0]]; 2 clocks; write D); Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 0100110 CZI ... BITRND D,S/# {WCZ}; the same INSTR field as TESTB D,S/# XORC/XORZ) and its list of changes (the span of bits, +S[9:5]; prior SETQ overrides S[9:5])"
  - "description (Src[4:0] and Src[9:5], the WCZ rule, the literal forms, the Xoroshiro128** source): Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, BITRND, p.54"
  - "description (SETQ #0 then ALTB then BITxxx forces Src[9:5] to 0): Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ALTB, pp.38-39; the manual's BITRND text says a SETQ immediately preceding substitutes its Dest[4:0]; a SETQ separated by other instructions is in no source"
  - "encoding_notes: CP-033 (BITRND assembles as EEEE 0100110 with C Z = 00 with no effect and 11 with WCZ; TESTB XORC/XORZ share 0100110 with C Z = 10/01)"
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, BITRND, p.54"
documentation_level: comprehensive
last_updated: '2025-11-26'
manual_extraction_date: '2025-01-19'
oneliner: Set bit(s) random low/high
