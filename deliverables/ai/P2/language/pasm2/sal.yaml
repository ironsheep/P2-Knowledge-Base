instruction: SAL
syntax: SAL Dest, {#}Src {WC|WZ|WCZ}
brief_description: Shift arithmetic left
category: Math and Logic
description: >-
  SAL shifts Dest's binary value left by Src places (0-31 bits) and sets the new LSBs to
  that of the original Dest[0]. SAL is the complement of SAR for bit streams but not for
  math operations; use SHL instead for swift 32-bit integer multiplication by a
  power-of-two. If the WC or WCZ effect is specified, the C flag is updated to the value
  of the last bit shifted out (effectively C = result bit "32") if Src is 1-31, or to
  Dest[31] if Src is 0. If the WZ or WCZ effect is specified, the Z flag is set (1) if
  the Dest result equals zero, or is cleared (0) if it is non-zero.
result: The bits of Dest are shifted left by Src bits, extending Dest[0] into new
  rightmost bits.
parameters:
- Dest is the register containing the value to arithmetically left shift by Src bits.
- Src is a register or 5-bit literal whose value indicates the number of bits to arithmetically
  shift left.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set to last bit shifted out if S[4:0] > 0, else D[31]
  Z: Set if result equals zero
syntax_variants:
- SAL D,{#}S {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 0000111 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: last bit shifted out if S[4:0] > 0, else D[31]
  z: Result == 0
  clocks: '2'
encoding_notes:
- C = last bit shifted out if Src[4:0] > 0, else C = Dest[31].
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, SAL, p.122"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 9 (SAL D,{#}S {WC/WZ/WCZ}: shift arithmetic left, D = [63:32] of ({D[31:0], {32{D[0]}}} << S[4:0]), C = last bit shifted out if S[4:0] > 0, else D[31]; footnote * Z = (result == 0); 2 clocks; write D)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Math and Logic Instructions, p.37 (SAL D,{#}S {WC/WZ/WCZ}, 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, SAL, p.122 (Result line, Dest and Src parameters, encoding row 0000111 CZI, write D, C last bit out, Z Result = 0, 2 clocks, footnote C = last bit shifted out if Src[4:0] > 0 else Dest[31], the explanation that the new LSBs take the original Dest[0] and that SAL is the complement of SAR for bit streams but not for math operations, the WC rule (effectively result bit 32 if Src is 1-31, Dest[31] if Src is 0) and the WZ rule)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 0000111 CZI DDDDDDDDD SSSSSSSSS SAL D,S/# {WC/WZ/WCZ})"
