instruction: DJNZ
syntax: DJNZ    D,{#}S
category: Branch
description: >-
  DJNZ decrements the value in Dest, writes the result, and jumps to the address
  described by Src if the result is NOT zero.

  The address (Src) can be absolute or relative. To specify an absolute address,
  Src must be a register containing a 20-bit address value. To specify a relative
  address, use #Label for a 9-bit signed offset (a range of -256 to +255
  instructions). Offsets are relative to the
  instruction following the DJNZ. The signed offset value is in units of whole
  instructions-- it is added to PC as-is when in Cog/LUT execution mode and is
  multiplied by 4 then added to PC when in Hub execution mode (long-aligned Hub
  code not required).
  ##Label (or a prior AUGS instruction) assembles as an AUGS word plus the
  instruction, with an 18-bit offset field; the rule above is for #Label, and a
  backward ##Label in Cog execution is covered under anti_patterns.
result: >-
  Dest is decremented. If the result is not zero, PC is set to a new relative (#Src)
  or absolute (Src) address; otherwise execution continues with the next instruction.
parameters:
- Dest is a register whose value is decremented and tested for not zero.
- 'Src is a register, 9-bit literal, or ## augmented literal whose value is the
  absolute or relative address to set PC to. Use # for relative addressing; omit #
  for absolute addressing.'
flags_affected:
  C: No effect
  Z: No effect
timing:
  cycles: '2 or 4 (cog/LUT) / 2 or 13...20 (hub-exec)'
  type: variable
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1011011 01I DDDDDDDDD SSSSSSSSS
  write: D and PC
  c: —
  z: —
  clocks: 2 or 4 / 2 or 13...20
encoding_notes:
- Dest is always written; PC is written (the jump is taken) only when the result in
  Dest is NOT zero.
anti_patterns:
- pattern: "Backward DJNZ D,##Label in Cog execution"
  reason: >-
    DJNZ D,##Label assembles as an AUGS word plus DJNZ with an 18-bit count of whole
    instructions. With a target 303 longs back (field $3FED1, -303) it lands on its
    label in Hub execution and misses it in Cog execution: the field is added to PC
    as a positive number and execution goes to hub at PC plus the field ($4_0004 with
    PC at $133). A near #Label (within -256 to +255 instructions) avoids the
    ##Label form. A register holding the target address as Src assembles with no
    AUGS word; that form has been assembled only and not run on the board.
    Parallax's documents
    also give the ##Label form a 20-bit signed offset (-524288 to +524287).
  source: "P2 hardware verification, EF-107 (backward DJNZ x,##label, AUGS + DJNZ, field $0003_FED1, a 303-long distance in cog and in hub; predicted cog landing $0004_0004 seen); CP-031 (the ## S-branch assembles an AUGS word plus the instruction, an 18-bit offset field); CP-056 (a backward ##label assembles for all 47 S-branch instructions as AUGS plus the instruction with an 18-bit field that counts longs, $3_FED1 = -303 for a 303-long distance; a register Src assembles with no AUGS for DJNZ, TJS and JINT, assembled only, not run on the board); Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, DJZ / DJNZ, p.74 (##Label given as a 20-bit signed offset, -524288 to +524287)"
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, DJZ / DJNZ, p.74"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 169 (DJNZ D,{#}S: decrement D and jump to S if result is not zero; 2 or 4 cog/LUT, 2 or 13...20 hub; footnote: if #S and cogex PC += signed(S), if #S and hubex PC += signed(S*4), if S PC = register S) and the Datasheet instruction table, p.40"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, DJZ / DJNZ, p.74 (encoding table 2 or 4 / 2 or 13-20 and footnote 1 'Dest is always written; PC is written only when the result in Dest is zero (or not zero in syntax 2)'; absolute address in a register of 20 bits, #Label 9-bit signed offset -256 to +255 instructions, offsets in whole instructions in cog/LUT mode and times 4 in hub mode; the manual's text gives the ## offset as 20-bit)"
  - "CP-031, shown for DJNZ and TJZ of the same S-branch family (the 9-bit S field is in instructions in cog and times four in hub; the ## S-branch assembles an AUGS word plus the instruction, an 18-bit offset field)"
documentation_level: comprehensive
