instruction: SETQ
syntax: SETQ    {#}D
encoding:
- bits: EEEE 1101011 00L DDDDDDDDD 000101000
  write: —
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: Set Q to D. Use before RDLONG/WRLONG/WMLONG to set block transfer. Also
  used before MUXQ/COGINIT/QDIV/QFRAC/QROTATE/WAITxxx.
flags_affected:
  C: No effect
  Z: No effect
silicon_errata:
  block_transfer_ptrx_delta:
    description: "An ALTx/AUGS/AUGD placed between SETQ/SETQ2 and the block RDLONG/WRLONG/WMLONG that uses a PTRx expression cancels the block-size PTRx delta: PTRx takes the plain expression's own step (+4 for ptra++, +12 for ptra++[3]), not N*4; every long still transfers. Keep SETQ adjacent to the transfer. Full detail: language/pasm2/concepts/setq_block_ops.yaml."
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), KNOWN SILICON BUGS; EF-067"
  block_read_after_no_wait_rdfast:
    description: "A SETQ block RDLONG started 4 clocks after a no-wait RDFAST can write one wrong long, leave the rest unwritten and overwrite cog registers outside its destination, or the cog does not finish. Started after the waiting RDFAST, or 16 or more clocks after a no-wait one (the SETQ counts toward the 16; e.g. 6 two-clock instructions + the SETQ), it reads the right block. Distances between 4 and 16 clocks are not documented. Full account: language/pasm2/rdfast.yaml silicon_errata."
    source: "EF-074, EF-077, EF-084, EF-086, EF-087, EF-088 (not listed in Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), KNOWN SILICON BUGS)"
notes:
- "Q register: SETQ writes Q and is meant to precede a companion instruction. The value persists until XORO32, RDLUT, GETXACC or CRCNIB changes Q, or COGINIT, QDIV, QFRAC or QROTATE executes without a preceding SETQ and sets it to zero. SETQ shields the next instruction from interruption. A prior SETQ overrides the span field of BITx (S[9:5]), DIRx/OUTx/FLTx/DRVx (D[10:6]) and WRPIN/WXPIN/WYPIN/AKPIN (S[10:6]). Q is read back with MOV qval,#0 then MUXQ qval,##$FFFFFFFF. Full account: language/pasm2/concepts/special_registers.yaml q_register."
- "XBYTE role: besides COG-RAM block transfers, SETQ starts XBYTE and sets its mode. '_RET_ SETQ #mode' (with $1FF on the call stack) sets the XBYTE mode, and further '_RET_ SETQ' instructions alter the mode for subsequent bytecodes. '_RET_ SETQ2' sets the mode for the next bytecode only. See architecture/xbyte_engine.yaml."
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release (2022/11/01), Propeller 2 Assembly Language (PASM2) in Brief, p.159; P2 Instructions v35 - Rev B/C Silicon, Sheet1; Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SETQ CONSIDERATIONS (what changes Q, the readback sequence, the shield)"
