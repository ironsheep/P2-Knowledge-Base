instruction: CALL
syntax: 'CALL #{\}Addr | CALL Dest {WC|WZ|WCZ}'
brief_description: Call subroutine
category: Branch
description: >-
  CALL records the current state of the C and Z flags and the address of the
  next instruction (PC + 1 if Cog/LUT execution; PC + 4 if Hub execution) by
  pushing to the stack (K), potentially updates the C and Z flags with new
  given states, and jumps to the given address or offset. The routine at the
  new address should eventually execute a RET instruction, or a NON-BRANCHING
  instruction carrying a _RET_ condition, to return to the recorded address (the
  instruction following the CALL) and optionally restore the C and Z flag state
  as it was prior. (A _RET_ condition returns only if that instruction did not
  branch -- see ret_prefix_caveat below.)

  In syntax 1, #Addr and #\Addr encodes the instruction with relative and
  absolute addressing, respectively. The relative form (the default) is vital
  for creating relocatable code. In either case, use symbolic references for
  Addr and the assembler will encode it properly. Examples: CALL #SendBit or
  CALL #\DebugStatus

  In syntax 2, the format of the value at Dest is
  CZxxxxxx_xxxxAAAA_AAAAAAAA_AAAAAAAA. C is the new C flag state, Z is the new
  Z flag state, A is the new 20-bit address to jump to, and x are don't-care
  bits. Syntax 2 effectively swaps the flags and PC with the value in the Dest
  register (and RET swaps them back), making it convenient for switching
  between two threads.

  If the WC or WCZ effect is specified, the C flag is updated to match D[31],
  after its original state is recorded.

  If the WZ or WCZ effect is specified, the Z flag is updated to match D[30],
  after its original state is recorded.
result: >-
  Push current C and Z flags and address of the next instruction onto the
  hardware stack, set PC to new relative or absolute address, and optionally
  update C and/or Z to new state.
parameters:
- Addr is a symbolic reference to the target subroutine; the location to set
  PC to. Relative addressing is the default; use '\' to force absolute
  addressing.
- Dest is a register containing the 20-bit absolute address to set PC to and
  optional new C and Z states.
- WC, WZ, or WCZ are optional effects to update the flags from Dest's upper
  bit states.
flags_affected:
  C: Updated from D[31] if WC/WCZ specified (after recording original)
  Z: Updated from D[30] if WZ/WCZ specified (after recording original)
syntax_variants:
- 'CALL #Addr'
- 'CALL #\Addr'
- CALL Dest {WC|WZ|WCZ}
timing:
  cycles: 4
  type: variable
  notes: 4 cycles for Cog/LUT, 13-20 cycles for Hub execution
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1101101 RAA AAAAAAAAA AAAAAAAAA
  write: K and PC
  c: —
  z: —
  clocks: '4 / 13-20'
  notes: Syntax 1 - relative (R=1, PC += A) or absolute (R=0, PC = A) address; a backslash forces R=0
- bits: EEEE 1101011 CZ0 DDDDDDDDD 000101101
  write: K and PC
  c: D[31]
  z: D[30]
  clocks: '4 / 13-20'
  notes: Syntax 2 - address from register
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, CALL, pp.56-57"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 403 (CALL #{\\}A: push {C, Z, 10'b0, PC[19:0]}; R = 1 then PC += A, else PC = A; backslash forces R = 0; 4 cog/LUT, 13...20 hub), row 318 (CALL D: C = D[31], Z = D[30], PC = D[19:0]; 4, 13...20) and row 319 (RET: pop the stack, C = K[31], Z = K[30], PC = K[19:0])"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 1101101 RAA AAAAAAAAA AAAAAAAAA CALL #{\\}A; EEEE 1101011 CZ0 DDDDDDDDD 000101101 CALL D {WC/WZ/WCZ})"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, CALL, pp.56-57 (both encoding rows; write K and PC; 4 / 13-20; description, syntax 1 and 2, WC/WZ/WCZ effects)"
  - "ret_prefix_caveat: Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, Conditions ( IF_x ), p.68 (_RET_: always; execute instruction then return if no branch; no context restore); P2 Instructions v35 - Rev B/C Silicon, row 410 (_RET_ <inst>: if <inst> is not branching then return by popping stack[19:0] into PC); hardware-verification ledger EF-058 (_RET_ CALL #target assembles, pushes the next-instruction address and does not return from the calling routine; the instruction after it runs)"
  - "CP-036 (CALL #sub1 assembles with bit 20 = 1, R relative; CALL #\\sub1 with bit 20 = 0, R absolute)"
documentation_level: comprehensive
last_updated: '2025-11-26'
manual_extraction_date: '2025-01-19'
ret_prefix_caveat: >-
  '_RET_ CALL #target' does not call and return. The _RET_ prefix returns only if
  the instruction did not branch, and CALL branches, so the _RET_ return does not
  happen and the line acts as 'CALL #target'. The callee's RET returns to the
  instruction after the '_RET_ CALL', so execution continues into whatever the
  assembler placed next. The line assembles without error. To call a helper and
  then return, write 'CALL #target' followed by 'RET'.
  Full rule: language/pasm2/concepts/conditional_execution.yaml (ret_prefix_rule).
oneliner: Call a subroutine; store return context on the stack
related:
- RET
- CALLA
- CALLB
- CALLD
- language/pasm2/concepts/instruction_encoding_key.yaml
