  - "description (an ALTx between the SETQ and DIRNC keeps the override): Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ALTB, pp.38-39 (SETQ / SETQ2 does not affect ALTx instructions; the Q value passes through to the next instruction); a SETQ separated by other instructions is in no source"
  - "encoding_notes: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 1101011 CZL DDDDDDDDD 001000011 for both TESTPN D/# ANDC/ANDZ and DIRNC D/# {WCZ})"
  - "P2 Instructions v35 - Rev B/C Silicon, row 352 (DIRNC {#}D {WCZ}: DIR bits of pins D[10:6]+D[5:0]..D[5:0] = !C; wraps within DIRA/DIRB; prior SETQ overrides D[10:6]; C,Z = DIR bit; write DIRx; 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, DIRC / DIRNC, p.70 (encoding table; set pin to the output (1) or input (0) direction; Dest[5:0], Dest[10:6], the 9-bit literal range of Dest[8:6], ##Dest, the SETQ substitution, the wrap within DIRA or DIRB, C and Z set to the original base bit, 2 clocks)"
