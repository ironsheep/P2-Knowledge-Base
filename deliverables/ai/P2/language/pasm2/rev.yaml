instruction: REV
syntax: REV Dest
brief_description: Reverse
category: Math and Logic
description: >-
  The 32-bit pattern in Dest is reversed.

  REV performs a bitwise reverse (bits 31:0 become bits 0:31, D = D[0:31]) of the
  value in Dest and stores the result back into Dest.

  This is useful for processing binary data in a different MSB/LSB order than it is
  transmitted with.
result: The 32-bit pattern in Dest is reversed.
parameters:
- Dest is the register containing the bit value to reverse.
flags_affected:
  C: No effect
  Z: No effect
syntax_variants:
- REV Dest
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1101011 000 DDDDDDDDD 001101001
  write: D
  c: —
  z: —
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, REV, p.119"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 390 (REV D: reverse D bits, D = D[0:31]; 2 clocks; write D)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Math and Logic Instructions, p.37 (REV D: reverse D bits, D = D[0:31], 2 clocks)"
