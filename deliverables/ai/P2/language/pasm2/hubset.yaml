instruction: HUBSET
syntax: HUBSET  {#}D
encoding:
- bits: EEEE 1101011 00L DDDDDDDDD 000000000
  write: —
  c: —
  z: —
  clocks: '2...9'
timing:
  cycles: 2
  type: fixed
description: |
  Set hub configuration to D. HUBSET configures various hub parameters including
  clock source, crystal settings, and PLL configuration. The exact operation
  depends on the bits set in D.

  Primary use is clock configuration: selecting clock source (RCFAST, RCSLOW,
  crystal, PLL), configuring PLL dividers and multipliers, and switching between
  clock sources. Chip reset uses a separate HUBSET mode: HUBSET ##$1000_0000
  (D[31:28]=%0001 selects hard reset/reboot). In clock mode, D[31]=1 selects PRNG seed, not reset.

clock_configuration:
  bit_fields:
    d31:
      name: "PRNG Seed (MSB)"
      description: "In clock mode, write 1 (with D[30:0] as seed data) to seed the Xoroshiro128** PRNG; does NOT reset the chip. Chip reset is a separate mode: HUBSET ##$1000_0000."
    d24:
      name: "PLL Enable"
      description: "1 = PLL powered on, 0 = PLL off"
    d23_18:
      name: "Input Divider (DIVD)"
      description: "PLL input divider - 1 (6 bits)"
      range: "0-63 (actual divider 1-64)"
    d17_8:
      name: "Multiplier (MULT)"
      description: "PLL VCO multiplier - 1 (10 bits)"
      range: "0-1023 (actual multiplier 1-1024)"
    d7_4:
      name: "Post Divider (PPPP)"
      description: "PLL output divider (4 bits): %0000 = VCO/2, %0001 = VCO/4, ... %1110 = VCO/30 (VCO / ((PPPP+1)*2)), and %1111 = VCO/1 (silicon-doc-text.txt:2644-2678)"
    d3_2:
      name: "Crystal Config (CC)"
      values:
        0b00: "XI/XO Hi-Z (oscillator off)"
        0b01: "1MΩ feedback, no caps"
        0b10: "1MΩ feedback, 15pF caps (crystals >= 16 MHz)"
        0b11: "1MΩ feedback, 30pF caps (crystals < 16 MHz)"
    d1_0:
      name: "Clock Source (SS)"
      values:
        0b00: "RCFAST (~20 MHz)"
        0b01: "RCSLOW (~20 kHz)"
        0b10: "XI pin (crystal/external)"
        0b11: "PLL output"

safe_clock_switching:
  description: |
    When switching to PLL, follow this three-step sequence to avoid glitches:
    1. Configure PLL but stay on current source
    2. Wait for PLL to lock (~10ms)
    3. Switch clock source to PLL
  sequence:
    step_1:
      description: "Configure PLL without switching to it"
      code: |
        HUBSET  ##pll_config_mode     ' PLL settings, source bits = current
    step_2:
      description: "Wait for PLL to stabilize"
      code: |
        RDLONG  clkf, #$44            ' clkfreq lives at hub long $44
        QDIV    clkf, #100
        GETQX   pll_wait
        WAITX   pll_wait              ' Wait ~10ms for PLL lock
    step_3:
      description: "Switch to PLL"
      code: |
        HUBSET  ##pll_active_mode     ' Same config, source bits = 11 (PLL)

examples:
  enable_crystal:
    description: "Enable 20 MHz crystal oscillator (the low nibble is %CC_SS)"
    code: |
      HUBSET  ##%10_00              ' CC=%10 (15pF caps), SS=%00 stay on RCFAST
      WAITX   ##20_000_000/200      ' Wait 5ms for crystal to stabilize
      HUBSET  ##%10_10              ' SS=%10 switch to crystal (XI source)

  pll_200mhz:
    description: "Configure PLL for 200 MHz from 20 MHz crystal (fields %E_DDDDDD_MMMMMMMMMM_PPPP_CC_SS)"
    code: |
      ' Step 1: RCFAST with PPPP=%1111 (safe base before using the PLL)
      HUBSET  #$F0

      ' Step 2: PLL on, crystal on, stay on RCFAST (SS=%00)
      '   DDDDDD=0 (/1), MMMMMMMMMM=9 (x10) -> VCO 200 MHz, PPPP=%1111 -> VCO/1
      HUBSET  ##%1_000000_0000001001_1111_10_00
      WAITX   ##20_000_000/100      ' Wait 10ms for crystal+PLL

      ' Step 3: Switch to PLL (SS=%11)
      HUBSET  ##%1_000000_0000001001_1111_10_11  ' Same config, source=PLL

  chip_reset:
    description: "Reset (reboot) the entire chip -- D[31:28]=%0001 selects hard-reset mode"
    code: |
      HUBSET  ##$1000_0000          ' D[31:28]=%0001 = hard reset, reboots chip
flags_affected:
  C: No effect
  Z: No effect
documentation_source: PASM2 Manual 2022-11-01
documentation_level: enhanced
