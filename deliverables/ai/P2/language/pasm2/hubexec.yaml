constant: HUBEXEC
name: HUBEXEC
description: 'Predefined constant for COGINIT instruction

  Executes code directly from hub RAM without loading to cog RAM

  '
category: Execution Mode Constants
value: '%10_0000'
documentation_level: complete
syntax: 'COGINIT #HUBEXEC+id, ##address'
usage: 'Used with COGINIT to start a cog executing from hub RAM

  Target cog executes instructions directly from hub RAM (no cog RAM load)

  '
examples:
- code: |
    COGINIT #HUBEXEC+1, ##$400   ' Start Cog 1 executing from Hub RAM $400
  description: Start specific cog with hub execution
- code: |
    COGINIT #HUBEXEC+5, ##@code  ' Start Cog 5 executing from @code in hub
  description: Start Cog 5 with hub execution at label
notes:
- Executes instructions directly from hub RAM (no cog RAM load)
- Hub execution allows unlimited code size (not limited to 512 longs)
- Sequential code matches cog-execution speed (2 clocks/instruction — the FIFO streams instructions to the pipeline)
- Branches cost minimum 13 clocks for FIFO refill (+1 if target is not long-aligned)
- Instruction prefetch FIFO is (cogs+11) = 19 stages deep on a P2 with 8 cogs
- FIFO/streamer instructions are FORBIDDEN in hubexec (not slow): RDFAST, WRFAST, FBLOCK, RFBYTE, RFWORD, RFLONG, RFVAR, RFVARS, WFBYTE, WFWORD, WFLONG, XINIT, XZERO, XCONT (when streamer engages FIFO)
- REP works in hubexec but slower per iteration - it executes a hidden jump to get back to the top of the repeated instructions, and that hidden jump pays the 13+ clock hub-branch cost on each iteration
- None of the ALTx instructions (ALTI/ALTS/ALTD/ALTR/ALTB/ALTSN/ALTSB/ALTSW/ALTGN/ALTGB/ALTGW) is in the hub-execution forbidden list, so they are not excluded from hubexec.
- RDLONG/WRLONG and other hub I/O work normally in hubexec (RDLONG 9...26 / WRLONG 3...20 clocks in hubexec, egg-beater dependent; per language/pasm2/rdlong.yaml / language/pasm2/wrlong.yaml)
- Must specify target cog ID (0-7)
- Use HUBEXEC_NEW to auto-select available cog
- See also HUBEXEC_NEW and HUBEXEC_NEW_PAIR variants
related:
- COGEXEC
- ORGH
- HUBEXEC_NEW
- HUBEXEC_NEW_PAIR
- language/pasm2/concepts/cog_hub_execution.yaml
- language/pasm2/concepts/execution_modes.yaml
- architecture/fifo.yaml
oneliner: Predefined constant for COGINIT instruction
source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), HUB EXECUTION (13-clock minimum branch, forbidden-instruction list); THE COG -to- HUB RAM INTERFACE ((cogs+11) FIFO stages); INSTRUCTION REPEATING (REP hidden jump in hub memory)"
