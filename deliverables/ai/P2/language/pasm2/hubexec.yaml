source: "P2 Instructions v35 Rev B/C Silicon, ADD/MOV/NOP rows (hub execution mode: same as cog execution); Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), MEMORIES (the memory table: hub RAM execution range $00400..$FFFFF), INSTRUCTION MODES (the mode table: $00400..$FFFFF hub RAM) and HUB RAM (hub execution when the PC is $00400..$FFFFF); HUB EXECUTION ('When the PC is in the range of $00400 and $FFFFF, the cog is fetching instructions from hub RAM'; 13-clock minimum branch, forbidden-instruction list); THE COG -to- HUB RAM INTERFACE ((cogs+11) FIFO stages); INSTRUCTION REPEATING (REP hidden jump in hub memory); FAST BLOCK MOVES (block moves yield to the hub FIFO interface, so they can be used during hub execution); Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, Hub Execution, p.21 (PC range $00400 to $7FFFF); Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Hub Execution, p.15 (PC range $00400 to $7FFFF)"
