constant: HUBEXEC
name: HUBEXEC
description: 'Predefined constant for COGINIT instruction

  Executes code directly from hub RAM without loading to cog RAM

  '
category: Execution Mode Constants
value: '%10_0000'
documentation_level: complete
syntax: 'COGINIT #HUBEXEC+id, ##address'
usage: 'Used with COGINIT to start a cog executing from hub RAM

  Target cog executes instructions directly from hub RAM (no cog RAM load)

  '
examples:
- code: |
    COGINIT #HUBEXEC+1, ##$400   ' Start Cog 1 executing from Hub RAM $400
  description: Start specific cog with hub execution
- code: |
    COGINIT #HUBEXEC+5, ##@code  ' Start Cog 5 executing from @code in hub
  description: Start Cog 5 with hub execution at label
notes:
- Executes instructions directly from hub RAM (no cog RAM load)
- Hub execution is not limited to the 512 longs of cog RAM; the PC range for hub execution is $00400..$FFFFF (Parallax's documents also give $7FFFF as the top of the range)
- ALU instructions such as ADD, MOV and NOP take 2 clocks in hub execution, the same as in cog execution. Not documented - the clocks per sequential instruction in hub execution as a general rule.
- A branch to a hub address takes a minimum of 13 clocks (+1 if target is not long-aligned)
- The FIFO contains (cogs+11) stages
- These instructions cannot be used in hubexec: RDFAST, WRFAST, FBLOCK, RFBYTE, RFWORD, RFLONG, RFVAR, RFVARS, WFBYTE, WFWORD, WFLONG, and XINIT / XZERO / XCONT (when the streamer mode engages the FIFO)
- REP works in hubexec, but it executes a hidden jump to get back to the top of the repeated instructions. Not documented: the cost of the hidden jump.
- RDLONG/WRLONG and other hub I/O work normally in hubexec (RDLONG 9...26 / WRLONG 3...20 clocks in hubexec, egg-beater dependent)
- Fast block moves (SETQ/SETQ2 with RDLONG/WRLONG/WMLONG) yield to the hub FIFO interface, so they can be used during hub execution
- Must specify target cog ID (0-7)
- HUBEXEC_NEW chooses an available (non-running) cog automatically; no ID is specified
- See also HUBEXEC_NEW and HUBEXEC_NEW_PAIR variants
hub_symbols: "Fragments here that use a hub symbol as an immediate assume a PASM-only file, where hub addresses are absolute. In a Spin2 object, DAT hub addresses are relative to the object: see language/spin2/integration/spin2-pasm2-integration.yaml hub_address_resolution."
