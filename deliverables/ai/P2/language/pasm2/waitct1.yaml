instruction: WAITCT1
syntax: WAITCT1 {WC|WZ|WCZ}
no_setq_behavior: "With no preceding SETQ, no timeout is armed, so the event always satisfies the wait first: the effect then clears the flag it names (WC: C, WZ: Z, WCZ: both C and Z; each carries the same timeout result). Using this instruction with WCZ and no SETQ therefore clears C and Z in one instruction; the instruction still waits for its event (and clears the event flag), so C and Z are cleared once the event has occurred."
source: "EF-020 (the no-SETQ flag clear, run on WAITSEx; same mechanism here, not run on WAITCT1; WAITCT1's CT timing: EF-081)"
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1101011 CZ0 000010001 000100100
  write: —
  c: Timeout Abort
  z: Timeout Abort
  clocks: '2+'
timing:
  cycles: 2+
  type: variable
description: Wait for CT1 event flag, then clear it. WAITCT1 waits for the counter 1 event to occur (unless the flag is already set), then clears the event flag (unless it's being set again by the event sensor) and resumes execution. Optionally, WAITCT1 can time-out if the counter 1 event doesn't occur soon enough, setting C and/or Z flags. To set the optional timeout, insert a SETQ (with a future System Counter target value) right before WAITCT1. With a SETQ timeout, the WC/WZ/WCZ effect reports the outcome (flags are set (1) if timeout occurred before the event, or cleared (0) if the event occurred first). Without a SETQ no timeout is armed and the effect clears the named flags. During wait, the pipeline is stalled; no instructions execute and no interrupts are processed until the wait ends. The CT1 event flag is set whenever the System Counter passes the value in the CT1 event trigger register (MSB of CT - CT1 is 0). The flag is cleared by ADDCT1, POLLCT1, WAITCT1, JCT1, or JNCT1 execution.
flags_affected:
  C: "With a prior SETQ and the WC or WCZ effect, 1 if the timeout came first, otherwise 0; with no SETQ the effect clears the flag"
  Z: "With a prior SETQ and the WZ or WCZ effect, 1 if the timeout came first, otherwise 0; with no SETQ the effect clears the flag"
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, WAITCT1/2/3, pp.139-140"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 288 (WAITCT1 {WC/WZ/WCZ}: wait for CT1 event flag, then clear it; prior SETQ sets optional CT timeout value; C/Z = timeout; 2+ clocks)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Event Instructions, p.43 (WAITCT1 {WC/WZ/WCZ}, 2+ clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, WAITCT1/2/3, pp.139-140 (Result line, WC / WZ / WCZ parameter, encoding row 000010001 / 000100100, write none, C and Z Timeout Abort, 2+ clocks, Related list, wait-then-clear explanation, SETQ timeout, C and Z set if a timeout occurred before the event and cleared if the event occurred before the timeout, pipeline stalled during a wait, the System Counter pass rule and clearing list)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), EVENTS (WAITxxx waits for the event flag and then clears it unless it is set again by the event sensor; a SETQ right before supplies a future CT target that ends the wait prematurely, and with WAITxxx WC, C is set if the timeout occurred before the event and otherwise cleared; POLLCT1 / WAITCT1 event flag: cleared on ADDCT1, set whenever CT passes the result of the ADDCT1 (MSB of CT minus CT1 is 0), also cleared on POLLCT1 / WAITCT1 / JCT1 / JNCT1), and instruction encoding listing (EEEE 1101011 CZ0 000010001 000100100 WAITCT1 {WC/WZ/WCZ})"
  - "EF-020 (SETQ plus WAITSEx releases on whichever of event and timeout comes first and reports it in C, and with no SETQ a WCZ wait clears C and Z; the ledger states the mechanism is shared by the wait family)"
  - "EF-081 (WAITCTn times exactly as in a current group, in the window and across its closing wrap)"
