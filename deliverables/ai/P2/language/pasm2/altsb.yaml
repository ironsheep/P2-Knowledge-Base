instruction: ALTSB
syntax: ALTSB Dest, {#}Src
brief_description: Alter set byte
category: Register Indirection
description: 'ALTSB should be followed by SETBYTE-- it modifies the SETBYTE instruction''s Dest and Num values, enabling code to iterate through multiple bytes across Reg RAM. SETBYTE''s Dest is changed to (Src + Dest[10:2]) & $1FF (syntax 1), or to Dest[10:2] (syntax 2), and its Num value is changed to Dest[1:0]. Dest[10:2] is the target long register''s 9-bit address; Dest[1:0] is the byte ID (0-3) within it. Iteratively executing ALTSB followed by SETBYTE while incrementing the 11-bit Dest value writes a stream of bytes to Reg RAM as if it were byte-sized registers. In syntax 1, Src contains a base address (Src[8:0]) and signed auto-indexer (Src[17:9]). In syntax 2, Dest serves as the full byte address.'
result: The next instruction's pipelined Dest and Num values are altered to be (Src + Dest[10:2]) & $1FF (syntax 1), or just Dest[10:2] (syntax 2), and Num is set to Dest[1:0]. Dest is post-adjusted by auto-indexer.
parameters:
- Dest is the register whose 11-bit value is the index (Dest[10:2] = long address, Dest[1:0] = byte ID) or the full byte address for SETBYTE to operate on.
- Src is an optional register, 9-bit literal, or 18-bit augmented literal containing base long address (Src[8:0]) and optional auto-indexer value (Src[17:9]).
flags_affected:
  C: No effect
  Z: No effect
syntax_variants:
- ALTSB Dest, {#}Src
- ALTSB Dest
usage_notes: The instruction following ALTSB is shielded from interrupt. ALTSB alters the next instruction regardless of its kind (intended for SETBYTE). Field value modification occurs in the instruction pipeline only; code is not altered, values do not persist. SETQ/SETQ2 does not affect ALTx instructions; the Q value passes through to the next instruction.
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1001011 00I DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2'
- bits: EEEE 1001011 001 DDDDDDDDD 000000000
  write: D
  c: —
  z: —
  clocks: '2'
encoding_notes:
- Dest is post-adjusted by the auto-indexer value; the sign-extended Src[17:9]. In
  syntax 2, the auto-indexer value is 0.
- Src[17:9] is sign-extended before it is added into Dest.
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ALTSB, p.46"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, rows 106-107 (ALTSB: next D field = (D[10:2] + S) & $1FF, or D[10:2], and N field = D[1:0]; D += sign-extended S[17:9]; next instruction shielded from interrupt; 2 clocks)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), REGISTER INDIRECTION (S[17:9] is always sign-extended and added to D for index updating; ALTSB sets the next D field to base+index[10:2] and the next N to index[1:0])"
documentation_level: comprehensive
last_updated: '2025-09-19'
manual_extraction_date: '2025-01-19'
oneliner: Alter subsequent SETBYTE instruction
