instruction: TESTBN
syntax: TESTBN D,{#}S WC|WZ|ANDC|ANDZ|ORC|ORZ|XORC|XORZ
brief_description: Test bit negated
encoding:
- bits: EEEE 0100001 CZI DDDDDDDDD SSSSSSSSS
  write: —
  c: '!D[S[4:0]]'
  z: '!D[S[4:0]]'
  clocks: '2'
- bits: EEEE 0100011 CZI DDDDDDDDD SSSSSSSSS
  write: —
  c: C/Z AND !D[S[4:0]]
  z: C/Z AND !D[S[4:0]]
  clocks: '2'
- bits: EEEE 0100101 CZI DDDDDDDDD SSSSSSSSS
  write: —
  c: C/Z OR  !D[S[4:0]]
  z: C/Z OR  !D[S[4:0]]
  clocks: '2'
- bits: EEEE 0100111 CZI DDDDDDDDD SSSSSSSSS
  write: —
  c: C/Z XOR !D[S[4:0]]
  z: C/Z XOR !D[S[4:0]]
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: >-
  TESTBN reads the state (0/1) of a bit in Dest designated by Src, inverts that
  result, and either stores it as-is, or bitwise ANDs, ORs, or XORs it into C or Z.
  The bit position is specified by Src[4:0] (0-31). The WC, WZ, ANDC, ANDZ, ORC,
  ORZ, XORC, or XORZ effect determines how the inverted bit state is applied to the
  selected flag. Dest is not written. One of the eight effects is required.
result: >-
  The inverted state of Dest's bit Src is read and either stored as-is, or bitwise
  ANDed, ORed, or XORed into C or Z.
flags_affected:
  C: Written only by a C effect - WC sets C to !D[S[4:0]]; ANDC, ORC and XORC combine !D[S[4:0]] into C with AND, OR and XOR; a Z effect leaves C unchanged
  Z: Written only by a Z effect - WZ sets Z to !D[S[4:0]]; ANDZ, ORZ and XORZ combine !D[S[4:0]] into Z with AND, OR and XOR; a C effect leaves Z unchanged
parameters:
- Dest is the register whose value will have a single bit tested.
- Src is a register or 5-bit literal whose value identifies the bit (0-31) of Dest
  to test.
- WC, WZ, ANDC, ANDZ, ORC, ORZ, XORC and XORZ are a required effect to update or
  bitwise combine into the C or Z flag.
syntax_variants:
- TESTBN D,{#}S WC|WZ
- TESTBN D,{#}S ANDC|ANDZ
- TESTBN D,{#}S ORC|ORZ
- TESTBN D,{#}S XORC|XORZ
encoding_notes:
- TESTBN shares its INSTR field with BITH, BITNC, BITNZ and BITNOT, and the effect bits tell them apart. 0100001 is TESTBN WC or WZ (C Z = 10 or 01) and BITH with no effect or WCZ (C Z = 00 or 11); 0100011 is TESTBN ANDC or ANDZ (C Z = 10 or 01) and BITNC; 0100101 is TESTBN ORC or ORZ and BITNZ; 0100111 is TESTBN XORC or XORZ and BITNOT. TESTBN takes one of the eight effects.
sources:
  - "encoding rows and effects: P2 Instructions v35 - Rev B/C Silicon, rows 35, 37, 39, 41 (TESTBN with WC/WZ, ANDC/ANDZ, ORC/ORZ, XORC/XORZ); Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 0100001, 0100011, 0100101, 0100111 for TESTBN; the same fields for BITH, BITNC, BITNZ, BITNOT); Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, TESTB / TESTBN, pp.134-135"
  - "encoding_notes: CP-033 (the assembled words: testbn wc/wz, andc/andz, orc/orz and xorc/xorz carry the same opcode field as bith, bitnc, bitnz and bitnot; the effect bits C Z are 10 or 01 for TESTBN and 00 or 11 for BITx; bitl x,#1 wc is refused with 'This effect is not allowed for this instruction'; testb x,#1 wcz is refused with 'Expected WC, WZ, ANDC, ANDZ, ORC, ORZ, XORC, or XORZ')"
