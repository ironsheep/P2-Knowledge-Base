instruction: SUMZ
syntax: SUMZ    D,{#}S   {WC/WZ/WCZ}
encoding:
- bits: EEEE 0011110 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: true sign of (D +/- S)
  z: Result == 0
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: '{WC/WZ/WCZ}   Sum +/-S into D by Z. If Z = 1 then D = D - S, else D
  = D + S. C = true sign of (D +/- S). *'
flags_affected:
  C: Set to true sign of result (D +/- S)
  Z: Set if result equals zero
