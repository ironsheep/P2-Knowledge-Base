instruction: DEBUG
syntax: DEBUG | DEBUG(...)
encoding: "BRK #code (language/pasm2/brk.yaml): EEEE 1101011 00L DDDDDDDDD 000110110; code 0 for a plain DEBUG, 1..255 for DEBUG(...)"
timing:
  cycles: 2
  type: fixed
description: |
  In PASM, each DEBUG statement adds one instruction (long): a BRK #code instruction is inserted where the DEBUG command was placed. DEBUG statements are ignored by the compiler when not compiling for DEBUG mode.
  A plain DEBUG becomes BRK #0 and launches (or updates) the PASM debugger; DEBUG(...) with output commands becomes BRK #1..255, the code indexing that statement's record in the DEBUG database. If the cog's debug interrupt is disabled the BRK does nothing and takes two clocks. A PASM DEBUG can be preceded by a condition (IF_C DEBUG(...)) as well as by _RET_. The BRK is handled early in the pipeline, so a condition on the BRK itself does not make the break conditional (see language/pasm2/brk.yaml condition_behavior), though an _RET_ executes normally. For a conditional DEBUG the compiler places an opposite-condition SKIP #1 before the BRK (IF_C DEBUG(...) generates IF_NC SKIP #1 and then the BRK), so the BRK executes on the desired condition. This adds 1 instruction.
examples:
- code: |
    DEBUG                   ' plain DEBUG: BRK #0, opens or updates the PASM debugger
  description: Basic debug operation
- code: |
    DEBUG("x = ", sdec(x))
  description: DEBUG with output commands
operand_details:
  none: Plain DEBUG has no operands
documentation_source: "Parallax Propeller 2 Spin2 Language Documentation v55, DEBUG (plain DEBUG resolves to BRK #0, DEBUG() to BRK #1..255; PASM DEBUG instructions; conditional PASM DEBUG: 'PASM DEBUG instructions can be now preceded by a condition, not just a _RET_', the BRK handled early in the pipeline, '_RET_ will execute normally', 'IF_C DEBUG' generating 'IF_NC SKIP #1' before the BRK, adding 1 instruction); a condition on BRK still breaks and gates only the code: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), DEBUG INTERRUPT, and hardware-verified EF-085; Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, BRK, p.55"
documentation_level: comprehensive
