instruction: POPB
syntax: POPB    D        {WC/WZ/WCZ}
encoding:
- bits: EEEE 1011000 CZ1 DDDDDDDDD 111011111
  write: D
  c: MSB of long
  z: Result == 0
  clocks: '9...16 *'
timing:
  cycles: "9...16 (cog or LUT exec) / 9...26 (hub exec)"
  type: variable
  source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF (clocks column), p.154"
  notes: "+1 clock if the long crosses a hub long."
description: Read long from hub address --PTRB into D.
flags_affected:
  C: With WC or WCZ, set to the MSB of the long (bit 31)
  Z: With WZ or WCZ, set if the result is zero
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.154"
documentation_level: enhanced
syntax_variants:
- POPB D
last_updated: '2025-01-19'
brief_description: Read long from hub address --PTRB into D
parameters:
- Dest is the destination register to receive the long read
- PTRB is decremented before the read (--PTRB)
category: Hub RAM
oneliner: Read long from hub address --PTRB into D
