instruction: SETLUTS
syntax: SETLUTS {#}D
encoding:
- bits: EEEE 1101011 00L DDDDDDDDD 000110111
  write: —
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: If D[0] = 1 then enable LUT sharing, where LUT writes within the adjacent
  odd/even companion cog are copied to this cog's LUT.
flags_affected:
  C: No effect
  Z: No effect
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release (2022/11/01), Propeller 2 Assembly Language (PASM2) in Brief, p.158; P2 Instructions v35 - Rev B/C Silicon, Sheet1"
documentation_level: enhanced
last_updated: '2025-09-19T16:04:17.496285'
category: Lookup Table
oneliner: If D[0] = 1 then enable LUT sharing
notes:
- 'SETLUTS #0 disallows writes from the other cog (the default); SETLUTS #1 allows them.'
- 'The writes that reach the receiving cog include SETQ2 block loads into the sender''s LUT
  and the start-up image of a Spin2 sender; the sender''s inline WRLUT also arrives. Enabling
  after those writes brings nothing that was written earlier (not retroactive).'
- "A COGINIT of the receiving cog resets its enable, so SETLUTS #1 must be executed again;
  a COGINIT of the sending cog leaves the receiver's enable in force."
- 'Not documented: the timing of a write against a concurrent enable.'
source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), RAM SHARING BETWEEN PAIRED COGS, p.15 (SETLUTS #0 and #1); EF-096 (tested on one pair at a time, in cog execution)"
