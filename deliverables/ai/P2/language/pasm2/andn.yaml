instruction: ANDN
syntax: ANDN    D,{#}S   {WC/WZ/WCZ}
encoding:
- bits: EEEE 0101001 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: parity of result
  z: Result == 0
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: ANDN performs a bitwise AND of Dest with the inverse of Src (!Src), storing the result in Dest. If the WC or WCZ effect is specified, the C flag is set (1) if the result contains an odd number of high (1) bits, or is cleared (0) if it contains an even number of high bits. If the WZ or WCZ effect is specified, the Z flag is set (1) if the result equals zero, or is cleared (0) if it is non-zero.
flags_affected:
  C: Set to parity of result (odd number of 1s = set)
  Z: Set if result equals zero
parameters:
- Dest is the register containing the value to bitwise AND with the inverse of Src and is the destination in which to write the result.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose inverse value will be bitwise ANDed with Dest.
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, AND / ANDN, p.49"
documentation_level: comprehensive
last_updated: '2025-01-19'
brief_description: And not
manual_extraction_date: '2025-01-19'
group_documentation: true
grouped_with:
- AND
- ANDN
category: Math and Logic
oneliner: Bitwise AND a value with the NOT of another
