instruction: WRNC
syntax: WRNC    D
category: Math and Logic
description: Write 0 or 1 to D, according to !C. D = {31'b0, !C).
parameters:
- Dest is the register whose value will be replaced with the state of C or !C.
flags_affected:
  C: No effect
  Z: No effect
syntax_variants:
- WRNC D
timing:
  cycles: 2
  type: fixed
encoding:
- bits: EEEE 1101011 000 DDDDDDDDD 001101101
  write: D
  c: —
  z: —
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, WRC / WRNC, p.145"
documentation_level: enhanced
compiler_operand_format:
  name: operand_d
  pattern: D
  description: Destination register only
  valueType: 24
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 24
