instruction: WRNC
syntax: WRNC D
brief_description: Write not C
category: Math and Logic
description: >-
  WRNC writes the inverse state of C (0 or 1) to Dest: Dest = {31'b0, !C}. If C is
  set (1), Dest becomes 0. If C is clear (0), Dest becomes 1.
result: >-
  Dest value is replaced with the inverse state of C (!C).
parameters:
- Dest is the register whose value will be replaced with the inverse state of C (!C).
flags_affected:
  C: No effect
  Z: No effect
syntax_variants:
- WRNC D
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1101011 000 DDDDDDDDD 001101101
  write: D
  c: —
  z: —
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, WRC / WRNC, pp.145-146"
sources:
