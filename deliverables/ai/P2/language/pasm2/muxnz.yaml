instruction: MUXNZ
syntax: MUXNZ   D,{#}S   {WC/WZ/WCZ}
category: Math and Logic
description: >-
  MUXNZ alters the Dest bit(s) designated by Src (high bits) to equal the inverse
  state of the Z flag. D = (!S & D) | (S & {32{!Z}}). Dest bit(s) described by Src
  are set to !Z; the rest are left as-is.
  If the WC or WCZ effect is specified, the C flag is set (1) if the number of high
  (1) bits in the result is odd, or is cleared (0) if it is even.
  If the WZ or WCZ effect is specified, the Z flag is set (1) if the result is zero,
  or is cleared (0) if it is not zero.
parameters:
- Dest is the register whose value will have one or more bits set to !Z.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value identifies
  the bit(s) to modify.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set to parity of result
  Z: Set if result equals zero
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 0101111 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: parity of result
  z: Result == 0
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, MUXZ / MUXNZ, p.102"
