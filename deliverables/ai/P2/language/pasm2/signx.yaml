instruction: SIGNX
syntax: SIGNX Dest, {#}Src {WC|WZ|WCZ}
brief_description: Sign extend
category: Math and Logic
description: >-
  SIGNX fills the bits of Dest, above the bit indicated by Src[4:0], with the value of
  that identified bit, i.e. sign-extending the value. This is handy when converting
  encoded or received signed values from a small bit width to a large bit width, i.e. 32
  bits. If the WC or WCZ effect is specified, the C flag is set to the result's MSB
  value. If the WZ or WCZ effect is specified, the Z flag is set (1) if the result is
  zero, or is cleared (0) if it is non-zero.
result: >-
  The Dest value is sign-extended above the bit indicated by Src and is stored in Dest.
  Optionally the C and Z flags are updated to the resulting MSB and zero status.
parameters:
- Dest is a register containing the value to sign-extend above bit Src[4:0] and is
  where the result is written.
- Src is a register or 9-bit literal whose value (lower 5 bits) identifies the bit
  of Dest to sign-extend beyond.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set to MSB of result
  Z: Set if result equals zero
syntax_variants:
- SIGNX D,{#}S {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 0111011 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: MSB of result
  z: Result == 0
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, SIGNX, p.129"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, row 76 (SIGNX D,{#}S {WC/WZ/WCZ}: sign-extend D from bit S[4:0], C = MSB of result; footnote * Z = (result == 0); 2 clocks; write D)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Math and Logic Instructions, p.38 (SIGNX D,{#}S {WC/WZ/WCZ}: sign-extend D from bit S[4:0], C = MSB of result, 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, SIGNX, p.129 (Result line, Dest, Src and effect parameters, encoding row 0111011 CZI, write D, C MSB of result, Z Result = 0, 2 clocks, Related ZEROX, the explanation that the bits above Src[4:0] take the value of that bit, the conversion sentence, the WC rule and the WZ rule; the Src parameter line there says the bit to zero-extend beyond, where the Result line and the explanation say sign-extend)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), instruction encoding listing (EEEE 0111011 CZI DDDDDDDDD SSSSSSSSS SIGNX D,S/# {WC/WZ/WCZ})"
documentation_level: comprehensive
last_updated: '2025-09-19'
manual_extraction_date: '2025-01-19'
oneliner: Sign-extend value beyond designated bit
related:
- ZEROX
