instruction: ZEROX
syntax: ZEROX Dest, {#}Src {WC|WZ|WCZ}
brief_description: Zero extend
category: Math and Logic
description: >-
  ZEROX fills the bits of Dest, above the bit indicated by Src[4:0], with zeros;
  i.e. zero-extending the value. This is handy when converting encoded or
  received unsigned values from a small bit width to a large bit width; i.e. 32
  bits.

  If the WC or WCZ effect is specified, the C flag is set to the result's MSB
  value.

  If the WZ or WCZ effect is specified, the Z flag is set (1) if the result is
  zero, or is cleared (0) if it is non-zero.
result: >-
  The Dest value is zero-extended above the bit indicated by Src and is stored
  in Dest. Optionally the C and Z flags are updated.
parameters:
- Dest is a register containing the value to zero-extend above bit Src[4:0] and
  is where the result is written.
- Src is a register or 9-bit literal whose value (lower 5 bits) identifies the
  bit of Dest to zero-extend beyond.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set to result's MSB value
  Z: Set if result equals zero
syntax_variants:
- ZEROX Dest, {#}Src {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:
- bits: EEEE 0111010 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: MSB of result
  z: Result = 0
  clocks: '2'
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_ds
  pattern: D,S/#
  description: Destination register, Source register or immediate value
  valueType: 0
compiler_encoding:
  operandFormat: 0
