instruction: WRNZ
syntax: WRNZ D
brief_description: Write not Z
category: Math and Logic
description: >-
  WRNZ writes the inverse state of Z (0 or 1) to Dest: Dest = {31'b0, !Z}. If Z is
  set (1), Dest becomes 0. If Z is clear (0), Dest becomes 1.
result: >-
  Dest value is replaced with the inverse state of Z (!Z).
parameters:
- Dest is the register whose value will be replaced with the inverse state of Z (!Z).
flags_affected:
  C: No effect
  Z: No effect
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1101011 000 DDDDDDDDD 001101111
  write: D
  c: —
  z: —
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, WRZ / WRNZ, p.146"
sources:
