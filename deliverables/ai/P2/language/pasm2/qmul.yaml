instruction: QMUL
syntax: QMUL    {#}D,{#}S
encoding:
- bits: EEEE 1101000 0LI DDDDDDDDD SSSSSSSSS
  write: —
  c: —
  z: —
  clocks: '2...9'
timing:
  cycles: "2...9"
  type: variable
description: Multiply D by S, two unsigned 32-bit numbers. GETQX retrieves the lower
  long and GETQY the upper long of the product 55 clocks later.
flags_affected:
  C: No effect
  Z: No effect
long_description: 'QMUL multiplies two unsigned 32-bit numbers (D × S) using the
  hub''s 54-stage pipelined CORDIC solver. Fifty-five clocks after the cog hands the
  command to the CORDIC solver, the lower long of the product is available through
  GETQX and the upper long through GETQY; both wait if the result has not yet arrived.

  Several CORDIC commands can be given to the solver before their results are read,
  because the pipeline is 54 clocks long and each cog''s hub slot comes around every
  8 clocks on the P2.

  '
examples:
- code: ''' Multiply 1000000 by 2000000

    QMUL    ##1000000, ##2000000

    '' Wait 55 clocks...

    GETQX   lower_32       '' Get lower 32 bits

    GETQY   upper_32       '' Get upper 32 bits

    '
  description: Basic large number multiplication
- code: ''' Variable multiplication

    QMUL    multiplicand, multiplier

    '' ... other work for 55 clocks ...

    GETQX   product_low

    GETQY   product_high

    '
  description: Variable unsigned multiplication
- code: ''' Add a product to a 64-bit accumulator

    MOV     acc_low, #0

    MOV     acc_high, #0

    QMUL    a1, b1          '' Start the multiplication

    '' ... 55 clocks of other work ...

    GETQX   prod_low

    GETQY   prod_high

    ADD     acc_low, prod_low WC

    ADDX    acc_high, prod_high  '' Add with carry

    '
  description: Accumulate a 64-bit product
- code: ''' Two multiplications in the CORDIC solver at once

    QMUL    a1, b1          '' Start first multiply

    QMUL    a2, b2          '' Start second multiply

    GETQX   result1_low     '' Get first result

    GETQY   result1_high

    GETQX   result2_low     '' Get second result

    GETQY   result2_high

    '
  description: Two overlapped multiplications
related_instructions:
- GETQX
- GETQY
- QDIV
- QFRAC
related_concepts:
- language/pasm2/concepts/cordic_solver.yaml
operand_details:
  D: First multiplicand (32-bit unsigned)
  S: Second multiplicand (32-bit unsigned)
result_details:
  GETQX: Lower long of the product
  GETQY: Upper long of the product
timing_notes: A cog waits for its hub slot, zero to (cogs-1) clocks away, to hand the
  command to the CORDIC solver. Fifty-five clocks later the results are available
  via GETQX and GETQY. With interrupts enabled while CORDIC commands overlap, an
  interrupt service routine can steal enough clocks that one or more results are
  overwritten before they are read; language/pasm2/concepts/cordic_solver.yaml
  (interrupt_protection) shows how to shield such a sequence from interrupts.
documentation_source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet Release November 1, 2022 (2022/11/01), CORDIC Solver, p.20, and CORDIC Solver Instructions, p.44; Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), CORDIC SOLVER (MULTIPLY) and OVERLAPPING CORDIC COMMANDS (interrupts during overlapped commands); P2 Instructions v35 - Rev B/C Silicon, Sheet1"
documentation_level: comprehensive
