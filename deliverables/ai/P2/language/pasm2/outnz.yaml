  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Pin instructions, p.39 (OUTNZ {#}D {WCZ}, 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, OUTZ / OUTNZ, p.110 (Result line, Dest and WCZ parameters, encoding row 001001101, write OUTx, C and Z Orig OUTx base bit, 2 clocks; Dest[5:0], Dest[10:6], the 9-bit literal range of Dest[8:6], ##Dest, the SETQ substitution, the wrap within OUTA or OUTB, C and Z set to the original state of the base bit)"
