instruction: OUTNZ
syntax: OUTNZ   {#}D           {WCZ}
category: Pin
description: >-
  OUTNZ alters the output level register's bit(s) designated by Dest to equal the
  inverse state of the Z flag (!Z). All other bits are left as-is.

  Dest[5:0] indicates the pin number (0-63). For a range of pins, Dest[5:0] indicates
  the base pin number (0-63) and Dest[10:6] indicates how many contiguous pins beyond
  the base should be affected (1-31).

  A 9-bit literal Dest is enough to express the base pin (Dest[5:0]) and a range of
  up to 8 contiguous pins (Dest[8:6]). If needed, use the augmented literal feature
  (##Dest) to augment Dest to an 11-bit literal value-- this inserts an AUGD
  instruction prior.

  When Dest is a register, the register's value bits [10:0] are used as-is to form
  the 11-bit ID range, unless a prior SETQ overrides value bits[10:6] with the low
  five bits of the SETQ value. An ALTx between the SETQ and OUTNZ keeps the
  override, and a SETQ separated from OUTNZ by other instructions is not documented.

  The range calculation (from Dest[5:0] up to Dest[5:0]+Dest[10:6]) will wrap within
  the same 32-pin group (OUTA or OUTB); it will not cross the port boundary.

  If the WCZ effect is specified, the C and Z flags are set to the original
  (pre-instruction) state of the base pin's OUT bit (OUTA / OUTB), identified by Dest.
result: >-
  The I/O pin output level bit(s), described by Dest, are set to !Z;
  the rest are left as-is. With WCZ, C and Z = original (pre-instruction) state of the base pin's OUT bit.
parameters:
- Dest is the register, 9-bit literal, or 11-bit augmented literal whose value identifies
  the I/O pin(s) whose output levels are set to !Z.
- WCZ is an optional effect to update flags.
flags_affected:
  C: Set to the original (pre-instruction) state of the base pin's OUT bit
  Z: Set to the original (pre-instruction) state of the base pin's OUT bit
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1101011 CZL DDDDDDDDD 001001101
  write: OUTx
  c: Orig OUTx base bit
  z: Orig OUTx base bit
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, OUTZ / OUTNZ, p.110"
sources:
