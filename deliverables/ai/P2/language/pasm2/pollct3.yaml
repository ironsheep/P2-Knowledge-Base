  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Event instructions, p.43 (POLLCT3 {WC/WZ/WCZ}, 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, POLLCT1/2/3, pp.111-112 (Result line, WC / WZ / WCZ parameter, encoding row 000000011 / 000100100, write none, C and Z CT3 Event, 2 clocks, Related list, the copy-then-clear and update-C-and/or-Z explanation on p.111; the System Counter pass rule and the clearing list ADDCTx, POLLCTx, WAITCTx, JCTx, JNCTx on p.112)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), EVENTS (the POLLxxx instructions simultaneously return their event-occurred flag into C and/or Z and clear it unless it is set again by the event sensor; POLLCT3 event flag: cleared on ADDCT3, set whenever CT passes the result of the ADDCT3 (MSB of CT minus CT3 is 0), also cleared on POLLCT3 / WAITCT3 / JCT3 / JNCT3), instruction encoding listing (EEEE 1101011 CZ0 000000011 000100100 POLLCT3 {WC/WZ/WCZ})"
