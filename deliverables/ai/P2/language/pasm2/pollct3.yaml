instruction: POLLCT3
syntax: POLLCT3 {WC|WZ|WCZ}
brief_description: Poll CT3 event flag
category: Event
description: >-
  POLLCT3 copies the state of the counter 3 event flag into C and/or Z and then clears
  the flag (unless it's being set again by the event sensor).
  If the WC, WZ, or WCZ effect is specified, the C flag and/or Z flag is updated to
  the state of the counter 3 event flag prior to clearing it.
  The counter 3 event flag is set whenever the System Counter (CT) passes the value
  in the CT3 event trigger register; i.e. MSB of (CT - CT3) is 0. The counter 3 event
  flag is cleared upon execution of ADDCT3, POLLCT3, WAITCT3, JCT3, or JNCT3.
result: CT3 event flag state is optionally copied into C and/or Z, then the flag is cleared.
flags_affected:
  C: Set to CT3 event flag state
  Z: Set to CT3 event flag state
parameters:
- WC, WZ, or WCZ are optional effects to update flags.
syntax_variants:
- POLLCT3 {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 1101011 CZ0 000000011 000100100
  write: —
  c: CT3 Event
  z: CT3 Event
  clocks: '2'
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, POLLCT1/2/3, pp.111-112"
sources:
