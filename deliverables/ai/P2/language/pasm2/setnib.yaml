instruction: SETNIB
syntax: 'SETNIB Dest, {#}Src, #Num'
brief_description: Set nibble
category: Math and Logic
description: >-
  SETNIB stores Src[3:0] into the nibble identified by Num within Dest, or the nibble and
  register described by a prior ALTSN instruction. No other bits are modified. Num (0-7)
  identifies a value's individual nibbles, by position, in least-significant nibble
  order. Syntax 2 is intended for use after an ALTSN instruction, i.e. in a loop to
  iteratively affect a series of nibble values within contiguous long registers.
result: >-
  Src[3:0] is written to nibble Num (0-7) of Dest, or to another register nibble
  described by prior ALTSN instruction.
parameters:
- Dest is the register in which to modify a nibble.
- Src is a register or 4-bit literal whose bits [3:0] will be stored in the designated
  location.
- Num is a 3-bit literal identifying the nibble ID (0-7) of Dest to modify.
flags_affected:
  C: No effect
  Z: No effect
syntax_variants:
- 'SETNIB D,{#}S,#N'
- SETNIB {#}S
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 100000N NNI DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2'
- bits: EEEE 1000000 00I 000000000 SSSSSSSSS
  write: D   1
  c: —
  z: —
  clocks: '2'
encoding_notes:
- Dest, and the target nibble ID, is speciﬁed by a prior ALTSN instruction.
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_ds3set
  pattern: S/#{,D,#0..7}
  description: 'Set nibble: source/immediate, optional destination and nibble index
    0-7'
  valueType: 6
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 6
