instruction: SETNIB
syntax: 'SETNIB Dest, {#}Src, #Num'
brief_description: Set nibble
category: Math and Logic
description: >-
  SETNIB stores Src[3:0] into the nibble identified by Num within Dest, or the nibble and
  register described by a prior ALTSN instruction. No other bits are modified. Num (0-7)
  identifies a value's individual nibbles, by position, in least-significant nibble
  order. Syntax 2 is intended for use after an ALTSN instruction, i.e. in a loop to
  iteratively affect a series of nibble values within contiguous long registers. SETNIB
  {#}Src is the same as SETNIB 0,{#}Src,#0, with the Dest field and Num filled in
  by the prior ALTSN.
result: >-
  Src[3:0] is written to nibble Num (0-7) of Dest, or to another register nibble
  described by prior ALTSN instruction.
parameters:
- Dest is the register in which to modify a nibble.
- Src is a register or 4-bit literal whose bits [3:0] will be stored in the designated
  location.
- Num is a 3-bit literal identifying the nibble ID (0-7) of Dest to modify.
flags_affected:
  C: No effect
  Z: No effect
syntax_variants:
- 'SETNIB D,{#}S,#N'
- SETNIB {#}S
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See language/pasm2/concepts/instruction_encoding_key.yaml
- bits: EEEE 100000N NNI DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2'
- bits: EEEE 1000000 00I 000000000 SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2'
encoding_notes:
- Dest, and the target nibble ID, is specified by a prior ALTSN instruction.
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, SETNIB, pp.125-126"
sources:
  - "P2 Instructions v35 - Rev B/C Silicon, rows 84-85 (SETNIB D,{#}S,#N: set S[3:0] into nibble N in D, keeping rest of D same; SETNIB {#}S: set S[3:0] into nibble established by prior ALTSN instruction; 2 clocks; write D) and rows 102-103 (ALTSN: next D field and N field = D[2:0] for the subsequent SETNIB)"
  - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Math and Logic Instructions, p.38 (SETNIB {#}S and SETNIB D,{#}S,#N, 2 clocks)"
  - "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, SETNIB, pp.125-126 (Result line, Dest, Src and Num parameters, both encoding rows 100000N NNI / 1000000 00I, write D, C and Z none, 2 clocks, footnote that Dest and the target nibble ID are specified by a prior ALTSN instruction, Related list, the explanation on p.125; Num 0-7 in least-significant nibble order and syntax 2 after ALTSN on p.126)"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), REGISTER INDIRECTION (ALTSN sets the next D field to base+index[11:3] and the next N to index[2:0]; 'SETNIB S/#' = 'SETNIB 0,S/#,#0'; two of the three fields of the associated instruction are filled in by the ALTxx instruction), and instruction encoding listing (EEEE 100000N NNI DDDDDDDDD SSSSSSSSS SETNIB D,S/#,#N)"
