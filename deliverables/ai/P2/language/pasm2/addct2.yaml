instruction: ADDCT2
syntax: ADDCT2 Dest, {#}Src
encoding:
- bits: EEEE 1010011 01I DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: ADDCT2 sets the hidden CT2 event trigger register to the value of Dest + Src. The result is also written to Dest. The CT-passed-CT2 event flag is set whenever the MSB of (CT - CT2) is 0, and ADDCT2 clears it. Parallax's documents also give the event as triggering when System Counter (CT) = original Dest + Src. Use the POLLCT2, WAITCT2, JCT2, and JNCT2 instructions to process CT2 time-based events.
flags_affected:
  C: No effect
  Z: No effect
documentation_source: "Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, ADDCT1/2/3, p.32; Parallax Propeller 2 Documentation v35 Rev B/C Silicon, EVENTS (POLLCT2/WAITCT2 event flag, p.46)"
documentation_level: comprehensive
syntax_variants:
- ADDCT2 Dest, {#}Src
last_updated: '2025-09-19'
brief_description: Add and set CT2 event trigger
category: Event
result: The Src value is added into Dest and the result is also stored in the hidden CT2 event trigger register.
parameters:
- Dest is a register containing the value to add Src to, and is where the result is
  written.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value is added
  into Dest.
related:
- POLLCTx
- WAITCTx
- JCTx
- JNCTx
manual_extraction_date: '2025-01-19'
oneliner: Set CT2 counter event trigger time
