# Language Fundamental: Variable Scoping and Best Practices
# Source: Spin2 documentation, observed compiler behavior
# Critical for: Avoiding naming conflicts, preventing bugs

fundamental: "Variable Scoping and Best Practices"
category: "language_basics"
type: "scoping_rules"
applies_to: ["spin2"]

metadata:
  query_tags: ["scope", "shadow", "shadowing", "variable", "local", "VAR", "DAT", "conflict", "duplicate", "naming", "precedence"]
  complexity: "intermediate"
  critical_for_ai: true
  prevents_bugs: ["duplicate names rejected by the compiler", "unintended variable access", "scope confusion"]
  common_mistakes:
    - "Using the same name for a parameter, result or local and for a VAR/DAT/CON symbol (a compile error, not shadowing)"
    - "Expecting local variable changes to affect VAR variables"
    - "Expecting a result name to hide a VAR/DAT name (the compiler rejects the duplicate)"

names_are_unique:
  rule: "Spin2 has no shadowing. A parameter, result or local variable may not share a name with a VAR, DAT or CON symbol of the same object, nor with another parameter, result or local of its own method; names are not case-sensitive. The compiler rejects the duplicate."
  compiler_errors:
    parameter_vs_other_symbol: "Expected a unique parameter name (m221)"
    result_vs_other_symbol: "Expected a unique result name (m230)"
    local_vs_other_symbol: "Expected a unique variable name, STRUCT name, BYTE, WORD, LONG, \"^\", ALIGNW, or ALIGNL (m241)"
  consequence: "No scope hides another, so no precedence order exists; give every symbol of an object a distinct name."

detailed_scoping_rules:
  method_scope:
    description: "Parameters, returns, and locals exist only during method execution"
    lifetime: "Created on method entry, destroyed on method exit"
    initialization: "Results and local variables are initialized to zero on method entry; parameters take the values the caller passes"
    visibility: "Only within the method"
    
  var_scope:
    description: "Instance variables - each object has its own copy"
    lifetime: "Exists for lifetime of object instance"
    initialization: "Initialized to 0 when object created"
    visibility: "All methods within the object"
    
  dat_scope:
    description: "Shared (class) variables - all instances of one compiled object image share the same memory; a CON override that changes the image bytes gives an instance its own DAT (see language/spin2/concepts/object-image-dedup.yaml)"
    lifetime: "Exists for program lifetime"
    initialization: "Can be pre-initialized with data"
    visibility: "All methods in all instances of the object"

duplicate_names:
  definition: "A parameter, result or local variable given the same name as a VAR, DAT or CON symbol of the same object"
  behavior: "The compiler rejects it; the program does not build"

  example:
    code: |
      VAR
        LONG count           ' Object-level variable

      PUB method(value) : count | temp
        ' error: 'count' already names the VAR variable
        count := value * 2

    issue: "The result name 'count' duplicates the VAR 'count'"
    result: "Compile error: Expected a unique result name (m230)"

critical_best_practice:
  rule: "AVOID NAMING CONFLICTS"
  rationale: "A duplicate name is a compile error"

  implementation:
    - "Use distinct names for all variables in different scopes"
    - "Never reuse VAR/DAT names as parameters, returns, or locals"
    - "Consider prefixes or suffixes to distinguish scope"

naming_strategies:
  prevent_conflicts:
    var_variables:
      convention: "Use descriptive object-state names"
      examples: ["motor_speed", "sensor_value", "buffer_index"]
      
    parameters:
      convention: "Prefix with 'p' or use descriptive parameter names"
      examples: ["pSpeed", "new_value", "input_data"]
      
    return_values:
      convention: "Use 'result' or descriptive return names"
      examples: ["result", "success", "calculated_value"]
      
    local_variables:
      convention: "Use 'temp' prefix or descriptive temporary names"
      examples: ["temp", "temp_sum", "loop_counter"]

common_duplicate_name_scenarios:
  - scenario: "return_duplicates_var"
    problematic_code: |
      VAR
        LONG status

      PUB check_device() : status
        ' error (m230): the result name 'status' already names the VAR
        status := read_register()

    fixed_code: |
      VAR
        LONG device_status
        
      PUB check_device() : result
        result := read_register()
        device_status := result     ' Explicitly update VAR if needed
  
  - scenario: "parameter_duplicates_dat"
    problematic_code: |
      DAT
        buffer    BYTE  0[256]

      PUB fill_buffer(buffer, size)
        ' error (m221): the parameter name 'buffer' already names the DAT symbol
        BYTEFILL(buffer, 0, size)

    fixed_code: |
      DAT
        data_buffer    BYTE  0[256]
        
      PUB fill_buffer(buffer_addr, size)
        BYTEFILL(buffer_addr, 0, size)
  
  - scenario: "local_duplicates_var"
    problematic_code: |
      VAR
        LONG index

      PUB process() | index
        ' error (m241): the local name 'index' already names the VAR
        REPEAT index FROM 0 TO 9
          do_something(index)
    
    fixed_code: |
      VAR
        LONG current_index
        
      PUB process() | i
        REPEAT i FROM 0 TO 9
          do_something(i)
          current_index := i   ' Update VAR if needed

register_mapping_note:
  detail: "In-line PASM code can reach the method's first 16 longs (parameters, results and locals) as cog registers $1E0..$1EF, under the same symbolic names. They are copied in from hub RAM before the in-line PASM code runs and restored to hub RAM after it returns."
  source: "Parallax Propeller 2 Spin2 Language Documentation v55, In-line PASM Code"

debugging_duplicate_names:
  symptoms:
    - "The compiler stops with Expected a unique parameter name (m221), Expected a unique result name (m230) or Expected a unique variable name (m241)"

  diagnosis:
    - "Look for a parameter, result or local whose name is also a VAR, DAT or CON symbol of the object (names are not case-sensitive)"
    - "Rename one of them; use distinct names to eliminate ambiguity"

ai_code_generation_rules:
  mandatory:
    - "NEVER use same identifier for variables in different scopes"
    - "ALWAYS use distinct names for parameters vs VAR/DAT"
    - "ALWAYS use distinct names for return variables vs VAR/DAT"
    - "ALWAYS use distinct names for local variables vs VAR/DAT"
    
  recommended:
    - "Use naming conventions to indicate scope"
    - "Prefer 'result' for single return values"
    - "Use descriptive names that include scope hints"

related_documentation:
  - "p2kbLanguageCaseSensitivity"
  - "p2kbLanguageIdentifierRules"
  - "p2kbSpin2MethodDefinition"
  - "p2kbSpin2KwVAR"
  - "p2kbSpin2KwDAT"