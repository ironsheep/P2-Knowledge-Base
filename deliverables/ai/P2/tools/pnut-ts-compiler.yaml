# P2 Knowledge Base - PNut-TS Compiler Guide
# Key: p2kbToolsPnutTsCompiler
key: p2kbToolsPnutTsCompiler
category: tools
subcategory: compiler
title: "PNut-TS Compiler Usage Guide"
description: "Guide for using pnut-ts and pnut-term-ts to compile and download P2 Spin2/PASM2 code"

overview: |
  The P2 Spin2/PASM2 compiler (pnut-ts) and terminal/downloader (pnut-term-ts) are
  available for validating and compiling P2 code. These tools enable:
  - Validating code snippets in documentation
  - Generating binary and listing files
  - Downloading compiled code to P2 hardware
  - Debugging compilation issues
  - Ensuring examples are syntactically correct

pnut-ts:
  description: "P2 Spin2/PASM2 compiler"

  basic_usage:
    - command: "pnut-ts filename.spin2"
      description: "Compile to .bin file"
    - command: "pnut-ts -l filename.spin2"
      description: "Compile with listing file (.lst)"
    - command: "pnut-ts -d filename.spin2"
      description: "Compile with DEBUG enabled - activates all DEBUG() statements in code"
    - command: "pnut-ts -d -l filename.spin2"
      description: "Compile with DEBUG enabled and generate listing file"
    - command: "pnut-ts -q filename.spin2"
      description: "Quiet mode (suppress banner and non-error text)"

  common_options:
    - option: "-l, --list"
      description: "Generate listing files (.lst) from compilation"
    - option: "-v, --verbose"
      description: "Output verbose messages"
    - option: "-q, --quiet"
      description: "Quiet mode (suppress banner and non-error text)"
    - option: "-o, --output <name>"
      description: "Specify output file basename"
    - option: "-d, --debug"
      description: "Compile with DEBUG"
    - option: "-F, --flashfile"
      description: "Generate FLASH image file (.flash) suitable for writing to flash chip"
    - option: "-D, --Define <symbol...>"
      description: "Define (add) preprocessor symbol(s)"
    - option: "-I, --Include <dir...>"
      description: "Add preprocessor include directories"
    - note: "Run pnut-ts --help for the complete option list; the compiler's own help is the authority."

  validation_workflow:
    step1_validate:
      description: "Validate documentation code snippet"
      example: |
        # Save the snippet in test.spin2, then compile it to check syntax
        pnut-ts -q test.spin2

    step2_listing:
      description: "Generate listing for analysis"
      example: |
        pnut-ts -l example.spin2
        cat example.lst    # View compiled output

    step3_includes:
      description: "Check include paths"
      example: |
        pnut-ts -I /path/to/includes main.spin2

  error_messages: "The compiler's error wording is its own and changes between releases; read the message pnut-ts prints rather than matching on a remembered string."

pnut-term-ts:
  description: "P2 terminal and downloader"
  usage: "Run pnut-term-ts --help for its options and defaults; they are not reproduced here."

  workflow:
    description: "Typical compile-download-debug workflow"
    example: |
      # Compile the code
      pnut-ts -l myprogram.spin2

      # Then download myprogram.bin and open the terminal with pnut-term-ts
      # (its options: pnut-term-ts --help)

best_practices:
  - "Always validate code with pnut-ts -q before including in documentation"
  - "Use listing files (-l) to verify instruction encodings when documenting opcodes"
  - "Use quiet mode (-q) for automated validation scripts"
  - "Check exit code ($?) to determine compilation success in scripts"

platform_compatibility:
  - "Multi-platform: macOS, Linux, Windows"
  - "Command-line based (no GUI required)"
  - "Suitable for CI/CD pipelines"
  - "Fast enough for real-time validation"

related:
  - p2kbGuidePasm2GettingStarted
  - p2kbGuideSpin2GettingStarted
