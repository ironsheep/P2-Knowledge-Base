title: PASM2 Getting Started - Core Assembly Essentials
id: pasm2-getting-started
version: 1.2.0
content_base: "language/pasm2"
# content_base names where this guide's subject content lives; it is NOT a resolution
# base. Every path in this file is repo-absolute and resolves on its own. Do not write a
# path relative to content_base: entries here point outside it (architecture/), so a
# reader cannot tell which base a bare path meant.
layer: "Foundation - Assembly Mechanics"
purpose: Minimal viable knowledge for writing functional PASM2 code
target_audience: AI code generators and developers new to PASM2 assembly

summary: |
  Essential PASM2 assembly mechanics needed to start writing functional code immediately. Covers instruction
  format, register model, core instructions, addressing modes, and common idioms. Foundation knowledge for
  productive P2 assembly programming.

description: |
  This is the foundation layer for PASM2 knowledge - pure instruction mechanics and register model. After
  reading this, you can write syntactically correct PASM2 code using common instructions and patterns.
  Reference detailed instruction documentation for advanced features.

knowledge_progression:
  you_are_here: "Layer 1 - Essential Assembly Mechanics"
  
  pre_requisite:
    ESSENTIAL:
      - name: "P2 Architecture Mental Model"
        content: "architecture/p2-architecture-mental-model.yaml"
        key: p2kbArchP2ArchitectureMentalModel
        why: "Understand COG independence, execution models (cogexec vs hubexec), Egg Beater timing, shared resources, and smart pin offloading. Must read BEFORE writing code."
        when: "Read first, before this guide"

  immediate_next_steps:
    REQUIRED:
      - name: "Basic I/O Concepts"
        content: "language/pasm2/concepts/basic-io.yaml"
        why: "Essential for any pin I/O - covers multi-pin operations, ADDPINS, and drive strength"
        when: "Read immediately after Getting Started, before writing I/O code"
        
    THEN_CHOOSE:
      - name: "Smart Pin Modes"
        content: "architecture/smart_pins.yaml"
        when: "Need autonomous hardware (PWM, UART, ADC, counters, etc.)"
      - name: "CORDIC Operations"
        content: "architecture/cordic.yaml"
        when: "Need math coprocessor (trig, logs, rotation)"
      - name: "Streamer"
        content: "architecture/streamer/overview.yaml"
        when: "Need high-speed pin sequencing (video, audio)"
  
  note: "Basic I/O concepts are NOT optional - they're foundational for all pin operations"

file_structure:
  source: "Parallax Propeller 2 Spin2 Language Documentation v55, Minimal PASM Program; DAT; Clock Setup; Parallax Propeller 2 (P2X8C4M64P) Datasheet, Release November 1, 2022, register map, p.13-14"

  overview: |
    PASM2 code lives in a DAT block of a Spin2 source file; there is no separate
    PASM2-only file format. A PASM-only program is a file whose DAT block begins
    with ORG (cog-exec) or ORGH (hub-exec) and which has no PUB method.

  minimal_program:
    description: "The Parallax minimal PASM-only program, verbatim from Spin2 v55 -- reproduced here in its own line layout."
    source: "Parallax Spin2 Documentation v55, engineering/ingestion/sources/spin2-v55/spin2-v55-text.txt:188"
    example: |
      DAT             ORG                      'start PASM at hub $00000 for cog $000
      loop            DRVRND  #0 ADDPINS 7     'write a random pattern to P7..P0
                      WAITX   ##clkfreq_/10    'wait 100ms (## for >9 bits), loop
                      JMP     #loop
    why_waitx_not_waitms: "WAITMS and WAITUS are Spin2 METHODS, not PASM2 instructions. In a PASM-only program the delay is WAITX, whose operand is a clock count -- which is why the source's own example computes it from the compiler-defined constant clkfreq_."

  clock_setup:
    source: "Parallax Propeller 2 Spin2 Language Documentation v55, Clock Setup; Parallax Propeller 2 (P2X8C4M64P) Datasheet, Release November 1, 2022, AC Characteristics, p.48 (frequency limits)"
    default: "With no clock-setup symbol declared and not in DEBUG mode, the compiler selects internal RCFAST, which runs at 20 MHz+. No clock symbol is required: _clkfreq is OPTIONAL, and a PASM-only program that declares none compiles and runs at RCFAST. With no symbol but DEBUG mode active, the compiler instead selects XI/XO-crystal mode at 20 MHz to facilitate DEBUG."
    why_the_default_bites: "The default is silent. A PASM-only program whose WAITX operands were computed for 200 MHz, but which declares no clock symbol, runs at RCFAST (20 MHz+, datasheet typical 24 MHz) and every delay is wrong by an order of magnitude with no diagnostic. Either declare the mode you intend (below), or compute delays from the compiler constant clkfreq_, which always tracks the mode actually compiled."
    how_to_declare: "The clock is selected at COMPILE time by declaring CON symbols. The compiler recognises the following combinations and no others; the HUBSET %CC_SS column is the clock-mode value the compiler derives, which is what the compiler constant clkmode_ carries and what HUBSET is invoked with."
    declaration_combinations:
      - con_symbols: "CON _clkfreq = 250_000_000, _errfreq = 0"
        effect: "Selects XI/XO-crystal-plus-PLL mode, assumes 20 MHz crystal. The optimal PLL setting will be computed to achieve _clkfreq. Compilation fails if _clkfreq +/- _errfreq is unachievable."
        hubset_cc_ss: "%10_11"
        source_reference: 1711
      - con_symbols: "CON _xtlfreq = 12_000_000, _clkfreq = 148_500_000, _errfreq = 150_000"
        effect: "Selects XI/XO-crystal-plus-PLL mode, along with frequencies. The optimal PLL setting will be computed to achieve _clkfreq. Compilation fails if _clkfreq +/- _errfreq is unachievable."
        hubset_cc_ss: "%1x_11"
        source_reference: 1712
      - con_symbols: "CON _xinfreq = 32_000_000, _clkfreq = 297_500_000, _errfreq = 100_000"
        effect: "Selects XI-input-plus-PLL mode, along with frequencies. The optimal PLL setting will be computed to achieve _clkfreq. Compilation fails if _clkfreq +/- _errfreq is unachievable."
        hubset_cc_ss: "%01_11"
        source_reference: 1713
      - con_symbols: "CON _xtlfreq = 16_000_000"
        effect: "Selects XI/XO-crystal mode and frequency."
        hubset_cc_ss: "%1x_10"
        source_reference: 1714
      - con_symbols: "CON _xinfreq = 100_000_000"
        effect: "Selects XI-input mode and frequency."
        hubset_cc_ss: "%01_10"
        source_reference: 1715
      - con_symbols: "CON _rcslow"
        effect: "Selects internal RCSLOW oscillator which runs at ~20 KHz."
        hubset_cc_ss: "%00_01"
        source_reference: 1716
      - con_symbols: "CON _rcfast"
        effect: "Selects internal RCFAST oscillator which runs at 20 MHz+."
        hubset_cc_ss: "%00_00"
        source_reference: 1717
      - con_symbols: "No symbol and not DEBUG mode"
        effect: "Selects internal RCFAST oscillator which runs at 20 MHz+."
        hubset_cc_ss: "%00_00"
        source_reference: 1718
      - con_symbols: "No symbol and DEBUG mode"
        effect: "Selects XI/XO-crystal mode and 20 MHz to facilitate DEBUG."
        hubset_cc_ss: "%10_10"
        source_reference: 1719
    errfreq_is_optional: "_errfreq is optional wherever the table shows it; it defaults to 1_000_000. All three PLL forms above were confirmed to compile without it."
    the_x_bit: "In the %1x_ CC values, x is the crystal-loading bit: if _xtlfreq >= 16_000_000 then x=0, for 15 pF per XI/XO; otherwise x=1, for 30 pF per XI/XO."
    combinations_are_compiler_verified: "Every form above was assembled clean by pnut-ts (v1.55.3) inside a PASM-only file. That establishes LEGALITY only -- the effect and %CC_SS columns are v55's statements, not the compiler's."
    when_declared: "PASM-only programs which use any non-RCFAST clock mode get a 16-long clock-setter program automatically prepended, which sets the clock mode, moves your PASM program down by 16 longs, then executes it by doing a COGINIT #0,#0, to effect a normal start. This is why ASMCLK is no longer needed at the start of a PASM-only program (as of v35v)."
    inhibiting_it: "Declare _AUTOCLK = 0 to stop the clock-setter program from being prepended; your code then begins executing with the default RCFAST mode. If you then want another clock mode you must configure the clock yourself, perhaps using ASMCLK."
    asmclk: "ASMCLK is a PASM-only pseudo-instruction that sets the clock mode named by the clock-setup symbols. It has no operands but may take a conditional prefix, and assembles to one or six PASM instructions depending on the mode: HUBSET #0 for _rcfast, HUBSET #1 for _rcslow, and the six-long crystal/PLL start sequence shown under manual_switch_example for every external-clock form. Measured: with _AUTOCLK = 0 and an external-clock declaration, adding ASMCLK grew a pnut-ts build by exactly 6 longs; with _rcfast it grew it by 1."
    manual_switch: "Without the prepended clock-setter (or with _AUTOCLK = 0), a pure PASM program moves off its initial RCFAST setting to the compiled crystal/PLL setting with the sequence v55 gives for clkmode_."
    manual_switch_example: |
      HUBSET  ##clkmode_ & !%11   'start crystal/PLL, stay in RCFAST mode
      WAITX   ##20_000_000/100    'allow 10ms for the external clock to stabilise
      HUBSET  ##clkmode_          'switch to crystal/PLL
    compiler_constants: "clkfreq_ (compiled clock frequency) and clkmode_ (compiled clock mode) are defined by the compiler and may be referenced as constants in PASM-only programs. Both may differ per file in the application hierarchy; files below the top-level file do not inherit the top-level value."
    what_value_is_legal: "The P2 Datasheet AC Characteristics give the PLL absolute maximum as 320 MHz (typical 180 MHz), so a _clkfreq above 320 MHz is outside the datasheet's limits even where the compiler accepts it. The full min/typ/max table for every oscillator source is under timing_considerations.clock_frequency in this file."
    see_also:
      asmclk_instruction:
        key: p2kbPasm2Asmclk
        path: language/pasm2/asmclk.yaml
        description: "ASMCLK -- full instruction entry"
      hubset_instruction:
        key: p2kbPasm2Hubset
        path: language/pasm2/hubset.yaml
        description: "HUBSET -- the instruction the %CC_SS clock-mode value is written with"
      per_symbol_reference:
        key: p2kbSpin2SpecialConfigurationSymbols
        path: language/spin2/constants/special-configuration-symbols.yaml
        description: "_clkfreq, _xtlfreq, _xinfreq, _errfreq, _rcfast, _rcslow, _AUTOCLK -- one entry per symbol"
      clock_system:
        key: p2kbArchClockSystem
        path: architecture/clock_system.yaml
        description: "the P2 clock system -- oscillators, PLL, and mode switching"

  cog_vs_hub_execution:
    cog_exec:
      directive: "ORG"
      v55_statement: "ORG -- set cog-exec mode, cog address = $000, cog limit = $1F8 (reg, both defaults)"
      variants:
        - "ORG $100 -- cog address = $100, cog limit = $1F8 (reg, default limit)"
        - "ORG $100,$120 -- cog address = $100, cog limit = $120 (reg)"
        - "ORG $200 -- cog address = $200, cog limit = $400 (LUT, default limit)"
        - "ORG $300,$380 -- cog address = $300, cog limit = $380 (LUT)"
      no_symbol_before: "No symbol allowed before ORG."
      origin_step: "$ is the current origin, which steps by 1 with each cog-exec instruction."
      alignment: "In cog-exec mode, instructions force alignment to cog/LUT registers."
    hub_exec:
      directive: "ORGH"
      v55_statement: "ORGH -- set hub-exec mode, hub origin = $00400, origin limit = $100000 (both defaults)"
      variants:
        - "ORGH $1000 -- hub origin = $01000, origin limit = $100000 (default limit)"
        - "ORGH $FC000,$FC800 -- hub origin = $FC000, origin limit = $FC800 (a syntax illustration: it assembles in a Spin2+PASM program; in a PASM-only program ORGH fills the hub image with zeros up to the address)"
      no_symbol_before: "No symbol allowed before ORGH."
      origin_step: "$ is the current origin, which steps by 4 with each hub-exec instruction."

  size_checking:
    fit: "FIT $020 -- test to make sure cog address has not exceeded $020. FIT $2000 -- test to make sure hub address has not exceeded $2000."
    matching_the_default: "ORG's default cog limit is $1F8, so FIT $1F8 is the check that matches an unqualified ORG."
    why_1F8: "Registers $1F8 through $1FF give mapped access to eight special-purpose functions (PTRA, PTRB, DIRA, DIRB, OUTA, OUTB, INA, INB) -- when specifying an address between $1F8 and $1FF, the PASM instruction accesses a special-purpose register, not just the underlying RAM. Registers $1F0 through $1F7 may either be used as general-purpose registers, or may be used as special-purpose registers (IJMP3/IRET3/IJMP2/IRET2/IJMP1/IRET1/PA/PB) if their associated functions are enabled -- so code that uses no interrupts and no PA/PB may run up to $1F8."
    orgf: "ORGF $040 -- fill to cog address $040 with zeros (no symbol allowed before ORGF)."
    res: "x RES 1 -- reserve 1 register, advance cog address by 1, don't advance hub address."

instruction_format:
  basic_syntax:
    format: "INSTRUCTION  destination, source"
    examples:
      - "MOV      x, y             ' Copy y to x"
      - "ADD      total, value     ' Add value to total"
      - "JMP      #loop            ' Jump to label"
      
  operand_types:
    register:
      description: "Cog register $000-$1FF (LUT RAM is reached with RDLUT/WRLUT, not as an operand)"
      syntax: "regname"
      example: "MOV  x, y"
      
    immediate:
      description: "Literal value (9-bit or 32-bit with ##)"
      syntax: "#value or ##value"
      examples:
        - "MOV  x, #100         ' 9-bit immediate (0-511)"
        - "MOV  x, ##1000       ' 32-bit immediate (any value)"
        
    address:
      description: "Label or address"
      syntax: "#label"
      example: "JMP  #loop"

  instruction_effects:
    WC:
      description: "Write C flag with result"
      usage: "Affects carry flag based on operation"
      example: "ADD  x, y  WC      ' C = carry out of the 32-bit add"
      
    WZ:
      description: "Write Z flag with result"
      usage: "Affects zero flag based on result"
      example: "CMP  x, y  WZ      ' Set Z if equal"
      
    WCZ:
      description: "Write both C and Z flags"
      usage: "Combined flag updates"
      example: "SUB  x, y  WCZ     ' C = borrow of (x - y), Z = result is zero"

register_model:
  source: "P2 Documentation -- engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:139 (512 KB hub RAM), :153-154 and :472 (register and lookup RAM), :437-467 (register map); hub and LUT access from the P2 Instructions v35 Rev B/C spreadsheet -- engineering/ingestion/sources/p2-instructions-csv/P2 Instructions v35 - Rev B_C Silicon - Sheet1.csv, order 151-154, 220-223"
  cog_registers:
    size: "512 longs of dual-port register RAM, $000-$1FF"
    general_purpose: "$000-$1EF -- general-purpose registers for code and data"
    dual_purpose: "$1F0-$1F7 -- general-purpose, or special-purpose when their associated functions are enabled ($1F0-$1F5 are the interrupt IJMP/IRET registers; $1F6/$1F7 are PA/PB)"

  special_registers:
    PA: {address: "$1F6", role: "CALLD-imm return, CALLPA parameter, or LOC address (dual-purpose RAM)"}
    PB: {address: "$1F7", role: "CALLD-imm return, CALLPB parameter, or LOC address (dual-purpose RAM)"}
    PTRA: {address: "$1F8", role: "pointer A to hub RAM"}
    PTRB: {address: "$1F9", role: "pointer B to hub RAM"}
    DIRA: {address: "$1FA", role: "output enables for P31..P0"}
    DIRB: {address: "$1FB", role: "output enables for P63..P32"}
    OUTA: {address: "$1FC", role: "output states for P31..P0"}
    OUTB: {address: "$1FD", role: "output states for P63..P32"}
    INA: {address: "$1FE", role: "input states for P31..P0; also the debug interrupt call address"}
    INB: {address: "$1FF", role: "input states for P63..P32; also the debug interrupt return address"}

  lut_memory:
    size: "512 longs of dual-port lookup RAM per cog, for code, streamer lookup, and variables"
    access: "RDLUT D,{#}S/P (3 clocks); WRLUT {#}D,{#}S/P (2 clocks)"

  hub_memory:
    size: "512 KB, shared by all cogs"
    access: "RDBYTE/RDWORD/RDLONG and WRBYTE/WRWORD/WRLONG"
    timing: "RDLONG 9...16 clocks (cog exec) / 9...26 (hub exec); WRLONG 3...10 / 3...20"

core_instructions:
  source: "P2 Instructions v35 Rev B/C spreadsheet -- engineering/ingestion/sources/p2-instructions-csv/P2 Instructions v35 - Rev B_C Silicon - Sheet1.csv, rows by the sheet's `order` column: MOV 58, SETS 126, SETD 125, ADD 10, SUB 14, MUL 137, NEG 63, AND 50, OR 52, XOR 53, NOT 59, CMP 18, TEST 81, JMP 402, CALL 403, RET 319, DJNZ 169, TJZ 174, TJNZ 175, IF_Z 441, IF_NZ 426, IF_C 447, IF_NC 419, RDLONG 154, WRLONG 223, RDBYTE 152, WRBYTE 221, WAITX 266, GETCT 260 (hub timing cells carry the sheet's '*' = +1 if crossing a hub long; figures for 8 cogs). In the sheet, a `*` on a flag description means Z = (result == 0). GETCT WC caveat: P2-EMPIRICAL-FINDINGS.md EF-068 (cogs 4-7) and EF-079 (cogs 0-3 behave the same). Every example below compiles (pnut-ts)."
  data_movement:
    MOV:
      syntax: "MOV  D,{#}S  {WC/WZ/WCZ}"
      description: "Move S into D. D = S. C = S[31]. Z = (result == 0)."
      example: "MOV  result, input"
    SETS:
      syntax: "SETS  D,{#}S"
      description: "Set S field of D to S[8:0]. D = {D[31:9], S[8:0]}. Used to patch an instruction's S field."
      example: "SETS  patch, #target"
    SETD:
      syntax: "SETD  D,{#}S"
      description: "Set D field of D to S[8:0]. D = {D[31:18], S[8:0], D[8:0]}. Used to patch an instruction's D field."
      example: "SETD  patch, #target"

  arithmetic:
    ADD:
      syntax: "ADD  D,{#}S  {WC/WZ/WCZ}"
      description: "Add S into D. D = D + S. C = carry of (D + S). Z = (result == 0)."
      example: "ADD  total, value  WC"
    SUB:
      syntax: "SUB  D,{#}S  {WC/WZ/WCZ}"
      description: "Subtract S from D. D = D - S. C = borrow of (D - S). Z = (result == 0)."
      example: "SUB  count, #1  WZ"
    MUL:
      syntax: "MUL  D,{#}S  {WZ}"
      description: "D = unsigned (D[15:0] * S[15:0]) -- a 16 x 16 multiply with a 32-bit result. Z = (S == 0) | (D == 0)."
      example: "MUL  product, factor"
    NEG:
      syntax: "NEG  D,{#}S  {WC/WZ/WCZ}"
      description: "Negate S into D. D = -S. C = MSB of result. Z = (result == 0)."
      example: "NEG  value, value"

  logical:
    AND:
      syntax: "AND  D,{#}S  {WC/WZ/WCZ}"
      description: "AND S into D. D = D & S. C = parity of result. Z = (result == 0)."
      example: "AND  flags, #$FF"
    OR:
      syntax: "OR  D,{#}S  {WC/WZ/WCZ}"
      description: "OR S into D. D = D | S. C = parity of result. Z = (result == 0)."
      example: "OR  config, #%1000"
    XOR:
      syntax: "XOR  D,{#}S  {WC/WZ/WCZ}"
      description: "XOR S into D. D = D ^ S. C = parity of result. Z = (result == 0)."
      example: "XOR  value, mask"
    NOT:
      syntax: "NOT  D,{#}S  {WC/WZ/WCZ}"
      description: "Get !S into D. D = !S. C = !S[31]. Z = (result == 0)."
      example: "NOT  inverted, original"

  comparison:
    CMP:
      syntax: "CMP  D,{#}S  {WC/WZ/WCZ}"
      description: "Compare D to S. C = borrow of (D - S), so C = 1 when D < S (unsigned). Z = (D == S). D is not written."
      example: "CMP  count, #100  WCZ"
    TEST:
      syntax: "TEST  D,{#}S  {WC/WZ/WCZ}"
      description: "Test D with S. C = parity of (D & S). Z = ((D & S) == 0). D is not written."
      example: "TEST  status, #$01  WZ"

  branching:
    JMP:
      syntax: "JMP  #{\\}A"
      description: "Jump to A. If R = 1 then PC += A, else PC = A. '\\' forces R = 0 (absolute)."
      example: "JMP  #done"
    CALL:
      syntax: "CALL  #{\\}A"
      description: "Call to A by pushing {C, Z, 10'b0, PC[19:0]} onto the hardware stack -- not into PA."
      example: "CALL  #process_data"
    RET:
      syntax: "RET  {WC/WZ/WCZ}"
      description: "Return by popping the stack (K). C = K[31], Z = K[30], PC = K[19:0]."
      example: "RET"
    DJNZ:
      syntax: "DJNZ  D,{#}S"
      description: "Decrement D and jump to S if the result is not zero -- the loop-counting branch."
      example: "DJNZ  counter, #start"
    TJZ:
      syntax: "TJZ  D,{#}S"
      description: "Test D and jump to S if D is zero. D is not changed."
      example: "TJZ  countdown, #done"
    TJNZ:
      syntax: "TJNZ  D,{#}S"
      description: "Test D and jump to S if D is not zero. D is not changed."
      example: "TJNZ  pending, #start"

  conditional_execution:
    IF_Z: {syntax: "IF_Z  <inst>  <ops>", description: "Execute <inst> if Z = 1."}
    IF_NZ: {syntax: "IF_NZ  <inst>  <ops>", description: "Execute <inst> if Z = 0.", example: "IF_NZ  JMP  #continue"}
    IF_C: {syntax: "IF_C  <inst>  <ops>", description: "Execute <inst> if C = 1.", example: "IF_C  JMP  #below"}
    IF_NC: {syntax: "IF_NC  <inst>  <ops>", description: "Execute <inst> if C = 0."}

  hub_access:
    RDLONG:
      syntax: "RDLONG  D,{#}S/P  {WC/WZ/WCZ}"
      description: "Read long from hub address {#}S/PTRx into D. C = MSB of long. A prior SETQ/SETQ2 makes it a cog/LUT block transfer. 9...16 clocks (cog exec), 9...26 (hub exec), +1 if the long crosses a hub long boundary; figures for an 8-cog P2."
      example: "RDLONG  value, PTRA++"
    WRLONG:
      syntax: "WRLONG  {#}D,{#}S/P"
      description: "Write long in D[31:0] to hub address {#}S/PTRx. A prior SETQ/SETQ2 makes it a cog/LUT block transfer. 3...10 clocks (cog exec), 3...20 (hub exec), +1 if the long crosses a hub long boundary; figures for an 8-cog P2."
      example: "WRLONG  result, PTRA"
    RDBYTE:
      syntax: "RDBYTE  D,{#}S/P  {WC/WZ/WCZ}"
      description: "Read zero-extended byte from hub address {#}S/PTRx into D. C = MSB of byte."
      example: "RDBYTE  char, PTRA++"
    WRBYTE:
      syntax: "WRBYTE  {#}D,{#}S/P"
      description: "Write byte in D[7:0] to hub address {#}S/PTRx."
      example: "WRBYTE  char, PTRB++"

  timing:
    WAITX:
      syntax: "WAITX  {#}D  {WC/WZ/WCZ}"
      description: "Wait 2 + D clocks. With WC/WZ/WCZ, wait 2 + (D & RND) clocks. C/Z = 0."
      example: "WAITX  ##1000      ' waits 1002 clocks"
    GETCT:
      syntax: "GETCT  D  {WC}"
      description: "Get CT[31:0], or CT[63:32] with WC, into D. GETCT WC followed by GETCT gets the full 64-bit CT. CT = 0 on reset and increments on every clock. Cogs 0-3 and 4-7 each keep their own upper long, which advances only while a cog of that group is running when the lower long wraps; a cog started later in a group that missed wraps reads an upper long that is behind until its group runs through the next wrap."
      example: "GETCT  timestamp"

addressing_modes:
  immediate:
    syntax: "#value"
    range: "0-511 (9-bit) or use ## for 32-bit"
    examples:
      - "MOV  x, #42"
      - "MOV  x, ##1_000_000"
      
  register_direct:
    syntax: "regname"
    description: "Use register value directly"
    example: "ADD  total, amount"
    
  pointer_with_auto_increment:
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), Random Access Interface"
    step_size: "PTRx++ and PTRx-- add or subtract the access size: 1 for RDBYTE/WRBYTE, 2 for RDWORD/WRWORD, 4 for RDLONG/WRLONG. PTRx++[INDEX] and PTRx--[INDEX] step by INDEX times that size (INDEX 1..16)."
    PTRA_increment:
      syntax: "PTRA++"
      description: "Use PTRA, then increment"
      example: "RDLONG  data, PTRA++"
      
    PTRA_decrement:
      syntax: "PTRA--"
      description: "Use PTRA, then decrement"
      example: "RDLONG  data, PTRA--"
      
    PTRB_increment:
      syntax: "PTRB++"
      description: "Use PTRB, then increment"
      example: "WRLONG  data, PTRB++"

common_patterns:
  loop_with_counter:
    description: "Counted loop using DJNZ (decrement and jump if not zero)"
    pattern: |
      MOV      counter, ##1000
      .loop
      ' Loop body here
      DJNZ     counter, #.loop
      
  subroutine:
    description: "Call subroutine and return"
    pattern: |
      CALL     #my_subroutine
      ' Continues here after RET
      
      my_subroutine
      ' Subroutine body
      RET
      
  conditional_execution:
    description: "Compare and conditionally execute"
    pattern: |
      CMP      value, #threshold  WZ
      IF_Z     MOV  result, #equal_value
      IF_NZ    MOV  result, #not_equal_value
      
  hub_memory_access:
    description: "Copy data from hub to hub using pointers"
    pattern: |
      MOV      PTRA, source_addr
      MOV      PTRB, dest_addr
      MOV      count, #256
      .copy
      RDLONG   data, PTRA++
      WRLONG   data, PTRB++
      DJNZ     count, #.copy

inline_pasm2_in_spin2:
  source: "Parallax Propeller 2 Spin2 Language Documentation v55, In-line PASM Code"
  basic_inline:
    description: "PASM2 code between ORG and END in Spin2 method"
    example: |
      PUB togglePin(pin)
        ORG
          DRVNOT  pin
        END
        
  accessing_parameters:
    description: "Spin2 parameters automatically available as registers"
    example: |
      PUB delayClocks(cycles)
        ORG
          WAITX   cycles
        END
        
  returning_values:
    description: "Use Spin2 return variables"
    example: |
      PUB getCycles() : result
        ORG
          GETCT   result
        END

labels_and_symbols:
  overview: |
    PASM2 uses global and local labels for code organization. Local labels enable
    reuse of common names (.loop, .done) without collision. See
    language/pasm2/concepts/labels.yaml for complete scoping
    rules and reference operators.

  global_labels:
    syntax: "labelname"
    scope: "Visible throughout entire DAT block"
    creates_scope: "Defining a global label resets local label scope"
    example: |
      main_loop
      CALL  #process
      JMP   #main_loop

  local_labels:
    syntax: ".labelname"
    scope: "Local to preceding global label only"
    reusable: "Same name can exist under different global labels"
    example: |
      send_byte               ' Global label - new scope
      .loop                   ' Local to send_byte
      DJNZ  count, #.loop
      RET

      recv_byte               ' Global label - new scope
      .loop                   ' Different .loop - local to recv_byte
      DJNZ  count, #.loop
      RET

  reference_operators:
    "#label": "Immediate branch target (for jumps/calls); relative by default, and #\\label forces absolute"
    "#.local": "Immediate reference to local label"
    "@label": "Hub address of label"
    "$": "Current origin: the cog register address in ORG code (steps by 1 per instruction), the hub address in ORGH code (steps by 4)"

  detailed_reference: "language/pasm2/concepts/labels.yaml"

assembler_directives:
  source: "Parallax Spin2 Documentation v55 -- engineering/ingestion/sources/spin2-v55/spin2-v55-text.txt:302-303 (DAT symbols and data), :313 (ORG), :316 (FIT, cog), :322-323 (ORGH, FIT, hub), :326-327 (ORGH in Spin2+PASM vs PASM-only programs)"
  ORG:
    syntax: "ORG  {address{,limit}}"
    description: "Set cog-exec mode. Bare ORG: cog address $000, cog limit $1F8 (both defaults); ORG $100: address $100, limit $1F8; ORG $100,$120: address $100, limit $120."
    example: "ORG"
  ORGH:
    syntax: "ORGH  {origin{,limit}}"
    description: "Set hub-exec mode. In a Spin2+PASM program, bare ORGH sets hub origin $00400, origin limit $100000 (both defaults), and the code must use relative addressing. In a PASM-only program, bare ORGH sets hub-exec mode at the current hub address, and ORGH with an address fills hub memory with zeros up to it."
  FIT:
    syntax: "FIT  limit"
    description: "Test that the cog (after ORG) or hub (after ORGH) address has not exceeded limit. FIT $1F8 matches an unqualified ORG -- see file_structure.size_checking."
    example: "FIT  $1F8"
  BYTE_WORD_LONG:
    syntax: "symbol  BYTE|WORD|LONG  value{, value...}"
    description: "Emit byte, word or long data; a preceding symbol takes that size and points at the first value. Symbols without data take the size of the previous declaration."
    example: 'HexChrs  BYTE  "0123456789ABCDEF"'

string_handling:
  overview: |
    Strings in PASM2 are defined as BYTE data in the DAT block. They are typically
    null-terminated (ending with 0) for compatibility with string processing routines.

  defining_strings:
    syntax: 'label  BYTE  "text", 0'
    location: "DAT block, typically after code or in separate data section"
    termination: "Add 0 (null) for null-terminated strings"
    examples:
      simple: |
        message     BYTE  "Hello, World!", 0
      multiple: |
        greeting    BYTE  "Hello", 0
        farewell    BYTE  "Goodbye", 0
      with_escapes: |
        newline_msg BYTE  "Line 1", 13, 10, "Line 2", 0    ' CR LF between lines

  accessing_strings:
    description: "Use hub address operator @ to get string pointer"
    pattern: |
      DAT
              ORG
      entry   MOV     PTRA, ##@message    ' Get hub address of string
      .loop   RDBYTE  char, PTRA++  WZ    ' Read byte, increment pointer
        IF_Z  JMP     #.done              ' Zero = end of string
              ' Process character in 'char'
              JMP     #.loop
      .done   ' String processing complete

      char    LONG    0
      message BYTE    "Hello", 0

  common_patterns:
    send_string: "Loop reading bytes until null, send each to output"
    compare_strings: "Compare byte-by-byte until mismatch or both null"
    string_length: "Count bytes until null terminator"

debugging_support:
  overview: "DEBUG statements output runtime data to terminal during development"
  basic_example: |
    DEBUG("Counter: ", UDEC(count))   ' PASM DEBUG statement: count is a cog register; takes effect only when the program is compiled with DEBUG enabled
  see_also:
    pasm2_debug:
      key: p2kbPasm2Debug
      description: "Complete PASM2 DEBUG reference"
    guide:
      key: p2kbSpin2DbgDebugNewUserGuide
      description: "DEBUG beginner tutorial"

critical_gotchas:
  source: "P2 Instructions v35 Rev B/C spreadsheet (engineering/ingestion/sources/p2-instructions-csv/P2 Instructions v35 - Rev B_C Silicon - Sheet1.csv), order 18, 154, 169, 174, 175, 223, 319, 403, 408 and the encoding column; P2 Documentation -- engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:452-453 (PA/PB), :3189-3193 (PTRA forms), :5571-5572 (## invokes AUGS/AUGD)"
  items:
    - "Every instruction is one 32-bit long."
    - "An immediate #S or #D is 9 bits (0-511); ## instead of # makes the assembler insert an AUGS or AUGD that supplies the upper 23 bits, making it 32 bits."
    - "Hub access costs more than cog/LUT access: RDLONG 9...16 clocks (cog exec) / 9...26 (hub exec); WRLONG 3...10 / 3...20; +1 if the long crosses a hub long boundary; figures for an 8-cog P2."
    - "PTRA++ uses PTRA and then adds; ++PTRA adds first and uses the new value. Pick the form deliberately."
    - "CALL pushes its return address onto the hardware stack and RET pops it. PA and PB are not CALL's return registers -- they serve CALLD-imm, CALLPA/CALLPB and LOC."
    - "CMP sets C on borrow: C = 1 means D < S, unsigned."
    - "DJNZ decrements, then jumps if the result is not zero; TJZ and TJNZ only test."

flag_behavior:
  C_flag:
    name: "Carry flag"
    uses:
      - "Carry out of an add, borrow of a subtract or compare (unsigned)"
      - "Shift/rotate carry out"
      - "Conditional execution"
    
  Z_flag:
    name: "Zero flag"
    uses:
      - "Result equals zero"
      - "Comparison equality"
      - "Conditional execution"
      
  flag_persistence:
    note: "Flags retain values until explicitly modified"
    example: |
      CMP   x, y  WZ        ' Sets Z flag
      ADD   a, b            ' Z flag unchanged
      IF_Z  MOV  result, #0 ' Still uses Z from CMP

timing_considerations:
  instruction_timing:
    most_instructions: "2 clock cycles (typical ALU ops, fixed)"
    cog_branches: "4 clocks for a taken JMP/CALL/RET in cog or LUT execution; DJNZ and the TJ/IJ family take 2 when not taken, 4 when taken"
    hub_access_reads: "9-16 clocks (cog) / 9-26 clocks (hub-exec) for RDLONG/RDWORD/RDBYTE"
    hub_access_writes: "3-10 clocks (cog) / 3-20 clocks (hub-exec) for WRLONG/WRWORD/WRBYTE"
    hubexec_sequential: "2 clocks/instruction (same as cogexec via the (cogs+11)=19-stage prefetch FIFO)"
    hubexec_branch: "13...20 clocks for a taken JMP/CALL/RET (2, or 13...20, for DJNZ and the TJ/IJ family); +1 clock when the target is not long-aligned (P2 Documentation, Hub Execution)"
    multiply: "MUL 2 clocks; QMUL via the CORDIC: 2...9 clocks to issue, the result about 55 clocks later (a 54-stage pipeline), read with GETQX/GETQY, which wait for it"
    
  clock_frequency:
    source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet, Release November 1, 2022, AC Characteristics, p.48; the compiler default is from Parallax Propeller 2 Spin2 Language Documentation v55, Clock Setup"
    framing: "These are the DATASHEET's absolute limits, not the Hardware Manual's recommended-use range. The two documents differ in framing, not in fact."
    compiler_default: "RCFAST -- selected whenever no clock-setup symbol is declared and DEBUG mode is off. It is NOT a crystal-plus-PLL default. Its frequency is the rcfast row below: 20 MHz min, 24 MHz typical, 30 MHz max. See file_structure.clock_setup above for how to declare something else."
    rcfast: "20 MHz min, 24 MHz typical, 30 MHz max (internal)."
    rcslow: "12 kHz min, 20 kHz typical, 30 kHz max (internal)."
    crystal_input: "1 MHz to 50 MHz between XI and XO."
    direct_drive_input: "DC to 200 MHz into XI."
    pll_system_clock: "3.33 MHz min, 180 MHz typical, 320 MHz max. Nominal PLL frequency (system clock speed) is 180 MHz at up to 105 degC."
  precise_timing:
    WAITX: "Accurate delay in clock cycles"
    GETCT: "Read 32-bit system counter"
    example: |
      GETCT    start_time
      ' Code to measure
      GETCT    end_time
      SUB      end_time, start_time

