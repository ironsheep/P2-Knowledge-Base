title: PASM2 Getting Started - Core Assembly Essentials
id: pasm2-getting-started
version: 1.2.0
content_base: "language/pasm2"
# content_base names where this guide's subject content lives; it is NOT a resolution
# base. Every path in this file is repo-absolute and resolves on its own. Do not write a
# path relative to content_base: entries here point outside it (architecture/), so a
# reader cannot tell which base a bare path meant.
layer: "Foundation - Assembly Mechanics"
purpose: Minimal viable knowledge for writing functional PASM2 code
target_audience: AI code generators and developers new to PASM2 assembly

summary: |
  Essential PASM2 assembly mechanics needed to start writing functional code immediately. Covers instruction
  format, register model, core instructions, addressing modes, and common idioms. Foundation knowledge for
  productive P2 assembly programming.

description: |
  This is the foundation layer for PASM2 knowledge - pure instruction mechanics and register model. After
  reading this, you can write syntactically correct PASM2 code using common instructions and patterns.
  Reference detailed instruction documentation for advanced features.

knowledge_progression:
  you_are_here: "Layer 1 - Essential Assembly Mechanics"
  
  pre_requisite:
    ESSENTIAL:
      - name: "P2 Architecture Mental Model"
        content: "architecture/p2-architecture-mental-model.yaml"
        key: p2kbArchP2ArchitectureMentalModel
        why: "Understand COG independence, execution models (cogexec vs hubexec), Egg Beater timing, shared resources, and smart pin offloading. Must read BEFORE writing code."
        when: "Read first, before this guide"

  immediate_next_steps:
    REQUIRED:
      - name: "Basic I/O Concepts"
        content: "language/pasm2/concepts/basic-io.yaml"
        why: "Essential for any pin I/O - covers multi-pin operations, ADDPINS, and drive strength"
        when: "Read immediately after Getting Started, before writing I/O code"
        
    THEN_CHOOSE:
      - name: "Smart Pin Modes"
        content: "architecture/smart_pins.yaml"
        when: "Need autonomous hardware (PWM, UART, ADC, counters, etc.)"
      - name: "CORDIC Operations"
        when: "Need math coprocessor (trig, logs, rotation)"
      - name: "Streamer"
        when: "Need high-speed pin sequencing (video, audio)"
  
  note: "Basic I/O concepts are NOT optional - they're foundational for all pin operations"

file_structure:
  source: "Parallax Spin2 Documentation v55 -- Minimal PASM Program engineering/ingestion/sources/spin2-v55/spin2-v55-text.txt:188; DAT Cog-exec / Hub-exec directive tables :310-323; Clock Setup :1708-1726; ASMCLK, clock-setter prepending and _AUTOCLK :1734-1740. Register map from the P2 Datasheet 2022/11/01 pp.13-14 -- engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:553-586."

  overview: |
    PASM2 code lives in a DAT block of a Spin2 source file; there is no separate
    PASM2-only file format. A PASM-only program is a file whose DAT block begins
    with ORG (cog-exec) or ORGH (hub-exec) and which has no PUB method.

  minimal_program:
    description: "The Parallax minimal PASM-only program, verbatim from Spin2 v55:188 -- reproduced here in its own line layout."
    example: |
      DAT             ORG                      'start PASM at hub $00000 for cog $000
      loop            DRVRND  #0 ADDPINS 7     'write a random pattern to P7..P0
                      WAITX   ##clkfreq_/10    'wait 100ms (## for >9 bits), loop
                      JMP     #loop
    why_waitx_not_waitms: "WAITMS and WAITUS are Spin2 METHODS, not PASM2 instructions. In a PASM-only program the delay is WAITX, whose operand is a clock count -- which is why the source's own example computes it from the compiler-defined constant clkfreq_."

  clock_setup:
    source: "Parallax Spin2 Documentation v55, section 'Clock Setup' -- engineering/ingestion/sources/spin2-v55/spin2-v55-text.txt:1708-1726 (the CON declaration table, its two footnotes, and the compiler-defined constants) and :1734-1740 (ASMCLK, the auto-prepended clock-setter, _AUTOCLK). Frequency limits from the P2 Datasheet 2022/11/01, AC Characteristics -- engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:2196-2200 and footnote 2 at :2209."
    default: "With no clock-setup symbol declared and not in DEBUG mode, the compiler selects internal RCFAST, which runs at 20 MHz+ (v55:1718). No clock symbol is required: _clkfreq is OPTIONAL, and a PASM-only program that declares none compiles and runs at RCFAST. With no symbol but DEBUG mode active, the compiler instead selects XI/XO-crystal mode at 20 MHz to facilitate DEBUG (v55:1719)."
    why_the_default_bites: "The default is silent. A PASM-only program whose WAITX operands were computed for 200 MHz, but which declares no clock symbol, runs at RCFAST (20 MHz+, datasheet typical 24 MHz) and every delay is wrong by an order of magnitude with no diagnostic. Either declare the mode you intend (below), or compute delays from the compiler constant clkfreq_, which always tracks the mode actually compiled."
    how_to_declare: "The clock is selected at COMPILE time by declaring CON symbols. The compiler recognises the following combinations and no others; the HUBSET %CC_SS column is the clock-mode value the compiler derives, which is what the compiler constant clkmode_ carries and what HUBSET is invoked with. (v55:1709-1710, :1725)"
    declaration_combinations:
      - con_symbols: "CON _clkfreq = 250_000_000, _errfreq = 0"
        effect: "Selects XI/XO-crystal-plus-PLL mode, assumes 20 MHz crystal. The optimal PLL setting will be computed to achieve _clkfreq. Compilation fails if _clkfreq +/- _errfreq is unachievable."
        hubset_cc_ss: "%10_11"
        v55_line: 1711
      - con_symbols: "CON _xtlfreq = 12_000_000, _clkfreq = 148_500_000, _errfreq = 150_000"
        effect: "Selects XI/XO-crystal-plus-PLL mode, along with frequencies. The optimal PLL setting will be computed to achieve _clkfreq. Compilation fails if _clkfreq +/- _errfreq is unachievable."
        hubset_cc_ss: "%1x_11"
        v55_line: 1712
      - con_symbols: "CON _xinfreq = 32_000_000, _clkfreq = 297_500_000, _errfreq = 100_000"
        effect: "Selects XI-input-plus-PLL mode, along with frequencies. The optimal PLL setting will be computed to achieve _clkfreq. Compilation fails if _clkfreq +/- _errfreq is unachievable."
        hubset_cc_ss: "%01_11"
        v55_line: 1713
      - con_symbols: "CON _xtlfreq = 16_000_000"
        effect: "Selects XI/XO-crystal mode and frequency."
        hubset_cc_ss: "%1x_10"
        v55_line: 1714
      - con_symbols: "CON _xinfreq = 100_000_000"
        effect: "Selects XI-input mode and frequency."
        hubset_cc_ss: "%01_10"
        v55_line: 1715
      - con_symbols: "CON _rcslow"
        effect: "Selects internal RCSLOW oscillator which runs at ~20 KHz."
        hubset_cc_ss: "%00_01"
        v55_line: 1716
      - con_symbols: "CON _rcfast"
        effect: "Selects internal RCFAST oscillator which runs at 20 MHz+."
        hubset_cc_ss: "%00_00"
        v55_line: 1717
      - con_symbols: "No symbol and not DEBUG mode"
        effect: "Selects internal RCFAST oscillator which runs at 20 MHz+."
        hubset_cc_ss: "%00_00"
        v55_line: 1718
      - con_symbols: "No symbol and DEBUG mode"
        effect: "Selects XI/XO-crystal mode and 20 MHz to facilitate DEBUG."
        hubset_cc_ss: "%10_10"
        v55_line: 1719
    extraction_note_2026_08_27: "The %01_11 value for the XI-input-plus-PLL row is written '01_1 1' in our plain-text extraction of v55 (spin2-v55-text.txt:1713 and :1738). That is an extraction artifact, not the source: in the DOCX the cell is one table cell split across two Word runs ('01_1' + '1'), and it is the only one of the nine %CC_SS cells that is split. Verified directly against word/document.xml of engineering/ingestion/sources/spin2-v55/Parallax Spin2 Documentation v55.docx. The value carried here is %01_11."
    errfreq_is_optional: "_errfreq is optional wherever the table shows it; it defaults to 1_000_000 (v55:1721). All three PLL forms above were confirmed to compile without it."
    the_x_bit: "In the %1x_ CC values, x is the crystal-loading bit: if _xtlfreq >= 16_000_000 then x=0, for 15 pF per XI/XO; otherwise x=1, for 30 pF per XI/XO. (v55:1722)"
    combinations_are_compiler_verified: "Every form above was assembled clean by pnut-ts (v1.55.3) inside a PASM-only file. That establishes LEGALITY only -- the effect and %CC_SS columns are v55's statements, not the compiler's."
    when_declared: "PASM-only programs which use any non-RCFAST clock mode get a 16-long clock-setter program automatically prepended, which sets the clock mode, moves your PASM program down by 16 longs, then executes it by doing a COGINIT #0,#0, to effect a normal start. This is why ASMCLK is no longer needed at the start of a PASM-only program (as of v35v). (v55:1735)"
    inhibiting_it: "Declare _AUTOCLK = 0 to stop the clock-setter program from being prepended; your code then begins executing with the default RCFAST mode. If you then want another clock mode you must configure the clock yourself, perhaps using ASMCLK. (v55:1736)"
    asmclk: "ASMCLK is a PASM-only pseudo-instruction that sets the clock mode named by the clock-setup symbols. It has no operands but may take a conditional prefix, and assembles to one or six PASM instructions depending on the mode: HUBSET #0 for _rcfast, HUBSET #1 for _rcslow, and the six-long crystal/PLL start sequence shown under manual_switch_example for every external-clock form. (v55:1734, :1738-1740). Measured: with _AUTOCLK = 0 and an external-clock declaration, adding ASMCLK grew a pnut-ts build by exactly 6 longs; with _rcfast it grew it by 1."
    manual_switch: "Without the prepended clock-setter (or with _AUTOCLK = 0), a pure PASM program moves off its initial RCFAST setting to the compiled crystal/PLL setting with the sequence v55 gives for clkmode_ (v55:1725)."
    manual_switch_example: |
      HUBSET  ##clkmode_ & !%11   'start crystal/PLL, stay in RCFAST mode
      WAITX   ##20_000_000/100    'allow 10ms for the external clock to stabilise
      HUBSET  ##clkmode_          'switch to crystal/PLL
    compiler_constants: "clkfreq_ (compiled clock frequency) and clkmode_ (compiled clock mode) are defined by the compiler and may be referenced as constants in PASM-only programs. Both may differ per file in the application hierarchy; files below the top-level file do not inherit the top-level value. (v55:1725-1726)"
    what_value_is_legal: "The P2 Datasheet AC Characteristics give the PLL absolute maximum as 320 MHz (typical 180 MHz), so a _clkfreq above 320 MHz is outside the datasheet's limits even where the compiler accepts it. The full min/typ/max table for every oscillator source is under timing_considerations.clock_frequency in this file."
    see_also:
      asmclk_instruction:
        key: p2kbPasm2Asmclk
        path: language/pasm2/asmclk.yaml
        description: "ASMCLK -- full instruction entry"
      hubset_instruction:
        key: p2kbPasm2Hubset
        path: language/pasm2/hubset.yaml
        description: "HUBSET -- the instruction the %CC_SS clock-mode value is written with"
      per_symbol_reference:
        key: p2kbSpin2SpecialConfigurationSymbols
        path: language/spin2/constants/special-configuration-symbols.yaml
        description: "_clkfreq, _xtlfreq, _xinfreq, _errfreq, _rcfast, _rcslow, _AUTOCLK -- one entry per symbol"
      clock_system:
        key: p2kbArchClockSystem
        path: architecture/clock_system.yaml
        description: "the P2 clock system -- oscillators, PLL, and mode switching"

  cog_vs_hub_execution:
    cog_exec:
      directive: "ORG"
      v55_statement: "ORG -- set cog-exec mode, cog address = $000, cog limit = $1F8 (reg, both defaults)"
      variants:
        - "ORG $100 -- cog address = $100, cog limit = $1F8 (reg, default limit)"
        - "ORG $100,$120 -- cog address = $100, cog limit = $120 (reg)"
        - "ORG $200 -- cog address = $200, cog limit = $400 (LUT, default limit)"
        - "ORG $300,$380 -- cog address = $300, cog limit = $380 (LUT)"
      no_symbol_before: "No symbol allowed before ORG."
      origin_step: "$ is the current origin, which steps by 1 with each cog-exec instruction."
      alignment: "In cog-exec mode, instructions force alignment to cog/LUT registers."
    hub_exec:
      directive: "ORGH"
      v55_statement: "ORGH -- set hub-exec mode, hub origin = $00400, origin limit = $100000 (both defaults)"
      variants:
        - "ORGH $1000 -- hub origin = $01000, origin limit = $100000 (default limit)"
        - "ORGH $FC000,$FC800 -- hub origin = $FC000, origin limit = $FC800"
      no_symbol_before: "No symbol allowed before ORGH."
      origin_step: "$ is the current origin, which steps by 4 with each hub-exec instruction."

  size_checking:
    fit: "FIT $020 -- test to make sure cog address has not exceeded $020. FIT $2000 -- test to make sure hub address has not exceeded $2000."
    matching_the_default: "ORG's default cog limit is $1F8, so FIT $1F8 is the check that matches an unqualified ORG."
    why_1F8: "Registers $1F8 through $1FF give mapped access to eight special-purpose functions (PTRA, PTRB, DIRA, DIRB, OUTA, OUTB, INA, INB) -- when specifying an address between $1F8 and $1FF, the PASM instruction accesses a special-purpose register, not just the underlying RAM. Registers $1F0 through $1F7 may either be used as general-purpose registers, or may be used as special-purpose registers (IJMP3/IRET3/IJMP2/IRET2/IJMP1/IRET1/PA/PB) if their associated functions are enabled -- so code that uses no interrupts and no PA/PB may run up to $1F8."
    correction_2026_08_25: "The pre-purge form of this block stated 'FIT $1F0 (496 longs)'. v55 states the default cog limit as $1F8; $1F0..$1F7 are dual-use RAM, not reserved. Not restored."
    orgf: "ORGF $040 -- fill to cog address $040 with zeros (no symbol allowed before ORGF)."
    res: "x RES 1 -- reserve 1 register, advance cog address by 1, don't advance hub address."

instruction_format:
  basic_syntax:
    format: "INSTRUCTION  destination, source"
    examples:
      - "MOV      x, y             ' Copy y to x"
      - "ADD      total, value     ' Add value to total"
      - "JMP      #loop            ' Jump to label"
      
  operand_types:
    register:
      description: "Cog register 0-511 or LUT register"
      syntax: "regname"
      example: "MOV  x, y"
      
    immediate:
      description: "Literal value (9-bit or 32-bit with ##)"
      syntax: "#value or ##value"
      examples:
        - "MOV  x, #100         ' 9-bit immediate (0-511)"
        - "MOV  x, ##1000       ' 32-bit immediate (any value)"
        
    address:
      description: "Label or address"
      syntax: "#label"
      example: "JMP  #loop"

  instruction_effects:
    WC:
      description: "Write C flag with result"
      usage: "Affects carry flag based on operation"
      example: "ADD  x, y  WC      ' Set C if overflow"
      
    WZ:
      description: "Write Z flag with result"
      usage: "Affects zero flag based on result"
      example: "CMP  x, y  WZ      ' Set Z if equal"
      
    WCZ:
      description: "Write both C and Z flags"
      usage: "Combined flag updates"
      example: "SUB  x, y  WCZ     ' Set both flags"

register_model:
  cog_registers:
    range: "0-511 (512 registers)"
    size: "32 bits each"
    usage:
      - "General purpose computation"
      - "Local variable storage"
      - "Fast access (2 clock cycles)"
    naming: "Use meaningful names in code"
    
  special_registers:
    PA:
      range: "496 (alias for register 496)"
      usage: "Return address A"
      
    PB:
      range: "497 (alias for register 497)"
      usage: "Return address B"
      
    PTRA:
      range: "498"
      usage: "Pointer A for hub memory access"
      
    PTRB:
      range: "499"
      usage: "Pointer B for hub memory access"
      
    DIRA:
      range: "500"
      usage: "Pin direction for pins 0-31"
      
    DIRB:
      range: "501"
      usage: "Pin direction for pins 32-63"
      
    OUTA:
      range: "502"
      usage: "Pin output for pins 0-31"
      
    OUTB:
      range: "503"
      usage: "Pin output for pins 32-63"
      
    INA:
      range: "504"
      usage: "Pin input for pins 0-31 (read-only)"
      
    INB:
      range: "505"
      usage: "Pin input for pins 32-63 (read-only)"

  lut_memory:
    range: "512 longs (separate from cog registers)"
    access: "RDLUT/WRLUT instructions"
    usage: "Lookup tables, additional storage"
    speed: "Same speed as cog registers"

  hub_memory:
    size: "512KB shared memory"
    access: "RDLONG/RDWORD/RDBYTE, WRLONG/WRWORD/WRBYTE"
    timing: "Reads: 9-16 clocks (cog) / 9-26 clocks (hub-exec); Writes: 3-10 clocks (cog) / 3-20 clocks (hub-exec). Hub-window dependent (egg-beater). Per per-instruction YAMLs."
    usage: "Shared data, large buffers, communication"

core_instructions:
  data_movement:
    MOV:
      syntax: "MOV  D, S"
      description: "Copy source to destination"
      example: "MOV  result, input"
      
    MOVS:
      syntax: "MOVS  D, S"
      description: "Copy S field of instruction"
      usage: "Self-modifying code"
      
    MOVD:
      syntax: "MOVD  D, S"
      description: "Copy D field of instruction"
      usage: "Self-modifying code"

  arithmetic:
    ADD:
      syntax: "ADD  D, S  {WC/WZ/WCZ}"
      description: "D := D + S"
      example: "ADD  total, value  WC"
      
    SUB:
      syntax: "SUB  D, S  {WC/WZ/WCZ}"
      description: "D := D - S"
      example: "SUB  count, #1  WZ"
      
    MUL:
      syntax: "MUL  D, S"
      description: "Multiply (lower 32 bits)"
      example: "MUL  product, factor"
      
    NEG:
      syntax: "NEG  D, S  {WC/WZ/WCZ}"
      description: "D := -S"
      example: "NEG  value, value"

  logical:
    AND:
      syntax: "AND  D, S  {WC/WZ/WCZ}"
      description: "D := D & S (bitwise AND)"
      example: "AND  flags, #$FF"
      
    OR:
      syntax: "OR  D, S  {WC/WZ/WCZ}"
      description: "D := D | S (bitwise OR)"
      example: "OR  config, #%1000"
      
    XOR:
      syntax: "XOR  D, S  {WC/WZ/WCZ}"
      description: "D := D ^ S (bitwise XOR)"
      example: "XOR  value, mask"
      
    NOT:
      syntax: "NOT  D, S  {WC/WZ/WCZ}"
      description: "D := !S (bitwise NOT)"
      example: "NOT  inverted, original"

  comparison:
    CMP:
      syntax: "CMP  D, S  WC/WZ/WCZ"
      description: "Compare D with S, set flags"
      flags:
        - "Z=1 if D == S"
        - "C=1 if D > S (unsigned)"
      example: "CMP  count, #100  WZ"
      
    TEST:
      syntax: "TEST  D, S  WC/WZ/WCZ"
      description: "Test bits (D & S), set flags"
      example: "TEST  status, #$01  WZ"

  branching:
    JMP:
      syntax: "JMP  #address"
      description: "Unconditional jump"
      example: "JMP  #loop"
      
    CALL:
      syntax: "CALL  #address"
      description: "Call subroutine (saves return in PA)"
      example: "CALL  #process_data"
      
    RET:
      syntax: "RET"
      description: "Return from CALL (jumps to PA)"
      example: "RET"
      
    TJNZ:
      syntax: "TJNZ  D, #address"
      description: "Jump if D not zero, decrement D"
      usage: "Loop counting"
      example: "TJNZ  counter, #loop"
      
    TJZ:
      syntax: "TJZ  D, #address"
      description: "Jump if D zero, decrement D"
      example: "TJZ  countdown, #done"

  conditional_execution:
    IF_Z:
      syntax: "IF_Z  INSTRUCTION"
      description: "Execute if Z flag is set"
      example: "IF_Z  MOV  result, #0"
      
    IF_NZ:
      syntax: "IF_NZ  INSTRUCTION"
      description: "Execute if Z flag is clear"
      example: "IF_NZ  JMP  #continue"
      
    IF_C:
      syntax: "IF_C  INSTRUCTION"
      description: "Execute if C flag is set"
      example: "IF_C  ADD  overflow, #1"
      
    IF_NC:
      syntax: "IF_NC  INSTRUCTION"
      description: "Execute if C flag is clear"
      example: "IF_NC  JMP  #no_carry"

  hub_access:
    RDLONG:
      syntax: "RDLONG  D, PTRA/PTRB/address"
      description: "Read long (32-bit) from hub memory"
      timing: "9-16 clocks (cog) / 9-26 clocks (hub-exec) per language/pasm2/rdlong.yaml encoding"
      example: "RDLONG  value, PTRA++"
      
    WRLONG:
      syntax: "WRLONG  D, PTRA/PTRB/address"
      description: "Write long to hub memory"
      timing: "3-10 clocks (cog) / 3-20 clocks (hub-exec) per language/pasm2/wrlong.yaml encoding"
      example: "WRLONG  result, PTRA"
      
    RDBYTE:
      syntax: "RDBYTE  D, address"
      description: "Read byte from hub memory"
      example: "RDBYTE  char, PTRA++"
      
    WRBYTE:
      syntax: "WRBYTE  D, address"
      description: "Write byte to hub memory"
      example: "WRBYTE  char, PTRA++"

  timing:
    WAITX:
      syntax: "WAITX  ticks"
      description: "Wait specified clock cycles"
      example: "WAITX  ##1000      ' Wait 1000 clocks"
      
    GETCT:
      syntax: "GETCT  D"
      description: "Get current system counter"
      usage: "Precise timing measurements"
      example: "GETCT  timestamp"

addressing_modes:
  immediate:
    syntax: "#value"
    range: "0-511 (9-bit) or use ## for 32-bit"
    examples:
      - "MOV  x, #42"
      - "MOV  x, ##1_000_000"
      
  register_direct:
    syntax: "regname"
    description: "Use register value directly"
    example: "ADD  total, amount"
    
  pointer_with_auto_increment:
    PTRA_increment:
      syntax: "PTRA++"
      description: "Use PTRA, then increment"
      example: "RDLONG  data, PTRA++"
      
    PTRA_decrement:
      syntax: "PTRA--"
      description: "Use PTRA, then decrement"
      example: "RDLONG  data, PTRA--"
      
    PTRB_increment:
      syntax: "PTRB++"
      description: "Use PTRB, then increment"
      example: "WRLONG  data, PTRB++"

common_patterns:
  loop_with_counter:
    description: "Counted loop using DJNZ (decrement and jump if not zero)"
    pattern: |
      MOV      counter, ##1000
      .loop
      ' Loop body here
      DJNZ     counter, #.loop
      
  subroutine:
    description: "Call subroutine and return"
    pattern: |
      CALL     #my_subroutine
      ' Continues here after RET
      
      my_subroutine
      ' Subroutine body
      RET
      
  conditional_execution:
    description: "Compare and conditionally execute"
    pattern: |
      CMP      value, #threshold  WZ
      IF_Z     MOV  result, #equal_value
      IF_NZ    MOV  result, #not_equal_value
      
  hub_memory_access:
    description: "Copy data from hub to hub using pointers"
    pattern: |
      MOV      PTRA, source_addr
      MOV      PTRB, dest_addr
      MOV      count, #256
      .copy
      RDLONG   data, PTRA++
      WRLONG   data, PTRB++
      DJNZ     count, #.copy

inline_pasm2_in_spin2:
  basic_inline:
    description: "PASM2 code between ORG and END in Spin2 method"
    example: |
      PUB togglePin(pin)
        ORG
          DRVNOT  pin
        END
        
  accessing_parameters:
    description: "Spin2 parameters automatically available as registers"
    example: |
      PUB delayClocks(cycles)
        ORG
          WAITX   cycles
        END
        
  returning_values:
    description: "Use Spin2 return variables"
    example: |
      PUB getCycles() : result
        ORG
          GETCT   result
        END

labels_and_symbols:
  overview: |
    PASM2 uses global and local labels for code organization. Local labels enable
    reuse of common names (.loop, .done) without collision. See
    language/pasm2/concepts/labels.yaml for complete scoping
    rules and reference operators.

  global_labels:
    syntax: "labelname"
    scope: "Visible throughout entire DAT block"
    creates_scope: "Defining a global label resets local label scope"
    example: |
      main_loop
      CALL  #process
      JMP   #main_loop

  local_labels:
    syntax: ".labelname or :labelname"
    scope: "Local to preceding global label only"
    reusable: "Same name can exist under different global labels"
    example: |
      send_byte               ' Global label - new scope
      .loop                   ' Local to send_byte
      DJNZ  count, #.loop
      RET

      recv_byte               ' Global label - new scope
      .loop                   ' Different .loop - local to recv_byte
      DJNZ  count, #.loop
      RET

  reference_operators:
    "#label": "Immediate COG address (for jumps/calls)"
    "#.local": "Immediate reference to local label"
    "@label": "Hub address of label"
    "$": "Current COG address"

  detailed_reference: "language/pasm2/concepts/labels.yaml"

assembler_directives:
  ORG:
    syntax: "ORG  address"
    description: "Set assembly origin (default $000 for cog)"
    example: "ORG  $000"
    
  ORGH:
    syntax: "ORGH  address"
    description: "Assemble for hub execution"
    usage: "Code that runs from hub memory"
    
  FIT:
    syntax: "FIT  max_address"
    description: "Verify code fits in specified space"
    example: "FIT  $1F0       ' Ensure fits in cog (496 longs)"
    
  LONG:
    syntax: "LONG  value"
    description: "Define 32-bit data"
    example: "lookup_table  LONG  10, 20, 30, 40"
    
  BYTE:
    syntax: "BYTE  value"
    description: "Define 8-bit data"
    example: 'message  BYTE  "Hello", 0'
    
  WORD:
    syntax: "WORD  value"
    description: "Define 16-bit data"
    example: "data  WORD  1000, 2000, 3000"

string_handling:
  overview: |
    Strings in PASM2 are defined as BYTE data in the DAT block. They are typically
    null-terminated (ending with 0) for compatibility with string processing routines.

  defining_strings:
    syntax: 'label  BYTE  "text", 0'
    location: "DAT block, typically after code or in separate data section"
    termination: "Add 0 (null) for null-terminated strings"
    examples:
      simple: |
        message     BYTE  "Hello, World!", 0
      multiple: |
        greeting    BYTE  "Hello", 0
        farewell    BYTE  "Goodbye", 0
      with_escapes: |
        newline_msg BYTE  "Line 1", 13, 10, "Line 2", 0    ' CR LF between lines

  accessing_strings:
    description: "Use hub address operator @ to get string pointer"
    pattern: |
      DAT
              ORG
      entry   MOV     PTRA, ##@message    ' Get hub address of string
      .loop   RDBYTE  char, PTRA++  WZ    ' Read byte, increment pointer
        IF_Z  JMP     #.done              ' Zero = end of string
              ' Process character in 'char'
              JMP     #.loop
      .done   ' String processing complete

      char    LONG    0
      message BYTE    "Hello", 0

  common_patterns:
    send_string: "Loop reading bytes until null, send each to output"
    compare_strings: "Compare byte-by-byte until mismatch or both null"
    string_length: "Count bytes until null terminator"

debugging_support:
  overview: "DEBUG statements output runtime data to terminal during development"
  basic_example: |
    DEBUG("Counter: ", UDEC(count))
  see_also:
    pasm2_debug:
      key: p2kbPasm2Debug
      description: "Complete PASM2 DEBUG reference"
    guide:
      key: p2kbSpin2DbgDebugNewUserGuide
      description: "DEBUG beginner tutorial"

critical_gotchas:
  - "All instructions are 32-bit (one long per instruction)"
  - "Immediate values limited to 9 bits (0-511) unless using ##"
  - "Hub memory access is slower than cog/LUT: RDLONG/etc. take 9-16 clocks (cog) / 9-26 (hub-exec); writes 3-10 / 3-20. Per per-instruction YAMLs."
  - "PTRA/PTRB auto-increment is AFTER the access (post-increment)"
  - "Flags (C, Z) persist until explicitly changed"
  - "Labels must start in column 1 or use local syntax (.label)"
  - "Comments use single quote (') in PASM2"
  - "Pin numbers are 0-63, not bit positions in some contexts"
  - "DJNZ decrements THEN tests (jumps if result not zero)"
  - "RET uses PA register (set by CALL)"

flag_behavior:
  C_flag:
    name: "Carry flag"
    uses:
      - "Arithmetic overflow/underflow"
      - "Shift/rotate carry out"
      - "Conditional execution"
    
  Z_flag:
    name: "Zero flag"
    uses:
      - "Result equals zero"
      - "Comparison equality"
      - "Conditional execution"
      
  flag_persistence:
    note: "Flags retain values until explicitly modified"
    example: |
      CMP   x, y  WZ        ' Sets Z flag
      ADD   a, b            ' Z flag unchanged
      IF_Z  MOV  result, #0 ' Still uses Z from CMP

timing_considerations:
  instruction_timing:
    most_instructions: "2 clock cycles (typical ALU ops, fixed)"
    cog_branches: "4 clocks for JMP/CALL/RET; first instruction after branch takes 5+ clocks (Silicon Doc v35: pipeline flush)"
    hub_access_reads: "9-16 clocks (cog) / 9-26 clocks (hub-exec) for RDLONG/RDWORD/RDBYTE"
    hub_access_writes: "3-10 clocks (cog) / 3-20 clocks (hub-exec) for WRLONG/WRWORD/WRBYTE"
    hubexec_sequential: "2 clocks/instruction (same as cogexec via the (cogs+11)=19-stage prefetch FIFO)"
    hubexec_branch: "Minimum 13 clocks (+1 if not long-aligned) per Silicon Doc v35 verbatim"
    multiply: "MUL 2 clocks; QMUL via CORDIC: 55-clock latency, 8-clock issue interval"
    
  clock_frequency:
    source: "P2 Datasheet 2022/11/01, AC Characteristics (p.48) -- engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:2196-2200, footnote 2 at :2209. Compiler default from Parallax Spin2 Documentation v55 -- engineering/ingestion/sources/spin2-v55/spin2-v55-text.txt:1718."
    framing: "These are the DATASHEET's absolute limits, not the Hardware Manual's recommended-use range. The two documents differ in framing, not in fact; see engineering/ingestion/SOURCE-ERRATA.md E-007."
    compiler_default: "RCFAST -- selected whenever no clock-setup symbol is declared and DEBUG mode is off (v55:1718). It is NOT a crystal-plus-PLL default. Its frequency is the rcfast row below: 20 MHz min, 24 MHz typical, 30 MHz max. See file_structure.clock_setup above for how to declare something else."
    rcfast: "20 MHz min, 24 MHz typical, 30 MHz max (internal)."
    rcslow: "12 kHz min, 20 kHz typical, 30 kHz max (internal)."
    crystal_input: "1 MHz to 50 MHz between XI and XO."
    direct_drive_input: "DC to 200 MHz into XI."
    pll_system_clock: "3.33 MHz min, 180 MHz typical, 320 MHz max. Nominal PLL frequency (system clock speed) is 180 MHz at up to 105 degC."
    correction_2026_08_27: "This block previously read default '20 MHz crystal with PLL', typical '200-300 MHz system clock', maximum '340+ MHz (silicon dependent)' -- all three uncited. The 'default' contradicted this same file's clock_setup block (the compiler default is RCFAST); '200-300 MHz typical' has no source we hold and the datasheet's typical is 180 MHz; '340+ MHz' appears in our holdings only as a TAQOZ overclocking anecdote (community material, an upstream lead, never a citable authority), against a datasheet maximum of 320 MHz. Replaced source-first, not restored."
    
  precise_timing:
    WAITX: "Accurate delay in clock cycles"
    GETCT: "Read 32-bit system counter"
    example: |
      GETCT    start_time
      ' Code to measure
      GETCT    end_time
      SUB      end_time, start_time

