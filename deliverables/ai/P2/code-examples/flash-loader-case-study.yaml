# Code Example: Flash Loader (flash_loader.spin2) — Annotated Reference

example_id: "flash-loader-case-study"
title: "Flash Loader (flash_loader.spin2) — Annotated Reference Case Study"
description: |
  Reference entry pointing at flash_loader.spin2 — the compiler-embedded
  boot loader authored by Chip Gracey that ships compiled into every
  PNut/PNut-TS binary built for SPI flash boot. This is NOT a tutorial;
  it catalogs the techniques the loader exercises with one-line summaries
  and cross-references into the canonical KB entry for each technique.

source_metadata:
  primary_source: engineering/ingestion/sources/flash-loader/flash_loader.spin2
  companion_doc: engineering/ingestion/sources/flash-loader/Flash-Loader-Theory-of-Operations.md
  authority: "GOLDEN — compiled into every flash-boot binary; behaviors silicon-validated by production use"
  author: "Chip Gracey (Parallax)"
  size: "298 lines"

what_the_loader_is:
  role: |
    The loader is the code at the head of every flash-bootable binary.
    The silicon ROM Booter loads its first 1KB and JMP #0's into it;
    the loader then loads the rest of the app from flash to hub and
    starts user code via COGINIT #0,#$00000. See
    architecture/boot-rom/spi-flash-boot.yaml for the full handoff.
  two_halves: "A one-shot programmer (initial flash write) and a per-boot loader, sharing the SPI setup and a 256-long cog image; self-modifying code reconfigures shared instructions for each role"

