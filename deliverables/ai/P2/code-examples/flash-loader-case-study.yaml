large_transfer_chunking:
  name: Large-transfer chunking
  description: |
    The loader reads its application from flash in blocks of at most $7FF longs by
    reissuing XINIT in a loop. Its hub FIFO is set up once, by WRFAST before the
    loop; each iteration shifts its long count left by 5 to get the number of bits,
    writes that bit count into the streamer command and reissues XINIT.
  implementation: |
    ' Read `count` longs from a 1-pin input into hub RAM, at most $7FF longs per command
    .block      bmask   x, #10              ' x = $7FF, the cap on longs per command
                fle     x, count            ' limit x to the longs left
                sub     count, x            ' update the longs left
                shl     x, #5               ' get the number of bits
                setword mode, x, #0         ' insert the bit count into the streamer command
                shl     x, #1               ' double for the number of spi_ck transitions
                wypin   x, #clk_pin         ' start the clk_pin transitions
                waitx   #3                  ' align clk_pin transitions with the data sampling
                xinit   mode, #0            ' start the streamer with the new count
                waitxfi                     ' wait for the streamer to finish
                tjnz    count, #.block      ' if more longs are left, read another block
  source: "Parallax SPI Flash Programmer and Boot Loader v51, Loader, Read in remaining application longs (.block: 'try max streamer block size for longs ($7FF)')"

