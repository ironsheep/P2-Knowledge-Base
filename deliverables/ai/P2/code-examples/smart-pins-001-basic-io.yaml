# Code Example: Basic P2 I/O Operations

example_id: "smart-pins-001-basic-io"
title: "Essential P2 I/O Instructions"
description: "Demonstrates the four fundamental P2 I/O instructions for controlling pin direction and output state"

source_metadata:
  source_document: "P2 Instructions v35 - Rev B/C Silicon, rows DIRL, DIRH, OUTL, OUTH (the behaviour of each instruction; the example itself is illustrative, not a published listing)"
  source_section: null
  source_page: null

code_content:
  language: "spin2"
  code_type: "method"
  code: |
    PUB the_essentials()
      ORG
        DIRL #56            ' Make P56 an input (Direction Low)
        DIRH #56            ' Make P56 an output (Direction High)
        OUTL #56            ' Set P56 output to 0 (Output Low)
        OUTH #56            ' Set P56 output to 1 (Output High)
      END
  code_comments:
    - line_number: 3
      comment: "DIRL #56"
      explanation: "Sets pin direction to input by clearing DIR bit for pin 56"
    - line_number: 4
      comment: "DIRH #56"
      explanation: "Sets pin direction to output by setting DIR bit for pin 56"
    - line_number: 5
      comment: "OUTL #56"
      explanation: "Sets output value to low by clearing OUT bit for pin 56"
    - line_number: 6
      comment: "OUTH #56"
      explanation: "Sets output value to high by setting OUT bit for pin 56"

