# Code Example: Button Reading with INA Register

example_id: "smart-pins-002-button-reading"
title: "Reading Button Input with INA Register"
description: "Demonstrates how to read digital input from a button using the INA register and proper pin configuration"

source_metadata:
  source_document: "P2 Instructions v35 - Rev B/C Silicon, row DIRL; Parallax Propeller 2 Spin2 Language Documentation v55, Cog Registers (the example itself is illustrative, not a published listing)"
  source_section: null
  source_page: null

code_content:
  language: "spin2"
  code_type: "complete_program"
  code: |
    CON
      BUTTON = 16                   ' Button on P16

    PUB read_button()
      ORG
        DIRL #BUTTON                ' Make button pin an input
      END
      if INA.[BUTTON]               ' Read the input state
        ' Button is pressed (high)
        ' Add your code here
      else
        ' Button is not pressed (low)
        ' Add your code here
  code_comments:
    - line_number: 2
      comment: "BUTTON = 16"
      explanation: "Defines constant for button pin number (P16)"
    - line_number: 6
      comment: "DIRL #BUTTON"
      explanation: "Configure button pin as input (high impedance)"
    - line_number: 8
      comment: "if INA.[BUTTON]"
      explanation: "Read the state of the button pin: INA.[BUTTON] selects bit BUTTON of the INA register (P0..P31)"

