title: "PWM Sawtooth Wave Output"
subtitle: "Smart Pin Mode %01001 (P_PWM_SAWTOOTH)"
language_reference: "combined"
compatible_languages: ["Spin2", "PASM2"]

brief_description: "Generates sawtooth-wave PWM with configurable base period and duty cycle using up-only counter"

detailed_description:
  operation: |
    Uses an up-only counter. Counter counts from 1 up
    to frame period, then resets to 1. Output high when counter ≤ duty value, low when counter
    exceeds duty value. PWM period equals frame period (not doubled like triangle mode). Mode
    overrides OUT signal for direct pin control.
  
  timing: |
    Base period = X[15:0] system clocks
    Frame period = X[31:16] × base period = PWM period
    IN flag raised when Y captured at frame start (counter reset)

registers:
  x_register:
    bits_15_0: "Base period in system clocks (a zero acts as 65,536)"
    bits_31_16: "Frame period in base periods (a zero acts as 65,536)"
    source: "EF-100"
  y_register:  
    bits_15_0: "PWM output value, captured at each frame start; it should range from zero to the frame period"
    bits_31_16: "Not documented: a role for Y[31:16]"
  z_register:
    function: "Not documented: a Z (RDPIN/RQPIN) result for this mode"

flags:
  in_flag: "Raised when Y[15:0] captured at counter reset"
  out_signal: "Overridden by PWM output"

code_examples:
  - title: "25% Duty Cycle Sawtooth PWM at 48.8kHz"
    description: "25MHz clock, 40ns base period, 512 base periods frame"
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), Smart Pins, %01001 = PWM sawtooth (base period in clocks, PWM period one frame period); 25 MHz / (512 x 1) = 48.8 kHz"
    code: |
      CON
        _clkfreq = 25_000_000
        pwm_pin = 20
      
      PUB main() | mode, xval, yval
        mode := P_PWM_SAWTOOTH | P_OE            ' PWM sawtooth with output enable
        xval := $0200_0001                       ' Base=1 clock, Frame=512 periods
        yval := $0000_0080                       ' 25% duty (128 of 512)
        
        pinstart(pwm_pin, mode, xval, yval)      ' Configure and start
        repeat                                    ' PWM runs autonomously
      
      DAT
      ' PASM2 equivalent
        org
        dirl    #pwm_pin                         ' Reset smart pin
        wrpin   ##P_PWM_SAWTOOTH | P_OE, #pwm_pin
        wxpin   ##$0200_0001, #pwm_pin           ' Base and frame periods  
        dirh    #pwm_pin                         ' Enable smart pin
        wypin   #$80, #pwm_pin                   ' Set 25% duty cycle
      .loop
        jmp     #.loop                           ' PWM runs independently

related_modes:
  - "Mode %01000: PWM Triangle (counter counts down then up)"
  - "Mode %01010: PWM SMPS (voltage/current feedback)"
  - "Mode %00111: NCO Duty (variable duty square wave)"

configuration_constants:
  mode_constant: "P_PWM_SAWTOOTH"
  binary_value: "%01001"
  common_modifiers:
    - "P_OE - Enable output drive"
    - "P_INVERT_OUTPUT - Invert PWM signal"

notes:
  - "Output always starts low during reset (DIR=0)"
  - "Y=0 produces constant low output"  
  - "Y=frame period value produces constant high"
  - "PWM period half that of triangle mode at same settings"

sources:
  - "operation, timing, registers, notes: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PIN MODES (%01001 PWM sawtooth)"