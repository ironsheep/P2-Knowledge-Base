title: "Count Time Over Periods Within X Clocks"
subtitle: "Smart Pin Mode %10101 (P_PERIODS_CLOCKS_TIME)"
language_reference: "combined"
compatible_languages: ["Spin2", "PASM2"]

brief_description: "Measures total A-input high-state duration across periods that occur within X+ clock cycles"

detailed_description:
  operation: |
    Time-windowed version of mode %10100. Accumulates total time A-input spends high across
    measurement periods that occur within X clock cycles. Instead of counting a fixed number of
    periods, this mode establishes a time window and measures whatever periods occur within that
    window. Combines clock-based timing window with state accumulation.
  
  timing: |
    Measurement window is X clock cycles
    Period boundaries defined by Y[1:0] trigger combination
    Accumulates A-high time for all periods within window
    IN flag raised when X clocks elapse
    New measurement begins automatically

registers:
  x_register:
    bits_31_0: "Time window duration in clock cycles (X+ clocks)"
  y_register:
    bits_1_0: |
      Event trigger sensitivity:
      %00 = A-input rise to B-input rise
      %01 = A-input rise to B-input edge
      %10 = A-input edge to B-input rise
      %11 = A-input edge to B-input edge
  z_register:
    function: "Total clock cycles A-input was high within X-clock window"

flags:
  in_flag: "Raised when X-clock window completes, measurement ready"
  a_input: "Signal to measure (time spent high is accumulated)"
  b_input: "Period boundary marker (can be same as A-input)"

code_examples:
  - title: "Fixed-Duration Duty Measurement"
    description: "Measure duty cycle in fixed 1-second windows"
    code: |
      CON
        _clkfreq = 200_000_000
        signal_pin = 20
      
      PUB main() | high_time, duty_percent
        ' Measure duty over 1-second windows
        ' Regardless of how many periods occur
        pinstart(signal_pin, P_PERIODS_CLOCKS_TIME | P_B_A_INPUT, _clkfreq, %00)
        
        repeat
          ' Wait for 1-second measurement window to complete
          repeat until pinread(signal_pin)
          
          high_time := rdpin(signal_pin)         ' Total clocks signal was high
          duty_percent := (high_time * 100) / _clkfreq
          debug("Duty cycle: ", udec(duty_percent), "%")
      
      DAT
      ' PASM2 example - 100ms measurement windows
        org
        dirl    #signal_pin                      ' Reset smart pin
        wrpin   ##P_PERIODS_CLOCKS_TIME | P_B_A_INPUT, #signal_pin
        wxpin   ##clkfreq/10, #signal_pin        ' 100ms window
        wypin   #%00, #signal_pin                ' A-rise to A-rise
        dirh    #signal_pin                      ' Start measurement
      .loop
        testp   #signal_pin wc                   ' Check IN flag
        if_nc   jmp #.loop                       ' Wait for window complete
        rdpin   result, #signal_pin              ' Get accumulated high time
        ' Process result...
        jmp     #.loop                           ' Next window starts auto

  - title: "Variable Frequency Duty Analysis"
    description: "Measure duty cycle when frequency varies"
    code: |
      CON
        _clkfreq = 200_000_000
        pwm_pin = 20
        window_ms = 50                           ' 50ms measurement windows
      
      PUB main() | high_time, window_clks
        window_clks := (_clkfreq / 1000) * window_ms
        
        ' Measure over fixed time regardless of frequency changes
        pinstart(pwm_pin, P_PERIODS_CLOCKS_TIME | P_B_A_INPUT, window_clks, %00)
        
        repeat
          repeat until pinread(pwm_pin)
          
          high_time := rdpin(pwm_pin)
          ' Duty = (high_time / window_clks) * 100
          debug("High time: ", udec(high_time), " in ", udec(window_ms), "ms")

common_applications:
  - "Duty cycle measurement with variable frequency signals"
  - "Fixed-duration signal quality analysis"
  - "Time-windowed phase overlap measurement"
  - "Real-time duty monitoring with consistent update intervals"

related_modes:
  - "Mode %10100: Periods/count/states - fixed period count instead of time window"
  - "Mode %10110: Periods/clocks/states - similar with state counting"
  - "Mode %10011: Periods/count/time - measures period duration not state time"
  - "Mode %01111: Count highs - continuous high-state counting"

configuration_constants:
  mode_constant: "P_PERIODS_CLOCKS_TIME"
  binary_value: "%10101"
  common_modifiers:
    - "P_B_A_INPUT - Use A-input for both A and B (single pin measurement)"
    - "P_PLUS1_B - Use next pin as B-input"
    - "P_MINUS1_B - Use previous pin as B-input"
    - "P_FILT1_AB - Add filtering for noise immunity"
  
  y_register_values:
    - "%00 - A-rise to B-rise (typical for same-frequency signals)"
    - "%01 - A-rise to B-edge (any B transition ends period)"
    - "%10 - A-edge to B-rise (any A transition starts period)"
    - "%11 - A-edge to B-edge (maximum sensitivity)"

notes:
  - "Time window is fixed (X clocks), period count varies with frequency"
  - "Useful when signal frequency changes but measurement interval must be constant"
  - "Accumulates A-high time, not period duration"
  - "Provides consistent update rate for monitoring applications"
  - "B-input can be same as A-input for single-pin measurements"
  - "Measurement restarts automatically after each X-clock window"
