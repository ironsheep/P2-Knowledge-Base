# Smart Pin Mode: %00010 - DAC 16-bit with Pseudo-Random Dither
# Concise reference optimized for AI code generation

mode: "%00010"
name: "DAC 16-bit with Pseudo-Random Dither"
category: "dac"
source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PIN MODES, %00010 and DAC_MODE = DAC 16-bit with pseudo-random dither"

# Constants
constants:
  spin2: "P_DAC_DITHER_RND"
  pasm2: "P_DAC_DITHER_RND"
  mode_bits: "%00010"
  
# Critical: Requires DAC mode configuration
dac_requirement: |
  M[12:10] must be %101 for DAC output
  Use: P_DAC_DITHER_RND | P_DAC_124R_3V | P_OE
  Other DAC options: P_DAC_990R_3V, P_DAC_600R_2V, P_DAC_75R_2V

# Operation
operation: |
  Overrides M[7:0] to feed the pin's 8-bit DAC with pseudo-randomly-dithered data
  on every clock. Pseudo-random dithering does not require any kind of fixed period,
  as it randomly dithers the 8-bit DAC between adjacent levels, in order to achieve
  16-bit DAC output, averaged over time.

accuracy_caveat: |
  The 16-bit DAC output is achieved by randomly dithering the 8-bit DAC between
  adjacent levels, averaged over time.

# Parameters
x_register:
  function: "Sample period in clocks"
  X[15:0]: "Sample period (1 = immediate updates, IN stays high)"
  special: "Set to 1 for real-time updates without IN flag cycling"

y_register:
  function: "16-bit DAC output value"
  Y[15:0]: "DAC value captured at each sample period"
  limit: "Y[15:0] values larger than $FF00 are invalid and are clipped down to $FF00"
  update: "Coordinate with IN flag or use X=1 for immediate"

z_register:
  function: "ADC accumulation (if OUT=1)"
  usage: "16-bit ADC accumulation from the last sample period, read with RDPIN/RQPIN; it can be used to measure loading on the DAC pin. The Spin2 RDPIN() method returns the C flag in bit 31, so the Spin2 example masks the result to its 16 bits"
  enable: "If OUT is high, the ADC is enabled. In DAC-noise mode (%00001) on silicon, raising OUT with TT = %00 runs nothing, and with TT bit 0 set (P_OE / P_TT_01) the DAC drives the pin while the ADC runs (architecture/smart_pins.yaml silicon_errata). Not documented: the behavior of this mode with TT = %00."

in_flag: |
  Raised at end of each sample period
  Indicates Y[15:0] captured for next output
  Stays high if X[15:0]=1

# Pin Behavior
pin_behavior:
  reset_state: "IN=0, Y[15:0] captured during reset"
  output: "8-bit DAC dithered to achieve 16-bit resolution"
  feedback: "OUT=1 enables ADC for load measurement"

# Complete Spin2 Example
spin2_complete: |
  CON
    DAC_PIN = 48
    
  VAR
    LONG dac_value
    
  PUB main()
    setup_16bit_dac()
    
    ' Generate ramp
    REPEAT dac_value FROM 0 TO 65535 STEP 256
      output_dac(dac_value)
      WAITMS(1)
    
  PUB setup_16bit_dac() | mode
    ' Configure for 16-bit pseudo-random dithered DAC
    mode := P_DAC_DITHER_RND | P_DAC_124R_3V | P_OE
    
    PINCLEAR(DAC_PIN)
    WRPIN(DAC_PIN, mode)
    WXPIN(DAC_PIN, 1)           ' Immediate updates (no IN cycling)
    PINHIGH(DAC_PIN)            ' Enable FIRST (general init order)
    WYPIN(DAC_PIN, $8000)       ' THEN write Y: mid-scale initial value
    
  PUB output_dac(value16)
    WYPIN(DAC_PIN, value16)     ' Output 16-bit value
    
  PUB setup_with_feedback() | mode
    ' Enable ADC feedback to measure loading
    mode := P_DAC_DITHER_RND | P_DAC_124R_3V | P_OE
    
    PINCLEAR(DAC_PIN)
    WRPIN(DAC_PIN, mode)
    WXPIN(DAC_PIN, 1000)       ' 1000 clock sample period
    PINWRITE(DAC_PIN, 1)        ' OUT=1 enables the ADC; PINWRITE also raises DIR
    PINHIGH(DAC_PIN)            ' Enable FIRST (general init order)
    WYPIN(DAC_PIN, $8000)       ' THEN write Y: mid-scale
    
  PUB read_loading() : adc_value
    ' Read the 16-bit ADC accumulation (requires OUT=1); the mask drops the C flag
    ' that the Spin2 RDPIN() method returns in bit 31
    adc_value := RDPIN(DAC_PIN) & $FFFF

# Complete PASM2 Example
pasm2_complete: |
  DAT
          ORG
  
  ' Pin assignment and mode
  dac_pin       LONG  48
  dac_mode      LONG  P_DAC_DITHER_RND | P_DAC_124R_3V | P_OE
  
  ' Setup 16-bit dithered DAC
  setup_dac
          MOV   pin, dac_pin
          DIRL  pin                   ' Reset (captures Y)
          WRPIN dac_mode, pin         ' Configure mode
          WXPIN #1, pin               ' Immediate updates
          DIRH  pin                   ' Enable FIRST (general init order)
          WYPIN ##$8000, pin          ' THEN write Y: mid-scale initial
          RET
  
  ' Output 16-bit value
  output_value
          MOV   pin, dac_pin
          WYPIN value16, pin          ' Write 16-bit value
          RET
  
  ' Step through a 16-entry byte table
  table_wave
          MOV   index, #0
  .loop   MOV   ptra, ##@level_table
          ADD   ptra, index
          RDBYTE value16, ptra        ' Get an 8-bit level
          SHL   value16, #8           ' Level in Y[15:8] (at most $FF00)
          CALL  #output_value
          ADD   index, #1
          AND   index, #15            ' Wrap at 16 entries
          WAITX ##10_000              ' Delay
          JMP   #.loop

  ' Level table (16 entries, 8-bit)
  level_table   BYTE  $80,$83,$86,$89,$8C,$8F,$92,$95
                BYTE  $98,$9B,$9E,$A1,$A4,$A7,$AA,$AD

  ' Variables
  pin           RES   1
  value16       RES   1
  index         RES   1

# Inline PASM2 in Spin2
spin2_inline: |
  PUB set_dac_immediate(pin, value16)
    ' Fast inline DAC update
    ORG
      WYPIN value16, pin            ' Direct write
    END
    
  PUB read_adc_feedback(pin) : result
    ' Read ADC accumulation
    ORG
      RDPIN result, pin             ' Get ADC value
    END

# Key Points
resolution: |
  The 8-bit DAC is randomly dithered between adjacent levels to achieve 16-bit DAC output, averaged over time
  
update_modes: |
  X=1: Immediate updates, no IN flag cycling
  X>1: Periodic updates, synchronized with IN flag
  
feedback_mode: |
  OUT=1 enables ADC; the accumulation can be used to measure loading on the DAC pin
  Read with RDPIN/RQPIN

timing_considerations: |
  Dithering occurs every clock cycle
  No fixed period required for dithering
  X=1: an updated Y takes immediate effect and IN stays high

sources:
  - "y_register.limit: Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, DAC 16-Bit With Noise Dither (%00010 and DAC_MODE), p.46"
  - "z_register.enable: EF-071 (in DAC-noise mode %00001, OUT runs the ADC only with TT bit 0 set; the other DAC smart pin modes are not documented)"
  - "operation, x_register, y_register, z_register.usage, in_flag, pin_behavior: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PIN MODES, %00010 and DAC_MODE"
  - "z_register.usage (Spin2 RDPIN() bit 31): Parallax Propeller 2 Spin2 Language Documentation v55, smart pin methods (RDPIN (Pin) : Zval, Zval[31] = C flag from RDPIN, other bits are RDPIN data)"

hub_symbols: "Fragments here that use a hub symbol as an immediate assume a PASM-only file, where hub addresses are absolute. In a Spin2 object, DAT hub addresses are relative to the object: see language/spin2/integration/spin2-pasm2-integration.yaml hub_address_resolution."
related: ["00011 (DAC PWM Dither)", "00001 (DAC Noise)", "Normal mode with P_DAC_*"]