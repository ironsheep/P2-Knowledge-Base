title: "Quadrature Encoder Input"
subtitle: "Smart Pin Mode %01011 (P_QUADRATURE)"
language_reference: "combined"
compatible_languages: ["Spin2", "PASM2"]

brief_description: "Decodes A/B quadrature encoder signals for position and velocity measurement"

detailed_description:
  operation: |
    Tracks quadrature encoder transitions on A and B inputs to determine position and direction.
    Maintains a 32-bit quadrature step count that increments/decrements based on rotation
    direction. Supports both continuous totalizer mode and periodic velocity measurements.  
  timing: |
    Continuous mode (X=0): Z register always holds current position count
    Periodic mode (X>0): Measures counts over X clock cycles
    IN flag raised at end of each measurement period
    Can zero count anytime by pulsing DIR low (during reset Z is set to the adder value, 0, 1 or -1)

registers:
  x_register:
    bits_31_0: "Measurement period in clocks (0=continuous totalizer)"
  y_register:  
    function: "Not documented: a role for Y in this mode"
  z_register:
    function: "32-bit quadrature step count (counts up and down with the direction of rotation)"

flags:
  in_flag: "Raised at end of measurement period (periodic mode only)"
  a_input: "Encoder phase A signal"
  b_input: "Encoder phase B signal (typically from adjacent pin)"

code_examples:
  - title: "Position and Velocity Tracking"
    description: "Absolute position on P32, velocity on P33"
    code: |
      CON
        _clkfreq = 200_000_000
        enc_a = 32                                ' Encoder A phase
        enc_b = 33                                ' Encoder B phase (for velocity)
      
      PUB main() | position, velocity
        ' Configure P32 for continuous position tracking
        pinstart(enc_a, P_QUADRATURE | P_PLUS1_B, 0, 0)
        
        ' Configure P33 for velocity measurement (100ms periods)
        pinstart(enc_b, P_QUADRATURE | P_MINUS1_A, _clkfreq/10, 0)
        
        repeat
          position := read_z(enc_a)              ' Signed quadrature step count since the counter was last zeroed
          velocity := read_z(enc_b)              ' Signed steps counted in the last 100ms period

          ' Reset position on button press
          if ina.[0]
            pinclear(enc_a)                      ' Zero the counter
            pinstart(enc_a, P_QUADRATURE | P_PLUS1_B, 0, 0)

      PRI read_z(pin) : z
        ' PASM2 RDPIN keeps all 32 bits of Z, the sign bit included (the Spin2 RDPIN() method returns the C flag in bit 31)
        org
          rdpin   z, pin
        end

      DAT
      ' PASM2 equivalent
        org
        dirl    #enc_a                           ' Reset smart pin
        wrpin   ##P_QUADRATURE | P_PLUS1_B, #enc_a
        wxpin   #0, #enc_a                       ' Continuous mode
        dirh    #enc_a                           ' Enable encoder
      .loop
        rdpin   position_reg, #enc_a             ' Read position (quadrature steps)
        jmp     #.loop

      position_reg    res     1

related_modes:
  - "Mode %01100: Count on A-rise when B-high"
  - "Mode %01101: Count up/down on A-rise based on B"
  - "Mode %01110: Count up on A-rise, down on B-rise"
  - "Mode %01111: Count A-input highs, optionally decrementing on B-input highs"

configuration_constants:
  mode_constant: "P_QUADRATURE"
  binary_value: "%01011"
  common_modifiers:
    - "P_PLUS1_B - Use next pin up for B signal"
    - "P_MINUS1_A - Use previous pin for A signal"
    - "P_FILT1_AB - Filter the A and B inputs using the global filt1 settings"

notes:
  - "Z is a 32-bit quadrature step count"
  - "Z counts up and down with the direction of rotation"
  - "Pulse DIR low to zero count without reconfiguration"
  - "Use two pins: one for position (X=0), one for velocity (X>0)"
  - "No counts lost at period boundaries in periodic mode: at the end of each period the accumulator is set to the 0/1/-1 value that would otherwise have been added into it"
  - "During reset (DIR=0), IN is low and Z is set to the adder value (0/1/-1)"
  - "The Spin2 example reads the count with inline PASM2 RDPIN, which keeps all 32 bits of Z; the Spin2 RDPIN() method returns the C flag in bit 31, which would replace the count's sign bit unless C is the MSB of Z. Not documented: the C flag of RDPIN in this mode."

sources:
  - "operation, timing, registers, notes, P_FILT1_AB (global filt1 settings): Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PIN MODES (%01011 A/B-input quadrature encoder) and SMART PINS (%FFF logic and filtering; C is either a mode-related flag or the MSB of the Z result)"
  - "notes (Spin2 RDPIN() bit 31): Parallax Propeller 2 Spin2 Language Documentation v55, smart pin methods (RDPIN (Pin) : Zval, Zval[31] = C flag from RDPIN, other bits are RDPIN data)"