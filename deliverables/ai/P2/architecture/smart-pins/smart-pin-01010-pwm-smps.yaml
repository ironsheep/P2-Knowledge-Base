title: "PWM Switch-Mode Power Supply"
subtitle: "Smart Pin Mode %01010 (P_PWM_SMPS)"
language_reference: "combined"
compatible_languages: ["Spin2", "PASM2"]

brief_description: "PWM output with voltage and current feedback for switch-mode power supply control"

detailed_description:
  operation: |
    Generates PWM output for SMPS FET control with two feedback inputs. A-input monitors output
    voltage (starts new cycle when low). B-input monitors over-current condition (immediately
    forces output low for cycle remainder). Counter runs sawtooth pattern with automatic
    restart when voltage sags. Mode overrides OUT for direct FET gate control.
  
  timing: |
    Base period = X[15:0] system clocks
    Frame period = X[31:16] × base period
    Waits for A-input low after frame complete before restarting
    B-input high immediately truncates current PWM cycle

registers:
  x_register:
    bits_15_0: "Base period in system clocks"
    bits_31_16: "PWM frame period in base periods"
  y_register:  
    bits_15_0: "PWM duty value (0 to frame period)"
    bits_31_16: "Unused"
  z_register:
    function: "Not used in this mode"

flags:
  in_flag: "Raised when Y[15:0] captured after A-input goes low"
  out_signal: "Overridden by SMPS PWM output"
  a_input: "Voltage feedback (low triggers new cycle)"
  b_input: "Current limit (high forces immediate output low)"

code_examples:
  - title: "Basic SMPS Controller Setup"
    description: "6400-clock frame (25-clock base x 256; 39 kHz at 250 MHz), voltage/current feedback on adjacent pins"
    code: |
      CON
        _clkfreq = 250_000_000
        smps_out = 20                            ' FET gate driver
        v_sense = 21                             ' Voltage feedback: the A input (relative +1 pin)
        i_sense = 19                             ' Current sense: the B input (relative -1 pin)

      PUB main() | mode, xval, yval
        ' Pin 21 (A) and pin 19 (B) must present the feedback signals. For example, a pin in
        ' a level-comparison mode such as P_LEVEL_A, whose 8-bit level is the low byte of its
        ' WRPIN mode word, reads high when its input is above that level.

        ' Configure SMPS controller
        mode := P_PWM_SMPS | P_OE | P_PLUS1_A | P_MINUS1_B
        xval := $0100_0019                       ' 25 clocks base, 256 frame
        yval := $0000_0080                       ' 50% max duty
        
        pinstart(smps_out, mode, xval, yval)
        repeat                                    ' SMPS runs autonomously
      
      DAT
      ' PASM2 equivalent
        org
        dirl    #smps_out
        wrpin   ##P_PWM_SMPS | P_OE | P_PLUS1_A | P_MINUS1_B, #smps_out
        wxpin   ##$0100_0019, #smps_out
        dirh    #smps_out
        wypin   #$80, #smps_out                  ' Set duty cycle once

common_applications:
  - "Buck/boost DC-DC converters"
  - "Battery chargers with current limiting"
  - "LED drivers with brightness and current control"
  - "Motor drivers with voltage/current regulation"

related_modes:
  - "Mode %01000/%01001: Basic PWM modes without feedback"
  - "Mode %11000/%11001: ADC modes for analog feedback"
  - "Mode %00010/%00011: DAC modes for reference generation"

configuration_constants:
  mode_constant: "P_PWM_SMPS"
  binary_value: "%01010"
  common_modifiers:
    - "P_PLUS1_A / P_MINUS1_A - Select adjacent pin for voltage sense"
    - "P_PLUS1_B / P_MINUS1_B - Select adjacent pin for current sense"
    - "P_OE - Enable output drive"

notes:
  - "A-input low triggers new PWM cycle (voltage below target)"
  - "B-input high immediately cuts PWM output (over-current)"
  - "Can set Y once and run indefinitely with feedback control"
  - "The A and B inputs can be adjacent pins in the internal-DAC-comparison (level-comparison) mode"
  - "Output starts low during reset (DIR=0)"