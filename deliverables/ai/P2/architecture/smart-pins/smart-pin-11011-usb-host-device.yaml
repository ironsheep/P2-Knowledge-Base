title: "USB Host/Device"
subtitle: "Smart Pin Mode %11011 (P_USB_PAIR)"
language_reference: "combined"
compatible_languages: ["Spin2", "PASM2"]

brief_description: "USB differential pair control for host/device communication (even/odd pin pair = DM/DP)"

detailed_description:
  sources:
    - "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), %11011 = USB host or device, full-speed (12Mbps) or low-speed (1.5Mbps): pairing, WRPIN and WXPIN data, the WXPIN on-the-fly sentence, start sequence, WYPIN values, receiver status bits"
    - "Propeller 2 P2X8C4M64P Hardware Manual, Nov 1, 2022 Release, USB Host/Device (%11011), p.57: the sentence 'A new WRPIN can be done to effect such a change without resetting the smart pin'"
    - "EF-093"
    - "EF-102"
  pin_pairing: "This mode requires that two adjacent pins be configured together to form a USB pair, whose OUTs and %HHH_LLL drive modes will be overridden to control their output states. These pins must be an even/odd pair, having only the LSB of their pin numbers different. For example: pins 0 and 1, pins 2 and 3, and pins 4 and 5 can form USB pairs."
  which_pin_is_which:
    upper_odd_pin: "The upper (odd) pin is the DP pin. This pin's IN is raised whenever the output buffer empties, signalling that a new output byte can be written via WYPIN to the lower (even) pin. No WXPIN/WYPIN instructions are used for this pin."
    lower_even_pin: "The lower (even) pin is the DM pin. This pin's IN is raised whenever a change of status occurs in the receiver, at which point a RDPIN/RQPIN can be used on this pin to read the 16-bit status word. WXPIN is used on this pin to set the NCO baud rate."
    caveat: "These DP/DM electrical designations can actually be switched by swapping low-speed and full-speed modes, due to USB's complementary line signalling."
  configuration:
    wrpin_data: "They can be configured via WRPIN with identical D data of %1_11011_0. Using D data of %0_11011_0 will disable output drive and effectively create a USB 'sniffer'. A new WRPIN can be done to effect such a change without resetting the smart pin."
    wrpin_data_on_a_running_pair: >-
      A new WRPIN on a running USB pair switches it between drive (%1_11011_0) and sniffer
      (%0_11011_0) without resetting the smart pin and without cycling DIR. This holds even
      though the general rule is to change a smart pin's mode only while DIR is low.
      Measured on one pair (full-speed
      host, nothing attached, the receiver sensing the pair's own output): the receiver status
      after a live WRPIN to the sniffer word matched the status after the same change made
      through a DIR cycle, the status after a live WRPIN back to the drive word showed the
      driven K state, and a packet written afterwards arrived intact, in 5 of 5 rounds. Limits: one pair, full speed, host mode, no external device or resistors; only
      the drive/sniffer change (the %TT field) was tested.
    wxpin_data: "WXPIN is used on the lower pin to establish the specific USB mode and set the baud rate. D[15] must be 1 for 'host' or 0 for 'device'. D[14] must be 1 for 'full-speed' or 0 for 'low-speed'. D[13:0] sets the baud rate, which is a 16-bit fraction of the system clock, whose two MSBs must be 0, necessitating that the baud rate be less than 1/4th of the system clock frequency."
    wxpin_on_the_fly: >-
      Once established, these settings can be changed on-the-fly without resetting the USB
      smart pins; this is necessary when talking to both 'full-speed' and 'low-speed'
      devices over a USB hub. Measured: a WXPIN on a running pair -- the same word again, or a
      word with a different baud (the full-speed baud to the low-speed baud and back) -- sets
      the baud (D[13:0]) in force for the next packet, which arrives intact (5 of 5 rounds).
      The shortest gap tested from the WXPIN to writing the packet was about 119 clocks.
      The measurement covers the baud only: the full-speed/low-speed signalling bit D[14] is
      not observable on the test rig, so a change of that bit on a running pair is not
      claimed. Limits: host mode, one pair sensing its own output, nothing attached.
    worked_example: "For example, if the main clock is 80MHz and you want a 12MHz baud rate (full-speed), use 12,000,000 / 80,000,000 * $10000 = 9830, or $2666. To use this baud rate and select 'host' mode and 'full-speed', you could do 'WXPIN ##$E666,lowerpin'."
  start_sequence: "To start USB, clear the DIR bits of the intended two pins and configure them each via WRPIN. Use WXPIN on the lower pin to set the mode and baud rate. Then, set the pins' DIR bits. You are now ready to read the receiver status via RDPIN/RQPIN and set output states and send packets via WYPIN, both on the lower pin."
  state_machines: "There are separate state machines for transmitting and receiving. Only the baud generator is common between them. Note that the receiver receives not just input from another host/device, but all local output, as well."
  fpga_note: "In Propeller 2 emulation on an FPGA, there are no built-in 1.5k and 15k resistors, like the ASIC smart pins have, so it is up to you to install these yourself on the DP and DM lines."

registers:
  # All WXPIN/WYPIN/RDPIN for USB are issued on the LOWER (even / DM) pin.
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), %11011 = USB host or device, full-speed (12Mbps) or low-speed (1.5Mbps): WXPIN data, WYPIN values, receiver status bits"
  x_register:
    function: "USB mode + baud rate, set via WXPIN on the lower (even) pin"
    D_15: "1 = host, 0 = device"
    D_14: "1 = full-speed (12 Mbps), 0 = low-speed (1.5 Mbps)"
    D_13_0: "baud = 16-bit fraction of sysclk (baud_hz / sysclk_hz * $10000); the two MSBs must be 0, so baud < sysclk/4"
    example: "WXPIN ##$E666, lowerpin  ' host + full-speed + 12 MHz baud @ 80 MHz sysclk"
  y_register:
    function: "Line-state / packet command, set via WYPIN on the lower (even) pin"
    D_values:
      - "0   = output IDLE (float pins)"
      - "1   = output SE0 (drive both DP and DM low)"
      - "2   = output K"
      - "3   = output J (driven, like IDLE but driven)"
      - "4   = output EOP (SE0, SE0, J, then IDLE)"
      - "$80 = SOP (start-of-packet; then buffer bytes, automatic EOP when the buffer empties)"
    packet_send: "WYPIN #$80, then after each IN rise on the upper (odd) pin do WYPIN byte; always confirm the upper pin's IN rose before issuing the next WYPIN"
  z_register:
    function: "16-bit receiver status word, read via RDPIN/RQPIN on the lower (even) pin (error flag -> C)"
    bits:
      - "[31:16] unused ($0000)"
      - "[15:8]  byte — last byte received"
      - "[7] byte toggle — cleared on SOP, toggled on each byte received"
      - "[6] error — cleared on SOP, set on bit-unstuff error or EOP SE0 > 2 bit periods or SE1"
      - "[5] EOP in — cleared on SOP or 7 bit periods of J or K, set on EOP"
      - "[4] SOP in — cleared on EOP or 7 bit periods of J or K, set on SOP"
      - "[3] steady state — cleared on DP/DM state change, set on 7 bit periods of no change"
      - "[2] SE0 in — high when DP/DM state is SE0"
      - "[1] K in — high when DP/DM state is K"
      - "[0] J in — high when DP/DM state is J"

flags:
  in_flag_odd_dp: "Upper (odd / DP) pin: IN raised when the output buffer empties (a new TX byte can be written via WYPIN to the lower pin). No WXPIN/WYPIN are used on this pin."
  in_flag_even_dm: "Lower (even / DM) pin: IN raised on any change in receiver status; a WRPIN/WXPIN/WYPIN/RDPIN/AKPIN is required before IN can re-raise for the next change."
  c_flag: "On RDPIN/RQPIN of the lower pin, C = receiver error flag"
  out_override: "OUT signals overridden for USB differential control"

electrical_characteristics: >-
  NOT DOCUMENTED. The receiver front-end thresholds for the
  J / K / SE0 / SE1 line-state detectors are not in the P2 datasheet -- the datasheet
  names USB only twice, as a capability, and contains no line-state or SE0 material --
  nor in the Silicon Doc. Do not point a reader at the datasheet for them.
  The programming interface (baud, host/device, FS/LS, line-state sends, 16-bit status
  word) IS complete above; it is only the analog thresholds that are undocumented.
  Closing this needs Chip Gracey or a bench measurement, not further reading.

code_examples:
  - title: "USB Pin Pair Configuration"
    description: "Configure even/odd pin pair for USB"
    code: |
      CON
        _clkfreq = 200_000_000
        usb_dm_pin = 56                          ' Even pin (D-)
        usb_dp_pin = 57                          ' Odd pin (D+), must be dm_pin+1
      
      PUB main()
        ' Configure USB pin pair
        ' Even pin must be configured first
        pinstart(usb_dm_pin, P_USB_PAIR | P_OE, x_config, y_config)
        
        ' USB communication implemented in software driver
        ' Smart pins handle low-level differential signaling
        usb_protocol_handler()
      
      PRI usb_protocol_handler()
        ' USB protocol implementation would go here
        ' Smart pins handle the physical layer
        repeat
          ' Monitor USB events via IN flag
          if pinread(usb_dm_pin)
            ' Handle USB event...
      
      DAT
      ' PASM2 USB initialization
        org
        ' USB requires precise timing and protocol handling
        ' Smart pins provide differential signaling
        dirl    #usb_dm_pin                      ' Reset DM pin
        dirl    #usb_dp_pin                      ' Reset DP pin
        wrpin   usb_mode, #usb_dm_pin            ' Configure USB mode
        wxpin   usb_config, #usb_dm_pin          ' Set parameters
        dirh    #usb_dm_pin                      ' Enable USB pair
        dirh    #usb_dp_pin
        wypin   usb_ctrl, #usb_dm_pin            ' Control settings (after DIR is set, per the start sequence)
      
      usb_mode
        long    P_USB_PAIR | P_OE               ' USB pair, output enabled (active port)
      usb_config
        long    0
      usb_ctrl
        long    0

  - title: "USB Event Monitoring"
    description: "Monitor USB events and status"
    code: |
      CON
        _clkfreq = 200_000_000
        usb_dm = 56
        usb_dp = 57
      
      PUB main() | usb_status
        pinstart(usb_dm, P_USB_PAIR | P_OE, 0, 0)
        
        repeat
          ' Check for USB events
          if pinread(usb_dm)
            usb_status := rdpin(usb_dm)          ' Read USB status/data
            handle_usb_event(usb_status)
      
      PRI handle_usb_event(status)
        ' Process USB events based on status
        debug("USB Event: ", uhex(status))

