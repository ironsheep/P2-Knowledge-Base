configuration_constants:
  mode_constant: "P_USB_PAIR"
  binary_value: "%11011"
  pin_requirements: "Even/odd consecutive pin pair (even=DM/D-, odd=DP/D+)"
  out_override: "true"

notes:
  - "⚠️ Specialized mode - requires USB protocol implementation in software"
  - "MUST use even/odd consecutive pin pair (e.g., pins 56/57)"
  - "Even pin = DM (D-), odd pin = DP (D+)"
  - "OUT signals overridden for differential signaling control"
  - "Smart pins handle physical layer, software handles protocol"
  - "Supports USB 1.1 Full Speed and Low Speed"
  - "Requires careful timing and USB protocol knowledge"
  - "Consult USB specification and Parallax USB examples for complete implementation"
  - "Limited documentation available - refer to Parallax forums and examples"
