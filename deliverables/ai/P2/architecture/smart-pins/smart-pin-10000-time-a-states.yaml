title: "Time Input State Durations"
subtitle: "Smart Pin Mode %10000 (P_STATE_TICKS)"
language_reference: "combined"
compatible_languages: ["Spin2", "PASM2"]

brief_description: "Continuously measures duration of each high and low state on A-input in clock cycles"

detailed_description:
  operation: |
    Measures the duration of each logic state on A-input continuously. When input transitions,
    captures clock count of previous state in Z register and state type in C flag. Each
    transition triggers new measurement automatically.
  
  timing: |
    Continuous operation - no periodic mode
    IN flag raised on every state transition
    C flag indicates previous state (1=was high, 0=was low)
    Z limited to $80000000 (~10.7 seconds at 200MHz)
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), Smart Pins, %10000 = Time A-input states (Z will be limited to $80000000); $8000_0000 / 200_000_000 = 10.74 s"

registers:
  x_register:
    function: "Not documented: a role for X in this mode"
  y_register:
    function: "Not documented: a role for Y in this mode"
  z_register:
    function: "Duration of previous state in clock cycles (max $80000000)"
    reset_value: "$00000001 during reset (DIR=0); IN is low"

flags:
  in_flag: "Raised on every state transition"
  c_flag: "Previous state type (1=was high, 0=was low)"
  a_input: "Signal to measure state durations"

code_examples:
  - title: "PWM Signal Analysis"
    description: "Measure high and low times of PWM signal"
    code: |
      CON
        _clkfreq = 200_000_000
        pwm_pin = 53                             ' PWM input signal
      
      PUB main() | high_time, low_time, duty, duration
        pinstart(pwm_pin, P_STATE_TICKS, 0, 0)

        repeat
          ' Wait for state change and get duration
          repeat until pinr(pwm_pin)             ' Wait for transition

          duration := rdpin(pwm_pin)             ' Read ONCE: bit 31 = C (state), bits[30:0] = ticks
          if duration & $80000000                ' C flag in bit 31 = was high
            high_time := duration & $7FFFFFFF
          else
            low_time := duration & $7FFFFFFF
            
            ' Calculate duty cycle when we have both
            if high_time and low_time
              duty := (high_time * 100) / (high_time + low_time)
              debug("Duty: ", udec(duty), "%")
      
      DAT
      ' PASM2 continuous state timing
        org
        dirl    #pwm_pin                         ' Reset smart pin
        wrpin   ##P_STATE_TICKS, #pwm_pin
        dirh    #pwm_pin                         ' Enable timing
      .loop
        testp   #pwm_pin wc                      ' Wait for transition
        if_nc   jmp #.loop
        rdpin   duration_reg, #pwm_pin wc        ' Read duration, C=state
        if_c    mov high_reg, duration_reg       ' Was high
        if_nc   mov low_reg, duration_reg        ' Was low
        jmp     #.loop

      duration_reg    res     1
      high_reg        res     1
      low_reg         res     1

related_modes:
  - "Mode %10001: Time only high states"
  - "Mode %10010: Time with timeout capability"
  - "Mode %01111: Count clocks while high"
  - "Mode %10011-%10111: Period measurement modes"

configuration_constants:
  mode_constant: "P_STATE_TICKS"
  binary_value: "%10000"
  common_modifiers:
    - "P_INVERT_A - Swap high/low state interpretation"
    - "P_FILT1_AB - Filter the A and B inputs using the global filt1 settings"
    - "P_SCHMITT_A - Schmitt-trigger input on the A input"

notes:
  - "Automatically alternates between timing high and low states"
  - "C flag tells you what the previous state was"
  - "If states change faster than the cog retrieves measurements, old measurements are overwritten by new ones and effectively lost"
  - "Workaround: time highs (%10001) on two smart pins on the same signal, one with its A input inverted; both states are then captured as long as the sum of the states' durations does not exceed the cog's ability to retrieve both results. This helps when one state is very short and the other is not"
  - "Z register limited to $80000000"
  - "The Spin2 RDPIN() method returns the C flag (the prior state) in bit 31, so the Spin2 example takes the state from bit 31 and the duration from bits 30..0. A duration at the $80000000 limit has Z bit 31 set, so it reads as 0 in bits 30..0; inline PASM2 RDPIN with WC returns all 32 bits of Z in D and the state in C"

sources:
  - "operation, timing, notes (overrun and the two-pin workaround), registers: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PIN MODES (%10000 time A-input states)"
  - "notes (Spin2 RDPIN() bit 31): Parallax Propeller 2 Spin2 Language Documentation v55, smart pin methods (RDPIN (Pin) : Zval, Zval[31] = C flag from RDPIN, other bits are RDPIN data)"