title: "Accumulator Up/Down Counter"
subtitle: "Smart Pin Mode %01101 (P_REG_UP_DOWN)"
language_reference: "combined"
compatible_languages: ["Spin2", "PASM2"]

brief_description: "Counts A-input positive edges, incrementing when B high, decrementing when B low"

detailed_description:
  operation: |
    Accumulates positive edges on A-input with direction controlled by B-input state. When B is
    high, each A-input rising edge increments the counter. When B is low, each A-input rising
    edge decrements the counter. Maintains signed 32-bit accumulator for bidirectional counting.
    B-input can change at any time to reverse counting direction.
  
  timing: |
    Continuous mode (X=0): Z register always holds current net count
    Periodic mode (X>0): Net count over X clock cycles
    IN flag raised at end of each measurement period
    Direction changes take effect immediately

registers:
  x_register:
    bits_31_0: "Measurement period in clocks (0=continuous totalizer)"
  y_register:  
    function: "Not used in this mode"
  z_register:
    function: "Signed 32-bit net count (increments minus decrements)"

flags:
  in_flag: "Raised at end of measurement period (periodic mode only)"
  a_input: "Signal to count (positive edges)"
  b_input: "Direction control (high=increment, low=decrement)"

code_examples:
  - title: "Bidirectional Position Control"
    description: "Track position with up/down control"
    code: |
      CON
        _clkfreq = 200_000_000
        step_pin = 20                            ' Step pulse input
        dir_pin = 21                             ' Direction control
      
      PUB main() | position, last_pos
        ' Configure bidirectional counter
        pinstart(step_pin, P_REG_UP_DOWN | P_PLUS1_B, 0, 0)
        
        repeat
          position := rdpin(step_pin)            ' Read current position
          
          if position <> last_pos
            debug("Position: ", sdec(position))
            last_pos := position
          
          ' Reset position on button press
          if ina[0]
            pinclear(step_pin)
            pinstart(step_pin, P_REG_UP_DOWN | P_PLUS1_B, 0, 0)
      
      DAT
      ' PASM2 velocity measurement example
        org
        dirl    #step_pin                        ' Reset smart pin
        wrpin   ##P_REG_UP_DOWN | P_PLUS1_B, #step_pin
        wxpin   ##clkfreq/10, #step_pin          ' 100ms periods
        dirh    #step_pin                        ' Enable counter
      .loop
        testp   #step_pin wc                     ' Wait for period end
        if_nc   jmp #.loop
        rdpin   velocity, #step_pin              ' Net steps in 100ms
        ' Positive = forward, negative = reverse
        jmp     #.loop

common_applications:
  - "Stepper motor position tracking with direction"
  - "Linear actuator control with up/down counting"
  - "Inventory tracking (add/subtract operations)"
  - "Fill level monitoring with fill/drain inputs"

related_modes:
  - "Mode %01011: Quadrature encoder (automatic direction)"
  - "Mode %01100: Gated counter (B enables/disables)"
  - "Mode %01110: Separate up/down edge counters"
  - "Mode %01111: Count while high (level sensitive)"

configuration_constants:
  mode_constant: "P_REG_UP_DOWN"
  binary_value: "%01101"
  common_modifiers:
    - "P_PLUS1_B - Use next pin for direction"
    - "P_MINUS1_B - Use previous pin for direction"
    - "P_INVERT_B - Reverse direction logic"
    - "P_FILT1_AB - Add filtering for noise immunity"

notes:
  - "Only counts positive edges (0→1 transitions) on A"
  - "B-input state sampled at each A-edge for direction"
  - "Z register is signed for negative counts"
  - "Direction can change dynamically during operation"
  - "No mechanical switch debouncing - add filtering if needed"