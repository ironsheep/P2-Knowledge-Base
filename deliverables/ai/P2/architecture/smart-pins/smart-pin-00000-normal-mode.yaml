# Smart Pin Mode: %00000 - Normal (Smart Pin OFF)
# Concise reference optimized for AI code generation

mode: "%00000"
name: "Normal I/O (Smart Pin OFF)"
category: "basic_io"

# Constants
constants:
  spin2: "P_NORMAL"
  pasm2: "P_NORMAL"  
  mode_bits: "%00000"  # Smart pin disabled

# Operation
operation: |
  Smart pin disabled. Pin operates as standard I/O with direct control.
  DIR controls output enable, OUT sets output state, IN reads input.
  Can still use low-level pin modes (DAC, ADC, comparator, etc).

# Parameters (when smart pin OFF)
x_register: "Not used by smart pin"
y_register: "Not used by smart pin"
z_register: "Not used by smart pin"
in_flag: "Reflects physical pin state (not smart pin)"

# Pin Usage
pins:
  normal_operation: |
    DIR=0: Input mode (Hi-Z)
    DIR=1: Output mode (drives OUT value)
    IN: Always reflects pin state
    OUT: Output value when DIR=1

# Complete Spin2 Example
spin2_complete: |
  CON
    LED_PIN = 56
    BUTTON_PIN = 57
    
  PUB main()
    ' Configure as normal I/O (smart pin OFF)
    WRPIN(LED_PIN, P_NORMAL)     ' Or just 0
    WRPIN(BUTTON_PIN, P_NORMAL)
    
    ' Simple LED control
    PINHIGH(LED_PIN)              ' DIR=1, OUT=1
    WAITMS(500)
    PINLOW(LED_PIN)               ' DIR=1, OUT=0
    WAITMS(500)
    PINTOGGLE(LED_PIN)            ' Toggle OUT
    
    ' Read button with pull-up
    WRPIN(BUTTON_PIN, P_NORMAL | P_HIGH_15K)  ' Add pull-up
    PINFLOAT(BUTTON_PIN)          ' Input mode
    
    REPEAT
      IF PINREAD(BUTTON_PIN) == 0  ' Active low button
        PINHIGH(LED_PIN)
      ELSE
        PINLOW(LED_PIN)
        
  PUB configure_analog(pin)
    ' Can still use low-level modes
    WRPIN(pin, P_NORMAL | P_ADC_1X)     ' ADC mode, no smart pin
    WRPIN(pin, P_NORMAL | P_DAC_124R_3V) ' DAC mode, no smart pin
    WRPIN(pin, P_NORMAL | P_COMPARE_AB)  ' Comparator, no smart pin

# Complete PASM2 Example  
pasm2_complete: |
  DAT
          ORG
  
  ' Pin assignments
  led_pin       LONG  56
  button_pin    LONG  57
  
  ' Configure pins as normal I/O
  setup_pins
          MOV   pin, led_pin
          WRPIN #P_NORMAL, pin        ' Smart pin OFF
          DIRH  pin                   ' Output mode
          
          MOV   pin, button_pin
          WRPIN ##P_NORMAL | P_HIGH_15K, pin  ' With pull-up
          DIRL  pin                   ' Input mode
          RET
  
  ' Blink LED
  blink_led
          MOV   pin, led_pin
          DRVNOT pin                  ' Toggle output
          WAITX ##25_000_000          ' 250ms @ 100MHz
          RET
          
  ' Read button and control LED
  main_loop
          MOV   pin, button_pin
          TESTP pin WC                ' Read pin to C
    IF_NC MOV   pin, led_pin         ' If button pressed (low)
    IF_NC DRVH  pin                  ' Turn LED on
    IF_C  MOV   pin, led_pin         ' If button released
    IF_C  DRVL  pin                  ' Turn LED off
          JMP   #main_loop
          
  ' Variables
  pin     RES   1

# Inline PASM2 in Spin2
spin2_inline: |
  PUB toggle_fast(pin)
    ' Direct pin control in PASM2
    ORG
      DRVNOT pin                    ' Toggle pin directly
    END
    
  PUB read_pin(pin) : state
    ORG
      TESTP  pin WC                 ' Read pin to C flag
      MUXC   state, #1             ' Move C to bit 0 of state
    END

# Key Points
standard_io: |
  No smart pin features active
  Direct control via DIR/OUT/IN
  Fastest response time (2 clocks)
  
low_level_modes: |
  Can combine with P_DAC_*, P_ADC_*, P_COMPARE_* modes
  These work without smart pin enabled
  
common_uses:
  - "Simple LED control"
  - "Button/switch input"
  - "Direct bit-banging"
  - "When smart pin features not needed"
  
transition_to_smart: |
  WRPIN with mode value enables smart pin
  WRPIN with 0 returns to normal I/O
  
related: ["All modes - this is the default/OFF state"]