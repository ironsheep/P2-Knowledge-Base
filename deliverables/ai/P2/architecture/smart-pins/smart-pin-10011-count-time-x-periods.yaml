title: "Period Time Accumulator"
subtitle: "Smart Pin Mode %10011 (P_PERIODS_TICKS)"
language_reference: "combined"
compatible_languages: ["Spin2", "PASM2"]

brief_description: "Measures total time for X complete A-to-B periods"

detailed_description:
  operation: |
    Accumulates clock cycles over X complete periods defined by A and B input events. Each
    period starts on A-input event and ends on B-input event. After X periods complete, total
    accumulated time is available in Z register. Useful for average period measurement, phase
    timing, and multi-cycle analysis.
  
  timing: |
    Measures from A-event to B-event for each period
    Accumulates time over X complete periods
    Y[1:0] selects edge types for A and B inputs
    Z limited to $80000000 (~10.7 seconds at 200MHz)

registers:
  x_register:
    bits_31_0: "Number of periods to accumulate"
  y_register:  
    bits_1_0: "Event types: 00=A-rise/B-rise, 01=A-rise/B-edge, 10=A-edge/B-rise, 11=A-edge/B-edge"
    bits_31_2: "Unused"
  z_register:
    function: "Total accumulated time for X periods in clocks"
    reset_value: "$00000000 during reset (DIR=0) — note this period-counting mode preloads 0, unlike the %10000/%10001/%10010 state/timing modes which preload $00000001; IN is low (Silicon part4-smart-pins.txt)"

flags:
  in_flag: "Raised after X periods complete"
  a_input: "Period start signal"
  b_input: "Period end signal"

code_examples:
  - title: "Average Period Measurement"
    description: "Measure average period over 10 cycles"
    code: |
      CON
        _clkfreq = 200_000_000
        signal_pin = 53
      
      PUB main() | total_time, avg_period
        ' Configure for 10 period measurement
        pinstart(signal_pin, P_PERIODS_TICKS | P_PLUS1_B, 10, %00)
        
        repeat
          repeat until pinr(signal_pin)          ' Wait for completion
          total_time := rdpin(signal_pin)
          
          avg_period := total_time / 10
          debug("Average period: ", udec(avg_period), " clocks")
      
      DAT
      ' PASM2 phase measurement
        org
        dirl    #signal_pin
        wrpin   ##P_PERIODS_TICKS | P_PLUS1_B, #signal_pin
        wxpin   #1, #signal_pin                  ' Single period
        wypin   #%00, #signal_pin                ' Rise to rise
        dirh    #signal_pin
      .loop
        testp   #signal_pin wc
        if_nc   jmp #.loop
        rdpin   phase_time, #signal_pin          ' A-rise to B-rise time
        jmp     #.loop

common_applications:
  - "Average frequency measurement"
  - "Phase delay measurement"
  - "Multi-cycle timing analysis"
  - "Communication protocol timing"

related_modes:
  - "Mode %10100: Count states over X periods"
  - "Mode %10101-%10111: Time-window period modes"
  - "Mode %10010: Time X events"

configuration_constants:
  mode_constant: "P_PERIODS_TICKS"
  binary_value: "%10011"
  common_modifiers:
    - "P_PLUS1_B - Use adjacent pin for B input"
    - "P_LOCAL_B - Use same pin for both A and B (single signal)"
    - "P_FILT1_AB - Add filtering"

notes:
  - "Accumulates time over multiple periods for averaging"
  - "Can measure phase by using different pins for A and B"
  - "Use BBBB bits to select B input source"
  - "Setting B=A measures single signal period"
  - "Z register accumulates all X period times"