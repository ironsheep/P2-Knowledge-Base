title: "Time Events or Timeout Detection"
subtitle: "Smart Pin Mode %10010 (P_EVENTS_TICKS)"
language_reference: "combined"
compatible_languages: ["Spin2", "PASM2"]

brief_description: "Dual-mode: Time X events or detect timeout when events stop occurring"

detailed_description:
  operation: |
    Two distinct modes controlled by Y[2]. When Y[2]=0, times duration until X events occur
    (highs/rises/edges). When Y[2]=1, detects timeout if no event occurs within X clocks,
    maintaining running count since last event. Useful for frequency measurement, watchdog
    timers, and communication timeout detection.
  
  timing: |
    Event timing mode (Y[2]=0): Measures time for X events
    Timeout mode (Y[2]=1): Triggers after X clocks without event
    Y[1:0] selects event type: high(00), rise(01), edge(1x)
    Z limited to $80000000 (~10.7 seconds at 200MHz)

registers:
  x_register:
    bits_31_0: "Event count (Y[2]=0) or timeout clocks (Y[2]=1)"
  y_register:  
    bit_2: "0=time X events, 1=timeout detection"
    bits_1_0: "Event type: 00=high, 01=rise, 1x=edge"
    bits_31_3: "Unused"
  z_register:
    function: "Clock count (event timing) or clocks since last event (timeout)"

flags:
  in_flag: "Raised when X events complete or timeout occurs"
  a_input: "Signal to monitor for events"

code_examples:
  - title: "Frequency Measurement"
    description: "Measure frequency by timing 100 rising edges"
    code: |
      CON
        _clkfreq = 200_000_000
        freq_pin = 53
      
      PUB main() | period, frequency
        ' Time 100 rising edges
        pinstart(freq_pin, P_EVENTS_TICKS, 100, %001)
        
        repeat
          repeat until pinr(freq_pin)            ' Wait for measurement
          period := rdpin(freq_pin) & $7FFFFFFF  ' Clock count for 100 edges
          
          frequency := (_clkfreq * 100) / period
          debug("Frequency: ", udec(frequency), " Hz")
      
      DAT
      ' PASM2 timeout watchdog
        org
        dirl    #freq_pin
        wrpin   ##P_EVENTS_TICKS, #freq_pin
        wxpin   ##clkfreq/10, #freq_pin          ' 100ms timeout
        wypin   #%101, #freq_pin                 ' Timeout on missing edge
        dirh    #freq_pin
      .loop
        testp   #freq_pin wc                     ' Check for timeout
        if_c    call #handle_timeout
        ' Normal operation continues
        jmp     #.loop
      
      handle_timeout
        rdpin   elapsed, #freq_pin               ' Clocks since last edge
        ' Handle communication loss
        ret

common_applications:
  - "Frequency and period measurement"
  - "Communication watchdog timers"
  - "Event rate monitoring"
  - "Missing pulse detection"

related_modes:
  - "Mode %10000: Time state durations"
  - "Mode %10001: Time high periods only"
  - "Mode %10011-%10111: Period measurement modes"

configuration_constants:
  mode_constant: "P_EVENTS_TICKS"
  binary_value: "%10010"
  common_modifiers:
    - "P_INVERT_A - Invert input signal"
    - "P_FILT1_AB - Add filtering for noise immunity"

notes:
  - "Y[2]=0: Times until X events occur"
  - "Y[2]=1: Detects missing events (timeout)"
  - "Event types: level-sensitive (high) or edge-sensitive (rise/edge)"
  - "Timeout mode maintains running count since last event"
  - "Z register limited to $80000000 clocks"