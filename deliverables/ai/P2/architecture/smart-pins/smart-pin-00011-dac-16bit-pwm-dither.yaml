# Smart Pin Mode: %00011 - DAC 16-bit with PWM Dither
# Concise reference optimized for AI code generation

mode: "%00011"
name: "DAC 16-bit with PWM Dither"
category: "dac"

# Constants
constants:
  spin2: "P_DAC_DITHER_PWM"
  pasm2: "P_DAC_DITHER_PWM"
  mode_bits: "%00011"
  
# Critical: Requires DAC mode configuration
dac_requirement: |
  M[12:10] MUST be %101 for DAC output
  Use: P_DAC_DITHER_PWM | P_DAC_124R_3V | P_OE
  Other DAC options: P_DAC_990R_3V, P_DAC_600R_2V, P_DAC_75R_2V

# Operation
operation:
  source: "Propeller 2 Documentation v35, %00011 and DAC_MODE = DAC 16-bit with PWM dither -- engineering/ingestion/sources/silicon-doc/part4-smart-pins.txt:284-308"
  what_it_does: "This mode overrides M[7:0] to feed the pin's 8-bit DAC with PWM-dithered data on every clock. M[12:10] must be set to %101 to configure the low-level pin for DAC output."
  sample_period: "X[15:0] establishes the sample period in clock cycles. The sample period must be a multiple of 256 (X[7:0]=0), so that an integral number of 256 steps are afforded the PWM, which dithers the DAC between adjacent 8-bit levels."
  output_value: "Y[15:0] establishes the DAC output value which gets captured at each sample period and used for its duration."
  completion: "On completion of each sample period, Y[15:0] is captured for the next output value and IN is raised. Therefore, you would coordinate updating Y[15:0] with IN going high."
  versus_pseudo_random: "PWM dithering will give better dynamic range than pseudo-random dithering, since a maximum of only two transitions occur for every 256 clocks. This means, though, that a frequency of Fclock/256 will be present in the output at -48dB."

accuracy_caveat: |
  The "16-bit" output is a NOMINAL, time-averaged figure: the smart pin dithers
  the underlying 8-bit DAC between adjacent levels to achieve 16-bit DAC output
  averaged over time (Silicon Doc part4-smart-pins.txt).

# Parameters
x_register:
  function: "Sample period in clocks"
  X[15:0]: "Must be multiple of 256 (X[7:0] must be 0)"
  constraint: "Period = N × 256 clocks for integral PWM steps"
  example: "$100 (256), $200 (512), $400 (1024)"

y_register:
  function: "16-bit DAC output value"
  Y[15:0]: "DAC value captured at each sample period"
  update: "Coordinate with IN flag going high"

z_register:
  function: "ADC accumulation (if OUT=1)"
  usage: "16-bit ADC reading from last sample period"
  enable: "Set OUT=1 to enable ADC feedback"

in_flag: |
  Raised at end of each sample period
  Indicates Y[15:0] captured for next output
  Use to synchronize value updates

# Pin Behavior
pin_behavior:
  source: "Propeller 2 Documentation v35 -- engineering/ingestion/sources/silicon-doc/part4-smart-pins.txt:286-287, :305-308"
  reset_state: "During reset (DIR=0), IN is low and Y[15:0] is captured."
  adc_feedback: "If OUT is high, the ADC will be enabled and RDPIN/RQPIN can be used to retrieve the 16-bit ADC accumulation from the last sample period. This can be used to measure loading on the DAC pin."
  low_level_pin_requirement: "M[12:10] must be set to %101 to configure the low-level pin for DAC output."

spin2_complete: |
  CON
    DAC_PIN = 48
    SAMPLE_PERIOD = $100        ' 256 clocks (minimum)
    
  VAR
    LONG dac_value
    
  PUB main()
    setup_pwm_dac()
    
    ' Generate clean sine wave
    REPEAT
      REPEAT dac_value FROM 0 TO 360
        output_sine(dac_value)
        WAITMS(1)
    
  PUB setup_pwm_dac() | mode
    ' Configure for 16-bit PWM dithered DAC
    mode := P_DAC_DITHER_PWM | P_DAC_124R_3V | P_OE
    
    PINCLEAR(DAC_PIN)
    WRPIN(DAC_PIN, mode)
    WXPIN(DAC_PIN, SAMPLE_PERIOD)  ' Must be multiple of 256
    PINHIGH(DAC_PIN)               ' Enable FIRST (universal init order)
    WYPIN(DAC_PIN, $8000)          ' THEN write Y: mid-scale initial
    
  PUB output_sine(angle) | value16
    ' Output sine wave value
    value16 := $8000 + (SIN(angle, $7FFF) >> 16)
    
    ' Wait for sample period complete
    REPEAT UNTIL PINREAD(DAC_PIN)
    WYPIN(DAC_PIN, value16)
    
  PUB setup_audio_dac() | mode
    ' Optimized for audio - higher sample rate
    mode := P_DAC_DITHER_PWM | P_DAC_600R_2V | P_OE
    
    PINCLEAR(DAC_PIN)
    WRPIN(DAC_PIN, mode)
    WXPIN(DAC_PIN, $400)           ' 1024 clocks
    PINHIGH(DAC_PIN)
    
  PUB read_load_feedback() : adc_value
    ' Read ADC to detect loading (requires OUT=1)
    PINWRITE(DAC_PIN, 1)           ' Enable ADC
    WAITMS(1)                      ' Allow accumulation
    adc_value := RDPIN(DAC_PIN)

# Complete PASM2 Example
pasm2_complete: |
  DAT
          ORG
  
  ' Pin assignment and mode
  dac_pin       LONG  48
  dac_mode      LONG  P_DAC_DITHER_PWM | P_DAC_124R_3V | P_OE
  sample_period LONG  $100          ' 256 clocks minimum
  
  ' Setup 16-bit PWM dithered DAC
  setup_dac
          MOV   pin, dac_pin
          DIRL  pin                 ' Reset (captures Y)
          WRPIN dac_mode, pin       ' Configure mode
          MOV   x, sample_period
          WXPIN x, pin              ' Set period (multiple of 256)
          DIRH  pin                 ' Enable FIRST (universal init order)
          WYPIN ##$8000, pin        ' THEN write Y: mid-scale initial
          RET
  
  ' Output value synchronized with IN
  output_sync
          MOV   pin, dac_pin
  .wait   TESTP pin WC              ' Test IN flag
    IF_NC JMP   #.wait              ' Wait for sample complete
          WYPIN value16, pin        ' Update value
          RET
  
  ' Generate ramp waveform
  ramp_gen
          MOV   value16, #0
  .loop   CALL  #output_sync        ' Output current value
          ADD   value16, #256       ' Increment
          AND   value16, ##$FFFF    ' Wrap at 16-bit
          JMP   #.loop
  
  ' High-quality audio output
  audio_setup
          MOV   pin, dac_pin
          MOV   mode, ##P_DAC_DITHER_PWM | P_DAC_600R_2V | P_OE
          DIRL  pin
          WRPIN mode, pin
          WXPIN ##$800, pin         ' 2048 clocks for audio
          DIRH  pin
          RET
  
  ' Variables
  pin           RES   1
  mode          RES   1  
  x             RES   1
  value16       RES   1

# Inline PASM2 in Spin2
spin2_inline: |
  PUB wait_and_output(pin, value16)
    ' Synchronized DAC update
    ORG
  .wait
      TESTP  pin WC                 ' Test IN flag
      IF_NC  JMP #.wait             ' Wait for period end
      WYPIN  value16, pin           ' Update DAC value
    END
    
  PUB set_dac_fast(pin, value16)
    ' Direct update (may cause glitch)
    ORG
      WYPIN  value16, pin
    END

# Key Points
pwm_characteristics:
  source: "Propeller 2 Documentation v35 -- engineering/ingestion/sources/silicon-doc/part4-smart-pins.txt:290-291, :301-302"
  sample_period_constraint: "The sample period must be a multiple of 256 (X[7:0]=0), so that an integral number of 256 steps are afforded the PWM."
  transition_bound: "A maximum of only two transitions occur for every 256 clocks."
  spectral_cost: "A frequency of Fclock/256 will be present in the output at -48dB."

pwm_advantages: |
  Better dynamic range than pseudo-random
  Only 2 transitions per 256 clocks
  Cleaner spectrum for audio applications
  Lower switching noise
  
synchronization: |
  IN flag indicates sample period complete
  Update Y after IN goes high
  Prevents mid-period glitches
  
common_uses:
  - "High-quality audio DAC"
  - "Precision analog control"
  - "Low-noise voltage references"
  - "Motor control signals"
  - "Analog synthesizers"

comparison_with_prng: |
  PWM: Better dynamic range, predictable spectrum
  PRNG: No periodic components, more transitions
  Choose PWM for audio, PRNG for control signals

related: ["00010 (DAC PRNG Dither)", "00001 (DAC Noise)", "Normal mode with P_DAC_*"]