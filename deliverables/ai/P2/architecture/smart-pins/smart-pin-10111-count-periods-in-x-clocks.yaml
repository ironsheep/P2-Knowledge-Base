title: "Count Periods Within X Clock Cycles"
subtitle: "Smart Pin Mode %10111 (P_COUNTER_PERIODS)"
language_reference: "combined"
compatible_languages: ["Spin2", "PASM2"]

brief_description: "Counts complete signal periods that occur within a minimum X-clock time window"

detailed_description:
  operation: |
    Time-windowed period counter. Counts the number of complete A/B periods that occur within at
    least X clock cycles. Measurement continues until X clocks elapse AND the current period
    completes. Returns period count along with actual elapsed time. When combined with modes
    %10101 (time) and %10110 (states) running concurrently, enables precise frequency and duty
    cycle calculation.
  
  timing: |
    Minimum measurement window is X clock cycles
    Measurement extends to complete the period in progress when X clocks elapse
    Period boundaries defined by Y[1:0] trigger combination
    IN flag raised when measurement completes
    Z register contains period count
    Actual elapsed time longer than X due to period completion

registers:
  x_register:
    bits_31_0: "Minimum time window duration in clock cycles (X+ clocks)"
  y_register:
    bits_1_0: |
      Event trigger sensitivity:
      %00 = A-input rise to B-input rise
      %01 = A-input rise to B-input edge
      %10 = A-input edge to B-input rise
      %11 = A-input edge to B-input edge
  z_register:
    function: "Count of complete periods within X+ clock window (max $80000000)"

flags:
  in_flag: "Raised when measurement completes (X clocks + period completion)"
  a_input: "Signal to monitor (period start marker)"
  b_input: "Period end marker (can be same as A-input)"

code_examples:
  - title: "Frequency Measurement"
    description: "Measure frequency by counting periods in time window"
    code: |
      CON
        _clkfreq = 200_000_000
        signal_pin = 20
        window_ms = 100                          ' 100ms measurement window
      
      PUB main() | period_count, window_clks, frequency
        window_clks := (_clkfreq / 1000) * window_ms
        
        ' Count periods in ~100ms windows
        pinstart(signal_pin, P_COUNTER_PERIODS, window_clks, %00)
        
        repeat
          repeat until pinread(signal_pin)       ' Wait for measurement complete
          
          period_count := rdpin(signal_pin)      ' Get period count
          
          ' Frequency = periods / time
          ' Approximate: period_count * 10 (since ~100ms window)
          frequency := period_count * 10
          debug("Frequency: ~", udec(frequency), " Hz (", udec(period_count), " periods)")
      
      DAT
      ' PASM2 example - precise frequency measurement
        org
        dirl    #signal_pin                      ' Reset smart pin
        wrpin   ##P_COUNTER_PERIODS, #signal_pin
        wxpin   ##clkfreq, #signal_pin           ' 1-second minimum window
        wypin   #%00, #signal_pin                ' Rise to rise
        dirh    #signal_pin                      ' Start measurement
      .loop
        testp   #signal_pin wc                   ' Check IN flag
        if_nc   jmp #.loop                       ' Wait for complete
        rdpin   periods, #signal_pin             ' Period count = frequency
        ' periods now contains Hz (cycles per second)
        jmp     #.loop                           ' Next measurement starts auto

  - title: "Exact Frequency and Duty Measurement (3-pin canonical idiom)"
    description: "Concurrent %10111 + %10101 + %10110 measurement for exact frequency and duty cycle"
    code: |
      CON
        _clkfreq = 200_000_000
        pin_base = 20                            ' All three pins observe the same signal
        window_ms = 100
      
      PUB main() | periods, ticks, highs, freq, duty, window_clks
        window_clks := (_clkfreq / 1000) * window_ms
        
        ' Three cells, same period-aligned window, started together for matched timing.
        ' The signal is on pin_base+0 only; the other two cells watch it via A-input
        ' routing (P_MINUS1_A / P_MINUS2_A), so no extra wiring and the pins stay free.
        ' Pin 20: count complete A-periods within the window
        pinstart(pin_base+0, P_COUNTER_PERIODS, window_clks, %00)
        ' Pin 21: measure actual elapsed ticks (>= window_clks, period-extended)
        pinstart(pin_base+1, P_COUNTER_TICKS | P_MINUS1_A, window_clks, %00)
        ' Pin 22: measure total clocks A was high during the same window
        pinstart(pin_base+2, P_COUNTER_HIGHS | P_MINUS2_A, window_clks, %00)
        
        repeat
          ' Wait for all three measurements to complete
          repeat until pinread(pin_base+0) and pinread(pin_base+1) and pinread(pin_base+2)
          
          periods := rdpin(pin_base+0)           ' Complete A-periods in window
          ticks   := rdpin(pin_base+1)           ' Actual elapsed clocks (>= window_clks)
          highs   := rdpin(pin_base+2)           ' Clocks A was high during window
          
          ' Exact results - all three measurements span the SAME period-aligned window
          freq := MULDIV64(periods, _clkfreq, ticks)  ' 64-bit product avoids overflow
          duty := MULDIV64(highs, 100, ticks)         ' high-time / elapsed-time (percent)
          
          debug("Freq: ", udec(freq), "Hz, Duty: ", udec(duty), "%")

common_applications:
  - "Precise frequency measurement"
  - "Variable frequency monitoring"
  - "Combined with duty cycle measurement for full signal characterization"
  - "Event rate counting in time windows"

related_modes:
  - "Mode %10101 (P_COUNTER_TICKS): same period-aligned window; Z = elapsed ticks (pair to compute exact frequency)"
  - "Mode %10110 (P_COUNTER_HIGHS): same period-aligned window; Z = high-time (pair to compute exact duty cycle)"
  - "Mode %10100 (P_PERIODS_HIGHS): X complete A-periods window; Z = high-time"
  - "Mode %10011 (P_PERIODS_TICKS): X complete A-periods window; Z = elapsed ticks"

configuration_constants:
  mode_constant: "P_COUNTER_PERIODS"
  binary_value: "%10111"
  common_modifiers:
    - "(single-pin) no routing constant needed - A and B inputs both default to this pin"
    - "P_PLUS1_B - Use next pin as B-input"
    - "P_MINUS1_B - Use previous pin as B-input"
    - "P_FILT1_AB - Add filtering for noise immunity"
  
  y_register_values:
    - "%00 - A-rise to B-rise (typical for frequency measurement)"
    - "%01 - A-rise to B-edge (any B transition ends period)"
    - "%10 - A-edge to B-rise (any A transition starts period)"
    - "%11 - A-edge to B-edge (maximum sensitivity)"

notes:
  - "Measurement extends beyond X clocks to complete the final period"
  - "Period count with time window enables frequency calculation: freq = periods / time"
  - "Best used with concurrent measurements on multiple pins for complete signal analysis"
  - "Combines with mode %10101 (time) and %10110 (states) for full characterization"
  - "B-input can be same as A-input for single-pin period counting"
  - "Documentation states: 'At least two measurements must be made concurrently for useful results'"
