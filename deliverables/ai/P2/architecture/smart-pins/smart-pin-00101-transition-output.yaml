# Smart Pin Mode: %00101 - Transition Output
# Concise reference optimized for AI code generation

mode: "%00101"
name: "Transition Output"
category: "timing"

# Constants
constants:
  spin2: "P_TRANSITION"
  pasm2: "P_TRANSITION"
  mode_bits: "%00101"

# Operation
operation: |
  Generates specified number of output transitions (toggles).
  Each transition occurs at base period interval.
  Equal high/low times create square wave.
  Pin toggles Y times then holds final state.

# Parameters
x_register:
  function: "Base period for transitions"
  X[15:0]: "Period in clocks between transitions"
  timing: "Each edge occurs after X[15:0] clocks"

y_register:
  function: "Number of transitions"
  Y[31:0]: "Transition count (edges, not cycles)"
  behavior: "Non-zero starts toggling, decrements each edge"
  note: "Y=2 creates one complete cycle"
  y_zero: "Y=0 leaves the pin idle (no transitions). It does NOT generate a continuous wave -- for a free-running square wave use an NCO mode (%00110/%00111)."

z_register: "Not used"

in_flag: "Raised when Y transitions complete"

out_signal: "Overridden by smart pin"

# Pin Behavior
pin_behavior:
  reset_state: "IN=0, output=0, Y=0"
  output_control: "Toggles on each transition"
  final_state: "Holds last state after completion"
  timing: "Starts at next base period after Y written"

# Complete Spin2 Example
spin2_complete: |
  CON
    CLK_PIN = 40
    TX_PIN = 41  ' Sync serial TX companion
    
  PUB main()
    ' Generate a fixed number of clock transitions
    generate_clock(CLK_PIN, 1000, 16)   ' 16 transitions
    ' For a CONTINUOUS square wave use an NCO mode (%00110/%00111), NOT %00101 --
    ' see related. In %00101, Y=0 leaves the pin idle; it does NOT free-run.

  PUB generate_clock(pin, period, transitions) | mode
    mode := P_TRANSITION | P_OE

    PINCLEAR(pin)
    WRPIN(pin, mode)
    WXPIN(pin, period)              ' Transition period
    PINHIGH(pin)                    ' Enable FIRST (universal init order)
    WYPIN(pin, transitions)         ' THEN write Y -> triggers the transitions

  PUB sync_serial_clock() | mode
    ' Clock for synchronous serial modes
    mode := P_TRANSITION | P_OE

    PINCLEAR(CLK_PIN)
    WRPIN(CLK_PIN, mode)
    WXPIN(CLK_PIN, 100)             ' Bit period
    PINHIGH(TX_PIN)                 ' Enable the TX data pin
    PINHIGH(CLK_PIN)                ' Enable the clock pin FIRST
    WYPIN(CLK_PIN, 16)              ' THEN trigger: 8 bits = 16 transitions

# Complete PASM2 Example
pasm2_complete: |
  DAT
          ORG
  
  ' Pin and mode configuration
  clk_pin       LONG  40
  trans_mode    LONG  P_TRANSITION | P_OE
  
  ' Generate N transitions
  gen_transitions
          MOV   pin, clk_pin
          DIRL  pin                   ' Reset
          WRPIN trans_mode, pin       ' Configure
          WXPIN period, pin           ' Set period
          DIRH  pin                   ' Enable FIRST (universal init order)
          WYPIN count, pin            ' THEN write Y -> triggers the transitions
  .wait   TESTP pin WC                ' Test IN
    IF_NC JMP   #.wait              ' Wait for completion
          RET

  ' For a CONTINUOUS square wave use an NCO mode (%00110/%00111), not %00101 --
  ' see related. Writing Y=0 here leaves the pin idle; it does NOT free-run.

  ' Synchronized clocking for serial
  sync_clock
          MOV   pin, #41              ' TX pin
          DIRL  pin
          ' Configure TX pin first
          WRPIN ##P_SYNC_TX | P_OE, pin
          WXPIN #%1_00111, pin        ' 8-bit
          DIRH  pin

          MOV   pin, clk_pin
          DIRL  pin
          WRPIN trans_mode, pin
          WXPIN #100, pin             ' Bit period
          DIRH  pin                   ' Enable FIRST (universal init order)
          WYPIN #16, pin              ' THEN trigger: 16 edges for 8 bits
          RET
  
  ' Variables
  pin           RES   1
  period        LONG  1000
  count         LONG  16

# Inline PASM2 in Spin2
spin2_inline: |
  PUB quick_toggle(pin, edges)
    ORG
      DIRL  pin
      WRPIN ##P_TRANSITION | P_OE, pin
      WXPIN #2, pin                 ' Fast toggle
      DIRH  pin                     ' Enable FIRST (universal init order)
      WYPIN edges, pin              ' THEN write Y -> triggers the transitions
    END

# Key Points
transition_counting: |
  Y counts edges, not complete cycles
  2 transitions = 1 complete cycle
  Odd count leaves pin in opposite state

init_order: |
  Universal smart-pin init order: reset (PINCLEAR/DIRL) -> setup (WRPIN/WXPIN)
  -> ENABLE (PINHIGH/DIRH) -> OPERATE (WYPIN). For trigger modes like %00101 the
  Y-write MUST come AFTER enable -- Y is held 0 during reset, so writing Y while
  still disabled never triggers. NOTE: pinstart() writes Y before raising DIR, so
  it is UNSAFE for the trigger modes (%00100/%00101); use the explicit sequence.

synchronization: |
  Perfect for clock generation
  Commonly paired with sync serial modes
  Start after data pin configured

common_uses:
  - "Clock generation for sync serial"
  - "Stepper motor stepping"
  - "Square wave generation"
  - "Pulse train output"
  - "Bit-banged protocol clocking"

related:
  - "00100 (Pulse)"
  - "11100-11101 (Sync Serial)"
  - "00110-00111 (NCO)"
