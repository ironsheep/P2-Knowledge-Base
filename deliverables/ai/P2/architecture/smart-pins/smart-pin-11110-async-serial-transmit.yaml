title: "Asynchronous Serial Transmit"
subtitle: "Smart Pin Mode %11110 (P_ASYNC_TX)"
language_reference: "combined"
compatible_languages: ["Spin2", "PASM2"]

brief_description: "Asynchronous serial transmission at programmable baud rate (1-32 bits per frame)"

detailed_description:
  operation: |
    Transmits serial data asynchronously with automatic start bit (logic-0) and stop bit (logic-1)
    generation. Supports 1-32 data bits per frame at programmable baud rates. Hardware handles
    timing and framing automatically. OUT signal is overridden for serial output control. Can
    optionally include parity bit in data (calculated by software). Ideal for UART communication.
  
  timing: |
    Baud rate set by X register (system clocks per bit period)
    Start bit (0) transmitted automatically
    Data bits transmitted LSB first
    Stop bit (1) transmitted automatically
    IN flag raised when transmission complete and ready for next byte

registers:
  x_register:
    bits_31_16: "System clock periods per bit period (integer part)"
    bits_15_10: "Fractional clock periods (base-2 fraction for precise timing)"
    bits_9_5: "Reserved"
    bits_4_0: "Word-size field, encoded as N-1 (write 0..31 to select 1..32 data bits; e.g. write 7 for an 8-bit word)"
  y_register:
    bits_31_0: "Data to transmit (LSB transmitted first)"
  z_register:
    function: "Not used in transmit mode"

flags:
  in_flag: "Raised when transmission complete, ready for next byte"
  out_override: "OUT signal overridden for serial transmission"

code_examples:
  - title: "Basic 8-bit UART Transmit"
    description: "Standard 115200 baud 8N1 serial output"
    code: |
      CON
        _clkfreq = 200_000_000
        tx_pin = 20
        baud = 115_200
      
      PUB main() | bit_period
        ' Calculate bit period: clocks/bit = clkfreq / baud
        bit_period := (_clkfreq / baud) << 16   ' Shift to X[31:16]

        ' Configure async TX: 8 data bits (X[4:0] = N-1 = 7)
        pinstart(tx_pin, P_ASYNC_TX | P_OE, (bit_period | 7), 0)
        
        ' Send text string
        send_string(string("Hello, World!", 13, 10))
      
      PUB send_string(str_ptr) | char
        repeat
          char := byte[str_ptr++]
          if char == 0
            quit
          send_byte(char)
      
      PUB send_byte(value)
        ' Wait for transmitter ready
        repeat until pinread(tx_pin)
        
        ' Send byte
        wypin(tx_pin, value)
      
      DAT
      ' PASM2 example - high-speed serial output
        org
        mov     bit_period, ##(_clkfreq / baud) << 16
        or      bit_period, #7                   ' 8 data bits (X[4:0] = N-1)
        
        dirl    #tx_pin                          ' Reset smart pin
        wrpin   tx_mode, #tx_pin                 ' Configure mode
        wxpin   bit_period, #tx_pin              ' Set baud and bits
        dirh    #tx_pin                          ' Enable smart pin
        
        ' Send message
        mov     ptra, ##message
      .loop
        rdbyte  data, ptra++                     ' Get next character
        cmp     data, #0 wz                      ' Check for null
        if_z    jmp #.done
        call    #transmit
        jmp     #.loop
      .done
        ret
      
      transmit
        testp   #tx_pin wc                       ' Wait for ready
        if_nc   jmp #transmit
        wypin   data, #tx_pin                    ' Send byte
        ret
      
      tx_mode
        long    P_ASYNC_TX | P_OE
      message
        byte    "Hello!", 13, 10, 0
      data    long    0

  - title: "Precise Baud Rate with Fractional Timing"
    description: "Use fractional bits for exact baud rates"
    code: |
      CON
        _clkfreq = 200_000_000
        tx_pin = 20
        baud = 115_200
      
      PUB main() | bit_period, frac_period
        ' Calculate precise bit period with fractional part
        ' bit_period = (clkfreq / baud) * 65536
        bit_period := (_clkfreq * 65536) / baud

        ' Mask to X[31:10] and add 8 data bits (X[4:0] = N-1 = 7)
        frac_period := (bit_period & $FFFFFC00) | 7

        pinstart(tx_pin, P_ASYNC_TX | P_OE, frac_period, 0)
        
        ' Now transmissions will have precise timing
        send_byte($55)                           ' Send test pattern

  - title: "Variable Data Width Transmission"
    description: "Transmit different bit widths (7, 8, 9 bits)"
    code: |
      CON
        _clkfreq = 200_000_000
        tx_pin = 20
        baud = 9600
      
      PUB main() | bit_period
        bit_period := (_clkfreq / baud) << 16

        ' Configure for 9-bit mode (e.g., with parity); X[4:0] = N-1 = 8
        pinstart(tx_pin, P_ASYNC_TX | P_OE, (bit_period | 8), 0)

        ' Send 9-bit value (8 data + 1 parity)
        send_9bit($01FF)                         ' 8 data bits + parity

      PUB send_9bit(value)
        repeat until pinread(tx_pin)
        wypin(tx_pin, value)

      PUB send_7bit(value) | bit_period
        ' Reconfigure for 7-bit ASCII; X[4:0] = N-1 = 6
        bit_period := (_clkfreq / baud) << 16
        pinstart(tx_pin, P_ASYNC_TX | P_OE, (bit_period | 6), 0)

        repeat until pinread(tx_pin)
        wypin(tx_pin, value & $7F)

common_applications:
  - "UART serial communication"
  - "Debug console output"
  - "Serial terminal communication"
  - "Multi-drop serial networks (RS-485)"
  - "GPS and sensor module communication"

related_modes:
  - "Mode %11111: Async serial RX - asynchronous receive"
  - "Mode %11100: Sync serial TX - synchronous transmission"
  - "Mode %11101: Sync serial RX - synchronous receive"

configuration_constants:
  mode_constant: "P_ASYNC_TX"
  binary_value: "%11110"
  required_modifiers: "P_OE (P_TT_01) to enable output"
  out_override: "true"
  
  common_baud_rates:
    - "300, 1200, 2400, 4800, 9600 baud"
    - "19200, 38400, 57600, 115200 baud"
    - "230400, 460800, 921600 baud (high speed)"
  
  bit_period_calculation:
    formula: "bit_period = (clkfreq / baud) << 16"
    fractional: "(clkfreq * 65536 / baud) & $FFFFFC00"
    bits_31_16: "Integer system clocks per bit"
    bits_15_10: "Fractional base-2 value (1/64th increments)"
  
  data_bits_field:
    location: "X[4:0]"
    encoding: "Field value = N - 1 (write 0..31 to select 1..32 data bits)"
    range: "1-32 bits supported"
    typical_values:
      - "X[4:0] = 6 → 7-bit word (7-bit ASCII)"
      - "X[4:0] = 7 → 8-bit word (standard 8-bit data)"
      - "X[4:0] = 8 → 9-bit word (8 data + parity)"

notes:
  - "OUT signal automatically overridden in this mode"
  - "Start bit (0) and stop bit (1) added automatically by hardware"
  - "Data transmitted LSB first (standard UART format)"
  - "Use P_OE modifier to enable output"
  - "IN flag indicates transmitter ready for next byte"
  - "Supports up to 32 data bits per frame (including optional parity)"
  - "Word-size field X[4:0] is encoded as N-1: write 7 for an 8-bit word, 6 for 7-bit, 8 for 9-bit"
  - "Fractional timing in X[15:10] enables precise baud rate control"
  - "Can achieve very high baud rates limited only by system clock"
  - "No hardware parity generation - calculate and insert in data if needed"
  - "Compatible with standard UART devices"
