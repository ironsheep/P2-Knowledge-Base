title: "ADC Scope with Trigger"
subtitle: "Smart Pin Mode %11010 (P_ADC_SCOPE)"
language_reference: "combined"
compatible_languages: ["Spin2", "PASM2"]

brief_description: "Triggered ADC data capture for oscilloscope-like functionality"

detailed_description:
  operation: |
    ADC capture mode with trigger functionality for oscilloscope-like data acquisition. Captures
    ADC samples based on trigger conditions, enabling waveform capture and analysis. Extends the
    basic ADC modes with triggered acquisition capability. Useful for capturing transient events
    and analyzing signal behavior around specific trigger points.
  
  timing: |
    Trigger condition defined by Y register settings
    Captures samples when trigger condition met
    IN flag raised when capture completes
    Supports pre-trigger and post-trigger capture

registers:
  x_register:
    function: "ADC configuration (similar to modes %11000/%11001)"
  y_register:
    function: "Trigger level and configuration"
  z_register:
    function: "Captured ADC sample data"

flags:
  in_flag: "Raised when triggered capture completes"
  a_input: "Analog signal to monitor and capture"
  b_input: "Optional external trigger or clock"

code_examples:
  - title: "Basic Triggered Capture"
    description: "Capture ADC data when signal crosses threshold"
    code: |
      CON
        _clkfreq = 200_000_000
        adc_pin = 46                             ' Analog input
      
      PUB main() | captured_value
        ' Configure ADC scope mode
        ' Mode configuration requires trigger level in Y register
        pinstart(adc_pin, P_ADC_SCOPE, x_config, trigger_level)
        
        repeat
          ' Wait for trigger event
          repeat until pinread(adc_pin)
          
          captured_value := rdpin(adc_pin)       ' Read captured sample
          debug("Triggered: ", udec(captured_value))
      
      DAT
      ' PASM2 example - triggered acquisition
        org
        dirl    #adc_pin                         ' Reset smart pin
        wrpin   scope_mode, #adc_pin             ' Configure scope mode
        wxpin   adc_config, #adc_pin             ' ADC settings
        wypin   trigger_level, #adc_pin          ' Set trigger level
        dirh    #adc_pin                         ' Enable smart pin
      .loop
        testp   #adc_pin wc                      ' Check for trigger
        if_nc   jmp #.loop                       ' Wait for event
        rdpin   sample, #adc_pin                 ' Read captured data
        ' Process triggered sample...
        jmp     #.loop
      
      scope_mode
        long    %0000_0000_000_100011_0000000_00_11010_0
      adc_config
        long    %00_0111                         ' 8-bit resolution
      trigger_level
        long    $8000                            ' Mid-range trigger
      sample
        long    0

  - title: "Waveform Capture System"
    description: "Capture signal waveforms around trigger events"
    code: |
      CON
        _clkfreq = 200_000_000
        adc_pin = 46
        buffer_size = 256
      
      VAR
        long waveform_buffer[buffer_size]
        long capture_index
      
      PUB main() | i
        ' Setup triggered capture
        pinstart(adc_pin, P_ADC_SCOPE, %00_0111, $8000)
        
        repeat
          capture_index := 0
          
          ' Wait for trigger
          repeat until pinread(adc_pin)
          
          ' Capture waveform after trigger
          repeat i from 0 to buffer_size-1
            waveform_buffer[i] := rdpin(adc_pin)
            waitct(getcnt() + (_clkfreq / 100_000))  ' Sample rate
          
          ' Analyze captured waveform...
          debug_waveform()
      
      PRI debug_waveform() | i
        repeat i from 0 to buffer_size-1
          debug("Sample ", udec(i), ": ", udec(waveform_buffer[i]))

common_applications:
  - "Oscilloscope functionality"
  - "Transient event capture"
  - "Signal anomaly detection"
  - "Waveform analysis and characterization"

related_modes:
  - "Mode %11000: ADC internal clock - continuous sampling"
  - "Mode %11001: ADC external clock - synchronized sampling"
  - "Mode %10010: Time events with timeout - digital trigger"

configuration_constants:
  mode_constant: "P_ADC_SCOPE"
  binary_value: "%11010"
  required_pin_config: "%100011 in bits 17:12 for ADC functionality"

notes:
  - "⚠️ Limited documentation available for this mode"
  - "Trigger functionality extends basic ADC capture"
  - "Y register sets trigger level for capture initiation"
  - "Useful for capturing signals around specific voltage thresholds"
  - "Can be combined with software buffering for waveform storage"
  - "Requires M[12:10] = %100 for ADC pin configuration"
  - "Consult Parallax forums and application notes for detailed usage"
