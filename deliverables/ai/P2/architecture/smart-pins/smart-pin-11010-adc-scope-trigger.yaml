title: "ADC Scope with Trigger"
subtitle: "Smart Pin Mode %11010 (P_ADC_SCOPE)"
language_reference: "combined"
compatible_languages: ["Spin2", "PASM2"]

brief_description: "Triggered ADC data capture for oscilloscope-like functionality"

detailed_description:
  operation: |
    ADC capture mode with trigger functionality for oscilloscope-like data acquisition. Captures
    ADC samples based on trigger conditions, enabling waveform capture and analysis. Extends the
    basic ADC modes with triggered acquisition capability. Useful for capturing transient events
    and analyzing signal behavior around specific trigger points.
  
  timing: |
    Trigger is configured entirely via WXPIN (the A and B trigger values and the
    filter select all live in the X register). On every clock the mode computes an
    8-bit ADC sample and checks hysteretic triggering. Triggering is a two-step
    arm-then-trigger: IN is raised on the trigger, then the mode waits for a new
    arming event. RDPIN/RQPIN returns the 8-bit sample with the 'armed' state in C.

registers:
  x_register:
    function: "Trigger and filter configuration (set via WXPIN)"
    X[15:10]: "B trigger value (6-bit; MSB-justifies to sample[7:2] for comparison)"
    X[7:2]: "A trigger value (6-bit; MSB-justifies to sample[7:2] for comparison)"
    X[1:0]: "Filter select (windowed FIR on the scope bitstream): %00=68-tap Tukey, %01=45-tap Tukey, %1x=28-tap Hann. Each sample normalizes to 8 bits, but the effective DC dynamic range is only ~5-6 bits depending on filter length."
    trigger_pattern: |
      The A/B relationship sets the arm-then-trigger pattern:
        A>B:  arm when sample[7:2] >= A, then trigger when sample[7:2] < B
        A<=B: arm when sample[7:2] < A,  then trigger when sample[7:2] >= B
  y_register:
    function: "Not used in this mode"
  z_register:
    function: "8-bit ADC sample (read via RDPIN/RQPIN; C flag returns the 'armed' state)"

flags:
  in_flag: "Raised on trigger (after arming); the 'armed' state is then cancelled"
  a_input: "Analog signal to monitor and capture"
  b_input: "Optional external trigger or clock"

code_examples:
  - title: "Basic Triggered Capture"
    description: "Capture ADC data when signal crosses threshold"
    code: |
      CON
        _clkfreq = 200_000_000
        adc_pin = 46                             ' Analog input
      
      PUB main() | captured_value
        ' Trigger A/B values + filter select go in X (WXPIN); Y is unused.
        ' B=48, A=16 (A<=B): arm when sample < 16, trigger when sample >= 48.
        pinstart(adc_pin, P_ADC_SCOPE, (48 << 10) | (16 << 2), 0)

        repeat
          ' Wait for trigger event
          repeat until pinread(adc_pin)

          captured_value := rdpin(adc_pin)       ' Read 8-bit sample (C = armed)
          debug("Triggered: ", udec(captured_value))

      DAT
      ' PASM2 example - triggered acquisition
        org
        dirl    #adc_pin                         ' Reset smart pin
        wrpin   scope_mode, #adc_pin             ' Configure scope mode
        wxpin   scope_trig, #adc_pin             ' A/B trigger values + filter (X)
        dirh    #adc_pin                         ' Enable smart pin
      .loop
        testp   #adc_pin wc                      ' Check for trigger (C = armed)
        if_nc   jmp #.loop                       ' Wait for event
        rdpin   sample, #adc_pin                 ' Read 8-bit sample
        ' Process triggered sample...
        jmp     #.loop

      scope_mode
        long    %0000_0000_000_100011_0000000_00_11010_0
      scope_trig
        long    (48 << 10) | (16 << 2) | %00     ' B=48, A=16, 68-tap Tukey
      sample
        long    0

  - title: "Waveform Capture System"
    description: "Capture signal waveforms around trigger events"
    code: |
      CON
        _clkfreq = 200_000_000
        adc_pin = 46
        buffer_size = 256
      
      VAR
        long waveform_buffer[buffer_size]
        long capture_index
      
      PUB main() | i
        ' Setup triggered capture (trigger A/B + filter in X; Y unused)
        pinstart(adc_pin, P_ADC_SCOPE, (48 << 10) | (16 << 2), 0)
        
        repeat
          capture_index := 0
          
          ' Wait for trigger
          repeat until pinread(adc_pin)
          
          ' Capture waveform after trigger
          repeat i from 0 to buffer_size-1
            waveform_buffer[i] := rdpin(adc_pin)
            waitct(getcnt() + (_clkfreq / 100_000))  ' Sample rate
          
          ' Analyze captured waveform...
          debug_waveform()
      
      PRI debug_waveform() | i
        repeat i from 0 to buffer_size-1
          debug("Sample ", udec(i), ": ", udec(waveform_buffer[i]))

common_applications:
  - "Oscilloscope functionality"
  - "Transient event capture"
  - "Signal anomaly detection"
  - "Waveform analysis and characterization"

related_modes:
  - "Mode %11000: ADC internal clock - continuous sampling"
  - "Mode %11001: ADC external clock - synchronized sampling"
  - "Mode %10010: Time events with timeout - digital trigger"

configuration_constants:
  mode_constant: "P_ADC_SCOPE"
  binary_value: "%11010"
  required_pin_config: "%100011 in bits 17:12 for ADC functionality"

notes:
  - "Trigger A/B values and the filter select are all in the X register (WXPIN); Y is not used"
  - "A and B are 6-bit; they MSB-justify to sample[7:2] for comparison. Their relationship (A>B vs A<=B) sets the arm-then-trigger pattern"
  - "Each sample normalizes to 8 bits, but the effective DC dynamic range is only ~5-6 bits depending on the selected filter length — treat the low bits as filter residue when choosing A/B trigger thresholds"
  - "RDPIN/RQPIN returns the 8-bit sample; the C flag returns the 'armed' state"
  - "Useful for capturing signals around specific voltage thresholds"
  - "Can be combined with software buffering for waveform storage"
  - "Requires M[12:10] = %100 for ADC pin configuration"
  - "The cog's SCOPE data pipe (SETSCP/GETSCP) can aggregate four 4-pin-block samples per clock for the streamer — see the SETSCP/GETSCP instructions"

power_domain:
  fact: |
    P_ADC_GIO / P_ADC_VIO reference THIS pin's own 8-pin power group (pins 0-7, 8-15, ...,
    56-63 each share one isolated VIO/GIO supply pair). A single-pin ratiometric reading is
    therefore absolute against its own group's rails.
  multi_pin_layout: |
    Pins tied to a SHARED NODE for one measurement must sit WITHIN A SINGLE 8-pin group to
    share a reference domain; straddling a group boundary mixes supply domains and degrades
    the result. Independent single-ended channels on different pins are unaffected.
  reference: "Full mechanism + sourcing: p2kbArchPinPowerDomains"

related:
  - architecture/pin-power-domains.yaml
  - architecture/smart_pins.yaml
  - language/pasm2/setscp.yaml
  - language/pasm2/getscp.yaml

