# Smart Pin Mode: %00100 - Pulse/Cycle Output
# Concise reference optimized for AI code generation

mode: "%00100"
name: "Pulse/Cycle Output"
category: "timing"

# Constants
constants:
  spin2: "P_PULSE"
  pasm2: "P_PULSE"
  mode_bits: "%00100"

# Operation
operation: |
  Generates programmable pulses and cycles. OUT overridden.
  Base period counter counts from X[15:0] down to 1.
  Output high when counter > X[31:16] and Y > 0.
  Y decrements after each pulse/cycle until zero.

# Parameters
x_register:
  function: "Pulse timing configuration"
  X[15:0]: "Base period in clocks (high+low time)"
  X[31:16]: "Compare value (output high when counter > this)"
  examples:
    - "X=$0002_0003: 3-clock period, high for 1 clock (pattern: 0-0-1)"
    - "X=$0000_nnnn: Continuous high while Y > 0"
    - "X=$0008_0010: 16-clock period, 50% duty (8 high, 8 low)"

y_register:
  function: "Number of pulses/cycles"
  Y[31:0]: "Pulse count (decrements to 0)"
  behavior: "Non-zero starts output, decrements each cycle"

z_register: "Not documented: a Z (RDPIN/RQPIN) result for this mode"

in_flag: "Raised when Y reaches 0 (pulses complete)"

out_signal: "Overridden by smart pin"

# Pin Behavior
pin_behavior:
  reset_state: "IN=0, output=0, Y=0"
  output_control: "Smart pin controls output directly"
  timing: "Starts at next base period after Y written"

# Complete Spin2 Example
spin2_complete: |
  CON
    PULSE_PIN = 48
    
  PUB main()
    ' Pulse train example
    pulse_train(1000, 2000, 16)    ' 16 pulses, each high for 1000 clocks of a 2000-clock period

    ' Square wave burst
    square_wave_burst(50)          ' 50% duty, 50 cycles

  PUB pulse_train(width_clocks, period_clocks, count) | mode, low_clocks
    mode := P_PULSE | P_OE
    low_clocks := period_clocks - width_clocks   ' X[31:16]: nonzero, so the output is high for width_clocks of each period

    PINCLEAR(PULSE_PIN)
    WRPIN(PULSE_PIN, mode)
    WXPIN(PULSE_PIN, (low_clocks << 16) | period_clocks)  ' X[15:0] = period, X[31:16] = low clocks
    PINHIGH(PULSE_PIN)              ' Enable FIRST (general init order)
    WYPIN(PULSE_PIN, count)         ' THEN trigger: number of pulses
    
    ' Wait for completion
    REPEAT UNTIL PINREAD(PULSE_PIN)
    
  PUB square_wave_burst(cycles) | mode, period
    mode := P_PULSE | P_OE
    period := $0008_0010            ' X[15:0] = 16-clock period, X[31:16] = 8: high for 8 of 16 clocks (50% duty)
    
    PINCLEAR(PULSE_PIN)
    WRPIN(PULSE_PIN, mode)
    WXPIN(PULSE_PIN, period)       
    PINHIGH(PULSE_PIN)             ' Enable FIRST (general init order)
    WYPIN(PULSE_PIN, cycles)       ' THEN trigger
    
  PUB custom_pattern() | mode, pattern
    ' Generate 0-0-1 pattern
    mode := P_PULSE | P_OE
    pattern := $0002_0003           ' X[15:0] = 3-clock period, X[31:16] = 2: high while counter > 2
    
    PINCLEAR(PULSE_PIN)
    WRPIN(PULSE_PIN, mode)
    WXPIN(PULSE_PIN, pattern)       ' 0-0-1 repeating
    PINHIGH(PULSE_PIN)              ' Enable FIRST (general init order)
    WYPIN(PULSE_PIN, 100)           ' THEN trigger: 100 repetitions

# Complete PASM2 Example
pasm2_complete: |
  DAT
          ORG
  
  ' Pin and mode configuration
  pulse_pin     LONG  48
  pulse_mode    LONG  P_PULSE | P_OE
  
  ' Generate N pulses of specified width within a fixed period
  gen_pulses
          MOV   pin, pulse_pin
          DIRL  pin                   ' Reset
          WRPIN pulse_mode, pin       ' Configure
          MOV   x, pulse_period       ' 2000 clocks
          SUB   x, width              ' 2000 - 1000 = 1000 low clocks, nonzero
          SHL   x, #16                ' X[31:16] = low clocks: output high for width clocks of each period
          OR    x, pulse_period       ' X[15:0] = base period
          WXPIN x, pin               ' Set timing
          DIRH  pin                  ' Enable FIRST (general init order)
          WYPIN count, pin           ' THEN trigger: set count
  .wait   TESTP pin WC               ' Test IN
    IF_NC JMP   #.wait             ' Wait for completion
          RET
  
  ' Generate square wave
  square_wave
          MOV   pin, pulse_pin
          DIRL  pin
          WRPIN pulse_mode, pin
          MOV   x, period            ' Base period
          SHR   x, #1                ' Half period
          MOV   temp, x
          SHL   x, #16              ' To X[31:16]
          OR    x, period           ' X = period | (period/2 << 16)
          WXPIN x, pin
          DIRH  pin                 ' Enable FIRST (general init order)
          WYPIN ##1000, pin         ' THEN trigger: 1000 cycles
          RET
  
  ' Variables
  width         LONG  1000          ' 1000 clocks
  pulse_period  LONG  2000          ' 2000 clocks
  count         LONG  16
  period        LONG  100
  pin           RES   1
  x             RES   1
  temp          RES   1

# Inline PASM2 in Spin2
spin2_inline: |
  PUB trigger_pulse(pin, width_clocks)
    ORG
      DIRL  pin
      WRPIN ##P_PULSE | P_OE, pin
      WXPIN width_clocks, pin       ' X[15:0] = width, X[31:16] = 0: high for the whole period while Y > 0
      DIRH  pin                     ' Enable FIRST (general init order)
      WYPIN #1, pin                 ' THEN trigger: single pulse
    END

# Key Points
timing_control: |
  Counter runs X[15:0] down to 1, then reloads
  Output high when counter > X[31:16]
  Allows complex duty cycles and patterns

special_cases: |
  X[31:16]=0: Continuous high while Y > 0 (output high for the whole time Y > 0, one long high, not separate pulses)
  X[31:16]=X[15:0]-1: Single clock high pulse (high for 1 clock of each period)
  X[31:16]=X[15:0]/2: 50% duty square wave
  N separate pulses, each W clocks high: X[15:0] = period (W < period), X[31:16] = period - W (nonzero), Y = N

related: ["00101 (Transition)", "00110 (NCO Freq)", "01000-01001 (PWM modes)"]

sources:
  - "operation, x_register, y_register, in_flag, pin_behavior, special_cases: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PIN MODES (%00100 pulse/cycle output)"
  - "examples (general init order, WYPIN after DIRH): EF-011"