title: "ADC Sample/Filter/Capture - External Clock"
subtitle: "Smart Pin Mode %11001 (P_ADC_EXT)"
language_reference: "combined"
compatible_languages: ["Spin2", "PASM2"]

brief_description: "Analog-to-digital conversion synchronized to external clock for delta-sigma ADC integration"

detailed_description:
  operation: |
    Samples A-input data on positive edge of B-input clock signal, designed for external delta-sigma
    ADC integration. Supports same filtering modes as internal clock version but synchronized to
    external timing. A-input carries ADC bitstream data, B-input provides sample clock. Enables use
    of external high-precision ADC chips with P2's filtering capabilities.
  
  timing: |
    A-input sampled on each B-input rising edge
    Sample period configurable via X register
    Y register can override period for non-power-of-2 periods
    IN flag raised when sample period completes
    New measurement begins automatically

registers:
  x_register:
    bits_5_4: |
      Filtering mode:
      %00 = SINC2 sampling (complete conversion in hardware)
      %01 = SINC2 filtering (software post-processing required)
      %10 = SINC3 filtering (software post-processing required)
      %11 = Bitstream capturing (raw bits, LSB=oldest)
    bits_3_0: "Sample period = 2^(X[3:0]) clocks (or overridden by Y register)"
  y_register:
    bits_13_0: "Optional override for sample period (non-power-of-2 periods)"
  z_register:
    function: "ADC measurement value or accumulator result"

flags:
  in_flag: "Raised when sample period completes"
  a_input: "ADC bitstream data input (from external delta-sigma ADC)"
  b_input: "External sample clock (A sampled on B rising edges)"

code_examples:
  - title: "External Delta-Sigma ADC Interface"
    description: "Interface with external ADC using B-input clock"
    code: |
      CON
        _clkfreq = 200_000_000
        adc_data_pin = 20                        ' A-input: ADC data
        adc_clock_pin = 21                       ' B-input: ADC clock
      
      PUB main() | sample
        ' Configure for external ADC with SINC2 sampling
        ' Use P_PLUS1_B to use next pin as B-input (clock)
        pinstart(adc_data_pin, P_ADC_EXT | P_PLUS1_B, %00_0111, 0)
        
        repeat
          ' Wait for sample ready
          repeat until pinread(adc_data_pin)
          
          sample := rdpin(adc_data_pin)          ' Read completed sample
          debug("External ADC: ", udec(sample))
      
      DAT
      ' PASM2 example - external ADC with 10-bit resolution
        org
        dirl    #adc_data_pin                    ' Reset smart pin
        wrpin   adc_mode, #adc_data_pin          ' Configure mode
        wxpin   #%00_1001, #adc_data_pin         ' SINC2 sampling, 10-bit
        dirh    #adc_data_pin                    ' Enable smart pin
      .loop
        testp   #adc_data_pin wc                 ' Check IN flag
        if_nc   jmp #.loop                       ' Wait for sample
        rdpin   result, #adc_data_pin            ' Read sample
        ' Process result...
        jmp     #.loop
      
      adc_mode
        long    %0000_0000_000_100011_0000001_00_11001_0  ' P_PLUS1_B for clock
      result
        long    0

  - title: "SINC3 Filtering with Custom Period"
    description: "Use Y register to set non-power-of-2 period"
    code: |
      CON
        _clkfreq = 200_000_000
        adc_data_pin = 20
      
      DAT
        org
        dirl    #adc_data_pin                    ' Reset smart pin
        wrpin   adc_mode, #adc_data_pin          ' Configure ADC mode
        wxpin   #%10_0111, #adc_data_pin         ' SINC3 filtering base
        wypin   #320, #adc_data_pin              ' Override: 320 clock period
        dirh    #adc_data_pin                    ' Enable smart pin
        
        ' SINC3 requires software post-processing
      .loop
        testp   #adc_data_pin wc                 ' Wait for sample ready
        if_nc   jmp #.loop
        rdpin   x, #adc_data_pin                 ' Get SINC3 accumulator
        
        ' Post-processing: compute difference
        shl     x, #5                            ' Prescale 27-bit to 32-bit
        sub     x, diff1                         ' First difference
        add     diff1, x                         ' Update accumulator
        sub     x, diff2                         ' Second difference
        add     diff2, x                         ' Update accumulator
        sub     x, diff3                         ' Third difference
        add     diff3, x                         ' Update accumulator
        
        ' x now contains the sample
        jmp     #.loop
      
      adc_mode
        long    %0000_0000_000_100011_0000001_00_11001_0
      x       res     1
      diff1   res     1
      diff2   res     1
      diff3   res     1

  - title: "Bitstream Capture Mode"
    description: "Capture raw ADC bitstream for custom processing"
    code: |
      CON
        _clkfreq = 200_000_000
        adc_data_pin = 20
      
      PUB main() | bitstream
        ' Capture 32 new bits per sample
        pinstart(adc_data_pin, P_ADC_EXT | P_PLUS1_B, %11_0101, 0)
        
        repeat
          repeat until pinread(adc_data_pin)
          bitstream := rdpin(adc_data_pin)       ' 32 bits, LSB=oldest
          ' Custom processing of raw bitstream...

common_applications:
  - "Integration with external high-precision delta-sigma ADCs"
  - "Multi-channel synchronized ADC systems"
  - "High-speed data acquisition from external converters"
  - "Custom ADC filtering algorithms"

related_modes:
  - "Mode %11000: ADC internal clock - P2's internal ADC"
  - "Mode %11010: ADC scope trigger - triggered acquisition"
  - "Mode %11101: Sync serial receive - serial data input"

configuration_constants:
  mode_constant: "P_ADC_EXT"
  binary_value: "%11001"
  required_pin_config: "%100011_00000000_00_11001_0"
  
  filtering_modes:
    - "%00 - SINC2 sampling (complete in hardware, power-of-2 periods only)"
    - "%01 - SINC2 filtering (software difference computation required)"
    - "%10 - SINC3 filtering (software multi-stage difference required)"
    - "%11 - Bitstream capturing (raw bits for custom processing)"
  
  resolution_table:
    sinc2_sampling:
      - "8 clocks = 4 bits"
      - "128 clocks = 8 bits"
      - "8,192 clocks = 14 bits (practical max)"
    sinc3_filtering:  # NOMINAL decimation word-width (bits), NOT measured ENOB
      - "16 clocks = 8 bits (nominal)"
      - "128 clocks = 14 bits (nominal)"
      - "512 clocks = 18 bits (nominal max, limited by 27-bit accumulator)"
    bitstream:
      - "32 clocks = 32 new bits (max before overflow)"

notes:
  - "A-input carries data, B-input is sample clock (use P_PLUS1_B modifier)"
  - "Samples A-input on each B-input rising edge"
  - "Y register overrides X[3:0] period for non-power-of-2 sample rates"
  - "SINC2 accurate starting second period, SINC3 accurate starting third period"
  - "27-bit accumulators require careful overflow handling in software"
  - "SINC3 limited to 512 samples/period due to accumulator size"
  - "SINC2 supports up to 11,585 clocks/period"
  - "Prescale 27-bit to 32-bit (SHL #5) or post-trim (ZEROX #26) for overflow handling"
  - "Multiple pins can be configured simultaneously using pin group bits"
  - "Resolution figures are NOMINAL decimation word-widths (theoretical bits), NOT ENOB. ENOB (Effective Number of Bits) is the MEASURED effective resolution after noise and distortion; true effective resolution on P2 is lower than the nominal figures and depends on the reference supply, source impedance, and temperature — it must be characterized on hardware."
  - "The SINC3 column's apparent doubling of resolution over SINC2 is an idealized figure the P2 ADC does not actually deliver; treat SINC3 nominal figures as optimistic upper bounds, not attainable resolution."

power_domain:
  fact: |
    P_ADC_GIO / P_ADC_VIO reference THIS pin's own 4-pin power group (pins 0-3, 4-7, ...,
    60-63 each share one isolated VIO/GIO supply pair). A single-pin ratiometric reading is
    therefore absolute against its own group's rails.
  multi_pin_layout: |
    Pins tied to a SHARED NODE for one measurement must sit WITHIN A SINGLE 4-pin group to
    share a reference domain; straddling a group boundary mixes supply domains and degrades
    the result. Independent single-ended channels on different pins are unaffected.
  reference: "Full mechanism + sourcing: p2kbArchPinPowerDomains"

related:
  - architecture/pin-power-domains.yaml
  - architecture/smart_pins.yaml

see_also:
  - "I/O pin power domains — isolated groups of 4 sharing VIO/GIO; governs the P_ADC_GIO/P_ADC_VIO reference: p2kbArchPinPowerDomains"
