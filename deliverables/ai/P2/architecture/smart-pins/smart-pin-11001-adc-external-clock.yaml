title: "ADC Sample/Filter/Capture - External Clock"
subtitle: "Smart Pin Mode %11001 (P_ADC_EXT)"
language_reference: "combined"
compatible_languages: ["Spin2", "PASM2"]

brief_description: "Analog-to-digital conversion synchronized to an external clock for delta-sigma ADC integration"

detailed_description:
  operation: |
    In the externally-clocked mode the A input is sampled on each B-input rise, so that an
    external delta-sigma ADC may be employed. The sample, filter and capture modes are the
    same as the internally-clocked mode %11000.

  timing: |
    The A input is sampled on each B-input rising edge.
    The mode is X[5:4] and the sample period is POWER(2, X[3:0]), both set by one WXPIN.
    For X[5:4] > %00, a later WYPIN replaces the period with Y[13:0].
    Upon completion of each sample period the measurement is placed in Z, IN is raised,
    and a new measurement begins.

registers:
  x_register:
    bits_5_4: |
      Filtering mode:
      %00 = SINC2 sampling (complete conversion in hardware)
      %01 = SINC2 filtering (software post-processing required)
      %10 = SINC3 filtering (software post-processing required)
      %11 = Bitstream capturing (raw bits, LSB=oldest)
    bits_3_0: "Sample period = POWER(2, X[3:0]) clocks"
  y_register:
    bits_13_0: "For modes other than SINC2 sampling (X[5:4] > %00), WYPIN after WXPIN overrides the initial period established by X[3:0] with the arbitrary value in Y[13:0] (SINC3 filtering with a period of 320 clocks: WXPIN, then WYPIN #320). Not used with SINC2 sampling (%00)."
  z_register:
    function: "The completed measurement, placed in Z at the end of each sample period and read with RDPIN/RQPIN (ADC measurement value or accumulator result)"
    before_first_result: "Not documented: the value RDPIN/RQPIN returns before the first sample period has completed."
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PIN MODES, %11000 and %11001 (A input sampled on each B-input rise; WXPIN mode and period; WYPIN after WXPIN; the measurement placed in Z with IN raised); Propeller 2 P2X8C4M64P Hardware Manual, Nov 1, 2022 Release, ADC Sample/Filter/Capture, Externally Clocked (%11001), p.52"

flags:
  in_flag: "Raised when sample period completes"
  a_input: "ADC bitstream data input (from external delta-sigma ADC)"
  b_input: "External sample clock (A sampled on B rising edges)"

code_examples:
  - title: "External Delta-Sigma ADC Interface"
    description: "Interface with external ADC using B-input clock"
    code: |
      CON
        _clkfreq = 200_000_000
        adc_data_pin = 20                        ' A-input: ADC data
        adc_clock_pin = 21                       ' B-input: ADC clock
      
      PUB main() | sample
        ' Configure for external ADC with SINC2 sampling
        ' Use P_PLUS1_B to use next pin as B-input (clock)
        pinstart(adc_data_pin, P_ADC_EXT | P_PLUS1_B, %00_0111, 0)
        
        repeat
          ' Wait for sample ready
          repeat until pinread(adc_data_pin)
          
          sample := read_sample()                ' Read completed sample
          debug("External ADC: ", udec(sample))

      PRI read_sample() : value
        ' PASM2 RDPIN keeps all 32 bits of Z (the Spin2 RDPIN() method returns the C flag in bit 31)
        org
          rdpin   value, #adc_data_pin
        end

      DAT
      ' PASM2 example - external ADC with 10-bit resolution
        org
        dirl    #adc_data_pin                    ' Reset smart pin
        wrpin   adc_mode, #adc_data_pin          ' Configure mode
        wxpin   #%00_1001, #adc_data_pin         ' SINC2 sampling, 10-bit
        dirh    #adc_data_pin                    ' Enable smart pin
      .loop
        testp   #adc_data_pin wc                 ' Check IN flag
        if_nc   jmp #.loop                       ' Wait for sample
        rdpin   result, #adc_data_pin            ' Read sample
        ' Process result...
        jmp     #.loop
      
      adc_mode
        long    P_ADC_EXT | P_PLUS1_B            ' B input = the clock pin (pin+1)
      result
        long    0

  - title: "SINC3 Filtering with a Period Set by Y"
    description: "Use Y register to set non-power-of-2 period"
    code: |
      CON
        _clkfreq = 200_000_000
        adc_data_pin = 20
      
      DAT
        org
        dirl    #adc_data_pin                    ' Reset smart pin
        wrpin   adc_mode, #adc_data_pin          ' Configure ADC mode
        wxpin   #%10_0111, #adc_data_pin         ' SINC3 filtering base
        wypin   #320, #adc_data_pin              ' Override: 320 clock period
        dirh    #adc_data_pin                    ' Enable smart pin
        
        ' SINC3 requires software post-processing
      .loop
        testp   #adc_data_pin wc                 ' Wait for sample ready
        if_nc   jmp #.loop
        rdpin   x, #adc_data_pin                 ' Get SINC3 accumulator
        
        ' Post-processing: compute differences
        sub     x, diff1                         ' First difference
        add     diff1, x                         ' Update diff1 value
        sub     x, diff2                         ' Second difference
        add     diff2, x                         ' Update diff2 value
        zerox   x, #26                           ' Trim to the 27-bit accumulator width

        ' x holds the filtered sample; for a power-of-2 period, shift right by
        ' LOG2(clocks per period) to justify it
        jmp     #.loop

      adc_mode
        long    P_ADC_EXT | P_PLUS1_B            ' B input = the clock pin (pin+1)
      x       res     1
      diff1   res     1
      diff2   res     1

  - title: "Bitstream Capture Mode"
    description: "Contiguous snapshots of the bitstream"
    code: |
      CON
        _clkfreq = 200_000_000
        adc_data_pin = 20
      
      PUB main() | bitstream
        ' Capture 32 new bits per sample
        pinstart(adc_data_pin, P_ADC_EXT | P_PLUS1_B, %11_0101, 0)
        
        repeat
          repeat until pinread(adc_data_pin)
          bitstream := read_snapshot()           ' 32 bits, LSB=oldest

      PRI read_snapshot() : value
        ' PASM2 RDPIN keeps all 32 bits of Z (the Spin2 RDPIN() method returns the C flag in bit 31)
        org
          rdpin   value, #adc_data_pin
        end

related_modes:
  - "Mode %11000: ADC internal clock"
  - "Mode %11010: ADC scope with trigger"
  - "Mode %11101: Sync serial receive"

configuration_constants:
  mode_constant: "P_ADC_EXT"
  binary_value: "%11001"
  example_pin_config: "P_ADC_EXT | P_PLUS1_B (the A input is the external ADC's bitstream; the B input is its clock)"
  
  filtering_modes:
    - "%00 - SINC2 sampling (complete in hardware, power-of-2 periods only)"
    - "%01 - SINC2 filtering (software difference computation required)"
    - "%10 - SINC3 filtering (software post-processing required)"
    - "%11 - Bitstream capturing (contiguous snapshots of the bitstream)"
  
  sample_period_table: "Sample period, sample resolution and post-diff ENOB (effective number of bits, the sample resolution) for each X[3:0] and mode, with the overflow boundaries (SINC2 sampling overflows from %1110, SINC3 filtering from %1010, bitstream capturing from %0110, and %0000 is impractical for sampling and filtering): the table on architecture/smart-pins/smart-pin-11000-adc-internal-clock.yaml, which applies to both ADC modes"

notes:
  - "A input carries data, B input is the sample clock (use P_PLUS1_B or another B selector)"
  - "Samples the A input on each B-input rising edge"
  - "For X[5:4] > %00, WYPIN after WXPIN overrides the X[3:0] period with Y[13:0]"
  - "Filtering notes (27-bit accumulators, 512 and 11,585 clock limits, SINC2 and SINC3 guidance, accuracy from the third and fifth sample, prescale SHL #5 or post-trim ZEROX #26, shift rules): architecture/smart-pins/smart-pin-11000-adc-internal-clock.yaml"
  - "A pin operand with a pin count in bits 10..6 configures several consecutive pins at once"
  - "The examples read the sample with inline PASM2 RDPIN, which keeps all 32 bits of Z; the Spin2 RDPIN() method returns the C flag in bit 31. Not documented: the C flag of RDPIN in this mode."
  - "A Y value written with WYPIN while DIR is low is in force after DIRH, for the one Y value and the internal routing tested"

sources:
  - "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PIN MODES, %11000 and %11001, Table 34; Propeller 2 P2X8C4M64P Hardware Manual, Nov 1, 2022 Release, ADC Sample/Filter/Capture, Externally Clocked (%11001), p.52"
  - "EF-097 (Y written while DIR is low, in force after DIRH: one board, one Y value for this mode)"

power_domain:
  fact: "VIO_{x}_{y} and GIO_{x}_{y} are the power and ground for smart pins x through y; smart pins are powered in groups of 4. A pin's P_ADC_VIO or P_ADC_GIO input reads the VIO or GIO of the pin's own group of 4: each smart pin has its ADC with VIO/GIO calibration and is externally powered in blocks of 4 for a clean analog Vdd reference."
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), PIN DESCRIPTIONS, pin table (VIO_{x}_{y} / GIO_{x}_{y} = power / ground for smart pins {x} through {y}); Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, FEATURES summary, p.2 (each smart I/O pin: delta-sigma ADC with VIO/GIO calibration; externally powered in blocks of 4 for clean analog Vdd reference) and p.3 (smart I/O pins powered in groups of 4 via VIO pins); the own-group statement is these statements read together, no line states it outright"
  reference: "Full mechanism and sourcing: p2kbArchPinPowerDomains"

related:
  - architecture/pin-power-domains.yaml
  - architecture/smart_pins.yaml
  - architecture/smart-pins/smart-pin-11000-adc-internal-clock.yaml

see_also:
