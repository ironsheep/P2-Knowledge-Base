title: "Time High State Durations"
subtitle: "Smart Pin Mode %10001 (P_HIGH_TICKS)"
language_reference: "combined"
compatible_languages: ["Spin2", "PASM2"]

brief_description: "Measures duration of consecutive high states on A-input in clock cycles"

detailed_description:
  operation: |
    Continuously measures the duration of each high (logic-1) state on A-input. When input
    transitions from high to low, captures the high duration in Z register and raises IN flag.
    Only measures high periods, ignoring low periods. Useful for pulse width measurement,
    positive duty cycle analysis, and timing high-active signals.
  
  timing: |
    Continuous operation - no periodic mode
    IN flag raised on high-to-low transitions only
    Z register captures duration of just-completed high state
    Z limited to $80000000 (~10.7 seconds at 200MHz)

registers:
  x_register:
    function: "Not used in this mode"
  y_register:  
    function: "Not used in this mode"
  z_register:
    function: "Duration of previous high state in clocks (max $80000000)"

flags:
  in_flag: "Raised on high-to-low transition"
  a_input: "Signal to measure high durations"

code_examples:
  - title: "Pulse Width Measurement"
    description: "Measure consecutive high pulse widths"
    code: |
      CON
        _clkfreq = 200_000_000
        pulse_pin = 53                           ' Pulse input signal
      
      PUB main() | pulse_width, pulse_us
        pinstart(pulse_pin, P_HIGH_TICKS, 0, 0)
        
        repeat
          ' Wait for high-to-low transition
          repeat until pinr(pulse_pin)           ' Wait for IN flag
          
          pulse_width := rdpin(pulse_pin) & $7FFFFFFF
          pulse_us := pulse_width / (_clkfreq / 1_000_000)
          
          debug("Pulse width: ", udec(pulse_us), " µs")
      
      DAT
      ' PASM2 burst pulse measurement
        org
        dirl    #pulse_pin                       ' Reset smart pin
        wrpin   ##P_HIGH_TICKS, #pulse_pin
        dirh    #pulse_pin                       ' Enable timing
        
        mov     pulse_count, #10                 ' Measure 10 pulses
      .loop
        testp   #pulse_pin wc                    ' Wait for transition
        if_nc   jmp #.loop
        rdpin   pulse_width, #pulse_pin          ' Read high duration
        
        ' Store in array or process
        alts    pulse_count, #pulse_array
        mov     0-0, pulse_width
        
        djnz    pulse_count, #.loop
        
      pulse_array   res     10

common_applications:
  - "Positive pulse width measurement"
  - "High-active signal timing"
  - "Servo pulse measurement (1-2ms pulses)"
  - "Ultrasonic sensor echo timing"

related_modes:
  - "Mode %10000: Time both high and low states"
  - "Mode %10010: Time with event counting/timeout"
  - "Mode %01111: Count clocks while high"
  - "Mode %10011-%10111: Period measurement modes"

configuration_constants:
  mode_constant: "P_HIGH_TICKS"
  binary_value: "%10001"
  common_modifiers:
    - "P_INVERT_A - Measure low periods instead of high"
    - "P_FILT1_AB - Add filtering to reduce glitches"
    - "P_SCHMITT_A - Use Schmitt trigger for cleaner edges"

notes:
  - "Only times high states, ignores low periods"
  - "IN flag only on high-to-low transitions"
  - "No data available during low periods"
  - "For both high and low timing, use mode %10000"
  - "Z register limited to $80000000 (2.14 billion clocks)"