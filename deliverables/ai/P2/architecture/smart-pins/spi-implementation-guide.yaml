# SPI Implementation Guide for P2 Smart Pins
# CRITICAL: This file explains the most common mistake when implementing SPI

concept: spi_smart_pin_implementation
category: smart_pins
priority: critical
aliases:
  - SPI
  - SPI_MASTER
  - MOSI
  - MISO
  - PIN_JOINING
  - CLOCK_ROUTING
  - P_SYNC_TX
  - P_SYNC_RX
