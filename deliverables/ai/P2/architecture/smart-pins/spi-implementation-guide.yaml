# SPI Implementation Guide for P2 Smart Pins

concept: spi_smart_pin_implementation
category: smart_pins
aliases:
  - SPI
  - SPI_MASTER
  - MOSI
  - MISO
  - PIN_JOINING
  - CLOCK_ROUTING
  - P_SYNC_TX
  - P_SYNC_RX
  - P_TRANSITION
  - P_PLUS1_B
  - P_MINUS1_B

b_input_selection: >-
  The synchronous serial modes take their clock from the pin's B input. The default B
  input is this pin's own read state (P_LOCAL_B = 0). To take the clock from the clock pin,
  add a B input selector to the data pin's mode word; the selectors take the B input from
  the read state of the pin 1, 2 or 3 above (P_PLUS1_B, P_PLUS2_B, P_PLUS3_B) or below
  (P_MINUS1_B, P_MINUS2_B, P_MINUS3_B). Not documented: the behavior of the synchronous
  serial modes when the B input is the pin's own read state.

sources:
  - "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PINS, the B input selector table; SMART PIN MODES, %11100 and %11101; Parallax Propeller 2 Spin2 Language Documentation v55, Built-In Symbols for Smart Pin Configuration"
  - "The 2-clock bit timing and X[5] modes used by the examples: Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PIN MODES, %11100 and %11101; the transition output used as the clock: SMART PIN MODES, %00101"

default_b_input_example:
  default_example: |
    ' B input is the pin's own read state
    mode := P_SYNC_TX | P_OE
    WRPIN(mosi_pin, mode)

  selector_example: |
    ' B input is the read state of pin+1
    mode := P_SYNC_TX | P_OE | P_PLUS1_B
    WRPIN(mosi_pin, mode)

  explanation: |
    Without a B input selector the B input is the pin's own read state. Not documented:
    the behavior of the synchronous serial modes in that case. Not documented: the C flag
    of RDPIN in the receive mode, which the Spin2 RDPIN() method returns in bit 31; the
    examples read the received word with inline PASM2 rdpin.

example_pin_layouts:
  description: |
    The B input selectors reach pins up to three above or below the data pin. Example
    layouts:

  layout_1:
    comment: "Clock in middle - MOSI and MISO can both use small offsets"
    pins:
      MOSI: "N-1 (use P_PLUS1_B)"
      CLK:  "N"
      MISO: "N+1 (use P_MINUS1_B)"

  layout_2:
    comment: "Clock first - the data pins use P_MINUSx_B relative-pin offsets"
    pins:
      CLK:  "N"
      MOSI: "N+1 (use P_MINUS1_B)"
      MISO: "N+2 (use P_MINUS2_B)"

  layout_3:
    comment: "Clock last - the data pins use P_PLUSx_B relative-pin offsets"
    pins:
      MOSI: "N (use P_PLUS2_B)"
      MISO: "N+1 (use P_PLUS1_B)"
      CLK:  "N+2"

complete_spi_master_example:
  spin2: |
    CON
      ' Pin assignments - CLK in middle
      SPI_MOSI = 40
      SPI_CLK  = 41
      SPI_MISO = 42
      SPI_CS   = 43
      SPI_CLK_PERIOD = 100                    ' P_TRANSITION base period, in clocks

    PUB spi_init()
      ' Clock generator using P_TRANSITION
      PINSTART(SPI_CLK, P_TRANSITION | P_OE, SPI_CLK_PERIOD, 0)

      ' MOSI: sync TX with clock from pin+1
      PINSTART(SPI_MOSI, P_SYNC_TX | P_OE | P_PLUS1_B, %1_00111, 0)

      ' MISO: sync RX with clock from pin-1
      PINSTART(SPI_MISO, P_SYNC_RX | P_MINUS1_B, %0_00111, 0)

      ' CS as standard output
      PINHIGH(SPI_CS)

    PUB spi_transfer(tx_byte) : rx_byte
      PINLOW(SPI_CS)                          ' Assert CS
      WYPIN(SPI_MOSI, tx_byte)                ' Load TX data
      WYPIN(SPI_CLK, 16)                      ' Generate 16 transitions (8 clocks)
      REPEAT UNTIL PINREAD(SPI_MISO)          ' Wait for RX complete
      org
        rdpin   rx_byte, #SPI_MISO            ' MSB-justified word (inline PASM2 RDPIN)
        shr     rx_byte, #24                  ' Right-justify
      end
      PINHIGH(SPI_CS)                         ' Deassert CS

  pasm2: |
    CON
      SPI_CLK_PERIOD = 100                    ' P_TRANSITION base period, in clocks

    DAT
            ORG

    entry
            CALL    #spi_init               ' Configure the clock, MOSI, MISO and CS pins
            MOV     tx_data, #$A5           ' Byte to send
            CALL    #spi_transfer           ' Received byte comes back in rx_data
    .done
            JMP     #.done                  ' Transfer complete: nothing to return to

    spi_init
            ' Initialize clock generator
            MOV     pa, spi_clk
            WRPIN   clk_mode, pa
            WXPIN   ##SPI_CLK_PERIOD, pa
            DIRH    pa

            ' Initialize MOSI with clock routing
            MOV     pa, spi_mosi
            WRPIN   mosi_mode, pa
            WXPIN   #%1_00111, pa              ' Start-stop, 8-bit
            DIRH    pa

            ' Initialize MISO with clock routing
            MOV     pa, spi_miso
            WRPIN   miso_mode, pa
            WXPIN   #%0_00111, pa              ' Pre-edge, 8-bit
            DIRH    pa

            ' CS high (inactive)
            MOV     pa, spi_cs
            DIRH    pa
            OUTH    pa
            RET

    ' Transfer one byte: returns the received byte in rx_data; the byte to send is read from tx_data
    spi_transfer
            ' Assert CS
            MOV     pa, spi_cs
            OUTL    pa

            ' Load TX data
            MOV     pa, spi_mosi
            WYPIN   tx_data, pa

            ' Generate clock transitions
            MOV     pa, spi_clk
            WYPIN   #16, pa                    ' 16 transitions = 8 clocks

            ' Wait for RX complete
            MOV     pa, spi_miso
    .wait   TESTP   pa                  WC
      IF_NC JMP     #.wait
            RDPIN   rx_data, pa
            SHR     rx_data, #24               ' Right-justify

            ' Deassert CS
            MOV     pa, spi_cs
            OUTH    pa
            RET

    ' Pin definitions
    spi_mosi      LONG    40
    spi_clk       LONG    41
    spi_miso      LONG    42
    spi_cs        LONG    43

    ' Mode configurations with a B input selector for the clock
    mosi_mode     LONG    P_SYNC_TX | P_OE | P_PLUS1_B   ' Clock from pin+1
    miso_mode     LONG    P_SYNC_RX | P_MINUS1_B         ' Clock from pin-1
    clk_mode      LONG    P_TRANSITION | P_OE

    ' Variables
    tx_data       RES     1
    rx_data       RES     1

