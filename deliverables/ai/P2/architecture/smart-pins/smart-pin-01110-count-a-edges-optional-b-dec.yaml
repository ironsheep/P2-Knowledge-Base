aliases:
  - "count edges on a neighbouring pin without driving it"
  - "smart pin counts edges of the pin next to it"

title: "Edge Counter with Optional Up/Down"
subtitle: "Smart Pin Mode %01110 (P_COUNT_RISES)"
language_reference: "combined"
compatible_languages: ["Spin2", "PASM2"]

brief_description: "Count A-input edges, optionally decrement on B-input edges based on Y[0]"

detailed_description:
  operation: |
    Dual-mode edge counter controlled by Y[0]. When Y[0]=0, counts only A-input positive edges.
    When Y[0]=1, increments on A-input positive edges and decrements on B-input positive edges,
    creating independent up/down counter. Both inputs count edges independently - not gated or
    dependent on each other's state.
  
  observer_use: |
    The counter can watch a neighbouring pin without driving anything. Select the A input
    as a relative neighbour (A = relative -3..+3 pin), leave the smart pin's output-enable
    bit clear so the pin never drives (the pin is then an input whatever DIR holds), raise
    DIR to start it, and read the total with RDPIN or RQPIN. A counter with A = the pin
    below it (relative -1) counted the edges driven on that pin as a plain pin.
  source: "observer_use: XF-002; Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PINS"

  timing: |
    Continuous mode (X=0): Z register always holds current net count
    Periodic mode (X>0): Net count over X clock cycles
    IN flag raised at end of each measurement period
    A and B edges counted independently

registers:
  x_register:
    bits_31_0: "Measurement period in clocks (0=continuous totalizer)"
  y_register:  
    bit_0: "0=count A edges only, 1=inc on A edges/dec on B edges"
    bits_31_1: "Not documented: a role for Y[31:1] in this mode"
  z_register:
    function: "32-bit count (unsigned if Y[0]=0, signed if Y[0]=1)"

flags:
  in_flag: "Raised at end of measurement period (periodic mode only)"
  a_input: "Increment signal (positive edges)"
  b_input: "Decrement signal when Y[0]=1 (positive edges)"

code_examples:
  - title: "Independent Up/Down Counters"
    description: "Count up events on P24, down events on P25"
    code: |
      CON
        _clkfreq = 200_000_000
        counter_pin = 24                         ' Primary counter pin
        up_pin = 24                              ' Up count input (same)
        down_pin = 25                            ' Down count input (adjacent)
      
      PUB main() | net_count
        ' Configure for independent up/down counting
        pinstart(counter_pin, P_COUNT_RISES | P_PLUS1_B, 0, 1)
        
        repeat
          net_count := read_z(counter_pin)       ' Read net count (signed)
          debug("Net count: ", sdec(net_count))

          ' Reset counter
          if ina.[0]
            pinclear(counter_pin)
            pinstart(counter_pin, P_COUNT_RISES | P_PLUS1_B, 0, 1)

      PRI read_z(pin) : z
        ' PASM2 RDPIN keeps all 32 bits of Z, the sign bit included (the Spin2 RDPIN() method returns the C flag in bit 31)
        org
          rdpin   z, pin
        end

      DAT
      ' PASM2 single input counter example
        org
        dirl    #counter_pin                     ' Reset smart pin
        wrpin   ##P_COUNT_RISES, #counter_pin    
        wxpin   #0, #counter_pin                 ' Continuous mode
        dirh    #counter_pin                     ' Enable counter
        wypin   #0, #counter_pin                 ' Count A only - Y AFTER DIRH
      .loop
        rdpin   count, #counter_pin              ' Read A edge count
        jmp     #.loop

configuration_order:
  follows_the_general_order: |
    The PASM2 example above writes Y with WYPIN AFTER raising DIR, which is
    architecture/smart_pins.yaml's reset_before_configure order:
    DIRL -> WRPIN -> WXPIN -> DIRH -> WYPIN. That is the general order (synchronous
    serial transmit %11100 in continuous mode is a documented exception). For this mode
    the order is not critical: a Y written with WYPIN while DIR is low is in force after
    DIRH, so writing Y before
    DIRH is also safe.
  about_pinstart: |
    The Spin2 example uses pinstart(), which writes Y BEFORE raising DIR. The general
    page names that unsafe for the TRIGGER modes (%00100 pulse, %00101 transition).
    %01110 is a counting mode, not a trigger mode, and the Y written before DIRH is in
    force after it, so pinstart() is safe here.
  source: "EF-097 (order-safe Y-before-DIRH bench-measured on one board, one Y value for this mode)"

related_modes:
  - "Mode %01101: Accumulate A-input positive edges with the B input supplying increment (B=1) or decrement (B=0)"
  - "Mode %01111: Count A-input highs, optionally decrementing on B-input highs"
  - "Mode %01011: Quadrature encoder"
  - "Mode %01100: Count A-input positive edges when B-input is high"

configuration_constants:
  mode_constant: "P_COUNT_RISES"
  binary_value: "%01110"
  common_modifiers:
    - "P_PLUS1_B - Use next pin for decrement input"
    - "P_MINUS1_B - Use previous pin for decrement"
    - "P_INVERT_A / P_INVERT_B - Invert the input, so its negative edges are counted"
    - "P_FILT1_AB - Filter the A and B inputs using the global filt1 settings"

notes:
  - "Y[0]=0: Simple A-input edge counter"
  - "Y[0]=1: Independent up/down edge counters"
  - "A and B inputs count edges independently"
  - "No gating or state dependency between inputs"
  - "Z register signed when Y[0]=1 for negative counts"
  - "In periodic mode all events get counted across measurements: the accumulator is set to the 0/1/-1 value that would otherwise have been added into it"
  - "During reset (DIR=0), IN is low and Z is set to the adder value (0/1/-1)"
  - "The Spin2 example reads the count with inline PASM2 RDPIN, which keeps all 32 bits of Z; the Spin2 RDPIN() method returns the C flag in bit 31, which would replace the count's sign bit unless C is the MSB of Z. Not documented: the C flag of RDPIN in this mode."

sources:
  - "operation, timing, registers, notes: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PIN MODES (%01110: count A-input positive edges, or with Y.[0]=1 increment on A-input positive edge and decrement on B-input positive edge; X period, continuous when zero; periodic accumulator set to the 0/1/-1 adder value; reset Z = adder value) and SMART PINS (C is either a mode-related flag or the MSB of the Z result; %FFF = 101 uses the global filt1 settings)"
  - "notes (Spin2 RDPIN() bit 31): Parallax Propeller 2 Spin2 Language Documentation v55, smart pin methods (RDPIN (Pin) : Zval, Zval[31] = C flag from RDPIN, other bits are RDPIN data)"
  - "configuration_order: EF-097"