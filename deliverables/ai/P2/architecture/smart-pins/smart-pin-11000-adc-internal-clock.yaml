title: "ADC Sample/Filter/Capture - Internal Clock"
subtitle: "Smart Pin Mode %11000 (P_ADC)"
language_reference: "combined"
compatible_languages: ["Spin2", "PASM2"]

brief_description: "Analog-to-digital conversion with internal clock and optional SINC filtering"

detailed_description:
  operation: |
    Converts analog voltage on pin to digital values using internal clock sampling. Supports
    four sample/filter modes: SINC2 sampling, SINC2 filtering, SINC3 filtering, and raw
    bitstream capture. Requires specific pin mode configuration (M[12:10] = %100) to enable
    ADC function. Can configure multiple consecutive pins simultaneously for multi-channel ADC.

  timing: |
    Sampling rate controlled by X register settings
    Bitstream capture (%11): new 32-bit snapshot every 32 clocks
    SINC2 sampling (%00): power-of-2 periods only; SINC2/SINC3 filtering: configurable periods
    IN flag raised when new sample ready
    Use SETSE1 for event-driven sample capture

registers:
  x_register:
    bits_5_4: |
      Sample/filter mode (X[5:4]):
      %00 = SINC2 sampling (complete conversion in hardware, power-of-2 periods only)
      %01 = SINC2 filtering (software difference computation required)
      %10 = SINC3 filtering (software post-processing required)
      %11 = Bitstream capturing (raw 32-bit ADC snapshot, read every 32 clocks, LSB=oldest)
    bits_3_0: "Sample period configuration (resolution/period setting)"
  y_register:
    function: "Trigger level for scope modes (not used in basic ADC mode)"
  z_register:
    function: "ADC sample value (raw bitstream or accumulated filter result)"

flags:
  in_flag: "Raised when new sample ready (use SETSE1 for event detection)"
  a_input: "Analog voltage input to convert"

code_examples:
  - title: "Basic 8-bit ADC Reading"
    description: "Simple ADC with SINC2 sampling (8-bit)"
    code: |
      CON
        _clkfreq = 200_000_000
        adc_pin = 46                             ' Analog input pin
      
      PUB main() | adc_value
        ' Configure ADC mode: %100011 in bits 17:12, mode %11000
        ' M[12:10] = %100 enables ADC functionality
        pinstart(adc_pin, $8_C600, %00_0111, 0)  ' 8-bit resolution
        
        repeat
          waitms(10)                             ' Delay between samples
          adc_value := rdpin(adc_pin)            ' Read ADC result
          debug("ADC: ", udec(adc_value))
      
      DAT
      ' PASM2 example - SINC2 sampling (8-bit)
        org
        mov     dira, #$FF                       ' LED output setup
        dirl    #adc_pin                         ' Reset ADC pin
        wrpin   adc_mode, #adc_pin               ' Configure ADC mode
        wxpin   #%00_0111, #adc_pin              ' 8-bit resolution
        dirh    #adc_pin                         ' Enable smart pin
      .loop
        waitx   ##$100_000                       ' Delay between samples
        rdpin   result, #adc_pin                 ' Get ADC result
        mov     outa, result                     ' Output to LEDs
        jmp     #.loop
      
      adc_mode
        long    %0000_0000_000_100011_0000000_00_11000_0
      result
        long    0

  - title: "SINC2 Filtered ADC with Event Detection"
    description: "ADC with SINC2 filtering and event-driven sampling"
    code: |
      CON
        _clkfreq = 200_000_000
        adc_pin = 46
      
      DAT
        org
        mov     dira, #$FF                       ' LED output
        dirl    #adc_pin                         ' Reset ADC
        wrpin   adc_mode, #adc_pin               ' Configure mode
        wxpin   #%01_0111, #adc_pin              ' SINC2 filtering at 128 clocks
        dirh    #adc_pin                         ' Enable smart pin
        setse1  #%001<<6 + adc_pin               ' Event trigger on pin IN high
      .loop
        waitse1                                  ' Wait for sample ready
        rdpin   sample, #adc_pin                 ' Read accumulator
        sub     sample, diff                     ' Compute sample difference
        add     diff, sample                     ' Update diff accumulator
        shr     sample, #6                       ' Right-justify (LOG2(128)-1)
        mov     outa, sample                     ' Display on LEDs
        jmp     #.loop
      
      adc_mode
        long    %0000_0000_000_100011_0000000_00_11000_0
      sample  long    0
      diff    res     1

  - title: "Multi-Channel ADC Configuration"
    description: "Configure multiple consecutive pins as ADC inputs"
    code: |
      CON
        _clkfreq = 200_000_000
        adc_base = 46                            ' Starting pin
        num_channels = 4                         ' Pins 46-49
      
      PUB main() | ch, values[4]
        ' Configure 4 consecutive pins for ADC. These are INDEPENDENT channels, so any
        ' pins work; pins that share a node/reference must stay within ONE 8-pin power
        ' group (0-7, 8-15, ...) to share a supply domain - see p2kbArchPinPowerDomains.
        repeat ch from 0 to num_channels-1
          pinstart(adc_base + ch, $8_C600, %00_0111, 0)
        
        repeat
          waitms(100)
          repeat ch from 0 to num_channels-1
            values[ch] := rdpin(adc_base + ch)
            debug("CH", udec(ch), ": ", udec(values[ch]))

common_applications:
  - "Analog sensor reading (temperature, light, voltage)"
  - "Audio signal capture"
  - "Multi-channel data acquisition"
  - "Continuous analog monitoring"

related_modes:
  - "Mode %11001: ADC external clock - external timing control"
  - "Mode %11010: ADC scope trigger - triggered acquisition"
  - "Mode %00001: DAC with noise - analog output counterpart"

configuration_constants:
  mode_constant: "P_ADC"
  binary_value: "%11000"
  required_pin_config: "%100011_00000000_00_11000_0 (M[12:10]=%100 enables ADC)"
  
  adc_input_modes:
    - "P_ADC_GIO - Ground-referenced input"
    - "P_ADC_VIO - VIO-referenced input"
    - "P_ADC_FLOAT - Floating input"
    - "P_ADC_1X - 1x gain"
    - "P_ADC_3X - 3.16x gain (sqrt-10-spaced ladder)"
    - "P_ADC_10X - 10x gain"
    - "P_ADC_30X - 31.6x gain (sqrt-10-spaced ladder)"
    - "P_ADC_100X - 100x gain"
  
  x_register_modes:
    - "%00_xxxx - SINC2 sampling (complete conversion in hardware, power-of-2 periods)"
    - "%01_xxxx - SINC2 filtering (software difference computation required)"
    - "%10_xxxx - SINC3 filtering (software post-process required)"
    - "%11_xxxx - Bitstream capturing (raw 32-bit ADC snapshot every 32 clocks)"
    - "Lower 4 bits control sample period/resolution"

notes:
  - "Requires M[12:10] = %100 in WRPIN configuration to enable ADC"
  - "Bitstream capture (%11) provides a new 32-bit snapshot every 32 system clock periods"
  - "SINC2 filtering (%01) and SINC3 (%10) require software post-processing; SINC2 sampling (%00) does not"
  - "Use SETSE1 with waitse1 for event-driven sample acquisition"
  - "Multiple consecutive pins can be configured simultaneously"
  - "SINC2 post-processing: shift right by [LOG2(samples)]-1"
  - "SINC3 requires difference calculations and multiple accumulators"
  - "ADC input modes (GIO/VIO/gain) affect voltage range and sensitivity"

power_domain:
  fact: |
    P_ADC_GIO / P_ADC_VIO reference THIS pin's own 8-pin power group (pins 0-7, 8-15, ...,
    56-63 each share one isolated VIO/GIO supply pair). A single-pin ratiometric reading is
    therefore absolute against its own group's rails.
  multi_pin_layout: |
    Pins tied to a SHARED NODE for one measurement must sit WITHIN A SINGLE 8-pin group to
    share a reference domain; straddling a group boundary mixes supply domains and degrades
    the result. Independent single-ended channels on different pins are unaffected.
  reference: "Full mechanism + sourcing: p2kbArchPinPowerDomains"

related:
  - architecture/pin-power-domains.yaml
  - architecture/smart_pins.yaml

see_also:
  - "I/O pin power domains — isolated groups of 8 sharing VIO/GIO; governs the P_ADC_GIO/P_ADC_VIO reference: p2kbArchPinPowerDomains"
