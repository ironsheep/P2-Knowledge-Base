# Smart Pin Mode: %00111 - NCO Duty
# Concise reference optimized for AI code generation

mode: "%00111"
name: "NCO Duty (Variable Duty Cycle)"
category: "nco"

# Constants
constants:
  spin2: "P_NCO_DUTY"
  pasm2: "P_NCO_DUTY"
  mode_bits: "%00111"

# Operation
operation: |
  This mode overrides OUT to control the pin output state.
  Y[31:0] is added into Z[31:0] at each base period (X[15:0] clocks).
  The pin output reflects Z overflow.
  IN is raised whenever Z overflows.

# Parameters
x_register:
  function: "Base period and initial phase"
  X[15:0]: "Base period in clocks"
  X[31:16]: "Initial phase load to Z[31:16] upon WXPIN"
  reset_phase: "During reset (DIR=0), Z is set to zero. Not documented: whether a phase written with WXPIN during reset is kept after DIR is raised"

y_register:
  function: "Value added into Z"
  Y[31:0]: "Added into Z[31:0] at each base period"
  zero: "Y = 0 gives no output and raises no IN."

z_register:
  function: "32-bit accumulator"
  overflow: "The pin output reflects Z overflow; IN is raised whenever Z overflows"

in_flag: "Raised on each Z overflow"

out_signal: "Overridden by Z overflow state"

# Complete Spin2 Example
spin2_complete: |
  CON
    PWM_PIN = 48
    _clkfreq = 200_000_000
    
  PUB main()
    ' NCO duty output
    nco_duty(PWM_PIN, 25)      ' Y = 25 / 100 of 2^32

  PUB nco_duty(pin, percent) | mode, y_value
    mode := P_NCO_DUTY | P_OE

    ' FRAC divides {percent, 32'b0} by 100: y_value = percent * 2^32 / 100
    y_value := percent FRAC 100

    PINCLEAR(pin)
    WRPIN(pin, mode)
    WXPIN(pin, 1000)            ' 1000 clock base period
    PINHIGH(pin)                ' Enable first (general init order)
    WYPIN(pin, y_value)         ' Then write Y: added into Z at each base period

  PUB nco_duty_byte(level) | mode, y_value
    ' Y is the 8-bit level in the top byte
    mode := P_NCO_DUTY | P_OE

    y_value := level << 24      ' Level in Y[31:24]

    PINCLEAR(PWM_PIN)
    WRPIN(PWM_PIN, mode)
    WXPIN(PWM_PIN, 256)         ' 256 clock base period
    PINHIGH(PWM_PIN)            ' Enable first (general init order)
    WYPIN(PWM_PIN, y_value)     ' Then write Y

# Complete PASM2 Example
pasm2_complete: |
  DAT
          ORG
  
  ' Pin and mode configuration  
  pwm_pin       LONG  48
  nco_duty_mode LONG  P_NCO_DUTY | P_OE
  
  ' Set specific duty cycle
  set_duty
          MOV   pin, pwm_pin
          DIRL  pin
          WRPIN nco_duty_mode, pin
          WXPIN base_period, pin     ' Set base
          
          ' Calculate Y from duty_pct
          QFRAC duty_pct, #100        ' {duty_pct, 32'b0} / 100
          GETQX y_value               ' y_value = duty_pct * 2^32 / 100

          DIRH  pin                  ' Enable first (general init order)
          WYPIN y_value, pin         ' Then write Y
          RET
  
  ' Step Y upward
  duty_ramp
          MOV   pin, pwm_pin
          DIRL  pin
          WRPIN nco_duty_mode, pin
          WXPIN ##1000, pin
          DIRH  pin                  ' Enable once before the loop (general init order)

          MOV   y_value, #0
  .loop   WYPIN y_value, pin         ' write Y each step (operate)
          WAITX ##100_000
          ADD   y_value, ##$01000000
          TJNZ  y_value, #.loop      ' Until wrap
          RET
  
  ' Step Y through a 16-entry byte table
  breathing
          MOV   index, #0
  .loop   MOV   ptra, ##@level_table
          ADD   ptra, index
          RDBYTE temp, ptra
          SHL   temp, #24            ' Level in Y[31:24]

          MOV   pin, pwm_pin
          WYPIN temp, pin

          ADD   index, #1
          AND   index, #15           ' 16 table entries
          WAITX ##1_000_000
          JMP   #.loop

  ' Level table (16 entries)
  level_table   BYTE  0,4,16,36,64,100,144,196
                BYTE  255,196,144,100,64,36,16,4

  ' Variables
  base_period   LONG  10000
  duty_pct      LONG  75              ' 75 / 100 of 2^32
  pin           RES   1
  y_value       RES   1
  index         RES   1
  temp          RES   1

# Key Points
accumulator: |
  Y[31:0] is added into Z[31:0] at each base period
  The pin output reflects Z overflow
  IN is raised whenever Z overflows

vs_nco_freq: |
  NCO_FREQ: Output follows Z[31]
  NCO_DUTY: Output follows Z overflow

sources:
  - "operation, x_register, y_register, z_register, in_flag, pin_behavior, accumulator, vs_nco_freq: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PIN MODES (%00110 NCO frequency and %00111 NCO duty)"
  - "y_register.zero: EF-098 (%00111 with Y = 0 gives no output and raises no IN)"
  - "examples (FRAC and QFRAC forms): Parallax Propeller 2 Spin2 Language Documentation v55, FRAC; instruction CSV QFRAC"

hub_symbols: "Fragments here that use a hub symbol as an immediate assume a PASM-only file, where hub addresses are absolute. In a Spin2 object, DAT hub addresses are relative to the object: see language/spin2/integration/spin2-pasm2-integration.yaml hub_address_resolution."
