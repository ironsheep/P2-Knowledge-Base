# Smart Pin Mode: %00111 - NCO Duty
# Concise reference optimized for AI code generation

mode: "%00111"
name: "NCO Duty (Variable Duty Cycle)"
category: "nco"

# Constants
constants:
  spin2: "P_NCO_DUTY"
  pasm2: "P_NCO_DUTY"
  mode_bits: "%00111"

# Operation
operation: |
  NCO with variable duty cycle control.
  Z accumulator adds Y value every X[15:0] clocks.
  Output high on Z overflow, low otherwise.
  Creates PWM with precise duty control.

# Parameters
x_register:
  function: "Base period and initial phase"
  X[15:0]: "Base period divider (1-65536 clocks)"
  X[31:16]: "Initial phase load to Z[31:16]"
  
y_register:
  function: "Duty cycle control"
  Y[31:0]: "Added to Z each base period"
  duty_formula: "Duty% = (Y / 2^32) × 100"
  examples:
    - "$80000000 = 50% duty"
    - "$40000000 = 25% duty"
    - "$C0000000 = 75% duty"

z_register:
  function: "32-bit accumulator"
  overflow: "Output high during overflow"
  behavior: "Overflow duration sets duty cycle"

in_flag: "Raised on each Z overflow"

out_signal: "Overridden by Z overflow state"

# Complete Spin2 Example
spin2_complete: |
  CON
    PWM_PIN = 48
    _clkfreq = 200_000_000
    
  PUB main()
    ' Variable duty PWM
    pwm_duty(PWM_PIN, 50)      ' 50% duty
    
    ' Servo control
    servo_pulse(1500)           ' 1.5ms pulse
    
  PUB pwm_duty(pin, duty_percent) | mode, y_value
    mode := P_NCO_DUTY | P_OE
    
    ' Convert percentage to Y value
    y_value := (duty_percent * $FFFFFFFF) / 100
    
    PINCLEAR(pin)
    WRPIN(pin, mode)
    WXPIN(pin, 1000)            ' 1000 clock base period
    WYPIN(pin, y_value)         ' Set duty cycle
    PINHIGH(pin)
    
  PUB servo_pulse(us_width) | mode, y_value, period
    ' 20ms period, variable pulse width
    mode := P_NCO_DUTY | P_OE
    period := _clkfreq / 50     ' 20ms @ 50Hz
    
    ' Calculate Y for desired pulse width
    y_value := (us_width * _clkfreq / 1_000_000) * ($FFFFFFFF / period)
    
    PINCLEAR(PWM_PIN)
    WRPIN(PWM_PIN, mode)
    WXPIN(PWM_PIN, period)
    WYPIN(PWM_PIN, y_value)
    PINHIGH(PWM_PIN)
    
  PUB led_dimmer(brightness) | mode, y_value
    ' LED brightness control (0-255)
    mode := P_NCO_DUTY | P_OE
    
    y_value := brightness << 24  ' Scale to 32-bit
    
    PINCLEAR(PWM_PIN)
    WRPIN(PWM_PIN, mode)
    WXPIN(PWM_PIN, 256)         ' Fast PWM for LEDs
    WYPIN(PWM_PIN, y_value)
    PINHIGH(PWM_PIN)

# Complete PASM2 Example
pasm2_complete: |
  DAT
          ORG
  
  ' Pin and mode configuration  
  pwm_pin       LONG  48
  nco_duty_mode LONG  P_NCO_DUTY | P_OE
  
  ' Set specific duty cycle
  set_duty
          MOV   pin, pwm_pin
          DIRL  pin
          WRPIN nco_duty_mode, pin
          WXPIN base_period, pin     ' Set base
          
          ' Calculate Y for duty%
          MOV   y_value, duty_pct
          MUL   y_value, ##$28F5C29   ' × (2^32/100)
          SHL   y_value, #2
          
          WYPIN y_value, pin
          DIRH  pin
          RET
  
  ' Ramp duty cycle
  duty_ramp
          MOV   pin, pwm_pin
          DIRL  pin
          WRPIN nco_duty_mode, pin
          WXPIN #1000, pin
          
          MOV   y_value, #0
  .loop   WYPIN y_value, pin
          DIRH  pin
          WAITX ##100_000
          ADD   y_value, ##$01000000
          TJNZ  y_value, #.loop      ' Until wrap
          RET
  
  ' Breathing LED effect
  breathing
          MOV   index, #0
  .loop   MOV   ptra, #breath_table
          ADD   ptra, index
          RDBYTE temp, ptra
          SHL   temp, #24            ' Scale to 32-bit
          
          MOV   pin, pwm_pin
          WYPIN temp, pin
          
          ADD   index, #1
          AND   index, #63           ' 64 steps
          WAITX ##1_000_000
          JMP   #.loop
  
  ' Breathing pattern table
  breath_table  BYTE  0,4,16,36,64,100,144,196
                BYTE  255,255,255,196,144,100,64,36
                BYTE  16,4,0,0,0,0,0,0
                ' (abbreviated)
  
  ' Variables
  pin           RES   1
  y_value       RES   1
  base_period   LONG  10000
  duty_pct      LONG  75              ' 75%
  index         RES   1
  temp          RES   1

# Key Points
duty_calculation: |
  Duty% = (Y / 2^32) × 100
  Y = $80000000 for 50% duty
  Resolution depends on base period

overflow_behavior: |
  Output high during Z overflow
  Overflow frequency = base_freq × (Y/2^32)
  Pulse width = overflow duration

vs_nco_freq: |
  NCO_FREQ: Output follows Z[31]
  NCO_DUTY: Output follows Z overflow
  DUTY better for PWM applications

common_uses:
  - "PWM motor control"
  - "LED dimming"
  - "Servo control"
  - "Power regulation"
  - "Audio modulation"

related: ["00110 (NCO Freq)", "01000-01001 (PWM modes)", "00100 (Pulse)"]