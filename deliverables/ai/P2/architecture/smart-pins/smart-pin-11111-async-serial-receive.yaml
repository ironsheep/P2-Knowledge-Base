title: "Asynchronous Serial Receive"
subtitle: "Smart Pin Mode %11111 (P_ASYNC_RX)"
language_reference: "combined"
compatible_languages: ["Spin2", "PASM2"]

brief_description: "Asynchronous serial reception at programmable baud rate (1-32 bits per frame)"

detailed_description:
  operation: |
    Receives serial data asynchronously with automatic start bit detection.
    Supports 1-32 data bits per frame at programmable baud rates. The receiver waits for the
    A input to go high (idle) and then low (start bit edge), delays half a bit period and
    loops back to the low wait if the input is no longer low, then delays one bit period and
    right-shifts the A input into the shifter, one bit period per data bit. The sequence has no
    stop-bit step: after the last data bit the shifter is captured into Z and IN is raised, and
    the receiver returns to waiting for the A input to go high.
  
  state_sequence: |
    1. Wait for the A input to go high (idle state).
    2. Wait for the A input to go low (start bit edge).
    3. Delay for half of a bit period.
    4. If the A input is no longer low, loop to 2.
    5. Delay for one bit period.
    6. Right-shift the A input into the shifter and delay for one bit period; repeat until all data bits are received.
    7. Capture the shifter into the Z register and raise IN.
    8. Loop to 1.

  timing: |
    Baud rate set by X register (system clocks per bit period)
    Start bit (0) detected automatically (high-to-low transition)
    Half a bit period after the start edge the input is checked, one more bit period passes, then the input is shifted in once per bit period
    No stop-bit step: the shifter is captured into Z after the last data bit's period
    IN flag raised when the data bits have been received and data is ready

registers:
  x_register:
    bits_31_16: "System clock periods per bit period (integer part)"
    bits_15_10: "Fractional clocks in a bit period, when X[31:26] is zero"
    bits_9_5: "Not documented: X[9:5]."
    bits_4_0: "Word-size field, encoded as N-1 (write 0..31 to select 1..32 data bits; e.g. write 7 for an 8-bit word)"
  y_register:
    function: "Not documented: a role for Y in this mode"
  z_register:
    bits_31_0: "The received word, read with RDPIN/RQPIN MSB-justified; it must be shifted right by 32 minus the word size to LSB-justify (e.g. SHR D,#32-8 for an 8-bit word)."
    before_first_word: "Not documented: the value RDPIN/RQPIN returns before the first word has been received."

flags:
  in_flag: "Raised when the data bits have been received, data ready to read"
  a_input: "Serial data input (monitors for start bit)"

code_examples:
  - title: "Basic 8-bit UART Receive"
    description: "115200 baud serial input, 8 data bits"
    code: |
      CON
        _clkfreq = 200_000_000
        rx_pin = 21
        baud = 115_200
      
      PUB main() | bit_period, received_byte
        ' Calculate bit period: clocks/bit = clkfreq / baud
        bit_period := (_clkfreq / baud) << 16

        ' Configure async RX: 8 data bits (X[4:0] = N-1 = 7)
        pinstart(rx_pin, P_ASYNC_RX, (bit_period | 7), 0)
        
        ' Receive and display characters
        repeat
          received_byte := receive_byte()
          debug("Received: ", uhex_byte_(received_byte))
      
      PUB receive_byte() : value
        ' Wait for character received
        repeat until pinread(rx_pin)

        ' Read the received word with PASM2 RDPIN and shift right by 32-8 = 24 (the MSB-justified word)
        org
          rdpin   value, #rx_pin
          shr     value, #24
        end

      DAT
      ' PASM2 example - buffered serial receive, started by
      ' COGINIT(COGEXEC_NEW, @entry, @buffer), which puts @buffer in PTRA
        org
      entry
        mov     bit_clks, ##(_clkfreq / baud) << 16
        or      bit_clks, #7                     ' 8 data bits (X[4:0] = N-1)

        dirl    #rx_pin                          ' Reset smart pin
        wrpin   rx_mode, #rx_pin                 ' Configure mode
        wxpin   bit_clks, #rx_pin                ' Set baud and bits
        dirh    #rx_pin                          ' Enable smart pin

        ' Receive loop with buffering
        mov     count, #0
      .loop
        testp   #rx_pin wc                       ' Check for data
        if_nc   jmp #.loop                       ' Wait for character
        rdpin   data, #rx_pin                    ' Read MSB-justified word
        shr     data, #24                        ' LSB-justify 8-bit byte (32-8)
        wrbyte  data, ptra++                     ' Store in buffer
        add     count, #1
        cmp     count, buffer_size wz
        if_nz   jmp #.loop                       ' Continue if buffer not full
        
        ' Process buffer...
        jmp     #$                               ' Buffer full: nothing to return to

      rx_mode
        long    P_ASYNC_RX
      buffer  byte    0[256]                     ' 256-byte buffer
      buffer_size
        long    256
      data    long    0
      count   long    0
      bit_clks res    1

  - title: "Receive with Timeout Detection"
    description: "Detect and handle receive timeouts"
    code: |
      CON
        _clkfreq = 200_000_000
        rx_pin = 21
        baud = 9600
        timeout_ms = 1000                        ' 1 second timeout
      
      PUB main() | result
        setup_serial()
        
        repeat
          result := receive_with_timeout(timeout_ms)
          if result < 0
            debug("Timeout - no data received")
          else
            debug("Received: ", udec(result))
      
      PUB setup_serial() | bit_period
        bit_period := (_clkfreq / baud) << 16
        pinstart(rx_pin, P_ASYNC_RX, (bit_period | 7), 0)   ' 8 data bits (N-1)

      PUB receive_with_timeout(wait_ms) : value | deadline
        deadline := getms() + wait_ms

        repeat
          if pinread(rx_pin)
            return read_rx_byte()                ' Data received (LSB-justify 8-bit)

          if getms() >= deadline
            return -1                            ' Timeout

      PUB receive_blocking() : value
        ' Blocking receive
        repeat until pinread(rx_pin)
        return read_rx_byte()

      PRI read_rx_byte() : value
        org
          rdpin   value, #rx_pin                 ' MSB-justified word
          shr     value, #24                     ' LSB-justify 8-bit byte
        end

  - title: "Full Duplex Serial Communication"
    description: "Simultaneous transmit and receive"
    code: |
      CON
        _clkfreq = 200_000_000
        tx_pin = 20
        rx_pin = 21
        baud = 115_200
      
      PUB main() | bit_period
        bit_period := (_clkfreq / baud) << 16

        ' Setup TX and RX (8 data bits → X[4:0] = N-1 = 7)
        pinstart(tx_pin, P_ASYNC_TX | P_OE, (bit_period | 7), 0)
        pinstart(rx_pin, P_ASYNC_RX, (bit_period | 7), 0)

        ' Echo received characters back
        repeat
          if pinread(rx_pin)
            echo_char(read_rx_byte())            ' LSB-justify before resending

      PRI read_rx_byte() : value
        org
          rdpin   value, #rx_pin                 ' MSB-justified word
          shr     value, #24                     ' LSB-justify 8-bit byte
        end

      PUB echo_char(char) | busy
        org
          wypin   char, #tx_pin                  ' Load the output word
          waitx   #1                             ' 2+1 clocks before polling busy
      .wait
          rdpin   busy, #tx_pin wc               ' Busy flag into C
          if_c    jmp #.wait                     ' Loop until C = 0
        end

      PUB send_and_receive(tx_byte) : rx_byte | busy
        ' Send a byte and wait for response
        org
          wypin   tx_byte, #tx_pin               ' Load the output word
          waitx   #1                             ' 2+1 clocks before polling busy
      .wait
          rdpin   busy, #tx_pin wc               ' Busy flag into C
          if_c    jmp #.wait                     ' Loop until C = 0
        end

        repeat until pinread(rx_pin)
        rx_byte := read_rx_byte()                ' LSB-justify 8-bit byte

related_modes:
  - "Mode %11110: Async serial TX - asynchronous transmit"
  - "Mode %11101: Sync serial RX - synchronous receive"
  - "Mode %11100: Sync serial TX - synchronous transmit"

configuration_constants:
  mode_constant: "P_ASYNC_RX"
  binary_value: "%11111"
  
  bit_period_calculation:
    formula: "(clocks * $1_0000) & $FFFFFC00, for the clocks per bit"
    fractional: "(clocks * $1_0000) & $FFFFFC00; 7.5 clocks is $00078000 and 33.33 clocks is $00215400; the fractional part applies when X[31:26] is zero"
    bits_31_16: "Integer system clocks per bit"
    bits_15_10: "Establishes the number of fractional clocks in a bit period, when X[31:26] is zero"
  
  data_bits_field:
    location: "X[4:0]"
    encoding: "Field value = N - 1 (write 0..31 to select 1..32 data bits)"
    range: "1-32 bits supported"
    example_values:
      - "X[4:0] = 6 → 7-bit word"
      - "X[4:0] = 7 → 8-bit word"
      - "X[4:0] = 8 → 9-bit word"

max_baud_rate:
  statement: "Asynchronous serial transmit and receive, 1 to 32 bits, up to clock/3 baud rate"
  source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, smart I/O pin features, p.3; Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), OVERVIEW (smart I/O pin features)"

notes:
  - "Automatically detects start bit (high-to-low transition)"
  - "The receive state sequence has no stop-bit step"
  - "Each data bit is right-shifted into the shifter as it is received"
  - "The full-duplex example's transmit side writes a word with WYPIN and then polls the busy flag with RDPIN WC starting three clocks later"
  - "The receiver waits for the A input to go high (idle state) before it looks for a start-bit edge, so a start edge is only seen after the line has been high"
  - "IN flag indicates received data ready to read"
  - "Supports 1 to 32 data bits per frame"
  - "Word-size field X[4:0] is encoded as N-1: write 7 for an 8-bit word, 6 for 7-bit, 8 for 9-bit"
  - "RDPIN/RQPIN return the received word MSB-justified at Z[31]: shift right by 32-N to LSB-justify (e.g. SHR D,#24 for 8-bit). The examples read the word with inline PASM2 RDPIN. Not documented: the C flag of RDPIN in this mode, which RDPIN() returns in bit 31."
  - "X[15:10] establishes the number of fractional clocks in a bit period when X[31:26] is zero"
  - "Not documented: parity."
  - "RDPIN reads received data and clears IN flag"
  - "RQPIN reads data without clearing IN flag (for multi-cog access)"

sources:
  - "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PIN MODES, %11111 = asynchronous serial receive (X[31:16], X[15:10] and X[4:0], the receive state sequence, the SHR #32-N read); Propeller 2 P2X8C4M64P Hardware Manual, Nov 1, 2022 Release, Asynchronous Serial Receive (%11111), p.60"
  - "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PIN MODES, %11110 = asynchronous serial transmit (the busy flag and the WAITX #1 poll used in the full-duplex example); SMART PINS (RDPIN acknowledges and RQPIN does not)"
