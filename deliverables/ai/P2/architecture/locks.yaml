# P2 Hardware Locks System
# Sources:
#   Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), LOCKS
#   Instruction encodings, same document, Assembly Language (instruction encoding list)
#   Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Locks, p.19-20
#     and the PASM2 instruction table, p.42

component_name: "Hardware Locks"

component_type: "hardware_semaphore"

description: |
  The hub contains a pool of 16 semaphore bits, called locks, with atomic
  read-modify-write operations, which cogs use to coordinate exclusive access to a
  shared resource. One cog allocates a lock with LOCKNEW; cooperative cogs then take it
  with LOCKTRY and release it with LOCKREL, and LOCKRET returns it to the unallocated
  pool. Only one cog at a time can hold a lock. A lock has two separate pieces of
  state, whether it is allocated and whether it is held (state_versus_allocation).
  What a lock represents is up to the application.

architecture:
  total_locks: 16
  lock_numbering: "0-15"

  lock_states:
    - state: "unallocated"
      description: "Not issued by LOCKNEW. LOCKTRY on it does not take it."

    - state: "allocated, not held"
      description: "Any cog can take it with LOCKTRY"

    - state: "allocated, held"
      description: "Held by one cog until that cog executes LOCKREL, is stopped (COGSTOP) or restarted (COGINIT), or LOCKRET is executed for the lock"
      cog_id: "0-7 (owning COG number)"

  atomic_operations:
    - name: "test_and_set"
      description: "LOCKTRY takes an allocated lock that no other cog holds, in one instruction, and reports with WC whether it did"
      guarantee: "Lock arbitration is performed by the hub in a round-robin fashion, so only one cog is awarded ownership at a time and a cog waiting in a loop gets its fair turn"
    
    - name: "report_owner"
      description: "LOCKREL with WC and a register D writes the current (or last) owner's cog ID into D and the lock status into C; if the executing cog holds the lock it is released"
    
    - name: "release"
      description: "Free a lock that current COG owns"
      safety: "Only owning COG can release its lock"

state_versus_allocation:
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), LOCKS (LOCKRET returns an allocated lock, any cog may; only the cog that has taken the lock can release it; a lock is implicitly released if the holding cog is stopped via COGSTOP or restarted via COGINIT, or if LOCKRET is executed for it)"
  summary: >-
    A lock has two pieces of state, and the documents give different instructions and
    events for them: whether it is held, and whether its number is allocated.
  held_state:
    what: "Whether the lock is currently taken, and by which cog."
    cleared_by:
      - "The owner's LOCKREL."
      - "The owner cog being stopped by COGSTOP while it holds the lock."
      - "The owner cog being restarted by COGINIT while it holds the lock."
      - "LOCKRET executed for the lock."
  allocation:
    what: "Whether the lock number is issued at all - what LOCKNEW hands out."
    cleared_by:
      - "LOCKRET, which returns the lock to the unallocated pool; any cog can execute it."
    note: "The documents name LOCKRET as the way to return a lock to the pool, and COGSTOP and COGINIT as releasing a held lock. Not documented: whether stopping or restarting a cog also returns a lock to the pool."
  the_leak: >-
    LOCKNEW reports, with C = 1, when all 16 locks are already allocated, and in a -d
    build the debugger allocates lock 15. A program that allocates locks and does not
    LOCKRET them can run out, and the failure appears at a later LOCKNEW in code that
    never touched the locks that were not returned.
  the_rule: >-
    Every LOCKNEW needs a LOCKRET on every path out, including error and shutdown paths:
    LOCKRET is the documented way to return a lock to the pool. Releasing the lock
    (LOCKREL) only ends the hold.
  corroboration: >-
    This page's own LOCKREL WC behaviour shows the stale-owner half already: it reports the
    cog ID of the current owner if held, or of the LAST owner if released, so the owner
    field still reads the stopped cog after its lock has gone free.

pattern_prerequisite:
  source: "lock_15: Parallax Propeller 2 Spin2 Language Documentation v55, DEBUG ('LOCK[15] is allocated by the debugger and used among all cogs during their debug interrupts to time-share the DEBUG serial TX and RX pins, as well as some RAM'; the DLY command releases LOCK[15] so other cogs may capture LOCK[15] and output their own DEBUG messages)"
  summary: >-
    Every pattern below assumes an ALLOCATED lock, and the number must come from LOCKNEW.
    LOCKTRY on an unallocated lock never succeeds - "not allocated" is one of the
    conditions under which it reports failure - so a pattern that hard-codes a number it
    never allocated spins forever, or in an initialisation barrier never initialises.
  in_the_patterns: >-
    Each pattern shows the critical section only. Its lock_num is a number LOCKNEW
    returned, held in a register or a VAR, and LOCKRET'd on every path out. Do not
    substitute a literal lock number.
  lock_15: >-
    Do not use lock 15 in examples or code: a DEBUG build allocates it for the debugger,
    so it may not be allocatable at all.
  allocate_first: |
    ' every pattern below depends on this having run
            LOCKNEW lock_num  WC         ' C=1 means none were available
    IF_C    JMP     #no_locks_left       ' handle it; do not proceed with a guess
    ' ... use lock_num in the patterns below ...
            LOCKRET lock_num             ' on EVERY path out, including errors

instructions:
  - instruction: "LOCKTRY"
    encoding: "EEEE 1101011 C0L DDDDDDDDD 000000110"
    description: "Try to take lock D[3:0]. C = 1 if the lock was taken."
    source: >-
      Parallax Propeller 2 Documentation v35 (Rev B/C silicon), LOCKS, Using Locks; encoding: Assembly Language (instruction encodings).
      Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.41.
    operation: |
      Attempt to take lock D[3:0].
      C := 1 if the lock was successfully taken (it is now held by this cog)
      C := 0 if it was not taken -- another cog holds it, or it is not allocated
      C is written only when WC is given.
      D is not written by LOCKTRY.
      Lock arbitration is performed by the hub in a round-robin fashion, so any cog
      waiting in a loop to capture a lock gets its fair turn.
    flags_affected: "C"
    timing: "2 clocks (range 2...9, +2 if WC; per language/pasm2/locktry.yaml encoding)"
    usage_example: |
      LOCKTRY lock_num WC      ' Try to get lock; WC writes C
      IF_C    JMP #got_lock    ' Jump if successful
      ' Lock was busy (C = 0); LOCKTRY does not write D
  
  - instruction: "LOCKREL"
    encoding: "EEEE 1101011 C0L DDDDDDDDD 000000111"
    encoding_conflict: "Parallax's documents also give LOCKREL's encoding as EEEE 1101011 00L DDDDDDDDD 000000111, with no C bit, beside the syntax LOCKREL D/# {WC}."
    description: >-
      Release lock D[3:0]. With WC and a register D, also reports the lock's status in C
      and its current/last owner in D.
    source: >-
      Parallax Propeller 2 Documentation v35 (Rev B/C silicon), LOCKS, Using Locks; encoding: Assembly Language (instruction encodings).
      encoding and encoding_conflict: P2 Instructions v35 - Rev B/C Silicon, LOCKREL row (C0L); Parallax Propeller 2 Documentation v35 (Rev B/C silicon), Assembly Language (instruction encodings: 00L).
      Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.41.
    operation: |
      Release lock D[3:0]. Only the cog holding the lock can release it.
      With WC: C := 1 if the lock is currently taken, 0 if it is not.
      With WC and D a register (not an immediate): D := the cog ID of the
      current owner (if held) or the last owner (if released).
      A cog that is itself holding the lock still releases it in this form.
    flags_affected: "C"
    timing: "2 clocks (range 2...9, +2 if WC; per language/pasm2/lockrel.yaml encoding)"
    usage_example: |
      LOCKREL lock_num         ' Release lock (only the cog that holds it can release it)

  - instruction: "LOCKNEW"
    encoding: "EEEE 1101011 C00 DDDDDDDDD 000000100"
    description: "Allocate (check out) a free lock number; does not take the lock"
    source: >-
      Parallax Propeller 2 Documentation v35 (Rev B/C silicon), LOCKS, Allocating Locks; encoding: Assembly Language (instruction encodings).
      Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.41.
    operation: |
      Allocate a lock from the hub's pool of 16.
      If an unallocated lock is available, its number is written into D.
      With WC: C := 0 if a lock was allocated, 1 if all locks are already allocated.
      A cog may allocate more than one lock.
    flags_affected: "C"
    timing: "4 clocks (range 4...11; per language/pasm2/locknew.yaml encoding)"
    usage_example: |
      LOCKNEW my_lock WC       ' Get any available lock
      IF_C    JMP #no_locks    ' Jump if none available (C=1)
      ' Lock number is in my_lock
  
  - instruction: "LOCKRET"
    encoding: "EEEE 1101011 00L DDDDDDDDD 000000101"
    description: "Return lock D[3:0] to the unallocated lock pool for reallocation"
    source: >-
      Parallax Propeller 2 Documentation v35 (Rev B/C silicon), LOCKS, Allocating Locks; encoding: Assembly Language (instruction encodings).
      Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.41 (LOCKRET's row).
    operation: |
      Return lock D[3:0] to the unallocated lock pool. Any cog can return an
      allocated lock, even one it did not allocate with LOCKNEW.
      D is not written by LOCKRET.
    timing: "2 clocks (range 2...9; per language/pasm2/lockret.yaml encoding)"
    usage_example: |
      LOCKRET lock_num         ' Return the lock to the pool (any cog may); D is not written

  - instruction: "LOCKREL (query form)"
    encoding: "EEEE 1101011 C0L DDDDDDDDD 000000111"
    encoding_conflict: "Parallax's documents also give LOCKREL's encoding as EEEE 1101011 00L DDDDDDDDD 000000111, with no C bit, beside the syntax LOCKREL D/# {WC}."
    description: >-
      LOCKREL is the instruction that reports lock status and ownership -- LOCKTRY has no
      status-only form. LOCKTRY always attempts to take the lock.
    source: >-
      Parallax Propeller 2 Documentation v35 (Rev B/C silicon), LOCKS, Using Locks.
    operation: |
      C := 1 if the lock is currently taken, 0 if it is not.
      D (a register, not an immediate) := cog ID of the current owner (if held)
      or of the last owner (if released).
      NOTE: this is not a passive query -- if the cog executing it is holding the
      lock, the normal LOCKREL behaviour still happens and the lock IS released.
    flags_affected: "C"
    timing: "2 clocks (range 2...9, +2 if result; per language/pasm2/lockrel.yaml encoding)"
    usage_example: |
      LOCKREL lock_num WC      ' Read lock status/owner (and release if we hold it)
      IF_NC   JMP #lock_free   ' C=0 means the lock is not currently taken

programming_patterns:
  - pattern: "basic_mutex"
    description: "Mutual exclusion pattern: lock arbitration is performed by the hub in a round-robin fashion, so a cog waiting in this loop gets its fair turn"
    code: |
      
      ' Critical section entry
      .retry_lock
          LOCKTRY lock_num WC
          IF_NC   JMP #.retry_lock     ' Spin until acquired
      
      ' ... critical section code here ...
      
      ' Critical section exit
          LOCKREL lock_num       ' Release the lock
  
  - pattern: "timeout_lock"
    description: "Try lock with timeout"
    code: |
      ' Try to acquire lock with timeout
          GETCT   timeout
          ADDCT1  timeout, ##1_000_000  ' CT1 target 1 million clocks ahead; clears the CT1 event flag

      .try_loop
          LOCKTRY lock_num WC
          IF_C    JMP #.got_lock
          JNCT1   #.try_loop            ' CT has not passed the target yet
          JMP     #.timeout_error
      
      .got_lock
      ' ... protected code ...
          LOCKREL lock_num
  
  - pattern: "multi_lock"
    description: "Take two locks one after the other, releasing the first and starting again if the second is not taken"
    code: |
      ' Acquire lock_a, then lock_b (both numbers returned by LOCKNEW)
      .retry
          LOCKTRY lock_a WC
          IF_NC   JMP #.retry
          LOCKTRY lock_b WC
          IF_NC   LOCKREL lock_a       ' Release A if B is not taken
          IF_NC   JMP #.retry

      ' ... use both resources ...

          LOCKREL lock_b               ' Release in any order
          LOCKREL lock_a

  - pattern: "dynamic_lock_allocation"
    description: "Allocate locks dynamically at runtime"
    code: |
      ' Allocate a new lock
          LOCKNEW my_lock WC
          IF_C    JMP #no_locks_error  ' C=1 means all locks already allocated
          
      ' Save lock number for later use
          MOV     saved_lock, my_lock
          
      ' ... use lock for synchronization ...
          
      ' Return lock to pool when done
          LOCKRET saved_lock

common_applications:
  - application: "shared_memory_protection"
    description: "Protect hub RAM data structures accessed by multiple COGs"
    complexity: "intermediate"
    example: |
      ' Protect shared buffer access
      
      ' Writer COG
      .write_data
          LOCKTRY lock_num WC
          IF_NC   JMP #$-1
          WRLONG  data, buffer_ptr
          LOCKREL lock_num
  
  - application: "resource_arbitration"
    description: "Manage access to shared hardware resources like pins or hub peripherals"
    complexity: "intermediate"
    example: |
      ' Shared pin group access control

      .use_pins
          LOCKTRY lock_num WC
          IF_NC   JMP #$-1
          DRVH    #LED_PIN      ' Use shared pins
          WAITX   ##1000
          DRVL    #LED_PIN
          LOCKREL lock_num
  
  - application: "producer_consumer"
    description: "Synchronize producer/consumer queues"
    complexity: "advanced"
    example: |
      ' Queue lock for FIFO access
      
      ' Producer adds item
      .produce
          LOCKTRY lock_num WC
          IF_NC   JMP #$-1
          ' Add item to queue
          WRLONG  item, queue_tail
          ADD     queue_tail, #4
          LOCKREL lock_num

  - application: "initialization_synchronization"
    description: "Ensure single COG performs system initialization"
    complexity: "beginner"
    example: |
      ' First COG to get lock does init
      
          LOCKTRY lock_num WC
          IF_C    CALL #do_initialization
          ' The cog that took the lock runs the initialization; the other cogs continue without waiting

performance_considerations:
  lock_access_time: "LOCKNEW: 4 clocks (range 4...11). LOCKTRY/LOCKREL/LOCKRET: 2 clocks (range 2...9, +2 if WC for LOCKTRY/LOCKREL). Per per-instruction YAMLs."
  max_locks: 16

debugging_tips:
  - tip: "lock_ownership_tracking"
    description: >-
      Use LOCKREL with WC and a register operand to read a lock's status and owner. Note
      that this also releases the lock if the querying cog is the one holding it.
    code: |
      LOCKREL lock_num WC      ' C = lock currently taken; lock_num = current/last owner
  
  - tip: "lock_usage_map"
    description: "Lock numbers come from LOCKNEW and are shared between cogs by the application"
    source: "lock 15 comment: Parallax Propeller 2 Spin2 Language Documentation v55, DEBUG ('LOCK[15] is allocated by the debugger and used among all cogs during their debug interrupts to time-share the DEBUG serial TX and RX pins, as well as some RAM'; the DLY command releases LOCK[15] so other cogs may capture LOCK[15] and output their own DEBUG messages)"
    example: |
      ' Lock assignments for this project (the numbers are whatever LOCKNEW returned):
      ' mailbox_lock - protects the hub mailbox
      ' buffer_lock  - protects the shared buffer pool
      ' (a DEBUG build allocates lock 15 for the debugger)

related_topics:
  - topic: "cog_synchronization"
    relationship: "Locks are primary inter-COG synchronization mechanism"
  
  - topic: "hub_memory"
    relationship: "Locks typically protect shared hub RAM structures"
  
  - topic: "events"
    relationship: "Can combine locks with events for complex synchronization"
  
  - topic: "interrupts"
    relationship: "Locks are semaphore bits with atomic read-modify-write operations"

sources:
    - "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), LOCKS (Allocating Locks and Using Locks)"
    - "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), Assembly Language (instruction encodings: LOCKNEW/LOCKRET/LOCKTRY/LOCKREL)"
    - "Parallax Propeller 2 Spin2 Language Documentation v55, DEBUG ('LOCK[15] is allocated by the debugger and used among all cogs during their debug interrupts'; the DLY command releases LOCK[15])"
    - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Locks, pp.19-20"
    - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF (lock rows), p.41"
