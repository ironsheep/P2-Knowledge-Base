# P2 Hardware Locks System
# Provenance (re-derived 2026-08-26; the previous header cited a file that has
# never existed and datasheet pages beyond the end of a 50-page datasheet):
#   Propeller 2 Documentation v35 (Rev B/C Silicon), section LOCKS --
#     engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:3673-3700
#   Instruction encodings, same document, PASM2 encoding table --
#     engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:5236-5239
#   P2X8C4M64P Datasheet 2022/11/01, "Locks" p.19-20 --
#     engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:877-905
#     and the PASM2 instruction table p.42 -- p2-datasheet-text.txt:1791-1797

component_name: "Hardware Locks"

component_type: "hardware_semaphore"

description: |
  The P2 provides 16 hardware locks (semaphores) that enable atomic resource management across 
  all 8 COGs. These locks provide guaranteed mutual exclusion for shared resources without the 
  possibility of race conditions. Each lock can be in one of two states: available (free) or 
  owned by a specific COG. The hardware ensures atomic test-and-set operations, preventing 
  multiple COGs from simultaneously acquiring the same lock.

architecture:
  total_locks: 16
  lock_numbering: "0-15"
  state_bits: 4  # Per lock: 3 bits COG ID + 1 bit owned flag
  
  lock_states:
    - state: "available"
      description: "Lock is free and can be acquired by any COG"
      owned_bit: 0
      cog_id: "undefined"
    
    - state: "owned"
      description: "Lock is held by a specific COG"
      owned_bit: 1
      cog_id: "0-7 (owning COG number)"
  
  atomic_operations:
    - name: "test_and_set"
      description: "Atomically check if lock is free and acquire if available"
      guarantee: "Hardware ensures no race conditions between COGs"
    
    - name: "check_owner"
      description: "Determine which COG owns a lock"
      non_blocking: true
    
    - name: "release"
      description: "Free a lock that current COG owns"
      safety: "Only owning COG can release its lock"

state_versus_allocation:
  source: "Propeller 2 Documentation v35, Locks -- engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:3686 (LOCKRET returns an allocated lock, any cog may), :3696 (only the cog that has taken the lock can release it), :3698 (a lock is implicitly released if the holding cog is stopped via COGSTOP or restarted via COGINIT, or if LOCKRET is executed for it)"
  summary: >-
    A lock has TWO independent pieces of state and they are freed by different things.
    Confusing them is the most expensive mistake available with locks, because the
    consequence appears in unrelated code much later.
  held_state:
    what: "Whether the lock is currently taken, and by which cog."
    cleared_by:
      - "The owner's LOCKREL."
      - "The owner cog becoming INACTIVE - for any cause, including COGSTOP. Ownership stops holding; nothing has to release it."
      - "The lock being unallocated."
  allocation:
    what: "Whether the lock number is issued at all - what LOCKNEW hands out."
    cleared_by:
      - "LOCKRET, and nothing else."
    note: "COGSTOP does NOT return the number, and neither does the cog ending any other way."
  the_leak: >-
    Stopping a cog that owns a lock therefore frees the lock and LEAKS its number.
    Anyone can now take that lock, but nobody can ever be ISSUED it again. Sixteen such
    leaks and LOCKNEW returns nothing for the rest of the run, and the failure appears at
    some later LOCKNEW in code that never touched the lock that leaked.
  the_rule: >-
    Every LOCKNEW needs a LOCKRET on EVERY path out, including error and shutdown paths.
    Releasing is not enough, and stopping the cog is not enough.
  corroboration: >-
    This page's own LOCKREL WC behaviour shows the stale-owner half already: it reports the
    cog ID of the current owner if held, or of the LAST owner if released, so the owner
    field still reads the stopped cog after its lock has gone free.

pattern_prerequisite:
  summary: >-
    Every pattern below assumes an ALLOCATED lock, and the number must come from LOCKNEW.
    LOCKTRY on an unallocated lock never succeeds - "not allocated" is one of the
    conditions under which it reports failure - so a pattern that hard-codes a number it
    never allocated spins forever, or in an initialisation barrier never initialises.
  in_the_patterns: >-
    Each pattern shows the critical section only. Its lock_num is a number LOCKNEW
    returned, held in a register or a VAR, and LOCKRET'd on every path out. Do not
    substitute a literal lock number.
  lock_15: >-
    Do not use lock 15 in examples or code: a DEBUG build holds it, so it may not be
    allocatable at all.
  allocate_first: |
    ' every pattern below depends on this having run
            LOCKNEW lock_num  WC         ' C=1 means none were available
    IF_C    JMP     #no_locks_left       ' handle it; do not proceed with a guess
    ' ... use lock_num in the patterns below ...
            LOCKRET lock_num             ' on EVERY path out, including errors

instructions:
  - instruction: "LOCKTRY"
    encoding: "EEEE 1101011 C0L DDDDDDDDD 000000110"
    description: "Try to take lock D[3:0]. C = 1 if the lock was taken."
    source: >-
      Propeller 2 Documentation v35 (Rev B/C), LOCKS > Using Locks --
      engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:3688; encoding at
      silicon-doc-text.txt:5238; P2 Datasheet 2022/11/01 PASM2 table --
      engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:1796-1797.
    operation: |
      Attempt to take lock D[3:0].
      C := 1 if the lock was successfully taken (it is now held by this cog)
      C := 0 if it was not taken -- another cog holds it, or it is not allocated
      D is not written by LOCKTRY.
    flags_affected: "C"
    timing: "2 clocks (range 2...9, +2 if WC; per language/pasm2/locktry.yaml encoding)"
    usage_example: |
      LOCKTRY lock_num         ' Try to get lock
      IF_C    JMP #got_lock    ' Jump if successful
      ' Lock was busy, owner ID is in lock_num
  
  - instruction: "LOCKREL"
    encoding: "EEEE 1101011 00L DDDDDDDDD 000000111"
    description: >-
      Release lock D[3:0]. With WC and a register D, also reports the lock's status in C
      and its current/last owner in D.
    source: >-
      Propeller 2 Documentation v35 (Rev B/C), LOCKS > Using Locks --
      engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:3696, :3700; encoding at
      silicon-doc-text.txt:5239; P2 Datasheet 2022/11/01 PASM2 table --
      engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:1792-1795.
    operation: |
      Release lock D[3:0]. Only the cog holding the lock can release it.
      With WC: C := 1 if the lock is currently taken, 0 if it is not.
      With WC and D a register (not an immediate): D := the cog ID of the
      current owner (if held) or the last owner (if released).
      A cog that is itself holding the lock still releases it in this form.
    flags_affected: "C"
    timing: "2 clocks (range 2...9, +2 if WC; per language/pasm2/lockrel.yaml encoding)"
    usage_example: |
      LOCKREL lock_num         ' Release lock
      IF_NC   JMP #not_owner   ' Jump if we didn't own it
  
  - instruction: "LOCKNEW"
    encoding: "EEEE 1101011 C00 DDDDDDDDD 000000100"
    description: "Find and acquire first available lock"
    source: >-
      Propeller 2 Documentation v35 (Rev B/C), LOCKS > Allocating Locks --
      engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:3684; encoding at
      silicon-doc-text.txt:5236; P2 Datasheet 2022/11/01 PASM2 table --
      engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:1791.
    operation: |
      Allocate a lock from the hub's pool of 16.
      If an unallocated lock is available, its number is written into D.
      With WC: C := 0 if a lock was allocated, 1 if all locks are already allocated.
      A cog may allocate more than one lock.
    flags_affected: "C"
    timing: "4 clocks (range 4...11; per language/pasm2/locknew.yaml encoding)"
    usage_example: |
      LOCKNEW my_lock WC       ' Get any available lock
      IF_C    JMP #no_locks    ' Jump if none available (C=1)
      ' Lock number is in my_lock
  
  - instruction: "LOCKRET"
    encoding: "EEEE 1101011 00L DDDDDDDDD 000000101"
    description: "Return lock D[3:0] to the unallocated lock pool for reallocation"
    source: >-
      Propeller 2 Documentation v35 (Rev B/C), LOCKS > Allocating Locks --
      engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:3686; encoding at
      silicon-doc-text.txt:5237; P2 Datasheet 2022/11/01 PASM2 table --
      engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:1795 -- LOCKRET's
        row. The locator previously named line 1794, which is a wrapped continuation of
        the LOCKREL row above it. Corrected 2026-08-30, F-399.
    operation: |
      Return lock D[3:0] to the unallocated lock pool. Any cog can return an
      allocated lock, even one it did not allocate with LOCKNEW.
      D is not written by LOCKRET.
    timing: "2 clocks (range 2...9; per language/pasm2/lockret.yaml encoding)"
    usage_example: |
      LOCKRET lock_num         ' Force release lock
      ' Previous owner (if any) is returned in lock_num

  - instruction: "LOCKREL (query form)"
    encoding: "EEEE 1101011 00L DDDDDDDDD 000000111"
    description: >-
      LOCKREL is the instruction that reports lock status and ownership -- LOCKTRY has no
      status-only form. LOCKTRY always attempts to take the lock.
    source: >-
      Propeller 2 Documentation v35 (Rev B/C), LOCKS > Using Locks --
      engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:3700.
    operation: |
      C := 1 if the lock is currently taken, 0 if it is not.
      D (a register, not an immediate) := cog ID of the current owner (if held)
      or of the last owner (if released).
      NOTE: this is not a passive query -- if the cog executing it is holding the
      lock, the normal LOCKREL behaviour still happens and the lock IS released.
    flags_affected: "C"
    timing: "2 clocks (range 2...9, +2 if result; per language/pasm2/lockrel.yaml encoding)"
    usage_example: |
      LOCKREL lock_num WC      ' Read lock status/owner (and release if we hold it)
      IF_NC   JMP #lock_free   ' C=0 means the lock is not currently taken

programming_patterns:
  - pattern: "basic_mutex"
    description: "Standard mutual exclusion pattern"
    code: |
      
      ' Critical section entry
      .retry_lock
          LOCKTRY lock_num WC
          IF_NC   JMP #.retry_lock     ' Spin until acquired
      
      ' ... critical section code here ...
      
      ' Critical section exit
          LOCKREL lock_num       ' Release the lock
  
  - pattern: "timeout_lock"
    description: "Try lock with timeout"
    code: |
      ' Try to acquire lock with timeout
          GETCT   timeout
          ADD     timeout, ##1_000_000  ' 1 million clock timeout
      
      .try_loop
          LOCKTRY lock_num WC
          IF_C    JMP #.got_lock
          GETCT   current
          CMP     current, timeout WC
          IF_C    JMP #.try_loop
          JMP     #.timeout_error
      
      .got_lock
      ' ... protected code ...
          LOCKREL lock_num
  
  - pattern: "multi_lock"
    description: "Acquire multiple locks in order to prevent deadlock"
    code: |
      ' Always acquire locks in ascending order
          LOCKTRY #LOCK_A WC
          IF_NC   JMP #$-1
          LOCKTRY #LOCK_B WC
          IF_NC   LOCKREL #LOCK_A     ' Release A if B fails
          IF_NC   JMP #retry
      
      ' ... use both resources ...
      
          LOCKREL #LOCK_B              ' Release in any order
          LOCKREL #LOCK_A

  - pattern: "dynamic_lock_allocation"
    description: "Allocate locks dynamically at runtime"
    code: |
      ' Allocate a new lock
          LOCKNEW my_lock WC
          IF_C    JMP #no_locks_error  ' C=1 means all locks already allocated
          
      ' Save lock number for later use
          MOV     saved_lock, my_lock
          
      ' ... use lock for synchronization ...
          
      ' Return lock to pool when done
          LOCKRET saved_lock

common_applications:
  - application: "shared_memory_protection"
    description: "Protect hub RAM data structures accessed by multiple COGs"
    complexity: "intermediate"
    example: |
      ' Protect shared buffer access
      
      ' Writer COG
      .write_data
          LOCKTRY lock_num WC
          IF_NC   JMP #$-1
          WRLONG  data, buffer_ptr
          LOCKREL lock_num
  
  - application: "resource_arbitration"
    description: "Manage access to shared hardware resources like pins or hub peripherals"
    complexity: "intermediate"
    example: |
      ' Shared pin group access control

      .use_pins
          LOCKTRY lock_num WC
          IF_NC   JMP #$-1
          DRVH    #LED_PIN      ' Use shared pins
          WAITX   ##1000
          DRVL    #LED_PIN
          LOCKREL lock_num
  
  - application: "producer_consumer"
    description: "Synchronize producer/consumer queues"
    complexity: "advanced"
    example: |
      ' Queue lock for FIFO access
      
      ' Producer adds item
      .produce
          LOCKTRY lock_num WC
          IF_NC   JMP #$-1
          ' Add item to queue
          WRLONG  item, queue_tail
          ADD     queue_tail, #4
          LOCKREL lock_num

  - application: "initialization_synchronization"
    description: "Ensure single COG performs system initialization"
    complexity: "beginner"
    example: |
      ' First COG to get lock does init
      
          LOCKTRY lock_num WC
          IF_C    CALL #do_initialization
          ' All COGs continue here after init

best_practices:
  - practice: "ordered_acquisition"
    description: "Always acquire multiple locks in the same order to prevent deadlock"
    rationale: "Prevents circular wait conditions"
  
  - practice: "minimal_hold_time"
    description: "Hold locks for the shortest time possible"
    rationale: "Reduces contention and improves system throughput"
  
  - practice: "always_release"
    description: "Ensure locks are released in all code paths including errors"
    rationale: "Prevents permanent lock starvation"
  
  - practice: "document_lock_usage"
    description: "Clearly document which locks protect which resources"
    rationale: "Prevents misuse and conflicting lock assignments"

performance_considerations:
  lock_access_time: "LOCKNEW: 4 clocks (range 4...11). LOCKTRY/LOCKREL/LOCKRET: 2 clocks (range 2...9, +2 if WC for LOCKTRY/LOCKREL). Per per-instruction YAMLs."
  
  contention_impact:
    low_contention: "Minimal overhead per cited timings above"
    high_contention: "COGs spin-waiting consume hub slots"
    
  hub_bandwidth:
    description: "Lock operations use hub cycles like memory access"
    optimization: "Minimize lock checking frequency in spin loops"
  
  scalability:
    max_locks: 16
    workaround: "Use locks to protect larger lock tables in hub RAM if needed"

debugging_tips:
  - tip: "lock_ownership_tracking"
    description: >-
      Use LOCKREL with WC and a register operand to read a lock's status and owner. Note
      that this also releases the lock if the querying cog is the one holding it.
    code: |
      LOCKREL lock_num WC      ' C = lock currently taken; lock_num = current/last owner
  
  - tip: "deadlock_detection"
    description: "Implement timeouts on lock acquisition"
    importance: "Prevents system hangs from deadlock"
  
  - tip: "lock_usage_map"
    description: "Document lock assignments in a central location"
    example: |
      ' System Lock Assignments:
      ' Lock 0: Hub mailbox system
      ' Lock 1: CORDIC engine
      ' Lock 2: Serial port A
      ' Lock 3: Shared buffer pool
      ' Locks 4-15: Available for dynamic allocation

related_topics:
  - topic: "cog_synchronization"
    relationship: "Locks are primary inter-COG synchronization mechanism"
  
  - topic: "hub_memory"
    relationship: "Locks typically protect shared hub RAM structures"
  
  - topic: "events"
    relationship: "Can combine locks with events for complex synchronization"
  
  - topic: "interrupts"
    relationship: "Lock operations are atomic even with interrupts enabled"

extraction_metadata:
  source_documents:
    - document: "Propeller 2 Documentation v35 (Rev B/C Silicon)"
      path: "engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt"
      sections:
        - "LOCKS, incl. Allocating Locks and Using Locks -- lines 3673-3700"
        - "PASM2 encoding table, LOCKNEW/LOCKRET/LOCKTRY/LOCKREL -- lines 5236-5239"
    - document: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01"
      path: "engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt"
      sections:
        - "Locks, p.19-20 -- lines 877-905"
        - "PASM2 instruction table, lock rows, p.42 -- lines 1791-1797"
  re_derivation_note: >-
    Re-derived 2026-08-26 under F-359. The header this file shipped with cited
    `part1-cog.txt` (a file that has never existed) and datasheet pages 34-35 and 82
    (the datasheet is 50 pages). All four lock-instruction encodings were wrong and have
    been replaced from the encoding table above; the "LOCKTRY (WC mode) = check without
    acquiring" entry contradicted the source and was replaced by LOCKREL's documented
    query form.