description: |
  Thirteen bits of the WRPIN D operand -- %M..M, D[20:8] -- set the low-level pin
  mode: how the pin senses its input, whether IN and the output are inverted, and how
  hard each side of the output driver drives. The field is named "(M) Pin Mode" and is
  also called "low-level pin control".

  The high side and the low side each get their own three-bit selector, HHH and LLL,
  and each selector picks one rung of the same eight-rung ladder that runs from a fast
  digital drive down to float. The two sides are chosen independently: a pin can drive
  hard one way and weakly the other.

  A drive selection is only ever a property of driving. DIR
  is the direction bit -- input (float) or output (drive) -- so a pin configured with a
  weak drive and then left with DIR low is simply a high-impedance input, and the
  selection does nothing.

source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Pin Modes (the (M) Pin Mode
  table and the Pin Mode Legend), p.24; cell-identical in the Propeller 2 P2X8C4M64P
  Hardware Manual Nov 1, 2022 Release, Pin Modes, p.32; Parallax Propeller 2
  Documentation v35 (Rev B/C silicon), SMART PINS (the WRPIN D operand layout); sub-field
  masks from the Parallax Propeller 2 Spin2 Language Documentation v55, Built-In Symbols
  for Smart Pin Configuration"

field_position:
  wrpin_d_operand: "%AAAA_BBBB_FFF_MMMMMMMMMMMMM_TT_SSSSS_0"
  bits: "20:8"
  width: 13
  numbering: "M[12] is the most significant bit of the field, M[0] the least"
  purpose: "low-level pin control"
  full_word_reference: "architecture/smart_pins.yaml (configuration_format) carries the
    whole 32-bit word: all six fields, their bit ranges, the composition rule, and the
    %TT behaviour-by-context table"
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PINS (the D
    operand layout; %M..M: low-level pin control, and the deferral to the Spin2
    predefined labels); Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Pin Modes,
    p.23; Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, Pin Modes, p.32"

pin_circuit:
  description: "Each I/O pin has 13 configuration bits, M[12:0], which determine the operation of its 3.3V circuit; the M bits in the WRPIN D operand (D[20:8]) go directly to these bits. In some smart pin modes these bits are partially overwritten to set things like DAC values. The pin circuit is powered from its local 3.3V supply pin and connects to its own pin and to its odd/even adjacent pin: P0 and P1 see each other's pins as adjacent pins, as do P2 and P3, and so on."
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), PIN CONFIGURATION MODES (diagram of a single I/O pin circuit)"

sub_fields:
  how_the_field_is_stated: |
    %M..M is a set of M[12:0] bit patterns, one per pin-mode family, not one fixed
    split -- a wider mode code leaves fewer bits for the letters below. The families are:
      0000_CIOHHHLLL .. 0111_CIOHHHLLL   logic / Schmitt / pin-to-pin comparator
      100000_OHHHLLL .. 100111_OHHHLLL   ADC input
      10100_DDDDDDDD .. 10111_DDDDDDDD   DAC output
      1100_CDDDDDDDD .. 1111_CDDDDDDDD   level comparison
    The same letters are also stated as masks over the whole D operand, which is where
    each position below comes from.
  source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Pin Modes ((M) Pin Mode
    table and the Pin Mode Legend), p.24; identical rows in the Propeller 2 P2X8C4M64P
    Hardware Manual Nov 1, 2022 Release, Pin Modes, p.32; sub-mode masks from the
    Parallax Propeller 2 Spin2 Language Documentation v55, Built-In Symbols for Smart
    Pin Configuration"

  mode_select:
    bits: "M[12:9] for the logic / Schmitt / comparator family and for the
      level-comparison family; M[12:7] for the ADC family; M[12:8] for the DAC family
      (the leading bits of each datasheet pattern above)"
    purpose: "selects the low-level pin mode"

  in_out_sampling:
    bits: "M[8]"
    legend: "C"
    values:
      "0": "Live"
      "1": "Clocked"
    footnotes: "Live is used for feedback operations and provides a continuous
      (non-clocked) signal; Clocked updates on clock edge only"
    also_named: "the Sync mode bit, selected by the two constants in the Sync Mode group"
    applies_to: "the logic / Schmitt / comparator and level-comparison families"

  in_polarity:
    bits: "M[7]"
    legend: "I"
    values:
      "0": "True"
      "1": "Not (inverted)"
    applies_to: "the logic / Schmitt / comparator families"

  output_polarity:
    bits: "M[6]"
    legend: "O"
    values:
      "0": "True"
      "1": "Not (inverted)"
    applies_to: "the logic / Schmitt / comparator and ADC families"

  drive_high:
    bits: "M[5:3]"
    legend: "HHH"
    selects: "one rung of the drive ladder below, for the high side of the driver"

  drive_low:
    bits: "M[2:0]"
    legend: "LLL"
    selects: "one rung of the drive ladder below, for the low side of the driver"

  dac_level:
    bits: "M[7:0]"
    legend: "DDDDDDDD"
    meaning: "8-bit DAC value, in the DAC output family"

  comparison_level:
    bits: "M[7:0]"
    legend: "LLLLLLLL, also written DDDDDDDD"
    meaning: "8-bit Level, in the level-comparison family"

drive_ladder:
  applies_to: "HHH (M[5:3], high side) and LLL (M[2:0], low side). The two selectors are
    independent and take the same eight encodings."
  what_it_selects: "how hard the pin drives while it drives -- not a bias network that
    is present when the pin is an input. See dir_and_out_rule below."
  encoding:
    - { bits: "%000", drive: "Fast",   high_constant: "P_HIGH_FAST",  low_constant: "P_LOW_FAST" }
    - { bits: "%001", drive: "1.5 kΩ", high_constant: "P_HIGH_1K5",   low_constant: "P_LOW_1K5" }
    - { bits: "%010", drive: "15 kΩ",  high_constant: "P_HIGH_15K",   low_constant: "P_LOW_15K" }
    - { bits: "%011", drive: "150 kΩ", high_constant: "P_HIGH_150K",  low_constant: "P_LOW_150K" }
    - { bits: "%100", drive: "1 mA",   high_constant: "P_HIGH_1MA",   low_constant: "P_LOW_1MA" }
    - { bits: "%101", drive: "100 µA", high_constant: "P_HIGH_100UA", low_constant: "P_LOW_100UA" }
    - { bits: "%110", drive: "10 µA",  high_constant: "P_HIGH_10UA",  low_constant: "P_LOW_10UA" }
    - { bits: "%111", drive: "Float",  high_constant: "P_HIGH_FLOAT", low_constant: "P_LOW_FLOAT" }
  definitions_live_in: "language/spin2/symbols/spin2-builtin-symbols-complete.yaml -- the
    per-constant record for each name above, with its wording, value and bit pattern"
  source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Pin Modes (Pin Mode
    Legend, HHH / LLL Drive table), p.24; the same eight rows in the Propeller 2
    P2X8C4M64P Hardware Manual Nov 1, 2022 Release, Pin Modes, p.32; the same ladder is
    drawn on the equivalent-schematic figures, Parallax Propeller 2 (P2X8C4M64P) Datasheet
    2022/11/01, Equivalent Schematics for Each Unique I/O Pin Configuration, pp.27-32; and
    the datasheet feature list states it in one line, FEATURES, p.2"
  no_other_rungs: "Not documented: a drive rung, or a per-pin current or impedance figure, beyond these eight."

dir_and_out_rule:
  why_this_block_exists: |
    A drive-strength selection is a property of driving, so it is live only while the
    pin drives. Configuring a drive strength and then leaving DIR low gives a plain
    high-impedance input with the selection inactive.
  dir: "direction bit; 0: input (float), 1: output (drive)"
  dir_exception: "DAC modes use DIR as 0: disable, 1: enable"
  out: "output latch bit; 0: low, 1: high."
  out_exception: "DAC modes use OUT as 0: disable, 1: enable"
  oe: "digital output enable (when DIR bit high)"
  smart_pin_mode_off: "for smart pin mode off (%SSSSS = %00000): DIR enables output"
  tt_field_reference: "architecture/smart_pins.yaml
    (configuration_format.fields.tt.behavior_by_context) -- %TT does not have one
    meaning; which of the four meaning-sets applies depends on whether the smart pin is
    on and whether DAC_MODE is active"
  source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Pin Modes (Pin Mode
    Legend), p.24; identical in the Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022
    Release, Pin Modes, p.32; Parallax Propeller 2 Documentation v35 (Rev B/C silicon),
    SMART PINS (%TT: pin DIR/OUT control)"

idioms:
  note: |
    %M..M selects drive strength. The field's letters are C, I, O, HHH and LLL; none
    is a bias-resistor selector. Driving weakly in one direction holds a line weakly high
    or low, and the drive is live only while DIR is high.

    Each constant is defined individually; the two compositions below are the weak-high
    and weak-low forms.
  source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Pin Modes (Pin Mode Legend),
    p.24, for the field semantics and the drive ladder, and the Parallax Propeller 2 Spin2
    Language Documentation v55, Built-In Symbols for Smart Pin Configuration, for each
    constant's wording. EF-063 and EF-064 (real P2, 2026-08-20) show that a 15 kOhm drive
    with DIR high holds a net and that anything stronger overpowers it; they were taken as
    rig apparatus for other checks (a jumper-continuity check and streamer pin placement),
    not as a drive-strength finding; see open_question_drive_strength below."

  weak_high:
    intent: "hold a line high weakly, so a stronger external drive can overpower it"
    mode_word: "P_HIGH_15K"
    dir: "1 -- required; with DIR = 0 the pin floats and the drive is inactive"
    out: "1 -- the output latch selects the high side"
    drive_high: "%010 = 15 kΩ (M[5:3])"
    drive_low: "%000 = Fast (M[2:0], the default) -- reached only if OUT goes to 0"
    spin2: |
      pinclear(pin)                 ' clear any previous smart-pin configuration
      wrpin(pin, P_HIGH_15K)        ' high side drives through 15 kOhm
      pinhigh(pin)                  ' DIR = 1, OUT = 1 -- without this the pin floats
      waitms(1)                     ' settle: a weak drive into pin and wire capacitance
      level := pinread(pin)         ' reads 1 unless something stronger holds the line low
    source: "Hardware-verified. EF-063 certifies a jumper digitally by holding the net
      through a 15 kOhm drive at one pin while the other drives it hard, so an open
      circuit reads the opposite value instead of an undefined float. The code above
      is the rig routine that did it -- weak_read(), called with P_HIGH_15K. Date/rig
      2026-08-20, real P2."

  weak_low:
    intent: "hold a line low weakly, so an undriven pin reads 0 for a stated reason"
    mode_word: "P_LOW_15K"
    dir: "1 -- required; with DIR = 0 the pin floats and the drive is inactive"
    out: "0 -- the output latch selects the low side"
    drive_low: "%010 = 15 kΩ (M[2:0])"
    drive_high: "%000 = Fast (M[5:3], the default) -- reached only if OUT goes to 1"
    spin2: |
      pinclear(pin)                 ' clear any previous smart-pin configuration
      wrpin(pin, P_LOW_15K)         ' low side drives through 15 kOhm
      pinlow(pin)                   ' DIR = 1, OUT = 0 -- without this the pin floats
      waitms(1)                     ' settle: a weak drive into pin and wire capacitance
      level := pinread(pin)         ' reads 0 unless something stronger holds the line high
    source: "Hardware-verified. EF-064 held P8..P31 at a 15 kOhm low with DIR high as a
      canvas, so an undriven pin reads 0 for a stated reason instead of floating, while
      any driven pin overpowers the pull and reads 1. The code above is the same rig
      routine, called with P_LOW_15K. Date/rig 2026-08-20, real P2."

  open_question_drive_strength:
    status: "open -- documentary only"
    note: "P_HIGH_* and P_LOW_* select drive strength. Not documented: a bias resistor (pull-up or pull-down) on the pin. Not documented: the current a hard-driven opposing pin sinks from a pin set P_HIGH_15K with DIR high."
    source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Pin Modes (Pin Mode Legend), p.24 and Parallax Propeller 2 Spin2 Language Documentation v55, Built-In Symbols for Smart Pin Configuration (the drive selections); EF-063 and EF-064 touched the mechanism only as rig apparatus for other checks, not as a dedicated drive-strength verification"

not_documented_here:
    open_drain: "Not documented: an open-drain composition of the pin-mode field"
    open_source: "Not documented: an open-source composition of the pin-mode field"
    keeper_or_bus_hold: "Not documented: a keeper or bus hold"
    per_pin_current_or_impedance: "Not documented: a per-pin current or impedance figure beyond the eight ladder rungs"

