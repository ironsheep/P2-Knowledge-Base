# Pin Drive Configuration - the WRPIN %M..M field
# Single definition home for the 13-bit low-level pin-control field: its sub-fields,
# the drive ladder stated by encoding, and the DIR/OUT rule that governs when a
# drive setting is active.
#
# Not a definition home for any constant. Per-constant definitions live in
# language/spin2/symbols/spin2-builtin-symbols-complete.yaml. This file names a
# constant only as a value or in prose, never as a defining key, so there is exactly
# one place in the knowledge base where a P_* name is defined.

component: Pin_Drive_Configuration
category: io_system
version: "1.0"
