oneliner: "Force 1's rule is one OWNER per bus; the DAT singleton is just its cheapest encoding at bus-count=1. For N identical shared buses, re-encode: A indexed broker (default), C externalized ^struct context, B method-pointer injection, or D compile-time image fork."
