oneliner: "One serialized bus shared by many COGS is owned by a resident broker cog with a private per-cog mailbox slot (base + cogid()*N) — the owning cog is the mutex, because the P2 has no cog-independent DMA. The many-cogs counterpart to the DAT singleton and to shared-bus replication."
