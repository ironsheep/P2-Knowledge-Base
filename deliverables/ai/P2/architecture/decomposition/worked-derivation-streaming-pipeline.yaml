concept: worked_derivation_streaming_pipeline
title: "Worked Derivation (EXAMPLE) — A Fast-ADC Streaming Pipeline, End to End"
category: decomposition_reasoning

summary: |
  A second narrated decomposition — the DATA-PLANE / streaming counterpart to the robot dog.
  Where the robot dog is a control-plane machine (mailbox words, modest hub traffic), this one is
  bulk, rate-defined frames moving through a hub frame pool and out via the streamer. It exists to
  prove the layer is a GRAMMAR, not a catalogue: walking the same first-contact procedure on a
  streaming machine yields a defensibly DIFFERENT object set (a buffered fan-out, not cooperative
  tasks-in-a-cog), and surfaces the three things the robot dog cannot — the data plane as the
  dominant plane, a producer pinned to a cog by determinism, and hub bandwidth as the binding budget.

  EVERYTHING here is EXAMPLE / illustrative-not-normative, frozen at one point in time and describing
  one machine; a different streaming mix (audio I2S, camera DVP, logic capture) yields a different,
  equally sound result. Objects are named by ROLE, not by file or product. Read it to see the data
  plane and the streamer drive the cut; never copy an object boundary into another machine.

illustrative_not_normative: true
authority_tier: EXAMPLE

reading_contract:
  authority_tier: EXAMPLE
  body: |
    This entire entry is an illustration of the streaming / data-plane domain. The forces, the
    procedure, and the evaluation vocabulary are the normative content of the layer; this derivation
    merely exercises them. If you find yourself copying an object boundary from here into a different
    machine, stop and run the procedure against THAT machine's wiring instead.

the_machine:
  authority_tier: EXAMPLE
  body: |
    The hardware mix (the only input the derivation starts from):
    - A fast-ADC capture front-end: an 8x8 sensor tile read through a hardware multiplexer and one
      serial ADC over a few-wire interface; the 64 sensors are stepped by a mux counter and read in
      a strict serpentine sequence, each sample with a settle+convert deadline. Capture sustains a
      few hundred fps (capable of ~1370 fps).
    - A PSRAM bus holding the display framebuffer, electrically shared by more than one cog.
    - An HDMI/TMDS display output (the pixel clock is generated by the streamer).
    - An OLED panel over SPI (~17 ms blocking transfer per frame; panel max ~55 fps).
    - A UART host link (a small single-character command set).
    - A future DSP consumer (CORDIC-based) that wants EVERY frame at full rate.
    Nothing about the object set is given; it is derived below.

derivation_steps:
  authority_tier: EXAMPLE
  steps:
    - step: 1
      name: "Enumerate the wires"
      force: "Force 1 (resource ownership)"
      reasoning: "List the serialized, stateful resources: (a) the tile acquisition interface (mux counter + ADC SPI + analog out) — one timing-exact serial sequence; (b) the PSRAM bus; (c) the HDMI TMDS pins; (d) the OLED SPI bus; (e) the UART. These are the things that can be in exactly one state at a time."
      output: "Five serialized resources."
    - step: 2
      name: "Triage against the smart pins (and the streamer)"
      force: "the physical axis (smart-pin / streamer absorption)"
      reasoning: "HDMI pixel generation is STREAMER-absorbed — each cog owns a streamer (a per-cog resource), so a streamed output is hardware-paced by its cog, not bit-banged. UART maps to a smart-pin async-serial mode. OLED SPI maps to a smart-pin sync-serial mode -> CANDIDATE, deferred (chosen as inline-PASM streaming for the 17 ms blocking budget, with the smart-pin path recorded as the re-evaluation trigger). The tile acquisition SEQUENCE (step mux -> settle -> convert -> shift-in, x64 serpentine) is a multi-step stateful protocol no single smart-pin mode covers -> it survives triage and needs a deterministic software owner."
      output: "HDMI -> streamer; UART -> smart-pin; OLED SPI -> smart-pin (deferred); the acquisition sequence remains for cog ownership."
    - step: 3
      name: "Assign owners"
      force: "Force 1 (resource ownership)"
      reasoning: "Group by wire + timing budget. Tile front-end: sole device on its bus behind a hard per-sample deadline ('any interruption corrupts a sample') -> ONE owning cog, VAR-instance transport (nothing shares the wire). [PHYSICS-grade cut: determinism, not bus contention.] PSRAM bus: shared by the renderer (writes) and the signal generator (reads) -> a RESIDENT BROKER cog owns it, arbitrating via per-cog mailbox slots. [PHYSICS] The P2 has no cog-independent DMA engine (the streamer and FIFO are per-cog), [PRINCIPLE] so a bus shared ACROSS cogs needs an always-resident arbiter cog (see p2kbArchSharedBusBroker). HDMI TMDS: a streamer is a per-cog resource bound to its cog and a single streamed output can't be split across cogs; its pixel clock cannot be perturbed -> its own cog. [HARD] OLED SPI: ~17 ms blocking per frame -> its own cog, so the blocking paces nothing else. Composition root -> cog 0. DSP (CORDIC) and host comms -> two reserved cogs."
      output: "Cog map: {0 app, 1 sensor, 2 PSRAM broker, 3 HDMI-signal, 4 HDMI-render, 5 OLED; 6 reserved DSP, 7 reserved comms} — 6 used, 2 reserved."
    - step: 4
      name: "List the cadences"
      force: "Force 3 (rate adaptation)"
      reasoning: "SensorAcquirer ~333-375 fps; HDMI content ~62.5 fps (panel 60 Hz); OLED ~53.6 fps (panel ~55 fps max); future DSP EVERY frame. The mismatch is the domain's whole point: one fast producer, several slower consumers at DIFFERENT rates, plus one full-rate consumer."
      output: "A rate-domain boundary at the producer->display fan-out; three distinct downstream cadences; one full-rate path."
    - step: 5
      name: "Resolve rate conflicts"
      force: "the Force 1 x Force 3 tension (the dual of the robot dog's)"
      reasoning: "Here the cadences live on DIFFERENT consumer cogs, not on one shared bus, so the robot dog's resolution (cooperative tasks within one owning cog) DOES NOT apply. The streaming resolution is a BUFFERED FAN-OUT: a hub frame pool feeding per-consumer typed FIFOs, each decimated to its consumer's rate (1-in-6 HDMI, 1-in-7 OLED, full-rate DSP). The rate adapter corresponds to no chip and no feature — it fell out of the rate MISMATCH."
      output: "A shared frame pool + typed FIFOs + per-FIFO decimation as the rate-domain decoupler."
    - step: 6
      name: "Draw the seams"
      force: "Force 2 (data-flow contract), per plane"
      reasoning: "The fan-out seam decomposes into three planes. DATA plane: 128-byte frames move producer -> consumers through a hub frame pool with typed ring FIFOs; bulk movement, not mailbox words (contract: fan-out publication; refcount vs copy — shipped copy-and-commit). CONTROL plane: getNextFrame / commitFrame / releaseFrame, single-writer-per-slot, frame pointer bounds-checked before the lock; one lock guards pool+queue. EVENT plane: the wake path (COGATN/WAITATN, 2-clock, zero hub bandwidth) is built ONCE in the FIFO manager and is OPT-IN PER CONSUMER via registration — an unregistered consumer is simply never signaled (no wasted COGATN). In the shipped machine only the HDMI consumer registered and is event-woken; the OLED consumer polls (un-migrated) and the cog-0 sensor consumer polls by arguable design (its cog also services host UART/UI, so a blocking WAITATN would make it deaf to host input). The renderer -> PSRAM -> signal-generator path is a SEPARATE control-plane seam (broker mailboxes)."
      output: "Per-seam, per-plane contracts; the EVENT wake as an opt-in-per-seam mechanism, partially adopted."
    - step: 7
      name: "Layer each branch"
      force: "Force 4 (altitude / axis of change)"
      reasoning: "Sensor branch by unit conversion: raw 14-bit counts (transport) -> mux-index -> sensor-index serpentine remap + calibration 'raw - baseline[i] + mid' (semantic) -> bipolar color (policy/visualization). Calibration is a MODE of the acquirer, not a tier (baseline table and raw samples live in the same cog; separating would force cross-cog data sharing). Force-4 memory-escape, exercised in the field: the acquirer FOLDS transport + chip-read + calibration into one inline-PASM loop on the 496-register cog — a stated tier collapse that saved ~800 us/frame; the collapse is documented, so the lost seam is a deliberate trade."
      output: "Layered stacks, with one recorded tier collapse."
    - step: 8
      name: "Place the cross-cutting objects"
      force: "cross-cutting c1-c5"
      reasoning: "c1 safety: lighter than the robot dog (no actuators) — per-cog stack-overflow sentinels. c2 translation: the single-character command set is an external vocabulary -> a command parser at the edge. c3 config: per-tile calibration baselines + the serpentine topology map (per-board data) isolated from logic. c4 testability: per-layer bring-up (mux scan -> ADC read -> topology remap -> colorize -> display), each runnable alone; the FIFO regression test. c5 lifecycle: the Application as sequencer — PSRAM/HDMI bring-up before renderers, cog launch order, pre-seeded stacks. Observability is judged as a separate concern (see the observability lens in p2kbArchEvaluationVocabulary): the decimation stage was kept VISIBLE in Spin2 rather than folded into commit precisely so its per-FIFO decision can be watched in debug()."
      output: "Cross-cutting objects placed relative to the tree; observability noted as an evaluation concern, not a structural force."
    - step: 9
      name: "Reconcile against budget and deadline"
      force: "the force tensions + the resource budget"
      reasoning: "The binding line is HUB BANDWIDTH, which the robot dog never reached. The hardest deadlines — the HDMI pixel clock and the per-sample ADC settle — are each isolated on a dedicated cog so nothing perturbs them. The design FITS; deferred items (refcount fan-out, smart-pin OLED SPI, DSP/comms cogs) are NAMED, not forgotten."
      output: "The final object-and-cog set, validated against the lattice and the two hardest deadlines."

resource_budget:
  authority_tier: EXAMPLE
  body: |
    The budget artifact, filled as steps 3-5 assigned owners (illustrative):
    - Cogs (limit 8): 6 used, 2 reserved — each used cog has a one-sentence forcing reason.
    - Smart pins (limit 64): tile front-end + OLED SPI + HDMI TMDS + UART; OLED SPI is a deferred
      smart-pin-absorption candidate.
    - Locks (limit 16): 1 (frame pool + queue) — the plan wanted 2; simplified in the field.
    - CORDIC (1 shared solver): reserved for the DSP cog; not yet contended.
    - Hub bandwidth (egg-beater 8-clock rotation): THE BINDING CONSTRAINT — frame-pool traffic
      + framebuffer pixels carried by the streamer (not mailbox words, which avoids hub saturation)
      + PSRAM traffic; copy-and-commit adds 2 x 128 B/frame of pool pressure.
    - Cog RAM (512 longs / 496 regs): the acquirer folds 3 tiers into inline PASM (the step-7 escape).

what_to_notice:
  authority_tier: EXAMPLE
  body: |
    The streaming-domain analogues of the robot dog's three:
    1. The producer is pinned to a cog by DETERMINISM (sample integrity), not by bus ownership — the
       streaming form of Force 1 the robot dog's lazy buses never show.
    2. The rate adapter is a BUFFERED FAN-OUT (pool + typed FIFOs + decimation), NOT
       cooperative-tasks-in-a-cog, because the cadences live on different consumer cogs. The
       robot-dog resolution does not transfer; the grammar produces a different, equally sound
       adapter. This is the single clearest proof the layer is a grammar, not a catalogue.
    3. HUB BANDWIDTH is the binding budget line (the robot dog's was cogs). The streamer carries bulk
       pixels and the frame pool carries bulk samples; the copy-vs-refcount choice is a
       bandwidth/pool-pressure trade visible ONLY in this domain.
    4. The one dynamic connascence crossing a cog boundary is the FIFO's execution-order
       requirement (commit/publish ordering), tamed by commit discipline exactly as the evaluation
       vocabulary prescribes. Separately, the EVENT wake is built once but adopted by only one of
       three consumers — a clean illustration of opt-in-per-seam signaling and incremental migration
       (the kind of built-vs-adopted gap an as-built audit surfaces).

