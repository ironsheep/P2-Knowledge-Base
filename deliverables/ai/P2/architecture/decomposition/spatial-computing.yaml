oneliner: "The P2 is a coarse-grained spatial fabric (8 cogs + 64 smart pins); assign function to space, pipeline, push to the edge, keep the interconnect latency-insensitive — and watch for the funnel, hub saturation, timing-coupled cogs, poll/signal inversion, bit-banging, and over-locking."
