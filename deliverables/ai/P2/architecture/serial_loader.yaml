# Serial Loader - Auto-baud ASCII Boot Protocol
# Source: Silicon Doc v35, P2 Datasheet

component: Serial_Loader
category: boot_system
description: |
  Plain ASCII text-based serial boot loader with auto-baud detection supporting
  9600 to 2 Mbaud. Provides terminal-friendly protocol for loading code and
  configuring the P2 chip via serial connection.

boot_sequence:
  source: "P2 Hardware Manual -- Boot Pattern table :269-282, Download Propeller Application :1592-1595, Prop_Hex checksum response :1666 -- engineering/ingestion/sources/p2-hardware-manual/p2-hardware-manual-text.txt"
  see_pattern_table: architecture/boot-rom/boot-pattern-selection.yaml

  serial_triggered_when:
    - "P61=float, P60=float, P59=float -- Program from serial within 60 s window."
    - "P61=any, P60=any, P59=pull-up -- Program from serial within 60 s window; no flash or microSD card boot."
    - "P61=pull-up, P60=any, P59=float -- Program from serial within 100 ms or boot from flash."
    - "As the 60 s fallback window after a failed flash boot (P61=pull-up, P59=float) or a failed microSD boot (P60=pull-up, P59=float)."

  serial_pins:
    p63: "Serial in -- 'the Propeller 2 can be loaded via asynchronous serial stream into P63'"
    p62: "Serial out -- \"The loader's response messages are sent back serially over P62 at the same baud rate that the sender used.\" P62 is normally driven continuously during the serial protocol, but will go into open-drain mode when either the INA or INB mask of a command is non-0 (for multiprogramming)."

  line_format: "8 data bits, no parity, 1 stop bit, 9,600 to 2,000,000 baud. The signal should be inverted; start bit is low, stop bit is high, and data bits are high for 0 and low for 1."

  timing:
    loader_active: "Unless forbidden by the Boot Pattern or preempted by a program in an SPI memory chip, the serial loader becomes active within 15ms of reset being released."
    short_window: "100 ms -- the serial window that precedes a flash boot attempt."
    long_window: "60 s -- the serial-primary window, and the fallback window after a failed flash or microSD boot."

  execution:
    target: "On a valid checksum \"the booter will perform a COGINIT #0,#0 instruction to relaunch cog 0 (currently running the loader program) with the new program starting at $00000.  When invalid, the booter will wait for another command.\""
    rom_listing_confirmation: "engineering/ingestion/sources/rom-booter/ROM_Booter.lst:750-752 -- serial_done calls reset_pins, then 'if_z jmp #0' -- 'if SPI program, run it, else shut down'."

auto_baud_detection:
  mechanism: "Measures bit timing from CR character"
  trigger: "'> ' followed by space (0x3E, 0x20)"
  
  supported_rates:
    minimum: "9600 baud"
    maximum: "2 Mbaud"
    common: [9600, 19200, 38400, 57600, 115200, 230400, 460800, 921600, 1000000, 2000000]
    
  detection_sequence:
    1: "Send '> ' prompt"
    2: "Wait for CR (0x0D) or '>' character"
    3: "Measure bit timing"
    4: "Calculate baud divisor"
    5: "Configure UART"

protocol_commands:
  prop_chk:
    syntax: "Prop_Chk"
    response: "'Prop_Ver Au' (version A silicon)"
    purpose: "Validate communication"
    encoding: "Plain ASCII"
    
  prop_clk:
    syntax: "Prop_Clk P1 P2 P3"
    parameters:
      p1: "0=RCFAST, 1=RCSLOW, 2=XI/crystal"
      p2: "Multiply factor (crystal mode)"
      p3: "Divider (crystal mode)"
    purpose: "Configure system clock"
    example: "Prop_Clk 2 8 1 (crystal * 8 / 1)"
    
  prop_hex:
    syntax: "Prop_Hex <INAmask> <INAdata> <INBmask> <INBdata> <hexdatabytes> ~ | ?"
    format: "whitespace-separated raw hex bytes (NOT Intel HEX)"
    purpose: "Load byte data into hub starting at $00000, then execute"
    terminator: "~ executes unconditionally; ? validates an embedded checksum first"
    data_format: |
      Raw hex byte values separated by whitespace.
      Only the bottom 8 bits of each hex value are used as data.
      No record structure, no address fields, no per-record checksums.
    embedded_checksum: |
      Optional: append a long-aligned checksum long computed as
      $706F7250 ('Prop') minus the sum of all data longs.
      Loader sends '.' for correct checksum, '!' for incorrect.
    example: "Prop_Hex 0 0 0 0 FB F7 23 F6 FD FB 23 F6 25 26 80 FF 1F 80 66 FD F0 FF 9F FD ~"
    
  prop_txt:
    syntax: "Prop_Txt ~"
    format: "Base64 encoded binary"
    purpose: "Load binary data efficiently"
    terminator: "~ character"
    
    encoding:
      alphabet: "RFC 4648 standard Base64"
      efficiency: "~75% vs 44% for hex"
      padding: "= padding as needed"
      
    features:
      - "Terminal-safe characters only"
      - "More efficient than hex"
      - "Supports whitespace"

response_codes:
  dot: "'.' - Processing/success"
  question: "'?' - Error/invalid"
  prompt: "'> ' - Ready for command"

loading_process:
  command_reception:
    1: "Wait for command at prompt"
    2: "Echo characters as received"
    3: "Process on CR (0x0D)"
    
  data_reception:
    hex_mode:
      - "Receive whitespace-separated raw hex bytes"
      - "Write each byte to hub memory sequentially from $00000"
      - "Stop on '~' (run) or '?' (validate embedded checksum, then run or abort)"
      - "Optional: validate an embedded checksum long if terminated with '?'"
      
    base64_mode:
      - "Decode Base64 stream"
      - "Write to hub memory"
      - "Stop on '~' character"
      
  execution:
    checksum: "Validate 'Prop' marker and checksum"
    start_address: "$00000 in hub"
    cog_start: "COG 0 loads and executes"

multi_chip_support:
  ina_masking:
    description: "Use INA pattern to select specific chip"
    pins: "P31-P0 state must match"
    
  inb_masking:
    description: "Use INB pattern to select specific chip"
    pins: "P63-P32 state must match"
    
  broadcast:
    description: "No masking loads all chips"

programming_examples:
  basic_loader_session: |
    > Prop_Chk
    Prop_Ver Au
    .
    > Prop_Hex 0 0 0 0 FB F7 23 F6 FD FB 23 F6 25 26 80 FF 1F 80 66 FD F0 FF 9F FD ~
    .
    (chip executes)
    
  base64_loading: |
    > Prop_Txt ~
    UHJvcAQAAAACAAAA...
    ...base64 data...
    ~
    .
    (chip executes)
    
  clock_configuration: |
    > Prop_Clk 2 16 1
    .
    (now running at crystal * 16)

error_handling:
  invalid_command: "Returns '?'"
  checksum_error: "Returns '?' and aborts"
  timeout: "Returns to boot sequence"
  
  recovery:
    - "Send CR to get new prompt"
    - "Reset chip to restart"
    - "Check baud rate"

terminal_software:
  requirements:
    - "ASCII terminal mode"
    - "No flow control"
    - "8N1 format (8 bits, no parity, 1 stop)"
    - "CR line endings"
    
  compatible_software:
    - "PuTTY"
    - "Tera Term"
    - "minicom"
    - "screen"
    - "loadp2 utility"

validation_format:
  header_structure:
    offset_0: "'Prop' marker (4 bytes)"
    offset_4: "Checksum (4 bytes)"
    offset_8: "Data length (4 bytes)"
    
  checksum_calculation:
    algorithm: "Sum all longs, negate"
    validation: "Sum of all longs = 0"

special_features:
  debug_friendly: "Plain text protocol"
  human_readable: "Can type commands manually"
  error_recovery: "Non-destructive errors"
  clock_switching: "Can change frequency before loading"

security_considerations:
  no_authentication: "No password protection"
  physical_access: "Requires serial connection"
  disable_option: "Don't pull up P61"

performance:
  hex_loading: "~44% efficiency"
  base64_loading: "~75% efficiency"
  max_speed: "2 Mbaud = ~200KB/second"
  typical_load_time: "< 3 seconds for 512KB"

related_components:
  boot_rom: "Contains serial loader code"
  smart_pins: "Used for UART communication"
  hub_memory: "Destination for loaded code"
  clock_system: "Can be configured via loader"

see_also:
  - "Boot ROM source code"
  - "loadp2 utility documentation"
  - "Base64 encoding RFC 4648"

related:
  - architecture/boot-rom/_index.yaml
  - architecture/boot-rom/boot-pattern-selection.yaml
  - architecture/boot-rom/spi-flash-boot.yaml
  - architecture/boot-rom/sd-card-boot.yaml
  - architecture/boot-rom/boot-rom-contents.yaml
  - architecture/boot-rom/p2-monitor.yaml
  - architecture/boot-rom/taqoz-forth.yaml