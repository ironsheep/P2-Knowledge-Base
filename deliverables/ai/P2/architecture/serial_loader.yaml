# Serial Loader - Auto-baud ASCII Boot Protocol
# Source: Silicon Doc v35, P2 Datasheet

component: Serial_Loader
category: boot_system
description: |
  Plain ASCII text-based serial boot loader with auto-baud detection supporting
  9600 to 2 Mbaud. Provides terminal-friendly protocol for loading code and
  configuring the P2 chip via serial connection.

boot_sequence:
  source: "P2 Hardware Manual -- Boot Pattern table :269-282, Download Propeller Application :1592-1595, Prop_Hex checksum response :1666 -- engineering/ingestion/sources/p2-hardware-manual/p2-hardware-manual-text.txt; rom_listing_confirmation: Prop2 silicon ROM booter listing, engineering/ingestion/sources/rom-booter/rom_booter_v33_01j.lst:758-760"
  see_pattern_table: architecture/boot-rom/boot-pattern-selection.yaml

  serial_triggered_when:
    - "P61=float, P60=float, P59=float -- Program from serial within 60 s window."
    - "P61=any, P60=any, P59=pull-up -- Program from serial within 60 s window; no flash or microSD card boot."
    - "P61=pull-up, P60=any, P59=float -- Program from serial within 100 ms or boot from flash."
    - "As the 60 s fallback window after a failed flash boot (P61=pull-up, P59=float) or a failed microSD boot (P60=pull-up, P59=float)."

  serial_pins:
    p63: "Serial in -- 'the Propeller 2 can be loaded via asynchronous serial stream into P63'"
    p62: "Serial out -- \"The loader's response messages are sent back serially over P62 at the same baud rate that the sender used.\" P62 is normally driven continuously during the serial protocol, but will go into open-drain mode when either the INA or INB mask of a command is non-0 (for multiprogramming)."

  line_format: "8 data bits, no parity, 1 stop bit, 9,600 to 2,000,000 baud. The signal should be inverted; start bit is low, stop bit is high, and data bits are high for 0 and low for 1."

  timing:
    loader_active: "Unless forbidden by the Boot Pattern or preempted by a program in an SPI memory chip, the serial loader becomes active within 15ms of reset being released."
    short_window: "100 ms -- the serial window that precedes a flash boot attempt."
    long_window: "60 s -- the serial-primary window, and the fallback window after a failed flash or microSD boot."

  execution:
    target: "On a valid checksum \"the booter will perform a COGINIT #0,#0 instruction to relaunch cog 0 (currently running the loader program) with the new program starting at $00000.  When invalid, the booter will wait for another command.\""
    rom_listing_confirmation: "serial_done calls reset_pins, then 'if_z jmp #0' -- 'if SPI program, run it, else shut down'."

auto_baud_detection:
  mechanism: "The loader automatically adapts to the sender's baud rate from every greater-than '>' character ($3E) it receives."
  initial_sequence: "The sender must send '> ' (greater-than, space; $3E, $20) before the first command, and then use '>' characters periodically throughout the data to keep the baud rate tightly calibrated to the internal RC oscillator the loader uses during the boot process. Received '>' characters are not passed to the command parser, so they can be placed anywhere."

  supported_rates:
    minimum: "9600 baud"
    maximum: "2 Mbaud"
    common: [9600, 19200, 38400, 57600, 115200, 230400, 460800, 921600, 1000000, 2000000]

protocol_commands:
  whitespace: "Whitespace is required between command keywords and data. TAB ($09), LF ($0A), CR ($0D), SPACE ($20) and '=' ($3D, Base64 padding), singly or in any contiguous combination, constitute a single whitespace."
  chip_identifier: "Each command keyword is followed by four 32-bit hex values <INAmask> <INAdata> <INBmask> <INBdata>; the normal case is zeros for each, which talks to any and all connected chips."

  prop_chk:
    syntax: "Prop_Chk <INAmask> <INAdata> <INBmask> <INBdata>"
    response: "CR+LF+\"Prop_Ver\"+SPACE+<version_character>+CR+LF, where <version_character> is \"A\"..\"Z\" and indicates the version of Propeller 2. The Rev B/C silicon responds with \"G\" (A-F were FPGA builds)."
    purpose: "Verify the Propeller 2 connection and retrieve its version"
    exchange: "Sender: \"> Prop_Chk 0 0 0 0\"+CR / Loader: CR+LF+\"Prop_Ver G\"+CR+LF"

  prop_clk:
    syntax: "Prop_Clk <INAmask> <INAdata> <INBmask> <INBdata> <HUBSETclocksetting>"
    parameters:
      hubset_clock_setting: "The HUBSET ##$0xxxxxxx clock configuration value, in hex (see the clock configuration page)"
    purpose: "Update the clock source, as if HUBSET ##$0xxxxxxx were executed"
    response: "A '.' immediately for a valid command; then the loader switches to the internal 20 MHz clock, sets the desired configuration (except mode), waits about 5 ms for the clock hardware to settle, and enables the desired clock mode. The sender should wait an additional 10 ms, then send '> ' to adjust the baud rate to the new clock configuration."
    example: "Set PLL to 148.5 MHz: Sender: \"> Prop_Clk 0 0 0 0 19D28F8\"+CR / Loader: \".\" / Sender: (wait about 10 ms) / Sender: \"> Prop_Clk 0 0 0 0 19D28FB\"+CR / Loader: \".\". Return to the boot clock: \"> Prop_Clk 0 0 0 0 F0\"+CR / Loader: \".\""
    note: "If an image is loaded after switching to a PLL clock mode different from the mode that image uses, the image may need to issue HUBSET #$F0 before switching to its clock mode; or use the same clock configuration as the image."

  prop_hex:
    syntax: "Prop_Hex <INAmask> <INAdata> <INBmask> <INBdata> <hexdatabytes> ~ | ?"
    format: "whitespace-separated raw hex bytes (NOT Intel HEX)"
    purpose: "Load byte data into hub starting at $00000, then execute"
    terminator: "~ executes unconditionally; ? validates an embedded checksum first"
    data_format: |
      Raw hex byte values separated by whitespace.
      Only the bottom 8 bits of each hex value are used as data.
      No record structure, no address fields, no per-record checksums.
    embedded_checksum: |
      Optional: include a checksum-complement long computed as $706F7250
      ('Prop' read as a little-endian long) minus the sum of all data longs. It
      may be placed anywhere in the data, as long as it is long-aligned.
      With a '?' terminator the loader sends '.' for a valid checksum (then runs
      the code) or '!' for an invalid one (then waits for another command).
    example: "Prop_Hex 0 0 0 0 FB F7 23 F6 FD FB 23 F6 25 26 80 FF 1F 80 66 FD F0 FF 9F FD ~"
    
  prop_txt:
    syntax: "Prop_Txt <INAmask> <INAdata> <INBmask> <INBdata> <base64chrs> ~ | ?"
    format: "Base64 encoded binary (A-Z, a-z, 0-9, +, /), six bits per character, assembled into bytes as received"
    purpose: "Like Prop_Hex, but delivers Base64 data; this format is 2.25x denser than hex"
    terminator: "~ runs the image without verification; ? verifies the checksum, responds, then runs it"

    encoding:
      padding: "'=' may be present as padding in Base64 data (it counts as whitespace)"
      byte_order: "The Base64 stream is generated from the assembled data in its given byte order, from MSB to LSB within each byte; the checksum is calculated on little-endian long values and must be appended to the data before Base64 conversion."

    features:
      - "Whitespace among Base64 characters is ignored"
      - "While waiting for a new command, Base64 data destined for another chip is ignored, because each command keyword contains an underscore, an illegal Base64 character"
    exchange: "Sender: \"> Prop_Txt 0 0 0 0 +/cj9v37I/YlJoD/H4Bm/fD/n/0 ~\" (the Prop_Hex example program); with the checksum complement appended and a '?' terminator: \"> Prop_Txt 0 0 0 0 +/cj9v37I/YlJoD/H4Bm/fD/n/0k2KCJ ?\" / Loader: \".\""

response_codes:
  dot: "'.' - a valid Prop_Clk command was accepted; or a Prop_Hex/Prop_Txt checksum was valid (when terminated with '?')"
  exclamation: "'!' - the checksum was invalid (Prop_Hex/Prop_Txt terminated with '?'); the loader waits for another command"
  sender_characters: "'?' and '~' are the sender's data terminators, and '> ' is the sender's auto-baud sequence; the loader does not send them"

loading_process:
  command_reception:
    1: "The sender sends '> ' ($3E, $20) first, so the loader can calibrate to its baud rate"
    2: "The sender sends a command keyword, the four-value chip identifier and any data"
    3: "A Prop_Hex or Prop_Txt command ends with '~' (run without verification) or '?' (verify, respond, then run if valid)"

  data_reception:
    hex_mode:
      - "Receive whitespace-separated raw hex bytes"
      - "Write each byte to hub memory sequentially from $00000"
      - "Stop on '~' (run) or '?' (validate embedded checksum, then run or abort)"
      - "Optional: validate an embedded checksum long if terminated with '?'"
      
    base64_mode:
      - "Decode Base64 stream"
      - "Write to hub memory"
      - "Stop on '~' character"
      
  execution:
    checksum: "Only with a '?' terminator: the embedded checksum-complement long is verified"
    start_address: "$00000 in hub"
    cog_start: "Cog 0 is relaunched (COGINIT #0,#0) to run the new program"

multi_chip_support:
  ina_masking:
    description: "Use INA pattern to select specific chip"
    pins: "P31-P0 state must match"
    
  inb_masking:
    description: "Use INB pattern to select specific chip"
    pins: "P63-P32 state must match"

  ina_limit: "INA[1:0] (P0 and P1) cannot be matched: the loader configures them as smart pins monitoring P63 for automatic baud detection, so all ID patterns are valid using pins P2 and beyond."

  broadcast:
    description: "No masking loads all chips"

programming_examples:
  basic_loader_session: |
    > Prop_Chk 0 0 0 0
    Prop_Ver G
    > Prop_Hex 0 0 0 0 FB F7 23 F6 FD FB 23 F6 25 26 80 FF 1F 80 66 FD F0 FF 9F FD ~
    (chip executes; a '~' terminator gives no response)

  base64_loading: |
    > Prop_Txt 0 0 0 0 +/cj9v37I/YlJoD/H4Bm/fD/n/0k2KCJ ?
    .
    (checksum valid: chip executes)

  clock_configuration: |
    > Prop_Clk 0 0 0 0 19D28F8
    .
    (wait about 10 ms)
    > Prop_Clk 0 0 0 0 19D28FB
    .
    (now running at 148.5 MHz from a 20 MHz crystal)

error_handling:
  unexpected_character: "A character that does not fit expectations for that moment (for example an 'x' where hex digits are expected) aborts the current command; the loader waits for a new command."
  checksum_error: "A '?'-terminated Prop_Hex or Prop_Txt with an invalid checksum is answered with '!' and the loader waits for another command."

terminal_software:
  requirements:
    - "ASCII terminal mode"
    - "No flow control"
    - "8N1 format (8 bits, no parity, 1 stop)"
    - "CR line endings"
    
  compatible_software:
    - "PuTTY"
    - "Tera Term"
    - "minicom"
    - "screen"
    - "loadp2 utility"

validation_format:
  checksum_calculation:
    algorithm: "Checksum complement = $706F7250 ('Prop' read as a little-endian long) minus the sum of all longs of the program image"
    placement: "The complement long may be anywhere in the data, as long as it is long-aligned"
    worked_sum: "A 5-long image summing to $E6CE9A2C has complement $706F7250 - $E6CE9A2C = $89A0D824, sent as the bytes 24 D8 A0 89"

special_features:
  debug_friendly: "Plain text protocol"
  human_readable: "Can type commands manually"
  error_recovery: "Non-destructive errors"
  clock_switching: "Can change frequency before loading"

security_considerations:
  no_authentication: "No password protection"
  physical_access: "Requires serial connection"

related_components:
  boot_rom: "Contains serial loader code"
  smart_pins: "Used for UART communication"
  hub_memory: "Destination for loaded code"
  clock_system: "Can be configured via loader"

see_also:
  - "Boot ROM source code"
  - "loadp2 utility documentation"
  - "Base64 encoding RFC 4648"

related:
  - architecture/boot-rom/_index.yaml
  - architecture/boot-rom/boot-pattern-selection.yaml
  - architecture/boot-rom/spi-flash-boot.yaml
  - architecture/boot-rom/sd-card-boot.yaml
  - architecture/boot-rom/boot-rom-contents.yaml
  - architecture/boot-rom/p2-monitor.yaml
  - architecture/boot-rom/taqoz-forth.yaml