# P2 Debug Interrupt System
# Sources:
#   Propeller 2 Documentation v35 (Rev B/C Silicon), section DEBUG INTERRUPT --
#     engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:2393-2593
#     (enable + per-cog scope :2395-2397; upper-hub buffer :2399;
#      $1F8..$1FF ROM routines :2401-2421; IJMP0/IRET0 remap :2423-2439;
#      per-cog save/restore map, table 25 :2446-2477; RETI0/RESI0 :2482;
#      BRK D format :2489-2517; COGBRK :2520-2524; GETBRK :2527-2596)
#   Instruction encodings, same document, PASM2 encoding table --
#     silicon-doc-text.txt:5337 (GETBRK), :5338 (COGBRK), :5339 (BRK)
#   P2X8C4M64P Datasheet 2022/11/01 -- the datasheet has no debug-interrupt
#     section; it names the mechanism in the feature list at
#     engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:74, notes the
#     INA/INB remap at :542, and carries BRK/COGBRK/GETBRK in the PASM2 table at
#     :1938-1944

component_name: "Debug Interrupt"

component_type: "hardware_debug_controller"

description: |
  The P2 debug interrupt system provides hardware debugging capabilities with single-stepping,
  breakpoints, and interrupt-on-instruction features. It operates at the highest interrupt 
  priority, allowing it to interrupt any code including other interrupt service routines.
  The debug interrupt enables powerful debugging without external hardware debuggers.

architecture:
  priority: "Highest (above INT1/2/3)"
  
  enable: >-
    Debug interrupts are enabled per cog via HUBSET. A debug-enabled cog takes a debug
    interrupt on every (re)start from a COGINIT exercised upon it. Each debug ISR must set
    the trigger condition(s) for the NEXT debug interrupt with BRK before it exits; if it
    sets none, no further debug interrupts occur until the cog is restarted.
  
  trigger_modes:
    source: >-
      The complete set, taken from the BRK D-operand format --
      engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:2500-2512. There are
      exactly these conditions; each is one enable bit in BRK's D operand.
    modes:
    - mode: "breakpoint_address_match"
      bit: "%K"
      description: "Interrupt when execution reaches the 20-bit address in D[31:12]"
    
    - mode: "event_code_match"
      bit: "%J"
      description: "Interrupt on the 4-bit event code %eeee in D[15:12]"
    
    - mode: "asynchronous_breakpoint"
      bit: "%I"
      description: "Interrupt when another cog aims a COGBRK at this cog"
    
    - mode: "isr_entry"
      bit: "%H / %G / %F"
      description: "Interrupt on entry to the INT3 / INT2 / INT1 ISR"
    
    - mode: "brk_instruction"
      bit: "%E"
      description: "Interrupt when the debugged program executes a BRK instruction"
    
    - mode: "single_step"
      bit: "%D / %C / %B / %A"
      description: >-
        Interrupt on each instruction of INT3 ISR code / INT2 ISR code / INT1 ISR code /
        non-ISR code -- the four single-step scopes are enabled independently
  
  register_handling:
    description: >-
      There is no debug shadow register set. Two things happen instead. First, INA and
      INB -- normally read-only input registers -- become the readable/writable registers
      IJMP0 and IRET0 for the duration of the debug ISR, and IJMP0 is initialised to $1F8
      on COGINIT. Second, an execute-only ROM at cog registers $1F8..$1FF provides
      entry/exit routines that copy cog registers $000..$00F out to hub RAM and back.
      Nothing preserves PA, PB, PTRA, PTRB or any other register automatically.
    isr_entry_rom: "$1F8..$1FC -- saves $000..$00F to hub, loads the debugger, JMP #0"
    isr_exit_rom: "$1FD..$1FF -- restores $000..$00F from hub, then RETI0"
    hub_save_area: >-
      Registers $000..$00F are saved at ($FF800 + !CogNumber << 7) and the ISR image is
      loaded from ($FF840 + !CogNumber << 7). The last 16KB of hub RAM, also mapped at
      $FC000..$FFFFF, holds these buffers and the initial debug ISR code, and can be
      write-protected so that it is writable only from within a debug ISR.
    source: >-
      Propeller 2 Documentation v35 (Rev B/C), DEBUG INTERRUPT --
      engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:2399, :2401,
      :2411-2420, :2423-2439, and the per-cog address table at :2446-2477.

configuration:
  note: >-
    The debug interrupt has no configuration REGISTERS. It is configured by the D operand
    of a BRK instruction executed inside a debug ISR, and IJMP0/IRET0 (INA/INB remapped)
    hold its vectors. SKIP and SKIPF are ordinary PASM2 instructions with no debug role.
  brk_operand_format:
    source: >-
      Propeller 2 Documentation v35 (Rev B/C), DEBUG INTERRUPT > BRK D/# --
      engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:2498-2517.
    layout: "%aaaaaaaaaaaaaaaaeeee_LKJIHGFEDCBA"
    fields:
      - bits: "D[31:12]"
        name: "address_or_event"
        description: "20-bit breakpoint address, or a 4-bit event code %eeee in D[15:12]"
      - bits: "D[11]"
        name: "L"
        description: >-
          1 = map INA/INB normally so pin input states can be read; 0 = map IJMP0/IRET0
          at INA/INB (the default during a debug ISR). If set to 1, it MUST be reset to 0
          before the debug ISR exits, so that RETI0 can see IJMP0 and IRET0.
      - bits: "D[10]"
        name: "K"
        description: "1 = enable interrupt on breakpoint address match"
      - bits: "D[9]"
        name: "J"
        description: "1 = enable interrupt on event %eeee"
      - bits: "D[8]"
        name: "I"
        description: "1 = enable interrupt on asynchronous breakpoint (COGBRK from another cog)"
      - bits: "D[7:5]"
        name: "H / G / F"
        description: "1 = enable interrupt on INT3 / INT2 / INT1 ISR entry"
      - bits: "D[4]"
        name: "E"
        description: "1 = enable interrupt on the BRK instruction"
      - bits: "D[3:0]"
        name: "D / C / B / A"
        description: >-
          1 = enable single-step interrupt on INT3 ISR code / INT2 ISR code / INT1 ISR
          code / non-ISR code
    on_entry: >-
      Bits L through A are cleared to 0 on debug-ISR entry, so a BRK must be executed
      before exiting the ISR if another debug interrupt is wanted.

instructions:
  - instruction: "BRK"
    encoding: "EEEE 1101011 00L DDDDDDDDD 000110110"
    description: >-
      Two different jobs depending on where it runs. In normal code, BRK raises a debug
      interrupt carrying an 8-bit code. Inside a debug ISR, BRK establishes the next
      debug interrupt's trigger condition(s).
    source: >-
      Propeller 2 Documentation v35 (Rev B/C), DEBUG INTERRUPT > BRK D/# --
      engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:2489-2512; encoding
      at silicon-doc-text.txt:5339; P2 Datasheet 2022/11/01 PASM2 table --
      engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:1938-1939.
    operation: |
      In normal program execution:
        D/# = %BBBBBBBB, an 8-bit BRK code readable inside the debug ISR.
        The interrupt fires regardless of the instruction's execution condition,
        provided the BRK-instruction trigger was enabled by a prior debug ISR;
        the execution condition only gates the writing of the 8-bit code.
      Inside a debug ISR:
        D/# carries the next-interrupt condition word -- see
        configuration.brk_operand_format above.
    usage_example: |
      ' In the debugged program: raise a debug interrupt carrying code $2A
      BRK     #$2A
      ' Inside a debug ISR: break next at address $00100 (%K set, bit 10)
      BRK     ##($00100 << 12) | (1 << 10)
  
  - instruction: "COGBRK"
    encoding: "EEEE 1101011 00L DDDDDDDDD 000110101"
    description: "Trigger an asynchronous breakpoint in another cog"
    source: >-
      Propeller 2 Documentation v35 (Rev B/C), DEBUG INTERRUPT > COGBRK D/# --
      engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:2520-2524; encoding
      at silicon-doc-text.txt:5338; P2 Datasheet 2022/11/01 PASM2 table --
      engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:1942.
    operation: |
      D/# = %CCCC, the cog in which to trigger an asynchronous breakpoint.
      TWO preconditions, both required:
        - the cog EXECUTING COGBRK must itself be inside its own debug ISR, and
        - the TARGET cog must have its asynchronous-breakpoint interrupt enabled
          (BRK's %I bit, set from within that cog's own prior debug ISR).
    usage_example: |
      COGBRK  #2              ' From inside our debug ISR, break cog 2
  
  - instruction: "GETBRK"
    encoding: "EEEE 1101011 CZ0 DDDDDDDDD 000110101"
    description: >-
      Read cog status. GETBRK does NOT read back a break configuration -- the effect
      selector chooses which of three unrelated status words it returns.
    source: >-
      Propeller 2 Documentation v35 (Rev B/C), DEBUG INTERRUPT > GETBRK --
      engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:2527-2593; encoding
      at silicon-doc-text.txt:5337; P2 Datasheet 2022/11/01 PASM2 table --
      engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:1944.
    operation: |
      GETBRK D WCZ  -- cog internal status:
        C = 1 if STALLI mode, 0 if ALLOWI mode; Z = 1 if started in hubexec
        D[22] colorspace converter active, D[21] streamer active,
        D[20] WRFAST(1)/RDFAST(0), D[19:16]/[15:12]/[11:08] INT3/INT2/INT1
        selectors, D[07:06]/[05:04]/[03:02] INT3/INT2/INT1 state,
        D[01] STALLI mode, D[00] started in hubexec.
        Inside a debug ISR it additionally returns C = 1 if the debug interrupt
        came from a COGINIT, D[31:24] = the last BRK code, D[23] = COGINIT flag.
      GETBRK D WC   -- SKIP/SKIPF/EXECF/XBYTE state plus the 16 event-trap flags
        in D[15:00]; C = LSB of the skip pattern.
      GETBRK D WZ   -- the 32-bit SKIP/SKIPF/EXECF/XBYTE pattern;
        Z = 1 if no pattern is queued.
    flags_affected: "C and/or Z, per the form selected -- see above"
    usage_example: |
      GETBRK  status WCZ      ' Cog internal status; C = STALLI mode

debug_modes:
  - mode: "single_step"
    configuration: |
      ' Inside the debug ISR: enable single-step on non-ISR code (%A, bit 0)
      BRK     #%0000_0000_0001
    
    handler: |
      debug_isr
          ' Save any additional context
          WRLONG  INB, trace_ptr      ' INB is IRET0 here: the interrupted address
          ADD     trace_ptr, #4
          ' Optionally modify execution
          BRK     #%0000_0000_0001    ' Re-arm single-step: bits L..A are cleared on ISR entry
          RETI0               ' Continue execution
    
    use_cases:
      - "Instruction tracing"
      - "Register monitoring"
      - "Execution flow analysis"
  
  - mode: "address_breakpoint"
    configuration: |
      ' Inside the debug ISR: break at a 20-bit address (%K, bit 10)
      BRK     ##(break_addr << 12) | (1 << 10)
    
    handler: |
      debug_isr
          ' Hit breakpoint
          WRLONG  INB, break_log      ' INB is IRET0 here: the interrupted address
          ' Examine state
          RDLONG  value, watch_addr
          ' Re-arm the breakpoint: bits L..A are cleared on ISR entry
          BRK     ##(break_addr << 12) | (1 << 10)
          ' Continue or halt
          RETI0
    
    use_cases:
      - "Function entry/exit monitoring"
      - "Loop iteration counting"
      - "Conditional breakpoints"
  
  - mode: "brk_instruction_break"
    configuration: |
      ' Inside the debug ISR: break when the program executes BRK (%E, bit 4)
      BRK     #%0000_0001_0000
    
    handler: |
      debug_isr
          GETBRK  status WCZ           ' D[31:24] = the 8-bit code the BRK carried
          SHR     status, #24
          ' dispatch on the code
          BRK     #%0000_0001_0000     ' Re-arm the BRK trigger: bits L..A are cleared on ISR entry
          RETI0
    
    use_cases:
      - "Software-planted breakpoints carrying an 8-bit code"
      - "System call interception"
    note: >-
      There is no "break on a matching instruction pattern" trigger. The eight trigger
      conditions are exactly those in architecture.trigger_modes.

programming_patterns:
  - pattern: "execution_tracer"
    description: "Trace program execution to hub memory"
    code: |
      ' All of this runs INSIDE a debug ISR -- IJMP0/IRET0 exist only there,
      ' as INA/INB remapped, and BRK's condition bits are cleared on ISR entry.
              ' Redirecting IJMP0 skips the $1F8 ROM entry routine on later debug
              ' interrupts, which is what saves cog registers $000..$00F.
              MOV     INA, #trace_isr      ' INA is IJMP0 here: redirect subsequent debug ISRs
              MOV     trace_ptr, ##TRACE_BUFFER
              BRK     #%0000_0000_0001     ' Single-step non-ISR code (%A)

      trace_isr
              WRLONG  INB, trace_ptr       ' INB is IRET0 here: save the return PC
              ADD     trace_ptr, #4
              CMP     trace_ptr, ##TRACE_END WZ
      IF_Z    MOV     trace_ptr, ##TRACE_BUFFER ' Wrap
              BRK     #%0000_0000_0001     ' Re-arm single-step: bits L..A are cleared on ISR entry
              RETI0                        ' Continue
  
  - pattern: "conditional_breakpoint"
    description: "Break only when conditions are met"
    code: |
      ' Conditional breakpoint handler
      debug_isr
              RDLONG  value, watch_var     ' Check variable
              CMP     value, break_value WZ
      IF_NZ   RETI0                        ' Continue if no match
              
              ' Condition met - handle break
              COGID   pa                   ' Save COG ID
              WRLONG  pa, debug_cog
              WRLONG  value, debug_value
              ' Could halt here or continue
              ' No BRK is executed in this ISR, so no further debug interrupt occurs: bits
              ' L..A are cleared on ISR entry. Execute a BRK before exiting to arm the next one.
              RETI0

  - pattern: "profiler"
    description: "Profile code execution timing"
    code: |
      ' Instruction profiler
      profile_isr
              GETCT   current_time
              SUB     current_time, last_time
              ADD     total_time, current_time
              ADD     instruction_count, #1
              MOV     last_time, current_time
              ' No BRK is executed in this ISR, so no further debug interrupt occurs: bits
              ' L..A are cleared on ISR entry. Execute a BRK before exiting to arm the next one.
              RETI0

  - pattern: "remote_debugging"
    description: "Debug COG from another COG"
    code: |
      ' Debugger COG -- COGBRK is legal only from inside our OWN debug ISR,
      ' and the target must have its asynchronous-breakpoint bit (%I) enabled.
      debug_control
              COGBRK  #target_cog          ' Break target
              ' Wait for target to hit breakpoint
              WAITX   ##1000
              ' Read target's state from shared memory
              RDLONG  target_pc, debug_data
              
      ' Target COG debug handler
      target_debug_isr
              WRLONG  INB, debug_data      ' INB is IRET0 here: share the return PC
              WRLONG  some_var, debug_data+4
              ' Wait for debugger commands
              ' No BRK is executed in this ISR, so no further debug interrupt occurs: bits
              ' L..A are cleared on ISR entry. Execute a BRK before exiting to arm the next one.
              RETI0

debugging_capabilities:
  - capability: "state_inspection"
    description: "Examine all COG state at breakpoint"
    accessible:
      - "All COG RAM locations"
      - "All special registers"
      - "Flag states"
      - "Streamer-active and FIFO read/write state (GETBRK D[21] and D[20])"
  
  - capability: "execution_modification"
    description: "Modify execution flow from debug handler"
    techniques:
      - "Change IRET0 to alter return address"
      - "Modify COG RAM before return"
      - "Skip instructions using SKIPF"
  
  - capability: "cross_cog_debugging"
    description: "Debug any COG from any other COG"
    mechanism: "COGBRK instruction triggers remote debug"

best_practices:
  - practice: "minimal_debug_overhead"
    description: "Keep debug ISR lightweight"
    rationale: "Reduces impact on timing-sensitive code"
  
  - practice: "circular_trace_buffer"
    description: "Use circular buffer for execution traces"
    rationale: "Captures most recent execution history"
  
  - practice: "debug_communication"
    description: "Use hub memory for debug data exchange"
    rationale: "Allows debugger COG to examine state"
  
  - practice: "production_disable"
    description: "Disable debug interrupts in production"
    rationale: "A debug-enabled cog takes a debug interrupt on every (re)start from a COGINIT, and the debug ISR costs cog clocks"

performance_impact:
  dispatch_overhead:
    description: "Debug interrupt uses the same CALLD-based dispatch mechanism as INT1/INT2/INT3 (see architecture/interrupts.yaml)"
    cogexec_entry: "4 clocks for the dispatched CALLD"
    cogexec_exit: "4 clocks for the RETIx-equivalent return"
    cogexec_round_trip_minimum: "8 clocks (excluding ISR body)"
    note: "A debug ISR executes strictly in cog register space, so it does not disturb the hub FIFO state. Total per-instruction single-step cost = round-trip overhead + ISR body length. We do not publish a single 'minimal ISR' clock count because the ISR body is user-defined."

  breakpoint_overhead:
    on_hit: "ISR dispatch overhead + ISR body execution time"

limitations:
  - limitation: "single_debug_level"
    description: "The single-step scopes are INT3 / INT2 / INT1 ISR code and non-ISR code; debug ISR code is not one of them"

  - limitation: "hub_access_timing"
    description: "Debug ISR hub access affects timing"
    workaround: "Use COG RAM buffering when possible"

  - limitation: "streamer_interaction"
    description: "With every cog debug-enabled (the default), streamer-based Goertzel results were corrupted (accumulators read in the millions; they read in the hundreds, the true values, once DEBUG_COGS was restricted to one cog). The streamer's pin and DAC output was unchanged with a live debug interrupt. No source states the mechanism."
    workaround: "When measuring with the streamer, restrict DEBUG_COGS to the reporting cog"
    source: "EF-057 (Goertzel corruption), EF-062 and EF-063 (pin and DAC output unchanged); Parallax Propeller 2 Documentation v35 (Rev B/C silicon), Debug Interrupt (the debug ISR runs strictly in cog register space)"

related_topics:
  - topic: "interrupts"
    relationship: "Debug is highest priority interrupt"
  
  - topic: "cog_operations"
    relationship: "Can debug any COG from any COG"
  
  - topic: "development_tools"
    relationship: "Basis for software debuggers"

sources:
    - document: "Propeller 2 Documentation v35 (Rev B/C Silicon)"
      source: "engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt"
      sections:
        - "DEBUG INTERRUPT -- lines 2393-2593"
        - "PASM2 encoding table -- lines 5337 (GETBRK), 5338 (COGBRK), 5339 (BRK)"
    - document: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01"
      source: "engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt"
      sections:
        - "Feature list, hidden debug interrupt -- line 74"
        - "Cog register note, INA/INB as debug call/return -- line 542"
        - "PASM2 instruction table, BRK/COGBRK/GETBRK -- lines 1938-1944"
