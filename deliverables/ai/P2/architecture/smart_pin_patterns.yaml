# Smart Pin Usage Patterns from Production Code
# Enhanced from code study: flash_loader, debugger, BLDC motor control

component: Smart_Pin_Patterns
category: practical_patterns
description: |
  Production-proven patterns for Smart Pin usage, extracted from
  Parallax official code and Iron Sheep Productions projects.
  
documentation_source: enhanced
documentation_level: comprehensive

spi_patterns:
  # CRITICAL: SPI requires pin-joining constants (P_PLUS1_B etc.) to route
  # the clock signal from an adjacent pin to the data pin's B-input.
  # Without this, the smart pin will not see clock edges!

  spi_clock_generation:
    description: Generate continuous SPI clock using transition mode
    mode: P_TRANSITION
    setup: |
      ' Configure SPI clock pin
      wrpin   #%01_00101_0, #spi_ck    ' transition output, starts out low
      wxpin   #1, #spi_ck              ' timebase = 1 clock per transition
      drvl    #spi_ck                  ' enable smart pin
      wypin   #16, #spi_ck             ' start 16 clock transitions
    source: "flash_loader.spin2 -- engineering/ingestion/sources/flash-loader/flash_loader.spin2:101-103,167"

  spi_full_duplex:
    description: Complete SPI master with CLK, MOSI, MISO on adjacent pins
    pin_layout: |
      Recommended adjacent pin layout:
        Pin N   = CLK  (P_TRANSITION mode)
        Pin N+1 = MOSI (P_SYNC_TX | P_MINUS1_B - clock from pin-1)
        Pin N+2 = MISO (P_SYNC_RX | P_MINUS2_B - clock from pin-2)
    setup: |
      ' Example: CLK=40, MOSI=41, MISO=42
      CON
        SPI_CLK  = 40
        SPI_MOSI = 41
        SPI_MISO = 42

      ' Clock generator
      wrpin   ##P_TRANSITION | P_OE, #SPI_CLK
      wxpin   ##clk_period, #SPI_CLK
      dirh    #SPI_CLK

      ' MOSI: clock from pin-1
      wrpin   ##P_SYNC_TX | P_OE | P_MINUS1_B, #SPI_MOSI
      wxpin   #%1_00111, #SPI_MOSI       ' Start-stop, 8-bit
      dirh    #SPI_MOSI

      ' MISO: clock from pin-2
      wrpin   ##P_SYNC_RX | P_MINUS2_B, #SPI_MISO
      wxpin   #%0_00111, #SPI_MISO       ' Pre-edge, 8-bit
      dirh    #SPI_MISO

pwm_patterns:
  motor_pwm_with_deadtime:
    description: >-
      Complementary half-bridge PWM (high-side + low-side) with software
      dead-time to prevent shoot-through. IMPORTANT: the P2 has NO single-pin
      complementary-output or dead-band PWM mode. A complementary pair is
      ALWAYS two Smart Pins -- one per side -- enabled together and coordinated
      carefully; the dead-band is produced in software, not by any pin mode.
    mode: P_PWM_SAWTOOTH
    pins: "two Smart Pins per half-bridge -- one high-side, one low-side"
    setup: |
      ' TWO Smart Pins, one per side. The low-side pin inverts its output
      ' (P_INVERT_OUTPUT) so the pair is complementary; both share one frame.
      wrpin   ##P_PWM_SAWTOOTH | P_OE, pin_pwm_h            ' high side (true)
      wrpin   ##P_PWM_SAWTOOTH | P_OE | P_INVERT_OUTPUT, pin_pwm_l  ' low (inv)
      wxpin   pwm_frame_ticks, pin_pwm_h   ' same frame period on both pins
      wxpin   pwm_frame_ticks, pin_pwm_l
      dirh    pin_pwm_h
      dirh    pin_pwm_l                     ' enable both pins together
    dead_time_handling: |
      ' Dead-time is inserted in SOFTWARE by offsetting the two duty values so
      ' the active intervals never overlap -- the gap between them IS the
      ' dead-band. (isp_bldc_motor.spin2: high side on later, low side off earlier.)
      sub     high_duty, dead_time     ' high side switches on later
      add     low_duty,  dead_time     ' low side switches off earlier
      wypin   high_duty, pin_pwm_h
      wypin   low_duty,  pin_pwm_l
    source: "isp_bldc_motor.spin2 (OBEX 2874, ISP BLDC Motor Control)"
    authority: >-
      Two-pin requirement confirmed by Chip Gracey (2026-07-16); mechanism
      grounded in isp_bldc_motor.spin2 (two WRPIN, high=true / low=inverted,
      software dead-gap offset).
    
  dac_dithered_output:
    description: 16-bit DAC using 8-bit DAC with dithering
    mode: P_DAC_DITHER_PWM
    setup: |
      ' 16-bit resolution from 8-bit DAC
      wrpin   ##P_DAC_DITHER_PWM, dac_pin
      wxpin   #256, dac_pin            ' Dither period
      dirh    dac_pin                  ' Enable smart pin
      wypin   value_16bit, dac_pin     ' 16-bit value (Y after enable)
    source: audio_output

adc_patterns:
  calibrated_adc_reading:
    description: ADC with calibration sequence
    mode: P_ADC_1X
    calibration: |
      ' ADC setup - GIO level
      wrpin   adc_modes+0, adc_pins           ' switch ADC to GIO calibration
      wxpin   adc_fram, adc_pins              ' set count period to match PWM frame width
      wypin   #0, adc_pins
      dirh    adc_pins                        ' enable ADC pins to use adc
      ' ... wait for sample ready ...
      rdpin   gio_levels+0, pin_adc_u_i       ' GIO samples done, read them

      ' ADC setup - VIO level
      dirl    adc_pins                        ' disable ADC pins for configuration
      wrpin   adc_modes+1, adc_pins           ' switch ADC to VIO calibration
      dirh    adc_pins                        ' enable ADC to use adc
      ' ... wait for sample ready ...
      rdpin   vio_levels+0, pin_adc_u_i       ' VIO samples done, read them

      sub     vio_levels+0, gio_levels+0      ' sub gio from vio to get range
    measurement: |
      qdiv    numerator, vio_levels+0         ' CORDIC divide to get calibrated value
    source: "isp_bldc_motor.spin2 -- engineering/ingestion/external-inputs/source-code/external-projects/P2-BLDC-Motor-Control/src/isp_bldc_motor.spin2:1610-1642"

timing_patterns:
  pulse_width_measurement:
    description: Measure pulse width in clock cycles
    mode: P_HIGH_TICKS
    setup: |
      ' Measure high pulse width
      wrpin   ##P_HIGH_TICKS, input_pin
      wxpin   #0, input_pin            ' Continuous mode
      dirh    input_pin
      
      ' Wait for measurement
      testp   input_pin           wc   ' Check if ready
      if_c    rdpin   width, input_pin ' Read width
              wypin   #0, input_pin     ' Acknowledge
    source: servo_input
    
  frequency_measurement:
    description: Measure input frequency
    mode: P_COUNT_RISES
    setup: |
      ' Count rising edges in time window
      wrpin   ##P_COUNT_RISES, freq_pin
      wxpin   ##80_000_000, freq_pin  ' 1 second at 80MHz
      dirh    freq_pin                 ' Enable smart pin
      wypin   #0, freq_pin             ' Start counting (Y after enable)
      
      ' Read count after window
      waitx   ##80_000_000
      rdpin   frequency, freq_pin      ' Frequency in Hz
    source: frequency_counter

repository_patterns:
  shared_data_repository:
    description: Use smart pin as data mailbox between COGs
    mode: P_REPOSITORY
    setup: |
      ' Setup repository mode
      wrpin   ##P_REPOSITORY, repo_pin
      dirh    repo_pin
      
      ' COG A writes data (X holds the 32-bit repository long)
      wxpin   data_value, repo_pin

      ' COG B reads data
      rdpin   received, repo_pin
    source: multi_cog_communication

synchronization:
  streamer_smartpin_sync:
    description: Synchronize streamer with smart pin SPI clock
    critical_pattern: |
      ' Critical: enable the smart pin BEFORE the streamer
      wrpin   #%01_00101_0,#spi_ck     ' set spi_ck for transition output
      wxpin   #1,#spi_ck               ' set timebase to 1 clock per transition
      drvl    #spi_ck                  ' enable smart pin

      ' ... later, start the streamer ...
      xinit   rmode, pa                ' start outputting bits via streamer
    source: "flash_loader.spin2 -- engineering/ingestion/sources/flash-loader/flash_loader.spin2:100-103,126"
    
notes:
  - "Each smart pin has an outgoing 33-bit bus which conveys its Z result and a special flag. RDPIN and RQPIN are used to multiplex and read these buses, so that a pin's Z result is read into D and its special flag can be read into C. -- engineering/ingestion/sources/silicon-doc/part4-smart-pins.txt:1-3"
  - "Long-repository mode (%SSSSS = %00001..%00011 with M[12:10] != %101) turns the smart pin into a long repository, where WXPIN writes the long and RDPIN/RQPIN can read the long -- the cog-to-cog mailbox pattern. -- engineering/ingestion/sources/silicon-doc/part4-smart-pins.txt:222-224"
  - "Streamer/smart-pin configuration order is critical for SPI: configure and start the smart pin before XINIT starts the streamer. The worked sequence and its source (Parallax flash_loader.spin2) are in the streamer_smartpin_sync pattern above."
  - "Client code using these protocols (SPI / sync-serial / async-serial) typically needs timing/timeout idioms. For multi-second protocol timeouts (SD card busy-wait, slow peripheral response), use GETMS -- a GETCT-based deadline has a safe window of only 2^31 / CLKFREQ seconds and fails silently past it. The per-frequency ceilings are in language/spin2/concepts/timing_operations.yaml method_selection."


related:
