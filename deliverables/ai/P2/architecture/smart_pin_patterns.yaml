# Smart Pin Usage Patterns from Production Code
# Enhanced from code study: flash_loader, debugger, BLDC motor control

component: Smart_Pin_Patterns
category: practical_patterns
description: |
  Production-proven patterns for Smart Pin usage, extracted from
  Parallax official code and Iron Sheep Productions projects.
  
documentation_source: enhanced
documentation_level: comprehensive

spi_patterns:
  # CRITICAL: SPI requires pin-joining constants (P_PLUS1_B etc.) to route
  # the clock signal from an adjacent pin to the data pin's B-input.
  # Without this, the smart pin will not see clock edges!

  spi_clock_generation:
    description: Generate continuous SPI clock using transition mode
    mode: P_TRANSITION
    setup: |
      ' Configure SPI clock pin (e.g., pin 40)
      wrpin   ##P_TRANSITION | P_OE, #SPI_CLK_PIN
      wxpin   ##clk_period, #SPI_CLK_PIN  ' Clock period in sysclks
      dirh    #SPI_CLK_PIN                 ' Enable smart pin
      wypin   #16, #SPI_CLK_PIN            ' Generate 16 transitions (8 bits)
    source: flash_loader.spin2

  spi_data_output:
    description: SPI MOSI using synchronous serial transmit
    mode: P_SYNC_TX
    critical: |
      MUST use P_PLUS1_B or P_MINUS1_B to route clock from adjacent pin!
      Example pin layout: MOSI=41, CLK=40 → use P_MINUS1_B (clock is pin-1)
    setup: |
      ' Configure MOSI pin (pin 41, clock on pin 40)
      ' P_MINUS1_B routes B-input from pin-1 (the clock pin)
      wrpin   ##P_SYNC_TX | P_OE | P_MINUS1_B, #SPI_MOSI_PIN
      wxpin   #%1_00111, #SPI_MOSI_PIN    ' Start-stop mode, 8 bits
      dirh    #SPI_MOSI_PIN

      ' Send byte
      wypin   data_byte, #SPI_MOSI_PIN
      ' Clock pin generates transitions, MOSI shifts data
    source: flash_loader.spin2

  spi_data_input:
    description: SPI MISO using synchronous serial receive
    mode: P_SYNC_RX
    critical: |
      MUST use P_PLUS1_B or P_MINUS1_B to route clock from adjacent pin!
      Example pin layout: MISO=42, CLK=40 → use P_MINUS2_B (clock is pin-2)
    setup: |
      ' Configure MISO pin (pin 42, clock on pin 40)
      ' P_MINUS2_B routes B-input from pin-2 (the clock pin)
      wrpin   ##P_SYNC_RX | P_MINUS2_B, #SPI_MISO_PIN
      wxpin   #%0_00111, #SPI_MISO_PIN    ' Pre-edge sampling, 8 bits
      dirh    #SPI_MISO_PIN

      ' Receive byte (clock pin triggers reception)
      ' Wait for IN flag then read
      testp   #SPI_MISO_PIN         wc
      rdpin   data_byte, #SPI_MISO_PIN   ' Read and acknowledge
      shr     data_byte, #24              ' Right-justify 8-bit data
    source: flash_loader.spin2

  spi_full_duplex:
    description: Complete SPI master with CLK, MOSI, MISO on adjacent pins
    pin_layout: |
      Recommended adjacent pin layout:
        Pin N   = CLK  (P_TRANSITION mode)
        Pin N+1 = MOSI (P_SYNC_TX | P_MINUS1_B - clock from pin-1)
        Pin N+2 = MISO (P_SYNC_RX | P_MINUS2_B - clock from pin-2)
    setup: |
      ' Example: CLK=40, MOSI=41, MISO=42
      CON
        SPI_CLK  = 40
        SPI_MOSI = 41
        SPI_MISO = 42

      ' Clock generator
      wrpin   ##P_TRANSITION | P_OE, #SPI_CLK
      wxpin   ##clk_period, #SPI_CLK
      dirh    #SPI_CLK

      ' MOSI: clock from pin-1
      wrpin   ##P_SYNC_TX | P_OE | P_MINUS1_B, #SPI_MOSI
      wxpin   #%1_00111, #SPI_MOSI       ' Start-stop, 8-bit
      dirh    #SPI_MOSI

      ' MISO: clock from pin-2
      wrpin   ##P_SYNC_RX | P_MINUS2_B, #SPI_MISO
      wxpin   #%0_00111, #SPI_MISO       ' Pre-edge, 8-bit
      dirh    #SPI_MISO

pwm_patterns:
  motor_pwm_with_deadtime:
    description: >-
      Complementary half-bridge PWM (high-side + low-side) with software
      dead-time to prevent shoot-through. IMPORTANT: the P2 has NO single-pin
      complementary-output or dead-band PWM mode. A complementary pair is
      ALWAYS two Smart Pins -- one per side -- enabled together and coordinated
      carefully; the dead-band is produced in software, not by any pin mode.
    mode: P_PWM_SAWTOOTH
    pins: "two Smart Pins per half-bridge -- one high-side, one low-side"
    setup: |
      ' TWO Smart Pins, one per side. The low-side pin inverts its output
      ' (P_INVERT_OUTPUT) so the pair is complementary; both share one frame.
      wrpin   ##P_PWM_SAWTOOTH | P_OE, pin_pwm_h            ' high side (true)
      wrpin   ##P_PWM_SAWTOOTH | P_OE | P_INVERT_OUTPUT, pin_pwm_l  ' low (inv)
      wxpin   pwm_frame_ticks, pin_pwm_h   ' same frame period on both pins
      wxpin   pwm_frame_ticks, pin_pwm_l
      dirh    pin_pwm_h
      dirh    pin_pwm_l                     ' enable both pins together
    dead_time_handling: |
      ' Dead-time is inserted in SOFTWARE by offsetting the two duty values so
      ' the active intervals never overlap -- the gap between them IS the
      ' dead-band. (isp_bldc_motor.spin2: high side on later, low side off earlier.)
      sub     high_duty, dead_time     ' high side switches on later
      add     low_duty,  dead_time     ' low side switches off earlier
      wypin   high_duty, pin_pwm_h
      wypin   low_duty,  pin_pwm_l
    source: "isp_bldc_motor.spin2 (OBEX 2874, ISP BLDC Motor Control)"
    authority: >-
      Two-pin requirement confirmed by Chip Gracey (2026-07-16); mechanism
      grounded in isp_bldc_motor.spin2 (two WRPIN, high=true / low=inverted,
      software dead-gap offset).
    
  dac_dithered_output:
    description: 16-bit DAC using 8-bit DAC with dithering
    mode: P_DAC_DITHER_PWM
    setup: |
      ' 16-bit resolution from 8-bit DAC
      wrpin   ##P_DAC_DITHER_PWM, dac_pin
      wxpin   #256, dac_pin            ' Dither period
      dirh    dac_pin                  ' Enable smart pin
      wypin   value_16bit, dac_pin     ' 16-bit value (Y after enable)
    source: audio_output

adc_patterns:
  calibrated_adc_reading:
    description: ADC with calibration sequence
    mode: P_ADC_1X
    calibration: |
      ' Calibrate ADC (must be done once)
      wrpin   ##P_ADC_GIO, adc_pin     ' Ground calibration
      wxpin   #%10_0111, adc_pin       ' 128 samples
      dirh    adc_pin
      waitx   ##2000                   ' Wait for cal
      rdpin   gnd_level, adc_pin       ' Read ground level
      
      wrpin   ##P_ADC_VIO, adc_pin     ' VIO calibration
      waitx   ##2000                   ' ADC samples continuously once enabled
      rdpin   vio_level, adc_pin       ' Read VIO level
      
      ' Calculate scale factor
      sub     vio_level, gnd_level
      ' scale = vio_level - gnd_level
    measurement: |
      ' Normal ADC reading
      wrpin   ##P_ADC_1X, adc_pin      ' Normal mode
      waitx   #100                     ' ADC samples continuously; wait one period
      rdpin   raw_value, adc_pin
      
      ' Apply calibration
      sub     raw_value, gnd_level
      mul     raw_value, ##4096
      div     raw_value, scale
    source: isp_bldc_motor.spin2

encoder_patterns:
  quadrature_decoder:
    description: Hardware quadrature decoder for encoders
    mode: P_QUADRATURE
    setup: |
      ' A/B quadrature decoder
      wrpin   ##P_QUADRATURE, encoder_pin_a
      wxpin   #0, encoder_pin_a        ' No period
      dirh    encoder_pin_a             ' Enable
      
      ' Read position
      rdpin   position, encoder_pin_a  ' Get count
      
      ' Reset position — pulse DIR low to zero the counter
      dirl    encoder_pin_a            ' Zero count
      dirh    encoder_pin_a            ' Re-enable encoder
    source: motor_control

timing_patterns:
  pulse_width_measurement:
    description: Measure pulse width in clock cycles
    mode: P_HIGH_TICKS
    setup: |
      ' Measure high pulse width
      wrpin   ##P_HIGH_TICKS, input_pin
      wxpin   #0, input_pin            ' Continuous mode
      dirh    input_pin
      
      ' Wait for measurement
      testp   input_pin           wc   ' Check if ready
      if_c    rdpin   width, input_pin ' Read width
              wypin   #0, input_pin     ' Acknowledge
    source: servo_input
    
  frequency_measurement:
    description: Measure input frequency
    mode: P_COUNT_RISES
    setup: |
      ' Count rising edges in time window
      wrpin   ##P_COUNT_RISES, freq_pin
      wxpin   ##80_000_000, freq_pin  ' 1 second at 80MHz
      dirh    freq_pin                 ' Enable smart pin
      wypin   #0, freq_pin             ' Start counting (Y after enable)
      
      ' Read count after window
      waitx   ##80_000_000
      rdpin   frequency, freq_pin      ' Frequency in Hz
    source: frequency_counter

repository_patterns:
  shared_data_repository:
    description: Use smart pin as data mailbox between COGs
    mode: P_REPOSITORY
    setup: |
      ' Setup repository mode
      wrpin   ##P_REPOSITORY, repo_pin
      dirh    repo_pin
      
      ' COG A writes data (X holds the 32-bit repository long)
      wxpin   data_value, repo_pin

      ' COG B reads data
      rdpin   received, repo_pin
    source: multi_cog_communication

synchronization:
  streamer_smartpin_sync:
    description: Synchronize streamer with smart pin SPI
    critical_pattern: |
      ' Critical: Start smart pins BEFORE streamer
      dirh    #SPI_CLK_PIN             ' Start clock
      dirh    #SPI_MOSI_PIN            ' Start MOSI
      dirh    #SPI_MISO_PIN            ' Start MISO
      
      ' Then start streamer
      xinit   xfer_config, #0          ' Begin transfer
      
      ' This order prevents data corruption
    source: flash_loader.spin2
    
notes:
  - Smart pins offload timing-critical operations from COGs
  - Each pin operates independently once configured
  - Calibration essential for accurate ADC readings
  - PWM dead-time critical for motor control safety
  - Repository mode enables COG-to-COG communication
  - Streamer-smartpin sync order is critical for SPI
  - "Client code using these protocols (SPI / sync-serial / async-serial) typically needs timing/timeout idioms. For multi-second protocol timeouts (SD card busy-wait, slow peripheral response), use GETMS — GETCT-based deadlines silently overflow past ~10 s at 200 MHz. See language/spin2/concepts/timing_operations.yaml method_selection."

related:
  - language/spin2/concepts/timing_operations.yaml
  - language/spin2/methods/getct.yaml
  - language/spin2/methods/getms.yaml