oneliner: "P2 I/O pins are powered in isolated groups of 8 (0-7, 8-15, ..., 56-63) sharing one VIO/GIO pair; a pin's P_ADC_GIO/P_ADC_VIO ADC references its own group's rails, so multi-pin shared-node measurements must stay within one group."
