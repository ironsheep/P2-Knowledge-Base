oneliner: "P2 I/O pins are powered in isolated SILICON groups of 4 (0-3, 4-7, ..., 60-63) sharing one VIO/GIO pair — a pin's P_ADC_GIO/P_ADC_VIO references its own group, so multi-pin shared-node measurements must stay within four; the 8-pin grouping readers see on Edge boards is the LDO/header layer, where one LDO feeds two silicon groups."
