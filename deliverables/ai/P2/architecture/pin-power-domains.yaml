component: pin_power_domains
title: "I/O Pin Power Domains — Isolated Groups of Eight"
category: io_architecture
aliases:
  - pin power domains
  - VIO GIO grouping
  - power group of 8
  - isolated supply domain
  - ADC reference domain
  - per-group ADC reference
  - smart pin power grouping

description: |
  The P2 powers its I/O pins in ISOLATED GROUPS OF EIGHT — pins 0-7, 8-15, 16-23, ...,
  56-63 — each group sharing one VIO/GIO supply pair (an isolated supply domain). Pin
  group boundaries align on multiples of eight.

power_grouping:
  group_size: 8
  groups: "0-7, 8-15, 16-23, ... , 56-63 (8 groups across 64 pins)"
  supply_pair: "Each group shares one VIO (supply) / GIO (ground) pair — an isolated supply domain."
  pin_table_symbols: "VIO_{x}_{y} / GIO_{x}_{y} = power / ground for smart pins {x} through {y}."

adc_reference:
  fact: |
    A pin's ADC, when set to P_ADC_GIO or P_ADC_VIO, references ITS OWN GROUP's ground /
    supply rails. This is why a single-pin ratiometric measurement is absolute.
  multi_pin_constraint: |
    Pins tied to a SHARED NODE for one measurement must sit WITHIN A SINGLE GROUP to share
    a reference domain. Straddling a group boundary (e.g. pins 7 and 8) mixes supply domains
    and degrades the result. Independent single-ended channels on different pins are
    unaffected — each reads against its own group's reference.

evidence:
  - "P2 Silicon Doc, pin table: VIO_{x}_{y} / GIO_{x}_{y} = power / ground for smart pins {x} through {y} (per-group supply pairs; a pin's ADC references its own group's rails for calibration)."
  - "P2 Edge module / eval breakout electrical spec: 300 mA per 8-pin group — one VIO3V3 / GND pair per 8-pin header — establishing the group size as 8 (P0-7, P8-15, ..., P56-63; 8 groups across 64 pins)."

