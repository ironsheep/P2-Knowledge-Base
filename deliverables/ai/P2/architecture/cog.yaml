# COG - Symmetric 32-bit Processor Core
# Source: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon); Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01

component: COG
category: processor
description: |
  Symmetric 32-bit processor core with dedicated RAM, hardware stack, and full I/O access.
  Eight identical COGs run in parallel.

architecture:
  data_width: 32
  address_width: 20
  pipeline_stages: 5
  pipeline_type: "Five-stage pipelined execution"
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), COGS (first instruction after a branch: at least four clock cycles); Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Execution, p.14 (at least five clock cycles); P2 Instructions v35 Rev B/C Silicon, JMP/CALL/RET rows (4 clocks in cog/LUT execution)"
  execution_time: "2 clocks for typical ALU ops when pipeline full ('2-clock execution for all math and logic instructions')"
  branch_instruction_time: "4 clocks for JMP/CALL/RET in cog/LUT execution"
  post_branch_first_instruction: "Branch instructions cause the pipeline to be flushed, so the first instruction following the branch takes at least four clock cycles; Parallax's documents also give at least five. This is a separate fact from the branch instruction time."
  conditionally_canceled_instruction: "Still 2 clocks ('Any instruction that is conditionally canceled will still move through the pipeline without stalling or executing, but taking two clock cycles')"

memory:
  cog_ram:
    size: "512 longs"
    width: "32 bits"
    addresses: "$000-$1FF"
    dual_use: "$1F0-$1F7 are RAM unless their function is in use: interrupt call and return addresses (IJMP1-3, IRET1-3 at $1F0-$1F5) or PA and PB ($1F6, $1F7)"
    
  lut_ram:
    size: "512 longs"
    width: "32 bits"
    addresses: "$000-$1FF (via RDLUT/WRLUT)"
    special_features: "Streamer access, COG pair sharing"
    
  registers:
    general_purpose: "$000-$1EF"
    dual_purpose: "$1F0-$1F7 (RAM, or IJMP3/IRET3/IJMP2/IRET2/IJMP1/IRET1/PA/PB when the function is in use)"
    special_hardware: "$1F8-$1FF (8 special-purpose registers mapped into the register address space; an instruction that addresses one reaches the special-purpose register, not just the underlying RAM)"

special_registers:
  ptr_registers:
    ptra: "$1F8 - Hub pointer A"
    ptrb: "$1F9 - Hub pointer B"
    features:
      - "20-bit hub addresses"
      - "Auto-increment/decrement"
      - "Index expressions"
      
  io_registers:
    dira: "$1FA - Direction control 31:0"
    dirb: "$1FB - Direction control 63:32"
    outa: "$1FC - Output state 31:0"
    outb: "$1FD - Output state 63:32"
    ina: "$1FE - Input state 31:0 (also IJMP0 in debug)"
    inb: "$1FF - Input state 63:32 (also IRET0 in debug)"
    
  interrupt_vectors:
    ijmp3: "$1F0 - INT3 jump address"
    iret3: "$1F1 - INT3 return address"
    ijmp2: "$1F2 - INT2 jump address"
    iret2: "$1F3 - INT2 return address"
    ijmp1: "$1F4 - INT1 jump address"
    iret1: "$1F5 - INT1 return address"
    
  hidden_registers:
    pa: "$1F6 - CALLD-imm return, CALLPA parameter, or LOC address"
    pb: "$1F7 - CALLD-imm return, CALLPB parameter, or LOC address"

flags:
  c_flag:
    description: "Carry flag"

  z_flag:
    description: "Zero flag"
    
  flag_writing:
    wc: "Write carry flag"
    wz: "Write zero flag"
    wcz: "Write both flags"
    
  flag_preservation:
    no_suffix: "Flags unchanged"
  flag_combining_suffixes:
    scope: "ANDC/ANDZ/ORC/ORZ/XORC/XORZ exist only on TESTB, TESTBN, TESTP and TESTPN, which combine the tested bit with C or Z (AND, OR, XOR) instead of writing it; other instructions take only WC, WZ or WCZ"

stack:
  hardware_stack:
    depth: "8 levels; a 9th push discards the oldest entry"
    width: "32 bits per entry (CALL pushes {C, Z, 10'b0, PC[19:0]}; PUSH pushes a full 32-bit value)"
    push_instructions: ["CALL", "CALLPA", "CALLPB", "PUSH"]
    pop_instructions: ["RET", "POP"]
    not_on_this_stack: "CALLA/CALLB/RETA/RETB use a hub stack at PTRA/PTRB; CALLD writes its return into a register"
    source: "EF-094; Parallax Propeller 2 (P2X8C4M64P) Datasheet, Release November 1, 2022, Branch Instructions, p.40"
  software_stack:
    ptra_stack: "PUSHA/POPA use PTRA as stack pointer"
    ptrb_stack: "PUSHB/POPB use PTRB as stack pointer"
    operations: "32-bit push/pop to hub memory"

execution_modes:
  cog_execution:
    pc_range: "$000-$1FF (COG RAM)"
    instruction_fetch: "32-bit from COG RAM"
    pc_increment: 1
    timing: "ALU instructions such as ADD, MOV and NOP take 2 clocks; other instructions have their own figures"
    
  lut_execution:
    pc_range: "$200-$3FF (LUT RAM)"
    instruction_fetch: "32-bit from LUT"
    pc_increment: 1
    timing: "ALU instructions such as ADD, MOV and NOP take 2 clocks; other instructions have their own figures"
    
  hub_execution:
    pc_range: "$400-$FFFFF (Parallax's documents also give $7FFFF as the top of the range)"
    instruction_fetch: "Instructions are 32-bit longs and the PC steps by 4; the memory-map tables list hub RAM width as 8 bits. The cog employs the FIFO hardware (which contains (cogs+11) stages) to spool up instructions so that a stream of instructions is available for continuous execution"
    pc_increment: 4
    timing_sequential: "ALU instructions such as ADD, MOV and NOP take 2 clocks in hub execution, the same as in cog execution. Not documented: the clocks per sequential instruction in hub execution as a general rule; RDLONG, WRLONG and branches have their own hub execution figures."
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), COGS (address ranges table: hub RAM width 8 bits, PC range); Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Execution, p.15 (address ranges table); Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, Execution (address ranges table); Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), HUB EXECUTION (pc_range, timing_sequential, timing_branch); THE COG -to- HUB RAM INTERFACE (fifo_depth, 'The FIFO contains (cogs+11) stages')"
    timing_branch: "Minimum 13 clocks (+1 if not long-aligned)"
    fifo_depth: "(cogs+11) stages"

interrupts:
  levels:
    int1: "Highest priority"
    int2: "Middle priority"
    int3: "Lowest priority"
    debug: "Highest (invisible to normal code)"
    
  sources:
    events: "Interrupt sources 1 to 15 (the CT1/CT2/CT3, selectable-event, pin-pattern, FIFO-block-wrap, streamer, attention and CORDIC events); source 0 is off"
    software: "TRGINTx instructions"
    
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), INTERRUPTS (Interrupt branches are realized by inserting a CALLD IRETx,IJMPx WCZ into the instruction pipeline); P2 Instructions v35 Rev B/C Silicon, CALLD, RESIx and RETIx rows (4 cog / 13...20 hub)"
  dispatch_mechanism: |
    Interrupt dispatch mechanism: "Interrupt branches are realized, internally,
    by inserting a 'CALLD IRETx,IJMPx WCZ' into the instruction pipeline
    while holding the program counter at its current value, so that the
    interrupt later returns to the address saved in IRETx."
  
  entry_timing:
    calld_instruction: "Not documented: the clocks the interrupt branch takes. The CALLD instruction itself takes 4 clocks when executed from cog/LUT and 13...20 clocks when executed from hub."
    note: "The interrupt branch is held off until the deferral conditions below are clear. Not documented: the time spent waiting for them."

  exit_timing:
    reti_resi: "RETI0/1/2/3 and RESI0/1/2/3 are aliases of CALLD (RETI1 = CALLD INB,IRET1 WCZ; RESI1 = CALLD IJMP1,IRET1 WCZ) and take the CALLD timing: 4 clocks (cog/LUT) / 13...20 clocks (hub)"

  deferral_conditions:
    description: "The interrupt branch is held off while any of these are in progress"
    conditions:
      - "ALTxx / CRCNIB / SCA / SCAS / GETCT+WC / GETXACC / SETQ / SETQ2 / XORO32 / XBYTE must not be executing"
      - "AUGS must not be executing or waiting for an S/# instruction"
      - "AUGD must not be executing or waiting for a D/# instruction"
      - "REP must not be executing or active"
      - "STALLI must not be executing or active"
      - "The cog must not be stalled in any WAITx instruction"
    
  nesting:
    int1_can_interrupt: ["INT2", "INT3", "main"]
    int2_can_interrupt: ["INT3", "main"]
    int3_can_interrupt: ["main"]

pipeline:
  stage_count: 5
  source: "Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, Instruction Stages, p.17 (three fetch stages, then Execute and Store); P2 Instructions v35 Rev B/C Silicon, ADD/MOV/NOP rows (same clocks in cog and hub execution); P2 Instructions v35 Rev B/C Silicon, GETQX/GETQY rows; Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), CORDIC Solver (cogs can start CORDIC operations every #cogs clocks and get results 55 clocks later)"
  stage_names: "The first three stages (Fetches) read the 32-bit PASM2 instruction opcode from RAM, latch it for decoding, and read and latch the instruction's source and destination values; the final two stages (Execute and Store) use the arithmetic logic unit and write the resulting 32-bit value and the carry and zero flags if required. Not documented: names for the five stages beyond these."

  hazards:
    data_hazards: "After modifying a cog register (self-modifying code, SETS/SETD/SETR), two instructions must elapse before executing the modified register, due to pipelining"
    control_hazards: "Branch instructions cause the pipeline to be flushed, so the first instruction following the branch takes at least four clock cycles; Parallax's documents also give at least five"
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), COGS (at least four); Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Execution, p.14 (at least five); Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SELF-MODIFYING CODE (two instructions must elapse after modifying a register)"
    stalled_instruction: "If an instruction stalls for additional clock cycles, all following instructions in the pipeline are also stalled"

  stalls:
    hub_window_miss: "up to #cogs-1 clocks"
    cordic_wait: "GETQX/GETQY: 2-58 clocks (they wait in case the result is not ready)"

starting_stopping:
  coginit:
    instruction: "COGINIT {#}D,{#}S"
    d_parameter: |
      Notation for D: %0_x_xxxx and %1_x_xxxx (D[5]), %x_0_CCCC and %x_1_xxx0 / %x_1_xxx1 (D[4] and D[3:0]), where x means "any value".
      D[5] = 0: the target cog loads its registers $000..$1F7 from the hub starting at address S, then begins execution at register address $000. D[5] = 1: the target cog begins execution at register/LUT/hub address S, with no load.
      D[4] = 0: the target cog's ID is %CCCC (D[3:0]). D[4] = 1: if a cog is free (stopped), start it (D[0] = 0), or if an even/odd cog pair is free, start them (D[0] = 1).
    s_parameter: "S is the hub address to load from, or the cog/hub address to begin executing at, depending on D[5]. S goes to the target cog's PTRB (Parallax's documents differ on whether all 32 bits or S[19:0] are written). If COGINIT is preceded by SETQ, the SETQ value is written into the target cog's PTRA; otherwise the target cog's PTRA is cleared to zero."
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), STARTING AND STOPPING COGS (COGINIT D and S operands: S, all 32 bits, is written into PTRB); Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Hub Control & Cog instructions, p.41 (S[19:0] sets the hub startup address and PTRB of the cog)"
    result_with_wc: "To learn whether a start succeeded, D must be a register and WC must be used: on success C is cleared and D is overwritten with the target cog's ID (the even/lower cog's ID for a pair); on failure C is set and D is overwritten with $F."
    
  cogstop:
    instruction: "COGSTOP {#}D"
    operation: "Stop specified COG"
    
  cogid:
    instruction: "COGID D"
    operation: "Get current COG number (0-7)"

cog_communication:
  shared_resources:
    hub_ram: "512KB shared memory on the P2X8C4M64P (the 20-bit address space reaches up to 1MB)"
    pins: "64 I/O pins"
    locks: "16 semaphore bits, called locks, in the hub"
    
  cogatn:
    instruction: "COGATN {#}D"
    operation: "Signal attention to COG(s)"
    d_parameter: "D[15:0] (bit n = cog n, bits 0..15). Parallax's documents also give the lower 8 bits."
    sources:
      - "d_parameter: Parallax Propeller 2 Documentation v35 (Rev B/C silicon), COG ATTENTION (D[15:0]); P2 Instructions v35 Rev B/C Silicon, COGATN row; Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, Cog Attention, p.22 (D operand's lower 8 bits)"
    
  synchronization:
    locks: "Locks coordinate exclusive access of a shared resource"
    attention: "COGATN signaling"

performance:
  execution_rate: "When the execution pipeline is full, each instruction effectively takes as little as two clock cycles"
  typical_timing: "Typical math and logic instructions take 2 clocks and a cog-execution branch instruction takes 4 clocks"
  parallel: "8 COGs run in parallel"
  
  instruction_timing:
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), COGS, HUB EXECUTION, and CORDIC Solver; P2 Instructions v35 Rev B/C Silicon, ADD/MOV/NOP rows (hub execution clocks: same as cog execution)"
    alu_ops: "2 clocks (typical math/logic)"
    cog_branches: "4 clocks for the branch instruction (JMP/CALL/RET); first instruction after the branch takes at least 4 clocks (pipeline flush); Parallax's documents also give at least 5"
    hub_reads: "9...16 clocks (cog) / 9...26 clocks (hub-exec) for RDLONG/RDWORD/RDBYTE; RDLONG and RDWORD take +1 clock if they cross a hub long boundary"
    hub_writes: "3...10 clocks (cog) / 3...20 clocks (hub-exec) for WRLONG/WRWORD/WRBYTE; WRLONG and WRWORD take +1 clock if they cross a hub long boundary"
    hubexec_sequential: "ALU instructions such as ADD, MOV and NOP take 2 clocks in hub execution, the same as in cog execution. Not documented: the clocks per sequential instruction in hub execution as a general rule."
    hubexec_branch: "Minimum 13 clocks (+1 if not long-aligned)"
    cordic_result_latency: "Cogs can start CORDIC operations every #cogs clocks (8 for the P2X8C4M64P) and get results 55 clocks later"
    cordic_getqx_getqy_when_empty: "2 clocks"

programming_model:
  registers_as_memory: "Registers $000 through $1EF are general-purpose registers for code and data usage"
  indirect_addressing: "Cog registers can be accessed indirectly by using the ALTS/ALTD/ALTR instructions"
  
  calling_conventions:
    documented: "Not documented: a calling convention. PUSHA/POPA and PUSHB/POPB use PTRA and PTRB as stack pointers (see software_stack)"
    
debug_features:
  hardware_debug: "Invisible debug interrupt"
  breakpoints: "BRK instruction"
  single_step: "Via debug interrupt"
  register_save: "The debug-ISR-entry routine saves cog registers $000..$00F to hub RAM starting at ($FF800 + !CogNumber << 7) and loads the debugger program from hub RAM"

related_components:
  architecture/p2-architecture-mental-model.yaml: "High-level architecture orientation for agents"
  hub: "Shared memory and resources"
  smart_pins: "I/O processing offload"
  architecture/streamer/overview.yaml: "Each cog's streamer: background transfers from hub RAM and/or lookup RAM to pins/DACs, or from pins/ADCs to hub RAM"
  cordic: "Shared CORDIC solver in hub"
  interrupts: "Event-driven processing"

see_also:
  - "Architecture mental model: p2kbArchP2ArchitectureMentalModel"
  - "COG memory map"
  - "Pipeline optimization"
  - "Multi-COG programming"
  - "Interrupt handling"