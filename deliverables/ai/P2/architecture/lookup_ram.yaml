# P2 Lookup RAM (LUT)
# Provenance (re-derived 2026-08-26; the previous header cited a file that has
# never existed and datasheet pages beyond the end of a 50-page datasheet):
#   Propeller 2 Documentation v35 (Rev B/C Silicon), section LOOKUP RAM --
#     engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:471-504
#   Instruction encodings, same document, PASM2 encoding table --
#     silicon-doc-text.txt:5140 (RDLUT), :5209 (WRLUT), :5340 (SETLUTS)
#   P2X8C4M64P Datasheet 2022/11/01, "Lookup RAM" p.14 --
#     engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:592-616
#     and the PASM2 instruction table -- p2-datasheet-text.txt:2061 (RDLUT), :2063
#     (SETLUTS), :2065 (WRLUT); the cog/LUT block-transfer note lives on RDLONG's
#     row at :1830-1832 ("Prior SETQ/SETQ2 invokes cog/LUT block transfer").
#     The header previously cited :1831 alone as if it were a LUT instruction row;
#     it is RDLONG. Corrected 2026-08-30, F-399.
#   Spin2 Language Documentation v55, inline PASM2 cog register and LUT areas --
#     engineering/ingestion/sources/spin2-v55/spin2-v55-text.txt:805-806, :833-834

component_name: "Lookup RAM (LUT)"

component_type: "dual_port_memory"

aliases:
  - "LUT"
  - "LUT RAM"
  - "Lookup RAM"
  - "LUT sharing"
  - "Paired-Cog communication mechanism"
  - "RAM sharing between paired cogs"

description: |
  Each COG contains a secondary 512 x 32-bit dual-port Lookup RAM (LUT) that serves as
  fast local storage and enables special operations like streaming waveform data to DACs,
  write-sharing between adjacent COG pairs, and execution of code. RDLUT takes 3 clocks
  and WRLUT takes 2. Its documented uses are scratch space, streamer access, a bytecode
  execution lookup table, a smart pin data source, paired-cog communication, and code
  execution.

architecture:
  size: "512 longs (2048 bytes)"
  organization: "512 × 32 bits, dual-port"
  address_range: "$200-$3FF in the cog's address space; $000-$1FF as seen by RDLUT/WRLUT"
  source: >-
    Propeller 2 Documentation v35 (Rev B/C), LOOKUP RAM --
    engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:472 (512 x 32-bit
    dual-port) and :486 ("the 32-bit words are addressible from $000 to $1FF" when using
    RDLUT/WRLUT); P2 Datasheet 2022/11/01 "Lookup RAM" --
    engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:608 ("the Lookup
    RAM's locations $200..$3FF are addressable as $000..$1FF").
  
  access_modes:
    - mode: "direct"
      description: "Read/write via the RDLUT and WRLUT instructions"
      timing: "3 clocks for RDLUT, 2 clocks for WRLUT"
      source: >-
        P2 Datasheet 2022/11/01 PASM2 instruction table --
        engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:2061 (RDLUT, 3)
        and :2065 (WRLUT, 2).
    
    - mode: "pointer"
      description: "RDLUT/WRLUT accept a PTRx pointer expression in place of S"
      timing: "Same as direct -- 3 clocks for RDLUT, 2 for WRLUT"
      source: >-
        Syntax `RDLUT D,{#}S/PTRx` / `WRLUT {#}D,{#}S/PTRx` --
        engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:2061, :2065.
    
    - mode: "shared"
      description: >-
        A cog may allow the adjacent cog of its even/odd pair to WRITE into its lookup
        RAM. Sharing is a write path, not a read path -- there is no instruction that
        reads another cog's LUT.
      source: >-
        Propeller 2 Documentation v35 (Rev B/C), LOOKUP RAM > RAM SHARING BETWEEN PAIRED
        COGS -- engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:491-500.
    
    - mode: "streamer"
      description: "The streamer can use the LUT as a source or destination"
      timing: "Uses the LUT's 2nd port, which adjacent-cog writes also use"
      source: >-
        Propeller 2 Documentation v35 (Rev B/C), LOOKUP RAM --
        engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:474, :500.
  
  special_features:
    - feature: "LUT_to_DAC_streaming"
      description: "Streamer can read LUT contents and output to DACs"
      use_case: "Arbitrary waveform generation using streamer with LUT as source"
      source: >-
        Propeller 2 Documentation v35 (Rev B/C) feature list ("Ability to stream hub RAM
        and/or lookup RAM to DACs and pins or HDMI modulator") --
        engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:159.
    
    - feature: "LUT_sharing"
      description: >-
        Adjacent cogs whose IDs differ only in the LSB can each allow their lookup RAM to
        be WRITTEN by the other cog, via that cog's own local lookup-RAM writes. SETLUTS
        enables receiving those writes. Adjacent-cog writes land on the LUT's 2nd port,
        which the streamer also uses in DDS/LUT modes; an external write wins a same-clock
        collision, and the two are not intended to be used together.
      pairs: [[0,1], [2,3], [4,5], [6,7]]
      source: >-
        Propeller 2 Documentation v35 (Rev B/C), LOOKUP RAM > RAM SHARING BETWEEN PAIRED
        COGS -- engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:491-500; P2
        Datasheet 2022/11/01 "Paired-Cog Communication Mechanism" --
        engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:610-616.

    - feature: "LUT_events"
      description: >-
        For handshaking between cogs sharing lookup RAM, SETSE1..SETSE4 can raise an event
        when this cog, or its odd/even companion cog, reads or writes LUT address %1111111AA.
      source: >-
        Propeller 2 Documentation v35 (Rev B/C) --
        engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:504, :2246-2249.

    - feature: "pair_start"
      description: >-
        COGINIT with %x_1_xxx1 as its D operand finds a free even/odd cog pair and starts both
        with the same parameters; the program must then tell the even cog from the odd one,
        and possibly restart one or both.
      source: >-
        Propeller 2 Documentation v35 (Rev B/C) --
        engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:413, :502.

    - feature: "spin2_lut_area"
      description: >-
        In a cog running the Spin2 interpreter, LUT $000..$00F is available for any use and
        ideal for streamer modes which use the LUT; avoid writing LUT $010..$1FF, which the
        interpreter occupies.
      source: >-
        Spin2 Language Documentation v55 --
        engineering/ingestion/sources/spin2-v55/spin2-v55-text.txt:805-806, :833-834.

instructions:
  - instruction: "RDLUT"
    encoding: "EEEE 1010101 CZI DDDDDDDDD SSSSSSSSS"
    description: "Read data from LUT address S/PTRx into D"
    source: >-
      Propeller 2 Documentation v35 (Rev B/C), PASM2 encoding table --
      engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:5140; P2 Datasheet
      2022/11/01 PASM2 instruction table --
      engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:2061.
    operation: |
      D := LUT[S[8:0]]
      A literal S reaches only #0..#255; use a register or a PTRx expression to reach
      any of the 512 longs.
    timing: "3 clocks"
    flags_affected: "C = MSB of data, Z = (result == 0)"
    usage_example: |
      RDLUT   data, #100      ' Read LUT[100] into data
      RDLUT   value, index    ' Read LUT[index] into value
  
  - instruction: "WRLUT"
    encoding: "EEEE 1100001 1LI DDDDDDDDD SSSSSSSSS"
    description: "Write D to LUT address S/PTRx"
    source: >-
      Propeller 2 Documentation v35 (Rev B/C), PASM2 encoding table --
      engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:5209; P2 Datasheet
      2022/11/01 PASM2 instruction table --
      engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:2065.
    operation: |
      LUT[S[8:0]] := D
      D carries the DATA, S carries the ADDRESS -- syntax is `WRLUT {#}D,{#}S/PTRx`.
      A literal S reaches only #0..#255; use a register or a PTRx expression to reach
      any of the 512 longs.
    timing: "2 clocks"
    usage_example: |
      WRLUT   value, #100     ' Write value to LUT[100]
      WRLUT   ##$12345678, index ' Write immediate to LUT[index]
  
  - instruction: "SETLUTS"
    encoding: "EEEE 1101011 00L DDDDDDDDD 000110111"
    description: "Enable or disable receiving lookup-RAM writes from the adjacent cog"
    source: >-
      Propeller 2 Documentation v35 (Rev B/C), LOOKUP RAM > RAM SHARING BETWEEN PAIRED
      COGS -- engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:495-498;
      encoding at silicon-doc-text.txt:5340; P2 Datasheet 2022/11/01 PASM2 instruction
      table -- engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:2063.
    operation: |
      SETLUTS #0   ' disallow writes from the other cog of this pair (default)
      SETLUTS #1   ' allow writes from the other cog of this pair
    timing: "2 clocks"
    usage_example: |
      SETLUTS #1              ' Accept lookup-RAM writes from our paired cog

  # Note: LUT-to-DAC streaming is done via Streamer configuration (XINIT/XCONT),
  # not a dedicated instruction, so it has no entry in this list. The streamer's
  # LUT modes and a worked example live in architecture/streamer/dds-goertzel.yaml.


memory_map:
  lut_space:
    start: "$200"
    end: "$3FF"
    size: "512 longs"
    
  special_regions:
    note: >-
      The LUT has NO hardware-defined regions -- all 512 longs are equivalent, and no
      Parallax source assigns any part of it a purpose. The partitioning below is an
      example convention a program may adopt, not a property of the silicon.
    example_partitioning:
      - region: "$200-$27F"
        description: "Example: sine/cosine table"
        size: "128 longs"
      - region: "$280-$2FF"
        description: "Example: FIFO buffer"
        size: "128 longs"
      - region: "$300-$3FF"
        description: "Example: general data storage"
        size: "256 longs"

programming_patterns:
  - pattern: "lookup_table"
    description: "Load a table from hub into the LUT, then read it with RDLUT"
    code: |
      ' Load 128 longs from hub into LUT[0..127]
              SETQ2   #128-1            ' number of longs, minus 1
              RDLONG  0, sine_table_ptr ' first LUT long is 0, not $200

      ' Use sine lookup
      get_sine
              AND     angle, #$7F       ' 0-127 index
              RDLUT   sine_val, angle   ' 3 clocks
              RET
  
  - pattern: "shared_data_exchange"
    description: >-
      Push data from one cog into its paired cog's LUT. Sharing is a WRITE path: the
      receiving cog enables it, and the sending cog's ordinary WRLUTs land in both LUTs.
      The receiver then reads its own LUT normally with RDLUT.
    code: |
      ' COG 1 (odd) -- receiver: accept writes from our paired cog
      cog1_code
              SETLUTS #1              ' Allow the paired cog to write our LUT
      .wait
              RDLUT   flag, #1        ' Read OUR OWN LUT[1]
              CMP     flag, #1 WZ
      IF_NZ   JMP     #.wait
              RDLUT   data, #0        ' Read the message the paired cog wrote

      ' COG 0 (even) -- sender: ordinary local LUT writes reach the paired cog
      cog0_code
              WRLUT   message, #0     ' Data first
              WRLUT   #1, #1          ' Then the flag

uses:
  source: >-
    P2 Datasheet 2022/11/01 "Lookup RAM" --
    engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:596-601.
  list:
    - use: "Scratch space"
      see: "this file -- RDLUT/WRLUT and the SETQ2 block transfer"
    - use: "Streamer access"
      see: "architecture/streamer/dds-goertzel.yaml"
    - use: "Bytecode execution lookup table"
      see: "architecture/xbyte_engine.yaml"
    - use: "Smart pin data source"
      see: "listed by the source; its mechanism is not described"
    - use: "Paired-Cog communication mechanism"
      see: "this file -- special_features LUT_sharing, LUT_events, pair_start"
    - use: "Code execution"
      see: "language/pasm2/concepts/execution_modes.yaml"

performance_characteristics:
  access_timing:
    read: "3 clock cycles"
    write: "2 clock cycles"
    block_transfer: "one long per clock via SETQ2 + RDLONG/WRLONG/WMLONG, unless the hub FIFO is accessing the same hub RAM slice on the same cycle"
    block_transfer_source: >-
      Propeller 2 Documentation v35 (Rev B/C) --
      engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:3257.
  
  comparison_to_hub:
    lut_read: "3 clocks fixed (RDLUT)"
    hub_read: "9...16 clocks in cogexec, 9...26 in hubexec (RDLONG), varying with hub alignment"
    advantage: "LUT read is fixed-latency; a hub long read is not"
    source: >-
      P2 Datasheet 2022/11/01 PASM2 instruction table --
      engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:2061 (RDLUT, 3)
      and :1831 (RDLONG, `9...16 / 9...26`).

limitations:
  - limitation: "size"
    description: "Limited to 512 longs per COG"
    workaround: "Use hub memory for larger tables"
  
  - limitation: "sharing_pairs"
    description: "Only adjacent even/odd COGs can share"
    workaround: "Use hub memory for broader sharing"
  
  - limitation: "no_byte_access"
    description: "Long-only access (32-bit)"
    workaround: "Pack bytes/words, use shift/mask"

debugging_considerations:
  - tip: "lut_dump"
    description: "Dump LUT contents to hub for examination"
    code: |
      SETQ2   #511            ' Dump all 512 longs
      WRLONG  0, dump_ptr     ' LUT[0..511] to hub (first LUT long is 0)
  
  - tip: "verify_sharing"
    description: "Test LUT write-sharing between paired COGs"
    code: |
      ' Receiving cog:  SETLUTS #1
      ' Sending cog:    WRLUT   ##$12345678, #0
      ' Receiving cog:  RDLUT   x, #0     -- its OWN LUT[0] should now hold $12345678

related:
  - language/pasm2/rdlut.yaml
  - language/pasm2/wrlut.yaml
  - language/pasm2/setluts.yaml
  - language/pasm2/setq2.yaml
  - language/pasm2/setse1.yaml
  - language/pasm2/coginit.yaml
  - language/pasm2/concepts/setq_block_ops.yaml
  - language/pasm2/concepts/execution_modes.yaml
  - language/spin2/constructs/inline_pasm.yaml
