concept: multi_resource_management
title: Single COG Managing Multiple Resources
category: architectural_pattern
description: Design pattern for a single COG managing multiple instances of the same resource type
documentation_level: comprehensive
source: "OBEX 4257 (ISP high-speed 8-port serial subsystem), as a worked design: one cog services 1 to 8 Tx/Rx smart-pin pairs, a pasm2 backend with spin2 interface routines, and its addPort, start and txStr interface (isp_octoport_serial.spin2: addPort(rxp, txp, mode, baudrate, txPullup), MODE_NONE = 0, pull-up options numbered PU_NONE, PU_1K5, PU_3K3, PU_15K from 0). P2 hardware verification, EF-120 (COGINIT(COGEXEC_NEW, ...) as an expression with all 8 cogs running returned $8000_000F, so the start test is < 0 or >= 0)"

overview: |
  A single COG manages multiple instances of the same resource type (for example, serial
  ports, SPI devices or PWM channels), holding per-resource configuration and state in hub
  arrays that its service loop walks.

architecture:
  key_components:
    - Resource configuration arrays
    - Round-robin or priority-based scheduling
    - Hub-COG communication structures
    - Per-resource state tracking
    - Circular buffer management
    
  memory_layout: |
    HUB RAM:
      - Configuration arrays (pins, modes, speeds)
      - Buffer arrays (one per resource)
      - Index/pointer arrays (head/tail for queues)
      - Status/error arrays (overflow, ready flags)
    
    COG RAM:
      - Cached configuration (block copied at start)
      - Working variables (current resource index)
      - Temporary buffers

implementation_patterns:
  configuration_structure:
    description: "Array-based configuration for systematic resource handling"
    code: |
      CON
        MAX_RESOURCES = 8
        BUFFER_SIZE = 32
      
      VAR
        ' Configuration arrays
        LONG pinInput[MAX_RESOURCES]
        LONG pinOutput[MAX_RESOURCES]
        LONG configuration[MAX_RESOURCES]
        
        ' Buffer management
        LONG pBuffers[MAX_RESOURCES]
        LONG headIndex[MAX_RESOURCES]
        LONG tailIndex[MAX_RESOURCES]
        
        ' Status tracking
        LONG errorFlags[MAX_RESOURCES]
        LONG activeCount
    
  round_robin_servicing:
    description: "PASM2 round-robin resource polling"
    code: |
      DAT
              org
      main_loop
              mov     index, #0
      .next
              ' Get resource configuration
              alts    index, #pin_array
              mov     current_pin, 0-0
              
              ' Check if resource needs service
              testb   current_pin, #31    wc  ' -1 = not used
      if_nc   call    #service_resource
              
              ' Next resource
              incmod  index, max_index    wc
      if_nc   jmp     #.next
              
              jmp     #main_loop
    
  hub_cog_transfer:
    description: "Start the driver cog with the hub address of the configuration in PTRA; the driver block-copies the configuration into cog RAM"
    code: |
      PUB start() : ok
        ' Start the driver cog; ok is true when a cog was started
        ok := coginit(COGEXEC_NEW, @driver, @activeCount) >= 0
      
      DAT
              org
      driver
              ' Block copy configuration from hub
              rdlong  count, ptra++
              setq    #CONFIG_LONGS-1
              rdlong  config_start, ptra

examples:
  serial_port_multiplexer:
    description: "8 serial ports managed by a single cog, through the object's interface"
    example: |
      OBJ
        serial : "isp_octoport_serial"
      
      PUB main() | port1, port2
        ' addPort(rxp, txp, mode, baudrate, txPullup): mode 0 is the object's MODE_NONE,
        ' pull-up 2 is the object's PU_3K3 -- both are constants of the object (serial.MODE_NONE, serial.PU_3K3)
        port1 := serial.addPort(RX1, TX1, 0, 115200, 2)
        port2 := serial.addPort(RX2, TX2, 0, 9600, 2)
        serial.start()
        
        serial.txStr(port1, string("Hello Port 1"))
        serial.txStr(port2, string("Hello Port 2"))
    
  multi_spi_manager:
    description: "Multiple SPI devices on shared bus"
    example: |
      ' Manage multiple chip selects
      repeat device from 0 to MAX_DEVICES-1
        if deviceActive[device]
          pinlow(chipSelect[device])
          sendSPI(deviceData[device])
          pinhigh(chipSelect[device])
    
  pwm_channel_controller:
    description: "Multiple PWM channels, each duty updated in a loop"
    example: |
      ' Update all PWM channels
      repeat channel from 0 to MAX_CHANNELS-1
        wypin(pwmPin[channel], dutyCycle[channel])

not_documented:
  - "Not documented: scheduling, timing, throughput or memory-cost figures for one cog servicing several resources, and any recommended structure beyond the examples above"

debugging_techniques:
  visualization: |
    ' Debug output showing resource activity
    PUB showStatus() | i
      repeat i from 0 to activeCount-1
        debug("Port ", udec(i), ": ")
        debug("RX=", udec(rxCount[i]), " ")
        debug("TX=", udec(txCount[i]), " ")
        debug("Err=", uhex(errorFlags[i]))

related_concepts:
  - circular_buffers: Buffer management for each resource
  - smart_pin_arrays: Hardware acceleration for I/O
  - hub_cog_communication: Efficient data transfer
  - round_robin_scheduling: Fair resource allocation
