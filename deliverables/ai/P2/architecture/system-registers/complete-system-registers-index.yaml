# Complete P2 System Registers Index
# Source: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), COG RAM, GENERAL PURPOSE REGISTERS
# Comprehensive reference for all P2 system registers


aliases:
  - "system registers"
  - "special purpose registers"
  - "register map"
  - "cog register map"
  - "system register index"

metadata:
  title: "P2 System Registers Complete Index"
  description: "All P2 system registers with addresses, functions, and key characteristics"
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), COGS, COG RAM"
  total_registers: "8 special-purpose ($1F8-$1FF) + 8 dual-purpose ($1F0-$1F7) + 496 general-purpose ($000-$1EF) = 512"
  per_register_files: >-
    This index carries the full content for every register it lists -- address, normal and
    special function, description, access, category and key features -- inline. It is
    self-sufficient; nothing here defers to a per-register file. Two per-register files
    exist alongside it (architecture/system-registers/ptra-register.yaml, architecture/system-registers/dira-dirb-registers.yaml) and are pointed to
    by `yaml_file:` where they do.

# Memory Map Overview
memory_regions:
  general_purpose:
    address_range: "$000-$1EF"
    count: 496
    description: "General-purpose RAM for code and data"
    access: "RAM registers for code and data usage"
    
  dual_purpose:
    address_range: "$1F0-$1F7"  
    count: 8
    description: "RAM that can also serve interrupt and call functions"
    access: "Standard RAM unless special functions enabled"
    
  special_purpose:
    address_range: "$1F8-$1FF"
    count: 8
    description: "Dedicated system registers with specific functions"
    access: "Special register functionality, not standard RAM"

# Dual-Purpose Registers ($1F0-$1F7)
dual_purpose_registers:
  "$1F0":
    normal_use: "General-purpose RAM"
    special_function: "IJMP3"
    description: "Interrupt call address for INT3"
    
  "$1F1":
    normal_use: "General-purpose RAM"
    special_function: "IRET3"
    description: "Interrupt return address for INT3"
    
  "$1F2":
    normal_use: "General-purpose RAM"
    special_function: "IJMP2"
    description: "Interrupt call address for INT2"
    
  "$1F3":
    normal_use: "General-purpose RAM"
    special_function: "IRET2"
    description: "Interrupt return address for INT2"
    
  "$1F4":
    normal_use: "General-purpose RAM" 
    special_function: "IJMP1"
    description: "Interrupt call address for INT1"
    
  "$1F5":
    normal_use: "General-purpose RAM"
    special_function: "IRET1"
    description: "Interrupt return address for INT1"
    
  "$1F6":
    normal_use: "General-purpose RAM"
    special_function: "PA"
    description: "CALLD-imm return, CALLPA parameter, or LOC address"
    source: >-
      Cell-identical in the three documents below.
      Parallax Propeller 2 Documentation v35 (Rev B/C silicon), COGS, COG RAM (Dual-Purpose Registers).
      Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, Dual-Purpose Registers, p.15.
      Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Register RAM, p.13.
    note: "PA holds the return address written by CALLD with an immediate operand, the parameter copied by CALLPA, or the address written by LOC."

  "$1F7":
    normal_use: "General-purpose RAM"
    special_function: "PB"
    description: "CALLD-imm return, CALLPB parameter, or LOC address"
    source: >-
      Cell-identical in the three documents below.
      Parallax Propeller 2 Documentation v35 (Rev B/C silicon), COGS, COG RAM (Dual-Purpose Registers).
      Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, Dual-Purpose Registers, p.15.
      Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Register RAM, p.13.
    note: "PB holds the return address written by CALLD with an immediate operand, the parameter copied by CALLPB, or the address written by LOC."

# Special-Purpose Registers ($1F8-$1FF)
special_purpose_registers:
  "$1F8":
    name: "PTRA"
    description: "Pointer A to hub RAM"
    access: "Read/Write"
    category: "hub_access"
    yaml_file: "architecture/system-registers/ptra-register.yaml"
    key_features:
      - "32-bit register holding a hub RAM address (hub address space is 20 bits)"
      - "Auto-increment/decrement support"
      - "Initialized by COGINIT SETQ value"
      - "Used with RDxxxx/WRxxxx instructions"
      
  "$1F9":
    name: "PTRB"
    description: "Pointer B to hub RAM"
    access: "Read/Write"
    category: "hub_access"
    key_features:
      - "32-bit register holding a hub RAM address (hub address space is 20 bits)"
      - "Auto-increment/decrement support"
      - "Initialized by COGINIT S operand"
      - "Used with RDxxxx/WRxxxx instructions"
      
  "$1FA":
    name: "DIRA"
    description: "Output enables for P31..P0"
    access: "Read/Write"
    category: "io_control"
    yaml_file: "architecture/system-registers/dira-dirb-registers.yaml"
    key_features:
      - "Controls output enable for pins P31-P0"
      - "1=output enabled, 0=input (float); DAC modes use DIR as 0: disable, 1: enable"
      - "Interacts with smart pin configuration"
      - "With all the cogs terminated, all I/O pin DIR bits are naturally low (input)"
      - "After a COGINIT with D[5] = 0 of a running cog, a stopped cog or the cog itself, the new program reads DIRA = 0, with DIRA bits set on P0..P2 beforehand"
      - "Not documented: the value after reset (while RESn is low the I/O pins are floating) or after a COGINIT with D[5] = 1. What COGINIT does to cog state, piece by piece, is in architecture/cog_state.yaml"

  "$1FB":
    name: "DIRB" 
    description: "Output enables for P63..P32"
    access: "Read/Write"
    category: "io_control"
    yaml_file: "architecture/system-registers/dira-dirb-registers.yaml"
    key_features:
      - "Controls output enable for pins P63-P32"
      - "1=output enabled, 0=input (float); DAC modes use DIR as 0: disable, 1: enable"
      - "Interacts with smart pin configuration"
      - "With all the cogs terminated, all I/O pin DIR bits are naturally low (input)"
      - "Not documented: the value after reset or COGINIT (while RESn is low the I/O pins are floating). What COGINIT does to cog state, piece by piece, is in architecture/cog_state.yaml"

  "$1FC":
    name: "OUTA"
    description: "Output states for P31..P0"
    access: "Read/Write"
    category: "io_control"
    key_features:
      - "Output logic levels for pins P31-P0"
      - "1=high output, 0=low output"
      - "Only effective when DIRA bits set"
      - "Can be overridden by smart pins"
      
  "$1FD":
    name: "OUTB"
    description: "Output states for P63..P32"
    access: "Read/Write" 
    category: "io_control"
    key_features:
      - "Output logic levels for pins P63-P32"
      - "1=high output, 0=low output"  
      - "Only effective when DIRB bits set"
      - "Can be overridden by smart pins"
      
  "$1FE":
    name: "INA"
    description: "Input states for P31..P0"
    access: "Read Only"
    category: "io_status"
    special_mode: "Becomes IJMP0 (R/W) during debug ISR"
    key_features:
      - "Read pin states P31-P0"
      - "In smart pin modes the IN bit is a flag that the smart pin has completed some function or an event has occurred"
      - "Debug ISR transforms to IJMP0"
      
  "$1FF":
    name: "INB"
    description: "Input states for P63..P32"
    access: "Read Only"
    category: "io_status"
    special_mode: "Becomes IRET0 (R/W) during debug ISR"
    key_features:
      - "Read pin states P63-P32"
      - "In smart pin modes the IN bit is a flag that the smart pin has completed some function or an event has occurred"
      - "Debug ISR transforms to IRET0"

# Register Categories
register_categories:
  hub_access:
    description: "Registers for accessing hub RAM"
    registers: ["PTRA", "PTRB"]
    key_functions:
      - "Hub memory addressing"
      - "Auto-increment/decrement"
      - "Parameter passing via COGINIT"
      
  io_control:
    description: "Registers for controlling I/O pins"
    registers: ["DIRA", "DIRB", "OUTA", "OUTB"]
    key_functions:
      - "Pin direction control"
      - "Output state control"
      - "Smart pin interaction"
      
  io_status:
    description: "Registers for reading I/O pin states"
    registers: ["INA", "INB"]
    key_functions:
      - "Pin state reading"
      - "Input monitoring"
      - "Debug ISR transformation"
      
  interrupt_support:
    description: "Dual-purpose registers supporting interrupts"
    registers: ["IJMP1-3", "IRET1-3"]
    key_functions:
      - "Interrupt vector storage"
      - "Return address storage"

  call_support:
    description: "Dual-purpose registers supporting calls"
    registers: ["PA", "PB"]
    key_functions:
      - "CALLD-immediate return address"
      - "CALLPA and CALLPB parameter"
      - "LOC address storage"

# Special Behaviors and Modes
special_behaviors:
  debug_isr_overlay:
    affected_registers: ["INA", "INB"]
    transformation:
      ina_to_ijmp0: "INA ($1FE) becomes IJMP0 (R/W) for debug ISR jump address"
      inb_to_iret0: "INB ($1FF) becomes IRET0 (R/W) for debug ISR return address"
    initialization: "IJMP0 initialized to $1F8 on COGINIT (debug-ISR-entry routine)"
    
  execute_only_rom:
    address_range: "$1F8-$1FF"
    description: "Contains debug ISR entry/exit routines"
    dual_purpose: "The same addresses serve as special registers and as the execute-only ROM routines"
    entry_point: "The debug-ISR-entry routine at $1F8 saves registers $000..$00F to hub RAM, loads a program into them from hub RAM, and jumps to $000"
    
  coginit_initialization:
    ptra_init: "Gets SETQ value if present, else cleared to 0"
    ptrb_init: "Gets the S operand of COGINIT (Parallax's documents differ on whether all 32 bits or S[19:0] are written)"
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), STARTING AND STOPPING COGS (S, all 32 bits, is written into PTRB); Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Hub Control instructions, p.41 (S[19:0] sets the hub startup address and PTRB of the cog); dir_state and out_state: P2 hardware verification, EF-113 (DIR %011 and OUT %101 on P0..P2, COGINIT with D[5] = 0 of a running cog, a stopped cog and itself, one part)"
    dir_state: "After a COGINIT with D[5] = 0 of a running cog, a stopped cog or the cog itself, the new program reads DIRA = 0, with DIRA bits set on P0..P2 beforehand. Not documented: DIRB after COGINIT, and DIRA or DIRB after a COGINIT with D[5] = 1"
    out_state: "After a COGINIT with D[5] = 0 of a running cog, a stopped cog or the cog itself, the new program reads OUTA = 0, with OUTA bits set on P0..P2 beforehand. Not documented: OUTB after COGINIT, and OUTA or OUTB after a COGINIT with D[5] = 1"
    full_cog_state: "What COGINIT does to each piece of cog state is in architecture/cog_state.yaml"

# Access Patterns and Usage
access_patterns:
  direct_addressing:
    examples:
      - "MOV $1F8, ##$3000  ' Same as MOV PTRA, ##$3000"
      - "MOV result, $1FE   ' Same as MOV result, INA"

  symbolic_addressing:
    examples:
      - "MOV PTRA, ##buffer_address"
      - "MOV DIRA, ##pin_mask"

  bit_manipulation:
    examples:
      - "OR DIRA, ##%00001111     ' Set P3-P0 as outputs"
      - "ANDN OUTB, ##%00001111   ' Clear P35-P32 outputs"

# Register Interactions
register_interactions:
  dir_out_relationship:
    dependency: "OUT register values only drive pins when corresponding DIR bit = 1"
    floating: "DIR = 0: input (float); DIR = 1: output (drive)"

  smart_pin_override:
    dir_override: "In smart pin modes the DIR bit is used as an active-low reset signal to the smart pin circuitry, while the output enable state is controlled by a configuration bit; while a smart pin is configured, the %TT bits govern the pin's output enable regardless of the DIR state"
    out_override: "In some smart pin modes the smart pin takes over driving the output state, in which case the OUT bit is ignored"
    coordination: "Configure smart pins while DIR = 0"
    
  ptr_instruction_synergy:
    rd_instructions: "RDxxxx instructions use PTRA/PTRB for addressing"
    wr_instructions: "WRxxxx instructions use PTRA/PTRB for addressing"
    auto_increment: "A PTRx expression can add to or subtract from PTRx as part of the access (PTRx++, PTRx--, ++PTRx, --PTRx)"

# Performance Considerations
performance_notes:
  hub_access_timing: "PTRA/PTRB hub access follows hub timing rules: from cog-exec code a hub read (RDLONG) takes 9...16 clocks and a hub write (WRLONG) 3...10 clocks, depending on when the cog's hub slot arrives"
  io_update_timing: "When a DIRx/OUTx bit is changed by any instruction, it takes three additional clocks after the instruction before the pin starts transitioning to the new state"
  in_read_timing: "When an INx register is read by an instruction, it reflects the state of the pins registered three clocks before the start of the instruction; TESTP/TESTPN reflect the state registered two clocks before the start of the instruction"
  source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, I/O pin timing, p.22; P2 Instructions v35 - Rev B/C Silicon, Sheet1 (RDLONG and WRLONG rows)"

# Common Usage Patterns
usage_patterns:
  memory_operations:
    pattern: "A PTRA++ expression uses PTRA, then adds the access size to PTRA"
    example: "RDLONG data, PTRA++  ' Read and advance pointer"

  io_initialization:
    pattern: "DIRA and OUTA written as whole registers"
    example: |
      MOV DIRA, pin_mask
      MOV OUTA, initial_states

  pin_manipulation:
    pattern: "An OR with a bit mask sets individual DIR bits and leaves the others unchanged"
    example: "OR DIRA, pin_bit  ' Enable output for one pin"

  parameter_passing:
    pattern: "A SETQ before COGINIT writes its value into the target cog's PTRA"
    example: |
      SETQ ##params
      COGINIT #cog, ##entry

see_also:
  - "Hub Memory Access Instructions"
  - "I/O Pin Control Instructions"
  - "Interrupt System"
  - "Smart Pin Configuration"
  - "COGINIT Parameter Passing"
  - "Debug ISR System"
  - "architecture/cog_state.yaml"

source:
  document: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), COGS, COG RAM (Dual-Purpose Registers and Special-Purpose Registers), RANDOM ACCESS INTERFACE (PTRx expressions), DEBUG INTERRUPT, SMART PINS (the IN bit; %TT); Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, Shutdown, p.12 (DIR bits with all the cogs terminated)"

hub_symbols: "Fragments here that use a hub symbol as an immediate assume a PASM-only file, where hub addresses are absolute. In a Spin2 object, DAT hub addresses are relative to the object: see language/spin2/integration/spin2-pasm2-integration.yaml hub_address_resolution."