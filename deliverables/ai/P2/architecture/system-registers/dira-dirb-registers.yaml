# DIRA/DIRB Registers - I/O Pin Direction Control
# Source: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), COG RAM, GENERAL PURPOSE REGISTERS


aliases:
  - "DIRA"
  - "DIRB"
  - "direction registers"
  - "pin direction registers"
  - "DIRA/DIRB"

registers:
  dira:
    name: "DIRA" 
    address: "$1FA"
    description: "Output enables for P31..P0"
    pin_range: "P31 to P0 (32 pins)"
    
  dirb:
    name: "DIRB"
    address: "$1FB" 
    description: "Output enables for P63..P32"
    pin_range: "P63 to P32 (32 pins)"

bit_width: 32
category: "special_purpose"
access_type: "read_write"

description: "Direction control registers that enable/disable output drivers for all 64 I/O pins"

functionality:
  bit_mapping:
    dira_bits: "Each bit controls one pin: bit 0 = P0, bit 1 = P1, ..., bit 31 = P31"
    dirb_bits: "Each bit controls one pin: bit 0 = P32, bit 1 = P33, ..., bit 31 = P63"
    
  bit_states:
    high_state: "DIR = 1: output (drive)"
    low_state: "DIR = 0: input (float)"
    dac_exception: "DAC modes use DIR as 0: disable, 1: enable"
    
  pin_control:
    output_enable: "Set corresponding DIR bit to 1"
    input_enable: "Set corresponding DIR bit to 0"
    mixed_modes: "Different pins can have different directions simultaneously"

smart_pin_interaction:
  normal_pins: "DIR bit controls output enable normally" 
  smart_pins: "Smart pin %TT bits can override DIR control"
  smart_pin_modes: "In smart pin modes the DIR bit is used as an active-low reset signal to the smart pin circuitry, while the output enable state is controlled by a configuration bit (the %TT bits govern the pin's output enable regardless of the DIR state)"
  reset_requirement: "Smart pins should be configured while DIR=0"

instruction_access:
  direct_bit_ops:
    set_output: "DRVH #pin_num (sets DIR bit and drives high)"
    drive_low: "DRVL #pin_num (sets DIR bit and drives low)"
    set_input: "DIRL #pin_num (clears DIR bit: pin becomes an input)"
    float_pin: "FLTL #pin_num (OUT bit = 0 and DIR bit = 0: the pin floats)"
    
  register_ops:
    read_dira: "MOV result, DIRA"
    write_dira: "MOV DIRA, ##$FFFF_FFFF"
    bit_operations: "ANDN DIRA, pin_mask (clear specific bits)"

usage_patterns:
  all_outputs:
    code: |
      MOV     DIRA, ##$FFFF_FFFF    ' All P31..P0 as outputs
      MOV     DIRB, ##$FFFF_FFFF    ' All P63..P32 as outputs
    description: "Configure all pins as outputs"
    
  selective_outputs:
    code: |
      MOV     DIRA, ##%00000111     ' P2, P1, P0 as outputs
      MOV     DIRB, #0              ' All P63..P32 as inputs
    description: "Mixed I/O configuration"
    
  pin_manipulation:
    code: |
      DRVH    #5                    ' Set P5 as output, drive high
      DRVL    #10                   ' Set P10 as output, drive low  
      FLTL    #15                   ' Float P15 (OUT and DIR bits cleared)
    description: "Individual pin direction control"

bit_operations:
  set_multiple_outputs:
    code: |
      OR      DIRA, ##%11110000     ' Set P7..P4 as outputs
    description: "Set specific pins as outputs"
    
  clear_multiple_outputs:
    code: |
      ANDN    DIRA, ##%11110000     ' Set P7..P4 as inputs
    description: "Set specific pins as inputs"
    
  toggle_direction:
    code: |
      XOR     DIRA, ##%00000001     ' Toggle P0 direction
    description: "Toggle pin direction"

power_considerations:
  input_mode: "DIR = 0: input (float)"
  pin_current: "Max. allowable current per I/O pin: +/-30 mA. Vol (VDD = 3.3 V): 15 mV sinking 1 mA, 160 mV sinking 10 mA, 510 mV sinking 30 mA. Voh relative to Vxxyy: -6 mV sourcing 1 mA, -170 mV sourcing 10 mA, -580 mV sourcing 30 mA"
  input_leakage: "Iil, IO pin Vin = GND or Vio: +/-0.1 uA typical, +/-10 uA maximum"
  source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Pin Mode table (DIR), p.24; DC Characteristics, pp.47-48"

initialization:
  power_on_reset: "While RESn is low, all cogs are disabled and the I/O pins are floating. Not documented: the state of the DIR bits after reset"
  all_cogs_terminated: "With all the cogs terminated, all I/O pin DIR bits are naturally low (input)"
  cog_start: "After a COGINIT with D[5] = 0 of a running cog, a stopped cog or the cog itself, the new program reads DIRA = 0, with DIRA bits set on P0..P2 beforehand. Not documented: DIRB after COGINIT, and DIRA or DIRB after a COGINIT with D[5] = 1. What COGINIT does to cog state, piece by piece, is in architecture/cog_state.yaml"

safety_considerations:
  electrical_limits: "Absolute maximum ratings: voltage on Vxxyy -0.3 V to +4.0 V; voltage on all other pins -0.3 V to (Vxxyy + 0.3 V); max. allowable current per I/O pin +/-30 mA; max DC current into an input pin with its internal protection diode forward biased +/-10 mA; total power dissipation 2.5 W; ESD Human Body Model 4 kV, Charged Device Model 1 kV. VIO supply voltage Vxxyy 3.15 V min, 3.3 V typ, 3.45 V max"
  source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Absolute Maximum Ratings, p.47; DC Characteristics, p.47"

examples:
  led_control:
    code: |
      MOV     DIRA, ##%11111111     ' P7..P0 as outputs for LEDs
      MOV     OUTA, ##%10101010     ' Set initial LED pattern
    description: "LED array control"
    
  serial_communication:
    code: |
      OR      DIRA, ##%00000010     ' P1 as output
      ANDN    DIRA, ##%00000001     ' P0 as input
    description: "One pin as an output and one as an input"

related_registers:
  outa_outb: "Output state registers (what gets driven when DIR=1)"
  ina_inb: "Input state registers (read pin states)"
  smart_pin_config: "Smart pin configuration affects DIR behavior"

see_also:
  - "OUTA/OUTB Output State Registers"
  - "INA/INB Input State Registers"
  - "Smart Pin Configuration"
  - "Pin driving instructions (DRVH/DRVL/FLTL)"
  - "architecture/cog_state.yaml"

source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), COGS, COG RAM (Special-Purpose Registers); Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, Shutdown, p.12 (DIR bits with all the cogs terminated); P2 hardware verification, EF-113 (DIR %011 on P0..P2, COGINIT with D[5] = 0 of a running cog, a stopped cog and itself, one part)"