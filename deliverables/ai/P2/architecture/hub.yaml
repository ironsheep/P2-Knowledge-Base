  cogs: "Eight processors sharing hub"
  fifo: "Streaming interface to hub"
  locks: "Synchronization primitives"
  smart_pins: "A smart pin in a long repository mode (%00001..%00011) holds a long that a cog writes with WXPIN and reads with RDPIN or RQPIN"
  architecture/streamer/overview.yaml: "Background transfers from hub RAM to pins/DACs, or from pins/ADCs to hub RAM"

