# P2 COG Attention System
# Provenance (re-derived 2026-08-26; the previous header cited a file that has
# never existed and a datasheet page beyond the end of a 50-page datasheet):
#   Propeller 2 Documentation v35 (Rev B/C Silicon), section COG ATTENTION --
#     engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:2013-2033
#   Event numbering, same document, section EVENTS --
#     engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:2053 (Event 14 = ATN)
#   Instruction encodings, same document, PASM2 encoding table --
#     silicon-doc-text.txt:5351 (COGATN), :5283 (POLLATN), :5300 (WAITATN),
#     :5181 (JATN), :5198 (JNATN), :5234 (COGID)
#   P2X8C4M64P Datasheet 2022/11/01, "Cog Attention" p.15-16 --
#     engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:681-695
#     and the PASM2 instruction table -- p2-datasheet-text.txt:1854, :1893, :1914

component_name: "COG Attention System"

component_type: "inter_cog_signaling"

description: |
  The COG Attention (ATN) system provides a lightweight inter-COG signaling mechanism
  that allows any COG to signal any combination of other COGs simultaneously. Each COG
  has an attention flag that can be set by other COGs and monitored via polling, waiting,
  or interrupt triggering. This creates an efficient broadcast or multicast signaling
  system without consuming hub bandwidth.

architecture:
  signal_matrix: "8×8 (any COG to any COGs)"
  operand_field: >-
    COGATN's D operand carries the cog-select bit pattern; bit N selects cog N. The P2
    Datasheet describes the lower 8 bits and a composite set of 8 strobes
    (engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:682-692), which is
    the shape the eight physical cogs use.
  
  attention_flags:
    per_cog: 1
    states: ["clear", "set"]
    
  signaling_modes:
    - mode: "unicast"
      description: "Signal single specific COG"
      example: "COG 0 signals COG 5"
    
    - mode: "multicast"
      description: "Signal multiple specific COGs"
      example: "COG 0 signals COGs 2, 4, and 6"
    
    - mode: "broadcast"
      description: "Signal all other COGs"
      example: "COG 0 signals COGs 1-7"
    
    - mode: "self_signal"
      description: "COG can signal itself"
      example: "COG 3 signals COG 3"
  
  response_methods:
    - method: "polling"
      description: "Check ATN flag periodically"
      latency: "Depends on polling frequency"
    
    - method: "waiting"
      description: "Wait for ATN flag to be set"
      latency: "Immediate response"
    
    - method: "interrupt"
      description: "Trigger interrupt on ATN"
      latency: "Silicon Doc v35 INTERRUPTS section describes the dispatch mechanism (interrupt branches realized by inserting a 'CALLD IRETx,IJMPx WCZ' into the instruction pipeline) but does not publish a specific clock-count latency. We do not publish a number here because we do not have a verifiable measurement."

instructions:
  - instruction: "COGATN"
    encoding: "EEEE 1101011 00L DDDDDDDDD 000111111"
    description: "Strobe the attention signal of the cog(s) selected by D"
    source: >-
      Propeller 2 Documentation v35 (Rev B/C), COG ATTENTION --
      engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:2017, :2020;
      encoding at silicon-doc-text.txt:5351; P2 Datasheet 2022/11/01 "Cog Attention" --
      engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:682-692.
    operation: |
      FOR each set bit N in D:
        strobe cog N's attention signal
      The receiving cog latches the strobe, setting its attention event flag.
      The attention strobe outputs of all cogs are OR'd together into one
      composite set of strobes, from which each cog receives its own.
      Multiple cogs can be signalled by one COGATN.
    timing: "2 clocks"
    usage_example: |
      COGATN  #%00000010      ' Signal COG 1
      COGATN  #%11111110      ' Signal COGs 1-7
      COGATN  cog_mask        ' Signal COGs in mask
  
  - instruction: "POLLATN"
    encoding: "EEEE 1101011 CZ0 000001110 000100100"
    description: "Get the attention-requested event flag into C and/or Z, then clear it"
    source: >-
      Propeller 2 Documentation v35 (Rev B/C), EVENTS --
      engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:2061, :2078, :2200-2204;
      encoding at silicon-doc-text.txt:5283; P2 Datasheet 2022/11/01 PASM2 table --
      engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:1893.
    operation: |
      C and/or Z := attention-requested event flag (per WC / WZ / WCZ)
      The event flag is then cleared, unless the event sensor is setting it again
      on the same clock.
    flags_affected: "C and/or Z = attention-requested event flag"
    timing: "2 clocks"
    usage_example: |
      POLLATN WC              ' Check and clear ATN
      IF_C    JMP #handle_atn ' Jump if attention set
  
  - instruction: "WAITATN"
    encoding: "EEEE 1101011 CZ0 000011110 000100100"
    description: "Wait for the attention-requested event flag, then clear it"
    source: >-
      Propeller 2 Documentation v35 (Rev B/C), EVENTS --
      engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:2082, :2100;
      encoding at silicon-doc-text.txt:5300; P2 Datasheet 2022/11/01 PASM2 table --
      engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:1914.
    operation: |
      Wait until the attention-requested event flag is set (it may already be),
      then clear it, unless the event sensor is setting it again on the same clock.
      A SETQ executed immediately before WAITATN supplies a future CT target that
      ends the wait early; with 'WAITATN WC', C is set if that timeout occurred
      before the event.
    timing: "2+ clocks (waits for the event)"
    usage_example: |
      WAITATN                 ' Wait for attention
      ' Attention received, continue execution
  
  - instruction: "JATN"
    encoding: "EEEE 1011110 01I 000001110 SSSSSSSSS"
    description: "Jump to S/# if the attention-requested event flag is set"
    source: >-
      Propeller 2 Documentation v35 (Rev B/C), COG ATTENTION --
      engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:2028; EVENTS --
      silicon-doc-text.txt:2104, :2120; encoding at silicon-doc-text.txt:5181.
    operation: |
      IF attention-requested event flag is set THEN jump to S/#
      The flag is cleared whether or not the branch is taken, unless the event
      sensor is setting it again on the same clock.
    usage_example: |
      JATN    #handle_atn     ' Branch if attention has been requested

  - instruction: "JNATN"
    encoding: "EEEE 1011110 01I 000011110 SSSSSSSSS"
    description: "Jump to S/# if the attention-requested event flag is clear"
    source: >-
      Propeller 2 Documentation v35 (Rev B/C), COG ATTENTION --
      engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:2030; EVENTS --
      silicon-doc-text.txt:2104, :2120; encoding at silicon-doc-text.txt:5198.
    usage_example: |
      JNATN   #keep_working   ' Branch if no attention has been requested

  - instruction: "COGID"
    encoding: "EEEE 1101011 C0L DDDDDDDDD 000000001"
    description: >-
      Write this cog's ID into D (D a register, WC omitted), or with WC report whether
      the cog selected by D[2:0] is running.
    source: >-
      Propeller 2 Documentation v35 (Rev B/C), PASM2 encoding table --
      engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:5234; and this
      knowledge base's own language/pasm2/cogid.yaml.
    flags_affected: "C (with WC) = 1 if the D[2:0] cog is running, 0 if stopped"
    timing: "2 clocks"
    usage_example: |
      COGID   my_id           ' Get own cog ID into my_id

event_configuration:
  attention_event:
    event_number: 14
    source: >-
      Propeller 2 Documentation v35 (Rev B/C), EVENTS -- "Event 14 = Attention was
      requested by another cog or other cogs",
      engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:2053; and the
      INTERRUPTS event-source table, silicon-doc-text.txt:2290. Event 15 is
      GETQX/GETQY-with-no-CORDIC-result, not attention.
    trigger: "An attention strobe from another cog sets this cog's ATN event flag"
    
    setup_for_interrupt: |
      ' Configure ATN to trigger interrupt
      MOV     IJMP1, #atn_handler  ' Set ISR address
      SETINT1 #14                  ' INT1 event source 14 = attention requested
      
      atn_handler:
          ' Handle attention signal
          ' ATN flag auto-cleared by WAITATN
          RETI1
    
    setup_for_event: >-
      Attention is NOT one of the events SETSE1..4 can select. SETSEn selects LUT
      read/write events, hub-lock events, and pin rise/fall/change/high/low events only
      (engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:2246-2260).
      Attention is tracked as event 14 in its own right and is reached with
      POLLATN / WAITATN / JATN / JNATN, or as interrupt source 14 via SETINTx.

programming_patterns:
  - pattern: "master_slave_coordination"
    description: "Master COG coordinates slave COGs"
    code: |
      ' Master COG
      master:
          ' Signal all slaves to start
          COGATN  #%11111110      ' Signal COGs 1-7
          
          ' Do master work...
          
          ' Signal specific slave
          COGATN  #%00000100      ' Signal COG 2 only
      
      ' Slave COG
      slave:
          WAITATN                 ' Wait for start signal
          ' Begin slave operation
          
      .loop:
          ' Do work...
          POLLATN WC              ' Check for new command
          IF_C    JMP #new_command
          JMP     #.loop
  
  - pattern: "broadcast_synchronization"
    description: "Synchronize multiple COGs"
    code: |
      ' Synchronization point
      sync_point:
          COGID   my_id
          ' All COGs signal readiness
          MOV     mask, #1
          SHL     mask, my_id
          COGATN  #%11111111      ' Signal all COGs
          
          ' Wait for all COGs to be ready
          MOV     count, #7       ' Wait for 7 signals
      .wait_all:
          WAITATN                 ' Wait for each COG
          DJNZ    count, #.wait_all
          
          ' All COGs now synchronized
  
  - pattern: "producer_consumer_signaling"
    description: "Producer signals consumer when data ready"
    code: |
      ' Producer COG
      producer:
          ' Produce data
          WRLONG  data, buffer_ptr
          ADD     buffer_ptr, #4
          
          ' Signal consumer
          COGATN  consumer_mask   ' Signal consumer COG(s)
      
      ' Consumer COG
      consumer:
          WAITATN                 ' Wait for data signal
          RDLONG  data, buffer_ptr
          ADD     buffer_ptr, #4
          ' Process data
  
  - pattern: "interrupt_driven_attention"
    description: "Handle attention via interrupt"
    code: |
      ' Setup attention interrupt
              MOV     IJMP3, #atn_isr
              SETINT3 #14             ' INT3 event source 14 = attention requested
              
      ' Main code continues normally
      main_loop:
              ' Regular processing
              JMP     #main_loop
              
      ' Attention handler
      atn_isr:
              ' High-priority attention handling
              RDLONG  command, mailbox
              ' Process command
              WRLONG  result, mailbox+4
              RETI3

  - pattern: "selective_multicast"
    description: "Signal specific group of COGs"
    code: |
      ' Define COG groups
      GROUP_A = %00001111     ' COGs 0-3
      GROUP_B = %11110000     ' COGs 4-7
      ALL_COGS = %11111111    ' All COGs
      
      ' Signal specific group
      signal_group:
              COGATN  #GROUP_A        ' Signal group A
              ' or
              COGATN  #GROUP_B        ' Signal group B
              ' or
              COGATN  #ALL_COGS       ' Broadcast

common_applications:
  - application: "task_dispatch"
    description: "Central dispatcher signals worker COGs"
    complexity: "intermediate"
    example: |
      ' Dispatcher finds idle worker and assigns task
      dispatcher:
          RDLONG  task, task_queue
          COGATN  idle_worker_mask
  
  - application: "barrier_synchronization"
    description: "Multiple COGs reach synchronization barrier"
    complexity: "intermediate"
    example: |
      ' Each COG signals when reaching barrier
      ' Waits for all others before proceeding
  
  - application: "event_notification"
    description: "Notify COGs of system events"
    complexity: "beginner"
    example: |
      ' Any COG can signal system event
      COGATN  #%11111111      ' Notify all COGs
  
  - application: "shutdown_coordination"
    description: "Coordinate orderly system shutdown"
    complexity: "advanced"
    example: |
      ' Master signals shutdown
      ' Each COG acknowledges and cleans up

best_practices:
  - practice: "clear_after_check"
    description: "Always use WC with POLLATN to auto-clear"
    rationale: "Prevents missing subsequent signals"
  
  - practice: "avoid_polling_loops"
    description: "Use WAITATN or interrupts instead of tight polling"
    rationale: "Reduces power consumption and hub congestion"
  
  - practice: "document_signal_meanings"
    description: "Clearly define what each ATN signal means"
    rationale: "Prevents confusion in multi-COG systems"
  
  - practice: "use_with_mailboxes"
    description: "Combine ATN with hub mailboxes for rich communication"
    rationale: "ATN for notification, mailbox for data"

performance_characteristics:
  signaling_latency: "2 clock cycles to set flags"
  
  response_latency:
    polling: "Varies with polling frequency"
    waiting: "0 clocks after signal arrives"
    interrupt: "Silicon Doc v35 does not publish a specific clock-count latency for ATN-triggered interrupt entry. Mechanism is documented (CALLD insertion into pipeline) but timing is not."
  
  bandwidth_impact: "Zero hub bandwidth consumed"
  
  scalability:
    simultaneous_signals: "All 8 COGs can signal simultaneously"
    no_collision: "Hardware manages all signals independently"

comparison_to_alternatives:
  vs_hub_polling:
    attention: "No hub bandwidth, instant notification"
    hub_polling: "Consumes hub slots, variable latency"
  
  vs_locks:
    attention: "Signaling only, no mutual exclusion"
    locks: "Mutual exclusion, heavier weight"
  
  vs_events:
    attention: "Simple boolean flag per COG"
    events: "Rich event types with parameters"

limitations:
  - limitation: "single_bit_signal"
    description: "Only indicates attention needed, no data"
    workaround: "Combine with hub mailbox for data transfer"
  
  - limitation: "no_queuing"
    description: "Multiple signals merge into single flag"
    workaround: "Use counter in hub memory if needed"
  
  - limitation: "no_source_identification"
    description: "Cannot tell which COG sent signal"
    workaround: "Use hub mailbox to identify sender"

debugging_tips:
  - tip: "trace_attention_signals"
    description: "Log ATN signals to hub memory"
    code: |
      POLLATN WC
      IF_C    WRLONG  cnt, atn_log_ptr
      IF_C    ADD     atn_log_ptr, #4
  
  - tip: "verify_cog_masks"
    description: "Test signal masks before deployment"
    importance: "Ensures correct COG targeting"

related_topics:
  - topic: "interrupts"
    relationship: "ATN can trigger interrupts via event system"
  
  - topic: "events"
    relationship: "ATN is event source 14"
  
  - topic: "hub_mailboxes"
    relationship: "Often paired with ATN for data transfer"
  
  - topic: "locks"
    relationship: "Can use with locks for complex synchronization"

extraction_metadata:
  source_documents:
    - document: "Propeller 2 Documentation v35 (Rev B/C Silicon)"
      path: "engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt"
      sections:
        - "COG ATTENTION -- lines 2013-2033"
        - "EVENTS, event numbering and POLL/WAIT/J flag rules -- lines 2037-2260"
        - "PASM2 encoding table -- lines 5181, 5198, 5234, 5283, 5300, 5351"
    - document: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01"
      path: "engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt"
      sections:
        - "Cog Attention, p.15-16 -- lines 681-695"
        - "PASM2 instruction table -- lines 1854, 1893, 1914"
  re_derivation_note: >-
    Re-derived 2026-08-26 under F-359. The header this file shipped with cited
    `part1-cog.txt` (a file that has never existed) and datasheet page 73 (the datasheet
    is 50 pages). Corrected in this pass: all three attention-instruction encodings; the
    attention event number (was 15, is 14) and the two SETINTx examples that used it; a
    `setup_for_event` block configuring SETSE1 for attention, which SETSEn cannot select;
    and the COGID entry, which carried a wrong encoding and claimed C=0 always. The
    fabricated mnemonic RDCOGID was removed -- it is in no Parallax source, in no other
    file of this knowledge base, and pnut-ts does not accept it as an instruction.