# P2 Interrupt System
# Sources:
#   Parallax Propeller 2 Documentation v35 (Rev B/C silicon), section INTERRUPTS
#     (event-source table; IJMPx/IRETx map; RETIx/RESIx aliases; deferral
#     conditions; dispatch mechanism)
#   Instruction encodings, same document, Assembly Language (instruction encodings:
#     ALLOWI/STALLI/TRGINTx/NIXINTx/SETINTx, and the RESIx/RETIx alias definitions)
#   Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01 -- the datasheet has NO
#     interrupt section; it carries the IJMPx/IRETx register rows (Special-purpose
#     registers) and the interrupt instructions in the PASM2 table

component_name: "Interrupt System"

component_type: "hardware_interrupt_controller"

aliases:
  - "interrupts"
  - "interrupt priority"
  - "interrupt priority levels"
  - "interrupt sources"
  - "interrupt event sources"
  - "interrupt latency"
  - "interrupt rate"
  - "INT1 INT2 INT3"
  - "IJMP1 IJMP2 IJMP3"
  - "IRET1 IRET2 IRET3"
  - "interrupt jump address"
  - "interrupt service routine"
  - "ISR"
  - "return from interrupt"
  - "interrupt return"
  - "nested interrupts"
  - "interrupt nesting depth"
  - "same level interrupt events ignored"
  - "interrupt branch deferral"
  - "stall interrupts"
  - "critical section"
  - "software interrupt trigger"
  - "cancel a pending interrupt"
  - "timer interrupt"
  - "pin change interrupt"
  - "what is saved on interrupt"

description: |
  Each cog has three interrupts, INT1, INT2 and INT3, where INT1 has the
  highest priority, INT2 the middle priority and INT3 the lowest, and a fourth, hidden debug interrupt that has priority over all of them. Each
  of INT1..INT3 takes its event from one of 16 sources selected by SETINTx, and
  has its own IJMPx/IRETx register pair: the interrupt jumps to where IJMPx
  points and stores the C/Z flags and return address in IRETx. See
  automatic_state_save below for what the interrupt branch writes.

architecture:
  interrupt_levels: 3
  debug_interrupt: 1
  
  priority_scheme:
    highest: "Debug interrupt (special)"
    level_1: "Interrupt 1 (highest normal priority)"
    level_2: "Interrupt 2 (medium priority)"
    level_3: "Interrupt 3 (lowest normal priority)"
    lowest: "Main code (non-interrupt)"
  
  automatic_state_save:
    description: >-
      An interrupt branch is realised by inserting a
      'CALLD IRETx,IJMPx WCZ' into the instruction pipeline. That CALLD writes the
      return address and the C and Z flags into the level's dedicated IRETx register.
      Not documented: any other automatic save of registers (PA, PB, PTRA, PTRB or
      general registers).
    saved_automatically:
      - "Return address -- into IRETx"
      - "C and Z flags -- into IRETx (the CALLD carries WCZ)"
    source: >-
      Parallax Propeller 2 Documentation v35 (Rev B/C silicon), INTERRUPTS.
    context_switch_time: "Not documented: a clock count for the interrupt branch. IJMPx/IRETx are dedicated registers."
  
  interrupt_sources:
    total_sources: 16
    selection: "A 4-bit pattern, 0..15, written by SETINT1 / SETINT2 / SETINT3"
    source: >-
      Parallax Propeller 2 Documentation v35 (Rev B/C silicon), INTERRUPTS -- the sixteen
      interrupt event sources. The full list is in `interrupt_sources_detail` below.
    source_types:
      - type: "off"
        sources: ["0 = <off>"]
        description: "Default on cog start for all three levels"
      
      - type: "timer"
        sources: ["1 = CT-passed-CT1", "2 = CT-passed-CT2", "3 = CT-passed-CT3"]
        description: "Free-running counter comparisons, established by ADDCT1/2/3"
      
      - type: "selectable_events"
        sources: ["4 = SE1", "5 = SE2", "6 = SE3", "7 = SE4"]
        description: >-
          The four per-cog selectable events, established by SETSE1..4 -- each may be a
          LUT read/write, a hub-lock transition, or a pin rise/fall/change/high/low
      
      - type: "pin_pattern"
        sources: ["8 = pin pattern match or mismatch"]
        description: "Established by SETPAT"
      
      - type: "hub_fifo"
        sources: ["9 = hub RAM FIFO interface wrapped and reloaded"]
        description: "Established by RDFAST / WRFAST / FBLOCK"
      
      - type: "streamer"
        sources:
          - "10 = streamer ready for another command"
          - "11 = streamer ran out of commands"
          - "12 = streamer NCO rolled over"
          - "13 = streamer read location $1FF of lookup RAM"
        description: "Established by XINIT / XZERO / XCONT"
      
      - type: "attention"
        sources: ["14 = attention requested by other cog(s)"]
        description: >-
          Attention signal, raised by COGATN. A COGATN that names the issuing cog's own
          bit also raises that cog's attention event flag. Not documented: whether that
          self strobe also triggers an attention interrupt
      
      - type: "cordic"
        sources: ["15 = GETQX/GETQY executed with no CORDIC result available or in progress"]
        description: "GETQX/GETQY executed without any CORDIC results available or in progress"

configuration_registers:
  source: >-
    Parallax Propeller 2 Documentation v35 (Rev B/C silicon), INTERRUPTS.
    Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Dual-purpose Registers (IJMPx/IRETx rows), p.13. Instruction CSV row 157 (CALLD writes {C, Z, 10'b0, PC[19:0]} to D).
    Both list INT3 at the LOWEST addresses and INT1 at the highest; the RETIx alias definitions in
    Parallax Propeller 2 Documentation v35 (Rev B/C silicon), Assembly Language, agree (RETI1 = CALLD INB,$1F5).
  registers:
    - register: "IJMP3"
      address: "$1F0"
      description: "Interrupt call (jump) address for INT3"
      format: "Holds the address the interrupt branch jumps to (the S of the inserted CALLD IRETx,IJMPx WCZ)"
    
    - register: "IRET3"
      address: "$1F1"
      description: "Interrupt return address for INT3 (written by the dispatched CALLD)"
      format: "{C, Z, 10'b0, PC[19:0]}, written by the CALLD (WCZ captures C and Z)"
    
    - register: "IJMP2"
      address: "$1F2"
      description: "Interrupt call (jump) address for INT2"
      format: "Holds the address the interrupt branch jumps to (the S of the inserted CALLD IRETx,IJMPx WCZ)"
    
    - register: "IRET2"
      address: "$1F3"
      description: "Interrupt return address for INT2 (written by the dispatched CALLD)"
      format: "{C, Z, 10'b0, PC[19:0]}, written by the CALLD (WCZ captures C and Z)"
    
    - register: "IJMP1"
      address: "$1F4"
      description: "Interrupt call (jump) address for INT1"
      format: "Holds the address the interrupt branch jumps to (the S of the inserted CALLD IRETx,IJMPx WCZ)"
    
    - register: "IRET1"
      address: "$1F5"
      description: "Interrupt return address for INT1 (written by the dispatched CALLD)"
      format: "{C, Z, 10'b0, PC[19:0]}, written by the CALLD (WCZ captures C and Z)"

instructions:
  - instruction: "STALLI"
    encoding: "EEEE 1101011 000 000100001 000100100"
    description: "Stall INT1/INT2/INT3 interrupt BRANCHES indefinitely, until ALLOWI"
    source: >-
      Parallax Propeller 2 Documentation v35 (Rev B/C silicon), INTERRUPTS; encoding:
      Assembly Language (instruction encodings).
    operation: |
      Hold off the interrupt branch for all three levels indefinitely.
      Events still occur and interrupts still become pending; what is stalled is
      the branch. STALLI being active is itself one of the conditions that defers
      an interrupt branch.
    usage_example: |
      STALLI                   ' Stall interrupt branches
      ' ... critical section ...
      ALLOWI                   ' Allow interrupt branches
  
  - instruction: "ALLOWI"
    encoding: "EEEE 1101011 000 000100000 000100100"
    description: "Allow stalled and future interrupt branches to occur (default on cog start)"
    source: >-
      Parallax Propeller 2 Documentation v35 (Rev B/C silicon), INTERRUPTS; encoding:
      Assembly Language (instruction encodings).
    operation: |
      Release the STALLI hold. Any interrupt already pending may then branch,
      with priority given to INT1, then INT2, then INT3.
    usage_example: |
      ALLOWI                   ' Allow interrupt branches
  
  - instruction: "SETINT1"
    encoding: "EEEE 1101011 00L DDDDDDDDD 000100101"
    description: "Set the INT1 event source to D[3:0] (0..15)"
    source: >-
      Parallax Propeller 2 Documentation v35 (Rev B/C silicon), INTERRUPTS and its event-source table; encoding: Assembly Language (instruction encodings).
      Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.44.
    operation: |
      Set the INT1 event source to D[3:0].
      0 = <off>, the default on cog start.
      1..15 select one of the fifteen event sources listed above.
    usage_example: |
      SETINT1 #%0001          ' INT1 from CT-passed-CT1
  
  - instruction: "SETINT2"
    encoding: "EEEE 1101011 00L DDDDDDDDD 000100110"
    description: "Configure interrupt 2 source"
    usage_example: |
      SETINT2 #%0010          ' INT2 from CT-passed-CT2
  
  - instruction: "SETINT3"
    encoding: "EEEE 1101011 00L DDDDDDDDD 000100111"
    description: "Configure interrupt 3 source"
    usage_example: |
      SETINT3 #%0011          ' INT3 from CT-passed-CT3
  
  - instruction: "TRGINT1"
    encoding: "EEEE 1101011 000 000100010 000100100"
    description: "Trigger interrupt 1 by software"
    operation: "Trigger INT1 in software; the branch still waits for the branch conditions"
    usage_example: |
      TRGINT1                 ' Software trigger INT1
  
  - instruction: "TRGINT2"
    encoding: "EEEE 1101011 000 000100011 000100100"
    description: "Trigger interrupt 2 by software"
  
  - instruction: "TRGINT3"
    encoding: "EEEE 1101011 000 000100100 000100100"
    description: "Trigger interrupt 3 by software"
  
  - instruction: "NIXINT1"
    encoding: "EEEE 1101011 000 000100101 000100100"
    description: "Cancel INT1: nix an INT1 interrupt that has been triggered and is waiting to branch"
    source: >-
      Parallax Propeller 2 Documentation v35 (Rev B/C silicon), INTERRUPTS (NIXINTx); encoding:
      P2 Instructions v35 - Rev B/C Silicon, rows 307-309.
    operation: |
      An interrupt that has been triggered and is waiting to branch does not branch.
      NIXINTx is only useful in main code after STALLI executes, or in an ISR that
      needs to stop a lower-level interrupt from executing after the current ISR exits.

  - instruction: "NIXINT2"
    encoding: "EEEE 1101011 000 000100110 000100100"
    description: "Cancel INT2: nix an INT2 interrupt that has been triggered and is waiting to branch"

  - instruction: "NIXINT3"
    encoding: "EEEE 1101011 000 000100111 000100100"
    description: "Cancel INT3: nix an INT3 interrupt that has been triggered and is waiting to branch"
  
  - instruction: "RETI0"
    encoding: "EEEE 1011001 110 111111111 111111111"
    description: >-
      Return from the DEBUG interrupt -- not from INT1/INT2/INT3. RETI0 is an alias for
      `CALLD INB,INB WCZ`; INB and INA become the writable IRET0/IJMP0 registers only
      inside a debug ISR.
    source: >-
      Parallax Propeller 2 Documentation v35 (Rev B/C silicon), Assembly Language
      (alias definitions); DEBUG INTERRUPT.
    operation: |
      RETI0 = CALLD INB,INB WCZ
      Returns to the interrupted cog program and restores C and Z from IRET0.
    flags_affected: "C, Z (restored from IRET0)"
    timing: "4 clocks cog/LUT, 13...20 hub"
    usage_example: |
      RETI0                   ' Return from a debug ISR
  
  - instruction: "RETI1"
    encoding: "EEEE 1011001 110 111111111 111110101"
    description: "Return from INT1 -- an alias for `CALLD INB,IRET1 WCZ` (IRET1 = $1F5)"
    source: >-
      Parallax Propeller 2 Documentation v35 (Rev B/C silicon), INTERRUPTS; alias
      definition: Assembly Language (alias definitions).
    timing: "4 clocks cog/LUT, 13...20 hub"
  
  - instruction: "RETI2"
    encoding: "EEEE 1011001 110 111111111 111110011"
    description: "Return from INT2 -- an alias for `CALLD INB,IRET2 WCZ` (IRET2 = $1F3)"
    source: >-
      Parallax Propeller 2 Documentation v35 (Rev B/C silicon), INTERRUPTS; alias
      definition: Assembly Language (alias definitions).
    timing: "4 clocks cog/LUT, 13...20 hub"
  
  - instruction: "RETI3"
    encoding: "EEEE 1011001 110 111111111 111110001"
    description: "Return from INT3 -- an alias for `CALLD INB,IRET3 WCZ` (IRET3 = $1F1)"
    source: >-
      Parallax Propeller 2 Documentation v35 (Rev B/C silicon), INTERRUPTS; alias
      definition: Assembly Language (alias definitions).
    timing: "4 clocks cog/LUT, 13...20 hub"

interrupt_sources_detail:
  - source_id: "%0000"
    name: "Disabled"
    description: "<off>, the default on cog start for INT1/INT2/INT3"
  
  - source_id: "%0001"
    name: "CT-passed-CT1"
    description: "CT passed CT1, established by ADDCT1"
    setup: |
      ADDCT1  timeout, #0     ' Set CT1 to timeout value
      SETINT1 #%0001          ' INT1 on CT passing CT1
  
  - source_id: "%0010"
    name: "CT-passed-CT2"
    description: "CT passed CT2, established by ADDCT2"
  
  - source_id: "%0011"
    name: "CT-passed-CT3"
    description: "CT passed CT3, established by ADDCT3"
  
  - source_id: "%0100"
    name: "SE1-event"
    description: >-
      Selectable event 1 occurred, as configured by SETSE1 -- a LUT read/write by this or
      the companion cog, a hub-lock rise/fall/change, or a pin rise/fall/change/high/low
  
  - source_id: "%0101"
    name: "SE2-event"
    description: "SE2 event occurred, established by SETSE2"
  
  - source_id: "%0110"
    name: "SE3-event"
    description: "SE3 event occurred, established by SETSE3"
  
  - source_id: "%0111"
    name: "SE4-event"
    description: "SE4 event occurred, established by SETSE4"
  
  - source_id: "%1000"
    name: "PAT-event"
    description: "Pin pattern match or mismatch occurred, established by SETPAT"

  - source_id: "%1001"
    name: "FIFO-event"
    description: "Hub RAM FIFO interface wrapped and reloaded, established by RDFAST/WRFAST/FBLOCK"

  - source_id: "%1010"
    name: "XMT-streamer-ready"
    description: "Streamer ready for a new command (event 10)"

  - source_id: "%1011"
    name: "XFI-streamer-done"
    description: "Streamer finished, no pending command (event 11)"

  - source_id: "%1100"
    name: "XRO-NCO-rollover"
    description: "Streamer NCO rollover occurred (event 12)"

  - source_id: "%1101"
    name: "XRL-LUT-$1FF"
    description: "Streamer read LUT address $1FF (event 13)"

  - source_id: "%1110"
    name: "ATN-event"
    description: >-
      Attention (ATN) requested by other cog(s) with COGATN. A COGATN that names this
      cog's own bit also sets its attention event flag. Not documented: whether that
      self strobe also triggers this interrupt

  - source_id: "%1111"
    name: "QMT-CORDIC-read-with-no-result"
    description: >-
      GETQX/GETQY executed without any CORDIC results available or in progress.

programming_patterns:
  - pattern: "timer_interrupt"
    description: "Periodic timer interrupt"
    code: |
      ' Setup 1ms timer interrupt
              MOV     IJMP1, #timer_isr    ' Set ISR address
              GETCT   timeout
              ADDCT1  timeout, ##160_000   ' 1ms at 160MHz
              SETINT1 #%0001               ' CT passed CT1

      main    ' ... main program; it must not run on into the ISR ...
              JMP     #main

      timer_isr
              ' Interrupt code here
              ADDCT1  timeout, ##160_000   ' Setup next interrupt
              RETI1                        ' Return from interrupt
  
  - pattern: "pin_change_interrupt"
    description: "Interrupt on pin state change"
    code: |
      ' Setup pin change interrupt
              MOV     IJMP2, #pin_isr      ' Set ISR address
              SETSE1  #%001_000000 + PIN   ' SE1 = INA/INB bit of PIN rises
              SETINT2 #%0100               ' INT2 from SE1

      main    ' ... main program; it must not run on into the ISR ...
              JMP     #main

      pin_isr
              ' Handle pin change. POLLSE1 clears the SE1 event flag.
              POLLSE1
              RETI2                        ' Return
  
  - pattern: "nested_interrupts"
    description: "Multiple priority interrupts"
    code: |
      ' Setup three-level interrupts
              MOV     IJMP1, #int1_isr    ' INT1 = highest priority
              MOV     IJMP2, #int2_isr  
              MOV     IJMP3, #int3_isr    ' INT3 = lowest priority
              
              SETINT1 #%0001              ' Timer
              SETINT2 #%0100              ' Pin event
              SETINT3 #%1110              ' ATN event (source 14)

      main    ' ... main program; it must not run on into the ISRs ...
              JMP     #main

      ' ISRs can interrupt each other based on priority
      int1_isr
              ' INT1 - highest; cannot be interrupted by INT2 or INT3
              RETI1
              
      int2_isr
              ' INT2 - can be interrupted by INT1 only
              RETI2
              
      int3_isr
              ' INT3 - lowest; can be interrupted by INT1 or INT2
              RETI3

  - pattern: "critical_section"
    description: "Stall INT1, INT2 and INT3 branches around a sequence; debug interrupts are non-stallable, and a REP block shields against them too"
    code: |
      ' Critical section protection
              STALLI                      ' Stall interrupt branches
              ' ... protected sequence ...
              ' Modify shared data structures
              ' Access hardware resources
              ALLOWI                      ' Allow interrupt branches

best_practices:
  - practice: "same_level_events_ignored"
    description: >-
      While an interrupt is waiting to branch and while its ISR executes, every
      further event at the same priority level is ignored, not held: an ISR that
      runs past its level's next event misses that event. INT1 can interrupt INT2 and
      INT3, INT2 can interrupt INT3, and INT3 can only interrupt non-interrupt code.
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), INTERRUPTS (the three interrupt states; during states 2 and 3 intervening events at the same priority level are ignored; the INT1/INT2/INT3 priority rules)"

  - practice: "isr_end_and_event_flags"
    description: >-
      When an ISR ends, its interrupt returns to waiting for a new interrupt event.
      An ISR for a CT1 interrupt sets the next CT1 target with ADDCT1 before RETI1;
      ADDCT1 also clears the CT-passed-CT1 event flag. Not documented:
      whether an interrupt branch clears its source's event flag.
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), INTERRUPTS (the three interrupt states; Example: Using INT1 as a CT1 interrupt) and EVENTS (ADDCT1 clears the CT-passed-CT1 event flag)"

  - practice: "automatic_save"
    description: >-
      The CALLD that realises the interrupt branch writes the return address and the C/Z
      flags into IRETx. Not documented: any other automatic save.
    rationale: "Not documented: any register save beyond the CALLD's write into IRETx"
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), INTERRUPTS"
  
  - practice: "hub_access_in_isr"
    description: "A hub read or write in an ISR waits, as anywhere, up to 7 clocks to reach the hub RAM slice it needs, and that time is part of the ISR's run time"
    rationale: "When a cog wants to read or write the hub RAM, it must wait up to 7 clocks to access the initial RAM slice of interest"
    source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Cog-to-Hub RAM Interface, p.16 (up to 7 clocks); Parallax Propeller 2 Documentation v35 (Rev B/C silicon), HUB (hub RAM slices)"

performance_characteristics:
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), INTERRUPTS; CALLD and RETIx/RESIx clocks: P2 Instructions v35 - Rev B/C Silicon, rows 157-165 (4 cog/LUT, 13...20 hub)"
  dispatch_mechanism: |
    Interrupt dispatch mechanism: "Interrupt branches are realized, internally,
    by inserting a 'CALLD IRETx,IJMPx WCZ' into the instruction pipeline
    while holding the program counter at its current value, so that the
    interrupt later returns to the address saved in IRETx."

  entry_overhead:
    cogexec: "Not documented: a clock count for the interrupt branch. A CALLD instruction takes 4 clocks in cog/LUT execution."
    hubexec: "Not documented: a clock count for the interrupt branch. A CALLD instruction takes 13...20 clocks in hub execution."
    note: "The interrupt branch is an inserted CALLD; no clock count is given for it. Time spent waiting for the deferral conditions to clear comes before the branch."

  exit_overhead:
    description: "RETIx / RESIx are themselves CALLD instructions and follow CALLD's timing"
    cogexec: "4 clocks"
    hubexec: "13...20 clocks"

  round_trip_minimum:
    cogexec: "Not documented: the interrupt branch has no clock count. The return (RETIx or RESIx) takes 4 clocks."
    hubexec: "Not documented: the interrupt branch has no clock count. The return (RETIx or RESIx) takes 13...20 clocks."
  
  deferral_conditions:
    description: "The interrupt branch is held off while any of these are in progress"
    list:
      - "ALTxx / CRCNIB / SCA / SCAS / GETCT+WC / GETXACC / SETQ / SETQ2 / XORO32 / XBYTE"
      - "AUGS or AUGD pending"
      - "REP active"
      - "STALLI..ALLOWI window"
      - "WAITx stall"
  
  context_switch_overhead: "Not documented: a clock count. IJMPx/IRETx are dedicated registers; the dispatched CALLD captures C/Z and PC into IRETx"

  interrupt_rate:
    note: |
      Not documented: a maximum interrupt rate. Each interrupt takes its branch
      (no clock count given), the ISR body, and the return (4 clocks cog/LUT,
      13...20 hub). Events at the same level that arrive before the ISR returns
      are ignored (priority_preemption.interrupt_states).
    sustained: "Limited by the ISR's run time and the branch and return; same-level events during that time are lost"

  priority_preemption:
    description: "Higher priority interrupts preempt lower: INT1 can interrupt INT2 and INT3, INT2 can interrupt INT3, INT3 can only interrupt non-interrupt code"
    nesting_depth: "Not documented: a stated maximum nesting depth. The levels are the debug interrupt, INT1, INT2 and INT3; higher interrupts can interrupt lower ISRs"
    interrupt_states:
      description: >-
        Each interrupt loops through three states: 1. waiting for an interrupt
        event; 2. waiting for the interrupt branch; 3. executing the interrupt
        service routine. During states 2 and 3, any intervening interrupt events
        at the same priority level are ignored. When state 1 is returned to, a new interrupt
        event is waited for. The ISR returns to state 1 with a CALLD whose S is
        IRETx and which carries WCZ (RETIx or RESIx): the cog clears its
        interrupt-busy flag for that interrupt, so that another one can occur.
      states:
        - "1: waiting for interrupt event"
        - "2: waiting for interrupt branch (the deferral conditions, STALLI)"
        - "3: executing interrupt service routine"
      source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), INTERRUPTS (Interrupts loop through these three states; during states 2 and 3, any intervening interrupt events at the same priority level are ignored; when state 1 is returned to, a new interrupt event will be waited for; the CALLD with S = IRETx and WCZ clears the internal interrupt-busy flag; the branch-deferral conditions; STALLI holds off interrupt branches)"

debugging_considerations:
  - consideration: "interrupt_timing"
    description: "The difference between a GETCT at the ISR's entry and a GETCT before its return, in clocks, includes the clocks of the GETCT instructions themselves"
    code: |
      isr
          GETCT   start_time
          ' ... ISR code ...
          GETCT   end_time
          SUB     end_time, start_time
          ' end_time now holds the clocks between the two GETCTs
  
  - consideration: "interrupt_counting"
    description: "A count kept by the ISR counts interrupts that branched; same-level events ignored during states 2 and 3 are not counted"

  - consideration: "debug_interrupt"
    description: "The debug interrupt provides breakpoints and single-stepping (architecture/debug_interrupt.yaml)"
    note: "Debug interrupt has highest priority"

related_topics:
  - topic: "events"
    relationship: "Events can trigger interrupts"

  - topic: "smart_pins"
    relationship: "A pin's INA/INB bit, selected with SETSEn, can trigger an interrupt"

  - topic: "timers"
    relationship: "CT-passed-CT1..CT3 are interrupt sources 1..3"
  
  - topic: "cog_attention"
    relationship: "ATN signals can trigger interrupts"

sources:
    - "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), INTERRUPTS"
    - "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), Assembly Language (instruction encodings; RESIx / RETIx alias definitions)"
    - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Dual-purpose Registers (IJMPx/IRETx), p.13"
    - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF (SETINTx), p.44"
    - "P2 Instructions v35 - Rev B/C Silicon, rows 157-165 (CALLD, RESIx, RETIx: 4 cog/LUT, 13...20 hub) and rows 303-309 (STALLI, TRGINTx, NIXINTx)"
    - "EF-099 (COGATN with the issuing cog's own bit raises that cog's attention event flag; event flag only, the attention interrupt path not tested)"
