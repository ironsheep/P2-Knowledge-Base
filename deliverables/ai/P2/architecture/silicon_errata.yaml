concept: silicon_errata
title: "P2 Silicon Errata E1-E7"
category: silicon_errata
description: >-
  The seven silicon errata of the P2 (P2X8C4M64P, Rev C silicon), E1 to E7. Each entry
  below gives what the erratum affects, what happens, and the rule code must follow;
  `related:` names the pages that carry the full account.
p2kb_key: "p2kbArchSiliconErrata"
aliases:
  - "P2 errata"
  - "errata"
  - "erratum"
  - "silicon errata"
  - "P2 silicon errata"
  - "E1-E7"
  - "erratum E1"
  - "erratum E2"
  - "erratum E3"
  - "erratum E4"
  - "erratum E5"
  - "erratum E6"
  - "erratum E7"
  - "E1"
