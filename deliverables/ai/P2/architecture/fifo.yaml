component_name: "Hub FIFO Interface"
component_type: "hardware_subsystem"

description: |
  The Hub FIFO (First-In-First-Out) Interface is a per-cog hardware structure with
  two distinct roles:
  
  1. Streamer/software transfer role: sequential reading or writing of hub RAM in any
     combination of bytes, words or longs, up to one long per clock. It is used by the
     streamer (background transfers from hub RAM to pins/DACs, or from pins/ADCs to hub
     RAM) and by software through RDFAST/WRFAST/RFx/WFx instructions. The wrap block
     count is in 64-byte units. It is set up from cog RAM or lookup RAM, not from hub
     execution.
  
  2. Hubexec instruction-prefetch role: when the cog is in hub-execute mode,
     the FIFO is dedicated to prefetching instructions from hub RAM: the cog
     employs the FIFO hardware to spool up instructions so that a stream of
     instructions is available for continuous execution.
     The FIFO contains (cogs+11) stages.

  These two roles are mutually exclusive: while a cog is in hub-execute mode,
  the FIFO is committed to instruction prefetch and the FIFO instructions
  (RDFAST, WRFAST, FBLOCK, RFx, WFx) are forbidden; so are XINIT, XZERO and
  XCONT when the streamer mode engages the FIFO.

  The FIFO serves one of hub execution, streamer use or software use (RFxxxx/WFxxxx)
  at a time.

  Key features (streamer/software role):
  - Sequential transfers of bytes, words or longs; the wrap block count is in 64-byte units
  - Automatic address incrementing
  - Block wrap events for circular buffer support
  - Variable-length encoding support (RFVAR/RFVARS)
  
  Key features (hubexec instruction-prefetch role):
  - (cogs+11) stages
  - Loads continuously whenever fewer than (cogs+7) stages are filled
  - Branching to a hub address takes a minimum of 13 clocks (+1 if target not long-aligned)
  - Not documented: the clocks per sequential instruction in hub execution as a general rule

architecture:
  per_cog: true
  block_size: 64  # bytes — the unit of the wrap block count
  hubexec_prefetch_depth_stages: "(cogs+11)"
  hubexec_refill_threshold_stages: "(cogs+7); FIFO loads while fewer than this filled"
  modes:
    - read: "RDFAST initiates reading from Hub to COG (streamer/software role; executed from cog RAM, register or lookup, $00000..$003FF, not in hub execution)"
    - write: "WRFAST initiates writing from COG to Hub (streamer/software role; executed from cog RAM, register or lookup, $00000..$003FF, not in hub execution)"
    - hubexec_prefetch: "Engaged automatically while the cog is in hub-execute mode; cannot coexist with software FIFO use or with a streamer mode that engages the FIFO"

  internal_state:
    - "Not documented: the FIFO's internal state"
    - "RDFAST and WRFAST set the hub start address and the block count; on a block wrap the FIFO interface reloads its block count and start address; FBLOCK sets a new start address and block count for the next wrap"
    - "GETPTR gets the FIFO's current hub pointer"
    - "The FIFO serves one of hub execution, streamer use or software use at a time"

configuration:
  rdfast:
    purpose: "Initialize FIFO for fast sequential reads from Hub RAM"
    parameters:
      D_bits_31: "No-wait flag: 0 = wait for any previous WRFAST to finish, reconfigure the FIFO and wait until it has begun receiving hub data; 1 = no wait for the FIFO reconfiguration (2 clocks), and the code must allow enough clocks before any attempt to read FIFO data"
      D_bits_13_0: "Block count in 64-byte units (0 = no wrapping until the entire 1MB hub map has been sequenced through)"
      S_bits_19_0: "Block start address in Hub RAM; wrapping (a non-zero block count) requires a long-aligned start address (address ends in %00)"
    timing: "2 clocks, or waits for prior WRFAST to finish + 10-17 clocks"

  wrfast:
    purpose: "Initialize FIFO for fast sequential writes to Hub RAM"
    parameters:
      D_bits_31: "No-wait flag: 0 = wait for any previous WRFAST to finish, then reconfigure the FIFO for writing; 1 = no wait for the FIFO reconfiguration (2 clocks), and the code must allow enough clocks before any attempt to write FIFO data"
      D_bits_13_0: "Block count in 64-byte units (0 = no wrapping until the entire 1MB hub map has been sequenced through)"
      S_bits_19_0: "Block start address in Hub RAM; wrapping (a non-zero block count) requires a long-aligned start address (address ends in %00)"
    timing: "2 clocks, or waits for prior WRFAST to finish + 3 clocks"
    before_cogstop: "A cog that has been writing to the hub via WRFAST and wants to COGSTOP itself executes WAITX #20 first, to allow time for any lingering FIFO data to be written to the hub"

  fblock:
    purpose: "Set next block parameters for circular buffer operation"
    parameters:
      D: "Block count in 64-byte units"
      S: "Block start address (long-aligned when wrapping)"
    usage: "Sets the start address and block count taken when the current blocks are fully read or written, in place of wrapping back to the prior start address and reloading the prior block count. FBLOCK can be executed after RDFAST, after WRFAST, or after a FIFO block wrap event. It always takes 2 clocks."

instructions:
  setup:
    - instruction: "RDFAST"
      description: "Begin fast hub read via FIFO"
      category: "FIFO Setup"

    - instruction: "WRFAST"
      description: "Begin fast hub write via FIFO"
      category: "FIFO Setup"

    - instruction: "FBLOCK"
      description: "Set next block for FIFO wrap"
      category: "FIFO Setup"

    - instruction: "GETPTR"
      description: "Get current FIFO hub pointer"
      category: "FIFO Status"

  read_operations:
    - instruction: "RFBYTE"
      description: "Read zero-extended byte from FIFO"
      size: 1
      extension: "zero"

    - instruction: "RFWORD"
      description: "Read zero-extended word from FIFO"
      size: 2
      extension: "zero"

    - instruction: "RFLONG"
      description: "Read long from FIFO"
      size: 4

    - instruction: "RFVAR"
      description: "Read variable-size (1-4 byte) zero-extended value"
      size: "1-4"
      extension: "zero"

    - instruction: "RFVARS"
      description: "Read variable-size (1-4 byte) sign-extended value"
      size: "1-4"
      extension: "sign"

  write_operations:
    - instruction: "WFBYTE"
      description: "Write byte to FIFO"
      size: 1

    - instruction: "WFWORD"
      description: "Write word to FIFO"
      size: 2

    - instruction: "WFLONG"
      description: "Write long to FIFO"
      size: 4

  event_monitoring:
    - instruction: "POLLFBW"
      description: "Poll FIFO block wrap event flag"
      event: "fifo_block_wrap"

    - instruction: "WAITFBW"
      description: "Wait for FIFO block wrap event"
      event: "fifo_block_wrap"

    - instruction: "JFBW"
      description: "Jump if FIFO block wrap flag set"
      event: "fifo_block_wrap"

    - instruction: "JNFBW"
      description: "Jump if FIFO block wrap flag clear"
      event: "fifo_block_wrap"

block_wrap_event:
  description: |
    The FIFO-interface-block-wrap event flag is set whenever the hub RAM FIFO
    interface exhausts its block count and reloads its block count and start
    address. This happens on every block wrap, with or without an FBLOCK.

    With FBLOCK, the wrap loads the FBLOCK start address and block count in
    place of the prior ones:
    1. RDFAST/WRFAST sets the first block
    2. FBLOCK sets the next block parameters
    3. When the block count is exhausted, the flag is set and the FBLOCK
       parameters are loaded

  triggering: "The FIFO interface exhausts its block count and reloads its block count and start address"
  clearing: "Executing RDFAST, WRFAST or FBLOCK, or POLLFBW, WAITFBW, JFBW or JNFBW"

programming_patterns:
  - pattern: "sequential_read"
    description: "Read sequential data from Hub RAM"
    code: |
      ' Read 256 bytes from hub_buffer into COG RAM (64 longs, registers dest0..dest0+63)
              rdfast  #0, ##hub_buffer     ' Start FIFO read, unlimited blocks
              mov     idx, #0              ' index into the destination registers
              rep     @.end, #64           ' Repeat 64 times
              rflong  temp                 ' Read 4 bytes
              altd    idx, #dest0          ' next instruction's D = dest0 + idx
              mov     0-0, temp            ' Store in COG RAM
              add     idx, #1              ' Next COG location
      .end

  - pattern: "sequential_write"
    description: "Write sequential data to Hub RAM"
    code: |
      ' Write COG array to Hub RAM (64 longs, registers src0..src0+63)
              wrfast  #0, ##hub_dest       ' Start FIFO write
              mov     idx, #0              ' index into the source registers
              rep     @.end, #64           ' Repeat 64 times
              alts    idx, #src0           ' next instruction's S = src0 + idx
              mov     temp, 0-0            ' Get COG value
              wflong  temp                 ' Write to FIFO
              add     idx, #1              ' Next COG location
      .end

  - pattern: "circular_buffer"
    description: "Continuous circular buffer reading"
    code: |
      ' Circular buffer: 16 blocks of 64 bytes, buffer_start = long-aligned hub address
              rdfast  #16, ##buffer_start  ' D = block count, S = start address

      .loop   rflong  data                 ' Read data
              ' Process data...
              jmp     #.loop               ' Continue forever

      ' After 16 blocks the FIFO wraps to buffer_start and reloads the block count

  - pattern: "double_buffer"
    description: "Double-buffered streaming"
    code: |
      ' Ping-pong between two buffers: 16 blocks of 64 bytes each, both long-aligned
              mov     next_buf, ##buffer_a
              mov     alt_buf, ##buffer_b
              rdfast  #16, ##buffer_a
              fblock  #16, ##buffer_b      ' Block taken when buffer_a is fully read

      .loop   rflong  data
              ' Process...
              pollfbw wc                   ' C = 1 if the FIFO block wrap event was set
      if_nc   jmp     #.loop
              fblock  #16, next_buf        ' After the wrap: set the block taken at the next wrap
              mov     swap_buf, next_buf   ' Swap the two buffer addresses
              mov     next_buf, alt_buf
              mov     alt_buf, swap_buf
              jmp     #.loop

      next_buf long 0
      alt_buf  long 0
      swap_buf long 0

timing:
  rdfast: "2 clocks (or wait for prior WRFAST + 10-17 clocks)"
  wrfast: "2 clocks (or wait for prior WRFAST + 3 clocks)"
  rfbyte: "2 clocks"
  rfword: "2 clocks"
  rflong: "2 clocks"
  rfvar: "2 clocks"
  rfvars: "2 clocks"
  wfbyte: "2 clocks"
  wfword: "2 clocks"
  wflong: "2 clocks"
  fblock: "2 clocks"
  getptr: "2 clocks"

notes:
  - "Each COG has independent FIFO - no sharing between COGs"
  - "The FIFO interface is set for either hub-RAM read or hub-RAM write"
  - "With D[31]=0, RDFAST and WRFAST wait for any previous WRFAST to finish"
  - "A block count of 0 means no wrapping until the entire 1MB hub map has been sequenced through"
  - "FIFO is also used internally by hub execution mode"
  - "Variable-length reads (RFVAR/RFVARS) use continuation bit encoding: see language/pasm2/rfvar.yaml for the byte layout and language/pasm2/fvar.yaml for the DAT directives that emit it"

limitations:
  - "The FIFO interface is set for either hub-RAM read or hub-RAM write"
  - "The FIFO can be used for only one of hub execution, streamer use or software use at a time"
  - "Hub-execute mode dedicates the FIFO to instruction prefetch"
  - "In hubexec, these instructions are in the hub-execution forbidden list: RDFAST, WRFAST, FBLOCK, RFBYTE, RFWORD, RFLONG, RFVAR, RFVARS, WFBYTE, WFWORD, WFLONG, and XINIT / XZERO / XCONT (when the streamer mode engages the FIFO)"

hub_symbols: "Fragments here that use a hub symbol as an immediate assume a PASM-only file, where hub addresses are absolute. In a Spin2 object, DAT hub addresses are relative to the object: see language/spin2/integration/spin2-pasm2-integration.yaml hub_address_resolution."
related:
  - streamer: "Streamer also uses hub data transfers"
  - hub_memory: "FIFO operates on hub RAM"
  - events: "Block wrap generates monitorable event"

cross_references:
  - rdfast_instruction: "language/pasm2/rdfast"
  - wrfast_instruction: "language/pasm2/wrfast"
  - rfvar_instruction: "language/pasm2/rfvar"
  - rfvars_instruction: "language/pasm2/rfvars"
  - fvar_directive: "language/pasm2/fvar"
  - streamer_system: "architecture/streamer"

documentation_source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), HUB EXECUTION, THE COG -to- HUB RAM INTERFACE (FIFO operation for streamer or software usage is established by a RDFAST or WRFAST executed from cog RAM, register/lookup, $00000..$003FF) and FAST SEQUENTIAL FIFO INTERFACE"
hubexec_fifo_facts:
  - "The FIFO contains (cogs+11) stages."
  - "When in read mode, the FIFO loads continuously whenever less than (cogs+7) stages are filled, after which point, up to 5 more longs may stream in, potentially filling all (cogs+11) stages."
  - "Branching to a hub address takes a minimum of 13 clock cycles. If the instruction being branched to is not long-aligned, one additional clock cycle is required."
  - "While in hub execution mode, the FIFO cannot be used for anything else."
sources:
  - "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), HUB EXECUTION (branch minimum, FIFO unavailable for other use) and THE COG -to- HUB RAM INTERFACE ((cogs+11) stages, load threshold): the hub-execution FIFO facts in hubexec_fifo_facts"
  - "P2 Instructions v35 Rev B/C Silicon, ADD/MOV/NOP rows (hub execution clocks: same as cog execution); Parallax Propeller 2 Documentation v35 (Rev B/C silicon), HUB EXECUTION (the FIFO spools up instructions for continuous execution)"
