# XBYTE - Hardware Bytecode Execution Engine
# Source: Silicon Doc v35, P2 Datasheet

component: XBYTE_Engine
category: bytecode_engine
description: |
  Hardware bytecode execution engine providing efficient interpreted language support.
  Executes bytecode routines from LUT with 6-clock overhead per bytecode, enabling
  high-performance virtual machines and interpreters.

architecture:
  overhead: "6 clocks per bytecode + routine execution time"
  bytecode_fetch: "Via FIFO from hub memory"
  routine_storage: "LUT RAM (512 longs)"
  hardware_acceleration: "Automatic bytecode dispatch"

execution_cycle:
  8_clock_sequence:
    clock_1:
      phase: "go"
      operation: "RFBYTE bytecode, SKIPF #0"
      description: "Fetch bytecode from FIFO, cancel any skip pattern"
      
    clock_2:
      phase: "get"
      operation: "MOV PA,bytecode, RDLUT"
      description: "Write bytecode to PA ($1F6), start LUT read"
      
    clock_3:
      phase: "go"
      operation: "RDLUT (data → D)"
      description: "Complete LUT read, get routine address/skip pattern"
      
    clock_4:
      phase: "get"
      operation: "EXECF D (begin)"
      description: "Start EXECF with jump and optional skip pattern"
      
    clock_5:
      phase: "go"
      operation: "MOV PB,(GETPTR), MODCZ"
      description: "Write FIFO pointer to PB, optionally set C,Z from bytecode"
      
    clock_6:
      phase: "get"
      operation: "flush pipeline"
      description: "Pipeline flush for branch"
      
    clock_7:
      phase: "go"
      operation: "reload pipeline"
      description: "Pipeline reload"
      
    clock_8:
      phase: "get"
      operation: "first instruction"
      description: "First instruction of bytecode routine executes"

starting_xbyte:
  setup:
    code: |
      _RET_   SETQ    {#}D     ' Configure PERSISTENT XBYTE mode (armed once)
      _RET_   SETQ2   {#}D     ' Configure ONE-SHOT XBYTE mode (next bytecode only, then reverts)
    requirement: "$1FF must be on top of the hardware stack, placed there by 'PUSH #$1FF'"

  configuration:
    d_parameter: "32-bit configuration value (the same mode operand for both SETQ and SETQ2)"
    stack_requirement: "Hardware stack must contain $1FF"
    stack_note: |
      Use 'PUSH #$1FF' to place it. A CALL will NOT do -- a CALL pushes its own
      return address, not $1FF, so the _RET_ would simply return and XBYTE would
      never engage. Silicon Doc: "Starting XBYTE and establishing its operating
      mode is done all at once by a '_RET_ SETQ {#}D' instruction, with the top
      of the hardware stack holding $1FF."

  automatic_start:
    description: |
      When RET executes with $1FF on stack after SETQ (or SETQ2),
      XBYTE mode begins automatically

  mode_persistence:
    summary: |
      The mode operand (table base + compression threshold + flag-write bit; see
      configuration_patterns and flag_control) is loaded by EITHER SETQ or SETQ2.
      Choosing SETQ vs SETQ2 chooses PERSISTENCE; the operand value chooses table
      base + compression + flags. The two decisions are orthogonal — one
      instruction, two independent choices.
    setq:
      role: "Sets the PERSISTENT XBYTE mode."
      behavior: |
        The table base / compression / flag configuration loaded by SETQ is
        retained by XBYTE and applies to every subsequent bytecode. Bytecode
        routines that end in a plain _RET_ continue dispatching through this mode;
        it is armed once, not per-bytecode.
    setq2:
      role: "Sets a ONE-SHOT XBYTE mode for only the next bytecode."
      behavior: |
        The configuration loaded by SETQ2 applies to exactly the next bytecode,
        after which XBYTE automatically reverts to the mode last set by SETQ. No
        instruction is needed to switch back.
    use_case: |
      Lets one XBYTE-driven VM operate two dispatch tables: a default table
      (armed once with SETQ) and an alternate table borrowed for exactly one
      opcode at a time (via SETQ2), after which dispatch returns to the default
      table on its own. This is a general bytecode-VM pattern — for example, a
      "setup bytecode then alternate-table bytecode" pairing that keeps the
      bytecode stream compact while supporting an alternate handler set on demand.
    mnemonic_aid: |
      Mirrors the SETQ/SETQ2 personality split elsewhere in the ISA: SETQ targets
      COG-RAM block transfers / SETQ2 targets LUT-RAM block transfers; here SETQ
      sets the persistent XBYTE mode / SETQ2 sets the transient one. The "2"
      variant is consistently the alternate / one-shot form.
    source: "Chip Gracey, P2 silicon designer; v55 Spin2 interpreter Theory-of-Operations review."

configuration_patterns:
  legend: |
    %A = LUT base address bit(s).  %BBBB = compression threshold (must be > 0).
    %F = flag-write bit (see flag_control).  %x = mode-operand bit 1 (see
    index_form_bit): in the 256 patterns it is ignored; in the smaller tables
    bit 1 is the index-form selector (0 = low-bits index, 1 = high-bits index).

  index_form_bit:
    name: "Mode-operand bit 1 -- index-form selector"
    status: "DEFINED. Documentary (full Silicon Doc v35 mode table) and confirmed by Chip Gracey. Resolves F-223."
    detail: |
      Bit 1 selects WHICH HALF of the bytecode indexes the dispatch table:
        bit 1 = 0  -> index from the bytecode's LOW  bits (the 'primary' form)
        bit 1 = 1  -> index from the bytecode's HIGH bits (the 'alternate' form),
                      leaving the low bits free as an operand in PA.
      Visible straight down the full v35 mode table: e.g. 128-entry %AAxx0010F
      (I = b[6:0]) vs %AAxx0011F (I = b[7:1]) differ only in bit 1. Each of the
      128/64/32/16 sizes has this primary/alternate pair (see alt_pattern below).
    exception_256: |
      In the 256-entry mode the bytecode already fills all eight index bits, so
      there is no low/high choice to make and bit 1 is IGNORED -- a genuine
      don't-care in that mode only. This is why the two 256 patterns print it as
      a bare %x. (Chip Gracey: "there is nothing to switch between with 8-bit,
      so the bit is ignored.")
    withdrawn_reading: |
      An earlier revision read bit 1 as a 'stack-pop control', inferred from the
      demo's 'no stack pop' comment. That reading was INCORRECT and is withdrawn;
      the 'no stack pop' comment is unrelated to bit 1.
    guidance: "Leave bit 1 = 0 unless you deliberately want a smaller table's high-bits index form."

  full_256_bytecodes:
    pattern: "%A000000xF"
    lut_base: "%A00000000"
    index_calc: "I = bytecode[7:0]"
    bytecodes: 256
    lut_usage: "256 longs"
    bit1_note: "256 mode fills all 8 index bits; bit 1 (the %x) is ignored -- no alternate index form (see index_form_bit)."

  compressed_16_bytecodes:
    pattern: "%ABBBB00xF"
    lut_base: "%A00000000"
    threshold: "%BBBB must be > 0 (Silicon Doc). %BBBB = %0001 gives the 16/240 split below."
    operation: |
      If bytecode[7:4] < %BBBB: Use full bytecode as index
      If bytecode[7:4] >= %BBBB: Use compressed index
    compression: "16 primary + 240 extended bytecodes"
    
  128_bytecodes:
    pattern: "%AAxx0010F"
    lut_base: "%AA0000000"
    index_calc: "I = bytecode[6:0]"
    alt_pattern: "%AAxx0011F"
    alt_index_calc: "I = bytecode[7:1]  (bit 1 = 1; high-bits index -- see index_form_bit)"
    bytecodes: 128

  64_bytecodes:
    pattern: "%AAAx1010F"
    lut_base: "%AAA000000"
    index_calc: "I = bytecode[5:0]"
    alt_pattern: "%AAAx1011F"
    alt_index_calc: "I = bytecode[7:2]  (bit 1 = 1; high-bits index -- see index_form_bit)"
    bytecodes: 64

  32_bytecodes:
    pattern: "%AAAAx100F"
    lut_base: "%AAAA00000"
    index_calc: "I = bytecode[4:0]"
    alt_pattern: "%AAAAx101F"
    alt_index_calc: "I = bytecode[7:3]  (bit 1 = 1; high-bits index -- see index_form_bit)"
    bytecodes: 32

  16_bytecodes:
    pattern: "%AAAAA110F"
    lut_base: "%AAAAA0000"
    index_calc: "I = bytecode[3:0]"
    alt_pattern: "%AAAAA111F"
    alt_index_calc: "I = bytecode[7:4]  (bit 1 = 1; high-bits index -- see index_form_bit)"
    bytecodes: 16

flag_control:
  f_bit: "Configuration bit 0"
  behavior:
    f_0: "Flags unaffected by bytecode"
    f_1: "Bytecode index LSBs written to C and Z"
    
  flag_mapping:
    c_flag: "Bytecode index bit 1"
    z_flag: "Bytecode index bit 0"
    usage: "Can encode 4 states in flags for routine"

lut_table_format:
  entry_format: |
    Each LUT entry contains (per EXECF encoding, Silicon Doc):
    [9:0]  = Base routine address (10-bit COG/LUT address to jump to)
    [31:10] = SKIPF pattern (22 bits)
    
  execf_operation:
    jump: "To bits [9:0] of LUT entry (10-bit COG/LUT address)"
    skipf: "Using bits [31:10] as the 22-bit SKIPF pattern"
    
  routine_addressing:
    cog_range: "$000-$1FF"
    lut_range: "$200-$3FF"

special_registers:
  pa_register:
    address: "$1F6"
    contents: "Current bytecode value"
    usage: "Available as immediate operand in routines"
    
  pb_register:
    address: "$1F7"
    contents: "FIFO read pointer"
    usage: "Hub address tracking"

bytecode_routines:
  constraints:
    location: "Must be in COG or LUT RAM"
    exit: "Must end with RET or _RET_"
    stack: "Hardware stack must not overflow"
    
  optimization:
    inline_operations: "Use _RET_ prefix for single instructions"
    skip_patterns: "Use SKIPF to create compact routines"
    shared_code: "Multiple bytecodes can jump to same routine"

programming_examples:
  simple_interpreter:
    code: |
      ' Setup LUT with bytecode routines
      SETQ2   #256-1
      RDLONG  $000, bytecode_table
      
      ' Start FIFO for bytecode stream
      RDFAST  #0, bytecode_ptr
      
      ' Start XBYTE engine -- PUSH $1FF, then arm on the _RET_
      PUSH    #$1FF                       ' XBYTE triggers on RET to $1F8..$1FF
      _RET_   SETQ    #%0_0000_00_0_1     ' A=0 (table at LUT $000), F=1 (write flags)

  bytecode_routine_example:
    code: |
      ' A LUT entry is:  routine address in [9:0]  |  SKIPF pattern in [31:10]
      ' Shift the PATTERN, never the address. Use the COG/LUT address (no '@',
      ' which would yield a HUB address that EXECF cannot use).
      LONG    push_routine | (%0 << 10)   ' no instructions skipped

      push_routine:
      RFLONG  data              ' Read inline parameter
      WRLONG  data, stack_ptr   ' Push to VM stack
      _RET_   ADD  stack_ptr, #4   ' Adjust, and return to XBYTE

  compressed_mode:
    code: |
      ' Compression: 16 primary bytecodes + 240 extended (%ABBBB00xF).
      ' Threshold %BBBB must be > 0. With %BBBB = %0001:
      '   b[7:4] <  %0001  -> primary:  $00..$0F, 16 individual entries
      '   b[7:4] >= %0001  -> extended: $10..$FF, 240 codes in 15 group entries
      _RET_   SETQ    #%1_0001_00_0_1
      ' 1    = A, the LUT base bit -> table at LUT $100  (ONE bit, not four)
      ' 0001 = %BBBB, the compression threshold (four bits)
      ' 1    = F, write the bytecode's index LSBs to C and Z

performance:
  overhead_per_bytecode: "6 clocks"
  throughput: "At 160MHz: 26.7M bytecodes/second (overhead only)"
  comparison:
    software_dispatch: "9 clocks overhead per bytecode (Silicon Doc v35 verbatim: 'takes only 2+3+4, or 9, clocks to get the next bytecode, look it up, then execute that bytecode's routine')"
    xbyte_dispatch: "6 clocks overhead per bytecode (Silicon Doc v35 verbatim: '6-clock custom-bytecode executor'; 'total overhead of only 6 clocks, excluding the bytecode routine')"
    minimum_xbyte_loop: "8 clocks (Silicon Doc verbatim: 'The bytecode routine could be as short as a single 2-clock instruction with a _RET_ prefix, making the total XBYTE loop take only 8 clocks')"
    improvement: "3-7x faster dispatch"

