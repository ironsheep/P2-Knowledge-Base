# SD Card Boot — Boot Path from microSD Storage
# Sources:
#   - Hardware Manual 2022-11-01 (boot pattern table, fallback behavior)
#     (boot pattern table consolidated from the Hardware Manual)
#   - Parallax Propeller 2 ROM Booter v33_01j (FAT32 + SD card SPI mode references)

component: sd_card_boot
category: boot_rom
description: |
  Boot path that loads the user application from a microSD card. Triggered
  by the P60=pull-up boot pattern. Supports FAT32-formatted SD cards
  accessed via SPI-mode protocol. Has documented fallback behavior on
  failure (serial 60s window or shutdown, depending on the P59 state).

# When this path is taken
boot_pattern_trigger:
  see: architecture/boot-rom/boot-pattern-selection.yaml
  sd_priority_patterns:
    - "P61=float-or-down, P60=up, P59=float → SD boot, fallback serial 60s on failure"
    - "P61=float-or-down, P60=up, P59=down → SD boot, shutdown on failure"
  key_requirement: "P60 MUST be pulled up for SD boot to be attempted"

# Hardware requirements
hardware:
  storage: "microSD card; the ROM's SD initialisation distinguishes SDV1, SDV2 (byte address) and SDHC/SDV2 (block address) cards (Parallax Propeller 2 ROM Booter v33_01j, SD/SDHC/sdxc SPI Initialisation); filesystem layer is FAT32"
  filesystem:
    primary_support: "FAT32"
    partition_types_accepted:
      claim: "The ROM validates the MBR and accepts a first-partition type of $0C (FAT32 LBA) or $0B (FAT32 CHS); any other partition type fails MBR validation"
      source: "Parallax Propeller 2 ROM Booter v33_01j, _validateMBR routine"
  sd_interface_mode: "SPI mode (the ROM uses SD's SPI-mode protocol, not the higher-speed SD bus mode)"
  sd_pins:
    note: "SD SPI boot pins: P61 = CLK, P60 = CSn, P59 = DI, P58 = DO (the P2 side drives P61, P60 and P59 and reads P58)."
    source: "Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, Boot Up (Host Serial and Boot Memory Connections table), p.11"

# Boot sequence (per ROM booter narrative + Hardware Manual)
sequence:
  step_1: "ROM Booter sees P60=up boot pattern, selects SD path"
  step_2: "Initializes SD card via SPI mode"
  step_3: "Mounts FAT32 filesystem"
  step_4: "Locates and reads the boot file (filename convention not documented)"
  step_5: "Loads file contents into hub RAM"
  step_6: "Verifies application checksum"
  step_7: "Starts user application via COGINIT"

# Fallback behavior
fallback:
  with_serial_fallback:
    pattern: "P59=float"
    on_failure: "Programs from serial within 60 s window (allows recovery via host download)"

  no_fallback:
    pattern: "P59=down"
    on_failure: "Shutdown — chip halts until reset"
    use_case: "Production-only SD boot where any failure should stop the system"

  failure_causes:
    - "No SD card present"
    - "SD card not FAT32 formatted"
    - "Boot file missing from filesystem"
    - "Boot file content checksum failure"
    - "SD card hardware error"

# Not documented
knowledge_gaps:
  - "Specific boot file name convention: not documented"
  - "Maximum boot file size limit: not documented"
  - "Whether the boot file can be in a subdirectory or only the root: not documented"
  - "SD card capacity limits beyond the SDV1/SDV2/SDHC card types the ROM initialisation distinguishes: not documented"
  - "What happens with multiple bootable files present: not documented"

# Edge module P60 pull-up wrinkle
edge_module_note:
  context: "The Edge modules' DIP switch bank does NOT directly control P60"
  see: architecture/boot-rom/boot-pattern-selection.yaml
  implication: |
    The pull-up on P60 that SD boot requires is built into the microSD card.
    See architecture/boot-rom/boot-pattern-selection.yaml for the full note.
  source: "Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, Boot Up (Boot Pattern table, footnote 2 'Built into microSD card'), p.11"

# Comparison to other boot paths
boot_path_comparison:
  vs_flash_boot:
    advantage_sd: "SD cards are removable — easy field updates, can carry multiple boot images"
    advantage_flash: "Faster boot (no filesystem mount); no removable-media wear concerns; integrated on Edge modules"

  vs_serial_boot:
    advantage_sd: "No host computer required at boot time; runs standalone"
    advantage_serial: "Easy iterative development; no media handling"

  hybrid_pattern:
    note: "P61=float-or-down with P60=up, P59=float gives SD boot WITH serial 60s fallback — common development setup"

# Cross-references
related:
  - architecture/boot-rom/_index.yaml
  - architecture/boot-rom/boot-pattern-selection.yaml
  - architecture/boot-rom/spi-flash-boot.yaml
  - architecture/boot-rom/boot-rom-contents.yaml
  - architecture/serial_loader.yaml
