# Boot Pattern Selection — P59-P61 Pin Pattern to Boot Source Mapping
# Sources:
#   - Hardware Manual 2022-11-01 (boot pattern table — primary, authoritative)
#     (boot pattern table consolidated from the Hardware Manual)
#   - P2 Edge Standard Module (Edge DIP-switch wiring)
#   - P2 Edge 32MB Module (Edge 32MB DIP-switch wiring)

component: boot_pattern_selection
category: boot_rom
description: |
  On every reset/power-up, the P2 boot ROM reads P59, P60, and P61 as a
  3-state pattern (each pin can be float / pull-up / pull-down). The
  combined pattern selects one of six documented boot procedures. After
  the bootloader chooses a source, these pins take on their second roles
  (serial RX/TX or SPI flash interface), and after the user application
  starts they become general-purpose I/O.

# State notation
pin_state_legend:
  hardware_manual_symbols: "ƒ = float, ⇧ = pull-up, ⇩ = pull-down, ⨯ = don't care"
  plain_text_used_below: "float / up / down / any"

# THE AUTHORITATIVE TABLE — Hardware Manual 2022-11-01
boot_pattern_table:
  source: "Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, Boot Up (Boot Pattern table), p.11"
  patterns:
    - p61: float
      p60: float
      p59: float
      boot_procedure: "Program from serial within 60 s window"
      fallback: "(this IS the default)"

    - p61: any
      p60: any
      p59: up
      boot_procedure: "Program from serial within 60 s window; no flash or microSD card boot"
      fallback: "Serial only"

    - p61: up
      p60: any
      p59: float
      boot_procedure: "Program from serial within 100 ms, OR boot from flash"
      fallback: "If flash fails: serial 60 s"

    - p61: up
      p60: any
      p59: down
      boot_procedure: "Fast boot from flash; no serial window"
      fallback: "If flash fails: shutdown"

    - p61: float_or_down
      p60: up
      p59: float
      boot_procedure: "Boot from microSD card"
      fallback: "If SD fails: serial 60 s"

    - p61: float_or_down
      p60: up
      p59: down
      boot_procedure: "Boot from microSD card"
      fallback: "If SD fails: shutdown"

# Boot-time clock state — applies to ALL ROM boot paths
boot_time_clock_state:
  source:
    - "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, System Clock (%SS clock-source table), p.18; Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, Download Propeller Application, p.61"
    - "rom_own_calibration: Parallax Propeller 2 ROM Booter v33_01j, CON block (rc_max) and Constants / initialized variables (timeout_per)"
    - "rcfast_range_to_calibrate_against: Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, AC Characteristics, p.48"
    - "the_one_boot_time_clock_change: Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, Download Propeller Application (Serial Loading Protocol Commands), p.61, and Parallax Propeller 2 ROM Booter v33_01j, Command - clock setup (command_clk)"
    - "shutdown_clock: Parallax Propeller 2 ROM Booter v33_01j, Serial done (shut_down)"
  oscillator_at_boot: "RCFAST -- '20+ MHz (nominally ~24 MHz) can be switched to at any time— used on boot up.'"
  loader_time_base: "The loader adapts its baud rate from every '>' character 'to keep the baud rate tightly calibrated to the internal RC oscillator that the loader uses during the boot process.'"
  rcfast_range_to_calibrate_against: "20 MHz min / 24 MHz typ / 30 MHz max"
  rom_own_calibration: "The boot ROM sizes its serial timeouts against the RCFAST maximum, not a nominal value: 'rc_max = 30_000_000 -- max frequency of RC oscillator' and 'timeout_per long rc_max/10 -- 100ms timeout for serial receive'."
  implication: "Boot-time code (flash loaders, serial download stubs, SD loaders) runs under RCFAST. Timing-sensitive boot-time activity must be calibrated for the RCFAST range, not for the frequency the user application will later select."
  the_one_boot_time_clock_change: "The serial loader's Prop_Clk command changes the clock setting before any application runs -- 'Change Clock Setting: Prop_Clk <INAmask> <INAdata> <INBmask> <INBdata> <HUBSETclocksetting>'. The ROM performs it with the same two-step the datasheet prescribes: HUBSET to the requested setting with the source bits cleared ('switch to partial setting, but in RC fast mode'), WAITX ##rc_max/200 ('wait 5ms'), then HUBSET to the full setting."
  shutdown_clock: "On shutdown the ROM issues HUBSET #1 -- 'set 20KHz oscillator' -- before COGSTOP floats the pins."
  see_also:
    - architecture/clock_system.yaml
    - architecture/boot-rom/spi-flash-boot.yaml

# Pins serve multiple roles in sequence
pin_triple_duty:
  source: "Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, GENERAL PURPOSE I/O PIN EXCEPTIONS, p.69, and the Host Serial and Boot Memory Connections table, Boot Up, p.11; Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Pin Descriptions, p.6"
  statement: "P58–P63 : upon power-up/reset the pins have the special purpose of detecting the boot up configuration and communicating with an external flash or SD memory, or with a host system for programming.  After boot up, they become general purpose for the user application (aside from that imposed by any hardware attached to them)."
  datasheet_restatement: "P58-P63 serve in the boot process, then general purpose after."
  roles:
    role_1: "Boot pattern selector -- P59, P60, P61 are read as the 3-state Boot Pattern."
    role_2: "Boot memory or host interface -- Flash SPI: P61 CSn, P60 CLK, P59 DI, P58 DO. SD SPI: P61 CLK, P60 CSn, P59 DI, P58 DO. Host Serial: P63 in, P62 out."
    role_3: "General purpose I/O once the user application is running."
  custom_board_implication: "A custom board that boots from flash must wire P58-P61 to the flash chip AND set the Boot Pattern on P59-P61 with the pull-up/pull-down resistors the pattern table names."

# Parallax Edge module switch implementation
edge_module_switch_mapping:
  source: "P2 Edge Module Rev D (#P2-EC) v3.0 6/3/2022, 6. Mode Selection Switch Bank, p.5; P2 Edge Module with 32MB RAM (#P2-EC32MB) v2.0 5/23/2022, 6. Mode Selection Switch Bank, p.5"
  switchable:
    p61:
      switch_label: "FLASH"
      on: "P61 pulled up (enables flash-priority patterns)"
      off: "P61 floating"
    p59:
      switch_pair: "△ (up) and ▽ (down)"
      both_off: "P59 floating"
      up_on: "P59 pulled up"
      down_on: "P59 pulled down"
      warning: "Switching BOTH △ and ▽ ON creates a contradiction — only ONE should be ON"
  not_directly_switchable:
    p60:
      sd_boot_pullup: "The pull-up on P60 that SD boot needs is built into the microSD card; the mode selection switch bank has no P60 switch."
      source: "Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, Boot Up (Boot Pattern table, footnote 2 'Built into microSD card'), p.11"

