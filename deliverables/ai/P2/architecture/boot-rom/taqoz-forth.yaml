    status: "Not documented in primary sources we have ingested"
    chase: "Mine engineering/ingestion/sources/rom-booter/ROM_Booter.lst for the actual ROM dictionary; verify against Peter Jakacki's TAQOZ.spin2 source"

  runtime_capabilities:
    status: "Specific operations beyond 'interactive Forth REPL' are not documented in primary sources"
    chase: "forums.parallax.com — Peter Jakacki's TAQOZ threads; Peter's SourceForge wiki for TAQOZ/Tachyon"

  invocation_from_user_code:
    status: "Unknown whether TAQOZ can be invoked from a running user program (vs. boot-window only)"
    chase: "Ask Peter Jakacki on the forums; inspect TAQOZ.spin2 source"

  memory_footprint:
    status: "Hub RAM consumed when TAQOZ is active is not documented"
    chase: "Inspect TAQOZ.spin2; measure on hardware"

  extension_mechanism:
    status: "Whether/how user-defined words can be added persistently to ROM TAQOZ is not documented"
    chase: "Peter Jakacki's TAQOZ documentation; BACKUP/RESTORE word semantics in TAQOZ.spin2"

  rom_vs_reloaded_word_diff:
    status: "Which specific words are in ROM TAQOZ vs. only in TAQOZ Reloaded is not documented"
    chase: "Extract ROM dictionary from ROM_Booter.lst; compare with TAQOZ Reloaded glossary"

