flash_backup:
  source: "Parallax Propeller 2 ROM Booter v33_01j, TAQOZ words BACKUP and RESTORE"
  backup: "BACKUP checks the serial flash ID and writes the first 64K of memory into flash block 0, tagged with the four characters 'TAQO' (the listing's comment: 'BACKUP the first 64K of memory into flash')."
  restore: "RESTORE reads that block back when the tag matches (the listing's comment: 'RESTORE TAQOZ from FLASH by copying to $1.0000 first'); Ctrl+R at the console runs RESTORE."

# Not documented
knowledge_gaps:
  word_behavior:
    status: "What each ROM word does is not documented in the Parallax documents; the listing shows a stack-effect comment on some words, for example CLKIN ( iomask dat -- iomask dat2 )"

  invocation_from_user_code:
    status: "Whether TAQOZ can be invoked from a running user program (vs. boot-window only) is not documented; the listing shows it started from the booter's serial command loop and by ESC typed at the P2 Monitor prompt"

