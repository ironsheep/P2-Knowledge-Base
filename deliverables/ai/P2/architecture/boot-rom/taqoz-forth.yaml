  note: "The ROM dictionary lists 432 words, each entered as a name length, the name, and a code address. The word SDRDS is entered twice. Words in the listing's dictionary that are commented out are not in the ROM and are not listed here. The 50 words flagged immediate in the dictionary are also listed under immediate_words."
