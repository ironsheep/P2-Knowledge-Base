# TAQOZ Forth — Boot ROM Interactive Forth Interpreter
# Sources (primary, cross-verified):
#   - Silicon Doc v35 (entry sequence)
#   - P2 Datasheet (entry sequence + dedicated section reference)
#   - rom-booter ingestion (ROM residence)
# Preliminary web research available at:
#   engineering/ingestion/sources/taqoz/taqoz-web-research-preliminary.md
#   (NOT used as a source for facts in this entry — see narrative for rationale)

component: TAQOZ_Forth
category: boot_rom_interface
description: |
  TAQOZ is a Forth interpreter built into the P2's 16KB mask ROM by Peter
  Jakacki (also author of Tachyon Forth, on which TAQOZ is based). It is
  one of three interactive terminal interfaces resident in the boot ROM
  (alongside the Bootloader and the P2 Monitor) and provides the only
  built-in interactive programming environment on every shipping P2.
  Because it lives in mask ROM, the ROM TAQOZ is identical and unchanging
  on every P2 ever produced.

entry_sequence:
  prerequisite: "Reset the P2 (Reset button, power cycle, or RESn pin low-to-high)"
  keystrokes:
    - 'Type "> " (greater-than character + space)'
    - 'Then press ESC (0x1B)'
  timing: "Must occur during the early boot window, before any autorun of flash/SD-resident code"
  source: "Silicon Doc v35, P2 Datasheet"

relationship_to_p2_monitor:
  shared_prompt: '"> " (greater-than + space) is shared with the P2 Monitor'
  selector_keystroke:
    monitor: "Ctrl+D (0x04) → enters P2 Monitor"
    taqoz: "ESC (0x1B) → enters TAQOZ Forth"
  functional_distinction:
    monitor: "Memory inspector / manipulator"
    taqoz: "Interactive Forth programming environment"

rom_residence:
  location: "P2 boot ROM (mask ROM)"
  identical_across_units: true
  immutable: "Cannot be updated post-fabrication"

author:
  name: "Peter Jakacki"
  forum_handle: '@"Peter Jakacki" on forums.parallax.com'
  related_project: "Tachyon Forth (the broader Forth project from which TAQOZ was derived)"
  also_maintains: |
    A separate, expanded "TAQOZ Reloaded" loaded from SD card rather than
    ROM. ROM TAQOZ is the finite, fixed version; TAQOZ Reloaded is the
    actively-developed environment. The two have different word sets;
    documentation found in the wild often does not distinguish them.

# Honest gaps — what we do NOT have authoritative sources for
