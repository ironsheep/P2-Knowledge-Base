# TAQOZ Forth — Boot ROM Interactive Forth Interpreter

component: TAQOZ_Forth
aliases:
  - "TAQOZ Forth"
  - "boot ROM TAQOZ"
  - "boot ROM Forth"
  - "ROM Forth"
category: boot_rom_interface
description: |
  TAQOZ is a Forth interpreter in the P2's 16KB boot ROM, based on Tachyon
  Forth. It is one of three interactive terminal interfaces resident in the
  boot ROM (alongside the Bootloader and the P2 Monitor). The ROM listing
  banners it "TAQOZ - Tachyon Forth for the Parallax P2 CPU ROM" and the ROM
  copy identifies itself as v33h.
source: "Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, TAQOZ, p.66; Parallax Propeller 2 ROM Booter v33_01j, TAQOZ - Tachyon Forth for the Parallax P2 CPU ROM (banner, taqoz_name)"

entry_sequence:
  prerequisite: "Reset the P2 (Reset button, power cycle, or RESn pin low-to-high)"
  keystrokes:
    - 'Type "> " (greater-than character + space)'
    - 'Then press ESC (0x1B)'
  timing: "Must occur during the early boot window, before any autorun of flash/SD-resident code"
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), OVERVIEW (hub features: boot ROM, TAQOZ Forth invocation); Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, HOST COMMUNICATION, p.11"
  how_the_rom_recognizes_it: "In the booter's serial command loop a received ESC ($1B) starts TAQOZ (Parallax Propeller 2 ROM Booter v33_01j, Attempt to get serial command, get_command)."

relationship_to_p2_monitor:
  shared_prompt: '"> " (greater-than + space) is shared with the P2 Monitor'
  selector_keystroke:
    monitor: "Ctrl+D (0x04) → enters P2 Monitor"
    taqoz: "ESC (0x1B) → enters TAQOZ Forth"
  functional_distinction:
    monitor: "Memory inspector / manipulator"
    taqoz: "Interactive Forth programming environment"

useful_for:
  source: "Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, TAQOZ, p.66"
  primary_use: >-
    Exercising and debugging P2 hardware directly from the chip: the manual describes
    TAQOZ as the way to explore "what ifs" and quickly exercise P2 hardware for testing
    or debugging. It is resident in the boot ROM and reachable over serial after
    power-up or reset.
  also: >-
    Toggling pins from a prompt, without writing, compiling and loading a program (the
    manual's example blinks an LED on P56 with `56 blink`).

rom_residence:
  source: "Parallax Propeller 2 ROM Booter v33_01j, Start TAQOZ (_Start_TAQOZ, _Enter_TAQOZ)"
  location: "P2 boot ROM"
  startup: "Starting TAQOZ resets the booter's serial interrupts and autobaud, copies the 16 KB ROM image into hub RAM at $C000, and starts the TAQOZ kernel in cog 0."
  version: "The ROM copy names itself v33h (taqoz_name); Ctrl+V prints the version. The prompt is 'TAQOZ' followed by the current number-base character."

hub_memory_layout:
  source: "Parallax Propeller 2 ROM Booter v33_01j, TAQOZ CON blocks (codeorg, ramdict) and COLD Force factory defaults (COLDST, FIXDICT)"
  rom_copy: "$C000, the 16 KB ROM image copied at start"
  dictionary: "$B400 (ramdict): the ROM dictionary of 2,890 bytes is copied here at a cold start; the listing's comment on it reads 'dictionary can be moved elsewhere at runtime'"
  code_origin: "$1000 (codeorg): where compiled code starts"

console:
  source: "Parallax Propeller 2 ROM Booter v33_01j, CONSOLE INPUT HANDLERS (doCHAR)"
  input_model: "Each word is acted on when a delimiter is typed (realtime stream parsing)."
  control_characters:
    - "LF: discarded"
    - "CR: ends the line"
    - "Backspace (and DEL, replaced by backspace): erases the previous character; with nothing to erase it sounds the bell"
    - "TAB: replaced by a space"
    - "ESC: cancels the line"
    - "Ctrl+C: RESET"
    - "Ctrl+D: DEBUGGER, which enters the P2 Monitor"
    - "Ctrl+Q: prints the top of the stack"
    - "Ctrl+S: clears the stack"
    - "Ctrl+V: prints the version"
    - "Ctrl+W: WORDS, which lists the dictionary words"
    - "Ctrl+X: re-executes the previous compiled line"
    - "Ctrl+B: block dump"
    - "Ctrl+R: RESTORE, restoring TAQOZ from flash"
    - "Ctrl+K: COLDST then RESET, forcing factory defaults"
    - "$1F (the listing's '^?'): DEBUG"
    - "$1C (the listing's '^|'): multi-line interactive entry"

