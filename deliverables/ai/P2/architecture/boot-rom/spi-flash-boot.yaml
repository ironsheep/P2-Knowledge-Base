# SPI Flash Boot — Two-Phase Path from Power-Up to Running Application
# Sources:
#   - Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release (boot pattern, pin functions)
#   - Parallax SPI Flash Programmer and Boot Loader v51 (the flash loader listing)
#   - Parallax Propeller 2 ROM Booter v33_01j (the silicon ROM listing)

component: spi_flash_boot
category: boot_rom
description: |
  P2 SPI flash boot is a TWO-PHASE process. The silicon ROM Booter
  autoprobes for flash, loads the first 1KB into Cog 0, verifies the
  "Prop" checksum, and JMP #0's into the loaded code. The loaded code
  (the "flash loader") then reads the remainder of the application
  from flash into hub RAM, verifies it, and starts the user code via
  COGINIT #0,#$00000.

# Where the facts on this page come from
sources:
  - "rom_behavior: Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, Boot Up, p.11; Parallax Propeller 2 ROM Booter v33_01j, Cog init (try_spi) and Serial done (serial_done, shut_down)"
  - "flash_loader_behavior: Parallax SPI Flash Programmer and Boot Loader v51, Loader (header comment: the post-load SPI state; Read in remaining application longs; Verify application checksum)"

# When this path is taken
boot_pattern_trigger:
  source: "Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, Boot Up (Boot Pattern table), p.11"
  see: architecture/boot-rom/boot-pattern-selection.yaml
  flash_priority_patterns:
    - pattern: "P61=pull-up, P60=don't care, P59=float"
      procedure: "Program from serial within 100 ms or boot from flash.  If fails, program from serial within 60 s window."
    - pattern: "P61=pull-up, P60=don't care, P59=pull-down"
      procedure: "Fast boot from flash; no serial.  If it fails, shutdown."

# Fixed pin assignment (silicon)
pin_assignment:
  spi_cs: "P61 — chip select (P2 → flash, active low)"
  spi_ck: "P60 — serial clock (P2 → flash)"
  spi_di: "P59 — data IN to flash (P2 → flash, the flash's SI/MOSI)"
  spi_do: "P58 — data OUT of flash (P2 ← flash, the flash's SO/MISO)"
  note: "Custom boards intending to boot from flash MUST wire SPI flash to these pins; the Parallax Edge modules follow this assignment"

# Phase 1: ROM Booter (silicon behavior)
phase_1_rom_booter:
  autoprobe: "ROM probes for SPI memory on the fixed pin assignment: it sends exit-quad and exit-dual sequences, reset-enable and reset ($66, $99) and write-disable ($04), then reads the status register ($05); if WEL is still high there is no SPI memory, and if BUSY is high it waits"
  read_operation:
    flash_address_range: "$000000..$0003FF (first 1KB = 256 longs)"
    destination: "Cog 0 register space $000..$0FF"
  prop_checksum:
    algorithm: "Sum all 256 loaded longs as 32-bit values"
    required_sum: '$706F7250 (ASCII "Prop")'
    on_success: "ROM does JMP #0 → execution starts at the loaded code"
    on_failure: "The loaded code is not run. With a pull-up on P60 the ROM tries the SD card; otherwise, with P59 floating it falls back to serial loading (60 s window), and with P59 pulled down it shuts down"
    flash_writer_responsibility: |
      The program that writes flash must insert a correction long so
      the 256-long sum equals exactly $706F7250. Canonical formula:
      loader_sum = "Prop" - sum_of_first_256_longs

# Phase 2: Post-load SPI state — the behavioral contract
phase_2_post_load_state:
  description: |
    When the ROM does JMP #0, the SPI bus is left in a specific state
    that the loader relies on to read the rest of the application.
  bus_state:
    spi_cs: "Low output (asserted — flash still selected)"
    spi_ck: "Low output (parked between edges)"
    spi_do: |
      Flash is MID-STREAM, currently presenting bit 7 of the byte at
      flash address $400. The READ command the ROM issued at $0 has
      continued through $1, $2, ... and is now at $400. To continue
      reading, the loader simply toggles spi_ck and captures bits on
      spi_do — NO new READ command needed.
  cog_clock:
    source: |
      RCFAST is active. The ROM does not switch clocks before JMP #0;
      the cog runs at the RCFAST rate (20-30 MHz).
      Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, AC Characteristics, p.48.
    significance: |
      The flash loader executes its entire SPI dance under RCFAST. The
      user's _clkfreq only takes effect AFTER the loader's final COGINIT
      to the user application — so the loader is clock-mode-agnostic:
      identical code and timing regardless of what crystal/PLL config
      the user program ultimately selects.
    spi_rate_consequence: |
      The loader runs SCK at sysclk/2 (one clock per spi_ck transition),
      so under RCFAST (20-30 MHz) SCK is about 10-15 MHz.
    custom_loader_caveat: |
      Custom flash loaders wishing to use a faster sysclk must HUBSET to
      switch clocks AND keep the streamer NCO / WXPIN pair in bit-edge
      lockstep (see language/pasm2/concepts/streamer_smartpin_control.yaml).
      The flash loader uses its WAITX #3 alignment pad between WYPIN and
      XINIT only at its own sysclk/2 setting.

# Phase 3: Flash loader handoff
phase_3_flash_loader:
  case_study: code-examples/flash-loader-case-study.yaml
  cog_image_layout:
    total: "256 longs (the 1KB the ROM loaded)"
    partitions:
      - "Loader code (runs on every flash boot)"
      - "Loader data longs set by the programmer: app_longs, app_longs2, app_sum, loader_sum"
      - "First slice of the user application (app_start..$0FF)"
    programmer_note: "The programmer runs once, from the serial download, and writes the loader and the application to flash; it is not part of the 1KB image the ROM loads"
  loader_flow:
    - "Continue reading from flash $400 via the mid-stream SPI state (no new READ)"
    - "Stream application bytes from flash to hub RAM starting at $00000"
    - "Verify application-level checksum"
    - "Success: COGINIT #0,#$00000 to run the user app"
    - "Failure: float SPI pins (FLTL #spi_di ADDPINS 2) and HUBSET #%0010 to halt"
  techniques_used: "See code-examples/flash-loader-case-study.yaml for the full annotated catalog"

# Failure modes (terse)
failure_modes:
  flash_unresponsive: "ROM autoprobe fails → falls through to next configured boot path (per pattern), or shuts down"
  prop_checksum_fail: "The ROM does not run the loaded code; it tries the SD card (pull-up on P60), else serial loading (P59 floating) or shutdown (P59 pulled down), per the boot pattern"
  application_checksum_fail: "Loader floats SPI pins and stops the clock via HUBSET until the next reset"

# Cross-references
related:
