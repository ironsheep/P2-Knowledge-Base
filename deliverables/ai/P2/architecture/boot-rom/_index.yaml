# Boot ROM Documentation Index
# Download-on-demand manifest for P2 Boot ROM subsystem
# Use this file to identify which file contains the information you need
# Sources: Hardware Manual (BOOT-PROCESS-COMPLETE), Silicon Doc v35, P2 Datasheet,
#          Parallax P2 boot ROM listing (ROM_Booter.lst),
#          Parallax P2 flash_loader.spin2 (golden flash loader),
#          P2 Edge Standard Module (Edge DIP-switch mapping),
#          P2 Edge 32MB Module (Edge 32MB DIP-switch mapping),
#          TAQOZ preliminary research (tracked in the ingestion tree)

component: boot_rom
description: |
  The P2's boot subsystem — a 16KB mask ROM containing the Bootloader, the
  P2 Monitor debug interface, and the TAQOZ Forth interpreter. (Those three are
  what the Hardware Manual's content line names; a prior form of this sentence
  added utility routines, character font data and math tables, which no source
  states — F-403.) On power-up or reset, the Bootloader
  reads three boot pattern pins (P59-P61) and selects one of three boot
  paths: serial (P63/P62), SPI flash (P58-P61), or microSD card. Each path
  has documented fallback behavior. The Monitor and TAQOZ are interactive
  terminal interfaces accessible only during the early boot window before
  the autorun handoff.
version: "1.0"
last_updated: "2026-05-23"

# Boot timing (from Hardware Manual)
boot_timing:
  source: "P2 Hardware Manual, Boot Up -- engineering/ingestion/sources/p2-hardware-manual/p2-hardware-manual-text.txt:262-263"
  trigger: "Upon any power-up, reset (RESn) pin low-to-high, or software reset event."
  sequence: "The Propeller 2 delays for 3 ms, engages the fast clock, then loads up Cog 0 with the ROM-resident Bootloader within 2 ms."
  reset_to_bootloader: "Within 5 ms, the Propeller 2 loads its Bootloader into cog 0. -- engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:436"
  serial_loader_active: "Unless forbidden by the Boot Pattern or preempted by a program in an SPI memory chip, the serial loader becomes active within 15ms of reset being released. -- engineering/ingestion/sources/p2-hardware-manual/p2-hardware-manual-text.txt:1595"

# Boot pin overview (full details: boot-pattern-selection.yaml)
boot_pins:
  range: "P58-P63 serve boot functions; become general-purpose after boot completes"
  pattern_pins: "P59-P61 read as a 3-bit pattern (each pin: float / pull-up / pull-down) to select boot source"
  serial_pins: "P63 = RX, P62 = TX during serial boot"
  flash_pins: "P58-P61 form the SPI flash interface when flash boot is selected (P61=CS, P60=CK, P59=DI, P58=DO)"
  reset_pin: "RESn — active low, triggers boot sequence on low-to-high transition"

# File manifest - download only what you need
files:
  pattern_selection:
    path: boot-pattern-selection.yaml
    size: ~140 lines
    use_when:
      - "Configuring boot source on a custom board"
      - "Understanding why a P2 boots to a particular source"
      - "Mapping Edge module DIP switches to P2 boot pins"
      - "Diagnosing boot mode selection problems"
    contains:
      - Complete Hardware Manual boot pattern table (P59-P61 states → boot procedure)
      - Edge module DIP switch → pin mapping (FLASH switch → P61; △/▽ → P59)
      - Triple-duty pin explanation (pattern selector → flash interface → general I/O)
      - Fallback behavior per pattern

  rom_contents:
    path: boot-rom-contents.yaml
    size: ~80 lines
    use_when:
      - "Understanding what's in the 16KB boot ROM"
      - "Identifying which ROM-resident component handles a given function"
      - "Researching ROM features beyond the bootloader"
    contains:
      - The three ROM residents the Hardware Manual names (Bootloader, Monitor, TAQOZ), plus the shared subroutines observed in the listing
      - Size and purpose of each
      - Cross-references to the per-component entries (Monitor, TAQOZ)
      - ROM listing source pointer (rom-booter ingestion)

  spi_flash_boot:
    path: spi-flash-boot.yaml
    size: ~160 lines
    use_when:
      - "Understanding the SPI flash boot path end-to-end"
      - "Designing custom boards that boot from flash"
      - "Debugging flash boot failures"
      - "Understanding the ROM→flash-loader handoff contract"
    contains:
      - "Fixed pin assignment (P61=CS, P60=CK, P59=DI, P58=DO)"
      - 'ROM contract (read first 1KB from flash, verify "Prop" checksum, JMP #0)'
      - "Post-load SPI bus state (the behavioral contract the flash_loader exploits)"
      - 'Prop checksum mechanism'
      - "Flash loader handoff (cited to flash_loader.spin2 as golden source)"

  sd_card_boot:
    path: sd-card-boot.yaml
    size: ~80 lines
    use_when:
      - "Designing SD-card-bootable P2 systems"
      - "Understanding SD card boot requirements"
      - "Diagnosing SD boot failures"
    contains:
      - SD card boot pin pattern requirement (P60 = pull-up)
      - File system constraints (FAT32 — see verification note)
      - Fallback behavior (serial 60s window vs shutdown)
      - Edge module SD wiring note (verification_pending for P60 generation)

  p2_monitor:
    path: p2-monitor.yaml
    size: ~70 lines
    use_when:
      - "Inspecting or modifying P2 memory interactively"
      - "Debugging boot or early-runtime issues"
      - "Looking up the entry sequence from a serial terminal"
    contains:
      - Entry sequence (`> ` + Ctrl+D after reset)
      - Sourced command example (`000-010L` lists 16 longs of register RAM)
      - Distinction from TAQOZ (Monitor inspects/manipulates; TAQOZ programs)
      - Known capability surface; explicit gap markers for full command reference

  taqoz_forth:
    path: taqoz-forth.yaml
    size: ~120 lines
    use_when:
      - "Looking up how to enter the ROM Forth interpreter"
      - "Distinguishing ROM TAQOZ from TAQOZ Reloaded"
      - "Finding authoritative TAQOZ documentation"
      - "Understanding TAQOZ's role as a soft boot loader"
    contains:
      - Entry sequence (`> ` + ESC after reset)
      - High-confidence facts (entry mechanism, ROM residence, Peter Jakacki as author)
      - Preliminary-research facts with confidence tiers (banner string, word categories, BACKUP/RESTORE)
      - Distinction from TAQOZ Reloaded
      - Pointers to primary documentation (Parallax forums, TAQOZ.spin2 source)
      - Explicit gap markers for unverified claims

# Quick decision tree
decision_tree:
  "How does the P2 boot?": _index.yaml
  "How do I configure which source my P2 boots from?": boot-pattern-selection.yaml
  "What's actually in the 16KB boot ROM?": boot-rom-contents.yaml
  "How does flash boot work step-by-step?": spi-flash-boot.yaml
  "What does the ROM do before handing off to user code?": spi-flash-boot.yaml
  "How does SD card boot work?": sd-card-boot.yaml
  "How do I use the serial loader protocol?": ../serial_loader.yaml
  "How do I enter the debug monitor?": p2-monitor.yaml
  "How do I enter the Forth interpreter?": taqoz-forth.yaml
  "What's the difference between ROM TAQOZ and TAQOZ Reloaded?": taqoz-forth.yaml
  "Where is the flash loader source?": ../../code-examples/flash-loader-case-study.yaml

# Related resources outside this directory
related:
  # Serial loader protocol (existing comprehensive entry)
  - architecture/serial_loader.yaml
  # Flash loader case study (annotated reference)
  - code-examples/flash-loader-case-study.yaml
  # Boot-relevant instructions
  - language/pasm2/coginit.yaml
  - language/pasm2/hubset.yaml
  # SPI implementation (smart-pin based, distinct from flash boot)
  - architecture/smart-pins/spi-implementation-guide.yaml
  # Clock system (boot sequence engages fast clock; see HUBSET clock config)
  - architecture/clock_system.yaml
  # Hub memory (boot ROM area, loaded code destination)
  - architecture/hub.yaml

# Boot path summary (orientation for new readers)
boot_paths_summary:
  source: "P2 Hardware Manual, Boot Up -- Boot Pattern table -- engineering/ingestion/sources/p2-hardware-manual/p2-hardware-manual-text.txt:269-282; Host Serial and Boot Memory Connections table -- :285-291"
  pattern_notation: "Set by floating connection 'f', pull-up resistor 'up', or pull-down resistor 'down'. Don't care is 'any'."
  serial:
    pins: "P63 (in) = TX from host; P62 (out) = RX at host"
    triggered_when: "P61=f P60=f P59=f -- Program from serial within 60 s window; and P61=any P60=any P59=up -- Program from serial within 60 s window; no flash or microSD card boot."
    also_reached_as: "The 100 ms window that precedes flash boot, and the 60 s fallback window after a failed flash or microSD boot."
    canonical_entry: architecture/serial_loader.yaml

  spi_flash:
    pins: "P61 (out) = CSn, P60 (out) = CLK, P59 (out) = DI, P58 (in) = DO -- named from the flash chip's side, so P59 carries data into the flash (MOSI) and P58 carries data out of it (MISO)."
    triggered_when: "P61=up P60=any P59=f -- Program from serial within 100 ms or boot from flash. If fails, program from serial within 60 s window. And P61=up P60=any P59=down -- Fast boot from flash; no serial. If it fails, shutdown."
    canonical_entry: architecture/boot-rom/spi-flash-boot.yaml

  sd_card:
    pins: "P61 (out) = CLK, P60 (out) = CSn, P59 (out) = DI, P58 (in) = DO"
    triggered_when: "P61=f or down, P60=up, P59=f -- Boot from microSD card. If fails, program from serial within 60 s window. And P61=f or down, P60=up, P59=down -- Boot from microSD card. If it fails, shutdown."
    p60_pullup_note: "The P60 pull-up is built into the microSD card."
    canonical_entry: architecture/boot-rom/sd-card-boot.yaml
