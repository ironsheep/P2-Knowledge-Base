# Boot ROM Contents — What Lives in the P2's 16KB Mask ROM
# Sources:
#   - Hardware Manual 2022-11-01 (boot ROM size and content list)
#     (boot ROM size/content consolidated from the Hardware Manual)
#   - Parallax Propeller 2 ROM Booter v33_01j (assembly listing of the Prop2 silicon ROM)
#   - Parallax P2 Datasheet (cross-reference)
#   - Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), OVERVIEW (cross-reference)

component: boot_rom_contents
category: boot_rom
description: |
  The P2 has 16KB of ROM that contains the boot subsystem plus several
  utility resources. This entry inventories what lives in that ROM and
  how each component is used.

# Top-level summary
rom_facts:
  total_size: "16 KB (16,384 bytes)"
  location: "ROM in the P2 silicon"
  hub_write_protection: "Hub also has a write-protectable upper 16KB used for debug state — see architecture/hub.yaml. NOTE: that 16KB is HUB space, distinct from the ROM 16KB documented here."

# The one authoritative statement of what the ROM CONTAINS.
authoritative_content_list:
  statement: "ROM | 16 KB (Bootloader, P2 Monitor debug interface, and TAQOZ (Forth) command interface)"
  names: 3
  source: "Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, OVERVIEW (Specifications table, ROM row), p.9; what_other_sources_say: Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, FEATURES (16KB boot ROM), p.2, and Parallax Propeller 2 Documentation v35 (Rev B/C silicon), OVERVIEW (hub features: 16KB boot ROM)"
  what_other_sources_say: "The P2 Datasheet and the Propeller 2 Documentation v35 state only '16KB boot ROM' and inventory nothing."

# ROM residents (per Hardware Manual + ROM booter narrative)
residents:
  bootloader:
    role: "Power-on / reset boot logic"
    description: |
      First code that executes on power-up or reset. Reads the P59-P61
      pattern (see architecture/boot-rom/boot-pattern-selection.yaml),
      selects a boot path (serial / SPI flash / SD card), and either loads
      and jumps to user code or hands off to one of the interactive
      interfaces (Monitor or TAQOZ) on the appropriate keystroke trigger.
    source: "Parallax Propeller 2 ROM Booter v33_01j, Cog init (pull-up checks on spi_di, spi_cs and spi_ck choose serial, SPI memory or SD card; try_spi) and Attempt to get serial command (get_command: ESC starts TAQOZ, Ctrl-D starts the Monitor)"
    canonical_entries:
      - architecture/boot-rom/_index.yaml
      - architecture/boot-rom/boot-pattern-selection.yaml
      - architecture/boot-rom/spi-flash-boot.yaml
      - architecture/boot-rom/sd-card-boot.yaml
      - architecture/serial_loader.yaml

  p2_monitor:
    role: "Interactive debug / memory inspection interface"
    description: |
      Built-in terminal interface for viewing and manipulating memory
      (register RAM, lookup RAM, hub RAM) and loading code from microSD. Accessible
      only during the early boot window via the serial-escape sequence.
    entry_keystroke: '"> " (greater-than + space) then Ctrl+D'
    canonical_entry: architecture/boot-rom/p2-monitor.yaml

  taqoz_forth:
    role: "Interactive Forth programming environment"
    description: |
      Forth interpreter based on Tachyon Forth. Its ROM dictionary of 432
      words includes smart-pin words, cog-control words, SPI-flash words
      and SD-card words (see architecture/boot-rom/taqoz-forth.yaml).
      Accessible only during the early boot window via the serial-escape
      sequence.
    entry_keystroke: '"> " (greater-than + space) then ESC'
    canonical_entry: architecture/boot-rom/taqoz-forth.yaml

  utility_routines:
    role: "Shared subroutines called by the ROM components"
    description: |
      The ROM components share routines. The Monitor and TAQOZ entry points
      (_Start_Monitor, _Start_TAQOZ) both first call _reset_booter, which resets
      the booter's serial interrupts and autobaud. The booter's SD-card boot path
      (_Start_SDcard) and the Monitor's run- and load-from-SD commands
      (_Run_SDfile, _Load_SDfile) share the SD routines _readFILE and _releaseDO.
      The Hardware Manual's content line names three residents and does not
      break out these shared routines as a fourth.
    status: "shared routines in the listing; not a separately documented ROM component"
    source: "Parallax Propeller 2 ROM Booter v33_01j, LMM Monitor (_reset_booter, _Start_Monitor; the R/L SD-file command), Start TAQOZ (_Start_TAQOZ) and SD Card (_Start_SDcard, _Run_SDfile, _Load_SDfile)"

# What's NOT in the boot ROM (common misconceptions)
not_in_rom:
  user_code: "User application code lives in hub RAM (loaded by the bootloader from serial/flash/SD); not in ROM"
  spin2_runtime: "The Spin2 bytecode interpreter is part of the compiled binary, not the ROM"
  cordic_solver: "CORDIC is a silicon engine, not ROM code — see architecture/cordic.yaml"
  smart_pin_logic: "Smart pin behavior is silicon-implemented, not ROM-resident"

# Cross-references
related:
  - architecture/boot-rom/_index.yaml
  - architecture/boot-rom/p2-monitor.yaml
  - architecture/boot-rom/taqoz-forth.yaml
  - architecture/hub.yaml
  - architecture/cordic.yaml
