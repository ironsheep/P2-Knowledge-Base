# Boot ROM Contents — What Lives in the P2's 16KB Mask ROM
# Sources:
#   - Hardware Manual 2022-11-01 (boot ROM size and content list)
#     (boot ROM size/content consolidated from the Hardware Manual)
#   - Parallax P2 boot ROM listing (ROM_Booter.lst — assembly listing of the ROM)
#   - Parallax P2 Datasheet (cross-reference)
#   - P2 Silicon Doc v35 (cross-reference)

component: boot_rom_contents
category: boot_rom
description: |
  The P2 has 16KB of mask-programmed ROM that contains the boot subsystem
  plus several utility resources. The ROM is programmed during chip
  fabrication and is identical on every shipping P2 unit. This entry
  inventories what lives in that ROM and how each component is used.

# Top-level summary
rom_facts:
  total_size: "16 KB (16,384 bytes)"
  location: "Mask ROM in the P2 silicon"
  modification: "Cannot be modified post-fabrication"
  identical_across_units: true
  hub_write_protection: "Hub also has a write-protectable upper 16KB used for debug state — see architecture/hub.yaml. NOTE: that 16KB is HUB space, distinct from the ROM 16KB documented here."

# The one authoritative statement of what the ROM CONTAINS.
authoritative_content_list:
  statement: "ROM | 16 KB (Bootloader, P2 Monitor debug interface, and TAQOZ (Forth) command interface)"
  names: 3
  source: "P2 Hardware Manual 2022-11-01 -- engineering/ingestion/sources/p2-hardware-manual/p2-hardware-manual-text.txt:210"
  corroboration: "Same three-item list recorded in engineering/ingestion/extraction-matrices/BOOT-PROCESS-COMPLETE.md ('Boot ROM Contents (16 KB)')."
  what_other_sources_say: "The P2 Datasheet (p2-datasheet-text.txt:99) and the Silicon Doc (silicon-doc-text.txt:189) state only '16KB boot ROM' and inventory nothing. No ingested source inventories the ROM more finely than the line above."

# ROM residents (per Hardware Manual + ROM booter narrative)
residents:
  bootloader:
    role: "Power-on / reset boot logic"
    description: |
      First code that executes on power-up or reset. Handles initial chip
      configuration, clock setup, memory initialization, and boot source
      detection. Reads the P59-P61 pattern (see architecture/boot-rom/boot-pattern-selection.yaml),
      selects a boot path (serial / SPI flash / SD card), and either loads
      and jumps to user code or hands off to one of the interactive
      interfaces (Monitor or TAQOZ) on the appropriate keystroke trigger.
    source_listing: "Parallax P2 boot ROM listing (ROM_Booter.lst; also rom_booter_v33_01j.lst)"
    canonical_entries:
      - architecture/boot-rom/_index.yaml
      - architecture/boot-rom/boot-pattern-selection.yaml
      - architecture/boot-rom/spi-flash-boot.yaml
      - architecture/boot-rom/sd-card-boot.yaml
      - architecture/serial_loader.yaml

  p2_monitor:
    role: "Interactive debug / memory inspection interface"
    description: |
      Built-in terminal interface for viewing and manipulating memory
      (register RAM, hub RAM) and loading code from microSD. Accessible
      only during the early boot window via the serial-escape sequence.
    entry_keystroke: '"> " (greater-than + space) then Ctrl+D'
    canonical_entry: architecture/boot-rom/p2-monitor.yaml

  taqoz_forth:
    role: "Interactive Forth programming environment"
    description: |
      Forth interpreter authored by Peter Jakacki. Provides a full
      interactive programming environment with hardware access words,
      smart-pin helpers, and SD/flash utilities. Accessible only during
      the early boot window via the serial-escape sequence.
    entry_keystroke: '"> " (greater-than + space) then ESC'
    canonical_entry: architecture/boot-rom/taqoz-forth.yaml

  # REMOVED 2026-09-08 (F-403): `character_font_data` and `math_tables` were
  # listed here as ROM residents carrying
  # `verification_status: "Existence confirmed"`. Existence was NOT confirmed.
  # Their only source was engineering/ingestion/sources/rom-booter/
  # rom-booter-narrative.txt:51-56, which is OUR OWN GENERATED SUMMARY of the
  # listing (commit 9fcf7d84, "Complete narrative text generation"), not a
  # Parallax document. The Hardware Manual states the ROM's contents in one line
  # and names three things, not five or six (see authoritative_content_list
  # below), and the ROM assembly listing itself returns ZERO hits for font,
  # glyph, sine, sin_ and log2 in both editions -- while returning 48 for TAQOZ
  # and 40 for Monitor/debugger, so the search is not blind to real residents.
  #
  # This does NOT assert that the ROM contains no font or math data. A 16 KB mask
  # ROM can hold unlabelled data blocks no symbol name would reveal. It records
  # that no source we hold supports them, so the KB does not state them. Open
  # question for Chip Gracey, not for a document.

  utility_routines:
    role: "Shared subroutines called by the ROM components"
    description: |
      The ROM listing contains subroutines called from the bootloader, Monitor
      and TAQOZ paths. This is an observation about the code in the listing, NOT
      a documented ROM component -- the Hardware Manual's content line names
      three residents and does not break out helper code as a fourth. Not
      callable from user code.
    status: "observed in the listing; not a documented ROM component"
    source: "engineering/ingestion/sources/rom-booter/ROM_Booter.lst (call sites)"

# What's NOT in the boot ROM (common misconceptions)
not_in_rom:
  user_code: "User application code lives in hub RAM (loaded by the bootloader from serial/flash/SD); not in ROM"
  spin2_runtime: "The Spin2 bytecode interpreter is part of the compiled binary, not the ROM"
  cordic_solver: "CORDIC is a silicon engine, not ROM code — see architecture/cordic.yaml"
  smart_pin_logic: "Smart pin behavior is silicon-implemented, not ROM-resident"

# Cross-references
related:
  - architecture/boot-rom/_index.yaml
  - architecture/boot-rom/p2-monitor.yaml
  - architecture/boot-rom/taqoz-forth.yaml
  - architecture/hub.yaml
  - architecture/cordic.yaml
