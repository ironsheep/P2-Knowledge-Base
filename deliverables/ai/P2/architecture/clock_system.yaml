# Only the wrong/correct pairs the sources state. Two entries carried by the pre-purge
# form of this block -- a hardcoded-WAITX pattern and a use-CLKFREQ-before-init pattern --
# are authored advice that no ingested source states, and are not restored.
anti_patterns:
  conflicting_definitions:
    wrong: "_rcfast together with _clkfreq"
    reason: "v55 states the clock-setup symbols as a closed set of combinations: \"These symbols must be defined in one of the following combinations.\" _rcfast and _rcslow each appear alone."
    source: "engineering/ingestion/sources/spin2-v55/spin2-v55-text.txt:1716-1725"

  missing_crystal_frequency:
    wrong: "_clkfreq alone on a board whose crystal is not 20 MHz"
    correct: "Declare _xtlfreq to match the actual crystal, alongside _clkfreq."
    reason: "_clkfreq alone \"Selects XI/XO-crystal-plus-PLL mode, assumes 20 MHz crystal.\""
    source: "engineering/ingestion/sources/spin2-v55/spin2-v55-text.txt:1718"

  no_stabilization_wait:
    wrong: "HUBSET to the PLL clock source in the same step that enables the crystal and PLL."
    correct: "Enable crystal+PLL while staying in RCFAST, WAITX ##20_000_000/100 for ~10ms, then HUBSET again to switch to the PLL."
    source: "engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:851-864"

  unsafe_switch_away_from_pll:
    wrong: "Switching directly from %SS = %11 to another clock source."
    correct: "Always start by switching to an internal oscillator using either HUBSET #$F0 (for RCFAST) or HUBSET #$F1 (for RCSLOW)."
    reason: "Incorrectly switching away from the PLL setting (%SS = %11) can cause a glitch which will hang the clock circuit."
    source: "engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:837-839"

