# Clock System - Flexible Multi-Source Clock Generation
# Source: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), HUB, Configuring the Clock Generator;
#         Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, AC Characteristics, p.48

component: Clock_System
category: timing
aliases:
  - RCFAST
  - RCSLOW
  - PLL
  - CLKFREQ
  - CLKMODE
  - XI
  - XO
  - HUBSET
description: |
  The system clock is the time base for all internal components. It comes from
  one of four sources, selected by HUBSET under software control: the internal
  RCFAST oscillator (the boot-up source), the internal RCSLOW oscillator (for
  low-power operation), the XI pin (an external clock or a crystal on XI and
  XO), or the PLL fed by XI (clock_sources gives the frequencies). The PLL divides the
  XI frequency by 1..64, multiplies it by 1..1024 in the VCO, and passes the VCO
  output on directly or divided by 2, 4, 6, ... 30. The clock can also be
  stopped for lowest power until reset.
source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, System Clock, p.17; Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), OVERVIEW (clock modes: software control, glitch-free switching between sources, clock can be stopped for lowest power until reset) and HUB, Configuring the Clock Generator"

# Spin2 hub variables holding the current clock setup
hub_variables:
  source: "Parallax Propeller 2 Spin2 Language Documentation v55, Clock Setup (for Spin2 programs, two hub variables are maintained which reflect the current clock setup)"
  CLKFREQ:
    address: "$00044"
    description: "Current clock frequency in Hz, located at LONG[$44] in Spin2 programs; initialized with the clkfreq_ value"
    access: "Read/Write (writing directly is not recommended; CLKSET updates both variables and switches the clock safely)"
  CLKMODE:
    address: "$00040"
    description: "Current clock mode, located at LONG[$40] in Spin2 programs; initialized with the clkmode_ value"
    access: "Read/Write (writing directly is not recommended; CLKSET updates both variables and switches the clock safely)"

# Compile-time clock-setup symbols. The definition home for these symbols is
# language/spin2/constants/special-configuration-symbols.yaml; this block names the
# set and the source that defines it, rather than carrying a second copy.
configuration_constants:
  source: "Parallax Propeller 2 Spin2 Language Documentation v55, Clock Setup"
  definition_home: language/spin2/constants/special-configuration-symbols.yaml
  symbols:
    - "_clkfreq -- desired system clock frequency"
    - "_xtlfreq -- XI/XO crystal frequency"
    - "_xinfreq -- XI input frequency"
    - "_errfreq -- allowable frequency error; defaults to 1_000_000 when not declared"
    - "_rcfast -- internal RCFAST oscillator"
    - "_rcslow -- internal RCSLOW oscillator"
    - "_AUTOCLK -- declare = 0 to inhibit the auto-prepended clock-setter program in PASM-only programs"
  compiler_defined_symbols:
    clkmode_: "The compiled clock mode, settable via HUBSET. Also stored in the hub variable 'clkmode'."
    clkfreq_: "The compiled clock frequency. Also stored in the hub variable 'clkfreq'."
    inheritance: "Both values may differ in each file of the application hierarchy; files below the top-level file do not inherit the top-level file's value."

# The legal CON declaration combinations and the clock mode each selects.
# v55 states these as a closed set: "These symbols must be defined in one of the
# following combinations." Rule text and %CC_SS values are the source's own.
configuration_rules:
  source: "Parallax Propeller 2 Spin2 Language Documentation v55, Clock Setup"
  closed_set: "These symbols must be defined in one of the following combinations."
  combinations:
    - declaration: "_clkfreq (with optional _errfreq)"
      effect: "Selects XI/XO-crystal-plus-PLL mode, assumes 20 MHz crystal. The optimal PLL setting will be computed to achieve _clkfreq. Compilation fails if _clkfreq +/- _errfreq is unachievable."
      hubset_cc_ss: "10_11"
    - declaration: "_xtlfreq + _clkfreq (with optional _errfreq)"
      effect: "Selects XI/XO-crystal-plus-PLL mode, along with frequencies. Compilation fails if _clkfreq +/- _errfreq is unachievable."
      hubset_cc_ss: "1x_11"
    - declaration: "_xinfreq + _clkfreq (with optional _errfreq)"
      effect: "Selects XI-input-plus-PLL mode, along with frequencies. Compilation fails if _clkfreq +/- _errfreq is unachievable."
      hubset_cc_ss: "01_11"
    - declaration: "_xtlfreq alone"
      effect: "Selects XI/XO-crystal mode and frequency."
      hubset_cc_ss: "1x_10"
    - declaration: "_xinfreq alone"
      effect: "Selects XI-input mode and frequency."
      hubset_cc_ss: "01_10"
    - declaration: "_rcslow"
      effect: "Selects internal RCSLOW oscillator which runs at ~20 KHz."
      hubset_cc_ss: "00_01"
    - declaration: "_rcfast"
      effect: "Selects internal RCFAST oscillator which runs at 20 MHz+."
      hubset_cc_ss: "00_00"
    - declaration: "No symbol and not DEBUG mode"
      effect: "Selects internal RCFAST oscillator which runs at 20 MHz+."
      hubset_cc_ss: "00_00"
    - declaration: "No symbol and DEBUG mode"
      effect: "Selects XI/XO-crystal mode and 20 MHz to facilitate DEBUG."
      hubset_cc_ss: "10_10"
  cap_selection: "If _xtlfreq >= 16_000_000 then x=0 for 15pF per XI/XO, else x=1 for 30pF per XI/XO."
  errfreq_default: "The _errfreq declaration is optional, since _errfreq defaults to 1_000_000."

pll_system:
  source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, System Clock (HUBSET bit fields and PLL Example), pp.18-19; independently in Parallax Propeller 2 Documentation v35 (Rev B/C silicon), HUB, Configuring the Clock Generator; overclocking: Parallax Propeller 2 Documentation v35 (Rev B/C silicon), HUB, Configuring the Clock Generator; cross_source_conflict: Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, System Clock Configuration, p.26"
  enable:
    field: "%E"
    values: "0/1 -- PLL off/on"
    note: "XI input must be enabled by %CC. Allow 10ms for crystal+PLL to stabilize before switching over to PLL clock source."
  input_divider:
    field: "%DDDDDD"
    values: "0..63"
    effect: "1..64 division of XI pin frequency"
    note: "This divided XI frequency feeds into the phase-frequency comparator's 'reference' input."
  vco_multiplier:
    field: "%MMMMMMMMMM"
    values: "0..1023"
    effect: "1..1024 division of VCO frequency"
    note: "This divided VCO frequency feeds into the phase-frequency comparator's 'feedback' input. This frequency division has the effect of multiplying the divided XI frequency (per %DDDDDD) inside the VCO."
  vco_range: "The PLL's VCO is designed to run between 100 MHz and 200 MHz and should be kept within that range."
  post_divider:
    field: "%PPPP"
    mapping:
      0: "VCO / 2"
      1: "VCO / 4"
      2: "VCO / 6"
      3: "VCO / 8"
      4: "VCO / 10"
      5: "VCO / 12"
      6: "VCO / 14"
      7: "VCO / 16"
      8: "VCO / 18"
      9: "VCO / 20"
      10: "VCO / 22"
      11: "VCO / 24"
      12: "VCO / 26"
      13: "VCO / 28"
      14: "VCO / 30"
      15: "VCO / 1"
    note: "This divided VCO frequency is selectable as the system clock when SS = %11."
  equations:
    vco: "VCO = Freq(XI) * (%MMMMMMMMMM + 1) / (%DDDDDD + 1)"
    pll_when_pppp_is_15: "PLL = VCO"
    pll_otherwise: "PLL = VCO / ((%PPPP + 1) * 2)"
  overclocking: "For fastest overclocking, the PLL can be pushed to 350 MHz using the 'VCO / 1' mode (%PPPP = 15)."
  cross_source_conflict: "Parallax's documents also give the VCO range as 100 MHz to 350 MHz rather than 100 MHz to 200 MHz. The 100-200 MHz range and the separate 350 MHz overclocking statement are the form used here."

hubset_configuration:
  source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, System Clock, p.18; Parallax Propeller 2 Documentation v35 (Rev B/C silicon), HUB, Configuring the Clock Generator; safe_switching_warning: Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, System Clock (WARNING), p.18, and Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, System Clock Configuration (WARNING), p.26; cross_source_conflict, the recipe that keeps %PPPP and %CC: Parallax Propeller 2 Documentation v35 (Rev B/C silicon), HUB, Configuring the Clock Generator (WARNING after the %SS table); deglitching: Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, System Clock, p.19, and Parallax Propeller 2 Documentation v35 (Rev B/C silicon), HUB, Configuring the Clock Generator"
  instruction: "HUBSET ##%0000_000E_DDDD_DDMM_MMMM_MMMM_PPPP_CCSS   'set clock mode"
  fields:
    E: "PLL off/on"
    DDDDDD: "1..64 division of XI pin frequency"
    MMMMMMMMMM: "1..1024 division of VCO frequency"
    PPPP: "VCO post-divider select"
    CC: "XI/XO crystal and loading-cap configuration"
    SS: "clock source select"
  safe_switching_warning: "Incorrectly switching away from the PLL setting (%SS = %11) can cause a glitch which will hang the clock circuit. In order to safely switch, always start by switching to an internal oscillator using either HUBSET #$F0 (for RCFAST) or HUBSET #$F1 (for RCSLOW)."
  cross_source_conflict: >-
    Parallax's documents give two recipes for switching away from the PLL. One:
    switching away from the PLL setting (%SS = %11 and %CC <> %00) with
    %PPPP = %1111 incorrectly can cause a clock glitch that hangs the P2 until a
    reset; start by switching to an internal RC oscillator (%SS = %00 or %01)
    while keeping %PPPP = %1111 and the %CC setting. The other: start by
    switching with HUBSET #$F0 (RCFAST) or HUBSET #$F1 (RCSLOW), as in
    safe_switching_warning. Those immediates write %PPPP = %1111 with %CC = %00,
    E = 0 and the divider and multiplier fields 0, so they do not keep the %CC
    setting. Not documented: which recipe holds where the two differ.
  deglitching: "The clock selector controlled by the %SS bits has a deglitching circuit which waits for a positive edge on the old clock source before disengaging, holding its output high, and then waiting for a positive edge on the new clock source before switching over to it. It is necessary to select mode %00 or %01 while waiting for the crystal and/or PLL to settle into operation, before switching over to either."
  worked_sequence:
    description: "A 20 MHz crystal and the PLL give 148.5 MHz: %DDDDDD = 39 divides the crystal by 40 to a 500 kHz reference, %MMMMMMMMMM = 296 multiplies it by 297 in the VCO to 148.5 MHz, and %PPPP = %1111 uses the VCO output directly. %CC = %10 selects 15 pF crystal mode. The PLL is enabled while the clock stays on RCFAST (%SS = %00), and the clock switches to the PLL (%SS = %11) only after the ~10 ms crystal+PLL wait."
    source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, System Clock (PLL Example), p.19; the same four steps: Parallax Propeller 2 Documentation v35 (Rev B/C silicon), HUB, Configuring the Clock Generator (PLL Example)"
    code: |
      HUBSET    #$F0                                         'set 20 MHz+ (RCFAST) mode
      HUBSET    ##%1_100111_0100101000_1111_10_00            'enable crystal+PLL, stay in RCFAST mode
      WAITX     ##20_000_000/100                             'wait ~10ms for crystal+PLL to stabilize
      HUBSET    ##%1_100111_0100101000_1111_10_11            'now switch to PLL running at 148.5 MHz

clock_modes:
  source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, System Clock (%CC and %SS tables), p.18; independently in Parallax Propeller 2 Documentation v35 (Rev B/C silicon), HUB, Configuring the Clock Generator"
  crystal_config:
    field: "%CC"
    modes:
      "%00": {xi_status: "ignored", xo_status: "float", xi_xo_impedance: "Hi-Z", loading_caps: "OFF"}
      "%01": {xi_status: "input", xo_status: "600-ohm drive", xi_xo_impedance: "1M-ohm", loading_caps: "OFF"}
      "%10": {xi_status: "input", xo_status: "600-ohm drive", xi_xo_impedance: "1M-ohm", loading_caps: "15pF per pin"}
      "%11": {xi_status: "input", xo_status: "600-ohm drive", xi_xo_impedance: "1M-ohm", loading_caps: "30pF per pin"}
  source_select:
    field: "%SS"
    modes:
      "%11": {clock_source: "PLL", notes: "CC != %00 and E=1, allow 10ms for crystal+PLL to stabilize before switching to PLL"}
      "%10": {clock_source: "XI", notes: "CC != %00, allow 5ms for crystal to stabilize before switching to XI pin"}
      "%01": {clock_source: "RCSLOW", notes: "~20 kHz, can be switched to at any time, low-power"}
      "%00": {clock_source: "RCFAST", notes: "20+ MHz (nominally ~24 MHz) can be switched to at any time -- used on boot up."}

stabilization_timing:
  source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, System Clock (%SS clock-source table), p.18, PLL Example and deglitching paragraph, p.19, AC Characteristics (RCFAST 20 / 24 / 30 MHz), p.48; independently in Parallax Propeller 2 Documentation v35 (Rev B/C silicon), HUB, Configuring the Clock Generator (the %SS table, the PLL example and the deglitching paragraph)"
  crystal_plus_pll: "Allow 10ms for crystal+PLL to stabilize before switching to PLL (%SS = %11)."
  crystal_only: "Allow 5ms for crystal to stabilize before switching to XI pin (%SS = %10)."
  rcfast: "Can be switched to at any time."
  rcslow: "Can be switched to at any time."
  pll_example_wait: "The ## form of WAITX ##20_000_000/100 is an AUGD (2 clocks) plus a WAITX (2 + D clocks when no WC/WZ/WCZ is given) with D = 200_000. The wait runs while the clock is still on RCFAST (20 MHz min, 24 MHz typical, 30 MHz max), so it lasts 10 ms at 20 MHz, about 8.3 ms at 24 MHz and about 6.7 ms at 30 MHz: at least the 5 ms a crystal alone needs at any RCFAST frequency, and the full 10 ms for crystal+PLL only when RCFAST runs at 20 MHz. A WAITX of D = 100_000 (##20_000_000/200) lasts 5 ms only at 20 MHz and about 4.2 ms at 24 MHz, so on RCFAST it falls short of the crystal's 5 ms."
  pll_and_crystal_settle_on_rc: "The %SS selector must select %00 (RCFAST) or %01 (RCSLOW) while the crystal and/or PLL settle into operation, before switching over to either XI (%SS = %10) or the PLL (%SS = %11)."

clock_sources:
  source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, AC Characteristics (Oscillator Frequency table), p.48; FEATURES (clock modes), p.3; Parallax Propeller 2 Documentation v35 (Rev B/C silicon), HUB, Configuring the Clock Generator"
  rcfast:
    description: "Internal RC oscillator, 20 MHz+, designed to always run at least 20 MHz, worst-case, to accommodate 2M baud serial loading during boot"
    frequency: "20 MHz min / 24 MHz typ / 30 MHz max"
    spec_min: "20 MHz"
    spec_typical: "~24 MHz"
    spec_max: "30 MHz"
    stability: "Not documented: a temperature or voltage coefficient. RCFAST is 20 MHz min to 30 MHz max over the -40 degC to +105 degC operating range."
    boot_default: true

  rcslow:
    description: "Internal RC oscillator, ~20 kHz, intended for low-power operation"
    frequency: "~20 kHz"
    stability: "12 kHz min / 20 kHz typ / 30 kHz max"
    power: "Low-power operation (130 µA)"

  crystal:
    description: "Crystal oscillator on XI and XO"
    frequency_range: "XO is a crystal-feedback output for 10 MHz-20 MHz crystals; the oscillator frequency limits for a crystal between XI and XO are 1 MHz to 50 MHz"
    xi_pin: "Input"
    xo_pin: "Crystal-feedback output (600-ohm drive when %CC != %00)"
    loading_capacitors: "Internal loading caps on XI and XO for crystal impedance matching: off, 15 pF or 30 pF per pin, selected by %CC"

  external:
    description: "External clock input"
    input_pin: "XI pin"
    frequency_range: "DC to 200 MHz"
    note: "DC-200 MHz is the direct-drive-into-XI range. For the PLL output (fed by direct drive or crystal), Parallax's documents give 3.33 MHz min, 180 MHz typical and 320 MHz max in one place, and in another that the PLL can be pushed to 350 MHz using the 'VCO / 1' mode (%PPPP = 15)."

clock_switching:
  glitch_free: true
  glitch_free_note: "Switching between sources is glitch-free through the %SS deglitching circuit (hubset_configuration.deglitching), with the exception in switch_away_from_pll_warning."
  switch_away_from_pll_warning: "Switching away from the PLL (SS=%11, CC<>%00) with PPPP=%1111 incorrectly can glitch the clock and hang the chip until reset; first switch to an RC oscillator (SS=%00 or %01) keeping PPPP=%1111 and CC. Parallax's documents also give HUBSET #$F0 or #$F1 as that first step, which clears CC: see hubset_configuration.cross_source_conflict. Not documented: an automatic fallback to an RC oscillator."
  sources:
    - "glitch_free: Parallax Propeller 2 Documentation v35 (Rev B/C silicon), OVERVIEW (six clock modes, all under software control with glitch-free switching between sources)"
    - "switch_away_from_pll_warning: Parallax Propeller 2 Documentation v35 (Rev B/C silicon), HUB, Configuring the Clock Generator; the HUBSET #$F0 / #$F1 form: Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, System Clock, p.18"
    - "sequence: Parallax Propeller 2 Documentation v35 (Rev B/C silicon), HUB, Configuring the Clock Generator (the %SS table, the PLL example and the deglitching paragraph); Parallax Propeller 2 Spin2 Language Documentation v55, Clock Setup (HUBSET ##clkmode_ & !3, WAITX ##20_000_000/100, HUBSET ##clkmode_)"

  sequence:
    - "Select RCFAST or RCSLOW (%SS = %00 or %01) if the clock is not already on one"
    - "With %SS still %00 or %01, enable the crystal (%CC != %00) and, for the PLL, the PLL (E = 1) with its divider, multiplier and post-divider fields"
    - "Wait while the clock stays on RCFAST or RCSLOW: 5ms for the crystal alone, 10ms for crystal+PLL"
    - "Switch %SS to the new source, XI (%10) or the PLL (%11), with the same other fields"
    - "Switching away from the PLL: switch_away_from_pll_warning"

programming_examples:
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), HUB, Configuring the Clock Generator (the four-step PLL example, the %SS table's 5ms and 10ms waits, the deglitching paragraph, the %PPPP = 15 overclock); Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, System Clock (PLL Example), p.19, and AC Characteristics (RCFAST 20 / 24 / 30 MHz), p.48; Parallax Propeller 2 Spin2 Language Documentation v55, Clock Setup (the external-clock sequence HUBSET ##clkmode_ & !%11, WAITX ##20_000_000/100, HUBSET ##clkmode_, given for the crystal-only and XI-only modes as well as the PLL modes)"
  basic_crystal_20mhz:
    code: |
      ' 20 MHz crystal, no PLL; starts on RCFAST
      HUBSET  ##%10_00            ' crystal on (CC=%10, 15pF), stay on RCFAST (SS=%00)
      WAITX   ##20_000_000/100    ' 200_000 RCFAST clocks: 6.7-10ms, at least the crystal's 5ms
      HUBSET  ##%10_10            ' switch to the crystal (SS=%10, XI)

  pll_160mhz_from_20mhz_crystal:
    code: |
      ' 20 MHz crystal -> 160 MHz via the PLL
      ' DDDDDD=0 (/1), MMMMMMMMMM=7 (x8): VCO = 20 MHz / 1 * 8 = 160 MHz, inside 100-200 MHz
      ' PPPP=%1111 selects VCO / 1, so the system clock is 160 MHz
      HUBSET  #$F0                                ' set RCFAST mode (SS=%00), PPPP=%1111
      HUBSET  ##%1_000000_0000000111_1111_10_00   ' enable crystal+PLL, stay in RCFAST mode
      WAITX   ##20_000_000/100                    ' wait ~10ms for crystal+PLL to stabilize
      HUBSET  ##%1_000000_0000000111_1111_10_11   ' now switch to the PLL (SS=%11): 160 MHz

  overclock_250mhz:
    code: |
      ' 20 MHz crystal -> 250 MHz via the PLL (overclock)
      ' DDDDDD=1 (/2), MMMMMMMMMM=24 (x25): VCO = 20 MHz / 2 * 25 = 250 MHz, above 100-200 MHz
      ' PPPP=%1111 selects VCO / 1, so the system clock is 250 MHz
      HUBSET  #$F0                                ' set RCFAST mode (SS=%00), PPPP=%1111
      HUBSET  ##%1_000001_0000011000_1111_10_00   ' enable crystal+PLL, stay in RCFAST mode
      WAITX   ##20_000_000/100                    ' wait ~10ms for crystal+PLL to stabilize
      HUBSET  ##%1_000001_0000011000_1111_10_11   ' now switch to the PLL (SS=%11): 250 MHz

clock_specifications:
  source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, AC Characteristics (Oscillator Frequency table), p.48; pll_push_frequency: Parallax Propeller 2 Documentation v35 (Rev B/C silicon), HUB, Configuring the Clock Generator"
  measurement_condition: "Data in the Typical \"Typ\" column is T = 25 degC unless otherwise stated."
  oscillator_frequency:
    rcslow_internal: {min: "12 kHz", typ: "20 kHz", max: "30 kHz"}
    rcfast_internal: {min: "20 MHz", typ: "24 MHz", max: "30 MHz"}
    direct_drive_into_xi: {min: "DC", max: "200 MHz"}
    crystal_between_xi_and_xo: {min: "1 MHz", max: "50 MHz"}
    pll_fed_by_direct_drive_or_crystal: {min: "3.33 MHz", typ: "180 MHz", max: "320 MHz"}
  pll_typ_footnote: "Nominal PLL frequency (system clock speed) is 180 MHz at up to 105 degC."
  xi_xo_pin_capacitance:
    mode_0_disabled: "2 pF (1M-ohm feedback resistor off)"
    mode_1_direct_drive: "2 pF"
    mode_2_crystal_ge_16mhz: "15 pF"
    mode_3_crystal_lt_16mhz: "30 pF"
  pll_push_frequency: "For fastest overclocking, the PLL can be pushed to 350 MHz using the 'VCO / 1' mode (%PPPP = 15)."

clock_distribution:
  source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, System Clock, p.17; Parallax Propeller 2 Documentation v35 (Rev B/C silicon), OVERVIEW (64-bit free-running counter which increments every clock) and SMART PINS (%11000, internally clocked: the A input is sampled on every clock)"
  system_clock: "The time base for all internal components"
  counter: "The 64-bit free-running counter increments every clock and is cleared on reset"
  adc_clock: "Internally clocked ADC modes sample the A input on every system clock"

power_management:
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), OVERVIEW (internal ~20 kHz RC oscillator for low-power operation, 130 µA; clock can be stopped for lowest power until reset, 100 µA, due to leakage), EVENTS (WAITINT stalls the cog to save power) and HUB, Configuring the Clock Generator (the ~20 kHz oscillator is intended for low-power operation)"
  rcslow: "The internal ~20 kHz RCSLOW oscillator is intended for low-power operation (130 µA)."
  clock_stopped: "The clock can be stopped for lowest power until reset (100 µA, due to leakage). A HUBSET idiom for it: language/pasm2/idioms/halt-and-fault-response.yaml."
  waitint: "WAITINT stalls the cog to save power while it waits for an interrupt."
  clock_gating: "Not documented: which circuits are clock-gated, or when."

frequency_measurement:
  getct_instruction: "GETCT D reads the lower 32 bits of the 64-bit counter; GETCT D WC reads the upper 32 bits"
  counter_frequency: "The counter increments every system clock"
  measuring_actual_frequency: "Not documented: an on-chip method of measuring the actual system clock frequency. CT and WAITX both count system clocks, so a GETCT before and after a WAITX differ by the WAITX count plus the instructions' own clocks, whatever the clock frequency."
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), OVERVIEW (64-bit free-running counter which increments every clock; GETCT WC retrieves the upper 32 bits) and EVENTS (CT is the lower 32 bits of the free-running 64-bit global counter); P2 Instructions v35 - Rev B/C Silicon, GETCT and WAITX rows"

related_systems:
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), EVENTS (CT-passed-CT1, ADDCT1), SMART PIN MODES (base periods and sample periods in clock cycles) and HUB, Configuring the Digital Filters for Smart Pins (the timing tap is one of the lower 32 bits of CT)"
  counter_system: "64-bit free-running counter"
  event_system: "CT-passed-CT1..CT3 events, set when CT passes a target made by ADDCT1..ADDCT3"
  smart_pins: "Smart pin timing parameters (periods, baud rates) are counted in system clocks"
  digital_filters: "The four global smart pin input filters take their timing tap from one of the lower 32 bits of CT"

debugging:
  clock_output: "Not documented: a dedicated system-clock output pin."
  pll_lock_detection: "Not documented: a PLL-lock status. Parallax's documents give 10ms for crystal+PLL to stabilize before switching to the PLL."
  switch_away_warning: "Switch away from the PLL via an RC source (%SS = %00 or %01) first; Parallax's documents differ on whether that step keeps %CC (hubset_configuration.cross_source_conflict). Not documented: an automatic fallback to RCFAST."
  sources:
    - "switch_away_warning: Parallax Propeller 2 Documentation v35 (Rev B/C silicon), HUB, Configuring the Clock Generator; Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, System Clock, p.18"
    - "pll_lock_detection: Parallax Propeller 2 Documentation v35 (Rev B/C silicon), HUB, Configuring the Clock Generator (%E and %SS rows: allow 10ms for crystal+PLL to stabilize)"

# Only the wrong/correct pairs the sources state.
anti_patterns:
  conflicting_definitions:
    wrong: "_rcfast together with _clkfreq"
    reason: "The clock-setup symbols are defined only in the listed combinations; _rcfast and _rcslow each appear alone."
    source: "Parallax Propeller 2 Spin2 Language Documentation v55, Clock Setup"

  missing_crystal_frequency:
    wrong: "_clkfreq alone on a board whose crystal is not 20 MHz"
    correct: "Declare _xtlfreq to match the actual crystal, alongside _clkfreq."
    reason: "_clkfreq alone \"Selects XI/XO-crystal-plus-PLL mode, assumes 20 MHz crystal.\""
    source: "Parallax Propeller 2 Spin2 Language Documentation v55, Clock Setup"

  no_stabilization_wait:
    wrong: "HUBSET to the PLL clock source in the same step that enables the crystal and PLL."
    correct: "Enable crystal+PLL while staying in RCFAST, WAITX ##20_000_000/100 for ~10ms, then HUBSET again to switch to the PLL."
    source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, System Clock (PLL Example), p.19"

  enable_pll_while_on_xi:
    wrong: "Switch to XI (%SS = %10), then enable the PLL and wait for it to settle while the clock is still on XI."
    correct: "Enable the crystal and PLL while %SS selects %00 (RCFAST) or %01 (RCSLOW), wait ~10ms, then switch %SS straight to %11 (PLL)."
    reason: "It is necessary to select mode %00 or %01 while waiting for the crystal and/or PLL to settle into operation, before switching over to either."
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), HUB, Configuring the Clock Generator (deglitching paragraph and PLL example); Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, System Clock, p.19"

  unsafe_switch_away_from_pll:
    wrong: "Switching directly from %SS = %11 to another clock source."
    correct: "Start by switching to an internal RC oscillator (%SS = %00 or %01). Parallax's documents give this first step two ways, keeping %PPPP = %1111 and %CC, or HUBSET #$F0 (RCFAST) / HUBSET #$F1 (RCSLOW), which clears %CC: hubset_configuration.cross_source_conflict."
    reason: "Incorrectly switching away from the PLL setting (%SS = %11) can cause a glitch which will hang the clock circuit."
    source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, System Clock, p.18; Parallax Propeller 2 Documentation v35 (Rev B/C silicon), HUB, Configuring the Clock Generator (WARNING after the %SS table)"

