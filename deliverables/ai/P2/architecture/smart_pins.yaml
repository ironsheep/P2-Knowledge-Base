in_flag:
  purpose: "Signals operation complete"
  setting: "Mode-specific conditions"
  what_it_is: "the IN signal of a pin whose %SSSSS is greater than %00000. What IN
    carries on a pin with smart pin mode OFF is a different thing entirely -- see
    in_signal_semantics above, which is the one home for that distinction."
  clearing:
    - "WRPIN instruction"
    - "WXPIN instruction"
    - "WYPIN instruction"
    - "RDPIN instruction"
    - "AKPIN instruction"
    - "Smart pin reset"
  not_clearing:
    - "RQPIN (read quiet) -- it does NOT acknowledge, which is what lets any number
      of cogs read the pin concurrently without bus conflict"
  clearing_source: "Propeller 2 Documentation v35 -- \"A cog acknowledges a smart pin
    whenever it does a WRPIN, WXPIN, WYPIN, RDPIN or AKPIN on it. This causes the smart
    pin to lower its IN signal...\" and the RQPIN exception, at
    engineering/ingestion/sources/silicon-doc/part4-smart-pins.txt:150-153
    (silicon-doc-text.txt:3845). The list previously named only RDPIN and AKPIN."

  event_driven_waiting:
    description: "Use events instead of polling for efficient waiting"
    event_sources:
      "%001": "IN rises (data ready)"
      "%010": "IN falls"
      "%011": "IN changes"
    format: "setse1 #%MMM<<6 + pin"
    example: |
      setse1  #%001<<6 + pin   ' Event on IN rise
      waitse1                   ' Sleep until ready
      rdpin   result, #pin      ' Read result
    vs_polling: "Eliminates busy-wait loops, COG sleeps during wait"
    see_also: "architecture/event_system.yaml"

