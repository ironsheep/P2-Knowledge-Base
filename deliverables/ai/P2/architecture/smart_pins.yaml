# Smart Pins - 64 Autonomous I/O Processors
# Source: Parallax Propeller 2 Documentation v35 (Rev B/C silicon), Parallax Propeller 2 Datasheet

component: Smart_Pins
category: io_system
last_updated: "2026-02-16"
