pin_output_hierarchy:
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PINS (DIR and OUT bits from all cogs are OR'd before going to the pins; a smart pin's output overrides OUT/OTHER) and STREAMER (modes that output to pins OR the streamer pin-output bus with {OUTB, OUTA}; %e in D[23] enables pin output); 3_multi_cog gating: P2 hardware verification, EF-114 (one board, P0 with no smart pin mode, cog 0 and one worker cog: cog 0 DIR 1 OUT 0 with the worker DIR 0 OUT 1 reads 0, and cog 0 DIR 0 OUT 1 with the worker DIR 1 OUT 0 reads 0); two cogs at DIR high with different OUT bits: P2 hardware verification, EF-105 (one board, plain pin at P_LOW_15K, cog 0 DIR 1 OUT 0 and a worker cog DIR 1 OUT 1 reads 1); initialization_order: Parallax SPI Flash Programmer and Boot Loader v51, Programmer, Get ready to program flash"
  description: "How cog OUT, streamer, and smart pin outputs combine at each pin"
  layers:
    1_cog_out: "Each cog has OUTA/OUTB registers controlling pin output state"
    2_streamer: "Streamer P[31:0] data OR'd into cog's OUTA/OUTB (requires X_PINS_ON)"
    3_multi_cog: "On a pin with no smart pin mode, a cog's OUT bit reaches the pin only through that cog's own DIR bit: with one cog at DIR high, OUT low and another at DIR low, OUT high, the pin reads low, whichever cog is which. With two cogs both at DIR high and different OUT bits on a pin whose low side drives through 15 kOhm and whose high side is fast, the pin reads high. Parallax's documents also give: DIR and OUT bits from all cogs are OR'd before going to the pins. Not documented: the level when two cogs both hold DIR high with different OUT bits at any other drive setting."
    4_smart_pin: "When smart pin active with TT=%x1, SMART output overrides OUT/OTHER"
  implication:
    streamer_vs_smart_pin: "A smart pin's output overrides the OUT/OTHER path; Not documented: how a streamer sharing the same pin as an active smart pin output behaves."
    initialization_order: "The SPI clock smart pin is configured and enabled before XINIT starts the streamer (see language/pasm2/concepts/streamer_smartpin_control.yaml)"
    x_pins_on_off: "X_PINS_ON (D[23]=1) enables streamer pin output; X_PINS_OFF (D[23]=0) is the default"

live_update_behavior:
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PINS and SMART PIN MODES; WRPIN #0 resets a running smart pin without a DIR cycle: EF-012 (bench-measured)"
  principle: |
    WRPIN should be issued while DIR=0 (reset); WRPIN #0 (return a pin to normal mode) is the exception. After DIR is raised high, depending on the mode, new data may be fed via WXPIN/WYPIN.
    "Once configured, DIR can be raised high and the smart pin will begin operating.
    After that, depending on the mode, you may feed it new data via WXPIN/WYPIN or
    retrieve results using RDPIN/RQPIN."
  what_needs_reset:
    wrpin_changes: "Mode (%SSSSS), input routing (AAAA/BBBB), filtering (FFF), TT bits, M bits"
    procedure: "DIRL pin → WRPIN/WXPIN → DIRH pin → WYPIN pin (write Y after enable; required for pulse, transition and asynchronous serial transmit). Exception: synchronous serial transmit (%11100) in continuous mode needs its first WYPIN during reset -- see critical_requirements.reset_before_configure"
  what_works_while_running:
    wypin: "Once DIR is high, new data may be fed via WYPIN, depending on the mode"
    wxpin: "Once DIR is high, new data may be fed via WXPIN, depending on the mode"
  acknowledge_side_effect: |
    Each of WRPIN, WXPIN, WYPIN, RDPIN and AKPIN acknowledges the smart pin (clear IN flag).
    Writing WXPIN to change timing also clears any pending IN.
    After acknowledge, IN needs 2 clocks before it can be polled again.
  per_mode_runtime_updates:
    pulse_00100:
      wypin: "Non-zero Y triggers new pulse sequence"
      wxpin: "Changes base period and compare value"
    transition_00101:
      wypin: "Non-zero Y triggers new transition sequence"
      wxpin: "Changes base period"
    nco_freq_00110:
      wypin: "Updates frequency value (Y added to Z each period)"
      wxpin: "Updates base period; X[31:16] written to Z[31:16] (phase set)"
    nco_duty_00111:
      wypin: "Updates duty value"
      wxpin: "Updates base period; X[31:16] written to Z[31:16] (phase set)"
    pwm_triangle_01000:
      wypin: "Updates duty (Y[15:0] captured at next frame start)"
      wxpin: "Changes base period X[15:0] and frame period X[31:16]"
    pwm_sawtooth_01001:
      wypin: "Updates duty (Y[15:0] captured at next frame start)"
      wxpin: "Changes base period and frame period"
    pwm_smps_01010:
      wypin: "Updates duty (may set once and let repeat)"
      wxpin: "Changes base period and frame period"
    quadrature_01011:
      wypin: "Not documented: a WYPIN parameter for this mode. The quadrature encoder can be zeroed by pulsing DIR low at any time."
      wxpin: "Changes measurement period"
    counters_01100_01111:
      wypin: "Y[0] selects mode variant in %01110/%01111"
      wxpin: "Changes measurement period"
    timing_10000_10010:
      wypin: "Y[1:0] sets sensitivity (high/rise/edge) in %10010"
      wxpin: "In %10010, X is the number of A-input highs/rises/edges to accumulate (Y[2]=0) or the number of clocks before a timeout (Y[2]=1). Not documented: an X role for %10000 and %10001."
    period_freq_10011_10111:
      wypin: "Y[1:0] sets A/B rise/edge sensitivity"
      wxpin: "Changes period count or minimum clock window"
    adc_11000_11001:
      wypin: "For modes other than SINC2 sampling (X[5:4] > %00), WYPIN after WXPIN overrides the initial period set by X[3:0] with the value in Y[13:0]"
      wxpin: "Changes sample mode X[5:4] and period X[3:0]"
    sync_tx_11100:
      wypin: "Loads next word to transmit (buffered → shifter → IN raised)"
      wxpin: "Changes update mode X[5] and bit count X[4:0]"
    sync_rx_11101:
      wypin: "Not documented: a WYPIN parameter for this mode"
      wxpin: "Changes sample position X[5] and bit count X[4:0]"
    async_tx_11110:
      wypin: "Loads next word to transmit (buffered → shifter → IN raised)"
      wxpin: "Changes baud rate X[31:16]/X[15:10] and bit count X[4:0]"
    async_rx_11111:
      wypin: "Not documented: a WYPIN parameter for this mode"
      wxpin: "Changes baud rate and bit count"
  mid_transfer_wxpin: "Not documented: the effect of a WXPIN issued while a serial transfer is in progress."

