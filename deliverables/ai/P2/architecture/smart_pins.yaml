critical_requirements:
  reset_before_configure:
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PINS (configure while DIR is low); consequences_of_skipping: Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PINS; correct_sequence order: bench-measured, EF-011 (pulse, transition, async TX required; NCO, DAC-noise safe), EF-097 (counter and timing modes %01110, %01111, %10010-%10111 and ADC %11001 order-safe; bench-measured on one board, one Y value per mode; async TX effect measured on the bench) and EF-090 (sync TX %11100 continuous primes in reset), with the Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PIN MODES, %11100 text; Y zeroed in reset for pulse and transition: Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PIN MODES, %00100 and %00101; WRPIN #0 resets a running smart pin without a DIR cycle: EF-012 (bench-measured)"
    description: |
      **Configure while DIR is low**: a smart pin should be configured while its DIR
      bit is low, holding it in reset. A WRPIN while DIR
      is high changes the use of the pin's state bits and gives unpredictable
      behavior. Exception: WRPIN #0, which returns a pin to normal mode, resets a
      running smart pin without a DIR cycle.
    correct_sequence:
      note: |
        Order is Reset -> Setup (WRPIN/WXPIN) -> Enable (DIRH) -> Operate (WYPIN).
        Write Y with WYPIN after raising DIR for the trigger modes (pulse %00100,
        transition %00101) and asynchronous serial transmit (%11110): a WYPIN issued
        before DIRH does not take effect. For the trigger modes, Y is set to zero
        during reset. Not documented: why a WYPIN before DIRH has no effect in
        asynchronous serial transmit. The value modes NCO %00110 and
        DAC-noise %00001 work in either order, and so do the counter and timing
        modes %01110, %01111, %10010-%10111 and the external-clock ADC mode %11001: a Y
        written while DIR is low is in force after DIRH.
        Exception -- synchronous serial transmit (%11100) in continuous mode needs its
        first word written with WYPIN during reset: that write primes the shifter,
        and enabling first loses the word.
        PINSTART()/pinstart() writes Y before it raises DIR, so in the trigger
        modes and asynchronous serial transmit its Y value does not take effect;
        the sequence below writes Y after DIR rises.
      pasm2:
        - "DIRL  pin         ' Hold smart pin in reset (DIR=0) while configuring"
        - "WRPIN mode, pin   ' Configure smart pin mode"
        - "WXPIN x, pin      ' Set X parameter (setup)"
        - "DIRH  pin         ' Enable smart pin (DIR=1)"
        - "WYPIN y, pin      ' Operate: write Y after enable"
      spin2:
        - "PINCLEAR(pin)        ' Reset pin (DIR=0, WRPIN=0)"
        - "WRPIN(pin, mode)     ' Configure smart pin mode"
        - "WXPIN(pin, x)        ' Set X parameter (setup)"
        - "PINHIGH(pin)         ' Enable smart pin (raises DIR)"
        - "WYPIN(pin, y)        ' Operate: write Y after enable"
    consequences_of_skipping:
      - "Selecting a new mode while DIR is high gives unpredictable, quite certainly useless behavior in the newly-selected mode"
    why_this_is_the_rule:
      source: >-
        Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PINS.
      mechanism: >-
        Each smart pin carries 126 bits of state data, separate from its WRPIN
        configuration. WRPIN's configuration multiplexes those 126 bits to the
        subcircuit selected by the five %SSSSS mode bits. Issuing WRPIN while DIR is
        high changes that mapping underneath live state, which gives unpredictable and quite
        certainly useless behavior in the newly-selected smart pin mode. The rule above
        is a consequence of that multiplexing.

  reset_without_reconfiguring:
    source: >-
      Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PINS.
    behavior: >-
      A configured, running smart pin can be reset at any time by taking its DIR bit low,
      and it does not lose the configuration set by the last WRPIN. Some mode-related
      state bits are cleared while DIR is low; when DIR returns high the pin resumes in
      the same mode, with some state data reset.
    why_it_matters: >-
      A smart pin can be reset with DIRL/DIRH without reconfiguring its WRPIN mode;
      some state is reset (Y must be rewritten after DIRH in the pulse, transition and
      asynchronous serial transmit modes). A WRPIN while DIR is high changes the use of the 126 state bits
      and causes unpredictable behavior in the newly-selected mode.

