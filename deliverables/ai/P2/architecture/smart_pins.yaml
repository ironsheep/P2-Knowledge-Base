description: |
  64 smart I/O pins. Each has a smart pin circuit with 32 modes (%SSSSS) for
  pulse, NCO and PWM output, counting and timing measurements, ADC sampling,
  DAC noise and dither, USB, and synchronous and asynchronous serial, which runs
  once configured and raises its IN signal to the cogs when it has new data, can
  take new data, or has finished.

  **Configure while DIR is low**: a smart pin should be configured (WRPIN/WXPIN/WYPIN)
  while its DIR bit is low, holding it in reset. A WRPIN while DIR is high gives
  unpredictable behavior. Exception: WRPIN #0, which returns a pin to normal mode,
  resets a running smart pin without a DIR cycle.

architecture:
  pin_count: 64
  pins_per_cog: "All 64 accessible by each COG"
  independence: "Each pin operates autonomously"
  configuration: "Per-pin 32-bit configuration: the WRPIN D value %AAAA_BBBB_FFF_MMMMMMMMMMMMM_TT_SSSSS_0"

capabilities:
  operating_modes: 32
  input_routing: "±3 pins from any pin"
  output_override: "Smart pin can control output"
  adc_per_pin: "Delta-sigma ADC with 5 ranges, 2 sources and VIO/GIO calibration; the WXPIN mode X[5:4] selects SINC2 sampling (%00), SINC2 filtering (%01), SINC3 filtering (%10) or bitstream capturing (%11)"
  dac_per_pin: "120-ohm (3ns) and 1k-ohm 8-bit DACs, with 16-bit oversampling, noise, and high/low digital modes"
  serial_max_baud_rate: "Synchronous serial transmit and receive, 1 to 32 bits, up to clock/2 baud rate; asynchronous serial transmit and receive, 1 to 32 bits, up to clock/3 baud rate"
  cog_analog_channels: "Each cog has access to all I/O pins, plus four fast DAC output channels and four fast ADC input channels. The four ADC channels are 8-bit, sample once per clock, and are fed from the smart pin scope modes."
  source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, cog and smart I/O pin features, pp.1-3; Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), OVERVIEW (smart I/O pin features)"

