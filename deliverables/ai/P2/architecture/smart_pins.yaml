pin_output_hierarchy:
  source: "Silicon Doc v35"
  description: "How cog OUT, streamer, and smart pin outputs combine at each pin"
  layers:
    1_cog_out: "Each cog has OUTA/OUTB registers controlling pin output state"
    2_streamer: "Streamer P[31:0] data OR'd into cog's OUTA/OUTB (requires X_PINS_ON)"
    3_multi_cog: "All 8 cogs' DIR and OUT bits OR'd together at pin level"
    4_smart_pin: "When smart pin active with TT=%x1, SMART output overrides OUT/OTHER"
  implication:
    streamer_vs_smart_pin: |
      Cannot share output on same pin. Smart pin with P_OE overrides the OUT bit path
      that streamer writes through. They operate on different pins simultaneously.
    cooperation_patterns:
      - "Streamer drives one pin group, smart pins handle protocol pins separately"
      - "Streamer captures smart pin ADC data (different function, same pin OK)"
      - "Streamer DAC channels (X0-X3) independent of smart pin digital output"
    initialization_order: "Smart pins MUST start (DIRH) BEFORE XINIT to prevent data corruption"
    x_pins_on_off: "X_PINS_ON (D[23]=1) enables streamer pin output; X_PINS_OFF for DAC-only"

live_update_behavior:
  source: "Silicon Doc v35"
  principle: |
    WRPIN needs DIR=0 (reset). WXPIN/WYPIN work freely while smart pin is running (DIR=1).
    "Once configured, DIR can be raised high and the smart pin will begin operating.
    After that, you may feed it new data via WXPIN/WYPIN."
  what_needs_reset:
    wrpin_changes: "Mode (%SSSSS), input routing (AAAA/BBBB), filtering (FFF), TT bits, M bits"
    procedure: "DIRL pin → WRPIN/WXPIN/WYPIN → DIRH pin"
  what_works_while_running:
    wypin: "Primary runtime interaction — load data, trigger operations, update parameters"
    wxpin: "Changes timing/configuration for next cycle (mode-specific side effects)"
  acknowledge_side_effect: |
    ALL of WRPIN, WXPIN, WYPIN, RDPIN, AKPIN acknowledge the smart pin (clear IN flag).
    Writing WXPIN to change timing also clears any pending IN. Coordinate with IN state.
    After acknowledge, IN needs 2 clocks before it can be polled again.
  per_mode_runtime_updates:
    pulse_00100:
      wypin: "Non-zero Y triggers new pulse sequence"
      wxpin: "Changes base period and compare value"
    transition_00101:
      wypin: "Non-zero Y triggers new transition sequence"
      wxpin: "Changes base period"
    nco_freq_00110:
      wypin: "Updates frequency value (Y added to Z each period)"
      wxpin: "Updates base period; X[31:16] written to Z[31:16] (phase set)"
    nco_duty_00111:
      wypin: "Updates duty value"
      wxpin: "Updates base period; X[31:16] written to Z[31:16] (phase set)"
    pwm_triangle_01000:
      wypin: "Updates duty (Y[15:0] captured at next frame start)"
      wxpin: "Changes base period X[15:0] and frame period X[31:16]"
    pwm_sawtooth_01001:
      wypin: "Updates duty (Y[15:0] captured at next frame start)"
      wxpin: "Changes base period and frame period"
    pwm_smps_01010:
      wypin: "Updates duty (may set once and let repeat)"
      wxpin: "Changes base period and frame period"
    quadrature_01011:
      wypin: "Not used (zero by pulsing DIR low instead)"
      wxpin: "Changes measurement period"
    counters_01100_01111:
      wypin: "Y[0] selects mode variant in %01110/%01111"
      wxpin: "Changes measurement period"
    timing_10000_10010:
      wypin: "Y[1:0] sets sensitivity (high/rise/edge) in %10010"
      wxpin: "Changes measurement window / event count"
    period_freq_10011_10111:
      wypin: "Y[1:0] sets A/B rise/edge sensitivity"
      wxpin: "Changes period count or minimum clock window"
    adc_11000_11001:
      wypin: "Not typically used"
      wxpin: "Changes sample mode X[5:4] and period X[3:0]"
    sync_tx_11100:
      wypin: "Loads next word to transmit (buffered → shifter → IN raised)"
      wxpin: "Changes update mode X[5] and bit count X[4:0] — avoid mid-transfer"
    sync_rx_11101:
      wypin: "Not used"
      wxpin: "Changes sample position X[5] and bit count X[4:0] — avoid mid-transfer"
    async_tx_11110:
      wypin: "Loads next word to transmit (buffered → shifter → IN raised)"
      wxpin: "Changes baud rate X[31:16]/X[15:10] and bit count X[4:0] — avoid mid-transfer"
    async_rx_11111:
      wypin: "Not used"
      wxpin: "Changes baud rate and bit count — avoid mid-transfer"
  caution: "Changing WXPIN on serial modes mid-transfer corrupts in-progress data. Change between transactions after IN signals completion."

