critical_requirements:
  reset_before_configure:
    mandatory: true
    description: |
      **CRITICAL**: Smart pins MUST be reset (DIR=0) before any configuration.
      This ensures the smart pin is in a known state and prevents conflicts.
    correct_sequence:
      note: |
        Order is Reset -> Setup (WRPIN/WXPIN) -> Enable (DIRH) -> Operate (WYPIN).
        Write Y with WYPIN AFTER raising DIR. The trigger modes (pulse %00100,
        transition %00101) and the serial modes hold Y at 0 during reset, so a
        WYPIN issued before DIRH never takes effect; writing Y after enable is the
        one order correct for EVERY mode (and order-safe for the value modes).
        PINSTART()/pinstart() writes Y before raising DIR, so it is NOT safe for
        the trigger modes -- use the explicit sequence below for those.
      pasm2:
        - "DIRL  pin         ' Reset smart pin (DIR=0) -- REQUIRED before WRPIN"
        - "WRPIN mode, pin   ' Configure smart pin mode"
        - "WXPIN x, pin      ' Set X parameter (setup)"
        - "DIRH  pin         ' Enable smart pin (DIR=1)"
        - "WYPIN y, pin      ' Operate: write Y AFTER enable"
      spin2:
        - "PINCLEAR(pin)        ' Reset pin (DIR=0, WRPIN=0)"
        - "WRPIN(pin, mode)     ' Configure smart pin mode"
        - "WXPIN(pin, x)        ' Set X parameter (setup)"
        - "DIRH(pin)            ' Enable smart pin (DIR=1)"
        - "WYPIN(pin, y)        ' Operate: write Y AFTER enable"
    consequences_of_skipping:
      - "Unpredictable smart pin behavior"
      - "Configuration conflicts between old and new settings"
      - "Smart pin malfunction or incorrect operation"
      - "Possible corruption of internal state machines"
    why_this_is_the_rule:
      source: >-
        Propeller 2 Documentation v35 (Rev B/C) --
        engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:3856.
      mechanism: >-
        Each smart pin carries 126 bits of state data, separate from its WRPIN
        configuration. WRPIN does not merely select a mode: it MULTIPLEXES those 126 bits
        to the subcircuit chosen by the five %SSSSS mode bits. Issuing WRPIN while DIR is
        high changes that mapping underneath live state, which the source calls
        "unpredictable and quite certainly useless behavior in the newly-selected smart
        pin mode". The rule above is a consequence of that multiplexing, not a convention.

  reset_without_reconfiguring:
    source: >-
      Propeller 2 Documentation v35 (Rev B/C) --
      engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:3856.
    behavior: >-
      A configured, running smart pin can be RESET AT ANY TIME by taking its DIR bit low,
      and it does NOT lose the configuration set by the last WRPIN. Some mode-related
      state bits are cleared while DIR is low; when DIR returns high the pin resumes in
      the same mode, with some state data reset.
    why_it_matters: >-
      A driver can restart a smart pin mid-flight with DIRL/DIRH alone -- no WRPIN, WXPIN
      or re-setup required. Re-issuing WRPIN while DIR is high is the thing that must NOT
      be done. Useful for clearing a stuck serial or counter mode without a full rebuild.

