input_routing:
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PINS (the %AAAA / %BBBB / %FFF selectors); the %FFF rows appear identically in the Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Pin Modes, p.23, and in the Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, Pin Modes, p.32. Filter settings, unanimity rule, output routing and defaults from Parallax Propeller 2 Documentation v35 (Rev B/C silicon), Configuring the Digital Filters for Smart Pins (the flipflops must be unanimously high or low to change the filter output; table 30) and OVERVIEW (2/3/5/8-bit-unanimous input filtering with selectable sample rate)."
  a_input:
    field: "%AAAA (D[31:28] of the WRPIN operand)"
    polarity: {"0xxx": "true (default)", "1xxx": "inverted"}
    selection:
      "x000": "this pin's read state (default)"
      "x001": "relative +1 pin's read state"
      "x010": "relative +2 pin's read state"
      "x011": "relative +3 pin's read state"
      "x100": "this pin's OUT bit from cogs"
      "x101": "relative -3 pin's read state"
      "x110": "relative -2 pin's read state"
      "x111": "relative -1 pin's read state"
  b_input:
    field: "%BBBB (D[27:24])"
    selection: "Identical to the 'A' input selector above, with the same polarity bit."
  input_logic_and_filtering:
    field: "%FFF (D[23:21]) -- 'A' and 'B' input logic/filtering (after 'A' and 'B' input selectors)"
    modes:
      "000": "A, B (default)"
      "001": "A AND B, B"
      "010": "A OR B, B"
      "011": "A XOR B, B"
      "100": "A, B, both filtered using global filt0 settings"
      "101": "A, B, both filtered using global filt1 settings"
      "110": "A, B, both filtered using global filt2 settings"
      "111": "A, B, both filtered using global filt3 settings"
    non_smart_pin_note: "The resultant 'A' will drive the IN signal in non-smart-pin modes."
  global_digital_filters:
    what_they_are: "There are four global digital filter settings which can be used by each smart pin to low-pass filter its incoming pin states. Each filter setting includes a filter length and a timing tap. The filter length is 2, 3, 5, or 8 flipflops, selected by values 0..3. The timing tap is one of the lower 32 bits of CT, selected by values 0..31."
    unanimity: "The flipflops shift pin state data at the timing tap rate and must be unanimously high or low to change the filter output to high or low. Each time the selected tap transitions, the current pin state is shifted into the flipflops, and if the flipflops are all in agreement, the filter output goes to that state."
    where_the_output_goes: "The filter is reflected in the INA/INB bits if no smart pin mode is selected, or its states are used by the smart pin mode as its inputs."
    configured_by:
      - "HUBSET ##$4000_0000 + Length<<5 + Tap    'set filt0"
      - "HUBSET ##$4000_0080 + Length<<5 + Tap    'set filt1"
      - "HUBSET ##$4000_0100 + Length<<5 + Tap    'set filt2"
      - "HUBSET ##$4000_0180 + Length<<5 + Tap    'set filt3"
    length_encoding: "\"Length\" is 0..3 for 2, 3, 5, or 8 flipflops."
    tap_encoding: "\"Tap\" is 0..31 for every single clock, every 2nd clock, every 4th clock,... every 2,147,483,648th clock."
    reset_defaults:
      source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), Configuring the Digital Filters for Smart Pins (table 30, low-pass time at 6.25ns/clock)"
      note: "The filters are set to the following defaults on reset. The low-pass times below are quoted at 6.25ns/clock and scale with the system clock."
      filt0: {length: "0 (2 flipflops)", tap: "0 (1:1)", low_pass_time: "12.5ns (6.25ns * 2 * 1)"}
      filt1: {length: "1 (3 flipflops)", tap: "5 (32:1)", low_pass_time: "600ns (6.25ns * 3 * 32)"}
      filt2: {length: "2 (5 flipflops)", tap: "19 (512K:1)", low_pass_time: "16.4ms (6.25ns * 5 * 512K)"}
      filt3: {length: "3 (8 flipflops)", tap: "22 (4M:1)", low_pass_time: "210ms (6.25ns * 8 * 4M)"}
    filter_delay:
      fact: "In streamer pin capture, an input taking filt0 at tap 0 (every clock) lags an unfiltered input by 3, 4, 6 and 9 clocks for filters of 2, 3, 5 and 8 flipflops, rising and falling edges alike; an unfiltered input lags by 0 clocks; filt0 with 5 flipflops at tap 3 (every 8th clock) lags by 37 clocks. Not documented: the lag for filt1, filt2 and filt3, for any other tap, and as a general rule."
      source: "EF-095 (filt0 only: lengths 2, 3, 5 and 8 at tap 0, and 5 flipflops at tap 3)"

in_signal_semantics:
  # ONE HOME for what a pin's IN signal MEANS. The %FFF discussion above states
  # only the non-smart-pin half, as an aside ("non_smart_pin_note"). The operative
  # half is the contrapositive, and it decides whether any INA/INB sampler --
  # TESTP, WAITSE, or the streamer's pin-capture path -- is reading traffic or a
  # handshake.
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PINS (the IN-signal
    handshake, and the non-smart-pin case); streamer capture of the smart pin's IN signal: Parallax Propeller 2 Spin2
    Language Documentation v55, Graphical DEBUG Displays (the LOGIC display); Parallax
    Propeller 2 Documentation v35 (Rev B/C silicon), STREAMER, Pins => DACs/WRFAST; EF-095 (streamer capture, TRANSITION-mode pin and a routed neighbour)."

  rule: |
    In smart pin modes the IN bit serves as a flag that the smart pin has completed some
    function or an event has occurred. In non-smart-pin modes the resultant 'A' drives
    the IN signal. Which applies depends on the pin's %SSSSS field.

  when_smart_pin_mode_is_ON:
    condition: "%SSSSS > %00000 -- the pin is running one of the smart-pin modes"
    what_in_carries: "a HANDSHAKE, not the pin's logic level"
    raised_by: "the smart pin itself. \"When a mode-related event occurs in
      a smart pin, it raises its IN signal to alert the cog(s) that new data is ready,
      new data can be loaded, or some process has finished.\""
    lowered_by: "WRPIN, WXPIN, WYPIN, RDPIN or AKPIN on that pin. \"A cog
      acknowledges a smart pin whenever it does a WRPIN, WXPIN, WYPIN, RDPIN or AKPIN
      on it. This causes the smart pin to lower its IN signal so that it can be raised
      again on the next event.\""
    rqpin_does_not_lower_it: "RQPIN is the deliberate exception. \"Note that
      since the RQPIN instruction (read quiet) does not do an acknowledge, it can be
      used by any number of cogs, concurrently, to read a pin without bus conflict.\""
    drop_latency: "\"After WRPIN/WXPIN/WYPIN/RDPIN/AKPIN, it will take two clocks for
      IN to drop, before it can be polled again\" -- see language/pasm2/wrpin.yaml
      timing.in_flag_reset_latency for the NOP-padded polling sequence."

  when_smart_pin_mode_is_OFF:
    condition: "%SSSSS = %00000 -- smart pin mode off"
    what_in_carries: "the pin's logic level, after the %AAAA input selector and the
      %FFF input logic/filtering have been applied. \"The resultant 'A' will
      drive the IN signal in non-smart-pin modes.\""
    which_pin_that_level_came_from: "Not necessarily this pin. %AAAA can route 'A'
      from a neighbour at +-1, +-2 or +-3, or from this pin's own OUT bit. The
      encoding is in input_routing.a_input above and in language/pasm2/wrpin.yaml
      input_selectors."

  consequence_for_anything_that_samples_in: |
    A read of INA/INB returns the IN signal described above: the smart pin's flag when
    the pin runs a smart-pin mode, the resultant 'A' when its %SSSSS is %00000. The
    readers are TESTP, the IN-rise/fall/change event sources, and the streamer's
    pin-capture modes, which read {INB, INA}.

    In a streamer capture of a pin in TRANSITION mode, that pin's lane carries one
    edge, its completion flag, while a neighbouring pin routed to the waveform through
    its %AAAA selector carries the waveform.
  consequence: "For the LOGIC debug display, on every clock the streamer records the smart pin's IN
    signal and its output state, as read from an adjacent pin. Not documented: which
    streamer mode the LOGIC display capture uses."

  related:
    - architecture/streamer/pin-capture.yaml
    - architecture/streamer/pin-selection.yaml
    - language/pasm2/wrpin.yaml
    - language/spin2/symbols/spin2-builtin-symbols-complete.yaml
configuration_format:
  wrpin_d_parameter: "%AAAA_BBBB_FFF_MMMMMMMMMMMMM_TT_SSSSS_0"

  composition_rule:
    rule: "`|` of two constants from one field leaves the field value; `+` of them adds the values."
    why: |
      P_TT_01, P_OE and P_CHANNEL each have the value %01 in the TT field; P_TT_10 and
      P_BITDAC each have %10. `+` adds the field values: %01 + %01 = %10, a different TT value.
    worked_example: |
      P_TT_01, P_OE and P_CHANNEL are one bit-field value ($40, %01) under three
      context names:
        P_CHANNEL | P_OE  ->  %01  (P_TT_01)
        P_CHANNEL + P_OE  ->  %10  (P_BITDAC)
      With a cog DAC, TT=%01 drives the pin; P_CHANNEL + P_OE gives TT=%10 and does
      not drive it.
    source: "Parallax Propeller 2 Spin2 Language Documentation v55, Built-In Symbols for Smart Pin Configuration (group 'DIR/OUT Control (pick one)'); measured EF-054"


  fields:
    aaaa:
      bits: "31:28"
      width: 4
      purpose: "A input selector"
      values:
        "0xxx": "true (default)"
        "1xxx": "inverted"
        "x000": "this pin's read state (default)"
        "x001": "relative +1 pin's read state"
        "x010": "relative +2 pin's read state"
        "x011": "relative +3 pin's read state"
        "x100": "this pin's OUT bit from cogs"
        "x101": "relative -3 pin's read state"
        "x110": "relative -2 pin's read state"
        "x111": "relative -1 pin's read state"
    bbbb:
      bits: "27:24"
      width: 4
      purpose: "B input selector"
      values: "Same encoding as AAAA"
    fff:
      bits: "23:21"
      width: 3
      purpose: "A and B input logic/filtering"
      values:
        "%000": "A, B (default)"
        "%001": "A AND B, B"
        "%010": "A OR B, B"
        "%011": "A XOR B, B"
        "%100": "A, B, both filtered using filt0"
        "%101": "A, B, both filtered using filt1"
        "%110": "A, B, both filtered using filt2"
        "%111": "A, B, both filtered using filt3"
      note: "Resultant A drives IN signal in non-smart-pin modes"
    m:
      bits: "20:8"
      width: 13
      purpose: "Low-level pin control (drive strength, DAC, ADC)"
      sub_fields_reference: "architecture/pin-drive-configuration.yaml -- the internals of
        this field: every sub-field with its bit range, the eight-rung drive ladder stated
        by encoding, and the DIR/OUT rule that decides when a drive setting is active"
      dac_mode_trigger: "M[12:10] = %101 enables DAC_MODE"
      bit_dac: "BIT_DAC outputs {2{M[7:4]}} for high or {2{M[3:0]}} for low in DAC_MODE"
    tt:
      bits: "7:6"
      width: 2
      purpose: "Pin DIR/OUT control"
      source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PINS (%TT: pin DIR/OUT control)"
      bit_functions:
        bit_7_high: "Output source: 0=OUT, 1=OTHER"
        bit_6_low: "Output enable (smart pin on): 0=disabled, 1=enabled"
      other_definition:
        odd_pins: "OTHER = even pin's NOT output state (differential source)"
        even_pins: "OTHER = unique pseudo-random bit (noise source)"
        all_pins: "SMART = smart pin output, overrides OUT/OTHER"
      constants:
        P_TT_00:
          value: "$00"
          binary: "%00"
          description: "Default. With a non-DAC smart pin mode (%00100..%11111) active: output disabled regardless of DIR, SMART/OUT selected. With a DAC smart pin mode (%00001..%00011) active: output disabled regardless of DIR, OUT enables the ADC in DAC_MODE. With the smart pin off (%00000): DIR enables the output and OUT drives it (non-DAC_MODE). On silicon, in DAC-noise mode (%00001) with TT = %00, raising OUT runs nothing; OUT runs the ADC with TT = %01 (see silicon_errata; the other DAC smart pin modes are not documented). Other contexts: see behavior_by_context"
        P_TT_01:
          value: "$40"
          binary: "%01"
          aliases: ["P_OE", "P_CHANNEL"]
          description: "With a non-DAC smart pin mode (%00100..%11111) active: output enabled regardless of DIR, SMART/OUT drives. Other contexts: see behavior_by_context"
        P_TT_10:
          value: "$80"
          binary: "%10"
          aliases: ["P_BITDAC"]
          description: "With a non-DAC smart pin mode (%00100..%11111) active: output disabled regardless of DIR, SMART/OTHER selected. With the smart pin off (%00000) in DAC_MODE (the P_BITDAC context): OUT drives BIT_DAC. Other contexts: see behavior_by_context"
        P_TT_11:
          value: "$C0"
          binary: "%11"
          description: "With a non-DAC smart pin mode (%00100..%11111) active: output enabled regardless of DIR, SMART/OTHER drives. Other contexts: see behavior_by_context"
      behavior_by_context:
        smart_pin_off:
          condition: "%SSSSS = %00000"
          dir_role: "DIR enables output"
          non_dac_mode:
            "%0x": "OUT drives output"
            "%1x": "OTHER drives output"
          dac_mode:
            "%00": "DIR enables the DAC output; OUT enables the ADC; M[7:0] sets DAC level"
            "%01": "OUT enables ADC, M[3:0] selects cog DAC channel"
            "%10": "OUT drives BIT_DAC"
            "%11": "OTHER drives BIT_DAC"
          source: "%00 row: Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, DAC with Optional ADC pin schematic, p.31 (the DAC output enable is DIR, the ADC enable is OUT) and Pin DIR/OUT Control table (DIR enables DAC); Parallax Propeller 2 Documentation v35 (Rev B/C silicon), Smart Pins, Pin DIR/OUT Control (OUT enables ADC); EF-055 (a P_DAC_124R_3V pin driven from its level field, before adding P_CHANNEL, drove)"
        non_dac_smart_pin_modes:
          condition: "%SSSSS = %00100..%11111"
          enable_bit: "x0=disabled regardless of DIR, x1=enabled regardless of DIR"
          source_bit: "0x=SMART/OUT drives output, 1x=SMART/OTHER drives output"
          dac_mode_variant: "Same but drives BIT_DAC if DAC_MODE active"
        dac_smart_pin_modes:
          condition: "%SSSSS = %00001..%00011"
          enable_bit: "x0=disabled regardless of DIR, x1=enabled regardless of DIR"
          adc_control: "0x=OUT enables ADC, 1x=OTHER enables ADC (M[7:0] overridden). Parallax's documents also give OUT and OTHER as enabling the DAC in these modes."
          silicon_errata:
            out_needs_tt_bit0_to_run_adc: "%TT rules: x0 = output disabled, regardless of DIR; 0x = OUT enables ADC in DAC_MODE. In DAC-noise mode %00001 with TT = %00, the pin's read state with OUT high is the same as with OUT low. With TT = %01 (WRPIN word bit $40, P_TT_01), OUT high runs the ADC and the fast DAC drives the pin while it runs. Not documented: the behavior in modes %00010 and %00011, and for the other forms (TT = %1x)."
            source: "Hardware-verified on Rev C silicon (EF-071), both runs; the %TT rules: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PINS, %TT table (x0 = output disabled, regardless of DIR; 0x = OUT enables ADC in DAC_MODE)"
      which_modes_need_p_oe:
        source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PINS, %TT table (for all smart pin modes, %SSSSS > %00000)"
        required: "For all smart pin modes (%SSSSS > %00000): x0 = output disabled, regardless of DIR; x1 = output enabled, regardless of DIR"
        not_needed: "Not documented: a list of smart pin modes that need no output enable"
      differential_pair_usage:
        description: "For odd pins, OTHER is the even pin's NOT output state (diff source); in non-DAC smart pin modes TT=1x makes SMART/OTHER drive the output"
        even_pin: "P_OE (TT=%01) - 0x: SMART/OUT drives the output"
        odd_pin: "TT=%11 - 1x: SMART/OTHER drives the output, OTHER being the even pin's NOT output state"
    sssss:
      bits: "5:1"
      width: 5
      purpose: "Smart pin mode selector (32 modes)"
      bit_0: "0 in this format"

x_y_z_registers:
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PINS (the four 32-bit smart pin registers; the 2-clock WRPIN, WXPIN, WYPIN, RDPIN, RQPIN and AKPIN instructions; the outgoing 33-bit bus; the 34-bit cog buses)"
  summary: "A smart pin has four 32-bit registers: mode, X, Y and Z. Mode, X and Y are write-only; Z is read-only. They are written and read by the 2-clock instructions WRPIN (mode), WXPIN (X), WYPIN (Y), RDPIN and RQPIN (Z), in which S selects the pin (0..63) and D carries the 32-bit data."
  mode_register:
    width: "32 bits"
    access: "write-only"
    usage: "Smart pin mode and low-level I/O pin mode, written by WRPIN"
  x_register:
    width: "32 bits"
    access: "write-only"
    usage: "Mode-specific configuration"
    examples:
      - "NCO base period and initial phase"
      - "PWM base period and frame period"
      - "Measurement period; serial baud rate (bit period) and word length"

  y_register:
    width: "32 bits"
    access: "write-only"
    usage: "Mode-specific parameter"
    examples:
      - "PWM output value"
      - "NCO value added into Z at each base period"
      - "Serial data to transmit"
      - "Counting variant select (Y[0] in %01110 and %01111)"
      
  z_register:
    width: "32 bits"
    access: "read-only"
    usage: "Result/accumulator"
    read_via: "RDPIN/RQPIN instructions"
    c_flag: "Each smart pin has an outgoing 33-bit bus that carries its Z result and a special flag. RDPIN and RQPIN multiplex these buses: Z is read into D and the special flag into C. C is either a mode-related flag or the MSB of the Z result."
    spin2_rdpin_bit31: "The Spin2 RDPIN() and RQPIN() methods return C in bit 31 of their result; the other bits are Z. Where C is the MSB of Z the result equals Z. Where C is a mode-related flag, bit 31 carries that flag: the 'armed' state in the ADC scope mode (%11010), the receiver error flag in USB (%11011), the busy flag in asynchronous serial transmit (%11110). Not documented: which of the two C is in most other modes. Inline PASM2 RDPIN or RQPIN reads all 32 bits of Z into D."
    source: "Parallax Propeller 2 Spin2 Language Documentation v55, smart pin methods (RDPIN (Pin) : Zval, Zval[31] = C flag from RDPIN, other bits are RDPIN data; RQPIN the same); Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PIN MODES (%11010 armed state in C; %11011 error flag into C; %11110 busy flag into C)"
    reset_preload:
      summary: "While DIR is low (reset), each mode that states its reset condition holds its output and its registers as listed in during_reset_dir_low; the Z preload differs by mode."
      source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PIN MODES, the 'During reset (DIR=0)' line of each mode %00001 to %10111, the %00110 WXPIN text, and the %11100 and %11110 texts; the ADC, USB, synchronous serial receive and asynchronous serial receive mode texts state no reset condition"
      during_reset_dir_low:
        "%00001..%00011, not DAC_MODE (long repository)": "IN low. WXPIN instructions are ignored."
        "%00001, DAC_MODE (DAC noise)": "IN low."
        "%00010, DAC_MODE (16-bit DAC, pseudo-random dither)": "IN low. Y[15:0] is captured."
        "%00011, DAC_MODE (16-bit DAC, PWM dither)": "IN low. Y[15:0] is captured."
        "%00100 (pulse/cycle output)": "IN low. Output low. Y set to zero."
        "%00101 (transition output)": "IN low. Output low. Y set to zero."
        "%00110 (NCO frequency)": "IN low. Output low. Z[15:0] set to zero. WXPIN writes X[31:16] to Z[31:16] even during reset. Parallax's documents also give Z (all of it) as set to zero during reset."
        "%00111 (NCO duty)": "IN low. Output low. Z set to zero. Not documented: whether a phase written with WXPIN during reset is kept."
        "%01000 (PWM triangle)": "IN low. Output low. Y[15:0] is captured."
        "%01001 (PWM sawtooth)": "IN low. Output low. Y[15:0] is captured."
        "%01010 (PWM switch-mode power supply)": "IN low. Output low. Y[15:0] is captured."
        "%01011 (A/B-input quadrature encoder)": "IN low. Z set to the adder value (0, 1 or -1)."
        "%01100 (count A-input positive edges when B-input is high)": "IN low. Z set to the adder value (0 or 1)."
        "%01101 (accumulate A-input positive edges, B-input supplying increment or decrement)": "IN low. Z set to the adder value (0, 1 or -1)."
        "%01110 (count A-input positive edges; Y[0] adds decrement on B-input positive edge)": "IN low. Z set to the adder value (0, 1 or -1)."
        "%01111 (count A-input highs; Y[0] adds decrement on B-input high)": "IN low. Z set to the adder value (0, 1 or -1)."
        "%10000 (time A-input states)": "IN low. Z set to $00000001."
        "%10001 (time A-input high states)": "IN low. Z set to $00000001."
        "%10010, Y[2]=0 (time X A-input highs/rises/edges)": "IN low. Z set to $00000001."
        "%10010, Y[2]=1 (timeout on X clocks of missing A-input high/rise/edge)": "IN low. Z set to $00000001."
        "%10011 (for X periods, count time)": "IN low. Z set to $00000000."
        "%10100 (for X periods, count states)": "IN low. Z set to $00000000."
        "%10101, %10110, %10111 (for periods in X+ clock cycles)": "IN low. Z set to $00000000."
        "%11000, %11001 (ADC sample/filter/capture)": "Not documented: the state during reset."
        "%11010 (ADC scope with trigger)": "Not documented: the state during reset."
        "%11011 (USB)": "Not documented: the state during reset."
        "%11100 (synchronous serial transmit)": "Output held low. In continuous mode (X[5]=0), a first word written with WYPIN during reset primes the shifter; during reset the buffer flows straight into the shifter. On release of reset the output reflects the LSB of the word written by any WYPIN during reset. Not documented: IN during reset."
        "%11101 (synchronous serial receive)": "Not documented: the state during reset."
        "%11110 (asynchronous serial transmit)": "Output held high. Not documented: IN during reset."
        "%11111 (asynchronous serial receive)": "Not documented: the state during reset."

cog_bus_access:
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PINS (each cog's 34-bit bus to each smart pin)"
  bus: "Each cog has a 34-bit bus to each smart pin for write data and acknowledgment signaling. Parallax's documents give each smart pin as OR'ing all incoming 34-bit buses from the cogs in the same way DIR and OUT bits are OR'd before going to the pins. For what a pin with no smart pin mode does with DIR and OUT bits from two cogs, see pin_output_hierarchy."
  rule: "Cogs that execute WRPIN, WXPIN, WYPIN, RDPIN or AKPIN on the same smart pin must do so at different times, to avoid clobbering each other's bus data."
  concurrent_reads: "Any number of cogs can read a smart pin at the same time with RQPIN (read quiet), which does not use the 34-bit cog-to-smart-pin bus for acknowledgement signaling, as RDPIN does."

in_flag:
  purpose: "Raised when a mode-related event occurs: new data is ready, new data can be loaded, or some process has finished"
  setting: "Mode-specific conditions"
  what_it_is: "the IN signal of a pin whose %SSSSS is greater than %00000. What IN
    carries on a pin with smart pin mode OFF is a different thing entirely -- see
    in_signal_semantics above, which is the one home for that distinction."
  clearing:
    - "WRPIN instruction"
    - "WXPIN instruction"
    - "WYPIN instruction"
    - "RDPIN instruction"
    - "AKPIN instruction"
    - "Smart pin reset"
  not_clearing:
    - "RQPIN (read quiet) -- it does not acknowledge, which is what lets any number
      of cogs read the pin concurrently without bus conflict"
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PINS --
    \"A cog acknowledges a smart pin whenever it does a WRPIN, WXPIN, WYPIN, RDPIN or AKPIN
    on it. This causes the smart pin to lower its IN signal...\" and the RQPIN exception."

  event_driven_waiting:
    description: "A selectable event (SETSEn) on a pin's INA/INB bit lets WAITSEn wait for the smart pin's IN signal"
    event_sources:
      "%001": "IN rises"
      "%010": "IN falls"
      "%011": "IN changes"
    format: "setse1 #%MMM<<6 + pin"
    example: |
      setse1  #%001<<6 + pin   ' Event on IN rise
      waitse1                   ' Wait for the IN rise
      rdpin   result, #pin      ' Read result
    vs_polling: "The matched WAITSEn instruction will block until the event occurs; the matched POLLSEn instruction will check for the event without blocking"
    see_also: "architecture/event_system.yaml"

adc_capabilities:
  type: "Delta-sigma: the A input is sampled as a 1-bit stream on every clock (internally clocked) or on each B rise (externally clocked)"
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), Smart Pins, %11000 = ADC sample/filter/capture, internally clocked (the A input is sampled on every clock) and the delta-sigma ADC with 5 ranges, 2 sources and VIO/GIO calibration"

  modes:
    sinc2_sampling: "complete SINC2 conversion in hardware, power-of-2 periods (X[5:4] = %00)"
    sinc2_filtering: "SINC2 accumulator, software computes the difference (%01)"
    sinc3_filtering: "SINC3 accumulator, software computes the differences (%10)"
    bitstream: "raw 32-bit snapshots (%11)"
    scope: "triggered 8-bit capture (smart pin mode %11010)"

dac_capabilities:
  native_resolution: "8 bits"
  dithered_resolution: "16 bits"
  output_modes:
    - "Direct 8-bit"
    - "PWM dithered (mode %00011)"
    - "Pseudo-random dithered (mode %00010)"
    - "Noise (mode %00001)"

performance:
  adc_sample_period: "POWER(2, X[3:0]) clocks (X[5:4] = %00, SINC2 sampling); when X[5:4] > %00, WYPIN after WXPIN replaces the period with Y[13:0]. The accumulators are 27 bits wide, allowing up to 512 clocks per decimation in SINC3 filtering and up to 11,585 clocks in SINC2 filtering"
  pwm_resolution: "Triangle/sawtooth/SMPS PWM output: base period X[15:0] in clocks, frame period X[31:16] in base periods, output value Y[15:0]"

pin_pairing:
  pin_circuit:
    description: "Each I/O pin circuit is powered from its local 3.3V supply pin and connects to its own pin and to its odd/even adjacent pin: P0 and P1 see each other's pins as adjacent pins, as do P2 and P3, and so on."
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), PIN CONFIGURATION MODES (diagram of a single I/O pin circuit)"
  usb_mode: "Even/odd pins for D-/D+"
  differential: "For an odd pin, OTHER is the even pin's NOT output state (diff source)"
  quadrature: "Takes its A and B inputs through the %AAAA and %BBBB input selectors"

