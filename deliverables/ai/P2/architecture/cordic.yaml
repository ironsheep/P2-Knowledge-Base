# CORDIC Solver - 54-Stage Pipelined Math Engine
# Source: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), CORDIC Solver; Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01

component: CORDIC
category: math_engine
description: |
  54-stage pipelined CORDIC (COordinate Rotation DIgital Computer) solver that computes
  its functions for all cogs. A cog waits for its hub slot to hand a command to the solver,
  and each cog can start a CORDIC operation every 8 clocks, so several operations can be
  in flight per cog simultaneously. A sequence of eight SETQ+QROTATE commands given back
  to back, followed by one result read for each further command given and eight trailing
  result reads, is given as a complete overlapped sequence (eight commands outstanding).
  Not documented: the maximum count.

architecture:
  pipeline_stages: 54
  pipeline_type: "Pipelined"
  access_model: "A cog waits for its hub slot, which is zero to (cogs-1) clocks away, to hand a command to the CORDIC solver"
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), CORDIC Solver (a cog must wait for its hub slot to hand off the command) and OVERLAPPING CORDIC COMMANDS (the overlapping command listing: eight SETQ+QROTATE commands before the first result read, then one in and one out, then eight trailing results); Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, FEATURES (hub: cogs can start CORDIC operations every 8 clocks), p.2; the fill depth of 7 on real P2 silicon: EF-053"
  cog_access_interval: "Every 8 clocks per cog"
  ops_in_flight_per_cog: "several; eight outstanding commands is a complete overlapped sequence: eight SETQ+QROTATE commands, then one result read per further command, then eight trailing result reads. Not documented: the maximum count."
  result_latency: "55 clocks ('Fifty-five clocks later, results will be available via the GETQX and GETQY instructions')"
  pipeline_depth: "54 stages; the pipeline is 54 clocks long, which with the hub slot is what makes it possible to overlap CORDIC commands"
  shared_resource: true

critical_usage_pattern:
  fill_phase: "Give several commands to the CORDIC solver first; the first result is available 55 clocks after its command"
  steady_state: "Read a result, then give another command, indefinitely"
  drain_phase: "At the end, read the trailing results"
  warning: "GETQX/GETQY waits, in case the result has not arrived (2...58 clocks); POLLQMT is not a result-ready test"

  hub_access_in_fill_and_drain_loops:
    rule: |
      With RDLONG in the fill loop, results are first wrong at a fill depth of 2; with
      WRLONG in the drain loop, at a fill depth of 3. With register-only fill and drain
      loops, results are correct through a fill depth of 7.
      Not documented: other hub operations or cadences in these loops, and why the
      results are lost.
    source: "EF-053 (real P2 silicon, four arms differing only in where hub access sat, swept over fill depths 1-7 against single-operation ground truth; register-only fill and drain correct through fill depth 7; RDLONG in the fill loop first wrong at fill depth 2, WRLONG in the drain loop at fill depth 3; seven consistent runs, with a control -- queue one, retrieve immediately -- that stalled 58 clocks, the documented GETQX maximum)"

operations:
  multiply:
    instruction: "QMUL"
    operation: "32×32 → 64-bit unsigned multiply"
    signed: false
    unsigned: true
    setup: "QMUL D,S/# - multiply D by S (both unsigned)"
    result: "64-bit product in {X,Y} (GETQX=low 32, GETQY=high 32)"
    
  divide:
    instruction: "QDIV"
    operation: "64÷32 → 32-bit quotient, 32-bit remainder"
    setup: "SETQ {#}D (upper 32 bits of the dividend) then QDIV dividend_low,divisor"
    result: "Quotient in X, remainder in Y"
    notes: "SETQ provides upper 32 bits of 64-bit dividend"
    quotient_over_32_bits: "With the {SETQ value, D} dividend {3,7} and divisor 2 (true quotient $1_8000_0003, remainder 1), GETQX returns $FFFF_FFFE and GETQY $0000_000B. With {5,11} and divisor 4 (true quotient $1_4000_0002, remainder 3), GETQX returns $FFFF_FFFE and GETQY $0000_0013. Neither quotient is the low 32 bits of the true quotient, and neither is $FFFF_FFFF. Not documented: the result for any other dividend whose quotient exceeds 32 bits."
    source: "P2 hardware verification, EF-116 (one board, cog execution, the two cases above; in-range controls 1000/3 = 333 r 1 and {1,0}/4 = $4000_0000 r 0 and divide-by-zero with {$1234_5678,7} read as expected, and the SETQ high long was shown by quotients other than 3 and 2)"
    
  fractional_divide:
    instruction: "QFRAC"
    operation: "Unsigned division of {D, SETQ value or 32'b0} by S"
    setup: "QFRAC D,S/# - divide {D, SETQ-or-0} by S (D is the upper 32 bits of the numerator)"
    result: "Quotient in X (GETQX), remainder in Y (GETQY)"
    
  square_root:
    instruction: "QSQRT"
    operation: "64-bit → 32-bit square root (unsigned)"
    setup: "QSQRT D,S - input is the 64-bit value {S, D} (S = upper 32, D = lower 32)"
    result: "32-bit root in X (via GETQX), truncated (floor) -- see language/pasm2/qsqrt.yaml"

  rotate:
    instruction: "QROTATE"
    operation: "2D vector rotation by angle"
    setup: |
      SETQ Y
      QROTATE X, angle
    operands: "X from D operand, Y from SETQ value (0 if SETQ omitted), angle from S operand"
    result: "Rotated X in X result (GETQX), rotated Y in Y result (GETQY)"
    angle_format: "32-bit binary angle (0=$00000000, 90°=$40000000)"
    
  vector:
    instruction: "QVECTOR"
    operation: "Cartesian to polar conversion"
    setup: "QVECTOR X,Y"
    result: |
      X result: Magnitude (length)
      Y result: Angle (theta)
    angle_format: "32-bit binary angle"
    
  logarithm:
    instruction: "QLOG"
    operation: "Base-2 logarithm (5:27 fixed-point)"
    setup: "QLOG D"
    result: "log2(D) in X (GETQX), 5:27 fixed-point: the top 5 bits hold the whole part of the power-of-2 exponent and the bottom 27 bits hold the fractional part"
    
  exponential:
    instruction: "QEXP"
    operation: "Logarithm-to-number conversion: 2 to the power of D"
    setup: "QEXP D"
    input_format: "5:27-bit logarithm"
    result: "32-bit unsigned integer in X (GETQX)"

result_retrieval:
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), CORDIC Solver and OVERLAPPING CORDIC COMMANDS; read orders: P2 hardware verification, EF-115 (one board, cog execution; two QMUL k,$FFFF_FFFF results queued, k = 3 and 5, X = -k and Y = k - 1, read in the orders named; controls X X X X over four QMULs, and Y X Y X over two); empty read: P2 hardware verification, EF-117 (one board, cog execution; GETQX with no QMUL pending, directly after the GETQX that read a QMUL result, in two cases with different results: value the last X read, 2 clocks, QMT flag set; pending control waited and left the flag clear)"
  read_order: "With two QMUL results queued, in cog execution: GETQX then GETQX returns the first result's X then the second's X; GETQY then GETQY returns the first result's Y then the second's Y; GETQX then GETQY returns the first result's X then the first result's Y; GETQY, GETQX, GETQY, GETQX returns the first result's Y, its X, then the second result's Y, its X. In these orders the X reads and the Y reads advance independently. Not documented: other read orders."
  getqx:
    instruction: "GETQX"
    operation: "Retrieve X result from CORDIC"
    behavior: "Stalls if result not ready"
    timing: "2 clocks if no CORDIC operation is in progress ('GETQX/GETQY will only take two clock and the QMT (CORDIC empty) event flag will be set'). Otherwise it waits for the result: 2...58 clocks."
    empty_read: "With no result pending or in progress, GETQX takes two clocks and the QMT flag is set. Directly after a GETQX that read a QMUL result, an empty GETQX returns that same X result again. Not documented: the value of an empty read before any result, after a different CORDIC command, or by GETQY."

  getqy:
    instruction: "GETQY"
    operation: "Retrieve Y result from CORDIC"
    behavior: "Stalls if result not ready"
    timing: "2 clocks if no CORDIC operation is in progress. Otherwise it waits for the result: 2...58 clocks."
    
  pollqmt:
    instruction: "POLLQMT"
    operation: "Read and clear the CORDIC-read-but-empty event flag (event 15)"
    flags: "C/Z = 1 if a GETQX/GETQY has executed since the flag was last cleared with no CORDIC result available or in progress"
    note: "Not a result-ready poll: the flag says nothing about a result still being computed. GETQX/GETQY simply wait for it."
    non_blocking: true

pipeline_behavior:
  multiple_operations: |
    Multiple operations can be in flight simultaneously.
    Each COG can have multiple operations pending.
    Each cog's active CORDIC instructions and forthcoming results are completely isolated from each other, as well as from other cogs; each result must be retrieved on time or else it is overwritten by the following result, if any.
    Results are read with GETQX and GETQY.
    
  stall_conditions:
    - "GETQX/GETQY when result not ready"

  result_overwrite:
    source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, CORDIC Solver (each result must be retrieved on time or else it will be overwritten by the following result, if any), p.20; Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), OVERLAPPING CORDIC COMMANDS (you must not have interrupts enabled during such a juggle, or enough clocks could be stolen by the interrupt service routine that one or more of your results could be overwritten before you can read them); EF-053 (results lost silently with hub access in a fill or drain loop, tested shape only)"
    rule: "A result that is not retrieved on time is overwritten by the following result, if any."
    interrupts: "Interrupts must not be enabled during an overlapped CORDIC sequence: the interrupt service routine can take enough clocks that one or more results are overwritten before they can be read."
    hub_access_in_loops: "See critical_usage_pattern.hub_access_in_fill_and_drain_loops."

  event_generation:
    event_15: "CORDIC read but empty"
    usage: "Can trigger interrupt or be polled"

programming_patterns:
  basic_multiply:
    code: |
      QMUL    value1, value2    ' Start multiply
      ' ... do other work ...
      GETQX   result_low        ' Get lower 32 bits
      GETQY   result_high       ' Get upper 32 bits
      
  divide_64_32:
    code: |
      SETQ    dividend_high     ' Upper 32 bits
      QDIV    dividend_low, divisor
      ' ... do other work ...
      GETQX   quotient
      GETQY   remainder
      
  vector_magnitude:
    code: |
      QVECTOR x_coord, y_coord
      ' ... do other work ...
      GETQX   magnitude         ' length
      GETQY   angle             ' angle
      
  rotation_matrix:
    code: |
      SETQ    y_coord           ' Y from SETQ
      QROTATE x_coord, angle    ' X from D operand, angle from S operand
      ' ... do other work ...
      GETQX   new_x
      GETQY   new_y

accuracy:
  source: >-
    Parallax Propeller 2 Documentation v35 (Rev B/C silicon), OVERVIEW (hub features: CORDIC solver summary), which states the solver and each operation's result format.
    Each operation is described in the QMUL, QDIV, QSQRT, QLOG, QEXP, QROTATE and QVECTOR entries listed under related; this block states only the result formats and does not restate them.
    The truncated (floor) square root: EF-104.
  solver: "32-bit, pipelined, with scale-factor correction"
  multiply: "32 x 32 unsigned, 64-bit result (see language/pasm2/qmul.yaml)"
  divide: "64 / 32 unsigned, 32-bit quotient and 32-bit remainder (see language/pasm2/qdiv.yaml)"
  square_root: "64-bit -> 32-bit square root, truncated (floor) (see language/pasm2/qsqrt.yaml)"
  logarithm: "32-bit unsigned -> 5.27 fixed-point logarithm (see language/pasm2/qlog.yaml)"
  exponential: "5.27 fixed-point logarithm -> 32-bit unsigned (see language/pasm2/qexp.yaml)"
  trigonometric: >-
    Not documented: the accuracy of the rotate, polar-to-cartesian and
    cartesian-to-polar results. The solver applies scale-factor correction.

special_features:
  parallel_operations: |
    The CORDIC solver computes its functions for all cogs.
    Each cog's active CORDIC instructions and forthcoming results are completely isolated from each other, as well as from other cogs.

  automatic_stalling: |
    COG stalls automatically if result not ready (GETQX/GETQY wait, in case the results have not arrived).

  event_system: |
    Event 15 is the CORDIC-read-but-empty event (GETQX/GETQY executed with no results available or in progress).

goertzel_streamer:
  description: "Goertzel analysis is done by the streamer's DDS/Goertzel mode, read with GETXACC; it returns sine and cosine accumulations which can be converted into polar coordinates using the QVECTOR instruction, yielding power and phase information"
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), STREAMER (DDS/Goertzel mode); Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, GETXACC, p.45"

performance:
  source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, FEATURES (hub: each cog can start CORDIC operations every 8 clocks and get results 55 clocks later), p.2; Parallax Propeller 2 Documentation v35 (Rev B/C silicon), CORDIC Solver and OVERLAPPING CORDIC COMMANDS."
  issue_interval: "Each cog can start a CORDIC operation every 8 clocks"
  latency: "55 clocks from command to result"

related_components:
  architecture/streamer/overview.yaml: "The streamer's DDS/Goertzel mode returns accumulations that QVECTOR converts to polar coordinates"
  language/pasm2/mul.yaml: "MUL, MULS, SCA and SCAS are the cog's own 16 x 16-bit multiplies, 2 clocks each, beside the CORDIC solver's 32 x 32-bit QMUL"
  language/pasm2/muls.yaml: "MULS: the signed 16 x 16-bit multiply"
  language/pasm2/sca.yaml: "SCA: unsigned 16 x 16-bit multiply, the product shifted right 16 bits as the next instruction's S value"
  language/pasm2/scas.yaml: "SCAS: signed 16 x 16-bit multiply, the product shifted right 14 bits as the next instruction's S value"

sources:
  - "related_components (the cog multiplies): P2 Instructions v35 - Rev B/C Silicon, rows 137-140 (MUL D = unsigned (D[15:0] * S[15:0]); MULS signed; SCA next instruction's S value = unsigned (D[15:0] * S[15:0]) >> 16; SCAS signed, >> 14; 2 clocks each)"

