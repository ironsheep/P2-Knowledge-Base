# CORDIC Solver - 54-Stage Pipelined Math Engine
# Source: Silicon Doc v35, P2 Datasheet, Chip Gracey clarification

component: CORDIC
category: math_engine
description: |
  54-stage pipelined CORDIC (COordinate Rotation DIgital Computer) solver shared by
  all COGs via hub rotation. Each COG gets access every 8 clocks, enabling up to
  7-8 operations in flight per COG simultaneously.

architecture:
  pipeline_stages: 54
  pipeline_type: "Fully pipelined"
  access_model: "Hub rotation (like hub RAM)"
  cog_access_interval: "Every 8 clocks per COG (P2X8C4M64P with 8 cogs; Silicon Doc verbatim: 'every 1/2/4/8/16 (#cogs) clocks')"
  ops_in_flight_per_cog: "7-8 maximum"
  system_throughput: "1 operation per clock (all COGs combined)"
  result_latency: "55 clocks (Silicon Doc v35 verbatim: 'Fifty-five clocks later, results will be available via the GETQX and GETQY instructions')"
  pipeline_depth: "54 clocks (separate from result latency; this is the depth that enables overlapping ops)"
  shared_resource: true
  arbitration: "Round-robin via hub rotation"

critical_usage_pattern:
  fill_phase: "Submit 7-8 ops before expecting results"
  steady_state: "Each 8-clock slot: retrieve one result + submit one op"
  drain_phase: "Retrieve remaining results (may stall)"
  warning: "GETQX/GETQY stalls COG if result not ready - use POLLQMT to check"

operations:
  multiply:
    instruction: "QMUL"
    operation: "32×32 → 64-bit unsigned multiply"
    signed: false
    unsigned: true
    setup: "QMUL D,S/# - multiply D by S (both unsigned)"
    result: "64-bit product in {X,Y} (GETQX=low 32, GETQY=high 32)"
    
  divide:
    instruction: "QDIV"
    operation: "64÷32 → 32-bit quotient, 32-bit remainder"
    setup: "SETQ {#}D then QDIV divisor,dividend"
    result: "Quotient in X, remainder in Y"
    notes: "SETQ provides upper 32 bits of 64-bit dividend"
    
  fractional_divide:
    instruction: "QFRAC"
    operation: "64÷32 → 32-bit fractional quotient (unsigned DIVIDE, not a multiply)"
    setup: "QFRAC D,S/# - divide {D, SETQ-or-0} by S (D is the upper 32 bits of the numerator)"
    result: "32-bit fractional quotient in X (remainder via GETQY)"
    usage: "Fixed-point / fractional arithmetic (integer part in D, fraction in SETQ)"
    
  square_root:
    instruction: "QSQRT"
    operation: "64-bit → 32-bit square root (unsigned)"
    setup: "QSQRT D,S - input is the 64-bit value {S, D} (S = upper 32, D = lower 32)"
    result: "32-bit root in X (via GETQX)"
    
  rotate:
    instruction: "QROTATE"
    operation: "2D vector rotation by angle"
    setup: |
      SETQ Y
      QROTATE X, angle
    operands: "X from D operand, Y from SETQ value (0 if SETQ omitted), angle from S operand"
    result: "Rotated X in X result (GETQX), rotated Y in Y result (GETQY)"
    angle_format: "32-bit binary angle (0=$00000000, 90°=$40000000)"
    
  vector:
    instruction: "QVECTOR"
    operation: "Cartesian to polar conversion"
    setup: "QVECTOR X,Y"
    result: |
      X result: Magnitude (length)
      Y result: Angle (theta)
    angle_format: "32-bit binary angle"
    
  logarithm:
    instruction: "QLOG"
    operation: "Base-2 logarithm (5:27 fixed-point)"
    setup: "QLOG D"
    result: "log2(D) in X, 5:27 fixed-point (whole part = bit number, fractional part = mantissa)"
    
  exponential:
    instruction: "QEXP"
    operation: "2 to the power of D (antilog, inverse of QLOG)"
    setup: "QEXP D"
    input_format: "5:27 fixed-point"
    result: "2^D in X"

result_retrieval:
  getqx:
    instruction: "GETQX"
    operation: "Retrieve X result from CORDIC"
    behavior: "Stalls if result not ready"
    timing: "2 clocks if no CORDIC operation is in progress (Silicon Doc v35: 'GETQX/GETQY will only take two clock and the QMT (CORDIC empty) event flag will be set'). Otherwise waits for the next available result — worst case approaching the 55-clock CORDIC result latency from when the operation was issued."
    
  getqy:
    instruction: "GETQY"
    operation: "Retrieve Y result from CORDIC"
    behavior: "Stalls if result not ready"
    timing: "2 clocks if no CORDIC operation is in progress (per Silicon Doc v35). Otherwise waits for the next available result — worst case approaching the 55-clock CORDIC result latency from when the operation was issued."
    
  pollqmt:
    instruction: "POLLQMT"
    operation: "Check if CORDIC pipeline empty"
    flags: "C=1 if empty, C=0 if operations pending"
    non_blocking: true

pipeline_behavior:
  multiple_operations: |
    Multiple operations can be in flight simultaneously.
    Each COG can have multiple operations pending.
    Results retrieved in order submitted.
    
  stall_conditions:
    - "GETQX/GETQY when result not ready"
    - "New operation when pipeline full (rare)"
    
  event_generation:
    event_15: "CORDIC read but empty"
    usage: "Can trigger interrupt or be polled"

programming_patterns:
  basic_multiply:
    code: |
      QMUL    value1, value2    ' Start multiply
      ' ... do other work ...
      GETQX   result_low        ' Get lower 32 bits
      GETQY   result_high       ' Get upper 32 bits
      
  divide_64_32:
    code: |
      SETQ    dividend_high     ' Upper 32 bits
      QDIV    divisor, dividend_low
      ' ... do other work ...
      GETQX   quotient
      GETQY   remainder
      
  vector_magnitude:
    code: |
      QVECTOR x_coord, y_coord
      ' ... do other work ...
      GETQX   magnitude         ' sqrt(x²+y²)
      GETQY   angle            ' atan2(y,x)
      
  rotation_matrix:
    code: |
      SETQ    angle
      QROTATE x, y
      ' ... do other work ...
      GETQX   new_x
      GETQY   new_y

accuracy:
  multiply: "Exact 64-bit result"
  divide: "Exact quotient and remainder"
  square_root: "16-bit result, ±1 LSB"
  trig_functions: "~28 bits of precision"
  logarithm: "5.32 fixed-point precision"
  exponential: "5.32 fixed-point precision"

special_features:
  parallel_operations: |
    All 8 COGs can use CORDIC simultaneously.
    Pipeline handles interleaved operations.
    No COG monopolizes the resource.
    
  automatic_stalling: |
    Hardware manages result synchronization.
    COG stalls automatically if result not ready.
    No polling required for single operations.
    
  event_system: |
    Can generate event when CORDIC empty.
    Useful for interrupt-driven computation.
    Event 15 dedicated to CORDIC status.

applications:
  signal_processing:
    - "FFT butterfly operations"
    - "Digital filtering"
    - "Goertzel algorithm support"
    
  graphics:
    - "2D/3D transformations"
    - "Rotation matrices"
    - "Perspective calculations"
    
  control_systems:
    - "PID calculations"
    - "Motor control vectors"
    - "Sensor fusion"
    
  communications:
    - "Phase/frequency calculations"
    - "Modulation/demodulation"
    - "Error correction codes"

performance:
  throughput: "160 MOPS at 160MHz clock (1 op per clock system-wide via hub rotation)"
  latency: "343.75ns at 160MHz (55 clocks per Silicon Doc v35 verbatim)"
  efficiency: "~100% utilization possible by overlapping operations across the 54-stage pipeline"

related_components:
  architecture/streamer/overview.yaml: "Can use CORDIC results for DDS"
  smart_pins: "CORDIC supports Goertzel mode calculations"
  math_instructions: "Complements MUL/MULS/SCA/SCAS instructions"

see_also:
  - "QMUL instruction details"
  - "Fixed-point arithmetic guide"
  - "Vector math applications"
  - "Pipeline optimization techniques"