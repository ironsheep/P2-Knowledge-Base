# P2 Event System
# Provenance (re-derived 2026-08-26; the previous header cited a file that has
# never existed and datasheet pages beyond the end of a 50-page datasheet):
#   Propeller 2 Documentation v35 (Rev B/C Silicon), section EVENTS --
#     engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:2035-2261
#     (the sixteen events :2037-2054; POLLxxx :2061-2079; WAITxxx :2082-2100;
#      Jxxx/JNxxx :2104-2121; per-flag detail :2124-2213;
#      Selectable Events + SETSEn encoding :2230-2260)
#   Pattern-match (PAT) event rules -- silicon-doc-text.txt:2155-2161
#   Instruction encodings, same document, PASM2 encoding table --
#     silicon-doc-text.txt:5264-5267 (SETSEn), :5273-5276 (POLLSEn),
#     :5290-5293 (WAITSEn), :5204 (SETPAT)
#   P2X8C4M64P Datasheet 2022/11/01 -- the datasheet has no events section; it
#     carries SETPAT's C/Z selection rule in the PASM2 table at
#     engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:1909

component_name: "Event System"

component_type: "hardware_event_controller"

description: |
  The P2 Event System provides hardware event detection and routing capabilities that
  enable COGs to respond to various hardware conditions without polling. Events can
  trigger interrupts, wake COGs from wait states, or be polled directly. The system
  supports pin patterns, edges, timer comparisons, and subsystem completion events,
  creating a flexible event-driven programming model.

architecture:
  event_sources: 16
  selectable_events: 4  # SE1-SE4
  
  the_sixteen_events:
    source: >-
      Propeller 2 Documentation v35 (Rev B/C), EVENTS -- "Cogs monitor and track 16
      different background events, numbered 0..15",
      engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:2037-2054.
    list:
      - {event: 0,  name: "interrupt occurred",        poll: "POLLINT"}
      - {event: 1,  name: "CT passed CT1",             poll: "POLLCT1"}
      - {event: 2,  name: "CT passed CT2",             poll: "POLLCT2"}
      - {event: 3,  name: "CT passed CT3",             poll: "POLLCT3"}
      - {event: 4,  name: "selectable event 1 occurred", poll: "POLLSE1"}
      - {event: 5,  name: "selectable event 2 occurred", poll: "POLLSE2"}
      - {event: 6,  name: "selectable event 3 occurred", poll: "POLLSE3"}
      - {event: 7,  name: "selectable event 4 occurred", poll: "POLLSE4"}
      - {event: 8,  name: "pattern match or mismatch on INA or INB", poll: "POLLPAT"}
      - {event: 9,  name: "hub FIFO block-wrap -- new start address and block count loaded", poll: "POLLFBW"}
      - {event: 10, name: "streamer command buffer empty, ready for a new command", poll: "POLLXMT"}
      - {event: 11, name: "streamer finished -- out of commands, now idle", poll: "POLLXFI"}
      - {event: 12, name: "streamer NCO rollover occurred", poll: "POLLXRO"}
      - {event: 13, name: "streamer read lookup RAM location $1FF", poll: "POLLXRL"}
      - {event: 14, name: "attention requested by another cog or cogs", poll: "POLLATN"}
      - {event: 15, name: "GETQX/GETQY executed with no CORDIC result available", poll: "POLLQMT"}
    note: >-
      Every event but 15 also has a matching WAITxxx and a Jxxx/JNxxx branch. There is no
      WAITQMT, because that event cannot occur while waiting
      (silicon-doc-text.txt:2102). Events 0-3 and 8-15 are fixed sensors; only events 4-7
      are programmable, via SETSE1..4.
  
  event_routing:
    - destination: "interrupts"
      description: "Events can trigger INT1/2/3"
      dispatch_mechanism: "Hardware inserts 'CALLD IRETx,IJMPx WCZ' into the instruction pipeline (Silicon Doc v35 verbatim)"
      entry_overhead_cogexec: "4 clocks (per calld.yaml encoding)"
      entry_overhead_hubexec: "13-20 clocks (FIFO refill on the branch)"
      deferral_conditions: "See architecture/interrupts.yaml deferral_conditions; the branch is held off during ALTxx/SETQ/REP/STALLI/WAITx etc."
    
    - destination: "wait_release"
      description: "Events can release WAIT instructions"
      latency: "0 additional clocks beyond the WAITx instruction's normal completion"
    
    - destination: "polling"
      description: "Events can be polled via POLL instructions"
      timing: "POLLxxx instructions are 2 clocks (per per-instruction YAMLs)"

event_selectors:
  SE1:
    register: "Internal selector 1"
    configuration: "SETSE1 instruction"
    typical_use: "Primary event monitoring"
  
  SE2:
    register: "Internal selector 2"
    configuration: "SETSE2 instruction"
    typical_use: "Secondary event monitoring"
  
  SE3:
    register: "Internal selector 3"
    configuration: "SETSE3 instruction"
    typical_use: "Tertiary event monitoring"
  
  SE4:
    register: "Internal selector 4"
    configuration: "SETSE4 instruction"
    typical_use: "Quaternary event monitoring"

instructions:
  - instruction: "SETSE1"
    encoding: "EEEE 1101011 00L DDDDDDDDD 000100000"
    description: "Configure selectable event 1"
    source: >-
      Propeller 2 Documentation v35 (Rev B/C), EVENTS > Selectable Events --
      engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:2230-2260; encodings
      for SETSE1..4 at silicon-doc-text.txt:5264-5267, for POLLSE1..4 at :5273-5276, for
      WAITSE1..4 at :5290-5293.
    operation: |
      SE1 := D[8:0] event configuration (9 bits)
      SETSE can ONLY configure pin, LUT, or lock events (NOT timer/ATN/pattern events)
    d_encoding_table: |
      D[8:0] encoding (from Silicon Doc v35):
      %000_00_00AA = this cog reads LUT address %1111111AA
      %000_00_01AA = this cog writes LUT address %1111111AA
      %000_00_10AA = odd/even companion cog reads LUT address %1111111AA
      %000_00_11AA = odd/even companion cog writes LUT address %1111111AA
      %000_01_LLLL = hub lock %LLLL rises
      %000_10_LLLL = hub lock %LLLL falls
      %000_11_LLLL = hub lock %LLLL changes
      %001_PPPPPP = INA/INB bit of pin %PPPPPP rises (positive edge)
      %010_PPPPPP = INA/INB bit of pin %PPPPPP falls (negative edge)
      %011_PPPPPP = INA/INB bit of pin %PPPPPP changes (any edge)
      %10x_PPPPPP = INA/INB bit of pin %PPPPPP is low (level)
      %11x_PPPPPP = INA/INB bit of pin %PPPPPP is high (level)
    usage_example: |
      SETSE1  #%001_000010     ' Positive edge on pin 2 (9-bit: pin rises)
      SETSE1  #%010_000010     ' Negative edge on pin 2 (9-bit: pin falls)
      SETSE1  #%011_000010     ' Any edge on pin 2 (9-bit: pin changes)
      SETSE1  #%000_01_0101    ' Lock 5 rises
  
  - instruction: "SETSE2"
    encoding: "EEEE 1101011 00L DDDDDDDDD 000100001"
    description: "Configure selectable event 2"
    operation: "Similar to SETSE1 for event selector 2"
  
  - instruction: "SETSE3"
    encoding: "EEEE 1101011 00L DDDDDDDDD 000100010"
    description: "Configure selectable event 3"
  
  - instruction: "SETSE4"
    encoding: "EEEE 1101011 00L DDDDDDDDD 000100011"
    description: "Configure selectable event 4"
  
  - instruction: "POLLSE1"
    encoding: "EEEE 1101011 CZ0 000000100 000100100"
    description: "Get the SE1 event flag into C and/or Z, then clear it"
    operation: |
      C and/or Z := SE1 event flag (per WC / WZ / WCZ)
      The flag is then cleared, unless the event sensor is setting it again on
      the same clock. SE1 is also cleared by WAITSE1/JSE1/JNSE1 and by SETSE1.
    flags_affected: "C and/or Z = SE1 event flag"
    timing: "2 clocks"
    usage_example: |
      POLLSE1 WC              ' Check SE1
      IF_C    JMP #event1_handler
  
  - instruction: "POLLSE2"
    encoding: "EEEE 1101011 CZ0 000000101 000100100"
    description: "Poll selectable event 2"
  
  - instruction: "POLLSE3"
    encoding: "EEEE 1101011 CZ0 000000110 000100100"
    description: "Poll selectable event 3"
  
  - instruction: "POLLSE4"
    encoding: "EEEE 1101011 CZ0 000000111 000100100"
    description: "Poll selectable event 4"
  
  - instruction: "WAITSE1"
    encoding: "EEEE 1101011 CZ0 000010100 000100100"
    description: "Wait for the SE1 event flag, then clear it"
    operation: |
      Wait until the SE1 event flag is set (it may already be), then clear it.
      A SETQ immediately before supplies a future CT target that ends the wait
      early; with WC, C is set if that timeout occurred before the event.
    timing: "2+ clocks (waits for the event)"
    usage_example: |
      WAITSE1                 ' Wait for event 1
      ' Event occurred, continue
  
  - instruction: "WAITSE2"
    encoding: "EEEE 1101011 CZ0 000010101 000100100"
    description: "Wait for selectable event 2"
  
  - instruction: "WAITSE3"
    encoding: "EEEE 1101011 CZ0 000010110 000100100"
    description: "Wait for selectable event 3"
  
  - instruction: "WAITSE4"
    encoding: "EEEE 1101011 CZ0 000010111 000100100"
    description: "Wait for selectable event 4"
  
  - instruction: "SETPAT"
    encoding: "EEEE 1011111 1LI DDDDDDDDD SSSSSSSSS"
    description: "Set the pin pattern that raises the PAT event (event 8)"
    source: >-
      Propeller 2 Documentation v35 (Rev B/C), EVENTS > POLLPAT/WAITPAT event flag --
      engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt:2155-2161; encoding
      at silicon-doc-text.txt:5204; P2 Datasheet 2022/11/01 PASM2 table --
      engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt:1909.
    operation: |
      D = mask, S = match value.
      C and Z are read as INPUTS at the moment SETPAT executes -- they are not
      effect flags, and pnut-ts rejects `SETPAT D,S WC/WZ/WCZ`. Set them first:
        C=0, Z=0  ->  event set whenever (INA & D) != S
        C=0, Z=1  ->  event set whenever (INA & D) == S
        C=1, Z=0  ->  event set whenever (INB & D) != S
        C=1, Z=1  ->  event set whenever (INB & D) == S
      SETPAT also clears the PAT event flag.
    usage_example: |
      CMP     mask, mask WCZ  ' C := 0 (watch INA), Z := 1 (fire on ==)
      SETPAT  mask, pattern   ' Set the pattern to detect

event_configurations:
  pin_edge_detection:
    note: "SETSE uses D[8:6] as mode bits (3 bits, not 2)"
    modes:
      - mode: "%001_PPPPPP"
        description: "Pin rises (positive edge)"
        behavior: "Event on low-to-high transition of pin PPPPPP"

      - mode: "%010_PPPPPP"
        description: "Pin falls (negative edge)"
        behavior: "Event on high-to-low transition of pin PPPPPP"

      - mode: "%011_PPPPPP"
        description: "Pin changes (any edge)"
        behavior: "Event on any transition of pin PPPPPP"

    setup_example: |
      ' Detect positive edge on pin 5
      SETSE1  #%001_000101     ' 9-bit: pin 5 rises
      WAITSE1                   ' Wait for positive edge

  pin_level_detection:
    modes:
      - mode: "%10x_PPPPPP"
        description: "Pin is low (level)"
        behavior: "Event while pin PPPPPP is low"

      - mode: "%11x_PPPPPP"
        description: "Pin is high (level)"
        behavior: "Event while pin PPPPPP is high"

    setup_example: |
      ' Wait for pin 3 to go high
      SETSE1  #%110_000011     ' 9-bit: pin 3 is high
      WAITSE1
  
  pattern_matching:
    description: "Match specific pin patterns using dedicated WAITPAT (not SETSE)"
    note: "Pattern match uses WAITPAT directly - SETSE cannot configure pattern events"

    setup_example: |
      ' Wait for INA[7:0] == $A5.
      ' C and Z are INPUTS to SETPAT: C picks INA(0)/INB(1), Z picks !=(0)/==(1).
      ' They must be set BEFORE SETPAT -- SETPAT takes no WC/WZ effect.
      MOV     mask, #$FF
      MOV     pattern, #$A5
      CMP     mask, mask WCZ  ' C := 0 (INA), Z := 1 (fire on equality)
      SETPAT  mask, pattern
      WAITPAT                 ' Wait for (INA & mask) == pattern
  
  timer_events:
    description: "Events based on counter comparisons using dedicated WAITCTn (not SETSE)"
    note: "Timer events use WAITCT1/2/3 directly - SETSE cannot configure timer events"

    setup_example: |
      ' Setup 1ms timer event
      GETCT   timeout
      ADDCT1  timeout, ##160_000  ' 1ms at 160MHz
      WAITCT1                     ' Wait for CT >= CT1 (dedicated instruction)

programming_patterns:
  - pattern: "multi_event_monitor"
    description: "Monitor multiple events simultaneously"
    note: |
      IMPORTANT: SETSE can ONLY configure pin/LUT/lock events.
      Timer (CT), ATN, pattern, and streamer events have dedicated POLL/WAIT instructions.
      There is NO single instruction to wait for any of multiple selectable events -
      must use polling loop or map events to interrupts.
    code: |
      ' Setup multiple PIN events (SETSE is limited to pins/LUT/locks)
      SETSE1  #%001_000001     ' Pin 1 rises (positive edge)
      SETSE2  #%010_000010     ' Pin 2 falls (negative edge)
      SETSE3  #%011_000011     ' Pin 3 changes (any edge)
      SETSE4  #%000_01_0000    ' Lock 0 rises

      ' Also configure timer for timeout
      GETCT   timeout
      ADDCT1  timeout, ##160_000

      event_loop:
          POLLSE1 WC
          IF_C    CALL #handle_pin1

          POLLSE2 WC
          IF_C    CALL #handle_pin2

          POLLSE3 WC
          IF_C    CALL #handle_pin3

          POLLSE4 WC
          IF_C    CALL #handle_lock

          POLLCT1 WC            ' Timer uses dedicated POLL instruction
          IF_C    CALL #handle_timeout

          POLLATN WC            ' ATN uses dedicated POLL instruction
          IF_C    CALL #handle_atn

          JMP     #event_loop
  
  - pattern: "event_driven_state_machine"
    description: "State machine triggered by events"
    code: |
      state_machine:
          CMP     state, #STATE_IDLE WZ
          IF_Z    JMP #idle_state
          CMP     state, #STATE_ACTIVE WZ
          IF_Z    JMP #active_state
          CMP     state, #STATE_DONE WZ
          IF_Z    JMP #done_state

      idle_state:
          SETSE1  #%001_000000     ' Pin 0 rises (start button positive edge)
          WAITSE1
          MOV     state, #STATE_ACTIVE
          JMP     #state_machine

      active_state:
          ' Timer events use WAITCT directly (not SETSE)
          GETCT   timeout
          ADDCT1  timeout, ##16_000_000
          WAITCT1                   ' Wait for timer (dedicated instruction)
          MOV     state, #STATE_DONE
          JMP     #state_machine
  
  - pattern: "pin_change_notification"
    description: "Respond to any pin change in a group"
    code: |
      ' Monitor pins 7:0 for any change
      RDPIN   last_state, #0
      AND     last_state, #$FF
      
      monitor_loop:
          RDPIN   current, #0
          AND     current, #$FF
          XOR     current, last_state WZ
          IF_NZ   CALL #pins_changed
          MOV     last_state, current
          JMP     #monitor_loop
  
  - pattern: "synchronized_sampling"
    description: "Sample multiple inputs on timer event"
    code: |
      ' Sample every 100us
      sample_loop:
          GETCT   next_sample
          ADDCT2  next_sample, ##16_000  ' 100us
          WAITCT2                        ' Wait for timer (dedicated instruction)

          ' Sample all inputs
          RDPIN   sample1, #0
          RDPIN   sample2, #1
          RDPIN   sample3, #2

          ' Store samples
          WRLONG  sample1, ptr
          ADD     ptr, #12

          JMP     #sample_loop

event_interrupt_mapping:
  configuration: |
    ' Map events to interrupts
    SETSE1  #event_config    ' Configure event
    SETINT1 #%0100           ' SE1 triggers INT1
    
    SETSE2  #event_config2
    SETINT2 #%0101           ' SE2 triggers INT2
    
    SETSE3  #event_config3
    SETINT3 #%0110           ' SE3 triggers INT3
  
  event_to_interrupt_codes:
    - code: "%0100"
      source: "SE1 event"
      interrupt: "Any (1/2/3)"
    
    - code: "%0101"
      source: "SE2 event"
      interrupt: "Any (1/2/3)"
    
    - code: "%0110"
      source: "SE3 event"
      interrupt: "Any (1/2/3)"
    
    - code: "%0111"
      source: "SE4 event"
      interrupt: "Any (1/2/3)"

common_applications:
  - application: "button_debouncing"
    description: "Detect clean button press with timing"
    complexity: "beginner"
    implementation: |
      ' Wait for button press with debounce
      SETSE1  #%01_000000 | BUTTON_PIN  ' Positive edge
      WAITSE1                            ' Wait for press
      WAITX   ##1_600_000               ' 10ms debounce
      RDPIN   state, #BUTTON_PIN        ' Verify still pressed
  
  - application: "pulse_measurement"
    description: "Measure pulse width using events"
    complexity: "intermediate"
    implementation: |
      ' Measure positive pulse width
      SETSE1  #%01_000000 | PULSE_PIN   ' Positive edge
      WAITSE1
      GETCT   start_time
      SETSE1  #%10_000000 | PULSE_PIN   ' Negative edge
      WAITSE1
      GETCT   end_time
      SUB     end_time, start_time      ' Pulse width
  
  - application: "protocol_timeout"
    description: "Timeout waiting for protocol response"
    complexity: "intermediate"
    implementation: |
      ' Wait for response with timeout
      GETCT   timeout
      ADDCT1  timeout, ##16_000_000     ' 100ms timeout
      SETSE1  #%001_000000 | DATA_PIN   ' Data pin rises (positive edge)

      ' Race between timeout and data using polling loop
      JMPREL  #0                         ' Pipeline sync
      POLLCT1 WC                        ' Check timeout (dedicated instruction)
      IF_C    JMP #timeout_handler
      POLLSE1 WC                        ' Check data pin event
      IF_C    JMP #data_received
      JMP     #$-4                      ' Keep checking

best_practices:
  - practice: "clear_before_wait"
    description: "Clear event flags before waiting"
    rationale: "Prevents responding to stale events"
  
  - practice: "use_edge_for_signals"
    description: "Use edge detection for signal changes"
    rationale: "Level detection can cause repeated triggers"
  
  - practice: "combine_with_interrupts"
    description: "Map critical events to interrupts"
    rationale: "Ensures timely response to important events"
  
  - practice: "document_event_usage"
    description: "Document which events each COG uses"
    rationale: "Prevents conflicts in multi-COG systems"

performance_characteristics:
  event_detection: |
    Event flags are set by hardware at the moment the event condition is
    evaluated; the flag is then visible to POLLxxx/WAITxxx/JATN/etc. on
    subsequent instructions. Silicon Doc does not publish a specific
    detection-to-flag clock count.
  
  response_latency:
    polling: "POLLxxx: 2 clocks (per per-instruction YAMLs)"
    waiting: "WAITxxx releases on the same clock the event flag becomes set"
    interrupt: "4 clocks cog / 13-20 clocks hub for the dispatched CALLD (per calld.yaml; Silicon Doc v35 dispatch mechanism)"
  
  simultaneous_events: "All 4 SE events tracked independently"
  
  overhead:
    configuration: "2 clocks per SETSEn instruction"
    monitoring: >-
      2 clocks per POLLSEn. A WAITSEn costs 2 clocks once the flag is already set, and
      stalls the cog for as long as it is not -- there is no separate per-wait overhead.

limitations:
  - limitation: "four_selectable_events"
    description: "Only 4 SE events available per COG"
    workaround: "Reconfigure events dynamically or use interrupts"

  - limitation: "no_event_queuing"
    description: "Events are flags, not queued"
    workaround: "Must handle before next occurrence"

  - limitation: "cog_local_events"
    description: "Events are per-COG, not global"
    workaround: "Use ATN for inter-COG event notification"

  - limitation: "no_multi_event_wait"
    description: "No single instruction to wait for any of multiple SE events"
    workaround: "Use polling loop (POLLSE1..4) or map events to interrupts via SETINT"

  - limitation: "setse_limited_sources"
    description: "SETSE can ONLY configure pin, LUT, or lock events"
    workaround: "Timer events use WAITCT1/2/3, ATN uses WAITATN, pattern uses WAITPAT"

critical_distinction:
  title: "SETSE vs SETINT Encoding (Common Source of Confusion)"
  explanation: |
    There are TWO separate encoding systems that are often confused:

    1. SETSE D[8:0] - Configures WHAT triggers a Selectable Event (SE1-4)
       - 9-bit encoding for pin edges/levels, LUT accesses, lock states
       - CANNOT configure timer, ATN, pattern, streamer, or CORDIC events
       - Example: SETSE1 #%001_000010 = pin 2 rises

    2. SETINT D[3:0] - Configures WHAT triggers an Interrupt (INT1-3)
       - 4-bit code selecting from 16 interrupt sources:
         0=off, 1=CT1, 2=CT2, 3=CT3, 4=SE1, 5=SE2, 6=SE3, 7=SE4,
         8=pattern, 9=FIFO, 10=streamer ready, 11=streamer done,
         12=NCO roll, 13=streamer reads LUT $1FF, 14=ATN, 15=CORDIC empty
       - Example: SETINT1 #4 = INT1 triggered by SE1 event

    To wait for timer/ATN/pattern events without interrupts, use dedicated instructions:
    - Timer: WAITCT1, WAITCT2, WAITCT3, POLLCT1, POLLCT2, POLLCT3
    - ATN: WAITATN, POLLATN
    - Pattern: WAITPAT, POLLPAT

related_topics:
  - topic: "interrupts"
    relationship: "Events can trigger interrupts"
  
  - topic: "smart_pins"
    relationship: "Smart pin IN rises are common event sources"
  
  - topic: "timers"
    relationship: "CT comparisons are event sources"
  
  - topic: "pattern_matching"
    relationship: "PAT instructions work with event system"

extraction_metadata:
  source_documents:
    - document: "Propeller 2 Documentation v35 (Rev B/C Silicon)"
      path: "engineering/ingestion/sources/silicon-doc/silicon-doc-text.txt"
      sections:
        - "EVENTS -- lines 2035-2260"
        - "PASM2 encoding table -- lines 5204, 5264-5267, 5273-5276, 5290-5293"
    - document: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01"
      path: "engineering/ingestion/sources/p2-datasheet/p2-datasheet-text.txt"
      sections:
        - "PASM2 instruction table, SETPAT -- line 1909"
  re_derivation_note: >-
    Re-derived 2026-08-26 under F-359. The header this file shipped with cited
    `part1-cog.txt` (a file that has never existed) and datasheet pages 74-75 (the
    datasheet is 50 pages; it has no events section). Corrected in this pass: an invented
    event taxonomy naming events the P2 does not have ("Edge-detect", "IN-rise",
    "CORDIC-done"), replaced by the sixteen the source enumerates; eleven of the twelve
    SE/PAT instruction encodings; and SETPAT's C/Z selection, which the file omitted --
    the worked example it shipped selected mismatch mode while its comment said match.
  confidence: "high"
  last_updated: "2024-12-30"