# P2 Event System
# Sources:
#   Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), EVENTS
#     (the sixteen events; POLLxxx; WAITxxx; Jxxx/JNxxx; per-flag detail;
#      Selectable Events + SETSEn encoding)
#   Pattern-match (PAT) event rules, same section
#   Instruction encodings, same document, Assembly Language (instruction encoding list):
#     SETSEn, POLLSEn, WAITSEn, SETPAT
#   Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01 -- the datasheet has no events
#     section; it carries SETPAT's C/Z selection rule in its PASM2 instruction table

component_name: "Event System"

component_type: "hardware_event_controller"

description: |
  Each cog tracks 16 background events. Events can be polled (POLLxxx), waited for
  (WAITxxx), branched on (Jxxx/JNxxx) and used as interrupt sources. The events cover
  pin patterns, pin edges and levels, CT comparisons, and subsystem conditions.

architecture:
  event_sources: 16
  selectable_events: 4  # SE1-SE4
  
  the_sixteen_events:
    source: >-
      Parallax Propeller 2 Documentation v35 (Rev B/C silicon), EVENTS ("Cogs monitor and track 16 different background events, numbered 0..15").
    list:
      - {event: 0,  name: "interrupt occurred",        poll: "POLLINT"}
      - {event: 1,  name: "CT passed CT1",             poll: "POLLCT1"}
      - {event: 2,  name: "CT passed CT2",             poll: "POLLCT2"}
      - {event: 3,  name: "CT passed CT3",             poll: "POLLCT3"}
      - {event: 4,  name: "selectable event 1 occurred", poll: "POLLSE1"}
      - {event: 5,  name: "selectable event 2 occurred", poll: "POLLSE2"}
      - {event: 6,  name: "selectable event 3 occurred", poll: "POLLSE3"}
      - {event: 7,  name: "selectable event 4 occurred", poll: "POLLSE4"}
      - {event: 8,  name: "pattern match or mismatch on INA or INB", poll: "POLLPAT"}
      - {event: 9,  name: "hub FIFO block-wrap -- new start address and block count loaded", poll: "POLLFBW"}
      - {event: 10, name: "streamer command buffer empty, ready for a new command", poll: "POLLXMT"}
      - {event: 11, name: "streamer finished -- out of commands, now idle", poll: "POLLXFI"}
      - {event: 12, name: "streamer NCO rollover occurred", poll: "POLLXRO"}
      - {event: 13, name: "streamer read lookup RAM location $1FF", poll: "POLLXRL"}
      - {event: 14, name: "attention requested by a cog's COGATN (another cog's, or this cog's own bit)", poll: "POLLATN"}
      - {event: 15, name: "GETQX/GETQY executed with no CORDIC result available", poll: "POLLQMT"}
    note: >-
      Every event but 15 has a matching WAITxxx, and every event has a Jxxx/JNxxx branch. There is no
      WAITQMT, because that event cannot occur while waiting. Events 4-7 (SE1..SE4) are configured by
      SETSE1..SETSE4; events 1-3 are established by ADDCT1..ADDCT3 and event 8 by SETPAT.
  
  event_routing:
    - destination: "interrupts"
      description: "Events can trigger INT1/2/3"
      dispatch_mechanism: "Hardware inserts 'CALLD IRETx,IJMPx WCZ' into the instruction pipeline"
      entry_overhead_cogexec: "Not documented"
      entry_overhead_hubexec: "Not documented"
      deferral_conditions: "See architecture/interrupts.yaml deferral_conditions; the branch is held off during ALTxx/SETQ/REP/STALLI/WAITx etc."
    
    - destination: "wait_release"
      description: "Events can release WAIT instructions"
      latency: "Not documented as a clock count"
    
    - destination: "polling"
      description: "Events can be polled via POLL instructions"
      timing: "POLLxxx instructions are 2 clocks"

event_clearing:
  source: >-
    Parallax Propeller 2 Documentation v35 (Rev B/C silicon), EVENTS (the per-flag
    descriptions: POLLINT/WAITINT through POLLQMT event flag; the POLLxxx, WAITxxx
    and Jxxx/JNxxx paragraphs; Selectable Events);
    Propeller 2 Assembly Language (PASM2) Manual Nov 1, 2022 Release, POLLATN through POLLXRO, pp.111-116 (set and clear sentences of each Explanation).
  note: >-
    One row per event. The cleared-by column lists the POLLxxx, WAITxxx and
    Jxxx/JNxxx instructions of the event (a Jxxx/JNxxx clears the flag whether or
    not it branches) and the other instructions that clear it. A POLLxxx, WAITxxx or
    Jxxx/JNxxx leaves the flag set if the event sensor is setting it again at that
    moment. Cog-start cells: "Cleared" for events 0, 13, 14 and 15; for the other
    events the state of the flag at cog start is not documented.
  rows:
    - event: 0
      name: "interrupt occurred"
      set_by: "Interrupt 1, 2 or 3 occurring (debug interrupts are ignored)"
      cleared_by: "POLLINT, WAITINT, JINT, JNINT"
      cleared_on_cog_start: "Cleared"
    - event: 1
      name: "CT passed CT1"
      set_by: "CT passing the result of the ADDCT1 (MSB of CT minus CT1 is 0)"
      cleared_by: "ADDCT1, POLLCT1, WAITCT1, JCT1, JNCT1"
      cleared_on_cog_start: "Not documented"
    - event: 2
      name: "CT passed CT2"
      set_by: "CT passing the result of the ADDCT2 (MSB of CT minus CT2 is 0)"
      cleared_by: "ADDCT2, POLLCT2, WAITCT2, JCT2, JNCT2"
      cleared_on_cog_start: "Not documented"
    - event: 3
      name: "CT passed CT3"
      set_by: "CT passing the result of the ADDCT3 (MSB of CT minus CT3 is 0)"
      cleared_by: "ADDCT3, POLLCT3, WAITCT3, JCT3, JNCT3"
      cleared_on_cog_start: "Not documented"
    - event: 4
      name: "selectable event 1 occurred"
      set_by: "The event configured by SETSE1 occurring"
      cleared_by: "SETSE1, POLLSE1, WAITSE1, JSE1, JNSE1"
      cleared_on_cog_start: "Not documented"
    - event: 5
      name: "selectable event 2 occurred"
      set_by: "The event configured by SETSE2 occurring"
      cleared_by: "SETSE2, POLLSE2, WAITSE2, JSE2, JNSE2"
      cleared_on_cog_start: "Not documented"
    - event: 6
      name: "selectable event 3 occurred"
      set_by: "The event configured by SETSE3 occurring"
      cleared_by: "SETSE3, POLLSE3, WAITSE3, JSE3, JNSE3"
      cleared_on_cog_start: "Not documented"
    - event: 7
      name: "selectable event 4 occurred"
      set_by: "The event configured by SETSE4 occurring"
      cleared_by: "SETSE4, POLLSE4, WAITSE4, JSE4, JNSE4"
      cleared_on_cog_start: "Not documented"
    - event: 8
      name: "pattern match or mismatch on INA or INB"
      set_by: "After SETPAT: (INA & D) != S with C=0, Z=0; (INA & D) == S with C=0, Z=1; (INB & D) != S with C=1, Z=0; (INB & D) == S with C=1, Z=1"
      cleared_by: "SETPAT, POLLPAT, WAITPAT, JPAT, JNPAT"
      cleared_on_cog_start: "Not documented"
    - event: 9
      name: "hub FIFO block-wrap"
      set_by: "The hub RAM FIFO interface exhausting its block count and reloading its block count and start address"
      cleared_by: "RDFAST, WRFAST, FBLOCK, POLLFBW, WAITFBW, JFBW, JNFBW"
      cleared_on_cog_start: "Not documented"
    - event: 10
      name: "streamer command buffer empty"
      set_by: "The streamer being ready for a new command"
      cleared_by: "XINIT, XZERO, XCONT, POLLXMT, WAITXMT, JXMT, JNXMT"
      cleared_on_cog_start: "Not documented"
    - event: 11
      name: "streamer finished"
      set_by: "The streamer running out of commands"
      cleared_by: "XINIT, XZERO, XCONT, POLLXFI, WAITXFI, JXFI, JNXFI"
      cleared_on_cog_start: "Not documented"
    - event: 12
      name: "streamer NCO rollover"
      set_by: "The streamer NCO rolling over"
      cleared_by: "XINIT, XZERO, XCONT, POLLXRO, WAITXRO, JXRO, JNXRO"
      cleared_on_cog_start: "Not documented"
    - event: 13
      name: "streamer read lookup RAM location $1FF"
      set_by: "Location $1FF of the lookup RAM being read by the streamer"
      cleared_by: "POLLXRL, WAITXRL, JXRL, JNXRL"
      cleared_on_cog_start: "Cleared"
    - event: 14
      name: "attention requested"
      set_by: "Any cog requesting attention with COGATN, this cog included when its own bit is set in COGATN's D"
      cleared_by: "POLLATN, WAITATN, JATN, JNATN"
      cleared_on_cog_start: "Cleared"
    - event: 15
      name: "GETQX/GETQY executed with no CORDIC result"
      set_by: "GETQX or GETQY executing without any CORDIC results available or in progress"
      cleared_by: "POLLQMT, JQMT, JNQMT (there is no WAITQMT, because the event could not happen while waiting; Parallax's documents also name WAITQMT among the clearing instructions)"
      cleared_on_cog_start: "Cleared"

event_selectors:
  SE1:
    register: "Not documented: where the selectable event's SETSEn setting is stored"
    configuration: "SETSE1 instruction"

  SE2:
    register: "Not documented: where the selectable event's SETSEn setting is stored"
    configuration: "SETSE2 instruction"

  SE3:
    register: "Not documented: where the selectable event's SETSEn setting is stored"
    configuration: "SETSE3 instruction"

  SE4:
    register: "Not documented: where the selectable event's SETSEn setting is stored"
    configuration: "SETSE4 instruction"

instructions:
  - instruction: "SETSE1"
    encoding: "EEEE 1101011 00L DDDDDDDDD 000100000"
    description: "Configure selectable event 1"
    source: >-
      Parallax Propeller 2 Documentation v35 (Rev B/C silicon), EVENTS, Selectable
      Events; encodings for SETSE1..4, POLLSE1..4 and WAITSE1..4: Assembly Language
      (instruction encodings).
    operation: |
      SE1 := D[8:0] event configuration (9 bits)
      SETSEn D/# accepts the configuration values listed in d_encoding_table: LUT read and write events, hub lock rises, falls and changes, and pin rises, falls, changes, low and high.
      SEn is cleared when the matched SETSEn executes.
    d_encoding_table: |
      D[8:0] encoding:
      %000_00_00AA = this cog reads LUT address %1111111AA
      %000_00_01AA = this cog writes LUT address %1111111AA
      %000_00_10AA = odd/even companion cog reads LUT address %1111111AA
      %000_00_11AA = odd/even companion cog writes LUT address %1111111AA
      %000_01_LLLL = hub lock %LLLL rises
      %000_10_LLLL = hub lock %LLLL falls
      %000_11_LLLL = hub lock %LLLL changes
      %001_PPPPPP = INA/INB bit of pin %PPPPPP rises (positive edge)
      %010_PPPPPP = INA/INB bit of pin %PPPPPP falls (negative edge)
      %011_PPPPPP = INA/INB bit of pin %PPPPPP changes (any edge)
      %10x_PPPPPP = INA/INB bit of pin %PPPPPP is low (level)
      %11x_PPPPPP = INA/INB bit of pin %PPPPPP is high (level)
    usage_example: |
      SETSE1  #%001_000010     ' Positive edge on pin 2 (9-bit: pin rises)
      SETSE1  #%010_000010     ' Negative edge on pin 2 (9-bit: pin falls)
      SETSE1  #%011_000010     ' Any edge on pin 2 (9-bit: pin changes)
      SETSE1  #%000_01_0101    ' Lock 5 rises
  
  - instruction: "SETSE2"
    encoding: "EEEE 1101011 00L DDDDDDDDD 000100001"
    description: "Configure selectable event 2"
    operation: "As SETSE1, for selectable event 2"
  
  - instruction: "SETSE3"
    encoding: "EEEE 1101011 00L DDDDDDDDD 000100010"
    description: "Configure selectable event 3"
  
  - instruction: "SETSE4"
    encoding: "EEEE 1101011 00L DDDDDDDDD 000100011"
    description: "Configure selectable event 4"
  
  - instruction: "POLLSE1"
    encoding: "EEEE 1101011 CZ0 000000100 000100100"
    description: "Get the SE1 event flag into C and/or Z, then clear it"
    operation: |
      C and/or Z := SE1 event flag (per WC / WZ / WCZ)
      The flag is then cleared, unless the event sensor is setting it again at
      that moment. SE1 is also cleared by WAITSE1/JSE1/JNSE1 and by SETSE1.
    flags_affected: "C and/or Z = SE1 event flag"
    timing: "2 clocks"
    usage_example: |
      POLLSE1 WC              ' Check SE1
      IF_C    JMP #event1_handler
  
  - instruction: "POLLSE2"
    encoding: "EEEE 1101011 CZ0 000000101 000100100"
    description: "Poll selectable event 2"
  
  - instruction: "POLLSE3"
    encoding: "EEEE 1101011 CZ0 000000110 000100100"
    description: "Poll selectable event 3"
  
  - instruction: "POLLSE4"
    encoding: "EEEE 1101011 CZ0 000000111 000100100"
    description: "Poll selectable event 4"
  
  - instruction: "WAITSE1"
    encoding: "EEEE 1101011 CZ0 000010100 000100100"
    description: "Wait for the SE1 event flag, then clear it"
    operation: |
      Wait until the SE1 event flag is set (it may already be), then clear it.
      A SETQ immediately before supplies a future CT target that ends the wait
      early; with WC, C is set if that timeout occurred before the event.
    timing: "2+ clocks (waits for the event)"
    usage_example: |
      WAITSE1                 ' Wait for event 1
      ' Event occurred, continue
  
  - instruction: "WAITSE2"
    encoding: "EEEE 1101011 CZ0 000010101 000100100"
    description: "Wait for selectable event 2"
  
  - instruction: "WAITSE3"
    encoding: "EEEE 1101011 CZ0 000010110 000100100"
    description: "Wait for selectable event 3"
  
  - instruction: "WAITSE4"
    encoding: "EEEE 1101011 CZ0 000010111 000100100"
    description: "Wait for selectable event 4"
  
  - instruction: "SETPAT"
    encoding: "EEEE 1011111 1LI DDDDDDDDD SSSSSSSSS"
    description: "Set the pin pattern that raises the PAT event (event 8)"
    source: >-
      Parallax Propeller 2 Documentation v35 (Rev B/C silicon), EVENTS, POLLPAT/WAITPAT event flag; encoding: Assembly Language (instruction encodings).
      Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, PROPELLER 2 ASSEMBLY LANGUAGE (PASM2) IN BRIEF, p.43.
      No-effect-flag fact: CP-040 (pnut-ts refuses SETPAT D,S WC; plain SETPAT assembles).
    operation: |
      D = mask, S = match value.
      C and Z are read as INPUTS at the moment SETPAT executes -- they are not
      effect flags: SETPAT takes no WC/WZ/WCZ effect. Set them first:
        C=0, Z=0  ->  event set whenever (INA & D) != S
        C=0, Z=1  ->  event set whenever (INA & D) == S
        C=1, Z=0  ->  event set whenever (INB & D) != S
        C=1, Z=1  ->  event set whenever (INB & D) == S
      SETPAT also clears the PAT event flag.
    usage_example: |
      CMP     mask, mask WCZ  ' C := 0 (watch INA), Z := 1 (fire on ==)
      SETPAT  mask, pattern   ' Set the pattern to detect

event_configurations:
  pin_edge_detection:
    note: "SETSEn takes a 9-bit D value: for pin edges, D[8:6] = %001 rises, %010 falls, %011 changes, and D[5:0] = the pin number"
    modes:
      - mode: "%001_PPPPPP"
        description: "Pin rises (positive edge)"
        behavior: "Event on low-to-high transition of pin PPPPPP"

      - mode: "%010_PPPPPP"
        description: "Pin falls (negative edge)"
        behavior: "Event on high-to-low transition of pin PPPPPP"

      - mode: "%011_PPPPPP"
        description: "Pin changes (any edge)"
        behavior: "Event on any transition of pin PPPPPP"

    setup_example: |
      ' Detect positive edge on pin 5
      SETSE1  #%001_000101     ' 9-bit: pin 5 rises
      WAITSE1                   ' Wait for positive edge

  pin_level_detection:
    modes:
      - mode: "%10x_PPPPPP"
        description: "Pin is low (level)"
        behavior: "Event while pin PPPPPP is low"

      - mode: "%11x_PPPPPP"
        description: "Pin is high (level)"
        behavior: "Event while pin PPPPPP is high"

    setup_example: |
      ' Wait for pin 3 to go high
      SETSE1  #%110_000011     ' 9-bit: pin 3 is high
      WAITSE1
  
  pattern_matching:
    description: "Match specific pin patterns: SETPAT sets the pattern, then WAITPAT waits for it"
    note: "SETPAT sets the pattern first, then WAITPAT waits for the match"

    setup_example: |
      ' Wait for INA[7:0] == $A5.
      ' C and Z are INPUTS to SETPAT: C picks INA(0)/INB(1), Z picks !=(0)/==(1).
      ' They are set before SETPAT -- SETPAT takes no WC/WZ effect.
      MOV     mask, #$FF
      MOV     pattern, #$A5
      CMP     mask, mask WCZ  ' C := 0 (INA), Z := 1 (fire on equality)
      SETPAT  mask, pattern
      WAITPAT                 ' Wait for (INA & mask) == pattern
  
  timer_events:
    description: "Events based on counter comparisons, established by ADDCT1..ADDCT3 and awaited with WAITCT1..WAITCT3"
    note: "The CT-passed-CTn event flag is set when CT passes the CTn target; ADDCTn clears it"

    setup_example: |
      ' Setup 1ms timer event
      GETCT   timeout
      ADDCT1  timeout, ##160_000  ' 1ms at 160MHz
      WAITCT1                     ' Wait for CT to pass CT1

programming_patterns:
  - pattern: "multi_event_monitor"
    description: "Monitor multiple events simultaneously"
    note: |
      SETSEn configures pin, LUT and hub lock events. Timer (CT), ATN, pattern and streamer
      events each have their own POLL/WAIT instructions.
      Each WAITSEn waits for its own selectable event (SETSEn / WAITSEn / POLLSEn are matched by n).
    code: |
      ' Set up four selectable events: three pin edges and a hub lock
      SETSE1  #%001_000001     ' Pin 1 rises (positive edge)
      SETSE2  #%010_000010     ' Pin 2 falls (negative edge)
      SETSE3  #%011_000011     ' Pin 3 changes (any edge)
      SETSE4  #%000_01_0000    ' Lock 0 rises

      ' Also configure timer for timeout
      GETCT   timeout
      ADDCT1  timeout, ##160_000

      event_loop
          POLLSE1 WC
          IF_C    CALL #handle_pin1

          POLLSE2 WC
          IF_C    CALL #handle_pin2

          POLLSE3 WC
          IF_C    CALL #handle_pin3

          POLLSE4 WC
          IF_C    CALL #handle_lock

          POLLCT1 WC            ' Poll the CT1 event
          IF_C    CALL #handle_timeout

          POLLATN WC            ' Poll the ATN event
          IF_C    CALL #handle_atn

          JMP     #event_loop
  
  - pattern: "event_driven_state_machine"
    description: "State machine triggered by events"
    code: |
      state_machine
          CMP     state, #STATE_IDLE WZ
          IF_Z    JMP #idle_state
          CMP     state, #STATE_ACTIVE WZ
          IF_Z    JMP #active_state
          CMP     state, #STATE_DONE WZ
          IF_Z    JMP #done_state

      idle_state
          SETSE1  #%001_000000     ' Pin 0 rises (start button positive edge)
          WAITSE1
          MOV     state, #STATE_ACTIVE
          JMP     #state_machine

      active_state
          ' Wait for CT to pass the CT1 target
          GETCT   timeout
          ADDCT1  timeout, ##16_000_000
          WAITCT1                   ' Wait for CT to pass CT1
          MOV     state, #STATE_DONE
          JMP     #state_machine

      done_state
          ' (the done-state handling is application code)
          MOV     state, #STATE_IDLE
          JMP     #state_machine

  - pattern: "pin_change_notification"
    description: "Respond to any pin change in a group"
    code: |
      ' Monitor pins 7:0 for any change
      MOV     last_state, INA
      AND     last_state, #$FF

      monitor_loop
          MOV     current, INA
          AND     current, #$FF
          CMP     current, last_state WZ      ' Z = 1 when no pin changed
          IF_NZ   CALL #pins_changed
          MOV     last_state, current
          JMP     #monitor_loop
  
  - pattern: "synchronized_sampling"
    description: "Sample multiple inputs on timer event"
    code: |
      ' Wait 100us (at 160 MHz) from the start of each pass, then sample
      sample_loop
          GETCT   next_sample
          ADDCT2  next_sample, ##16_000  ' 100us
          WAITCT2                        ' Wait for CT to pass CT2

          ' Read each port with one MOV
          MOV     sample1, INA           ' P31..P0
          MOV     sample2, INB           ' P63..P32

          ' Store samples
          WRLONG  sample1, ptr
          ADD     ptr, #4
          WRLONG  sample2, ptr
          ADD     ptr, #4

          JMP     #sample_loop

event_interrupt_mapping:
  configuration: |
    ' Map events to interrupts
    SETSE1  #event_config    ' Configure event
    SETINT1 #%0100           ' SE1 triggers INT1
    
    SETSE2  #event_config2
    SETINT2 #%0101           ' SE2 triggers INT2
    
    SETSE3  #event_config3
    SETINT3 #%0110           ' SE3 triggers INT3
  
  event_to_interrupt_codes:
    - code: "%0100"
      source: "SE1 event"
      interrupt: "Any (1/2/3)"
    
    - code: "%0101"
      source: "SE2 event"
      interrupt: "Any (1/2/3)"
    
    - code: "%0110"
      source: "SE3 event"
      interrupt: "Any (1/2/3)"
    
    - code: "%0111"
      source: "SE4 event"
      interrupt: "Any (1/2/3)"

usage_examples:
  - application: "button_debouncing"
    description: "Wait for a pin rising edge, then wait 10 ms at a 160 MHz clock"
    implementation: |
      ' Wait for button press with debounce
      SETSE1  #%001_000000 | BUTTON_PIN ' INA/INB bit of pin rises
      WAITSE1                            ' Wait for press
      WAITX   ##1_600_000               ' 10ms debounce
      TESTP   #BUTTON_PIN WC            ' C = pin is still high (pressed)
  
  - application: "pulse_measurement"
    description: "Read CT at a pin's rising edge and at its falling edge, then subtract the two CT reads"
    implementation: |
      ' Measure positive pulse width
      SETSE1  #%001_000000 | PULSE_PIN  ' INA/INB bit of pin rises
      WAITSE1
      GETCT   start_time
      SETSE1  #%010_000000 | PULSE_PIN  ' INA/INB bit of pin falls
      WAITSE1
      GETCT   end_time
      SUB     end_time, start_time      ' Pulse width
  
  - application: "protocol_timeout"
    description: "Poll a CT1 timeout and a pin rising edge in one loop"
    implementation: |
      ' Wait for response with timeout
      GETCT   timeout
      ADDCT1  timeout, ##16_000_000     ' 100ms timeout
      SETSE1  #%001_000000 | DATA_PIN   ' Data pin rises (positive edge)

      ' Race between timeout and data using polling loop
      POLLCT1 WC                       ' Check the CT1 timeout
      IF_C    JMP #timeout_handler
      POLLSE1 WC                        ' Check data pin event
      IF_C    JMP #data_received
      JMP     #$-4                      ' Keep checking

performance_characteristics:
  event_detection: |
    Each event flag is set by its event condition (see the set_by entries under
    the event flags) and is tested or cleared by its POLLxxx/WAITxxx/Jxxx/JNxxx
    instructions. Detection-to-flag clock count: Not documented.
  
  response_latency:
    polling: "POLLxxx: 2 clocks"
    waiting: "WAITxxx releases when the event occurs; no clock count is documented"
    interrupt: "Not documented as a clock count; the interrupt branch is a 'CALLD IRETx,IJMPx WCZ' inserted into the instruction pipeline"

  simultaneous_events: "Each cog can track up to four selectable events"
  
  overhead:
    configuration: "2 clocks per SETSEn instruction"
    monitoring: >-
      2 clocks per POLLSEn. A WAITSEn takes 2+ clocks and stalls the cog while its flag
      is not set.

limitations:
  - limitation: "four_selectable_events"
    description: "Each cog can track up to four selectable events (SE1..SE4)"

  - limitation: "event_flags"
    description: "Each event is tracked as a flag that is set when the event occurs and cleared by its POLL, WAIT, J or JN instruction, and for most events also by the instruction that sets the event up (event_clearing)"

  - limitation: "setse_limited_sources"
    description: "SETSEn configures pin, LUT, or hub lock events. CT events are established by ADDCT1..ADDCT3, the pattern event by SETPAT"

critical_distinction:
  title: "SETSE and SETINT Encodings"
  explanation: |
    Two separate encodings apply:

    1. SETSE D[8:0] - Configures what triggers a selectable event (SE1-4)
       - 9-bit encoding for pin edges and levels, LUT accesses, hub lock states
       - Example: SETSE1 #%001_000010 = pin 2 rises

    2. SETINT D[3:0] - Configures what triggers an interrupt (INT1-3)
       - 4-bit code selecting from 16 interrupt sources:
         0=off, 1=CT1, 2=CT2, 3=CT3, 4=SE1, 5=SE2, 6=SE3, 7=SE4,
         8=pattern, 9=FIFO, 10=streamer ready, 11=streamer done,
         12=NCO roll, 13=streamer reads LUT $1FF, 14=ATN, 15=CORDIC empty
       - Example: SETINT1 #4 = INT1 triggered by SE1 event

    Instructions that wait for or poll the other events:
    - Timer: WAITCT1, WAITCT2, WAITCT3, POLLCT1, POLLCT2, POLLCT3
    - ATN: WAITATN, POLLATN
    - Pattern: WAITPAT, POLLPAT

