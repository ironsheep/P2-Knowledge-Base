# P2 I/O Pin Timing
# Sources:
#   Parallax Propeller 2 Documentation v35 (Rev B/C silicon), I/O PIN TIMING
#     (DIRx/OUTx write latency, INx read latency, TESTP/TESTPN read latency),
#     SMART PINS (smart-pin IN flag reset and the IN bit's read state)
#   Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, FEATURES (drive modes),
#     SYSTEM CHARACTERISTICS (Absolute Maximum Electrical Ratings)

component_name: "I/O Pin Timing"

component_type: "pin_timing_specifications"

aliases:
  - "pin timing"
  - "latency"
  - "OUT to pin"
  - "output latency"
  - "how long from OUT to the pin changing"
  - "DIR change delay"
  - "pin read delay"
  - "input delay"
  - "input latency"
  - "INx read latency"
  - "TESTP latency"
  - "reading a driven pin"
  - "pin read state"
  - "smart pin IN flag reset"
  - "absolute maximum ratings"
  - "DC characteristics"
  - "input logic threshold"
  - "input leakage current"
  - "Vol Voh"
  - "max current per I/O pin"
  - "protection diode"
  - "slew rate"
  - "pin propagation delay"
  - "rise time fall time"
  - "cog OUT gated by its own DIR"
  - "two cogs driving the same pin"

description: |
  What this file carries: the clock-cycle latency between an instruction writing DIRx/OUTx
  and the pin actually moving, what an INx read or a TESTP/TESTPN read returns for a pin,
  the absolute maximum electrical ratings for an I/O pin, the protection-diode
  forward-current statements, the DC characteristics: the
  input logic threshold, input leakage, and the Vol/Voh output voltages at three
  load currents, and how a cog's OUT bit combines with its own DIR bit when two cogs
  address one pin.

  Two electrical tables sit here. ABSOLUTE MAXIMUM RATINGS are stress ratings: stresses
  in excess of them can cause permanent damage to the device. DC CHARACTERISTICS are
  given over the operating temperature range.

  Carried elsewhere or not documented:
    - Drive strength. It is a set of DRIVE MODES. The eight
      modes, their %HHH/%LLL encodings and their P_* constant names are defined once, in
      architecture/pin-drive-configuration.yaml.
    - Slew rate. Not documented: a slew-rate setting.
    - Not documented: propagation, rise and fall figures per drive setting.
source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, FEATURES (Smart I/O pins; drive modes), p.2, and SYSTEM CHARACTERISTICS (Absolute Maximum Electrical Ratings, DC Characteristics), pp.47-48"

instruction_to_pin_timing:
  description: |
    Clock-cycle timing between instruction execution and physical pin state.
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), I/O PIN TIMING, and SMART PINS (IN flag reset). Each of the four blocks below quotes its own statement."

  output_latency:
    description: |
      When an instruction changes a DIRx or OUTx bit, the processor needs three (3)
      additional system-clock cycles after the instruction before the pin starts to
      transition to its new state.
    clock_cycles: 3
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), I/O PIN TIMING -- \"When a DIRx/OUTx bit is changed by any instruction, it takes THREE additional clocks after the instruction before the pin starts transitioning to the new state.\""
    applies_to:
      - "DRVH, DRVL, DRVC, DRVNC, DRVZ, DRVNZ"
      - "OUTH, OUTL, OUTC, OUTNC, OUTZ, OUTNZ"
      - "DIRH, DIRL, DIRC, DIRNC, DIRZ, DIRNZ"
      - "Any instruction writing to OUTx or DIRx"
    example: |
      DRVH    #8              ' Changes the DIRx and OUTx bits for pin 8
      NOP
      NOP                     ' The pin starts transitioning three clocks after the DRVH instruction

  input_latency_inx_register:
    description: |
      When an instruction reads the contents of the IN register associated with a pin,
      the processor receives the state of the pins as they existed three (3) system-clock
      cycles before the start of the instruction.
    clock_cycles: 3
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), I/O PIN TIMING -- \"When an INx register is read by an instruction, it will reflect the state of the pins registered THREE clocks before the start of the instruction.\""
    data_age: "3 clocks old"
    applies_to:
      - "TESTB INA/INB, #pin"
      - "MOV dest, INA/INB"
      - "Any instruction reading INx registers"
    note: "This is older data than TESTP provides"

  input_latency_testp:
    description: |
      When a program uses a TESTP or TESTPN instruction to read the state of a pin,
      the processor receives the state of the pins as they existed two (2) system-clock
      cycles before the start of the instruction. TESTP/TESTPN gather "fresher" INx
      data than is available via the INx registers.
    clock_cycles: 2
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), I/O PIN TIMING -- \"When a TESTP/TESTPN instruction is used to read a pin, the value read will reflect the state of the pin registered TWO clocks before the start of the instruction. So, TESTP/TESTPN get fresher INx data than is available via the INx registers.\""
    data_age: "2 clocks old"
    applies_to:
      - "TESTP pin WC/WZ"
      - "TESTPN pin WC/WZ"
    advantage: "Fresher INx data than is available via the INx registers"

  reading_a_driven_pin:
    description: |
      For a pin the cog drives, IN returns the pin's read state, not the OUT bit.
      Read through an INx register, the value is the pin as registered three clocks
      before the start of the instruction; read with TESTP/TESTPN, it is the pin as
      registered two clocks before the start of the instruction. A smart pin's input
      selectors name the two apart: x000 selects this pin's read state and x100
      selects this pin's OUT bit from the cogs.
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PINS (\"the IN bit returns the pin's read state\"); Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, I/O PIN TIMING (INx register registered three clocks before the instruction; TESTP/TESTPN two clocks before), p.22; Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Pin Modes (%AAAA and %BBBB selectors: x000 this pin's read state, x100 this pin's OUT bit from cogs), p.23"
    outcome_of_the_two_reads:
      via_inx: "the pin as registered 3 clocks before the instruction"
      via_testp_testpn: "the pin as registered 2 clocks before the instruction"
    smart_pin_selectors:
      read_state: "x000 this pin's read state (default)"
      out_bit: "x100 this pin's OUT bit from cogs"

  smart_pin_in_flag_reset:
    description: |
      After a cog executes a WRPIN, WXPIN, WYPIN, RDPIN, or AKPIN instruction, the
      Smart Pin requires two (2) system-clock cycles to reset the IN flag to logic-0
      before a program can poll the flag again.
    clock_cycles: 2
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PINS -- \"After WRPIN/WXPIN/WYPIN/RDPIN/AKPIN, it will take two clocks for IN to drop, before it can be polled again.\""
    applies_to:
      - "WRPIN"
      - "WXPIN"
      - "WYPIN"
      - "RDPIN"
      - "AKPIN"
    required_pattern: |
      WRPIN   mode, #pin      ' Write to Smart Pin
      NOP                     ' NOP is 2 clocks: elapses the 2 clocks (or more)
      TESTP   #pin WC         ' IN can now be polled again
    note: "RQPIN does not acknowledge the smart pin, so it does not lower IN (read quiet)"

  timing_summary_table:
    output_dir_out_change: "3 clocks after instruction"
    input_via_inx: "3 clocks before instruction (older)"
    input_via_testp: "2 clocks before instruction (fresher)"
    smart_pin_flag_reset: "2 clocks after WRPIN/WXPIN/WYPIN/RDPIN/AKPIN"

cog_out_gated_by_own_dir:
  description: |
    On a pin with no smart pin mode, a cog's OUT bit is gated by that cog's own DIR
    bit. With one cog holding the pin's DIR high and OUT low, and another cog holding
    the pin's DIR low and OUT high, the pin reads low, whichever cog is which.
    Parallax's documents also give: DIR and OUT bits from all cogs are OR'd before
    going to the pins.
  source: "P2 hardware verification, EF-114 (one board, P0 with no smart pin mode, cog 0 and one worker cog, three PINREADs 100 us apart; cog 0 DIR 1 OUT 0 with the worker DIR 0 OUT 1 reads 0, and cog 0 DIR 0 OUT 1 with the worker DIR 1 OUT 0 reads 0; controls cog 0 alone and the worker alone each read their driven level; each cog's DIR and OUT bits read back as set). Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PINS (each smart pin OR's all incoming 34-bit buses from the cogs 'in the same way DIR and OUT bits are OR'd before going to the pins')"

absolute_maximum_ratings:
  description: |
    Stresses in excess of the absolute maximum ratings can cause permanent damage to the
    device. Functional operation of the device is not implied at these or any other
    conditions in excess of those given.
  source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Absolute Maximum Electrical Ratings (table and footnote 1), p.47. Every figure below matches that table. The table also states limits this file does not carry (ambient temperature under bias, storage temperature, total power dissipation 2.5 W, max current out of GND 4 A, max current into VDD pins and into Vxxyy pins 120 mA per pin); this file carries the I/O pin figures."
  voltage_on_VDD_vs_GND: "-0.3 V to +2.2 V"
  voltage_on_VIO_Vxxyy_vs_GND: "-0.3 V to +4.0 V"
  voltage_on_any_IO_pin_vs_GND: "-0.3 V to (Vxxyy + 0.3 V)"
  max_DC_current_into_input_pin_protection_diode_forward_biased: "+/-10 mA"
  max_current_per_IO_pin: "+/-30 mA"
  esd_HBM: "4 kV (JS-001)"
  esd_CDM: "1 kV (JS-002)"

dc_characteristics:
  description: |
    Input logic threshold, output voltage while sinking or sourcing current, and input
    leakage current, over the operating temperature range.
  source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, DC Characteristics (table), pp.47-48.
    Operating temperature range for the whole table:
    -40 degC to +105 degC unless otherwise noted. Typ column footnote:
    'Data in the Typical \"Typ\" column is T = 25 degC unless otherwise stated'. ac_characteristics (AC Characteristics table, Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, AC Characteristics, p.48)."

  operating_temperature_range: "-40 degC to +105 degC unless otherwise noted"

  supplies:
    core_supply_voltage_Vdd:
      min: "1.7 V"
      typ: "1.8 V"
      max: "1.9 V"
    io_supply_voltage_Vxxyy:
      min: "3.15 V"
      typ: "3.3 V"
      max: "3.45 V"
      note: "Vxxyy is the per-group I/O supply; see architecture/pin-power-domains.yaml"

  input_logic_threshold_Vih:
    parameter: "Input Logic Threshold"
    min: "Vxxyy * 0.3"
    typ: "Vxxyy * 0.5"
    max: "Vxxyy * 0.7"
    units: "V"
    what_this_means: |
      The threshold is given as a fraction of the I/O supply Vxxyy, as one threshold
      rather than a VIL/VIH pair.
    not_stated_by_any_source: |
      Not documented: separate VIL / VIH figures, Schmitt-trigger switching
      thresholds, and hysteresis in millivolts. The P2 has Schmitt input modes
      (P_SCHMITT_A and its variants, defined in
      language/spin2/symbols/spin2-builtin-symbols-complete.yaml); the hysteresis
      they produce is not documented.

  input_leakage_current_Iil:
    parameter: "Input Leakage Current"
    conditions: "IO pin Vin = GND or Vio"
    typ: "+/-0.1 uA"
    max: "+/-10 uA"

  output_low_voltage_Vol:
    parameter: "Output Low Voltage (relative to GND)"
    conditions_note: "VDD = 3.3 V"
    sinking_1mA: "15 mV"
    sinking_10mA: "160 mV"
    sinking_30mA: "510 mV"

  output_high_voltage_Voh:
    parameter: "Output High Voltage (relative to Vxxyy)"
    conditions_note: "VDD = 3.3 V. Values are relative to Vxxyy."
    sourcing_1mA: "-6 mV"
    sourcing_10mA: "-170 mV"
    sourcing_30mA: "-580 mV"

  quiescent_current:
    Iq_Vdd:
      conditions: "RESn = TEST = P0..P64 = 0V, Vxxyy = 3.3V, VDD = 1.8V"
      typ: "40 uA"
    Iq_Vxxyy:
      conditions: "RESn = TEST = P0..P64 = 0V, Vxxyy = 3.3V, VDD = 1.8V"
      typ: "0.5 uA"

  output_current_range: |
    Vol and Voh are given at 1 mA, 10 mA and 30 mA.

  ac_characteristics: |
    Oscillator frequency ranges and XI/XO pin capacitance are given. Not documented: pin propagation, rise or fall figures. The PLL
    row is 3.33 MHz min / 180 MHz typ / 320 MHz max, with the note that 180 MHz is
    nominal at up to 105 degC.

input_voltage_and_protection:
  source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Absolute Maximum Electrical Ratings, p.47, and DC Characteristics, pp.47-48"
  description: |
    Max DC current into an input pin with internal protection diode forward biased: +/-10 mA.
    I/O pin voltages in respect to GND may be exceeded if the internal protection diode
    forward bias current is not exceeded.
  io_supply: "Vxxyy (VIO) = 3.3 V typical (3.15-3.45 V)"
  protection_diode_details: "Not documented: the protection diode's connection and its forward voltage."
  five_volt_inputs: "Not documented: 5 V signals on an I/O pin."

timing_measurement_techniques:
  using_counters: |
    ' Count system clocks from DRVH on pin 0 until pin 1 reads high (pin 0 wired to pin 1)
    FLTL    #0                          ' Pin 0: float, OUT low
    DIRL    #1                          ' Pin 1: plain input
    DIRH    #0                          ' Enable pin 0 output
    
    GETCT   start_time                  ' Timestamp before the edge
    DRVH    #0                          ' Drive pin 0 high
    wait_hi TESTP   #1          WC       ' Sample pin 1 input
      if_nc JMP     #wait_hi             ' Loop until pin 1 sees the high
    GETCT   end_time                    ' Timestamp after
    SUB     end_time, start_time        ' Delay in clocks
  
  using_smart_pins: |
    ' Time the high states of the A input of pin 0 with a smart pin (pin 0 carries the input signal)
    WRPIN   ##P_HIGH_TICKS, #0          ' Pin 0: time A-input high states
    DIRH    #0                          ' DIR = 1 releases reset
    wait_hi TESTP   #0          WC      ' IN is raised on each high-to-low transition
      if_nc JMP     #wait_hi            ' Loop until IN is high
    RDPIN   width, #0                   ' Read the previous high duration count, in clocks

