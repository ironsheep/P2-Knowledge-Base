description: |
  The streamer's Pins => DACs/WRFAST modes read 1, 2, 4, 8, 16 or 32 pins from
  {INB, INA}, initially and on each subsequent NCO rollover. With the %w bit in D[23]
  high, WFBYTE/WFWORD/WFLONG operations record the pin data into hub RAM.

  The streamer reads the cog's IN registers. For a pin in a smart-pin mode, IN is
  that smart pin's event flag. For a pin in a non-smart-pin mode, the resultant 'A'
  drives IN. A pin with smart-pin mode off whose %AAAA input selector names a
  neighbouring pin's read state therefore carries that neighbour's read state on IN,
  and a capture that names the pin records the neighbour's waveform.

source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), STREAMER (Pins => DACs/WRFAST, the mode table templates, the %w sentence, the WRFAST sentence) and SMART PINS (the IN-signal handshake, the WRPIN D operand fields %AAAA, %BBBB, %FFF, %SSSSS, and the digital filter settings); Parallax Propeller 2 Spin2 Language Documentation v55, Graphical DEBUG Displays (the LOGIC display and its 333 Mbaud capture example) and the P_PLUS1_A..P_MINUS1_A symbols; EF-095, EF-105, EF-065, EF-062, EF-057, XF-003"

in_signal_on_a_smart_pin:
  headline: "On a pin in a smart-pin mode, IN is the smart pin's event flag; the streamer's capture path reads IN."
  streamer_read: >-
    "Initially, and on each subsequent NCO rollover, 1/2/4/8/16/32 pins are read from
    {INB, INA} and X3, X2, X1, and X0 are updated using the read data."
  in_on_a_smart_pin: >-
    "When a mode-related event occurs in a smart pin, it raises its IN signal to alert
    the cog(s) that new data is ready, new data can be loaded, or some process has
    finished." A WRPIN, WXPIN, WYPIN, RDPIN or AKPIN on that pin lowers it.
  in_otherwise: >-
    "The resultant 'A' will drive the IN signal in non-smart-pin modes." %SSSSS =
    %00000 is smart pin off (the default). The 'A' is chosen by %AAAA and shaped by
    %FFF.
  lane_contents_in_a_capture: "In a capture with a smart pin on one lane and a neighbour routed through %AAAA on another, the smart pin's lane carries one edge (its completion flag) and the routed neighbour's lane carries the waveform (4-, 8- and 16-pin modes)."
  external_driver: "In an external project's driver, the MISO smart pin is disabled before every streamer read, and an instrument on SCK counted \"transitions complete\" flags instead of clock edges."
  rule_home: "architecture/smart_pins.yaml in_signal_semantics carries the IN rule with both halves."
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), STREAMER, Pins => DACs/WRFAST; SMART PINS (the IN-signal handshake) and the WRPIN D operand (%FFF, the resultant 'A'); EF-095; XF-003"

neighbour_capture_composition:
  configuration:
    smart_pin_mode_field: "%SSSSS = %00000 (smart pin off, the default)"
    a_input_selector_field: "%AAAA, D[31:28] of the WRPIN D operand"
    a_input_values: "0xxx true, 1xxx inverted; x000 this pin's read state (default); x001, x010, x011 relative +1, +2, +3 pin's read state; x100 this pin's OUT bit from cogs; x101, x110, x111 relative -3, -2, -1 pin's read state"
    b_input_selector_field: "%BBBB, D[27:24], with the same values as %AAAA"
    input_logic_field: "%FFF, D[23:21], applied after the A and B selectors: 000 = A, B (default); 001 = A AND B, B; 010 = A OR B, B; 011 = A XOR B, B; 100..111 = A, B both filtered using global filt0..filt3 settings"
    dir_with_smart_pin_off: "With the smart pin off, DIR enables the pin's output."
    offsets_are_relative_to_the_configured_pin: "A pin at bus_pin+1 that selects relative -1 reads the bus pin; a pin at bus_pin-2 that selects relative +2 reads the bus pin."
    constant_for_relative_minus_1: "P_MINUS1_A"
    constant_for_relative_minus_2: "P_MINUS2_A"
    constant_for_relative_minus_3: "P_MINUS3_A"
    constant_for_relative_plus_1: "P_PLUS1_A"
    constant_for_relative_plus_2: "P_PLUS2_A"
    constant_for_relative_plus_3: "P_PLUS3_A"
    encoding_and_definitions: "the %AAAA/%BBBB encoding table is in
      language/pasm2/wrpin.yaml input_selectors and architecture/smart_pins.yaml
      input_routing; each constant's own definition is in
      language/spin2/symbols/spin2-builtin-symbols-complete.yaml."
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PINS (the WRPIN D operand: %AAAA, %BBBB, %FFF and %SSSSS definitions, and the smart pin off DIR statement); Parallax Propeller 2 Spin2 Language Documentation v55, the P_PLUS1_A..P_MINUS1_A symbols"
  capture_command:
    wrfast_first: "For WRFAST modes a WRFAST is done beforehand \"to ensure that the hub RAM FIFO is ready to receive data\"."
    streamer_mode: "A mode of the Pins => DACs/WRFAST block with %w high in D[23]."
    lane_order: "In the 4-, 8- and 16-pin modes, lane N is pin base + N."
    example_in_this_arrangement: "Stimulus pin P32 observed through P33 with A = relative -1 and through P34 with A = relative -2, in a capture with base P32."
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), STREAMER (the WRFAST sentence and the mode table); EF-095"
  multi_channel_layout:
    pin_count_per_mode: "A capture mode reads 1, 2, 4, 8, 16 or 32 pins from {INB, INA}; each pin's IN carries one pin's read state."
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), STREAMER, Pins => DACs/WRFAST"
  filtering_note:
    placement: "%FFF applies input logic and optional global filtering after the A and B selectors; the resultant 'A' drives IN in non-smart-pin modes. %FFF = %000 passes A and B unfiltered."
    filter_settings: "Each global filter has a length of 2, 3, 5 or 8 flipflops (values 0..3) and a timing tap that is one of the lower 32 bits of CT (values 0..31). The flipflops shift pin state at the timing tap rate, and the filter output changes when they are unanimously high or low. The filter is reflected in the INA/INB bits if no smart pin mode is selected. The lengths and taps are in architecture/smart_pins.yaml input_routing.global_digital_filters."
    lane_delay: "capture_behaviour.filter_delay gives the delay of a filtered lane against an unfiltered lane."
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), Configuring the Digital Filters for Smart Pins and the WRPIN D operand (%FFF)"

alternative_smart_pin_off:
  statement: "With a pin's smart-pin mode off (%SSSSS = %00000) and %AAAA at x000 (this pin's read state, the default), the resultant 'A' drives that pin's IN, and the streamer command can name the pin directly."
  external_driver: "In an external project's driver, the smart pin on the MISO pin is disabled before every streamer read."
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), SMART PINS (the WRPIN D operand: %AAAA values, the resultant 'A' drives IN in non-smart-pin modes); EF-095; XF-003"

serial_333mbaud_capture:
  what_it_is: "A smart pin transmitting 8-N-1 serial at 333 Mbaud, captured by the streamer through a non-smart neighbour pin and shown in a DEBUG LOGIC window."
  capture_description: "On every clock, the streamer records the smart pin's IN signal and its output state, as read from an adjacent pin. Four two-bit sample sets are saved to hub RAM by one byte write, forming contiguous bytes, words, and longs. The LONGS_2BIT packed-data mode of LOGIC unpacks the two-bit sample sets from longs, yielding 16 sets per long."
  lanes: "Two channels: the smart pin's IN signal (its completion flag) and the adjacent pin's read state (the waveform)."
  setup_values:
    clkfreq: "_clkfreq = 333_333_333"
    rxpin: "rxpin = 24, the non-smart pin; its A input is selected from relative +1 (wrpin ##+1<<28,#rxpin)"
    txpin: "txpin = rxpin+1, async serial transmit (wrpin #%01_11110_0,#txpin; wxpin ##1<<16+8-1,#txpin sets baud = sysclock/1 and size 8; dirh #txpin)"
    capture_mode: "xmode = $D0800000 + rxpin << 17 + samps: D[31:28] = %1101, D[23] = 1, D[19:16] = %0000 (the 2-pin -> 2-DAC1 + 1/4 WFBYTE template, %pp0a), with the sample count in D[15:0]"
    buffer: "wrfast #0,buffaddr before xinit ##xmode,#0; waitxfi after wypin i,#txpin"
    debug: "debug(`logic Serial samples `(samps) spacing 12 'TX' 'IN' longs_2bit)"
  write_operation: "In the 1/2/4-pin modes a WFBYTE is done each time 8 bits of pin data accrue. Parallax's documents also give RFBYTE as the operation that saves each set of four two-bit samples to hub RAM in this capture."
  source: "Parallax Propeller 2 Spin2 Language Documentation v55, Graphical DEBUG Displays, LOGIC Display (the 333 Mbaud capture example); Parallax Propeller 2 Documentation v35 (Rev B/C silicon), STREAMER (the 2-pin mode table rows and the accrual sentence)"

what_the_capture_path_writes:
  one_home: "architecture/streamer/pin-selection.yaml enable_control.input_modes carries the read source, the widths, the WFBYTE/WFWORD/WFLONG rule, the accrual rule, the bit order and the WRFAST prerequisite."
  bit_packing: "In the 4-pin mode, samples are packed low nibble first."
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), STREAMER, Pins => DACs/WRFAST; EF-095"

base_pin:
  encoding_home: "architecture/streamer/pin-selection.yaml sub_pin_selection and pin_base_encoding carry the base-pin fields, the per-width templates and the composition of the base."
  alignment: "architecture/streamer/pin-selection.yaml pin_base_encoding.alignment_rule carries the base-alignment statement for every width."
  capture_templates:
    pin_1: "%pppa (1-pin -> 1-DAC1)"
    pin_2: "%pp0a (2-pin -> 2-DAC1) and %pp1a (2-pin -> 1-DAC2)"
    pin_4: "%p00a (4-pin -> 4-DAC1), %p01a (4-pin -> 2-DAC2) and %p10a (4-pin -> 1-DAC4)"
    pin_8: "D[19:16] = %0110, %0111 or %1110"
    pin_16: "D[19:16] = %1111 with D[31:28] = %1110, or %0000 with D[31:28] = %1111"
    pin_32: "D[19:16] = %0001 with D[31:28] = %1111"
  base_reads: "2-pin captures at each base in P32..P46 (pairs 0 to 7) and 4-pin captures at the bases P32, P36, P40 and P44 (groups 0 to 3) read the pins their base names (static levels, NCO 1:16)."
  composition_with_plus_and_or:
    x_imm_4x8_1dac8: "X_IMM_4X8_1DAC8 + X_PINS_ON + 20<<17 assembles to $60B6_FFFF where base 16 assembles to $60AE_FFFF: D[19:16] becomes %0110 (X_IMM_4X8_4DAC2) and D[22:20] becomes %011, and the silicon drove P24..P31 where the base 16 control drove P16..P23. The same expression composed with `|` assembles to the word of base 16. Both forms assemble."
    adc_capture_family: "The ADC capture mode X_1ADC8_0P_1DAC8_WFBYTE has no pin field and shows the same carry from adc_pin<<17 into D[19:16]: architecture/streamer/modes-reference.yaml field_notation_caveat_second_proof."
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), STREAMER (the mode table templates; \"For modes which involve less than 8 pins, lower-order %p bit(s) in D[19:19..17] are used to further resolve the pin number(s)\"); EF-105; EF-065; EF-059"

dir_and_the_output_path:
  output_path: "In an output mode D[23] is %e. The streamer's pin data is OR'd with {OUTB, OUTA}, and a streamer pin output drives once DIR is raised."
  capture_path: "In a capture mode D[23] is %w."
  home: "architecture/streamer/pin-selection.yaml enable_control.output_modes.dir_is_still_required carries the DIR result and its test."
  source: "EF-062; Parallax Propeller 2 Documentation v35 (Rev B/C silicon), STREAMER (the %e and %w sentences)"

measurement_hygiene:
  debug_interrupt: "DEBUG_COGS defaults to %11111111: bits 7..0 enable debugging interrupts in cogs 7..0. Compiling with -d therefore puts the debug interrupt inside the cog running the streamer."
  setting: "DEBUG_COGS = %0000_0001 sets bit 0 and enables the debug interrupt in cog 0."
  effect: "With the default mask, in a program compiled with -d whose launched cog ran a DDS/Goertzel command, the Goertzel accumulators read 1,000,000 to 7,000,000 where the same program with DEBUG_COGS = %0000_0001 read values in the hundreds."
  detail_home: "architecture/streamer/overview.yaml debug_interaction carries the CON snippet."
  source: "EF-057; Parallax Propeller 2 Spin2 Language Documentation v55, DEBUG (the DEBUG_COGS row of the debug symbols table)"

displaying_a_capture:
  debug_logic_window: "LOGIC is a logic analyzer with single and multi-bit labels and 1..32 channels that can trigger on a pattern. TRIGGER mask match sample_offset triggers on (data & mask) = match, and HOLDOFF sets the minimum number of samples required from trigger to trigger. Numerical data is applied LSB-first to the channels. The packed-data mode LONGS_2BIT unpacks two-bit sample sets from longs."
  detail_home: "language/spin2/debug-displays/logic.yaml"
  source: "Parallax Propeller 2 Spin2 Language Documentation v55, Graphical DEBUG Displays, LOGIC Display"

capture_behaviour:
  scope: "Tested configuration: base P32 (group %100), pins P32..P47, one stimulus pin with one transition every 64 clocks, monitor pins routed with A = relative -1 and A = relative -2, 1024-sample captures, one hub pattern, and the hub used by this cog only."
  in_signal_contrast: "A plain pin whose A input is routed from a neighbour carries that neighbour's level, and a pin running a smart-pin mode presents the smart pin's completion flag on its own lane."
  streamer_capture_into_hub_ram: >-
    Streamer digital capture into hub RAM (Pins => DACs/WRFAST) in the 4-, 8- and 16-pin
    modes captures static patterns exactly (lane N is pin base + N; 4-pin samples are
    packed low nibble first); a smart pin's own lane carries one edge (its completion
    flag) while a routed neighbour carries the waveform.
  sustained_sample_rate: >-
    One sample per clock is sustained in the 4-, 8- and 16-pin modes: 1024-sample
    captures with the NCO rolling over every clock (and at 1:2, 1:4, 1:8, 1:16) are
    exact, with every byte written.
  filter_delay: >-
    With the filter timing tap at 0 (every clock), a %FFF filter of N flipflops delays
    its lane by N + 1 clocks against an unfiltered lane: 2, 3, 5 and 8 flipflops give 3,
    4, 6 and 9 clocks, rising and falling edges alike (unfiltered lanes: 0 clocks). With 5
    flipflops at tap 3 (every 8th clock) the delay is 37 clocks.
  source: "EF-095 (4-, 8- and 16-pin modes; the lane order, packing, flag-versus-waveform, sustained-rate and filter-delay results); EF-105"

not_documented:
  sustained_sample_rate_32_pin: "Not documented: a sustained sample rate for the 32-pin capture mode."

