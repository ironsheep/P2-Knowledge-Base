# Streamer Pin Capture -- recording digital pin state into hub RAM
#
# The composed answer to "can I watch a bus my smart pins are already running?"
# It is composed rather than quoted: the parts live in smart_pins.yaml (what IN
# means), pin-selection.yaml (what the capture path reads and writes), and
# pasm2/wrpin.yaml (the %AAAA input selector). This file is the one place they
# are put together, because the two central facts are only dangerous apart.
#
# NOT a definition home for any constant. Per-constant definitions live in
# language/spin2/symbols/spin2-builtin-symbols-complete.yaml (the P_* names) and
# language/spin2/symbols/streamer-symbols.yaml (the X_* names). This file names a
# constant only as a VALUE or in prose, never as a defining key, so there is
# exactly one place in the knowledge base where each name is defined.

