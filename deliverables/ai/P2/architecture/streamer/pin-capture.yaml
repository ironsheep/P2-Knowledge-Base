# Streamer Pin Capture -- recording digital pin state into hub RAM
#
# Composes three homes: smart_pins.yaml (what a pin's IN signal carries),
# pin-selection.yaml (the capture path and the pin-base fields) and
# pasm2/wrpin.yaml (the %AAAA input selector). This file puts them side by side
# for a capture of a bus whose pins run smart-pin modes.
#
# Per-constant definitions are in
# language/spin2/symbols/spin2-builtin-symbols-complete.yaml (the P_* names) and
# language/spin2/symbols/streamer-symbols.yaml (the X_* names). Constants appear
# here as values and in prose.

