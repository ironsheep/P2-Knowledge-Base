    d_19_16: "%0100"
    d_22_20: "--- (no pin field)"
    s_operand: "s- (channel pair in S[1])"
    pins: "16 in"
    dac_lanes: "%00000000_00000000_ponmlkji_hgfedcba"

  - mode: "%1111"
    symbol: X_2ADC8_16P_4DAC8_WFLONG
    description: "2-ADC8 + 16 pins → 4 DAC ch × 8 bits + WFLONG"
    d_19_16: "%0101"
    d_22_20: "%ppp"
    s_operand: "s- (channel pair in S[1])"
    pins: "32 in"
    dac_lanes: "%PONMLKJI_HGFEDCBA_ponmlkji_hgfedcba"

  - mode: "%1111"
    symbol: X_4ADC8_0P_4DAC8_WFLONG
    description: "4-ADC8 → 4 DAC ch × 8 bits + WFLONG"
    d_19_16: "%0110"
    d_22_20: "--- (no pin field)"
    s_operand: "-- (all four channels)"
    pins: "32 in"
    dac_lanes: "%PONMLKJI_HGFEDCBA_ponmlkji_hgfedcba"

  # DDS/Goertzel
  - mode: "%1111"
    symbol: X_DDS_GOERTZEL_SINC1
    description: "DDS/Goertzel LUT SINC1 (D[23] = 0)"
    d_19_16: "%p111"
    s_operand: "<config>"
    pins: "4 in ADC"
    dac_lanes: "%PONMLKJI_HGFEDCBA_ponmlkji_hgfedcba"
    details: architecture/streamer/dds-goertzel.yaml

  - mode: "%1111"
    symbol: X_DDS_GOERTZEL_SINC2
    description: "DDS/Goertzel LUT SINC2 (D[23] = 1)"
    d_19_16: "%p111"
    s_operand: "<config>"
    pins: "4 in ADC"
    dac_lanes: "%PONMLKJI_HGFEDCBA_ponmlkji_hgfedcba"
    details: architecture/streamer/dds-goertzel.yaml

sources:
  - >-
    modes: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), STREAMER (the D/#[31:16] mode
    table: mode nibble, D[19:16], S/#, description, pins and the DAC Channels $X3_X2_X1_X0 column,
    row by row); symbol names: Parallax Propeller 2 Spin2 Language Documentation v55, Built-In
    Symbols for Streamer Modes.

# RDFAST → RGB → Pins/DACs: how pixels become X3..X0
rgb_modes:
  output: >-
    RFBYTE/RFWORD/RFLONG operations, done initially and on each subsequent NCO
    rollover, read 8/16/32-bit pixel values from hub RAM. The pixel values
    P[31/15/7:0] are translated into {R[7:0], G[7:0], B[7:0], 8'b0} values and output
    to X3, X2, X1, and X0.
  luma8:
    rule: "LUMA8 mode uses three bits in S[2:0] as colors and the 8-bit pixels as luminance values."
    colors:
      - {s_2_0: "%000", color: "Orange", x3: "P[7:0]", x2: "%0, P[7:1]", x1: "$00", x0: "$00"}
      - {s_2_0: "%001", color: "Blue", x3: "$00", x2: "$00", x1: "P[7:0]", x0: "$00"}
      - {s_2_0: "%010", color: "Green", x3: "$00", x2: "P[7:0]", x1: "$00", x0: "$00"}
      - {s_2_0: "%011", color: "Cyan", x3: "$00", x2: "P[7:0]", x1: "P[7:0]", x0: "$00"}
      - {s_2_0: "%100", color: "Red", x3: "P[7:0]", x2: "$00", x1: "$00", x0: "$00"}
      - {s_2_0: "%101", color: "Magenta", x3: "P[7:0]", x2: "$00", x1: "P[7:0]", x0: "$00"}
      - {s_2_0: "%110", color: "Yellow", x3: "P[7:0]", x2: "P[7:0]", x1: "$00", x0: "$00"}
      - {s_2_0: "%111", color: "White", x3: "P[7:0]", x2: "P[7:0]", x1: "P[7:0]", x0: "$00"}
  rgbi8:
    rule: "RGBI8 mode uses the top three bits of the 8-bit pixel values as colors and the bottom 5 bits as luminance values."
    colors:
      - {p_7_5: "%000", color: "Orange", x3: "P[4,3,2,1,0,4,3,2]", x2: "%0, P[4,3,2,1,0,4,3]", x1: "$00", x0: "$00"}
      - {p_7_5: "%001", color: "Blue", x3: "$00", x2: "$00", x1: "P[4,3,2,1,0,4,3,2]", x0: "$00"}
      - {p_7_5: "%010", color: "Green", x3: "$00", x2: "P[4,3,2,1,0,4,3,2]", x1: "$00", x0: "$00"}
      - {p_7_5: "%011", color: "Cyan", x3: "$00", x2: "P[4,3,2,1,0,4,3,2]", x1: "P[4,3,2,1,0,4,3,2]", x0: "$00"}
      - {p_7_5: "%100", color: "Red", x3: "P[4,3,2,1,0,4,3,2]", x2: "$00", x1: "$00", x0: "$00"}
      - {p_7_5: "%101", color: "Magenta", x3: "P[4,3,2,1,0,4,3,2]", x2: "$00", x1: "P[4,3,2,1,0,4,3,2]", x0: "$00"}
      - {p_7_5: "%110", color: "Yellow", x3: "P[4,3,2,1,0,4,3,2]", x2: "P[4,3,2,1,0,4,3,2]", x1: "$00", x0: "$00"}
      - {p_7_5: "%111", color: "White", x3: "P[4,3,2,1,0,4,3,2]", x2: "P[4,3,2,1,0,4,3,2]", x1: "P[4,3,2,1,0,4,3,2]", x0: "$00"}
  rgb8:
    rule: "RGB8 mode uses the top three bits of the 8-bit pixel values for red, the next three for green, and the last two for blue."
    lanes: {x3: "P[7,6,5,7,6,5,7,6]", x2: "P[4,3,2,4,3,2,4,3]", x1: "P[1,0,1,0,1,0,1,0]", x0: "$00"}
  rgb16:
    rule: "RGB16 mode uses the top five bits of the 16-bit pixel values for red, the next six for green, and the last five for blue."
    lanes: {x3: "P[15:11], P[15:13]", x2: "P[10:5], P[10:9]", x1: "P[4:0], P[4:2]", x0: "$00"}
  rgb24:
    rule: "RGB24 mode uses the top three bytes of the 32-bit pixel values for red, green, and blue."
    lanes: {x3: "P[31:24]", x2: "P[23:16]", x1: "P[15:8]", x0: "$00"}
  converter: "The cog's colorspace converter, which acts on the DAC channels, is in architecture/streamer/colorspace-and-dvi.yaml."
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), STREAMER, RDFAST -> RGB -> Pins/DACs (the translation paragraph and Tables 14, 15, 16, 17 and 18)"

# ADCs/Pins → DACs/WRFAST
adc_modes:
  what_is_captured: "These modes capture SCOPE channel data, along with optional pin data from {INB, INA}."
  prerequisite: >-
    The SETSCP instruction is used beforehand to select the block of four pins which
    feed the four 8-bit SCOPE channels. Any pins, within that block of four, that are
    used as the ADC8 input(s) for this mode must be put into "ADC sample" or "ADC
    scope" smart pin mode and enabled.
  channel_select:
    one_adc8: "For the 1-ADC8 modes, where one of four SCOPE channels is captured, the %ss bits in S[1:0] select the channel."
    two_adc8: "For the 2-ADC8 modes, where two of four SCOPE channels are captured, the %s bit in S[1] selects the upper two or lower two channels."
    four_adc8: "For the 4-ADC8 mode, all four SCOPE channels are captured."
  word_layout: >-
    For modes which also capture pin data, the lower 8 or 16 pins of the 32 pins
    selected by the %ppp bits in D[22:20] are captured and placed into the lower half
    of the word/long, while the one or two SCOPE channels are placed into the upper half.
  no_pin_field: >-
    In the three modes without pin data (1-ADC8, 2-ADC8 and 4-ADC8 alone) the mode
    table marks D[22:20] ---. Parallax's documents
    also give them as 000 in these modes' symbol templates (%1111_DDDD_W000_0010,
    %1111_DDDD_W000_0100, %1111_DDDD_W000_0110).
  update: >-
    Initially, and on each subsequent NCO rollover, SCOPE channel data and optional
    pin data are read and X3, X2, X1, and X0 are updated. If the %w bit in D[23] is
    high, WFBYTE/WFWORD/WFLONG operations are done automatically to record the ADC and
    optional pin data.
  related:
    - language/pasm2/setscp.yaml
    - architecture/smart-pins/smart-pin-11000-adc-internal-clock.yaml
    - architecture/smart-pins/smart-pin-11001-adc-external-clock.yaml
    - architecture/smart-pins/smart-pin-11010-adc-scope-trigger.yaml
  source: >-
    Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), STREAMER, ADCs/Pins -> DACs/WRFAST
    (every paragraph) and the mode table's ADC rows (w--- in D[23:20]);
    Parallax Propeller 2 Spin2 Language Documentation v55, Built-In Symbols for Streamer Modes
    (X_1ADC8_0P_1DAC8_WFBYTE, X_2ADC8_0P_2DAC8_WFWORD, X_4ADC8_0P_4DAC8_WFLONG templates).

