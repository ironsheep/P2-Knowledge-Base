# Streamer Modes Reference
# The streamer mode table: D[31:28], D[19:16], the S operand, the pins and the
# DAC-channel layout of every mode, with the data rules of each mode group

component: streamer_modes
description: The streamer mode encodings (D[31:28] and D[19:16]), each mode's S operand, pins and DAC-channel layout, and the data rules of each mode group

aliases:
  - "streamer modes"
  - "streamer mode table"
  - "streamer encoding"
  - "XINIT mode"
  - "XZERO mode"
  - "XCONT mode"
  - "streamer command word"
  - "capture modes"
  - "WFBYTE modes"

# Mode field location
encoding:
  mode_field: "D[31:28]"
  config_field: "D[19:16]"

  # How to read the d_19_16 column. Every symbol below is one bit of D[19:16],
  # written MSB-first.
  field_notation:
    "0 / 1": "a fixed bit, set by the mode template."
    "p": >-
      a pin-select bit, part of the base-pin number ("For modes which involve less
      than 8 pins, lower-order %p bit(s) in D[19:19..17] are used to further resolve
      the pin number(s)"). The templates show %pppa in the 1-pin modes, %pp0a and %pp1a
      in the 2-pin modes, %p00a, %p01a and %p10a in the 4-pin modes; the 8-pin and wider
      modes carry only 0 and 1 bits in D[19:16].
    "a": >-
      the alternate-bit-order flag, D[16]: modes which shift data use bits
      bottom-first by default, and some of these modes have the %a bit in D[16] to
      reorder the data sequence within the individual bytes to top-first when %a = 1.
    "b": "a LUT base-address bit: %bbbb in D[19:16] of the Immediate -> LUT modes gives the LUT base address %bbbb00000 (the RDFAST -> LUT modes take %bbbb from S[3:0])."
  field_notation_caveat: >-
    In X_IMM_4X8_1DAC8 (template %1110), `+ 20<<17` carries bit 19 into D[19:16] and
    changes the mode, and selects the P24..P31 group. With `| 20<<17` the word is
    byte-identical to the one for base 16. Both forms assemble.
  field_notation_caveat_second_proof: >-
    The same carry occurs in the ADC modes. In X_1ADC8_0P_1DAC8_WFBYTE (template
    %1111_DDDD_W000_0010) there is no pin field, and the ADC channel is selected by
    S[1:0], so an `adc_pin<<17` term lands inside D[19:16]. Added with `+`, adc_pin 1
    gives D[19:16] = %0100 (X_2ADC8_0P_2DAC8_WFWORD) and adc_pin 2 gives %0110
    (X_4ADC8_0P_4DAC8_WFLONG), modes that write 2 and 4 bytes per NCO rollover
    instead of 1. The capture still fills its buffer, with data of the wrong shape.
  source: >-
    Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), STREAMER (the mode table, the sub-8-pin
    %p sentence and the %a sentence); Parallax Propeller 2 Spin2 Language Documentation v55, Built-In
    Symbols for Streamer Modes (the per-mode templates). field_notation_caveat: EF-065.
    field_notation_caveat_second_proof: EF-059.

# Mode categories by D[31:28], with each group's data rule
categories:
  immediate_lut:
    range: "%0000-%0011"
    description: "Immediate → LUT → Pins/DACs"
    data: >-
      S/# supplies 32 bits of data which form a set of 1/2/4/8-bit values that are
      shifted by 1/2/4/8 bits on each subsequent NCO rollover, with the last value
      repeating. Each value gets used as an offset address into lookup RAM, with the
      %bbbb bits in D[19:16] furnishing the base address of %bbbb00000. The resulting
      32 bits of data read from lookup RAM (at %bbbb00000 + 1/2/4/8-bit value) are
      output.

  immediate_direct:
    range: "%0100-%0111 (%0111 with D[19:16] %0000-%0001)"
    description: "Immediate → Pins/DACs"
    data: >-
      S/# supplies 32 bits of data which form a set of 1/2/4/8/16-bit values that are
      shifted by 1/2/4/8/16/32 bits on each subsequent NCO rollover, with the last
      value repeating. Each value is output in sequence.

  rdfast_lut:
    range: "%0111 with D[19:16] %0010-%1000"
    description: "RDFAST → LUT → Pins/DACs"
    data: >-
      Automatic RFLONG operations are done to read 32 bits at a time from hub RAM.
      The data are treated as a set of 1/2/4/8-bit values that are shifted by 1/2/4/8
      bits on each subsequent NCO rollover, with the last value triggering a new
      RFLONG. Each value gets used as an offset address into lookup RAM, with the
      %bbbb bits in S[3:0] furnishing the base address of %bbbb00000. The resultant 32
      bits of data read from lookup RAM (at %bbbb00000 + 1/2/4/8-bit value) are output.

  rdfast_direct:
    range: "%1000-%1011 (%1011 with D[19:16] %0000-%0001)"
    description: "RDFAST → Pins/DACs"
    data: >-
      Automatic RFBYTE/RFWORD/RFLONG operations are done to read 8/16/32 bits at a time
      from hub RAM. The data are treated as a set of 1/2/4/8/16/32-bit values that are
      shifted by 1/2/4/8/16/32 bits on each subsequent NCO rollover, with the last
      value triggering a new RFBYTE/RFWORD/RFLONG. Each value is output in sequence.

  rgb_video:
    range: "%1011 with D[19:16] %0010-%0110"
    description: "RDFAST → RGB → Pins/DACs"
    data: "See rgb_modes below."

  capture:
    range: "%1100-%1111 (%1111 with D[19:16] %0000-%0001)"
    description: "Pins → DACs/WRFAST"
    data: >-
      Initially, and on each subsequent NCO rollover, 1/2/4/8/16/32 pins are read from
      {INB, INA} and X3, X2, X1, and X0 are updated using the read data. If the %w bit
      in D[23] is high, WFBYTE/WFWORD/WFLONG operations are done automatically to
      record the pin data. In the case of 1/2/4-pin modes, a WFBYTE is done each time
      8 bits of pin data accrue.

  adc_capture:
    range: "%1111 with D[19:16] %0010-%0110"
    description: "ADCs/Pins → DACs/WRFAST"
    data: "See adc_modes below."

  dds_goertzel:
    range: "%1111 with D[18:16] = %111"
    description: "DDS/Goertzel: LUT → DACs + Goertzel analysis"
    data: "architecture/streamer/dds-goertzel.yaml"

  source: >-
    Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), STREAMER (the mode table group
    headings, and the Immediate -> LUT -> Pins/DACs, Immediate -> Pins/DACs, RDFAST -> LUT ->
    Pins/DACs, RDFAST -> Pins/DACs and Pins -> DACs/WRFAST paragraphs).

# How to read a mode row
row_notation:
  s_operand: "The S/# column of the mode table: <long> is 32 bits of data, bbbb the LUT base in S[3:0], rgb the LUMA8 colour in S[2:0], ss / s- the ADC channel select, <config> the DDS/Goertzel configuration, - not used."
  pins: "How many pins the mode drives (out) or reads (in)."
  dac_lanes: >-
    The DAC Channels column is labelled $X3_X2_X1_X0, the four DAC channels X3..X0.
    Not documented: a stated reading of the letters in the lane strings, their bit
    order, or a letter that repeats.
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), STREAMER (the mode table columns S/#, Pins and DAC Channels $X3_X2_X1_X0)"

