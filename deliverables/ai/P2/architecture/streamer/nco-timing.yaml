# NCO Timing and Frequency
# NCO operation, frequency calculation, and common values

component: streamer_nco
description: Numerically-Controlled Oscillator timing control

aliases:
  - "streamer NCO"
  - "NCO timing"
  - "SETXFRQ"
  - "streamer frequency"
  - "streamer sample rate"
  - "NCO rollover"
  - "streamer phase accumulator"

# NCO operation
operation:
  description: |
    On every clock while the streamer is active, the NCO adds a 32-bit frequency
    value into a 32-bit phase accumulator, while masking the MSB of the original phase:
    1. The MSB of the phase is masked before the addition
    2. The frequency value is added to the phase accumulator
    3. The MSB of the resultant phase indicates NCO rollover
    4. Rollover is the trigger that advances the state of the streamer, in every
       mode except DDS/Goertzel, where the streamer runs continuously

  formula: "phase = (phase & $7FFF_FFFF) + frequency"
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), STREAMER (the NCO paragraph, the phase formula and the rollover paragraph)"

# Frequency calculation
frequency_calculation:
  formula: "frequency = $8000_0000 * (desired_rate / clock_frequency)"
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), STREAMER (the SETXFRQ multiplier sentence, the NCO frequency table, the remainder-increment sentence, and the sentence in the XZERO paragraph on incrementing such frequency values by 1 for the Nth clock)"

  note: |
    D/# expresses a fractional 0-to-1 multiplier for the system clock, multiplied by
    $8000_0000. For fractions with remainders, the computed D/# value should be
    incremented, in order to produce proper initial rollover behavior. In the
    table below, 1/3, 1/5, 1/6 and 1/7 carry the increment and 1/2, 1/4 and 1/8 do not.
    Incrementing such a frequency value by 1 makes the initial NCO rollover occur on
    the Nth clock, and not on the Nth+1 clock.

  example: |
    ' 1/5 of the system clock:
    ' table value for 1/5: $1999_9999+1
    setxfrq ##$1999_9999+1

# The system clock multipliers and their D/# values
common_values:
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), STREAMER (the system clock multiplier table, with its footnote)"
  values:
    - ratio: "1"
      value: "$8000_0000"
      note: "Default value on cog start"

    - ratio: "1/2"
      value: "$4000_0000"

    - ratio: "1/3"
      value: "$2AAA_AAAA+1"

    - ratio: "1/4"
      value: "$2000_0000"

    - ratio: "1/5"
      value: "$1999_9999+1"

    - ratio: "1/6"
      value: "$1555_5555+1"

    - ratio: "1/7"
      value: "$1249_2492+1"

    - ratio: "1/8"
      value: "$1000_0000"

# Video pixel rates
video_rates: >-
  The DVI NCO setting is in architecture/streamer/colorspace-and-dvi.yaml
  (dvi.nco_rule).

# Setting frequency
methods:
  setxfrq:
    syntax: "SETXFRQ {#}D"
    description: "Set NCO frequency directly"
    example: |
      setxfrq ##$1999_9999+1  ' 1/5 of the system clock

  setq_inline:
    syntax: "SETQ {#}D immediately before XINIT/XZERO/XCONT"
    description: "When the streamer command executes, the new frequency is set during the first clock of the command. Without a SETQ before the instruction, the frequency stays the same when the command executes."
    example: |
      setq    ##$1999_9999+1  ' new NCO frequency, 1/5 of the system clock
      xinit   mode, data      ' the command starts with the new frequency
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), STREAMER (the SETQ sentence)"

# Phase control
phase_control:
  xinit: "Issues the command immediately, zeroing phase"
  xzero: "Clears the phase accumulator when the buffered command executes"
  xcont: "Continues the phase accumulator"
  xcont_use: "XCONT is useful in cases where NCO phase and frequency should be strictly maintained and streamer activity should ride along with it."
  xzero_use: "XZERO at the horizontal sync pulse with imperfect fractions such as ~1/3: language/pasm2/xzero.yaml (fractional_frequency_glitch)."
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), STREAMER (the five streamer instructions, the XZERO paragraph and the XCONT paragraph)"

see_also:
  - architecture/streamer/overview.yaml
  - architecture/streamer/modes-reference.yaml
  - architecture/streamer/colorspace-and-dvi.yaml
  - language/pasm2/setxfrq.yaml
  - language/pasm2/xzero.yaml
