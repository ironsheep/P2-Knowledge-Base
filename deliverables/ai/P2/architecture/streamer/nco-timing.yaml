# NCO Timing and Frequency
# NCO operation, frequency calculation, and common values

component: streamer_nco
description: Numerically-Controlled Oscillator timing control

aliases:
  - "streamer NCO"
  - "NCO timing"
  - "SETXFRQ"
  - "streamer frequency"
  - "streamer sample rate"
  - "NCO rollover"
  - "streamer phase accumulator"

# NCO operation
operation:
  description: |
    The NCO operates on every system clock cycle:
    1. MSB is masked (cleared) before addition
    2. Frequency value adds to phase accumulator
    3. If new MSB is set, "rollover" occurs
    4. On rollover, streamer advances to next data element
    
  formula: "phase = (phase & $7FFF_FFFF) + frequency"
  
  hardware_note: |
    The phase accumulator is a 32-bit register, but its MSB is masked
    (cleared) before each add and serves as the rollover flag — so 31 bits
    hold the accumulating phase and resolution is clkfreq / 2^31.

# Frequency calculation
frequency_calculation:
  formula: "frequency = $8000_0000 * (desired_rate / clock_frequency)"
  
  note: |
    Truncate the division, then add 1 whenever it leaves a remainder — this is the
    general rule, not a list of special cases. 1/3, 1/5 and 1/10 are only the
    familiar examples; 25.175 MHz at any of the three system clocks below needs the
    same increment. An exact division (1/2, 1/4, 1/8, 1/16) takes no increment.
    Source: engineering/ingestion/sources/silicon-doc/part2-pixel-ops.txt:117 and
    :121 (one sentence, split by a page break) — "For fractions with remainders, the
    computed D/# value should be incremented, in order to produce proper initial
    rollover behavior."

  example: |
    ' 25 MHz pixel rate at 250 MHz clock:
    ' frequency = $8000_0000 * (25/250) = $0CCC_CCCC
    ' Add 1: $0CCC_CCCD
    setxfrq ##$0CCC_CCCD

# Common frequency values
common_values:
  - ratio: "1:1"
    value: "$8000_0000"
    description: "Every clock cycle"
    note: "Maximum rate"
    
  - ratio: "1:2"
    value: "$4000_0000"
    description: "Half clock rate"
    note: "Exact division, no +1 needed"
    
  - ratio: "1:3"
    value: "$2AAA_AAAB"
    description: "Third clock rate"
    note: "Fractional, +1 added"
    
  - ratio: "1:4"
    value: "$2000_0000"
    description: "Quarter clock rate"
    note: "Exact division"
    
  - ratio: "1:5"
    value: "$1999_999A"
    description: "Fifth clock rate"
    note: "Fractional, +1 added"
    
  - ratio: "1:8"
    value: "$1000_0000"
    description: "Eighth clock rate"
    note: "Exact division"
    
  - ratio: "1:10"
    value: "$0CCC_CCCD"
    description: "Tenth clock rate"
    note: "Fractional, +1 added (HDMI 10x)"
    
  - ratio: "1:16"
    value: "$0800_0000"
    description: "Sixteenth clock rate"
    note: "Exact division"

# Video pixel rates
video_rates:
  source: |
    Parallax Propeller 2 Documentation v35, Streamer NCO --
    engineering/ingestion/sources/silicon-doc/part2-pixel-ops.txt:104-117 and :121.
    Every value below is computed from the rule stated there, not read from a
    table: D = pixel_rate * $8000_0000 / clkfreq, truncated, then
    incremented by 1 when that division leaves a remainder
    (engineering/ingestion/sources/silicon-doc/part2-pixel-ops.txt:117 and :121 —
    "For fractions with remainders, the computed D/# value should be incremented, in
    order to produce proper initial rollover behavior."). Only 40.000 MHz at 320 MHz
    and 65.000 MHz at 320 MHz divide exactly; every other entry here carries the
    increment. language/pasm2/setxfrq.yaml derives its values from the same rule.

  vga_640x480:
    pixel_rate: "25.175 MHz"
    at_250mhz: "$0CE3_BCD4"
    at_300mhz: "$0ABD_C806"
    at_320mhz: "$0A11_EB86"

  vga_800x600:
    pixel_rate: "40.000 MHz"
    at_250mhz: "$147A_E148"
    at_300mhz: "$1111_1112"
    at_320mhz: "$1000_0000"

  vga_1024x768:
    pixel_rate: "65.000 MHz"
    at_250mhz: "$2147_AE15"
    at_300mhz: "$1BBB_BBBC"
    at_320mhz: "$1A00_0000"

  hdmi_720p:
    pixel_rate: "74.250 MHz"
    at_250mhz: "$2604_1894"
    at_300mhz: "$1FAE_147B"
    at_320mhz: "$1DB3_3334"
    note: "Requires 10x for TMDS"

# Setting frequency
methods:
  setxfrq:
    syntax: "SETXFRQ {#}D"
    description: "Set NCO frequency directly"
    example: |
      setxfrq ##$0CCC_CCCD    ' 25 MHz at 250 MHz clock
      
  setq_inline:
    syntax: "SETQ + XINIT/XCONT/XZERO"
    description: "Set frequency atomically with command"
    example: |
      setq    ##$0CCC_CCCD    ' Set frequency
      xinit   mode, data      ' Execute with new frequency
    note: "Useful when frequency changes with each command"

# Phase control
phase_control:
  xinit: "Zeros phase immediately"
  xzero: "Zeros phase on command execution"
  xcont: "Continues phase (no reset)"
  
  use_cases:
    xzero: "Video line boundaries - prevents drift accumulation"
    xcont: "Audio streaming - no pops from phase discontinuity"

# Timing precision
precision:
  resolution: "clkfreq / 2^31 per LSB (32-bit accumulator, MSB masked as rollover flag)"
  sub_hz: "Sub-Hz frequency resolution at typical clocks"
  jitter: "Deterministic - no jitter from NCO"
  
  note: |
    VGA pixel rates rarely divide evenly into P2 clock frequencies.
    Monitors tolerate small variations. Use closest achievable rate.

see_also:
  - architecture/streamer/overview.yaml
  - architecture/streamer/modes-reference.yaml
