# Streamer Overview
# Core concepts and capabilities - start here for general understanding

component: streamer
category: dma_engine

aliases:
  - "streamer"
  - "streamer overview"
  - "DMA engine"
  - "XINIT"
  - "XZERO"
  - "XCONT"
  - "XSTOP"
  - "SETXFRQ"
  - "hub FIFO streaming"
  - "background I/O"
  - perpetual streaming
  - continuous streaming
  - streamer runs forever
  - streamer count field
  - streamer never stops

description: |
  High-speed data streaming engine with NCO timing control. Operates 
  independently of COG execution for zero-overhead I/O operations.

# What the streamer does
capabilities:
  - Stream data from Hub memory to pins/DACs at system clock rates
  - Capture pin states and ADC readings to Hub memory
  - Generate video signals (VGA, HDMI, composite)
  - Output multi-channel audio via DAC
  - Perform Goertzel frequency analysis in hardware
  - Synthesize waveforms via DDS

# Resources per COG
resources_per_cog:
  nco: "One 32-bit phase accumulator"
  command_buffer: "Single-level (one pending command)"
  dac_channels: "Four 8-bit channels (X0, X1, X2, X3)"
  goertzel: "One analyzer unit"
  lut_access: "Full access to COG's 512-entry LUT"

# Data flow paths (which mode categories to use)
data_paths:
  hub_to_pins:
    description: "Output Hub data to pins/DACs"
    modes: "RDFAST modes (%1000-%1011)"
    setup: "RDFAST instruction before streamer command"
    
  immediate_to_pins:
    description: "Output S operand data to pins/DACs"
    modes: "Immediate modes (%0100-%0111)"
    setup: "Data in S operand"
    
  lut_lookup:
    description: "Use data as LUT index, output LUT content"
    modes: "LUT modes (%0000-%0011, %0111)"
    setup: "Palette/table in LUT RAM"
    
  pins_to_hub:
    description: "Capture pin states to Hub"
    modes: "WRFAST modes (%1100-%1111)"
    setup: "WRFAST instruction before streamer command"
    
  rgb_video:
    description: "Hub pixels unpacked by the streamer into R, G, B on the way to
      the pins. The cog's colorspace converter is a SEPARATE downstream stage that
      transforms the DAC channels; it is not part of this path and needs no
      configuration for these modes."
    modes: "RGB modes (%1011 with config)"
    setup: "RDFAST before the streamer command"
    
  dds_goertzel:
    description: "Waveform synthesis with frequency analysis"
    modes: "DDS/Goertzel (%1111_x111)"
    setup: "Sine/cosine table in LUT"

# Instruction quick reference
instructions:
  SETXFRQ:
    syntax: "SETXFRQ {#}D"
    purpose: "Set NCO frequency (timing rate)"
    details: architecture/streamer/nco-timing.yaml
    
  XINIT:
    syntax: "XINIT {#}D,{#}S"
    purpose: "Start immediately, zero phase"
    note: "Use to begin streaming"
    
  XCONT:
    syntax: "XCONT {#}D,{#}S"
    purpose: "Buffer command, continue phase"
    note: "Seamless chaining without gaps"
    
  XZERO:
    syntax: "XZERO {#}D,{#}S"
    purpose: "Buffer command, zero phase"
    note: "Use at video line boundaries"
    
  XSTOP:
    syntax: "XSTOP"
    purpose: "Stop immediately"
    note: "Equivalent to XINIT #0,#0. Also the way a PERPETUAL command ends — see count_field."

  GETXACC:
    syntax: "GETXACC D"
    purpose: "Get Goertzel accumulators"
    details: architecture/streamer/dds-goertzel.yaml

count_field:
  location: "D[15:0] of the streamer command"
  terminating: "Counts down to zero, then the command completes. Largest terminating count: $FFFE."
  perpetual: >-
    A count of $FFFF runs the command PERPETUALLY — the counter does not decrement and
    the command never completes on its own. It ends when a new command is issued or XSTOP
    stops it.
  the_trap: >-
    $FFFF is the top of the field, so a transfer sized to "the maximum count" becomes an
    endless command rather than the largest possible transfer, and a chunked chain built
    that way collapses into its first chunk. Size terminating transfers to $FFFE or below.
  related:
    - language/pasm2/xinit.yaml
    - language/pasm2/xstop.yaml
    

# Command word structure (D operand)
command_format:
  fields_are_positional_and_vary_by_mode: |
    THE MAP BELOW IS THE COMMON CASE, NOT A UNIVERSAL LAYOUT. Each mode has its own
    template, and a field present in one mode may be fixed or absent in another —
    e.g. in DDS/Goertzel D[23] selects SINC1/SINC2 (not pin-output enable) and the
    four-pin input BLOCK sits in D[22:19]; in X_1ADC8_0P_1DAC8_WFBYTE D[22:20] are
    fixed zeros with NO pin field at all, and the channel is chosen in S[1:0].
    Check the mode's own template in architecture/streamer/modes-reference.yaml before composing a command,
    and compose with `|` rather than `+` — adding a shifted value into bits the mode
    already defines silently selects A DIFFERENT MODE instead of raising an error.
  D_31_28: "Mode selector"
  D_27_24: "DAC routing (%dddd)"
  D_23: "Enable pin output (%e) or WRFAST (%w)"
  D_22_20: "Pin group (%ppp)"
  D_19_16: "Mode-specific config"
  D_15_0: "Count (NCO rollovers)"
  
  details:
    modes: architecture/streamer/modes-reference.yaml
    dac: architecture/streamer/dac-routing.yaml
    pins: architecture/streamer/pin-selection.yaml

# Typical usage pattern
usage_pattern:
  code: |
    ' 1. Setup FIFO (for Hub modes)
    rdfast  #0, ##buffer_addr
    
    ' 2. Set NCO frequency
    setxfrq ##frequency_value
    
    ' 3. Start streaming
    xinit   ##mode_command, #0
    
    ' 4. Chain additional commands
    xcont   ##next_command, #0
    
    ' 5. Wait for completion
    waitxfi

# Debugging streamer code — read this before trusting a measurement
debug_interaction:
  problem: |
    DEBUG_COGS defaults to %11111111 — every cog has debug capability at runtime. So
    compiling with -d, the normal way to debug, puts the P2's HIGHEST-PRIORITY INTERRUPT
    inside the cog running your streamer.
  fix: |
    CON
      DEBUG_COGS = %0000_0001   ' only the reporting cog carries the debug interrupt
  measured_cost: "With the default mask a streamer probe crashed into the single-step debugger's memory dump and its Goertzel accumulators read 1,000,000-7,000,000 of corruption; restricting DEBUG_COGS to cog 0 collapsed them to their true values in the hundreds."
  general_rule: "Any hardware sequencer measured under the debugger may be perturbed by it. Restrict DEBUG_COGS to the reporting cog when measuring."
  source: "engineering/ingestion/external-sources/hardware-verification/P2-EMPIRICAL-FINDINGS.md EF-057 (2026-08-14); the limitation is also recorded in architecture/debug_interrupt.yaml (limitations.streamer_interaction)"
  see_also:
    - "architecture/debug_interrupt.yaml"
    - "language/spin2/constants/special-configuration-symbols.yaml"

# Events generated
events:
  EVENT_XMT: "Ready for new command (event 10)"
  EVENT_XFI: "Finished, no pending command (event 11)"
  EVENT_XRO: "NCO rollover occurred (event 12)"
  EVENT_XRL: "Read LUT address $1FF (event 13)"

