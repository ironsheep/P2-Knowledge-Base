# DDS/Goertzel Mode
# Direct Digital Synthesis with Goertzel frequency analysis

component: streamer_dds_goertzel
description: Combined waveform synthesis and frequency detection

aliases:
  - "DDS"
  - "Goertzel"
  - "DDS Goertzel"
  - "frequency detection"
  - "tone detection"
  - "waveform synthesis"
  - "SINC1"
  - "SINC2"

# Mode variants
modes:
  sinc1:
    symbol: X_DDS_GOERTZEL_SINC1
    encoding: "D[31:16] = %1111_dddd_0ppp_p111"
    filter: "SINC1 (D[23] = 0)"
    q_factor: "Lower than SINC2"
    example_table_amplitude: "±127"

  sinc2:
    symbol: X_DDS_GOERTZEL_SINC2
    encoding: "D[31:16] = %1111_dddd_1ppp_p111"
    filter: "SINC2 (D[23] = 1), double-integrating accumulators"
    q_factor: "Higher than SINC1"
    example_table_amplitude: "±10, reduced to avoid (X,Y) accumulator overflow"
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), STREAMER (the DDS/Goertzel mode table rows; D[23] selects SINC1 or SINC2; the paragraph after the Goertzel program: SINC2 has a higher Q, and the table amplitude reduced from ±127 to ±10; NOTE ABOUT GOERTZEL SINC2 MODE: double-integrating accumulators)"

# ADC input pins
adc_input_pins:
  rule: |
    One to four of the block's pins should be configured for ADC mode, so that their IN
    signals are raw delta-sigma bit streams, with no smart pin mode selected (mode field
    %00000). A Goertzel setup initialises its ADC pin with `wrpin adcmode,#adcpin`
    and enables its DAC pin with `dirh #dacpin`.
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), STREAMER, DDS/Goertzel (the %pppp paragraph, and the Goertzel program's setup lines and adcmode long); cross_source_conflict: STREAMER (introduction) and DDS/Goertzel; bitstream_summation: STREAMER, DDS/Goertzel"
  cross_source_conflict: |
    Parallax's documents also give the Goertzel input pins two ways: as "smart pins
    configured as ADC's", and as pins configured for ADC mode "with no smart pin mode
    selected".

  pin_block_selection:
    field: "D[22:19] = %pppp selects a four-pin block; %pppp * 4 is the base pin"
    note: "This selects a block, not a pin. Which of the four are summed/inverted is chosen in S (below)."
  s_operand:
    field_19_16: "which of the four pins are inverted (allows subtraction of a channel)"
    field_15_12: "which of the four pins are summed; a 0 bit leaves its pin ignored, so S[15:12] = 0 sums no pin"
    field_11_9: >-
      Loop-size selector. Chooses how many LUT entries one NCO cycle walks, and
      therefore which NCO bits index the LUT. See lut_setup.lut_window for the
      eight settings; %000 is the 512-entry setting.
    field_8_0: >-
      Split by the loop-size selector into %A region-bound bits and %T phase-offset
      bits -- "%001_ATTTTTTTT", "%010_AATTTTTTT" and so on. The %A bits bound the
      read to a sub-region of the LUT, so more than one waveform can be resident at
      once; the %T bits are added to the topmost NCO bits, which shifts or modulates
      the phase of playback:
      "On each clock, the lookup RAM is read at the 9-bit location bound by the %A
      bits, with the lower bits being the sum of the %T bits and the topmost NCO
      bits. This allows you to set bounded areas within the LUT and to shift or
      modulate the phase of playback."
    field_11_0_note: >-
      The %T bits shift or modulate the phase of playback.
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), STREAMER, DDS/Goertzel
      (the S[19:0] configuration paragraph, and the S[11:0] table and the %A/%T rule: 'the
      lower bits being the sum of the %T bits and the topmost NCO bits ... to shift or
      modulate the phase of playback'). field_8_0: Parallax Propeller 2 Documentation v35
      (Rev B/C silicon), STREAMER, DDS/Goertzel."
  bitstream_summation: "IN '0' counts as -1, '1' as +1. For two or four summed channels the sum is always even and is shifted right one bit."

# Operation (every clock cycle)
operation:
  description: |
    This mode outputs and inputs on every clock in which the command is active, not
    only on NCO rollovers.

  actions:
    lut_read: >-
      Read the LUT entry indexed by the NCO bits the loop-size selector chooses --
      NCO[30:22] for the %000 (512-entry) setting, NCO[30:29] at the other extreme.
      See lut_setup.lut_window. The read is bounded by the %A bits and offset by the
      %T bits of S[11:0].
    nco_advance: "phase = (phase & $7FFF_FFFF) + frequency"
    dac_output: "The four LUT bytes are output to X3, X2, X1 and X0 with their MSBs inverted, so that they may drive the unsigned DACs"
    multiply: "The sine (byte 3) and cosine (byte 2) values are multiplied by the bitstream sum"
    accumulate: "The products are added into their respective 32-bit accumulators"
    order: "Not documented: the order of the LUT read and the NCO advance within a clock"

  dac_output:
    x3: "LUT.byte[3] with its MSB inverted (^ $80)"
    x2: "LUT.byte[2] with its MSB inverted (^ $80)"
    x1: "LUT.byte[1] with its MSB inverted (^ $80)"
    x0: "LUT.byte[0] with its MSB inverted (^ $80)"
    dac_channel_selection: "The %dddd field in D[27:24] selects which streamer DAC channels override which SETDACS values: architecture/streamer/dac-routing.yaml"

  goertzel_calculation:
    inputs: |
      lookup_sin = LUT.byte[3] (signed)
      lookup_cos = LUT.byte[2] (signed)
      bitstream_sum = an integer from -3 to +3
    accumulators: "SIN_ACC and COS_ACC are 32 bits each; GETXACC reads them (language/pasm2/getxacc.yaml)."
    sinc1: |
      D[23] = %0, SINC1:
      SIN_MUL = bitstream_sum * lookup_sin
      COS_MUL = bitstream_sum * lookup_cos
      SIN_ACC += SIN_MUL
      COS_ACC += COS_MUL
    sinc2: |
      D[23] = %1, SINC2:
      SIN_MUL += bitstream_sum * lookup_sin
      COS_MUL += bitstream_sum * lookup_cos
      SIN_ACC += SIN_MUL
      COS_ACC += COS_MUL
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), STREAMER, DDS/Goertzel (the mode paragraph, the LUT-output paragraph, the bitstream-sum and 32-bit accumulator sentence, and the D[23] SINC1/SINC2 accumulation table); NCO: STREAMER (the phase formula)"

# LUT setup requirements
lut_setup:
  entries_note: >-
    512 is the %000 case of the loop-size selector. The table below gives all eight
    settings.
  lut_window:
    description: >-
      S[11:9] selects the loop size; the remaining S[8:0] bits split into %A region
      bounds and %T phase offset.
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), STREAMER, DDS/Goertzel (lut_window description)"
    settings:
      - {s_11_0: "%000_TTTTTTTTT", loop_size: 512, nco_bits: "30..22", lut_range: "%000000000..%111111111"}
      - {s_11_0: "%001_ATTTTTTTT", loop_size: 256, nco_bits: "30..23", lut_range: "%A00000000..%A11111111"}
      - {s_11_0: "%010_AATTTTTTT", loop_size: 128, nco_bits: "30..24", lut_range: "%AA0000000..%AA1111111"}
      - {s_11_0: "%011_AAATTTTTT", loop_size:  64, nco_bits: "30..25", lut_range: "%AAA000000..%AAA111111"}
      - {s_11_0: "%100_AAAATTTTT", loop_size:  32, nco_bits: "30..26", lut_range: "%AAAA00000..%AAAA11111"}
      - {s_11_0: "%101_AAAAATTTT", loop_size:  16, nco_bits: "30..27", lut_range: "%AAAAA0000..%AAAAA1111"}
      - {s_11_0: "%110_AAAAAATTT", loop_size:   8, nco_bits: "30..28", lut_range: "%AAAAAA000..%AAAAAA111"}
      - {s_11_0: "%111_AAAAAAATT", loop_size:   4, nco_bits: "30..29", lut_range: "%AAAAAAA00..%AAAAAAA11"}
    capabilities:
      bounded_regions: "The %A bits confine playback to a LUT sub-region, so several waveforms can be resident at once."
      phase_offset: "The %T bits are added to the topmost NCO bits — this is the phase shift / modulation control."
  format: "32-bit long per entry"
  
  byte_layout:
    byte_3: "Sine value (signed): to the Goertzel analyzer, and to X3 with its MSB inverted"
    byte_2: "Cosine value (signed): to the Goertzel analyzer, and to X2 with its MSB inverted"
    byte_1: "To X1 with its MSB inverted"
    byte_0: "To X0 with its MSB inverted"

  example: |
    ' Make sine and cosine tables in LUT bytes 3 and 2: a 512-sample table, matching the
    ' %000 loop size (S[11:9] = %000). A different loop size walks a different number of
    ' entries. PASM2 in a cog; ampl = 127 for SINC1.
            mov     z, #$1FF            ' 512 samples, counting down to 0
    sincos  shl     z, #32-9            ' get angle into top 9 bits of z
            qrotate #ampl, z            ' rotate (ampl, 0) by z
            shr     z, #32-9            ' restore z
            getqy   y                   ' get y
            getqx   x                   ' get x
            shl     y, #24              ' y into byte 3
            setbyte y, x, #2            ' x into byte 2
            wrlut   y, z                ' write sin:cos:0:0 into LUT
            djnf    z, #sincos          ' loop until 512 samples

  sinc2_amplitude: |
    ' For SINC2 mode, the table amplitude reduced to avoid accumulator overflow
    ' (512-entry / %000 loop size): the same table builder with ampl = 10 instead of 127.
            qrotate #10, z              ' rotate (10, 0) by z

# Reading results
reading_results:
  instruction: "GETXACC D"

  operation: |
    1. The cosine accumulation → D register
    2. The sine accumulation → next instruction's S operand
  clearing_and_lag: "When GETXACC clears the accumulators, and the one-clock lag of each burst's last term, are in language/pasm2/getxacc.yaml (silicon_errata, reading_protocol)."
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), STREAMER, DDS/Goertzel (the GETXACC paragraph)"

  example: |
    getxacc cos_result       ' Cosine → D
    mov     sin_result, 0-0  ' Sine → the S field of this instruction

  magnitude_calculation: |
    ' Convert to length and angle using CORDIC
    qvector cos_result, sin_result
    getqx   magnitude
    getqy   phase

# Frequency calculation
frequency:
  description: "NCO frequency for target detection/synthesis"
  formula: "frequency = $8000_0000 * target_freq / clock_freq"

  note: |
    Set via SETXFRQ, where D/# expresses a fractional 0-to-1 multiplier for the
    system clock, which value must be multiplied by $8000_0000. (See language/pasm2/setxfrq.yaml and
    architecture/streamer/nco-timing.yaml.)

  example: |
    ' NCO value for a 40 kHz target at the current clock:
    ' frequency = $8000_0000 * 40000 / clkfreq
    rdlong  clkf, #$44         ' clkfreq is at hub long $44
    qfrac   ##40000, clkf      ' QFRAC = 2^32 * 40000/clkfreq
    getqx   xfrq
    shr     xfrq, #1           ' halve to 2^31 scaling for the NCO
    setxfrq xfrq
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), STREAMER (the SETXFRQ multiplier sentence and the phase formula); clkfreq at LONG[$44]: Parallax Propeller 2 Spin2 Language Documentation v55, the clkfreq variable row"

# SINC1 vs SINC2 comparison
filter_comparison:
  sinc1:
    accumulation: "goertzel_calculation.sinc1"
    selectivity: "Lower Q than SINC2"
    amplitude: "±127"

  sinc2:
    accumulation: "goertzel_calculation.sinc2"
    selectivity: "Higher Q than SINC1"
    amplitude: "±10"

  sinc2_amplitude_reduction: |
    Due to rapid (X,Y) accumulator growth, SINC2 may require the sine/cosine table
    to be reduced in amplitude to avoid (X,Y) accumulator overflow.

  sinc2_varying_iterations: >-
    The Goertzel SINC2 mode generates periodic problematic GETXACC readings when the
    number of iterations in a Goertzel cycle varies, because SETXFRQ's D is a
    non-power-of-two value. When every Goertzel cycle takes the same number of
    clocks, the double-integrating accumulators in SINC2 mode always have the same
    number of iterations before a GETXACC instruction executes and captures the
    double accumulations. Being off by a single clock cycle corrupts the current and
    next samples.
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), STREAMER, DDS/Goertzel (the paragraph after the Goertzel program; sinc2_varying_iterations: the NOTE ABOUT GOERTZEL SINC2 MODE)"

# Applications
applications:
  measurements: "By incorporating DDS output with simultaneous Goertzel input, many interactive real-world measurements can be made to determine things like time-of-flight and resonance."
  energy_at_one_frequency: "Goertzel analysis measures the energy of a single frequency amid potential noise for some number of NCO cycles, and returns sine and cosine accumulations that QVECTOR converts into polar coordinates, yielding power and phase information."
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), STREAMER, DDS/Goertzel (the Goertzel and DDS paragraphs)"

  function_generator:
    description: "DDS on up to four DAC channels"
    pattern: "On each clock the upper bits of the NCO index a LUT long whose four bytes are output to X3, X2, X1 and X0 with their MSBs inverted. The %dddd field in D[27:24] selects which streamer DAC channels override which SETDACS values; a pin that brings out the data as a voltage is set to DAC mode with the COGID embedded, via WRPIN, and DIR is high."
    note: >-
      function_generator is the DDS-output direction. usage_pattern below is a
      detector with %dddd = X_DACS_OFF; usage_pattern.dac_output_pin_setup gives the
      output arrangement.

# Typical usage
usage_pattern:
  code: |
    ' 1. Load sine/cosine table to LUT
    setq2   #$200-1
    rdlong  0, ##sine_table
    
    ' 2. Configure ADC pin: ADC mode, smart-pin mode %00000
    wrpin   ##P_ADC_1X, #adc_pin

    ' 3. Set the streamer NCO frequency (2^31 scaling — see `frequency:` above)
    rdlong  clkf, #$44             ' clkfreq is at hub long $44
    qfrac   target_freq, clkf      ' 2^32 * target/clkfreq
    getqx   xfrq
    shr     xfrq, #1               ' halve to the NCO's 2^31 scaling
    setxfrq xfrq

    ' 4. Start DDS/Goertzel. S[15:12] selects which of the four block pins
    '    are summed; S = 0 sums no pin.
    setword dds_cmd, cycles, #0
    xcont   dds_cmd, dds_s

    ' 5. GETXACC reads X, and Y goes into the next instruction's S field.
    '    A burst's last term is added on the first clock of the next burst:
    '    language/pasm2/getxacc.yaml reading_protocol.
    getxacc cos_acc
    mov     sin_acc, 0-0
    qvector cos_acc, sin_acc
    getqx   magnitude

  data: |
    ' Goertzel mode, four-pin block 0 (pins 0..3), %111 config bits in D[18:16]
    dds_cmd     long    %1111_0000_0000_0111<<16 + sinc2<<23 + cycles
    ' input on base pin +0 (S[15:12] = %0001), invert none,
    ' S[11:9] = %000 -> 512-entry loop size, %A/%T both zero (whole LUT, no phase offset)
    dds_s       long    %0000_0001_000_000000000

  what_this_example_is: >-
    A Goertzel detector. Its dds_cmd sets %dddd = %0000 (X_DACS_OFF), which routes
    no streamer DAC channel, and it reads the result back with GETXACC/QVECTOR.
    The DDS output arrangement routes the DACs in %dddd and sets the pin up as a
    streamer-fed DAC; see dac_output_pin_setup below.
  dac_output_pin_setup: >-
    For the DDS-output direction the pin is a DAC mode with the COGID embedded and
    DIR high: TT = %01 (P_CHANNEL, e.g. P_DAC_124R_3V | P_CHANNEL), M[3:0] selecting
    the cog DAC channel, the channel chosen by the pin's own two low bits. The rule
    and the TT = %00 case are in architecture/streamer/dac-routing.yaml (pin_setup).
  source: "Shape and constants follow the worked DDS/Goertzel program in Parallax Propeller 2
      Documentation v35 (Rev B/C silicon), STREAMER, DDS/Goertzel (the program's description
      and setup, and the dds_d / dds_s mode and data longs); dac_output_pin_setup: STREAMER
      (DAC mode with the COGID embedded, DIR high), PIN CONFIGURATION MODES (%TT 01 = M[3..0]
      selects cog DAC channel), EF-063."

see_also:
  - architecture/streamer/modes-reference.yaml
  - architecture/streamer/nco-timing.yaml
  - language/pasm2/getxacc.yaml

hub_symbols: "Fragments here that use a hub symbol as an immediate assume a PASM-only file, where hub addresses are absolute. In a Spin2 object, DAT hub addresses are relative to the object: see language/spin2/integration/spin2-pasm2-integration.yaml hub_address_resolution."
