# Streamer Documentation Index
# Download-on-demand manifest for P2 Streamer subsystem
# Use this file to identify which file contains the information you need

component: streamer
description: High-speed NCO-driven DMA engine for autonomous I/O

aliases:
  - "streamer index"
  - "streamer documentation index"
  - "streamer files"
  - "streamer manifest"

version: "2.0"
last_updated: "2026-01-22"

# File manifest - download only what you need
files:
  overview:
    path: overview.yaml
    size: ~80 lines
    use_when:
      - "Need general understanding of streamer capabilities"
      - "Want list of streamer instructions"
      - "Starting to learn about streamer"
    contains:
      - Core concepts and architecture summary
      - Instruction quick reference
      - Data flow paths overview

  modes:
    path: modes-reference.yaml
    size: ~150 lines
    use_when:
      - "Need specific mode encoding (D[31:28])"
      - "Looking up mode symbol name or value"
      - "Choosing mode for output/input operation"
    contains:
      - Complete mode encoding table
      - Mode categories and variants
      - D[19:16] configuration bits per mode

  dac:
    path: dac-routing.yaml
    size: ~60 lines
    use_when:
      - "Configuring DAC channel output"
      - "Setting up stereo or differential audio"
      - "Understanding DAC-to-pin mapping"
    contains:
      - Complete %dddd routing table
      - DAC channel to pin mapping
      - Common DAC configurations

  pins:
    path: pin-selection.yaml
    size: ~50 lines
    use_when:
      - "Selecting pin group (%ppp field)"
      - "Understanding sub-pin selection"
      - "Configuring pin enable/output"
    contains:
      - Pin group selection table
      - Sub-pin selection for <8 pin modes
      - Enable/write control bits

  timing:
    path: nco-timing.yaml
    size: ~60 lines
    use_when:
      - "Calculating NCO frequency values"
      - "Setting pixel rates for video"
      - "Understanding NCO rollover behavior"
    contains:
      - NCO operation details
      - Frequency calculation formula
      - Common frequency values table

  pin_capture:
    path: pin-capture.yaml
    size: ~310 lines
    use_when:
      - "Capturing digital pin state into hub RAM"
      - "Monitoring or sniffing a bus that smart pins are already running"
      - "Building a logic-analyzer-style capture on the P2"
      - "Wondering why streaming INA of a smart pin returns flags, not traffic"
    contains:
      - Why direct capture of a smart-pin pin yields the IN handshake
      - The neighbour-routing composition that captures the waveform instead
      - The base-pin alignment constraint at the point of use
      - What is bench-verified here and what is not

  goertzel:
    path: dds-goertzel.yaml
    size: ~80 lines
    use_when:
      - "Implementing DDS waveform synthesis"
      - "Using Goertzel frequency detection"
      - "Setting up LUT for sine/cosine"
    contains:
      - DDS/Goertzel mode operation
      - SINC1 vs SINC2 comparison
      - LUT setup requirements

# Quick decision tree
decision_tree:
  "What can the streamer do?": overview.yaml
  "Which mode do I need?": modes-reference.yaml
  "How do I configure DAC output?": dac-routing.yaml
  "Which pins will be used?": pin-selection.yaml
  "What frequency value for X rate?": nco-timing.yaml
  "How does Goertzel analysis work?": dds-goertzel.yaml
  "How do I capture pin state into hub RAM?": pin-capture.yaml
  "How do I watch a bus my smart pins are running?": pin-capture.yaml

# Related resources outside this directory
related:
  # Streamer instructions
  - language/pasm2/xinit.yaml
  - language/pasm2/xcont.yaml
  - language/pasm2/xzero.yaml
  - language/pasm2/xstop.yaml
  - language/pasm2/setxfrq.yaml
  - language/pasm2/getxacc.yaml
  # Streamer symbols
  - language/spin2/symbols/streamer-symbols.yaml
  # Related components
  - architecture/event_system.yaml
  - architecture/smart_pins.yaml
  - language/spin2/debug-displays/logic.yaml
