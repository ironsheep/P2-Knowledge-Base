# Pin Selection and Control
# D[22:20] pin group; D[19:17] low-order %p bits for modes of fewer than 8 pins; D[16] is the %a alternate-bit-order bit where a mode has one
#
# Per-constant definitions are in language/spin2/symbols/streamer-symbols.yaml and
# language/spin2/symbols/spin2-builtin-symbols-complete.yaml. X_* constants appear
# here as values and in prose.

component: streamer_pins
description: Pin group selection via %ppp field and sub-pin selection

source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), STREAMER -- the %ppp pin-group
  rule and the sub-8-pin resolution rule; the %e / %w meanings; per-mode D[19:16] templates
  from the Parallax Propeller 2 Spin2 Language Documentation v55, Built-In Symbols for Streamer Modes."

aliases:
  - "streamer pin selection"
  - "streamer pin group"
  - "pin group"
  - "ppp field"
  - "sub-pin selection"
  - "streamer base pin"
  - "pin base"
  - "X_PINS_ON"
  - "X_WRITE_ON"
  - "alternate bit order"
  - "streamer output not visible on the pin"

# Pin group selection (32-pin blocks)
pin_groups:
  field: "D[22:20] (%ppp)"
  description: "Selects which 32-pin block the streamer addresses"
  
  groups:
    - ppp: "%000"
      pins: "31..0"
      description: "Lower 32 pins"
      
    - ppp: "%001"
      pins: "39..8"
      description: "Pins 8-39"
      
    - ppp: "%010"
      pins: "47..16"
      description: "Pins 16-47"
      
    - ppp: "%011"
      pins: "55..24"
      description: "Pins 24-55"
      
    - ppp: "%100"
      pins: "63..32"
      description: "Upper 32 pins"
      
    - ppp: "%101"
      pins: "7..0, 63..40"
      description: "Wrap-around (32 pins)"
      
    - ppp: "%110"
      pins: "15..0, 63..48"
      description: "Wrap-around (32 pins)"
      
    - ppp: "%111"
      pins: "23..0, 63..56"
      description: "Wrap-around (32 pins)"

# Sub-pin selection (for <8 pin modes)
sub_pin_selection:
  field: "D[19:17], the low-order %p bits of modes that involve fewer than 8 pins"
  rule: |
    D[22:20] selects the pin group in 8-pin increments. "For modes which involve less
    than 8 pins, lower-order %p bit(s) in D[19:19..17] are used to further resolve the
    pin number(s)." A 1-pin mode's pin field spans D[22:17]; an 8-pin mode takes its
    group from D[22:20] in 8-pin steps.

    The per-mode template is the d_19_16 column of
    architecture/streamer/modes-reference.yaml: a `p` marks a pin bit, a `0`/`1` marks
    a bit the mode template fixes.
  bits_free_by_width:
    - width: "1 pin"
      template: "%pppa"
      free_bits: "D[19:17]"
      base_alignment: "See pin_base_encoding.alignment_rule"
    - width: "2 pins"
      template: "%pp0a (2-pin + 2-DAC1) and %pp1a (2-pin + 1-DAC2)"
      free_bits: "D[19:18]; D[17] is 0 in the %pp0a template and 1 in the %pp1a template"
      base_alignment: "See pin_base_encoding.alignment_rule"
    - width: "4 pins"
      template: "%p00a (4-pin + 4-DAC1), %p01a (4-pin + 2-DAC2) and %p10a (4-pin + 1-DAC4)"
      free_bits: "D[19]; D[18:17] are 00, 01 or 10 according to the template"
      base_alignment: "See pin_base_encoding.alignment_rule"
    - width: "8 pins and wider"
      template: "In the 8-pin and wider pin and DAC modes, D[19:16] is fixed by the mode template. Other mode groups carry fields there: bbbb (the LUT base) in the immediate-to-LUT modes, %a in D[16] in the RFLONG-to-LUT modes, and a %p bit in D[19] in the DDS/Goertzel modes; each mode's template is in architecture/streamer/modes-reference.yaml (d_19_16)."
      free_bits: "none in the 8-pin and wider pin and DAC modes"
      base_alignment: "See pin_base_encoding.alignment_rule"
  one_pin_mapping:
    note: "In the 1-pin template %pppa, D[19:17] are all pin bits. Offsets are from the
      lowest pin of the groups %000..%100 in pin_groups.groups. Not documented: the
      offset order within the wrap-around groups %101..%111."
    "%000": "group base + 0"
    "%001": "group base + 1"
    "%010": "group base + 2"
    "%011": "group base + 3"
    "%100": "group base + 4"
    "%101": "group base + 5"
    "%110": "group base + 6"
    "%111": "group base + 7"
  what_a_misaligned_base_does: "In a 2-pin, 4-pin, 8-pin or wider mode, the low bits of a
    base that does not meet pin_base_encoding.alignment_rule fall in D[19:17], where the
    mode template holds its fixed bits. Composed with `|` they OR into those bits; composed
    with `+` they add into them and can carry into D[22:20]. Either way the word can select
    a different mode: an odd 2-pin base turns %pp0a (2-pin + 2-DAC1) into %pp1a (2-pin +
    1-DAC2). Both composition forms assemble; see pin_base_encoding below and
    architecture/streamer/modes-reference.yaml field_notation_caveat."
  source: "EF-105 (2-pin captures at each base in P32..P46, pairs 0 to 7, and 4-pin captures at the bases P32, P36, P40 and P44). EF-065, EF-059 (misaligned-base hazard bench-proven twice, in two different mode families). Parallax Propeller 2 Documentation v35 (Rev B/C silicon), STREAMER: \"In every mode,
    the three %ppp bits in D[22:20] select the pin group, in 8-pin increments\" and \"For
    modes which involve less than 8 pins, lower-order %p bit(s) in D[19:19..17] are
    used to further resolve the pin number(s)\". Per-width templates from the
    Parallax Propeller 2 Spin2 Language Documentation v55, Built-In Symbols for Streamer
    Modes -- X_1P_1DAC1_WFBYTE %1100_DDDD_WPPP_PPPA,
    X_2P_2DAC1_WFBYTE %1101_DDDD_WPPP_PP0A, X_4P_4DAC1_WFBYTE %1110_DDDD_WPPP_P00A,
    X_8P_4DAC2_WFBYTE %1110_DDDD_WPPP_0110. Hardware
    corroboration: EF-064 (1-pin mode reached P20 exactly) and EF-065 (an 8-pin mode
    at base 20 landed at P24..P31)."

# Enable control
enable_control:
  field: "D[23]"
  
  output_modes:
    bit_name: "%e"
    value_0: "Pin output disabled"
    value_1: "Pin output enabled"
    symbol_0: X_PINS_OFF
    symbol_1: X_PINS_ON
    what_it_enables: "the streamer's contribution to the pin's OUT side. The
      streamer's pin data is OR'd \"with {OUTB, OUTA} to produce the final 64 pin
      output states on each clock for the cog. For these modes, %e in D[23] must be
      '1' to enable pin output.\""
    dir_is_still_required: "%e enables the streamer's contribution to the pin's OUT
      side. A pin's output enable is controlled by its DIR bit, so the pin drives when
      DIR is high. In the tested X_PINS_ON command, DIR low left the pin undriven,
      and DIR high with OUT = 0 drove it."
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), STREAMER, for the
      OR rule and the %e requirement; EF-062 for the DIR result (one
      streamer command run twice, differing only in DIR: 4 of 8 pins with DIR low, a
      constant readback against an alternating expectation, and 8 of 8 with DIRH,
      against an 8-of-8 plain-drive control; the DIR-high leg started from OUT = 0)."

  input_modes:
    bit_name: "%w"
    value_0: "WRFAST disabled"
    value_1: "WRFAST enabled"
    symbol_0: X_WRITE_OFF
    symbol_1: X_WRITE_ON
    # Capture source: {INB, INA}
    what_is_read: "{INB, INA}. \"Initially, and on each subsequent NCO rollover, 1/2/4/8/16/32 pins
      are read from {INB, INA} and X3, X2, X1, and X0 are updated using the read data.\""
    widths: "1, 2, 4, 8, 16 or 32 pins, set by the mode -- see
      architecture/streamer/modes-reference.yaml, the %1100..%1111 capture block."
    what_is_written: "\"If the %w bit in D[23] is high, WFBYTE/WFWORD/WFLONG
      operations will be done automatically to record the pin data.\" Which of the
      three is used is fixed by the mode; the mode symbol names it (…_WFBYTE,
      …_WFWORD, …_WFLONG)."
    accrual_rule: "\"In the case of 1/2/4-pin modes, a WFBYTE will be done
      each time 8 bits of pin data accrue.\""
    bit_order_within_the_byte: "bottom-first by default; the %a bit in D[16] reorders
      to top-first. See alt_bit_order below."
    prerequisite: "A WRFAST must have been executed beforehand, from cog or LUT RAM (during hub execution the FIFO cannot be used for anything else).
      \"For WRFAST modes, it is necessary to do a WRFAST sometime beforehand,
      to ensure that the hub RAM FIFO is ready to receive data.\" WRFAST's D operand is
      the block count (0 = no wrapping) and its S operand is the hub start address."
    smart_pin_lane_content: "On a pin that is running a smart-pin
      mode, IN is the smart pin's event flag, so the capture records
      ready/done pulses. The mechanism, and
      the neighbour-routing composition that gets the waveform instead, are in
      architecture/streamer/pin-capture.yaml; the IN rule itself is in
      architecture/smart_pins.yaml in_signal_semantics."
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), STREAMER, Pins => DACs/WRFAST
      (the read source, the widths, the %w rule and the accrual rule), the %w statement and
      the bit-order rule in STREAMER, and the WRFAST prerequisite with the WRFAST operand
      definitions in HUB RAM, FAST SEQUENTIAL FIFO INTERFACE; the hub-execution limit in
      INSTRUCTION MODES, HUB EXECUTION."

# Alternate bit order
alt_bit_order:
  field: "D[16] (%a bit)"
  description: "Controls bit ordering for 1/2/4-bit modes"
  
  values:
    - value: "0"
      symbol: X_ALT_OFF
      order: "bottom-first within each byte (default)"
      
    - value: "1"
      symbol: X_ALT_ON
      order: "top-first within each byte"
      
  use_case: "The flash loader's 1-pin SPI output and input modes set %a for bytes-msb-first transfers ($4081_0008, $8081_0800 and $C081_0000, each + pin<<17)."
  scope: |
    Some modes that shift data have the %a bit in D[16]. The modes whose D[19:16] template
    ends in an a are the 1, 2 and 4-bit modes and the RFLONG 1/2/4-bit LUT modes; each
    mode's template is in the d_19_16 column of architecture/streamer/modes-reference.yaml.
  source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), STREAMER (the bottom-first and %a sentence; the mode table's D[19:16] templates); Parallax SPI Flash Programmer and Boot Loader v51, Data (bmode, rmode, wmode: 'bytes-msb-first')"

# Pin base calculation
pin_base_encoding:
  description: "D[22:20] selects the pin group in 8-pin increments; in modes of fewer
    than 8 pins, low-order %p bits in D[19:17] further resolve the pin number. How many
    of D[19:17] a mode leaves free depends on the pin width -- see
    sub_pin_selection.bits_free_by_width above."
  formula: "pin_base << 17"
  source: "alignment_rule: Parallax Propeller 2 Documentation v35 (Rev B/C silicon), STREAMER (the %ppp bits in D[22:20] select the pin group in 8-pin increments; for modes of fewer than 8 pins, lower-order %p bits in D[19:17] further resolve the pin number); Parallax Propeller 2 Spin2 Language Documentation v55, Built-In Symbols for Streamer Modes (the %PPPA, %PP0A, %PP1A, %P00A, %P01A and %P10A templates); EF-105 (2-pin captures at the even bases P32..P46 and 4-pin captures at P32, P36, P40 and P44 landed on their pins)"
  alignment_rule: "The mode template sets which of D[19:17] are pin bits, so it sets the
    base alignment. 1-pin modes (%pppa): D[22:17] all carry the pin, so any pin is a base.
    2-pin modes (%pp0a, %pp1a): the pin bits stop at D[18] and D[17] is fixed, so the base
    is an even pin. 4-pin modes (%p00a, %p01a, %p10a): the pin bits stop at D[19] and
    D[18:17] are fixed, so the base is a multiple of 4. 8 pins and wider: D[22:20] selects
    the pin group in 8-pin increments, so the base is a multiple of 8; a 32-pin DVI base is
    declared as hdmi_base = 16 with the comment 'must be a multiple of 8'. A base that does
    not meet its width's alignment puts its low bits on the template's fixed bits
    (what_a_misaligned_base_does)."
  composition_rule: "For X_IMM_4X8_1DAC8 + X_PINS_ON + 20<<17, the `+` carries bit 19
    into D[19:16] (template %1110 becomes %0110, X_IMM_4X8_4DAC2) and sets D[22:20] to
    %011 (P24..P31). The same expression composed with `|` instead of `+` gives the
    word of base 16."
  example: |
    ' 8-pin mode, base pin 16 (D[22:20] = %010)
    mode := X_RFBYTE_8P_1DAC8 | X_PINS_ON | (16<<17) | count
  what_goes_wrong_at_an_unaligned_base:
    with_plus: "`X_RFBYTE_8P_1DAC8 | X_PINS_ON + 20<<17 + $FFFF` assembles to
      $A0B6_FFFF, where base 16 assembles to $A0AE_FFFF. Bit 19 is already set by the
      mode template %1110, so the `+` carries: D[19:16] becomes %0110
      (X_RFBYTE_8P_4DAC2, a different mode) and D[22:20] becomes %011 (the P24..P31
      group)."
    with_or: "`X_RFBYTE_8P_1DAC8 | X_PINS_ON | (20<<17) | $FFFF` assembles to
      $A0AE_FFFF, the same word as the same expression with base 16. The
      misaligned bits set bits the template already sets, so the word selects
      P16..P23."
    both_forms_assemble: "Both forms assemble."
    source: "Command words above assembled with pnut-ts from the exact
      expressions shown. The mechanism is hardware-verified in a different mode family
      by EF-065 (X_IMM_4X8_1DAC8 + 20<<17 drove P24..P31 against an aligned control
      that drove P16..P23) and, in a third, by EF-059 (adc_pin<<17 in
      X_1ADC8_0P_1DAC8_WFBYTE changed the mode, proven by the bytes-per-rollover
      signature, 1,024 / 2,048 / 4,096 bytes at adc_pin 0 / 1 / 2)."

# Common pin configurations
common_configs:
  note: "four_pin_base_0 and spi_single_pin compose the base with `|`; dvi_base composes it with `+`."
  four_pin_base_0:
    description: "A 4-pin mode with base 0"
    code: "mode | (0<<17)"

  dvi_base:
    description: "Digital video (DVI/HDMI) output: the 32-pin mode words of the
      640x480 example carry hdmi_base<<17 (architecture/streamer/colorspace-and-dvi.yaml)"
    code: "$70810000 + hdmi_base<<17 + count"
    source: "Parallax Propeller 2 Documentation v35 (Rev B/C silicon), STREAMER, Digital Video Output (DVI/HDMI), Table 22 (CON hdmi_base = 16 'must be a multiple of 8'; the m_bs..m_vi longs; drvl #7<<6 + hdmi_base)"

  spi_single_pin:
    description: "SPI data on a single pin -- 1-pin mode, template %pppa"
    code: "X_RFBYTE_1P_1DAC1 | X_PINS_ON | X_ALT_ON | (pin<<17)"

