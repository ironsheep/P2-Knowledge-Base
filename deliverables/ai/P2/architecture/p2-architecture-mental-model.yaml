# P2 Architecture Mental Model - Agent Orientation Guide
# Source: Parallax Propeller 2 Documentation v35 (Rev B/C Silicon); Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01

concept: p2_architecture_mental_model
title: "P2 Architecture Mental Model for Code-Generating Agents"
category: architecture_orientation
priority: pre_read
source: "Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Smart Modes, p.33 (34 different autonomous functions); Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, Overview, p.8 (Spin2 interpreted code, methods and objects), COGS (Processors), p.14 (no compiler-driven or operating system-driven splitting of tasks), Hub RAM, pp.24-25 (block moves one long per clock cycle); Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), SMART PINS (%SSSSS mode table: sync serial, async serial, USB); Parallax Propeller 2 Documentation v35 (Rev B/C Silicon), COGS (first instruction after a branch: at least four clock cycles) and HUB EXECUTION; Parallax Propeller 2 (P2X8C4M64P) Datasheet 2022/11/01, Execution, p.14 (at least five clock cycles); P2 Instructions v35 Rev B/C Silicon, ADD/MOV/NOP rows (hub execution clocks: same as cog execution); Parallax Propeller 2 Spin2 Language Documentation v55, IN-LINE PASM CODE; EF-037 (one-long record publication)"
target_audience: "AI agents generating Spin2 or PASM2 code for the Parallax Propeller 2"

summary: |
  The Parallax Propeller 2 (P2) is not a single-threaded microcontroller. It is eight
  independent 32-bit processors (called COGs) on a single chip, sharing memory and I/O
  through hardware arbitration.

# =============================================================================
# CORE ARCHITECTURE
# =============================================================================

cog_independence: |
  Each COG is a complete 32-bit processor with its own 5-stage pipeline, 512 longs
  of private COG RAM, 512 longs of lookup RAM per cog (which the adjacent cog can write
  when enabled), a hardware call stack
  (8 levels), three interrupt levels, and a streamer (background transfers from
  hub RAM to pins/DACs, or from pins/ADCs to hub RAM). When the execution pipeline is full, each instruction effectively takes
  as little as 2 clocks. The cogs share the hub RAM and the I/O pins.

execution_models:
  overview: |
    A COG can run Spin2 or PASM2, and Spin2 and PASM2 COGs can run in one
    application.

  spin2_cog:
    description: |
      A Spin2 COG runs the Spin2 bytecode interpreter in its COG RAM, fetching and
      interpreting Spin2 bytecodes from hub memory. Spin2 COGs are launched with COGSPIN().
      Spin2 provides fast, interpreted code; its constructs are organized as methods grouped
      within reusable objects, and objects can include other objects.

  pasm2_cog:
    description: |
      A PASM2 COG runs native 32-bit assembly instructions directly. It can execute
      from COG RAM (cogexec), from LUT RAM, or from hub RAM (hubexec). When the
      execution pipeline is full, each instruction effectively takes as little as 2
      clocks. ALU instructions such as ADD, MOV and NOP take 2 clocks in hub execution,
      the same as in cog execution. Not documented: the clocks per sequential instruction
      in hub execution as a general rule. The cog employs the FIFO hardware to spool up
      instructions for hub execution, and a branch to a hub address takes a minimum of 13
      clocks. PASM2 COGs are launched with COGINIT().
    cog_ram_map: "COG RAM is 512 longs: $000-$1EF general-purpose, $1F0-$1F7 RAM that can also serve interrupt and call functions, $1F8-$1FF special-purpose registers; COGINIT loads $000..$1F7"
    rep_note: "REP repeats instructions without branching delays in cog/LUT memory (REP also works in hub memory, but executes a hidden jump to get back to the top of the repeated instructions)"
    first_instruction_after_branch: "Branch instructions cause the pipeline to be flushed, so the first instruction following the branch takes at least four clock cycles. Parallax's documents also give at least five clock cycles."

  inline_pasm2:
    description: |
      A Spin2 method can execute in-line PASM code either in cog registers
      (ORG ... END, assembled by default into $000..$11F, the free cog registers) or
      directly in hub RAM (ORGH ... END, subject to the hub-exec limitations).
    limit: "ORG inline code area: cog registers $000..$11F (defaults: start $000, limit $120). In-line PASM code can access the first 16 longs of parameters, results and locals, via registers with the same symbolic names. A RET is added at the end of the PASM code."
    overhead: "Not documented: the entry and exit overhead"
    capabilities: "In-line PASM code can read and write registers $1F0..$1FF (IJMP3, IRET3, IJMP2, IRET2, IJMP1, IRET1, PA, PB, PTRA, PTRB, DIRA, DIRB, OUTA, OUTB, INA, INB) and the registers PR0..PR7. With ORG it can also use the FIFO temporarily (RDFAST/WRFAST and RFxxxx/WFxxxx), use the streamer, use RES, ORGF and FIT, establish an interrupt service routine that remains in registers, and use up to 5 levels of the hardware stack for nested CALLs. With ORGH, hub-exec limitations apply (no RDFAST, XINIT, etc.)."
    pasm_not_in_hub_exec_note: "ORGH in-line code executes straight from hub RAM and loads no code into cog registers."

# =============================================================================
# SHARED RESOURCES
# =============================================================================

shared_resources:
  overview: |
    Hub RAM access waits for the cog's slice (up to #cogs-1 clocks for the initial slice).
    Sharing is managed by the hub's fixed slice rotation.

  egg_beater:
    description: |
      Hub RAM (512 KB) is shared through a round-robin mechanism called the "Egg
      Beater"; a CORDIC command is handed off on the cog's hub slot. Each COG gets
      access once every eight clock cycles. A hub read (RDBYTE/RDWORD/RDLONG) takes
      9...16 clocks and a hub write (WRBYTE/WRWORD/WRLONG) 3...10 clocks from cog-exec code
      (9...26 and 3...20 from hub-exec code), depending on when the COG's slot arrives.
      RDWORD, RDLONG, WRWORD and WRLONG take +1 clock if they cross a hub long boundary.
      Fast block moves (SETQ or SETQ2 before RDLONG/WRLONG/WMLONG) read or write a sequential
      series of longs at one per clock cycle, after the initial wait of up to #cogs-1 clocks.
    timing:
      read_cog_exec: "9...16 clocks (RDLONG; +1 if the long crosses a hub long boundary)"
      write_cog_exec: "3...10 clocks (WRLONG; +1 if the long crosses a hub long boundary)"
      batch_transfer: "Fast block moves: longs at one per clock cycle after the initial wait"
      rotation_period: "8 clocks"

  cordic:
    description: |
      The CORDIC solver is a 54-stage pipelined math engine shared through the same
      hub rotation. It provides hardware multiply (32x32->64), divide (64/32),
      square root, trigonometric functions, vector rotation, and logarithm/exponential.
      Because each COG's hub slot comes around every 8 clocks and the pipeline is 54 clocks
      long, CORDIC commands can be overlapped: several commands are given to the solver,
      then results are read and another command is given, indefinitely, until the trailing
      results are read. Not documented: the number of commands that can be overlapped.
    latency: "55 clocks from command to result"
    throughput: "Cogs can start CORDIC operations every #cogs clocks (8 for the P2X8C4M64P); each cog's hub slot comes around every 8 clocks"

# =============================================================================
# INTER-COG COMMUNICATION
# =============================================================================

inter_cog_communication:
  overview: |
    COGs coordinate through hub RAM, locks, COGATN attention signaling and LUT RAM sharing.

  hub_ram:
    description: "512 KB shared memory"
    single_access: "In any given hub access window, a cog can perform a single atomic operation on a single entity, such as writing a value to one hub RAM location. Where an atomic operation is not intrinsically possible, as with a block of hub RAM locations, cogs share access cooperatively with lock bits. Not documented: whether a word or long that crosses a hub long boundary is one atomic operation."
    source: "single_access: Propeller 2 P2X8C4M64P Hardware Manual Nov 1, 2022 Release, HUB, p.24 (a given cog receives access once every eight clock cycles; in any given Hub Access Window a cog can perform a single atomic operation on a single entity); Parallax Propeller 2 Documentation v35 (Rev B/C silicon), LOCKS (locks can be used by cogs to coordinate exclusive access of a shared resource; cooperative cogs use LOCKTRY and LOCKREL)"
    atomicity: "In Spin2, a record kept as a struct with member bitfields packed into one long is read without torn snapshots when it is staged in a private local, published with one whole-struct store and read with one whole-struct load. When the same fields are written one at a time straight into the shared long, each bitfield write is a read-modify-write of the backing long and a reader sees torn snapshots. This holds for that Spin2 struct case under those tested conditions; it says nothing about PASM single-long operations."

  locks:
    count: 16
    description: "A pool of 16 semaphore bits, called locks, in the hub; cogs use locks to coordinate exclusive access of a shared resource"
    note: "With WC, LOCKTRY sets C = 1 if the lock was taken and C = 0 if it was not taken"

  cogatn:
    description: |
      Attention signaling -- COGATN signals any combination of cogs (D[15:0], bit n = cog n; Parallax's documents also give the lower 8 bits).

  lut_sharing:
    description: |
      Adjacent COG pairs (0-1, 2-3, 4-5, 6-7) can share LUT RAM.

  pin_io:
    description: |
      All COGs can access all 64 pins. How the DIR and OUT bits of several cogs
      combine at one pin, with the bench results that qualify the documents' "OR'd"
      wording: architecture/smart_pins.yaml pin_output_hierarchy.

# =============================================================================
# SMART PINS
# =============================================================================

smart_pins:
  description: |
    Each of the 64 I/O pins has built-in smart pin circuitry which performs one of 34
    different autonomous functions (the smart pin mode field is 5 bits, %SSSSS): serial modes (synchronous serial, asynchronous serial, USB), PWM generation, ADC/DAC conversion,
    counting, timing, NCO/frequency synthesis, and quadrature decoding. Smart pins
    free the cogs from the need to micromanage many I/O operations by providing
    high-bandwidth concurrent hardware functions.
  count: 64
  modes: "34 different autonomous functions; 5-bit mode field %SSSSS"
  configure_sequence: |
    A smart pin is configured while its DIR bit is low, holding it in reset. During
    that time, WRPIN/WXPIN/WYPIN establish the mode and related parameters. Once
    configured, DIR can be raised high and the smart pin begins operating. Making
    its DIR bit low resets it without losing the configuration set by the last WRPIN.
    'WRPIN #0,pin' returns a pin to normal mode.

# =============================================================================
# CODE GENERATION IMPLICATIONS
# =============================================================================

code_generation_guidelines:
  - guideline: "memory_map"
    rule: |
      COG RAM is 512 longs ($000-$1EF general-purpose, $1F0-$1F7 dual-purpose RAM,
      $1F8-$1FF special-purpose registers). Hub execution (ORGH) runs from hub
      addresses $00400..$FFFFF (Parallax's documents also give $7FFFF as the top of the
      range). LUT RAM is 512 longs.

  - guideline: "independent_cores"
    rule: |
      The application developer has full control over how and when each cog is
      employed; there is no compiler-driven or operating system-driven splitting of
      tasks between multiple cogs.

  - guideline: "hub_access_timing"
    rule: |
      Hub access waits (up to #cogs-1 clocks for the initial slice) differ with each
      cog's position in the rotation. Hub addresses are byte addresses.

