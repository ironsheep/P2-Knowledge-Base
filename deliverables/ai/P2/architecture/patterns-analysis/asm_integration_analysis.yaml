implementation_template: |
  CON
    PIN_OUTPUT = 56

  PUB fast_operation(value1, value2) : result
    ' Critical section in inline PASM (ORG..END runs as cog-exec).
    ' Method params/result map directly to cog registers — reference them
    ' by NAME: value1 = PR0, value2 = PR1, result overlaps PR0. Do NOT load
    ' parameters through PTRA/PTRB.
    ORG
      ADD   value1, value2        ' value1 += value2
      SHL   value1, #2            ' scale by 4
      MOV   result, value1        ' return the scaled sum
    END

  PUB timing_critical_task()
    ' Cycle-accurate pulse — deterministic cog-exec timing.
    ORG
      DRVH  #PIN_OUTPUT
      WAITX ##1_000_000           ' precise hold
      DRVL  #PIN_OUTPUT
    END

