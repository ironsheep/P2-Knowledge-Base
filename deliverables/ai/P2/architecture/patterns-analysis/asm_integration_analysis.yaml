compiler_note: >
  Inline PASM in this KB uses the Parallax pnut_ts / PNut syntax: ORG ... END
  inside a PUB/PRI method. The asm ... endasm form is FlexSpin (fastspin)
  syntax — it will NOT compile with pnut_ts, so do not use it in P2KB example
  code. Inside the block, method parameters, the return value, and locals are
  addressed by NAME (first param = PR0, second = PR1, return overlaps PR0);
  do not route them through PTRA/PTRB. Example above compile-verified with pnut_ts.

