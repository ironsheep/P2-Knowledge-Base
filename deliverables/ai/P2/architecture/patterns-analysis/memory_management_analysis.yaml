# Memory Management — SUPERSEDED & CORRECTED (decomposition layer, KB v1.7.0)
#
# This pattern-analysis file predates the decomposition reasoning layer AND
# was substantively incorrect for the P2: it described a heap with
# malloc/free-style dynamic allocation and garbage collection. The P2 has
# NO heap and no runtime allocator — memory is statically partitioned across
# hub RAM, the eight cogs' register space, and LUT RAM, decided at design
# time. The "how much can I afford" question it gestured at is the resource
# budget. Retained as a corrective stub so existing references keep resolving
# (Sacred Rule #7: redirect, never delete) and so no agent is steered toward
# a heap that does not exist. The original (incorrect) content is in git
# history; the defect is logged in the correction-findings register.
#
# The `category` field was removed: the original "hardware_utilization"
# tag mislabeled content that does not describe real P2 hardware behavior.

pattern_id: "memory_management"
status: "superseded-corrected"
superseded_by: "decomposition reasoning layer (architecture/decomposition/)"

correction: >
  The P2 has no heap, no malloc/free, and no garbage collection. Memory is
  statically allocated: hub RAM (shared), each cog's 512-long register space
  plus 512-long LUT, decided at design time. Treat memory as a fixed budget
  to spend, not a pool to allocate from at runtime.

see_also:
  - "Counting fixed hub/cog/LUT memory against the resource budget: p2kbArchResourceBudget"
