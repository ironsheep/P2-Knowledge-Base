# ENH-03 compile manifest. LEGALITY ONLY: a pass proves pnut-ts accepts the block in the
# context declared here, never that the code is correct (F-381, F-312).
blocks:
  - at: syntax
    fp: "b8cb76cdc344bbaf"
    compile: not-code
    reason: "`syntax:` TEMPLATE: the words `expression`, `value1`, `statements` are placeholders for user parts (not names of anything), so the block is not a compilable statement; the page's concrete form is its `examples:` entry"
  - at: examples[0]
    fp: "534e4f780b01dc60"
    compile: fragment
    wrap: spin2-method
    assumes: [status, handle_success()->1/0, handle_error()->1/0]
