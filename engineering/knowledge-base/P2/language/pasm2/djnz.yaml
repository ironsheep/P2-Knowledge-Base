instruction: DJNZ
syntax: DJNZ    D,{#}S
category: Branch
description: >-
  DJNZ decrements the value in Dest, writes the result, and jumps to the address
  described by Src if the result is NOT zero.

  This is one of the most commonly used loop instructions. Use # prefix on Src for
  relative addressing (typical usage); omit # for absolute addressing.
result: >-
  Dest is decremented. If the result is not zero, PC is set to a new relative (#Src)
  or absolute (Src) address; otherwise execution continues with the next instruction.
parameters:
- 'Src is a register, 9-bit literal, or 20-bit augmented literal whose value is the
  absolute or relative address to set PC to. Use # for relative addressing; omit #
  for absolute addressing.'
flags_affected:
  C:
    formula: not affected
  Z:
    formula: not affected
timing:
  cycles: 2
  type: variable
  range: 13...20
encoding:
- bits: EEEE 1011011 01I DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: 2 or 4
encoding_notes:
- Dest is always written; PC is written only when the result in Dest is zero (or not
  zero in syntax 2).
documentation_source: PASM2 Manual 2022/11/01
documentation_level: comprehensive
compiler_operand_format:
  name: operand_dsj
  pattern: D,S/@
  description: 'Jump with destination and relative address: register, relative address'
  valueType: 12
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 12
