instruction: DIRNZ
syntax: DIRNZ   {#}D           {WCZ}
category: Pin
description: 'DIRZ or DIRNZ alters the direction register''s bit(s) designated by
  Dest to equal the state, or inverse state, of the Z Result: The I/O pin direction
  bit(s), described by Dest, are set to output/input according to Z or !Z; the rest
  are left as-is. Z = DIR bit.'
parameters:
- Dest is the register, 9-bit literal, or 11-bit augmented literal whose value identifies
  the I/O pin(s) to set to output or input.
- WCZ is an optional effect to update flags.
flags_affected:
  Z:
    formula: DIR bit
timing:
  cycles: 2
  type: fixed
encoding:
- bits: EEEE 1101011 CZL DDDDDDDDD 001000101
  write: DIRx
  c: —
  z: DIR bit
  clocks: '2'
documentation_source: PASM2 Manual 2022/11/01
documentation_level: comprehensive
compiler_operand_format:
  name: operand_pinop
  pattern: D/#0..511 {WC/WZ}
  description: 'Pin operation: destination/immediate pin number 0-511, optional effect
    flags'
  valueType: 30
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 30
