instruction: ONES
syntax: ONES Dest, {#}Src {WC|WZ|WCZ}
encoding:
- EEEE 0111101 CZI DDDDDDDDD SSSSSSSSS                    D           Result is odd        Result
  = 0                2
- EEEE 0111101 CZ0 DDDDDDDDD DDDDDDDDD                    D           Result is odd        Result
  = 0                2
- EEEE 1101011 CZL DDDDDDDDD 001001010                  OUTx       Orig OUTx base
  bit Orig OUTx base bit             2
- EEEE 1101011 CZL DDDDDDDDD 001001011                  OUTx       Orig OUTx base
  bit Orig OUTx base bit             2
- EEEE 1101011 CZL DDDDDDDDD 001001001                 OUTx        Orig OUTx base
