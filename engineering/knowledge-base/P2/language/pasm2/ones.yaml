timing:
  cycles: 2
  type: fixed
description: 'ONES tallies the number of high bits of Src, or Dest, and stores the
  count into Dest. Result: The number of high bits in Src, or Dest, is stored in Dest.


  ONES tallies the number of high bits of Src, or Dest, and stores the count into
  Dest.


  If the WC or WCZ effect is specified, the C flag is set (1) if the count is odd,
  or is cleared (0) if it is even.


  If the WZ or WCZ effect is specified, the Z flag is set (1) if the result equals
  zero, or is cleared (0) if not zero.


  OUTC / OUTNC


  Output C or not C


  I/O Pin Instruction - Set pin(s) output level to low/high according to C or !C.


  OUTC    {#}Dest {WCZ}


  OUTNC {#}Dest {WCZ}


  Result: The I/O pin output level bit(s), described by Dest, are set to low/high
  according to C or !C; the rest are left


  as-is.


  *   Dest is the register, 9-bit literal, or 11-bit augmented literal whose value
  identifies the I/O pin(s) for which


  output levels are to be set low or high.


  *   WCZ is an optional effect to update flags.


  COND INSTR         FX     DEST          SRC           Write             C Flag             Z
  Flag                 Clocks


  EEEE 1101011 CZL DDDDDDDDD 001001010                  OUTx       Orig OUTx base
  bit Orig OUTx base bit             2


  EEEE 1101011 CZL DDDDDDDDD 001001011                  OUTx       Orig OUTx base
  bit Orig OUTx base bit             2


  OUTC or OUTNC alters the output level register''s bit(s) designated by Dest to equal
  the state, or inverse state, of


  the C flag; i.e. set pin''s output level low or high. All other bits (pins) are
  left unchanged. Each of these


  instructions, OUTC and OUTNC, can affect one or more of the bits within the OUTA
  or OUTB registers.


  Dest[5:0] indicates the pin number (0-63). For a range of pins, Dest[5:0] indicates
  the base pin number (0-63)


  and Dest[10:6] indicates how many contiguous pins beyond the base should be affected
  (1-31).


  A 9-bit literal Dest is enough to express the base pin (Dest[5:0]) and a range of
  up to 8 contiguous pins (Dest[8:6]).


  If needed, use the augmented literal feature (##Dest) to augment Dest to an 11-bit
  literal value-- this inserts an


  AUGD instruction prior.


  When Dest is a register, the register''s value bits [10:0] are used as-is to form
  the 11-bit ID range, unless a SETQ


  instruction immediately precedes the OUTC / OUTNC instruction; substituting SETQ''s
  Dest[4:0] in place of value


  bits[10:6], for OUTC / OUTNC''s use.


  The range calculation (from Dest[5:0] up to Dest[5:0]+Dest[10:6]) will wrap within
  the same 32-pin group (OUTA or


  OUTB); it will not cross the port boundary.


  If the WCZ effect is specified, the C and Z flags are updated to the original state
  of OUTA / OUTB''s base bit,


  identified by Dest.


  OUTH / OUTL


  Output high or low


  I/O Pin Instruction - Set pin(s) output level to high (1) or low (0).


  OUTH {#}Dest {WCZ}


  OUTL {#}Dest {WCZ}


  Result: The I/O pin output level bit(s), described by Dest, are set high (1) or
  low (0); the rest are left as-is.


  *   Dest is the register, 9-bit literal, or 11-bit augmented literal whose value
  identifies the I/O pin(s) to set high


  or low.


  *   WCZ is an optional effect to update flags.


  COND INSTR         FX     DEST          SRC           Write             C Flag            Z
  Flag              Clocks


  EEEE 1101011 CZL DDDDDDDDD 001001001                 OUTx        Orig OUTx base
  bit Orig OUTx base bit             2


  EEEE 1101011 CZL DDDDDDDDD 001001000                 OUTx        Orig OUTx base
  bit Orig OUTx base bit             2


  OUTH or OUTL alters the output level register''s bit(s) designated by Dest to be
  high (1) or low (0). All other bits


  (pins) are left unchanged. Each of these instructions, OUTH and OUTL, can affect
  one or more of the bits within


  the OUTA or OUTB registers.


  Dest[5:0] indicates the pin number (0-63). For a range of pins, Dest[5:0] indicates
  the base pin number (0-63)


  and Dest[10:6] indicates how many contiguous pins beyond the base should be affected
  (1-31).


  A 9-bit literal Dest is enough to express the base pin (Dest[5:0]) and a range of
  up to 8 contiguous pins (Dest[8:6]).


  If needed, use the augmented literal feature (##Dest) to augment Dest to an 11-bit
  literal value-- this inserts an


  AUGD instruction prior.


  When Dest is a register, the register''s value bits [10:0] are used as-is to form
  the 11-bit ID range, unless a SETQ


  instruction immediately precedes the OUTH / OUTL instruction; substituting SETQ''s
  Dest[4:0] in place of value


  bits[10:6], for OUTH / OUTL''s use.


  The range calculation (from Dest[5:0] up to Dest[5:0]+Dest[10:6]) will wrap within
  the same 32-pin group (OUTA or


  OUTB); it will not cross the port boundary.


  If the WCZ effect is specified, the C and Z flags are updated to the original state
  of OUTA / OUTB''s base bit,


  identified by Dest.'
flags_affected:
  Z: Result = 0
parameters:
- Dest is the register in which to store the number of high bits found and optionally
  it begins by containing the value to check (syntax 2).
- Src is an optional register, 9-bit literal, or 32-bit augmented literal whose value
  is to be checked for ones.
- WC, WZ, or WCZ are optional effects to update flags.
- Dest is the register, 9-bit literal, or 11-bit augmented literal whose value identifies
  the I/O pin(s) for which output levels are to be set low or high.
- WCZ is an optional effect to update flags.
- Dest is the register, 9-bit literal, or 11-bit augmented literal whose value identifies
  the I/O pin(s) to set high or low.
- WCZ is an optional effect to update flags.
