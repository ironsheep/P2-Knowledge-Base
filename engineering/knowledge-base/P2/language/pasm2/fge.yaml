instruction: FGE
syntax: FGE Dest, {#}Src {WC|WZ|WCZ}
brief_description: Force greater or equal
category: Math and Logic
description: 'FGE sets unsigned Dest to unsigned Src if Dest is less than Src. This
  is also known as a limit minimum function; Result: Unsigned Dest is set to unsigned
  Src if Dest was less than Src. Optionally the C and Z flag indicates if the replacement
  happened and the zero status of the result.


  FGE sets unsigned Dest to unsigned Src if Dest is less than Src. This is also known
  as a limit minimum function;


  preventing Dest from sinking below Src.


  If the WC or WCZ effect is specified, the C flag is set (1) if Dest was limited
  (Dest was less than Src and now Dest is


  equal to Src), or is cleared (0) if not limited.


  If the WZ or WCZ effect is specified, the Z flag is set (1) if the result is zero,
  or is cleared (0) if it is non-zero.'
result: Unsigned Dest is set to unsigned Src if Dest was less than Src. Optionally
  the C and Z flag indicates if the
parameters:
- Dest is a register containing the unsigned value to limit to a minimum of unsigned
  Src, and is where the result is written.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose unsigned value
  is the lower limit to force upon Dest.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  Z: Result = 0
syntax_variants:
- FGE Dest, {#}Src {WC|WZ|WCZ}
- FGE sets unsigned Dest to unsigned Src if Dest is less than Src. This is also known
  as a limit minimum function;
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 0011000 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: limit enforced
  z: Result = 0
  clocks: '2'
