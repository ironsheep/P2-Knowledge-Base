    - "Full PASM2 instruction reference - for detailed documentation"
  
  advanced_features:
    - "Smart Pin modes - autonomous hardware operations"
    - "CORDIC solver - math coprocessor functions"
    - "Streamer - high-speed pin sequencing"
    - "Multi-COG programming - parallel processing"

