instruction: CMPM
syntax: CMPM Dest, {#}Src {WC|WZ|WCZ}
brief_description: Compare most significant bit
category: Math and Logic
description: CMPM compares the unsigned values of Dest and Src (by subtracting Src from Dest) and optionally setting the C and Z flags accordingly. If the WC or WCZ effect is specified, the C flag is updated to the MSB (bit 31) of (Dest - Src). If the WZ or WCZ effect is specified, the Z flag is set (1) if Dest equals Src.
result: Greater/lesser and equality status is optionally written to the C and Z flags.
parameters:
- Dest is the register containing the value to compare with that of Src.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value is compared to Dest.
flags_affected:
  C: Set to MSB of (D - S), i.e., Result[31]
  Z: Set if D == S
syntax_variants:
- CMPM Dest, {#}Src {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 0010101 CZI DDDDDDDDD SSSSSSSSS
  write: —
  c: Result[31]
  z: D=S
  clocks: '2'
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
