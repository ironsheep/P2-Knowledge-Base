instruction: MODCZ
syntax: MODCZ   c,z      {WC/WZ/WCZ}
category: Math and Logic
description: 'MODC, MODZ, or MODCZ sets or clears the C and/or Z flag based on the
  mode described by the given Modifier Result: The C and/or Z flag is set or cleared
  according to the given Modifier and the current state of the C and/or Z flags. C
  = cccc[{C,Z}], Z = zzzz[{C,Z}].'
parameters:
- CModifer is a Modifier symbol for the designated mode to apply to the C flag.
- ZModifer is a Modifier symbol for the designated mode to apply to the Z flag.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C:
    formula: cccc[{C,Z}], Z = zzzz[{C,Z}]
  Z:
    formula: zzzz[{C,Z}]
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 1101011 C01 0cccc0000 001101111
  write: —
  c: C=cccc[{C,Z}]
  z: —
  clocks: '2'
- bits: EEEE 1101011 0Z1 00000zzzz 001101111
  write: —
  c: —
  z: Z=zzzz[{C,Z}]
  clocks: '2'
- bits: EEEE 1101011 CZ1 0cccczzzz 001101111
  write: —
  c: C=cccc[{C,Z}]
  z: Z=zzzz[{C,Z}]
  clocks: '2'
documentation_source: PASM2 Manual 2022/11/01
documentation_level: comprehensive
