instruction: BITC
syntax: BITC    D,{#}S         {WCZ}
encoding:
- bits: EEEE 0100010 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: original D[S[4:0]]
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: BITC alters the Dest bit(s) designated by Src to equal the state of the C flag. Dest bit(s) described by Src are set to C; the rest are left as-is. If WCZ is specified, the Z flag is updated to the original state of the target bit.
flags_affected:
  C: No effect
  Z: Set to original D[S[4:0]] (original state of target bit)
documentation_source: PASM2 Manual 2022/11/01
documentation_level: comprehensive
compiler_operand_format:
  name: operand_bitx
  pattern: D,S/#
  description: 'Bit manipulation with optional effect flags: Destination register,
    bit position'
  valueType: 1
compiler_encoding:
  operandFormat: 1
enhancement_source: PNUT_TS_v2.0_complete_operand_integration_2025-09-13
parameters:
- Dest is the register whose value will have one or more bits set to C.
- Src is a register, 9-bit literal, or 10-bit augmented literal whose value identifies the bit(s) to modify.
last_updated: '2025-09-19T16:04:17.389666'
category: Math and Logic
oneliner: Set bit(s) low/high according to C or !C
