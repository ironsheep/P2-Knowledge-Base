instruction: ADDCT3
syntax: ADDCT3 Dest, {#}Src
brief_description: Add and set CT3 event trigger
category: Event
description: Set CT3 event to trigger on CT = D + S. ADDCT3 sets the hidden CT3 event trigger register to the value of Dest + Src. The result is also written to Dest. Use the POLLCT3, WAITCT3, JCT3, and JNCT3 instructions to process CT3 time-based events.
flags_affected:
  C: No effect
  Z: No effect
result: The Src value is added into Dest and the result is also stored in the hidden CT3 event trigger register.
parameters:
- Dest is a register containing the value to add Src to, and is where the result is
  written.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value is added
  into Dest.
syntax_variants:
- ADDCT3 Dest, {#}Src
timing:
  cycles: 2
  type: fixed
encoding:
- bits: EEEE 1010011 10I DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2'
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_ds
  pattern: D,S/#
  description: Destination register, Source register or immediate value
  valueType: 0
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 0
enhancement_source: PNUT_TS_v2.0_complete_operand_integration_2025-09-13
last_updated: '2025-09-19'
manual_extraction_date: '2025-01-19'
oneliner: Set CT3 counter event trigger time
long_description: The Src value is added into Dest and the result is also stored in the hidden CT3 event trigger register. The event triggers when System Counter (CT) = original Dest + Src.
related:
- POLLCTx
- WAITCTx
- JCTx
- JNCTx
