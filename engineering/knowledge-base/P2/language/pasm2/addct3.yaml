last_updated: '2025-09-19'
manual_extraction_date: '2025-01-19'
oneliner: Set one of three counter events' trigger time
long_description: 'The Src value is added into Dest and the result is also stored
  in the hidden CT1, CT2, or CT3 event trigger

  register. The event triggers when System Counter (CT) = original Dest + Src.'
