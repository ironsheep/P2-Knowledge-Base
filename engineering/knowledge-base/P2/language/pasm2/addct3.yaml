instruction: ADDCT3
syntax: ADDCT1 Dest, {#}Src
brief_description: Add counter 1/2/3
category: Event
description: 'Set CT3 event to trigger on CT = D + S. Adds S into D.


  ADDCT1, ADDCT2, or ADDCT3 sets the hidden CT1, CT2, or CT3 event trigger register
  (respectively) to the value of


  Dest + Src. The result is also written to Dest.


  Use the xxxxCTx Event Handling instructions to process time-based events.'
result: The Src value is added into Dest and the result is also stored in the hidden
  CT1, CT2, or CT3 event trigger
parameters:
- Dest is a register containing the value to add Src to, and is where the result is
  written.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value is added
  into Dest.
syntax_variants:
- ADDCT1 Dest, {#}Src
- ADDCT2 Dest, {#}Src
- ADDCT3 Dest, {#}Src
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 1010011 00I DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2'
- bits: EEEE 1010011 01I DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2'
- bits: EEEE 1010011 10I DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2'
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_ds
  pattern: D,S/#
  description: Destination register, Source register or immediate value
  valueType: 0
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 0
