instruction: ALTSN
syntax: ALTSN Dest, {#}Src
brief_description: Alter set nibble
category: Register Indirection
description: 'ALTSN should be followed by SETNIB-- it modifies the SETNIB instruction''s Dest and Num values, enabling code to iterate through multiple nibbles of data across a range of Reg RAM. SETNIB''s Dest value is changed to (Src + Dest[11:3]) & $1FF (for syntax 1), or to Dest[11:3] (for syntax 2), and its Num value is changed to Dest[2:0]. Dest[11:3] corresponds to the target long register''s 9-bit address and Dest[2:0] is the nibble ID within it; values of 0-7 identify individual nibbles, by position, in least-significant nibble order. Iteratively executing ALTSN followed by SETNIB, and each time incrementing ALTSN''s 12-bit Dest value by one, effectively writes a stream of nibble values to Reg RAM as if it were all made of nibble-sized registers. In syntax 1, Src consists of two 9-bit fields; a base address (Src[8:0]) and a signed auto-indexer (Src[17:9]). The base is the Reg RAM address where the series of nibbles begins. ALTSN adds the long index (Dest[11:3]) to the base (Src[8:0]) to locate the register holding the target nibble. The nibble ID (Dest[2:0]) identifies the nibble''s position within that long register. At the end of ALTSN execution, the optional auto-indexer value (usually 0, 1, or -1) is added to the 12-bit index (Dest) for a future ALTSN+SETNIB iteration. In syntax 2, Dest serves as the full nibble address-- it''s the same format as in syntax 1, but represents the target long''s absolute address and its nibble index instead of the long''s relative index (to add to a base) and nibble index.'
result: The next instruction's pipelined Dest and Num values are altered to be (Src + Dest[11:3]) & $1FF, or just Dest[11:3] for syntax 2, and Dest[2:0], respectively.
parameters:
- Dest is the register whose 12-bit value is the index, or the full nibble address, for the SETNIB instruction to operate on.
- Src is an optional register, 9-bit literal, or 18-bit augmented literal whose value contains a base long address (Src[8:0]; added to index (Dest[11:3]) for SETNIB) and also an optional auto-indexer value (Src[17:9]; added to Dest at the end of execution).
syntax_variants:
- ALTSN Dest, {#}Src
- ALTSN Dest
usage_notes: 'The instruction following ALTSN is shielded from interrupt

  ALTSN alters the next instruction regardless of its kind-- the intention is for
  it to be a SETNIB

  Field value modification occurs in the instruction pipeline only; code is not altered,
  values do not persist

  SETQ / SETQ2 does not affect ALTx instructions-- the Q value passes through to the
  next instruction'
timing:
  cycles: 1
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 1001010 10I DDDDDDDDD SSSSSSSSS
  write: D 1
  c: —
  z: —
  clocks: '2'
- bits: EEEE 1001010 101 DDDDDDDDD 000000000
  write: D 1
  c: —
  z: —
  clocks: '2'
encoding_notes:
- Dest is post-adjusted by the auto-indexer value; the sign-extended Src[17:9]. In
  syntax 2, the auto-indexer value is 0.
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
