instruction: ADDPIX
syntax: ADDPIX Dest, {#}Src
brief_description: Add pixels
category: Pixel Mixer
description: ADDPIX sums individual RGB (red, green, blue) color values of Src into that of Dest and stores the result in the Dest register. Each byte is saturated to prevent wraparound.
result: Src color value bytes are added into Dest color value bytes with full saturation.
parameters:
- Dest is a register containing the RGB color value to add Src to, and is where the
  result is written.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose RGB color value
  bytes are added into Dest.
flags_affected:
  C: No effect
  Z: No effect
syntax_variants:
- ADDPIX Dest, {#}Src
timing:
  cycles: 7
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 1010010 00I DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '7'
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
