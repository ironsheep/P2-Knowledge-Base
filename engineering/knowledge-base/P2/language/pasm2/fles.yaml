instruction: FLES
syntax: FLES Dest, {#}Src {WC|WZ|WCZ}
encoding:
- EEEE 0011011 CZI DDDDDDDDD SSSSSSSSS                       D        limit enforced        Result
  = 0              2
- EEEE 1101011 CZL DDDDDDDDD 001010010 DIRx + OUTx Orig OUTx base bit Orig OUTx base
  bit
- EEEE 1101011 CZL DDDDDDDDD 001010001 DIRx + OUTx Orig OUTx base bit Orig OUTx base
  bit
timing:
  cycles: 2
  type: fixed
description: 'FLES sets signed Dest to signed Src if Dest is greater than Src. This
  is also known as a limit maximum function; Result: Signed Dest is set to signed
  Src if Dest was greater than Src. Optionally the C and Z flag indicates if the replacement
  happened and the zero status of the result.


  FLES sets signed Dest to signed Src if Dest is greater than Src. This is also known
  as a limit maximum function;


  preventing Dest from rising above Src.


  If the WC or WCZ effect is specified, the C flag is set (1) if Dest was limited
  (Dest was greater than Src and now


  Dest is equal to Src), or is cleared (0) if not limited.


  If the WZ or WCZ effect is specified, the Z flag is set (1) if the result is zero,
  or is cleared (0) if it is non-zero.


  FLTC / FLTNC


  Float C or not C


  I/O Pin Instruction - Set pin(s) direction to input and an output level of low/high
  according to C.


  FLTC       {#}Dest {WCZ}


  FLTNC {#}Dest {WCZ}


  Result: The I/O pins described by Dest are set to the input direction and to an
  output level of low/high according


  to C or !C; the rest are left as-is.


  *   Dest is the register, 9-bit literal, or 11-bit augmented literal whose value
  identifies the I/O pin(s) to set to


  input direction and output levels of low or high.


  *   WCZ is an optional effect to update flags.


  COND INSTR            FX     DEST          SRC            Write             C Flag             Z
  Flag              Clocks


  EEEE 1101011 CZL DDDDDDDDD 001010010 DIRx + OUTx Orig OUTx base bit Orig OUTx base
  bit


  1


  2


  EEEE 1101011 CZL DDDDDDDDD 001010011 DIRx + OUTx Orig OUTx base bit Orig OUTx base
  bit


  1


  2


  1


  New DIRx state is not data-forwarded; the next pipelined instruction sees the old
  state. Make sure any instruction that reads


  or modifies DIRx is at least two instructions after a FLTC or FLTNC.


  FLTC or FLTNC sets the I/O pin(s) designated by Dest to the input direction and
  to a low/high output level


  according to the state, or inverse state, of the C flag; i.e. alters the pin''s
  direction and output registers. All other


  pins are left unchanged. Each of these instructions, FLTC and FLTNC, can affect
  one or more of the bits within


  the DIRA or DIRB and OUTA or OUTB registers.


  FLTC or FLTNC achieves the same effect as two instructions-- DIRL followed by OUTC
  or OUTNC.


  Dest[5:0] indicates the pin number (0-63). For a range of pins, Dest[5:0] indicates
  the base pin number (0-63)


  and Dest[10:6] indicates how many contiguous pins beyond the base should be affected
  (1-31).


  A 9-bit literal Dest is enough to express the base pin (Dest[5:0]) and a range of
  up to 8 contiguous pins (Dest[8:6]).


  If needed, use the augmented literal feature (##Dest) to augment Dest to an 11-bit
  literal value-- this inserts an


  AUGD instruction prior.


  When Dest is a register, the register''s value bits [10:0] are used as-is to form
  the 11-bit ID range, unless a SETQ


  instruction immediately precedes the FLTC / FLTNC instruction; substituting SETQ''s
  Dest[4:0] in place of value


  bits[10:6], for FLTC / FLTNC''s use.


  The range calculation (from Dest[5:0] up to Dest[5:0]+Dest[10:6]) will wrap within
  the same 32-pin group (DIRA or


  DIRB and OUTA or OUTB); it will not cross the port boundary.


  If the WCZ effect is specified, the C and Z flags are updated to the original state
  of OUTA / OUTB''s base bit,


  identified by Dest.


  FLTH / FLTL


  Float high or low


  I/O Pin Instruction - Set pin(s) direction to input and to an output level of high
  (1) or low (0).


  FLTH {#}Dest {WCZ}


  FLTL {#}Dest {WCZ}


  Result: The I/O pins described by Dest are set to the input direction and to an
  output level of high or low; the rest


  are left as-is.


  *   Dest is the register, 9-bit literal, or 11-bit augmented literal whose value
  identifies the I/O pin(s) to set to


  input direction and output levels of high or low.


  *   WCZ is an optional effect to update flags.


  COND INSTR            FX     DEST          SRC            Write             C Flag             Z
  Flag              Clocks


  EEEE 1101011 CZL DDDDDDDDD 001010001 DIRx + OUTx Orig OUTx base bit Orig OUTx base
  bit


  1


  2


  EEEE 1101011 CZL DDDDDDDDD 001010000 DIRx + OUTx Orig OUTx base bit Orig OUTx base
  bit


  1


  2


  1


  New DIRx state is not data-forwarded; the next pipelined instruction sees the old
  state. Make sure any instruction that reads


  or modifies DIRx is at least two instructions after a FLTH or FLTL.


  FLTH or FLTL sets the I/O pin(s) designated by Dest to the input direction and to
  a high or low output level; i.e.


  alters the pin''s direction and output registers. All other pins are left unchanged.
  Each of these instructions, FLTH


  and FLTL, can affect one or more of the bits within the DIRA or DIRB and OUTA or
  OUTB registers.


  FLTH or FLTL achieves the same effect as two instructions-- DIRL followed by OUTH
  or OUTL.


  Dest[5:0] indicates the pin number (0-63). For a range of pins, Dest[5:0] indicates
  the base pin number (0-63)


  and Dest[10:6] indicates how many contiguous pins beyond the base should be affected
  (1-31).


  A 9-bit literal Dest is enough to express the base pin (Dest[5:0]) and a range of
  up to 8 contiguous pins (Dest[8:6]).


  If needed, use the augmented literal feature (##Dest) to augment Dest to an 11-bit
  literal value-- this inserts an


  AUGD instruction prior.


  When Dest is a register, the register''s value bits [10:0] are used as-is to form
  the 11-bit ID range, unless a SETQ


  instruction immediately precedes the FLTH / FLTL instruction; substituting SETQ''s
  Dest[4:0] in place of value


  bits[10:6], for FLTH / FLTL''s use.


  The range calculation (from Dest[5:0] up to Dest[5:0]+Dest[10:6]) will wrap within
  the same 32-pin group (DIRA or


  DIRB and OUTA or OUTB); it will not cross the port boundary.


  If the WCZ effect is specified, the C and Z flags are updated to the original state
  of OUTA / OUTB''s base bit,


  identified by Dest.'
