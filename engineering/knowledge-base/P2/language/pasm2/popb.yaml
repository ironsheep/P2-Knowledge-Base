instruction: POPB
syntax: POPB    D        {WC/WZ/WCZ}
encoding:
- bits: EEEE 1011000 CZ1 DDDDDDDDD 111011111
  write: D
  c: MSB of long
  z: Result = 0
  clocks: '9...16 *'
timing:
  cycles: 1
  type: fixed
description: Read long from hub address --PTRB into D.
flags_affected:
  C: Set to MSB of long (bit 31 of popped value)
  Z: Set if result equals zero
documentation_source: PASM2 Manual 2022-11-01
documentation_level: enhanced
compiler_operand_format:
  name: operand_pushpop
  pattern: D/# | D
  description: Push immediate/register or Pop to register (PUSHA/PUSHB/POPA/POPB)
  valueType: 32
compiler_encoding:
  operandFormat: 32
enhancement_source: PNUT_TS_v2.0_complete_operand_integration_2025-09-13
syntax_variants:
- POPB D
last_updated: '2025-01-19'
brief_description: Pop long from stack using PTRB
parameters:
- Dest is the destination register to receive the popped value
- PTRB is automatically decremented before the read
category: Hub RAM
oneliner: Read
