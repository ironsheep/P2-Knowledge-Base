instruction: POLLXFI
syntax: POLLXFI {WC|WZ|WCZ}
encoding: "EEEE 1101011 CZ0 000001011 000100100                  --             XFI Event          XFI Event         \
  \       2"
timing:
  cycles: 2
  type: fixed
description: "Streamer-finished event flag is optionally copied into C and/or Z, then it is cleared.\n\nPOLLXFI copies the\
  \ state of the streamer-finished event flag into C and/or Z and then clears the flag (unless it's\n\nbeing set\
  \ again by the event sensor).\n\nIf the WC, WZ, or WCZ effect is specified, the C flag and/or Z flag is updated\
  \ to the state of the streamer-finished\n\nevent flag prior to clearing it.\n\nThe streamer-finished event fl\
  ag is set whenever the streamer runs out of commands to process. The\n\nstreamer-finished event flag is cleared\
  \ upon execution of XINIT, XZERO, XCONT, POLLXFI, WAITXFI, JXFI, or\n\nJNXFI instructions."
parameters:
- "WC, WZ, or WCZ are optional effects to update flags."
related:
- XINIT
- XZERO
- XCONT
- WAITXFI
- JXFI
- JNXFI
