description: "POLLXRO copies the state of the streamer NCO rollover event flag into C and/or Z and then clears the flag (unless\
  \ Result: Streamer-NCO-rollover event flag is optionally copied into C and/or Z, then it is cleared.\n\nPOLLXRO copies the\
  \ state of the streamer NCO rollover event flag into C and/or Z and then clears the flag (unless\n\nit's being set\
  \ again by the event sensor).\n\nIf the WC, WZ, or WCZ effect is specified, the C flag and/or Z flag is updated\
  \ to the state of the streamer-NCO-\n\nrollover event flag prior to clearing it.\n\nThe streamer-NCO-rollover event\
  \ flag is set whenever the streamer's numerically-controlled oscillator (NCO) rolls\n\nover. The streamer-NCO-rollover\
  \ event flag is cleared upon execution of XINIT, XZERO, XCONT, POLLXRO,\n\nWAITXRO, JXRO, or JNXRO instructions."
