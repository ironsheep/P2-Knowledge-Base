description: 'POLLXMT copies the state of the streamer-empty event flag into C and/or
  Z and then clears the flag (unless it''s Result: Streamer-empty event flag is optionally
  copied into C and/or Z, then it is cleared.


  POLLXMT copies the state of the streamer-empty event flag into C and/or Z and then
  clears the flag (unless it''s


  being set again by the event sensor).


  If the WC, WZ, or WCZ effect is specified, the C flag and/or Z flag is updated to
  the state of the streamer-empty


  event flag prior to clearing it.


  The streamer-empty event flag is set whenever the streamer is ready for a new command.
  The streamer-empty


  event flag is cleared upon execution of XINIT, XZERO, XCONT, POLLXMT, WAITXMT, JXMT,
  or JNXMT instructions.'
parameters:
- WC, WZ, or WCZ are optional effects to update flags.
