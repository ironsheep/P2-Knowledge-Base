instruction: COGBRK
syntax: COGBRK {#}Dest
brief_description: Cog break
category: Interrupt
description: 'COGBRK triggers an asynchronous breakpoint in a designated cog. The COGBRK instruction must be executed from within a Debug ISR (interrupt service routine) and the designated cog must already have its asynchronous breakpoint interrupt enabled. Dest[2:0] indicates the ID of the desired cog (0-7).'
result: If in the Debug ISR, trigger an asynchronous breakpoint in cog identified
  by Dest.
flags_affected:
  C: No effect
  Z: No effect
parameters:
- Dest is the register or 9-bit literal whose value (lower 3-bits) indicates which
  cog to trigger.
syntax_variants:
- COGBRK {#}Dest
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 1101011 00L DDDDDDDDD 000110101
  write: —
  c: —
  z: —
  clocks: '2'
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_l
  pattern: D/#0..511
  description: Destination or immediate value 0-511
  valueType: 26
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 26
