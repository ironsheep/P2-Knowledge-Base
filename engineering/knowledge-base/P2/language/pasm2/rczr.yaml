instruction: RCZR
syntax: RCZR Dest {WC|WZ|WCZ}
brief_description: Rotate carry and zero right
category: Math and Logic
description: >-
  RCZR shifts Dest's binary value right by two places and sets Dest[31] to C and
  Dest[30] to Z. If the WC or WCZ effect is specified, the C flag is updated to the
  original Dest[1] state. If the WZ or WCZ effect is specified, the Z flag is updated
  to the original Dest[0] state.
result: The bits of Dest are shifted right by two places and C and Z are inserted
  as new MSBs.
parameters:
- Dest is the register containing the value to rotate the carry and zero flags right
  into.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C:
    formula: D[1], Z = D[0]
    when: D
  Z:
    formula: D[0]
    when: D[1]
syntax_variants:
- RCZR D {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 1101011 CZ0 DDDDDDDDD 001101010
  write: D
  c: D[1]
  z: D[0]
  clocks: '2'
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_d
  pattern: D
  description: Destination register only
  valueType: 24
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 24
