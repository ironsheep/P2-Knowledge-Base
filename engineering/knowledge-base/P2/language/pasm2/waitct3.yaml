instruction: WAITCT3
syntax: WAITCT3 {WC|WZ|WCZ}
brief_description: Wait counter 3
category: Event
description: >-
  WAITCT3 waits for a counter 3 event to occur (unless the event flag is already
  set), then clears the event flag (unless it's being set again by the event
  sensor) and resumes execution at the next instruction. Optionally, WAITCT3 can
  time-out if the counter event doesn't occur soon enough; setting C and/or Z
  flags and then resuming execution at the next instruction.

  To set the optional timeout, insert a SETQ (with a future System Counter
  target value) right before WAITCT3.

  The WC, WZ, or WCZ effect is recommended only if the optional timeout is
  specified, in which case the C flag and/or Z flag is set (1) if a timeout
  occurred before the event, or is cleared (0) if the event occurred before the
  timeout.

  During a wait, the pipeline is stalled; no instructions execute and no
  interrupts are processed in the cog until the wait condition ends.

  The counter 3 event flag is set whenever the System Counter (CT) passes the
  value in the CT3 event trigger register; i.e. MSB of (CT - CT3) is 0. The
  counter event flags are cleared upon execution of the corresponding ADDCT3,
  POLLCT3, WAITCT3, JCT3, or JNCT3 instructions.
result: >-
  Wait for counter 3 event, then clear the flag; optionally aborting on timeout
  and setting C and/or Z on abort.
parameters:
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C:
    formula: timeout
    description: Set if timeout occurred before event
  Z:
    formula: timeout
    description: Set if timeout occurred before event
syntax_variants:
- WAITCT3 {WC|WZ|WCZ}
timing:
  cycles: 2
  type: variable
  notes: 2+ cycles depending on wait time
encoding:
- bits: EEEE 1101011 CZ0 000010011 000100100
  write: —
  c: Timeout Abort
  z: Timeout Abort
  clocks: '2+'
