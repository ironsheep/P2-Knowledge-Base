instruction: MOV
syntax: MOV Dest, {#}Src {WC|WZ|WCZ}
brief_description: Move
category: Math and Logic
description: >-
  MOV stores the Src value into Dest.
  If the WC or WCZ effect is specified, the C flag is updated to be Src[31].
  If the WZ or WCZ effect is specified, the Z flag is set (1) if the Dest result equals
  zero, or is cleared (0) if it is non-zero.
result: >-
  The Src value is stored in Dest and optionally flags are updated with the sign bit
  and zero status.
parameters:
- Dest is the register to receive the Src value.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value will be
  stored into Dest.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set to S[31] (sign bit of source)
  Z: Set if result equals zero
syntax_variants:
- MOV Dest, {#}Src {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 0110000 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: S[31]
  z: Result = 0
  clocks: '2'
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_ds
