instruction: TJNS
syntax: TJNS D,{#}S
brief_description: Test, jump if not signed
category: Branch
description: >-
  TJNS tests the value in Dest and jumps to the address described by Src if the
  value is not signed (Dest[31] = 0). The address (Src) can be absolute or relative.
  To specify an absolute address, Src must be a register containing a 20-bit address
  value. To specify a relative address, use #Label for a 9-bit signed offset (a range
  of -256 to +255 instructions) or use ##Label (or insert a prior AUGS instruction)
  for a 20-bit signed offset. Offsets are relative to the instruction following the
  TJNS.
result: >-
  Dest is tested and if it's not signed (Dest[31] = 0), PC is set to a new relative
  (#Src) or absolute (Src) address.
flags_affected:
  C: No effect
  Z: No effect
parameters:
- Dest is a register whose value is tested for sign or no sign.
- 'Src is a register, 9-bit literal, or 20-bit augmented literal whose value is the
  absolute or relative address to set PC to. Use # for relative addressing; omit #
  for absolute addressing.'
timing:
  cycles: 2
  type: fixed
encoding:
- bits: EEEE 1011101 11I DDDDDDDDD SSSSSSSSS
  write: —
  c: —
  z: —
  clocks: 2 or 4
encoding_notes:
- PC is written only when Dest is signed (or not signed in syntax 2).
documentation_source: PASM2 Manual 2022/11/01
documentation_level: comprehensive
compiler_operand_format:
  name: operand_dsj
  pattern: D,S/@
  description: 'Jump with destination and relative address: register, relative address'
  valueType: 12
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 12
