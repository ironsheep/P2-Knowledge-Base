instruction: MUXQ
syntax: MUXQ Dest, {#}Src
brief_description: Mux Q
category: Math and Logic
description: 'MUXQ copies all bits from Src corresponding to high (1) bits of Q into
  the corresponding

  bits of Dest. All other bits remain unchanged.


  Critical for parallel bit operations, especially RGB LED driving where

  multiple data lines need simultaneous updates.



  MUXQ copies all bits from Src corresponding to high (1) bits of Q into the corresponding
  bits of Dest. All other


  Dest bits are left as-is.


  MUXQ must be preceded by SETQ to function properly since the Q value''s high bits
  identify the bits to target in Src


  and Dest.


  MUXZ / MUXNZ


  Mux Z or mux not Z


  Bit Operation Instructions - Set discrete bits to Z or !Z


  MUXZ     Dest, {#}Src {WC|WZ|WCZ}


  MUXNZ Dest, {#}Src {WC|WZ|WCZ}


  Result: Dest bit(s) described by Src are set to Z or !Z; the rest are left as-is.
  Flags are optionally updated with


  parity and zero status of the result.


  *    Dest is the register whose value will have one or more bits set to Z or !Z.


  *    Src is a register, 9-bit literal, or 32-bit augmented literal whose value identifies
  the bit(s) to modify.


  *    WC, WZ, or WCZ is an optional effect to update flags.


  COND INSTR         FX      DEST          SRC           Write             C Flag              Z
  Flag              Clocks


  EEEE 0101110 CZI DDDDDDDDD SSSSSSSSS                     D          Parity of Result      Result
  = 0                2


  EEEE 0101111 CZI DDDDDDDDD SSSSSSSSS                     D          Parity of Result      Result
  = 0                2


  MUXZ or MUXNZ alters the Dest bit(s) designated by Src (high bits) to equal the
  state, or inverse state, of the Z flag.


  All Dest bits corresponding to high (1) bits in Src are modified; all other Dest
  bits are left unchanged.


  If the WC or WCZ effect is specified, the C flag is set (1) if the number of high
  (1) bits in the result is odd, or is


  cleared (0) if it is even.


  If the WZ or WCZ effect is specified, the Z flag is set (1) if the result is zero,
  or is cleared (0) if it is not zero.'
result: Dest bit(s) described by Src are set to Z or !Z; the rest are left as-is.
  Flags are optionally updated with
parameters:
- Dest is a register whose bits will be updated according to Q and Src.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose select bits
  will replace the corresponding bits in Dest.
- Dest is the register whose value will have one or more bits set to Z or !Z.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value identifies
  the bit(s) to modify.
- WC, WZ, or WCZ is an optional effect to update flags.
