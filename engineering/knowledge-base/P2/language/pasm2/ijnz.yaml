instruction: IJNZ
syntax: IJNZ    D,{#}S
category: Branch
description: 'IJZ or IJNZ increments the value in Dest, writes the result, and jumps
  to the address described by Src if the Result: Dest is incremented, and if the result
  is zero (or not zero in syntax 2), PC is set to a new relative (#Src) or absolute
  (Src) address.'
parameters:
- Dest is a register whose value is incremented and tested for zero or not zero.
- 'Src is a register, 9-bit literal, or 20-bit augmented literal whose value is the
  absolute or relative address to set PC to. Use # for relative addressing; omit #
  for absolute addressing.'
flags_affected:
  C:
    when: D
  Z:
    when: and
timing:
  cycles: 2
  type: variable
  range: 13...20
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 1011100 00I DDDDDDDDD SSSSSSSSS
  write: D and PC   1
  c: —
  z: —
  clocks: 2 or 4 / 2 or 13–20
- bits: EEEE 1011100 01I DDDDDDDDD SSSSSSSSS
  write: D and PC   1
  c: —
  z: —
  clocks: 2 or 4 / 2 or 13–20
encoding_notes:
- Dest is always written; PC is written only when the result in Dest is zero (or not
  zero in syntax 2).
documentation_source: PASM2 Manual 2022/11/01
documentation_level: comprehensive
compiler_operand_format:
  name: operand_dsj
  pattern: D,S/@
  description: 'Jump with destination and relative address: register, relative address'
  valueType: 12
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 12
