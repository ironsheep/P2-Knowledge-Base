brief_description: Augment source
category: Miscellaneous
result: Dest bit(s) described by Src are set high (1) or low (0); the rest are left
  as-is.
usage_notes: 'All instructions following AUGS are shielded from interrupt until after
  the instruction with the

  newly-augmented literal Src value is executed

  Src value augmentation occurs in the instruction pipeline only; code is not altered,
  value does not persist

  SETQ / SETQ2 does not affect AUGS-- the Q value passes through to the next instruction

  Tip: Though AUGS may be manually entered wherever needed, the Parallax P2 compiler
  supports a convenient way

  to use this feature. In the target instruction''s Src field, use "##" followed by
  the desired 32-bit literal (instead of "#"

  followed by a 9-bit literal); the compiler will automatically invoke AUGS immediately
  before. When counting clock

  cycles, make sure to account for 2 extra clock cycles for instructions containing
  ## augmented literals.'
