instruction: AUGS
syntax: AUGS #Src
brief_description: Augment source
category: Miscellaneous
description: >-
  AUGS is an assistant instruction to aid with literal values that exceed 9 bits.
  Most PASM2 instructions have 9 bits available for literal Src values; enough
  for many uses, but not all. AUGS augments the next occurrence of a literal Src
  value to be a full 32-bits. When the instruction with the soon-to-be-augmented
  literal is later executed, the cog uses the lower 9 bits encoded in the
  instruction's Src field and prepends AUGS's 23 bits to it.
result: >-
  The 23-bit value formed from Src is queued to prefix the next literal Src
  occurrence (#Src) to form a 32-bit literal for that instruction; interrupts
  are also temporarily disabled.
parameters:
- Src is a 32-bit literal whose upper 23 bits are prepended to the next literal
  Src occurrence.
usage_notes: >-
  All instructions following AUGS are shielded from interrupt until after the
  instruction with the newly-augmented literal Src value is executed.

  Src value augmentation occurs in the instruction pipeline only; code is not
  altered, value does not persist.

  SETQ / SETQ2 does not affect AUGS-- the Q value passes through to the next
  instruction.

  Tip: Though AUGS may be manually entered wherever needed, the Parallax P2
  compiler supports a convenient way to use this feature. In the target
  instruction's Src field, use "##" followed by the desired 32-bit literal
  (instead of "#" followed by a 9-bit literal); the compiler will automatically
  invoke AUGS immediately before. When counting clock cycles, make sure to
  account for 2 extra clock cycles for instructions containing ## augmented
  literals.
timing:
  cycles: 2
  type: fixed
encoding:
- bits: EEEE 11110SS SSS SSSSSSSSS SSSSSSSSS
  write: Hidden S Queue
  c: —
  z: —
  clocks: '2'
flags_affected:
  C: No effect
  Z: No effect
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_aug
  pattern: '#S'
  description: 'Augment: immediate 23-bit value for AUGS/AUGD'
  valueType: 23
compiler_encoding:
  operandFormat: 23
enhancement_source: PNUT_TS_v2.0_complete_operand_integration_2025-09-13
last_updated: '2025-11-26'
manual_extraction_date: '2025-01-19'
oneliner: Augment next literal Src to 32-bits
related:
- AUGD
examples:
- description: Using ## syntax (compiler inserts AUGS automatically)
  code: |
    AND      address, ##$FFFFF           '2+2 cycles
    DJNZ     idx, ##far_away             '2+(2 or 4) cycles (in Cog RAM)
- description: Equivalent explicit AUGS usage
  code: |
    AUGS     #$FFFFF                     '2 cycles
    AND      address, #$FFFFF & $1FF     '2 cycles

    AUGS     #far_away                   '2 cycles
    DJNZ     idx, #far_away & $1FF       '2 or 4 cycles (in Cog RAM)
