description: 'AUGS is an assistant instruction to aid with literal values that exceed
  9 bits. Most PASM2 instructions have 9 bits Result: The 23-bit value formed from
  Src is queued to prefix the next literal Src occurrence (#Src) to form a 32-bit
  literal for that instruction; interrupts are also temporarily disabled.


  AUGS is an assistant instruction to aid with literal values that exceed 9 bits.
  Most PASM2 instructions have 9 bits


  available for literal Src values; enough for many uses, but not all. AUGS augments
  the next occurrence of a literal


  Src value to be a full 32-bits. When the instruction with the soon-to-be-augmented
  literal is later executed, the cog


  uses the lower 9 bits encoded in the instruction''s Src field and prepends AUGS''s
  23 bits to it.


  BITC or BITNC alters the Dest bit(s) designated by Src to equal the state, or inverse
  state, of the C flag. All other


  bits are left unchanged.


  Src[4:0] indicates the bit number (0--31). For a range of bits, Src[4:0] indicates
  the base bit number (0--31) and


  Src[9:5] indicates how many contiguous bits beyond the base should be affected (1-31).


  A 9-bit literal Src is enough to express the base bit (Src[4:0]) and a range of
  up to 16 contiguous bits (Src[8:5]). If


  needed, use the augmented literal feature (##Src) to augment Src to a 10-bit literal
  value-- this inserts an AUGS


  instruction prior.


  When Src is a register, the register''s value bits [9:0] are used as-is to form
  the 10-bit ID range, unless a SETQ


  instruction immediately precedes the BITC / BITNC instruction; substituting SETQ''s
  Dest[4:0] in place of value


  bits[9:5], for BITC / BITNC''s use.


  If the WCZ effect is specified, the C and Z flags are updated to the original state
  of Dest''s base bit, identified by Src.


  BITH / BITL


  Bit high or low


  Bit Operation Instruction - Set bit(s) high (1) or low (0).


  BITH Dest, {#}Src {WCZ}


  BITL Dest, {#}Src {WCZ}


  Result: Dest bit(s) described by Src are set high (1) or low (0); the rest are left
  as-is.


  *    Dest is the register whose value will have one or more bits set high or low.


  *    Src is a register, 9-bit literal, or 10-bit augmented literal whose value identifies
  the bit(s) to modify.


  *    WCZ is an optional effect to update flags.


  COND INSTR        FX      DEST         SRC           Write            C Flag              Z
  Flag              Clocks


  EEEE 0100001 CZI DDDDDDDDD SSSSSSSSS                  D         Original D base
  bit Original D base bit          2


  EEEE 0100000 CZI DDDDDDDDD SSSSSSSSS                  D         Original D base
  bit Original D base bit          2


  BITH or BITL alters the Dest bit(s) designated by Src to be high (1) or low (0).
  All other bits are left unchanged.


  Src[4:0] indicates the bit number (0--31). For a range of bits, Src[4:0] indicates
  the base bit number (0--31) and


  Src[9:5] indicates how many contiguous bits beyond the base should be affected (1-31).


  A 9-bit literal Src is enough to express the base bit (Src[4:0]) and a range of
  up to 16 contiguous bits (Src[8:5]). If


  needed, use the augmented literal feature (##Src) to augment Src to a 10-bit literal
  value-- this inserts an AUGS


  instruction prior.


  When Src is a register, the register''s value bits [9:0] are used as-is to form
  the 10-bit ID range, unless a SETQ


  instruction immediately precedes the BITH / BITL instruction; substituting SETQ''s
  Dest[4:0] in place of value


  bits[9:5], for BITH / BITL''s use.


  If the WCZ effect is specified, the C and Z flags are updated to the original state
  of Dest''s base bit, identified by Src.'
parameters:
- Src is a 32-bit literal whose upper 23 bits are prepended to the next literal Src
  occurrence.
- All instructions following AUGS are shielded from interrupt until after the instruction
  with the
- Src value augmentation occurs in the instruction pipeline only; code is not altered,
  value does not persist
- SETQ / SETQ2 does not affect AUGS-- the Q value passes through to the next instruction
- Dest is the register whose value will have one or more bits set to C or !C.
- Src is a register, 9-bit literal, or 10-bit augmented literal whose value identifies
  the bit(s) to modify.
- WCZ is an optional effect to update flags.
- Dest is the register whose value will have one or more bits set high or low.
- Src is a register, 9-bit literal, or 10-bit augmented literal whose value identifies
  the bit(s) to modify.
- WCZ is an optional effect to update flags.
