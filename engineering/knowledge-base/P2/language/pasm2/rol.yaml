instruction: ROL
syntax: ROL Dest, {#}Src {WC|WZ|WCZ}
brief_description: Rotate left
category: Math and Logic
description: 'ROL rotates Dest''s binary value left by Src places (0-31 bits). All
  MSBs rotated out are moved into the new LSBs. Result: The bits of Dest are rotated
  left by Src bits; any departing MSBs are moved into LSBs.


  ROL rotates Dest''s binary value left by Src places (0-31 bits). All MSBs rotated
  out are moved into the new LSBs.


  If the WC or WCZ effect is specified, the C flag is updated to the value of the
  last bit rotated out (effectively C =


  result bit "0") if Src is 1-31, or to Dest[31] if Src is 0.


  If the WZ or WCZ effect is specified, the Z flag is set (1) if the Dest result equals
  zero, or is cleared (0) if it is


  non-zero. Since no bits are lost by this operation, the result will only be zero
  if Dest started at zero.'
result: The bits of Dest are rotated left by Src bits; any departing MSBs are moved
  into LSBs.
parameters:
- Dest is the register containing the value to rotate left by Src bits.
- Src is a register or 5-bit literal whose value indicates the number of bit positions
  to rotate.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C:
    formula: last bit shifted out if S[4:0] > 0, else D[31]
syntax_variants:
- ROL Dest, {#}Src {WC|WZ|WCZ}
- ROL rotates Dest's binary value left by Src places (0-31 bits). All MSBs rotated
  out are moved into the new LSBs.
timing:
  cycles: 1
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 0000001 CZI DDDDDDDDD SSSSSSSSS
  write: D         Last bit out   1
  c: Result = 0
  z: '2'
encoding_notes:
- C = last bit rotated out if Src[4:0] > 0, else C = Dest[31].
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
