description: "POLLINT copies the state of the interrupt-occurred event flag into C and/or Z and then clears the flag (unless\
  \ it's Result: Interrupt-occurred event flag is optionally copied into C and/or Z, then it is cleared.\n\nPOLLINT copies\
  \ the state of the interrupt-occurred event flag into C and/or Z and then clears the flag (unless it's\n\nbeing\
  \ set again by the event sensor).\n\nIf the WC, WZ, or WCZ effect is specified, the C flag and/or Z flag is\
  \ updated to the state of the interrupt-occurred\n\nevent flag prior to clearing it.\n\nThe interrupt-occurred event\
  \ flag is set whenever interrupt 1, 2, or 3 occurs-- debug interrupts are ignored. The\n\ninterrupt-occurred event\
  \ flag is cleared upon cog start, or execution of POLLINT, WAITINT, JINT, or JNINT\n\ninstructions."
