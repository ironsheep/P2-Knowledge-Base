instruction: GETNIB
syntax: 'GETNIB Dest, {#}Src, #Num'
brief_description: Get nibble
category: Math and Logic
description: >-
  GETNIB reads the nibble identified by Num (0-7) from Src, or a nibble from the source
  described by a prior ALTGN instruction.

  Num (0-7) identifies a value's individual nibbles, by position, in least-significant
  nibble order: Num 0 is bits [3:0], Num 1 is bits [7:4], etc.

  Syntax 2 (GETNIB Dest) is intended for use after an ALTGN instruction; i.e. in
  a loop to iteratively read a series of nibble values within contiguous long registers.
result: Nibble Num (0-7) of Src, or a nibble from a source described by prior ALTGN
  instruction, is written to Dest.
parameters:
- Dest is the register in which to store the nibble.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value contains
  the target nibble to read.
- Num is a 3-bit literal identifying the nibble ID (0-7) of Src to read.
flags_affected:
  C:
    formula: not affected
  Z:
    formula: not affected
syntax_variants:
- 'GETNIB Dest, {#}Src, #Num'
- GETNIB Dest
timing:
