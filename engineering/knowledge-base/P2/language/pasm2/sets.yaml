instruction: SETS
syntax: SETS Dest, {#}Src
encoding:
- bits: EEEE 1001101 11I DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: >-
  SETS copies Src[8:0] to the S field of the template, Dest, to be used with an ALTI
  instruction. Bits outside the S field remain unaffected. The S field (or Src field)
  holds the address of a register or literal value for an instruction to use as its
  source value during its execution. SETS can also be used in self-modifying Reg RAM
  code. Unlike with ALTx instructions, when used this way, field value modification
  occurs in the program code itself (not the instruction pipeline); code is altered,
  values persist. Due to the instruction pipeline nature, after modifying a code register,
  it is necessary to elapse at least two instructions before executing the modified
  register.
flags_affected:
  C: No effect
  Z: No effect
parameters:
- Dest is the register whose 32-bit value is a template for use with an ALTI instruction.
- Src is a register or 9-bit literal whose value (Src[8:0]) is copied to the S field
  of Dest.
related:
- SETD
- SETR
- ALTI
