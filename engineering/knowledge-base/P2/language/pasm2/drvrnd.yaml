instruction: DRVRND
syntax: DRVRND {#}Dest {WCZ}
brief_description: Drive random
category: Pin
description: >-
  DRVRND sets the I/O pin(s) designated by Dest to the output direction and with
  output level(s) set randomly low and high, based on bit(s) from the
  Xoroshiro128** PRNG. All other pins are left unchanged. This instruction can
  affect one or more of the bits within the DIRA or DIRB and OUTA or OUTB
  registers.

  DRVRND achieves the same effect as two instructions-- OUTRND followed by DIRH.

  Dest[5:0] indicates the pin number (0-63). For a range of pins, Dest[5:0]
  indicates the base pin number (0-63) and Dest[10:6] indicates how many
  contiguous pins beyond the base should be affected (1-31).

  A 9-bit literal Dest is enough to express the base pin (Dest[5:0]) and a range
  of up to 8 contiguous pins (Dest[8:6]). If needed, use the augmented literal
  feature (##Dest) to augment Dest to an 11-bit literal value-- this inserts an
  AUGD instruction prior.

  When Dest is a register, the register's value bits [10:0] are used as-is to
  form the 11-bit ID range, unless a SETQ instruction immediately precedes the
  DRVRND instruction; substituting SETQ's Dest[4:0] in place of value
  bits[10:6], for DRVRND's use.

  The range calculation (from Dest[5:0] up to Dest[5:0]+Dest[10:6]) will wrap
  within the same 32-pin group (DIRA or DIRB and OUTA or OUTB); it will not
  cross the port boundary.

  If the WCZ effect is specified, the C and Z flags are updated to the original
  state of OUTA / OUTB's base bit, identified by Dest.
result: >-
  The I/O pins described by Dest are set to the output direction and each output
  level is set randomly low or high; the rest are left as-is.
parameters:
- Dest is the register, 9-bit literal, or 11-bit augmented literal whose value
  identifies the I/O pin(s) to set to the output direction and with output
  level(s) set randomly to low or high.
- WCZ is an optional effect to update flags.
flags_affected:
  C:
    formula: original OUTx base bit
    description: Set to original state of base bit before modification
  Z:
    formula: original OUTx base bit
    description: Set to original state of base bit before modification
syntax_variants:
- DRVRND {#}Dest {WCZ}
timing:
  cycles: 2
  type: fixed
encoding:
- bits: EEEE 1101011 CZL DDDDDDDDD 001011110
  write: DIRx + OUTx
  c: Original OUTx base bit
  z: Original OUTx base bit
  clocks: '2'
  notes: New DIRx state is not data-forwarded; next pipelined instruction sees old state
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_pinop
  pattern: D/#0..511 {WC/WZ}
  description: 'Pin operation: destination/immediate pin number 0-511, optional effect flags'
  valueType: 30
