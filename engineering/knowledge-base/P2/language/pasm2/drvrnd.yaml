instruction: DRVRND
syntax: DRVRND {#}Dest {WCZ}
encoding:
- EEEE 1101011 CZL DDDDDDDDD 001011110 DIRx + OUTx Orig OUTx base bit Orig OUTx base
  bit
- EEEE 1101011 CZL DDDDDDDDD 001011100 DIRx1 + OUTx Orig OUTx base bit Orig OUTx base
  bit                           2
- EEEE 1101011 CZL DDDDDDDDD 001011101 DIRx1 + OUTx Orig OUTx base bit Orig OUTx base
  bit                           2
timing:
  cycles: 2
  type: fixed
description: 'DRVRND sets the I/O pin(s) designated by Dest to the output direction
  and with output level(s) set randomly low Result: The I/O pins described by Dest
  are set to the output direction and each output level is set randomly low or high;
  the rest are left as-is. Z = OUT bit.


  DRVRND sets the I/O pin(s) designated by Dest to the output direction and with output
  level(s) set randomly low


  and high, based on bit(s) from the Xoroshiro128** PRNG. All other pins are left
  unchanged. This instruction can


  affect one or more of the bits within the DIRA or DIRB and OUTA or OUTB registers.


  DRVRND achieves the same effect as two instructions-- OUTRND followed by DIRH.


  Dest[5:0] indicates the pin number (0-63). For a range of pins, Dest[5:0] indicates
  the base pin number (0-63)


  and Dest[10:6] indicates how many contiguous pins beyond the base should be affected
  (1-31).


  A 9-bit literal Dest is enough to express the base pin (Dest[5:0]) and a range of
  up to 8 contiguous pins (Dest[8:6]).


  If needed, use the augmented literal feature (##Dest) to augment Dest to an 11-bit
  literal value-- this inserts an


  AUGD instruction prior.


  When Dest is a register, the register''s value bits [10:0] are used as-is to form
  the 11-bit ID range, unless a SETQ


  instruction immediately precedes the DRVRND instruction; substituting SETQ''s Dest[4:0]
  in place of value


  bits[10:6], for DRVRND''s use.


  The range calculation (from Dest[5:0] up to Dest[5:0]+Dest[10:6]) will wrap within
  the same 32-pin group (DIRA or


  DIRB and OUTA or OUTB); it will not cross the port boundary.


  If the WCZ effect is specified, the C and Z flags are updated to the original state
  of OUTA / OUTB''s base bit,


  identified by Dest.


  DRVZ / DRVNZ


  Drive Z or not Z


  I/O Pin Instruction - Set pin(s) direction to output and output level to low/high
  according to Z or !Z.


  DRVZ       {#}Dest {WCZ}


  DRVNZ {#}Dest {WCZ}


  Result: The I/O pins described by Dest are set to the output direction and to an
  output level of low/high according


  to Z or !Z; the rest are left as-is.


  *   Dest is the register, 9-bit literal, or 11-bit augmented literal whose value
  identifies the I/O pin(s) to set to


  output direction and output levels of low or high.


  *   WCZ is an optional effect to update flags.


  COND INSTR            FX     DEST          SRC            Write             C Flag             Z
  Flag              Clocks


  EEEE 1101011 CZL DDDDDDDDD 001011100 DIRx1 + OUTx Orig OUTx base bit Orig OUTx base
  bit                           2


  EEEE 1101011 CZL DDDDDDDDD 001011101 DIRx1 + OUTx Orig OUTx base bit Orig OUTx base
  bit                           2


  1


  New DIRx state is not data-forwarded; the next pipelined instruction sees the old
  state. Make sure any instruction that reads


  or modifies DIRx is at least two instructions after a DRVZ or DRVNZ.


  DRVZ or DRVNZ sets the I/O pin(s) designated by Dest to the output direction and
  to a low/high output level


  according to the state, or inverse state, of the Z flag; i.e. alters the pin''s
  direction and output registers. All other


  pins are left unchanged. Each of these instructions, DRVZ and DRVNZ, can affect
  one or more of the bits within


  the DIRA or DIRB and OUTA or OUTB registers.


  DRVZ or DRVNZ achieves the same effect as two instructions-- OUTZ, or OUTNZ, followed
  by DIRH.


  Dest[5:0] indicates the pin number (0-63). For a range of pins, Dest[5:0] indicates
  the base pin number (0-63)


  and Dest[10:6] indicates how many contiguous pins beyond the base should be affected
  (1-31).


  A 9-bit literal Dest is enough to express the base pin (Dest[5:0]) and a range of
  up to 8 contiguous pins (Dest[8:6]).


  If needed, use the augmented literal feature (##Dest) to augment Dest to an 11-bit
  literal value-- this inserts an


  AUGD instruction prior.


  When Dest is a register, the register''s value bits [10:0] are used as-is to form
  the 11-bit ID range, unless a SETQ


  instruction immediately precedes the DRVZ / DRVNZ instruction; substituting SETQ''s
  Dest[4:0] in place of value


  bits[10:6], for DRVZ / DRVNZ''s use.


  The range calculation (from Dest[5:0] up to Dest[5:0]+Dest[10:6]) will wrap within
  the same 32-pin group (DIRA or


  DIRB and OUTA or OUTB); it will not cross the port boundary.


  If the WCZ effect is specified, the C and Z flags are updated to the original state
  of OUTA / OUTB''s base bit,


  identified by Dest.'
