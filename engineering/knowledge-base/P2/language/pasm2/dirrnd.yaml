description: 'DIRRND alters the direction register''s bit(s) designated by Dest to
  be random low and high (input and output), Result: The I/O pin direction bit(s),
  described by Dest, are each set randomly low or high (input or output); the rest
  are left as-is. Z = DIR bit.


  DIRRND alters the direction register''s bit(s) designated by Dest to be random low
  and high (input and output),


  based on bit(s) from the Xoroshiro128** PRNG. All other bits are left unchanged.


  Dest[5:0] indicates the pin number (0-63). For a range of pins, Dest[5:0] indicates
  the base pin number (0-63)


  and Dest[10:6] indicates how many contiguous pins beyond the base should be affected
  (1-31).


  A 9-bit literal Dest is enough to express the base pin (Dest[5:0]) and a range of
  up to 8 contiguous pins (Dest[8:6]).


  If needed, use the augmented literal feature (##Dest) to augment Dest to an 11-bit
  literal value-- this inserts an


  AUGD instruction prior.


  When Dest is a register, the register''s value bits [10:0] are used as-is to form
  the 11-bit ID range, unless a SETQ


  instruction immediately precedes the DIRRND instruction; substituting SETQ''s Dest[4:0]
  in place of value


  bits[10:6], for DIRRND''s use.


  The range calculation (from Dest[5:0] up to Dest[5:0]+Dest[10:6]) will wrap within
  the same 32-pin group (DIRA or


  DIRB); it will not cross the port boundary.


  If the WCZ effect is specified, the C and Z flags are updated to the original state
  of DIRA / DIRB''s base bit,


  identified by Dest.


  DIRZ / DIRNZ


  Direction Z or not Z


  I/O Pin Instruction - Set pin(s) direction to input/output according to Z or !Z.


  DIRZ    {#}Dest {WCZ}


  DIRNZ {#}Dest {WCZ}


  Result: The I/O pin direction bit(s), described by Dest, are set to output/input
  according to Z or !Z; the rest are left


  as-is.


  *   Dest is the register, 9-bit literal, or 11-bit augmented literal whose value
  identifies the I/O pin(s) to set to


  output or input.


  *   WCZ is an optional effect to update flags.


  COND INSTR        FX     DEST          SRC           Write            C Flag             Z
  Flag             Clocks


  EEEE 1101011 CZI DDDDDDDDD 001000100                DIRx       Orig DIRx base bit
  Orig DIRx base bit           2


  EEEE 1101011 CZI DDDDDDDDD 001000101                DIRx       Orig DIRx base bit
  Orig DIRx base bit           2


  Related: DIRC, DIRNC, DIRNOT, DIRRND, DIRL, and DIRH


  DIRZ or DIRNZ alters the direction register''s bit(s) designated by Dest to equal
  the state, or inverse state, of the Z


  flag; i.e. set pin to the output (1) or input (0) direction. All other bits (pins)
  are left unchanged. Each of these


  instructions, DIRZ and DIRNZ, can affect one or more of the bits within the DIRA
  or DIRB registers.


  Dest[5:0] indicates the pin number (0-63). For a range of pins, Dest[5:0] indicates
  the base pin number (0-63)


  and Dest[10:6] indicates how many contiguous pins beyond the base should be affected
  (1-31).


  A 9-bit literal Dest is enough to express the base pin (Dest[5:0]) and a range of
  up to 8 contiguous pins (Dest[8:6]).


  If needed, use the augmented literal feature (##Dest) to augment Dest to an 11-bit
  literal value-- this inserts an


  AUGD instruction prior.


  When Dest is a register, the register''s value bits [10:0] are used as-is to form
  the 11-bit ID range, unless a SETQ


  instruction immediately precedes the DIRZ / DIRNZ instruction; substituting SETQ''s
  Dest[4:0] in place of value


  bits[10:6], for DIRZ / DIRNZ''s use.


  If the WCZ effect is specified, the C and Z flags are updated to the original state
  of DIRA / DIRB''s base bit,


  identified by Dest.


  DJF / DJNF


  Decrement, jump if full or not full


  Flow Control Instruction - Decrement value and jump if full (-1; $FFFF_FFFF) or
  not full (<> -1; <> $FFFF_FFFF).


  DJF        Dest, {#}Src


  DJNF Dest, {#}Src


  Result: Dest is decremented, and if the result is full (or not full in syntax 2),
  PC is set to a new relative (#Src) or


  absolute (Src) address.


  *    Dest is a register whose value is decremented and tested for full or not full.


  *    Src is a register, 9-bit literal, or 20-bit augmented literal whose value is
  the absolute or relative address to


  set PC to. Use # for relative addressing; omit # for absolute addressing.


  COND INSTR             FX      DEST           SRC             Write               C
  Flag               Z Flag             Clocks


  EEEE 1011011 10I DDDDDDDDD SSSSSSSSS                    D and PC   1


  --                       --        2 or 4 / 2 or 13-20


  EEEE 1011011 11I DDDDDDDDD SSSSSSSSS                    D and PC   1


  --                       --        2 or 4 / 2 or 13-20


  1


  Dest is always written; PC is written only when the result in Dest is full (or not
  full in syntax 2).


  DJF or DJNF decrements the value in Dest, writes the result, and jumps to the address
  described by Src if the


  result is full (-1; $FFFF_FFFF; in syntax 1) or not full (<> -1; <> $FFFF_FFFF;
  in syntax 2).


  The address (Src) can be absolute or relative. To specify an absolute address, Src
  must be a register containing a


  20-bit address value. To specify a relative address, use #Label for a 9-bit signed
  offset (a range of -256 to +255


  instructions) or use ##Label (or insert a prior AUGS instruction) for a 20-bit signed
  offset (a range of -524288 to


  +524287). Offsets are relative to the instruction following the DJF / DJNF. The
  signed offset value is in units of


  whole instructions-- it is added to PC as-is when in Cog/LUT execution mode and
  is multiplied by 4 then added to


  PC when in Hub execution mode (long-aligned Hub code not required).


  DJZ / DJNZ


  Decrement, jump if zero or not zero


  Flow Control Instruction - Decrement, jump if zero or not zero.


  DJZ        Dest, {#}Src


  DJNZ Dest, {#}Src


  Result: Dest is decremented, and if the result is zero (or not zero in syntax 2),
  PC is set to a new relative (#Src) or


  absolute (Src) address.


  *    Dest is a register whose value is decremented and tested for zero or not zero.


  *    Src is a register, 9-bit literal, or 20-bit augmented literal whose value is
  the absolute or relative address to


  set PC to. Use # for relative addressing; omit # for absolute addressing.


  COND INSTR             FX      DEST          SRC             Write              C
  Flag              Z Flag             Clocks


  EEEE 1011011 00I DDDDDDDDD SSSSSSSSS                   D and PC   1


  --                    --          2 or 4 / 2 or 13-20


  EEEE 1011011 01I DDDDDDDDD SSSSSSSSS                   D and PC   1


  --                    --          2 or 4 / 2 or 13-20


  1


  Dest is always written; PC is written only when the result in Dest is zero (or not
  zero in syntax 2).


  DJZ or DJNZ decrements the value in Dest, writes the result, and jumps to the address
  described by Src if the


  result is zero (in syntax 1) or not zero (in syntax 2).


  The address (Src) can be absolute or relative. To specify an absolute address, Src
  must be a register containing a


  20-bit address value. To specify a relative address, use #Label for a 9-bit signed
  offset (a range of -256 to +255


  instructions) or use ##Label (or insert a prior AUGS instruction) for a 20-bit signed
  offset (a range of -524288 to


  +524287). Offsets are relative to the instruction following the DJZ / DJNZ. The
  signed offset value is in units of


  whole instructions-- it is added to PC as-is when in Cog/LUT execution mode and
  is multiplied by 4 then added to


  PC when in Hub execution mode (long-aligned Hub code not required).


  DRVC / DRVNC


  Drive C or not C


  I/O Pin Instruction - Set pin(s) direction to output and output level to low/high
  according to C or !C.


  DRVC        {#}Dest {WCZ}


  DRVNC {#}Dest {WCZ}


  Result: The I/O pins described by Dest are set to the output direction and to an
  output level of low/high according


  to C or !C; the rest are left as-is.


  *    Dest is the register, 9-bit literal, or 11-bit augmented literal whose value
  identifies the I/O pin(s) to set to


  output direction and output levels of low or high.


  *    WCZ is an optional effect to update flags.


  COND INSTR             FX      DEST          SRC             Write              C
  Flag              Z Flag             Clocks


  EEEE 1101011 CZL DDDDDDDDD 001011010 DIRx + OUTx Orig OUTx base bit Orig OUTx base
  bit


  1


  2


  EEEE 1101011 CZL DDDDDDDDD 001011011 DIRx + OUTx Orig OUTx base bit Orig OUTx base
  bit


  1


  2


  1


  New DIRx state is not data-forwarded; the next pipelined instruction sees the old
  state. Make sure any instruction that reads


  or modifies DIRx is at least two instructions after a DRVC or DRVNC.


  DRVC or DRVNC sets the I/O pin(s) designated by Dest to the output direction and
  to a low/high output level


  according to the state, or inverse state, of the C flag; i.e. alters the pin''s
  direction and output registers. All other


  pins are left unchanged. Each of these instructions, DRVC and DRVNC, can affect
  one or more of the bits within


  the DIRA or DIRB and OUTA or OUTB registers.


  DRVC or DRVNC achieves the same effect as two instructions-- OUTC, or OUTNC, followed
  by DIRH.


  Dest[5:0] indicates the pin number (0-63). For a range of pins, Dest[5:0] indicates
  the base pin number (0-63)


  and Dest[10:6] indicates how many contiguous pins beyond the base should be affected
  (1-31).


  A 9-bit literal Dest is enough to express the base pin (Dest[5:0]) and a range of
  up to 8 contiguous pins (Dest[8:6]).


  If needed, use the augmented literal feature (##Dest) to augment Dest to an 11-bit
  literal value-- this inserts an


  AUGD instruction prior.


  When Dest is a register, the register''s value bits [10:0] are used as-is to form
  the 11-bit ID range, unless a SETQ


  instruction immediately precedes the DRVC / DRVNC instruction; substituting SETQ''s
  Dest[4:0] in place of value


  bits[10:6], for DRVC / DRVNC''s use.


  The range calculation (from Dest[5:0] up to Dest[5:0]+Dest[10:6]) will wrap within
  the same 32-pin group (DIRA or


  DIRB and OUTA or OUTB); it will not cross the port boundary.


  If the WCZ effect is specified, the C and Z flags are updated to the original state
  of OUTA / OUTB''s base bit,


  identified by Dest.


  DRVH / DRVL


  Drive high or low


  I/O Pin Instruction - Set pin(s) direction to output and output level high (1) or
  low (0).


  DRVH {#}Dest {WCZ}


  DRVL {#}Dest {WCZ}


  Result: The I/O pins described by Dest are set to the output direction and to an
