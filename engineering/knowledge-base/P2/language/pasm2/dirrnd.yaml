instruction: DIRRND
syntax: DIRRND {#}Dest {WCZ}
encoding:
- EEEE 1101011 CZL DDDDDDDDD 001000110                 DIRx       Orig DIRx base bit
  Orig DIRx base bit           2
- EEEE 1101011 CZI DDDDDDDDD 001000100                DIRx       Orig DIRx base bit
  Orig DIRx base bit           2
- EEEE 1101011 CZI DDDDDDDDD 001000101                DIRx       Orig DIRx base bit
  Orig DIRx base bit           2
- EEEE 1011011 10I DDDDDDDDD SSSSSSSSS                    D and PC   1
- EEEE 1011011 00I DDDDDDDDD SSSSSSSSS                   D and PC   1
- EEEE 1101011 CZL DDDDDDDDD 001011010 DIRx + OUTx Orig OUTx base bit Orig OUTx base
