instruction: TJNF
syntax: TJNF Dest, {#}Src
brief_description: Test, jump if not full
category: Branch
description: >-
  TJNF tests the value in Dest and jumps to the address described by Src if the
  result is not full (<> -1; <> $FFFF_FFFF).

  The address (Src) can be absolute or relative. To specify an absolute address,
  Src must be a register containing a 20-bit address value. To specify a
  relative address, use #Label for a 9-bit signed offset (a range of -256 to
  +255 instructions) or use ##Label (or insert a prior AUGS instruction) for a
  20-bit signed offset (a range of -524288 to +524287). Offsets are relative to
  the instruction following the TJNF. The signed offset value is in units of
  whole instructions-- it is added to PC as-is when in Cog/LUT execution mode
  and is multiplied by 4 then added to PC when in Hub execution mode.
result: >-
  Dest is tested and if it's not full (<> $FFFF_FFFF), PC is set to a new
  relative (#Src) or absolute (Src) address.
parameters:
- Dest is a register whose value is tested for not full.
- 'Src is a register, 9-bit literal, or 20-bit augmented literal whose value is
  the absolute or relative address to set PC to. Use # for relative addressing;
  omit # for absolute addressing.'
flags_affected:
  C: No effect
  Z: No effect
syntax_variants:
- TJNF Dest, {#}Src
timing:
  cycles: 2
  type: variable
  notes: 2 or 4 cycles for Cog/LUT, 2 or 13-20 cycles for Hub execution
encoding:
- bits: EEEE 1011101 01I DDDDDDDDD SSSSSSSSS
  write: PC (conditional)
  c: —
  z: —
  clocks: '2 or 4 / 2 or 13-20'
  notes: PC is written only when Dest is not full
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
