instruction: JFBW
syntax: JFBW    {#}S
encoding:
- bits: EEEE 1011110 01I 000001001 SSSSSSSSS
  write: —
  c: —
  z: —
  clocks: '2 or 4'
timing:
  cycles: 2
  type: variable
  range: 13...20
description: >-
  JFBW checks the cog's FIFO interface block wrap flag and jumps to the address
  described by Src if the flag is set. Use # prefix on Src for relative addressing;
  omit # for absolute addressing.
result: >-
  If FIFO interface block wrap event flag is set, PC is set to a new relative (#Src)
  or absolute (Src) address; otherwise execution continues with the next instruction.
flags_affected:
  C: No effect
  Z: No effect
documentation_source: PASM2 Manual 2022/11/01
documentation_level: comprehensive
compiler_operand_format:
  name: operand_jpoll
  pattern: S/#
  description: 'Poll jump: target address/immediate'
  valueType: 21
compiler_encoding:
  operandFormat: 21
enhancement_source: PNUT_TS_v2.0_complete_operand_integration_2025-09-13
syntax_variants:
- JFBW {#}S
last_updated: '2025-09-19T16:04:17.429892'
parameters:
- 'Src is a register, 9-bit literal, or 20-bit augmented literal whose value is the
  absolute or relative address to set PC to. Use # for relative addressing; omit #
  for absolute addressing.'
category: Event
oneliner: Jump if FIFO interface block wrap event flag is set or clear
