instruction: POLLSE4
syntax: POLLSE4 {WC|WZ|WCZ}
brief_description: Poll SE4 event flag
category: Event
description: >-
  POLLSE4 copies the state of the selectable event 4 flag into C and/or Z and then
  clears the flag (unless it's being set again by the event sensor).
  If the WC, WZ, or WCZ effect is specified, the C flag and/or Z flag is updated to
  the state of the selectable event 4 flag prior to clearing it.
  The selectable event 4 flag is set whenever the corresponding configured event
  occurs. The flag is cleared upon execution of SETSE4, POLLSE4, WAITSE4, JSE4, or
  JNSE4 instructions.
result: SE4 event flag state is optionally copied into C and/or Z, then the flag is cleared.
parameters:
- WC, WZ, or WCZ are optional effects to update flags.
syntax_variants:
- POLLSE4 {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:
- bits: EEEE 1101011 CZ0 000000111 000100100
  write: —
  c: SE4 Event
  z: SE4 Event
  clocks: '2'
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
