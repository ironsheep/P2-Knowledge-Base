instruction: WAITSE4
syntax: WAITSE4 {WC|WZ|WCZ}
brief_description: Wait selectable event 1/2/3/4
category: Event
description: 'Wait for SE4 event flag, then clear it. Prior SETQ sets optional CT
  timeout value. C/Z = timeout.


  WAITSE1, WAITSE2, WAITSE3, or WAITSE4 waits for a selectable event to occur (unless
  the event flag is already


  set), then clears the event flag (unless it''s being set again by the event sensor)
  and resumes execution at the next


  instruction. Optionally, WAITSEx can time-out if the selectable event doesn''t occur
  soon enough; setting C and/or


  Z flags and then resuming execution at the next instruction.


  To set the optional timeout, insert a SETQ (with a future System Counter target
  value) right before WAITSEx.


  The WC, WZ, or WCZ effect is recommended only if the optional timeout is specified,
  in which case the C flag and/or


  Z flag is set (1) if a timeout occurred before the event, or is cleared (0) if the
  event occurred before the timeout.


  During a wait, the pipeline is stalled; no instructions execute and no interrupts
  are processed in the cog until the


  wait condition ends.


  The selectable event 1, 2, 3, or 4 flag is set whenever the corresponding configured
  event occurs. The selectable


  event flag is cleared upon execution of the corresponding SETSEx, POLLSEx, WAITSEx,
  JSEx, or JNSEx


  instructions.'
result: Wait for selectable event, then clear the flag; optionally aborting on timeout
  and setting C and/or Z on
parameters:
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  Z:
    formula: timeout
