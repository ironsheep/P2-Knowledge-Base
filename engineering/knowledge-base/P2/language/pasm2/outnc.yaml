instruction: OUTNC
syntax: OUTNC   {#}D           {WCZ}
category: Pin
description: 'OUTC or OUTNC alters the output level register''s bit(s) designated
  by Dest to equal the state, or inverse state, of Result: The I/O pin output level
  bit(s), described by Dest, are set to low/high according to C or !C; the rest are
  left as-is. Z = OUT bit.'
parameters:
- Dest is the register, 9-bit literal, or 11-bit augmented literal whose value identifies
  the I/O pin(s) for which output levels are to be set low or high.
- WCZ is an optional effect to update flags.
flags_affected:
  Z:
    formula: OUT bit
timing:
  cycles: 2
  type: fixed
encoding:
- bits: EEEE 1101011 CZL DDDDDDDDD 001001011
  write: OUTx
  c: —
  z: OUT bit
  clocks: '2'
documentation_source: PASM2 Manual 2022/11/01
documentation_level: comprehensive
compiler_operand_format:
  name: operand_pinop
  pattern: D/#0..511 {WC/WZ}
  description: 'Pin operation: destination/immediate pin number 0-511, optional effect
    flags'
  valueType: 30
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 30
