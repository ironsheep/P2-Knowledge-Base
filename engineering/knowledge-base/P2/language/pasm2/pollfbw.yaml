instruction: POLLFBW
syntax: POLLFBW {WC|WZ|WCZ}
brief_description: Poll FIFO block wrap
category: Event
description: 'POLLFBW copies the state of the FIFO-interface-block-wrap event flag
  into C and/or Z and then clears the flag Result: FIFO-interface-block-wrap event
  flag is optionally copied into C and/or Z, then it is cleared.


  POLLFBW copies the state of the FIFO-interface-block-wrap event flag into C and/or
  Z and then clears the flag


  (unless it''s being set again by the event sensor).


  If the WC, WZ, or WCZ effect is specified, the C flag and/or Z flag is updated to
  the state of the FIFO-interface-block-


  wrap event flag prior to clearing it.


  The FIFO-interface-block-wrap event flag is set whenever the Hub RAM FIFO interface
  exhausts its block count


  and reloads its block count and start address. The FIFO-interface-block-wrap event
  flag is cleared upon execution


  of RDFAST, WRFAST, FBLOCK, POLLFBW, WAITFBW, JFBW, or JNFBW instructions.'
result: FIFO-interface-block-wrap event flag is optionally copied into C and/or Z,
  then it is cleared.
parameters:
- WC, WZ, or WCZ are optional effects to update flags.
syntax_variants:
- POLLFBW {WC|WZ|WCZ}
