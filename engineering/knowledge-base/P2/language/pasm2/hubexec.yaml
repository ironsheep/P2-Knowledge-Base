constant: HUBEXEC
name: HUBEXEC
description: 'Predefined constant for COGINIT instruction

  Executes code directly from hub RAM without loading to cog RAM

  '
category: Execution Mode Constants
value: '%0_1_0000'
documentation_level: complete
syntax: 'COGINIT #HUBEXEC+id, #address'
usage: 'Used with COGINIT to start a cog executing from hub RAM

  Target cog executes instructions directly from hub RAM (no cog RAM load)

  '
examples:
- code: 'COGINIT #HUBEXEC+1, #$400   '' Start Cog 1 executing from Hub RAM $400

    '
  description: Start specific cog with hub execution
- code: 'COGINIT #HUBEXEC+5, @code   '' Start Cog 5 executing from @code in hub

    '
  description: Start Cog 5 with hub execution at label
notes:
- Executes instructions directly from hub RAM (no cog RAM load)
- Hub execution allows unlimited code size (not limited to 512 longs)
- Slower than cog execution due to hub access timing
- Instruction fetching through FIFO/streamer
- Must specify target cog ID (0-7)
- Use HUBEXEC_NEW to auto-select available cog
- See also HUBEXEC_NEW and HUBEXEC_NEW_PAIR variants
related:
- COGEXEC
- ORGH
- HUBEXEC_NEW
- HUBEXEC_NEW_PAIR
oneliner: Set hub execution mode for subsequent code
