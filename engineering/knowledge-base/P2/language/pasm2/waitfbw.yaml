instruction: WAITFBW
syntax: WAITFBW {WC|WZ|WCZ}
encoding: "EEEE 1101011 CZ0 000011001 000100100                 --          Timeout Abort     Timeout Abort          \
  \     2+"
timing:
  cycles: 2
  type: variable
description: "WAITFBW waits for a FIFO-interface-block-wrap event to occur (unless the event flag is already set), then clears\
  \ Result: Wait for FIFO-interface-block-wrap event, then clear the flag; optionally aborting on timeout and setting C and/or\
  \ Z on abort. Z = timeout.\n\nWAITFBW waits for a FIFO-interface-block-wrap event to occur (unless the event flag is\
  \ already set), then clears\n\nthe event flag (unless it's being set again by the event sensor) and resumes execution\
  \ at the next instruction.\n\nOptionally, WAITFBW can time-out if the FIFO-interface-block-wrap event doesn't occur soon\
  \ enough; setting C\n\nand/or Z flags and then resuming execution at the next instruction.\n\nTo set the optional timeout,\
  \ insert a SETQ (with a future System Counter target value) right before WAITFBW.\n\nThe WC, WZ, or WCZ effect is recommended\
  \ only if the optional timeout is specified, in which case the C flag and/or\n\nZ flag is set (1) if a timeout\
  \ occurred before the event, or is cleared (0) if the event occurred before the timeout.\n\nDuring a wait, the pipeline\
  \ is stalled; no instructions execute and no interrupts are processed in the cog until the\n\nwait condition ends.\n\nThe\
  \ FIFO-interface-block-wrap event flag is set whenever the Hub RAM FIFO interface exhausts its block count\n\nand reloads\
  \ its block count and start address. The FIFO-interface-block-wrap event flag is cleared upon execution\n\nof RDFAST,\
  \ WRFAST, FBLOCK, POLLFBW, WAITFBW, JFBW, or JNFBW instructions."
