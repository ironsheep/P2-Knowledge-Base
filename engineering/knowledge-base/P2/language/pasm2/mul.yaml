instruction: MUL
syntax: MUL Dest, {#}Src {WZ}
brief_description: Multiply
category: Math and Logic
description: >-
  MUL multiplies the lower 16-bits of each of Dest and Src together and stores the
  32-bit product result into the Dest register. This is a fast (2-clock) 16 x 16 bit
  multiplication operation-- to multiply larger factors, use the CORDIC Solver QMUL
  instruction. D = unsigned (D[15:0] * S[15:0]).
  If the WZ effect is specified, the Z flag is set (1) if either the Dest or Src values
  are zero, or is cleared (0) if both are non-zero.
result: >-
  The 32-bit unsigned product of the 16-bit Dest and Src multiplication is stored
  into Dest and optionally the Z flag is updated to the Dest or Src zero status.
parameters:
- Dest is a register containing the 16-bit value to multiply with Src, and is where
  the result is written.
- Src is a register, 9-bit literal, or 16-bit augmented literal whose value is multiplied
  into Dest.
- WZ is an optional effect to update the Z flag.
flags_affected:
  Z:
    formula: (S == 0) | (D == 0)
syntax_variants:
- MUL Dest, {#}Src {WZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 1010000 0ZI DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: (D = 0) | (S = 0)
  clocks: '2'
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
