instruction: BITRND
syntax: BITRND Dest, {#}Src {WCZ}
encoding:
- EEEE 0100110 CZI DDDDDDDDD SSSSSSSSS                   D         Original D base
  bit Original D base bit         2
- EEEE 0100100 CZI DDDDDDDDD SSSSSSSSS                   D         Original D base
  bit Original D base bit         2
- EEEE 0100101 CZI DDDDDDDDD SSSSSSSSS                   D         Original D base
  bit Original D base bit         2
timing:
  cycles: 2
  type: fixed
description: 'BITRND alters the Dest bit(s) designated by Src to each be an independent
  random low and high value, based on Result: Dest bit(s) described by Src are each
  set randomly low or high; the rest are left as-is. Z = original D[S[4:0]].


  BITRND alters the Dest bit(s) designated by Src to each be an independent random
  low and high value, based on


  bit(s) from the Xoroshiro128** PRNG. All other bits are left unchanged.


  Src[4:0] indicates the bit number (0--31). For a range of bits, Src[4:0] indicates
  the base bit number (0--31) and


  Src[9:5] indicates how many contiguous bits beyond the base should be affected (1-31).


  A 9-bit literal Src is enough to express the base bit (Src[4:0]) and a range of
  up to 16 contiguous bits (Src[8:5]). If


  needed, use the augmented literal feature (##Src) to augment Src to a 10-bit literal
  value-- this inserts an AUGS


  instruction prior.


  When Src is a register, the register''s value bits [9:0] are used as-is to form
  the 10-bit ID range, unless a SETQ


  instruction immediately precedes the BITRND instruction; substituting SETQ''s Dest[4:0]
  in place of value bits[9:5],


  for BITRND''s use.


  If the WCZ effect is specified, the C and Z flags are updated to the original state
  of Dest''s base bit, identified by Src.


  BITZ / BITNZ


  Bit Z or not Z


  Bit Operation Instruction - Set bit(s) low/high according to Z or !Z.


  BITZ    Dest, {#}Src {WCZ}


  BITNZ Dest, {#}Src {WCZ}


  Result: Dest bit(s) described by Src are set to Z or !Z; the rest are left as-is.


  *   Dest is the register whose value will have one or more bits set to Z or !Z.


  *   Src is a register, 9-bit literal, or 10-bit augmented literal whose value identifies
  the bit(s) to modify.


  *   WCZ is an optional effect to update flags.


  COND INSTR         FX     DEST          SRC           Write            C Flag              Z
  Flag             Clocks


  EEEE 0100100 CZI DDDDDDDDD SSSSSSSSS                   D         Original D base
  bit Original D base bit         2


  EEEE 0100101 CZI DDDDDDDDD SSSSSSSSS                   D         Original D base
  bit Original D base bit         2


  BITZ or BITNZ alters the Dest bit(s) designated by Src to equal the state, or inverse
  state, of the Z flag. All other


  bits are left unchanged.


  Src[4:0] indicates the bit number (0--31). For a range of bits, Src[4:0] indicates
  the base bit number (0--31) and


  Src[9:5] indicates how many contiguous bits beyond the base should be affected (1-31).


  A 9-bit literal Src is enough to express the base bit (Src[4:0]) and a range of
  up to 16 contiguous bits (Src[8:5]). If


  needed, use the augmented literal feature (##Src) to augment Src to a 10-bit literal
  value-- this inserts an AUGS


  instruction prior.


  When Src is a register, the register''s value bits [9:0] are natrally used as-is
  to form the 10-bit ID range, unless a


  SETQ instruction immediately precedes the BITZ / BITNZ instruction; substituting
  SETQ''s Dest[4:0] in place of


  value bits[9:5], for BITZ / BITNZ''s use.


  If the WCZ effect is specified, the C and Z flags are updated to the original state
  of Dest''s base bit, identified by Src.'
