instruction: MUXNZ
syntax: MUXNZ   D,{#}S   {WC/WZ/WCZ}
category: Math and Logic
description: >-
  MUXNZ alters the Dest bit(s) designated by Src (high bits) to equal the inverse
  state of the Z flag. Dest bit(s) described by Src are set to !Z; the rest are left
  as-is. Flags are optionally updated with parity and zero status of the result.
parameters:
- Dest is the register whose value will have one or more bits set to Z or !Z.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value identifies
  the bit(s) to modify.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C:
    formula: parity of result
timing:
  cycles: 2
  type: fixed
encoding:
- bits: EEEE 0101111 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: parity of result
  z: Result = 0
  clocks: '2'
documentation_source: PASM2 Manual 2022/11/01
documentation_level: comprehensive
compiler_operand_format:
  name: operand_ds
  pattern: D,S/#
  description: Destination register, Source register or immediate value
  valueType: 0
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 0
