instruction: FLTNC
syntax: FLTNC   {#}D           {WCZ}
category: Pin
description: 'FLTC or FLTNC sets the I/O pin(s) designated by Dest to the input direction
  and to a low/high output level Result: The I/O pins described by Dest are set to
  the input direction and to an output level of low/high according to C or !C; the
  rest are left as-is. Z = OUT bit.'
parameters:
- Dest is the register, 9-bit literal, or 11-bit augmented literal whose value identifies
  the I/O pin(s) to set to input direction and output levels of low or high.
- WCZ is an optional effect to update flags.
flags_affected:
  Z:
    formula: OUT bit
timing:
  cycles: 2
  type: fixed
encoding:
- bits: EEEE 1101011 CZL DDDDDDDDD 001010011
  write: DIRx* + OUTx
  c: —
  z: OUT bit
  clocks: '2'
encoding_notes:
- New DIRx state is not data-forwarded; the next pipelined instruction sees the old state.
documentation_source: PASM2 Manual 2022/11/01
documentation_level: comprehensive
compiler_operand_format:
  name: operand_pinop
  pattern: D/#0..511 {WC/WZ}
  description: 'Pin operation: destination/immediate pin number 0-511, optional effect
    flags'
  valueType: 30
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 30
enhancement_source: PNUT_TS_v2.0_complete_operand_integration_2025-09-13
last_updated: '2025-09-19T16:04:17.199642'
oneliner: Set pin(s) direction to input and an output level of low/high according
