instruction: DECMOD
syntax: DECMOD Dest, {#}Src {WC|WZ|WCZ}
brief_description: Decrement modulus
category: Math and Logic
description: 'DECMOD compares Dest with 0-- if not equal, it decrements Dest; otherwise
  it sets Dest equal to Src. If Dest Result: If Dest was not equal to 0, it is decremented
  by 1; otherwise Dest is reset to Src. Optionally, C and Z are updated to indicate
  reset and zero result status.


  DECMOD compares Dest with 0-- if not equal, it decrements Dest; otherwise it sets
  Dest equal to Src. If Dest


  begins in the range 0 to Src, iterations of DECMOD will decrement Dest repetitively
  from Src to 0.


  If the WC or WCZ effect is specified, the C flag is set (1) if Dest was equal to
  0 and subsequently reset to Src; or is


  cleared (0) if not reset.


  If the WZ or WCZ effect is specified, the Z flag is set (1) if the result is zero,
  or is cleared (0) if it is non-zero.


  DECMOD does not limit Dest within the specified range-- if Dest begins as greater
  than Src, iterations of DECMOD


  will continue to decrement it down through Src before it will effectively cycle
  from Src to 0.'
result: If Dest was not equal to 0, it is decremented by 1; otherwise Dest is reset
  to Src. Optionally, C and Z are
parameters:
- Dest is a register containing the value to decrement down to 0 with modulus, and
  is where the result is written.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value is the
  modulus limit to apply to Dest's decrement operation.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  Z: Result = 0
