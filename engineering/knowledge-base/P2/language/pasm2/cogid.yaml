instruction: COGID
syntax: COGID {#}Dest {WC}
brief_description: Cog identification
category: Hub Control
description: 'COGID writes the current cog''s ID into Dest (if Dest is a register and WC is omitted) or sets/clears the C flag according to the running/stopped state of the cog indicated by Dest[2:0] (if WC is given). If the WC effect is specified, the C flag is set (1) if the Dest[2:0] cog is running, or is cleared (0) if stopped.'
result: Current cog's ID is written to Dest or C is set (1) or cleared (0) if the
  Dest cog is running or stopped.
parameters:
- Dest is the register where the current cog's ID will be written, or is the register
  or 9-bit literal whose value (lower 3-bits) indicates which cog to get the status
  for.
- WC is an optional effect to update the C flag with the Dest cog's running status.
flags_affected:
  C: Set to 1 if specified cog is running, 0 if stopped (when WC specified)
  Z: Not affected
syntax_variants:
- COGID {#}Dest {WC}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 1101011 C0L DDDDDDDDD 000000001
  write: D if reg and !WC
  c: Cog Running
  z: —
  clocks: 2–9, +2 if result
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_l
  pattern: D/#0..511
  description: Destination or immediate value 0-511
  valueType: 26
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 26
enhancement_source: PNUT_TS_v2.0_complete_operand_integration_2025-09-13
last_updated: '2025-09-19'
manual_extraction_date: '2025-01-19'
oneliner: Get current cog's ID or any cog's status by ID
related:
- COGINIT
- COGSTOP
