instruction: CALLPB
syntax: CALLPB  {#}D,{#}S
category: Branch
description: 'CALLPA and CALLPB records the current state of the C and Z flags and
  the address of the next instruction (PC + 1 Result: Push current C and Z flags and
  address of the next instruction onto the hardware stack, copy D to PA or PB, and
  set PC to new relative or absolute address.'
parameters:
- Dest is a register, 9-bit literal, or 32-bit augmented literal whose value is copied
  to PA or PB.
- 'Src is a register, 9-bit literal, or 32-bit augmented literal that contains the
  relative or absolute address to set PC to. Use # for relative addressing; omit #
  for absolute addressing.'
timing:
  cycles: 4
  type: variable
  range: 4 / 13...20
encoding:
- bits: EEEE 1011010 1LI DDDDDDDDD SSSSSSSSS
  write: K¹, PB and PC
  c: —
  z: —
  clocks: 4 / 13–20
encoding_notes:
- The current C, Z, and effective next PC values are pushed onto the stack (K) prior
  to updating PC with Src.
documentation_source: PASM2 Manual 2022/11/01
documentation_level: comprehensive
compiler_operand_format:
  name: operand_lsj
  pattern: D/#,S/@
  description: 'Jump/call with immediate destination and relative source: destination/immediate,
    relative address'
  valueType: 14
compiler_encoding:
  operandFormat: 14
