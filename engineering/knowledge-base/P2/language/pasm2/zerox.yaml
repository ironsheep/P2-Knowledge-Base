instruction: ZEROX
syntax: ZEROX Dest, {#}Src {WC|WZ|WCZ}
brief_description: Zero extend
category: Math and Logic
description: 'ZEROX fills the bits of Dest, above the bit indicated by Src[4:0], with
  zeros; i.e. zero-extending the value. This is C = MSB of result.


  ZEROX fills the bits of Dest, above the bit indicated by Src[4:0], with zeros; i.e.
  zero-extending the value. This is


  handy when converting encoded or received unsigned values from a small bit width
  to a large bit with; i.e. 32 bits.


  If the WC or WCZ effect is specified, the C flag is set to the result''s MSB value.


  If the WZ or WCZ effect is specified, the Z flag is set (1) if the result is zero,
  or is cleared (0) if it is non-zero.


