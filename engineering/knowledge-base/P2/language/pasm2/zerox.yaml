result: The Dest value is zero-extended above the bit indicated by Src and is stored
  in Dest. Optionally the C and
parameters:
- Dest is a register containing the value to zero-extend above bit Src[4:0] and is
  where the result is written.
- Src is a register or 9-bit literal whose value (lower 5 bits) identifies the bit
  of Dest to zero-extend beyond.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  Z: Result = 0
syntax_variants:
- ZEROX Dest, {#}Src {WC|WZ|WCZ}
- ZEROX fills the bits of Dest, above the bit indicated by Src[4:0], with zeros; i.e.
  zero-extending the value. This is
- ZEROX    D,{#}S     {WC/WZ/WCZ}         Zero-extend D above bit S[4:0]. C = MSB
  of result. *                                                                         2
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 0111010 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: MSB of result
  z: Result = 0
  clocks: '2'
