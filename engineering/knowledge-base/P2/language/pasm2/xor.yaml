instruction: XOR
syntax: XOR Dest, {#}Src {WC|WZ|WCZ}
encoding: EEEE 0101011 CZI DDDDDDDDD SSSSSSSSS                   D          Parity of Result      Result = 0               2
timing:
  cycles: 2
  type: fixed
description: "XOR performs a bitwise XOR of the value in Src into that of Dest. Result: Dest XOR Src is stored in Dest and\
  \ flags are optionally updated with parity and zero status.\n\nXOR performs a bitwise XOR of the value in Src into that\
  \ of Dest.\n\nIf the WC or WCZ effect is specified, the C flag is set (1) if the result contains an odd number of\
  \ high (1) bits, or is\n\ncleared (0) if it contains an even number of high bits.\n\nIf the WZ or WCZ effect is specifi\
  ed, the Z flag is set (1) if the Dest XOR Src result equals zero, or is cleared (0) if it\n\nis non-zero."
flags_affected:
  Z: Result = 0
parameters:
- Dest is the register containing the value to bitwise XOR with Src and is the destination in which to write the result.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value will be bitwise XORed into Dest.
- "WC, WZ, or WCZ are optional effects to update flags."
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_ds
  pattern: D,S/#
  description: Destination register, Source register or immediate value
  valueType: 0
compiler_encoding:
  operandFormat: 0
