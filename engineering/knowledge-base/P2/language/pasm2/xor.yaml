instruction: XOR
syntax: XOR Dest, {#}Src {WC|WZ|WCZ}
brief_description: Exclusive or
category: Math and Logic
description: >-
  XOR performs a bitwise XOR of the value in Src into that of Dest. If the WC or WCZ
  effect is specified, the C flag is set (1) if the result contains an odd number of
  high (1) bits, or is cleared (0) if it contains an even number of high bits. If the
  WZ or WCZ effect is specified, the Z flag is set (1) if the Dest XOR Src result
  equals zero, or is cleared (0) if it is non-zero.
result: >-
  Dest XOR Src is stored in Dest and flags are optionally updated with parity and
  zero status.
parameters:
- Dest is the register containing the value to bitwise XOR with Src and is the destination
  in which to write the result.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value will be
  bitwise XORed into Dest.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set if odd number of high (1) bits in result (parity)
  Z: Set if result equals zero
syntax_variants:
- XOR D,{#}S {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 0101011 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: Parity of Result
  z: Result = 0
  clocks: '2'
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_ds
  pattern: D,S/#
  description: Destination register, Source register or immediate value
  valueType: 0
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 0
