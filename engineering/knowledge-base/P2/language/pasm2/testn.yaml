instruction: TESTN
syntax: TESTN Dest, {#}Src {WC|WZ|WCZ}
brief_description: Test not
category: Math and Logic
description: >-
  TESTN determines the parity (number of high (1) bits) and the zero or non-zero
  state of Dest bitwise ANDed with !Src and stores the results in the C and/or Z
  flag.

  If the WC or WCZ effect is specified, the C flag is set (1) if the number of
  high (1) bits in Dest ANDed with !Src is odd, or is cleared (0) if it is even.

  If the WZ or WCZ effect is specified, the Z flag is set (1) if Dest ANDed with
  !Src is zero, or is cleared (0) if it is not zero.
result: >-
  The parity and zero-state of Dest bitwise ANDed with !Src is stored in the C
  and Z flags.
parameters:
- Dest is the register whose value will be tested.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose inverse
  value is ANDed with Dest.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set if odd number of high (1) bits in result (parity)
  Z: Set if result equals zero
syntax_variants:
- TESTN Dest, {#}Src {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:
- bits: EEEE 0111111 CZI DDDDDDDDD SSSSSSSSS
  write: —
  c: Parity of (D & !S)
  z: (D & !S) = 0
  clocks: '2'
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
