instruction: WMLONG
syntax: WMLONG  D,{#}S/P
encoding: EEEE 1010011 11I DDDDDDDDD SSSSSSSSS
timing:
  cycles: 3
  type: fixed
description: Write only non-$00 bytes in D[31:0] to hub address {#}S/PTRx. Prior SETQ/SETQ2
  invokes cog/LUT block transfer.
