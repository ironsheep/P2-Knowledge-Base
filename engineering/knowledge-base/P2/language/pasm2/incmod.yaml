  MODC / MODZ / MODCZ


  Modify C, Z, or C and Z


  Flag Modification Instruction - Modify C and/or Z flag(s) according to modifier
  mode and current state(s).


  MODC    CModifier {WC}


  MODZ    ZModifier {WZ}


  MODCZ CModifier, ZModifier {WC|WZ|WCZ}


  Result: The C and/or Z flag is set or cleared according to the given Modifier and
  the current state of the C and/or


  Z flags.


  *   CModifer is a Modifier symbol for the designated mode to apply to the C flag.


  *   ZModifer is a Modifier symbol for the designated mode to apply to the Z flag.


  *   WC, WZ, or WCZ are optional effects to update flags.


  COND INSTR        FX     DEST        SRC           Write            C Flag            Z
  Flag             Clocks


  EEEE 1101011 C01 0cccc0000 001101111                --           C=cccc[{C,Z}]          --                     2


  EEEE 1101011 0Z1 00000zzzz 001101111                --                --            Z=zzzz[{C,Z}]              2


  EEEE 1101011 CZ1 0cccczzzz 001101111                --           C=cccc[{C,Z}]     Z=zzzz[{C,Z}]              2


  MODC, MODZ, or MODCZ sets or clears the C and/or Z flag based on the mode described
  by the given Modifier


  symbol(s) and the current state of the C and/or Z flag. The WC, WZ, and WCZ effects
  are required to affect the


  designated flag.


  These flag modifier instructions allow code to preset flags to a desired state which
  may be required for entry into


  certain code routines, or to set a special state based on multiple events that are
  otherwise not possible to realize


  with a single instruction.


  If the WC, WZ, or WCZ effect is specified, the C, Z, or both C and Z flags are updated
  according to the given


  CModifier or ZModifier. See the Modifier Symbols table for details.


  Modifier Symbols (for MODC / MODZ / MODCZ)


  Modifier1      Encoding2      Description


  _CLR              %0000      Clear C/Z (C == 0 and/or Z == 0)


  _E                %1010      Set C/Z if comparison/subtraction was equal (C == Z
  and/or Z == Z)


  _NE               %0101      Set C/Z if comparison/subtraction was not equal (C
  == !Z and/or Z == !Z)


  _GT               %0001      Set C/Z if comparison/subtraction was greater than
  (C == !C AND !Z and/or Z == !C AND !Z)


  _GE               %0011      Set C/Z if comparison/subtraction was greater than
  or equal (C == !C and/or Z == !C)


  _LT               %1100      Set C/Z if comparison/subtraction was less than (C
  == C and/or Z == C)


  _LE               %1110      Set C/Z if comparison/subtraction was less than or
  equal (C == C OR Z and/or Z == C OR Z)


  _C                %1100      Set C/Z to C (C == C and/or Z == C)


  _NC               %0011      Set C/Z to inverse of C (C == !C and/or Z == !C)


  _Z                %1010      Set C/Z to Z (C == Z and/or Z == Z)


  _NZ               %0101      Set C/Z to inverse of Z (C == !Z and/or Z == !Z)


  _C_EQ_Z           %1001      Set C/Z if C equal to Z (C == C = Z and/or Z == C =
  Z)


  _C_NE_Z           %0110      Set C/Z if C not equal to Z (C == C <> Z and/or Z ==
  C <> Z)


  _C_AND_Z          %1000      Set C/Z to C AND Z (C == C AND Z and/or Z == C AND
  Z)


  _C_AND_NZ         %0100      Set C/Z to C AND NOT Z (C == C AND !Z and/or Z == C
  AND !Z)


  _NC_AND_Z         %0010      Set C/Z to NOT C AND Z (C == !C AND Z and/or Z == !C
  AND Z)


  _NC_AND_NZ        %0001      Set C/Z to NOT C AND NOT Z (C == !C AND !Z and/or Z
  == !C AND !Z)


  _C_OR_Z           %1110      Set C/Z to C OR Z (C == C OR Z and/or Z == C OR Z)


  _C_OR_NZ          %1101      Set C/Z to C OR NOT Z (C == C OR !Z and/or Z == C OR
  !Z)


  _NC_OR_Z          %1011      Set C/Z to NOT C OR Z (C == !C OR Z and/or Z == !C
  OR Z)


  _NC_OR_NZ         %0111      Set C/Z to NOT C OR NOT Z (C == !C OR !Z and/or Z ==
  !C OR !Z)


  _Z_EQ_C           %1001      Set C/Z if Z equal to C (C == Z = C and/or Z == Z =
  C)


  _Z_NE_C           %0110      Set C/Z if Z not equal to C (C == Z <> C and/or Z ==
  Z <> C)


  _Z_AND_C          %1000      Set C/Z to Z AND C (C == Z AND C and/or Z == Z AND
  C)


  _Z_AND_NC         %0010      Set C/Z to Z AND NOT C (C == Z AND !C and/or Z == Z
  AND !C)


  _NZ_AND_C         %0100      Set C/Z to NOT Z AND C (C == !Z AND C and/or Z == !Z
  AND C)


  _NZ_AND_NC        %0001      Set C/Z to NOT Z AND NOT C (C == !Z AND !C and/or Z
  == !Z AND !C)


  _Z_OR_C           %1110      Set C/Z to Z OR C (C == Z OR C and/or Z == Z OR C)


  _Z_OR_NC          %1011      Set C/Z to Z OR NOT C (C == Z OR !C and/or Z == Z OR
  !C)


  _NZ_OR_C          %1101      Set C/Z to NOT Z OR C (C == !Z OR C and/or Z == !Z
  OR C)


  _NZ_OR_NC         %0111      Set C/Z to NOT Z OR NOT C (C == !Z OR !C and/or Z ==
  !Z OR !C)


  _SET              %1111      Set C/Z (C == 1 and/or Z == 1)


  1


  Use Modifier symbol(s) in MODC, MODZ, and MODCZ instructions. Note that the symbol
  and description is similar to, and


  the encoding exactly matches, that of the related Conditions used to include/exclude
  instructions at run time.


  2


  The encoding is the 4-bit value placed into the MODC, MODZ, and MODCZ instruction''s
  cccc or zzzz opcode field by the


  compiler.'
