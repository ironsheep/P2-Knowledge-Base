  type: fixed
description: 'INCMOD compares Dest with Src-- if not equal, it increments Dest; otherwise
  it sets Dest equal to 0. If Dest Result: If Dest was not equal to Src, it is incremented
  by 1; otherwise Dest is reset to 0. Optionally, C and Z are updated to indicate
  reset and zero result status.


  INCMOD compares Dest with Src-- if not equal, it increments Dest; otherwise it sets
  Dest equal to 0. If Dest


  begins in the range 0 to Src, iterations of INCMOD will increment Dest repetitively
  from 0 to Src.


  If the WC or WCZ effect is specified, the C flag is set (1) if Dest was equal to
  Src and subsequently reset to 0; or is


  cleared (0) if not reset.


  If the WZ or WCZ effect is specified, the Z flag is set (1) if the result is zero,
  or is cleared (0) if it is non-zero.


  INCMOD does not limit Dest within the specified range-- if Dest begins as greater
  than Src, iterations of INCMOD


  will continue to increment it through the 32-bit rollover point (back to 0) before
  it will effectively cycle from 0 to


  Src.


  JATN / JNATN


  Jump if attention or not attention


  Event Branch Instruction - Jump if attention flag is set or clear.


  JATN        {#}Src


  JNATN {#}Src


  Result: If ATN event flag is set (or is clear in syntax 2), PC is set to a new relative
  (#Src) or absolute (Src) address.


  *    Src is a register, 9-bit literal, or 20-bit augmented literal whose value is
  the absolute or relative address to


  set PC to. Use # for relative addressing; omit # for absolute addressing.


  COND INSTR            FX      DEST           SRC            Write             C
  Flag          Z Flag             Clocks


  EEEE 1011110 01I 000001110 SSSSSSSSS                     PC   1


  --              --          2 or 4 / 2 or 13-20


  EEEE 1011110 01I 000011110 SSSSSSSSS                     PC   1


  --              --          2 or 4 / 2 or 13-20


  1


  PC is written only when the ATN event flag is set (or is clear in syntax 2).


  JATN or JNATN checks the cog''s attention signal and jumps to the address described
  by Src if attention is set (in


  syntax 1) or is clear (in syntax 2). The cog''s attention signal, when set, indicates
  that one or more other cogs are


  requesting this cog''s attention. See the Hardware Manual''s Cog Attention section
  for more information.


  The address (Src) can be absolute or relative. To specify an absolute address, Src
  must be a register containing a


  20-bit address value. To specify a relative address, use #Label for a 9-bit signed
  offset (a range of -256 to +255


  instructions) or use ##Label (or insert a prior AUGS instruction) for a 20-bit signed
  offset (a range of -524288 to


  +524287). Offsets are relative to the instruction following the JATN / JNATN. The
  signed offset value is in units


  of whole instructions-- it is added to PC as-is when in Cog/LUT execution mode and
  is multiplied by 4 then added


  to PC when in Hub execution mode (long-aligned Hub code not required).


