instruction: GETWORD
syntax: 'GETWORD Dest, {#}Src, #Num'
encoding:
- EEEE 1001001 1NI DDDDDDDDD SSSSSSSSS                  D                --                  --                    2
- EEEE 1001001 100 DDDDDDDDD 000000000                  D                --                  --                    2
- EEEE 1011100 00I DDDDDDDDD SSSSSSSSS                   D and PC   1
timing:
  cycles: 1
  type: fixed
description: 'GETWORD reads the word identified by Num (0-1) from Src, or a word from
  the source described by a prior ALTGW Result: Word Num (0-1) of Src, or a word from
  a source described by prior ALTGW instruction, is written to Dest.


  GETWORD reads the word identified by Num (0-1) from Src, or a word from the source
  described by a prior ALTGW


  instruction.


  Num (0-1) identifies a value''s words, by position, in least-significant word order.


  Syntax 2 is intended for use after an ALTGW instruction; i.e. in a loop to iteratively
  read a series of word values


  within contiguous long registers.


  IF_x (Conditions)


  See Conditions ( IF_x ).


  IJZ / IJNZ


  Increment, jump if zero or not zero


  Flow Control Instruction - Increment value and jump if zero or not zero.


  IJZ        Dest, {#}Src


  IJNZ Dest, {#}Src


  Result: Dest is incremented, and if the result is zero (or not zero in syntax 2),
  PC is set to a new relative (#Src) or


  absolute (Src) address.


  *    Dest is a register whose value is incremented and tested for zero or not zero.


  *    Src is a register, 9-bit literal, or 20-bit augmented literal whose value is
  the absolute or relative address to


  set PC to. Use # for relative addressing; omit # for absolute addressing.


  COND INSTR             FX      DEST          SRC             Write              C
  Flag              Z Flag             Clocks


  EEEE 1011100 00I DDDDDDDDD SSSSSSSSS                   D and PC   1


  --                    --          2 or 4 / 2 or 13-20


  EEEE 1011100 01I DDDDDDDDD SSSSSSSSS                   D and PC   1


  --                    --          2 or 4 / 2 or 13-20


  1


  Dest is always written; PC is written only when the result in Dest is zero (or not
  zero in syntax 2).


  IJZ or IJNZ increments the value in Dest, writes the result, and jumps to the address
  described by Src if the


  result is zero (syntax 1) or not zero (in syntax 2).


  The address (Src) can be absolute or relative. To specify an absolute address, Src
  must be a register containing a


  20-bit address value. To specify a relative address, use #Label for a 9-bit signed
  offset (a range of -256 to +255


  instructions) or use ##Label (or insert a prior AUGS instruction) for a 20-bit signed
  offset (a range of -524288 to


  +524287). Offsets are relative to the instruction following the IJZ / IJNZ. The
  signed offset value is in units of


  whole instructions-- it is added to PC as-is when in Cog/LUT execution mode and
  is multiplied by 4 then added to


  PC when in Hub execution mode (long-aligned Hub code not required).'
flags_affected:
  C:
    when: D
parameters:
- Dest is the register in which to store the word.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value contains
  the target word to read.
- Num is a 1-bit literal identifying the word ID (0-1) of Src to read.
- Dest is a register whose value is incremented and tested for zero or not zero.
- 'Src is a register, 9-bit literal, or 20-bit augmented literal whose value is the
  absolute or relative address to set PC to. Use # for relative addressing; omit #
  for absolute addressing.'
