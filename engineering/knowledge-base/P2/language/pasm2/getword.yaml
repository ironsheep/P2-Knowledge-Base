instruction: GETWORD
syntax: 'GETWORD Dest, {#}Src, #Num'
brief_description: Get word
category: Math and Logic
description: >-
  GETWORD reads the word identified by Num (0-1) from Src, or a word from the
  source described by a prior ALTGW instruction.

  Num (0-1) identifies a value's words, by position, in least-significant word
  order.

  Syntax 2 is intended for use after an ALTGW instruction; i.e. in a loop to
  iteratively read a series of word values within contiguous long registers.
result: >-
  Word Num (0-1) of Src, or a word from a source described by prior ALTGW
  instruction, is written to Dest.
parameters:
- Dest is the register in which to store the word.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value
  contains the target word to read.
- Num is a 1-bit literal identifying the word ID (0-1) of Src to read.
flags_affected:
  C: Not affected
  Z: Not affected
syntax_variants:
- 'GETWORD Dest, {#}Src, #Num'
- GETWORD Dest
timing:
  cycles: 2
  type: fixed
encoding:
- bits: EEEE 1001001 1NI DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2'
  notes: Syntax 1 - N selects word 0 or 1
- bits: EEEE 1001001 100 DDDDDDDDD 000000000
  write: D
  c: —
  z: —
  clocks: '2'
  notes: Syntax 2 - after ALTGW
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_ds1get
  pattern: D{,S/#,#0..1}
  description: 'Get word: destination, optional source and word index 0-1'
  valueType: 11
