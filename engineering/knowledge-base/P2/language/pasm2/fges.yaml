instruction: FGES
syntax: FGES Dest, {#}Src {WC|WZ|WCZ}
brief_description: Force greater or equal, signed
category: Math and Logic
description: >-
  FGES sets signed Dest to signed Src if Dest is less than Src. This is also
  known as a limit minimum function; preventing Dest from sinking below Src.

  If the WC or WCZ effect is specified, the C flag is set (1) if Dest was limited
  (Dest was less than Src and now Dest is equal to Src), or is cleared (0) if not
  limited.

  If the WZ or WCZ effect is specified, the Z flag is set (1) if the result is zero,
  or is cleared (0) if it is non-zero.
result: >-
  Signed Dest is set to signed Src if Dest was less than Src. Optionally the C and
  Z flags indicate if the replacement happened and the zero status of the result.
parameters:
- Dest is a register containing the signed value to limit to a minimum of signed Src,
  and is where the result is written.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose signed value
  is the lower limit to force upon Dest.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set if limit was enforced
  Z: Set if result is zero
syntax_variants:
- FGES Dest, {#}Src {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 0011010 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: limit enforced
  z: Result = 0
  clocks: '2'
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
