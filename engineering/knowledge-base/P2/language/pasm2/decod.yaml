instruction: DECOD
syntax: DECOD Dest, {#}Src
encoding:
- EEEE 1001110 00I DDDDDDDDD SSSSSSSSS                  D                 --                  --                   2
- EEEE 1001110 000 DDDDDDDDD DDDDDDDDD                  D                 --                  --                   2
