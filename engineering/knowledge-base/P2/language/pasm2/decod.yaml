instruction: DECOD
syntax: DECOD Dest, {#}Src | DECOD Dest
brief_description: Decode bit position to single-bit mask
category: Math and Logic
description: >-
  DECOD generates a 32-bit value with just one bit high, corresponding to the
  Src, or Dest, value (0-31) and stores that result in Dest.

  In effect, Dest becomes %1 << value via the DECOD instruction; where value
  is Src[4:0] or Dest[4:0].

  Examples:
  - A value of 0 generates %00000000_00000000_00000000_00000001
  - A value of 5 generates %00000000_00000000_00000000_00100000
  - A value of 15 generates %00000000_00000000_10000000_00000000

  DECOD is the complement of ENCOD.
result: >-
  A 32-bit value, with the bit position corresponding to Src, or Dest, value
  (0-31) set high, is stored in Dest.
parameters:
- Dest is the register in which to store the decoded value and optionally
  begins by containing the 5-bit bit position value it is requesting (syntax 2).
- Src is an optional register or 5-bit literal whose value is the bit position
  to set high in the decoded value.
flags_affected:
  C: No effect
  Z: No effect
syntax_variants:
- DECOD Dest, {#}Src
- DECOD Dest
timing:
  cycles: 2
  type: fixed
encoding:
- bits: EEEE 1001110 00I DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2'
  notes: Syntax 1 - bit position from Src
- bits: EEEE 1001110 000 DDDDDDDDD DDDDDDDDD
  write: D
  c: —
  z: —
  clocks: '2'
  notes: Syntax 2 - bit position from Dest[4:0]
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
