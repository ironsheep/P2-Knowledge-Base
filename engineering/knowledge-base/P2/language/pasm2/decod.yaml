parameters:
- Dest is the register in which to store the decoded value and optionally begins by
  containing the 5-bit bit position value it is requesting (syntax 2).
- Src is an optional register or 5-bit literal whose value is the bit position to
  set high in the decoded value.
- A value of 0 generates %00000000_00000000_00000000_00000001.
- A value of 5 generates %00000000_00000000_00000000_00100000.
- A value of 15 generates %00000000_00000000_10000000_00000000.
- Dest is the register, 9-bit literal, or 11-bit augmented literal whose value identifies
  the I/O pin(s) to set to output or input.
- WCZ is an optional effect to update flags.
