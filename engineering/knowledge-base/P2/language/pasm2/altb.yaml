instruction: ALTB
syntax: ALTB Dest, {#}Src
brief_description: Alter bit
category: Register Indirection
description: 'ALTB should be followed by a BITxxx instruction-- it modifies the BITxxx instruction''s Dest value, enabling code to iterate through multiple bits of data across a range of Reg RAM. BITxxx''s Dest value is changed to (Src + Dest[13:5]) & $1FF (for syntax 1), or to Dest[13:5] (for syntax 2). Dest[13:5] corresponds to the target long register''s 9-bit address and Dest[4:0] is the bit ID within it; values of 0-31 identify individual bits, by position, in least-significant bit order. Iteratively executing ALTB followed by a BITxxx instruction, and each time incrementing ALTB''s 14-bit Dest value by one, effectively writes a stream of bit values to Reg RAM as if it were all made of bit-sized registers. Warning: BITxxx instructions optionally operate on a range of bits, encoded in the Src value-- they don''t limit themselves to only reading Src[4:0] for the bit number. For this reason, care must be taken when using ALTB with BITxxx or the index value (often used for the Src of the altered instruction) will be misinterpreted as multiple bits to affect. One way to solve this is to use a SETQ #0 followed by the ALTB then BITxxx instructions to force BITxxx''s Src[9:5] bits to 0; i.e. no extra bits beyond the single bit described by Src[4:0]. In syntax 1, Src consists of two 9-bit fields; a base address (Src[8:0]) and a signed auto-indexer (Src[17:9]). The base is the Reg RAM address where the series of bits begins. ALTB adds the long index (Dest[13:5]) to the base (Src[8:0]) to locate the register holding the target bit. The bit ID (Dest[4:0]) identifies the bit''s position within that long register. At the end of ALTB execution, the optional auto-indexer value (usually 0, 1, or -1) is added to the 14-bit index (Dest) for a future ALTB+BITxxx iteration. In syntax 2, Dest serves as the full bit address-- it''s the same format as in syntax 1, but represents the target long''s absolute address and its bit index instead of the long''s relative index (to add to a base) and bit index.'
result: The next instruction's pipelined Dest value is altered to be (Src + Dest[13:5]) & $1FF, or just Dest[13:5] for syntax 2.
parameters:
- Dest is the register whose 14-bit value is the index, or the full bit address, for the BITxxx instruction to operate on.
- Src is an optional register, 9-bit literal, or 18-bit augmented literal whose value contains a base long address (Src[8:0]; added to index (Dest[13:5]) for BITxxx) and also an optional auto-indexer value (Src[17:9]; added to Dest at the end of execution).
flags_affected:
  C: Not affected
  Z: Not affected
syntax_variants:
- ALTB Dest, {#}Src
- ALTB Dest
usage_notes: 'The instruction following ALTB is shielded from interrupt

  ALTB alters the next instruction regardless of its kind-- the intention is for it
  to be a BITxxx

  Field value modification occurs in the instruction pipeline only; code is not altered,
  values do not persist

  SETQ / SETQ2 does not affect ALTx instructions-- the Q value passes through to the
  next instruction'
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 1001100 11I DDDDDDDDD SSSSSSSSS
  write: D1
  c: —
  z: —
  clocks: '2'
- bits: EEEE 1001100 111 DDDDDDDDD 000000000
  write: D 1
  c: —
  z: —
  clocks: '2'
encoding_notes:
- Dest is post-adjusted by the auto-indexer value; the sign-extended Src[17:9]. In
  syntax 2, the auto-indexer value is 0.
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_duiz
  pattern: D{,S/#}
  description: Destination, optional source (immediate bit set if no source)
  valueType: 5
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 5
