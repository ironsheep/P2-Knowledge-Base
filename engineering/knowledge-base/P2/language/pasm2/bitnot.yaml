instruction: BITNOT
syntax: BITNOT Dest, {#}Src {WCZ}
brief_description: Bit not
category: Math and Logic
description: 'BITNOT alters the Dest bit(s) designated by Src to their inverse state.
  All other bits are left unchanged. Result: Dest bit(s) described by Src are toggled
  to their opposite state(s); the rest are left as-is. Z = original D[S[4:0]].


  BITNOT alters the Dest bit(s) designated by Src to their inverse state. All other
  bits are left unchanged.


  Src[4:0] indicates the bit number (0--31). For a range of bits, Src[4:0] indicates
  the base bit number (0--31) and


  Src[9:5] indicates how many contiguous bits beyond the base should be affected (1-31).


  A 9-bit literal Src is enough to express the base bit (Src[4:0]) and a range of
  up to 16 contiguous bits (Src[8:5]). If


  needed, use the augmented literal feature (##Src) to augment Src to a 10-bit literal
  value-- this inserts an AUGS


  instruction prior.


  When Src is a register, the register''s value bits [9:0] are used as-is to form
  the 10-bit ID range, unless a SETQ


  instruction immediately precedes the BITNOT instruction; substituting SETQ''s Dest[4:0]
  in place of value bits[9:5],


  for BITNOT''s use.


  If the WCZ effect is specified, the C and Z flags are updated to the original state
  of Dest''s base bit, identified by Src.'
result: Dest bit(s) described by Src are toggled to their opposite state(s); the rest
  are left as-is.
parameters:
- Dest is the register whose value will have one or more bits toggled.
- Src is a register, 9-bit literal, or 10-bit augmented literal whose value identifies
  the bit(s) to modify.
- WCZ is an optional effect to update flags.
flags_affected:
  Z:
    formula: original D[S[4:0]]
syntax_variants:
- BITNOT Dest, {#}Src {WCZ}
- BITNOT alters the Dest bit(s) designated by Src to their inverse state. All other
  bits are left unchanged.
- instruction immediately precedes the BITNOT instruction; substituting SETQ's Dest[4:0]
  in place of value bits[9:5],
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 0100111 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: Original D base bit Original D base bit
  z: '2'
