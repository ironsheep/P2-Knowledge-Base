instruction: WAITATN
syntax: WAITATN {WC|WZ|WCZ}
encoding: EEEE 1101011 CZ0 000011110 000100100                 --          Timeout
  Abort     Timeout Abort               2+
timing:
  cycles: 2
  type: variable
description: 'WAITATN waits for an attention event to occur (unless the event flag
  is already set), then clears the event flag Result: Wait for attention event, then
  clear the flag; optionally aborting on timeout and setting C and/or Z on abort.
  Z = timeout.


  WAITATN waits for an attention event to occur (unless the event flag is already
  set), then clears the event flag


  (unless it''s being set again by the event sensor) and resumes execution at the
  next instruction. Optionally,


  WAITATN can time-out if the attention event doesn''t occur soon enough; setting
  C and/or Z flags and then


  resuming execution at the next instruction.


  To set the optional timeout, insert a SETQ (with a future System Counter target
  value) right before WAITATN.


  The WC, WZ, or WCZ effect is recommended only if the optional timeout is specified,
  in which case the C flag and/or


  Z flag is set (1) if a timeout occurred before the event, or is cleared (0) if the
  event occurred before the timeout.


  During a wait, the pipeline is stalled; no instructions execute and no interrupts
  are processed in the cog until the


  wait condition ends.


  The attention event flag is set whenever another cog issues an attention request
  for this cog. The attention event


  flag is cleared upon cog start, or execution of POLLATN, WAITATN, JATN, or JNATN
  instructions.'
flags_affected:
  Z:
    formula: timeout
parameters:
- WC, WZ, or WCZ are optional effects to update flags.
