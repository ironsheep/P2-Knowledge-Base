timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 0111110 CZ0 DDDDDDDDD DDDDDDDDD
  write: —
  c: Parity of D
  z: D=0
  clocks: '2'
- bits: EEEE 0111110 CZI DDDDDDDDD SSSSSSSSS
  write: —
  c: Parity of (D & S)
  z: (D & S) = 0
  clocks: '2'
