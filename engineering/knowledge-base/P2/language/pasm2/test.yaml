instruction: TEST
syntax: TEST Dest               {WC|WZ|WCZ}
brief_description: Test
category: Math and Logic
description: 'TEST determines the parity (number of high (1) bits) and the zero or
  non-zero state of Dest, or of Dest bitwise Result: The parity and zero-state of
  Dest, or of Dest bitwise ANDed with Src, is stored in the C and Z flags. C = parity
  of (D & S).


  TEST determines the parity (number of high (1) bits) and the zero or non-zero state
  of Dest, or of Dest bitwise


  ANDed with Src, and stores the results in the C and/or Z flag.


  If the WC or WCZ effect is specified, the C flag is set (1) if the number of high
  (1) bits in Dest (or Dest ANDed with


  Src) is odd, or is cleared (0) if it is even.


  If the WZ or WCZ effect is specified, the Z flag is set (1) if Dest (or Dest ANDed
  with Src) is zero, or is cleared (0) if it


  is not zero.


  TESTB / TESTBN


  Test bit or bit not


  Bit Operation Instruction - Test bit of D or !D and either store, AND, OR, or XOR
  the result into flags.


  TESTB     Dest, {#}Src WC|WZ


  TESTB     Dest, {#}Src ANDC|ANDZ


  TESTB     Dest, {#}Src ORC|ORZ


  TESTB     Dest, {#}Src XORC|XORZ


  TESTBN Dest, {#}Src WC|WZ


  TESTBN Dest, {#}Src ANDC|ANDZ


  TESTBN Dest, {#}Src ORC|ORZ


  TESTBN Dest, {#}Src XORC|XORZ


  Result: The state of Dest''s bit Src is read, possibly inverted, and either stored
  as-is, or bitwise ANDed, ORed, or


  XORed into C or Z.


  *    Dest is the register whose value will have a single bit tested.


  *    Src is a register or 5-bit literal whose value identifies the bit (0-31) of
  Dest to test.


  *    WC, WZ, ANDC, ANDZ, ORC, ORZ, XORC, and XORZ is a required effect to update
  or bitwise manipulate the C


  or Z flag.


  COND INSTR         FX     DEST          SRC           Write            C Flag              Z
  Flag              Clocks


  EEEE 0100000 CZI DDDDDDDDD SSSSSSSSS                   --             IN[D[4:0]]          IN[D[4:0]]                2


  EEEE 0100010 CZI DDDDDDDDD SSSSSSSSS                   --         C AND IN[D[4:0]]
  Z AND IN[D[4:0]]                 2


  EEEE 0100100 CZI DDDDDDDDD SSSSSSSSS                   --          C OR IN[D[4:0]]     Z
  OR IN[D[4:0]]              2


  EEEE 0100110 CZI DDDDDDDDD SSSSSSSSS                   --         C XOR IN[D[4:0]]
  Z XOR IN[D[4:0]]                 2


  EEEE 0100001 CZI DDDDDDDDD SSSSSSSSS                   --            !IN[D[4:0]]         !IN[D[4:0]]                2


  EEEE 0100011 CZI DDDDDDDDD SSSSSSSSS                   --         C AND !IN[D[4:0]]
  Z AND !IN[D[4:0]]               2


  EEEE 0100101 CZI DDDDDDDDD SSSSSSSSS                   --         C OR !IN[D[4:0]]     Z
  OR !IN[D[4:0]]             2


  EEEE 0100111 CZI DDDDDDDDD SSSSSSSSS                   --         C XOR !IN[D[4:0]]
  Z XOR !IN[D[4:0]]               2


  Related: TESTP and TESTPN


  TESTB or TESTBN reads the state (0/1) of a bit in Dest designated by Src, possibly
  inverts that result, and either


  stores it as-is, or bitwise ANDs, ORs, or XORs it into the C or Z flag.


  Src[4:0] indicates the bit number (0-31) to test.


  If the WC or WZ effect is specified, the C or Z flag is overwritten with the state
  or inverse state of the bit.


  If the ANDC or ANDZ effect is specified, the C or Z flag is bitwise ANDed with the
  state or inverse state of the bit.


  If the ORC or ORZ effect is specified, the C or Z flag is bitwise ORed with the
  state or inverse state of the bit.


  If the XORC or XORZ effect is specified, the C or Z flag is bitwise XORed with the
  state or inverse state of the bit.'
result: The state of Dest's bit Src is read, possibly inverted, and either stored
  as-is, or bitwise ANDed, ORed, or
parameters:
- Dest is the register whose value will be tested.
- Src is an optional register, 9-bit literal, or 32-bit augmented literal whose value
  is ANDed with Dest.
- WC, WZ, and WCZ are optional effects to update flags.
- Dest is the register whose value will have a single bit tested.
- Src is a register or 5-bit literal whose value identifies the bit (0-31) of Dest
  to test.
- WC, WZ, ANDC, ANDZ, ORC, ORZ, XORC, and XORZ is a required effect to update or bitwise
  manipulate the C or Z flag. Copyright © Parallax Inc. 2022/11/01 * Propeller 2 Assembly
  Language Manual              *   Page 134
flags_affected:
  C:
    formula: parity of (D & S)
  Z:
    formula: ((D & S) == 0)
