instruction: TEST
syntax: TEST Dest {WC|WZ|WCZ}
brief_description: Test
category: Math and Logic
description: >-
  TEST determines the parity (number of high (1) bits) and the zero or non-zero
  state of Dest, or of Dest bitwise ANDed with Src, and stores the results in
  the C and/or Z flag.

  If the WC or WCZ effect is specified, the C flag is set (1) if the number of
  high (1) bits in Dest (or Dest ANDed with Src) is odd, or is cleared (0) if it
  is even.

  If the WZ or WCZ effect is specified, the Z flag is set (1) if Dest (or Dest
  ANDed with Src) is zero, or is cleared (0) if it is not zero.
result: >-
  The parity and zero-state of Dest, or of Dest bitwise ANDed with Src, is
  stored in the C and Z flags.
parameters:
- Dest is the register whose value will be tested.
- Src is an optional register, 9-bit literal, or 32-bit augmented literal whose
  value is ANDed with Dest.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C:
    formula: parity of (D & S)
    description: Set if odd number of high bits in result
  Z:
    formula: (D & S) = 0
    description: Set if result is zero
syntax_variants:
- TEST Dest {WC|WZ|WCZ}
- TEST Dest, {#}Src {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:
- bits: EEEE 0111110 CZ0 DDDDDDDDD DDDDDDDDD
  write: —
  c: Parity of D
  z: D = 0
  clocks: '2'
  notes: Syntax 1 - test Dest only (S=D)
- bits: EEEE 0111110 CZI DDDDDDDDD SSSSSSSSS
  write: —
  c: Parity of (D & S)
  z: (D & S) = 0
  clocks: '2'
  notes: Syntax 2 - test (Dest AND Src)
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_du
  pattern: D{,S/#}
  description: Destination register, optional Source register or immediate (unary/binary)
  valueType: 3
compiler_encoding:
  operandFormat: 3
