instruction: DRVNOT
syntax: DRVNOT {#}Dest {WCZ}
brief_description: Drive not
category: Pin
description: 'DRVNOT sets the I/O pin(s) designated by Dest to the output direction
  and to their opposite output level(s); i.e. Result: The I/O pins described by Dest
  are set to the output direction and to their opposite output level(s); the rest
  are left as-is. Z = OUT bit.


  DRVNOT sets the I/O pin(s) designated by Dest to the output direction and to their
  opposite output level(s); i.e.


  alters the pin''s direction and output registers. All other pins are left unchanged.
  This instruction can affect one or


  more of the bits within the DIRA or DIRB and OUTA or OUTB registers.


  DRVNOT achieves the same effect as two instructions-- OUTNOT followed by DIRH.


  Dest[5:0] indicates the pin number (0-63). For a range of pins, Dest[5:0] indicates
  the base pin number (0-63)


  and Dest[10:6] indicates how many contiguous pins beyond the base should be affected
  (1-31).


  A 9-bit literal Dest is enough to express the base pin (Dest[5:0]) and a range of
  up to 8 contiguous pins (Dest[8:6]).


  If needed, use the augmented literal feature (##Dest) to augment Dest to an 11-bit
  literal value-- this inserts an


  AUGD instruction prior.


  When Dest is a register, the register''s value bits [10:0] are used as-is to form
  the 11-bit ID range, unless a SETQ


  instruction immediately precedes the DRVNOT instruction; substituting SETQ''s Dest[4:0]
  in place of value


  bits[10:6], for DRVNOT''s use.


  The range calculation (from Dest[5:0] up to Dest[5:0]+Dest[10:6]) will wrap within
  the same 32-pin group (DIRA or


  DIRB and OUTA or OUTB); it will not cross the port boundary.


  If the WCZ effect is specified, the C and Z flags are updated to the original state
  of OUTA / OUTB''s base bit,


  identified by Dest.'
result: The I/O pins described by Dest are set to the output direction and to their
  opposite output level(s); the rest
parameters:
- Dest is the register, 9-bit literal, or 11-bit augmented literal whose value identifies
  the I/O pin(s) to set to the output direction and toggle to opposite output levels.
- WCZ is an optional effect to update flags.
