timing:
  cycles: 2
  type: variable
description: 'Wait for CT1 event flag, then clear it. Prior SETQ sets optional CT
  timeout value. C/Z = timeout.                              2+


  WAITCT1, WAITCT2, or WAITCT3 waits for a counter 1, 2, or 3 event to occur (unless
  the event flag is already set),


  then clears the event flag (unless it''s being set again by the event sensor) and
  resumes execution at the next


  instruction. Optionally, WAITCTx can time-out if the counter event doesn''t occur
  soon enough; setting C and/or Z


  flags and then resuming execution at the next instruction.


  To set the optional timeout, insert a SETQ (with a future System Counter target
  value) right before WAITCTx.


  The WC, WZ, or WCZ effect is recommended only if the optional timeout is specified,
  in which case the C flag and/or


  Z flag is set (1) if a timeout occurred before the event, or is cleared (0) if the
  event occurred before the timeout.


  During a wait, the pipeline is stalled; no instructions execute and no interrupts
  are processed in the cog until the


  wait condition ends.


  The counter 1, 2, or 3 event flag is set whenever the System Counter (CT) passes
  the value in the CT1, CT2, or CT3


  event trigger register, respectively; i.e. MSB of (CT - CTx is 0). The counter event
  flags are cleared upon execution


  of the corresponding ADDCTx, POLLCTx, WAITCTx, JCTx, or JNCTx instructions.'
