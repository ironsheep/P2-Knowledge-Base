instruction: POLLQMT
syntax: POLLQMT {WC|WZ|WCZ}
brief_description: Poll CORDIC empty
category: Event
description: >-
  POLLQMT copies the state of the CORDIC-read-but-empty event flag into C and/or Z
  and then clears the flag (unless it's being set again by the event sensor).
  If the WC, WZ, or WCZ effect is specified, the C flag and/or Z flag is updated to
  the state of the CORDIC-read-but-empty event flag prior to clearing it.
  The CORDIC-read-but-empty event flag is set whenever GETQX / GETQY executes without
  any CORDIC results available or in progress. The flag is cleared upon cog start or
  execution of POLLQMT, WAITQMT, JQMT, or JNQMT instructions.
result: CORDIC-read-but-empty event flag is optionally copied into C and/or Z, then
  it is cleared.
parameters:
- WC, WZ, or WCZ are optional effects to update flags.
syntax_variants:
- POLLQMT {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 1101011 CZ0 000001111 000100100
  write: —
  c: QMT Event
  z: QMT Event
  clocks: '2'
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
