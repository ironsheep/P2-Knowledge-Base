instruction: SETWORD
syntax: 'SETWORD Dest, {#}Src, #Num'
brief_description: Set word
category: Math and Logic
description: >-
  SETWORD stores Src[15:0] into the word identified by Num within Dest, or the word and
  register described by a prior ALTSW instruction. No other bits are modified. Num (0-1)
  identifies a value's individual words, by position, in least-significant word order.
  Syntax 2 is intended for use after an ALTSW instruction, i.e. in a loop to iteratively
  affect a series of word values within contiguous long registers.
result: >-
  Src[15:0] is written to word Num (0-1) of Dest, or to another register word described
  by prior ALTSW instruction.
parameters:
- Dest is the register in which to modify a word.
- Src is a register, 9-bit literal, or 16-bit augmented literal whose bits [15:0]
  will be stored in the designated location.
- Num is a 1-bit literal identifying the word ID (0-1) of Dest to modify.
flags_affected:
  C: No effect
  Z: No effect
syntax_variants:
- 'SETWORD D,{#}S,#N'
- SETWORD {#}S
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 1001001 0NI DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2'
- bits: EEEE 1001001 00I 000000000 SSSSSSSSS
  write: D   1
  c: —
  z: —
  clocks: '2'
encoding_notes:
- Dest, and the target word ID, is speciﬁed by a prior ALTSW instruction.
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_ds1set
  pattern: S/#{,D,#0..1}
