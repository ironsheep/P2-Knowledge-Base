  CALLA and CALLB records the current state of the C and Z flags and the address of
  the next instruction (PC + 1 if


  Cog/LUT execution; PC + 4 if Hub execution) by writing them to the Hub RAM long
  (H) referenced by PTRA or


  PTRB, increments PTRA or PTRB, potentially updates the C and Z flags with new given
  states, and jumps to the


  given address or offset. The routine at the new address should eventually execute
  a RETA or RETB instruction to


  return to the recorded address (the instruction following the CALLA or CALLB) and
  optionally restore the C and Z


  flag state as it was prior.


  In syntax 1 and 3, #Addr and #\Addr encodes the instruction with relative and absolute
