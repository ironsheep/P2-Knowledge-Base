description: 'CALL records the current state of the C and Z flags and the address
  of the next instruction (PC + 1 if Cog/LUT Result: Push current C and Z flags and
  address of the next instruction onto the hardware stack, set PC to new relative
  or absolute address, and optionally update C and/or Z to new state. R = 1 then PC
  += A, else PC = A.


  CALL records the current state of the C and Z flags and the address of the next
  instruction (PC + 1 if Cog/LUT


  execution; PC + 4 if Hub execution) by pushing to the stack (K), potentially updates
  the C and Z flags with new


  given states, and jumps to the given address or offset. The routine at the new address
  should eventually execute


  a RET instruction, or an instruction with a _RET_ condition, to return to the recorded
  address (the instruction


  following the CALL) and optionally restore the C and Z flag state as it was prior.


  In syntax 1, #Addr and #\Addr encodes the instruction with relative and absolute
  addressing, respectively. The


  relative form (the default) is vital for creating relocatable code. In either case,
  use symbolic references for Addr


  and the assembler will encode it properly. Examples: CALL #SendBit or CALL #\DebugStatus


  In syntax 2, the format of the value at Dest is CZxxxxxx_xxxxAAAA_AAAAAAAA_AAAAAAAA.
  C is the new C flag


  state, Z is the new Z flag state, A is the new 20-bit address to jump to, and x
  are don''t-care bits. Syntax 2


  effectively swaps the flags and PC with the value in the Dest register (and RET
  swaps them back), making it


  convenient for switching between two threads.


  If the WC or WCZ effect is specified, the C flag is updated to match D[31], after
  its original state is recorded.


  If the WZ or WCZ effect is specified, the Z flag is updated to match D[30], after
  its original state is recorded.


  CALLA / CALLB


  Call A or B


  Flow Control Instruction - Call a subroutine; store return context in the Hub long
  at PTRA++ or PTRB++.


  CALLA #{\}Addr


  CALLA Dest {WC|WZ|WCZ}


  CALLB #{\}Addr


  CALLB Dest {WC|WZ|WCZ}


  Result: Write current C and Z flags and address of the next instruction into the
  4-byte Hub RAM location at PTRA


  or PTRB, increment pointer, set PC to new relative or absolute address, and optionally
  update C and/or Z to new


  state.


  *   Addr is a symbolic reference to the target subroutine; the location to set PC
  to. Relative addressing is the


  default; use ''\'' to force absolute addressing.


  *   Dest is a register containing the 20-bit absolute address to set PC to and optional
  new C and Z states.


  *   WC, WZ, or WCZ are optional effects to update the flags from Dest''s upper bit
  states.


  COND INSTR            FX      DEST          SRC            Write             C Flag              Z
  Flag              Clocks


