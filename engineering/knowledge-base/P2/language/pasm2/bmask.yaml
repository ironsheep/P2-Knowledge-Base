instruction: BMASK
syntax: BMASK Dest, {#}Src
encoding:
- "EEEE 1001110 01I DDDDDDDDD SSSSSSSSS                  D                --                  --                 \
  \  2"
- "EEEE 1001110 010 DDDDDDDDD DDDDDDDDD                  D                --                  --                 \
  \  2"
timing:
  cycles: 2
  type: fixed
description: "BMASK generates an LSB-justified bit mask (all ones) of Src+1 or Dest+1 length and stores it in Dest. The size\
  \ Result: Bit mask of size Src+1, or Dest+1 (1--32 bits) is stored into Dest.\n\nBMASK generates an LSB-justifi\
  ed bit mask (all ones) of Src+1 or Dest+1 length and stores it in Dest. The size\n\nvalue, whether specified by Src\
  \ or Dest, is in the range 0--31 to generate 1 to 32 bits of bit mask.\n\nIn effect, Dest becomes (%10 << size) - 1\
  \ via the BMASK instruction.\n\n*   A size value of 0 generates a bit mask of %00000000_00000000_00000000_00000001.\n\
  \n*   A size value of 5 generates a bit mask of %00000000_00000000_00000000_00111111.\n\n*   A size value of 15\
  \ generates a bit mask of %00000000_00000000_11111111_11111111.\n\nA bit mask is often useful in bitwise operations (AND,\
  \ OR, XOR) to filter out or affect special groups of bits."
flags_affected:
  C:
    when: D
parameters:
- Dest is the register in which to store the generated bit mask and optionally begins by containing the 5-bit mask size it
  is requesting (syntax 2).
- Src is an optional register or 5-bit literal whose value is the size of the bit mask to generate.
- A size value of 0 generates a bit mask of %00000000_00000000_00000000_00000001.
- A size value of 5 generates a bit mask of %00000000_00000000_00000000_00111111.
- A size value of 15 generates a bit mask of %00000000_00000000_11111111_11111111.
