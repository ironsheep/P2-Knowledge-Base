instruction: ALTSW
syntax: ALTSW Dest, {#}Src
brief_description: Alter set word
category: Register Indirection
description: ALTSW should be followed by SETWORD-- it modifies the SETWORD instruction's Dest and Num values, enabling code to iterate through multiple words of data across a range of Reg RAM. SETWORD's Dest value is changed to (Src + Dest[9:1]) & $1FF (for syntax 1), or to Dest[9:1] (for syntax 2), and its Num value is changed to Dest[0]. Dest[9:1] corresponds to the target long register's 9-bit address and Dest[0] is the word ID within it; values of 0-1 identify individual words, by position, in least-significant word order. Iteratively executing ALTSW followed by SETWORD, and each time incrementing ALTSW's 10-bit Dest value by one, effectively writes a stream of word values to Reg RAM as if it were all made of word-sized registers. In syntax 1, Src consists of two 9-bit fields; a base address (Src[8:0]) and a signed auto-indexer (Src[17:9]). The base is the Reg RAM address where the series of words begins. ALTSW adds the long index (Dest[9:1]) to the base (Src[8:0]) to locate the register holding the target word. The word ID (Dest[0]) identifies the word's position within that long register. At the end of ALTSW execution, the optional auto-indexer value (usually 0, 1, or -1) is added to the 10-bit index (Dest) for a future ALTSW+SETWORD iteration. In syntax 2, Dest serves as the full word address-- it's the same format as in syntax 1, but represents the target long's absolute address and its word index instead of the long's relative index (to add to a base) and word index.
result: The next instruction's pipelined Dest and Num fields are altered to be (Src + Dest[9:1]) & $1FF, or just Dest[9:1] for syntax 2, and Dest[0], respectively.
parameters:
- Dest is the register whose 10-bit value is the index, or the full word address, for the SETWORD instruction to operate on.
- Src is an optional register, 9-bit literal, or 18-bit augmented literal whose value contains a base long address (Src[8:0]; added to index (Dest[9:1]) for SETWORD) and also an optional auto-indexer value (Src[17:9]; added to Dest at end of execution).
flags_affected:
  C: Not affected
  Z: Not affected
syntax_variants:
- ALTSW Dest, {#}Src
- ALTSW Dest
usage_notes: 'The instruction following ALTSW is shielded from interrupt. ALTSW alters the next instruction regardless of its kind-- the intention is for it to be a SETWORD. Field value modification occurs in the instruction pipeline only; code is not altered, values do not persist. SETQ / SETQ2 does not affect ALTx instructions-- the Q value passes through to the next instruction.'
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 1001011 10I DDDDDDDDD SSSSSSSSS
  write: D 1
  c: —
  z: —
  clocks: '2'
- bits: EEEE 1001011 101 DDDDDDDDD 000000000
  write: D 1
  c: —
  z: —
  clocks: '2'
encoding_notes:
- Dest is post-adjusted by the auto-indexer value; the sign-extended Src[17:9]. In
  syntax 2, the auto-indexer value is 0.
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
