instruction: POLLSE1
syntax: POLLSE1 {WC|WZ|WCZ}
encoding:
- bits: EEEE 1101011 CZ0 000000100 000100100
  write: —
  c: SE1 Event
  z: SE1 Event
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: >-
  POLLSE1 copies the state of the selectable event 1 flag into C and/or Z and then
  clears the flag (unless it's being set again by the event sensor).
  If the WC, WZ, or WCZ effect is specified, the C flag and/or Z flag is updated to
  the state of the selectable event 1 flag prior to clearing it.
  The selectable event 1 flag is set whenever the corresponding configured event
  occurs. The flag is cleared upon execution of SETSE1, POLLSE1, WAITSE1, JSE1, or
  JNSE1 instructions.
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_pollwait
  pattern: ''
  description: No operands - poll/wait instruction (moves S to D, sets S to $024)
  valueType: 28
compiler_encoding:
