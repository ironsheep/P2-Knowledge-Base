instruction: POLLSE1
syntax: POLLSE1 {WC|WZ|WCZ}
encoding:
- EEEE 1101011 CZ0 000000100 000100100                  --             SE1 Event          SE1
  Event                2
- EEEE 1101011 CZ0 000000101 000100100                  --             SE2 Event          SE2
  Event                2
- EEEE 1101011 CZ0 000000110 000100100                  --             SE3 Event          SE3
  Event                2
- EEEE 1101011 CZ0 000000111 000100100                  --             SE4 Event          SE4
  Event                2
timing:
  cycles: 2
  type: fixed
description: 'Get SE1 event flag into C/Z, then clear it.


  POLLSE1, POLLSE2, POLLSE3, or POLLSE4 copies the state of the selectable event 1,
  2, 3, or 4 flag into C and/or


  Z and then clears the flag (unless it''s being set again by the event sensor).


  If the WC, WZ, or WCZ effect is specified, the C flag and/or Z flag is updated to
  the state of the corresponding


  selectable event flag prior to clearing it.


  The selectable event 1, 2, 3, or 4 flag is set whenever the corresponding configured
  event occurs. The selectable


  event flag is cleared upon execution of the corresponding SETSEx, POLLSEx, WAITSEx,
  JSEx, or JNSEx


  instructions.'
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
