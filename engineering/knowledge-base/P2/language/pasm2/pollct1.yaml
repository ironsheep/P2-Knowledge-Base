instruction: POLLCT1
syntax: POLLCT1 {WC|WZ|WCZ}
encoding:
- bits: EEEE 1101011 CZ0 000000001 000100100
  write: —
  c: CT1 Event
  z: CT1 Event
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: >-
  POLLCT1 copies the state of the counter 1 event flag into C and/or Z and then clears
  the flag (unless it's being set again by the event sensor).
  If the WC, WZ, or WCZ effect is specified, the C flag and/or Z flag is updated to
  the state of the counter event flag prior to clearing it.
  The counter 1 event flag is set whenever the System Counter (CT) passes the value
  in the CT1 event trigger register; i.e. MSB of (CT - CT1) is 0. The counter event
  flag is cleared upon execution of ADDCT1, POLLCT1, WAITCT1, JCT1, or JNCT1.
