instruction: POLLCT1
syntax: POLLCT1 {WC|WZ|WCZ}
encoding:
- bits: EEEE 1101011 CZ0 000000001 000100100
  write: —
  c: CT1 Event
  z: CT1 Event
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: 'Get CT1 event flag into C/Z, then clear it.


  POLLCT1, POLLCT2, or POLLCT3 copies the state of the count 1, 2, or 3 event flag
  into C and/or Z and then clears


  the flag (unless it''s being set again by the event sensor).


  If the WC, WZ, or WCZ effect is specified, the C flag and/or Z flag is updated to
  the state of the corresponding


  counter event flag prior to clearing it.


  The counter 1, 2, or 3 event flag is set whenever the System Counter (CT) passes
  the value in the CT1, CT2, or CT3


  event trigger register, respectively; i.e. MSB of (CT - CTx is 0). The counter event
  flags are cleared upon execution


  of the corresponding ADDCTx, POLLCTx, WAITCTx, JCTx, or JNCTx instructions.'
