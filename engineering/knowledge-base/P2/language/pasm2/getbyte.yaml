instruction: GETBYTE
syntax: 'GETBYTE Dest, {#}Src, #Num'
brief_description: Get byte
category: Math and Logic
description: 'GETBYTE reads the byte identified by Num (0-3) from Src, or a byte from
  the source described by a prior ALTGB Result: Byte Num (0-3) of Src, or a byte from
  a source described by prior ALTGB instruction, is written to Dest.


  GETBYTE reads the byte identified by Num (0-3) from Src, or a byte from the source
  described by a prior ALTGB


  instruction.


  Num (0-3) identifies a value''s individual bytes, by position, in least-significant
  byte order.


  Syntax 2 is intended for use after an ALTGB instruction; i.e. in a loop to iteratively
  read a series of byte values


  within contiguous long registers.'
result: Byte Num (0-3) of Src, or a byte from a source described by prior ALTGB instruction,
  is written to Dest.
parameters:
- Dest is the register in which to store the byte.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value contains
  the target byte to read.
- Num is a 2-bit literal identifying the byte ID (0-3) of Src to read.
flags_affected:
  C:
    when: D
syntax_variants:
- 'GETBYTE Dest, {#}Src, #Num'
- GETBYTE Dest
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
