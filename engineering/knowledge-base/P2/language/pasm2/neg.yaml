parameters:
- Dest is a register to receive the -Src value (syntax 1), or contains the value to
  negate (syntax 2).
- Src is an optional register, 9-bit literal, or 32-bit augmented literal whose negated
  value is stored into Dest.
- WC, WZ, or WCZ are optional effects to update flags.
