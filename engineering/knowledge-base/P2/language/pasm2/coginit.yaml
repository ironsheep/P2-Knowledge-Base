instruction: COGINIT
syntax: COGINIT {#}Dest, {#}Src {WC}
brief_description: Cog initialize
category: Hub Control
description: COGINIT starts a new (unused) cog, a new pair of cogs (that may share LUT memory), or a specific cog by ID, to load code from Hub RAM to be executed within Reg/LUT RAM or to be executed right from Hub RAM. The format of Dest is %E_N_xVVV where E controls loading (0=load from Hub, 1=no load), N controls target selection (0=specific cog ID, 1=free cog), and V is the cog ID or mode. The lower 20 bits of Src is the code address; the entire 32-bit Src is written to the target cog's PTRB. If COGINIT is preceded by SETQ, that value is written to the target cog's PTRA. If the WC effect is specified, C is set on failure or cleared on success, and if Dest is a register, it receives the launched cog's ID (or $F on failure).
result: Target cog is started according to Dest to execute code from Src. The code pointer (Src) is written to the target cog's PTRB, and optionally a data pointer is written to its PTRA if SETQ preceded COGINIT.
parameters:
- Dest is the register or 9-bit literal describing the type of launch and possibly
  the ID of the desired cog to launch. If Dest is a register and WC is given, Dest
  is also where the ID of the launched cog will be written.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value (lower
  20 bits) is the target RAM address (for code) and the new cog's PTRB value.
- WC is an optional effect to update the C flag with the success (0) or fail (1) status
  and triggers Dest to be overwritten with new cog's ID.
syntax_variants:
- COGINIT {#}Dest, {#}Src {WC}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 1100111 CLI DDDDDDDDD SSSSSSSSS
  write: D if reg and WC
  c: No cog available
  z: —
  clocks: 2–9, +2 if result
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_ls
  pattern: D/#,S/#
  description: 'Two operands: destination/immediate, source/immediate'
  valueType: 13
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 13
enhancement_source: PNUT_TS_v2.0_complete_operand_integration_2025-09-13
last_updated: '2025-09-19'
manual_extraction_date: '2025-01-19'
oneliner: Start an available cog, or restart a cog by ID
related:
- COGID
- COGSTOP
examples:
- code: 'COGINIT #1,#$100                                  ''load and start Cog 1
    from Hub RAM $100

    --or--'
- code: 'COGINIT #COGEXEC+1,#$100'
- code: 'COGINIT #%1_0_0101, PTRA                          ''skip load and start Cog
    5 at PTRA

    --or--'
- code: "COGINIT #HUBEXEC+5, PTRA\n  SETQ       ptra_val                         \
    \      'ptra_val will go into target cog's PTRA register"
- code: "COGINIT #%0_1_0000, addr                          'load and start a free\
    \ cog at addr\n--or--\n  SETQ    ptra_val"
- code: 'COGINIT #COGEXEC_NEW, addr'
- code: 'COGINIT #%1_1_0001, addr                          ''skip load, start a free
    pair of cogs at addr (for LUT RAM sharing)

    --or--'
- code: 'COGINIT #HUBEXEC_NEW_PAIR, addr'
- code: "COGINIT id, addr               WC                       '(id=HUBEXEC_NEW)\
    \ skip load, start a free cog at addr\n                                      \
    \                    'C=0 and id=cog if okay\n  COGID         myID           \
    \                           'reload and restart me at Hub RAM PTRB"
- code: COGINIT myID, PTRB
