instruction: COGINIT
syntax: COGINIT {#}Dest, {#}Src {WC}
brief_description: Cog initialize
category: Hub Control
description: 'COGINIT starts a new (unused) cog, a new pair of cogs (that may share
  LUT memory), or a specific cog by ID, to Result: Target cog is started, according
  to Dest, to execute code from Src. The code pointer (Src) is written to the target
  Cog''s PTRB, and optionally a data pointer or user value is written to its PTRA
  (if previous SETQ is provided).


  COGINIT starts a new (unused) cog, a new pair of cogs (that may share LUT memory),
  or a specific cog by ID, to


  load code from Hub RAM to be executed within Reg/LUT RAM or to be executed right
  from Hub RAM.


  If the WC effect is specified, the C flag is set (1) if the instruction failed to
  launch a cog, or is cleared (0) if it was


  successful. Also with the WC effect, if Dest is a register, it is overwritten with
  $F (on failure) or with the ID of the


  newly launched cog --or the lowest of the pair of cogs-- (on success).


  The format of Dest is %E_N_xVVV.


  E: 0 = load from Hub RAM (Src) into target cog''s Reg RAM ($000-$1F7) and begin
  execution at its Reg


  RAM ($000); 1 = no load, just execute from target cog''s existing Reg/LUT RAM, or
  from Hub RAM.


  N: 0 = target cog ID is V; 1 = start a free cog or cog pair according to V.


  V: when N = 0, V is a specific cog ID (0-7; %000-%111); when N = 1, V is 0 (%000)
  to start a free cog or 1


  (%001) to start a free odd/even pair of cogs for LUT RAM sharing. Use the WC effect
  to get the results in


  Dest and C.


  The lower 20 bits of Src is the address of the start of code; the address in Hub
  RAM (or Reg/LUT RAM) where the


  executable code image begins. The entire 32-bit Src value will be written into the
  target cog''s PTRB register.


  If COGINIT is preceded by SETQ, the SETQ value will be written into the target cog''s
  PTRA register. This is


  intended as a convenient means of pointing the target cog''s program to some runtime
  data structure or passing it


  a 32-bit parameter. If no SETQ is used, the target cog''s PTRA register will be
  cleared to zero.


  Related instructions are COGID and COGSTOP.


  Execution Modes


  Code can be loaded into Cog RAM (Reg RAM and optionally LUT RAM) and executed, or
  code can be executed


  from Hub RAM without pre-loading into Cog RAM. For PASM2 programs, the former achieves
  the fastest


  execution speed and natural isolation from other cogs while the latter achieves
  a larger effective code space


  beyond the ~=1,000 instruction limit inside Cog RAM. It is common to run PASM2 code
  from Reg RAM.


  To execute code from Reg RAM, it must first be loaded from Hub RAM (i.e. a Dest
  value where E = 0 achieves both


  load and execute in a single COGINIT instruction).


  To execute code from LUT RAM, it must first be manually copied or streamed into
  LUT RAM by code executing in


  Reg RAM (or by the neighboring cog in an even/odd pair that are sharing LUT RAM).


  To execute code from Hub RAM, the Dest''s E bit must be 1 and the Src must be an
  address beyond $3FF. Note


  that with a single COGINIT instruction, code could start out loaded into Reg RAM
  (E = 0), execute from there, and


  can branch to $400 or beyond (Hub execution), or it can even copy or stream code
  into LUT RAM, execute in


  Reg+LUT RAM, and then branch to $400 or beyond (Hub execution).


  Additionally, it''s possible to load and execute code in another cog''s Reg RAM
  (one COGINIT instruction) and


  restart that cog thereafter (another COGINIT instruction) to execute starting at
  any place in its existing Reg RAM


  or LUT RAM (from the previous load) by using a Dest value with E = 1 and a Src value
  of less than $400. This


  works whether or not the cog is terminated first, since its Cog RAM is retained
  during its terminated (dormant)


  state. For example, one possibility is a Reg/LUT RAM-resident program consisting
  of a number of small


  independent routines which are each exclusively started at-will by another cog--
  apparent cog launch and parallel


  processing with no "loading" overhead latency.


  COGINIT Constants


  A number of constants are predefined for use in forming desired Dest values for
  COGINIT instructions.


  COGINIT Constants


  Symbol (for Dest)     Dest Value      Notes


  The target cog loads its own Reg RAM registers $000-$1F7 from the Hub RAM


  COGEXEC           %0_0_0000       starting at Src address, then begins execution
  at register address $000. Target


  cog ID must be specified; i.e. COGEXEC+5 will launch Cog 5 in this fashion.


  Same as above except an available (non-running) cog is chosen automatically;


  do not specify an ID. Use WC effect and a register for Dest (register''s value set


  COGEXEC_NEW         %0_1_0000


  to COGEXEC_NEW) to get pass/fail (0/1) result in C flag and ID of employed


  cog in Dest register.


  Same as above except an available (non-running) even/odd pair of cogs is


  COGEXEC_NEW_PAIR       %0_1_0001       chosen automatically-- useful for LUT RAM
  sharing. Dest receives the lowest


  ID of the pair if successful (when the WC effect is used).


  No loading; the target cog begins execution at Reg/LUT/Hub RAM address Src.


  Target cog ID must be specified; i.e. HUBEXEC+2 will launch Cog 2 in this


  HUBEXEC           %1_0_0000


  fashion. NOTE: Though named HUBEXEC, this constant can also be used to


  execute pre-existing code in Reg RAM or LUT RAM as well as Hub RAM.


  Same as above except an available (non-running) cog is chosen automatically;


  do not specify an ID. Use WC effect and a register for Dest (register''s value set


  HUBEXEC_NEW         %1_1_0000


  to HUBEXEC_NEW) to get pass/fail (0/1) result in C flag and ID of employed


  cog in Dest register.


  Same as above except an available (non-running) even/odd pair of cogs is


  HUBEXEC_NEW_PAIR       %1_1_0001       chosen automatically-- useful for LUT RAM
  sharing. Dest receives the lowest


  ID of the pair if successful (when the WC effect is used).'
result: Target cog is started, according to Dest, to execute code from Src. The code
  pointer (Src) is written to the
parameters:
- Dest is the register or 9-bit literal describing the type of launch and possibly
  the ID of the desired cog to launch. If Dest is a register and WC is given, Dest
  is also where the ID of the launched cog will be written.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value (lower
  20 bits) is the target RAM address (for code) and the new cog's PTRB value. Copyright
  © Parallax Inc. 2022/11/01 * Propeller 2 Assembly Language Manual           *   Page
  64
- WC is an optional effect to update the C flag with the success (0) or fail (1) status
  and triggers Dest to be overwritten with new cog's ID.
syntax_variants:
- COGINIT {#}Dest, {#}Src {WC}
- A number of constants are predefined for use in forming desired Dest values for
  COGINIT instructions.
- COGINIT id, addr               WC                       '(id=HUBEXEC_NEW) skip load,
  start a free cog at addr
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 1100111 CLI DDDDDDDDD SSSSSSSSS
  write: D if reg and WC
  c: No cog available
  z: —
  clocks: 2–9, +2 if result
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_ls
  pattern: D/#,S/#
  description: 'Two operands: destination/immediate, source/immediate'
  valueType: 13
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 13
