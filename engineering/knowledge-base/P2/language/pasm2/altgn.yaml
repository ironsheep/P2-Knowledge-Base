enhancement_source: PNUT_TS_v2.0_complete_operand_integration_2025-09-13
last_updated: '2025-09-19'
brief_description: Alter get nibble
category: Register Indirection
result: The next instruction's pipelined Src and Num values are altered to be (Src + Dest[11:3]) & $1FF, or just Dest[11:3] for syntax 2, and Dest[2:0], respectively.
syntax_variants:
- ALTGN Dest, {#}Src
- ALTGN Dest
usage_notes: 'The instruction following ALTGN is shielded from interrupt

  ALTGN alters the next instruction regardless of its kind-- the intention is for
  it to be a GETNIB / ROLNIB

  Field value modification occurs in the instruction pipeline only; code is not altered,
  values do not persist

  SETQ / SETQ2 does not affect ALTx instructions-- the Q value passes through to the
  next instruction'
manual_extraction_date: '2025-01-19'
oneliner: Alter subsequent GETNIB / ROLNIB instruction
