instruction: JNXMT
syntax: JNXMT   {#}S
category: Event
description: 'JXMT or JNXMT checks the cog''s streamer empty event flag and jumps
  to the address described by Src if the flag Result: If streamer empty event flag
  is set (or is clear in syntax 2), PC is set to a new relative (#Src) or absolute
  (Src) address.'
parameters:
- 'Src is a register, 9-bit literal, or 20-bit augmented literal whose value is the
  absolute or relative address to set PC to. Use # for relative addressing; omit #
  for absolute addressing.'
flags_affected:
  C:
    when: PC1
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 1011110 01I 000001010 SSSSSSSSS
  write: PC1
  c: —
  z: —
  clocks: 2 or 4 / 2 or 13–20
- bits: EEEE 1011110 01I 000011010 SSSSSSSSS
  write: PC1
  c: —
  z: —
  clocks: 2 or 4 / 2 or 13–20
encoding_notes:
- PC is written only when the streamer empty event ﬂag is set (or is clear in syntax
  2).
documentation_source: PASM2 Manual 2022/11/01
documentation_level: comprehensive
compiler_operand_format:
  name: operand_jpoll
  pattern: S/#
  description: 'Poll jump: target address/immediate'
  valueType: 21
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 21
