instruction: SETD
syntax: SETD Dest, {#}Src
encoding: "EEEE 1001101 10I DDDDDDDDD SSSSSSSSS                        D                    --                -- \
  \                    2"
timing:
  cycles: 2
  type: fixed
description: "SETD copies Src[8:0] to the D field of the template, Dest, to be used with an ALTI instruction. Bits outside\
  \ the D Result: The D field [17:9] of template Dest is set to Src[8:0].\n\nSETD copies Src[8:0] to the D field of the\
  \ template, Dest, to be used with an ALTI instruction. Bits outside the D\n\nfield remain unaffected. The D field\
  \ (or Dest field) holds the address of a register (or sometimes a literal value) for\n\nthe instruction to use as it's\
  \ destination value, and usually as its result destination, during its execution.\n\nThe ALTI template is a 32-bit value\
  \ with the following format:\n\nBits             31:28 (4 bits)          27:19 (9 bits)              18            17:9\
  \ (9 bits)          8:0 (9 bits)\n\nField Description       Condition Field         Result Field       Indirect \"I\" Field\
  \     Dest \"D\" Field       Source \"S\" Field\n\nSETD can also be used in self-modifying Reg RAM code. Unlike with ALTx\
  \ instructions, when used this way, field\n\nvalue modification occurs in the program code itself (not the instruction\
  \ pipeline); code is altered, values persist.\n\nDue to the instruction pipeline nature, after modifying a code register,\
  \ it is necessary to elapse at least two\n\ninstructions before executing the modified register.\n\nSETD         inst,\
  \ op                        'set \"inst\" register[17:9] to op[8:0]\n\nNOP                                          'fi\
  rst spacer instruction, could be anything\n\nNOP                                          'second spacer instruction, could\
  \ be anything\n\ninst      MOV          x, y                            'operate on x using y; x may become any register\
  \ per SETD"
flags_affected:
  C:
    when: D
parameters:
- Dest is the register whose 32-bit value is a template for use with an ALTI instruction.
- "Src is a register or 9-bit literal whose value (Src[8:0]) is copied to the D field of Dest."
