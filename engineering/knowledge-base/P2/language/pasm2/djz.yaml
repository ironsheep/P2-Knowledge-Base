instruction: DJZ
syntax: DJZ     D,{#}S
encoding:
- bits: EEEE 1011011 00I DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: —
  clocks: '2 or 4'
timing:
  cycles: 2
  type: variable
  range: 13...20
description: >-
  DJZ decrements the value in Dest, writes the result, and jumps to the address
  described by Src if the result IS zero.

  This instruction is useful when you want to jump when a counter reaches zero,
  rather than looping while non-zero. Use # prefix on Src for relative addressing;
  omit # for absolute addressing.
result: >-
  Dest is decremented. If the result equals zero, PC is set to a new relative (#Src)
  or absolute (Src) address; otherwise execution continues with the next instruction.
documentation_source: PASM2 Manual 2022/11/01
documentation_level: comprehensive
compiler_operand_format:
  name: operand_dsj
  pattern: D,S/@
  description: 'Jump with destination and relative address: register, relative address'
  valueType: 12
compiler_encoding:
  operandFormat: 12
