instruction: ALTI
syntax: ALTI Dest, {#}Src
encoding:
- EEEE 1001101 00I DDDDDDDDD SSSSSSSSS                       D                --                --                     2
- EEEE 1001101 001 DDDDDDDDD 101100100                      --                 --                --                     2
timing:
  cycles: 2
  type: fixed
description: 'ALTI substitutes fields from Dest for one or more of the next instruction''s
  pipelined Dest, Src, Result, Instr, FX, Result: The next instruction''s pipelined
  field value values are substituted from the Dest template, and Dest is modified
  per Src configuration (syntax 1), or the entire Dest opcode (instruction) is executed
  in place of the next instruction (syntax 2).


  ALTI substitutes fields from Dest for one or more of the next instruction''s pipelined
  Dest, Src, Result, Instr, FX,


  and/or Cond values, and ALTI''s Dest is then modified per Src configuration (syntax
  1), or the entire Dest opcode


  (instruction) is executed in place of the next instruction (syntax 2).


  The Dest register contains the ALTI template; a 32-bit value with the following
  format similar to an opcode:


  Bits            31:28 (4 bits)          27:19 (9 bits)          18            17:9
  (9 bits)           8:0 (9 bits)


  Field Description      Condition Field         Result Field     Indirect "I" Field   Dest
  "D" Field        Source "S" Field


  In syntax 1, Src consists of the following six 3-bit fields that describe field
  substitution and Dest modification.


  %rrr_ddd_sss_RRR_DDD_SSS


  *   %rrr = Result field increment/decrement mask size


  *   %ddd = Dest field increment/decrement mask size


  *   %sss = Src field increment/decrement mask size


  *   %RRR = Result/Instruction field control


  *   %DDD = Dest field control


  *   %SSS = Src field control


  Field Increment/Decrement Mask Size


  %rrr


  %ddd Mask Selection


  %sss


  000   Unlimited Increment/Decrement of 9 bits (default, full 512-register Reg RAM
  span)


  001   Limit Increment/Decrement to 8 LSBs (256-register Reg RAM looped buffer)


  010   Limit Increment/Decrement to 7 LSBs (128-register Reg RAM looped buffer)


  011    Limit Increment/Decrement to 6 LSBs (64-register Reg RAM looped buffer)


  100    Limit Increment/Decrement to 5 LSBs (32-register Reg RAM looped buffer)


  101    Limit Increment/Decrement to 4 LSBs (16-register Reg RAM looped buffer)


  110    Limit Increment/Decrement to 3 LSBs (8-register Reg RAM looped buffer)


  111    Limit Increment/Decrement to 2 LSBs (4-register Reg RAM looped buffer)


  Result/Instruction Field Control


  %RRR Substitution                                       Dest[27:19] Adjustment    Notes


  000    None                                             None


  001    None                                             None                      Cancel
  next instruction''s Result write


  010    None                                             Decrements per %rrr


  011    None                                             Increments per %rrr


  100    Dest[27:19] -> next instruction''s Result field    None


  101    Dest[31:18] -> next instruction''s [31:18]         None                      Cond+Instr+Fx
  substitution1, 2


  110    Dest[27:19] -> next instruction''s Result field    Decrements per %rrr


  111    Dest[27:19] -> next instruction''s Result field    Increments per %rrr


  1


  Substitutes for next instruction''s conditional execution mode, instruction class,
  and/or effects (WC/WZ, I, etc.)


  2


  Can use with %DDD=1xx and %SSS=1xx for full instruction substitution; i.e. execute
  Dest opcode in place of next instruction


  Dest Field Control


  %DDD Substitution                                      Dest[17:9] Adjustment     Notes


  000    None                                            None


  001    None                                            None                      Same
  as %000


  010    None                                            Decrements per %ddd


  011    None                                            Increments per %ddd


  100    Dest[17:9] -> next instruction''s Dest field      None                      Execute
  Dest w/ RRR = %101, SSS = %1xx


  101    Dest[17:9] -> next instruction''s Dest field      None                      Execute
  Dest w/ RRR = %101, SSS = %1xx


  110    Dest[17:9] -> next instruction''s Dest field      Decrements per %ddd       Execute
  Dest w/ RRR = %101, SSS = %1xx


  111    Dest[17:9] -> next instruction''s Dest field      Increments per %ddd       Execute
  Dest w/ RRR = %101, SSS = %1xx


  Src Field Control


  %SSS Substitution                                      Src[8:0] Adjustment       Notes


  000    None                                            None


  001    None                                            None                      Same
  as %000


  010    None                                            Decrements per %sss


  011    None                                            Increments per %sss


  100    Dest[8:0] -> next instruction''s Src field        None                      Execute
  Dest w/ RRR = %101, DDD = %1xx


  101    Dest[8:0] -> next instruction''s Src field        None                      Execute
  Dest w/ RRR = %101, DDD = %1xx


  110    Dest[8:0] -> next instruction''s Src field        Decrements per %sss       Execute
  Dest w/ RRR = %101, DDD = %1xx


  111    Dest[8:0] -> next instruction''s Src field        Increments per %sss       Execute
  Dest w/ RRR = %101, DDD = %1xx


  In syntax 2, Dest serves as the full opcode value-- it is executed as-is in place
  of the next instruction and Dest


  remains unaltered afterward.'
flags_affected:
  C:
    when: D
parameters:
- Dest is the register whose value contains one or more of the next instruction's
  field substitutes or an entire 32-bit opcode for full substitution.
- Src is an optional register, 9-bit literal, or 18-bit augmented literal whose value
  describes the substitutions and Dest modifications to perform.
- '%rrr = Result field increment/decrement mask size'
- '%ddd = Dest field increment/decrement mask size'
- '%sss = Src field increment/decrement mask size'
- '%RRR = Result/Instruction field control'
- '%DDD = Dest field control'
- '%SSS = Src field control'
- The instruction following ALTI is shielded from interrupt
- Field value modification occurs in the instruction pipeline only; code is not altered,
  values do not persist
- SETQ / SETQ2 does not affect ALTx instructions-- the Q value passes through to the
  next instruction
related:
- SETD
- SETS
- SETR
- ALTD
- ALTS
- ALTR
