instruction: WAITPAT
syntax: WAITPAT {WC|WZ|WCZ}
encoding:
- bits: EEEE 1101011 CZ0 000011000 000100100
  write: —
  c: timeout
  z: timeout
  clocks: '2+'
timing:
  cycles: 2
  type: variable
description: >-
  WAITPAT waits for a pin-pattern-detected event to occur (unless the event flag is
  already set), then clears the event flag (unless it's being set again by the event
  sensor) and resumes execution at the next instruction. Optionally, WAITPAT can
  time-out if the pin-pattern-detected event doesn't occur soon enough; setting C
  and/or Z flags and then resuming execution at the next instruction. To set the
  optional timeout, insert a SETQ (with a future System Counter target value) right
  before WAITPAT. The WC, WZ, or WCZ effect is recommended only if the optional timeout
  is specified, in which case the C flag and/or Z flag is set (1) if a timeout occurred
  before the event, or is cleared (0) if the event occurred before the timeout. During
  a wait, the pipeline is stalled; no instructions execute and no interrupts are
  processed in the cog until the wait condition ends. The pin-pattern-detected event
  flag is set whenever the masked input pins match or don't match the pattern described
  by a previous SETPAT instruction. The pin-pattern-detected event flag is cleared
  upon execution of SETPAT, POLLPAT, WAITPAT, JPAT, or JNPAT instructions.
flags_affected:
  Z:
    formula: timeout
related:
- SETPAT
- POLLPAT
- JPAT
- JNPAT
