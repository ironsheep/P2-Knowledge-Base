instruction: SHR
syntax: SHR Dest, {#}Src {WC|WZ|WCZ}
encoding: EEEE 0000010 CZI DDDDDDDDD SSSSSSSSS                            D      Last
  bit out   1
timing:
  cycles: 1
  type: fixed
description: 'SHR shifts Dest''s binary value right by Src places (0-31 bits) and
  sets the new MSBs to 0. This is useful for Result: The bits of Dest are shifted
  right by Src bits, inserting zeros (0) as new leftmost bits.


  SHR shifts Dest''s binary value right by Src places (0-31 bits) and sets the new
  MSBs to 0. This is useful for


  bit-stream manipulation as well as for swift division; unsigned 32-bit integer division
  by a power-of-two. For


  similar division of a signed value, use SAR instead.


  If the WC or WCZ effect is specified, the C flag is updated to the value of the
  last bit shifted out (effectively C =


  result bit "-1") if Src is 1-31, or to Dest[0] if Src is 0.


  If the WZ or WCZ effect is specified, the Z flag is set (1) if the Dest result equals
  zero, or is cleared (0) if it is


  non-zero.'
flags_affected:
  C:
    formula: last bit shifted out if S[4:0] > 0, else D[0]
parameters:
- Dest is the register containing the value to right shift by Src bits.
- Src is a register or 5-bit literal whose value indicates the number of bits to shift
  right.
- WC, WZ, or WCZ are optional effects to update flags.
