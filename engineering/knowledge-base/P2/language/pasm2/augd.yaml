instruction: AUGD
syntax: 'AUGD #Dest'
brief_description: Augment destination
category: Miscellaneous
description: 'AUGD is an assistant instruction to aid with literal values that exceed
  9 bits. Most PASM2 instructions have 9 bits Result: The 23-bit value formed from
  Dest is queued to prefix the next literal Dest occurrence (#Dest) to form a 32-bit
  literal for that instruction; interrupts are also temporarily disabled..


  AUGD is an assistant instruction to aid with literal values that exceed 9 bits.
  Most PASM2 instructions have 9 bits


  available for literal Dest values; enough for many uses, but not all. AUGD augments
  the next occurrence of a literal


  Dest value to be a full 32-bits. When the instruction with the soon-to-be-augmented
  literal is later executed, the


  cog uses the lower 9 bits encoded in the instruction''s Dest field and prepends
  AUGD''s 23 bits to it.'
result: The 23-bit value formed from Dest is queued to prefix the next literal Dest
  occurrence (#Dest) to form a
parameters:
- Dest is a 32-bit literal whose upper 23 bits are prepended to the next literal Dest
  occurrence.
- All instructions following AUGD are shielded from interrupt until after the instruction
  with the
- Dest value augmentation occurs in the instruction pipeline only; code is not altered,
  value does not persist
- SETQ / SETQ2 does not affect AUGD-- the Q value passes through to the next instruction
syntax_variants:
- 'AUGD #Dest'
- available for literal Dest values; enough for many uses, but not all. AUGD augments
  the next occurrence of a literal
- cog uses the lower 9 bits encoded in the instruction's Dest field and prepends AUGD's
  23 bits to it.
usage_notes: 'All instructions following AUGD are shielded from interrupt until after
  the instruction with the

  newly-augmented literal Dest value is executed

  Dest value augmentation occurs in the instruction pipeline only; code is not altered,
  value does not persist

  SETQ / SETQ2 does not affect AUGD-- the Q value passes through to the next instruction

  Tip: Though AUGD may be manually entered wherever needed, the Parallax P2 compiler
  supports a convenient way

  to use this feature. In the target instruction''s Dest field, use "##" followed
  by the desired 32-bit literal (instead of

  "#" followed by a 9-bit literal); the compiler will automatically invoke AUGD immediately
  before. When counting

  clock cycles, make sure to account for 2 extra clock cycles for instructions containing
  ## augmented literals.'
