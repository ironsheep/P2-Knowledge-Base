instruction: POLLXRL
syntax: POLLXRL {WC|WZ|WCZ}
encoding: "EEEE 1101011 CZ0 000001101 000100100                --            XRL Event         XRLEvent              \
  \   2"
timing:
  cycles: 2
  type: fixed
description: "Streamer-LUT-RAM-rollover event flag is optionally copied into C and/or Z, then it is cleared.\n\nPOLLXRL copies\
  \ the state of the streamer-LUT-RAM-rollover event flag into C and/or Z and then clears the flag\n\n(unless it's\
  \ being set again by the event sensor).\n\nIf the WC, WZ, or WCZ effect is specified, the C flag and/or Z fl\
  ag is updated to the state of the streamer-LUT-RAM-\n\nrollover event flag prior to clearing it.\n\nThe streamer-LUT-RAM-rollover\
  \ event flag is set whenever location $1FF of the Lookup RAM is read by the\n\nstreamer. The streamer-LUT-RAM-rollover\
  \ event flag is cleared upon cog start or upon execution of POLLXRL,\n\nWAITXRL, JXRL, or JNXRL instructions."
parameters:
- "WC, WZ, or WCZ are optional effects to update flags."
related:
- XINIT
- XZERO
- XCONT
- WAITXRL
- JXRL
- JNXRL
