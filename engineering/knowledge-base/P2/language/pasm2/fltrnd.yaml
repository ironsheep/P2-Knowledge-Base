  1


  New DIRx state is not data-forwarded; the next pipelined instruction sees the old
  state. Make sure any instruction that reads


  or modifies DIRx is at least two instructions after a FLTZ or FLTNZ.


  FLTZ or FLTNZ sets the I/O pin(s) designated by Dest to the input direction and
  to a low/high output level


  according to the state, or inverse state, of the Z flag; i.e. alters the pin''s
  direction and output registers. All other


  pins are left unchanged. Each of these instructions, FLTZ and FLTNZ, can affect
  one or more of the bits within


  the DIRA or DIRB and OUTA or OUTB registers.


  FLTZ or FLTNZ achieves the same effect as two instructions-- DIRL followed by OUTZ
  or OUTNZ.


  Dest[5:0] indicates the pin number (0-63). For a range of pins, Dest[5:0] indicates
  the base pin number (0-63)


  and Dest[10:6] indicates how many contiguous pins beyond the base should be affected
  (1-31).


  A 9-bit literal Dest is enough to express the base pin (Dest[5:0]) and a range of
  up to 8 contiguous pins (Dest[8:6]).


  If needed, use the augmented literal feature (##Dest) to augment Dest to an 11-bit
  literal value-- this inserts an


  AUGD instruction prior.


  When Dest is a register, the register''s value bits [10:0] are used as-is to form
  the 11-bit ID range, unless a SETQ


  instruction immediately precedes the FLTZ / FLTNZ instruction; substituting SETQ''s
  Dest[4:0] in place of value


  bits[10:6], for FLTZ / FLTNZ''s use.


  The range calculation (from Dest[5:0] up to Dest[5:0]+Dest[10:6]) will wrap within
  the same 32-pin group (DIRA or


  DIRB and OUTA or OUTB); it will not cross the port boundary.


  If the WCZ effect is specified, the C and Z flags are updated to the original state
  of OUTA / OUTB''s base bit,


  identified by Dest.'
