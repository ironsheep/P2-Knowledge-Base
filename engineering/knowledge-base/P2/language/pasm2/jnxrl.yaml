instruction: JNXRL
syntax: JNXRL   {#}S
category: Event
description: >-
  JNXRL checks the cog's streamer LUT RAM rollover event flag and jumps to the address
  described by Src if the flag is clear. PC is set to a new relative (#Src) or absolute
  (Src) address. The flag is cleared after the check.
parameters:
- 'Src is a register, 9-bit literal, or 20-bit augmented literal whose value is the
  absolute or relative address to set PC to. Use # for relative addressing; omit #
  for absolute addressing.'
timing:
  cycles: 2
  type: variable
  range: 13...20
encoding:
- bits: EEEE 1011110 01I 000011101 SSSSSSSSS
  write: —
  c: —
  z: —
  clocks: 2 or 4
encoding_notes:
- PC is written only when the streamer LUT RAM rollover event ﬂag is set (or is clear
  in syntax 2).
documentation_source: PASM2 Manual 2022/11/01
documentation_level: comprehensive
compiler_operand_format:
  name: operand_jpoll
  pattern: S/#
  description: 'Poll jump: target address/immediate'
  valueType: 21
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 21
enhancement_source: PNUT_TS_v2.0_complete_operand_integration_2025-09-13
last_updated: '2025-09-19T16:04:17.753200'
oneliner: Jump if streamer LUT RAM rollover event flag set or clear
