instruction: ROLNIB
syntax: 'ROLNIB Dest, {#}Src, #Num'
encoding:
- EEEE 100010N NNI DDDDDDDDD SSSSSSSSS                  D                --                  --                     2
- EEEE 1000100 000 DDDDDDDDD 000000000                  D                --                  --                     2
timing:
  cycles: 2
  type: fixed
description: 'ROLNIB reads the nibble identified by Num (0-7) from Src, or a nibble
  from the source described by a prior ALTGN Result: Nibble Num (0-7) of Src, or a
  nibble from a source described by prior ALTGN instruction, is rotated left into
  Dest.


  ROLNIB reads the nibble identified by Num (0-7) from Src, or a nibble from the source
  described by a prior ALTGN


  instruction, and rotates it left into Dest.


  ROLNIB achieves the same effect as two instructions-- a 4-bit SHL followed by SETNIB
  into nibble 0.


  Num (0-7) identifies a value''s individual nibbles, by position, in least-significant
  nibble order.


  Syntax 2 is intended for use after an ALTGN instruction; i.e. in a loop to iteratively
  read a series of nibble values


  within contiguous long registers.'
flags_affected:
  C:
    when: D
parameters:
- Dest is the register in which to rotate the nibble into.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value contains
  the target nibble to read.
- Num is a 3-bit literal identifying the nibble ID (0-7) of Src to read.
