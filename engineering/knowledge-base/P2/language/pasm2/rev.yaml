instruction: REV
syntax: REV Dest
brief_description: Reverse
category: Math and Logic
description: 'The 32-bit pattern in Dest is reversed.


  =>


  REV performs a bitwise reverse (bits 31:0 bits 0:31) of the value in Dest and stores
  the result back into Dest.


  This is useful for processing binary data in a different MSB/LSB order than it is
  transmitted with.'
result: The 32-bit pattern in Dest is reversed.
parameters:
- Dest is the register containing the bit value to reverse.
flags_affected:
  C:
    when: D
syntax_variants:
- REV Dest
- REV performs a bitwise reverse (bits 31:0 bits 0:31) of the value in Dest and stores
  the result back into Dest.
