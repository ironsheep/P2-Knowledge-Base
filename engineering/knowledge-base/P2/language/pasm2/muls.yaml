instruction: MULS
syntax: MULS Dest, {#}Src {WZ}
brief_description: Multiply, signed
category: Math and Logic
description: 'MULS multiplies the signed lower 16-bits of each of Dest and Src together
  and stores the 32-bit signed product Result: The 32-bit signed product of the signed
  16-bit Dest and Src multiplication is stored into Dest and optionally the Z flag
  is updated to the Dest or Src zero status. D = signed (D[15:0] * S[15:0]).


  MULS multiplies the signed lower 16-bits of each of Dest and Src together and stores
  the 32-bit signed product


  result into the Dest register. This is a fast (2-clock) signed 16 x 16 bit multiplication
  operation-- to multiply larger


  factors, use the CORDIC Solver QMUL instruction.


  If the WZ effect is specified, the Z flag is set (1) if either the Dest or Src values
  are zero, or is cleared (0) if both are


  non-zero.


  MUXC / MUXNC


  Mux C or mux not C


  Bit Operation Instructions - Set discrete bits to C or !C


  MUXC    Dest, {#}Src {WC|WZ|WCZ}


  MUXNC Dest, {#}Src {WC|WZ|WCZ}


  Result: Dest bit(s) described by Src are set to C or !C; the rest are left as-is.
  Flags are optionally updated with


  parity and zero status of the result.


  *   Dest is the register whose value will have one or more bits set to C or !C.


  *   Src is a register, 9-bit literal, or 32-bit augmented literal whose value identifies
  the bit(s) to modify.


  *   WC, WZ, or WCZ is an optional effect to update flags.


  COND INSTR         FX     DEST          SRC           Write            C Flag              Z
  Flag                Clocks


  EEEE 0101100 CZI DDDDDDDDD SSSSSSSSS                   D          Parity of Result      Result
  = 0                   2


  EEEE 0101101 CZI DDDDDDDDD SSSSSSSSS                   D          Parity of Result      Result
  = 0                   2


  MUXC or MUXNC alters the Dest bit(s) designated by Src (high bits) to equal the
  state, or inverse state, of the C flag.


  All Dest bits corresponding to high (1) bits in Src are modified; all other Dest
  bits are left unchanged.


  If the WC or WCZ effect is specified, the C flag is set (1) if the number of high
  (1) bits in the result is odd, or is


  cleared (0) if it is even.


  If the WZ or WCZ effect is specified, the Z flag is set (1) if the result is zero,
  or is cleared (0) if it is not zero.'
result: Dest bit(s) described by Src are set to C or !C; the rest are left as-is.
  Flags are optionally updated with
parameters:
- Dest is a register containing the signed 16-bit value to multiply with Src, and
  is where the result is written.
- Src is a register, 9-bit literal, or signed 16-bit augmented literal whose value
  is multiplied into Dest.
- WZ is an optional effect to update the Z flag.
- Dest is the register whose value will have one or more bits set to C or !C.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value identifies
  the bit(s) to modify.
- WC, WZ, or WCZ is an optional effect to update flags.
flags_affected:
  Z: Result = 0
syntax_variants:
- MULS Dest, {#}Src {WZ}
- MULS multiplies the signed lower 16-bits of each of Dest and Src together and stores
  the 32-bit signed product
