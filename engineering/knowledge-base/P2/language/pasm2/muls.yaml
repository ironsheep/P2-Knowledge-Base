instruction: MULS
syntax: MULS Dest, {#}Src {WZ}
brief_description: Multiply, signed
category: Math and Logic
description: >-
  MULS multiplies the signed lower 16-bits of each of Dest and Src together and
  stores the 32-bit signed product result into the Dest register. This is a fast
  (2-clock) signed 16 x 16 bit multiplication operation-- to multiply larger
  factors, use the CORDIC Solver QMUL instruction.

  D = signed (D[15:0] * S[15:0]).

  If the WZ effect is specified, the Z flag is set (1) if either the Dest or Src
  values are zero, or is cleared (0) if both are non-zero.
result: >-
  The 32-bit signed product of the signed 16-bit Dest and Src multiplication is
  stored into Dest and optionally the Z flag is updated to the Dest or Src zero
  status.
parameters:
- Dest is a register containing the signed 16-bit value to multiply with Src,
  and is where the result is written.
- Src is a register, 9-bit literal, or signed 16-bit augmented literal whose
  value is multiplied into Dest.
- WZ is an optional effect to update the Z flag.
flags_affected:
  C: Not affected
  Z:
    formula: (D = 0) | (S = 0)
    description: Set if either Dest or Src was zero before multiplication
syntax_variants:
- MULS Dest, {#}Src {WZ}
timing:
  cycles: 2
  type: fixed
encoding:
- bits: EEEE 1010000 1ZI DDDDDDDDD SSSSSSSSS
  write: D
  c: —
  z: (D = 0) | (S = 0)
  clocks: '2'
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
