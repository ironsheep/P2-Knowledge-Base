instruction: ROLBYTE
syntax: 'ROLBYTE Dest, {#}Src, #Num'
encoding:
- EEEE 1001000 NNI DDDDDDDDD SSSSSSSSS                  D                --                  --                     2
- EEEE 1001000 000 DDDDDDDDD 000000000                  D                --                  --                     2
timing:
  cycles: 2
  type: fixed
description: 'ROLBYTE reads the byte identified by Num (0-3) from Src, or a byte from
  the source described by a prior ALTGB Result: Byte Num (0-3) of Src, or a byte from
  a source described by prior ALTGB instruction, is rotated left into Dest.


  ROLBYTE reads the byte identified by Num (0-3) from Src, or a byte from the source
  described by a prior ALTGB


  instruction, and rotates it left into Dest.


  ROLBYTE achieves the same effect as two instructions-- an 8-bit SHL followed by
  SETBYTE into byte 0.


  Num (0-3) identifies a value''s individual bytes, by position, in least-significant
  byte order.


  Syntax 2 is intended for use after an ALTGB instruction; i.e. in a loop to iteratively
  read a series of byte values


  within contiguous long registers.'
flags_affected:
  C:
    when: D
parameters:
- Dest is the register in which to rotate the byte into.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value contains
  the target byte to read.
- Num is a 2-bit literal identifying the nibble ID (0-3) of Src to read.
related:
