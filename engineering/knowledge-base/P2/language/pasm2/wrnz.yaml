instruction: WRNZ
syntax: WRNZ    D
category: Math and Logic
description: 'WRZ or WRNZ writes the state or inverse state of Z (0 or 1) to Dest.
  Result: Dest value is replaced with state of Z or !Z.'
parameters:
- Dest is the register whose value will be replaced with the state of Z or !Z.
flags_affected:
