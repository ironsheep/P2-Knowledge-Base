instruction: WRNZ
syntax: WRNZ D
brief_description: Write not Z
category: Math and Logic
description: >-
  WRNZ writes the inverse state of Z (0 or 1) to Dest. If Z is set (1), Dest becomes 0.
  If Z is clear (0), Dest becomes 1.
result: >-
  Dest value is replaced with the inverse state of Z (!Z).
parameters:
- Dest is the register whose value will be replaced with the state of Z or !Z.
flags_affected:
  C:
    when: D
timing:
  cycles: 2
  type: fixed
encoding:
- bits: EEEE 1101011 000 DDDDDDDDD 001101111
  write: D
  c: —
  z: —
  clocks: '2'
documentation_source: PASM2 Manual 2022/11/01
documentation_level: comprehensive
compiler_operand_format:
  name: operand_d
  pattern: D
  description: Destination register only
  valueType: 24
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 24
