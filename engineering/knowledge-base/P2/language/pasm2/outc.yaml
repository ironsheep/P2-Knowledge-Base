instruction: OUTC
syntax: OUTC    {#}D           {WCZ}
encoding:
- bits: EEEE 1101011 CZL DDDDDDDDD 001001010
  write: OUTx
  c: —
  z: OUT bit
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: >-
  OUTC alters the output level register's bit(s) designated by Dest to equal the
  state of the C flag. All other bits are left as-is.
result: >-
  The I/O pin output level bit(s), described by Dest, are set to low/high according
  to C; the rest are left as-is. Z = original OUT bit state.
flags_affected:
  Z:
    formula: OUT bit
documentation_source: PASM2 Manual 2022/11/01
documentation_level: comprehensive
compiler_operand_format:
  name: operand_pinop
  pattern: D/#0..511 {WC/WZ}
  description: 'Pin operation: destination/immediate pin number 0-511, optional effect
    flags'
  valueType: 30
compiler_encoding:
  operandFormat: 30
enhancement_source: PNUT_TS_v2.0_complete_operand_integration_2025-09-13
syntax_variants:
- OUTC {#}D
last_updated: '2025-09-19T16:04:16.919208'
parameters:
- Dest is the register, 9-bit literal, or 11-bit augmented literal whose value identifies
  the I/O pin(s) for which output levels are to be set low or high.
- WCZ is an optional effect to update flags.
category: Pin
oneliner: Set pin(s) output level to low/high according to C or !C
