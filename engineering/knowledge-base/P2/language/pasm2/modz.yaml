instruction: MODZ
syntax: MODZ    z               {WZ}
encoding:
- bits: EEEE 1101011 0Z1 00000zzzz 001101111
  write: —
  c: —
  z: zzzz[{C,Z}]
  clocks: '2'
timing:
  cycles: 2
  type: fixed
description: >-
  MODZ sets or clears the Z flag based on the mode described by the given Modifier.
  The Z flag is set or cleared according to the given Modifier and the current state
  of the C and/or Z flags.
result: >-
  Z = zzzz[{C,Z}], where zzzz is the 4-bit modifier value that selects which
  combination of current C and Z states produces a 1 result.
flags_affected:
  C: No effect
  Z: Set per zzzz modifier and current C/Z state
documentation_source: PASM2 Manual 2022/11/01
documentation_level: comprehensive
compiler_operand_format:
  name: operand_cz
  pattern: '#C{,#Z}'
  description: 'Modify condition flags: C flag value (4-bit), optional Z flag value
    (4-bit)'
  valueType: 27
compiler_encoding:
  operandFormat: 27
enhancement_source: PNUT_TS_v2.0_complete_operand_integration_2025-09-13
syntax_variants:
- MODZ z
last_updated: '2025-09-19T16:04:17.518284'
parameters:
- CModifer is a Modifier symbol for the designated mode to apply to the C flag.
- ZModifer is a Modifier symbol for the designated mode to apply to the Z flag.
- WC, WZ, or WCZ are optional effects to update flags.
category: Math and Logic
oneliner: Modify C and/or Z flag(s) according to modifier mode and current state(s)
