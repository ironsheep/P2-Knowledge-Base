instruction: ADD
syntax: ADD Dest, {#}Src {WC|WZ|WCZ}
brief_description: Add
category: Math and Logic
description: ADD sums the two unsigned values of Dest and Src together and stores the result into the Dest register. If the WC or WCZ effect is specified, the C flag is set (1) if the summation results in a 32-bit overflow (unsigned carry), or is cleared (0) if no overflow. If the WZ or WCZ effect is specified, the Z flag is set (1) if the result of Dest + Src is zero, or is cleared (0) if it is non-zero. To add unsigned, multi-long values, use ADD followed by ADDX as described in Adding Two Multi-Long Values. ADD and ADDX are also used in adding signed, multi-long values with ADDSX ending the sequence.
result: Sum of unsigned Src and unsigned Dest is stored in Dest.
parameters:
- Dest is a register containing the value to add Src to, and is where the result is
  written.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value is added
  into Dest.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set if unsigned overflow (carry of D + S)
  Z: Set if result equals zero
syntax_variants:
- ADD Dest, {#}Src {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 0001000 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: carry of (D + S)
  z: Result = 0
  clocks: '2'
