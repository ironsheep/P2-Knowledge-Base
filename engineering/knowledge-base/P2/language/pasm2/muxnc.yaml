instruction: MUXNC
syntax: MUXNC   D,{#}S   {WC/WZ/WCZ}
category: Math and Logic
description: >-
  Mux !C into each D bit that is '1' in S. D = (!S & D) | (S & {32{!C}}).
  Each bit position in D where S has a '1' is replaced with the inverted C flag value.
parameters:
- Dest is the register whose value will have one or more bits set to C or !C.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value identifies
  the bit(s) to modify.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C:
    formula: parity of result
timing:
  cycles: 2
  type: fixed
encoding:
- bits: EEEE 0101101 CZI DDDDDDDDD SSSSSSSSS
  write: D
  c: parity of result
  z: Result = 0
  clocks: '2'
documentation_source: PASM2 Manual 2022-11-01
documentation_level: enhanced
compiler_operand_format:
  name: operand_ds
  pattern: D,S/#
  description: Destination register, Source register or immediate value
  valueType: 0
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 0
