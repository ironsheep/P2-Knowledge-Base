instruction: CMPSUB
syntax: CMPSUB Dest, {#}Src {WC|WZ|WCZ}
brief_description: Compare and subtract
category: Math and Logic
description: >-
  CMPSUB compares the unsigned values of Dest and Src, and if Src is less than or equal
  to Dest then it is subtracted from Dest. Optionally, the C and Z flags are set to
  indicate the comparison and operation results. If the WC or WCZ effect is specified,
  the C flag is set (1) if Dest was greater than or equal to Src. If the WZ or WCZ
  effect is specified, the Z flag is set (1) if the result equals 0.
result: >-
  Dest is decremented by Src unless it is less than Src, and the comparison results
  are optionally written to the C and Z flags.
parameters:
- Dest is the register containing the value to compare with Src and is the destination
  written to if a subtraction is performed.
- Src is a register, 9-bit literal, or 32-bit augmented literal whose value is compared
  with and possibly subtracted from Dest.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C: Set if unsigned D >= S (subtraction performed)
  Z: Set if result equals zero
syntax_variants:
- CMPSUB D,{#}S {WC|WZ|WCZ}
timing:
  cycles: 2
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 0010111 CZI DDDDDDDDD SSSSSSSSS
  write: D1
  c: Unsigned(D => S)
  z: Result = 0
  clocks: '2'
encoding_notes:
- Dest is only written if a subtraction was performed on it.
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
compiler_operand_format:
  name: operand_ds
  pattern: D,S/#
  description: Destination register, Source register or immediate value
  valueType: 0
compiler_encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
  operandFormat: 0
