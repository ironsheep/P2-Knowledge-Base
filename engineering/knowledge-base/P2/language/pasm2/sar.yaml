instruction: SAR
syntax: SAR Dest, {#}Src {WC|WZ|WCZ}
brief_description: Shift arithmetic right
category: Math and Logic
description: 'The bits of Dest are shifted right by Src bits, extending Dest[31] (the
  sign bit) into new leftmost bits.


  SAR shifts Dest''s binary value right by Src places (0-31 bits) and sets the new
  MSBs to that of the original


  Dest[31]; preserving the sign of a signed integer. This is useful for bit stream
  manipulation and for swift division--


  it is similar to SHR for swift division by a power-of-two, but is safe for both
  signed and unsigned integers.


  If the WC or WCZ effect is specified, the C flag is updated to the value of the
  last bit shifted out (effectively C =


  result bit "-1") if Src is 1-31, or to Dest[0] if Src is 0.


  If the WZ or WCZ effect is specified, the Z flag is set (1) if the Dest result equals
  zero, or is cleared (0) if it is


  non-zero.'
result: The bits of Dest are shifted right by Src bits, extending Dest[31] (the sign
  bit) into new leftmost bits.
parameters:
- Dest is the register containing the value to arithmetically right shift by Src bits.
- Src is a register or 5-bit literal whose value indicates the number of bits to arithmetically
  shift right.
- WC, WZ, or WCZ are optional effects to update flags.
flags_affected:
  C:
    formula: last bit shifted out if S[4:0] > 0, else D[0]
syntax_variants:
- SAR Dest, {#}Src {WC|WZ|WCZ}
- SAR shifts Dest's binary value right by Src places (0-31 bits) and sets the new
  MSBs to that of the original
timing:
  cycles: 1
  type: fixed
encoding:  # [bits|write|c|z|clocks] See encoding-table-reference.yaml
- bits: EEEE 0000110 CZI DDDDDDDDD SSSSSSSSS
  write: D      Last bit out   1
  c: Result = 0
  z: '2'
encoding_notes:
- C = last bit shifted out if Src[4:0] > 0, else C = Dest[0].
documentation_source: PASM2 Manual 2022/11/01 Pages 31-147
documentation_level: comprehensive
