instruction: RCZL
syntax: RCZL Dest {WC|WZ|WCZ}
encoding: EEEE 1101011 CZ0 DDDDDDDDD 001101011                           D         D[31]           D[30]                  2
timing:
  cycles: 2
  type: fixed
description: 'RCZL shifts Dest''s binary value left by two places and sets Dest[1]
  to C and Dest[0] to Z. Result: The bits of Dest are shifted left by two places and
  C and Z are inserted as new LSBs.


  RCZL shifts Dest''s binary value left by two places and sets Dest[1] to C and Dest[0]
  to Z.


  If the WC or WCZ effect is specified, the C flag is updated to the original Dest[31]
  state.


  If the WZ or WCZ effect is specified, the Z is flag is updated to the original Dest[30]
  state.'
flags_affected:
  C: D[31] D[30] 2
parameters:
- Dest is the register containing the value to rotate the carry and zero flags left
  into.
- WC, WZ, or WCZ are optional effects to update flags.
