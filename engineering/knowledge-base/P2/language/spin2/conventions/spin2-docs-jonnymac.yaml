title: Spin2 JonnyMac Documentation Style
id: spin2-docs-jonnymac
version: 1.0.0
layer: "Layer 3 - Documentation Style (JonnyMac)"
derived_from: johnny-mac-documentation-style.yaml v2.0.0
purpose: Plain English documentation style without formal tags
applies_to: Projects using JonnyMac community documentation conventions

summary: |
  JonnyMac's plain English documentation style emphasizing clarity, completeness, and self-contained
  documentation without external tool dependencies. Uses double apostrophes for methods, focuses on
  WHAT methods do rather than HOW, and achieves 98%+ documentation coverage.

description: |
  Layer 3 documentation style from JonnyMac's complete programming standard. This layer provides
  only the documentation conventions - no naming requirements, no indentation mandates. Combines
  with Layer 1 (language) and Layer 2 (formatting) for complete foundation.

documentation_philosophy:
  principles:
    - "Document everything internal with 98%+ coverage"
    - "Use consistent format with identical patterns"
    - "Prioritize clarity over brevity"
    - "Write in plain English without formal tags"
    - "Create self-documenting code that stands alone"
    
  coverage_targets:
    public_methods: "100%"
    private_methods: "95%+"
    assembly_code: "50%+ (optimal balance)"
    constants_variables: "Significant items documented"

comment_types:
  method_documentation:
    prefix: "''"
    usage: "All method documentation"
    placement: "Immediately after method signature"
    language: "Plain English descriptions"
    
  code_comments:
    prefix: "'"
    usage: "In-line code comments and explanations"
    placement: "After code statements or on separate lines"
    
  assembly_comments:
    prefix: "'"
    usage: "PASM2 assembly documentation"
    placement: "Inline after instructions or as block comments"
    coverage: "51.4% (proven optimal balance)"

method_documentation_pattern:
  structure:
    - "Zero blank lines between signature and documentation"
    - "First line explains WHAT the method does"
    - "Optional secondary lines with '--' prefix for details"
    - "Documentation before any implementation code"
    - "Blank line after documentation before code"
    
  content_guidelines:
    primary_line:
      focus: "Explain WHAT the method does"
      style: "Purpose-oriented, not implementation-focused"
      voice: "Active voice when possible"
      length: "Concise but complete"
      
    secondary_lines:
      prefix: "'-- "
      content:
        - "Explain constraints or special conditions"
        - "Clarify complex parameters or return values"
        - "Note side effects or state changes"
        - "Document assumptions or preconditions"

method_templates:
  simple_method:
    pattern: |
      PUB start(value)
      '' Seed prng for predictable "random" sequences
      '' -- good for memory games like Simon
      
        IF (value == 0)
          seed := DFLT_SEED
        ELSE
          seed := value
          
    notes:
      - "Primary line explains purpose"
      - "Secondary line provides usage context"
      - "Blank line before implementation"
      
  method_with_return:
    pattern: |
      PUB random() : result
      '' Returns new psuedo-random number
      
        result := ??seed
        
    notes:
      - "Brief, clear purpose statement"
      - "No @returns tag needed - obvious from signature"
      
  complex_method:
    pattern: |
      PUB tx(txbyte)
      '' Transmit byte through smart pin
      '' -- will wait if buffer is full
      
        REPEAT
          IF (rqs_full() == FALSE)
            WYPIN(txbyte, TX_PIN)
            QUIT
          ELSE
            WAITX(TX_BIT_TICKS)
            
    notes:
      - "Primary line: what it does"
      - "Secondary line: important behavior note"
      - "No parameter documentation needed for obvious cases"
      
  method_with_complex_params:
    pattern: |
      PUB rx_check() : rxbyte | check
      '' Check for received byte (no blocking)
      '' -- returns -1 if no byte available
      '' -- returns byte (0..255) if available
      
        rxbyte := -1
        check := RDPIN(RX_PIN)
        IF (check)
          rxbyte := RDPIN(RX_PIN) >> 24
          
    notes:
      - "Primary line: core function"
      - "Secondary lines: clarify return value behavior"
      - "Explain special values (-1 vs 0..255)"

special_method_types:
  null_placeholder:
    pattern: |
      PUB null()
      '' This is not a top-level object
      
        ' null method for non-top-level objects
        
  initialization:
    pattern: |
      PUB start(mode, rxpin, txpin, baud) : result | bitmode, bittix, pin_setup
      '' Start simple serial coms on specified pins
      '' -- mode: 0 = 3.3v, 1 = open-drain/open-source
      '' -- uses P2 smart pins for buffered rx/tx
      
        stop()
        ' [implementation continues...]
        
  cleanup:
    pattern: |
      PUB stop()
      '' Disable smart pin serial coms
      
        IF (rx_pin >= 0)
          PINF(rx_pin)
        IF (tx_pin >= 0)
          PINF(tx_pin)
        LONGFILL(@rx_pin, -1, 4)

pasm2_documentation:
  philosophy:
    coverage: "51.4% (optimal balance)"
    rationale: "Comprehensive without cluttering simple operations"
    
  style_rules:
    - "Single apostrophe for all assembly comments"
    - "Inline comments after instructions when practical"
    - "Block comments before code sections"
    - "Consistent alignment at reasonable column"
    - "Focus on register usage and algorithm explanation"
    
  what_to_comment:
    - "Register assignments and their purpose"
    - "Algorithm steps and logic flow"
    - "Hardware interactions and pin operations"
    - "Timing considerations and delays"
    - "Loop logic and control flow"
    
  what_not_to_comment:
    - "Obvious operations like simple moves"
    - "Redundant information restating the instruction"
    
  inline_example: |
    PUB read_sensor() : sensor_value | pin_config
    '' Read sensor value using custom timing
    '' -- requires precise bit-banging for this sensor type
    
      ORG
        ' Configure sensor pin for input with pullup
        MOV     pin_config, ##P_HIGH_1M5       ' 1.5M pullup resistor
        WRPIN   pin_config, sensor_pin         ' apply to sensor pin
        
        ' Timing loop for sensor reading
        MOV     delay_count, ##sensor_delay    ' load delay constant
        MOV     bit_counter, #8                ' read 8 bits
        
    read_loop
        WAITX   delay_count                    ' precise timing delay
        RDPIN   sensor_bit, sensor_pin         ' read current bit
        SHL     sensor_value, #1               ' shift previous bits
        OR      sensor_value, sensor_bit       ' add new bit
        DJNZ    bit_counter, #read_loop        ' continue for all bits
        
        WRLONG  sensor_value, PTRA             ' write to SPIN2 variable
      END

constants_and_variables:
  constant_documentation:
    style: "Inline comments with clear explanations"
    format: "Explain purpose, include units"
    example: |
      CON
        ' Serial communication configuration
        BAUD_115200   = 115_200              ' standard high-speed baud rate
        BAUD_230400   = 230_400              ' maximum reliable baud rate
        
        ' Pin assignments for standard configuration
        RX_PIN        = 63                   ' receive pin (P63)
        TX_PIN        = 62                   ' transmit pin (P62)
        
        ' Timing and buffer constants
        TIMEOUT_MS    = 5000                 ' 5 second timeout for operations
        BUFFER_SIZE   = 256                  ' circular buffer size (power of 2)
        
  variable_documentation:
    style: "Inline comments describing purpose and valid ranges"
    format: "Explain function, note special values"
    example: |
      VAR
        ' Communication state variables
        LONG  rx_pin                        ' receive pin number (-1 if disabled)
        LONG  tx_pin                        ' transmit pin number (-1 if disabled)
        LONG  baud_rate                     ' current baud rate setting
        
        ' Buffer management
        BYTE  tx_buffer[BUFFER_SIZE]        ' transmit circular buffer
        BYTE  rx_buffer[BUFFER_SIZE]        ' receive circular buffer
        
  content_guidelines:
    constants:
      - "Explain purpose and what the constant controls"
      - "Include units (Hz, ms, bytes, pins, etc.)"
      - "Note valid ranges for configuration values"
      - "Clarify relationships between constants"
      
    variables:
      - "Describe function and what data the variable holds"
      - "Specify data ranges and valid values"
      - "Explain relationships between variables"
      - "Note special values like -1 for 'disabled'"

comment_quality_guidelines:
  excellent_comments:
    - "Explain the WHY behind code decisions"
    - "Clarify complex logic with clear explanations"
    - "Document assumptions and preconditions"
    - "Note side effects or state changes"
    - "Explain algorithm steps and calculations"
    
  poor_comments_to_avoid:
    - "Restating obvious code operations"
    - "Providing redundant information"
    - "Using vague descriptions"
    - "Writing incomplete fragments"
    
  formatting_standards:
    spacing: "Single space after apostrophes"
    alignment: "Consistent column alignment for inline comments"
    sentences: "Use complete sentences for clarity"

automation_instructions:
  parsing:
    - "Identify methods needing documentation"
    - "Extract method signature components"
    - "Determine visibility level (PUB/PRI)"
    - "Parse parameters, returns, and locals"
    
  generation:
    - "Place documentation immediately after signature"
    - "Use double apostrophes for all methods"
    - "Write clear WHAT descriptions"
    - "Add '--' prefixed details for complex cases"
    - "No formal tags, use plain English"
    - "Maintain consistent formatting"

why_this_style_works:
  simplicity:
    - "No tools required to read documentation"
    - "Plain English accessible to all"
    - "Self-contained within source code"
    
  effectiveness:
    - "98%+ method coverage proven achievable"
    - "51.4% assembly coverage optimal balance"
    - "15+ years of community adoption"
    
  maintainability:
    - "Easy to follow patterns"
    - "Consistent presentation throughout"
    - "Scales from small utilities to complex systems"

integration_notes:
  combine_with:
    layer_1: "spin2-getting-started.yaml (language mechanics)"
    layer_2: "spin2-formatting-standards.yaml (professional structure)"
    
  optional:
    layer_4: "spin2-naming-jonnymac.yaml (full JonnyMac standard)"
    
  standalone_usage:
    - "Can use JonnyMac docs with any naming style"
    - "Works with VSCode tooling (though VSCode style may be preferred for IntelliSense)"
    - "Compatible with team preferences on indentation"

see_also:
  full_standard: engineering/knowledge-base/P2/language/spin2/conventions/johnny-mac-documentation-style.yaml
  organization_standard: engineering/knowledge-base/P2/language/spin2/conventions/p2-source-file-organization-standard.yaml
