title: Johnny Mac Internal Documentation Style
id: johnny-mac-documentation-style
style_name: Johnny Mac Documentation Standard
version: 1.0.0
derived_from: Analysis of 27+ OBEX objects containing 36 SPIN2 files and 7 PASM2 files
coverage_metrics:
  public_method_documentation: "100%"
  private_method_documentation: "95%+"
  pasm2_comment_coverage: "51.4%"
  documentation_consistency: "100%"
summary: Comprehensive internal documentation system that focuses on clear, consistent method and code documentation within the standard P2 file organization structure

description: |
  Johnny Mac's documentation style represents 15+ years of P2 community leadership and achieves 98%+ method documentation coverage across all analyzed code. This is a comprehensive internal documentation system that focuses on clear, consistent method and code documentation.
  
  This style uses plain English descriptions without formal tags or complex markup, documenting every public method and most private methods using consistent patterns. Assembly code achieves 51.4% comment coverage, representing the optimal balance between comprehensive documentation and code readability.
  
  Note: This covers Johnny Mac's internal documentation patterns. For file organization, headers, and licensing requirements, see the P2 Source File Organization Standard.

philosophy:
  documentation_principles:
    - Document everything internal with 98%+ coverage
    - Use consistent internal format with identical patterns
    - Prioritize clarity over brevity with clear explanations
    - Write in plain English without formal tags or markup
    - Create self-documenting code that stands alone

style_characteristics:
  - Method documentation immediately after signatures using double apostrophes
  - Plain English descriptions without @param/@returns tags
  - Assembly comments with 51.4% coverage using single quotes
  - Consistent formatting and professional presentation
  - Focus on WHAT methods do, not HOW they do it

comment_types:
  method_documentation:
    prefix: "''"
    usage: "All method documentation"
    placement: "Immediately after method signature"
    
  code_comments:
    prefix: "'"
    usage: "In-line code comments and explanations"
    placement: "After code statements or on separate lines"
    
  assembly_comments:
    prefix: "'"
    usage: "PASM2 assembly documentation"
    placement: "Inline after instructions or as block comments"

method_documentation_pattern:
  structure:
    - Zero blank lines between signature and documentation
    - First line explains WHAT the method does
    - Optional secondary lines with "--" prefix for details
    - Documentation before any implementation code
    
  content_guidelines:
    primary_line:
      - Explain WHAT the method does
      - Focus on purpose, not implementation
      - Use active voice when possible
      - Be concise but complete
      
    secondary_lines:
      - Prefix with "--" to indicate supplementary information
      - Explain constraints or special conditions
      - Clarify complex parameters or return values
      - Note side effects or state changes

method_templates:
  simple_method:
    template: |
      pub start(value)
      
      '' Seed prng for predictable "random" sequences
      '' -- good for memory games like Simon
      
        if (value == 0)
          Seed := DFLT_SEED
        else
          Seed := value
          
  method_with_return:
    template: |
      pub random() : result
      
      '' Returns new psuedo-random number
      
        result := ??Seed
        
  complex_method:
    template: |
      pub tx(txbyte)
      
      '' Transmit byte through smart pin
      '' -- will wait if buffer is full
      
        repeat
          if (rqsfull() == false)
            wypin(txbyte, txd)
            quit
          else
            waitx(txbittix)
            
  method_with_complex_params:
    template: |
      pub rxcheck() : rxbyte | check
      
      '' Check for received byte (no blocking)
      '' -- returns -1 if no byte available
      '' -- returns byte (0..255) if available
      
        rxbyte := -1
        check := rdpin(rxd)
        if (check)
          rxbyte := rdpin(rxd) >> 24

special_method_types:
  null_placeholder:
    template: |
      pub null()
      
      '' This is not a top-level object
      
        ' null method for non-top-level objects
        
  initialization:
    template: |
      pub start(mode, rxpin, txpin, baud) : result | bitmode, bittix, pin_setup
      
      '' Start simple serial coms on specified pins
      '' -- mode: 0 = 3.3v, 1 = open-drain/open-source
      '' -- uses P2 smart pins for buffered rx/tx
      
        stop()
        ' [implementation continues...]
        
  cleanup:
    template: |
      pub stop()
      
      '' Disable smart pin serial coms
      
        if (rxd >= 0)
          pinf(rxd)
        if (txd >= 0) 
          pinf(txd)
        longfill(@rxd, -1, 4)

pasm2_documentation:
  philosophy:
    target_coverage: "51.4%"
    rationale: "Optimal balance between comprehensive documentation and readability"
    
  style_rules:
    - Single apostrophe for all assembly comments
    - Inline comments after instructions when practical
    - Block comments before code sections
    - Consistent alignment of comments at reasonable column
    - Focus on register usage and algorithm explanation
    
  inline_pasm2_example: |
    pub read_sensor() : sensor_value | pin_config
    
    '' Read sensor value using custom timing
    '' -- requires precise bit-banging for this sensor type
    
      org
        ' Configure sensor pin for input with pullup
        mov     pin_config, ##P_HIGH_1M5       ' 1.5M pullup resistor  
        wrpin   pin_config, sensor_pin         ' apply to sensor pin
        
        ' Timing loop for sensor reading
        mov     delay_count, ##sensor_delay    ' load delay constant
        mov     bit_counter, #8                ' read 8 bits
        
    read_loop
        waitx   delay_count                    ' precise timing delay
        rdpin   sensor_bit, sensor_pin         ' read current bit
        shl     sensor_value, #1               ' shift previous bits
        or      sensor_value, sensor_bit       ' add new bit
        djnz    bit_counter, #read_loop        ' continue for all bits
        
        wrlong  sensor_value, ptra             ' write to SPIN2 variable
      end
      
  what_to_comment:
    - Register assignments and their purpose
    - Algorithm steps and logic flow
    - Hardware interactions and pin operations
    - Timing considerations and delays
    - Loop logic and control flow
    
  what_not_to_comment:
    - Obvious operations like simple moves
    - Redundant information that restates the instruction

constants_and_variables:
  constant_documentation:
    style: "Inline comments with clear explanations"
    example: |
      con
        ' Serial communication configuration
        BAUD_115200   = 115_200              ' standard high-speed baud rate
        BAUD_230400   = 230_400              ' maximum reliable baud rate  
        
        ' Pin assignments for standard configuration
        RX_PIN        = 63                   ' receive pin (P63)
        TX_PIN        = 62                   ' transmit pin (P62)
        
        ' Timing and buffer constants
        TIMEOUT_MS    = 5000                 ' 5 second timeout for operations
        BUFFER_SIZE   = 256                  ' circular buffer size (power of 2)
        
  variable_documentation:
    style: "Inline comments describing purpose and valid ranges"
    example: |
      var
        ' Communication state variables  
        long  rx_pin                        ' receive pin number (-1 if disabled)
        long  tx_pin                        ' transmit pin number (-1 if disabled) 
        long  baud_rate                     ' current baud rate setting
        
        ' Buffer management
        byte  tx_buffer[BUFFER_SIZE]        ' transmit circular buffer
        byte  rx_buffer[BUFFER_SIZE]        ' receive circular buffer
        
  content_guidelines:
    constants:
      - Explain purpose and what the constant controls
      - Include units (Hz, ms, bytes, pins, etc.)
      - Note valid ranges for configuration values
      - Clarify relationships between constants
      
    variables:
      - Describe function and what data the variable holds
      - Specify data ranges and valid values
      - Explain relationships between variables
      - Note special values like -1 for "disabled"

comment_quality_guidelines:
  excellent_comments:
    - Explain the WHY behind code decisions
    - Clarify complex logic with clear explanations
    - Document assumptions and preconditions
    - Note side effects or state changes
    - Explain algorithm steps and calculations
    
  poor_comments_to_avoid:
    - Restating obvious code operations
    - Providing redundant information
    - Using vague descriptions
    - Writing incomplete fragments
    
  formatting_standards:
    spacing: "Single space after apostrophes"
    alignment: "Consistent column alignment for inline comments"
    sentences: "Use complete sentences for clarity"

quality_metrics:
  achievement_levels:
    johnny_mac_level:
      public_methods: "100%"
      private_methods: "95%+"
      assembly_code: "51.4%"
      consistency: "100%"
      
    industry_standard:
      public_methods: "70-80%"
      private_methods: "30-50%"
      assembly_code: "20-30%"
      consistency: "50-70%"
      
  quality_indicators:
    excellent:
      - Methods documented with clear purpose statements
      - Assembly code explains algorithm logic
      - Variables include units and ranges
      - Comments add genuine value beyond code
      - Consistent professional presentation
      
    good:
      - Most methods documented with basic descriptions
      - Some assembly comments explain key operations
      - Major variables have purpose comments
      - Consistent style maintained throughout
      
    poor:
      - Missing method documentation
      - Assembly code lacks comments
      - Variables undefined or unclear
      - Inconsistent comment styles

implementation_guidelines:
  adoption_approach:
    1: "Document every public method with clear descriptions"
    2: "Target 50%+ comment coverage in PASM2 code"
    3: "Use inline comments for significant constants"
    4: "Maintain consistent patterns across all methods"
    5: "Apply same professional tone throughout"
    
  priority_order:
    1: "Document complex public methods first"
    2: "Focus on methods others will use frequently"
    3: "Add assembly comments to time-critical code"
    4: "Document variables and constants with clear purposes"
    
  integration_with_organization_standard:
    - File headers and footers handled by organization standard
    - Internal method documentation uses Johnny Mac's double apostrophe style
    - Assembly comments use Johnny Mac's single quote approach
    - Variable/constant documentation uses Johnny Mac's inline style

automation_instructions:
  parsing:
    - Identify methods needing documentation
    - Extract method signature components
    - Determine visibility level (PUB/PRI)
    - Parse parameters, returns, and locals
    
  generation:
    - Place documentation immediately after signature
    - Use double apostrophes for all methods
    - Write clear WHAT descriptions
    - Add "--" prefixed details for complex cases
    - No formal tags, use plain English
    - Maintain consistent formatting

best_practices:
  - Write self-documenting code that doesn't require external tools
  - Focus on clarity and completeness over brevity
  - Document everything that matters for understanding
  - Maintain professional presentation throughout
  - Use consistent patterns that others can follow
  - Achieve high coverage metrics (98%+ for methods)

why_this_works:
  - Simple to follow with clear patterns
  - Comprehensive coverage documents everything important
  - Self-contained without external tool dependencies
  - Proven effectiveness over 15+ years
  - Scalable from small utilities to complex systems
  - Professional appearance elevates community standards