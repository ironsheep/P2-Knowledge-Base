# Spin2 Language Construct: QUIT
construct: "QUIT"
category: "control_flow"
type: "loop_control"

description: "Exit current REPEAT loop immediately (like 'break')"

syntax:
  - "QUIT"         # Exit innermost loop
  - "QUITN level"  # Exit N levels of nested loops

example: |
  REPEAT i FROM 0 TO 99
    IF array[i] == target
      QUIT          ' Exit loop when found
    process(array[i])
  ' Execution continues here after QUIT
  
  ' Exit nested loops:
  REPEAT x FROM 0 TO 9      ' Level 2
    REPEAT y FROM 0 TO 9    ' Level 1
      IF grid[x][y] == value
        QUITN 2             ' Exit both loops

critical_behavior:
  - "Exits loop completely (not just iteration)"
  - "QUIT exits innermost loop only"
  - "QUITN levels count from innermost (1) outward"
  - "Loop counter/state abandoned"

common_patterns: |
  ' Infinite loop with exit
  REPEAT
    data := read_sensor()
    IF data == STOP_VALUE
      QUIT
    process(data)
  
  ' Search with early exit
  found := FALSE
  REPEAT i FROM 0 TO MAX-1
    IF items[i] == search_value
      found := TRUE
      QUIT

critical_pitfall: "QUIT only works in REPEAT loops, not in methods (use ABORT/RETURN)"

comparison:
  quit: "Exits loop entirely"
  next: "Skips to next iteration"
  abort: "Exits entire method"

related: ["repeat.yaml", "next.yaml", "abort.yaml"]