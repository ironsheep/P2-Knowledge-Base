title: "Quadrature Encoder Input"
subtitle: "Smart Pin Mode %01011 (P_QUADRATURE)"
language_reference: "combined"
compatible_languages: ["Spin2", "PASM2"]

brief_description: "Decodes A/B quadrature encoder signals for position and velocity measurement"

detailed_description:
  operation: |
    Tracks quadrature encoder transitions on A and B inputs to determine position and direction.
    Counts all four transitions per encoder detent (two per signal). Maintains signed 32-bit
    count that increments/decrements based on rotation direction. Supports both continuous
    totalizer mode and periodic velocity measurements.
  
  timing: |
    Continuous mode (X=0): Z register always holds current position count
    Periodic mode (X>0): Measures counts over X clock cycles
    IN flag raised at end of each measurement period
    Can zero count anytime by pulsing DIR low

registers:
  x_register:
    bits_31_0: "Measurement period in clocks (0=continuous totalizer)"
  y_register:  
    function: "Not used in this mode"
  z_register:
    function: "Signed 32-bit count (4 counts per encoder detent)"

flags:
  in_flag: "Raised at end of measurement period (periodic mode only)"
  a_input: "Encoder phase A signal"
  b_input: "Encoder phase B signal (typically from adjacent pin)"

code_examples:
  - title: "Position and Velocity Tracking"
    description: "Absolute position on P32, velocity on P33"
    code: |
      CON
        _clkfreq = 200_000_000
        enc_a = 32                                ' Encoder A phase
        enc_b = 33                                ' Encoder B phase (for velocity)
      
      PUB main() | position, velocity
        ' Configure P32 for continuous position tracking
        pinstart(enc_a, P_QUADRATURE | P_PLUS1_B, 0, 0)
        
        ' Configure P33 for velocity measurement (100ms periods)
        pinstart(enc_b, P_QUADRATURE | P_MINUS1_A, _clkfreq/10, 0)
        
        repeat
          position := rdpin(enc_a) sar 2         ' Divide by 4 for detents
          velocity := rdpin(enc_b) sar 2         ' Velocity in detents/100ms
          
          ' Reset position on button press
          if ina[0]
            pinclear(enc_a)                      ' Zero the counter
            pinstart(enc_a, P_QUADRATURE | P_PLUS1_B, 0, 0)
      
      DAT
      ' PASM2 equivalent
        org
        dirl    #enc_a                           ' Reset smart pin
        wrpin   ##P_QUADRATURE | P_PLUS1_B, #enc_a
        wxpin   #0, #enc_a                       ' Continuous mode
        dirh    #enc_a                           ' Enable encoder
      .loop
        rdpin   position, #enc_a                 ' Read position
        sar     position, #2                     ' Convert to detents
        jmp     #.loop

common_applications:
  - "Rotary encoder knobs for user interfaces"
  - "Motor shaft position feedback"
  - "Linear position sensing with optical encoders"
  - "Closed-loop motor control systems"

related_modes:
  - "Mode %01100: Count on A-rise when B-high"
  - "Mode %01101: Count up/down on A-rise based on B"
  - "Mode %01110: Count up on A-rise, down on B-rise"
  - "Mode %01111: Count while A or B high"

configuration_constants:
  mode_constant: "P_QUADRATURE"
  binary_value: "%01011"
  common_modifiers:
    - "P_PLUS1_B - Use next pin up for B signal"
    - "P_MINUS1_A - Use previous pin for A signal"
    - "P_FILT1_AB - Add 2-clock filtering to reduce noise"

notes:
  - "Counts all 4 transitions per detent (divide by 4 for detent count)"
  - "Z register is signed 32-bit for bidirectional counting"
  - "Pulse DIR low to zero count without reconfiguration"
  - "Use two pins: one for position (X=0), one for velocity (X>0)"
  - "No counts lost at period boundaries in periodic mode"