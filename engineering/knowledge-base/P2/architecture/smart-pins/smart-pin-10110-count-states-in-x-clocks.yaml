title: "Count States Over Periods Within X Clocks"
subtitle: "Smart Pin Mode %10110 (P_PERIODS_CLOCKS_STATES)"
language_reference: "combined"
compatible_languages: ["Spin2", "PASM2"]

brief_description: "Counts number of A-input state changes across periods that occur within X+ clock cycles"

detailed_description:
  operation: |
    Time-windowed state change counter. Counts the number of A-input state transitions (high-to-low
    and low-to-high) that occur across measurement periods within an X-clock time window. Combines
    clock-based timing window with state transition counting. Useful for analyzing signal activity
    rate within fixed time intervals.
  
  timing: |
    Measurement window is X clock cycles
    Period boundaries defined by Y[1:0] trigger combination
    Counts A-input state changes within window
    IN flag raised when X clocks elapse
    New measurement begins automatically

registers:
  x_register:
    bits_31_0: "Time window duration in clock cycles (X+ clocks)"
  y_register:
    bits_1_0: |
      Event trigger sensitivity:
      %00 = A-input rise to B-input rise
      %01 = A-input rise to B-input edge
      %10 = A-input edge to B-input rise
      %11 = A-input edge to B-input edge
  z_register:
    function: "Count of A-input state changes within X-clock window"

flags:
  in_flag: "Raised when X-clock window completes, measurement ready"
  a_input: "Signal to monitor (state changes are counted)"
  b_input: "Period boundary marker (can be same as A-input)"

code_examples:
  - title: "Activity Rate Measurement"
    description: "Count signal transitions in fixed time windows"
    code: |
      CON
        _clkfreq = 200_000_000
        signal_pin = 20
        window_ms = 100                          ' 100ms measurement window
      
      PUB main() | transitions, window_clks
        window_clks := (_clkfreq / 1000) * window_ms
        
        ' Count transitions in 100ms windows
        pinstart(signal_pin, P_PERIODS_CLOCKS_STATES | P_B_A_INPUT, window_clks, %11)
        
        repeat
          repeat until pinread(signal_pin)       ' Wait for window complete
          
          transitions := rdpin(signal_pin)       ' Get state change count
          debug("Transitions/100ms: ", udec(transitions))
      
      DAT
      ' PASM2 example - 1-second activity monitoring
        org
        dirl    #signal_pin                      ' Reset smart pin
        wrpin   ##P_PERIODS_CLOCKS_STATES | P_B_A_INPUT, #signal_pin
        wxpin   ##clkfreq, #signal_pin           ' 1-second window
        wypin   #%11, #signal_pin                ' Count all edges
        dirh    #signal_pin                      ' Start monitoring
      .loop
        testp   #signal_pin wc                   ' Check IN flag
        if_nc   jmp #.loop                       ' Wait for window complete
        rdpin   activity, #signal_pin            ' Get transition count
        ' Analyze activity level...
        jmp     #.loop                           ' Next window starts auto

  - title: "Signal Quality Monitoring"
    description: "Detect excessive noise by counting transitions"
    code: |
      CON
        _clkfreq = 200_000_000
        input_pin = 20
        max_expected = 50                        ' Expected transitions/second
      
      PUB main() | transitions, status
        ' Monitor for excessive activity (noise)
        pinstart(input_pin, P_PERIODS_CLOCKS_STATES | P_B_A_INPUT, _clkfreq, %11)
        
        repeat
          repeat until pinread(input_pin)
          
          transitions := rdpin(input_pin)
          
          if transitions > max_expected
            status := "NOISY"
          else
            status := "CLEAN"
          
          debug("Signal: ", zstr(status), " (", udec(transitions), " trans/sec)")

common_applications:
  - "Signal activity rate monitoring"
  - "Noise detection (excessive transition counting)"
  - "Communication channel quality assessment"
  - "Event frequency measurement within time windows"

related_modes:
  - "Mode %10100: Periods/count/states - fixed period count, variable time"
  - "Mode %10101: Periods/clocks/time - measures time instead of transitions"
  - "Mode %10111: Periods/clocks/periods - counts periods instead of states"
  - "Mode %01110: Edge counter - continuous edge counting"

configuration_constants:
  mode_constant: "P_PERIODS_CLOCKS_STATES"
  binary_value: "%10110"
  common_modifiers:
    - "P_B_A_INPUT - Use A-input for both A and B (single pin measurement)"
    - "P_PLUS1_B - Use next pin as B-input"
    - "P_MINUS1_B - Use previous pin as B-input"
    - "P_FILT1_AB - Add filtering for noise immunity"
  
  y_register_values:
    - "%00 - A-rise to B-rise"
    - "%01 - A-rise to B-edge"
    - "%10 - A-edge to B-rise"
    - "%11 - A-edge to B-edge (typical for transition counting)"

notes:
  - "Time window is fixed (X clocks), transition count varies with activity"
  - "Counts state changes (transitions), not time spent in states"
  - "Useful for detecting signal integrity issues"
  - "B-input can be same as A-input for single-pin measurements"
  - "Y[1:0] = %11 provides maximum sensitivity to all transitions"
  - "Measurement restarts automatically after each X-clock window"
