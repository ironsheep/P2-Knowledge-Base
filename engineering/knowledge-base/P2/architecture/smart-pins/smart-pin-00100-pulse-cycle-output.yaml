# Smart Pin Mode: %00100 - Pulse/Cycle Output
# Concise reference optimized for AI code generation

mode: "%00100"
name: "Pulse/Cycle Output"
category: "timing"

# Constants
constants:
  spin2: "P_PULSE"
  pasm2: "P_PULSE"
  mode_bits: "%00100"

# Operation
operation: |
  Generates programmable pulses and cycles. OUT overridden.
  Base period counter counts from X[15:0] down to 1.
  Output high when counter > X[31:16] and Y > 0.
  Y decrements after each pulse/cycle until zero.

# Parameters
x_register:
  function: "Pulse timing configuration"
  X[15:0]: "Base period in clocks (high+low time)"
  X[31:16]: "Compare value (output high when counter > this)"
  examples:
    - "X=$0003_0002: 3-clock period, high for 1 clock (pattern: 0-0-1)"
    - "X=$0000_nnnn: Continuous high while Y > 0"
    - "X=$0010_0008: 16-clock period, 50% duty (8 high, 8 low)"

y_register:
  function: "Number of pulses/cycles"
  Y[31:0]: "Pulse count (decrements to 0)"
  behavior: "Non-zero starts output, decrements each cycle"

z_register: "Not used"

in_flag: "Raised when Y reaches 0 (pulses complete)"

out_signal: "Overridden by smart pin"

# Pin Behavior
pin_behavior:
  reset_state: "IN=0, output=0, Y=0"
  output_control: "Smart pin controls output directly"
  timing: "Starts at next base period after Y written"

# Complete Spin2 Example
spin2_complete: |
  CON
    PULSE_PIN = 48
    
  PUB main()
    ' Single pulse example
    single_pulse(1000, 16)         ' 1ms pulse, 16 times
    
    ' Square wave burst
    square_wave_burst(50)          ' 50% duty, 100 cycles
    
  PUB single_pulse(width_clocks, count) | mode
    mode := P_PULSE | P_OE
    
    PINCLEAR(PULSE_PIN)
    WRPIN(PULSE_PIN, mode)
    WXPIN(PULSE_PIN, width_clocks) ' X[31:16]=0 for continuous high
    WYPIN(PULSE_PIN, count)         ' Number of pulses
    PINHIGH(PULSE_PIN)              ' Enable
    
    ' Wait for completion
    REPEAT UNTIL PINREAD(PULSE_PIN) & $8000_0000
    
  PUB square_wave_burst(cycles) | mode, period
    mode := P_PULSE | P_OE
    period := $0010_0008            ' 16 clocks, 50% duty
    
    PINCLEAR(PULSE_PIN)
    WRPIN(PULSE_PIN, mode)
    WXPIN(PULSE_PIN, period)       
    WYPIN(PULSE_PIN, cycles)       
    PINHIGH(PULSE_PIN)
    
  PUB custom_pattern() | mode, pattern
    ' Generate 0-0-1 pattern
    mode := P_PULSE | P_OE
    pattern := $0003_0002           ' 3-clock period, high when > 2
    
    PINCLEAR(PULSE_PIN)
    WRPIN(PULSE_PIN, mode)
    WXPIN(PULSE_PIN, pattern)       ' 0-0-1 repeating
    WYPIN(PULSE_PIN, 100)           ' 100 repetitions
    PINHIGH(PULSE_PIN)

# Complete PASM2 Example
pasm2_complete: |
  DAT
          ORG
  
  ' Pin and mode configuration
  pulse_pin     LONG  48
  pulse_mode    LONG  P_PULSE | P_OE
  
  ' Generate N pulses of specified width
  gen_pulses
          MOV   pin, pulse_pin
          DIRL  pin                   ' Reset
          WRPIN pulse_mode, pin       ' Configure
          MOV   x, width              ' Base period
          SHL   x, #16               ' X[31:16] = 0 (continuous)
          WXPIN x, pin               ' Set timing
          WYPIN count, pin           ' Set count
          DIRH  pin                  ' Start
  .wait   TESTP pin WC               ' Test IN
    IF_NC JMP   #.wait             ' Wait for completion
          RET
  
  ' Generate square wave
  square_wave
          MOV   pin, pulse_pin
          DIRL  pin
          WRPIN pulse_mode, pin
          MOV   x, period            ' Base period
          SHR   x, #1                ' Half period
          MOV   temp, x
          SHL   x, #16              ' To X[31:16]
          OR    x, period           ' X = period | (period/2 << 16)
          WXPIN x, pin
          WYPIN ##1000, pin         ' 1000 cycles
          DIRH  pin
          RET
  
  ' Variables
  pin           RES   1
  x             RES   1
  width         LONG  1000          ' 1000 clocks
  count         LONG  16
  period        LONG  100
  temp          RES   1

# Inline PASM2 in Spin2
spin2_inline: |
  PUB trigger_pulse(pin, width_clocks)
    ORG
      DIRL  pin
      WRPIN ##P_PULSE | P_OE, pin
      WXPIN width_clocks, pin       ' Width, X[31:16]=0
      WYPIN #1, pin                 ' Single pulse
      DIRH  pin
    END

# Key Points
timing_control: |
  Counter runs X[15:0] down to 1, then reloads
  Output high when counter > X[31:16]
  Allows complex duty cycles and patterns

special_cases: |
  X[31:16]=0: Continuous high while Y > 0
  X[31:16]=X[15:0]-1: Single clock low pulse
  X[31:16]=X[15:0]/2: 50% duty square wave

common_uses:
  - "Stepper motor control"
  - "LED pulse patterns"
  - "Timing signal generation"
  - "Burst communications"
  - "Gated clock outputs"

related: ["00101 (Transition)", "00110 (NCO Freq)", "01000-01001 (PWM modes)"]