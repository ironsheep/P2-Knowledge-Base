title: "PWM Triangle Wave Output"
subtitle: "Smart Pin Mode %01000 (P_PWM_TRIANGLE)"
language_reference: "combined"
compatible_languages: ["Spin2", "PASM2"]

brief_description: "Generates triangle-wave PWM with configurable base period and duty cycle using up-down counter"

detailed_description:
  operation: |
    Uses up-down counter to create symmetrical triangle PWM waveform. Counter counts from frame
    period down to 1, then back up to frame period. Output high when counter ≤ duty value.
    Total PWM period is twice the frame period. Mode overrides OUT signal for direct pin control.
  
  timing: |
    Base period = System clock ÷ X[15:0] clock cycles
    Frame period = X[31:16] × base period  
    PWM period = 2 × frame period (due to up-down counting)
    IN flag raised when Y captured at frame start

registers:
  x_register:
    bits_15_0: "Base period divisor (1-65536 system clocks)"
    bits_31_16: "Frame period in base periods (1-65536)"
  y_register:  
    bits_15_0: "PWM duty value (0 to frame period value)"
    bits_31_16: "Unused"
  z_register:
    function: "Not used in this mode"

flags:
  in_flag: "Raised when Y[15:0] captured at frame start"
  out_signal: "Overridden by PWM output"

code_examples:
  - title: "50% Duty Cycle Triangle PWM at 24.4kHz"
    description: "25MHz clock, 1µs base period, 512 base periods frame"
    code: |
      CON
        _clkfreq = 25_000_000
        pwm_pin = 20
      
      PUB main() | mode, xval, yval
        mode := P_PWM_TRIANGLE | P_OE            ' PWM triangle with output enable
        xval := $0200_0001                       ' Base=1 clock, Frame=512 periods
        yval := $0000_0100                       ' 50% duty (256 of 512)
        
        pinstart(pwm_pin, mode, xval, yval)      ' Configure and start
        repeat                                    ' PWM runs autonomously
      
      DAT
      ' PASM2 equivalent
        org
        dirl    #pwm_pin                         ' Reset smart pin
        wrpin   ##P_PWM_TRIANGLE | P_OE, #pwm_pin
        wxpin   ##$0200_0001, #pwm_pin           ' Base and frame periods
        dirh    #pwm_pin                         ' Enable smart pin
        wypin   #$100, #pwm_pin                  ' Set 50% duty cycle
      .loop
        jmp     #.loop                           ' PWM runs independently

common_applications:
  - "Motor control with smooth acceleration profiles"
  - "LED dimming with linear brightness response"
  - "Audio amplifier bias control"
  - "Power supply voltage regulation"

related_modes:
  - "Mode %01001: PWM Sawtooth (asymmetric waveform)"
  - "Mode %01010: PWM SMPS (switch-mode power supply)"
  - "Mode %00110: NCO Frequency (square wave output)"

configuration_constants:
  mode_constant: "P_PWM_TRIANGLE"
  binary_value: "%01000"
  common_modifiers:
    - "P_OE - Enable output drive"
    - "P_INVERT_OUTPUT - Invert PWM signal"
    - "P_HIGH_15K / P_LOW_15K - Reduce drive strength"

notes:
  - "Output always starts low during reset (DIR=0)"
  - "Y=0 produces constant low output"  
  - "Y=frame period value produces constant high"
  - "Symmetrical rise/fall times due to triangle counting"
  - "2-clock delay after WRPIN/WXPIN/WYPIN before IN flag valid"