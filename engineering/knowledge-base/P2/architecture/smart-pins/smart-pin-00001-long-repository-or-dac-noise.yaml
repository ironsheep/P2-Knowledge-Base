# Smart Pin Mode: %00001 - Long Repository / DAC Noise
# Concise reference optimized for AI code generation

mode: "%00001"
name: "Long Repository (non-DAC) / DAC Noise (DAC mode)"
category: "repository_dac"

# Constants
constants:
  spin2: "P_REPOSITORY or P_DAC_NOISE"
  pasm2: "P_REPOSITORY or P_DAC_NOISE"
  mode_bits: "%00001"
  
# Operation
operation: |
  Dual-purpose mode based on low-level pin configuration:
  - Non-DAC: 32-bit repository for data sharing between cogs
  - DAC mode (P[12:10]=%101): Outputs pseudo-random noise to DAC

# Parameters - Repository Mode
repository_mode:
  x_register: "Not used"
  y_register: "32-bit value to store"
  z_register: "Reads back stored value"
  in_flag: "High when Y written"
  
# Parameters - DAC Noise Mode  
dac_noise_mode:
  x_register: "Update rate (clock divider)"
  y_register: "Enable/disable noise (0=off, non-zero=on)"
  z_register: "Current PRNG value"
  requires: "P[12:10]=%101 in WRPIN mode value"

# Complete Spin2 Example
spin2_complete: |
  CON
    REPO_PIN = 48
    NOISE_PIN = 49
    
  VAR
    LONG shared_value
    
  PUB main()
    ' Repository mode - share data between cogs
    setup_repository()
    
    ' DAC noise mode - generate random analog output
    setup_dac_noise()
    
  PUB setup_repository() | mode
    mode := P_REPOSITORY
    PINSTART(REPO_PIN, mode, 0, $12345678)  ' Store value
    
    ' Another cog can read this
    shared_value := RDPIN(REPO_PIN)         ' Read repository
    
  PUB setup_dac_noise() | mode
    ' Combine with DAC mode bits
    mode := P_DAC_NOISE | P_DAC_124R_3V | P_OE
    PINCLEAR(NOISE_PIN)
    WRPIN(NOISE_PIN, mode)
    WXPIN(NOISE_PIN, 1000)          ' Update rate
    WYPIN(NOISE_PIN, 1)             ' Enable noise
    PINHIGH(NOISE_PIN)              ' Start DAC output
    
  PUB write_repository(value)
    WYPIN(REPO_PIN, value)          ' Update stored value
    
  PUB read_repository() : value
    value := RDPIN(REPO_PIN)        ' Read without clearing IN

# Complete PASM2 Example
pasm2_complete: |
  DAT
          ORG
  
  ' Pin assignments
  repo_pin      LONG  48
  noise_pin     LONG  49
  repo_mode     LONG  P_REPOSITORY
  noise_mode    LONG  P_DAC_NOISE | P_DAC_124R_3V | P_OE
  
  ' Setup repository for inter-cog communication
  setup_repo
          MOV   pin, repo_pin
          DIRL  pin                   ' Reset
          WRPIN repo_mode, pin        ' Configure
          DIRH  pin                   ' Enable
          WYPIN ##$DEADBEEF, pin      ' Store value
          RET
  
  ' Read from repository
  read_repo
          MOV   pin, repo_pin
          RDPIN data, pin             ' Get stored value
          RET
          
  ' Setup DAC noise generator
  setup_noise
          MOV   pin, noise_pin
          DIRL  pin
          WRPIN noise_mode, pin       ' DAC + noise mode
          WXPIN ##1000, pin           ' Update rate
          WYPIN #1, pin               ' Enable
          DIRH  pin                   ' Start output
          RET
          
  ' Variables
  pin     RES   1
  data    RES   1

# Inline PASM2 in Spin2
spin2_inline: |
  PUB store_value(pin, value)
    ORG
      WYPIN value, pin              ' Store to repository
    END
    
  PUB get_value(pin) : result
    ORG
      RDPIN result, pin             ' Read repository
    END

# Key Points
repository_use: |
  Share 32-bit values between cogs
  Non-blocking read/write
  IN flag indicates new data
  
dac_noise_use: |
  Requires DAC mode bits in WRPIN
  Generates white noise output
  X controls update frequency
  
common_uses:
  - "Inter-cog communication"
  - "Flags and semaphores"
  - "Random analog signals"
  - "Audio noise generation"

related: ["00010 (DAC Dither PRNG)", "00011 (DAC Dither PWM)"]