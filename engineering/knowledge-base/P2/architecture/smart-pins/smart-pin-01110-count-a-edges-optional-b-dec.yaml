title: "Edge Counter with Optional Up/Down"
subtitle: "Smart Pin Mode %01110 (P_COUNT_RISES)"
language_reference: "combined"
compatible_languages: ["Spin2", "PASM2"]

brief_description: "Count A-input edges, optionally decrement on B-input edges based on Y[0]"

detailed_description:
  operation: |
    Dual-mode edge counter controlled by Y[0]. When Y[0]=0, counts only A-input positive edges.
    When Y[0]=1, increments on A-input positive edges and decrements on B-input positive edges,
    creating independent up/down counter. Both inputs count edges independently - not gated or
    dependent on each other's state.
  
  timing: |
    Continuous mode (X=0): Z register always holds current net count
    Periodic mode (X>0): Net count over X clock cycles
    IN flag raised at end of each measurement period
    A and B edges counted independently

registers:
  x_register:
    bits_31_0: "Measurement period in clocks (0=continuous totalizer)"
  y_register:  
    bit_0: "0=count A edges only, 1=inc on A edges/dec on B edges"
    bits_31_1: "Unused"
  z_register:
    function: "32-bit count (unsigned if Y[0]=0, signed if Y[0]=1)"

flags:
  in_flag: "Raised at end of measurement period (periodic mode only)"
  a_input: "Increment signal (positive edges)"
  b_input: "Decrement signal when Y[0]=1 (positive edges)"

code_examples:
  - title: "Independent Up/Down Counters"
    description: "Count up events on P24, down events on P25"
    code: |
      CON
        _clkfreq = 200_000_000
        counter_pin = 24                         ' Primary counter pin
        up_pin = 24                              ' Up count input (same)
        down_pin = 25                            ' Down count input (adjacent)
      
      PUB main() | net_count
        ' Configure for independent up/down counting
        pinstart(counter_pin, P_COUNT_RISES | P_PLUS1_B, 0, 1)
        
        repeat
          net_count := rdpin(counter_pin)        ' Read net count
          debug("Net count: ", sdec(net_count))
          
          ' Reset counter
          if ina[0]
            pinclear(counter_pin)
            pinstart(counter_pin, P_COUNT_RISES | P_PLUS1_B, 0, 1)
      
      DAT
      ' PASM2 single input counter example
        org
        dirl    #counter_pin                     ' Reset smart pin
        wrpin   ##P_COUNT_RISES, #counter_pin    
        wxpin   #0, #counter_pin                 ' Continuous mode
        wypin   #0, #counter_pin                 ' Count A only
        dirh    #counter_pin                     ' Enable counter
      .loop
        rdpin   count, #counter_pin              ' Read A edge count
        jmp     #.loop

common_applications:
  - "Event counting with separate increment/decrement inputs"
  - "Production line counting (add/reject counters)"
  - "Parking space occupancy (enter/exit sensors)"
  - "Resource pool tracking (allocate/free events)"

related_modes:
  - "Mode %01101: Up/down based on B level at A edge"
  - "Mode %01111: Count while high (level sensitive)"
  - "Mode %01011: Quadrature encoder (coordinated counting)"
  - "Mode %01100: Gated edge counter"

configuration_constants:
  mode_constant: "P_COUNT_RISES"
  binary_value: "%01110"
  common_modifiers:
    - "P_PLUS1_B - Use next pin for decrement input"
    - "P_MINUS1_B - Use previous pin for decrement"
    - "P_INVERT_A / P_INVERT_B - Count negative edges instead"
    - "P_FILT1_AB - Add filtering for noise immunity"

notes:
  - "Y[0]=0: Simple A-input edge counter"
  - "Y[0]=1: Independent up/down edge counters"
  - "A and B inputs count edges independently"
  - "No gating or state dependency between inputs"
  - "Z register signed when Y[0]=1 for negative counts"