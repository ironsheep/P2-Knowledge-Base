# Smart Pin Mode: %00110 - NCO Frequency
# Concise reference optimized for AI code generation

mode: "%00110"
name: "NCO Frequency (Numerically Controlled Oscillator)"
category: "nco"

# Constants
constants:
  spin2: "P_NCO_FREQ"
  pasm2: "P_NCO_FREQ"
  mode_bits: "%00110"

# Operation
operation: |
  Generates precise frequency using phase accumulation.
  Z accumulator adds Y value every X[15:0] clocks.
  Output follows Z[31] bit state.
  Overflow at 2^32 raises IN flag.

# Parameters
x_register:
  function: "Base period and initial phase"
  X[15:0]: "Base period divider (1-65536 clocks)"
  X[31:16]: "Initial phase load to Z[31:16] on WXPIN"
  phase: "Use X[31:16] for phase offset between pins"

y_register:
  function: "Frequency control value"
  Y[31:0]: "Added to Z accumulator each base period"
  formula: "Y = 2^32 × (Fout × X[15:0]) / Fclk"

z_register:
  function: "32-bit phase accumulator"
  Z[31]: "Drives pin output"
  Z[31:0]: "Accumulates Y each base period"
  overflow: "Raises IN when Z wraps"

in_flag: "Raised on Z overflow (frequency cycle complete)"

out_signal: "Overridden by Z[31]"

# Complete Spin2 Example
spin2_complete: |
  CON
    NCO_PIN = 48
    _clkfreq = 200_000_000      ' 200 MHz system
    
  PUB main()
    ' Generate 1 MHz square wave
    generate_frequency(NCO_PIN, 1_000_000)
    
    ' Generate audio tone
    audio_tone(440)             ' 440 Hz A note
    
  PUB generate_frequency(pin, freq_hz) | mode, y_value
    mode := P_NCO_FREQ | P_OE
    
    ' Calculate Y for desired frequency
    ' Y = 2^32 * freq / clkfreq (with X=1)
    y_value := calc_nco_value(freq_hz, 1)
    
    PINCLEAR(pin)
    WRPIN(pin, mode)
    WXPIN(pin, 1)               ' Base period = 1 (max resolution)
    WYPIN(pin, y_value)         ' Set frequency
    PINHIGH(pin)                ' Enable NCO
    
  PRI calc_nco_value(freq_hz, x_div) : y_value
    ' Use QFRAC for accurate calculation
    QFRAC(freq_hz * x_div, _clkfreq)
    y_value := GETQX()
    
  PUB audio_tone(freq_hz) | mode, y_value
    mode := P_NCO_FREQ | P_OE | P_DAC_124R_3V
    
    y_value := calc_nco_value(freq_hz, 1)
    
    PINCLEAR(NCO_PIN)
    WRPIN(NCO_PIN, mode)        ' NCO + DAC output
    WXPIN(NCO_PIN, 1)           ' Base = 1
    WYPIN(NCO_PIN, y_value)
    PINHIGH(NCO_PIN)
    
  PUB phase_locked_outputs() | mode, y_val
    ' Two NCOs with 90° phase offset
    mode := P_NCO_FREQ | P_OE
    y_val := calc_nco_value(1000, 1)
    
    ' First pin - 0° phase
    PINCLEAR(48)
    WRPIN(48, mode)
    WXPIN(48, $0000_0001)       ' Phase = 0
    WYPIN(48, y_val)
    
    ' Second pin - 90° phase  
    PINCLEAR(49)
    WRPIN(49, mode)
    WXPIN(49, $4000_0001)       ' Phase = 90° (0x4000 = 1/4)
    WYPIN(49, y_val)
    
    PINHIGH(48)
    PINHIGH(49)                 ' Start together

# Complete PASM2 Example
pasm2_complete: |
  DAT
          ORG
  
  ' Pin and mode configuration
  nco_pin       LONG  48
  nco_mode      LONG  P_NCO_FREQ | P_OE
  clkfreq       LONG  200_000_000
  
  ' Generate specific frequency
  gen_frequency
          MOV   pin, nco_pin
          DIRL  pin                   ' Reset
          WRPIN nco_mode, pin         ' Configure
          
          ' Calculate Y value
          QFRAC freq_hz, clkfreq      ' freq/clkfreq
          GETQX y_value               ' Get fraction
          
          WXPIN #1, pin               ' Base period = 1
          WYPIN y_value, pin          ' Set frequency
          DIRH  pin                   ' Enable
          RET
  
  ' Sweep frequency
  freq_sweep
          MOV   pin, nco_pin
          DIRL  pin
          WRPIN nco_mode, pin
          WXPIN #1, pin
          
          MOV   y_value, start_freq
  .loop   WYPIN y_value, pin
          DIRH  pin
          WAITX ##10_000_000          ' 50ms @ 200MHz
          ADD   y_value, step_size
          CMP   y_value, end_freq WC
    IF_C  JMP   #.loop
          RET
  
  ' Phase modulation
  phase_mod
          QFRAC carrier, clkfreq
          GETQX carrier_y
          
  .loop   RDPIN phase, mod_pin        ' Read modulation
          SHL   phase, #16            ' To X[31:16]
          OR    phase, #1             ' X[15:0] = 1
          WXPIN phase, pin            ' Update phase
          WYPIN carrier_y, pin
          JMP   #.loop
  
  ' Variables
  pin           RES   1
  y_value       RES   1
  freq_hz       LONG  1_000_000      ' 1 MHz
  start_freq    LONG  $0010_0000
  end_freq      LONG  $1000_0000
  step_size     LONG  $0001_0000
  carrier       LONG  10_000
  carrier_y     RES   1
  phase         RES   1
  mod_pin       LONG  47

# Key Points
frequency_formula: |
  Y = (2^32 × Fout × X[15:0]) / Fclk
  For X=1: Y = 2^32 × Fout / Fclk
  Use QFRAC for accurate calculation

phase_control: |
  X[31:16] sets initial phase (0-65535 = 0-360°)
  Multiple NCOs can be phase-locked
  Phase updated via WXPIN

resolution: |
  Frequency resolution = Fclk / (X[15:0] × 2^32)
  Best resolution with X=1
  Trade resolution for update rate with larger X

common_uses:
  - "Clock generation"
  - "Audio tone synthesis"  
  - "Local oscillators"
  - "Frequency sweeps"
  - "Phase-locked signals"

related: ["00111 (NCO Duty)", "00101 (Transition)", "01000-01001 (PWM)"]