title: "Gated Positive Edge Counter"
subtitle: "Smart Pin Mode %01100 (P_REG_UP)"
language_reference: "combined"
compatible_languages: ["Spin2", "PASM2"]

brief_description: "Counts positive edges on A-input only when B-input is high"

detailed_description:
  operation: |
    Counts rising edges (0→1 transitions) on A-input, but only while B-input is high. Acts as
    a gated counter where B-input enables/disables counting. Useful for conditional counting,
    gated frequency measurement, or event counting with enable control. Supports both continuous
    totalizer and periodic measurement modes.
  
  timing: |
    Continuous mode (X=0): Z register always holds current count
    Periodic mode (X>0): Counts edges over X clock cycles
    IN flag raised at end of each measurement period
    Edges at period boundaries counted in next period

registers:
  x_register:
    bits_31_0: "Measurement period in clocks (0=continuous totalizer)"
  y_register:  
    function: "Not used in this mode"
  z_register:
    function: "32-bit count of gated positive edges"

flags:
  in_flag: "Raised at end of measurement period (periodic mode only)"
  a_input: "Signal to count (positive edges)"
  b_input: "Gate control (high enables counting)"

code_examples:
  - title: "Gated Frequency Counter"
    description: "Count pulses on P16 when enable on P17 is high"
    code: |
      CON
        _clkfreq = 200_000_000
        sig_pin = 16                             ' Signal to count
        gate_pin = 17                            ' Gate control (on next pin)
      
      PUB main() | count, freq
        ' Configure for 1-second gated measurements
        pinstart(sig_pin, P_REG_UP | P_PLUS1_B, _clkfreq, 0)
        
        repeat
          ' Wait for measurement complete
          repeat until pinr(sig_pin)
          freq := rdpin(sig_pin)                 ' Read frequency in Hz
          
          debug("Frequency: ", udec(freq), " Hz")
      
      DAT
      ' PASM2 continuous totalizer example
        org
        dirl    #sig_pin                         ' Reset smart pin
        wrpin   ##P_REG_UP | P_PLUS1_B, #sig_pin ' Gate on next pin
        wxpin   #0, #sig_pin                     ' Continuous mode
        dirh    #sig_pin                         ' Enable counter
      .loop
        rdpin   count, #sig_pin                  ' Read current count
        ' Count only increments when P17 is high
        jmp     #.loop

common_applications:
  - "Gated frequency measurement"
  - "Event counting with enable control"
  - "Pulse counting during specific time windows"
  - "RPM measurement with enable signal"

related_modes:
  - "Mode %01011: Quadrature encoder (uses both A and B)"
  - "Mode %01101: Up/down counter based on B state"
  - "Mode %01110: Count A-rise and B-rise separately"
  - "Mode %01111: Count while A or B high"

configuration_constants:
  mode_constant: "P_REG_UP"
  binary_value: "%01100"
  common_modifiers:
    - "P_PLUS1_B - Use next pin for gate signal"
    - "P_MINUS1_B - Use previous pin for gate"
    - "P_INVERT_B - Invert gate logic (count when B low)"
    - "P_FILT1_AB - Add filtering to reduce noise"

notes:
  - "Only counts positive edges (0→1 transitions)"
  - "B-input acts as synchronous gate (not edge-triggered)"
  - "No edges lost at measurement period boundaries"
  - "Does not provide switch debouncing - add filtering if needed"
  - "32-bit counter allows long accumulation periods"