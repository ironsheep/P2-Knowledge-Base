services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    # Name the built image so Docker reuses cached layers across rebuilds.
    image: p2-knowledge-base-dev:local
    volumes:
      - ..:/workspaces/P2-Knowledge-Base:cached
      - todo-mcp-data:/home/vscode/.local/share/todo-mcp
    command: sleep infinity

volumes:
  todo-mcp-data:
