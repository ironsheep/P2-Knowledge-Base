# P2 Knowledge Base - AI Integration Instructions v3.2
# Key-based access system with navigation support
# Version: 3.2

instructions_version: "3.2"
last_updated: "2025-11-30"

# ============================================================================
# UPGRADE INSTRUCTIONS - For AI systems updating from v3.1 or earlier
# ============================================================================
upgrade_instructions: |
  ## Upgrading to v3.2

  If you detected a hash mismatch and are upgrading:

  1. Run the refresh script to update all components:
     ```bash
     .p2kb-cache/refresh-kb.sh
     ```
     This handles migration from v3.1 structure automatically.

  2. Delete the existing "# P2 Knowledge Base Integration" section from your CLAUDE.md

  3. Append the content from the 'claude_md_content' field below to your CLAUDE.md

  4. Store the content_hash from propeller-knowledge-root.yaml somewhere persistent

  5. Test the new system:
     ```bash
     .p2kb-cache/fetch-kb-file.sh --help
     ```

  ## What's New in v3.2
  - Navigation commands: --browse, --search, --cached, --categories
  - Better error messages with similar key suggestions
  - Category-based browsing (45 categories)
  - Index and cache moved to hidden location (.p2kb/ on Unix)

# ============================================================================
# CLAUDE.MD CONTENT - Append this to your CLAUDE.md file
# ============================================================================
claude_md_content: |
  # P2 Knowledge Base Integration

  _Version: 3.2_
  _Last Updated: 2025-11-30_
  _Hash Source: propeller-knowledge-root.yaml → ai_instructions.content_hash_

  ## 🚨 IMPORTANT: Script-Only Access

  **ALWAYS use the fetch script for ALL P2KB operations.**
  **NEVER access the index or cache files directly.**

  - ❌ DON'T: `jq ... .p2kb/p2kb-index.json`
  - ❌ DON'T: `cat .p2kb/cache/...`
  - ❌ DON'T: Guess at key names
  - ✅ DO: `.p2kb-cache/fetch-kb-file.sh --search <term>`
  - ✅ DO: `.p2kb-cache/fetch-kb-file.sh --browse <category>`
  - ✅ DO: `.p2kb-cache/fetch-kb-file.sh <key>`

  ## 🔒 P2KB Locations (v3.2)
  - **Scripts (user-visible):** `.p2kb-cache/` (project directory)
  - **Index/Cache (hidden):** `.p2kb/` (project directory)

  ## Quick Reference - Interface Commands

  ### Get Help
  ```bash
  .p2kb-cache/fetch-kb-file.sh --help
  ```

  ### Find Keys
  ```bash
  # Search for keys containing a term (case-insensitive)
  .p2kb-cache/fetch-kb-file.sh --search uart
  .p2kb-cache/fetch-kb-file.sh --search cordic

  # Browse keys by category
  .p2kb-cache/fetch-kb-file.sh --browse pasm2_branch
  .p2kb-cache/fetch-kb-file.sh --browse architecture_core
  .p2kb-cache/fetch-kb-file.sh --browse smart_pins_serial

  # List all categories
  .p2kb-cache/fetch-kb-file.sh --categories
  ```

  ### Fetch Content
  ```bash
  .p2kb-cache/fetch-kb-file.sh p2kbPasm2Mov      # Get MOV instruction
  .p2kb-cache/fetch-kb-file.sh p2kbArchCog       # Get COG architecture
  .p2kb-cache/fetch-kb-file.sh p2kbGuideQuickQueries  # Starting point
  ```

  ### Check Downloaded Files
  ```bash
  .p2kb-cache/fetch-kb-file.sh --cached
  ```

  ### Key Prefixes
  - `p2kbPasm2*` - PASM2 assembly instructions (362 instructions)
  - `p2kbSpin2*` - Spin2 methods and language elements
  - `p2kbArch*` - P2 architecture (cog, hub, cordic, etc.)
  - `p2kbGuide*` - Guides and quick references
  - `p2kbHw*` - Hardware specifications

  ### Categories (for --browse)
  **PASM2:** pasm2_branch, pasm2_math, pasm2_pin, pasm2_cordic, pasm2_hub_ram, pasm2_smart_pin, ...
  **Architecture:** architecture_core, architecture_timing, architecture_interrupts, architecture_io, ...
  **Smart Pins:** smart_pins_digital, smart_pins_serial, smart_pins_pwm, smart_pins_analog, ...
  **Spin2:** spin2_control_flow, spin2_pin_control, spin2_timing, spin2_math, ...
  **Guides:** guides_getting_started

  ### Update Check Protocol
  1. Fetch root manifest:
     `.p2kb-cache/fetch-kb-file.sh manifests/propeller-knowledge-root.yaml`
  2. Compare `ai_instructions.content_hash` with your stored hash
  3. If different → run `.p2kb-cache/refresh-kb.sh` then update CLAUDE.md
  4. If same → cache is current, proceed normally

  ### Quick Refresh
  ```bash
  .p2kb-cache/refresh-kb.sh
  ```

  ## Starting Point
  Use `--search` or `--browse guides_getting_started` to find relevant keys for your task.

# ============================================================================
# FRESH SETUP INSTRUCTIONS - For new AI systems
# ============================================================================
setup_instructions: |
  ## P2 Knowledge Base v3.2 Setup

  ### Step 1: Create Script Directory
  ```bash
  mkdir -p .p2kb-cache
  ```

  ### Step 2: Download Fetch Script

  **Unix/macOS/Linux:**
  ```bash
  curl -sS https://raw.githubusercontent.com/ironsheep/P2-Knowledge-Base/main/engineering/tools/p2kb/fetch-kb-file.sh > .p2kb-cache/fetch-kb-file.sh
  chmod +x .p2kb-cache/fetch-kb-file.sh
  ```

  **Windows PowerShell:**
  ```powershell
  New-Item -ItemType Directory -Path ".p2kb-cache" -Force
  Invoke-WebRequest -Uri "https://raw.githubusercontent.com/ironsheep/P2-Knowledge-Base/main/engineering/tools/p2kb/fetch-kb-file.ps1" -OutFile ".p2kb-cache\fetch-kb-file.ps1"
  ```

  ### Step 3: Verify Setup
  ```bash
  .p2kb-cache/fetch-kb-file.sh --help
  ```

  ✅ Setup complete when you see the help message with available commands.

  ### Optional: Download Refresh Script
  ```bash
  curl -sS https://raw.githubusercontent.com/ironsheep/P2-Knowledge-Base/main/engineering/tools/p2kb/refresh-kb.sh > .p2kb-cache/refresh-kb.sh
  chmod +x .p2kb-cache/refresh-kb.sh
  ```

usage:
  description: |
    The v3.2 system uses keys to access content with built-in navigation.
    ALWAYS use the fetch script - NEVER access index or cache files directly.

  interface_commands:
    help: "Show all available commands and usage examples"
    cached: "List keys that have been downloaded to local cache"
    browse: "List all keys in a category (e.g., pasm2_branch)"
    search: "Find keys matching a search term (case-insensitive)"
    categories: "List all available categories with key counts"
    fetch: "Fetch content by providing just the key name"

  examples:
    find_keys:
      - ".p2kb-cache/fetch-kb-file.sh --search mov"
      - ".p2kb-cache/fetch-kb-file.sh --browse pasm2_math"
      - ".p2kb-cache/fetch-kb-file.sh --categories"
    fetch_content:
      - ".p2kb-cache/fetch-kb-file.sh p2kbPasm2Mov"
      - ".p2kb-cache/fetch-kb-file.sh p2kbArchCog"
      - ".p2kb-cache/fetch-kb-file.sh p2kbGuideQuickQueries"
    check_cache:
      - ".p2kb-cache/fetch-kb-file.sh --cached"

  forbidden_patterns:
    description: "NEVER do these - always use the script interface"
    examples:
      - "jq ... .p2kb/p2kb-index.json  # DON'T access index directly"
      - "cat .p2kb/cache/...  # DON'T read cache files directly"
      - "grep ... p2kb-index.json  # DON'T search index directly"
      - "Guessing key names  # DON'T guess - use --search or --browse"

