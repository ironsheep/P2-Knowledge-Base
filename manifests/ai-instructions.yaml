ai_integration_content: |
  # P2 Knowledge Base Integration
  _Instructions Version: 2.0_
  _Last Updated: 2025-01-29_
  _Instructions Hash: sha256:9c2dbf67c5f952931b7b410377782c07492a52266093dc044b855e97e92f8dc2
  
  ## Repository Access
  - GitHub: https://github.com/ironsheep/P2-Knowledge-Base
  - Raw Base: https://raw.githubusercontent.com/ironsheep/P2-Knowledge-Base/main/
  - Root Entry: manifests/propeller-knowledge-root.yaml
  
  ## 🔴 CRITICAL NAVIGATION RULES - NO EXCEPTIONS
  
  ### Manifest-Only Navigation Protocol
  1. **ALWAYS** start with a manifest file
  2. **NEVER** guess or construct paths
  3. **ONLY** use exact paths provided by manifests
  4. **REPORT** missing content explicitly (don't manufacture paths)
  
  ### Path Construction Formula
  ```
  full_url = raw_base_url + base_path + file_path
  ```
  - raw_base_url: From root manifest
  - base_path: From category manifest
  - file_path: From specific entry
  
  ### When Content Not Found
  ❌ DO NOT:
  - Manufacture paths like "engineering/knowledge-base/P2/whatever.yaml"
  - Request web searches for missing content
  - Create fictional file locations
  - Guess at directory structures
  
  ✅ INSTEAD:
  - Report: "Content not found in P2 Knowledge Base: [specific item]"
  - Provide: "Searched manifests/[path] for [item] but found no entry"
  - Suggest: "Report to https://github.com/ironsheep/P2-Knowledge-Base/issues"
  
  ## 📚 Major Category Quick Access
  
  ### P2 Categories (Start Here for Specific Topics):
  
  **PASM2 Assembly** → `manifests/P2/language/pasm2-manifest.yaml`
  - 362 instructions + directives, compiler-validated
  - REAL Categories: Assembly Directives, Branch, CORDIC Solver, Color Space Converter,
    Event, Hub Control, Hub FIFO, Hub RAM, Interrupt, Lookup Table, Math and Logic,
    Pin Control, Pixel Mixer, Register Indirection, Smart Pin, Streamer
  - Special sections: Addressing Modes, COG/HUB Execution, Multi-COG Synchronization
  
  **Spin2 Language** → `manifests/P2/language/spin2-manifest.yaml`
  - 262 total entries including methods, operators, constructs
  - Method Categories: pin_control, timing, cog_control, memory, math, strings
  - Constructs: control_flow (repeat, if/else, case), program_structure (PUB/PRI, blocks)
  - Debug System: formatters (SDEC, UDEC, UHEX with underscore variants), commands (DEBUG, DLY, PC_KEY)
  
  **Smart Pins** → `manifests/P2/smart-pins-manifest.yaml`
  - 32 different I/O modes (all modes documented)
  - Categories: digital_io (basic), pulse_timing (measurement), counting (edge/special),
    serial_modes (async/sync serial), pwm_modes, analog (ADC/DAC/comparator)
  - Each mode has detailed configuration and use cases
  
  **Architecture** → `manifests/P2/architecture-manifest.yaml`
  - Core Systems: processors (8 COGs), memory (512KB hub), execution modes
  - Math Processing: CORDIC solver for trig/math functions
  - Synchronization: locks_and_events, interrupt_system
  - Special Features: Streamer (DMA), Smart Pins overview, system registers
  
  **Hardware Ecosystem** → `manifests/P2/hardware-manifest.yaml`
  - 30+ hardware items cataloged
  - Categories: evaluation_boards (P2 Eval, P2 Edge), p2_modules,
    breakout_boards, accessories (PropPlug, debuggers)
  - Each entry has specifications, pinouts, use cases
  
  **OBEX Community** → `manifests/P2/community/obex-manifest.yaml`
  - 253 community-contributed objects
  - ⚠️ CRITICAL: Search ALL categories (34 "misc" objects are drivers!)
  - Top author: Jon McPhalen (jonnymac) - 44+ quality objects
  - Expand search terms: "I2C" → also try "IIC", "TWI", "two-wire"
  
  **Patterns & Techniques** → `manifests/P2/patterns-manifest.yaml`
  - 25+ documented patterns
  - Categories: communication (UART, SPI, I2C patterns), timing (precision delays),
    coordination (COG synchronization, shared resources), optimization (speed vs size)
  - Real code examples from production use
  
  **Auxiliary Guides** → `manifests/P2/auxiliary-guides-manifest.yaml`
  - HOW to use the knowledge base effectively
  - OBEX search optimization strategies
  - Hardware testing workflows
  - Debug visualization (BMP generation)
  
  ### P1 Categories (When Available):
  _Currently planned - check knowledge_bases.p1.status in root_
  
  ## 🎯 Key Insights
  
  ### P2 Philosophy
  The P2 provides **building blocks**, NOT complete peripherals:
  - Need UART? → Smart Pins + OBEX serial object
  - Need SPI? → COGs + OBEX SPI object
  - Need I2C? → Smart Pins + OBEX I2C object
  
  ### OBEX Search Strategy
  1. **NEVER** filter by category first (miss 60+ objects!)
  2. Search across ALL 253 objects
  3. Expand keywords (I2C → IIC, TWI, two-wire, 2-wire)
  4. Check author "jonnymac" for quality implementations
  
  ### Manifest Self-Containment
  - Each manifest file is self-contained
  - Paths in a manifest are relative to that manifest's location
  - Never combine paths from different manifests
  
  ## 💡 Session Management Tips
  
  **For Users**: For best performance, clear conversation every 3-4 hours:
  - 0-3 hours: Peak performance
  - 3-4 hours: Consider clearing
  - 4+ hours: Performance degradation likely
  
  ## 🔄 Checking for Updates
  
  Each session, check root manifest's `ai_instructions.content_hash`:
  - If different from stored hash → Fetch new instructions
  - If same → Continue with cached instructions
  - User can force update: "Please update your P2 Knowledge Base instructions"
  
  ## 📋 Common Tasks
  
  **Finding PASM2 Instructions:**
  1. Start: `manifests/P2/language/pasm2-manifest.yaml`
  2. Locate instruction category
  3. Fetch specific instruction YAML
  
  **Configuring Smart Pins:**
  1. Start: `manifests/P2/smart-pins-manifest.yaml`
  2. Find mode by function needed
  3. Get detailed mode specification
  
  **Finding OBEX Objects:**
  1. Start: `manifests/P2/community/obex-manifest.yaml`
  2. Search ALL categories (critical!)
  3. Check multiple keyword variations
  
  **Hardware Testing:**
  1. Check: `manifests/P2/auxiliary-guides-manifest.yaml`
  2. Find hardware testing guide
  3. Follow pnut_ts workflow with log monitoring

