ai_integration_content: |
  # P2 Knowledge Base Integration
  _Instructions Version: 2.0_
  _Last Updated: 2025-01-29_
  _Instructions Hash: sha256:1b0e10737f53438feebe41a7d47b236d93ae3fa7800a8bb3efc362cedb23217f
  
  ## 🚨 MANDATORY SESSION START PROTOCOL
  
  **ON EVERY SESSION START/RESUME/RESTART:**
  1. Fetch root manifest: `manifests/propeller-knowledge-root.yaml`
  2. Find the `ai_instructions.content_hash` value in that file
  3. Compare THAT hash with the STORED HASH below (not with any hash in these instructions!)
  4. If different → You have old instructions, fetch new ones immediately
  5. If same → Your instructions are current, proceed
  
  **STORED HASH TO COMPARE AGAINST:** 
  `sha256:1fd95441e794f6d742def76bc8e04abf3f4a157239a610bce4321ee9553050c9`
  
  ⚠️ CRITICAL: Compare the root's hash with THIS stored hash above, NOT with the hash in the header of these instructions!
  
  **TRIGGER KEYWORDS:** "P2", "Propeller", "PASM", "Spin2", "Smart Pin", "OBEX"
  → When user mentions any of these, check for updates if not already done this session
  
  ## 📍 Quick Access Points
  - GitHub: https://github.com/ironsheep/P2-Knowledge-Base
  - Raw Base: https://raw.githubusercontent.com/ironsheep/P2-Knowledge-Base/main/
  - Root Manifest: manifests/propeller-knowledge-root.yaml
  
  ## 🎯 CRITICAL CONCEPTS (MEMORIZE THESE)
  
  ### 1. Manifest Self-Containment
  **MOST IMPORTANT RULE:** Each manifest is SELF-CONTAINED
  - Has its own `manifest_base` and `content_base` at top
  - All paths within are relative to those bases
  - NEVER combine paths from different manifests
  - Each manifest knows its complete context
  
  ### 2. P2 Philosophy
  P2 provides **building blocks**, NOT complete peripherals:
  - UART = Smart Pins + OBEX serial object
  - SPI = COGs + OBEX SPI object  
  - I2C = Smart Pins + OBEX I2C object
  
  ### 3. OBEX Search Rule
  **NEVER filter by category first!** (You'll miss 60+ objects)
  - 34 "misc" objects are actually drivers
  - Always search ALL 253 objects
  - Expand keywords: I2C → IIC, TWI, two-wire
  
  ## 📂 DIRECT CATEGORY ACCESS (USE THESE SHORTCUTS)
  
  ### Language References
  **PASM2** → `manifests/P2/language/pasm2-manifest.yaml`
  - 362 instructions, organized by: Assembly Directives, Branch, CORDIC, 
    Event, Hub Control/FIFO/RAM, Interrupt, Math/Logic, Pin, Smart Pin, Streamer
  
  **Spin2** → `manifests/P2/language/spin2-manifest.yaml`
  - 262 entries: methods (pin, timing, cog, memory, math, strings)
  - Constructs: control flow, program structure, inline PASM
  - Debug: formatters with underscore variants (SDEC vs SDEC_)
  
  ### Hardware References
  **Smart Pins** → `manifests/P2/smart-pins-manifest.yaml`
  - 32 modes: digital I/O, pulse timing, counting, serial, PWM, analog
  
  **Architecture** → `manifests/P2/architecture-manifest.yaml`
  - 8 COGs, 512KB hub RAM, CORDIC, Streamer, interrupts, locks
  
  **Boards** → `manifests/P2/hardware-manifest.yaml`
  - P2 Eval, P2 Edge, modules, accessories (30+ items)
  
  ### Community & Patterns
  **OBEX** → `manifests/P2/community/obex-manifest.yaml`
  - 253 objects - SEARCH ALL CATEGORIES
  - Top author: jonnymac (44+ objects)
  
  **Patterns** → `manifests/P2/patterns-manifest.yaml`
  - Communication, timing, COG sync, optimization (25+ patterns)
  
  **Guides** → `manifests/P2/auxiliary-guides-manifest.yaml`
  - OBEX search strategies, hardware testing, debug visualization
  
  ## ⚠️ NAVIGATION RULES
  
  1. **Start with manifests** - Never guess paths
  2. **Report missing content** - Don't manufacture URLs
  3. **Use exact paths** - From manifests only
  4. **Path construction** (within single manifest):
     ```
     full_url = raw_base + [manifest's content_base] + [item's content]
     ```
  
  ## 🔄 UPDATE MECHANISMS
  
  ### Automatic Check (Every Session)
  - Triggered by session start or P2-related keywords
  - Compare hash with stored value above
  - Silent update if different
  
  ### Manual Update (User Request)
  - "Update P2 Knowledge Base instructions"
  - "Refresh P2 KB configuration"
  - Forces re-fetch regardless of hash
  
  ## 💡 SESSION MANAGEMENT
  
  **For Users:** Clear conversation every 3-4 hours for best performance
  - 0-3 hrs: Peak performance
  - 3-4 hrs: Consider clearing  
  - 4+ hrs: Degradation likely
  
  **After Clear/Restart:** Always re-check root manifest (see top of instructions)
  
  ## 📋 COMMON TASK PATTERNS
  
  **PASM2 Instruction Lookup:**
  → Start: pasm2-manifest → Find category → Get instruction YAML
  
  **Smart Pin Configuration:**
  → Start: smart-pins-manifest → Match function to mode → Get spec
  
  **OBEX Driver Search:**
  → Start: obex-manifest → Search ALL categories → Try keyword variants
  
  **Hardware Testing:**
  → Start: auxiliary-guides → Find testing guide → Use pnut_ts workflow
  
