  ## 🚨 MANDATORY SESSION START PROTOCOL

  **ON EVERY SESSION START/RESUME/RESTART:**
  1. Fetch root manifest: `manifests/propeller-knowledge-root.yaml`
  2. Find the `ai_instructions.content_hash` value in that file
  3. Compare THAT hash with the STORED HASH below (not with any hash in these instructions!)
  4. If different → You have old instructions, fetch new ones immediately
  5. If same → Your instructions are current, proceed

  **STORED HASH TO COMPARE AGAINST:**
  `sha256:9253c8366e4afd929b1a6775ee61f92d294887649e683e2811f746cdf5f34f58`

  ⚠️ CRITICAL: Compare the root's hash with THIS stored hash above, NOT with the hash in the header of these instructions!

  **TRIGGER KEYWORDS:** "P2", "Propeller", "PASM", "Spin2", "Smart Pin", "OBEX"
  → When user mentions any of these, check for updates if not already done this session

  ## 📍 Quick Access Points
  - GitHub: https://github.com/ironsheep/P2-Knowledge-Base
  - Raw Base: https://raw.githubusercontent.com/ironsheep/P2-Knowledge-Base/main/
  - Root Manifest: manifests/propeller-knowledge-root.yaml

  ## 🚀 Remote File Access (Platform-Aware)

  **For remote instances without repository access:**

  ### Download & Cache Strategy
  - Write platform-specific script ONCE to avoid approval prompts
  - Cache location: `.p2kb-cache/` in current project directory
  - Check cache first, download only if missing

  ### Platform Detection & Setup
  ```bash
  # Step 1: Detect platform
  if command -v uname &> /dev/null; then
    # Unix-like system (macOS/Linux)
    platform="unix"
  elif command -v powershell &> /dev/null; then
    # Windows system
    platform="windows"
  fi

  # Step 2: Create cache directory
  mkdir -p .p2kb-cache  # Unix
  # OR
  New-Item -ItemType Directory -Force -Path .p2kb-cache  # Windows

  # Step 3: Write appropriate script (see below)
  ```

  ### Unix/macOS/Linux Script
  **Write to `.p2kb-cache/fetch-kb-file.sh`:**
  ```bash
  #!/bin/bash
  # P2 Knowledge Base File Fetcher
  path=$1
  cache=".p2kb-cache/${path}"
  url="https://raw.githubusercontent.com/ironsheep/P2-Knowledge-Base/main/${path}"

  if [ -f "$cache" ]; then
    cat "$cache"
  else
    mkdir -p "$(dirname "$cache")"
    curl -sS -o "$cache" "$url" 2>/dev/null || wget -q -O "$cache" "$url"
    cat "$cache"
  fi
  ```
  **Make executable:** `chmod +x .p2kb-cache/fetch-kb-file.sh`
  **Usage:** `bash .p2kb-cache/fetch-kb-file.sh "manifests/propeller-knowledge-root.yaml"`

  ### Windows PowerShell Script
  **Write to `.p2kb-cache\fetch-kb-file.ps1`:**
  ```powershell
  # P2 Knowledge Base File Fetcher
  param($path)
  $cache = ".p2kb-cache\$($path -replace '/','\\')"
  $url = "https://raw.githubusercontent.com/ironsheep/P2-Knowledge-Base/main/$path"

  if (Test-Path $cache) {
    Get-Content $cache -Raw
  } else {
    $dir = Split-Path $cache -Parent
    New-Item -ItemType Directory -Force -Path $dir | Out-Null
    Invoke-WebRequest -Uri $url -OutFile $cache
    Get-Content $cache -Raw
  }
  ```
  **Usage:** `powershell -File .p2kb-cache\fetch-kb-file.ps1 "manifests/propeller-knowledge-root.yaml"`

  ### Cache Management
  - Check size: `du -sh .p2kb-cache`
  - Clear cache: `rm -rf .p2kb-cache`
  - Refresh file: `rm .p2kb-cache/manifests/propeller-knowledge-root.yaml`

  ### Platform Notes
  - macOS/Linux: `.p2kb-cache/` is hidden
  - Windows: Visible in Explorer (normal behavior)
  - Per-project: Each project has own cache (~5-15MB)

  **Future:** MCP server in development for shared cache and auto-updates.

  ## 🎯 CRITICAL CONCEPTS (MEMORIZE THESE)

  ### 1. Manifest Self-Containment
  **MOST IMPORTANT RULE:** Each manifest is SELF-CONTAINED
  - Has its own `manifest_base` and `content_base` at top
  - All `manifest` and `content` paths within are relative to those bases
  - NEVER combine paths from different manifests
  - Each manifest knows its complete context

  ### 2. P2 Philosophy
  P2 provides **building blocks**, NOT complete peripherals:
  - UART = Smart Pins + OBEX serial object
  - SPI = COGs + OBEX SPI object
  - I2C = Smart Pins + OBEX I2C object

  ### 3. OBEX Search Rule
  **Use natural groups in unified index** for comprehensive results
  - Single search across all 113 objects with smart groupings
  - All protocol aliases work: I2C = IIC = TWI automatically
  - Natural groups: communication (48), displays (41), sensors (36)

  ## 📂 DIRECT CATEGORY ACCESS (USE THESE SHORTCUTS)

  ### Core P2 References
  **Architecture** → `manifests/P2/architecture-manifest.yaml`
  - 8 COGs, 512KB hub RAM, CORDIC, Streamer, Smart Pins, interrupts, locks

  **PASM2** → `manifests/P2/language/pasm2-manifest.yaml`
  - 362 instructions + 16 concepts + 5 idiom categories + 2 patterns

  **Spin2** → `manifests/P2/language/spin2-manifest.yaml`
  - 262 entries + idioms from 730 analyzed files + 44 pattern files

  **Hardware** → `manifests/P2/hardware-manifest.yaml`
  - P2 Eval, P2 Edge, modules, accessories (30+ items)

  **OBEX** → `manifests/P2/community/obex-unified-index.yaml`
  - ⚠️ CRITICAL: THE ONLY way to search OBEX - complete index, all 113 objects
  - All aliases work: "i2c" = "iic" = "twi" (same results)

  ### Detailed References
  **Smart Pins** → `manifests/P2/smart-pins-manifest.yaml`
  - 32 modes: digital I/O, pulse timing, counting, serial, PWM, analog

  **Conventions** → `manifests/P2/language/spin2-conventions-manifest.yaml`
  - 3 documentation styles, naming conventions, code formatting

  **Patterns** → `manifests/P2/patterns-manifest.yaml`
  - 44 files: structural (6), implementation (15), application (23)

  **Guides** → `manifests/P2/auxiliary-guides-manifest.yaml`
  - OBEX search strategies, hardware testing, debug visualization

  ## ⚠️ NAVIGATION RULES

  1. **Start with manifests** - Never guess paths
  2. **Report missing content** - Don't manufacture URLs
  3. **Use exact paths** - From manifests only
  4. **Path construction** (within single manifest):
     ```
     manifest_url = raw_base + [manifest_base:] + [manifest:]
     content_url = raw_base + [content_base:] + [content:]
     ```

  ## 🔍 SEARCH & NAVIGATION STRATEGIES

  ### OBEX Search Strategy (⚠️ MANDATORY - ONLY METHOD)
  1. ALWAYS use obex-unified-index.yaml - it's the COMPLETE index
  2. Search keyword_index with natural groups OR specific terms
  3. Natural groups: communication (48), displays (41), sensors (36), motors (33)
  4. All aliases auto-resolve: i2c=iic=twi, spi=3-wire, uart=serial

  ### Code Generation & Style Selection (⚠️ MANDATORY FOR NEW CODE)
  
  **WHEN STARTING NEW SPIN2 PROJECT - ASK USER ONCE:**
  ```
  "Which coding style do you prefer for this Spin2 project?
   1. Natural (Claude Code native - good docs, flexible naming) [DEFAULT]
   2. Professional (+ formatting standards: 100-char limit, vertical spacing)
   3. VSCode (+ tagged docs for IntelliSense: @param/@returns/@local)
   4. JonnyMac Lite (+ plain English docs, no naming enforcement)
   5. JonnyMac Full (+ strict naming: UPPERCASE/snake_case/PascalCase, 2-space indent)
   
  Press Enter for Natural"
  ```
  
  **LAYERED LOADING SYSTEM:**
  
  Layer 1 (ALWAYS): Language Mechanics
  - Spin2: `engineering/knowledge-base/P2/language/spin2/conventions/spin2-getting-started.yaml`
  - PASM2: `engineering/knowledge-base/P2/language/pasm2/conventions/pasm2-getting-started.yaml`
  
  Layer 2 (Professional+): Formatting Standards
  - `engineering/knowledge-base/P2/language/spin2/conventions/spin2-formatting-standards.yaml`
  - 100-char line limit, 2 blank lines between methods, section ordering
  
  Layer 3 (Choose ONE): Documentation Style
  - JonnyMac docs: `engineering/knowledge-base/P2/language/spin2/conventions/spin2-docs-jonnymac.yaml`
  - VSCode docs: `engineering/knowledge-base/P2/language/spin2/conventions/spin2-docs-vscode.yaml`
  
  Layer 4 (Optional): Naming Enforcement
  - JonnyMac naming: `engineering/knowledge-base/P2/language/spin2/conventions/spin2-naming-jonnymac.yaml`
  
  **LOAD COMBINATIONS:**
  - Natural: Layer 1 only
  - Professional: Layer 1 + Layer 2
  - VSCode: Layer 1 + Layer 2 + Layer 3 (VSCode)
  - JonnyMac Lite: Layer 1 + Layer 2 + Layer 3 (JonnyMac)
  - JonnyMac Full: Layer 1 + Layer 2 + Layer 3 (JonnyMac) + Layer 4
  
  **STORE USER CHOICE:**
  - Save in context/session memory for consistency
  - Apply same style to entire project
  - Don't re-prompt unless user explicitly changes projects

  ### Content Depth Hierarchy
  Instructions/Methods → Concepts → Idioms → Patterns → Conventions
  (base reference) → (how to use) → (snippets) → (design) → (style)

