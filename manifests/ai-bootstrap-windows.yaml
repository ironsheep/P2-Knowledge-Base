stage_1_windows: |
  ## P2 KB Setup - Windows
  
  **Step 1: Create cache**
  ```powershell
  New-Item -ItemType Directory -Force -Path .p2kb-cache
  ```
  
  **Step 2: Create script `.p2kb-cache\boot-kb-file.ps1`:**
  ```powershell
  param($path)
  $cache = ".p2kb-cache\$($path -replace '/','\\')"
  $url = "https://raw.githubusercontent.com/ironsheep/P2-Knowledge-Base/main/$path"
  if (Test-Path $cache) {
    Get-Content $cache -Raw
  } else {
    $dir = Split-Path $cache -Parent
    New-Item -ItemType Directory -Force -Path $dir | Out-Null
    Invoke-WebRequest -Uri $url -OutFile $cache
    Get-Content $cache -Raw
  }
  ```
  
  **Step 3: Fetch complete setup instructions**
  ```powershell
  powershell -File .p2kb-cache\boot-kb-file.ps1 "manifests/ai-instructions.yaml"
  ```
  Follow setup_instructions section COMPLETELY.
  
