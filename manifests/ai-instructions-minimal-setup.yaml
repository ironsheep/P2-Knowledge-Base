# P2 KB Minimal Setup - Stage 1
# This file is intentionally small to avoid summarization

setup_stage_1: |
  ## Claude Code Setup - Stage 1: Create Fetch Script
  
  **Step 1: Detect Platform**
  ```bash
  if command -v uname &> /dev/null; then
    echo "Unix system - creating bash script"
    platform="unix"
  elif command -v powershell &> /dev/null; then
    echo "Windows system - creating PowerShell script"
    platform="windows"
  fi
  ```
  
  **Step 2: Create Cache Directory**
  ```bash
  mkdir -p .p2kb-cache
  ```
  
  **Step 3: Create Fetch Script**
  
  For Unix/macOS/Linux - save as `.p2kb-cache/fetch-kb-file.sh`:
  ```bash
  #!/bin/bash
  path=$1
  cache=".p2kb-cache/${path}"
  url="https://raw.githubusercontent.com/ironsheep/P2-Knowledge-Base/main/${path}"
  if [ -f "$cache" ]; then
    cat "$cache"
  else
    mkdir -p "$(dirname "$cache")"
    curl -sS -o "$cache" "$url" 2>/dev/null || wget -q -O "$cache" "$url"
    cat "$cache"
  fi
  ```
  Then run: `chmod +x .p2kb-cache/fetch-kb-file.sh`
  
  For Windows - save as `.p2kb-cache\fetch-kb-file.ps1`:
  ```powershell
  param($path)
  $cache = ".p2kb-cache\$($path -replace '/','\\')"
  $url = "https://raw.githubusercontent.com/ironsheep/P2-Knowledge-Base/main/$path"
  if (Test-Path $cache) {
    Get-Content $cache -Raw
  } else {
    $dir = Split-Path $cache -Parent
    New-Item -ItemType Directory -Force -Path $dir | Out-Null
    Invoke-WebRequest -Uri $url -OutFile $cache
    Get-Content $cache -Raw
  }
  ```
  
  **Step 4: Continue to Stage 2**
  Now use YOUR script to fetch the complete instructions:
  
  Unix/macOS/Linux:
  ```bash
  bash .p2kb-cache/fetch-kb-file.sh "manifests/ai-instructions.yaml"
  ```
  
  Windows:
  ```powershell
  powershell -File .p2kb-cache\fetch-kb-file.ps1 "manifests/ai-instructions.yaml"
  ```
  
  Follow the setup_instructions in that file COMPLETELY.

