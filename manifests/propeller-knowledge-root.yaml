# Propeller Knowledge Base - Root Manifest v3.4
# Repository: https://github.com/ironsheep/P2-Knowledge-Base
# This is the entry point - fetch this first

version: "3.4"
last_updated: "2026-01-17"

# ============================================================================
# 🚨 MIGRATION REQUIRED - v3.3 and earlier users MUST upgrade
# ============================================================================
migration:
  required: true
  from_version: "3.3"
  to_version: "3.4"
  reason: |
    v3.4 adds array-based alias resolution. Aliases like "ABS" or "COGINIT" now
    return ALL matching entries (both PASM2 and Spin2 when applicable).
    This preserves full information instead of "first match wins".

  ai_action_required: |
    ⚠️ HASH MISMATCH - YOUR CACHE IS OUTDATED

    Execute these commands to upgrade:

    **Unix/macOS/Linux:**
    ```bash
    # Download and run refresh script (handles migration automatically)
    curl -sS https://raw.githubusercontent.com/ironsheep/P2-Knowledge-Base/main/engineering/tools/p2kb/refresh-kb.sh > .p2kb-cache/refresh-kb.sh
    chmod +x .p2kb-cache/refresh-kb.sh
    .p2kb-cache/refresh-kb.sh
    ```

    **Windows PowerShell:**
    ```powershell
    # Download and run refresh script (handles migration automatically)
    Invoke-WebRequest -Uri "https://raw.githubusercontent.com/ironsheep/P2-Knowledge-Base/main/engineering/tools/p2kb/refresh-kb.ps1" -OutFile ".p2kb-cache\refresh-kb.ps1"
    & ".p2kb-cache\refresh-kb.ps1"
    ```

    **Verify upgrade:**
    ```bash
    .p2kb-cache/fetch-kb-file.sh --help
    ```

    Then fetch ai-instructions.yaml and follow upgrade_instructions to update CLAUDE.md.

# ============================================================================
# v3.4 Key-Based Access System with Alias Resolution
# ============================================================================
index:
  location: "deliverables/ai/p2kb-index.json"
  compressed: "deliverables/ai/p2kb-index.json.gz"
  description: "Master index mapping keys to YAML file paths with categories and aliases"
  total_entries: 1000
  total_categories: 47
  total_aliases: 933
  multi_target_aliases: 54
  alias_format: "array-based (v3.4+)"

ai_instructions:
  location: "manifests/ai-instructions.yaml"
  version: "3.4"
  description: "Setup and usage instructions for v3.4 with alias resolution"

fetch_scripts:
  bash: "engineering/tools/p2kb/fetch-kb-file.sh"
  powershell: "engineering/tools/p2kb/fetch-kb-file.ps1"
  features:
    - "--help: Show usage and commands"
    - "--cached: List downloaded keys"
    - "--browse <category>: Browse keys by category"
    - "--search <term>: Search for keys and aliases"
    - "--categories: List all categories"
    - "<key>: Fetch content by canonical key"
    - "<alias>: Fetch content by alias (MOV, WAITMS, ABS) - returns ALL matches"

refresh_scripts:
  bash: "engineering/tools/p2kb/refresh-kb.sh"
  powershell: "engineering/tools/p2kb/refresh-kb.ps1"
  description: "Updates all scripts, index, and common files; handles v3.1 migration"

obex_scripts:
  bash: "engineering/tools/p2kb/obex/download-helper.sh"
  powershell: "engineering/tools/p2kb/obex/download-helper.ps1"

# Storage Locations (v3.2)
storage:
  scripts:
    unix: ".p2kb-cache/"
    windows: ".p2kb-cache\\"
    description: "User-visible script location"
  index_cache:
    unix: ".p2kb/"
    windows: ".p2kb\\"
    description: "Hidden index and cache location"

# Quick Start for v3.4
quickstart: |
  # 1. Download fetch script
  mkdir -p .p2kb-cache
  curl -sS https://raw.githubusercontent.com/ironsheep/P2-Knowledge-Base/main/engineering/tools/p2kb/fetch-kb-file.sh > .p2kb-cache/fetch-kb-file.sh
  chmod +x .p2kb-cache/fetch-kb-file.sh

  # 2. See available commands
  .p2kb-cache/fetch-kb-file.sh --help

  # 3. Find keys or aliases
  .p2kb-cache/fetch-kb-file.sh --search mov
  .p2kb-cache/fetch-kb-file.sh --browse pasm2_branch

  # 4. Fetch content by key OR alias (v3.4)
  .p2kb-cache/fetch-kb-file.sh MOV           # Alias resolves to p2kbPasm2Mov
  .p2kb-cache/fetch-kb-file.sh WAITMS        # Alias resolves to p2kbSpin2Waitms
  .p2kb-cache/fetch-kb-file.sh ABS           # Returns BOTH PASM2 AND Spin2 docs!
  .p2kb-cache/fetch-kb-file.sh p2kbArchCog   # Direct key also works

# Knowledge Base Status
knowledge_bases:
