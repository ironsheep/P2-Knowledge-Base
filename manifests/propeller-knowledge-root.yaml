# Propeller Knowledge Base - Root Manifest v3.0
# Repository: https://github.com/IronSheepProductionsLLC/P2-Knowledge-Base
# This is the entry point - fetch this first

version: "3.0"
last_updated: "2025-11-29"

# ============================================================================
# 🚨 MIGRATION REQUIRED - v2.x users MUST upgrade
# ============================================================================
migration:
  required: true
  from_version: "2.x"
  to_version: "3.0"
  reason: |
    v3.0 introduces key-based access that eliminates 404 errors and
    simplifies content retrieval. The old manifest navigation system
    is replaced by a single index with stable keys.

  human_action_required: |
    ⚠️ YOUR CACHED CONTENT IS OUTDATED AND MAY CONTAIN DEFECTS

    Please tell your human:
    1. Delete .p2kb-cache/ directory completely
    2. Re-bootstrap from CLAUDE-QUICKSTART.md
    3. The new system uses keys (p2kbPasm2Mov) instead of paths

    This is a one-time migration. The new system is simpler and more reliable.

# ============================================================================
# v3.0 Key-Based Access System
# ============================================================================
index:
  location: "deliverables/ai/p2kb-index.json"
  compressed: "deliverables/ai/p2kb-index.json.gz"
  description: "Master index mapping keys to YAML file paths"
  total_entries: 973

ai_instructions:
  location: "manifests/ai-instructions.yaml"
  version: "3.0"
  description: "Setup and usage instructions for v3.0 key-based access"

fetch_scripts:
  bash: "engineering/tools/p2kb/fetch-kb-file.sh"
  powershell: "engineering/tools/p2kb/fetch-kb-file.ps1"

# Quick Start for v3.0
quickstart: |
  # 1. Download fetch script
  curl -sS https://raw.githubusercontent.com/IronSheepProductionsLLC/P2-Knowledge-Base/main/engineering/tools/p2kb/fetch-kb-file.sh > ~/.p2kb-cache/fetch-kb-file.sh
  chmod +x ~/.p2kb-cache/fetch-kb-file.sh

  # 2. Fetch content by key
  ~/.p2kb-cache/fetch-kb-file.sh p2kbPasm2Mov
  ~/.p2kb-cache/fetch-kb-file.sh p2kbArchCog
  ~/.p2kb-cache/fetch-kb-file.sh p2kbGuideQuickQueries

# Knowledge Base Status
knowledge_bases:
  p2:
    status: "active"
    description: "Propeller 2 - 8 COGs, 64 Smart Pins, 512KB RAM"
    content_location: "deliverables/ai/P2/"
    index_prefix: "p2kb"

  p1:
    status: "planned"
    description: "Propeller 1 - 8 COGs, 32KB RAM, 32 I/O pins"

# Metadata
metadata:
  repository: "https://github.com/IronSheepProductionsLLC/P2-Knowledge-Base"
  raw_base_url: "https://raw.githubusercontent.com/IronSheepProductionsLLC/P2-Knowledge-Base/main/"
