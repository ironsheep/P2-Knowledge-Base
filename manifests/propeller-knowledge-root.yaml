# Propeller Knowledge Base - Root Manifest v3.0
# Repository: https://github.com/IronSheepProductionsLLC/P2-Knowledge-Base
# This is the entry point - fetch this first

version: "3.0"
last_updated: "2025-11-29"

# ============================================================================
# 🚨 MIGRATION REQUIRED - v2.x users MUST upgrade
# ============================================================================
migration:
  required: true
  from_version: "2.x"
  to_version: "3.0"
  reason: |
    v3.0 introduces key-based access that eliminates 404 errors and
    simplifies content retrieval. The old manifest navigation system
    is replaced by a single index with stable keys.

  ai_action_required: |
    ⚠️ HASH MISMATCH - YOUR CACHE IS OUTDATED

    Execute these commands to upgrade to v3.0:

    **Unix/macOS/Linux:**
    ```bash
    # Step 1: Clear cache contents (keep directory)
    rm -rf ~/.p2kb-cache/*

    # Step 2: Download new fetch script
    curl -sS https://raw.githubusercontent.com/IronSheepProductionsLLC/P2-Knowledge-Base/main/engineering/tools/p2kb/fetch-kb-file.sh > ~/.p2kb-cache/fetch-kb-file.sh
    chmod +x ~/.p2kb-cache/fetch-kb-file.sh
    ```

    **Windows PowerShell:**
    ```powershell
    # Step 1: Clear cache contents (keep directory)
    Remove-Item -Path "$env:USERPROFILE\.p2kb-cache\*" -Recurse -Force

    # Step 2: Download new fetch script
    Invoke-WebRequest -Uri "https://raw.githubusercontent.com/IronSheepProductionsLLC/P2-Knowledge-Base/main/engineering/tools/p2kb/fetch-kb-file.ps1" -OutFile "$env:USERPROFILE\.p2kb-cache\fetch-kb-file.ps1"
    ```

    **Both platforms - Step 3:**
    Fetch ai-instructions.yaml (the new script handles manifest paths directly):
    ```bash
    ~/.p2kb-cache/fetch-kb-file.sh manifests/ai-instructions.yaml
    ```
    Or on Windows:
    ```powershell
    & "$env:USERPROFILE\.p2kb-cache\fetch-kb-file.ps1" "manifests/ai-instructions.yaml"
    ```
    Then follow the upgrade_instructions section to update your CLAUDE.md.

