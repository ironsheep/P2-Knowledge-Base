    status: "active"
    description: "Propeller 2 - 8 COGs, 64 Smart Pins, 512KB RAM"
    content_location: "deliverables/ai/P2/"
    index_prefix: "p2kb"
    categories: 45

  p1:
    status: "planned"
    description: "Propeller 1 - 8 COGs, 32KB RAM, 32 I/O pins"

