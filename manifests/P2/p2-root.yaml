path_construction:
  instructions: |
    HOW TO CONSTRUCT FULL URLs FROM MANIFESTS (4-KEY STANDARD):
    
    FOR MANIFEST REFERENCES:
    full_url = raw_base_url + manifest_base + manifest
    
    FOR CONTENT REFERENCES:
    full_url = raw_base_url + content_base + content
    
    EXAMPLE (content reference):
    - raw_base_url: "https://raw.githubusercontent.com/ironsheep/P2-Knowledge-Base/main/"
    - content_base: "/engineering/knowledge-base/P2/language/spin2" (from spin2-manifest.yaml)
    - content: "methods/cogspin.yaml" (from the specific entry)
    - RESULT: https://raw.githubusercontent.com/ironsheep/P2-Knowledge-Base/main/engineering/knowledge-base/P2/language/spin2/methods/cogspin.yaml
    
    EXAMPLE (manifest reference):
    - raw_base_url: "https://raw.githubusercontent.com/ironsheep/P2-Knowledge-Base/main/"
    - manifest_base: "/manifests/P2" (from p2-root.yaml)
    - manifest: "language/pasm2-manifest.yaml" (from registry entry)
    - RESULT: https://raw.githubusercontent.com/ironsheep/P2-Knowledge-Base/main/manifests/P2/language/pasm2-manifest.yaml
    
    IMPORTANT: Only use manifest_base+manifest OR content_base+content (never mix them)!
  
purpose: |
  Comprehensive P2 documentation organized for AI code generation.
  Enables both beginners and experienced developers to leverage
  the P2's unique architecture effectively.

