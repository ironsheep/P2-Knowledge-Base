    - "engineering/ingestion/new-external-sources/vscode-documentation-style-complete.md"
    - "engineering/ingestion/new-external-sources/johnny-mac-documentation-style-complete.md"
    - "engineering/ingestion/new-external-sources/p2-source-file-organization-standard.md"