  debug_formatters:
    description: |
      Debug output formatters for the DEBUG() statement.

      THE CRITICAL CONCEPT - Underscore Protocol:
      - SDEC(temp) outputs: "temp = -25" (includes variable name)
      - SDEC_(temp) outputs: "-25" (just the value)

      This underscore rule applies to ALL formatters (UDEC/SDEC/UHEX/SHEX/UBIN/SBIN/FDEC).
      Use underscore when building custom formatted output like:
      DEBUG("Temperature: ", SDEC_(temp), "°C")

    entry_point:
      - {name: "formatters_overview", content: "debug-commands/debug-formatters-overview.yaml", desc: "START HERE - Answers 'Why does SDEC_() exist?' and common new user questions"}

    grouped_references:
      - {name: "complete_reference", content: "debug-commands/debug-formatters-complete.yaml", desc: "All formatters in single comprehensive file"}
      - {name: "decimal_formatters", content: "debug-commands/debug-formatters-decimal.yaml", desc: "UDEC/SDEC and all size variants with underscore"}
      - {name: "hexadecimal_formatters", content: "debug-commands/debug-formatters-hexadecimal.yaml", desc: "UHEX/SHEX and all size variants with underscore"}
      - {name: "binary_formatters", content: "debug-commands/debug-formatters-binary.yaml", desc: "UBIN/SBIN and all size variants with underscore"}
      - {name: "array_formatters", content: "debug-commands/debug-formatters-arrays.yaml", desc: "All array formatters for registers and hub memory"}

    individual_files_note: |
      Individual formatter files also exist for backwards compatibility:
      - Basic formatters: sdec.yaml, udec.yaml, uhex.yaml, ubin.yaml, etc.
      - Underscore variants: sdec_.yaml, udec_.yaml, uhex_.yaml, ubin_.yaml, etc.
      - Size variants: sdec_byte.yaml, udec_word.yaml, uhex_long.yaml, etc.
      However, the grouped files above are recommended for AI consumption.

