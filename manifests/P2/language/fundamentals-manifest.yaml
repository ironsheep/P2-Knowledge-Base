# Fundamentals Manifest
# Using 4-key path standard

manifest_base: "/manifests/P2/language"
content_base: "/engineering/knowledge-base/P2"

# Language Fundamentals Manifest
# Core language rules that apply across Spin2 and PASM2
# Critical for AI code generation accuracy

manifest:
  name: "P2 Language Fundamentals"
  version: "1.0.0"
  created: "2025-09-23"
  purpose: "Core language rules and best practices for both Spin2 and PASM2"
  
metadata:
  importance: "CRITICAL"
  ai_relevance: "Essential for preventing common code generation errors"
  applies_to: ["spin2", "pasm2"]

fundamentals:
  case_sensitivity:
    content: "language/fundamentals/case-sensitivity.yaml"
    description: "Both languages are case-insensitive"
    critical_for:
      - "Identifier resolution"
      - "Avoiding duplicate definitions"
      - "Cross-language compatibility"
    
  identifier_rules:
    content: "language/fundamentals/identifier-rules.yaml"
    description: "Naming rules for all identifiers"
    critical_for:
      - "Valid code generation"
      - "32-character limit compliance"
      - "Character restrictions"
    
  variable_scoping:
    content: "language/fundamentals/variable-scoping-best-practices.yaml"
    description: "Scoping rules and conflict prevention"
    applies_to: ["spin2"]  # Primarily Spin2
    critical_for:
      - "Preventing variable shadowing bugs"
      - "Avoiding naming conflicts"
      - "Understanding scope hierarchy"
  
  pasm_labels:
    content: "language/fundamentals/pasm-labels.yaml"
    description: "PASM2 label syntax and scoping rules"
    applies_to: ["pasm2"]
    critical_for:
      - "Understanding local vs global labels"
      - "Using dot and colon prefixes correctly"
      - "Label scope management"

  # System Registers - Programming Interface
  system_registers:
    description: "Special-purpose registers accessible from both PASM2 and Spin2"
    applies_to: ["pasm2", "spin2"]
    note: "These describe HOW to use registers in code, not the hardware architecture"

    dira_dirb:
      content: "architecture/system-registers/dira-dirb-registers.yaml"
      description: "Pin direction control registers (DIRA/DIRB)"
      critical_for:
        - "Setting pin input/output modes"
        - "Understanding bit-to-pin mapping"
        - "Smart pin interaction"

    ptra_ptrb:
      content: "architecture/system-registers/ptra-register.yaml"
      description: "General-purpose pointer registers"
      critical_for:
        - "Stack operations"
        - "Indirect addressing"
        - "Parameter passing"

    register_index:
      content: "architecture/system-registers/complete-system-registers-index.yaml"
      description: "Complete index of all special registers"
      critical_for:
        - "Understanding COG memory map"
        - "Register addresses and functions"
        - "INA/INB, OUTA/OUTB, and other special registers"

cross_references:
  spin2_constructs:
    - "../spin2/constructs/method_definition.yaml"
    - "../spin2/keywords/VAR.yaml"
    - "../spin2/keywords/DAT.yaml"
    - "../spin2/keywords/CON.yaml"
    
  documentation:
    - "Sources: Spin2 v51 manual, PASM2 manual, compiler behavior"
    - "Validation: Tested against PNut compiler"

usage_notes:
  for_ai_systems: |
    These fundamentals are MANDATORY knowledge for code generation:
    1. NEVER assume case sensitivity
    2. ALWAYS avoid variable name conflicts across scopes  
    3. ALWAYS respect the 32-character identifier limit
    4. NEVER use the same name for local and VAR/DAT variables
    
  for_developers: |
    Understanding these fundamentals prevents common bugs:
    - Variable shadowing issues
    - Case-based naming conflicts
    - Identifier length violations
    - Scope confusion errors